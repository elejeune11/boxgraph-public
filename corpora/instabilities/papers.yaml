- id: fierling_code
  kind: software
  file: corpus/instabilities/code/fierling_code
  papers: [fierling2022]
  url: https://zenodo.org/records/6506336
  note: 'The released data and code of fierling2022 (Zenodo 6506336, CC-BY 4.0). README.md maps each figure
    panel to its file. Surface_Evolver_script.txt is the shell model of the embryo surface (Surface Evolver is
    not installed and a run takes weeks: do not run it; read its parameters and compare with the paper). The
    .dmp files are saved Surface Evolver states; the .gdat/.dat/.tsv files are the plotted data (simulated
    and measured: strain and stress profiles, cell areas by stripe, furrow propagation, curvature, depth,
    laser-ablation recoil) and the .plot files the gnuplot scripts that drew the figures. Prefer these
    numbers to figure readings, and check the figures against them. Data_sources/ is empty in the release.'
