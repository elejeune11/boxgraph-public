notes: >
  A five-page letter; the Supplemental Material (derivations, numerics, E. coli parameters) is not part of
  this source. Its quantitative core is the elastica treatment of a pressurized tube bent with an
  inextensible cross section: the energy functional Eq. 2 over phi(mu) = sum a_n sin(n mu) (Eq. 5), the
  one-mode ansatz phi = a2 sin(2 mu) giving a2 (Eq. 7), the torque-curvature relation Eq. 8 and the Brazier
  curvature Eq. 9, and the wrinkling onset Eq. 11 (from the axisymmetric buckling stress Eq. 10). Models:
  Eq. 8 in both normalizations, Eq. 9 (shell), Eq. 11 (balloon, and in shell variables), the cross-section
  shape at the torque maximum (from Eqs. 7, 9 and the ansatz, first-order Taylor or exact), the numerical
  minimum of Eq. 2 (the paper's own stated method; N, grid and optimizer unstated, q_numerics_settings), and
  the numerical wrinkling onset (reconstructed: the criterion of p. 3 applied to the numerical minimum, since
  the paper's procedure is in the SM).
  Results. kappa-bar_w = 1.320 reproduced; kappa-bar_B ≈ 1.633, the 22% flattening (22.2% at first order),
  kappa_w R ≈ 0.2 at p-hat = 0.4 (0.215) agree but get no verdict (printed approximately). The 40% reduction
  of the second moment is not met: 30% (first order) or 34% (exact shape); 1 - (7/9)^2 = 39.5% would give it
  (q_second_moment). The 0.6% unpressurized wrinkling curvature is close, not reproduced: 0.66% with the
  caption's alpha ≈ 0.005, 0.6% needs alpha ≈ 0.0045 (q_unpressurized_alpha).
  Fig. 2 was read in full by code (figures.md): 20 curves, 10 dots, 10 crosses. Every dashed curve is
  reproduced by Eq. 8 with alpha = 0.005, every solid curve by the record's own numerical minimization of
  Eq. 2, and the panel (a) crosses by Eq. 11 and dots by the numerical criterion. In panel (b) the crosses and
  dots sit about 0.001 left of Eq. 11 at every pressure (close): they fit alpha ≈ 0.0045, the same value the
  0.6% implies (q_fig2b_alpha). Eq. 8 against the numerics (approximation) holds in the balloon panel and up
  to the torque maximum in the shell panel, departing beyond it, as the paper's figure shows. The figure
  legend's "Equation (9)" and "Equation (12)" stand for Eqs. 8 and 11 (q_legend_equation_numbers).
  Left out: the order-of-magnitude statements p-bar = O(10^4) and p-hat of order unity for E. coli, the
  0.2 strain limit of the incremental formulation, the balloon limit kappa-hat_w = p-hat/2 + O(p-hat^2)
  (an asymptotic statement; the full Eq. 11 is entered), Eq. 6 (zero-pressure recursion, whose a2 is Eq. 7
  at p = 0), a2 = -1/3 (a fraction; it enters through the cross-section model, q_a2_one_third), the range
  0.001 < alpha < 0.01 (recorded, feeds no run), and Fig. 1 (photographs).
