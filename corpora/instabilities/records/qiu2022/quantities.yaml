- {id: alpha_geometry_material, name: geometry-material parameter alpha, dimension: dimensionless, description: "alpha = sqrt(D_theta/(S_z R^2)) = sqrt(E_theta/12E_z) (t/R), wall bending stiffness against axial stretching stiffness"}
- {id: pressure_shell, name: shell-normalized pressure p-bar, dimension: dimensionless, description: "p-bar = p R^3 / D_theta (Eq. 3)"}
- {id: pressure_balloon, name: balloon-normalized pressure p-hat, dimension: dimensionless, description: "p-hat = p R / S_z (Eq. 4)"}
- {id: curvature_shell, name: shell-normalized longitudinal curvature kappa-bar, dimension: dimensionless, description: "kappa-bar = kappa R / alpha (Eq. 3), curvature of the bent tube's axis"}
- {id: curvature_balloon, name: balloon-normalized longitudinal curvature kappa-hat, dimension: dimensionless, description: "kappa-hat = kappa R (Eq. 4), curvature of the bent tube's axis times the radius"}
- {id: torque_shell, name: shell-normalized bending torque M-bar, dimension: dimensionless, description: "M-bar = M / (alpha S_z R^2) (Eq. 3)"}
- {id: torque_balloon, name: balloon-normalized bending torque M-hat, dimension: dimensionless, description: "M-hat = M / (S_z R^2) (Eq. 4)"}
- {id: brazier_curvature_shell, name: Brazier critical curvature (shell normalization), dimension: dimensionless, description: "kappa-bar at the maximum of the torque, kappa-bar_B"}
- {id: brazier_curvature_balloon, name: Brazier critical curvature (balloon normalization), dimension: dimensionless, description: "kappa-hat at the maximum of the torque, kappa-hat_B"}
- {id: wrinkling_curvature_shell, name: wrinkling onset curvature (shell normalization), dimension: dimensionless, description: "kappa-bar_w, the overall curvature at which axial compression reaches the axisymmetric buckling stress"}
- {id: wrinkling_curvature_balloon, name: wrinkling onset curvature (balloon normalization), dimension: dimensionless, description: "kappa-hat_w = kappa_w R at the onset of wrinkling"}
- {id: flattening_fraction, name: cross-section flattening in y, dimension: dimensionless, description: "fractional reduction of the cross section's height (extent in y) from the circle's diameter 2R"}
- {id: second_moment_reduction, name: reduction of the cross section's second moment, dimension: dimensionless, description: "fractional reduction of the second moment of the wall about the bending axis (through the centroid) from that of the circle"}
