id: energy_numerics_shell
name: torque from the numerical minimum of Eq. 2, shell normalization
stated: {page: 2, quote: "is discretized using a Fourier series representation", where: "Eqs. 2, 3, 5"}
equation: "as energy_numerics_balloon, with kappa-hat = alpha kappa-bar, p-hat = alpha^2 p-bar, M-bar = M-hat/alpha"
inputs:
  kbar: {quantity: curvature_shell, unit: dimensionless}
  pbar: {quantity: pressure_shell, unit: dimensionless}
  alpha: {quantity: alpha_geometry_material, unit: dimensionless}
outputs:
  Mbar: {quantity: torque_shell, unit: dimensionless}
settings: {n_modes: 12, n_grid: 256}
built_from: [energy_numerics_balloon]
stochastic: false
