id: cross_section_brazier
name: shape of the cross section at the Brazier torque maximum (Eqs. 7 and 9 with phi = a2 sin 2mu)
stated: {page: 3, quote: "the tube cross section is squeezed in the y direction by about 22%", where: text}
equation: "phi(mu) = a2 sin(2 mu), a2 = -kappa-bar^2 / 8(1 + p-bar/3) at kappa-bar_B = sqrt(8/3 + 8/9 p-bar); x = R int cos(mu + phi), y = R int sin(mu + phi)"
inputs:
  pbar: {quantity: pressure_shell, unit: dimensionless}
outputs:
  flattening: {quantity: flattening_fraction, unit: dimensionless}
  moment_reduction: {quantity: second_moment_reduction, unit: dimensionless}
settings: {expansion: first_order, n_grid: 4096}
built_from: [brazier_shell_eq9]
from_words: true
stochastic: false
