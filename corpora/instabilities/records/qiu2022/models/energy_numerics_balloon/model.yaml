id: energy_numerics_balloon
name: torque from the numerical minimum of the energy functional Eq. 2 over the Fourier series Eq. 5, balloon normalization
stated: {page: 2, quote: "is discretized using a Fourier series representation", where: "Eqs. 2, 5"}
equation: "Delta Phi of Eq. 2 minimized over phi(mu) = sum_n a_n sin(n mu) and Delta eps_0 subject to 0 = int cos[mu + phi] dmu; M = d Delta Phi / d kappa"
inputs:
  khat: {quantity: curvature_balloon, unit: dimensionless}
  phat: {quantity: pressure_balloon, unit: dimensionless}
  alpha: {quantity: alpha_geometry_material, unit: dimensionless}
outputs:
  Mhat: {quantity: torque_balloon, unit: dimensionless}
settings: {n_modes: 12, n_grid: 256}
stochastic: false
