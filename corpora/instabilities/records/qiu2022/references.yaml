- {id: ref-23, label: "23", text: "An example of the usage of this assumption in a classic problem is Euler's work on the buckling of a column under axial compression [24], where it leads to accurate results both for buckling and for the postbuckling behavior [25]. Carrier used this assumption to produce analytical solutions for the buckling of an elastic circumferential ring, accurate both for the initial buckling and in the advanced postbuckling range [26]. Brazier also assumed an inextensible cross section for calculating the deformation of an unpressurized, bent tube. The obtained M-kappa (torque-curvature) curves have been tested and verified in experiments [27]."}
