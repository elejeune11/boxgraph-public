# Printed scalar results
- id: run_kbar_w_p0
  model: wrinkling_eq11_shell
  inputs: {pbar: pbar_zero_p3, alpha: alpha_fig2}
  outputs: {kbar_w: kbar_w_p0_pred}
  note: "at p-bar = 0 the root does not depend on alpha"
- id: run_kbar_B_p0
  model: brazier_shell_eq9
  inputs: {pbar: pbar_zero_p3}
  outputs: {kbarB: kbar_B_p0_pred}
- id: run_shape_first_order
  model: cross_section_brazier
  inputs: {pbar: pbar_zero_p3}
  settings: {expansion: first_order}
  outputs: {flattening: flattening_pred_first, moment_reduction: moment_reduction_pred_first}
  note: "the result does not depend on p-bar (a2 = -1/3 at every pressure)"
- id: run_shape_exact
  model: cross_section_brazier
  inputs: {pbar: pbar_zero_p3}
  settings: {expansion: exact}
  outputs: {flattening: flattening_pred_exact, moment_reduction: moment_reduction_pred_exact}
- id: run_khat_w_p0_4
  model: wrinkling_eq11
  inputs: {phat: phat_0_4_p3, alpha: alpha_fig2}
  outputs: {khat_w: khat_w_p0_4_pred}
- id: run_khat_w_unpressurized
  model: wrinkling_eq11
  inputs: {phat: phat_absent_p4, alpha: alpha_fig2}
  outputs: {khat_w: khat_w_unpressurized_pred}
  note: "the paper does not say which alpha it used for this sentence; alpha ≈ 0.005 of the Fig. 2 caption"
# Balloon limit of Eq. 11 (p. 3), added in the audit
- id: run_wlimit_p0_4
  model: wrinkling_balloon_limit
  inputs: {phat: phat_0_4_p3}
  outputs: {khat_w: wlimit_p0_4_pred}
- id: run_wleading_p0_4
  model: wrinkling_balloon_leading
  inputs: {phat: phat_0_4_p3}
  outputs: {khat_w: wleading_p0_4_pred}
- id: run_wlimit_fig2b_crosses
  model: wrinkling_balloon_limit
  inputs: {}
  sweep: {phat: fig2b_crosses}
  outputs: {khat_w: wlimit_fig2b_crosses_pred}
- id: run_wleading_fig2b_crosses
  model: wrinkling_balloon_leading
  inputs: {}
  sweep: {phat: fig2b_crosses}
  outputs: {khat_w: wleading_fig2b_crosses_pred}
