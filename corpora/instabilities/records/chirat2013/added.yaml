- id: b1_fig4
  quantity: stiffness_variation_amount
  unit: dimensionless
  printed: "0.5"
  basis: >-
    Fig. 4 does not state b1. The b1 arrow runs from Eb = 1.0 down to the curve's minimum, which lies on the
    0.5 tick; Eq. 1 gives Eb(0.5) = 1 - b1. Read from the figure, so the comparison tests the shape, not b1.
  alternatives: ["0.48", "0.52"]
  stands_for: b1 in Eq. 1 for Fig. 4
- id: b2_fig4
  quantity: stiffness_variation_width
  unit: dimensionless
  printed: "0.0707"
  basis: >-
    Fig. 4 does not state b2. 0.0707 is the value for which Eq. 1 as printed passes through the drawn curve;
    it equals 0.1/sqrt(2), so the drawn curve is equally the Gaussian exp(-(s0 - 0.5)^2/(2 x 0.1^2)) with
    standard deviation 0.1. Chosen from the figure: the comparison tests that the drawn profile has the
    Gaussian form of Eq. 1, not the value of b2.
  alternatives: ["0.1", "0.118"]
  stands_for: b2 in Eq. 1 for Fig. 4
