id: kf_scaling
name: dimensionless foundation stiffness of the nondimensionalized Eq. 4
role: model
stated: {page: 5, quote: "characterizes the relative effects of bend", where: "text after Eq. 4"}
equation: "kf = Kf L0^4 / EI"
inputs:
  Kf: {quantity: adhesion_stiffness, unit: MPa}
  L0: {quantity: mantle_length_scale, unit: cm}
  E: {quantity: mantle_youngs_modulus, unit: MPa}
  I: {quantity: second_moment_of_area, unit: mm^4}
outputs:
  kf: {quantity: foundation_stiffness_dimensionless, unit: dimensionless}
settings: {}
stochastic: false
