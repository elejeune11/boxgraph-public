id: spine_growth_simulation
name: growth of the mantle edge with foundation update (Eqs. 4-6), solved by shooting with Euler time steps
role: model
stated: {page: 5, quote: "equations of mechanical equilibrium (Eq. 4) are solved using", where: "Appendix, Eqs. 4-6"}
equation: "Eq. 4 with theta' = gamma Eb^-1 m, gamma_dot = g, p_dot = eta (r - p), Eb = 1 - b1 exp(-((s0 - 0.5)/(2 b2))^2), b2 = b20/gamma"
inputs:
  g: {quantity: growth_rate, unit: dimensionless}
  eta: {quantity: foundation_relaxation_rate, unit: dimensionless}
  kf: {quantity: foundation_stiffness_dimensionless, unit: dimensionless}
outputs: {}
settings: {}
stochastic: false
runnable: false
not_runnable_reason: >-
  The simulations of Figs. 3, 5 and 6 give only drawn shapes, with no printed number to compare, and their
  end times, time step (variable, set by shooting convergence), b1 and b20 values for Fig. 5, and the
  attachment map of the foundation update are not stated, so a rerun could not be matched to a printed result.
