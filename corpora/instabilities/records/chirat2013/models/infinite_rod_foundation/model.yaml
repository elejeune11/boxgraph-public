id: infinite_rod_foundation
name: buckling threshold and wavelength of an unbounded rod on the adhesion foundation
role: model
stated: {none: "not in the paper: the classical unbounded-rod limit of the linearized Eq. 4, added by the reader"}
equation: "y'''' + P y'' + kf y = 0 with y ~ sin(q s0): P(q) = q^2 + kf/q^2, minimized at q = kf^(1/4): P = 2 sqrt(kf), lambda/L0 = 2 pi kf^(-1/4)"
inputs:
  kf: {quantity: foundation_stiffness_dimensionless, unit: dimensionless}
outputs:
  P: {quantity: critical_load_dimensionless, unit: dimensionless}
  lam: {quantity: buckling_wavelength_dimensionless, unit: dimensionless}
settings: {}
stochastic: false
reconstructed: >-
  The paper gives no unbounded-domain analysis; this is the textbook limit of its linearized Eq. 4 without
  the clamped ends, added so the rod model can be related to the plate-on-foundation wavelength laws of
  other records (lambda = 2 pi (B/K)^(1/4), B -> EI, K -> Kf).
