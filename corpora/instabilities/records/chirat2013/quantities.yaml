- {id: mantle_youngs_modulus, name: Young's modulus of the mantle edge, dimension: "[mass]/[length]/[time]**2", description: "E in M = EI d(theta)/dS"}
- {id: mantle_edge_width, name: width of the deforming mantle edge, dimension: "[length]", description: "w in I = wh^3/12 (SI Eq. 1)"}
- {id: mantle_edge_thickness, name: thickness of the deforming mantle edge, dimension: "[length]", description: "h in I = wh^3/12 (SI Eq. 1)"}
- {id: second_moment_of_area, name: second moment of area of the mantle edge cross-section, dimension: "[length]**4"}
- {id: mantle_length_scale, name: pregrowth length of the mantle edge section, dimension: "[length]", description: "L0, the shell edge length between two spines before spine formation; the length scale of the nondimensionalization"}
- {id: adhesion_stiffness, name: adhesion (foundation) stiffness between mantle and shell edge, dimension: "[mass]/[length]/[time]**2", description: "Kf, force per unit length per unit displacement of the linear springs of Eq. 2; units of pressure"}
- {id: foundation_stiffness_dimensionless, name: dimensionless foundation stiffness, dimension: dimensionless, description: "kf = Kf L0^4/EI, relative effect of foundation attachment to bending"}
- {id: buckling_mode_number, name: mode number of the initial buckling of the clamped rod, dimension: dimensionless, description: "index of the eigenmode that buckles first from a flat edge; mode n has n - 1 interior zeros of the deflection (mode 3 = one central bulge, i.e. one spine)"}
- {id: critical_load_dimensionless, name: dimensionless axial compressive force at buckling, dimension: dimensionless, description: "P L0^2/EI at the onset of buckling from the flat state"}
- {id: buckling_wavelength_dimensionless, name: buckling wavelength scaled by L0, dimension: dimensionless, description: "lambda/L0 of the sinusoidal mode of an unbounded rod on the foundation"}
- {id: growth_rate, name: marginal growth rate, dimension: dimensionless, description: "g = d(gamma)/dt, the rate of increase of the growth stretch gamma = dS/dS0 per unit growth time; the paper gives growth time no physical unit"}
- {id: foundation_relaxation_rate, name: rate at which the foundation relaxes to the mantle shape, dimension: dimensionless, description: "eta in dp/dt = eta (r - p), Eq. 5, per unit growth time"}
- {id: material_coordinate_scaled, name: scaled reference material coordinate along the mantle edge, dimension: dimensionless, description: "s0 in [0, 1], the pregrown arc length over L0 (Eq. 1, Fig. 4)"}
- {id: bending_stiffness_scaled, name: bending stiffness relative to its baseline, dimension: dimensionless, description: "Eb(s0) of Eq. 1, equal to 1 away from the spine"}
- {id: stiffness_variation_amount, name: depth of the stiffness decrease, dimension: dimensionless, description: "b1 in Eq. 1, b1 in [0, 1); the vertical axis of Fig. 5"}
- {id: stiffness_variation_width, name: width parameter of the stiffness decrease, dimension: dimensionless, description: "b2 in Eq. 1, in units of the scaled material coordinate"}
- {id: mantle_edge_position_scaled, name: horizontal position of the mantle edge centreline over L0, dimension: dimensionless, description: "x of the deformed mantle edge (Fig. 4 right, Fig. 3)"}
- {id: mantle_edge_height_scaled, name: height of the mantle edge centreline above the shell edge over L0, dimension: dimensionless, description: "y of the deformed mantle edge (Fig. 4 right, Fig. 3)"}
