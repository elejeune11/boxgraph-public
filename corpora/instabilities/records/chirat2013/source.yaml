notes: >
  The paper's quantitative core is small. The mantle edge is a growing, inextensible planar elastic rod
  (bending stiffness EI) adhered to the rigid shell edge by linear springs of stiffness Kf (units of
  pressure); Eqs. 2-4 (p. 5) give equilibrium, nondimensionalized with L0 so that the only elastic group is
  kf = Kf L0^4/EI. Growth enters as the stretch gamma = dS/dS0 (current over pregrown arc length); with the
  rod clamped between fixed points a distance L0 apart, a mantle of length gamma L0 laid on shell edge of
  length L0 carries an equivalent compressive strain of (gamma - 1)/gamma (equivalently an excess length
  gamma - 1), which is the quantity to map onto the applied/growth strains of tallinen2015, huang2005 and the
  film/substrate papers. Uniform growth is d(gamma)/dt = g with growth time t given no physical unit
  (SI p. 7 says so explicitly). The printed numbers are all in the SI (p. 7): E = 0.8 MPa (squid mantle),
  w = h = 0.7 mm (Nautilus), L0 = 1 cm, Kf = 0.008 MPa, eta = 50, and the statement that this Kf gives an
  initial buckling from a flat edge at mode 3; the main text (p. 2) repeats that the adhesion was chosen to
  give a mode 3 instability (a single spine). Recorded models: I = wh^3/12 (SI Eq. 1), kf = Kf L0^4/EI (p. 5),
  and the linear buckling analysis of the clamped rod on its foundation, which the paper uses (p. 5, citing
  ref. 33) but does not print; it is the reader's linearization of Eq. 4 about the flat state
  (y'''' + P y'' + kf y = 0, clamped, solved by finite differences) and is marked reconstructed. With the
  printed inputs kf is about 5000 and the reconstructed analysis is compared with the printed mode 3.
  A second reconstructed model gives the classical infinite rod-on-Winkler-foundation threshold and
  wavelength (P = 2 sqrt(kf), lambda/L0 = 2 pi kf^-1/4), the bridge to the plate-on-foundation wavelength
  laws of huang2005 and cerda2003 (lambda = 2 pi (B/K)^1/4 with B -> EI and K -> Kf). Left out: the growth
  simulations of Figs. 3, 5 and 6 (a shooting solution of Eq. 4 with Euler time stepping of Eq. 5); they are
  recorded as a non-runnable model with their printed settings (g = 1, 4, 8; eta = 50) because the end time,
  time step, b1 and b2 values, and the attachment-map details are not stated and the results are only drawn
  shapes. The stiffness profile of Eq. 1 / Eq. 6 has no printed b1 or b2 values and feeds no printed number;
  it is described in questions only. Fig. 4 is a schematic of that profile and the figures were not
  digitized in the first pass; a later figure pass read both Fig. 4 panels with calibrated code readings,
  compared the left one with Eq. 1 (model stiffness_profile_eq1), and recorded the Fig. 5 tick values for b1
  and g (see figures.md). Counts of spiny genera and families on p. 1 feed no model and are left out.
