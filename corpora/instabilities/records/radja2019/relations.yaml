# Against tallinen2015: no relation is entered, stated or proposed.
# radja2019 does not cite tallinen2015 (no reference to Tallinen, Biggins or Mahadevan; its only mechanical citation is
# Lavrentovich et al. 2016), and tallinen2015 predates it. Neither record takes a value from the other (no datum has a
# from_source pointing to the other paper), so no cited.yaml line is added.
# Nothing is proposed, because the models share no quantity a mapping could carry:
# - radja2019's wavelength is an input, not a result. mode_number_wavelength (l0 = 2 pi R/lambda) converts a measured
#   pattern wavelength and grain radius into a mode number. free_energy_eq6 takes l0 as given. The paper says only that
#   K and tau "depend on ... bending rigidity, surface tension, elasticity" and that "membrane buckling" may enter them
#   (p. 18). It gives no formula setting l0 or lambda from a thickness or a stiffness ratio, and it defers the
#   order-of-magnitude estimates to Lavrentovich et al. 2016.
# - tallinen2015's wavelengths (first_unstable_mode, stiff_wavelength_asymptote, mode_wavelength_h, ...) are l/a or
#   l/h of a growing layer as functions of the shear-modulus ratio eta. No radja2019 model has a modulus ratio, a layer
#   thickness or a growth ratio as an input or output.
# Any link would rest on an elastic origin of l0 that the paper does not state, so none is forced (corpus brief).
#
# Against huang2005: no relation is entered, stated or proposed, for the same reasons.
# radja2019 does not cite huang2005 (no reference to Huang, Hong or Suo; its references list has no film/substrate
# wrinkling paper) and huang2005 predates it. No datum in either record has a from_source pointing to the other, so
# no cited.yaml line is added.
# huang2005's wavelength laws (thick_substrate_eq17, thin_compressible_eq18, thin_incompressible_eq19,
# sinusoidal_finite_substrate, ...) give lambda/h of a stiff film on a compliant substrate from the plane-strain
# modulus ratio Ebar/Esbar and H/h. radja2019 has no film thickness, modulus ratio or substrate thickness as an
# input: its only runnable wavelength model, mode_number_wavelength, takes the measured lambda and the grain radius
# R as inputs and returns l0, and free_energy_eq6 takes l0 as given (not runnable). The paper says only that K and
# tau "depend on ... elasticity" and that "the mechanical details of the wall" may enter "the membrane buckling"
# (p. 18), with no formula. A mapping lambda = lambda_eq(Ebar/Esbar) h would be the reader's invention of an
# elastic origin for l0, not a relation either paper makes or that a printed quantity supports.
#
# Against cerda2003: no relation is entered, stated or proposed, for the same reasons.
# radja2019 does not cite cerda2003. Its only work with Cerda as an author is Katifori, Alben, Cerda, Nelson & Dumais
# (2010), "Foldable structures" (p. 14), cited for pollen apertures as thin regions of the exine (p. 2); that is a
# different paper and not in this record pair. No datum in either record has a from_source pointing to the other,
# so no cited.yaml line is added.
# cerda2003's wavelength laws (wrinkle_eq5, stretched_sheet, wrinkle_eq6_scaling, deep_substrate_wavelength,
# shallow_substrate_wavelength) set lambda from a bending stiffness and a tension or foundation stiffness (B/T, B/K,
# t, E/Es, Hs). radja2019 has none of these as inputs: mode_number_wavelength takes the measured lambda and grain
# radius R and returns l0 = 2 pi R/lambda, and free_energy_eq6 takes l0 as given (not runnable). The paper gives no
# formula for l0 from a stiffness or a thickness (p. 18 only says K and tau depend on "bending rigidity, surface
# tension, elasticity"), so mapping lambda = 2 sqrt(pi) (B/T)^(1/4) L^(1/2) onto l0 would be the reader's invention.
