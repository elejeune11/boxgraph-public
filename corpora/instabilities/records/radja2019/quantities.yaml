- {id: neg_log_likelihood, name: negative log-likelihood of a trait-evolution model, dimension: dimensionless, description: "-ln L of a multistate Markov model of pollen pattern states on the spermatophyte family tree (Table 2)"}
- {id: number_of_rates, name: number of free transition rates of a trait-evolution model, dimension: dimensionless}
- {id: likelihood_ratio_statistic, name: likelihood-ratio test statistic between two nested trait-evolution models, dimension: dimensionless}
- {id: degrees_of_freedom, name: degrees of freedom of a likelihood-ratio test, dimension: dimensionless}
- {id: p_value, name: p value of a likelihood-ratio test, dimension: dimensionless}
- {id: transition_rate, name: transition rate between pollen pattern states on the tree, dimension: dimensionless, description: "BayesTraits rate; the paper prints no unit, so it is kept as a pure number"}
- {id: rate_ratio, name: ratio of two transition rates, dimension: dimensionless}
- {id: wavelength_percent_difference, name: percent difference between SEM and simulated pattern wavelength at the equator, dimension: dimensionless}
- {id: mode_number, name: characteristic mode number l0 (times a pattern unit wraps around the circumference), dimension: dimensionless}
- {id: pattern_wavelength, name: pattern wavelength on the pollen surface, dimension: "[length]"}
- {id: wavenumber_dimensionless, name: characteristic wavenumber q0 = 2 pi / lambda in simulation units, dimension: dimensionless}
- {id: grain_radius, name: pollen grain (sphere) radius, dimension: "[length]"}
- {id: family_count, name: number of plant families, dimension: dimensionless}
- {id: landau_u, name: "dimensionless cubic-term parameter u = u3 R / sqrt(K u4) of the equilibrium free energy (Eq. 6)", dimension: dimensionless}
- {id: tree_angle, name: angular position of a terminal taxon on the circular family tree of Fig. 5, dimension: dimensionless, description: "measured clockwise from 12 o'clock about the tree centre"}
- {id: state_present, name: presence of a character state at a terminal taxon (1 for a dot), dimension: dimensionless}
- {id: retention_time, name: GC retention time, dimension: "[time]"}
- {id: gc_abundance, name: GC-MS detector abundance (total ion count), dimension: dimensionless}
