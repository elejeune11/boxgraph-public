# ---- Figs. S1, S2 (pp. 22-23): GC chromatograms of P. incarnata primexine material, raster
# screenshots. The apex of every peak above a threshold is read.
- id: figS1_peaks
  page: 22
  where: "Figure S1"
  what: "apex (retention time, abundance) of every peak higher than 100000 above the axis, from 14.6 min on"
  dpi: 700
  crop: [800, 980, 5150, 2730]
  x: {quantity: retention_time, unit: min}
  y: {quantity: gc_abundance, unit: dimensionless}
  mode: code
  code: figures/figS1_peaks.py
  at: []
- id: figS2_peaks
  page: 23
  where: "Figure S2"
  what: "apex (retention time, abundance) of every peak higher than 150000 above the axis"
  dpi: 700
  crop: [800, 980, 5150, 2730]
  x: {quantity: retention_time, unit: min}
  y: {quantity: gc_abundance, unit: dimensionless}
  mode: code
  code: figures/figS2_peaks.py
  at: []
