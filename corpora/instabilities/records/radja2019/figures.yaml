# Figure readings of radja2019 (first figure pass, 2026-11-14). All by the record's own code
# (figures/*.py, shared helpers _fig4.py, _fig5.py, _chrom.py). Crops are on the page rendered
# at the dpi given and include the tick labels used for calibration.

# ---- Fig. 4 (p. 6): phase diagram of Eq. 6 in the (l0, u) plane. The two solid vertical
# boundary lines are read for their l0 position at six u values. Reading convention: x is u
# (along the line), y is the l0 of the line there.
- id: fig4_boundary_a
  page: 6
  where: "Fig. 4"
  what: "the solid black boundary line just right of l0 = 3.5 (left edge of the orange and purple shaded regions)"
  dpi: 900
  crop: [950, 1550, 3650, 3800]
  x: {quantity: landau_u, unit: dimensionless}
  y: {quantity: mode_number, unit: dimensionless}
  mode: code
  code: figures/fig4_boundary_a.py
  at: ["-0.9", "-0.6", "-0.3", "0.3", "0.6", "0.9"]
- id: fig4_boundary_b
  page: 6
  where: "Fig. 4"
  what: "the solid black boundary line just left of l0 = 4.5 (right edge of the orange and purple shaded regions)"
  dpi: 900
  crop: [950, 1550, 3650, 3800]
  x: {quantity: landau_u, unit: dimensionless}
  y: {quantity: mode_number, unit: dimensionless}
  mode: code
  code: figures/fig4_boundary_b.py
  at: ["-0.9", "-0.6", "-0.3", "0.3", "0.6", "0.9"]

# ---- Fig. 5 (p. 9): character-state dots at the tips of the family tree, one reading per
# colour. x: angular position of the dot about the tree centre (fitted from all dots), y = 1.
- id: fig5_orange
  page: 9
  where: "Fig. 5"
  what: "every orange dot (state: at equilibrium, lambda > 3 um) on the tree"
  dpi: 600
  crop: [700, 1000, 3400, 3500]
  x: {quantity: tree_angle, unit: degree}
  y: {quantity: state_present, unit: dimensionless}
  mode: code
  code: figures/fig5_orange.py
  at: []
