notes: >
  Page 1 is the graphical abstract, pages 2-14 the main text and references,
  15-21 the STAR Methods, 22-29 the supplemental figures and tables.
  The physics (a Landau-Ginzburg / Brazovskii free energy of a phase-separating
  primexine layer coupled to the membrane, Eqs. 1-6, and the conserved
  phase-field-crystal dynamics of Eq. 7) produces no printed number: its
  outputs are pattern geometries (Figs. 1, 2 and 4) and the match of those
  geometries to SEM images. Both are entered as models (Eq. 6 and Eq. 7) with
  the paper's parameters and numerical settings, but marked not runnable, with
  questions; the wavelength relation l0 = 2 pi R / lambda is entered as a
  runnable model without a run, because the paper prints no (R, lambda) pair
  to put through it, and it is the quantity the relation jobs need to compare
  this paper with the elastic wavelength laws. The paper itself makes no link
  to elastic buckling beyond saying the effective constants K and tau depend
  on membrane bending rigidity, tension and elasticity (p. 18); no relation is
  recorded.
  The printed numbers that models do produce are entered and compared:
  the likelihood-ratio statistics, degrees of freedom and chi-square p values
  of the trait-evolution model tests (Table 2, Table S4, text p. 8-9), the
  20-fold rate ratio, the per-pattern-type average percent wavelength
  differences of Table 1 (all of Table 1 is entered as three curves, by u),
  and the family counts (205, 27, 7, 20, 178).
  Findings: the likelihood-ratio statistics, degrees of freedom and p-value
  ranges follow from Table 2; the "20-fold" rate ratio is 94.0/4.48 = 21.0
  (close); the p value printed "<<0.01" is not entered, because a value
  printed only as a bound gets no verdict and the parser cannot read "<<"; the mean percent difference for stripes (30%)
  follows from Table 1, but those for spikes (4.6%) and holes (14%) do not
  (Table 1 gives 10.5% and 18%). The STAR Methods' assignment of the numbered
  wavelength categories to states C and E contradicts the categories' own
  definitions (question q_state_categories).
  Left out: the microscopy protocol numbers, the glycosyl composition and
  linkage tables (Tables S2, S3; they feed no model), the simulated-annealing
  schedule (kept as settings of the Eq. 6 model), the root-state
  probabilities, the individual transition rates other than qAB and qBA, the
  species percentages (about 10% / 90%, no counts given) and the PalDat
  coverage (44%). The supplemental tables do not list pattern wavelengths:
  Table S1 lists the papers used to categorize membrane undulations, S2 and S3
  the glycosyl analyses, S4 the hypothesis tests. The only measured
  wavelength data are the percent differences of Table 1; the per-species
  wavelengths and radii behind them are not printed, so the wavelength
  criterion l0 = 2 pi R / lambda cannot be tested on printed values.
  Figure pass (2026-11-14, figures.yaml / figures.md): Fig. 4's two vertical boundary
  lines are read by code (l0 = 3.548, consistent with the caption's "between 3.5 and 3.6";
  and 4.446); Fig. 5's state dots are read colour by colour and counted per terminal taxon
  (model tree_state_counts): 27 families with an equilibrium state, 7 with only it and 20
  mixed agree with the text, but the tree shows 195 terminal taxa with dots, not 205
  (q_fig5_tip_count); the GC chromatograms of Figs. S1 and S2 are read peak by peak as
  measurements. Micrographs, renderings and the duplicate tree of Fig. S3 are left out.
