id: chi2_pvalue
name: p value of a likelihood-ratio statistic against a chi-square distribution
role: processing
stated: {page: 8, printed_page: "862", where: text, quote: "one degree of freedom, the p value was between 0.01 and 0.05"}
equation: "p = P(chi2_dof > LR)"
from_words: true
inputs:
  LR: {quantity: likelihood_ratio_statistic, unit: dimensionless}
  dof: {quantity: degrees_of_freedom, unit: dimensionless}
outputs:
  p: {quantity: p_value, unit: dimensionless}
settings: {}
stochastic: false
