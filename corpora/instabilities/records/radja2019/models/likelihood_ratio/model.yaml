id: likelihood_ratio
name: likelihood-ratio statistic between two nested trait-evolution models
role: processing
stated: {page: 8, printed_page: "862", where: text, quote: "log-likelihood ratio of the two-state equilibrium model compared"}
equation: "LR = 2 [(-ln L_simple) - (-ln L_complex)]"
from_words: true
inputs:
  nll_simple: {quantity: neg_log_likelihood, unit: dimensionless, description: "-ln L of the simpler (nested) model"}
  nll_complex: {quantity: neg_log_likelihood, unit: dimensionless, description: "-ln L of the model with more rates"}
outputs:
  LR: {quantity: likelihood_ratio_statistic, unit: dimensionless}
settings: {}
stochastic: false
