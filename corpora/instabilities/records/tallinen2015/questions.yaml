  text: >-
    (Cross-validation against diab2013, ref. 37; job 2026-11-18.) No validation is entered in either
    direction. diab2013 measures nothing: it is a perturbation and finite-element analysis, and its only
    experimental value is Gent & Cho's crease strain 0.28-0.42 of rubber strips compressed by bending,
    which it cites (diab2013/gent_cho_crease_strain). No model here predicts that value: the models give the
    growth ratio g (or gs) and wavelengths of a growing layer on an unstrained substrate, not a nominal
    strain of a bent homogeneous block, and the sulcification threshold gs = 1/lambda_s takes the crease
    stretch 0.647 (lambda_s_printed, from ref. 32) as an input, so setting it against a measured crease
    strain would test ref. 32's value, not a model of this paper. This paper cites diab2013 only as an
    analogous subcritical system that differs "particularly strongly in the region of subcriticality"
    (p. 2), not as data it explains. In the other direction, this record holds no measurement (see
    q_no_validation_biot1963), so diab2013's models have nothing here to predict. See
    diab2013/q_no_validation_tallinen2015.
