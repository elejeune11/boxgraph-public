- id: q_h_relation
  kind: possible_error
  about: [mode_wavelength_h, mode_wavelength_h_gza, width_eta4_printed]
  text: >
    The relaxed layer thickness is printed as h = a/gz (p. 1). G = diag(gx, gy, gz) is the deformation that
    relaxes the bonded layer (thickness a), so the relaxed thickness should be gz a; for uniaxial growth
    (gz = 1/g) the printed form makes the grown layer thicker than the bonded one. With the printed relation
    the wavelength of linear instability at eta = 4 is about 5.0h, not the 7.54h printed on p. 6; with
    h = gz a it is 7.54h. The figures in units of h (Figs. 2(b), 4(d), 4(e)) appear to use h = gz a.
  citation: {page: 1, quote: "becoming a flat slab with thickness"}
- id: q_ellipsis_values
  kind: reading
  about: [gb_main_printed, gb_appendix_printed, eta_b_main_printed, eta_b_b28_printed]
  text: >
    gb and eta_b are printed with a trailing ellipsis ('1.839 . . .', '0.525 . . .'), meaning further digits
    are dropped. They are recorded as the digits printed, so a verdict uses half a unit in the last printed
    digit; a truncated value strictly allows [1.839, 1.840).
- id: q_fe_results
  kind: unstated_model
  about: [fe_folding, width_eta1_fe_printed, fold_spacing_large_g_printed]
  text: >
    The beyond-threshold results (cusp thresholds, the energy-minimizing wavelengths converging to about four
    layer thicknesses, 4.71h for eta = 1 at gs, the hysteresis loops, the 3D pattern phase diagram) come from
    an explicit finite-element code that is described only in outline and not released; they cannot be rerun
    in the record.
- id: q_biot_search_range
  kind: choice
  about: [first_unstable_mode, run_first_mode_eta05, l_over_a_short_added]
  text: >
    The paper does not say how the minimum over wavelength was found. The record searches l/a in
    [0.05, 15] (log grid, then a bounded minimization). Below eta_b the minimum is the l/a -> 0 limit, which the
    search represents by l/a = 0.05; the threshold there exceeds gb by much less than the printed precision.
- id: q_log_transition
  kind: unstated_model
  about: [first_unstable_mode]
  text: >
    The paper states that above eta_b the unstable wavelength vanishes 'as lambda ~ 1/log(eta - eta_b)' after
    'further analysis' that is not shown; since log(eta - eta_b) is negative near eta_b the sign is implied by
    the '~'. No printed value tests it, and lambda also denotes the stretch elsewhere in the paper.
  citation: {page: 7, quote: "logarithmic, in the sense that the unstable wavelength vanishes"}
- id: q_brain_eta
  kind: reading
  about: [eta_brain_printed]
  text: >
    The biological comparison rests on a cortex-to-sublayer modulus ratio eta ≈ 1 taken from ref. 2; the gut
    is described only as a 'relatively stiff epithelium' on a softer mesenchyme, with no number. The claimed
    agreement of fold width (about four layer thicknesses) with brain and gut [3,8] is stated without numbers.
- id: q_b27_sign
  kind: possible_error
  about: [eta_b_crossover, eta_b_b28]
  text: >
    (Audit.) Eq. B26 reads (6gb^5 - 12gb^3 - 2gb) eps A e^(ak + ak/gb^2) + B e^(ak - ak/gb^2) = 0, whose solution
    is eps = -B e^(-2ak/gb^2) / [(6gb^5 - 12gb^3 - 2gb) A]. Eq. B27 is printed without the minus sign. At g = gb
    the factor 6gb^5 - 12gb^3 - 2gb is positive (about 48) and A (Eq. B24) is negative for every eta >= 0 (its
    eta^2 term is eta^2 (gb^6 - 3gb^4 - gb^2 - 1) = 0 and the remaining terms are negative), so B26 gives eps the
    sign of B, as the text after B27 states, while the printed B27 gives it the opposite sign. B27 appears to have
    lost a minus sign; no printed number depends on it (eta_b comes from B = 0).
  citation: {page: 7, quote: "which is solved by", where: Eq. B27}
- id: q_fig4_panel_reference
  kind: possible_error
  about: [fe_folding]
  text: >
    (Audit.) Appendix A says the large rectangular simulation domains (width 30 times the layer thickness) are
    shown in Fig. 4(f); the caption of Fig. 4 (p. 4) gives 4(f) as zigzags in the chick gut epithelium and 4(g) as
    the simulated layer in a large domain. The reference appears to mean Fig. 4(g).
  citation: {page: 6, quote: "the domain has a width 30 times the layer thickness"}
- id: q_growth_strain_vs_applied_strain
  kind: reading
  about: [gs_from_stretch, lambda_s_printed, gs_uniaxial_printed]
  text: >
    (Audit, for relating this record to the applied-strain papers.) The paper maps growth to an applied stretch by
    g = 1/lambda (p. 2), so the equivalent applied compressive strain is 1 - lambda = 1 - 1/g, while the 'growth
    strain' it uses in Sec. II C and Fig. 4 is eps = g - 1 (p. 5). The two differ beyond first order: at the
    sulcification threshold gs ≈ 1.55 the growth strain is 0.55 and the equivalent compressive strain 0.353; at
    gb = 1.839 they are 0.839 and 0.456 (the Biot stretch 0.544). Thresholds compared across papers should use
    lambda = 1/g, not eps.
  citation: {page: 5, quote: "where gc is the growth"}
- id: q_fig2b_h_relation
  kind: reading
  about: [mode_wavelength_h, mode_wavelength_h_gza, fig2b_linear_fig, fig2b_linear_dotted_fig, wavelength_at_threshold, wavelength_at_threshold_gza]
  text: >
    (Figure pass.) The blue curve of Fig. 2(b), the wavelength of linear instability in units of h against its
    threshold g, settles q_h_relation from the paper's own figure: the readings follow wavelength_at_threshold_gza
    (h = gz a) at every g read and lie far from wavelength_at_threshold (the printed h = a/gz), whose values are
    smaller by a factor g^2. Together with the printed width 7.54h (p. 6), the figures in units of h use h = gz a.
  citation: {page: 3, quote: "The blue curve is the wavelength of linear instability", where: "Fig. 2(b)"}
- id: q_fig4_black_curve
  kind: unexplained_difference
  about: [fig4d_linear_fig, fig4e_linear_fig, wavelength_at_threshold_biax, wavelength_at_threshold_biax_gza]
  text: >
    (Figure pass.) The thick black curves of Figs. 4(d) and 4(e), captioned as the wavelength of linear
    instability and drawn on an axis labelled l/h, are reproduced by neither reading of h: with g = gx = gy the
    relaxed thickness is a/g^2 (h = gz a) or a g^2 (printed h = a/gz), and both models miss the curves by far.
    Evaluated outside the record, the curves coincide at every g read with l_c/a, the wavelength of the mapped
    plane-strain mode (g^(3/2) = g_c(eta'), wavelength_at_threshold.mode_at) over the deformed thickness a, and
    they end at g = gb^(2/3) as that mode does. So the curves appear to be plotted against the deformed thickness
    (or the axis label and caption do not say what is plotted). The finite-element points in the same panels are
    half-wavelengths (legends l_y/2, l_x/2, l_h/2), which a full wavelength over a would not match in kind either.
  citation: {page: 4, quote: "Thick black curves indicate the wavelength of linear instability", where: "Fig. 4(d),(e)"}
- id: q_line_models
  kind: choice
  about: [threshold_line, sulcification_line, sulcification_line_biax]
  text: >
    (Figure pass.) A threshold drawn as a straight line across a plot (the vertical dashed lines of Fig. 3, the flat
    part of the blue curve in Fig. 4(b)) is compared by reading it at one or more positions along the line and
    running a model that takes that position as an input it does not use. The input only lets the reading, which
    is indexed by the plot's other axis, be compared point by point; the result is g_c(eta) or gs, as the text gives.
