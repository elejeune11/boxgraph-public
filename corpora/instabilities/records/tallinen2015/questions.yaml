- id: q_no_validation_fierling2022
  kind: choice
  about: [first_unstable_mode, mode_wavelength_h, wavelength_at_threshold, eq1_threshold, threshold_line, fierling2022/curv_ap_muvi_fig4f, fierling2022/curv_dv_muvi_fig4f, fierling2022/furrow_z_p0_sf3d, fierling2022/area_rows_muvi]
  text: >-
    (Cross-validation against fierling2022; job 2026-11-19.) No validation is entered in either direction.
    Neither paper cites the other. fierling2022's measurements are apical area, AP and DV cell size by row,
    tissue curvature along AP and DV, furrow apex position and depth against time, pole displacement and
    laser-ablation recoil velocities of the Drosophila ventral furrow. The models here give the threshold
    growth ratio g and the wavelength (in units of the layer thickness h) of the first unstable mode of a
    growing incompressible neo-Hookean layer bonded to a neo-Hookean half-space with modulus ratio eta.
    The mapping is not a real one: the embryo's epithelium is a single active shell that contracts
    apically (a pre-strain imposed on a ventral band, not growth) over a fluid yolk, confined by the
    vitelline membrane, with no bonded elastic substrate and so no eta; it forms one furrow along the
    midline whose position is set by the contracting region and the embryo's geometry, not a periodic
    pattern with a wavelength of a few layer thicknesses. No measured quantity there is a growth ratio, a
    modulus ratio or a wavelength, and no measured modulus or layer thickness would supply the models'
    inputs. In the other direction this record holds no measurement (see q_no_validation_biot1963), so
    fierling2022's models have nothing here to predict. See fierling2022/q_no_validation_tallinen2015.
  citation: {page: 1, printed_page: "022720-1", quote: "mechanical descriptions of brain folding", where: text}
- id: q_no_validation_jin2015
  kind: choice
  about: [first_unstable_mode, threshold_line, sulcification_line, gs_from_stretch, eta_s_uniaxial, jin2015/exp_crease_15to1_text, jin2015/exp_crease_10to1_text, jin2015/exp_wrinkle_10to1_text, jin2015/exp_wrinkle_7p5to1_text]
  text: >-
    (Cross-validation against jin2015, cited here as ref. 38; job 2026-11-19.) No validation is entered in
    either direction. This paper cites jin2015 only to say that jointly compressed bilayers "differ from
    ours particularly strongly in the region of subcriticality" (p. 2); it takes no number from it and fits
    nothing to it. jin2015's measurements are the applied compressive film strains at which creases or
    wrinkles first appear (0.37/0.36 for a 15:1 film, 0.28/0.29 creases and 0.22-0.28 wrinkles for a 10:1
    film, 0.18-0.21 wrinkles for a 7.5:1 film, all 18-20 um films on a 30:1 PDMS substrate about 550 um
    thick). The models here give the threshold growth g of a layer growing on an unstrained, infinitely
    deep substrate; under joint uniaxial compression the substrate is strained as well and is of finite
    depth (Hs/Hf near 30), so the measured film strain is not the 1 - 1/g of these models. Even with that
    mapping the models need the modulus ratio eta, which jin2015 does not give for its samples (only
    base:crosslinker compositions; jin2015/q_exp_moduli), so eta would be an added input chosen to place
    each sample and the verdict would test that choice. The sulcification line gs = 1/lambda_s is the
    homogeneous half-space crease value of ref. 32, not a bilayer prediction; its comparison with crease
    measurements belongs to the hong2009 relation. In the other direction this record holds no measurement
    (see q_no_validation_biot1963), so jin2015's models have nothing here to predict. See
    jin2015/q_no_validation_tallinen2015.
  citation: {page: 2, printed_page: "022720-2", quote: "These systems differ from ours", where: text}
