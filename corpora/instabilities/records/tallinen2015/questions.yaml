- id: q_no_validation_trushko2020
  kind: choice
  about: [first_unstable_mode, mode_wavelength_h, wavelength_at_threshold, threshold_line, eq1_threshold, trushko2020/fig5f_exp_data, trushko2020/E_capsule, trushko2020/h_capsule, trushko2020/R_capsule]
  text: >-
    (Cross-validation against trushko2020; job 2026-11-19.) No validation is entered in either direction.
    Neither paper cites the other (trushko2020 cites Tallinen et al. 2014 on gyrification, not this
    paper). The candidate was this paper's first unstable mode (threshold growth g and wavelength in units
    of h for modulus ratio eta) set against trushko2020's measured fold count (Fig. 5F), with eta from the
    capsule modulus 19.5 kPa and a literature monolayer modulus. The mapping is not a real one: the models
    here are a growing layer bonded to an elastic half-space with a free outer surface, whose wrinkles
    are set by the layer thickness; trushko2020's monolayer lines a thin capsule (wall 19.9 um against a
    radius 97 um, so not a half-space), detaches from it on folding and folds into a fluid lumen, and its
    1-3 folds per ring are set by the ring's circumference and the capsule's elastic response (its own
    Eqs. S21-S30), not by a wavelength of a few layer thicknesses (which would give tens of folds
    around 2 pi R). The monolayer's own modulus and thickness are not measured there either, and the
    threshold growth g has no measured counterpart (trushko2020's excess strain at buckling is a model
    quantity). In the other direction this record holds no measurement (see q_no_validation_biot1963),
    so trushko2020's models have nothing here to predict. See trushko2020/q_no_validation_tallinen2015.
