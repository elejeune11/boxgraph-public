    that point's modulus ratio, and no model here returns a mode label, so there is no measured quantity
    for a validation entry to compare. The conditions also differ: here the substrate is unstrained when
    the growing layer becomes unstable and the layer is perfectly bonded, while in wang2014 the substrate
    is prestretched (lambda_p = 2) and partly relaxed at onset, and adhesion is finite; wang2014's own
