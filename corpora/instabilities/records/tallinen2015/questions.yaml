    and bounded by muscle; first_unstable_mode returns the wavelength at linear onset over the bonded
    thickness a (and mode_wavelength_h over the relaxed thickness h) of a layer on a half-space. The
    spacings are curves against embryonic age, which no model here takes, and the modulus ratio is
    measured only at chick E8 and E10 and mouse E14.5. For the relation jobs only (no verdict): at the
    measured ratios 10.6, 13.1 and 1.55, first_unstable_mode gives l/a of about 9.0, 9.8 and 3.9, the same
    order as the measured spacings. (2) In the other direction, this record holds no measurement (see
