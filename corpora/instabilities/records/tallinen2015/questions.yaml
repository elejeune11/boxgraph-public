    (1) This record's models against wang2015's measurements. wang2015 measures the shear moduli of
    substrate and films (inputs here, not outputs), the observed onset mismatch strains of creases (~0.36,
    mu_f/mu_s = 0.3 and 0.64), folds (~0.33), period-doubles (≈ 0.32) and ridges (≈ 0.33), and in Fig. 5
