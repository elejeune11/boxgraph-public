    (1 - eM)/(1 - eC). The closest model here is the sulcification threshold (sulcification_line,
    gs_from_stretch: g = 1/lambda_s ≈ 1.55), which applies at both crease ratios (below eta_s ≈ 1.14).
    wang2015's mismatch strain is eM = (Lf - Ls)/Lf, so the layer's growth ratio relative to the substrate
    is Lf/Ls = 1/(1 - eM). But the model returns that growth ratio, not the strain, and a validation entry
    cannot transform an output (q_no_validation_hong2009, q_no_validation_trujillo2008). Read through the
    conversion, gs ≈ 1.55 is eM ≈ 0.353 against the observed ~0.36. The printed onset is approximate in any
    case, so it would get no verdict; the agreement is left for the relation jobs. The fold onset at
    mu_f/mu_s = 1.86-9.79 is the transition from wrinkles to folds, which here comes only from the
    finite-element cusp thresholds (fe_folding, not runnable). The linear threshold (first_unstable_mode)
    gives wrinkle onset, which wang2015 does not measure, and again as a growth ratio. No model here
    gives period-doubles, ridges, or any post-threshold wavelength or amplitude. The threshold wavelengths
    here are over the layer thickness, while Fig. 5 divides by the initial wrinkle wavelength. The
    modulus ratio of wang2015's flat-crease-wrinkle triple point (1.3, finite elements) against eta_s ≈
    1.14 here is model against model, for the relation jobs. (2) In the other direction, this record holds
    no measurement (see q_no_validation_biot1963), so wang2015's models have nothing here to predict.
