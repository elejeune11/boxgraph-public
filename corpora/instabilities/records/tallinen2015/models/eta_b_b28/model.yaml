id: eta_b_b28
name: modulus ratio of the transition from finite- to zero-wavelength instability (Eq. B28)
role: model
stated: {page: 7, printed_page: "022720-7", quote: "The crossover occurs at B(gb ,ηb ) = 0, which, inspecting the", where: Eq. B28}
equation: "eta_b = (gb^4 - 2 gb^2 + sqrt(5 gb^8 + 8 gb^6 + 2 gb^4 + 1) + 1)/(gb^6 + 3 gb^4 - gb^2 + 1)"
inputs:
  gb: {quantity: growth_ratio, unit: dimensionless}
outputs:
  eta_b: {quantity: modulus_ratio, unit: dimensionless}
