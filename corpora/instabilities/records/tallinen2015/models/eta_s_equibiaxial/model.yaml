id: eta_s_equibiaxial
name: modulus ratio at which the linear threshold meets the sulcification threshold (equibiaxial growth)
role: model
stated: {page: 4, printed_page: "022720-4", quote: "thus hold with the identifications", where: "text, Sec. II C"}
equation: "eta -> gy eta, g -> gx sqrt(gy); for g = gx = gy: g^(3/2) = gs at the crossing, and gy eta_s,biax = eta_s,uniaxial"
inputs:
  gs: {quantity: growth_ratio, unit: dimensionless, description: "sulcification threshold of the uniaxial problem, g_x sqrt(g_y) at sulcification"}
outputs:
  eta_s: {quantity: modulus_ratio, unit: dimensionless}
settings:
  eta_lo: 0.6
  eta_hi: 5.0
  la_min: 0.05
  la_max: 15.0
  n_grid: 80
  g_max: 4.0
  n_scan: 200
built_from: [eta_s_uniaxial]
