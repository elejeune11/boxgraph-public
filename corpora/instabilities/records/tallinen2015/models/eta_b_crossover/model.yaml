id: eta_b_crossover
name: modulus ratio where B(gb, eta) changes sign (Eqs. B25, B27)
role: model
stated: {page: 7, printed_page: "022720-7", quote: "The crossover occurs at B(gb ,ηb ) = 0, which, inspecting the", where: "Eqs. B25, B27 and text before Eq. B28"}
equation: "gb^6 eta_b^2 + gb^4 eta_b (3 eta_b - 2) - gb^2 (eta_b - 2)^2 + (eta_b - 2) eta_b = 0, the positive root"
inputs:
  gb: {quantity: growth_ratio, unit: dimensionless}
outputs:
  eta_b: {quantity: modulus_ratio, unit: dimensionless}
