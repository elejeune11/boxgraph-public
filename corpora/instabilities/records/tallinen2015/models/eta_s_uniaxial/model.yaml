id: eta_s_uniaxial
name: modulus ratio at which the linear threshold meets the sulcification threshold (uniaxial growth)
role: model
stated: {page: 2, printed_page: "022720-2", quote: "bility for η > ηs ≈ 1.14, where the linear threshold intersects", where: "text; Fig. 1(c)"}
equation: "g_c(eta_s) = gs, with g_c the first-unstable-mode threshold from Eq. 1"
inputs:
  gs: {quantity: growth_ratio, unit: dimensionless, description: "sulcification threshold growth"}
outputs:
  eta_s: {quantity: modulus_ratio, unit: dimensionless}
settings:
  eta_lo: 0.6
  eta_hi: 5.0
  la_min: 0.05
  la_max: 15.0
  n_grid: 80
  g_max: 4.0
  n_scan: 200
built_from: [first_unstable_mode]
