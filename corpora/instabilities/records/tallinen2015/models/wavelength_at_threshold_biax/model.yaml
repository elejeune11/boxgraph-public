id: wavelength_at_threshold_biax
name: wavelength of linear instability against equibiaxial threshold growth, h = a/gz as printed (black curves, Figs. 4(d), 4(e))
role: model
stated: {page: 4, printed_page: "022720-4", quote: "Thick black curves indicate the wavelength of linear instability", where: "Fig. 4(d),(e), caption; Sec. II C mapping; h = a/gz (p. 1)"}
equation: "g_c(eta') = g^(3/2) defines the mode; l/h = (l_c/a)(a/h), h = a/gz, gz = 1/g^2"
inputs:
  g: {quantity: growth_ratio_equibiaxial, unit: dimensionless}
outputs:
  l_over_h: {quantity: wavelength_over_layer_thickness, unit: dimensionless}
settings:
  eta_lo: 0.53
  eta_hi: 20.0
  la_min: 0.05
  la_max: 15.0
  n_grid: 80
  g_max: 4.0
  n_scan: 200
built_from: [wavelength_at_threshold]
