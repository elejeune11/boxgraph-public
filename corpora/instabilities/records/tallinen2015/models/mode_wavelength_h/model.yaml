id: mode_wavelength_h
name: wavelength of the first unstable mode in units of the relaxed layer thickness, with h = a/gz as printed
role: model
stated: {page: 1, printed_page: "022720-1", quote: "becoming a flat slab with thickness", where: "text, Sec. II (h = a/gz), with Figs. 1(b) and Appendix A"}
equation: "l/h = (l_c/a)(a/h), h = a/gz, gz = 1/g (uniaxial growth G = diag(g, 1, 1/g)), so l/h = (l_c/a)/g_c"
inputs:
  eta: {quantity: modulus_ratio, unit: dimensionless}
outputs:
  l_over_h: {quantity: wavelength_over_layer_thickness, unit: dimensionless}
settings:
  la_min: 0.05
  la_max: 15.0
  n_grid: 80
  g_max: 4.0
  n_scan: 200
built_from: [first_unstable_mode]
