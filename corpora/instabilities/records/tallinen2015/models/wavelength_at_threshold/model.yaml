id: wavelength_at_threshold
name: wavelength of linear instability against its threshold growth, in units of h = a/gz as printed (blue curve, Fig. 2(b))
role: model
stated: {page: 3, printed_page: "022720-3", quote: "The blue curve is the wavelength of linear instability", where: "Fig. 2(b), caption; Eq. 1; h = a/gz (p. 1)"}
equation: "g_c(eta) = g defines eta; l/h = (l_c(eta)/a)(a/h), h = a/gz, gz = 1/g"
inputs:
  g: {quantity: growth_ratio, unit: dimensionless, description: "threshold growth of the first unstable mode"}
outputs:
  l_over_h: {quantity: wavelength_over_layer_thickness, unit: dimensionless}
settings:
  eta_lo: 0.53
  eta_hi: 20.0
  la_min: 0.05
  la_max: 15.0
  n_grid: 80
  g_max: 4.0
  n_scan: 200
built_from: [first_unstable_mode]
