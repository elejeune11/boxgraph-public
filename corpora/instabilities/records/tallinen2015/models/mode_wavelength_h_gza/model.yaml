id: mode_wavelength_h_gza
name: wavelength of the first unstable mode in units of the relaxed layer thickness, with h = gz a
role: model
stated: {page: 1, printed_page: "022720-1", quote: "becoming a flat slab with thickness", where: "text, Sec. II (h = a/gz), with Figs. 1(b) and Appendix A"}
equation: "l/h = (l_c/a)(a/h), h = gz a, gz = 1/g, so l/h = (l_c/a) g_c"
inputs:
  eta: {quantity: modulus_ratio, unit: dimensionless}
outputs:
  l_over_h: {quantity: wavelength_over_layer_thickness, unit: dimensionless}
settings:
  la_min: 0.05
  la_max: 15.0
  n_grid: 80
  g_max: 4.0
  n_scan: 200
built_from: [first_unstable_mode]
variant_of: mode_wavelength_h
corrections:
  - equation: "h = a/gz (p. 1)"
    change: "relaxed thickness h = gz a instead of the printed h = a/gz"
    evidence: >
      G = diag(gx, gy, gz) is stated to be the deformation that relaxes the bonded layer of thickness a
      (p. 1), and the layer energy uses the elastic part F G^-1 G^-T F^T, so the relaxed thickness is gz a;
      with uniaxial growth gz = 1/g the grown layer is thinner than the bonded one, not thicker. The paper's
      own printed width 7.54h for eta = 4, stated to be the wavelength of linear instability (p. 6), is
      what Eq. 1 gives with h = gz a; with the printed h = a/gz it gives about 5.0h.
