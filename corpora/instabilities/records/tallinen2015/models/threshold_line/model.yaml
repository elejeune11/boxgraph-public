id: threshold_line
name: the linear-instability threshold drawn as a vertical line on the amplitude-growth plane (Fig. 3)
role: model
stated: {page: 3, printed_page: "022720-3", quote: "Hysteresis loops for three different modulus ratios", where: "Fig. 3, dashed lines labelled Linear instability; Eq. 1"}
equation: "g = g_c(eta) for all A/h, g_c from Eq. 1 minimized over wavelength"
inputs:
  eta: {quantity: modulus_ratio, unit: dimensionless}
  A: {quantity: amplitude_over_layer_thickness, unit: dimensionless, description: "height on the line where it is read; does not enter the result"}
outputs:
  g: {quantity: growth_ratio, unit: dimensionless}
settings:
  la_min: 0.05
  la_max: 15.0
  n_grid: 80
  g_max: 4.0
  n_scan: 200
built_from: [first_unstable_mode]
