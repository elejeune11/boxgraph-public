id: first_unstable_mode
name: threshold growth and wavelength of the first unstable mode (Eq. 1 minimized over wavelength)
role: model
stated: {page: 2, printed_page: "022720-2", quote: "threshold over wavelengths gives the wavelength and threshold", where: "text after Eq. 1; Figs. 1(b), 1(c)"}
equation: "g_c(eta) = min over l/a of g(eta, l/a) from Eq. 1; l_c/a the minimizing wavelength"
inputs:
  eta: {quantity: modulus_ratio, unit: dimensionless}
outputs:
  g: {quantity: growth_ratio, unit: dimensionless, description: "threshold growth of the first unstable mode"}
  l_over_a: {quantity: wavelength_over_deformed_thickness, unit: dimensionless, description: "its wavelength; equals la_min when the minimum is the zero-wavelength Biot limit"}
settings:
  la_min: 0.05
  la_max: 15.0
  n_grid: 80
  g_max: 4.0
  n_scan: 200
built_from: [eq1_threshold]
