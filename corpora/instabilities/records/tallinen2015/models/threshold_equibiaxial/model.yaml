id: threshold_equibiaxial
name: linear-instability threshold for equibiaxial growth (blue curve of Fig. 4(b), eta > eta_s)
role: model
stated: {page: 4, printed_page: "022720-4", quote: "thus hold with the identifications", where: "Sec. II C; Fig. 4(b), blue curve"}
equation: "g^(3/2) = g_c(g eta), g = gx = gy, from eta -> gy eta and g -> gx sqrt(gy) applied to Eq. 1 minimized over wavelength"
inputs:
  eta: {quantity: modulus_ratio, unit: dimensionless}
outputs:
  g: {quantity: growth_ratio_equibiaxial, unit: dimensionless}
settings:
  g_lo: 1.0001
  g_hi: 1.6
  la_min: 0.05
  la_max: 15.0
  n_grid: 80
  g_max: 4.0
  n_scan: 200
built_from: [first_unstable_mode]
