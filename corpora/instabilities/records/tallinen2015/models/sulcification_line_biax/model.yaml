id: sulcification_line_biax
name: the equibiaxial sulcification threshold drawn as a horizontal line on the eta-g plane (Fig. 4(b), eta < eta_s)
role: model
stated: {page: 4, printed_page: "022720-4", quote: "the sulcification threshold is at", where: "Sec. II C; Fig. 4(b), blue curve"}
equation: "g^(3/2) = gs = 1/lambda_s for all eta < eta_s"
inputs:
  lam_s: {quantity: stretch_compression_axis, unit: dimensionless}
  eta: {quantity: modulus_ratio, unit: dimensionless, description: "position on the line where it is read; does not enter the result"}
outputs:
  g: {quantity: growth_ratio_equibiaxial, unit: dimensionless}
built_from: [gs_equibiaxial]
