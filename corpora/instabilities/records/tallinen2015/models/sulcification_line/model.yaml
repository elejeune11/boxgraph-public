id: sulcification_line
name: the sulcification threshold drawn as a vertical line on the amplitude-growth plane (Fig. 3)
role: model
stated: {page: 2, printed_page: "022720-2", quote: "0.647 [32], corresponding to gs = 1/λs ≈ 1.55", where: "text p. 2; Fig. 3, dashed lines labelled Sulcification, gs"}
equation: "g = gs = 1/lambda_s for all A/h"
inputs:
  lam_s: {quantity: stretch_compression_axis, unit: dimensionless}
  A: {quantity: amplitude_over_layer_thickness, unit: dimensionless, description: "height on the line where it is read; does not enter the result"}
outputs:
  g: {quantity: growth_ratio, unit: dimensionless}
built_from: [gs_from_stretch]
