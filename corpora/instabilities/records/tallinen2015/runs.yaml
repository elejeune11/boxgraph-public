- id: run_gs
  model: gs_from_stretch
  inputs: {lam_s: lambda_s_printed}
  outputs: {gs: gs_computed}
- id: run_gs_biax
  model: gs_equibiaxial
  inputs: {gs: gs_computed}
  outputs: {gs_biax: gs_biax_computed}
- id: run_eta_s_uniaxial
  model: eta_s_uniaxial
  inputs: {gs: gs_computed}
  settings: {eta_lo: 0.6, eta_hi: 5.0, la_min: 0.05, la_max: 15.0, n_grid: 80, g_max: 4.0, n_scan: 200}
  outputs: {eta_s: eta_s_uniaxial_computed}
- id: run_eta_s_equibiaxial
  model: eta_s_equibiaxial
  inputs: {gs: gs_computed}
  settings: {eta_lo: 0.6, eta_hi: 5.0, la_min: 0.05, la_max: 15.0, n_grid: 80, g_max: 4.0, n_scan: 200}
  outputs: {eta_s: eta_s_equibiaxial_computed}
- id: run_biot_polynomial
  model: biot_polynomial
  inputs: {}
  outputs: {gb: gb_polynomial_computed}
- id: run_biot_closed_form
  model: biot_closed_form
  inputs: {}
  outputs: {gb: gb_closed_form_computed}
- id: run_eta_b_b28
  model: eta_b_b28
  inputs: {gb: gb_polynomial_computed}
  outputs: {eta_b: eta_b_b28_computed}
- id: run_eta_b_crossover
  model: eta_b_crossover
  inputs: {gb: gb_polynomial_computed}
  outputs: {eta_b: eta_b_crossover_computed}
- id: run_first_mode_eta05
  model: first_unstable_mode
  inputs: {eta: eta_05}
  settings: {la_min: 0.05, la_max: 15.0, n_grid: 80, g_max: 4.0, n_scan: 200}
  outputs: {g: g_first_mode_eta05, l_over_a: la_first_mode_eta05}
  note: "eta = 0.5 < eta_b: the minimum is at the shortest wavelength searched (la_min), i.e. the Biot limit."
- id: run_eq1_short_eta05
  model: eq1_threshold
  inputs: {eta: eta_05, l_over_a: l_over_a_short_added}
  settings: {g_max: 4.0, n_scan: 200}
  outputs: {g: g_eq1_short_eta05}
- id: run_first_mode_eta4
  model: first_unstable_mode
  inputs: {eta: eta_4}
  settings: {la_min: 0.05, la_max: 15.0, n_grid: 80, g_max: 4.0, n_scan: 200}
  outputs: {g: g_first_mode_eta4, l_over_a: la_first_mode_eta4}
  note: "Threshold and wavelength of linear instability for eta = 4 (Fig. 3(c) marks this threshold; no number is printed)."
- id: run_width_eta4
  model: mode_wavelength_h
  inputs: {eta: eta_4}
  settings: {la_min: 0.05, la_max: 15.0, n_grid: 80, g_max: 4.0, n_scan: 200}
  outputs: {l_over_h: width_eta4_computed}
- id: run_width_eta4_gza
  model: mode_wavelength_h_gza
  inputs: {eta: eta_4}
  settings: {la_min: 0.05, la_max: 15.0, n_grid: 80, g_max: 4.0, n_scan: 200}
  outputs: {l_over_h: width_eta4_gza_computed}
- id: run_stiff_wavelength_eta4
  model: stiff_wavelength_asymptote
  inputs: {eta: eta_4}
  outputs: {l_over_a: la_stiff_eta4}
  note: "The stiff-layer asymptote at eta = 4, beside run_first_mode_eta4; no printed number to compare."
- id: run_stiff_threshold_eta4
  model: stiff_threshold_asymptote
  inputs: {eta: eta_4}
  outputs: {g: g_stiff_eta4}
  note: "The stiff-layer asymptote at eta = 4, beside run_first_mode_eta4; no printed number to compare."
# Runs and comparisons on the calibrated figure readings (figure pass, 2026-11-14).
- id: run_fig1a_eta2
  model: eq1_threshold
  inputs:
    eta: eta_2_fig1a
  settings:
    g_max: 4.0
    n_scan: 200
  sweep:
    l_over_a: fig1a_eta2_fig
  outputs:
    g: g_eq1_fig1a_eta2
