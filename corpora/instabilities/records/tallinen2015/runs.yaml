    eta: fig1b_asym_fig
  outputs:
    l_over_a: la_asym_fig1b
- id: run_fig1c_threshold
  model: first_unstable_mode
  inputs: {}
  settings: *id001
  sweep:
    eta: fig1c_threshold_fig
  outputs:
    g: g_first_mode_fig1c
  note: Below eta_b the minimum is the zero-wavelength (Biot) limit, represented by l/a = la_min (q_biot_search_range).
- id: run_fig1c_asym
