# Against biot1963: no relation is entered.
# tallinen2015 does not cite biot1963. Its "zero-wavelength Biot instability [22] at g = gb = 1.839" (p. 2) cites
# Biot's 1965 book (ref-22), not this paper, though the book's half-space surface instability is the same analysis.
# The link between the two records is one number, not a model: for uniaxial growth G = diag(g, 1, 1/g) the layer is
# in plane-strain compression with stretch lambda = 1/g (the conversion the paper states for sulcification,
# gs = 1/lambda_s, p. 2), so tallinen2015's Biot root gb (biot_polynomial, biot_closed_form, Eq. B23) should be
# 1/lambda, where lambda is biot1963's plane-strain critical stretch (crit_stretch_plane on the root zeta of char_cubic,
# Eqs. 2.9, 4.2). It is: the polynomial g^6 - 3g^4 - g^2 - 1 factors as (g^3 - g^2 - g - 1)(g^3 + g^2 - g + 1), and
# g^3 - g^2 - g - 1 = 0 with g = 1 + zeta is Biot's cubic zeta^3 + 2 zeta^2 - 2 = 0, so gb = 1 + zeta = 1/lambda.
# The relation tests cannot express this. Both sides are zero-input constants, or chains through a model input (zeta)
# that is another model's output. Their outputs are reciprocal quantities (a growth and a stretch), which an output_map
# cannot convert. Any model pair with a shared input (gs_from_stretch with crit_stretch_plane) only checks the
# reciprocal itself. No paper states the link in a form that would justify a helper model, and tallinen2015 takes no
# value from biot1963 (no datum has a from_source pointing to it), so no cited.yaml line is added either.
#
# Against cao2012 (ref-26): no relation is entered. tallinen2015 cites cao2012 once, with refs 27-28, for studies that
# "considered post-bifurcation behavior when approaching this transition from the stiff-layer smooth wrinkling side"
# (p. 1); it states no relation between its models and cao2012's, and takes no value from it (no datum has a
# from_source pointing to ref-26), so no cited.yaml line is added. Nothing is proposed either:
# - Kinematics differ. cao2012's bilayer (Eqs. A1-A10) compresses film and substrate together, lambda_1s =
#   lambda0_1s lambda_1f; tallinen2015's substrate is unstrained while the layer is at stretch 1/g. The two problems
#   coincide only for lambda0_1s = 1/lambda_1f = g, a prestretch fixed by the strain at bifurcation, not a model
#   input. With lambda0_1s = 1 cao2012 is the jointly compressed system that tallinen2015 itself contrasts with its
#   own (refs 37, 38, p. 2), whose wavelength "scales with the total depth" at eta = 1. The two agree only in the
#   stiff limit, where the threshold strain goes to zero.
# - Outputs are different quantities. In that stiff limit cao2012's Eq. 5 without prestretch, e0 = (1/4)(3 mu_s/mu_f)^(2/3),
#   is tallinen2015's stiff_threshold_asymptote g - 1 = (3/(8 eta))^(2/3), since (3/8)^(2/3) = 3^(2/3)/4, with
#   eta = mu_f/mu_s. But cao2012 gives a strain and tallinen2015 the growth g = 1/(1 - eW), which an output_map cannot
#   convert, and a scales_as on g against e0 would fail because g tends to 1. cao2012's wavenumber k0 h and
#   tallinen2015's l/a are reciprocal (l/a = 2 pi/(k0 h) as the strain vanishes): (3/eta)^(1/3) against
#   2 pi (eta/3)^(1/3). Likewise cao2012's Biot constant 0.5437 (a stretch) is 1/gb for tallinen2015's
#   gb = 1.839 (biot_closed_form). Each link is a reciprocal or an offset. No paper states any of them in a form
#   that would justify a helper model.
#
# Against bowden1998: tallinen2015 does not cite bowden1998 (its stiff-layer citations are refs 15-20, 26-28), and
# bowden1998 predates it, so every relation below is proposed. Neither record takes a value from the other.
# The stiff-layer threshold is not related: bowden1998's Eq. 2 gives a critical stress (MPa), tallinen2015's
# stiff_threshold_asymptote a growth ratio. With incompressible layers they agree (sigma_crit/E_m_bar =
# 0.52 (E_p/E_m)^(2/3) = (1/4)(3/eta)^(2/3) = (3/(8 eta))^(2/3) = g - 1), but the link needs the stress divided by the
# film's plane-strain modulus, which an output_map cannot do, and no paper states it in a form that would justify a
# helper model.
# mapping: b's input symbol -> expression in a's input symbols. eta is tallinen2015's layer/substrate shear-modulus
# ratio; for incompressible neo-Hookean layers (nu = 1/2, as tallinen2015 takes them) it equals E_m/E_p, which is
# also bowden1998's plane-strain ratio E_m (1 - nu_p^2)/(E_p (1 - nu_m^2)) at nu_m = nu_p = 1/2.
- id: rel_bowden_eq3_to_stiff_wavelength_asymptote
  kind: approximated_by
  a: bowden1998/wavelength_eq3
  b: tallinen2015/stiff_wavelength_asymptote
  mapping: {eta: "Em*(1 - nu_p**2)/(Ep*(1 - nu_m**2))"}
  output_map: {l_over_a: L_over_t}
  regime: {Em: [1.0e+7, 1.0e+11], Ep: [1.0e+5, 1.0e+7], nu_m: [0.5, 0.5], nu_p: [0.5, 0.5], t: [1, 1000]}
  tolerance: 0.0012
  provenance: proposed
  reason: >
    tallinen2015's stiff-layer asymptote l/a = (8 pi^3 eta/3)^(1/3) is 2 pi (eta/3)^(1/3) = 4.3566 eta^(1/3), the
    classic stiff-film wavelength that bowden1998 prints as Eq. 3 with prefactor 4.36 (2 pi/3^(1/3) to three
    figures). In the stiff limit the growth strain at threshold goes to zero, so the deformed thickness a is the
    film thickness t. The tolerance 0.0012 is the printed precision of 4.36 (0.005/4.36 relative).
  assumptions:
    - "both layers incompressible (nu_m = nu_p = 1/2), as tallinen2015's neo-Hookean model takes them, so eta = E_m/E_p"
    - "a (tallinen2015's deformed layer thickness) is t, since the threshold strain vanishes as eta grows"
- id: rel_bowden_eq3_simplified_to_stiff_wavelength_asymptote
  kind: approximated_by
  a: bowden1998/wavelength_eq3_simplified
  b: tallinen2015/stiff_wavelength_asymptote
  mapping: {eta: "Em/Ep"}
  output_map: {l_over_a: L_over_t}
  regime: {Em: [1.0e+7, 1.0e+11], Ep: [1.0e+5, 1.0e+7], t: [1, 1000]}
  tolerance: 0.012
  provenance: proposed
  reason: >
    As the relation to Eq. 3's first form: with equal Poisson ratios the factors cancel, and bowden1998's
    L = 4.4 t (E_m/E_p)^(1/3) is tallinen2015's 2 pi (eta/3)^(1/3) with the prefactor printed to two figures; the
    tolerance 0.012 is that precision (0.05/4.4 relative).
  assumptions:
    - "both layers incompressible, so eta = E_m/E_p and the Poisson factors of Eq. 3 cancel"
    - "a (tallinen2015's deformed layer thickness) is t, since the threshold strain vanishes as eta grows"
- id: rel_bowden_eq3_to_first_unstable_mode
  kind: approximated_by
  a: bowden1998/wavelength_eq3
  b: tallinen2015/first_unstable_mode
  mapping: {eta: "Em*(1 - nu_p**2)/(Ep*(1 - nu_m**2))"}
  output_map: {l_over_a: L_over_t}
  regime: {Em: [1.0e+7, 4.0e+7], Ep: [1.0e+6, 1.0e+6], nu_m: [0.5, 0.5], nu_p: [0.5, 0.5], t: [1, 1000]}
  tolerance: 0.07
  provenance: proposed
  reason: >
    tallinen2015's full finite-strain linear analysis (Eq. 1 minimized over wavelength) should approach the
    small-strain stiff-film wavelength of bowden1998's Eq. 3 as the layer stiffens (the brief's "should approach
    the stiff-film result"). The regime is eta = 10 to 40: below it the finite threshold strain (g - 1 about 0.12 at
    eta = 10) separates the two, and above it the wavelength 2 pi (eta/3)^(1/3) leaves the model's search range
    (la_max = 15). Over this range the reader's direct runs differ by about 6 % at eta = 10 falling to 2.4 % at
    eta = 40, so the tolerance 0.07 says only that the two agree to the size of the finite-strain correction; the
    measured error is the result.
  assumptions:
    - "both layers incompressible (nu_m = nu_p = 1/2), so eta = E_m/E_p"
    - "bowden1998's t is compared with tallinen2015's deformed thickness a at threshold, the thickness in which the wavelength is measured"
#
# Against cerda2003: tallinen2015 does not cite cerda2003 (no reference to Cerda & Mahadevan), and neither record
