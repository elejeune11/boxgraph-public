# richman1975's plate_on_foundation (the reader's reconstructed stand-in for the unpublished analysis of its ref. 20:
# bonded incompressible thin plates under equibiaxial compression on an incompressible half-space core) reduces, for
# equal strata (E2/E1 = 1), to one plate of thickness t = t1 + t2 with D = t^3/9 (in units of E1) on a foundation
