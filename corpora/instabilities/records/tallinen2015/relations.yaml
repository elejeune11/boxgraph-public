  provenance: proposed
  reason: >
    With the two cortical strata equally stiff, richman1975's plate-on-core model is a single incompressible stiff
    plate on an incompressible half-space, whose buckling wavelength over the plate thickness is
    2 pi (E1/(3 Ecore))^(1/3); tallinen2015's stiff-layer asymptote l/a = (8 pi^3 eta/3)^(1/3) is the same expression
    with eta = E1/Ecore.
  assumptions:
    - "the strata are equally stiff (E2/E1 = 1), so the two plates act as one of thickness t1 + t2"
    - "all solids incompressible (richman1975's stand-in takes nu = 1/2, tallinen2015 neo-Hookean), so the Young's-modulus ratio E1/Ecore is tallinen2015's shear-modulus ratio eta"
    - "tallinen2015's deformed thickness a is richman1975's cortical thickness t1 + t2, since the threshold strain vanishes in the stiff limit"
