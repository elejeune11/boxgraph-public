# asymptote with eta = E1/Ecore. Equibiaxial loading does not change the wavelength, since the critical load depends
# only on |k| for both. Its critical stress, sigma1/E1 = (3 Ecore/E1)^(2/3)/3, is the plane-strain strain
# (1/4)(3/eta)^(2/3) = g - 1 of stiff_threshold_asymptote times the plate modulus 4/3; that link is an offset and a
# modulus factor, which an output_map cannot express, so it is not entered.
# mapping: eta is tallinen2015's layer/substrate shear-modulus ratio; for incompressible solids it equals the
# Young's-modulus ratio E1/Ecore, i.e. 1/Ecore_over_E1. stress_ratio does not enter l_over_t and is held at 1.
