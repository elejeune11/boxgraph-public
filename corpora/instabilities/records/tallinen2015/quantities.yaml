- id: modulus_ratio
  name: layer-to-substrate shear modulus ratio
  dimension: dimensionless
  description: "eta = mu1/mu2, shear modulus of the growing layer over that of the substrate (p. 1)"
- id: growth_ratio
  name: uniaxial growth ratio of the layer
  dimension: dimensionless
  description: "g in G = diag(g, 1, 1/g): the in-plane stretch the layer would take on relaxing from the bonded state (uniaxial, plane-strain growth). Equivalent to 1/lambda for an applied compressive stretch lambda (p. 2)."
- id: growth_ratio_equibiaxial
  name: equibiaxial (transversely isotropic) growth ratio of the layer
  dimension: dimensionless
  description: "g = gx = gy in G = diag(gx, gy, 1/(gx gy)) (p. 4); maps onto the uniaxial plane-strain problem by g -> gx sqrt(gy) = g^(3/2)"
- id: stretch_compression_axis
  name: principal stretch along the compression
  dimension: dimensionless
  description: "lambda, the principal stretch along the compression of a neo-Hookean solid (lambda < 1 compression); lambda_s is its value at the onset of sulci (p. 2)"
- id: wavelength_over_deformed_thickness
  name: wavelength relative to the deformed (bonded) layer thickness
  dimension: dimensionless
  description: "l/a, wavelength of the perturbation over the thickness a of the layer in its bonded, compressed state (Fig. 1)"
- id: amplitude_over_layer_thickness
  name: fold amplitude relative to the relaxed layer thickness
  dimension: dimensionless
  description: "A/h, the amplitude of the folded surface (marked A in Fig. 2(c)) over the relaxed layer thickness h (Fig. 3)"
- id: half_wavelength_over_layer_thickness
  name: half-wavelength of a 3D fold pattern relative to the relaxed layer thickness
  dimension: dimensionless
  description: "l_x/2, l_y/2 or l_h/2 over h: half of a pattern period of zigzags or triple junctions (lengths indicated in Fig. 4(a)), as in the legends of Figs. 4(d), 4(e)"
- id: wavelength_over_layer_thickness
  name: wavelength relative to the relaxed layer thickness
  dimension: dimensionless
  description: "l/h, wavelength over the thickness h of the grown, stress-free layer ('undeformed layer thickness', Figs. 2-4, p. 6)"
