notes: >
  Scope is the analytic core: the linear stability of a growing incompressible neo-Hookean layer
  (modulus ratio eta = mu1/mu2) bonded to a neo-Hookean half-space, and the thresholds the paper
  derives from it. Growth is a relaxing deformation G = diag(g, 1, 1/g) of the layer (uniaxial
  growth ratio g); the paper maps it to an applied stretch by g = 1/lambda (gs = 1/lambda_s, p. 2),
  defines the growth strain as epsilon = g - 1 (p. 5), and maps general growth
  diag(gx, gy, 1/(gx gy)) onto the uniaxial plane-strain problem by eta -> gy eta,
  g -> gx sqrt(gy) (p. 4). Models entered: the determinant condition Eq. 1 (threshold growth at a
  given wavelength), its minimum over wavelength (first unstable mode), the wavelength of that
  mode in units of the relaxed layer thickness h, the crossing eta_s with the sulcification
  threshold (uniaxial and, through the mapping, equibiaxial), gs = 1/lambda_s and its equibiaxial
  form g^(3/2) = gs, the Biot polynomial and its closed-form root gb = 1.839, the closed form B28
  for eta_b = 0.525 and the condition B(gb, eta_b) = 0 it comes from, and the stiff-layer
  asymptotes printed on Fig. 1(b),(c). The finite-element simulations (Appendix A) that give
  Figs. 2-4 are entered as a model that is not runnable, with their printed settings.
  Findings: the printed relation h = a/gz (p. 1) does not reproduce the printed width 7.54h
  for eta = 4 (p. 6), which the paper says is the wavelength of linear instability; h = gz a does
  (corrected variant, question q_h_relation). All numbers checkable at printed precision
  (gb, eta_b, 7.54) reproduce from the printed equations; the values printed with "≈" (gs, eta_s,
  1.34, 0.86) get no verdict but the computed values are in the record.
  Figures (second pass, 2026-11-14): every plot with values was read by calibrated reading code
  (figures.yaml, figures/, figures.md): the Eq. 1 curves of Fig. 1(a)-(c) and their stiff-layer
  asymptotes, the linear-instability curves of Figs. 2(a), 2(b), 4(b), 4(d), 4(e) and the threshold
  lines of Fig. 3, each compared with the record's models (new models for the curves against g and
  for equibiaxial growth: wavelength_at_threshold(_gza), threshold_equibiaxial,
  wavelength_at_threshold_biax(_gza), threshold_line, sulcification_line(_biax)); and the
  finite-element points and loops of Figs. 2(a), 2(b), 3, 4(d), 4(e), recorded without comparison
  (not runnable). Fig. 4(c) (two overlapping series per colour) and the images are left out.
  Also left out: the near-transition scaling lambda ~ 1/log(eta - eta_b) (no printed value to
  compare), the statement that valleys sulcify before gs up to eta ≈ 10 and the other
  finite-element outcomes stated only in words, the simulation width 2.50h for eta = 0.5 (a
  domain size, not a result), and the 3D domain size (30 h). Biology enters only through the
  brain modulus ratio eta ≈ 1 the paper takes from ref. 2 and the qualitative comparisons of fold
  width (about four layer thicknesses) with brain and gut [3,8]; no tissue numbers are printed
  for the gut.
