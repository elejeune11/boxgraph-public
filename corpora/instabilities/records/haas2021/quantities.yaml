- {id: mixed_coefficient, name: stretching-bending coupling coefficient of the shell energy, dimension: dimensionless, description: "beta and betabar coefficients of Eqs. 57b, 63"}
- {id: bending_coefficient, name: bending coefficient of the shell energy, dimension: dimensionless, description: "gamma coefficients of Eqs. 57b, 63"}
