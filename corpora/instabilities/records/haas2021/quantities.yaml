- {id: large_bending_parameter, name: large bending parameter eta, dimension: dimensionless, description: "eta = kappa_s0 (eps h0)/2 (Eq. 59): intrinsic meridional curvature times half the intrinsic thickness; |eta| -> 1 is cell constriction"}
