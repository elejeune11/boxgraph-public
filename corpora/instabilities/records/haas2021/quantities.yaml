- {id: thinness_parameter, name: thinness parameter epsilon, dimension: dimensionless, description: "asymptotic small parameter of the shell"}
- {id: rescaled_thickness, name: rescaled shell thickness h, dimension: dimensionless, description: "the shell thickness is eps h, lengths scaled by the embryo radius"}
- {id: shell_strain, name: shell (stretching) strain, dimension: dimensionless, description: "Es, Ephi of Eq. 60"}
- {id: curvature_strain, name: curvature strain, dimension: dimensionless, description: "Ks, Kphi of Eq. 62, nondimensional (lengths scaled by R)"}
- {id: shell_energy_density, name: effective two-dimensional elastic energy density, dimension: dimensionless, description: "e of Eqs. 57b, 63, 67, nondimensional"}
- {id: poisson_ratio, name: Poisson's ratio, dimension: dimensionless}
