# Added by the audit: the intrinsic stretches in the bend region, for eta of Eq. 59 in Fig. 5(b), 5(e).
- id: f_s0_bend_added
  quantity: intrinsic_stretch
  unit: dimensionless
  printed: "0.8"
  basis: >
    Fig. 4(h) (p. 12) draws f_s0 = f_phi0 = f_p for s < s0 and f_a beyond, so in the bend region s0 - w < s < s0
    (where kappa_s0 = kappa_b) both intrinsic stretches are f_p = 0.8 (Fig. 5 caption, p. 13). The paper states
    this only through the schematic, and the regularization of the steps is not given.
  alternatives: ["1"]
  stands_for: f_s0 in Eq. 59, in the bend region of Fig. 5
- id: f_phi0_bend_added
  quantity: intrinsic_stretch
  unit: dimensionless
  printed: "0.8"
  basis: >
    As f_s0_bend_added: Fig. 4(h) plots f_s0 and f_phi0 as one curve, equal to f_p up to s0.
  alternatives: ["1"]
  stands_for: f_phi0 in Eq. 59, in the bend region of Fig. 5
