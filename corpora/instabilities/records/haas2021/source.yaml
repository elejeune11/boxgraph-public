notes: >
  A theory paper: an asymptotic derivation of a thin incompressible neo-Hookean morphoelastic shell theory for
  large intrinsic bending (Sec. II, Apps. A-C), applied to Volvox invagination (Sec. III). It prints few numbers,
  so the record checks the paper's closed forms against each other. Models: the coefficient functions of Eqs. 58,
  the barred coefficients of Eqs. 64 both as combinations of Eqs. 58 and in closed form (four stated same_as
  relations), the closed-form discriminant of the stretching energy, the energy density of Eqs. 63/65/66, the
  classical energy of Eqs. 67-69 with the stated eta -> 0 limit (three reduces_to relations), Eqs. 70 as printed and
  a variant with the prefactors the printed correction terms lack (q_eq70_prefactor), k(eta) of Eq. 71 compared with
  the printed k(0) = 13/5 and k(+-1) = 3, and the classical moduli E = 3C, 4C(eps h), C(eps h)^3/3. Coefficient
  functions are evaluated in 60-digit arithmetic because their removable singularity at eta = 0 cancels in double
  precision. The Volvox computations of Fig. 5 (BVP of App. B with bvp4c and AUTO) are entered as a non-runnable
  model with their printed parameters (eps h = 0.15, kappa_p = kappa_a = 1, kappa_b = -2 and -8.5, f_p = 0.8,
  f_a = 1, s0 = 1.5, w = 0.2 and 0.5); the list of w values of Fig. 5(g) (0.3, 0.5, 0.6, 0.7, 0.8, 0.9) is left
  out because nothing runs on it. Relation to haas2015 (ref. 8): the paper's classical limit (Eq. 67) is a classical
  shell with nu = 1/2 and the same eps h = 0.15 as haas2015, but with morphoelastic strains that differ from
  haas2015's difference strains unless the intrinsic stretches are 1 (q_classical_vs_haas2015); a cross-record
  relation is left for when haas2015's model is in its record. Figures (figure job, 2026-11-19): calibrated code readings of Fig. 3
  (all nine plotted coefficient ratios and the inset) and the upper boundary of Fig. 6(b) reproduce the
  closed forms at every position read. In Fig. 5(g) the |eta| = 1 line stands at k = 8.530, where Eq. 59 with
  f_p = 0.8 puts it (q_fig5g_eta1_settles_stretch). The grey bend-region bands of Fig. 5(b), 5(e) match
  s0 - w and s0. The strain profiles of Fig. 5(b, c, e, f) and the twelve (k, d) curves of Fig. 5(g) (lower
  branches) are recorded as figure data without a verdict, because the BVP is not rerun
  (q_fig5_curves_not_compared). See figures.md. Left out: the long tensor derivations of Apps. A and C, which print no
  numbers, and the statements found "numerically" that give no number (q_numerical_inequalities).
