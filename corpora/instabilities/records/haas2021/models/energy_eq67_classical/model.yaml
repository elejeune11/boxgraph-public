id: energy_eq67_classical
name: classical morphoelastic shell energy density (Eqs. 67-69)
stated: {page: 11, printed_page: "022411-11", quote: "limits to the form familiar from classical shell theories", where: "Eqs. 67, 69a, 69b"}
equation: >
  e0 = 2 C eps^3 [ h (Es^2 + Es Ephi + Ephi^2) + (h^3/12)(Ks^2 + Ks Kphi + Kphi^2) ];
  e0_stretch = (1/2)(4Ch) eps^3 [Es^2 + Es Ephi + Ephi^2];
  e0_bend (printed with the label e0,stretch) = (1/2)(C h^3/3) eps^3 [Ks^2 + Ks Kphi + Kphi^2]
inputs:
  C: {quantity: material_parameter_C, unit: dimensionless}
  eps: {quantity: thinness_parameter, unit: dimensionless}
  h: {quantity: rescaled_thickness, unit: dimensionless}
  Es: {quantity: shell_strain, unit: dimensionless}
  Ephi: {quantity: shell_strain, unit: dimensionless}
  Ks: {quantity: curvature_strain, unit: dimensionless}
  Kphi: {quantity: curvature_strain, unit: dimensionless}
outputs:
  e0_stretch: {quantity: shell_energy_density, unit: dimensionless}
  e0_bend: {quantity: shell_energy_density, unit: dimensionless}
  e0: {quantity: shell_energy_density, unit: dimensionless}
settings: {}
