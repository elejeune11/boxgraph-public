id: classical_moduli
name: stretching and bending moduli of the classical shell theory
stated: {page: 11, printed_page: "022411-11", quote: "In this classical theory, the same stretching modulus", where: "text after Eq. 69"}
equation: "E(eps h)/(1 - nu^2) = 4C(eps h); E(eps h)^3/[12(1 - nu^2)] = C(eps h)^3/3"
inputs:
  E_over_C: {quantity: youngs_modulus_over_C, unit: dimensionless}
  nu: {quantity: poisson_ratio, unit: dimensionless}
outputs:
  stretch_coeff: {quantity: stretching_modulus_over_C_thickness, unit: dimensionless, description: "stretching modulus divided by C (eps h)"}
  bend_divisor: {quantity: bending_modulus_divisor, unit: dimensionless, description: "C (eps h)^3 divided by the bending modulus"}
settings: {}
