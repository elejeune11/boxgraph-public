id: volume_conservation_region
name: region of (K0 h^2, H0 h) in which intrinsic volume conservation is possible (App. A, Eqs. A36, A37b, Fig. 6b)
stated: {page: 19, printed_page: "022411-19", quote: "The inequalities can then be solved numerically to determine the region", where: "text after Eq. A37b; Fig. 6(b)"}
equation: >
  zeta(Z0) = Z0 - H0 (Z0)^2 + (K0/3)(Z0)^3 (A36); h = H0 + (K0/12)(H0)^3 (A37b), taking the smaller positive
  root when two exist; (H0)^2 >= K0; zeta must increase with Z0 for |Z0| <= H0/2. In terms of b = K0 h^2,
  a = H0 h and X = H0/h: X + b X^3/12 = 1 and 1 - 2 a z + b z^2 >= 0 for |z| <= X/2, a^2 >= b.
from_words: true
inputs:
  b: {quantity: scaled_gaussian_curvature, unit: dimensionless}
outputs:
  a_max: {quantity: scaled_mean_curvature, unit: dimensionless}
settings: {}
