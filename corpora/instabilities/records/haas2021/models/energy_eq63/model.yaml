id: energy_eq63
name: large-bending shell energy density and its stretching, coupling and bending parts (Eqs. 63, 65, 66)
stated: {page: 10, printed_page: "022411-10", quote: "that appear in the elastic energy (63) separate into stretching", where: "Eqs. 63, 65, 66a-66c"}
equation: >
  e = (C/2) eps^3 { h [alphabar_ss Es^2 + (alphabar_sphi + alphabar_phis) Es Ephi + alpha_phiphi Ephi^2]
  + 2 h^2 [betabar_ss Es Ks + betabar_sphi Es Kphi + beta_phis Ephi Ks + beta_phiphi Ephi Kphi]
  + h^3 [gamma_ss Ks^2 + (gamma_sphi + gamma_phis) Ks Kphi + gamma_phiphi Kphi^2] } + O(eps^4);
  e_stretch = (Ch/2) eps^3 [...]; e_couple = C h^2 eps^3 [...]; e_bend = (C h^3/2) eps^3 [...]
inputs:
  C: {quantity: material_parameter_C, unit: dimensionless}
  eps: {quantity: thinness_parameter, unit: dimensionless}
  h: {quantity: rescaled_thickness, unit: dimensionless}
  eta: {quantity: large_bending_parameter, unit: dimensionless}
  Es: {quantity: shell_strain, unit: dimensionless}
  Ephi: {quantity: shell_strain, unit: dimensionless}
  Ks: {quantity: curvature_strain, unit: dimensionless}
  Kphi: {quantity: curvature_strain, unit: dimensionless}
outputs:
  e_stretch: {quantity: shell_energy_density, unit: dimensionless}
  e_couple: {quantity: shell_energy_density, unit: dimensionless}
  e_bend: {quantity: shell_energy_density, unit: dimensionless}
  e: {quantity: shell_energy_density, unit: dimensionless}
built_from: [coeffs_eq58, coeffs_bar_eq64]
settings: {}
