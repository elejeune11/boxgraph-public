id: coeffs_bar_eq64
name: closed forms of the barred coefficients (Eqs. 64, second equalities)
stated: {page: 10, printed_page: "022411-10", quote: "γsφ = γφs , γφφ are still given by", where: "Eqs. 64a-64d"}
equation: >
  alphabar_ss = 4/(1 - eta^2)^2;
  alphabar_sphi = alphabar_phis = 2/(1 - eta^2)^2;
  betabar_ss = -1/[eta (1 - eta^2)^2] + tanh^-1(eta)/eta^2;
  betabar_sphi = -eta(2 - eta^2)/[3(1 - eta^2)^2]
inputs:
  eta: {quantity: large_bending_parameter, unit: dimensionless}
outputs:
  ab_ss: {quantity: stretching_coefficient, unit: dimensionless}
  ab_sphi: {quantity: stretching_coefficient, unit: dimensionless}
  bb_ss: {quantity: mixed_coefficient, unit: dimensionless}
  bb_sphi: {quantity: mixed_coefficient, unit: dimensionless}
settings: {}
