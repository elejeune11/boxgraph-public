id: constriction_k_eq59
name: the line |eta| = 1 of Fig. 5(g) in (k, d) space, from Eq. 59
stated: {page: 13, printed_page: "022411-13", quote: "corresponding to the constriction limit is also shown", where: "Fig. 5(g) caption; Eq. 59 (p. 9)"}
equation: >
  eta = kappa_s0 (eps h)/(2 f_s0 f_phi0) (Eq. 59) in the bend region, where kappa_s0 = kappa_b = -k, so the
  line |eta| = 1 stands at k = 2 f_s0 f_phi0 |eta|/(eps h) for every posterior displacement d (a vertical line).
from_words: true
built_from: [eta_eq59]
inputs:
  abs_eta: {quantity: large_bending_parameter, unit: dimensionless}
  eps_h: {quantity: relative_thickness, unit: dimensionless}
  f_s0: {quantity: intrinsic_stretch, unit: dimensionless}
  f_phi0: {quantity: intrinsic_stretch, unit: dimensionless}
  d: {quantity: posterior_displacement, unit: dimensionless}
outputs:
  k: {quantity: bend_curvature_magnitude, unit: dimensionless}
settings: {}
