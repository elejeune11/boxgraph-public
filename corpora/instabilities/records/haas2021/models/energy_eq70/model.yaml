id: energy_eq70
name: large-bending stretching and bending energies as classical energies plus corrections (Eqs. 70a, 70b, as printed)
stated: {page: 11, printed_page: "022411-11", quote: "We compare the stretching and bending energies in the", where: "Eqs. 70a, 70b"}
equation: >
  e_stretch = e0_stretch + eta^2 (2 - eta^2)/(1 - eta^2)^2 (2 Es + Ephi)^2;
  e_bend = e0_bend + eta^2 (3 - 2 eta^2)/[36 (1 - eta^2)^2] (3 Ks + Kphi)(k(eta) Ks + Kphi)
inputs:
  C: {quantity: material_parameter_C, unit: dimensionless}
  eps: {quantity: thinness_parameter, unit: dimensionless}
  h: {quantity: rescaled_thickness, unit: dimensionless}
  eta: {quantity: large_bending_parameter, unit: dimensionless}
  Es: {quantity: shell_strain, unit: dimensionless}
  Ephi: {quantity: shell_strain, unit: dimensionless}
  Ks: {quantity: curvature_strain, unit: dimensionless}
  Kphi: {quantity: curvature_strain, unit: dimensionless}
outputs:
  e_stretch: {quantity: shell_energy_density, unit: dimensionless}
  e_bend: {quantity: shell_energy_density, unit: dimensionless}
built_from: [energy_eq67_classical, k_eq71]
settings: {}
