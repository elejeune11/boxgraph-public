id: coeffs_eq58
name: coefficient functions of the large-bending shell energy (Eqs. 58)
stated: {page: 9, printed_page: "022411-9", quote: "are functions of the large bending parameter", where: "Eqs. 58a-58j"}
equation: >
  alpha_ss = (eta^4 - 2 eta^2 + 2)/(1 - eta^2)^2 + 2 tanh^-1(eta)/eta;
  alpha_sphi = alpha_phis = 1/(1 - eta^2)^2 + tanh^-1(eta)/eta;
  alpha_phiphi = (3 eta^4 - 6 eta^2 + 4)/(1 - eta^2)^2;
  beta_ss = -eta(2 - eta^2)/[2(1 - eta^2)^2];
  beta_sphi = (eta^6 + 4 eta^4 - 11 eta^2 + 3)/[18 eta (1 - eta^2)^2] - tanh^-1(eta)/(6 eta^2);
  beta_phis = -1/[2 eta (1 - eta^2)^2] + tanh^-1(eta)/(2 eta^2);
  beta_phiphi = (3 eta^5 - 5 eta^3 + eta)/[6(1 - eta^2)^2];
  gamma_ss = (eta^4 - 2 eta^2 + 2)/[4 eta^2 (1 - eta^2)^2] - tanh^-1(eta)/(2 eta^3);
  gamma_sphi = gamma_phis = (eta^6 - 2 eta^4 + eta^2 + 3)/[36 eta^2 (1 - eta^2)^2] - tanh^-1(eta)/(12 eta^3);
  gamma_phiphi = (10 eta^4 - 21 eta^2 + 12)/[36(1 - eta^2)^2]
inputs:
  eta: {quantity: large_bending_parameter, unit: dimensionless}
outputs:
  a_ss: {quantity: stretching_coefficient, unit: dimensionless}
  a_sphi: {quantity: stretching_coefficient, unit: dimensionless}
  a_phiphi: {quantity: stretching_coefficient, unit: dimensionless}
  b_ss: {quantity: mixed_coefficient, unit: dimensionless}
  b_sphi: {quantity: mixed_coefficient, unit: dimensionless}
  b_phis: {quantity: mixed_coefficient, unit: dimensionless}
  b_phiphi: {quantity: mixed_coefficient, unit: dimensionless}
  g_ss: {quantity: bending_coefficient, unit: dimensionless}
  g_sphi: {quantity: bending_coefficient, unit: dimensionless}
  g_phiphi: {quantity: bending_coefficient, unit: dimensionless}
settings: {}
