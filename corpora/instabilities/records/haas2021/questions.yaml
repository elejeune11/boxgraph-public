- id: q_no_validation_trushko2020
  kind: choice
  about: [volvox_invagination, classical_moduli, eta_eq59, energy_eq63, energy_eq67_classical]
  text: >-
    Cross-validation with trushko2020 finds nothing to validate, in either direction, and neither paper
    cites the other. No model here predicts a trushko2020 measurement. Those measurements are capsule
    Young moduli, thicknesses, radii and pressures, spring constants of empty and lined capsules,
    buckling pressures, fold depths, opening angles and counts, cell numbers and fluorescence. This
    record's models give nondimensional shell-energy coefficients, energy densities, eta, a
    volume-conservation region and E = 3C, and the Volvox BVP cannot be run (q_volvox_not_rerun). None
    takes a confined monolayer, a pressure or an indentation as input. classical_moduli maps E and h to
    stretching and bending moduli. trushko2020 only derives those moduli and does not measure them, so
    no measurement is tested. The other direction fails too: this record holds no measured data for
    trushko2020's ring models to predict. See trushko2020/q_no_validation_haas2021.
  citation: {none: "neither paper cites the other; the finding rests on the two records' models and data"}
