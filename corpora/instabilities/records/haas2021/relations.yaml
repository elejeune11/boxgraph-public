#
# Against trushko2020 (Trushko et al., Dev. Cell 2020): neither paper cites the other, and no datum of either record
# takes a value from the other, so no cited.yaml line is added. The two papers' models describe different systems:
# haas2021's morphoelastic energies (energy_eq63, energy_eq67_classical, volvox_invagination, ...) are for a cell
# sheet bending under changes of its intrinsic stretches and curvatures, with no confinement and no pressure;
# trushko2020's ring models (critical_strain_s21, pbuckling_eq1, fold_*) are for an epithelium growing against a
# one-sided confining capsule, set by K/(lambda R^2) and the capsule pressure, which haas2021 has no counterpart for.
# No substitution of inputs turns one into the other, so no relation between them is proposed.
# Both papers use the thin Hookean plate moduli E h/(1 - nu^2) and E h^3/[12(1 - nu^2)] (haas2021 p. 11,
# classical_moduli; trushko2020 p. 37, capsule_compressional_rigidity and capsule_bending_rigidity). That is not
# entered either: haas2021/classical_moduli gives them nondimensionally (stretch_coeff in units of C (eps h), and the
# bending modulus as the divisor 12(1 - nu^2)/E of C (eps h)^3), so its outputs are dimensionless while trushko2020's
# are in uN/um and uN*um, and a mapping of inputs cannot make the outputs commensurable (the test reports a unit
# error). The shared plate-bending formula is already related through trushko2020/rel_plate_bending_same_as_capsule_rigidity
# (cerda2003). The formulas would join only forms in any case: haas2021's E is that of the Volvox cell sheet,
# trushko2020's that of the alginate shell.
