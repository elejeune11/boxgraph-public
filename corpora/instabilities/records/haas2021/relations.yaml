#
# Relations to haas2015 (ref-8). Sec. II C 2 (p. 11): the classical energy density (67) "has the same structure
# as the elastic energy densities used in the models referenced in the Introduction" [7,8,11-13], and (p. 11) it
# is "the energy density of a thin Hookean shell ... with Poisson's ratio nu = 1/2 ... and elastic modulus E = 3C".
# haas2015's Hookean energy (2.4) is tested through its density, haas2015/energy_density_eq24, as nu -> 1/2.
# Mapping: E = 3C; the shell thickness h/R of haas2015 is eps h of haas2021, taken here as eps = h/R, h = 1;
# haas2021's strains are scaled by eps (Eq. 60: eps Es = (f_s - f_s0)/f_s0), so Es_2021 = Es_2015/(h/R); the
# curvature strains (Eq. 62) are taken equal. The paper adds that the strain definitions themselves differ
# (Eqs. 60, 62 carry factors of f_s0, f_phi0 that haas2015's Eqs. 2.2, 2.3 lack): the mapping of strain to strain
# holds as written only where the intrinsic stretches are 1. That difference is not part of the test.
# Not entered: the full Volvox invagination problems (haas2015/shell_bifurcation, haas2021/volvox_invagination),
# which p. 14 says show "qualitatively identical bifurcation behavior" with "quantitative differences" (Ref. [8]
# for the classical theory). Neither runs, their inputs do not correspond (haas2015 contracts the posterior
# through r_p, haas2021 through the intrinsic stretch f_p; haas2015's output is k R, haas2021's is d), so no
# mapping can be written. Both take the relative thickness 0.15 and nu = 1/2 (haas2021: incompressible).
- id: rel_eq24_to_eq67
  kind: reduces_to
  a: haas2015/energy_density_eq24
  b: haas2021/energy_eq67_classical
  mapping: &hookean_map {C: "Em/3", eps: "h", h: "1", Es: "Es/h", Ephi: "Ephi/h", Ks: "Ks", Kphi: "Kphi"}
  output_map: {e0: e}
  limit: {nu: "0.5"}
  regime: &hookean_regime {Em: [0.5, 3.0], h: [0.05, 0.3], nu: [0.3, 0.5], Es: [-0.2, 0.2], Ephi: [-0.2, 0.2], Ks: [-3.0, 3.0], Kphi: [-3.0, 3.0]}
  provenance: stated
  citation: {page: 11, printed_page: "022411-11", quote: "The energy density in Eq. (67) has the same structure", where: "Sec. II C 2; Eq. 67"}
- id: rel_eq24_stretch_to_eq69a
  kind: reduces_to
  a: haas2015/energy_density_eq24
  b: haas2021/energy_eq67_classical
  mapping: *hookean_map
  output_map: {e0_stretch: e_stretch}
  limit: {nu: "0.5"}
  regime: *hookean_regime
  provenance: stated
  citation: {page: 11, printed_page: "022411-11", quote: "In this classical theory, the same stretching modulus", where: "Eq. 69a; text after Eq. 69"}
- id: rel_eq24_bend_to_eq69b
