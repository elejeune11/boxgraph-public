# Figure readings (figure pass, 2026-11-18). Shared reading code: figures/_shyer.py.
# Figs. 4B and 6C are raster images in the PDF (JPEG-like, about 300 dpi in the source); they are
# rendered at 1200 dpi so that one pixel is small against the axis; the source resolution, not the
# rendering, limits the precision (carried in each interval).

# ---- Figs. 2B, 2D, 3A, 3C, 3D: spreadsheet-style panels with thick gray axes --------------
# Categories (DMSO, AG1295, FK506) are numbered 1, 2, 3 on the x axis (quantity culture_condition).
- id: f2b_ratio
  page: 2
  where: "Fig. 2B"
  what: "the five light-blue bars (circumferential compression ratio, E8 to E12), read on the left axis labels; outline-hidden error bars"
  dpi: 1200
  crop: [6100, 2800, 9400, 4900]
  x: {quantity: embryonic_age, unit: day}
  y: {quantity: compression_ratio_circumferential, unit: dimensionless}
  mode: code
  code: figures/f2b_ratio.py
  at: ["8", "9", "10", "11", "12"]
  error_bars: sd
  error_bars_citation: {page: 2, quote: "n > 3 for all culture experiments; error bars represent one SD"}
