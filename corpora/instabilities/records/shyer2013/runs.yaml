- id: run_factor_E15
  model: inverse_ratio
  inputs: {ratio: culture_length_ratio_E15}
  outputs: {factor: factor_E15_computed}
- id: run_nominal_endoderm
  model: nominal_compression
  inputs: {g_w: we_over_W, g_l: le_over_L}
  outputs: {r_w: ratio_e_circ_computed, r_l: ratio_e_long_computed}
- id: run_nominal_mesenchyme
  model: nominal_compression
  inputs: {g_w: wm_over_W, g_l: lm_over_L}
  outputs: {r_w: ratio_m_circ_computed, r_l: ratio_m_long_computed}
- id: run_spots_linear
  model: spot_growth
  inputs: {t: t_end, n_spots: n_spots_added, we_over_W: we_over_W, le_over_L: le_over_L, W_over_hsum: zigzag_spacing_sm, hm_over_he: hm_over_he_zigzag}
  settings: {expansion: linear}
  outputs: {diameter: spot_diameter_computed, growth: spot_growth_linear_computed, area_change: area_change_linear_computed}
  note: "Reading of 'relative expansion' as an in-plane stretch of lengths."
- id: run_spots_areal
  model: spot_growth
  inputs: {t: t_end, n_spots: n_spots_added, we_over_W: we_over_W, le_over_L: le_over_L, W_over_hsum: zigzag_spacing_sm, hm_over_he: hm_over_he_zigzag}
  settings: {expansion: areal}
  outputs: {diameter: spot_diameter_areal_computed, growth: spot_growth_areal_computed, area_change: area_change_areal_computed}
  note: "Reading of 'relative expansion' as a factor on the area element."
