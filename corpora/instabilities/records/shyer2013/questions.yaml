- id: q_no_validation_bowden1998
  kind: choice
  about: [spacing_fig4b, spacing_fig6c, mu_endo_fig4b, mu_mes_fig4b, mu_ratio_fig4b, fe_luminal_patterns, bowden1998/wavelength_eq3]
  text: >-
    (Cross-validation against bowden1998, job 2026-11-18.) No validation was entered in either direction.
    This paper cites bowden1998 (ref. 15) only for the qualitative zigzag pattern of a biaxially compressed
    film on a substrate (p. 3). Its fold spacings over endoderm thickness are curves against embryonic age.
    bowden1998's Eq. 3 has no age input, and it takes Young's moduli where this paper measures shear moduli.
    Eq. 3 is also an onset law for a half-space, while here the mesenchyme is finite and muscle-confined,
    with a wavelength "comparable to the thickness of the endoderm-mesenchyme composite" (p. 5). No model
    of this record gives bowden1998's measured wavelengths or depths of metal films on PDMS. See
    bowden1998/q_no_validation_shyer2013.
  citation: {page: 3, quote: "may take on a zigzag topography when it is com", where: text}
- id: q_no_validation_cerda2003
  kind: choice
  about: [spacing_fig4b, spacing_fig6c, mu_ratio_fig4b, mu_ratio_fig6c, fe_luminal_patterns, cerda2003/deep_substrate_wavelength, cerda2003/shallow_substrate_wavelength]
  text: >-
    (Cross-validation against cerda2003, job 2026-11-18.) No validation was entered in either direction.
    Neither paper cites the other. The fold spacings over endoderm thickness here (Figs. 4B, 6C) are curves
    against embryonic age, and cerda2003's substrate laws have no age input. The moduli are measured only at
    E8 and E10 (chick) and E14.5 (mouse). The gut is in neither of cerda2003's limits: the deep-substrate law
    needs lambda << Hs and the shallow-substrate law Hs >> t. Here the mesenchyme is a few endoderm
    thicknesses thick and confined by muscle, and the wavelength is "comparable to the thickness of the
    endoderm-mesenchyme composite" (p. 5). The spacings are also those of folds far past onset. No model of
    this record gives cerda2003's measurements (a stretched plastic sheet, skin). See
    cerda2003/q_no_validation_shyer2013.
  citation: {page: 5, printed_page: "216", quote: "with a wavelength and amplitude comparable to", where: text}
- id: q_no_validation_huang2005
  kind: choice
  about: [spacing_fig4b, spacing_fig6c, mu_ratio_fig4b, mu_ratio_fig6c, stressfree_fig4b, fe_luminal_patterns, huang2005/sinusoidal_finite_substrate, huang2005/thick_substrate_eq17]
  text: >-
    (Cross-validation against huang2005, job 2026-11-18.) No validation was entered in either direction.
    Neither paper cites the other, and huang2005 prints no measurements for a model here to predict.
    huang2005's film on a finite substrate over a rigid support (Eqs. 10, 13) is the nearest analogue of an
    endoderm on mesenchyme confined by the stiffer muscle, but the measured fold spacings over endoderm
