    far past onset, at modulus ratios 1.5-13, in a thin mesenchyme confined by muscle: not the quantity any
    of those models returns. See wang2015/q_no_validation_shyer2013.
  citation: {page: 5, printed_page: "216", quote: "with a wavelength and amplitude comparable to", where: text}
- id: q_no_validation_trushko2020
  kind: choice
  about: [fe_luminal_patterns, stressfree_chick, stressfree_mouse, spacing_fig4b, spacing_fig6c]
  text: >-
    No cross-validation with trushko2020 was added, in either direction. trushko2020 cites this paper
    only qualitatively (villi compatible with buckling, confined by smooth muscle) and compares none of
    its models with these data. This record's runnable models are the gut simulation's stress-free
    layer schedules, ratio arithmetic on the gut's own measurements and the spot growth field. None
    returns a buckling pressure, capsule spring constant, fold opening angle or fold count of a
    monolayer in an alginate shell, and the FE model that produces fold patterns cannot be run.
    trushko2020's confined-ring models have no foundation and take the fold count as an input, so they
    do not give this record's fold spacing over endoderm thickness or compression ratios. See
    trushko2020/q_no_validation_shyer2013.
- id: q_no_validation_savin2011
  kind: choice
  about: [fe_luminal_patterns, stressfree_chick, stressfree_mouse, modulus_ratio_curve, mu_endo_fig4b, mu_mes_fig4b, spacing_fig4b, spacing_fig6c, circ_ratio_fig2b, savin2011/wavelength_eq3, savin2011/radius_eq4, savin2011/loop_number, savin2011/lam_obs_chE12]
  text: >-
    (Cross-validation against savin2011, this paper's ref. 30; job 2026-11-19.) No validation was entered in
    either direction. This paper cites savin2011 only as the authors' "previous work" on macroscopic gut
    looping, whose "same physical principles" (geometry, differential growth, tissue mechanics) it says
    also drive luminal patterning (p. 7). It compares none of its numbers with savin2011's. (1) savin2011's
    models against these measurements: its runnable models give the loop wavelength, loop radius and loop
    number of the whole tube held by the mesentery (Eqs. 1-4, Lt/n = lambda), the tube's bending stiffness
    from force-extension, magnet forces and growth rates from mitoses. None returns a fold spacing over
    endoderm thickness, a circumferential or longitudinal compression ratio, a layer circumference or a
    shear modulus of endoderm or mesenchyme, which are what is measured here (Figs. 2-4, 6). Eq. 3 is a
    rod-on-sheet law with inputs (tube modulus, tube radii, mesentery modulus and thickness, mismatch
    strain) that are not measured here, and the luminal folds are a layered tube confined by muscle, not a
    rod held by a sheet. (2) This record's models against savin2011's measurements: they are the
    stress-free layer schedules of the luminal simulations, ratio arithmetic on this paper's own data, the
    spot growth field and two not-runnable finite-element codes. None gives a loop wavelength, radius or
    number, a tube bending stiffness or a mesentery stress. See savin2011/q_no_validation_shyer2013.
  citation: {page: 7, printed_page: "218", quote: "basis for the diversity of macroscopic looping", where: text}
