  citation: {page: 5, printed_page: "216", quote: "with a wavelength and amplitude comparable to", where: text}

- id: q_no_validation_shyer2015
  kind: choice
  about: [fe_luminal_patterns, stressfree_mouse, spacing_fig6c, mu_endo_fig6c, mu_mes_fig6c, mu_ratio_fig6c, circ_ratio_fig2b, culture_circ_ratio_fig2d, shyer2015/shh_diffusion_reaction, shyer2015/k_range_span, shyer2015/edu_control_fig4c, shyer2015/shh_box_e15_fig5d]
  text: >-
    (Cross-validation against shyer2015, job 2026-11-18.) No validation was entered in either direction.
    shyer2015 cites this paper only for qualitative claims (the folds are buckled by muscle compression,
    in mouse as in chick) and for the fold aspect ratios behind its not-runnable diffusion simulation; it
    compares none of its numbers with this paper. Its measurements are Lgr5 mRNA counts, percent
    EdU-positive cells and Shh staining intensities, which no model here returns, and it prints no modulus,
    thickness, wavelength, curvature or villus spacing that stressfree_mouse or the mouse results of Fig. 6C
    could be set against. Its two models (a count of decades of a degradation-rate range, and a
    not-runnable diffusion-reaction solve returning a concentration) do not give any quantity measured
    here. See shyer2015/q_no_validation_shyer2013.
- id: q_no_validation_tallinen2015
  kind: choice
  about: [spacing_fig4b, spacing_fig6c, mu_ratio_fig4b, mu_ratio_fig6c, fe_luminal_patterns, tallinen2015/first_unstable_mode, tallinen2015/mode_wavelength_h, tallinen2015/fe_folding]
  text: >-
    (Cross-validation against tallinen2015, job 2026-11-18.) No validation was entered in either direction.
    tallinen2015 cites this paper (its ref. 3) only qualitatively: its far-from-threshold fold width of
    about four undeformed layer thicknesses (finite elements, not runnable) "agrees with" gut folding, and
    the gut's narrow sawtooth folds reflect a stiff epithelium. Its runnable models give the wavelength at
    linear onset of a layer on a half-space (over the bonded or relaxed layer thickness) as a function of
    the modulus ratio. The fold spacings here (Figs. 4B, 6C) are measured along the endoderm over its
    deformed thickness, far past onset, in a finite mesenchyme confined by muscle, and are curves against
    embryonic age with the modulus ratio measured only at E8, E10 (chick) and E14.5 (mouse). They are not
    the quantity those models return. This record's models (stress-free schedules, ratio arithmetic, the
    not-runnable finite-element code) give no quantity tallinen2015 measures, and it measures nothing. See
    tallinen2015/q_no_validation_shyer2013.
  citation: {page: 5, printed_page: "216", quote: "with a wavelength and amplitude comparable to", where: text}
- id: q_no_validation_wang2015
  kind: choice
  about: [spacing_fig4b, spacing_fig6c, mu_ratio_fig4b, mu_ratio_fig6c, circ_ratio_E8_E12, fe_luminal_patterns, stressfree_chick, stressfree_mouse, spot_growth, wang2015/eq8_initial_wrinkle_wavelength, wang2015/eq7_crease_wavelength, wang2015/eq4_wrinkle_onset, wang2015/crease_onset_measured, wang2015/wrinkle_wavelength_fig5a]
  text: >-
    (Cross-validation against wang2015, which cites this paper as its ref. 16; job 2026-11-18.) No
    validation was entered in either direction. (1) This record's models against wang2015's measurements:
    wang2015 measures, on Ecoflex substrates with Sylgard, rubber, LDPE and Kapton films, the onset
    mismatch strains of creases, folds, period-doubles and ridges, and the wavelengths and amplitudes of
