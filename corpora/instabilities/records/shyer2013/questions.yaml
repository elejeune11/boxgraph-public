- id: q_fig2b_ratio_axis
  kind: reading
  about: [circ_ratio_fig2b, f2b_ratio, cmp_mean_fig2b, circ_ratio_E8_E12]
  text: >
    The bars of Fig. 2B (compression ratio) are drawn against a right axis labelled 'ratio muscle/mes.'
    that carries tick marks but no numbers; the record reads them on the labelled left axis
    (circum., mm), whose ticks sit on the same rows. Read so, the five bars average 0.571 against the
    text's 'consistently averages to 0.55' (cmp_mean_fig2b, not reproduced), while the measured
    circumferential ratios of Fig. 4B (bottom left), E8-E12, average 0.551 (cmp_mean_fig4b,
    reproduced). Either the bars sit on an unlabelled right scale that is not the left one, or the two
    figures plot different sets of measurements of the same ratio.
  citation: {page: 2, where: "Fig. 2B caption", quote: "with the compression ratio (bar graph)"}
- id: q_stressfree_fig6c
  kind: unexplained_difference
  about: [stressfree_mouse, stressfree_fig6c, cmp_stressfree_fig6c]
  text: >
    The dotted line of Fig. 6C (middle), 'the stress-free thickness of the endoderm-mesenchyme
    composite', read at E12.5 to E15.5, runs from 2.28 to 3.02 in units of he. The SM's printed mouse
    schedule gives (he + hm)/he = (0.4666 - 0.1666t)/(0.2 - 0.1t): 2.333 at t = 0 and 3.0 at t = 1,
    with 2.47 and 2.67 at E13.5 and E14.5 for t linear in day. The end values agree within about 2%,
    but the plotted line is lower in between (about 0.1 at E13.5-E14.5, beyond the reading's interval)
    and also slightly below at E12.5, where no mapping of t to day can matter (t = 0). The chick
    dotted line of Fig. 4B is flat at 4.0 as the chick schedule gives. Whether the mouse line was drawn
    from another version of the schedule, or a nonlinear t(day), is not stated.
  citation: {page: 6, where: "Fig. 6C caption", quote: "Dotted line is the stress-free thickness of the endoderm-mesenchyme composite"}
