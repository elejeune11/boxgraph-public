- id: q_spot_expansion_reading
  kind: reading
  about: [spot_growth, cmp_spot_growth_linear, cmp_spot_growth_areal, spot_growth_printed]
  text: >
    The SM gives the 'relative expansion of a spot' as 1 + (e^-eta - 0.2)t without saying whether it
    stretches lengths or areas of the stress-free endoderm, and the main text's 'diameter doubles ...
    relative to areas of the endoderm outside the spots' does not say which diameter (the record takes
    the disc eta <= 1, diameter 6 he, which the main text's 'six times the endoderm thickness' matches).
    Both readings are run (runs run_spots_linear, run_spots_areal); only one of them can match a doubling.
    Another reading, the expansion at the centre over that far away, is not run.
  citation: {page: 15, quote: "the relative expansion of a spot is given by", where: "SM, zigzag simulation"}
- id: q_area_conservation
  kind: unexplained_difference
  about: [spot_growth, cmp_area_linear, cmp_area_areal, area_constant_printed, n_spots_added]
  text: >
    The SM says the expansion field 'keeps the total stress-free area of the endoderm approximately
    constant'. With the stress-free endoderm sheet of one domain (we = 2W, le = 2L, W ≈ L = 2.0(he + hm),
    he = hm/2) and the contributions of 'both spots' added, the computed area change under either
    reading of the expansion is not near zero; with a single spot per domain (the alternative of
    n_spots_added) and the areal reading it nearly is. Either the domain holds one spot's worth of
    expansion, or the sheet is larger than these printed dimensions give, or the claim is loose. The
    reading that makes the spot diameter double (linear) is not the one that conserves area (areal).
  citation: {page: 15, quote: "This form of expansion keeps the total stress-free area", where: "SM, zigzag simulation"}
- id: q_fe_not_runnable
  kind: unstated_model
  about: [fe_luminal_patterns, zigzag_spacing_sm, zigzag_spacing_main]
  text: >
    The luminal patterns (ridge and zigzag spacings, compression ratios and circumferences of Figs. 4B and
    6C, the zigzag period 2.0(he + hm), the villus-like bulges) all come from a custom finite-element code
    that is not published; it cannot be rerun here (see the model's reason). The record checks only what
    follows from the printed stress-free dimensions (models stressfree_chick, stressfree_mouse) and the
    printed zigzag-simulation inputs.
- id: q_modulus_fit_not_runnable
  kind: unstated_model
  about: [fe_modulus_fit, modulus_increase_292]
  text: >
    The shear moduli come from ABAQUS simulations of a ring compressed between two planes, fitted to
    force-displacement curves that are only plotted (Fig. S3 H-J), with ring geometries the paper does not
    print. The fit and the residual-stress test (about 15% increase at an opening angle of 292.1 degrees)
    cannot be rerun, so the moduli and that increase are recorded without a run.
  citation: {page: 11, quote: "The extraction of the shear modulus of the stiff layer from experimental data is", where: "SM"}
- id: q_t_to_day
  kind: choice
  about: [stressfree_chick, stressfree_mouse]
  text: >
    The SM ties t = 0 and t = 1 to E7 and E14 (chick) and E12.5 and E15.5 (mouse) and says D grows
    linearly in t, but not how t maps to embryonic day in between. The record takes t linear in day.
    Only the outputs at intermediate days (e.g. E13) depend on this choice; the composite-to-endoderm
    thickness ratio of the chick schedule does not depend on t at all.
  citation: {page: 14, quote: "corresponding to real time going from E7 to E14", where: "SM, chick simulation"}
- id: q_modulus_ratio_values
  kind: choice
  about: [modulus_ratio_chick_sim, modulus_ratio_chick_text, cmp_modulus_ratio_chick]
  text: >
    The chick simulations use mu_e/mu_m = 12 ('we neglect the small difference in the measured modulus
    between E8 and E10'), the main text says the endoderm is 'about 10 times' (p. 5) and 'more than 10
    times' (p. 7) stiffer, and the snake simulations of Fig. S10 take 10. The measured ratios at E8 and E10
    are only plotted (Fig. 4B, bottom right) and are left to the figure pass.
- id: q_damping_units
  kind: reading
  about: [fe_luminal_patterns]
  text: >
    The SM prints the time step as dt = 0.1 a / sqrt(K), the node mass m = a^3 and the damping
    gamma = 10 m. In the scheme v(t + dt) = v(t) + (f - gamma v) dt / m, gamma must have units of mass per
    time; '10 m' is a mass, so the code presumably works in units where time (or density) is scaled to
    one. The settings are recorded as printed.
  citation: {page: 13, quote: "is the time step", where: "SM, explicit scheme"}
- id: q_plotted_measurements
  kind: reading
  about: [circ_ratio_E8_E12, long_ratio_E14, modulus_ratio_chick_text, modulus_ratio_mouse_text]
  text: >
    The measured shear moduli (Figs. 4B, 6C, S3), layer circumferences and thicknesses, fold spacings
    scaled by endoderm thickness (Figs. 4B, 6C), and the compression ratios and lengths of Figs. 2B, 2D, 3A,
    3C, 3D are printed only as plots with error bars (one SD). They are the inputs and validations the
    corpus's wrinkling laws need, and the dashed simulation curves of Figs. 4B and 6C are what the
    stressfree_* models and fe_luminal_patterns predict; none was read in this pass (figure rendering was
    not available to the job). A figure pass should read them.
- id: q_circ_ratio_sim_vs_measured
  kind: unexplained_difference
  about: [stressfree_chick, circ_ratio_E8_E12]
  text: >
    (Audit.) The SM says the stress-free dimensions 'are chosen so as to approximately yield the
    observed cross-sectional geometries and expansion ratios of separated mesenchyme-endoderm
    composite'. The chick schedule keeps the mesenchyme's stress-free circumferential width at
    wm = 1.5 pi D from E7 to E14, so the tube circumference over it is 1/1.5 throughout, whereas the
    measured circumferential stretch ratio of the separated composite is 0.55 at E8-E12 (p. 2), which
    would need wm of about 1.8 pi D. The record does not compare them because the model output
    (nominal ratio of a flat stress-free sheet) and the measurement (inner muscle circumference over
    outer circumference of the unfolded composite) are entered as different quantities; whether they
    measure the same thing, and so whether the schedule matches the measured ratio, is open.
  citation: {page: 14, quote: "chosen so as to approximately yield the", where: "SM, tube simulations"}
- id: q_zigzag_ratios_source
  kind: reading
  about: [ratio_e_circ_printed, ratio_m_circ_printed, ratio_e_long_printed, ratio_m_long_printed]
  text: >
    (Audit.) The main text gives the zigzag simulation's initial nominal compression ratios, 0.5 for the
    endoderm and 0.6 for the mesenchyme 'in both lateral directions, as measured experimentally
    (Fig. 3A)'. Fig. 3A plots one longitudinal ratio per stage for the mesenchyme with attached endoderm
    (about 0.75, 0.69, 0.55 at E13-E15); it gives no separate endoderm ratio and no circumferential ratio
    (that is Fig. 2B, 0.55). Which measurement the endoderm's 0.5 comes from is not stated.
  citation: {page: 5, printed_page: "216", quote: "tions, as measured experimentally (Fig. 3A)", where: text}
- id: q_figS7_panel
  kind: possible_error
  about: [fe_luminal_patterns]
  text: >
    (Audit.) The caption of Fig. S7 says the mean endoderm circumference Se 'is plotted in Figs. 4A and
