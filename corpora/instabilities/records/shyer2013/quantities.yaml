- id: embryonic_age
  name: embryonic age
  dimension: "[time]"
  description: "Days past fertilization (chick E-number, mouse E-number), e.g. E14 = 14 day."
- id: parameterized_time
  name: parameterized simulation time
  dimension: dimensionless
  description: "t in [0, 1], the parameter of growth in the simulations (SM pp. 14-15)."
- id: compression_ratio_circumferential
  name: measured circumferential compression (stretch) ratio of the endoderm-mesenchyme composite
  dimension: dimensionless
  description: "Inner circumference of the (once attached) circular muscle layer over the outer circumference of the surgically separated mesenchyme and endoderm (p. 2, Fig. 2B)."
- id: compression_ratio_longitudinal
  name: measured longitudinal compression ratio of the endoderm-mesenchyme composite
  dimension: dimensionless
  description: "Length of the separated muscle over the length of the separated mesenchyme and attached endoderm (p. 3, Fig. 3A)."
- id: culture_circumference_ratio
  name: circumference ratio of cultured guts with and without circular muscle
  dimension: dimensionless
  description: "Inner circumference of the circular muscle of control cultured segments over the outer circumference of segments cultured with a muscle-blocking drug (p. 2, Fig. 2D)."
- id: culture_length_ratio
  name: length ratio of cultured guts with and without longitudinal muscle
  dimension: dimensionless
  description: "Length of control cultured gut segments over the length of segments cultured with a muscle-blocking drug (pp. 3-4, Figs. 3C, 3D)."
- id: compression_factor_longitudinal
  name: factor by which a longitudinal muscle layer compresses the composite
  dimension: dimensionless
  description: "The paper's 'compressed ... by a factor of about 1.5': the reciprocal of a length ratio (pp. 3-4)."
- id: stressfree_over_constrained_circumferential
  name: stress-free circumferential width of a simulated layer over its constrained width
  dimension: dimensionless
  description: "e.g. we/W, wm/W in the planar zigzag simulation (SM p. 15): the circumferential growth ratio of a layer."
- id: stressfree_over_constrained_longitudinal
  name: stress-free longitudinal length of a simulated layer over its constrained length
  dimension: dimensionless
  description: "e.g. le/L, lm/L in the planar zigzag simulation (SM p. 15): the longitudinal growth ratio of a layer."
- id: nominal_compression_ratio_circumferential
  name: nominal circumferential compression ratio of a simulated layer
  dimension: dimensionless
  description: "Constrained circumferential size (domain width W, or tube circumference pi D) over the layer's stress-free circumferential width; the main text's 'nominal compression ratio' (p. 5)."
- id: nominal_compression_ratio_longitudinal
  name: nominal longitudinal compression ratio of a simulated layer
  dimension: dimensionless
  description: "Constrained longitudinal size (domain length L) over the layer's stress-free longitudinal length."
- id: modulus_ratio
  name: endoderm-to-mesenchyme shear modulus ratio
  dimension: dimensionless
  description: "mu_e/mu_m, shear modulus of the endoderm (the stiff surface layer) over that of the mesenchyme (the substrate beneath it)."
- id: thickness_ratio_mesenchyme_to_endoderm
  name: stress-free thickness of the mesenchyme over that of the endoderm
  dimension: dimensionless
  description: "hm/he in the simulations."
- id: thickness_ratio_composite_to_endoderm
  name: stress-free thickness of the endoderm-mesenchyme composite over that of the endoderm
  dimension: dimensionless
  description: "(he + hm)/he, the stress-free composite thickness in units of the endoderm thickness (the thin dashed line of Fig. 4B, top right, and the dotted line of Fig. 6C, middle)."
- id: zigzag_spacing_over_composite_thickness
  name: zigzag spacing relative to the composite thickness
  dimension: dimensionless
  description: "Lateral period of the zigzag pattern (W or L of the energy-minimizing domain) over the stress-free thickness he + hm of the endoderm-mesenchyme composite (p. 5, SM p. 15)."
- id: spot_diameter_over_endoderm_thickness
  name: diameter of a growing endoderm spot relative to the endoderm thickness
  dimension: dimensionless
  description: "Lateral diameter of a spot of enhanced growth in the zigzag simulation, in units of the stress-free endoderm thickness he (p. 5)."
- id: spot_diameter_growth_ratio
  name: growth of a spot's diameter relative to the endoderm outside the spots
  dimension: dimensionless
  description: "Stress-free diameter of a spot at the end of the growth step over the stress-free diameter the same material would have outside the spots (p. 5: 'until their diameter doubles ... relative to areas of the endoderm outside the spots')."
- id: endoderm_area_change
  name: relative change of the total stress-free endoderm area during spot growth
  dimension: dimensionless
  description: "(A(t) - A(0))/A(0) for the stress-free area of the endoderm in the zigzag simulation domain (SM p. 15)."
- id: number_of_spots
  name: number of growing spots per simulation domain
  dimension: dimensionless
  description: "Spots of enhanced endoderm growth in one periodic zigzag simulation domain."
- id: tube_diameter_growth_factor
  name: growth factor of the constraining tube diameter over a simulation
  dimension: dimensionless
  description: "D at t = 1 over D at t = 0 (SM p. 14)."
- id: tube_inner_diameter
  name: inner diameter of a constraining silk tube
  dimension: "[length]"
  description: "Inner diameter of the porous silk tubes in which E6 gut segments were cultured (p. 3, Fig. 2F)."
- id: opening_angle
  name: opening angle of a cut tube with residual eigenstrain
  dimension: dimensionless
  description: "alpha, the angle a simulated tube opens to when cut along its axis (SM p. 12, Fig. S4)."
- id: relative_modulus_increase
  name: increase in the extracted shear modulus due to residual eigenstrain
  dimension: dimensionless
  description: "Effective shear modulus extracted with eigenstrain over that without, minus one (SM p. 12, Fig. S6)."
# added in the figure pass
- id: relative_extracted_modulus
  name: extracted shear modulus with eigenstrain over that without
  dimension: dimensionless
  description: "G/G0 of Fig. S6(b): the effective shear modulus fitted to a simulated ring with residual eigenstrain over the modulus G0 without it."
- id: endoderm_circumference
  name: mean circumference of the endoderm
  dimension: "[length]"
  description: "Se, the circumference of the mid-line of the endoderm in a transverse section (Fig. S7), measured or simulated (Figs. 4B, 6C)."
- id: muscle_inner_circumference
  name: inner circumference of the circular muscle layer
  dimension: "[length]"
  description: "Circumference of the inner boundary of the muscle in a transverse section (Figs. 2B, 4B, 6C); in the simulations the constraining tube's circumference pi D."
- id: composite_outer_circumference
  name: outer circumference of the separated mesenchyme and endoderm
  dimension: "[length]"
  description: "Outer circumference of the mesenchyme-endoderm composite after surgical removal of the muscle, unfolded (Fig. 2B, blue)."
- id: fold_spacing_over_endoderm_thickness
  name: spacing of luminal folds over the endoderm thickness
  dimension: dimensionless
  description: "lambda/he: the spacing of folds measured along the endoderm over the (deformed) endoderm thickness (Figs. 4B, 6C)."
- id: shear_modulus_endoderm
  name: shear modulus of the endoderm
  dimension: "[mass]/[length]/[time]**2"
  description: "mu_e, extracted from ring-compression tests by finite-element fitting (SM pp. 11-12)."
- id: shear_modulus_mesenchyme
  name: shear modulus of the mesenchyme
  dimension: "[mass]/[length]/[time]**2"
  description: "mu_m, extracted from ring-compression tests of the composite by finite-element fitting (SM pp. 11-12)."
- id: culture_condition
  name: culture condition (category)
  dimension: dimensionless
  description: "Category position on the bar charts of Figs. 2D, 3C, 3D: 1 DMSO (vehicle control), 2 AG1295, 3 FK506."
- id: compression_displacement
  name: compressive displacement of the plate in a ring-compression test
  dimension: "[length]"
  description: "u, the downward displacement of the rigid plane (Figs. S3, S5, S6)."
- id: reaction_force
  name: reaction force on the compressing plane
  dimension: "[force]"
  description: "F, the reaction force in the ring-compression test (Figs. S3, S6(a))."
