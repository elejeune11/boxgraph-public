notes: >
  PDF pages 1-7 are the article and its references (p. 7 also carries the start of an unrelated
  report), p. 8 the journal's summary page, pp. 9-26 the Supplementary Materials (methods, the
  modulus measurement, the finite-element model, Figs. S1-S11, movie captions).
  The paper's quantitative core is experimental (surgical separation and culture ratios, measured
  shear moduli) plus finite-element simulations by the authors' own unpublished code. No closed-form
  wrinkling or crease law is stated: the paper says ridges and zigzags arise as mechanical
  instabilities with a spacing 'comparable to the thickness of the endoderm-mesenchyme composite'.
  Entered: the measured ratios printed in the text (circumferential stretch ratio 0.55, E8-E12;
  culture ratio 0.53; longitudinal ratios about 0.75, 0.69, 0.55 at E13-E15; culture length ratios 0.66
  and 0.68 and the 'factor of about 1.5' they give, model inverse_ratio); the moduli ratios as printed
  in the text (chick about 10, mouse about 1.5) and as used in the simulations (12, 1.5; modulus_ratio is
  endoderm over mesenchyme, i.e. the stiff surface layer over the substrate, the same sense as
  tallinen2015's eta); the silk-tube diameters (380 um no ridges, 300 um ridges). Models: the
  stress-free layer schedules of the chick and mouse tube simulations as printed (stressfree_chick,
  stressfree_mouse; they give the stress-free composite-to-endoderm thickness ratio drawn as the dashed
  line of Figs. 4B and 6C, and the nominal compression ratios); the nominal compression ratios of the
  planar zigzag simulation (we = 2W, wm = 1.666W against the main text's 0.5 and 0.6); the spot
  expansion field of the villus simulation (spot_growth, against the main text's 'diameter six times
  the endoderm thickness', 'diameter doubles' and the SM's 'total area approximately constant'), run
  in two readings of 'relative expansion' (questions q_spot_expansion_reading, q_area_conservation).
  The finite-element models (the custom luminal-pattern code and the ABAQUS modulus fit) are entered
  as not runnable with their printed settings; their printed outputs (zigzag period W ≈ L =
  2.0(he + hm), about 15% modulus increase at opening angle 292.1 degrees) are recorded without runs.
  Strain convention: compression is given as nominal ratios (constrained over stress-free length,
  e.g. 0.55 circumferential), i.e. a stretch lambda in the sense of biot1963; growth in the simulations
  is a change of the stress-free state (F = A G^-1), not a crease or Biot threshold. The paper states no
  critical strain.
  Not read in this pass: every plot. Figure rendering was not available to this job, so the measured
  shear moduli, circumferences, thicknesses, fold spacings over endoderm thickness and the bar charts
  (Figs. 2B, 2D, 3A, 3C, 3D, 4B, 6C, S3 H-J, S6) and the dashed simulation curves are left to a figure
  pass (question q_plotted_measurements); those are the inputs and validations for the wrinkling laws
  of huang2005, cerda2003 and tallinen2015. Left out as feeding no model: the snake simulations of
  Fig. S10 (mesenchyme stretched by 1.5 and 2, endoderm 1.666 and 1.333, mu_e = 10 mu_m, he = hm/3),
  the opening angles of Fig. S4 other than 292.1 degrees, the tungsten cantilever (0.004 in diameter,
  4.12 in long), sample counts, drug concentrations, peristalsis counts, EdU and culture protocols,
  and the tube diameter growth factors 2.7 and 2.0 beyond recording them (the stress-free ratios do
  not depend on D). The measured 0.53 is not compared with 0.55 ('agrees closely'): both are means of
  measurements with SD error bars, and their printed digits are not their precision.
  Figure pass (2026-11-18): the plots of Figs. 2B, 2D, 3A, 3C, 3D, 4B, 6C, S6(a) and S6(b) are read by
  calibrated code (figures.yaml, figures.md); Fig. S3 H-J is left out (blurred raster). The readings
  feed bar means against the text's ratios, the stress-free schedules against the dotted lines of
  Figs. 4B and 6C, the moduli against their plotted ratio, and the mouse spacing simulation against
  its measurement.
