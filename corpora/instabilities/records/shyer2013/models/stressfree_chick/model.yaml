id: stressfree_chick
name: stress-free layer dimensions of the chick tube simulation (Fig. 4)
role: model
stated: {page: 14, quote: "taken to be: thickness he = (0.13 - 0.1t)D", where: "SM, chick simulation"}
equation: "he = (0.13 - 0.1t)D, we = (0.35 + 2.8t - 1.4t^2) pi D, le = (1 + 0.5t^2) L; hm = (0.39 - 0.3t)D, wm = 1.5 pi D, lm = (1 + 0.333t^2) L; t = 0 at E7, t = 1 at E14"
from_words: true
inputs:
  day: {quantity: embryonic_age, unit: day}
  day_start: {quantity: embryonic_age, unit: day}
  day_end: {quantity: embryonic_age, unit: day}
outputs:
  thickness_ratio: {quantity: thickness_ratio_composite_to_endoderm, unit: dimensionless, description: "(he + hm)/he"}
  r_circ_m: {quantity: nominal_compression_ratio_circumferential, unit: dimensionless, description: "pi D / wm: tube circumference over the mesenchyme's stress-free width"}
  r_long_m: {quantity: nominal_compression_ratio_longitudinal, unit: dimensionless, description: "L / lm"}
  r_circ_e: {quantity: nominal_compression_ratio_circumferential, unit: dimensionless, description: "pi D / we: tube circumference over the endoderm's stress-free width"}
  r_long_e: {quantity: nominal_compression_ratio_longitudinal, unit: dimensionless, description: "L / le"}
