- id: Hs_Hf_thin_film_limit
  quantity: thickness_ratio
  unit: dimensionless
  printed: "1000"
  basis: "The paper places 1.65 at the right end of the e_m^Uni = 0.44 contour in Fig. 3(a), whose Hs/Hf axis ends at 1000, and says the boundary is flat beyond Hs/Hf of about ten (p. 3); it does not state the Hs/Hf of the printed 1.65"
  alternatives: ["10", "100", "10000"]
  stands_for: "Hs/Hf at which the boundary value Gf/Gs = 1.65 is read"
- id: Hs_Hf_homogeneous
  quantity: thickness_ratio
  unit: dimensionless
  printed: "1"
  basis: "For Gf/Gs = 1 the bilayer is one layer and the paper gives the Biot strain without a thickness ratio; all Fig. 7(a) curves start from the same value at Gf/Gs = 1"
  alternatives: ["0.2", "1000"]
  stands_for: "Hs/Hf for the Gf/Gs = 1 case (p. 10)"
