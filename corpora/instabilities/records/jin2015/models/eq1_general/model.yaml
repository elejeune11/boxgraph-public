id: eq1_general
name: critical strain under generalized plane strain from that under plane strain, any transverse stretch (Eq. 1)
role: model
stated: {page: 3, printed_page: "061008-3", quote: "relates to the ones of plane strain conditions", where: "Eq. 1"}
equation: "1 - e_c^PE = sqrt(lambda3) (1 - e_c), for an arbitrary constant lambda3 (Sec. 2)"
inputs:
  e_pe: {quantity: wrinkle_onset_strain_plane_strain, unit: dimensionless, description: "e_c^PE, the critical strain under plane strain (lambda3 = 1)"}
  lam3: {quantity: transverse_stretch, unit: dimensionless, description: "lambda3, the constant stretch in the 3-direction"}
outputs:
  e_c: {quantity: wrinkle_onset_strain_generalized_plane_strain, unit: dimensionless, description: "e_c = 1 - lambda_c under generalized plane strain with that lambda3"}
settings: {}
stochastic: false
