id: Lm_contour
name: contour of the wrinkle wavelength at the minimal strain in the (Hs/Hf, Gf/Gs) plane (Fig. 3(b))
role: model
stated: {page: 3, printed_page: "061008-3", quote: "the nominal wave", where: "Sec. 2, Fig. 3(b)"}
equation: "L^m_wrinkle/Hf (Gf/Gs, Hs/Hf) = level, L^m/Hf = 2 pi/(K Hf) at the minimum of e_c from Eqs. B7-B15 (independent of lambda3); solved for Gf/Gs at each Hs/Hf"
inputs:
  Hs_Hf: {quantity: thickness_ratio, unit: dimensionless}
  Lm: {quantity: wrinkle_wavelength_over_film_thickness, unit: dimensionless, description: "the level of the contour"}
outputs:
  Gf_Gs: {quantity: shear_modulus_ratio, unit: dimensionless}
settings: {g_lo: 1.0, g_hi: 2000.0, g_step: 1.5, g_tol: 0.001, kh_min: 0.01, kh_max: 300.0, n_kh: 61, e_min: 0.0001, e_max: 0.75, n_e: 150, tol: 1.0e-7, n_golden: 30}
built_from: [wrinkle_eigen_plane_strain]
from_words: true
stochastic: false
