id: eq1_wrinkle_uniaxial_to_plane
name: minimal wrinkling strain under plane strain from that under uniaxial compression (Eq. 1)
role: model
stated: {page: 3, printed_page: "061008-3", quote: "relates to the ones of plane strain conditions", where: "Eq. 1"}
equation: "1 - e_m^PE = sqrt(lambda3) (1 - e_m), with lambda3 = 1/sqrt(lambda1), lambda1 = 1 - e_m (uniaxial compression condition)"
inputs:
  e_uni: {quantity: wrinkle_onset_strain_uniaxial, unit: dimensionless}
outputs:
  e_pe: {quantity: wrinkle_onset_strain_plane_strain, unit: dimensionless}
settings: {}
stochastic: false
