notes: >
  Scope: the wrinkle analysis (Appendix B, the 8 x 8 matrix of Eqs. B8-B15 for a neo-Hookean film on a
  neo-Hookean substrate of finite thickness, det A = 0), Eq. 1 relating uniaxial and plane strain critical
  strains, the boundary of equal critical strain for wrinkles and creases (Fig. 3(a), Gf/Gs = 1.65 in the
  thin-film limit), and the experimental onset strains (Sec. 5, Fig. 6, Appendix C).
  Definitions, for relating this paper to wang2014, cao2011 and cao2012: the strain is e = 1 - lambda1, a
  nominal compressive strain applied homogeneously to film and substrate together; there is no substrate
  prestretch anywhere in this paper. Plane strain has lambda3 = 1, uniaxial compression lambda3 =
  1/sqrt(lambda1). The crease onset strains are those of a homogeneous neo-Hookean material, 0.35 (plane
  strain) and 0.44 (uniaxial), taken from Ref. 39 (hong2009); wrinkles of one homogeneous layer start at the
  Biot strain 0.556 (uniaxial; 0.456 plane strain, not printed here). The boundary of equal critical strain
  is where e_m of the bilayer equals the crease strain; the paper prints only its thin-film value 1.65.
  Findings: the matrix as printed reproduces the Biot strain at Gf/Gs = 1 and Eq. 1 reproduces every pair of
  contour labels in Fig. 3(a) and the crease pair 0.44/0.35; but the printed equations put the thin-film
  boundary below the printed 1.65 (question q_boundary_165). Experimental onset strains are recorded with
  consistency checks between text, Fig. 6 caption and video descriptions (two small disagreements).
  Left out: the finite element crease results (Figs. 4 and 5: depths, energies, snapping and Maxwell
  strains, eF = 0.36 is recorded) because the ABAQUS/Riks simulations are not rerunnable; the coordinates
  of points A-F; and all figure readings. This job could not render page crops (the figure commands were
  refused), so Figs. 2, 3(a) contour positions, 3(b), 7(a)-(d) are left for a figure pass: the models
  wrinkle_eigen_uniaxial (e_m and L_m/Hf by Gf/Gs and Hs/Hf) are ready to be swept over Fig. 7 readings,
  and Fig. 2 needs a model of e_c at fixed wavelength, built from the same matrix. The von Karman circles of
  Fig. 7 come from Ref. 58 (huang2005) and are not modelled here.
  Figure pass (2026-11-19): Figs. 2, 3(a), 3(b), 4(a), 5(a)-(g) and 7(a)-(d) are now read by the
  record's own code (figures.yaml, figures/*.py; summary in figures.md). Three models were added to
  check them, all on the same Eq. B7 solver: wrinkle_ec_uniaxial (e_c at a fixed wavelength, Fig. 2),
  em_contour_uniaxial and Lm_contour (the contours of Fig. 3). Fig. 2 and Fig. 7 are reproduced. The
  plotted boundary of equal critical strain flattens at the printed 1.65, above the equations'
  contour (q_fig_boundary_flat). Fig. 5 settles the e_m at points A-F (q_fig5_branch_start).
