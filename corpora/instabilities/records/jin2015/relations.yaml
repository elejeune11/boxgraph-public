# mapping: b's input symbol -> expression in a's input symbols, numbers in each model's port units
# jin2015 works in ratios (Gf/Gs, Hs/Hf, L/Hf); bowden1998's Eq. 3 in Pa and nm. The substrate modulus is set
# to 1e6 Pa and the film thickness to 100 nm: Eq. 3's L/t depends only on Em/Ep, so the choice does not matter.
- id: rel_jin_bilayer_wavelength_to_bowden_eq3
  kind: approximated_by
  a: jin2015/wrinkle_eigen_plane_strain
  b: bowden1998/wavelength_eq3
  mapping: {Em: "1e6*Gf_Gs", Ep: "1e6", nu_m: "0.5", nu_p: "0.5", t: "100"}
  output_map: {L_over_t: Lm}
  regime: {Gf_Gs: [100, 10000], Hs_Hf: [300, 3000]}
  tolerance: 0.05
  provenance: proposed
  reason: >
    jin2015 cites bowden1998 (ref-33) only as an experiment in which wrinkles are observed (p. 1), and
    bowden1998 has no finite-substrate or finite-strain model, so neither paper states a relation. The
    proposal: jin2015's plane-strain eigenvalue problem (Eqs. B7-B15, incompressible neo-Hookean film and
    substrate) for a stiff film (Gf/Gs >> 1) on a substrate many wavelengths thick (Hs/Hf >> L/Hf) is the
    linear stiff-plate-on-half-space problem behind bowden1998's Eq. 3, whose prefactor 4.36 = 2 pi/3^(1/3).
    With both materials incompressible, Em/Ep = Gf/Gs and the Poisson factors cancel, so
    L/t = 4.36 (Gf/Gs)^(1/3). The two differ by finite-strain terms of the order of the onset strain
    (jin2015's Lm is the nominal wavelength, and its film is neo-Hookean at strain e_m), which grow as the
    substrate stiffens; the tolerance 0.05 allows about twice e_m at the stiff-substrate end of the regime
    (e_m ≈ 0.024 at Gf/Gs = 100). The regime keeps Hs/Hf at least three wavelengths so the substrate acts as
    a half-space, and Gf/Gs below 1e4 so e_m stays above jin2015's strain search floor (e_min = 1e-4).
  assumptions:
    - "film and substrate incompressible (nu = 1/2), as jin2015's neo-Hookean model takes them, so Em/Ep = Gf/Gs"
    - "a substrate of Hs/Hf >= 300 is a half-space for wrinkles with L/Hf below 100"
    - "jin2015's nominal wavelength Lm compares with Eq. 3's L/t, which makes no distinction between reference and current length"
