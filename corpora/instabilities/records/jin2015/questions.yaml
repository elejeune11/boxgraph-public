  text: >-
    (Cross-validation with biot1963; job 2026-11-19.) No validation is entered, in either direction,
    although this paper cites biot1963 (ref-26) for the strain 0.556 that e_m reaches when Gf/Gs = 1
    (em_biot_uni, a predicted value). (1) This record's models against biot1963: biot1963 holds no
    measurement (it has no figures; Table I is computed from its own equations), so there is nothing to
    predict. (2) biot1963's models against the measurements here: the measured onset strains of wrinkles
    (0.18 to 0.28) and creases (0.28 to 0.37) are of PDMS bilayers (15:1, 10:1, 7.5:1 films on a 30:1
    substrate, Hs/Hf near 30), none of them homogeneous. Biot's models treat a homogeneous half-space, give
    the critical stretch lambda, zeta, P/mu0, k and incremental moduli rather than the nominal strain
    1 - lambda measured here (a different quantity of the same dimension), and do not treat creases.
    Setting 0.556 against biot1963's uniaxial stretch 0.444 is model against model, the relation jobs' work.
    The other direction is biot1963/q_no_validation_jin2015.
