  kind: choice
  about: [wrinkle_eigen_plane_strain, wrinkle_eigen_uniaxial, equal_strain_boundary_plane_strain, equal_strain_boundary_uniaxial, q_exp_moduli, exp_crease_15to1_text, exp_crease_10to1_text, exp_wrinkle_10to1_text, exp_wrinkle_7p5to1_text, wang2014/exp_wrinkling_fig7a, wang2014/exp_creasing_fig7a, wang2014/exp_delamination_fig7a, wang2014/tension_fig13a, wang2014/adhesion_fig3_lp2, wang2014/wrinkle_linear_stability]
  text: >-
    (Cross-validation against wang2014, cited here as ref. 47; job 2026-11-19.) No validation is entered,
    in either direction. This paper says its subcritical creases explain "why in Ref. [47] the authors
    observed creases experimentally under higher Gf/Gs than the value predicted by their theory" (p. 6),
    but that explanation rests on the finite-element crease simulations (q_crease_fe), which are not a
    runnable model here, and it gives no number for wang2014's samples. (1) The models here against
    wang2014's measurements: the wrinkle analysis (Eqs. B7-B15) and the equal-strain boundaries give onset
    strains, L_m/Hf and a boundary modulus ratio. wang2014 measures none of these: its Fig. 7(a) data are
    the modulus ratios at which each experiment was run, marked with the observed mode (a categorical
    outcome, at substrate prestretch 2, which no model here includes); the rest are moduli, a thickness
    range, peel-test adhesion energies (Fig. 3) and uniaxial tension curves (Fig. 13), for which this record
    has no adhesion or constitutive model. The boundary between the observed modes (between about 1.84
    and 3.8, wang2014/q_fig7a_experiments_read) is an inference from categorical points, not a measured
    datum. (2) wang2014's wrinkle model against the onset strains measured here: it needs mu_f/mu_s,
    which this paper does not print (q_exp_moduli). wang2014's measured Sylgard moduli (2-5% crosslinker,
    6.7-155 kPa) do not cover the 15:1, 10:1 and 7.5:1 films here, which were also cured differently, so
    any ratio entered would be extrapolated and added, and the critical strain is sensitive to it. Its
    model is also plane strain with a prestretched substrate, while these experiments are uniaxial
    compression of an unprestretched bilayer. See wang2014/q_no_validation_jin2015.
