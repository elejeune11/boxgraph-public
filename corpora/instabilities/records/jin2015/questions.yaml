  kind: choice
  about: [wrinkle_eigen_uniaxial, wrinkle_eigen_plane_strain, wrinkle_ec_uniaxial, wrinkle_stretch_uniaxial, equal_strain_boundary_plane_strain, equal_strain_boundary_uniaxial, exp_wrinkle_10to1_text, exp_wrinkle_7p5to1_text, exp_crease_15to1_text, exp_crease_10to1_text, film_H_exp, substrate_H_exp, wang2015/crease_onset_measured, wang2015/fold_onset_measured, wang2015/pd_onset_measured, wang2015/ridge_onset_measured, wang2015/wrinkle_wavelength_fig5a, wang2015/amplitude_fig5b_r3p6, wang2015/eq4_wrinkle_onset, wang2015/eq7_crease_wavelength, wang2015/eq8_initial_wrinkle_wavelength]
  text: >-
    (Cross-validation with wang2015; job 2026-11-19.) No validation is entered, in either direction.
    Neither paper cites the other, and neither compares its models with the other's data. (1) The
    models here against wang2015's measurements: wang2015 measures a crease onset (~0.36, mu_f/mu_s = 0.3
    and 0.64), fold, period-double and ridge onsets (~0.33, ≈ 0.32, ≈ 0.33), and, in Fig. 5, wavelengths and
    amplitudes divided by the initial wrinkle wavelength against (1 - eM)/(1 - eC). This record's runnable
    models are the wrinkle analysis (Eqs. B7-B15, Eq. 1) and the equal-strain boundaries. They give wrinkle
    onset strains, L_m/Hf at onset and a boundary modulus ratio. They give no crease onset, because the
    crease strains 0.35 and 0.44 are constants from hong2009 and the finite element crease results cannot
    be rerun (q_crease_fe). They give no post-bifurcation mode and no wavelength ratio past onset. wang2015
    measures no wrinkle onset strain and no wavelength over film thickness. (2) wang2015's models against
    the onset strains measured here: Eq. 4 gives eC_wrinkle, a plane strain mismatch strain with an unstrained
    substrate, from mu_f/mu_s. The strains here are uniaxial compression (lambda3 = 1/sqrt(lambda1)) of
    film and substrate together, so the quantities differ. Eq. 4 would also need mu_f/mu_s, which this
    paper does not print (q_exp_moduli). wang2015's Sylgard range (3.1 kPa to 1.4 MPa, set by cross-linker
    fraction) is not mapped to mixing ratios, so any ratio would be added, and the onset strain is sensitive
    to it. Eqs. 7 and 8 give wavelengths over film thickness, which is not measured here. Setting
    wang2015's Eq. 4 and its triple point (1.3) against the wrinkle analysis and the boundary 1.65 here is
    a relation between models, not a validation. The other direction is wang2015/q_no_validation_jin2015.
  citation: {page: 7, printed_page: "061008-7", quote: "by changing the mass ratio of base to crosslinker", where: text}
