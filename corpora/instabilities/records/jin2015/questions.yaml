- id: q_eigen_scheme
  kind: choice
  about: [wrinkle_eigen_plane_strain, wrinkle_eigen_uniaxial, equal_strain_boundary_plane_strain, equal_strain_boundary_uniaxial]
  text: >
    The paper does not say how it solved det A = 0 or located the boundary curve. The reader's scheme: scan the
    strain on a log grid, bisect the first sign change of det A (columns rescaled by positive factors so the
