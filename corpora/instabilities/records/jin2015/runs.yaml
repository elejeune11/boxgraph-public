# Wrinkle analysis (Appendix B) for one homogeneous layer
- id: run_biot_uniaxial
  model: wrinkle_eigen_uniaxial
  inputs: {Gf_Gs: Gf_Gs_one, Hs_Hf: Hs_Hf_homogeneous}
  outputs: {em: em_biot_uni_pred, Lm: Lm_biot_uni_pred}
  note: "homogeneous limit: e_c tends to the Biot value as K Hf grows, so Lm is the grid end and not meaningful"
# Boundary of equal critical strain in the thin-film limit
- id: run_boundary_plane_strain
  model: equal_strain_boundary_plane_strain
  inputs: {Hs_Hf: Hs_Hf_thin_film_limit, e_crease: e_crease_pe}
  outputs: {Gf_Gs: boundary_pe_pred}
- id: run_boundary_uniaxial
  model: equal_strain_boundary_uniaxial
  inputs: {Hs_Hf: Hs_Hf_thin_film_limit, e_crease: e_crease_uni}
  outputs: {Gf_Gs: boundary_uni_pred}
# e_m at the printed boundary point Gf/Gs = 1.65, thin-film limit (on the e_m^Uni = 0.44, e_m^PE = 0.35 contour)
- id: run_em_pe_at_165
  model: wrinkle_eigen_plane_strain
  inputs: {Gf_Gs: boundary_Gf_Gs, Hs_Hf: Hs_Hf_thin_film_limit}
  outputs: {em: em_pe_at_165, Lm: Lm_pe_at_165}
- id: run_em_uni_at_165
  model: wrinkle_eigen_uniaxial
  inputs: {Gf_Gs: boundary_Gf_Gs, Hs_Hf: Hs_Hf_thin_film_limit}
  outputs: {em: em_uni_at_165, Lm: Lm_uni_at_165}
