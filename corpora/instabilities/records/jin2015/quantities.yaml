- id: shear_modulus_ratio
  name: film to substrate shear modulus ratio
  dimension: dimensionless
  description: "Gf/Gs, the ratio of the shear moduli of the incompressible neo-Hookean film and substrate"
- id: thickness_ratio
  name: substrate to film thickness ratio
  dimension: dimensionless
  description: "Hs/Hf, the ratio of the undeformed thicknesses of substrate and film; the bottom of the substrate is fixed vertically and free horizontally"
- id: wrinkle_onset_strain_uniaxial
  name: compressive strain at the onset of wrinkles, uniaxial compression
  dimension: dimensionless
  description: "e = 1 - lambda1, the nominal compressive strain applied homogeneously to film and substrate together (no prestretch) at which wrinkles form, under the uniaxial compression condition lambda3 = 1/sqrt(lambda1); e_m^Uni is its minimum over wavelength. In the experiments, the 'film strain' at which wrinkles appear under uniaxial compression"
- id: wrinkle_onset_strain_plane_strain
  name: compressive strain at the onset of wrinkles, plane strain
  dimension: dimensionless
  description: "e = 1 - lambda1 at the onset of wrinkles under plane strain (lambda3 = 1), applied homogeneously to film and substrate; e_m^PE is its minimum over wavelength"
- id: wrinkle_onset_stretch_uniaxial
  name: stretch along the compression at the onset of wrinkles, uniaxial compression
  dimension: dimensionless
  description: "lambda_c = 1 - e_m^Uni, the stretch lambda1 of film and substrate at the minimal critical strain under lambda3 = 1/sqrt(lambda1) (the helper model wrinkle_stretch_uniaxial)"
- id: crease_onset_strain_uniaxial
  name: compressive strain at the onset of creases, uniaxial compression
  dimension: dimensionless
  description: "e = 1 - lambda1 at which creases form (on a flat surface, or from wrinkles, as the datum says) under uniaxial compression; 0.44 for a homogeneous neo-Hookean material. In the experiments, the 'film strain' at which creases form and channel"
- id: crease_onset_strain_plane_strain
  name: compressive strain at the onset of creases, plane strain
  dimension: dimensionless
  description: "e = 1 - lambda1 at which creases form under plane strain; 0.35 for a homogeneous neo-Hookean material (the snapping forward strain e_F of the paper's simulations)"
- id: wrinkle_onset_strain_generalized_plane_strain
  name: compressive strain at the onset of wrinkles, generalized plane strain
  dimension: dimensionless
  description: "e_c = 1 - lambda_c at the onset of wrinkles when the stretch in the 3-direction is held at an arbitrary constant lambda3 (Eq. 1)"
- id: transverse_stretch
  name: stretch in the 3-direction
  dimension: dimensionless
  description: "lambda3, the stretch normal to the plane of the wrinkles and parallel to the surface; 1 in plane strain"
- id: wrinkle_wavelength_over_film_thickness
  name: nominal wrinkle wavelength at the minimal critical strain over film thickness
  dimension: dimensionless
  description: "L^m_wrinkle/Hf = 2 pi/(K Hf), K the wave number in the undeformed (reference) state, at the minimum of e_c over wavelength"
- id: mounting_layer_shear_modulus
  name: shear modulus of the prestretched mounting layer
  dimension: "[pressure]"
  description: "shear modulus of the silica reinforced PDMS layer used to compress the bilayer in the experiments"
- id: mounting_layer_thickness
  name: thickness of the mounting layer
  dimension: "[length]"
- id: substrate_thickness
  name: substrate thickness in the experiments
  dimension: "[length]"
- id: film_thickness
  name: film thickness in the experiments
  dimension: "[length]"
- id: wrinkle_wavelength_nominal
  name: nominal wrinkle wavelength over film thickness (any wavelength)
  dimension: dimensionless
  description: "L_wrinkle/Hf = 2 pi/(K Hf), K the wave number in the reference state, for a wrinkle mode of given wavelength (the x axis of Fig. 2); not only at the minimal strain"
- id: wrinkle_critical_strain_uniaxial_at_wavelength
  name: critical strain for wrinkles of a given wavelength, uniaxial compression
  dimension: dimensionless
  description: "e_c = 1 - lambda_c at which det A = 0 for a given L_wrinkle/Hf, under lambda3 = 1/sqrt(lambda1) (the y axis of Fig. 2); its minimum over wavelength is e_m^Uni"
- id: subcritical_crease_bilayer_modulus_ratio
  name: modulus ratio of a bilayer simulated to form subcritical creases
  dimension: dimensionless
  description: "Gf/Gs of a bilayer whose creases the paper's finite element simulations (plane strain) find subcritical, by Hs/Hf (Fig. 4(a) circles)"
- id: supercritical_crease_bilayer_modulus_ratio
  name: modulus ratio of a bilayer simulated to form supercritical creases
  dimension: dimensionless
  description: "Gf/Gs of a bilayer whose creases the paper's finite element simulations (plane strain) find supercritical, by Hs/Hf (Fig. 4(a) pluses)"
