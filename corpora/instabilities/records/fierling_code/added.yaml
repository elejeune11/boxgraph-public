- id: theta_midline
  quantity: angle_from_midline
  unit: rad
  printed: "0.015"
  basis: >
    An angle inside the first (midline) band of the released Step013 profile (band centre phi_Eul = 0.042 rad, half-width
    pi/80 = 0.039 rad), where the paper's 'along the ventral midline' (p. 5) is read; the same angle at which the paper's
    record reads Fig. 2c.
  alternatives: ["0.005", "0.07"]
  stands_for: the ventral midline of Fig. 2c
