# Quantities shared with fierling2022 keep that record's ids, so copied values and cross-record checks name the same thing.
- {id: young_modulus_2d_nd, name: 2D Young modulus (nondimensional), dimension: dimensionless, description: "Y_2D in units of kappa / R_DV^2 (young2D in the Surface Evolver script, with kappa = 1 and rayon = 1)"}
- {id: poisson_ratio_2d, name: 2D Poisson ratio, dimension: dimensionless}
- {id: bending_modulus_nd, name: bending modulus kappa (nondimensional), dimension: dimensionless, description: "kappa, the unit of energy of the simulation"}
- {id: se_bending_modulus_nd, name: Surface Evolver bending modulus, dimension: dimensionless, description: "the modulus of the star_perp_sq_mean_curvature energy (bmod), which multiplies the square of the mean of the two principal curvatures"}
- {id: compression_modulus_nd, name: nondimensional 2D compression modulus, dimension: dimensionless, description: "chi~_2D = chi_2D R_DV^2 / kappa"}
- {id: radius_dv_nd, name: DV radius in simulation units, dimension: dimensionless, description: "rayon in the script: R_DV in the units of the simulation"}
- {id: radius_dv, name: DV radius of the model embryo, dimension: "[length]", description: "R_DV, the radius of the mid cross-section, used to give simulated lengths in um"}
- {id: axis_ratio, name: ratio of AP to DV semi-axis, dimension: dimensionless, description: "R_AP / R_DV (gaxe in the script)"}
- {id: bend_coefficient, name: bending coefficient written in the ellipsoid constraint, dimension: dimensionless, description: "the literal 0.3 in (z + 0.3/gaxe/rayon*x^2/2)"}
- {id: bend_parameter, name: bending parameter of the ellipsoid, dimension: dimensionless, description: "Z_p: the offset of the cross-section centres at the poles, in units of R_DV, towards the side the paper's +z points to"}
- {id: pole_height, name: z of the poles as the code writes the surface, dimension: dimensionless, description: "z coordinate of the cross-section centre at x = +-R_AP, in units of R_DV, signed as in the script"}
- {id: vitelline_gap_relative, name: vitelline gap relative to R_DV, dimension: dimensionless}
- {id: shell_thickness, name: thickness of the equivalent isotropic shell, dimension: "[length]", description: "h = sqrt(12 (1 - nu^2) kappa / Y_2D) R_DV, from the script's header comment"}
- {id: shrink_ratio, name: target-to-initial area factor at the midline, dimension: dimensionless, description: "ratio_shrink, gamma: the factor that multiplies the Gram matrix (squared lengths) of the unstrained facet in the central (red) region; A_0/A_i"}
- {id: shrink_step_factor, name: factor by which ratio_shrink is divided at each pre-strain step, dimension: dimensionless}
- {id: frame_number, name: saved frame number of the simulation, dimension: dimensionless, description: "framecounter, the index of a saved state (Step NNN in the file names)"}
- {id: area_prestrain, name: area pre-strain, dimension: dimensionless, description: "epsilon_a = (A_i - A_0)/A_0"}
- {id: prestress_nd, name: active pre-stress (nondimensional), dimension: dimensionless, description: "sigma_a in units of kappa / R_DV^2"}
- {id: stress_ap_nd, name: AP in-plane stress (nondimensional), dimension: dimensionless}
- {id: stress_dv_nd, name: DV in-plane stress (nondimensional), dimension: dimensionless}
- {id: stress_anisotropy_ratio, name: ratio of AP to DV stress, dimension: dimensionless, description: "sigma_AP / sigma_DV at the ventral midline"}
- {id: angle_from_midline, name: angle from the ventral midline, dimension: dimensionless, description: "angular position on the mid cross-section from the ventral midline (rad)"}
- {id: dv_distance, name: DV distance from the ventral midline, dimension: "[length]"}
- {id: cell_row, name: distance from the midline in rows of cells, dimension: dimensionless}
- {id: row_width, name: width of one row of cells, dimension: "[length]", description: "STRIPEWIDTH in the plotting script: the length that converts a distance into a row count"}
- {id: region_shape_factor, name: shape factor of the myosin region, dimension: dimensionless, description: "extachey (DV) or extachex (AP): the region's half-axis is rayon*(gaxe/sqrt(extachex)+delta) along AP and rayon*(1/sqrt(extachey)+delta) along DV"}
- {id: region_offset, name: offset of a myosin region boundary, dimension: dimensionless, description: "delta_min (edge of the uniform central region) or delta_max (outer edge of the gradient)"}
- {id: crown_step, name: width of a crown of the myosin gradient, dimension: dimensionless, description: "delta_plus: the gradient region is cut into (delta_max - delta_min)/delta_plus crowns"}
- {id: mesoderm_halfwidth, name: DV half-width of the pre-strained region, dimension: "[length]", description: "arc length on the initial mid cross-section from the ventral midline to the region boundary"}
- {id: mesoderm_halfwidth_rows, name: DV half-width of the pre-strained region in rows of cells, dimension: dimensionless}
- {id: convergence_tolerance, name: energy tolerance that ends a minimisation, dimension: dimensionless}
- {id: penalty_amplitude, name: amplitude of the facet-flipping penalty energy, dimension: dimensionless}
- {id: penalty_steepness, name: steepness of the facet-flipping penalty energy, dimension: dimensionless}
- {id: time, name: time from the onset reference (t = 0), dimension: "[time]"}
- {id: time_rescale_factor, name: factor dividing confocal time to match light-sheet time, dimension: dimensionless}
- {id: area_fold_change, name: apical area relative to initial, dimension: dimensionless}
- {id: apical_area_reduction, name: relative reduction of apical area, dimension: dimensionless, description: "1 - area / initial area"}
- {id: recoil_velocity, name: initial recoil velocity after laser ablation, dimension: "[length]/[time]"}
- {id: sample_size, name: number of embryos, dimension: dimensionless}
- {id: curvature, name: curvature of the ventral tissue in a cross-section, dimension: "1/[length]", description: "1/R, positive convex"}
- {id: ablation_stage, name: stage of the ablation experiment, dimension: dimensionless, description: "0, 1, 2, 3 for t0 (before), t1 (before), t2 (just after ablation), t3 (after recovery), Fig. 1b-c"}
- {id: embryo_index, name: embryo number, dimension: dimensionless}
- {id: mesh_size, name: number of mesh elements, dimension: dimensionless}
