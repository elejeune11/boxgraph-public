id: row_value
name: a released value for one row of cells (area fold change by row, Fig. 3b)
role: processing
software: true
stated: {file: area_AP_DV_paper.plot, lines: "130-138", quote: "u (i):(column(\"stripe_\".i.\"_norm\")) w p ls LS_Sim tit"}
equation: "the value of row i on the file's first data line: the column named `name` with {i} replaced, or column `offset` + i (1-based, as gnuplot's column(4+i))"
inputs:
  row: {quantity: cell_row, unit: dimensionless}
outputs:
  y: {quantity: area_fold_change, unit: dimensionless}
settings: {file: "sims_t=-1_area.gdat", name: "stripe_{i}_norm", offset: 0}
stochastic: false
