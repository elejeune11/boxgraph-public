notes: >
  A theory and finite element paper on the neo-Hookean half-space only; no measurements, and no
  film/substrate formula (the bilayer analysis, and the formula wang2014's Eq. 5 is compared with, are in
  the companion cao2012). Strains are nominal, eps = 1 - lambda, along the compression x1, with the
  out-of-plane stretch lambda_3 imposed and fixed: eps_W = 1 - 0.5437/sqrt(lambda_3) (Biot, lambda_1/lambda_2
  = 0.2956) and eps_C = 1 - 0.65/sqrt(lambda_3) (Hong et al., lambda_1/lambda_2 = 0.42), 0.456 and 0.35 in
  plane strain. There is no prestretch in this paper: lambda_3 is the only parameter, and both thresholds
  scale with it the same way, so their ratio lambda_C/lambda_W = 1.196 is fixed.
  In scope, every model behind a printed number: Biot's eigenvalue condition Eq. 2.8 (r, 0.2956, 0.5437,
  0.456); the crease stretch from Hong's ratio (0.65, 0.35); the post-bifurcation coefficients A (Eq. 4.2)
  and b_ijm (Eq. 4.3), evaluated from Eqs. 3.7-3.8 with the modes 2.9-2.10; the imperfection term
  Eq. 3.13 -> 17.8405 and c (Eq. 4.4); the two-mode energy -0.651 and c* = 1.7534 (Eq. 4.9); Eq. 4.10
  (1.9541); and Table 1, both rows, by solving Eq. 4.6 with the printed coefficients for N = 2-6. All
  reproduce except: Eq. 3.13 as printed (its l (r-1)^2 gives 9.70; the variant with (r^2 - 1), from the
  stress quoted beside it and a dimension argument, gives 17.840, question q_eq313_prefactor); Table 1
  row (i) for N = 5 and 6, about 0.2% higher than printed (q_table1_N5_N6); and row (ii), whose
  calculation the paper does not give: the reconstructed local criterion reproduces N = 2, 4, 5, 6 but not
  N = 3 (q_local_criterion_unstated). Not rerun: the finite element results (ABAQUS; plotted only, Figs. 5-9,
  read as data in the figure pass below). Left out: the statements 'about 35 per cent' (Table 1 gives 2.358/1.754 = 1.34),
  'about xibar_1 = 0.008' and 'X ~ 2.3 l_C' (approximate, from the finite element plots), and the crease
  depths l_C/l = 0.00144 and 0.00295 of Fig. 8 (feed no model). The relations b224 = 4 b112,
  b336 = 9 b112, b246 = 4 b123 are used inside the N-mode model as printed; the audit added their check
  from Eq. 3.7 (cubic_coefficient_relations_eq43, see audit.md).
  Page images were checked for Eqs. 1.1-1.2, 2.8-2.10, 3.13, 4.2-4.10 and Table 1.
  Figure pass (2026-11-19): Figs. 2-9 are read by calibrated code (figures.yaml, figures/*.py; figures.md
  lists every panel). The analytic curves are compared with new models: Fig. 2 with Eqs. 4.7-4.8
  (two_mode_imperfect_eq47, two_mode_perfect_eq48; the reading shows the caption's lambda_C means lambda_W,
  q_fig2_reading_lambdaW), Fig. 3 (N = 2, 4, 6) with the perfect N-mode solution (nmode_perfect_shape),
  Fig. 4 with c*(N) sqrt(lambda_W^2 xibar_1) (nmode_reduction_curve) and the Fig. 5 line with the 6-mode
  eps* (nmode_asymptotic_strain). The FE points of Figs. 5-9 are recorded as data (origin predicted, not
  rerunnable): Fig. 5 eps* against the asymptotic line (approximation, q_fig5_asymptotic_range), and the
  eps_A of Figs. 5 and 9 against the stated criterion eps_A = eps_W (local_criterion_words, _exp); the
  loading paths of Figs. 6-7 and the crease-tip strains of Fig. 8 have no model in the record.
