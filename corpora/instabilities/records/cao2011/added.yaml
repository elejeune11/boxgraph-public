- id: s_fig2_pos
  quantity: imperfection_amplitude_scaled
  unit: dimensionless
  printed: "0.0005"
  basis: >
    The caption of Fig. 2 (p. 104) prints the imperfection as lambda_C^2 xibar_1 = +-0.0005, but Eqs. 4.6-4.9
    and the abscissa of Fig. 4 scale it with lambda_W^2; taken here as lambda_W^2 xibar_1 = +0.0005 (the
    upper branch of the figure). See q_fig2_caption_lambdaC and q_fig2_reading_lambdaW.
  alternatives: ["0.00034983"]
  stands_for: "lambda_W^2 xibar_1 of the imperfect curves in Fig. 2 (the alternative is the caption read literally, lambda_C^2 xibar_1 = 0.0005 with lambda_C/lambda_W = 0.65/0.5437)"
- id: s_fig2_neg
  quantity: imperfection_amplitude_scaled
  unit: dimensionless
  printed: "-0.0005"
  basis: >
    As s_fig2_pos, the negative sign of the caption's +-0.0005 (the lower branch of Fig. 2(a)).
  alternatives: ["-0.00034983"]
  stands_for: "lambda_W^2 xibar_1 of the lower imperfect curve in Fig. 2(a)"
# Cross-validation against trujillo2008 (job 2026-11-19): equibiaxial compression of surface-attached gels.
- id: lambda3_equibiaxial_W
  quantity: transverse_stretch
  unit: dimensionless
  printed: "0.6662"
  basis: >
    Added for the validation against trujillo2008's equibiaxially compressed gels. This paper holds lambda_3
    fixed "for any fixed l3" (p. 2) but never treats equibiaxial compression, where lambda_3 = lambda_1 at
    onset. The self-consistent value of Eq. 1.1 with lambda_3 = lambda_1 = lambda_W is
    lambda^3 = 0.2956, lambda = 0.2956^(1/3) = 0.6662 (trujillo2008 p. 2 prints the same condition,
    lambda_1^2 lambda_3 = 0.296 with lambda_1 = lambda_3, giving e_c = 0.334). Not printed by either paper.
  alternatives: ["0.67", "0.65", "0.69"]
  stands_for: "lambda_3 of Eq. 1.1 at the onset of equibiaxial wrinkling (alternatives: 1 - e_c with trujillo2008's measured mean e_c = 0.33 +- 0.02)"
- id: lambda3_equibiaxial_C
  quantity: transverse_stretch
  unit: dimensionless
  printed: "0.7489"
  basis: >
    Added for the validation against trujillo2008. As lambda3_equibiaxial_W, for the crease threshold of
    Eq. 1.2 ("for any fixed l3", p. 2): with lambda_3 = lambda_1 = lambda_C, lambda^3 = 0.42,
    lambda = 0.42^(1/3) = 0.7489. Not printed by either paper; it assumes Hong et al.'s fixed-lambda_3
    threshold carries over to lambda_3 equal to the compression, which neither paper states.
  alternatives: ["0.67", "0.65", "0.69"]
  stands_for: "lambda_3 of Eq. 1.2 at the equibiaxial crease threshold (alternatives: 1 - e_c with trujillo2008's measured mean e_c = 0.33 +- 0.02)"
# Cross-validation against wang2015 (job 2026-11-19): crease onset of soft Sylgard films on a relaxed,
# uniaxially prestretched Ecoflex substrate.
- id: lambda3_wang2015_film
  quantity: transverse_stretch
  unit: dimensionless
  printed: "1"
  basis: >
    Added for the validation against wang2015's measured crease onset. wang2015 treats its experiments as
    plane strain (its mismatch strain eM = (Lf - Ls)/Lf is along one direction and its finite element
    model and flat-crease boundary eC = 0.35, Eq. 3, are plane strain), but never states the film's
    transverse stretch. Its Methods (p. 8) say the substrate was "uniaxially pre-stretched" before the film
    was attached and then relaxed; if the substrate's sides were free, its width returns from
    (Lf/Ls)^(-1/2) to 1 on release and stretches the film transversely by (1 - eM)^(-1/2). Taken here as
    lambda_3 = 1, the plane strain wang2015 itself compares with.
  alternatives: ["1.25"]
  stands_for: "lambda_3 of Eq. 1.2 for the wang2015 films (alternative: (1 - eM)^(-1/2) at eM = 0.36 with free substrate sides, which gives eps_C = 0.42 instead of 0.35)"
