- datum: ratio_W_printed
  from_datum: k_crit_printed
  evidence: "Cao & Hutchinson give l1/l2 = 0.2956 at Biot's wrinkling point (Eq. 1.1, credited to Biot). Biot's decay factor k is lambda_1/lambda_2 at the critical state in both his cases (k = lambda^2 in plane strain, Eq. 4.11; k = lambda^(3/2) uniaxially, with lambda_2 = lambda^(-1/2)), and he prints its critical value k = 0.295 for both (p. 181): the same value under different names."
- datum: coef_W_printed
  from_datum: lambda_plane_printed
  evidence: "Cao & Hutchinson give l1 = lW = 0.5437/sqrt(l3), credited to Biot (Eq. 1.1). Biot's plane-strain case has lambda_3 = 1, where lW = 0.5437 is his critical stretch lambda = 0.543 (Eq. 4.3)."
- datum: coef_C_printed
  from_datum: lambda1_c_printed
  evidence: "Cao & Hutchinson give l1 = lC = 0.65/sqrt(l3), credited to Hong et al. (Eq. 1.2), so 0.65 = lC sqrt(l3). Hong et al. print the plane-strain critical stretch lambda_1 = 1 - eps_c = 0.65 and the same condition under generalized plane strain as lambda_1 sqrt(lambda_2) = 0.65 (p. 3), with their lambda_2 being Cao's l3: the same value. Cao's ratio 0.42 (ratio_C_hong) is not linked: Hong prints the reciprocal, lambda_3/lambda_1 = 2.4 (Eq. 5), not 0.42."
