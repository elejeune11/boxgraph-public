id: shape_imperfection_eq410
name: imperfection-sensitivity for an imperfection in the shape of the perfect N-mode solution (Eq. 4.10)
role: model
stated: {page: 14, printed_page: "107", quote: "The maximum compressive strain that can be imposed prior to instability is given by", where: "Eq. 4.10"}
equation: "(lambda - lambda_W) xi - xi^2 = c lambda_W^2 xibar  =>  lambda* - lambda_W = 2 lambda_W sqrt(c xibar) = 1.9541 lambda_W sqrt(xibar)"
inputs:
  c: {quantity: imperfection_coefficient_c, unit: dimensionless}
outputs:
  coef: {quantity: imperfection_sensitivity_coefficient_shape, unit: dimensionless}
settings: {}
stochastic: false
