id: crease_eq12
name: crease threshold stretch from Hong et al.'s ratio lambda_1/lambda_2 = 0.42 (Eq. 1.2)
role: model
stated: {page: 2, printed_page: "95", quote: "a crease is energetically favourable for compression in the fundamental state exceeding", where: "Eq. 1.2"}
equation: "lambda_1/lambda_2 = 0.42 or lambda_1 = lambda_C = 0.65/sqrt(lambda_3); eps_C = 1 - lambda_C"
inputs:
  ratio: {quantity: crease_stretch_ratio, unit: dimensionless}
  lam3: {quantity: transverse_stretch, unit: dimensionless}
outputs:
  coef: {quantity: crease_stretch_coefficient, unit: dimensionless, description: "lambda_C sqrt(lambda_3) = sqrt(lambda_1/lambda_2)"}
  eps_C: {quantity: crease_strain, unit: dimensionless}
settings: {}
stochastic: false
described_from: ref-hong2009
