id: nmode_reduction_curve
name: reduction of the stretch at instability against lambda_W^2 xibar_1, N modes (Eq. 4.6, Fig. 4)
role: model
stated: {page: 13, printed_page: "106", quote: "Imperfection-sensitivity of wrinkling for sinusoidal imperfections", where: "Fig. 4, Eqs. 4.6 and 4.9"}
equation: "lambda* - lambda_W = c* lambda_W sqrt(xibar_1) = c* sqrt(lambda_W^2 xibar_1), c* the minimum stretch on the N-mode path of Eq. 4.6"
inputs:
  b112: {quantity: coupling_b112, unit: dimensionless}
  b123: {quantity: coupling_b123, unit: dimensionless}
  b134: {quantity: coupling_b134, unit: dimensionless}
  b235: {quantity: coupling_b235, unit: dimensionless}
  b145: {quantity: coupling_b145, unit: dimensionless}
  b156: {quantity: coupling_b156, unit: dimensionless}
  c: {quantity: imperfection_coefficient_c, unit: dimensionless}
  N: {quantity: number_of_modes, unit: dimensionless}
  s: {quantity: imperfection_amplitude_scaled, unit: dimensionless}
outputs:
  dl: {quantity: stretch_reduction_at_instability, unit: dimensionless}
settings: {eta_min: 0.01, eta_max: 3.0, n_steps: 1500, xtol: 1.0e-12}
built_from: [nmode_cstar_eq46]
stochastic: false
