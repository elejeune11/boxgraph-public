id: two_mode_imperfect_eq47
name: two-mode imperfect post-bifurcation path, first-mode imperfection (Eq. 4.7)
role: model
stated: {page: 12, printed_page: "105", quote: "which provides the relation between l and x1", where: "Eq. 4.7 with xibar_2 = 0, p. 105"}
equation: "(lambda - lambda_W) xi_1 + b112 xi_1 xi_2 = c lambda_W^2 xibar_1, (lambda - lambda_W) xi_2 + b112 xi_1^2/4 = 0; so xi_2 = -b112 xi_1^2/[4(lambda - lambda_W)] and (lambda - lambda_W) xi_1 - b112^2 xi_1^3/[4(lambda - lambda_W)] = c lambda_W^2 xibar_1"
inputs:
  b112: {quantity: coupling_b112, unit: dimensionless}
  c: {quantity: imperfection_coefficient_c, unit: dimensionless}
  s: {quantity: imperfection_amplitude_scaled, unit: dimensionless, description: "lambda_W^2 xibar_1 (signed)"}
  D: {quantity: stretch_above_bifurcation, unit: dimensionless}
outputs:
  xi1_outer: {quantity: mode1_amplitude, unit: dimensionless, description: "the arm of the fold farther from zero (same sign as the imperfection)"}
  xi1_inner: {quantity: mode1_amplitude, unit: dimensionless, description: "the arm of the fold nearer zero"}
  xi2_outer: {quantity: mode2_amplitude, unit: dimensionless}
  xi2_inner: {quantity: mode2_amplitude, unit: dimensionless}
settings: {}
stochastic: false
