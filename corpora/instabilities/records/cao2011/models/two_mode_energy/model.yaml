id: two_mode_energy
name: energy on the two-mode perfect post-bifurcation path at lambda_W (Eqs. 4.5, 4.8)
role: model
stated: {page: 11, printed_page: "104", quote: "the equilibrium path relative to the bifurcation state", where: "display after Eq. 4.8"}
equation: "Phi(lambda_W, U)/(mu l^2 A/lambda_W) = b112 xi1^2 xi2 with xi1 = +-2(lambda - lambda_W)/b112, xi2 = -(lambda - lambda_W)/b112  =>  -4/b112^2 (lambda - lambda_W)^3"
inputs:
  b112: {quantity: coupling_b112, unit: dimensionless}
outputs:
  E: {quantity: two_mode_energy_coefficient, unit: dimensionless}
settings: {}
stochastic: false
