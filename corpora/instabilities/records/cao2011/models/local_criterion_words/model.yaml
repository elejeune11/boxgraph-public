id: local_criterion_words
name: local wrinkling criterion eps_A = eps_W at instability, sinusoidal imperfection (in words)
role: model
stated: {page: 16, printed_page: "109", quote: "instability is associated with the local compressive strain at A attaining the wrinkling", where: "Fig. 5 caption; also p. 109"}
equation: "eps_A = eps_W at the instability, for every imperfection amplitude xibar_1"
inputs:
  eps_W: {quantity: wrinkling_strain, unit: dimensionless}
  xi: {quantity: imperfection_amplitude, unit: dimensionless, description: "the amplitude; the criterion does not depend on it"}
outputs:
  eps_A: {quantity: local_strain_at_instability, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
