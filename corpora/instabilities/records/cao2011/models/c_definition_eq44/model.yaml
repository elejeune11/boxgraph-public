id: c_definition_eq44
name: imperfection coefficient c defined by the two forms of Eq. 4.4
role: model
stated: {page: 10, printed_page: "103", quote: "The contribution (3.13) from the initial imperfection is", where: "Eq. 4.4"}
equation: "Delta Phi = -17.8405 mu lambda_1 l^2 sum n xibar_n xi_n = -(mu l^2 A/lambda_W) 2 c lambda_W^2 sum n xibar_n xi_n, lambda_1 = lambda_W  =>  c = K/(2A)"
inputs:
  K: {quantity: imperfection_energy_coefficient, unit: dimensionless}
  A: {quantity: postbuckling_coefficient_A, unit: dimensionless}
outputs:
  c: {quantity: imperfection_coefficient_c, unit: dimensionless}
settings: {}
stochastic: false
