id: nmode_perfect_shape
name: surface shape of the perfect N-mode post-bifurcation solution (Eq. 4.6, Fig. 3)
role: model
stated: {page: 12, printed_page: "105", quote: "has been determined by a sequence of calculations, each with N modes", where: "Eq. 4.6, Fig. 3"}
equation: "xi_n = alpha_n (lambda - lambda_W) solving Eq. 4.6 with xibar_n = 0; u2(x1, 0) = l sum xi_n cos(2 pi n x1/l) (p. 104, two-mode form)"
inputs:
  b112: {quantity: coupling_b112, unit: dimensionless}
  b123: {quantity: coupling_b123, unit: dimensionless}
  b134: {quantity: coupling_b134, unit: dimensionless}
  b235: {quantity: coupling_b235, unit: dimensionless}
  b145: {quantity: coupling_b145, unit: dimensionless}
  b156: {quantity: coupling_b156, unit: dimensionless}
  N: {quantity: number_of_modes, unit: dimensionless}
  x: {quantity: position_over_wavelength, unit: dimensionless}
outputs:
  u: {quantity: normalized_surface_deflection, unit: dimensionless}
settings: {xtol: 1.0e-13}
built_from: [nmode_cstar_eq46]
stochastic: false
