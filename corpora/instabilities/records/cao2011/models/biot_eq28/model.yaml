id: biot_eq28
name: Biot surface wrinkling of an incompressible neo-Hookean half-space (Eqs. 1.1, 2.8)
role: model
stated: {page: 5, printed_page: "98", quote: "Satisfaction of the boundary conditions on x2 = 0 gives the eigenvalue condition", where: "Eq. 2.8"}
equation: "r^3 - 3 r^2 - r - 1 = 0 => r = lambda_2/lambda_1; lambda_1 lambda_2 lambda_3 = 1 gives lambda_W = (r lambda_3)^(-1/2); eps_W = 1 - lambda_W"
inputs:
  lam3: {quantity: transverse_stretch, unit: dimensionless}
outputs:
  r: {quantity: biot_stretch_ratio_r, unit: dimensionless}
  ratio: {quantity: wrinkling_stretch_ratio, unit: dimensionless, description: "lambda_1/lambda_2 = 1/r"}
  coef: {quantity: surface_instability_stretch_coefficient, unit: dimensionless, description: "lambda_W sqrt(lambda_3) = r^(-1/2)"}
  eps_W: {quantity: wrinkling_strain, unit: dimensionless}
settings: {}
stochastic: false
