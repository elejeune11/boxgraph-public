id: local_criterion_words_exp
name: local wrinkling criterion eps_A = eps_W at instability, exponential imperfection (in words)
role: model
stated: {page: 19, printed_page: "112", quote: "The imperfection-sensitivity for this imperfection is similar to that for", where: "Fig. 9 caption and the line eps_W = 0.456 drawn in Fig. 9"}
equation: "eps_A = eps_W at the instability, for every amplitude xibar of the imperfection (5.1)"
inputs:
  eps_W: {quantity: wrinkling_strain, unit: dimensionless}
  xi: {quantity: exponential_imperfection_amplitude, unit: dimensionless, description: "the amplitude; the criterion does not depend on it"}
outputs:
  eps_A: {quantity: local_strain_at_instability, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
