id: imperfection_energy_eq313
name: lowest-order imperfection energy, Eq. 3.13 as printed, evaluated with the modes (2.10) (constant of Eq. 4.4)
role: model
stated: {page: 9, printed_page: "102", quote: "the lowest order contribution of the imperfection to F̂ is", where: "Eq. 3.13"}
equation: "Delta Phi = -mu lambda_1 l (r - 1)^2 Int_0^l (delta(x1) sum xi_n u^(n)_1,1(x1, 0)) dx1, delta = sum xibar_n l cos(n k x1)  =>  Delta Phi = -K mu lambda_1 l^2 sum n xibar_n xi_n"
inputs:
  r: {quantity: biot_stretch_ratio_r, unit: dimensionless}
outputs:
  K: {quantity: imperfection_energy_coefficient, unit: dimensionless}
settings: {}
stochastic: false
# The printed prefactor l (r-1)^2 carries one more power of the wavelength than Delta Phi (energy per
# unit depth, mu l^2) can have; K is evaluated with l = 1, i.e. as the coefficient of mu lambda_1 l^3.
