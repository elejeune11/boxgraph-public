id: two_mode_perfect_eq48
name: two-mode perfect post-bifurcation path (Eq. 4.8)
role: model
stated: {page: 10, printed_page: "103", quote: "For the perfect system (x̄1 = x̄2 = 0), the solutions of interest are", where: "Eq. 4.8"}
equation: "xi_1 = +-2(lambda - lambda_W)/b112 and xi_2 = -(lambda - lambda_W)/b112, with lambda - lambda_W >= 0"
inputs:
  b112: {quantity: coupling_b112, unit: dimensionless}
  D: {quantity: stretch_above_bifurcation, unit: dimensionless}
outputs:
  xi1_pos: {quantity: mode1_amplitude, unit: dimensionless, description: "the + branch of Eq. 4.8"}
  xi1_neg: {quantity: mode1_amplitude, unit: dimensionless, description: "the - branch of Eq. 4.8"}
  xi2: {quantity: mode2_amplitude, unit: dimensionless}
settings: {}
stochastic: false
