equation: "2n(lambda - lambda_W) xi_n + dC/dxi_n = 2 n c lambda_W^2 xibar_n (Eq. 4.6), xibar_n = 0 for n > 1; lambda* = min lambda on the path; lambda* - lambda_W = c* lambda_W sqrt(xibar_1)"
