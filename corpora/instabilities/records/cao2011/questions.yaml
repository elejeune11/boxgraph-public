  about: [lambda3_equibiaxial_W, lambda3_equibiaxial_C, biot_eq28, crease_eq12]
  text: >
    trujillo2008's gels are compressed equibiaxially by constrained swelling, so at onset lambda_3 = lambda_1.
    Eqs. 1.1 and 1.2 hold "for any fixed l3"; the validations take lambda_3 at the self-consistent onset
    (0.6662 for wrinkling, 0.7489 for creasing). Taking instead lambda_3 = 1 - e_c from the measured
    e_c = 0.33 +- 0.02 changes eps_W by about 0.5 dlambda_3 (0.324 to 0.344) and eps_C by more (0.21 to 0.23
    against 0.25). Whether Hong et al.'s crease ratio 0.42, found with lambda_3 held fixed in plane
    deformation, applies to an equibiaxial state at all is not stated by either paper. The gels are also
    swollen networks with an equilibrium Poisson's ratio near 0.3 (trujillo2008 p. 4), not the
    incompressible neo-Hookean solid of Eqs. 1.1-1.2, and trujillo2008 measures the strain from the
    unconstrained swelling of a separate gel. The measurements read against eps_W (0.334) and against eps_C
    (0.25) test which threshold the creased gels follow, not only the numbers.
