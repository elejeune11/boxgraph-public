- id: transverse_stretch
  name: out-of-plane stretch of the uniform state
  dimension: dimensionless
  description: "lambda_3, the imposed and fixed principal stretch in the x3 direction (1 in plane strain)"
- id: biot_stretch_ratio_r
  name: ratio lambda_2/lambda_1 at the wrinkling bifurcation
  dimension: dimensionless
  description: "r = lambda_2/lambda_1, the root of r^3 - 3r^2 - r - 1 = 0 (Eq. 2.8); also used as q0 in the expansion"
- id: wrinkling_stretch_ratio
  name: ratio lambda_1/lambda_2 at the wrinkling bifurcation
  dimension: dimensionless
  description: "lambda_1/lambda_2 at Biot's surface wrinkling of the neo-Hookean half-space (Eq. 1.1)"
- id: crease_stretch_ratio
  name: ratio lambda_1/lambda_2 at the crease threshold
  dimension: dimensionless
  description: "lambda_1/lambda_2 above which compression makes a crease energetically favourable (Eq. 1.2, from Hong et al. 2009)"
- id: surface_instability_stretch_coefficient
  name: critical value of lambda_1 sqrt(lambda_3) for surface wrinkling of a neo-Hookean half-space
  dimension: dimensionless
  description: "the constant 0.5437 in lambda_W = 0.5437/sqrt(lambda_3) (Eq. 1.1)"
- id: crease_stretch_coefficient
  name: critical value of lambda_1 sqrt(lambda_3) for creasing of a neo-Hookean half-space
  dimension: dimensionless
  description: "the constant 0.65 in lambda_C = 0.65/sqrt(lambda_3) (Eq. 1.2)"
- id: wrinkling_strain
  name: nominal compressive strain at the onset of surface wrinkling of a half-space
  dimension: dimensionless
  description: "eps_W = 1 - lambda_W, nominal compressive strain along x1 at Biot's wrinkling bifurcation"
- id: crease_strain
  name: nominal compressive strain at the crease threshold of a half-space
  dimension: dimensionless
  description: "eps_C = 1 - lambda_C, nominal compressive strain along x1 above which a crease lowers the energy"
- id: postbuckling_coefficient_A
  name: coefficient A of the quadratic energy term in the post-bifurcation expansion
  dimension: dimensionless
  description: "A in Eq. 4.2, (1/2) xi^2 d3Phi/dlambda dU^2 U(1)^2 = (mu l^2 A/lambda_W) sum n xi_n^2"
- id: coupling_b112
  name: mode-coupling coefficient b112
  dimension: dimensionless
  description: "coefficient of xi_1^2 xi_2 in the cubic energy term, Eq. 4.3 (in units of mu l^2 A/lambda_W)"
- id: coupling_b123
  name: mode-coupling coefficient b123
  dimension: dimensionless
  description: "coefficient of xi_1 xi_2 xi_3 in Eq. 4.3"
- id: coupling_b134
  name: mode-coupling coefficient b134
  dimension: dimensionless
  description: "coefficient of xi_1 xi_3 xi_4 in Eq. 4.3"
- id: coupling_b235
  name: mode-coupling coefficient b235
  dimension: dimensionless
  description: "coefficient of xi_2 xi_3 xi_5 in Eq. 4.3"
- id: coupling_b145
  name: mode-coupling coefficient b145
  dimension: dimensionless
  description: "coefficient of xi_1 xi_4 xi_5 in Eq. 4.3"
- id: coupling_b156
  name: mode-coupling coefficient b156
  dimension: dimensionless
  description: "coefficient of xi_1 xi_5 xi_6 in Eq. 4.3"
- id: coupling_b224_quarter
  name: mode-coupling coefficient b224 divided by 4
  dimension: dimensionless
  description: "b224/4, b224 the coefficient of xi_2^2 xi_4 in Eq. 4.3; the paper prints b112 = b224/4"
- id: coupling_b336_ninth
  name: mode-coupling coefficient b336 divided by 9
  dimension: dimensionless
  description: "b336/9, b336 the coefficient of xi_3^2 xi_6 in Eq. 4.3; the paper prints b112 = b336/9"
- id: coupling_b246_quarter
  name: mode-coupling coefficient b246 divided by 4
  dimension: dimensionless
  description: "b246/4, b246 the coefficient of xi_2 xi_4 xi_6 in Eq. 4.3; the paper prints b123 = b246/4"
- id: imperfection_energy_coefficient
  name: numerical coefficient of the lowest-order imperfection energy
  dimension: dimensionless
  description: "the constant 17.8405 in Delta Phi = -17.8405 mu lambda_1 l^2 sum n xibar_n xi_n (Eq. 4.4)"
- id: imperfection_coefficient_c
  name: imperfection coefficient c
  dimension: dimensionless
  description: "c in Eq. 4.4, Delta Phi = -(mu l^2 A/lambda_W) 2 c lambda_W^2 sum n xibar_n xi_n"
- id: two_mode_energy_coefficient
  name: energy on the two-mode perfect equilibrium path over (lambda - lambda_W)^3
  dimension: dimensionless
  description: "the constant -0.651 in Phi(lambda_W, U)/(mu l^2 A/lambda_W) = b112 xi1^2 xi2 = -0.651 (lambda - lambda_W)^3 (p. 104)"
- id: imperfection_sensitivity_coefficient
  name: imperfection-sensitivity coefficient for the maximum overall compressive strain
  dimension: dimensionless
  description: "c* in lambda* - lambda_W = c* lambda_W sqrt(xibar_1), lambda* the minimum stretch (maximum overall compressive strain) on the equilibrium path, first-mode imperfection (Eq. 4.9, Table 1 row (i))"
- id: imperfection_sensitivity_coefficient_local
  name: imperfection-sensitivity coefficient for the local wrinkling criterion eps_A = eps_W
  dimension: dimensionless
  description: "c* in lambda* - lambda_W = c* lambda_W sqrt(xibar_1), lambda* the overall stretch at which the local strain at the deepest surface point reaches eps_W (Table 1 row (ii))"
- id: imperfection_sensitivity_coefficient_shape
  name: imperfection-sensitivity coefficient for an imperfection in the shape of the perfect solution
  dimension: dimensionless
  description: "the constant in lambda* - lambda_W = 2 lambda_W sqrt(c xibar) = 1.9541 lambda_W sqrt(xibar) (Eq. 4.10)"
- id: number_of_modes
  name: number of modes in the post-bifurcation approximation
  dimension: dimensionless
  description: "N, the number of wrinkling modes kept in Eqs. 4.5-4.6"
- id: imperfection_amplitude
  name: normalized amplitude of the sinusoidal first-mode imperfection
  dimension: dimensionless
  description: "xibar_1 in delta(x1) = xibar_1 l cos(2 pi x1/l), amplitude over wavelength"
- id: imperfection_amplitude_scaled
  name: first-mode imperfection amplitude times lambda_W squared
  dimension: dimensionless
  description: "lambda_W^2 xibar_1, the abscissa of Fig. 4"
- id: stretch_reduction_at_instability
  name: overall stretch at the wrinkling instability less lambda_W
  dimension: dimensionless
  description: "lambda* - lambda_W, the reduction of the maximum overall compressive strain by the imperfection (Fig. 4 ordinate)"
- id: overall_strain_at_instability
  name: overall nominal compressive strain at the wrinkling instability of the imperfect half-space
  dimension: dimensionless
  description: "eps* = 1 - lambda*, plane strain (lambda_3 = 1)"
- id: local_strain_at_instability
  name: local nominal compressive strain at the deepest surface point at the wrinkling instability
  dimension: dimensionless
  description: "eps_A = 1 - lambda_A, the local compressive strain parallel to the surface at the deepest point of the wrinkle at instability, plane strain"
- id: exponential_imperfection_amplitude
  name: normalized amplitude of the isolated exponential imperfection
  dimension: dimensionless
  description: "xibar in delta(x1) = -4 xibar l exp(-(x1/l)^2) (Eq. 5.1)"
- id: stretch_above_bifurcation
  name: overall stretch less the wrinkling stretch
  dimension: dimensionless
  description: "lambda - lambda_W, the abscissa of Fig. 2 (positive: less compression than at the bifurcation)"
- id: mode1_amplitude
  name: amplitude of the first wrinkling mode
  dimension: dimensionless
  description: "xi_1 in the post-bifurcation expansion U = l sum xi_n U(n) (Eqs. 4.5-4.8, Fig. 2(a))"
- id: mode2_amplitude
  name: amplitude of the second wrinkling mode
  dimension: dimensionless
  description: "xi_2 in the post-bifurcation expansion (Eqs. 4.5-4.8, Fig. 2(b))"
- id: position_over_wavelength
  name: position along the surface over the wrinkle wavelength
  dimension: dimensionless
  description: "x1/l, the abscissa of Fig. 3"
- id: normalized_surface_deflection
  name: normalized vertical surface displacement of the perfect post-bifurcation wrinkle
  dimension: dimensionless
  description: "u2(x1, 0)/[(lambda - lambda_W) l], independent of lambda - lambda_W to the order of the analysis (Fig. 3)"
- id: surface_height_difference
  name: height difference between the highest and deepest surface points over the wavelength
  dimension: dimensionless
  description: "Delta u2/l in the finite element simulation of Figs. 6-7 (sinusoidal imperfection, xibar_1 = 0.005)"
- id: overall_compressive_strain
  name: overall nominal compressive strain along the loading path
  dimension: dimensionless
  description: "eps = 1 - lambda, the imposed overall strain at a point of the finite element loading history (Figs. 6-7), as opposed to its value at instability"
- id: local_compressive_strain_A
  name: local compressive strain at the deepest surface point along the loading path
  dimension: dimensionless
  description: "eps_A, the local compressive strain parallel to the surface at A at a point of the finite element loading history (Fig. 6)"
- id: distance_over_crease_depth
  name: horizontal distance from the crease centre-line over the crease depth
  dimension: dimensionless
  description: "X/l_C, X measured in the deformed state (Fig. 8)"
- id: surface_compressive_strain_near_crease
  name: compressive surface strain near a crease
  dimension: dimensionless
  description: "eps = 1 - lambda of the surface at distance X from the crease (Fig. 8, finite element)"
- id: crease_depth_over_wavelength
  name: crease depth over the wrinkle wavelength
  dimension: dimensionless
  description: "l_C/l, the depth of the crease in the finite element simulation (Fig. 8)"
