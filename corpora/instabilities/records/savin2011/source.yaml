notes: >
  Quantitative core: the looping scaling laws and the per-stage measurements of Tables 1 (chick E8, E12, E16)
  and 2 (quail E12, zebra finch E13, mouse E16.5). Each table footnote gives the measured inputs (Lt, h, ro, ri,
  Em, Et, eps_p, eps_0, mean ± s.d.); each row gives observed n, lambda, R and a "Computational model" row. Models:
  Eq. 1 (lambda ~ (Et It/Em h)^(1/3)) and Eq. 2 (R ~ (Et It/Em h eps0^2)^(1/3)) as prefactor-unknown scalings,
  compared with the observed lambda and R of all six cases (the build fits one constant); Eqs. 3 and 4
  (prefactors 36 and 4, It = (pi/4)(ro^4 - ri^4) from SI footnote 6, see q_It_normalisation), compared with the
  tables' model rows (reproduction) and with the observations (validation); n = Lt/lambda (Fig. 3a), applied to
  the observed lambda (consistency of the printed observations) and to the Eq. 3 lambda (against the model rows and
  the observed n). Eqs. 3 and 4 reproduce every "Computational model" row of both tables, n included, so the
  record reads those rows as the scaling expressions, as the text says, not as the lattice simulation
  (q_table_model_rows). Against observations Eq. 3/4 are mostly within one or two s.d.; the predicted loop number
  misses the observed one at chick E12 and E16 (q_loop_number_agreement). Eqs. 3/4 are related to Eqs. 1/2 as
  stated scales_as relations. The lattice simulation (Methods, SI) is entered as a non-runnable model
  (q_lattice_not_runnable).
  Also entered from the SI: the direct bending-stiffness check on a chick E16 tube (two regimes; the axial one
  reproduces Et It = 5 x 10^-11 N m^2, the straightening one does not, from order-of-magnitude inputs); the
  edge-strip calibration (k1 a1^2 = 5.6 b1 from 0.36, reproduced; the continuum coefficient of footnote 3 is not
  0.36, q_strip_continuum; kt ro^2/bt = 4/(1 + (ri/ro)^2) at ri/ro = 0.3 and 0.6, reproduced, against the 5.6
  used, q_strip_ratio_vs_tube); the quail/chick mesentery tension ratio ("approximately five", no verdict); the
  growth rates estimated from mitoses ("about", no verdict); and the magnet power laws of Table S1 against the
  force range printed in Methods (lower end reproduced, upper end not, q_force_range).
  Left out: the rubber simulacrum's values (Fig. 2b caption, SI p. 2: Em, Et, h, ro), which produce no printed
  loop size except through the plotted points of Figs. 4 and 5; the falling-ball calibration constants (bead and
  glycerol densities, viscosity, magnet size, frame rates), which feed only Fig. S3; the reproducibility (50%),
  strain-rate and Reynolds-number bounds; the physiological stresses (~0.1 MPa) and eps_p range (100-200%) stated
  without per-species values; the parameter sweep ranges of the simulation (bm, bt, eps0).
  Figures (pass of 2026-11-19, see figures.md): 92 calibrated code readings (shared code figures/_common.py,
  panel specs figures/_specs.py). They cover Fig. S8b,c (measured, simulated and Eq. 3/4 lambda and R by stage),
  Fig. 3b-g, Fig. 4b,c (chick and rubber points, run through Eqs. 3/4 divided by ro), Fig. S3 (three calibration
  curves, swept through Table S1's power laws), Fig. S6c (swept through the 0.36 line, new model
  strip_fit_line), Figs. S1 and 1b (proliferation bars) and Figs. S9-S11 (quail, finch, mouse panels a-g).
  Table 1 and the Table 2 footnotes are restated as stage-indexed table data (`*_t1`, `*_t2_<species>`), so
  the figures can be compared with them point by point. Left out: Fig. 5b,c (overlapping open black symbols
  of unlabelled stages), the simulation rings of Figs. 4/5, and the insets of Fig. S3 and S9c-S11c.
  Fig. S3 settles q_table_s1_vs_fig_s3 (q_fig_s3_consistent).
  Relations to cerda2003 and moulton2012 are left to the relation jobs: the paper cites Cerda & Mahadevan only
  for the fine wrinkles of the mesentery, not for its looping law, and does not cite Moulton. The candidate
  mapping is Eq. 1 against cerda2003's deep-substrate law lambda ~ (B/Es)^(1/3) with B -> Et It and the
  foundation stiffness Es -> Em h (a rod on a stretched sheet instead of a plate on a half-space), a scales_as
  analogy rather than the same model.
