- id: q_lattice_not_runnable
  kind: unstated_model
  about: [lattice_simulation]
  text: >
    The spring-lattice simulation (Methods, SI pp. 6-10) is described by its two discrete energies and its mesh
    (typically 300 x 60 triangles, a 2-row tube strip with kt = 5.6 bt), but not the damped molecular dynamics
    scheme, initial perturbation, end conditions or how lambda and R are measured on the result, and no code is
    given, so it cannot be rerun. Its only per-stage outputs are plotted in Fig. S8b,c (filled circles) and the
    nondimensional sweep of Figs. 4b,c and 5b,c (blue circles); see q_table_model_rows for the table rows.
  citation: {page: 13, printed_page: "SI 6", quote: "we follow a method described in detail elsewhere", where: "SI, Computational model of gut looping"}
- id: q_table_model_rows
  kind: reading
  about: [cmp_eq3_lam_cm_chE8, cmp_eq3_lam_cm_chE12, cmp_eq3_lam_cm_chE16, cmp_eq3_lam_cm_quE12, cmp_eq3_lam_cm_fiE13, cmp_eq3_lam_cm_moE16, cmp_eq4_R_cm_chE8, cmp_eq4_R_cm_quE12, cmp_n_eq3_cm_chE16]
  text: >
    The rows labelled "Computational model" in Tables 1 and 2 are reproduced, for every stage and species, by
    Eqs. 3 and 4 evaluated on the footnote inputs, and their n by Lt over that lambda. The text (p. 4) says Table 1
    compares the observations "with the expressions given in equations (3) and (4)", and Fig. S8b,c plots the
    Eq. 3 values (open circles) apart from the simulated ones (filled circles), which differ visibly at E8 and E16.
    The record therefore reads these rows as the scaling expressions, not as the lattice simulation; the row label
    suggests the latter.
  citation: {page: 4, printed_page: "60", quote: "with the expressions given in equations (3) and (4), and confirm", where: "text, right column"}
- id: q_It_normalisation
  kind: choice
  about: [wavelength_eq3, radius_eq4, wavelength_eq1, radius_eq2]
  text: >
    The main text defines It only up to a factor (It ∝ ro^4 - ri^4, p. 3), yet Eqs. 3 and 4 carry numerical
    prefactors (36 and 4) that depend on how It is normalized. The record takes It = (pi/4)(ro^4 - ri^4) from SI
    footnote 6 (p. 16); with it the tables' model rows are reproduced at every stage, which supports the choice.
    Eqs. 1 and 2 (no prefactor) use ro^4 - ri^4.
  citation: {page: 16, printed_page: "SI 9", quote: "When rescaled correctly, bt is calculated as the ratio", where: "SI footnote 6"}
- id: q_EtIt_straightening
  kind: unexplained_difference
  about: [cmp_EtIt_straightening, EtIt_si_E16]
  text: >
    The SI says both regimes of the curved-tube test give the same Et It = 5 x 10^-11 N m^2. The second regime
    (axial stiffness 4 Et It/(ro^2 + ri^2), dF/d eps ≈ 10^-3 N) reproduces it; the first (Et It = (dF/d delta) v0^2
    with dF/d delta ≈ 10^-4 N and v0 ≈ 1.5 ro, ro = 390 um) gives a smaller value. The inputs are printed only to
    an order of magnitude ("≈ 10^-4 N"), so the claim may mean agreement in order only; the printed value carries
    one significant figure.
  citation: {page: 13, printed_page: "SI 6", quote: "yields the same value (Et It = 5 × 10−11 N · m2 )", where: "SI text"}
- id: q_force_range
