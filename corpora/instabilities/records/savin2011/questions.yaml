  citation: {page: 10, printed_page: "SI 3", quote: "The force vs. distance calibration curves for 3 different sizes", where: "Fig. S3 and Table S1"}
- id: q_eq1_minimization
  kind: reading
  about: [wavelength_eq1]
  text: >
    The derivation of Eq. 1 (p. 3) takes Um ∝ Em eps*^2 h lambda^2, Ut ∝ Et It kappa^2 lambda with kappa ∝ A/lambda^2,
    and eps* ∝ A/lambda, and says that "minimizing the sum of the two energies with respect to lambda" gives Eq. 1.
    Substituted as printed, Um ∝ Em h A^2 does not depend on lambda and Ut ∝ Et It A^2/lambda^3 decreases
    monotonically, so the sum has no minimum in lambda; Eq. 1 follows from balancing the two terms
    (Et It/lambda^3 ~ Em h), not from minimizing them. The scaling as printed is what the record tests; the
    question is only how it was obtained.
  citation: {page: 3, printed_page: "59", quote: "minimizing the sum of the two energies with", where: "text before Eq. 1"}
