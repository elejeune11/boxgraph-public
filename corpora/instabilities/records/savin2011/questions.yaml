- id: q_no_validation_shyer2013
  kind: choice
  about: [wavelength_eq1, wavelength_eq3, radius_eq2, radius_eq4, loop_number, lattice_simulation, lam_obs_chE12, R_obs_chE12, n_obs_chE12, fig3f_Et_pts, fig3f_Em_pts, shyer2013/fe_luminal_patterns, shyer2013/stressfree_chick, shyer2013/spacing_fig4b, shyer2013/mu_endo_fig4b, shyer2013/mu_mes_fig4b]
  text: >-
    (Cross-validation against shyer2013, which cites this paper as its ref. 30; job 2026-11-19.) No
    validation was entered in either direction. shyer2013 cites this paper only as earlier work on
    macroscopic looping whose physical principles also apply to the lumen; it sets none of its models or
    data against these. (1) This record's models against shyer2013's measurements: the loop laws (Eqs. 1-4,
    the lattice simulation, Lt/n = lambda) return the wavelength, radius and number of loops of the tube
    held by the mesentery; shyer2013 measures none of these. Its measurements are luminal: fold spacings
    over endoderm thickness, compression ratios and circumferences of endoderm and muscle, and shear moduli
    of endoderm and mesenchyme (Figs. 2-4, 6). These are inner layers of the tube, not the tube modulus Et
    or the mesentery modulus Em measured here, and no model here takes them in or gives them out.
    (2) shyer2013's models against these measurements: they are the stress-free layer schedules of its
    luminal simulations, ratio arithmetic and a spot growth field, plus not-runnable finite-element codes;
    none gives a loop wavelength, radius or number, a tube bending stiffness or a mesentery or tube stress.
    See shyer2013/q_no_validation_savin2011.
- id: q_no_validation_cerda2003
  kind: choice
  about: [wavelength_eq1, wavelength_eq3, radius_eq2, radius_eq4, loop_number, lattice_simulation, lam_obs_chE8, lam_obs_chE12, lam_obs_chE16, lam_obs_quE12, lam_obs_fiE13, lam_obs_moE16, figS8b_obs_pts, cerda2003/deep_substrate_wavelength, cerda2003/L_fig1, cerda2003/t_fig1, cerda2003/gamma_fig1, cerda2003/two_Hs_hand]
  text: >-
    (Cross-validation against cerda2003, cited here as SI ref. 13; job 2026-11-19.) No validation is
    entered, in either direction. This paper cites Cerda & Mahadevan only for the fine wrinkles of the
    mesentery seen in some rubber models (SI p. 10), which it calls "of no relevance in determining the
    gut looping pattern" and does not measure: no wrinkle wavelength or amplitude of the mesentery is
    printed or plotted. (1) cerda2003's models against these measurements: its wrinkle laws (Eq. 5, the
    stretched sheet, the deep- and shallow-substrate limits, Eq. 6) give the wavelength of a thin plate on
    a foundation or under tension. The measured loop wavelengths (Tables 1-2, Fig. S8b) are the looping of
    a tube held by a prestrained sheet, a rod bending against a sheet stretched in its own plane; the
    deep-substrate law reaches them only through an effective thickness (It/h)^(1/3) and E/Es -> Et/Em,
    a proposed analogy of the two laws (rel_eq1_scales_as_cerda_deep_substrate, provenance proposed), not
    a thickness of either tissue. Mapping loop_wavelength to cerda2003's wrinkle_wavelength and an
    effective length to its sheet_thickness would cross quantities that only share a dimension, and
    entering that length would mean writing a computed value as an input; the comparison belongs to the
    relation jobs, model against model. (2) This record's models against cerda2003's measurements: those
    are the Fig. 1 polyethylene sheet (L, W, t, gamma) and the pinched skin fold 2Hs ≈ 5 mm, all inputs;
    no loop wavelength, radius or number is measured there, and the gut laws need tube and mesentery
    moduli that a single sheet does not have. The other direction is cerda2003/q_no_validation_savin2011.
  citation: {page: 17, printed_page: "SI 10", quote: "leads to the formation of many fine wrinkles", where: "SI text"}
