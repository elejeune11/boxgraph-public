- id: q_eps0_sign_convention
  kind: possible_error
  about: [lattice_simulation, e0_chE8, e0_chE12, e0_chE16]
  text: >
    Methods (p. 7) defines the imposed relative growth as eps0 = am/at - 1 (mesentery rest length over tube rest
    length), while the SI (p. 16) sets at/am = 1 + eps0 (tube over mesentery). The two are inverse conventions: with
    eps0 > 0 the Methods form makes the mesentery longer than the tube, the SI form makes the tube longer, which is
    what the text describes (the tube grows longer than the mesentery perimeter, eps_p = Lt/Lm - 1). The Methods
    form is probably a misprint. It does not touch Eqs. 1-4 but bears on the non-runnable lattice simulation.
  citation: {page: 7, quote: "measured and input into the energy, with the relative growth", where: "Methods, Computational model; SI p. 9 (page 16)"}
- id: q_fig_s3_caption_form
  kind: possible_error
  about: [magnet_force_law]
  text: >
    The Fig. S3 caption prints the power law as F(d) = F0 (d/d0)^alpha, while the SI text, the label inside the
    plot and Table S1 use F(d) = F0 (d0/d)^alpha, the form entered in magnet_force_law. With alpha about 4 the
    caption's form would give a force growing with distance, against the plotted curves; the caption is probably
    a misprint. No variant model is written, since the record's model already follows the text.
  citation: {page: 10, printed_page: "SI 3", quote: "The parameters for the power-law fit", where: "Fig. S3 caption"}
- id: q_table_s1_vs_fig_s3
  kind: unexplained_difference
  about: [F0_rb0122, F0_rb0253, F0_rb0398, magnet_force_law, q_force_range]
  text: >
    On the page image, at a glance (not a figure reading), the plotted calibration curves of Fig. S3 reach only
    about 10^-3 N for the largest bead near d = 1.5-2 mm and about 10^-4 N for the smallest, and the whole plot
    spans 10^-6 to about 2 x 10^-3 N, consistent with the Methods range "1 μN to 1 mN". The Table S1 laws, with
