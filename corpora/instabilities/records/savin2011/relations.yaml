# Eqs. 3 and 4 are Eqs. 1 and 2 with the prefactors 36 and 4 fitted to the simulations and rubber models
# ("find that they follow the relations", p. 4); Eq. 3 and 4 use It = (pi/4)(ro^4 - ri^4), Eqs. 1 and 2 It ~ ro^4 - ri^4.
- id: rel_eq3_scales_as_eq1
  kind: scales_as
  a: savin2011/wavelength_eq3
  b: savin2011/wavelength_eq1
  mapping: {Et: Et, ro: ro, ri: ri, Em: Em, h: h}
  output_map: {lam: lam}
  regime: {Et: [1.0, 10.0], ro: [100.0, 500.0], ri: [20.0, 90.0], Em: [30.0, 1000.0], h: [5.0, 20.0]}
  provenance: stated
  citation: {page: 4, printed_page: "60", quote: "in accord with our simple scaling laws (equations (1) and (2))", where: "text after Eqs. 3 and 4"}
