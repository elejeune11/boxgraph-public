id: strip_fit_line
name: fitted in-plane bending of the bimaterial strip against k1/k2 (SI p. 8, the line of Fig. S6c)
role: fit
stated: {page: 15, printed_page: "SI 8", quote: "The results of these simulations are shown in Figure S6c and fit the relation", where: "SI text and Fig. S6c"}
equation: "b1par h = 0.36 k1 a1^3, i.e. b1par h/(k2 a1^3) = c (k1/k2) with c = 0.36"
inputs:
  c: {quantity: strip_inplane_bending_coefficient, unit: dimensionless}
  r: {quantity: strip_stiffness_ratio, unit: dimensionless}
outputs:
  y: {quantity: strip_scaled_inplane_bending, unit: dimensionless}
settings: {}
stochastic: false
