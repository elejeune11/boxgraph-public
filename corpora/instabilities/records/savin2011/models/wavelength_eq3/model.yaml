id: wavelength_eq3
name: loop wavelength fitted to simulations and rubber models (Eq. 3)
role: model
stated: {page: 4, printed_page: "60", quote: "and find that they follow the relations", where: Eq. 3}
equation: "lambda ≈ 36 (Et It / (Em h))^(1/3),  It = (pi/4)(ro^4 - ri^4) (SI footnote 6, p. 16)"
inputs:
  Et: {quantity: tube_modulus, unit: kPa}
  ro: {quantity: tube_outer_radius, unit: um}
  ri: {quantity: tube_inner_radius, unit: um}
  Em: {quantity: mesentery_modulus, unit: kPa}
  h: {quantity: mesentery_thickness, unit: um}
outputs:
  lam: {quantity: loop_wavelength, unit: mm}
settings: {}
stochastic: false
