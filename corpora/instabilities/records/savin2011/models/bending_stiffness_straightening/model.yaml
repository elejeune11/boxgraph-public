id: bending_stiffness_straightening
name: tube bending stiffness from the straightening of a curved tube segment (SI p. 6)
role: processing
stated: {page: 13, printed_page: "SI 6", quote: "in the tube straightening regime of the tensile test", where: "SI text and footnote 2"}
equation: "F = (Et It / v0^2) delta, so Et It = (dF/d delta) v0^2, with v0 ≈ 1.5 ro"
inputs:
  slope: {quantity: tube_force_extension_slope, unit: N}
  v0_over_ro: {quantity: initial_deflection_over_radius, unit: dimensionless}
  ro: {quantity: tube_outer_radius, unit: um}
outputs:
  EtIt: {quantity: tube_bending_stiffness, unit: N*m^2}
settings: {}
stochastic: false
