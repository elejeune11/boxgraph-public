id: magnet_force_law
name: power-law fit of the magnet-bead force (SI p. 3, Table S1)
role: fit
stated: {page: 10, printed_page: "SI 3", quote: "the force follows a power-law scaling", where: "SI text and Table S1"}
equation: "F(d) = F0 (d0/d)^alpha, d0 = 1 mm"
inputs:
  F0: {quantity: magnet_force_prefactor, unit: N}
  alpha: {quantity: magnet_force_exponent, unit: dimensionless}
  d0: {quantity: magnet_reference_distance, unit: mm}
  d: {quantity: bead_magnet_distance, unit: mm}
outputs:
  F: {quantity: magnet_force, unit: N}
settings: {}
stochastic: false
