id: eq3_scaled_line
name: Eq. 3 divided by ro, the line of Figs. 4b and 5b
role: model
stated: {page: 4, printed_page: "60", quote: "plotted versus the equivalently scaled expression from equation (3)", where: "Fig. 4b caption and Eq. 3"}
equation: "lambda/ro = (36/ro) (Et It/(Em h))^(1/3); the abscissa X of Fig. 4b is the right-hand side, so lambda/ro = X"
inputs:
  X: {quantity: scaled_eq3_expression, unit: dimensionless}
outputs:
  y: {quantity: loop_wavelength_over_tube_radius, unit: dimensionless}
settings: {}
stochastic: false
built_from: [wavelength_eq3]
