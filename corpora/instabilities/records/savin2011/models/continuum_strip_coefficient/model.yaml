id: continuum_strip_coefficient
name: continuum in-plane bending coefficient of a strip of width w a1 (SI footnote 3)
role: model
stated: {page: 15, printed_page: "SI 8", quote: "In fact, one expects only small deviations, due to discretization errors", where: "SI footnote 3"}
equation: "b1par h = k1 (2 a1)^3 / 12, i.e. c = w^3/12 with w = 2"
inputs:
  w: {quantity: strip_width_over_spacing, unit: dimensionless}
outputs:
  c: {quantity: strip_inplane_bending_coefficient, unit: dimensionless}
settings: {}
stochastic: false
