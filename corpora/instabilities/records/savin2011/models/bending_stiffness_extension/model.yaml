id: bending_stiffness_extension
name: tube bending stiffness from the axial stiffness of the straightened tube (SI p. 6)
role: processing
stated: {page: 13, printed_page: "SI 6", quote: "while the slope in the second regime yields a stiffness of order", where: "SI text"}
equation: "dF/d eps = 4 Et It / (ro^2 + ri^2), so Et It = (dF/d eps)(ro^2 + ri^2)/4"
inputs:
  slope: {quantity: tube_force_extension_slope, unit: N}
  ro: {quantity: tube_outer_radius, unit: um}
  ri: {quantity: tube_inner_radius, unit: um}
outputs:
  EtIt: {quantity: tube_bending_stiffness, unit: N*m^2}
settings: {}
stochastic: false
