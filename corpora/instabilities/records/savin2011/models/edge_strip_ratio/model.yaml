id: edge_strip_ratio
name: stretching-to-bending ratio of the 2-row edge strip from its calibration (SI p. 8)
role: model
stated: {page: 15, printed_page: "SI 8", quote: "Matching both the in-plane and out-of-plane bending stiffnesses", where: "SI text after Eq. S1"}
equation: "b1par h = c k1 a1^3 (c = 0.36, fitted) and b1par h = 2 b1 a1, so k1 a1^2 / b1 = 2 / c"
inputs:
  c: {quantity: strip_inplane_bending_coefficient, unit: dimensionless}
outputs:
  ratio: {quantity: tube_stretch_bend_ratio, unit: dimensionless}
settings: {}
stochastic: false
