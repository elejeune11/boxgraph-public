id: eq4_scaled_line
name: Eq. 4 divided by ro, the line of Figs. 4c and 5c
role: model
stated: {page: 4, printed_page: "60", quote: "from equation (4) for the chick gut, the rubber model, and numerical", where: "Fig. 4c caption and Eq. 4"}
equation: "R/ro = (4/ro) (Et It/(Em h eps0^2))^(1/3); the abscissa X of Fig. 4c is the right-hand side, so R/ro = X"
inputs:
  X: {quantity: scaled_eq4_expression, unit: dimensionless}
outputs:
  y: {quantity: loop_radius_over_tube_radius, unit: dimensionless}
settings: {}
stochastic: false
built_from: [radius_eq4]
