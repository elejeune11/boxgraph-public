id: radius_eq4
name: loop radius fitted to simulations and rubber models (Eq. 4)
role: model
stated: {page: 4, printed_page: "60", quote: "and find that they follow the relations", where: Eq. 4}
equation: "R ≈ 4 (Et It / (Em h eps0^2))^(1/3),  It = (pi/4)(ro^4 - ri^4) (SI footnote 6, p. 16)"
inputs:
  Et: {quantity: tube_modulus, unit: kPa}
  ro: {quantity: tube_outer_radius, unit: um}
  ri: {quantity: tube_inner_radius, unit: um}
  Em: {quantity: mesentery_modulus, unit: kPa}
  h: {quantity: mesentery_thickness, unit: um}
  e0: {quantity: effective_mismatch_strain, unit: dimensionless}
outputs:
  R: {quantity: loop_radius, unit: mm}
settings: {}
stochastic: false
