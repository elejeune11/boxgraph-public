id: growth_rate_from_mitoses
name: instantaneous volumetric growth rate from counted mitoses (SI p. 11-13)
role: model
stated: {page: 20, printed_page: "SI 13", quote: "we thus obtain instantaneous volume growth rate of about", where: "SI text"}
equation: "rate = N Vcell / (V t_mitosis)"
from_words: true
inputs:
  N: {quantity: cell_count, unit: dimensionless}
  V: {quantity: tissue_volume, unit: pL}
  Vc: {quantity: cell_volume, unit: pL}
  tm: {quantity: mitosis_duration, unit: hour}
outputs:
  rate: {quantity: volumetric_growth_rate, unit: percent/hour}
settings: {}
stochastic: false
