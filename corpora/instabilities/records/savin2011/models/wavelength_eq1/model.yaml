id: wavelength_eq1
name: loop wavelength scaling at the onset of looping (Eq. 1), prefactor unknown
role: model
stated: {page: 3, printed_page: "59", quote: "yields a scaling law for the wavelength of the loop", where: Eq. 1}
equation: "lambda ~ (Et It / (Em h))^(1/3),  It ~ ro^4 - ri^4"
prefactor: unknown
inputs:
  Et: {quantity: tube_modulus, unit: kPa}
  ro: {quantity: tube_outer_radius, unit: um}
  ri: {quantity: tube_inner_radius, unit: um}
  Em: {quantity: mesentery_modulus, unit: kPa}
  h: {quantity: mesentery_thickness, unit: um}
outputs:
  lam: {quantity: loop_wavelength, unit: mm}
settings: {}
stochastic: false
