id: tube_stretch_bend_ratio
name: stretching-to-bending ratio of a continuum tube, kt ro^2 / bt (SI p. 8)
role: model
stated: {page: 15, printed_page: "SI 8", quote: "Then kt and bt are related by the following relation", where: "SI text"}
equation: "kt ro^2 = 4 / (1 + (ri/ro)^2) bt   (from kt = Et pi (ro^2 - ri^2)/(2 ro), bt = Et pi (ro^4 - ri^4)/(8 ro), p. 7)"
inputs:
  x: {quantity: tube_radius_ratio, unit: dimensionless}
outputs:
  ratio: {quantity: tube_stretch_bend_ratio, unit: dimensionless}
settings: {}
stochastic: false
