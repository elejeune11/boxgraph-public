id: mesentery_tension_ratio
name: ratio of mesentery tensions Em h eps0 between two embryos (p. 5)
role: model
stated: {page: 5, printed_page: "61", quote: "tension, Emhe0, approximately five times greater", where: "text, left column"}
equation: "(Em h eps0)_1 / (Em h eps0)_2"
inputs:
  Em1: {quantity: mesentery_modulus, unit: kPa}
  h1: {quantity: mesentery_thickness, unit: um}
  e1: {quantity: effective_mismatch_strain, unit: dimensionless}
  Em2: {quantity: mesentery_modulus, unit: kPa}
  h2: {quantity: mesentery_thickness, unit: um}
  e2: {quantity: effective_mismatch_strain, unit: dimensionless}
outputs:
  ratio: {quantity: mesentery_tension_ratio, unit: dimensionless}
settings: {}
stochastic: false
