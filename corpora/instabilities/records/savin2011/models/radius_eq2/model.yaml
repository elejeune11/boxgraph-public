id: radius_eq2
name: loop radius scaling far from onset, from torque balance (Eq. 2), prefactor unknown
role: model
stated: {page: 3, printed_page: "59", quote: "by equating Tt with Tm, and assuming that e0", where: Eq. 2}
equation: "R ~ (Et It / (Em h eps0^2))^(1/3),  It ~ ro^4 - ri^4"
prefactor: unknown
inputs:
  Et: {quantity: tube_modulus, unit: kPa}
  ro: {quantity: tube_outer_radius, unit: um}
  ri: {quantity: tube_inner_radius, unit: um}
  Em: {quantity: mesentery_modulus, unit: kPa}
  h: {quantity: mesentery_thickness, unit: um}
  e0: {quantity: effective_mismatch_strain, unit: dimensionless}
outputs:
  R: {quantity: loop_radius, unit: mm}
settings: {}
stochastic: false
