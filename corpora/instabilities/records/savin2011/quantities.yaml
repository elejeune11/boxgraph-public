- {id: tube_length, name: gut tube contour length, dimension: "[length]", description: "Lt, the length of the dissected gut tube (midgut)"}
- {id: mesentery_thickness, name: dorsal mesentery thickness, dimension: "[length]", description: "h, thickness of the mesentery sheet at physiological strain, from histological sections"}
- {id: tube_outer_radius, name: gut tube outer radius, dimension: "[length]", description: "ro, outer radius of the gut tube cross-section"}
- {id: tube_inner_radius, name: gut tube inner radius, dimension: "[length]", description: "ri, inner (lumen) radius of the gut tube cross-section"}
- {id: tube_radius_ratio, name: gut tube inner to outer radius ratio, dimension: "dimensionless", description: "ri/ro"}
- {id: mesentery_modulus, name: mesentery effective Young's modulus, dimension: "[mass]/[length]/[time]**2", description: "Em = (d sigma/d eps) at eps = eps_p, the tangent modulus of the mesentery at its physiological strain"}
- {id: tube_modulus, name: gut tube Young's modulus, dimension: "[mass]/[length]/[time]**2", description: "Et = sigma/eps from the linear low-strain (< 10%) tensile response of the tube"}
- {id: physiological_mismatch_strain, name: physiological strain mismatch, dimension: "dimensionless", description: "eps_p = Lt/Lm - 1, tube length over mesentery rest perimeter minus one"}
- {id: effective_mismatch_strain, name: effective differential growth strain, dimension: "dimensionless", description: "eps_0, from linearizing the mesentery stress-strain curve at eps_p; the strain mismatch entering the scaling laws and the simulation"}
- {id: loop_number, name: number of gut loops, dimension: "dimensionless", description: "n, number of loop periods along the tube"}
- {id: loop_wavelength, name: loop contour wavelength, dimension: "[length]", description: "lambda, contour length of the tube in one loop period"}
- {id: loop_radius, name: loop radius of curvature, dimension: "[length]", description: "R, mean radius of curvature of the tube in one loop period"}
- {id: embryonic_age, name: embryonic age, dimension: "[time]", description: "developmental stage as embryonic day (E8 = 8 days); used as a condition"}
- {id: tube_bending_stiffness, name: gut tube bending stiffness, dimension: "[mass]*[length]**3/[time]**2", description: "Et It, product of tube modulus and second moment of area"}
- {id: tube_force_extension_slope, name: force per relative extension of a tube sample, dimension: "[force]", description: "dF/d delta or dF/d eps in the tensile test of a gut tube segment: force per unit relative extension"}
- {id: initial_deflection_over_radius, name: initial tube deflection over outer radius, dimension: "dimensionless", description: "v0/ro, the rest deflection of a naturally curved tube segment from a straight line, in units of ro"}
- {id: strip_inplane_bending_coefficient, name: in-plane bending coefficient of the 2-row edge strip, dimension: "dimensionless", description: "c in b1_parallel h = c k1 a1^3: effective in-plane bending stiffness of the simulated 2-row strip per k1 a1^3"}
- {id: strip_width_over_spacing, name: edge strip width over lattice spacing, dimension: "dimensionless", description: "width of the simulated edge strip in units of the spring rest length a1 (2a1 for 2 rows)"}
- {id: tube_stretch_bend_ratio, name: tube stretching to bending stiffness ratio, dimension: "dimensionless", description: "kt ro^2/bt (equivalently k1 a1^2/b1): ratio of in-plane stretching stiffness times radius squared to out-of-plane bending stiffness of the tube strip"}
- {id: mesentery_tension_ratio, name: ratio of mesentery tensions between two embryos, dimension: "dimensionless", description: "(Em h eps0) of one species over (Em h eps0) of another"}
- {id: cell_count, name: number of cells, dimension: "dimensionless", description: "number of cells created per mitotic time in a tissue volume"}
- {id: tissue_volume, name: tissue volume counted, dimension: "[length]**3", description: "volume of tissue in which proliferating cells were counted"}
- {id: cell_volume, name: effective cell volume, dimension: "[length]**3", description: "volume of one cell"}
- {id: mitosis_duration, name: duration of mitosis, dimension: "[time]", description: "time taken by one mitosis (generational time used in the estimate)"}
- {id: volumetric_growth_rate, name: volumetric tissue growth rate, dimension: "1/[time]", description: "relative rate of volume increase of a tissue"}
- {id: magnet_force, name: magnet-bead attractive force, dimension: "[force]", description: "F(d), force of the permanent magnet on a steel bead at distance d"}
- {id: magnet_force_prefactor, name: magnet force at reference distance, dimension: "[force]", description: "F0 = F(d0) in the power-law fit F(d) = F0 (d0/d)^alpha"}
- {id: magnet_force_exponent, name: magnet force power-law exponent, dimension: "dimensionless", description: "alpha in F(d) = F0 (d0/d)^alpha"}
- {id: bead_magnet_distance, name: bead-magnet distance, dimension: "[length]", description: "d, distance between the bead centre and the magnet edge"}
- {id: magnet_reference_distance, name: reference distance of the magnet force fit, dimension: "[length]", description: "d0 in F(d) = F0 (d0/d)^alpha"}
- {id: bead_radius, name: steel bead radius, dimension: "[length]", description: "rb, radius of the steel ball; used as a condition"}
# ---- figure readings (2026-11-19 figure pass; block generated, below this line) ----
- {id: mesentery_rest_length, name: "mesentery rest perimeter length", dimension: "[length]", description: "Lm, natural rest length of the mesentery periphery, measured on strips cut along the gut junction"}
- {id: mesentery_stress, name: "nominal stress in a mesentery strip", dimension: "[mass]/[length]/[time]**2", description: "sigma = F/A0 in the uniaxial tensile test of a mesentery strip"}
- {id: mesentery_strain, name: "nominal strain of a mesentery strip", dimension: "dimensionless", description: "eps = L/L0 - 1 in the uniaxial tensile test of a mesentery strip"}
- {id: tube_stress, name: "nominal stress in a gut tube sample", dimension: "[mass]/[length]/[time]**2", description: "sigma = F/A0 in the uniaxial tensile test of a gut tube segment"}
- {id: tube_strain, name: "nominal strain of a gut tube sample", dimension: "dimensionless", description: "eps = L/L0 - 1 in the uniaxial tensile test of a gut tube segment"}
- {id: scaled_eq3_expression, name: "Eq. 3 expression over ro", dimension: "dimensionless", description: "(36/ro) (Et It/(Em h))^(1/3), the abscissa of Figs. 4b, 5b"}
- {id: loop_wavelength_over_tube_radius, name: "loop wavelength over tube outer radius", dimension: "dimensionless", description: "lambda/ro"}
- {id: scaled_eq4_expression, name: "Eq. 4 expression over ro", dimension: "dimensionless", description: "(4/ro) (Et It/(Em h eps0^2))^(1/3), the abscissa of Figs. 4c, 5c"}
- {id: loop_radius_over_tube_radius, name: "loop radius over tube outer radius", dimension: "dimensionless", description: "R/ro"}
- {id: strip_stiffness_ratio, name: "stretching stiffness ratio of the two strips", dimension: "dimensionless", description: "k1/k2 in the bimaterial-strip calibration"}
- {id: strip_scaled_inplane_bending, name: "scaled in-plane bending stiffness of strip 1", dimension: "dimensionless", description: "b1par h/(k2 a1^3)"}
- {id: tube_slice_index, name: "slice of the tube cross-section", dimension: "dimensionless", description: "the eight equal angular slices a-h of a tube section (Fig. S1), numbered 1-8 in printed order; a = 1 is the mesentery side"}
- {id: proliferation_region_index, name: "region along the gut", dimension: "dimensionless", description: "the regions along the rostrocaudal axis in which proliferating cells were counted (Fig. 1b), numbered 1, 2, ... from anterior"}
- {id: proliferating_cell_density, name: "mitotic (phospho-H3-positive) cells per unit section area", dimension: "1/[length]**2", description: "average number of proliferating cells per unit surface of tissue section"}
