- id: n_one_fold
  quantity: fold_number
  unit: dimensionless
  printed: "1"
  basis: >-
    Figs. S6G-I are computed for buckled rings of one fold (Fig. S6D shows one fold, and Section 3 says
    the one-fold shape has the lowest energy for small excess strain); Eqs. S17-S18 need the number of
    folds n, which the caption of Fig. S6 does not state.
  alternatives: ["2"]
  stands_for: n in Eqs. S17-S18
