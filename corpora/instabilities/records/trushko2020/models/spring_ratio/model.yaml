id: spring_ratio
name: ratio of the spring constants of capsules with and without a monolayer
role: model
stated: {page: 37, quote: "we use the ratio between K/K cap ∼ 1.16 ± 0.12", where: "Methods S1, Section 5"}
equation: "K / K^cap"
inputs:
  k_tissue: {quantity: capsule_tissue_spring_constant, unit: uN/um}
  k_cap: {quantity: capsule_spring_constant, unit: uN/um}
outputs:
