id: friction_force_scale
name: non-slipping (friction) force threshold of the vertex model from its normalised value
role: model
stated: {page: 40, quote: "slipping force FN S = FN S K(A0 )3/2 with FN S = 0.01", where: "Methods S1, Section 8"}
equation: "F_NS = Fbar_NS K (A^0)^(3/2)"
inputs:
  Fbar: {quantity: normalized_non_slipping_force, unit: dimensionless}
  Karea: {quantity: cell_area_elasticity, unit: N/m^3}
  A0: {quantity: cell_preferred_area, unit: um^2}
outputs:
  F_NS: {quantity: non_slipping_force, unit: N}
settings: {}
stochastic: false
