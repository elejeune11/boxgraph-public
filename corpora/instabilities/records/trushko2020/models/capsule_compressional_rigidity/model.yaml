id: capsule_compressional_rigidity
name: compressional (stretching) rigidity of the alginate shell
role: model
stated: {page: 37, quote: "rigidity λcap = Eh/(1 − ν 2 ) = 0.52 ± 0.02 µN/µm", where: "Methods S1, Section 5; Table 1"}
equation: "lambda^cap = E h / (1 - nu^2)"
inputs:
  E: {quantity: capsule_young_modulus, unit: kPa}
  h: {quantity: capsule_thickness, unit: um}
  nu: {quantity: capsule_poisson_ratio, unit: dimensionless}
outputs:
  lambda_cap: {quantity: capsule_compressional_rigidity, unit: uN/um}
settings: {}
stochastic: false
