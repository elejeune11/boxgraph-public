id: capsule_spring_s36
name: indentation spring constant of an empty capsule (Eq. S36)
role: model
stated: {page: 37, quote: "for capsules without tissues", where: "Eq. S36"}
equation: "K^cap = 4 sqrt(lambda^cap K^cap) / R = sqrt(4/3) E h^2 / (1 - nu^2) R"
inputs:
  lambda_cap: {quantity: capsule_compressional_rigidity, unit: uN/um}
  Kcap: {quantity: capsule_bending_rigidity, unit: uN*um}
  R: {quantity: capsule_radius, unit: um}
outputs:
  k_cap: {quantity: capsule_spring_constant, unit: uN/um}
settings: {}
stochastic: false
