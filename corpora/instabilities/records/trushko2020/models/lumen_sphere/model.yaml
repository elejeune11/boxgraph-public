id: lumen_sphere
name: volume and area of a spherical monolayer lumen
role: model
stated: {page: 30, quote: "monolayer lumen is a sphere with a radius R ∼ 100 µm", where: "Methods S1, Section 1"}
equation: "V = (4/3) pi R^3, A = 4 pi R^2"
inputs:
  R: {quantity: lumen_radius, unit: um}
outputs:
  V: {quantity: lumen_volume, unit: m^3}
  A: {quantity: lumen_area, unit: m^2}
settings: {}
stochastic: false
from_words: true
