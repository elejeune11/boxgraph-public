id: water_flux_s1
name: water outflow across the monolayer if the lumen loses half its volume during folding (Eq. S1)
role: model
stated: {page: 30, quote: "Therefore, this water outflow is of the order of", where: "Eq. S1"}
equation: "J = (V/2) / (A T)"
inputs:
  V: {quantity: lumen_volume, unit: m^3}
  A: {quantity: lumen_area, unit: m^2}
  T: {quantity: folding_duration, unit: s}
outputs:
  J: {quantity: water_flux, unit: m/s}
settings: {}
stochastic: false
