id: compressional_from_s37
name: tissue compressional rigidity from the indentation spring-constant ratio (Eq. S37 solved for lambda)
role: model
stated: {page: 37, quote: "a simple relation that permits to decipher the mechanics of tissues", where: "Eq. S37"}
equation: "K/K^cap ~ 1 + (1/2) (K/K^cap + lambda/lambda^cap)  =>  lambda/lambda^cap = 2 (K/K^cap - 1) - K/K^cap; lambda = (lambda/lambda^cap) lambda^cap"
inputs:
  spring_ratio: {quantity: spring_constant_ratio, unit: dimensionless}
  bending_ratio: {quantity: bending_rigidity_ratio, unit: dimensionless}
  lambda_cap: {quantity: capsule_compressional_rigidity, unit: uN/um}
outputs:
  lambda_ratio: {quantity: compressional_rigidity_ratio, unit: dimensionless}
  lam: {quantity: tissue_compressional_rigidity, unit: uN/um}
settings: {}
stochastic: false
