id: growth_rate_fit
name: linear growth rate of the mean cell number (least-squares slope of Fig. 1F)
role: processing
stated: {page: 4, printed_page: "657", quote: "number increased linearly with a rate of 3.6", where: text}
equation: "N(t) = N0 + r t; r by least squares over the plotted means"
from_words: true
inputs:
  N: {quantity: cell_number, unit: dimensionless, curve: {quantity: elapsed_time, unit: h}}
outputs:
  rate: {quantity: cell_growth_rate, unit: 1/h}
settings: {}
stochastic: false
