id: lambda_from_eq1
name: tissue compressional rigidity estimated from the buckling pressure (Equation 1 solved for lambda)
role: model
stated: {page: 8, quote: "we estimated l z 0.1 N/m from Equation 1", where: "text; Equation 1"}
equation: "lambda ~ (P_buckling R^(11/5) / K^(3/5))^(5/2)"
inputs:
  P: {quantity: buckling_pressure, unit: Pa}
  K: {quantity: tissue_bending_rigidity, unit: N*m}
  R: {quantity: capsule_radius, unit: m}
outputs:
  lam: {quantity: tissue_compressional_rigidity, unit: N/m}
settings: {}
stochastic: false
prefactor: unknown
from_words: true
