id: sim_pressure_s42
name: pressure at buckling in the simulations from the cross-section force (Eq. S42)
role: model
stated: {page: 40, quote: "Therefore, the pressure P at buckling in our simulations is computed as", where: "Eq. S42"}
equation: "F_ext^SP = F_ext^CS nbCells^CS / pi; P = F_ext^SP / S, S = 4 pi R^2"
inputs:
  F_cs: {quantity: cross_section_force, unit: uN}
  n_cells: {quantity: cells_in_cross_section, unit: dimensionless}
  R: {quantity: capsule_radius, unit: um}
outputs:
  P: {quantity: buckling_pressure, unit: Pa}
settings: {}
stochastic: false
