id: vertex_normalized_params
name: normalised edge stiffness and bending coefficient of the vertex model, and their ratio
role: model
stated: {page: 40, quote: "for a set of normalised parameters", where: "Methods S1, Section 8; main text p. 10"}
equation: "kbar_s = k_s / (K A^0), cbar_b = c_b / (K (A^0)^2), ratio kbar_s / cbar_b"
inputs:
  ks: {quantity: edge_spring_coefficient, unit: uN/um}
  cb: {quantity: cell_bending_coefficient, unit: uN*um}
  Karea: {quantity: cell_area_elasticity, unit: N/m^3}
  A0: {quantity: cell_preferred_area, unit: um^2}
outputs:
  ks_bar: {quantity: normalized_edge_stiffness, unit: dimensionless}
  cb_bar: {quantity: normalized_bending_coefficient, unit: dimensionless}
  ratio: {quantity: normalized_stiffness_ratio, unit: dimensionless}
settings: {}
stochastic: false
