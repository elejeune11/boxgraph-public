id: ring_pressure_s25_normalized
name: pressure on the compressed ring before buckling in the units of Fig. S6B (Eqs. S25 and S21)
role: model
stated: {page: 35, printed_page: "13", quote: "yielding the compressive pressure as a function of the excess strain", where: "Eq. S25"}
equation: "P ~ (lambda Delta/R)(1 + K/(lambda R^2)) with Delta = (Delta/Delta_c) Delta_c, Delta_c^(5/3) = 30 (5/2)^(2/3) K/(lambda R^2)"
inputs:
  Lam: {quantity: normalized_compressional_rigidity, unit: dimensionless}
  x: {quantity: excess_strain_over_critical, unit: dimensionless}
outputs:
  p: {quantity: normalized_ring_pressure, unit: dimensionless}
settings: {}
stochastic: false
prefactor: unknown
