id: fold_small_strain_s17_s18
name: depth and opening angle of the folds of a buckled inextensible ring at small excess strain (Eqs. S17, S18)
role: model
stated: {page: 33, printed_page: "11", quote: "we deduce the power-law relations between the geometrical properties of the buckled ring", where: "Eqs. S17-S18"}
equation: "delta = 4 (5/2)^(1/3) (Delta/n)^(2/3); alpha = (2/5)^(1/3) (Delta/n)^(1/3)"
inputs:
  Delta: {quantity: ring_excess_strain, unit: dimensionless}
  n: {quantity: fold_number, unit: dimensionless}
outputs:
  delta_over_R: {quantity: fold_depth_ratio, unit: dimensionless, description: "delta in units of R (R = 1 in the numerics)"}
  alpha: {quantity: fold_opening_angle, unit: degree}
settings: {}
stochastic: false
