id: capsule_bending_rigidity
name: bending rigidity of the alginate shell (thin plate)
role: model
stated: {page: 37, quote: "approximated by elastic shells with a bending rigidity Kcap = Eh3 /(12(1 − ν 2 ))", where: "Methods S1, Section 5; Table 1"}
equation: "K^cap = E h^3 / (12 (1 - nu^2))"
inputs:
  E: {quantity: capsule_young_modulus, unit: kPa}
  h: {quantity: capsule_thickness, unit: um}
  nu: {quantity: capsule_poisson_ratio, unit: dimensionless}
outputs:
  Kcap: {quantity: capsule_bending_rigidity, unit: uN*um}
settings: {}
stochastic: false
