- id: q_no_validation_shyer2013
  kind: choice
  about: [critical_strain_s21, fold_small_strain_s17_s18, pbuckling_eq1, fold_elastica]
  text: >-
    No cross-validation with shyer2013 was added, in either direction. This paper cites shyer2013 only
    qualitatively (gut villi "compatible with shapes resulting from buckling", with confinement by
    smooth muscle rather than an elastic shell) and compares none of its models with that paper's data.
    (1) This record's models against shyer2013's measurements: the ring models are an inextensible or
    compressible ring confined inside a rigid circle with no foundation (Eqs. S17-S30, Equation 1). They
    return a critical excess strain, a buckling pressure, and fold depth and opening angle for a given
    fold count n, which is an input, not an output. shyer2013 measures circumferential and longitudinal
    compression ratios (0.5-0.66, far past any onset), fold spacing over endoderm thickness, and layer
    shear moduli of an endoderm bonded to a soft mesenchyme confined by muscle. That is a bilayer on a
    foundation, whose fold spacing is set by thickness and modulus ratio. None of those is the quantity
    a model here returns under its own assumptions, and no pressure, bending rigidity or fold angle of
    the gut is measured. (2) shyer2013's models against this record's measurements: they are the gut
    simulation's stress-free layer schedules (in embryonic time, for chick and mouse), ratio arithmetic
    on the gut's own measurements, a spot growth field and an FE energy minimisation that cannot be run.
    None takes an MDCK monolayer in an alginate capsule as input or returns a buckling pressure, spring
    constant, fold angle or fold count. See shyer2013/q_no_validation_trushko2020.
  citation: {page: 4, printed_page: "657", quote: "villi in the mice gut (Shyer et al., 2013)", where: text}
- id: q_no_validation_tallinen2015
  kind: choice
  about: [critical_strain_s21, pbuckling_eq1, fold_elastica, fig5f_exp_data, tallinen2015/first_unstable_mode, tallinen2015/mode_wavelength_h]
  text: >-
    No cross-validation with tallinen2015 was added, in either direction (job 2026-11-19). This paper
    cites Tallinen et al. 2014 (gyrification), not tallinen2015, and neither paper compares its model
    with the other's data. (1) tallinen2015 holds no measurement: its plotted points are finite-element
    results and its other values are predicted, derived or reported, so this record's models have
    nothing there to predict. (2) tallinen2015's models against this record's measurements: they give the
    threshold growth ratio and the wrinkle wavelength (in layer thicknesses) of a growing neo-Hookean
    layer bonded to a neo-Hookean half-space. Here the monolayer lines a thin alginate shell (19.9 um wall,
    97 um radius), detaches from it and folds into the lumen in 1-3 folds set by the confinement; the
    monolayer's modulus and thickness are not measured, and no measured quantity here is a growth ratio
    or a wavelength in layer thicknesses. A fold count from tallinen2015's wavelength would rest on a
    half-space and a bonding the experiment does not have. See tallinen2015/q_no_validation_trushko2020.
  citation: {page: 13, printed_page: "666", quote: "the gut and the brain gyration (Savin et al., 2011; Tallinen", where: text}
- id: q_no_validation_wang2014
  kind: choice
  about: [critical_strain_s21, pbuckling_eq1, pressure_compressed_ring, fold_elastica, capsule_bending_rigidity, capsule_compressional_rigidity, ref-mandal2014, wang2014/neo_hookean_uniaxial, wang2014/wrinkle_linear_stability]
  text: >-
    No cross-validation with wang2014 (Wang & Zhao 2014, film-substrate phase diagrams) was added, in either
    direction (job 2026-11-19). The pair was suggested by ref-mandal2014, but that is Mandal, Wang, Vitiello,
    Orellana & Balland (2014), Nat. Commun., cited (pp. 4-5) for a cellular traction force: a different Wang and
    a different work. This paper never cites wang2014 and compares none of its models with that paper's data.
    (1) This record's models against wang2014's measurements: the ring and capsule models return a critical
    excess strain, a buckling pressure, fold shapes, and the capsule's bending and compressional rigidities
    from E, h, nu. wang2014 measures shear moduli of Ecoflex and Sylgard, a film thickness range, peel-test
    adhesion energies (Fig. 3), uniaxial tension curves (Fig. 13) and the observed initial mode of each
    experiment on a flat bonded film (Fig. 7(a), recorded as its modulus ratio). None is a pressure, a ring
    strain, a fold shape or a plate rigidity, and capsule_bending_rigidity run on a Sylgard modulus and
    thickness would give a rigidity nobody measured. (2) wang2014's models against this record's measurements:
    they give the wrinkling onset strain of a neo-Hookean film bonded to a prestretched neo-Hookean half-space,
    the wrinkling/creasing boundary in mu_f/mu_s, and a neo-Hookean nominal stress in uniaxial tension. Here
    the monolayer lines a thin alginate shell and folds into a fluid lumen with no substrate behind it; no
    modulus ratio, onset strain or tension curve is measured (the capsule moduli come from AFM and indentation
    as single values, not stress-stretch curves). See wang2014/q_no_validation_trushko2020.
  citation: {page: 5, printed_page: "658", quote: "cell (Mandal et al., 2014). Dividing this value by the invagination", where: text}
- id: q_no_validation_cerda2003
  kind: choice
  about: [capsule_bending_rigidity, capsule_compressional_rigidity, critical_strain_s21, pbuckling_eq1, fold_elastica, Kcap_table, E_capsule, h_capsule, nu_capsule, fig5f_exp_data, K_tissue_table, cerda2003/bending_stiffness, cerda2003/wrinkle_eq6_scaling, cerda2003/deep_substrate_wavelength, cerda2003/B_vesicle]
  text: >-
    No cross-validation with cerda2003 was added, in either direction (job 2026-11-19). This paper does not
    cite cerda2003 (its Mahadevan references are Liang & Mahadevan 2009, Savin et al. 2011, Shyer et al. 2013
    and Tallinen et al. 2014), and neither paper compares its models with the other's data. (1) This record's
    models against cerda2003's measurements: cerda2003 measures only the Fig. 1 polyethylene sheet's length,
    width, thickness and tensile strain and the pinched skin fold 2Hs ≈ 5 mm. These are inputs; no model here
    returns a sheet dimension, a strain of a stretched sheet or a skin fold thickness. capsule_bending_rigidity
    has the same form as cerda2003/bending_stiffness (E h^3/12(1 - nu^2)), but cerda2003 measures no bending
    stiffness: its only B (B_vesicle) is derived from inputs it does not print. (2) cerda2003's models against
    this record's measurements: cerda2003/bending_stiffness run on the measured capsule modulus, thickness and
    the assumed nu = 1/2 gives a capsule bending rigidity, but this paper never measures one: Kcap_table and
