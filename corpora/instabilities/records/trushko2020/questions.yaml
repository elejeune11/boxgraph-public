    validation against a measurement. The wrinkle laws (Eq. 5, Eq. 6, the deep- and shallow-substrate limits)
    give a periodic wavelength of a sheet bonded to a foundation or under tension. Here the monolayer presses
    on a thin shell and folds inward, into a fluid lumen with nothing behind it, in 1-3 folds whose number
    is set by the confinement (Fig. 5F); the shell resists only outward motion and is not a bonded foundation
    of measured stiffness per area, and the monolayer's modulus and thickness are not measured (its bending
    rigidity, K_tissue_table, is fitted to the fold shapes). A fold count from lambda ~ (B/K)^(1/4) would
    rest on a foundation the experiment does not have and on a fitted B, and the law has an unknown
    prefactor. See cerda2003/q_no_validation_trushko2020.
  citation: {page: 37, quote: "approximated by elastic shells with a bending rigidity", where: "Methods S1, Section 5"}
- id: q_no_validation_haas2021
  kind: choice
  about: [critical_strain_s21, fold_small_strain_s17_s18, pbuckling_eq1, fold_elastica, capsule_spring_s36]
  text: >-
    No cross-validation with haas2021 was added, in either direction. Neither paper cites the other.
    (1) This record's models against haas2021's measurements: haas2021 records no measured value at all
    (every datum is reported or predicted; its figures are model curves, micrographs and drawings, and
    its Volvox shapes of Fig. 5 are model output). So there is nothing for the ring, fold or capsule
