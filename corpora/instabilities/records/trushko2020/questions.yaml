    haas2021/q_no_validation_trushko2020.
  citation: {none: "neither paper cites the other; the finding rests on the two records' models and data"}
- id: q_no_validation_fierling2022
  kind: choice
  about: [critical_strain_s21, pbuckling_eq1, fold_elastica, fold_small_strain_s17_s18, capsule_spring_s36]
  text: >-
    (Cross-validation against fierling2022; job 2026-11-19.) No validation is entered in either direction.
    Neither paper cites the other. (1) This record's models against fierling2022's measurements: those are
