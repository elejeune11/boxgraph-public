- {id: capsule_young_modulus, name: Young modulus of the alginate capsule, dimension: "[mass]/[length]/[time]**2", description: "apparent modulus from AFM indentation (Hertz-Sneddon fit)"}
- {id: capsule_poisson_ratio, name: Poisson ratio of the alginate capsule, dimension: dimensionless}
- {id: capsule_thickness, name: wall thickness of the alginate capsule, dimension: "[length]"}
- {id: capsule_radius, name: inner radius of the capsule (radius of the confinement R), dimension: "[length]"}
- {id: capsule_bending_rigidity, name: bending rigidity of the capsule shell K^cap, dimension: "[energy]"}
- {id: capsule_compressional_rigidity, name: compressional rigidity of the capsule shell lambda^cap, dimension: "[force]/[length]"}
- {id: capsule_spring_constant, name: indentation spring constant of an empty capsule K^cap, dimension: "[force]/[length]", description: "slope of force against indentation depth, FemtoTools flat tip"}
- {id: capsule_tissue_spring_constant, name: indentation spring constant of a capsule lined with a confluent monolayer K, dimension: "[force]/[length]"}
- {id: spring_constant_ratio, name: ratio of spring constants with and without monolayer K/K^cap, dimension: dimensionless}
- {id: bending_rigidity_ratio, name: ratio of tissue to capsule bending rigidity, dimension: dimensionless}
- {id: compressional_rigidity_ratio, name: ratio of tissue to capsule compressional rigidity, dimension: dimensionless}
- {id: tissue_bending_rigidity, name: bending rigidity of the epithelial monolayer K, dimension: "[energy]", description: "per unit length of the 2d ring"}
- {id: tissue_compressional_rigidity, name: compressional rigidity of the epithelial monolayer lambda, dimension: "[force]/[length]"}
- {id: monolayer_young_modulus, name: Young modulus of a cell monolayer (literature), dimension: "[mass]/[length]/[time]**2"}
- {id: cell_size, name: size of a cell (monolayer thickness scale), dimension: "[length]"}
- {id: critical_excess_strain, name: critical excess strain of the ring at the buckling transition Delta epsilon_c, dimension: dimensionless}
- {id: buckling_pressure, name: pressure on the capsule at the buckling transition, dimension: "[mass]/[length]/[time]**2"}
- {id: lumen_radius, name: radius of the monolayer lumen, dimension: "[length]"}
- {id: lumen_volume, name: volume of the monolayer lumen, dimension: "[length]**3"}
- {id: lumen_area, name: area of the monolayer lumen, dimension: "[length]**2"}
- {id: folding_duration, name: duration of folding, dimension: "[time]"}
- {id: water_flux, name: water outflow per unit area across the monolayer, dimension: "[length]/[time]"}
- {id: fold_depth_ratio, name: fold depth over capsule radius delta/R, dimension: dimensionless}
- {id: fold_opening_angle, name: "half opening angle of a single fold (alpha in theory, Phi measured)", dimension: dimensionless}
- {id: fold_inflection_angle, name: polar angle of the inflection point of a fold gamma, dimension: dimensionless}
- {id: normalized_buckling_pressure, name: P_B R^3 / K after buckling, dimension: dimensionless}
- {id: pressure_times_radius_cubed, name: "capsule pressure after buckling times R^3 (P_B R^3)", dimension: "[energy]"}
- {id: cell_area_elasticity, name: area elasticity coefficient of a cell in the vertex model K, dimension: "[force]/[length]**3"}
- {id: cell_preferred_area, name: preferred (resting) cross-section area of a cell A^0, dimension: "[length]**2"}
- {id: edge_spring_coefficient, name: edge spring coefficient of the vertex model k^s, dimension: "[force]/[length]"}
- {id: cell_bending_coefficient, name: bending coefficient of the vertex model c^b, dimension: "[energy]"}
- {id: normalized_edge_stiffness, name: normalised edge stiffness k^s/(K A^0), dimension: dimensionless}
- {id: normalized_bending_coefficient, name: normalised bending coefficient c^b/(K (A^0)^2), dimension: dimensionless}
- {id: normalized_stiffness_ratio, name: ratio of normalised edge stiffness to normalised bending coefficient, dimension: dimensionless}
- {id: normalized_non_slipping_force, name: normalised non-slipping force F_NS/(K (A^0)^(3/2)), dimension: dimensionless}
- {id: non_slipping_force, name: non-slipping (friction) force threshold on a vertex, dimension: "[force]"}
- {id: cross_section_force, name: total force of the simulated cross-section on the capsule F_ext^CS, dimension: "[force]"}
- {id: cells_in_cross_section, name: number of cells in the simulated cross-section, dimension: dimensionless}
# ---- second pass: quantities of the figure readings ----
- {id: elapsed_time, name: time from the start of the recording shown in the panel, dimension: "[time]", description: "each panel's own zero (start of imaging, of the experiment or of the FITC recording)"}
- {id: time_since_confluence, name: time from monolayer confluence, dimension: "[time]"}
- {id: cell_number, name: mean number of cells per capsule, dimension: dimensionless}
- {id: cell_growth_rate, name: rate of increase of the cell number per capsule (cells per unit time), dimension: "1/[time]"}
- {id: normalized_capsule_thickness, name: mean capsule thickness over its initial value, dimension: dimensionless}
- {id: capsule_pressure, name: pressure exerted on the capsule by the monolayer at a given time, dimension: "[mass]/[length]/[time]**2", description: "from capsule thinning (experiments) or from the vertex model (simulations)"}
- {id: alginate_concentration, name: alginate concentration of the capsule solution, dimension: dimensionless}
- {id: sample_rank, name: rank of a plotted point within its group (1 = lowest value), dimension: dimensionless, description: "an index with no physical meaning, used to make a group of points with no numeric x a curve"}
- {id: sample_count, name: number of capsules or simulations (in a group or a histogram bin), dimension: dimensionless}
- {id: indentation_depth, name: indentation depth of the FemtoTools probe, dimension: "[length]"}
- {id: indentation_force, name: force on the FemtoTools probe, dimension: "[force]"}
- {id: fold_depth, name: depth of a single fold delta, dimension: "[length]"}
- {id: fold_number, name: number of folds of a monolayer or a simulated ring, dimension: dimensionless}
- {id: normalized_cell_number, name: cell number over its value at the start, dimension: dimensionless}
- {id: fluorescence_intensity, name: mean FITC fluorescence intensity in a region of interest (arbitrary units), dimension: dimensionless}
- {id: normalized_fluorescence_intensity, name: mean FITC fluorescence intensity over its initial value, dimension: dimensionless}
- {id: monolayer_length, name: length of the monolayer in the equatorial plane, dimension: "[length]"}
- {id: ring_excess_strain, name: excess strain of the ring Delta eps = (L0 - 2 pi R)/(2 pi R), dimension: dimensionless}
- {id: excess_strain_over_critical, name: excess strain over the critical excess strain of Eq. S21, dimension: dimensionless}
- {id: normalized_compressional_rigidity, name: normalised compressional rigidity lambda R^2/K, dimension: dimensionless}
- {id: normalized_ring_pressure, name: P R^3/K of the compressed ring before buckling, dimension: dimensionless}
- {id: normalized_pressure_at_buckling, name: P_buckling R^3/K at the buckling transition, dimension: dimensionless}
- {id: normalized_fold_force, name: F_B R^2/K of a buckled ring, dimension: dimensionless}
