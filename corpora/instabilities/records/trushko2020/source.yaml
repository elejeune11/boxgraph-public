notes: >
  Scope: the quantitative core of the article, its STAR Methods and Methods S1. Recorded are (1)
  the capsule-shell constants of Table 1 and Section 5 (K^cap = Eh^3/12(1-nu^2), lambda^cap =
  Eh/(1-nu^2)) from the measured E, h and nu; (2) the chain that gives the tissue compressional
  rigidity from indentation (spring-constant ratio, K/K^cap, Eq. S37 solved for lambda/lambda^cap
  and lambda), the literature estimate lambda = 20 kPa x 10 um, and Eq. S36 for the absolute
  spring constant of an empty capsule, which the paper never compares with its measurement (a
  validation here; it does not reproduce, see q_s36_absolute); (3) the buckling threshold, Eq.
  S21 with its printed factor and with the factor 10 that Section 5 says it used, and the
  buckling pressure P ~ lambda Delta/R and Equation 1, both printed without a prefactor (judged
  on shape only; the build reports the prefactor that the printed and measured pressures imply);
  (4) the order-of-magnitude estimates of Methods S1 Section 1 (lumen volume, area, water flux)
  and of the vertex model (F_NS from its normalised value, kbar_s/cbar_b from the dimensional k^s
  and c^b, K ~ lambda/A0, the simulated buckling pressure of Eq. S42); most of these are printed
  with "~" and get no verdict; (5) the fold shape after buckling. The boundary-value problem of
  Eqs. S28-S30 (Chan and McMinn 1966) is solved numerically in the paper without the method, so
  the record's elastica solver (shooting on the first integral, inextensible limit) is marked
  reconstructed; its alpha(delta/R) and gamma(delta/R) are compared with the curves of Fig. 4H,
  its alpha(P_B R^3/K) with K = 0.5 uN um with the curve of Fig. 4I, and a least-squares fit in
  angle to the 14 measured points of Fig. 4I is compared with the printed K = 0.5 ± 0.2 uN um.
  Figures 4H and 4I are raster images; they are read by the record's own code (figures/_fig4.py,
  calibration from the ticks). A second pass (2026-11-19) read every other plot of data with
  calibrated code readings (figures.md lists each panel): measurements of Figs. 1F, 3D-G, 3J-L, 4F,
  4H, 4J, 5F, 6B-C, S1G, S2, S5F-H, S6F, and the paper's numerical results of Figs. 5F, 6B-D and
  S6B-I. Added comparisons: means and counts of the plotted points against the printed means and n,
  the Fig. 1F slope against the printed rate (not reproduced, q_growth_rate_fit), Fig. 3G against
  the text's 50-100 Pa (q_fig3g_range), Eqs. S25/S26 (shape only) against Figs. S6B-C (reproduced;
  q_s26_numerics_prefactor), Eqs. S17-S18 against Figs. S6G-H (not reproduced, q_s18_numerics), and
  the elastica curves against Fig. 6B. The proliferation rate and the Young moduli at 1, 1.5 and 2%
  are now recorded. Left out in the first pass, as feeding no model: timings (confluence 8.8 h, folding
  14.5 h), the deflection force (1.8 uN) behind the measured 128 Pa (their
  displacement and cap area are not printed, so Hooke's law cannot be rerun), Eq. S4 (pressure
  from capsule thinning: only curves, no printed inputs), the "of the order" values Kcap = 20 uN
  um and lambda^cap = 0.5 uN/um of Section 2 (rounded from Table 1), the small-strain scaling
  laws S11-S19 (they produce no printed number), K ~ 10^8 kBT and K ~ 10^-12 J, and the
  vertex-model results (fold-number distributions, angles, pressure curves: the simulations
  cannot be rerun). figures.md lists the plots not read. Notable doubts: the factor of Eq. S21
  replaced by 10 (q_s21_factor), the unstated prefactor behind lambda ~ 0.1 N/m from Equation 1
  (q_eq1_prefactor), a tenfold difference between the two friction forces of the vertex model
  (q_friction_force), and the unstated method of the K fit (q_fit_K_method).
