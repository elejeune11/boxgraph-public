- id: time_nondim
  name: time (model units)
  dimension: dimensionless
  description: "t in Eqs. (2)-(6) and Fig. 5; the paper gives no time unit, so all quantities of the rib model are nondimensional"
- id: shell_radius
  name: radius of the circular shell edge (aperture)
  dimension: dimensionless
  description: "r_s, radius of the circular shell edge to which the mantle attaches (Eq. 2, App. E), model units"
- id: rib_index
  name: rib number
  dimension: dimensionless
  description: "n, the index of a maximum of r_s(t) counted from t = 0 (each maximum is one commarginal rib)"
- id: mantle_unstressed_radius
  name: unstressed radius of the mantle edge
  dimension: dimensionless
  description: "gamma(t) a0, the radius the growing mantle ring would take free of stress (App. E); a0 is its value at t = 0. The dashed line of Fig. 5."
- id: mantle_growth_ratio
  name: mantle growth function
  dimension: dimensionless
  description: >
    gamma(t), the unstressed mantle radius over its initial value a0 (App. E). Growth maps onto an
    equivalent strain: the attached mantle has stretch alpha = a/(gamma a0) (Eq. E.1), and for a stiff
    attachment (large k_s) a ~ r_s, so the mantle carries a compressive strain 1 - r_s/(gamma a0) when the
    shell edge lags the mantle's growth; gamma a0 / r_s plays the role of a growth ratio (cf. 1/lambda for an
    applied stretch lambda).
- id: mantle_growth_rate
  name: rate of increase of the mantle growth function
  dimension: dimensionless
  description: "d gamma/dt for the linear growth law gamma = 1 + 0.05t of Fig. 5 (per model time unit)"
- id: feedback_gain
  name: stress-feedback gain on the deposition angle
  dimension: dimensionless
  description: "k_phi in the feedback laws H1, H2, H3 (Eqs. 4-6), model units"
- id: feedback_nonlinearity
  name: tension-compression asymmetry of the feedback
  dimension: dimensionless
  description: "K in H2 and H3 (Eqs. 5, 6), multiplying the axial stress n3 in the exponent"
- id: deposition_angle
  name: angle of shell deposition
  dimension: dimensionless
  description: "phi, the angle of material deposition (Eq. 2, Fig. 4), in radians"
- id: growth_vector_angle
  name: angle of the growth vector between normal and tangent
  dimension: dimensionless
  description: "theta in Eq. (2), fixed; describes the amount of rotation; radians"
- id: shell_deposition_rate
  name: growth rate (length of shell added per unit time)
  dimension: dimensionless
  description: "k_g: in time dt, k_g dt is the length of material added to the shell (p. 4); model units"
- id: mantle_axial_stiffness
  name: axial stiffness of the mantle edge
  dimension: dimensionless
  description: "EA, Young's modulus times cross-sectional area of the mantle-edge rod (Eq. E.2), model units"
- id: attachment_spring_stiffness
  name: stiffness of the attachment of the mantle to the shell edge
  dimension: dimensionless
  description: "k_s, the linear spring (foundation) stiffness per unit length binding the mantle rod to the shell edge (Eq. E.3) or to the aperture curve (Eq. 7); model units"
- id: mantle_bending_stiffness
  name: bending stiffness of the mantle edge
  dimension: dimensionless
  description: "EI, Young's modulus times second moment of area of the mantle rod (Eq. 8), model units"
- id: mantle_length_excess
  name: excess length of the mantle rod over the aperture per growth step
  dimension: dimensionless
  description: "L - L0, arclength of the mantle rod minus that of the aperture curve it attaches to, added at each growth increment of the bivalve model (Sect. 2.2, App. F); the growth input of the buckling model, model units"
- id: buckling_wavelength
  name: wavelength of the buckled mantle
  dimension: dimensionless
  description: "wavelength of the fold pattern of the mantle rod on its foundation, in the model's length units"
