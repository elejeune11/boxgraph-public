# Proposed against huang2005. moulton2012 does not cite huang2005 (or any film/substrate paper) and states no
# relation; it takes no value from it. Units in the mapping: lengths in film thicknesses h, stiffnesses in
# Es_bar, so EI = E_bar h^3/12 -> Ebar_over_Esbar/12 and ks = Es_bar (1 - nu_s)^2/((1 - 2 nu_s) H) ->
# (1 - nu_s)^2/((1 - 2 nu_s) H_over_h); the rod wavelength then comes out in units of h.
- id: rel_huang_eq18_same_as_winkler_rod
  kind: same_as
  a: huang2005/thin_compressible_eq18
  b: moulton2012/winkler_rod_wavelength
  mapping: {EI: "Ebar_over_Esbar/12", ks: "(1 - nu_s)**2/((1 - 2*nu_s)*H_over_h)"}
  output_map: {lam: lam_over_h}
  regime: {Ebar_over_Esbar: [10, 100000], H_over_h: [0.1, 10], nu_s: [0.0, 0.45]}
  provenance: proposed
  reason: >
    Huang's thin compressible-substrate limit (Eq. 18) is a plate of bending stiffness E_bar h^3/12 per unit
    width on a Winkler foundation of stiffness g Es_bar k with g -> (1 - nu_s)^2/((1 - 2 nu_s) kH), i.e. a
    spring constant Es_bar (1 - nu_s)^2/((1 - 2 nu_s) H) independent of k. Its wavelength,
    lambda_eq/(2 pi h) = [H E_bar (1 - 2 nu_s)/(12 h Es_bar (1 - nu_s)^2)]^(1/4), is then the rod-on-Winkler
    wavelength 2 pi (EI/k_s)^(1/4) with EI and k_s mapped as above. The moulton2012 model is the reader's
    reconstruction (the classical straight-rod result for the energy of its Eqs. 7-8, which the paper
    minimises only numerically), so this relates that stand-in, not a formula Moulton et al. printed. Only
    the wavelength is related: the rod model gives no critical force or amplitude. The mapping relates the
    forms; it does not make the mantle's EI and k_s the same physical quantities as a film's bending
    stiffness and a substrate's stiffness.
# Proposed against cerda2003. Neither paper cites the other, and neither takes a value from the other.
# Units: moulton2012's rod model is nondimensional (Appendix F); here its unit of length is read as 1 m
# and of force as 1 N, so EI (N m^2) and k_s (N/m^2) per rod map onto Cerda's B (N m) and K (N/m^3)
# per unit width with the same width cancelling, and the rod wavelength comes out in metres.
- id: rel_cerda_eq6_scales_as_winkler_rod
  kind: scales_as
  a: cerda2003/wrinkle_eq6_scaling
  b: moulton2012/winkler_rod_wavelength
  mapping: {EI: "B", ks: "K"}
  output_map: {lam: lam}
  regime: {B: [1.0e-12, 1.0e-2], K: [1.0e+2, 1.0e+9], Delta: [1.0e-6, 1.0e-2], W: [0.01, 0.5]}
  provenance: proposed
  reason: >
    Cerda & Mahadevan's Eq. 6, lambda ~ (B/K)^(1/4), is the wavelength of a sheet of bending stiffness B
    on an elastic foundation of stiffness K, printed without a prefactor. The moulton2012 stand-in is a rod
    of bending stiffness EI on a linear (Winkler) foundation of stiffness k_s per unit length, with
    lambda = 2 pi (EI/k_s)^(1/4): a strip of the sheet of width w has EI = B w and k_s = K w, so the ratio
    and the exponent 1/4 are the same and only the prefactor (2 pi against Cerda's unprinted one) is
    open; hence scales_as. The moulton2012 model is the reader's reconstruction of the straight-rod limit
    of the energy the paper minimises only numerically (Eqs. 7-8), so this relates that stand-in, not a
    formula Moulton et al. printed. Only the wavelength is related: the rod model gives no amplitude, and
    Cerda's Delta and W do not enter. The mantle's EI and k_s are not thereby the same physical quantities
    as a sheet's B and a substrate's K. The test cannot yet run: the rod model's output port is declared
    dimensionless and Cerda's in m, and the check does not convert between them (a units question about
    the reconstructed model, not about the form).
  assumptions:
    - "moulton2012's nondimensional length and force units read as 1 m and 1 N"
    - "rod per unit length compared with sheet per unit width (EI/k_s read as B/K)"
# savin2011 (relation job 2026-11-19): no relation entered. Neither paper cites the other and neither takes a
# value from the other. The rib models (Eqs. 2-6) have no counterpart in the gut-looping laws. The only
# candidate, winkler_rod_wavelength (lambda = 2 pi (EI/k_s)^(1/4), fixed k_s) against savin2011/wavelength_eq1
# (lambda ~ (Et It/(Em h))^(1/3)), is no mapping between inputs: Savin's energy balance (p. 3,
# Um ~ Em eps^2 h lambda^2 with eps ~ A/lambda) makes the stretched sheet a foundation of stiffness
# k_s ~ Em h/lambda, which depends on the output and changes the exponent from 1/4 to 1/3. A mapping
# k_s -> (Em h)^(4/3)/(Et It)^(1/3) would agree only because it puts Savin's answer into the input.
