- id: q_kphi_fig5a
  kind: possible_error
  about: [kphi_fig5a, cmp_t_ribs_fig5a, cmp_r_ribs_fig5a]
  text: >
    With the printed k_phi = 15 for Fig. 5(a), Eqs. (2)-(4) with Appendix E give 20 maxima of r_s in 0 < t < 30,
    while Fig. 5(a) shows 23, at times that drift ever earlier than the computed ones. Panels (b) and (c), with
    the same shared parameters and added inputs, are reproduced maximum by maximum. A trial outside the record
    with k_phi = 20 reproduces all 23 maxima of panel (a) to within about 0.01 in t and r_s. The printed
    "15" may be a misprint (for 20) or the panel may have been computed with another gain; the value is kept
    as printed.
  citation: {page: 5, quote: "linear feedback model, Eq. (4) with kf ¼ 15"}
- id: q_fig5_unstated
  kind: unstated_input
  about: [a0_added, theta_added]
  text: >
    The Fig. 5 caption gives neither a0 (initial unstressed mantle radius) nor theta (Eq. 2). Both are taken
    from the Fig. 6 parameters of Appendix F (a0 = 1, theta = 0). The dashed lines of Fig. 5 support a0 = 1
    (cmp_dashed_*), and panels (b) and (c) are reproduced with theta = 0.
- id: q_sign_H1
  kind: reading
  about: [ribs_linear_eq4, ribs_tension_eq5]
  text: >
    The OCR text drops the minus signs; the page image shows H1 = -k_phi n3 (Eq. 4) and H2 = k_phi(1 - e^{K n3})
    (Eq. 5), consistent with the text (compression, n3 < 0, increases the deposition angle). The models use
    the signs on the page image.
  citation: {page: 4, quote: "In Fig. 5a, a simple linear law is used"}
- id: q_root_E4
  kind: choice
  about: [ribs_linear_eq4, ribs_tension_eq5, ribs_decreasing_eq6]
  text: >
    Eq. (E.4) with (E.2) gives a quadratic for the equilibrium mantle radius a (the paper says only that it
    "can be solved"); the models take its positive root, the only one with a > 0. The ODE solver and its
    tolerance (LSODA, rtol 1e-9) are added choices; the paper says only that (3) "can easily be solved
    numerically". Refinements on rtol check that the rib times do not depend on it.
  citation: {page: 10, quote: "Inserting n3 from (E.2) into (E.4) gives a quadratic equation that can"}
- id: q_bivalve_not_rerun
  kind: unstated_model
  about: [winkler_rod_wavelength, EI_fig9, ks_fig9]
  text: >
    The bivalve simulation (Fig. 9; Eqs. 7, 8 with L - L0 = 0.25, EI = 0.1, k_s = 20) cannot be rerun: the size
    of the initial semicircular foundation, the number of growth increments, the discretisation of the rod and
    the minimisation method are not given, and no number of folds or wavelength is printed. The record only
    computes the classical straight-rod Winkler wavelength 2 pi (EI/k_s)^(1/4) from the printed EI and k_s
    (reconstructed model), which has nothing printed to be compared with; Fig. 9(a) has no labelled axes.
- id: q_bivalve_strain
  kind: reading
  about: [L_excess_fig9, winkler_rod_wavelength]
  text: >
    Audit: the growth input of the bivalve buckling model is the length excess L - L0 = 0.25 added per step
    (App. F). Its equivalent compressive strain (L - L0)/L would need the arclength of the initial semicircular
    foundation, which the paper does not give (p. 6 says only that it "is taken to be a semi circle"), so the
    bivalve growth cannot be put on the strain scale of the film/substrate papers, and whether the printed
    EI = 0.1, k_s = 20 put the rod above a buckling threshold cannot be checked.
  citation: {page: 6, quote: "The initial foundation is taken to be a semi"}
- id: q_dimensionless
  kind: reading
  about: [time_nondim, shell_radius]
  text: >
    The rib model is stated with no units: EA = 1, k_s = 5000, k_g = 2 and the plotted r_s and t are pure
    numbers. The record treats every quantity as nondimensional; no physical rib spacing or growth time is
    implied, so the rib model can be related to other papers only through dimensionless ratios.
