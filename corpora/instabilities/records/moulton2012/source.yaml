notes: >
  The quantitative core is the commarginal-rib model of Sect. 2.1 and Appendix E: a circular, growing,
  extensible elastic mantle ring (unstressed radius gamma(t) a0, axial force n3 = EA(alpha - 1)) attached to a
  circular shell edge of radius r_s by a linear spring k_s; its axial stress feeds back on the deposition angle
  phi, dr_s/dt = k_g cos(theta) sin(phi), dphi/dt = H(n3) (Eqs. 2-6). Its only printed results are the three
  curves r_s(t) of Fig. 5 (linear law Eq. 4, tension-stronger law Eq. 5, radius-decreasing law Eq. 6) and their
  dashed unstressed-radius lines. Each law is a model (ribs_linear_eq4, ribs_tension_eq5, ribs_decreasing_eq6);
  they output the time and height of the n-th maximum of r_s (the n-th rib), compared with the maxima read from
  each panel by code (figures/_fig5.py). This tests rib number, rib spacing (wavelength in time) and amplitude.
  Panels (b) and (c) reproduce rib by rib; panel (a) does not with the printed k_phi = 15 (20 ribs against 23
  plotted) and question q_kphi_fig5a records that k_phi = 20 matches every plotted maximum. The dashed lines are
  compared with gamma a0 = (1 + 0.05t) a0 (mantle_unstressed_radius), which supports the added a0 = 1. Growth
  enters as gamma(t), the mantle's unstressed radius over its initial one; for a stiff attachment the mantle
  carries a compressive strain 1 - r_s/(gamma a0), so gamma a0/r_s plays the role of a growth ratio (see
  quantity mantle_growth_ratio). The model is nondimensional throughout (no units are given).
  The antimarginal (bivalve) model, Sect. 2.2 and Fig. 9, minimises bending plus foundation energy of an
  inextensible rod (Eqs. 7, 8) numerically, with too little stated to rerun it and no wavelength, fold number or
  threshold printed; the record enters only its printed EI = 0.1 and k_s = 20 and a reconstructed
  straight-rod Winkler wavelength 2 pi (EI/k_s)^(1/4), the link to the plate-on-foundation wavelength laws of
  huang2005 and cerda2003 (same form with the plate bending stiffness in place of EI and the substrate
  stiffness in place of k_s); nothing in the paper is compared with it.
  Left out: the geometric CDRT growth framework (Sect. 1, Appendices A-D) and the CDRT parameters of Table F1
  and Eqs. F.1-F.2, which only produce the rendered shells of Figs. 2, 3, 6 and 9(b) (no values to read);
  Figs. 1, 4, 7, 8 (drawings), Fig. 6 and 9(b) (renderings and
  photographs) and Fig. 9(a) (overlaid aperture curves without labelled axes). The paper reports no
  measurements of real shells.
  Audit (second reading, 2026-11-14): see audit.md; the bivalve length excess L - L0 = 0.25 is now entered
  as datum L_excess_fig9 (it feeds no model).
