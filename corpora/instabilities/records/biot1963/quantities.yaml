- id: load_parameter_zeta
  name: compression relative to twice the incremental shear modulus
  dimension: dimensionless
  description: "zeta = P / (2 mu), the ratio of the initial compressive stress P to twice the incremental shear modulus mu (Eq. 2.8)"
- id: decay_factor_k
  name: depth decay factor of the surface mode
  dimension: dimensionless
  description: "k in the factor exp(-l k y) of the surface-mode displacement (Eq. 2.7): decay rate with depth relative to the wavenumber l"
- id: stretch_compression_axis
  name: principal stretch along the compression
  dimension: dimensionless
  description: "lambda = lambda_1, the principal elongation in the x direction of the initial finite strain (lambda < 1 compression, > 1 tension)"
- id: compression_over_mu0
  name: initial compressive stress relative to the small-strain shear modulus
  dimension: dimensionless
  description: "P / mu0, with P = -S11 the initial compressive stress (per unit current area) and mu0 = NkT the shear modulus of the unstrained rubber"
- id: incremental_modulus_ratio
  name: incremental shear modulus relative to the small-strain shear modulus
  dimension: dimensionless
  description: "mu / mu0, the incremental (plane-strain) shear modulus under finite initial strain relative to mu0"
- id: rigidity_factor_phi
  name: membrane-effect factor of the surface rigidity
  dimension: dimensionless
  description: "phi in Eqs. 4.7-4.8, the factor multiplying the incremental modulus mu in the normal surface deflection V = q0/(2 mu l phi); 1 in the unstressed state, 0 at the critical compression"
- id: surface_rigidity_factor
  name: effective surface rigidity factor
  dimension: dimensionless
  description: "mu phi / mu0, the effective rigidity modulus governing the normal surface deflection under a sinusoidal normal load, relative to mu0 (Eq. 4.10)"
