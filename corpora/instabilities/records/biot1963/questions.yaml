- id: q_strain_one_half
  kind: reading
  about: [lambda_plane_printed]
  text: >
    The paper calls the critical plane-strain state (lambda = 0.543) "a compressive strain slightly
    greater than one half"; the engineering compressive strain 1 - lambda is 0.457, slightly less than
    one half (the logarithmic strain is 0.61). Which strain measure is meant is not stated.
  citation: {page: 11, quote: "Hence for a compressive strain slightly greater than one half"}
- id: q_rounding_critical_values
  kind: unexplained_difference
  about: [cmp_lambda_plane, cmp_P_plane, cmp_P_plane_chain, cmp_k_eq28, cmp_k_uni, cmp_P_uni, cmp_P_uni_chain]
  text: >
    The critical values printed in section 4 behave as if truncated rather than rounded, or carried at
    a different precision from step to step. From zeta = 0.839 the stated equations give lambda =
    0.5440 (printed 0.543), k = 0.2959 from Eq. 2.8 and 0.2959 from lambda^(3/2) with 0.444 (printed
    0.295 for both cases), and P/mu0 = 2.055 for the uniaxial case (printed 2.05). The plane-strain
    P = 3.08 mu0 agrees with the unrounded stretch 0.5440 (3.084) but not with the printed 0.543
    (3.097). The positive root of the cubic itself is 0.8393, consistent with 0.839.
  citation: {page: 11, quote: "This equation is satisfied for"}
- id: q_table1_mu_rows
  kind: possible_error
  about: [table1_mu, cmp_table1_mu]
  text: >
    In the mu/mu0 column of Table I, Eq. 3.25 gives 1.067 at lambda = 1.20 (printed 1.06) and 1.101
    at lambda = 0.80 (printed 1.09); the entries at 2.00 (2.125, printed 2.12) are at the rounding
    boundary. The other rows agree to the printed digits. Possible misprints or arithmetic slips in the
    table; the printed values are kept as printed.
  citation: {page: 13, quote: "Values of the relative rigidity modulus"}
- id: q_table1_rigidity_rows
  kind: unexplained_difference
  about: [table1_rigidity, cmp_table1_rigidity]
  text: >
    In the mu phi/mu0 column of Table I, Eqs. 4.10, 4.8, 2.8 and 4.2 give 0.893 at lambda = 0.90
    (printed .90) and 0.262 at lambda = 0.60 (printed .28). At lambda = .543 they give -0.004 rather
    than 0, because the printed critical stretch 0.543 lies slightly below the root 0.5440 of Eq. 4.2;
    the printed 0 is the value at the exact critical stretch. At 2.00 the formula gives 2.275 (printed
    2.27), at the rounding boundary. The other rows agree to the printed digits.
  citation: {page: 13, quote: "Numerical values of this factor as a function of"}
- id: q_penetration_depth
  kind: unstated_model
  about: [k_crit_printed]
  text: >
    The claims that the disturbance "does not penetrate to a depth greater than approximately three
    times the wavelengths" and that with one boundary restrained instability appears only for
    wavelengths "smaller than about one third the thickness" rest on exp(-l k y) with k = 0.295, but
    no attenuation threshold is stated (at y = 3 wavelengths the amplitude is exp(-2 pi 0.295 3),
    about 0.004 of the surface value; the e-folding depth is about 0.54 wavelength). Not entered as a
    model.
  citation: {page: 14, quote: "does not penetrate to a depth greater than approximately three"}
- id: q_k_uniaxial_exponent
  kind: reading
  about: [k_uniaxial]
  text: >
    The exponent in "k = lambda^(3/2)" for the uniaxial case is printed as a small superscript that
    the scan renders poorly; it was read as 3/2, which follows from Eqs. 2.8 and 4.13
    ((1 - zeta)/(1 + zeta) = lambda^3).
  citation: {page: 14, quote: "The value of k is k"}
- id: q_phi_unstressed_branch
  kind: reading
  about: [surface_rigidity_plane, table1_rigidity]
  text: >
    Audit: Eq. 4.8 is 0/0 at zeta = 0 (lambda = 1). The model surface_rigidity_plane returns phi = 1 there
    by a hard-coded branch taken from the paper's statement (p. 179), so the lambda = 1.00 row of Table I
    (mu phi/mu0 = 1.00) is reproduced by assertion, not by evaluating the formula. The limit of Eq. 4.8 as
    zeta -> 0 is indeed 1 (k(1 + zeta)^2 = 1 + zeta + O(zeta^2)), so the printed value is consistent; the
    branch is kept as the first reader wrote it.
  citation: {page: 12, quote: "In the unstressed state, i.e. for P"}
- id: q_phi_zero_weak_test
  kind: reading
  about: [cmp_phi_crit, cmp_phi_cubic]
  text: >
    Audit: the printed phi = 0 (p. 180) carries a rounding interval of +/- 0.5 under the digit rule, so
    cmp_phi_crit and cmp_phi_cubic are weak tests. Eq. 4.8 gives phi = 7.8e-4 at the printed zeta = 0.839
    and about 4e-11 at the computed root of Eq. 2.9; the stated equivalence of phi = 0 with the cubic
    (2.9) holds exactly (k(1 + zeta)^2 = 1 squares to zeta^3 + 2 zeta^2 - 2 = 0 for zeta > 0).
  citation: {page: 13, quote: "At this critical value we find"}
