id: crit_stretch_plane
name: critical stretch, plane strain compression of a neo-Hookean half-space (Eq. 4.2)
role: model
stated: {page: 11, printed_page: "178", quote: "Introducing this value of P and expression (3.25) for", where: Eq. 4.2}
equation: "zeta = P/(2 mu) = (1 - lambda^4)/(1 + lambda^4) = 0.839"
inputs:
  zeta: {quantity: load_parameter_zeta, unit: dimensionless, description: "the root of the cubic, 0.839 in the paper"}
outputs:
  lam: {quantity: stretch_compression_axis, unit: dimensionless}
