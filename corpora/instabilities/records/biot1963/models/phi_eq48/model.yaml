id: phi_eq48
name: surface rigidity factor phi from the load parameter (Eq. 4.8, with k from Eq. 2.8)
role: model
stated: {page: 12, printed_page: "179", quote: "The relation between qo and V was evaluated in a previous paper", where: Eq. 4.8}
equation: "phi = (1/zeta) [k (1 + zeta)^2 - 1]; k = sqrt((1 - zeta)/(1 + zeta)) (Eq. 2.8)"
inputs:
  zeta: {quantity: load_parameter_zeta, unit: dimensionless}
outputs:
  phi: {quantity: rigidity_factor_phi, unit: dimensionless}
