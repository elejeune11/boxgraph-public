id: crit_stretch_uniaxial
name: critical stretch, uniaxial compression of a neo-Hookean half-space without lateral restraint (Eq. 4.13)
role: model
stated: {page: 14, printed_page: "181", quote: "The characteristic equation becomes", where: Eq. 4.13}
equation: "zeta = P/(2 mu) = (1 - lambda^3)/(1 + lambda^3) = 0.839"
inputs:
  zeta: {quantity: load_parameter_zeta, unit: dimensionless, description: "the root of the cubic, 0.839 in the paper"}
outputs:
  lam: {quantity: stretch_compression_axis, unit: dimensionless}
