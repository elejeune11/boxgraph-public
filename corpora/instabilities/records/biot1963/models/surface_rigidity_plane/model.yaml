id: surface_rigidity_plane
name: effective surface rigidity factor in plane strain (Eqs. 4.10, 4.8, 2.8, 4.2)
role: model
stated: {page: 13, printed_page: "180", quote: "surface rigidity modulus with the initial stress is represented by the factor", where: Eq. 4.10}
equation: "mu phi / mu0 = (1/2)(lambda^2 + 1/lambda^2) phi; phi = (1/zeta)[k (1 + zeta)^2 - 1] (Eq. 4.8); k = sqrt((1 - zeta)/(1 + zeta)) (Eq. 2.8); zeta = (1 - lambda^4)/(1 + lambda^4) (Eq. 4.2)"
inputs:
  lam: {quantity: stretch_compression_axis, unit: dimensionless}
outputs:
  rigidity: {quantity: surface_rigidity_factor, unit: dimensionless, description: "mu phi / mu0"}
