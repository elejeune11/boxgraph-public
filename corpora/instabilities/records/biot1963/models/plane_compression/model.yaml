id: plane_compression
name: compression of neo-Hookean rubber in plane strain, single force in x (Eq. 4.1)
role: model
stated: {page: 11, printed_page: "178", quote: "From equation (3.24) the compression", where: Eq. 4.1}
equation: "P = mu0 (1/lambda^2 - lambda^2)"
inputs:
  lam: {quantity: stretch_compression_axis, unit: dimensionless}
outputs:
  P: {quantity: compression_over_mu0, unit: dimensionless, description: "P/mu0"}
