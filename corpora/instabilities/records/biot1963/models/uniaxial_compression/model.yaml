id: uniaxial_compression
name: compression of neo-Hookean rubber under uniaxial stress (Eq. 4.12)
role: model
stated: {page: 14, printed_page: "181", quote: "While the compression P is obtained from", where: Eq. 4.12}
equation: "P = mu0 (1/lambda - lambda^2)"
inputs:
  lam: {quantity: stretch_compression_axis, unit: dimensionless}
outputs:
  P: {quantity: compression_over_mu0, unit: dimensionless, description: "P/mu0"}
