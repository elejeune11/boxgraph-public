id: incremental_modulus_plane
name: incremental shear modulus of neo-Hookean rubber in plane strain (Eq. 3.25)
role: model
stated: {page: 9, printed_page: "176", quote: "The incremental shear modulus for this case is", where: Eq. 3.25}
equation: "mu = (1/2) mu0 (lambda^2 + 1/lambda^2)"
inputs:
  lam: {quantity: stretch_compression_axis, unit: dimensionless}
outputs:
  mu: {quantity: incremental_modulus_ratio, unit: dimensionless, description: "mu/mu0"}
