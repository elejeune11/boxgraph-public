notes: >
  Scanned article with an OCR text layer; every equation and number was read from the page
  images. The quantitative core is the surface instability of an incompressible neo-Hookean
  (Treloar) half-space compressed parallel to its free surface. Entered as models, each in the
  paper's notation: the characteristic cubic (2.9) and its positive root (2.10); the decay
  factor k (2.8); for plane strain the incremental shear modulus (3.25), the compression (4.1),
  the critical-stretch condition (4.2), k = lambda^2 (4.11) and the effective surface rigidity
  factor (4.10) with (4.8); for uniaxial compression without lateral restraint the compression
  (4.12), the critical-stretch condition (4.13) and k = lambda^(3/2). Compared: zeta = 0.839,
  lambda = 0.543 and P = 3.08 mu0 (plane strain), lambda = 0.444 and P = 2.05 mu0 (uniaxial),
  k = 0.295, and both columns of Table I. The critical loads are run twice, from the printed
  rounded stretch and from the stretch the model chain computes. All quantities in the paper are
  ratios (stresses relative to mu0), so no dimensional input is needed and nothing was added.
  Left out: the derivations of section 3 that print no number (Eqs. 3.5-3.18, 3.30-3.33), the
  three-dimensional modulus (3.29) used only inside the uniaxial case, the load-deflection law
  (4.7), (4.9) which prints no number, and the qualitative claims on penetration depth (about
  three wavelengths) and the finite-slab limit (about one third of the thickness), which are
  recorded as a question. The paper has no figures. Hand checks before the build: the cubic root
  (0.8393), k = lambda^2 at 0.543, the uniaxial stretch 0.444 and most rows of Table I agree with the
  printed digits. Several critical values look truncated rather than rounded (lambda 0.5440 printed
  0.543, k 0.2959 printed 0.295, uniaxial P 2.055 printed 2.05). The plane-strain P = 3.08 follows
  from the unrounded stretch, not from the printed 0.543. Four rows of Table I differ in the last
  digit or more (mu/mu0 at 1.20 and 0.80, mu phi/mu0 at 0.90 and 0.60). These are recorded as
  questions; the printed values are kept as printed.
