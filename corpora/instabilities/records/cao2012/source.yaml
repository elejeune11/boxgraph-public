notes: >
  A theory and simulation paper with no measurements. In scope: the exact finite-strain
  bifurcation analysis of the neo-Hookean bilayer as printed in the Appendix (Eqs. A1-A10),
  implemented for plane strain with plane strain prestretch and for uniaxial stressing with
  uniaxial prestretch; the simple formulas Eqs. 5 and 6 (the prestretch extension, Eq. 2, of
  Allen's result, specialised as the paper prints them); Biot's half-space result Eq. 7 as
  quoted. These are compared with every wrinkling strain the paper prints as a number: the
  homogeneous limits 0.456 (plane strain) and 0.556 (uniaxial) and the bifurcation strains in
  the captions of Figs. 9, 10, 12 and 14. The exact analysis reproduces both homogeneous limits
  and approaches Eq. 5 at large modulus ratio; it gives values about 6% below the "≈" caption
  values for mu_f/mu_s = 5 and 30 (question q_eW_ratio30_ratio5). The finite element
  post-bifurcation results (period doubling, folding, mountain ridge) are recorded for three
  printed onset strains against a non-runnable model. Left out: Eq. 2 in its general form (only
  its printed specialisations Eqs. 5-6 produce results), the plate equations A11-A12 (the route
  to Eq. 2), the crease threshold e = 0.35 quoted from Refs. 6-7 (feeds no model), the snapshot
  strains of Figs. 9, 10, 12 and 14 that mark no onset, the threshold statements "mu_f/mu_s >= 10"
  and "1 < lambda0_1s < 5" (words about plotted curves) and the prestretch scaling statements
  (question q_scaling_prestretch). All plotted results (Figs. 2-8, 11, 13) are left for the
  figure pass; figures.md says what each would test. Page images were inspected at the
  available resolution for Eqs. 2, 5, 6 and A1-A5; the algebra of A3-A5 and A9 was checked
  against A1-A2.
  Figure pass (2026-11-14): every plot (Figs. 2-8, 11, 13) is read by calibrated code
  (figures.yaml, figures/), 31 readings: 26 theory curves swept against the exact analysis or
  Eq. 5, and 5 sets of finite element markers (eF, ePD, eMR) recorded as predicted data. The
  dashed e0/k0h lines of Figs. 3, 6 and 7 are left out (not separable from the solid lines).
  figures.md gives each panel's calibration and what the readings settle.
