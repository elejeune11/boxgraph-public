- id: film_wrinkling_strain
  name: compressive strain in the film at the onset of wrinkling
  dimension: dimensionless
  description: "eW = 1 - lambda_1f, the nominal compressive strain in the film (Eq. 4) at the wrinkling bifurcation; also e0, the same strain as predicted by the simple formulas Eqs. 5 and 6"
- id: shear_modulus_ratio
  name: film to substrate ground-state shear modulus ratio
  dimension: dimensionless
  description: "mu_f / mu_s, the ratio of the ground-state shear moduli of the neo-Hookean film and substrate"
- id: substrate_prestretch
  name: substrate prestretch along the compression
  dimension: dimensionless
  description: "lambda0_1s, the stretch applied to the substrate in the 1-direction before the unstretched film is attached (1 = no prestretch)"
- id: transverse_stretch
  name: current stretch normal to the plane of the mode
  dimension: dimensionless
  description: "lambda_3, the principal stretch in the 3-direction of the uniformly stretched state (1 in plane strain)"
- id: surface_instability_stretch_coefficient
  name: critical value of lambda_1 sqrt(lambda_3) for surface wrinkling of a neo-Hookean half-space
  dimension: dimensionless
  description: "the constant 0.5437 in Eq. 7, eW = 1 - 0.5437/sqrt(lambda_3): Biot's critical stretch combination for surface wrinkling of a homogeneous neo-Hookean half-space"
- id: wrinkle_wavenumber_dimensionless
  name: dimensionless wave number of the wrinkling mode
  dimension: dimensionless
  description: "k h (or k0 h), wave number of the mode referenced to the undeformed film times the undeformed film thickness h"
- id: period_doubling_onset_strain
  name: overall compressive strain at the onset of period-doubling
  dimension: dimensionless
  description: "e_PD, the nominal overall compressive strain (Eq. 4) at which the sinusoidal wrinkles transition to the period-doubling mode in the finite element simulations"
- id: mountain_ridge_onset_strain
  name: overall compressive strain at the onset of the mountain ridge mode
  dimension: dimensionless
  description: "e_MR, the nominal overall compressive strain at which the first mountain ridge forms in the finite element simulations"
- id: fold_onset_strain
  name: overall compressive strain at the onset of the folding mode
  dimension: dimensionless
  description: "e_F, the nominal overall compressive strain at which the sinusoidal wrinkles localize into a fold in the finite element simulations (Figs. 8, 10, 11)"
- id: wrinkling_stretch
  name: stretch along the compression at the onset of wrinkling
  dimension: dimensionless
  description: "lambda_1 = 1 - eW (Eq. 4), the principal stretch in the 1-direction at the wrinkling bifurcation; added by the relation job biot1963+cao2012 for comparison with Biot's critical stretch"
- id: wrinkle_wavelength_over_film_thickness
  name: wavelength of the wrinkling mode at onset over the film thickness
  dimension: dimensionless
  description: "lambda/h = 2 pi/(k h), the wavelength of the critical mode referenced to the undeformed film over the undeformed film thickness; added by the relation job cao2012+wang2015 for comparison with wang2015's Eq. 8"
