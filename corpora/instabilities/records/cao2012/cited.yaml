# Values cao2012 takes from other records, linked to the value that record prints.
- datum: biot_coefficient
  from_datum: lambda_plane_printed
  evidence: >
    cao2012's Eq. 7, eW = 1 - 0.5437/sqrt(lambda_3), is stated as Biot's [3] result; in plane strain (lambda_3 = 1) with
    Eq. 4 (eW = 1 - lambda_1) the constant is the critical stretch lambda_1, which biot1963 prints as 0.543 for plane
    strain compression (Eq. 4.3). cao2012 prints one more digit.
# Not linked: eW_interface (0.456, footnote 2, from ref-3) is a strain that biot1963 does not print; Biot prints the
# plane-strain critical stretch 0.543, and 1 - 0.543 = 0.457 would be our arithmetic, not a printed value.
