id: simple_formula_plane
name: simple formula for wrinkling of a stiff film on a prestretched neo-Hookean substrate, plane strain (Eq. 5)
role: model
stated: {page: 2, printed_page: "031019-2", quote: "as predicted by Eq. (2) for plane strain", where: Eq. 5}
equation: "e0 = (1/4) (Lambda 3 mu_s/mu_f)^(2/3), k0 h = (Lambda 3 mu_s/mu_f)^(1/3), with Lambda = (1/2)(1 + lambda0_1s^2)"
inputs:
  mu_ratio: {quantity: shear_modulus_ratio, unit: dimensionless, description: "mu_f / mu_s"}
  lam01: {quantity: substrate_prestretch, unit: dimensionless}
outputs:
  e0: {quantity: film_wrinkling_strain, unit: dimensionless}
  k0h: {quantity: wrinkle_wavenumber_dimensionless, unit: dimensionless}
settings: {}
stochastic: false
