id: simple_formula_uniaxial
name: simple formula for wrinkling of a stiff film on a prestretched neo-Hookean substrate, uniaxial stressing (Eq. 6)
role: model
stated: {page: 4, printed_page: "031019-4", quote: "corresponding predictions from Eq. (2) for this case are", where: Eq. 6}
equation: "e0 = (1/3) (Lambda 3 mu_s/mu_f)^(2/3), k0 h = (Lambda 3 mu_s/mu_f)^(1/3), with Lambda = (1/2) lambda0_1s^(1/2) (1 + lambda0_1s^(3/2))"
inputs:
  mu_ratio: {quantity: shear_modulus_ratio, unit: dimensionless, description: "mu_f / mu_s"}
  lam01: {quantity: substrate_prestretch, unit: dimensionless}
outputs:
  e0: {quantity: film_wrinkling_strain, unit: dimensionless}
  k0h: {quantity: wrinkle_wavenumber_dimensionless, unit: dimensionless}
settings: {}
stochastic: false
