    Fig. 3), so the prediction would be set by an added modulus ratio, taken from literature that neither
    paper cites. The validation would test that assumption, not the model, so it is not entered. If a later
    record supplies measured shear moduli for these Sylgard 184 compositions, bilayer_uniaxial can be run
