- id: q_numerical_scheme
  kind: choice
  about: [bilayer_plane_strain, bilayer_uniaxial]
  text: >
    The paper says only that the eigenvalue problem |E| = 0 "is carried out numerically" and that the
    eigenvalue "must be minimized over all values of kh". The scan in strain (log-spaced from 1e-4 to
    0.7), the bisection, the kh grid (1e-3 to 30, log-spaced) and the golden-section refinement of the
    minimum are the reader's choices, set in the models' settings and checked by refinements.
  citation: {page: 8, quote: "The solution to the eigenvalue problem is carried out numerically", where: text}
- id: q_detE_poles
  kind: numerics
  about: [bilayer_plane_strain, bilayer_uniaxial]
  text: >
    As printed, A (Eq. A3) contains the inverse of a matrix whose determinant is proportional to
    4 r^3 - (r^2 + 1)^2, which vanishes at Biot's surface-wrinkling value of r (r = 3.383, eW = 0.456 in
    plane strain). B and C, and so |E|, then have poles there, and |E| also has poles where C is
    singular. The models therefore locate the zeros of |E| times |C| times that determinant, which has
    the zeros of |E| and no poles. Without this, a sign-change search reports a spurious root at eW =
    0.456 for every modulus ratio and misses the genuine homogeneous-limit root.
- id: q_eW_ratio30_ratio5
  kind: unexplained_difference
  about: [eW_ratio30, eW_ratio5, cmp_exact_ratio30, cmp_exact_ratio5]
  text: >
    The exact analysis as printed in the Appendix gives eW ≈ 0.052 for mu_f/mu_s = 30 and ≈ 0.165 for
    mu_f/mu_s = 5 (plane strain, no prestretch), about 6% below the values printed in the captions of
    Figs. 9 and 10 (≈ 0.055 and ≈ 0.175). Those values are printed with "≈" and may come from the finite
    element "buckle" analysis or from reading Fig. 2 rather than from the exact analysis; the paper does
    not say. The same analysis reproduces the homogeneous limits (0.456, 0.556) and approaches Eq. 5 at
    large modulus ratio, so the reading of Eqs. A1-A10 is not obviously at fault. The plotted curve of
    Fig. 2 would settle which value the paper's own analysis gives.
