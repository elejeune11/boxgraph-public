# Cross-validation against trujillo2008 (job 2026-11-18): the transverse stretch at the measured crease onset.
- id: lam3_equibiaxial_trujillo_added
  quantity: transverse_stretch
  unit: dimensionless
  printed: "0.67"
  basis: >-
    For the cross-validation of Eq. 7 against trujillo2008's measured crease strains. Those gels are
    compressed equibiaxially in the plane of the surface (trujillo2008 p. 2: "For the case of equibiaxial
    compression (l1 = l3 = l)"), and their strain is e = 1 - l0/l, the in-plane stretch l0/l of the attached
    gel relative to its stress-free swollen state (p. 3). At the measured onset the stretch normal to the
    plane of the mode is therefore lambda_3 = lambda_1 = 1 - e_c = 1 - 0.33 = 0.67, from the measured
    average e_c = 0.33 that both series print. Eq. 7 then predicts the strain eW along the 1-direction at
    that transverse stretch, and the measurement is consistent with it when eW comes back equal to e_c.
    Neither paper states lambda_3 for these gels.
  alternatives: ["0.65", "0.69", "0.666"]
  stands_for: "lambda_3 in Eq. 7, at the onset of creasing in trujillo2008's equibiaxially compressed gels"
