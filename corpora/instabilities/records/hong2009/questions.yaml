    (wang2014/eps_crease) into its own wrinkling/creasing boundary, which is model against model for the
    relation jobs. Whether the creasing points of Fig. 7(a) fall below that boundary tests wang2014's
    boundary, not a value this paper's models produce. For the other direction see
    wang2014/q_no_validation_hong2009.
  citation: {page: 3, printed_page: "111901-3", quote: "compressed by 35%. This critical strain is below that", where: text}
