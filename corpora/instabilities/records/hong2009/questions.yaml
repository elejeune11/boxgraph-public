- id: q_no_validation_jin2015
  kind: choice
  about: [crease_zero_fig3, gps_uniaxial_stretch, gps_critical_strain, gps_equivalent_plane_strain, gel_critical_swelling, eps_exp_printed, eta_exp_printed, jin2015/exp_crease_15to1_text, jin2015/exp_crease_15to1_fig6, jin2015/exp_crease_15to1_video, jin2015/exp_crease_10to1_text, jin2015/exp_wrinkle_10to1_text, jin2015/exp_wrinkle_7p5to1_text]
  text: >-
    (Cross-validation against jin2015, which cites this paper as ref. 39; job 2026-11-19.) No validation is
    entered from this record's models. jin2015 measures the onset strains of creases (15:1 and 10:1 films)
    and wrinkles (10:1 and 7.5:1 films) of PDMS bilayers on a 30:1 substrate under uniaxial compression, as
    nominal strains 1 - lambda. (1) No model here outputs that quantity. crease_zero_fig3 gives the
    plane-strain strain, a different loading (jin2015 itself gives 0.35 plane strain and 0.44 uniaxial for
    the same criterion). gps_uniaxial_stretch gives the uniaxial critical stretch, not the strain, and a
    validation cannot convert one into the other. gps_critical_strain needs the transverse stretch lambda_2 as
    a fixed input. Under uniaxial stress that stretch depends on the critical strain itself. Setting it from
    the measured strain would build the measurement into the input, and setting it from the model's own
    critical stretch would mean writing a computed number. (2) The measurement is not what the criterion
    predicts even in jin2015's own account. The 15:1 creases are subcritical creases channeling from defects
    (0.37 in the text and Fig. 6(b), 0.36 for Video 1), which jin2015 places between a Maxwell strain and the
    snapping-forward strain e_F = 0.44 (pp. 6-7). The 10:1 creases (0.28) form from wrinkles. Both differ from
    the onset on a flat homogeneous surface that this paper computes, and the films' moduli are not printed
    (jin2015/q_exp_moduli). The wrinkle onsets are bilayer wrinkling, which no model here describes. The
    comparison of 0.44 with this paper's criterion is model against model, for the relation jobs
    (jin2015/eq1_crease_uniaxial_to_plane, described_from this paper). For the other direction see
    jin2015/q_no_validation_hong2009.
  citation: {page: 3, printed_page: "111901-3", quote: "are valid under the generalized plane", where: text}
