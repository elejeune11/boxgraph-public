- id: q_fe_not_rerun
  kind: unstated_model
  about: [fig3_energy_curve, eps_c_printed, crease_zero_fig3]
  text: >
    The energy difference f(epsilon) of Fig. 3 comes from ABAQUS 6.7.1 calculations whose mesh, element type,
    contact treatment and the prescribed rotation of segment OA are not given in enough detail to rerun them.
    The record checks only that the printed critical strain follows from the plotted curve, not the curve itself.
  citation: {page: 1, quote: "We analyze the inhomogeneous deformation of the", where: text}
- id: q_zero_extrapolation
  kind: choice
  about: [crease_zero_fig3, run_fig3_zero]
  text: >
    The curve of Fig. 3 stops near epsilon = 0.351 with f still about 0.02 above zero ('The curve on Fig. 3 stops at
    the critical point'). The zero f(epsilon_c) = 0 is taken here by a straight line through the last two read
    points (0.34 and 0.35); the paper does not say how it located the zero. A curve steepening towards the end
    would put the zero slightly lower than a straight line does.
- id: q_ratio_rounding
  kind: reading
  about: [ratio_crease_printed, ratio_biot_printed, eta_c_printed, eta_biot_printed]
  text: >
    Eqs. 5 and 6 follow from 1/(1 - epsilon)^2 with the rounded strains 0.35 and 0.46 (2.37 and 3.43), printed
    to two digits as 2.4 and 3.4; the same digits carry over to eta_c and eta_biot because lambda_3/lambda_1 = eta
    for a bonded gel. The printed 0.46 is Biot's plane-strain threshold rounded (biot1963 prints lambda = 0.543,
    i.e. 1 - lambda = 0.457).
- id: q_biot_strain_convention
  kind: reading
  about: [eps_biot_printed]
  text: >
    epsilon_biot = 0.46 is the nominal strain 1 - lambda_1 under plane strain, matching Biot's plane-strain critical
    stretch about 0.544 (biot1963), not his uniaxial value 0.444. The relation to biot1963 is left to the
    cross-paper relation job.
- id: q_eta_exp_sources
  kind: reading
  about: [eta_exp_printed, cmp_eta_crease_exp, cmp_eta_biot_exp]
  text: >
    The measured range eta_exp = 2.0-3.7 pools Refs. 4-6 without giving the individual values, the gels or
    whether eta is a thickness or a volume ratio in each. Both the crease threshold 2.4 and Biot's 3.4 lie inside
    the range, so this range alone does not discriminate between the two criteria; the paper notes the variation
    needs further study and that solvent migration is ignored.
- id: q_eps_exp_two_sources
  kind: reading
  about: [eps_exp_printed]
  text: >
    The experimental 0.35 is attributed jointly to Refs. 1 and 2 (different materials); the record gives it one
    source (ref-1) because a datum takes a single from_source.
- id: q_eq1_lambda2_cubed
  kind: possible_error
  about: [fig3_energy_curve, eps_c_printed]
  text: >
    Eq. 1 is printed W = mu/2 (lambda_1^2 + lambda_2^3 + lambda_3^2 - 3), with the second stretch cubed. The
    neo-Hookean energy (Ref. 13) has lambda_2^2, and the paper's own Eq. 4, obtained by substituting Eq. 3 into
    Eq. 1, carries mu/2 (lambda_2^2 - 3), which follows only from lambda_2^2. The exponent 3 is most likely a
    misprint; it enters no run here (the finite-element model is not rerun, and lambda_2 = 1 in plane strain),
    so no corrected variant is written.
  citation: {page: 1, where: "Eq. 1", quote: "Hookean model with the free-energy density"}
- id: q_singh_pipkin_argument
  kind: unstated_model
  about: [eps_c_printed, cmp_epsc_exp]
  text: >
    The paper argues that the agreement of 0.35 with experiment "is not fortuitous", citing the folded state of
    Singh and Pipkin (Ref. 14) with stretches 1/sqrt(2) radially and sqrt(2) circumferentially. It does not say
    how these stretches relate to the critical strain 0.35 (1 - 1/sqrt(2) = 0.29 is not it), so the argument
    supports only that the strains in a crease are moderate and is not a check on the number.
  citation: {page: 2, where: text, quote: "The agreement is not fortuitous"}
- id: q_no_validation_tallinen2015
  kind: choice
  about: [eps_exp_printed, eta_exp_printed, gel_critical_swelling, gps_critical_ratio, plane_strain_stretch, tallinen2015/lambda_s_printed]
  text: >-
    No validation between this record and tallinen2015 is entered, in either direction (cross-validation
    job 2026-11-18, asked for by the corpus list). Neither paper cites the other. tallinen2015 holds no
    measurement: its values are model results, finite-element points and inputs taken from other works
    (lambda_s = 0.647 from Hohlfeld and Mahadevan, the brain modulus ratio from Xu et al.), so no model
    here has anything there to predict. The measurements here (the critical strain 0.35 and the swelling
    ratio range 2.0-3.7) are not predicted by any tallinen2015 model, whose outputs are growth ratios,
    modulus ratios and wavelength ratios of a layer on a half-space (see tallinen2015/q_no_validation_hong2009).
    How this paper's crease threshold 0.35 (lambda = 0.65) relates to tallinen2015's lambda_s = 0.647 is
    model against model, for the relation jobs.
  citation: {page: 1, quote: "exceeds the experimental value", where: text}
- id: q_validation_trujillo2008
  kind: unexplained_difference
  about: [gel_critical_swelling, eta_c_printed, eta_biot_printed, eta_exp_printed, trujillo2008/hh0_onset_measured, trujillo2008/ec_mean_modulus_series, trujillo2008/fig3a_ec_points, trujillo2008/fig4_flat_points]
  text: >-
    (Cross-validation against trujillo2008, job 2026-11-18.) The bonded-gel criterion (Eqs. 5, 6 with
    lambda_1 = lambda_2 = eta^(-1/3), lambda_3 = eta^(2/3)) is validated against trujillo2008's onset
    thickness ratio h/h0 = 2.0 +/- 0.1 (1 mm gels, 0.4 mol% bis(acrylamide)); both the crease value (about
    2.37) and Biot's (about 3.43) fall outside it, the crease value closer. The paper itself pools ref. 6 into
    eta_exp = 2.0-3.7 and calls for study of "the consequence of solvent migration". A likely source is the
    incompressibility the criterion assumes: it identifies eta with the cube of the free linear swelling, but
    trujillo2008's gels are compressible (Poisson's ratio ~0.3). Its measured onset strain e_c = 0.33 from free
    swelling would give (1/(1 - 0.33))^3, about 3.3, under this paper's kinematics, while its measured onset
    h/h0 is 2.0 (see trujillo2008/q_thickness_reconstruction). Measurements not used: trujillo2008's e_c
    values (the means 0.33, Fig. 3(a), (b)) are an equibiaxial effective strain 1 - l0/l from free swelling,
    and no model here outputs that quantity (gps_uniaxial_stretch is for uniaxial compression,
    plane_strain_stretch for plane strain); converting eta_c to it would need a new model, not a
    validation. The Fig. 4 points (h/h0 of flat and creased gels against sodium acrylate content) and the
    Fig. 2 swelling data are not onset values; the model predicts only the onset, which is entered.
    trujillo2008's ec_southern_thomas and Table 1 moduli are its own estimates, not measurements.
  citation: {page: 3, quote: "Several sets of experimen", where: text}
- id: q_no_validation_wang2014
  kind: choice
  about: [crease_zero_fig3, gel_critical_swelling, gel_swelling_from_ratio, gps_critical_ratio, gps_uniaxial_stretch, plane_strain_stretch, wang2014/exp_wrinkling_fig7a, wang2014/exp_creasing_fig7a, wang2014/exp_delamination_fig7a, wang2014/adhesion_fig3_lp2, wang2014/tension_fig13a, wang2014/mu_s_ecoflex, wang2014/eps_crease]
  text: >-
    (Cross-validation against wang2014, which cites this paper as ref. 55; job 2026-11-18.) No validation
    entered from this record's models to wang2014's measurements. This record's models give the plane-strain
