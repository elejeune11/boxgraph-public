- id: applied_strain
  name: applied nominal compressive strain (plane strain)
  dimension: dimensionless
  description: "epsilon, the shortening of the block divided by its original length, under plane strain (lambda_2 = 1); lambda_1 = 1 - epsilon"
- id: crease_energy_difference
  name: elastic energy of the creased state minus the homogeneous state, per mu L^2
  dimension: dimensionless
  description: "f(epsilon) = U / (mu L^2), U the elastic energy per unit thickness of the creased body minus that of the smooth body, L the size of the prescribed crease (Eq. 2)"
- id: critical_strain_plane
  name: critical nominal compressive strain under plane strain
  dimension: dimensionless
  description: "the applied strain epsilon at the onset of an instability of a neo-Hookean half-space compressed in plane strain: epsilon_c for creasing (f(epsilon_c) = 0) or epsilon_biot for Biot's linear perturbation"
- id: critical_stretch_plane
  name: critical principal stretch along the compression under plane strain
  dimension: dimensionless
  description: "lambda_1 = 1 - epsilon at the critical condition, plane strain; equals lambda_1' of the equivalent plane-strain problem (Fig. 4)"
- id: critical_stretch_uniaxial
  name: critical principal stretch along the compression under uniaxial compression
  dimension: dimensionless
  description: "lambda_1 at the critical condition when the faces normal to directions 2 and 3 are free (lambda_2 = lambda_3 = lambda_1^-1/2)"
- id: critical_stretch_gps
  name: critical principal stretch along the compression under generalized plane strain
  dimension: dimensionless
  description: "lambda_1 at the critical condition when the in-plane stretch lambda_2 normal to the compression is held at a prescribed constant (Fig. 4, Eq. 3)"
- id: critical_strain_gps
  name: critical nominal compressive strain along the compression under generalized plane strain
  dimension: dimensionless
  description: "1 - lambda_1 at the critical condition when the in-plane stretch lambda_2 normal to the compression is held at a prescribed constant (Eq. 3); equals critical_strain_plane when lambda_2 = 1"
- id: transverse_inplane_stretch
  name: prescribed in-plane stretch normal to the compression
  dimension: dimensionless
  description: "lambda_2, the stretch parallel to the surface and normal to direction 1, held constant under generalized plane strain (lambda_2 = 1 is plane strain)"
- id: critical_stretch_ratio
  name: critical ratio of the normal stretch to the most compressive in-plane stretch
  dimension: dimensionless
  description: "lambda_3 / lambda_1 at the critical condition, valid under generalized plane strain for any lambda_2 (Eqs. 5 and 6); lambda_3 normal to the surface, lambda_1 the in-plane stretch in the more compressed direction"
- id: swelling_thickness_ratio
  name: swelling ratio of a gel bonded to a rigid substrate
  dimension: dimensionless
  description: "eta, the thickness of the swollen gel divided by that of the initial gel, for a gel swelling only normal to the surface (lambda_1 = lambda_2 = eta^-1/3, lambda_3 = eta^2/3 from the stress-free swollen state)"
