notes: >
  Three-page letter with a text layer; every number was checked on the page images. The quantitative core
  is the energy criterion for the onset of a crease on a neo-Hookean, incompressible half-space in plane
  strain: U = mu L^2 f(epsilon) (Eq. 2), the creased minus the homogeneous energy, computed with ABAQUS and
  plotted in Fig. 3; the crease forms at f(epsilon_c) = 0, printed as epsilon_c = 0.35 (nominal strain,
  shortening over original length; lambda_1 = 1 - epsilon_c = 0.65), against Biot's linear-perturbation
  threshold epsilon_biot = 0.46 and the experimental 0.35 (Refs. 1, 2). The finite-element calculation
  cannot be rerun (question q_fe_not_rerun); instead the Fig. 3 curve is read from the page by code and a
  processing model finds its zero by a straight line through the last two points (an added choice, question
  q_zero_extrapolation), compared with the printed 0.35. The mapping to generalized plane strain (Eq. 3, the
  intermediate state of Fig. 4) gives lambda_3/lambda_1 = 1/(1 - epsilon)^2, printed as 2.4 for creasing
  (Eq. 5) and 3.4 for Biot (Eq. 6); for a gel bonded to a rigid substrate and swelling normal to it,
  lambda_1 = lambda_2 = eta^-1/3 and lambda_3 = eta^2/3, so lambda_3/lambda_1 = eta and eta_c = 2.4,
  eta_biot = 3.4, run both from the printed strains and from the printed ratios, and validated against the
  pooled experimental range 2.0-3.7 (Refs. 4-6), which contains both thresholds. For the relation jobs: all
  thresholds here are plane-strain nominal strains (epsilon = 1 - lambda_1); epsilon_biot = 0.46 corresponds
  to Biot's plane-strain stretch 0.543-0.544 (biot1963), and the crease threshold 0.35 is a distinct, lower
  threshold, not a correction of Biot's. Nothing was added: every input is printed. Left out: the
  Singh-Pipkin folded-state stretches 1/sqrt(2) and sqrt(2) (a geometric argument that feeds no number),
  the effective modulus mu/lambda_2 of Eq. 4 (no number), the block size 50 x 50 L (a setting of the
  unrerunnable FE model), and Figs. 1, 2 and 4, which are a photograph and sketches. Figure rendering went
  through boxgraph.digitize.render from a script because the figure CLI was not permitted in this session.
