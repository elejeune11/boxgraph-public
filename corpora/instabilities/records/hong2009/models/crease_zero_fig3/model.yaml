id: crease_zero_fig3
name: critical strain for creasing as the zero of the energy difference f(epsilon) (Eq. 2, Fig. 3)
role: processing
stated: {page: 2, printed_page: "111901-2", quote: "the creased state has the same energy as the", where: text}
equation: "U = mu L^2 f(epsilon); f(epsilon_c) = 0"
inputs:
  f: {quantity: crease_energy_difference, unit: dimensionless, curve: {quantity: applied_strain, unit: dimensionless},
      description: "the finite-element curve of Fig. 3, read from the figure"}
outputs:
  eps_c: {quantity: critical_strain_plane, unit: dimensionless}
settings:
  n_last: 2   # added: the zero is found by a straight line through the last n points of the curve, which stops just above zero
