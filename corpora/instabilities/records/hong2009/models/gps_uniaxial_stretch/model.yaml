id: gps_uniaxial_stretch
name: critical stretch under uniaxial compression (lambda_2 = lambda_3) from the plane-strain critical strain, by Eqs. 3, 5, 6
role: model
stated: {page: 3, printed_page: "111901-3", quote: "are valid under the generalized plane", where: "Eqs. 5 and 6"}
equation: "lambda_3/lambda_1 = 1/(1 - epsilon)^2 with lambda_2 = lambda_3 = lambda_1^(-1/2)  =>  lambda_1 = (1 - epsilon)^(4/3)"
from_words: true
inputs:
  eps: {quantity: critical_strain_plane, unit: dimensionless, description: "the plane-strain critical strain: epsilon_c for creasing or epsilon_biot"}
outputs:
  lam1: {quantity: critical_stretch_uniaxial, unit: dimensionless}
built_from: [gps_critical_ratio]
# A helper for the relation to biot1963 (relations.yaml): the paper states that its critical conditions
# (Eqs. 5, 6) hold under generalized plane strain for any lambda_2. Uniaxial compression with free lateral
# faces is the case lambda_2 = lambda_3, which with lambda_1 lambda_2 lambda_3 = 1 gives
# lambda_3/lambda_1 = lambda_1^(-3/2). The paper does not work this case out.
