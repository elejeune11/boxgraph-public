id: gel_critical_swelling
name: critical swelling ratio of a bonded gel from the plane-strain critical strain (Eqs. 3, 5, 6 with the gel stretches)
role: model
stated: {page: 3, printed_page: "111901-3", quote: "Inserting these stretches into Eqs", where: text}
equation: "lambda_3/lambda_1 = 1/(1 - epsilon)^2 with lambda_1 = lambda_2 = eta^(-1/3), lambda_3 = eta^(2/3)  =>  eta = 1/(1 - epsilon)^2"
inputs:
  eps: {quantity: critical_strain_plane, unit: dimensionless}
outputs:
  eta: {quantity: swelling_thickness_ratio, unit: dimensionless}
built_from: [gps_critical_ratio, gel_swelling_from_ratio]
