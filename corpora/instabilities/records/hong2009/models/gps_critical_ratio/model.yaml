id: gps_critical_ratio
name: critical condition under generalized plane strain from the plane-strain critical strain (Eqs. 3, 5, 6)
role: model
stated: {page: 3, printed_page: "111901-3", quote: "Recall that", where: "Eqs. 5 and 6"}
equation: "lambda_1' = 1 - epsilon; lambda_1 sqrt(lambda_2) = lambda_1'; lambda_1 lambda_2 lambda_3 = 1  =>  lambda_3/lambda_1 = 1/(lambda_1')^2"
inputs:
  eps: {quantity: critical_strain_plane, unit: dimensionless, description: "the plane-strain critical strain: epsilon_c for creasing (Eq. 5) or epsilon_biot (Eq. 6)"}
outputs:
  ratio: {quantity: critical_stretch_ratio, unit: dimensionless}
built_from: [plane_strain_stretch]
