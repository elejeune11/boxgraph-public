id: gel_swelling_from_ratio
name: critical swelling ratio of a gel bonded to a rigid substrate from the critical stretch ratio
role: model
stated: {page: 3, printed_page: "111901-3", quote: "Inserting these stretches into Eqs", where: text}
equation: "lambda_1 = lambda_2 = eta^(-1/3), lambda_3 = eta^(2/3); lambda_3/lambda_1 = (critical ratio of Eq. 5 or 6)"
inputs:
  ratio: {quantity: critical_stretch_ratio, unit: dimensionless}
outputs:
  eta: {quantity: swelling_thickness_ratio, unit: dimensionless}
