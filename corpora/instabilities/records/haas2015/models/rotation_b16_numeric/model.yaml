id: rotation_b16_numeric
name: inward rotation of the invagination midpoint from the second-order problem (B 16), solved numerically
stated: {page: 10, quote: "folding is a second-order effect, for which we need to", where: "Eqs. B8, B16, B17"}
equation: "sigma0 - b0'' = K0(xi), sigma0' - a0 = 0, a0' = -b0 (B 8); b1'''' + b1 = {d^2/dxi^2 (b0 sigma0) - b0^2/2} cot(Theta) (B 16); Delta beta^(i) = (B^(i) cos Theta) d/delta from the midpoint value of b1 (B 17)"
inputs:
  L: {quantity: invagination_width_scaled, unit: dimensionless, description: "Lambda = lambda/delta"}
outputs:
  B: {quantity: invagination_rotation_scaled, unit: dimensionless, description: "-b1(0) / cos Theta: the inward rotation, taken as a decrease of beta (see question q_rotation_sign)"}
settings: {x_half: 80.0, n_points: 65536, theta: 0.7}
stochastic: false
