id: curvature_b14_numeric
name: scaled curvature for pure invagination from the leading-order problem (B 14) with (B 11), (B 12), solved numerically
stated: {page: 10, quote: "The leading-order problem is thus", where: "Eqs. B11, B12, B14"}
equation: "b0'''' + b0 = K(delta''(xi + Lambda/2) - delta''(xi - Lambda/2)); int b0 dxi = 0; int b0^2 dxi = 2 sin(Theta)"
inputs:
  L: {quantity: invagination_width_scaled, unit: dimensionless, description: "Lambda = lambda/delta"}
outputs:
  Ks: {quantity: invagination_curvature_scaled, unit: dimensionless, description: "K / sin^1/2 Theta; positive root"}
settings: {x_half: 80.0, n_points: 65536}
stochastic: false
