notes: >
  Scope: the closed-form and asymptotic results that produce printed or plotted numbers.
  (1) The plane-sheet contraction test case: Eq. 2.9 (phi_eq29) is compared with the numerical
  points of Fig. 2(c), read by code, at nu = 1/2 (the paper's value for all computations); a
  reconstructed finite-element minimization of the printed energy (2.5) is compared too.
  (2) Pure invagination, leading order: Eq. 3.3 (= B15) against the curve of Fig. 3(g), and its
  global minimum against the printed 2.44 (tick label; the text's "approx 2.44" gets no
  verdict). The leading-order problem (B14, B11, B12) is also solved numerically by FFT as a
  check of the "long calculation"; it reproduces (3.3) to machine precision.
  (3) Midpoint rotation: B18 against the solid curve of Fig. 3(h), and the second-order problem
  (B8, B16) solved numerically, which reproduces |B18| exactly but with the opposite sign
  (questions q_rotation_sign, q_b14_sign: (B14)'s printed sign of the forcing is the opposite of
  what (B8) implies; neither affects K^2). Eq. 3.5 (1/(2 sqrt2)) against the dashed line.
  Not rerun: the full nonlinear shell bifurcation computations (Figs. 5, 7, 8; model
  shell_bifurcation, not runnable, question q_shell_not_rerun), whose set-up is not given. Their
  labelled curves are read by code (figures pass, 2026-11-19): the critical branch and point of
  Fig. 5 and Fig. 7(c) (the two drawings of the branch compared for consistency), the spinodal
  and metastable boundaries of Fig. 7(c), the two branches of Fig. 7(b) and the r_p = R and
  0.75R trajectories of Fig. 8; they carry no reproduction because no runnable model produces
  them (see figures.md). Their stated inputs (h/R = 0.15, nu = 1/2,
  lambda_max = 1.1R, r_p = R, r_p/R down to 0.75) are recorded for comparison with haas2021.
  The scaling laws of Eq. 3.7 and the effective energy (C3-C7) carry no prefactors or numbers and
  feed no comparison. Figure readings were developed on scaled 110-dpi page images because the
  render and figure-check commands were unavailable (q_figure_tools). Electronic supplementary
  material is not included.
