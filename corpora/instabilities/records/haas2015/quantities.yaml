- {id: poisson_ratio, name: Poisson's ratio of the shell, dimension: dimensionless}
- {id: thickness_to_radius, name: shell thickness over undeformed radius (h/R), dimension: dimensionless}
- id: intrinsic_contraction_factor
  name: intrinsic stretch f of the contracted disc in the plane sheet (f_s^0 = f_phi^0 = f for s < R)
  dimension: dimensionless
- id: contracted_boundary_radius
  name: deformed radius of the contracted disc's boundary over its undeformed radius (F = r(1))
  dimension: dimensionless
- id: invagination_width_scaled
  name: width of the region of intrinsic curvature over the inner-layer width (Lambda = lambda/delta)
  dimension: dimensionless
- id: invagination_curvature_scaled
  name: intrinsic curvature of the invagination scaled as in Fig. 3(g), k / (d^1/2 delta^-3/2 sin^1/2 Theta) = K / sin^1/2 Theta
  dimension: dimensionless
  description: "K / sqrt(sin Theta), where K is the scaled curvature of Eq. 3.3 and Theta the position of the invagination"
- id: least_curvature_width_scaled
  name: scaled width Lambda at which the scaled intrinsic curvature K of Eq. 3.3 is least
  dimension: dimensionless
- id: invagination_rotation_scaled
  name: inward rotation of the invagination midpoint for pure invagination, scaled as Delta beta^(i) / (cos Theta d/delta) = B^(i)(Lambda)
  dimension: dimensionless
- id: contraction_rotation_scaled
  name: inward rotation of the invagination midpoint for contraction, scaled as Delta beta^(c) / (d/delta)
  dimension: dimensionless
- id: intrinsic_curvature_times_radius
  name: intrinsic curvature magnitude k of the bend region times the undeformed radius (k R)
  dimension: dimensionless
- id: bend_region_end_scaled
  name: arclength of the end of the bend region from the posterior pole over R (lambda_max / R)
  dimension: dimensionless
- id: posterior_displacement_scaled
  name: distance by which the posterior pole moves up, over R (d/R)
  dimension: dimensionless
- id: critical_curvature_times_radius
  name: intrinsic curvature at the critical point of the bifurcation diagram times R (k* R)
  dimension: dimensionless
- id: critical_width_scaled
  name: width of the bend region at the critical point of the bifurcation diagram over R (lambda* / R)
  dimension: dimensionless
- id: spinodal_curvature_times_radius
  name: intrinsic curvature times R along the spinodal curve, the locus of the extrema of the (k, d) branches (Fig. 7(c))
  dimension: dimensionless
- id: metastable_boundary_curvature_times_radius
  name: intrinsic curvature times R along the outer boundary of the metastable band of the (k, d) diagram (Fig. 7(c))
  dimension: dimensionless
- id: conjugate_curvature_scaled
  name: conjugate variable to k, kappa = dE/dk (Eq. 3.8), over G R with G = pi E h^3 / 6(1 - nu^2) (Fig. 7(b))
  dimension: dimensionless
- id: posterior_radius_scaled
  name: posterior radius of the contracted shell over R (r_p / R)
  dimension: dimensionless
- id: elastic_modulus_scaled
  name: elastic modulus E of the shell (Eq. 2.4) in a reference unit of stress
  dimension: dimensionless
- id: shell_strain
  name: shell strain, a difference of stretch and intrinsic stretch (Es, Ephi of Eq. 2.2)
  dimension: dimensionless
- id: curvature_strain_times_radius
  name: curvature strain (Ks, Kphi of Eq. 2.3) times R
  dimension: dimensionless
- id: shell_energy_density_scaled
  name: shell energy per unit area of the undeformed midsurface (Eq. 2.4), in the reference stress unit times R
  dimension: dimensionless
