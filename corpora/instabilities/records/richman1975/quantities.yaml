- {id: layer_surface_area, name: tangential surface area of a cortical cellular layer, dimension: "[length]**2", description: "Total tangential surface area of one cellular layer (I-VI) of one cerebral hemisphere (Table 1)"}
- {id: layer_area_ratio, name: outer to inner layer area ratio, dimension: dimensionless, description: "A_o/A_i: area of the outer cellular layer (layer II) over that of the inner cellular layer (layer VI)"}
- {id: hemisphere_radius, name: radius of the cerebral hemisphere, dimension: "[length]", description: "R: radius of the sphere standing for the hemisphere (radius of curvature in note 18)"}
- {id: reduced_radius, name: radius less twice the cortical thickness, dimension: "[length]", description: "R - 2t, the denominator of the approximate area ratio in note 18"}
- {id: cortical_thickness, name: cortical thickness, dimension: "[length]", description: "t = t1 + t2, total thickness of the cortex"}
- {id: stratum_thickness, name: thickness of one cortical stratum, dimension: "[length]", description: "t1 (stratum 1, layers I-III) or t2 (stratum 2, layers IV-VI)"}
- {id: stratum_modulus_ratio, name: modulus of stratum 2 over modulus of stratum 1, dimension: dimensionless, description: "E2/E1"}
- {id: core_modulus_ratio, name: modulus of the core over modulus of stratum 1, dimension: dimensionless, description: "Ecore/E1"}
- {id: stiffness_reduction_factor, name: factor by which Ecore/E1 is decreased, dimension: dimensionless, description: "the factor by which the paper decreases Ecore/E1 to test the sensitivity of l"}
- {id: stress_ratio, name: ratio of strata compressive stresses, dimension: dimensionless, description: "sigma2/sigma1, stresses positive in compression"}
- {id: wavelength_thickness_ratio, name: buckling wavelength over cortical thickness, dimension: dimensionless, description: "l/t"}
- {id: buckling_wavelength, name: incipient buckling wavelength (intersulcal distance), dimension: "[length]", description: "l: the wavelength of buckling, equivalent to the intersulcal or intergyral distance (note 21)"}
- {id: critical_stress_ratio, name: critical stratum 1 stress over E1, dimension: dimensionless, description: "(sigma1)critical / E1, the stress in stratum 1 at which the surface buckles"}
- {id: wavelength_increase_factor, name: factor by which the wavelength increases, dimension: dimensionless, description: "l after decreasing Ecore/E1 over l before"}
- {id: tissue_youngs_modulus, name: Young's modulus of adult myelinated white matter, dimension: "[mass]/[length]/[time]**2", description: "estimates from Estes and McElhaney's stress-strain data (note 19)"}
- {id: test_load_stress, name: load applied in the stress-strain tests, dimension: "[mass]/[length]/[time]**2", description: "loads at which Estes and McElhaney tested white matter (note 19)"}
- {id: thickness_reduction_ratio, name: cortical thickness with the inner stratum absent over the normal thickness, dimension: dimensionless, description: "t with t2 = 0 over t = t1 + t2 with t1 = t2 (note 22)"}
- {id: wavelength_reduction_ratio, name: buckling wavelength with the inner stratum absent over the normal wavelength, dimension: dimensionless, description: "l with t2 = 0 over l with t1 = t2, at the same l/t (note 22)"}
