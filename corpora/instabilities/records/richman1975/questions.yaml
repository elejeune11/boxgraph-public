- id: q_no_validation_wang2015
  kind: choice
  about: [plate_on_foundation, plate_stiffness_sensitivity, wavelength_from_thickness, wang2015/crease_onset_measured, wang2015/fold_onset_measured, wang2015/pd_onset_measured, wang2015/ridge_onset_measured, wang2015/wrinkle_wavelength_fig5a, wang2015/amplitude_fig5b_r9110]
  text: >-
    No validation of this record's models against wang2015 is entered (cross-validation job 2026-11-18).
    wang2015 measures the onset mismatch strains of creases, folds, period-doubles and ridges (eM about
    0.32-0.36), wavelengths normalized by the initial wrinkle wavelength against (1 - eM)/(1 - eC)
    (Fig. 5A), wrinkle amplitudes over the initial wavelength (Fig. 5B), and the shear moduli of its
    Ecoflex and Sylgard layers. plate_on_foundation gives l/t and a critical stress ratio sigma1_crit/E1
    for two bonded strata on a core, and is a reconstruction of an unpublished analysis (ref. 20);
    wavelength_from_thickness gives a length from l/t and t; plate_stiffness_sensitivity a ratio of
    wavelengths at two core stiffnesses. None of these is a quantity wang2015 measures: a critical stress
    over a modulus is not the mismatch strain of a growing film, and a wavelength over the thickness is not
    one over the initial wrinkle wavelength. wang2015 cites this paper (its ref. 14) only as a source of the
    tissue entry of its Table 1. The other direction is wang2015/q_no_validation_richman1975.
- id: q_no_validation_jin2015
  kind: choice
  about: [plate_on_foundation, plate_stiffness_sensitivity, wavelength_from_thickness, sphere_area_ratio, layer_area_ratio, jin2015/exp_wrinkle_7p5to1_text, jin2015/exp_wrinkle_10to1_text, jin2015/exp_crease_15to1_text, jin2015/exp_crease_10to1_text, jin2015/substrate_H_exp, jin2015/film_H_exp]
  text: >-
    No validation of this record's models against jin2015 is entered (cross-validation job 2026-11-19).
    jin2015 (which cites this paper as its ref. 13, only as an example of brain folding) measures the
    uniaxial onset strains of wrinkles (7.5:1 and 10:1 PDMS films, 0.18-0.28) and of creases (15:1 and 10:1
    films, 0.28-0.37) on a 30:1 PDMS substrate, and the film and substrate thicknesses (18-20 um, about
    550 um); it prints no measured wavelength (Fig. 6 shows micrographs only). plate_on_foundation gives
    l/t and a critical stress ratio sigma1_crit/E1 for two bonded strata under equibiaxial compression on a
    half-space, and is a reconstruction of an unpublished analysis (ref. 20); wavelength_from_thickness gives
    a length from l/t and t; plate_stiffness_sensitivity a ratio of wavelengths; the area-ratio models are
    sphere geometry. None of these is a quantity jin2015 measures: a critical stress over a modulus under
    equibiaxial load is not the nominal uniaxial strain applied to film and substrate together, and turning
    one into the other would need a constitutive step no model here makes. The thicknesses are measured
    inputs, not predictions, and the film and substrate moduli are not printed (jin2015/q_exp_moduli). The
    other direction is jin2015/q_no_validation_richman1975.
