- id: q_no_validation_tallinen2015
  kind: choice
  about: [plate_on_foundation, wavelength_from_thickness, plate_stiffness_sensitivity, sphere_area_ratio, l_measured_27wk, l_measured_sidman, tallinen2015/fold_spacing_large_g_printed, tallinen2015/eta_brain_printed]
  text: >-
    No validation between this record and tallinen2015 is entered, in either direction (cross-validation job
    2026-11-14). tallinen2015 has no measurements: every datum in it is its own analytic or finite-element result
