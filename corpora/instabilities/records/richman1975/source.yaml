notes: >
  In scope: every printed number that a model produces or uses. (1) Note 18: the area ratio of two
  concentric spherical layers, in its exact form 4piR^2/4pi(R-t)^2 and its approximation R/(R-2t),
  run on R = 84 mm and t = 1.7 mm against the printed 80.6 mm and 1.04. (2) Note 18 / Table 1: the
  measured ratio of the layer II to layer VI areas, 77.9/67.5, against the printed 1.16 (the build
  gets only "close": the quotient rounds to another last digit; see questions). All twelve Table 1
  areas are recorded. (3) The wavelength prediction l = (l/t) t with l/t = 8 from Fig. 4A and
  t = 1.0 mm (p. 3), and t = t1 + t2 with t1 = t2 = 0.5 mm (p. 2, note 22). The prediction is
  validated against the two printed incipient intersulcal distances (8.5 mm, this paper's 27-week
  specimen; 7.5 mm, from Sidman and Rakic), and also run with the 1.7 mm cortical thickness that
  note 18 gives for that same 27-week specimen. (4) The buckling analysis itself (ref. 20,
  "unpublished data") is not given in the paper. It is entered from the paper's words as a
  from-words model: two bonded, incompressible thin (Kirchhoff) plates under equibiaxial compression
  on an incompressible elastic half-space, giving l/t and the critical sigma1/E1. This is the
  record's reading, not the paper's analysis (question q_buckling_analysis_unstated); it is compared
  with the printed l/t = 8 and with the "factor of approximately 2" stiffness sensitivity. The
  inputs the paper prints as relations (E1 = E2, Ecore/E1 = 1/10, sigma2/sigma1 > 0) are in
  added.yaml with alternatives. Left out: numbers that feed no model (note 7's 400-fold volume
  increase, note 24's 1080 serial sections and 25 measured sections, gestational ages in the
  narrative); R = 25 mm is recorded though no model uses it, because the curvature is neglected
  by the paper. Note 19's adult white-matter modulus (2 to 7 psi) and test loads (1 to 10 psi) from
  Estes and McElhaney are recorded as cited data. Figures: Fig. 4A and 4B (computed curves) are
  listed for the figure pass in figures.md; Figs. 1-3 are micrographs and drawings with no values.
  Figure pass (2026-11-13): Fig. 4A and 4B are read by calibrated code (figures.yaml) into the
  curve data l_over_t_fig4a and sigma1_crit_fig4b, and compared with the thin-plate reading swept
  over sigma2/sigma1 (cmp_plate_fig4a, cmp_plate_fig4b); see figures.md.
