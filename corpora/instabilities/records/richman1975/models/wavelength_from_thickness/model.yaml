id: wavelength_from_thickness
name: buckling wavelength from l/t and the cortical thickness (p. 3, note 22)
stated: {page: 3, printed_page: "20", quote: "t 1.0 mm, and hence 1 8t 8 mm", where: text}
equation: "l ≈ 8t (l = (l/t) t, with l/t read from Fig. 4A)"
inputs:
  l_over_t: {quantity: wavelength_thickness_ratio, unit: dimensionless}
  t: {quantity: cortical_thickness, unit: mm}
outputs:
  l: {quantity: buckling_wavelength, unit: mm}
