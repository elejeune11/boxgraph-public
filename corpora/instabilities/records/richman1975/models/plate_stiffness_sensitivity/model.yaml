id: plate_stiffness_sensitivity
name: increase of l when Ecore/E1 is decreased, in the from-words plate model (p. 3)
stated: {page: 3, printed_page: "20", quote: "by a factor of 10 was found to increase", where: text}
reconstructed: "the factor of about 2 comes from the unpublished analysis (ref. 20); this model evaluates the reader's thin-plate stand-in (plate_on_foundation)"
from_words: true
built_from: [plate_on_foundation]
equation: "factor = l(Ecore/E1 / F) / l(Ecore/E1), l from plate_on_foundation"
inputs:
  t1: {quantity: stratum_thickness, unit: mm}
  t2: {quantity: stratum_thickness, unit: mm}
  E2_over_E1: {quantity: stratum_modulus_ratio, unit: dimensionless}
  Ecore_over_E1: {quantity: core_modulus_ratio, unit: dimensionless}
  stress_ratio: {quantity: stress_ratio, unit: dimensionless}
  F: {quantity: stiffness_reduction_factor, unit: dimensionless}
outputs:
  factor: {quantity: wavelength_increase_factor, unit: dimensionless}
