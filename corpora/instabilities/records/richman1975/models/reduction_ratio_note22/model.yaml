id: reduction_ratio_note22
name: thickness and wavelength with the inner stratum absent over their normal values (note 22)
stated: {page: 4, printed_page: "21", quote: "were to become 0, then t would be reduced by one", where: "note 22"}
equation: "t2 -> 0: t reduced by one-half; since l = 8t, l also reduced by one-half (ratios t'/t and l'/l)"
inputs:
  t_new: {quantity: cortical_thickness, unit: mm, description: "t with t2 = 0"}
  t_old: {quantity: cortical_thickness, unit: mm, description: "t = t1 + t2 with t1 = t2"}
  l_new: {quantity: buckling_wavelength, unit: mm, description: "l = 8t with t2 = 0"}
  l_old: {quantity: buckling_wavelength, unit: mm, description: "l = 8t with t1 = t2"}
outputs:
  t_ratio: {quantity: thickness_reduction_ratio, unit: dimensionless}
  l_ratio: {quantity: wavelength_reduction_ratio, unit: dimensionless}
