- id: Ecore_over_E1_added
  quantity: core_modulus_ratio
  unit: dimensionless
  printed: "0.1"
  basis: >
    The Fig. 4 caption and text (p. 3) print Ecore/E1 = 1/10; the printed-value syntax holds no
    fractions, so the record writes its value as 0.1 here rather than as a datum.
  alternatives: ["0.01"]
  stands_for: Ecore/E1
- id: E2_over_E1_added
  quantity: stratum_modulus_ratio
  unit: dimensionless
  printed: "1"
  basis: >
    The Fig. 4 caption prints the choice E1 = E2; p. 2 says stiffnesses satisfying E1 ≈ E2. Written as
    a ratio of 1 because the paper states an equality, not a number.
  alternatives: ["0.5", "2"]
  stands_for: E2/E1
- id: stress_ratio_added
  quantity: stress_ratio
  unit: dimensionless
  printed: "0.5"
  basis: >
    The paper's normal case is sigma1 > sigma2 > 0 (p. 3), i.e. 0 < sigma2/sigma1 < 1, and l/t = 8 is
    printed for all sigma2/sigma1 > 0; no single value is given. 0.5 is the middle of that range.
  alternatives: ["0.1", "1"]
  stands_for: sigma2/sigma1
