id: transition_to_wavelength_ratio
name: transition length over buckle wavelength, from the first forms of Eq. 5 and Eq. 3
role: model
stated: {page: 4, printed_page: "149", quote: "The transition length is 17 times the buckle wavelength", where: text}
equation: "l/L = [0.3 t X] / [4.36 t X^(1/3)], X = E_m (1 - nu_p^2) / (E_p (1 - nu_m^2))"
built_from: [transition_length_eq5, wavelength_eq3]
inputs:
  Em: {quantity: film_youngs_modulus, unit: Pa}
  Ep: {quantity: substrate_youngs_modulus, unit: Pa}
  nu_m: {quantity: film_poisson_ratio, unit: dimensionless}
  nu_p: {quantity: substrate_poisson_ratio, unit: dimensionless}
outputs:
  l_over_L: {quantity: transition_length_to_wavelength_ratio, unit: dimensionless}
settings: {}
stochastic: false
