id: critical_stress_eq2
name: critical film stress for wrinkling of a stiff film on a compliant half-space (Eq. 2)
role: model
stated: {page: 3, printed_page: "148", quote: "stress attains the critical value, jcrit (Pa; equation (2))14", where: "Eq. 2"}
equation: "sigma_crit ≈ 0.52 (E_m/(1 - nu_m^2))^(1/3) (E_p/(1 - nu_p^2))^(2/3)"
described_from: ref-14
inputs:
  Em: {quantity: film_youngs_modulus, unit: Pa}
  Ep: {quantity: substrate_youngs_modulus, unit: Pa}
  nu_m: {quantity: film_poisson_ratio, unit: dimensionless}
  nu_p: {quantity: substrate_poisson_ratio, unit: dimensionless}
outputs:
  sigma_crit: {quantity: critical_buckling_stress, unit: MPa}
settings: {}
stochastic: false
