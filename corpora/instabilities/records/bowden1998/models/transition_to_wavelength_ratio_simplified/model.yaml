id: transition_to_wavelength_ratio_simplified
name: transition length over buckle wavelength, from the simplified forms of Eq. 5 and Eq. 3
role: model
stated: {page: 4, printed_page: "149", quote: "The transition length is 17 times the buckle wavelength", where: text}
equation: "l/L = [0.3 t (E_m/E_p)] / [4.4 t (E_m/E_p)^(1/3)]"
built_from: [transition_length_eq5_simplified, wavelength_eq3_simplified]
inputs:
  Em: {quantity: film_youngs_modulus, unit: Pa}
  Ep: {quantity: substrate_youngs_modulus, unit: Pa}
outputs:
  l_over_L: {quantity: transition_length_to_wavelength_ratio, unit: dimensionless}
settings: {}
stochastic: false
