id: transition_length_eq5
name: stress transition length near a step in the substrate (Eq. 5, first form)
role: model
stated: {page: 4, printed_page: "149", quote: "The transition length l (m) characterizing the", where: "Eq. 5"}
equation: "l ≈ 0.3 t [E_m (1 - nu_p^2) / (E_p (1 - nu_m^2))]"
inputs:
  Em: {quantity: film_youngs_modulus, unit: Pa}
  Ep: {quantity: substrate_youngs_modulus, unit: Pa}
  nu_m: {quantity: film_poisson_ratio, unit: dimensionless}
  nu_p: {quantity: substrate_poisson_ratio, unit: dimensionless}
  t: {quantity: film_thickness, unit: nm}
outputs:
  l: {quantity: transition_length, unit: um}
  l_over_t: {quantity: transition_length_to_thickness_ratio, unit: dimensionless}
settings: {}
stochastic: false
