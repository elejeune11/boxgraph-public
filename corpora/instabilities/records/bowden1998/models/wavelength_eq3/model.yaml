id: wavelength_eq3
name: wrinkle wavelength of a stiff film on a compliant half-space (Eq. 3, first form)
role: model
stated: {page: 3, printed_page: "148", quote: "has wavelength L (m) given by", where: "Eq. 3"}
equation: "L ≈ 4.36 t [E_m (1 - nu_p^2) / (E_p (1 - nu_m^2))]^(1/3)"
described_from: ref-14
inputs:
  Em: {quantity: film_youngs_modulus, unit: Pa}
  Ep: {quantity: substrate_youngs_modulus, unit: Pa}
  nu_m: {quantity: film_poisson_ratio, unit: dimensionless}
  nu_p: {quantity: substrate_poisson_ratio, unit: dimensionless}
  t: {quantity: film_thickness, unit: nm}
outputs:
  L: {quantity: wrinkle_wavelength, unit: um}
  L_over_t: {quantity: wavelength_to_thickness_ratio, unit: dimensionless}
settings: {}
stochastic: false
