id: thermal_stress_eq1
name: equi-biaxial thermal mismatch stress in the unbuckled film (Eq. 1)
role: model
stated: {page: 3, printed_page: "148", quote: "would be in a state of uniform, equi-biaxial compressive stress", where: "Eq. 1"}
equation: "sigma_o = E_m (alpha_p - alpha_m)(T_D - T)/(1 - nu_m)"
described_from: ref-18
inputs:
  Em: {quantity: film_youngs_modulus, unit: Pa}
  nu_m: {quantity: film_poisson_ratio, unit: dimensionless}
  alpha_p: {quantity: substrate_thermal_expansion, unit: 1/K}
  alpha_m: {quantity: film_thermal_expansion, unit: 1/K}
  TD: {quantity: deposition_temperature, unit: K}
  T: {quantity: temperature, unit: K}
outputs:
  sigma_o: {quantity: equibiaxial_film_stress, unit: Pa}
settings: {}
stochastic: false
