id: step_stress_eq4
name: film stresses near an isolated step, in units of sigma_0 (Eqs. 4a and 4b)
role: model
stated: {page: 4, printed_page: "149", quote: "gives equations (4a) and (4b), where", where: "Eqs. 4a, 4b"}
equation: "sigma_x = - sigma_0 [1 - e^(-|x|/l)] (4a); sigma_y = - sigma_0 [1 - nu_m e^(-|x|/l)] (4b)"
inputs:
  x: {quantity: distance_from_step, unit: um}
  l: {quantity: transition_length, unit: um}
  nu_m: {quantity: film_poisson_ratio, unit: dimensionless}
outputs:
  sx: {quantity: compressive_stress_x_over_sigma0, unit: dimensionless,
       description: "-sigma_x/sigma_0: Eqs. 4 give compression negative with sigma_0 the positive compressive stress of Eq. 1; Fig. 4a plots compression upwards from 0 to sigma_0"}
  sy: {quantity: compressive_stress_y_over_sigma0, unit: dimensionless,
       description: "-sigma_y/sigma_0, as for sx"}
settings: {}
stochastic: false
