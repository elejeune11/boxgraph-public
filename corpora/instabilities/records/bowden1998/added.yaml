- id: t_film_added
  quantity: film_thickness
  unit: nm
  printed: "50"
  basis: >
    The paper does not say which thickness it puts in Eq. 3 for the estimate L ~ 3.4 um. The films are
    50 nm of gold on a 5 nm Ti or Cr interlayer (p. 1, Fig. 2 caption), and the modified layer is
    "40 times that of the Au" at 2 um (p. 3), so t is taken as the gold thickness.
  alternatives: ["55"]
  stands_for: t in Eq. 3 and in Fig. 3
- id: nu1_added
  quantity: modified_layer_poisson_ratio
  unit: dimensionless
  printed: "0.48"
  basis: The paper gives no Poisson's ratio for the modified PDMS layer; taken equal to that of PDMS (0.48, p. 3)
  alternatives: ["0.33", "0.5"]
  stands_for: Poisson's ratio of the modified layer in the Fig. 3 multilayer analysis
# Cross-validation against richman1975 (job 2026-11-14): the moduli of the fetal cortex and its core.
- id: Em_brain_added
  quantity: film_youngs_modulus
  unit: kPa
  printed: "310"
  basis: >-
    For the cross-validation against richman1975's intersulcal distances. Neither paper measures a modulus
    of fetal brain tissue. richman1975 takes Ecore/E1 = 1/10 with E1 = E2 for its prediction (p. 3, "for
    Ecore/E1 = 1/10, l/t ≈ 8"; Fig. 4 caption), a modelling choice, not a measurement; Em is set ten times
    Ep_brain_added. Eq. 3 depends only on Em/Ep, so only that ratio matters. Alternatives give Em/Ep = 100 and 3.
  alternatives: ["3100", "93"]
  stands_for: E_m in Eq. 3, the cortical layer (both strata, E1 = E2)
- id: Ep_brain_added
  quantity: substrate_youngs_modulus
  unit: kPa
  printed: "31"
  basis: >-
    For the cross-validation against richman1975. richman1975 (note 19) cites only adult white-matter
    estimates of 2 to 7 psi, whose middle, 4.5 psi, is about 31 kPa. It enters Eq. 3 only through
    Em_brain_added, which is set ten times larger.
  alternatives: ["14", "48"]
  stands_for: E_p in Eq. 3, the elastic core (white matter) under the fetal cortex
- id: nu_brain_added
  quantity: film_poisson_ratio
  unit: dimensionless
  printed: "0.5"
  basis: >-
    For the cross-validation against richman1975, which says "The material was taken to be elastically
    incompressible, an assumption which has little effect on the prediction" (p. 3).
  alternatives: ["0.45"]
  stands_for: nu_m in Eq. 3, the cortical layer
- id: nu_p_brain_added
  quantity: substrate_poisson_ratio
  unit: dimensionless
  printed: "0.5"
  basis: >-
    For the cross-validation against richman1975: the core is taken incompressible like the cortex
    (richman1975 p. 3, "The material was taken to be elastically incompressible").
  alternatives: ["0.45"]
  stands_for: nu_p in Eq. 3, the elastic core
# Cross-validation against stafford2004 (job 2026-11-14): the PDMS of stafford2004's PS films.
- id: Ep_stafford_added
  quantity: substrate_youngs_modulus
  unit: MPa
  printed: "1.75"
  basis: >-
    For the cross-validation against stafford2004's PS wavelengths. stafford2004 prints its PDMS modulus only
    as a range over samples, "(1.5-2.0) ± 0.1 MPa" (stafford2004 p. 4), and no value for any one sample; the
    middle of the range is taken, as stafford2004's own record does (its Es_added). L scales as Ep^(-1/3), so
    the range moves L by about ±5 %.
  alternatives: ["1.5", "2.0", "1.4", "2.1"]
  stands_for: E_p in Eq. 3, stafford2004's PDMS sheet
- id: nu_p_stafford_added
  quantity: substrate_poisson_ratio
  unit: dimensionless
  printed: "0.5"
  basis: >-
    For the cross-validation against stafford2004, which does not state the Poisson's ratio of its PDMS; an
    elastomer is close to incompressible, and stafford2004's record takes 0.5. This paper's own PDMS value,
    0.48 (p. 3), is the alternative.
  alternatives: ["0.48", "0.49", "0.45"]
  stands_for: nu_p in Eq. 3, stafford2004's PDMS sheet
