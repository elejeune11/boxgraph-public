notes: >
  A Nature letter on pp. 146-149 whose first and last PDF pages are shared with other letters; only
  "Spontaneous formation of ordered structures..." is read. Its quantitative core: the thermal-mismatch
  stress Eq. 1, the classic film-on-substrate critical stress Eq. 2 and wavelength Eq. 3 (both from
  Allen, ref. 14), the transition length near a step Eq. 5, the ratio "17 times", the estimate
  L ~ 3.4 um, the multilayer "factor of 7" (Fig. 3) and the measured wavelengths (20-50 um) and depths
  (1.5-3.9 um). Eqs. 3 and 5 are each printed as a chain of three forms (full, without Poisson factors,
  numeric coefficient); the first two are separate models and the numeric coefficients (≈ 61t,
  ≈ 1,060t) are compared with both. Findings: ≈ 1,060t follows from Eq. 5's first form, but ≈ 61t
  follows from neither form of Eq. 3 (about 66t and 70t; q_eq3_61); "17" follows from the printed
  coefficients and the simplified forms but not the full forms (16.0; q_ratio_17); the middle form of
  Eq. 5 is 14% above its first (q_eq5_forms). Values printed with "≈" or "~" get no verdict.
  The paper's own conclusion that Eq. 3 underestimates the observed wavelength is entered as a validation.
  The multilayer model is reconstructed (composite plate on the PDMS half-space; the paper gives no
  analysis) and gives a factor of about 6.6 and L about 22 um. Eq. 2 is run (no printed value) for
  later relations; Eq. 1 is entered but not run (no thermal expansion coefficients or T_D; q_eq1_inputs).
  Left out: Eqs. 4a, 4b, 6a, 6b (stress profiles near steps and over strips: no printed number comes from
  them; the stated minimum -sigma_0(1 - nu_m) at the step is symbolic), the ratios t1/t = 40 and
  E1 ≈ 4Ep (restatements of t1 = 2 um and E1 ≈ 80 MPa), the expansion "<1%" of the PDMS (Fig. 1
  caption), the modification depth "of the order of 1 um", "approximately nine times" (q_nine_times),
  the pattern geometry (step heights, ridge widths and spacings, ordering distances 200-600 um),
  deposition rates and pressures. Figure pass (2026-11-13): both model curves of Fig. 3 are read by code
  and compared with the reconstructed multilayer model written in t1/t and E1/Ep
  (multilayer_wavelength_ratio). The figure is drawn with t near 55 nm (q_fig3_t55). Both curves of
  Fig. 4a are read by code and compared with Eqs. 4a/4b (new model step_stress_eq4) with l from Eq. 5.
  The figure decays over about 3.4 um, not 53 um (q_fig4a_l). Figs. 1, 2, 4b, 4c and 4d have no
  values to read (figures.md).
