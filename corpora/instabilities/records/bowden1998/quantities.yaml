- {id: film_youngs_modulus, name: Young's modulus of the metal film, dimension: "[mass]/[length]/[time]**2", description: "E_m (gold)"}
- {id: substrate_youngs_modulus, name: Young's modulus of the PDMS substrate, dimension: "[mass]/[length]/[time]**2", description: "E_p"}
- {id: film_poisson_ratio, name: Poisson's ratio of the metal film, dimension: dimensionless, description: "nu_m"}
- {id: substrate_poisson_ratio, name: Poisson's ratio of the PDMS substrate, dimension: dimensionless, description: "nu_p"}
- {id: film_thermal_expansion, name: thermal expansion coefficient of the metal film, dimension: "1/[temperature]", description: "alpha_m"}
- {id: substrate_thermal_expansion, name: thermal expansion coefficient of the PDMS substrate, dimension: "1/[temperature]", description: "alpha_p"}
- {id: deposition_temperature, name: deposition temperature, dimension: "[temperature]", description: "T_D, the temperature at which the film is deposited (stress-free)"}
- {id: temperature, name: temperature of the sample, dimension: "[temperature]", description: "T, below T_D"}
- {id: substrate_temperature_during_deposition, name: temperature of the PDMS during evaporation, dimension: "[temperature]", description: "the PDMS temperature during deposition of the metal (external heating)"}
- {id: film_thickness, name: thickness of the metal film, dimension: "[length]", description: "t, the gold film (with its thin Ti or Cr adhesion layer)"}
- {id: adhesion_layer_thickness, name: thickness of the titanium or chromium adhesion layer, dimension: "[length]"}
- {id: equibiaxial_film_stress, name: equi-biaxial compressive thermal stress in the unbuckled film, dimension: "[mass]/[length]/[time]**2", description: "sigma_o of Eq. 1"}
- {id: critical_buckling_stress, name: critical compressive film stress for wrinkling, dimension: "[mass]/[length]/[time]**2", description: "sigma_crit of Eq. 2"}
- {id: wrinkle_wavelength, name: wrinkle (buckle) wavelength, dimension: "[length]", description: "L, the period of the sinusoidal surface waves"}
- {id: wavelength_to_thickness_ratio, name: wavelength over film thickness, dimension: dimensionless, description: "L/t"}
- {id: wrinkle_depth, name: wrinkle depth from crest to trough, dimension: "[length]", description: "peak-to-trough height of the waves (twice the amplitude)"}
- {id: transition_length, name: stress transition length near a step, dimension: "[length]", description: "l of Eq. 5, over which the film stress goes from its value at a step to the remote equi-biaxial value"}
- {id: transition_length_to_thickness_ratio, name: transition length over film thickness, dimension: dimensionless, description: "l/t"}
- {id: transition_length_to_wavelength_ratio, name: transition length over buckle wavelength, dimension: dimensionless, description: "l/L"}
- {id: modified_layer_thickness, name: thickness of the modified surface layer of PDMS, dimension: "[length]", description: "t_1 (Fig. 3)"}
- {id: modified_layer_youngs_modulus, name: Young's modulus of the modified surface layer of PDMS, dimension: "[mass]/[length]/[time]**2", description: "E_1 (Fig. 3)"}
- {id: modified_layer_poisson_ratio, name: Poisson's ratio of the modified surface layer of PDMS, dimension: dimensionless, description: "nu_1"}
- {id: modified_to_film_thickness_ratio, name: thickness of the modified PDMS layer over that of the metal film, dimension: dimensionless, description: "t1/t, the x axis of Fig. 3"}
- {id: modified_to_substrate_modulus_ratio, name: Young's modulus of the modified PDMS layer over that of the PDMS, dimension: dimensionless, description: "E1/Ep, the curve labels of Fig. 3"}
- {id: distance_from_step, name: distance from a step in the PDMS, dimension: "[length]", description: "x of Eqs. 4 and Fig. 4a, measured from the step"}
- {id: compressive_stress_x_over_sigma0, name: compressive film stress normal to the step over the remote equi-biaxial stress, dimension: dimensionless, description: "-sigma_x/sigma_0 (Eq. 4a, Fig. 4a)"}
- {id: compressive_stress_y_over_sigma0, name: compressive film stress along the step over the remote equi-biaxial stress, dimension: dimensionless, description: "-sigma_y/sigma_0 (Eq. 4b, Fig. 4a)"}
- {id: wavelength_increase_factor, name: factor by which the modified layer increases the wavelength, dimension: dimensionless, description: "L with the modified layer over L of the bare film on PDMS"}
