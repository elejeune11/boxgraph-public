- id: q_richman_thickness_choice
  kind: choice
  about: [wavelength_eq3, wavelength_eq3_simplified, Em_brain_added, Ep_brain_added, richman1975/t_27wk, richman1975/t_normal_fetus, richman1975/l_measured_27wk]
  text: >-
    (Cross-validation against richman1975, job 2026-11-14.) The 8.5 mm intersulcal distance belongs to
    richman1975's 27-week specimen, whose cortical thickness note 18 gives as ≈ 1.7 mm, while richman1975's
    own prediction uses t ≈ 1.0 mm for the normal fetus. Which thickness is the measurement's condition is
    open, so Eq. 3 is run with both. All the validations rest on the added moduli Em/Ep = 10 (richman1975's
    modelling choice, not a measurement); since L scales as (Em/Ep)^(1/3), the verdicts test that choice as
    much as Eq. 3. Eq. 3 is also stated for a stiff film on a compliant substrate, and Em/Ep = 10 is only
    moderately large. The composite-plate reconstruction multilayer_wavelength is not run on the cortex: with
    E1 = E2 the two strata are one plate of thickness t1 + t2 and it reduces to Eq. 3.
