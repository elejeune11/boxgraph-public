- id: q_eq3_61
  kind: possible_error
  about: [L_over_t_eq3_printed, wavelength_eq3, wavelength_eq3_simplified]
  text: >
    With the printed parameters (Em = 82 GPa, Ep = 20 MPa, nu_m = 0.33, nu_p = 0.48) the first form of Eq. 3,
    4.36t[Em(1 - nu_p^2)/(Ep(1 - nu_m^2))]^(1/3), gives about 66t and the second form, 4.4t(Em/Ep)^(1/3), about
    70t; the printed last form is ≈ 61t, which neither gives (it would need a prefactor near 4.0 on the first
    form). The paper's ratio "17 times" equals its printed 1,060t/61t, so 61 seems to be the coefficient the
    authors used. The estimate L ~ 3.4 um fits 61t with t = 55 nm (Au plus Ti) or 66t with t = 50 nm.
  citation: {page: 3, printed_page: "148", quote: "has wavelength L (m) given by", where: "Eq. 3"}
- id: q_eq3_forms
  kind: reading
  about: [wavelength_eq3_simplified, transition_length_eq5_simplified]
  text: >
    The middle forms of Eqs. 3 and 5 drop the Poisson factor (1 - nu_p^2)/(1 - nu_m^2) = 0.86 (to the 1/3 power
    in Eq. 3, 0.95). Eq. 3's 4.4 is then 4.36 rounded, not 4.36 times the Poisson factor (4.15). Both forms are
    entered as printed, as separate models.
- id: q_eq5_forms
  kind: possible_error
  about: [l_over_t_eq5_printed, transition_length_eq5_simplified]
  text: >
    The printed ≈ 1,060t follows from the first form of Eq. 5 (0.3 x 3541 = 1062) but not from the middle form
    0.3t(Em/Ep) (1230t); the "≈" between the two forms hides a 14% difference.
  citation: {page: 4, printed_page: "149", quote: "The transition length l (m) characterizing the", where: "Eq. 5"}
- id: q_ratio_17
  kind: unexplained_difference
  about: [l_over_L_printed, transition_to_wavelength_ratio, transition_to_wavelength_ratio_simplified]
  text: >
    "17 times" matches the printed coefficients 1,060/61 = 17.4 and the simplified forms (1230/70.5 = 17.4), but
