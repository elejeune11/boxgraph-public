- id: q_no_validation_shyer2013
  kind: choice
  about: [wavelength_eq3, wavelength_eq3_simplified, multilayer_wavelength, multilayer_wavelength_ratio, critical_stress_eq2, shyer2013/spacing_fig4b, shyer2013/spacing_fig6c, shyer2013/mu_endo_fig4b, shyer2013/mu_mes_fig4b, shyer2013/mu_ratio_fig4b, shyer2013/modulus_ratio_chick_text]
  text: >-
    (Cross-validation against shyer2013, job 2026-11-18.) No validation was entered. shyer2013 cites this
    paper (its ref. 15) only for a qualitative pattern: "a thin layer atop an elastic substrate may take on a
    zigzag topography when it is compressed biaxially" (shyer2013 p. 3). That is a trend, and shyer2013 does
    not quantify it as a pattern-selection measurement. The one measurement Eq. 3 might predict is the fold
    spacing over endoderm thickness (shyer2013/spacing_fig4b, chick; spacing_fig6c, mouse). In Eq. 3,
    L/t depends only on Em/Ep, and shyer2013 measures mu_e and mu_m (Figs. 4B, 6C). The comparison was
    still not entered, for three reasons. (1) The measurements are curves indexed by embryonic age.
    Moduli are plotted only at E8 and E10 (chick) and E14.5 (mouse), and no model here has an age input
    to sweep, so the model cannot be run at each measured point. (2) shyer2013 measures shear moduli,
    while Eq. 3 takes Young's moduli. Their ratios are equal only if the two tissues have the same
    Poisson ratio, which neither paper states. (3) Eq. 3 is the onset wavelength of a stiff film on a
    compliant half-space. In the gut, the mesenchyme is about three endoderm thicknesses deep (stress-free
    (he + hm)/he = 4, shyer2013/stressfree_fig4b) and is confined by muscle. The tissue is also compressed
    far past onset (circumferential ratio 0.55). shyer2013 itself says the wavelength is "comparable to
    the thickness of the endoderm-mesenchyme composite" (p. 5), not to a film-on-half-space scale. A
    validation would rest on these mappings more than on Eq. 3; the wrinkling laws of finite-depth
    substrates (tallinen2015, huang2005) are the better candidates. No model of shyer2013 predicts a
    measurement here: its models give gut compression ratios, stress-free schedules and an unrunnable
    finite-element code, none of which apply to gold films on PDMS.
  citation: {none: "a choice of this cross-validation job"}
- id: q_no_validation_trujillo2008
  kind: choice
  about: [wavelength_eq3, wavelength_eq3_simplified, multilayer_wavelength, multilayer_wavelength_ratio, critical_stress_eq2, transition_length_eq5, L_measured, depth_unheated, depth_300C, trujillo2008/ec_mean_modulus_series, trujillo2008/ec_mean_thickness_series, trujillo2008/hh0_onset_measured]
  text: >-
    (Cross-validation against trujillo2008, job 2026-11-18.) No validation entered, in either direction.
    trujillo2008 cites this paper (its ref. 11) only as an example of the wrinkling of "thin rigid films on
    soft substrates" (trujillo2008 p. 2). It contrasts that wrinkling with the creasing of uncapped gels
    bonded to rigid substrates, which it calls distinct in mechanics and conditions. Its measurements are
    critical compressive strains for creasing, free swelling ratios, crosslinker contents and thickness
    swelling ratios at onset. The models here describe a stiff film on a compliant half-space and give
    wavelengths, transition lengths, a critical stress and a thermal stress. None of them gives a crease
    strain, and the gels have no stiff film for Eq. 2 or Eq. 3 to describe. In the other direction,
    trujillo2008's models (the Biot equibiaxial threshold and swelling conversions) give strains and
    ratios, not the wrinkle periods or depths measured here. See trujillo2008/q_no_validation_bowden1998.
  citation: {none: "a choice of this cross-validation job"}
- id: q_no_validation_wang2014
  kind: choice
  about: [wavelength_eq3, wavelength_eq3_simplified, multilayer_wavelength, multilayer_wavelength_ratio, critical_stress_eq2, transition_length_eq5, transition_length_eq5_simplified, step_stress_eq4, L_measured, depth_unheated, depth_300C, wang2014/mu_s_ecoflex, wang2014/mu_f_sylgard_range, wang2014/H_f_range, wang2014/adhesion_fig3_lp1, wang2014/tension_fig13a, wang2014/exp_wrinkling_fig7a]
  text: >-
    (Cross-validation against wang2014, which cites this paper as its ref. 8; job 2026-11-18.) No
    validation is entered, in either direction. wang2014 cites this paper only as an example of wrinkling
    from thermal mismatch (wang2014 p. 1). wang2014 measures the shear moduli of the Ecoflex substrate and
    the Sylgard films, a film thickness range of ~21 to ~583 um, peel adhesion energies (Fig. 3), uniaxial
    tension curves (Fig. 13), and the categorical initial modes observed at points of its lambda_p = 2
    phase diagram (Fig. 7(a)). It prints no measured wrinkle wavelength, critical stress, transition length
    or step stress profile, so none of the outputs of Eqs. 2-5 or of the multilayer reconstruction can be
    compared. The mode points are placed by modulus ratio and adhesion and give no wavelength. wang2014's
    films are also of similar stiffness to their substrates (mu_f/mu_s about 0.6 to 15), far from the
    stiff-film limit of Eq. 3. In the other direction, wang2014's models give onset strains, a boundary
    modulus ratio, a dimensionless wavenumber kH_f and a tension curve. None of these is the wavelength in
    um or the depth measured here; see wang2014/q_no_validation_bowden1998.
  citation: {none: "a choice of this cross-validation job"}
