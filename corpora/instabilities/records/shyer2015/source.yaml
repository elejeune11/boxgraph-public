notes: >
  The paper is almost entirely signalling biology (Lgr5, Sox9, CD44, Shh, Bmp4, PDGFRa expression in chick
  and mouse gut; culture with cyclopamine, Noggin, Shh, Bmp4, FK506; inside-out ringlets; growth under a
  grid). It makes no mechanical claim of its own: the buckling of the gut lining into ridges, zigzags and
  villi under smooth-muscle constraint is cited from Shyer et al. 2013 (record shyer2013), and no modulus,
  thickness, growth, wavelength, curvature or villus spacing is printed anywhere in this paper. The geometry
  is described only in words (E13 low peak, E14 narrow peak, E15 rounded tip) and in micrographs with scale
  bars; the timing (E12.5-E15.5 mouse, E13-E15 and hatch chick, 36 hr culture, E14.5 mouse villus onset)
  is developmental staging, not a model input, and is left out.
  The one quantitative model is the steady diffusion-reaction simulation of Fig. S3 (Extended Experimental
  Procedures, p. 14): D grad^2 c - k c = 0 on 3-D FE meshes of flat, ridge and zigzag surfaces with a unit
  secretion flux and a sink at the bottom. It is recorded as not runnable: the mesh dimensions are not
  given and its results are colour maps in arbitrary units with no printed number. Its printed inputs are
  recorded: D for Shh, printed both in cm^2/s and in um^2/s (a consistency comparison of the unit
  conversion, which agrees), and the degradation-rate range said to span "three orders of magnitude"
  while the printed ends, 2.0 x 10^-2 and 2.0 x 10^0 1/s as the page image shows them, span two; that
  arithmetic is a small from-words model, and its miss is recorded as a possible error (the upper
  exponent is a small superscript, so it is also a reading question).
  The first reading left out the plotted measurements because page rendering was refused in that
  session (question q_figures_unread). A figure pass (2026-11-18) read all of them with calibrated
  figure readings (figures.yaml, figures/): Fig. 2A Lgr5 per unit length (base, mid, tip at E12, E15,
  E19); Fig. 4C percent EdU+ cells by fold sub-region for six treatments; Fig. 4E Lgr5 per unit area
  (control, cyclopamine); Fig. 5D Shh intensity profiles at E13 and E15 and the E15 base/tip boxes;
  Fig. 6B EdU and Lgr5 for control and inside-out rings; Fig. 6D EdU for control and grid slabs. They are
  recorded as measured data. No model in the corpus predicts them, so there are no comparisons. See
  figures.md. The record has no reproduction comparison because the paper prints no result that a
  model of its own produces; the validator's warning about that is expected. The p-values (p < 0.08, p < 0.001) and the measurement-box sizes (5 um, 100 um)
  feed no model and are left out.
