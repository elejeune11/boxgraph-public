- {id: morphogen_diffusion_coefficient, name: diffusion coefficient of the morphogen (Shh) in tissue, dimension: "[length]**2/[time]", description: "D in the diffusion-reaction equation of Fig. S3E"}
- {id: morphogen_degradation_rate, name: first-order degradation rate constant of the morphogen, dimension: "1/[time]", description: "k in the diffusion-reaction equation of Fig. S3E"}
- {id: parameter_range_span_decades, name: span of a parameter range in decades, dimension: dimensionless, description: "log10 of the ratio of the upper to the lower end of a range: its number of orders of magnitude"}
- {id: morphogen_concentration, name: steady-state morphogen concentration, dimension: dimensionless, description: "c in Fig. S3, in arbitrary units (unit secretion flux)"}
- {id: secretion_flux, name: morphogen secretion flux at the endodermal surface, dimension: dimensionless, description: "set to 1 unit in the simulation"}
- {id: embryonic_day, name: embryonic age, dimension: "[time]", description: "developmental stage as embryonic day (E12, E15, E19 in Fig. 2A)"}
- {id: lgr5_mrna_per_unit_length, name: Lgr5 mRNA molecules per unit epithelial length, dimension: dimensionless, description: "count of single-molecule FISH spots per unit length of epithelium; the length unit is not stated (Fig. 2A)"}
- {id: lgr5_mrna_per_unit_area, name: Lgr5 mRNA molecules per unit area, dimension: dimensionless, description: "count of single-molecule FISH spots per unit area of epithelium; the area unit is not stated (Fig. 4E, 6B)"}
- {id: edu_positive_fraction, name: fraction of EdU-positive epithelial cells, dimension: dimensionless, description: "proliferating (EdU-labelled) cells as a percentage of the cells counted in a fold sub-region (Fig. 4C, 6B, 6D)"}
- {id: fold_subregion_number, name: fold sub-region number, dimension: dimensionless, description: "the six sub-regions of an epithelial fold of the schematic in Fig. 4C: 1 and 6 at the base, 2 and 5 on the flanks, 3 and 4 at the tip"}
- {id: base_tip_index, name: position in the fold (base or tip), dimension: dimensionless, description: "a category index: 1 = base of the fold, 2 = tip of the fold"}
- {id: shh_staining_intensity, name: anti-SHH staining intensity, dimension: dimensionless, description: "immunofluorescence brightness normalized to the background level of each image (Fig. 5D)"}
- {id: distance_along_profile, name: distance along the intensity profile, dimension: "[length]", description: "position along the 100 um box drawn from the epithelium into the mesenchyme in Fig. 5D (dotted line at the epithelial-mesenchymal border)"}
