# Figure readings whose numbers are in the released data (fierling_code). The validations of fierling_code
# check the plotted markers (the means) against the released means; these links check the error bars.
- datum: area_rows_muvi
  from_source: fierling_code
  from_datum: muvi_rows_tm1
  evidence: >
    Fig. 3b's MuVi SPIM squares and their error bars are drawn by area_AP_DV_paper.plot (lines 131-132) from
    rauzi_t=-1_area.gdat (README: Fig. 3b); the released datum is the min6 to max6 range of each row, the
    error bars of the plot, at the same rows 1-9 and the same time (t = -1 min, file -1.175 min).
- datum: area_rows_confocal
  from_source: fierling_code
  from_datum: confocal_rows_tm1
  evidence: >
    Fig. 3b's confocal squares and error bars are drawn by area_AP_DV_paper.plot (lines 133-135) from
    Guy_area_myo_t=-1_area.gdat (README: Fig. 3b); the released datum is the MinArea_i to MaxArea_i range of
    each row 1-7, the plot's error bars, at t = -1 min (file -1.1 min).
