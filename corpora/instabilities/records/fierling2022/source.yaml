notes: >
  PDF pages 1-14 are the article and methods, 15-22 the Supplementary Information notes and 23-25 the
  Supplementary Figures 1-3. The paper's central results come from Surface Evolver simulations of a
  pre-stressed elastic shell that cannot be rerun here (Surface Evolver is not installed; the authors' script
  and plotted data are the separate record fierling_code). What this record checks is therefore the paper's
  closed-form and arithmetic statements and its comparisons of simulation with experiment, as plotted:
  (1) the pre-strain to pre-stress relation, in its main-text form (p. 4) and its SI form (p. 21), against
  the midline pre-stress plotted in Fig. 2c (midline pre-strain 0.43) and Supp. Fig. 1f (5.25) with the
  stated nondimensional modulus 50; the SI form carries the opposite sign (question q_prestress_sign, with a
  sign-corrected variant); (2) the model geometry (R_DV = 90 um, R_AP = 3 R_DV) against the 180 um and
  500 um marked on Fig. 1e; (3) the vitelline gap 2.5e-3 R_DV against "0.2 um" (SI) and "0.2-0.5 um" (main
  text); (4) the length-compatibility argument of Supp. Fig. 1c (ventral tissue one third / one sixth of
  the section, 25% contraction) against the printed ~15%, ~5% and "about three times"; (5) the AP/DV
  stress ratio at the midline from Fig. 2c against "twice"; (6) Fig. 3a area against "20% at time 0 to
  40% at 2 min"; (7) the simulated apical area fold change by row against MuVi SPIM and confocal
  measurements (Fig. 3b); (8) the simulated AP stress profile (Fig. 5d) against the measured recoil
  velocities (Fig. 5e), through the SI's statement that the initial recoil velocity is proportional to
  the line force (prefactor unknown). The SI's three strain laws under exponentially increasing stress
  (elastic, viscous, Maxwell) are entered as models with the stated asymptotic equivalences as relations.
  Eq. 1 (double-exponential MyoII) is entered but not run: its amplitude I and onset t0 are not printed.
  Every figure reading was checked against the released plotted data (fierling_code): Fig. 3b simulations
  match stripe_k_norm of sims_t=-1_area.gdat to 0.001, MuVi and confocal points and bars match
  rauzi_t=-1_area.gdat and Guy_area_myo_t=-1_area.gdat, Fig. 3a MuVi area matches sync_rauzi_area.gdat
  (0.818 at t = 0, 0.54 near 2 min), Fig. 5e bars match the means of laser_ablation_recoil.gdat. A second
  figure pass (2026-11-19; figures.md) read the plotted panels the first pass had left out, with calibrated
  code readings checked against the released numbers where these exist. Fig. 1c (curvature mean +- SD), Fig. 1g
  (the simulation's pre-stress profile), Fig. 2a and Supp. Fig. 1e (strain profiles: the plotted
  midline target size is reproduced by the new model target_size, A_0/A_i = 1/(1 + epsilon_a), and
  shows the band pre-strain is 0.426), Figs. 3c and 3d (AP and DV size by row: simulation against MuVi
  and confocal, validations), Fig. 4b (simulated furrow apex position against the Supp. Fig. 3d
  measured means, validations), Fig. 4c (simulated rate of furrow deepening), Fig. 4f (curvature along
  AP and DV, simulation against MuVi, validations), Supp. Fig. 1a (midline stresses against
  pre-stress), Supp. Fig. 3c (area and AP size by AP bin), 3d (furrow apex position at eight planes),
  3f (furrow depth against pre-stress) and 3g (anterior pole movement). Still left out, with reasons
  in figures.md: Supp. Figs. 2a, 2b and 3e (crowded per-row and per-embryo curves; their values are
  in fierling_code), the MuVi embryos of Fig. 4c and the MyoII dots of Fig. 1g (overlapping markers;
  values released), the micrographs, kymographs and 3D renderings
  (no values), the imaging and ablation settings of the methods (no model uses them), and the stress-tensor
  primer of SI pp. 15-16 (definitions only). The paper's data DOI (10.5281/zenodo.6043523) differs from the
  record fierling_code's Zenodo deposit (6506336); see q_zenodo.
