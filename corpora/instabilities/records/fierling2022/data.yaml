# ---- stated simulation results -------------------------------------------------------------------
- id: stress_ratio_twice
  quantity: stress_anisotropy_ratio
  unit: dimensionless
  origin: predicted
  printed: "2"
  citation: {page: 5, printed_page: "5", quote: "AP tension twice the DV tension along the ventral midline", where: "text, citing Fig. 2c, e"}
  note: "printed 'twice'; the state of Fig. 2c is midline pre-strain 0.43"
- id: area_reduction_text
  quantity: apical_area_reduction
  unit: percent
  origin: measured
  citation: {page: 9, printed_page: "9", quote: "from 20% at time 0 to 40% at", where: Discussion}
  table: {index_quantity: time, index_unit: min, index: ["0", "2"], values: ["20", "40"]}
  note: >
    "At the onset of MyoII increase, the surface area of ventral cells is strongly reduced (from 20% at
    time 0 to 40% at 2 min)". The sentence does not say whether in vivo or in simulation; the methods
    (p. 12) define time 0 as the instant when the five rows closest to the midline have lost 20% of their area.

- id: area_reduction_t0_def
  quantity: apical_area_reduction
  unit: percent
  origin: reported
  citation: {page: 12, printed_page: "12", quote: "had their area reduced by 20% compared to pre-gastrulation", where: "Methods, Time synchronization"}
  table: {index_quantity: time, index_unit: min, index: ["0"], values: ["20"]}
  note: >
    added in audit: the definition of time 0 for all embryos ("Time 0 was set as the instant when cells
    within the 5 rows closest to the midline had their area reduced by 20%"); Fig. 3a averages over the
    same five rows. The tissue-shortening methods (p. 11) instead say "the frame at which cell apical area
    reduces to 20%" (question q_t0_wording).

# ---- viscoelastic relaxation ---------------------------------------------------------------------
- id: relaxation_time_text
  quantity: relaxation_time
  unit: min
  origin: reported
  printed: "~1"
  citation: {page: 3, printed_page: "3", quote: "embryonic epithelium is estimated to be around one minute", where: text}
  from_source: ref-48
  note: >
    added in audit: printed in words ("around one minute"), "shorter than the process of VFF"; the
    paper's reason for neglecting viscous relaxation (SI p. 17: t > tau). No model in the record takes it.

