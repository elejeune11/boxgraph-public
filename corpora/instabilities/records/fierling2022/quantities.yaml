- {id: area_prestrain, name: area pre-strain, dimension: dimensionless, description: "epsilon_a = (A_i - A_0)/A_0, the relative excess of a facet's initial area over its target (equilibrium) area"}
- {id: prestress_nd, name: active pre-stress (nondimensional), dimension: dimensionless, description: "sigma_a in units of kappa / R_DV^2 (the paper's nondimensional units)"}
- {id: stress_ap_nd, name: AP in-plane stress (nondimensional), dimension: dimensionless, description: "sigma_AP, the stress component along the anterior-posterior axis, in units of kappa / R_DV^2"}
- {id: stress_dv_nd, name: DV in-plane stress (nondimensional), dimension: dimensionless, description: "sigma_DV, the stress component along the dorso-ventral axis, in units of kappa / R_DV^2"}
- {id: stress_anisotropy_ratio, name: ratio of AP to DV stress, dimension: dimensionless, description: "sigma_AP / sigma_DV at the ventral midline"}
- {id: compression_modulus_nd, name: nondimensional 2D compression modulus, dimension: dimensionless, description: "chi~_2D = chi_2D R_DV^2 / kappa"}
- {id: poisson_ratio_2d, name: 2D Poisson ratio, dimension: dimensionless}
- {id: angle_from_midline, name: angle from the ventral midline, dimension: dimensionless, description: "angular position on the mid cross-section, measured from the ventral midline (rad)"}
- {id: radius_dv, name: DV radius of the model embryo, dimension: "[length]", description: "R_DV, radius of the mid cross-section of the initial surface"}
- {id: axis_ratio, name: ratio of AP to DV semi-axis, dimension: dimensionless, description: "R_AP / R_DV"}
- {id: bend_parameter, name: bending parameter of the ellipsoid, dimension: dimensionless, description: "Z_p in the surface equation Gamma_0"}
- {id: embryo_length, name: embryo length along AP, dimension: "[length]"}
- {id: embryo_width, name: embryo width along DV, dimension: "[length]"}
- {id: vitelline_gap_relative, name: vitelline gap relative to R_DV, dimension: dimensionless}
- {id: vitelline_gap, name: distance from cell apices to the vitelline membrane, dimension: "[length]"}
- {id: ventral_contraction_strain, name: contraction strain of the ventral tissue, dimension: dimensionless, description: "relative shortening of the ventral tissue along a section"}
- {id: section_to_ventral_length_ratio, name: ratio of section length to ventral tissue length, dimension: dimensionless, description: "how many times the ventral tissue is shorter than the whole section (mid-sagittal or mid-cross)"}
- {id: neighbour_stretch_ap, name: stretch strain of the tissue around the ventral region along AP, dimension: dimensionless}
- {id: neighbour_stretch_dv, name: stretch strain of the tissue around the ventral region along DV, dimension: dimensionless}
- {id: stretch_ratio_ap_dv, name: ratio of AP to DV neighbour stretch, dimension: dimensionless}
- {id: time, name: time from the onset reference (t = 0), dimension: "[time]"}
- {id: area_fold_change, name: apical area relative to initial, dimension: dimensionless}
- {id: apical_area_reduction, name: relative reduction of apical area, dimension: dimensionless, description: "1 - area / initial area"}
- {id: cell_row, name: distance from the midline in cell radii, dimension: dimensionless, description: "row index of cells counted from the ventral midline (number of cell radii)"}
- {id: dv_distance, name: DV distance from the ventral midline, dimension: "[length]"}
- {id: recoil_velocity, name: initial recoil velocity after laser ablation, dimension: "[length]/[time]"}
- {id: stress_amplitude, name: amplitude of an imposed stress, dimension: "[pressure]", description: "sigma_0 in sigma = sigma_0 (exp(t/tau) - 1)"}
- {id: shear_modulus, name: elastic shear modulus, dimension: "[pressure]"}
- {id: viscosity, name: viscosity, dimension: "[pressure]*[time]"}
- {id: load_time_constant, name: time constant of the exponential load, dimension: "[time]", description: "tau in sigma = sigma_0 (exp(t/tau) - 1)"}
- {id: relaxation_time, name: Maxwell relaxation time, dimension: "[time]"}
- {id: strain, name: strain under the imposed load, dimension: dimensionless}
- {id: myosin_intensity, name: MyoII fluorescence intensity (arbitrary units), dimension: dimensionless}
- {id: myosin_time_constant, name: characteristic time of MyoII increase, dimension: "[time]", description: "T in Eq. 1"}
- {id: myosin_onset_time, name: time from which MyoII increases, dimension: "[time]", description: "t_0 in Eq. 1"}
# ---- added in the second figure pass ----
- {id: ap_length_fold_change, name: apical AP cell size relative to initial, dimension: dimensionless, description: "AP length of cells relative to their initial AP length (Fig. 3c)"}
- {id: dv_length_fold_change, name: apical DV cell size relative to initial, dimension: dimensionless, description: "DV length of cells relative to their initial DV length (Fig. 3d)"}
- {id: target_size_relative, name: target size relative to original size, dimension: dimensionless, description: "the size a pre-strained facet would take at rest, relative to its initial size, as plotted in the strain profiles (Fig. 2a, Supp. Fig. 1e)"}
- {id: dv_size_relative, name: actual DV size relative to original, dimension: dimensionless, description: "simulated mean DV size of facets relative to the original mean (Fig. 2a)"}
- {id: ap_size_relative, name: actual AP size relative to original, dimension: dimensionless, description: "simulated mean AP size of facets relative to the original mean (Fig. 2a)"}
- {id: tissue_curvature, name: curvature of the ventral tissue, dimension: "1/[length]", description: "1/R of the ventral apical surface, positive convex (Figs. 1c, 4f)"}
- {id: ablation_phase, name: phase of the ablation experiment, dimension: dimensionless, description: "0 for t0 (before), 1 for t1 (just before ablation), 2 for t2 (just after), 3 for t3 (after recovery), the categories of Fig. 1c"}
- {id: ap_position, name: AP position along the embryo, dimension: "[length]", description: "x coordinate of a transverse plane from the mid-transverse plane"}
- {id: furrow_deepening_rate, name: rate of furrow deepening, dimension: "[length]/[time]"}
- {id: furrow_apex_position, name: furrow apex position, dimension: "[length]", description: "z position of the furrow apex from a reference (Fig. 4b)"}
- {id: furrow_depth, name: depth of the ventral furrow, dimension: "[length]"}
- {id: pole_displacement, name: inward movement of the anterior pole, dimension: "[length]"}
- {id: category_index, name: index of a category on a categorical axis, dimension: dimensionless, description: "0 for a plot's only category"}
- {id: myosin_excess_normalised, name: normalised MyoII excess fluorescence, dimension: dimensionless, description: "MyoII excess fluorescence relative to the midline row (Fig. 1g); also the pre-stress profile shape chosen for simulations"}
