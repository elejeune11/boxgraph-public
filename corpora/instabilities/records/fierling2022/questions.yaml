- id: q_no_validation_cerda2003
  kind: choice
  about: [prestress_main, target_size, area_reduction, recoil_from_stress, embryo_dimensions, curv_ablation_fig1c, area_muvi_fig3a, furrow_z_p0_sf3d, cerda2003/L_fig1, cerda2003/t_fig1, cerda2003/two_Hs_hand]
  text: >-
    No validation is entered between this record and cerda2003, in either direction (cross-validation job
    2026-11-19). The paper does not cite cerda2003. This record's models give pre-stresses, target sizes,
    stress and stretch ratios, apical area reduction, strains under an exponential load, recoil velocity
    profiles, embryo dimensions and the vitelline gap; cerda2003's measurements are the length, width,
    thickness and strain of its Fig. 1 stretched sheet and the pinched skin fold 2Hs, all inputs to its
    wrinkle laws, and none is a quantity a model here returns. Conversely cerda2003's models return
    periodic wrinkle wavelengths and amplitudes (and a bending stiffness or thickness inferred from them).
    This record's measurements (cell areas and sizes by row and time, tissue curvature around ablation,
    recoil velocities, furrow apex positions, pole displacement) contain no wavelength or wrinkle
    amplitude: the ventral furrow is a single fold, not a wrinkle train. Nor does the paper give a physical
    modulus or thickness of the epithelium on which a cerda2003 law could be run. The other direction is
    cerda2003/q_no_validation_fierling2022.
  citation: {page: 6, quote: "elastic sheet forms a buckle resulting in a furrow along the long"}
