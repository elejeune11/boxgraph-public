- id: q_prestress_sign
  kind: possible_error
  about: [prestress_si, prestress_si_sign, cmp_prestress_si_043, cmp_prestress_si_525]
  text: >
    The SI (p. 21) concludes "Area pre-strain is thus equivalent to an isotropic pre-stress sigma_a =
    chi_2D (gamma - 1)/gamma". With gamma < 1 (p. 20) this is negative, and with gamma = A_0/A_i it equals
    -chi_2D epsilon_a, the opposite of the main text's sigma_a = chi_2D (A_i - A_0)/A_0 (p. 4). The plotted
    pre-stress (Fig. 2c, Supp. Fig. 1f) is positive and equals chi~ epsilon_a^m (21.3 read against 21.5;
    262.4 against 262.5), so the printed SI form is not reproduced and the sign-corrected variant is. The
    SI's own last line, chi_2D/gamma [Tr E - (gamma - 1)], carries the positive term; the sign is lost
    only in the final statement. The SI's word "pre-stress" may intend a compressive sign convention, but
    the paper does not say so.
  citation: {page: 21, quote: "Area pre-strain is thus equivalent to an isotropic pre-stress"}
- id: q_prestress_rounding
  kind: reading
  about: [cmp_prestress_main_043, prestress_fig2c]
  text: >
    The midline pre-stress read from Fig. 2c (21.29, read interval 21.20-21.39) lies below 50 x 0.43 =
    21.5; it is reproduced only once the rounding of the printed 0.43 is allowed for (21.29/50 = 0.426).
    The step value plotted may be an average over the facets of the first angular bin, or the actual
    midline pre-strain may be 0.426. Supp. Fig. 1f gives 262.4 against 50 x 5.25 = 262.5.
- id: q_theta_port
  kind: choice
  about: [prestress_main, prestress_si, prestress_si_sign]
  text: >
    The pre-stress models take the angle from the midline as an input that does not enter the formula,
    only so that the scalar result can be compared with the step line read from Fig. 2c and Supp. Fig. 1f
    at one angle (0.015 rad) inside the first (midline) band, where the pre-strain equals epsilon_a^m.
    The width of that band is not printed; the figures show it extends to about 0.04-0.08 rad.
- id: q_length_fig1e
  kind: unexplained_difference
  about: [cmp_length_fig1e, embryo_dimensions, length_fig1e]
  text: >
    The model surface has R_DV = 90 um and R_AP = 3 R_DV (SI p. 18), so it is 2 R_AP = 540 um long and
    180 um wide; Fig. 1e, "Representation of the embryo geometry", marks 180 um and 500 um (aspect ratio
    2.8). The comparison is judged reproduced only because the printed "3" carries the precision of an
    integer. Either the drawing is schematic or the simulated embryo is longer than the one drawn.
- id: q_vitelline_gap
  kind: reading
  about: [cmp_gap_si, cmp_gap_main]
  text: >
    2.5 x 10^-3 R_DV with R_DV = 90 um is 0.225 um; the SI prints "≃ 0.2 um" (no verdict, approximate) and
    the main text assumes "approximately 0.2-0.5 um", which 0.225 lies within.
- id: q_compatibility
  kind: reading
  about: [length_compatibility, cmp_stretch_ap, cmp_stretch_dv, cmp_stretch_ratio]
  text: >
    The record reads Supp. Fig. 1c and the main text (pp. 5-6) as a length-compatibility argument: a
    ventral segment 1/n of a section that contracts by 25% while the section keeps its length forces the
    rest to stretch by 25%/(n - 1). With the printed n = 3 (mid-sagittal) and n = 6 (mid-cross) this gives
    12.5% and 5%, against the printed "≈ 15%" and "≈ 5%", and a ratio of 2.5 against "about three times
    greater along the AP". The paper does not give the calculation, and all three printed values are
    approximate, so none gets a verdict; the 12.5% would be printed "≈ 15%" only if n were nearer 2.7.
- id: q_stress_ratio
  kind: overstated_claim
  about: [cmp_stress_ratio, stress_ratio_twice]
  text: >
    The text says the simulation gives "AP tension twice the DV tension along the ventral midline"
    (citing Fig. 2c). Fig. 2c shows sigma_AP = 20.5 and sigma_DV = 12.4 at the midline, a ratio of 1.65.
    The comparison passes only at the precision of the word "twice" (an integer); at the precision of
    the plotted values the ratio is closer to 5/3 than to 2.
- id: q_area_text
  kind: unexplained_difference
  about: [cmp_reduction_muvi, cmp_reduction_sim, area_reduction_text]
  text: >
    The Discussion says the ventral cell area is reduced "from 20% at time 0 to 40% at 2 min" without saying
    whether in vivo or in the model. Fig. 3a gives 17.8% and 46.3% for the MuVi SPIM mean (the released
    sync_rauzi_area.gdat has 0.818 at t = 0) and 20.9% and 41.5% for the simulation. The methods define
    time 0 as the instant the five rows nearest the midline have lost 20% of their area, but the plotted
    MuVi mean has lost 18% at t = 0; the 20% therefore holds for the simulated curve (and is close to
    definitional), and the 40% at 2 min fits the simulation better than the measurement.
  citation: {page: 12, quote: "had their area reduced by 20% compared to pre-gastrulation"}
- id: q_rows
  kind: unexplained_difference
  about: [cmp_rows_muvi, cmp_rows_confocal, area_rows_sim]
  text: >
    The paper says the spatial pattern of area change is "reproduced by our computational model (Fig. 3b)"
    and later "in fair quantitative agreement with simulations". The simulated area fold change at
    t = -1 min in rows 1-3 (0.71, 0.71, 0.76) lies below the whole MuVi min-max range (0.79-0.95,
    0.83-0.95, 0.84-1.03) and below the confocal ranges (0.82-0.91, 0.86-0.90, 0.95-1.00); rows 5-7 of the
    model (0.97-1.02) lie below the MuVi range (1.06-1.22). The model reproduces the sign change of the
    area change with row (contraction near the midline, dilation beyond row 4), not its magnitude; the
    paper does not quantify the agreement.
  citation: {page: 6, quote: "pattern is reproduced by our computational model"}
- id: q_recoil_shape
  kind: unexplained_difference
  about: [cmp_recoil, recoil_from_stress]
  text: >
    The SI states that the initial opening velocity after a cut is proportional to the line force
    (p. 16). With the simulated AP stress of Fig. 5d (207, 163, 35 at 0, 8, 16 um) the recoil should fall
    by a factor of six between 0 and 16 um; the measured mean recoil (Fig. 5e: 1.66, 1.21, 1.07 um/s) falls
    by a factor of 1.6. No single constant fits both profiles. The paper claims only that "tension is
    also maximal close to the midline (Fig. 5e)"; the sharp lateral decay of the simulated stress is not
    seen in the recoil. Recoil also depends on friction and on the stress at the time of ablation, which
    is not stated for Fig. 5e.
  citation: {page: 9, quote: "and tension is also maximal"}
- id: q_recoil_errorbars
  kind: possible_error
  about: [recoil_fig5e_pos, recoil_fig5e_neg]
  text: >
    The caption says Fig. 5e shows "mean values ± standard deviation" for n = 6 embryos. The error bars as
    printed (e.g. +0.095 at -16 um) match sqrt(sum (x - mean)^2)/(n - 1) of the six released values
    (laser_ablation_recoil.gdat in fierling_code), which is the standard deviation divided by sqrt(n - 1),
    not the standard deviation (0.21 at -16 um); the released gnuplot script computes exactly this
    expression (with n = 5 in the released version, while the printed bars and means correspond to all six
    values). The bars are recorded as printed and labelled as the caption says.
  citation: {page: 10, quote: "data are presented as mean values ± standard deviation"}
- id: q_eq1_inputs
  kind: unstated_input
  about: [myosin_eq1, myo_T, myo_Ic]
  text: >
    Eq. 1 is printed with I_c = 4 (arbitrary units) and T = 20 min (p. 12), but the amplitude I and the
    onset t_0 are not printed, so the fitted curve cannot be evaluated; the model is entered but not run.
    The methods also say confocal times were rescaled by a factor 2 "and this corresponds to T = 20 min",
    leaving open whether T is in confocal or rescaled time. The simulated MyoII curve of Fig. 3a is, per the
    released plotting script, the imposed pre-strain rescaled, not Eq. 1 itself.
- id: q_strain_constants
  kind: possible_error
  about: [strain_viscous_exp, strain_maxwell_exp]
  text: >
    For a material "at rest until time t = 0" under sigma = sigma_0 (e^{t/tau} - 1), integrating the viscous
    and Maxwell laws from zero strain gives sigma_0/(2 eta)(tau e^{t/tau} - t - tau) and
    sigma_0/(2 eta_ve)((tau + tau_r) e^{t/tau} - t - tau - tau_r); the printed forms omit the constants
    and so do not vanish at t = 0. This does not change the paper's asymptotic argument for t >> tau (the
    two stated relations test that argument), but the early-time responses are misprinted.
- id: q_not_rerun
  kind: numerics
  about: [sap_fig2c, sdv_fig2c, sap_fig5d, area_sim_fig3a, area_rows_sim]
  text: >
    Every simulated profile in this record comes from Surface Evolver runs that cannot be repeated here
    (the software is not installed and a run is reported to take weeks). The mesh size and convergence
    criteria are not stated in the paper, so whether the plotted stresses and areas are converged cannot be
    checked; the record compares them as printed.
- id: q_zenodo
  kind: reading
  about: [data-availability]
  text: >
    The paper gives https://doi.org/10.5281/zenodo.6043523 for both data and code; the released data and
    Surface Evolver script read for this corpus (record fierling_code) are Zenodo 6506336, presumably a
    later version of the same deposit. The readings here were checked against those files.
- id: q_t0_wording
  kind: reading
  about: [area_reduction_t0_def, area_reduction_text]
  text: >
    (audit) The methods define t = 0 two ways. "Time synchronization" (p. 12): the instant when cells within the
    5 rows closest to the midline "had their area reduced by 20%". "Measuring tissue shortening" (p. 11):
    "the frame at which cell apical area reduces to 20%". Reducing to 20% (area fold change 0.2) is far beyond
    anything in Fig. 3a, so p. 11 presumably means "by 20%", but as printed the two definitions differ.
  citation: {page: 11, quote: "frame at which cell apical area"}
- id: q_ap_stress_prestress
  kind: unexplained_difference
  about: [cmp_ap_stress_prestress, ap_stress_prestress, sap_fig2c, prestress_fig2c]
  text: >
    (audit) The text says sigma_AP "is found approximately equal to the pre-stress sigma_a" (p. 6). In the
    midline band of Fig. 2c the reading gives sigma_a = 21.3 and sigma_AP = 20.5 (q_stress_ratio,
    q_prestress_rounding), about 4% lower. The paper gives no tolerance for "approximately". If the
    comparison is judged not reproduced at the reading's precision, the claim still holds at the level the
    word suggests. Further from the midline (pi/16 to pi/8) the two step lines cross over in Fig. 2c; only
    the midline band is compared here.
- id: q_area_sim_muvi
  kind: unexplained_difference
  about: [cmp_area_sim_muvi, area_sim_fig3a, area_muvi_fig3a]
  text: >
    (audit) The paper says the simulated ventral area shows "similar dynamics as measured in vivo (Fig. 3a)"
    (p. 6). From the readings the simulation lies above the MuVi SPIM mean in reduction at t = 0 (20.9% against
    17.8%) and below it at 2 min (41.5% against 46.3%), so the measured curve falls faster than the simulated
    one. The paper does not quantify "similar", and the MuVi shaded min-max band, which may contain the
    simulated curve, is not part of the reading.
  citation: {page: 6, quote: "showing similar dynamics as measured in vivo"}
- id: q_load_time_constant
  kind: unstated_input
  about: [strain_elastic_exp, strain_viscous_exp, strain_maxwell_exp, rel_viscous_elastic, rel_maxwell_elastic, relaxation_time_text, myo_T]
  text: >
    (audit) The SI argument that viscous relaxation does not change strain patterns (p. 17) requires t > tau,
    where tau is the e-folding time of the imposed stress. The paper never states tau for VFF. The pre-stress
    follows Eq. 1 with T = 20 min (p. 12), whose growth rate near onset is about 1/T, so near onset the
    effective tau is about 20 min. That is longer than the few minutes of furrow formation plotted in Fig. 3a,
    which is the regime (t < tau) where the SI says the responses "differ clearly". The main text gives the
    epithelial relaxation time as about one minute (p. 3, ref. 48). The relations rel_viscous_elastic and
    rel_maxwell_elastic test the asymptotic algebra only (t = 30-40 with tau = 1-2), not whether VFF is in
    that regime.
  citation: {page: 17, quote: "For t < τ, the responses differ clearly"}
