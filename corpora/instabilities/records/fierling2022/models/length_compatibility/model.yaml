id: length_compatibility
name: stretch of the surrounding tissue implied by ventral contraction at fixed section length
role: model
from_words: true
stated: {page: 23, quote: "region and of the strain it implies in other regions", where: "Supp. Fig. 1c caption; main text pp. 5-6"}
equation: "(in words) a ventral segment 1/n of the section contracts by e while the section keeps its length; the rest, (n - 1)/n of it, stretches by e/(n - 1)"
inputs:
  e: {quantity: ventral_contraction_strain, unit: dimensionless}
  n_ap: {quantity: section_to_ventral_length_ratio, unit: dimensionless, description: "mid-sagittal section length over ventral tissue length"}
  n_dv: {quantity: section_to_ventral_length_ratio, unit: dimensionless, description: "mid-cross section length over ventral tissue length"}
outputs:
  s_ap: {quantity: neighbour_stretch_ap, unit: dimensionless}
  s_dv: {quantity: neighbour_stretch_dv, unit: dimensionless}
  ratio: {quantity: stretch_ratio_ap_dv, unit: dimensionless}
settings: {}
stochastic: false
