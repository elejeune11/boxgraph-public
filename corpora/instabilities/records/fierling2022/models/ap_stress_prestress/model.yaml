id: ap_stress_prestress
name: AP stress approximately equal to the imposed pre-stress (stated simulation result)
role: model
from_words: true
stated: {page: 6, printed_page: "6", quote: "is found approximately equal to the pre", where: text}
equation: "(in words) sigma_AP ≈ sigma_a in the ventral region, because little tissue deformation takes place along AP"
inputs:
  sigma_a: {quantity: prestress_nd, unit: dimensionless, curve: {quantity: angle_from_midline, unit: rad}}
outputs:
  sigma_AP: {quantity: stress_ap_nd, unit: dimensionless, curve: {quantity: angle_from_midline, unit: rad}}
settings: {}
stochastic: false
