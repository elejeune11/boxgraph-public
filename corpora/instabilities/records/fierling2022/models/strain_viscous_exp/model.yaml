id: strain_viscous_exp
name: strain of a viscous liquid under exponentially increasing stress
role: model
stated: {page: 17, quote: "In a viscous liquid of viscosity", where: "SI, Role of viscoelastic relaxation"}
equation: "epsilon_v(t) = sigma_0/(2 eta) (tau e^{t/tau} - t)"
inputs:
  sigma0: {quantity: stress_amplitude, unit: Pa}
  eta: {quantity: viscosity, unit: Pa*s}
  tau: {quantity: load_time_constant, unit: s}
  t: {quantity: time, unit: s}
outputs:
  eps: {quantity: strain, unit: dimensionless}
settings: {}
stochastic: false
