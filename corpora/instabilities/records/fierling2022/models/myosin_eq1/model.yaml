id: myosin_eq1
name: double-exponential time course of ventral MyoII fluorescence (Eq. 1)
role: fit
stated: {page: 6, printed_page: "6", quote: "midline is well approximated with a double-exponential function", where: "Eq. 1"}
equation: "I_myo(t) = I_c + I (e^{e^{(t - t_0)/T} - 1} - 1)"
inputs:
  Ic: {quantity: myosin_intensity, unit: dimensionless}
  I: {quantity: myosin_intensity, unit: dimensionless}
  t0: {quantity: myosin_onset_time, unit: min}
  T: {quantity: myosin_time_constant, unit: min}
  t: {quantity: time, unit: min}
outputs:
  I_myo: {quantity: myosin_intensity, unit: dimensionless}
settings: {}
stochastic: false
