id: strain_elastic_exp
name: strain of an elastic material under exponentially increasing stress
role: model
stated: {page: 17, quote: "In an elastic material of elastic shear modulus G", where: "SI, Role of viscoelastic relaxation"}
equation: "sigma = sigma_0 (e^{t/tau} - 1) ; epsilon_e(t) = sigma_0/(2G) (e^{t/tau} - 1)"
inputs:
  sigma0: {quantity: stress_amplitude, unit: Pa}
  G: {quantity: shear_modulus, unit: Pa}
  tau: {quantity: load_time_constant, unit: s}
  t: {quantity: time, unit: s}
outputs:
  eps: {quantity: strain, unit: dimensionless}
settings: {}
stochastic: false
