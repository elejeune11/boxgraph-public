id: prestress_main
name: pre-stress from area pre-strain (main text)
role: model
stated: {page: 4, printed_page: "4", quote: "where χ2D is the in-plane compression elastic modulus", where: "text, p. 4"}
equation: "epsilon_a = (A_i - A_0)/A_0 ; sigma_a = chi_2D (A_i - A_0)/A_0"
inputs:
  chi: {quantity: compression_modulus_nd, unit: dimensionless, description: "chi~_2D (nondimensional, so sigma_a comes out in the paper's nondimensional units)"}
  eps: {quantity: area_prestrain, unit: dimensionless, description: "epsilon_a at the midline, epsilon_a^m"}
  theta: {quantity: angle_from_midline, unit: rad, description: "where on the cross-section the value is wanted; the midline pre-strain holds over the first angular band, so sigma_a does not depend on theta there"}
outputs:
  sigma_a: {quantity: prestress_nd, unit: dimensionless}
settings: {}
stochastic: false
