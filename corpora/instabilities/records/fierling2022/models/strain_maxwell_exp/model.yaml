id: strain_maxwell_exp
name: strain of a Maxwell viscoelastic liquid under exponentially increasing stress
role: model
stated: {page: 17, quote: "In a Maxwell viscoelastic liquid of", where: "SI, Role of viscoelastic relaxation"}
equation: "epsilon_ve(t) = sigma_0/(2 eta_ve) ((tau + tau_r) e^{t/tau} - t)"
inputs:
  sigma0: {quantity: stress_amplitude, unit: Pa}
  eta_ve: {quantity: viscosity, unit: Pa*s}
  tau: {quantity: load_time_constant, unit: s}
  tau_r: {quantity: relaxation_time, unit: s}
  t: {quantity: time, unit: s}
outputs:
  eps: {quantity: strain, unit: dimensionless}
settings: {}
stochastic: false
