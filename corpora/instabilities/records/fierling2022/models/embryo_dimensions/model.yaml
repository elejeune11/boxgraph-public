id: embryo_dimensions
name: length and width of the initial model surface Gamma_0
role: model
stated: {page: 17, quote: "we approximate the initial embryo shape by a closed surface", where: "SI, surface Gamma_0"}
equation: "(x/R_AP)^2 + (y/R_DV)^2 + (z/R_DV - Z_p (x/R_AP)^2)^2 = 1 ; poles at (+-R_AP, 0, Z_p), mid cross-section a circle of radius R_DV"
inputs:
  R_DV: {quantity: radius_dv, unit: um}
  ratio: {quantity: axis_ratio, unit: dimensionless, description: "R_AP / R_DV"}
outputs:
  L: {quantity: embryo_length, unit: um, description: "pole to pole along x, 2 R_AP"}
  W: {quantity: embryo_width, unit: um, description: "diameter of the mid cross-section, 2 R_DV"}
settings: {}
stochastic: false
