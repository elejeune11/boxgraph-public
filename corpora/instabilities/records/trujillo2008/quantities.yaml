- id: critical_stretch_product
  name: critical product of in-plane stretches lambda1^2 lambda3
  dimension: dimensionless
  description: "lambda1^2 lambda3 at the onset of Biot's surface instability, with lambda1, lambda3 the extension ratios l/l0 along the two directions parallel to the free surface (p. 2, refs 20, 21)"
- id: in_plane_stretch
  name: extension ratio along a direction parallel to the free surface
  dimension: dimensionless
  description: "lambda_i = l/l0 for i = 1, 3, the two Cartesian directions parallel to the free surface (p. 2)"
- id: critical_compressive_strain
  name: critical effective linear compressive strain for creasing
  dimension: dimensionless
  description: "e_c, the effective linear (in-plane) compressive strain at the onset of creasing. Measured as e = 1 - l0/l from the free swelling l/l0 of a chemically identical unconstrained gel (p. 3); in Biot's equibiaxial case e_c = 1 - lambda (p. 2)."
- id: poisson_ratio
  name: long-time (equilibrium) Poisson's ratio of the gel
  dimension: dimensionless
  description: "Drained Poisson's ratio of the poly(acrylamide) hydrogel network"
- id: thickness_swelling_ratio
  name: thickness change of a surface-attached gel on swelling
  dimension: dimensionless
  description: "h/h0, swollen thickness over initial (as-polymerized) thickness of the surface-attached layer"
- id: shear_modulus
  name: shear modulus of the gel
  dimension: "[mass]/[length]/[time]**2"
  description: "G of the swollen hydrogel, estimated in Table 1 from the data of Yeung et al. (ref. 6)"
- id: crosslinker_content
  name: cross-linker content
  dimension: dimensionless
  description: "bis(acrylamide) content of the gel, mol% of monomer plus cross-linker"
- id: film_thickness
  name: initial gel film thickness
  dimension: "[length]"
  description: "thickness of the gel layer as polymerized (before swelling)"
- id: material_modulus
  name: elastic modulus of a material (kind unstated)
  dimension: "[mass]/[length]/[time]**2"
  description: "a modulus quoted without saying whether it is a shear or Young's modulus (used as a condition)"
- id: sodium_acrylate_content
  name: charged monomer content
  dimension: dimensionless
  description: "sodium acrylate content of the gel, mol% of the monomers (Figs. 2 and 4)"
- id: free_swelling_ratio
  name: linear swelling ratio of an unconstrained gel
  dimension: dimensionless
  description: "l/l0, the final over the as-polymerized linear size of a freely swelling gel of the same composition (Fig. 2(b)); the effective strain is e = 1 - l0/l"
