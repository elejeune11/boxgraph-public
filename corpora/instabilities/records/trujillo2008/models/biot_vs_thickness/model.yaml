id: biot_vs_thickness
name: Biot's equibiaxial critical strain, independent of film thickness (the dashed line of Fig. 3(b))
role: model
stated: {page: 2, printed_page: "565", quote: "depend on the modulus of the material or the characteristic", where: text}
equation: "e_c = 1 - lambda, lambda1^2 lambda3 = 0.296 with lambda1 = lambda3 = lambda; independent of the length-scale"
described_from: ref-21
built_from: [biot_equibiaxial]
inputs:
  lam_prod: {quantity: critical_stretch_product, unit: dimensionless, description: "critical lambda1^2 lambda3"}
  h: {quantity: film_thickness, unit: um, description: "initial film thickness; the prediction does not depend on it"}
outputs:
  e_c: {quantity: critical_compressive_strain, unit: dimensionless}
settings: {}
stochastic: false
