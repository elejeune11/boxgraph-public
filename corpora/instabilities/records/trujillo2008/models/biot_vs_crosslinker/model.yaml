id: biot_vs_crosslinker
name: Biot's equibiaxial critical strain, independent of cross-linker content (the dashed line of Fig. 3(a))
role: model
stated: {page: 4, printed_page: "567", quote: "agreement with the simple prediction that ec is independent of", where: text}
equation: "e_c = 1 - lambda, lambda1^2 lambda3 = 0.296 with lambda1 = lambda3 = lambda; independent of modulus"
described_from: ref-21
built_from: [biot_equibiaxial]
inputs:
  lam_prod: {quantity: critical_stretch_product, unit: dimensionless, description: "critical lambda1^2 lambda3"}
  c: {quantity: crosslinker_content, unit: percent, description: "bis(acrylamide) content; the prediction does not depend on it"}
outputs:
  e_c: {quantity: critical_compressive_strain, unit: dimensionless}
settings: {}
stochastic: false
