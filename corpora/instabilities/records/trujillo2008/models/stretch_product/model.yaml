id: stretch_product
name: the product of in-plane stretches lambda1^2 lambda3 in which Biot's condition is stated (p. 2)
role: model
stated: {page: 2, printed_page: "565", quote: "Cartesian directions parallel to the free surface", where: text}
# A helper for the relation the paper states on p. 2: Biot (refs 20, 21) "found that the instability
# should first occur when the extension ratios ... satisfy lambda1^2 lambda3 = 0.296". Biot prints the
# condition per loading case as a critical decay factor k (k = lambda^2 in plane strain, Eq. 4.11;
# k = lambda^(3/2) in uniaxial compression; k = 0.295 at the critical compression). This model gives
# the paper's left-hand side so that it can be set against Biot's k. No printed result is computed
# from this helper.
equation: "lambda1^2 lambda3"
inputs:
  lam1: {quantity: in_plane_stretch, unit: dimensionless, description: "extension ratio l/l0 along direction 1, parallel to the free surface"}
  lam3: {quantity: in_plane_stretch, unit: dimensionless, description: "extension ratio l/l0 along direction 3, parallel to the free surface"}
outputs:
  lam_prod: {quantity: critical_stretch_product, unit: dimensionless}
settings: {}
stochastic: false
