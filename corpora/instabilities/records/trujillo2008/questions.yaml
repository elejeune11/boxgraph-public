- id: q_biot_condition_source
  kind: reading
  about: [lam_prod_biot, biot_equibiaxial]
  text: >
    The paper attributes the general condition lambda1^2 lambda3 = 0.296 to Gent and Cho (ref. 20) and Biot
    (ref. 21). Biot (1963, record biot1963) prints the plane-strain critical stretch 0.543 (lambda3 = 1;
    0.5440 unrounded) and the uniaxial one, not an equibiaxial case; 0.544^2 = 0.296, so the printed
    condition is the plane-strain result written as lambda1/lambda2 with incompressibility
    (lambda2 = 1/(lambda1 lambda3)). Its extension to equibiaxial compression is taken here as the paper
    states it and is not checked against Biot's own text in this record.
  citation: {page: 2, printed_page: "565", quote: "two Cartesian directions parallel to the free surface", where: text}
- id: q_crease_vs_linear_threshold
  kind: overstated_claim
  about: [val_biot_modulus_series, val_biot_thickness_series, ec_mean_modulus_series, ec_mean_thickness_series]
  text: >
    The abstract and conclusions call the measured e_c ~ 0.33 in excellent agreement with Biot's 0.334, but
    the paper itself notes two reasons the comparison is not like for like: Biot's result is for an
    incompressible solid, while the gels have Poisson's ratio ~0.3 and finite compressibility should lower
    e_c (ref. 23); and Biot's is the threshold of a linear instability, whereas the measurement is the
    appearance of fully formed (nonlinear) creases that nucleate and grow. The agreement of the numbers
    does not by itself show that the measured onset is Biot's threshold; the crease threshold of a
    neo-Hookean half-space need not equal the linear one.
  citation: {page: 4, printed_page: "567", quote: "Biot’s calculations reflect the conditions for linear instability", where: text}
- id: q_strain_definition
  kind: reading
  about: [ec_mean_modulus_series, ec_biot_printed]
  text: >
    The measured strain is e = 1 - l0/l, the in-plane compression that would return a freely swollen,
    chemically identical gel to its as-polymerized lateral size (Fig. 1(a)); it is identified with Biot's
    equibiaxial 1 - lambda measured from the stress-free swollen state. This rests on the attached and free
    gels reaching the same stress-free swollen state, which for a compressible gel under constraint is an
    approximation the paper does not discuss quantitatively.
  citation: {page: 3, printed_page: "566", quote: "we define the effective compressive strain experienced by", where: text}
- id: q_ec_interpolation
  kind: unstated_model
  about: [ec_mean_modulus_series, ec_mean_thickness_series]
  text: >
    Each e_c is interpolated from the best-fit line of l/l0 against sodium acrylate content (Fig. 2(b)),
    mid-way between the highest flat and the lowest creased composition, with a 90% prediction interval as
    its uncertainty; the individual e_c values and the two averages are given only through Fig. 3 and the
    printed means. The interpolation is not re-run in this record (the plotted data were not read; see
    figures.md), so the printed averages are taken as measured.
  citation: {page: 3, printed_page: "566", quote: "by using the best-fit line to interpolate a value", where: text}
- id: q_southern_thomas_estimate
  kind: unstated_input
  about: [ec_southern_thomas, val_biot_southern_thomas, con_gel_vs_rubber]
  text: >
    e_c = 0.349 +/- 0.013 is estimated by the authors from data in Southern and Thomas (ref. 18), who did not
    determine it themselves; how it was extracted is not given. It sits about 0.015 above Biot's 0.334, a
    little outside its own stated uncertainty, which the paper describes as close proximity.
  citation: {page: 4, printed_page: "567", quote: "did not explicitly determine the critical compression at which", where: text}
- id: q_thickness_reconstruction
  kind: unstated_model
  about: [thickness_from_strain, hh0_expected, run_thickness_at_onset]
  text: >
    The paper expects e_c ~ 0.33 to correspond to h/h0 ~ 2 "based on measured values of Poisson's ratio"
    without giving the relation. The reader's linear-elastic reconstruction (free swelling then equibiaxial
    compression at a free surface) is sensitive to nu: about 1.82 for nu = 0.25, 1.91 for 0.3, 2.02 for 0.35
    and 2.48 for 0.5 at e = 0.33; a finite-strain rule (equal volume in the attached and free gel,
    h/h0 = (l/l0)^3) would instead give about 3.3. The paper's own route may be either or neither.
  citation: {page: 5, printed_page: "568", quote: "on measured values of Poisson’s ratio for hydrogels similar to", where: text}
- id: q_table1_estimated
  kind: reading
  about: [table1_modulus, con_modulus_proportional]
  text: >
    The shear moduli of Table 1 are estimates from Yeung et al. (ref. 6), not measurements on these gels, and
    are exactly 12 kPa per mol% bis(acrylamide) in every row, i.e. they appear to have been made by the very
    proportionality the paper states; their agreement with it is therefore not independent evidence. The
    modulus range 0.6-24 kPa quoted for the e_c series rests on them.
  citation: {page: 2, printed_page: "565", quote: "estimated from the data of Yeung et al", where: Table 1}
