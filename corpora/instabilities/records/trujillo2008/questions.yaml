- id: q_no_validation_stafford2004
  kind: choice
  about: [biot_equibiaxial, biot_vs_crosslinker, biot_vs_thickness, ec_from_swelling, fig3a_ec_points, fig3b_ec_points, hh0_onset_measured, table1_modulus]
  text: >-
    (Cross-validation against stafford2004, job 2026-11-18.) No validation entered, in either direction.
    This paper cites stafford2004 (ref. 13) only as background: wrinkling of a rigid skin on a soft
    substrate is "reasonably well described by the predictions of classical plate theory and linear
    substrate elasticity" (p. 2), in contrast with the creasing of skinless gels on rigid substrates studied
    here. stafford2004 measures wrinkle wavelengths, film thicknesses and nanoindentation moduli of glassy
    films on PDMS under an applied strain that is not a threshold measurement; the models here (Biot's
    threshold, the swelling-to-strain conversions, the modulus estimate from swelling) give a critical
    compressive strain, a swelling ratio or a gel shear modulus, none of which stafford2004 measures. In the
    other direction, stafford2004's Eq. 1 and Eq. 2 need a stiff capping film on a compliant substrate,
    which these gels do not have; the paper says the gel defines no preferred wavelength and the creases
    adopt "a spacing nearly equal to the film thickness" (p. 4), a spacing not recorded as a datum.
    See stafford2004/q_no_validation_trujillo2008.
  citation: {page: 2, printed_page: "565", quote: "well described by the predictions of classical plate theory and", where: text}
