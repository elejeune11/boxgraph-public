  text: >-
    (Cross-validation against bowden1998, job 2026-11-18.) No validation entered, in either direction.
    This paper cites bowden1998 (ref. 11) only to contrast creasing with "the wrinkling instability of thin
    rigid films on soft substrates" (p. 2), which it says differs in mechanics and conditions. It never
    compares its models with bowden1998's data. bowden1998 measures the wrinkle periods (20-50 um) and
    depths (1.5 and 3.9 um) of metal films on PDMS. The models here give a critical strain, a stretch
    product, a gel modulus or a thickness swelling ratio for an uncapped gel; none gives a wavelength or a
    depth, and none applies to a film with a rigid skin. bowden1998's models (Eqs. 1-5, the multilayer
    wavelength) need a stiff film on a compliant substrate. These gels have no capping layer and sit on a
    rigid substrate, so those models predict none of the critical strains, swelling ratios or h/h0 values
    measured here. See bowden1998/q_no_validation_trujillo2008.
