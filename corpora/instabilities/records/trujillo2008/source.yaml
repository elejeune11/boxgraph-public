notes: >
  Born-digital article; all numbers were checked against the page images. An experiment: the critical
  effective linear compressive strain for creasing of surface-attached poly(acrylamide-co-sodium acrylate)
  hydrogels swollen in buffer, defined from the free swelling of a chemically identical gel as
  e = 1 - l0/l (an equibiaxial in-plane strain measured from the stress-free swollen state). Crease-threshold
  data for the relation jobs: measured e_c = 0.33 +/- 0.02 (200 um, 0.05-2.0 mol% bis(acrylamide),
  estimated G 0.6-24 kPa), 0.33 +/- 0.01 (0.4 mol%, 3 um-1 mm), 0.349 +/- 0.013 estimated from Southern and
  Thomas's swollen rubber (~1 MPa), and h/h0 = 2.0 +/- 0.1 at onset for 1 mm attached gels. The theory the
  paper compares with is Biot's linear surface instability (refs 20, 21) written as lambda1^2 lambda3 = 0.296,
  i.e. Biot's plane-strain critical stretch 0.544 (0.544^2 = 0.296), giving in equibiaxial compression
  lambda = 0.296^(1/3) and e_c = 1 - lambda = 0.334: entered as model biot_equibiaxial and reproduced against
  the printed 0.334, then validated against the three measured values. The paper itself notes that its
  measurement is the onset of fully formed (nonlinear) creases in compressible gels, not Biot's linear
  threshold for an incompressible solid (question q_crease_vs_linear_threshold); the record keeps the two
  apart. The paper's step from e_c ~ 0.33 to h/h0 ~ 2 via Poisson's ratio ~0.3 is not shown and is entered
  as a reconstructed linear-elastic model (thickness_from_strain), validated against the measured
  2.0 +/- 0.1. The statement that the modulus is nearly proportional to cross-linker content is a
  prefactor-unknown law compared with Table 1's estimated moduli. Left out: the gel recipe and handling
  numbers (volumes, concentrations, times, bead fraction and spacing), Table 1's sodium acrylate ranges,
  G = nu_x k_B T and the elasto-capillary length h = gamma/G (no numbers), the crease spacing ~ film
  thickness (qualitative, micrographs only) and the reversibility experiments (qualitative). A figure pass
  (2026-11-18) read the plotted data of Figs. 2(a), 2(b), 3(a), 3(b) and 4 with calibrated code readings
  (figures.md): Biot's 0.334 is compared point by point with Fig. 3 (close: the extreme cross-linker
  contents and one 1 mm point fall outside the marker-size uncertainty, q_fig3_trend_point_by_point), the
  means of the plotted points reproduce the printed averages, the paper's interpolation of e_c re-run on
  Fig. 2 reproduces the Fig. 3(a) values (ec_from_swelling), and a reconstructed mid-point rule on Fig. 4
  gives h/h0 about 1.98 at onset against the printed 2.0 +/- 0.1.
