- datum: lam_prod_biot
  from_datum: k_crit_printed
  evidence: >
    The paper takes lambda1^2 lambda3 = 0.296 from Biot (ref. 21, p. 2). Biot prints the critical value
    of the decay factor k = 0.295 "in both cases discussed here" (biot1963 p. 181), with k = lambda^2 in
    plane strain (Eq. 4.11) and k = lambda^(3/2) in uniaxial compression, which in both cases is
    lambda1^2 lambda3 for the stretches parallel to the surface (lambda3 = 1 and lambda^(-1/2)). Biot
    does not print the product 0.296 itself; k = 0.295 is the same critical value.
