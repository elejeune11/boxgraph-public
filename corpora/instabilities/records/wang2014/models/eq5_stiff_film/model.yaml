id: eq5_stiff_film
name: critical wrinkling strain of a stiff film on a prestretched substrate, large modulus ratio (Eq. 5, as printed)
role: model
stated: {page: 4, printed_page: "051004-4", quote: "for large values of moduli ratio", where: Eq. 5}
equation: "e_c wrinkle = (1/4) (Lambda 3 mu_s / mu_f)^(2/3), where Lambda = (1 + lambda_p^2)"
inputs:
  mu_ratio: {quantity: shear_modulus_ratio, unit: dimensionless, description: "mu_f / mu_s"}
  lam_p: {quantity: substrate_prestretch, unit: dimensionless}
outputs:
  e_wrinkle: {quantity: wrinkling_onset_strain, unit: dimensionless}
settings: {}
stochastic: false
