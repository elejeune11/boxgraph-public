id: eq5_stiff_film_half
name: Eq. 5 with the prestretch factor Lambda = (1 + lambda_p^2)/2 (corrected variant)
role: model
stated: {page: 4, printed_page: "051004-4", quote: "for large values of moduli ratio", where: Eq. 5}
equation: "e_c wrinkle = (1/4) (Lambda 3 mu_s / mu_f)^(2/3), with Lambda = (1 + lambda_p^2)/2"
variant_of: eq5_stiff_film
corrections:
  - equation: Eq. 5
    change: "Lambda = (1 + lambda_p^2)/2 instead of the printed (1 + lambda_p^2)"
    evidence: "The paper says Lambda accounts for the effect of the prestretch, so it must be 1 without prestretch, giving the classical (1/4)(3 mu_s/mu_f)^(2/3) of the cited Allen [52]; the printed form gives Lambda = 2 at lambda_p = 1. The cited source of Eq. 5, Cao and Hutchinson [29] (Eq. 5 there, record cao2012/simple_formula_plane), has Lambda = (1/2)(1 + lambda_p^2)."
inputs:
  mu_ratio: {quantity: shear_modulus_ratio, unit: dimensionless, description: "mu_f / mu_s"}
  lam_p: {quantity: substrate_prestretch, unit: dimensionless}
outputs:
  e_wrinkle: {quantity: wrinkling_onset_strain, unit: dimensionless}
settings: {}
stochastic: false
