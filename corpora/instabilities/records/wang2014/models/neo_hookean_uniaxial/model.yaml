id: neo_hookean_uniaxial
name: nominal stress of an incompressible neo-Hookean solid in uniaxial tension (the fit of Fig. 13)
role: fit
stated: {page: 2, printed_page: "051004-2", quote: "ting stress versus strain data from uniaxial tensile tests to the neo", where: "Sec. 2; Fig. 13"}
equation: "S = mu (lambda - lambda^-2) (the neo-Hookean law in uniaxial tension; the paper names the law and plots the fit, it prints no equation)"
from_words: true
inputs:
  mu: {quantity: film_shear_modulus, unit: kPa}
  lam: {quantity: uniaxial_stretch, unit: dimensionless}
outputs:
  S: {quantity: nominal_stress_uniaxial, unit: Pa}
settings: {}
stochastic: false
