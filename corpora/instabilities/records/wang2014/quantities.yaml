- id: shear_modulus_ratio
  name: film to substrate shear modulus ratio
  dimension: dimensionless
  description: "mu_f / mu_s, the ratio of the shear moduli of the incompressible neo-Hookean film and substrate"
- id: substrate_prestretch
  name: substrate prestretch along the compression
  dimension: dimensionless
  description: "lambda_p, the stretch applied to the substrate along the length before the film is bonded (1 = no prestretch); the bonded state is the reference state"
- id: normalized_adhesion_energy
  name: normalized film-substrate adhesion energy
  dimension: dimensionless
  description: "Gamma / (mu_s H_f), adhesion energy per unit reference area over substrate shear modulus times film thickness"
- id: wrinkling_onset_strain
  name: applied compressive strain at the onset of wrinkling
  dimension: dimensionless
  description: "e_c wrinkle, the nominal applied strain e = DL/L (film stretch 1 - e, plane strain) at the wrinkling bifurcation of the flat bonded film"
- id: crease_onset_strain
  name: applied compressive strain at the onset of creasing
  dimension: dimensionless
  description: "e_c crease, the nominal applied strain e = DL/L (plane strain) at which the creased state has the energy of the flat state (energy criterion of Hong et al.); a stretch of 1 - e"
- id: delamination_onset_strain
  name: applied compressive strain at the onset of delaminated buckling from the flat state
  dimension: dimensionless
  description: "e_c buckle, nominal applied strain solving Eqs. 7 and 8"
- id: delaminated_length_normalized
  name: delaminated length of a buckle over film thickness
  dimension: dimensionless
  description: "D_c buckle / H_f, the length of the delaminated region (reference state) at the onset of delaminated buckling"
- id: wrinkle_crease_boundary_modulus_ratio
  name: modulus ratio on the wrinkling-creasing phase boundary
  dimension: dimensionless
  description: "the value of mu_f / mu_s at which the wrinkling and creasing onset strains are equal; above it wrinkling is the initial mode, below it creasing"
- id: triple_point_adhesion
  name: normalized adhesion energy at the triple point of the initial modes
  dimension: dimensionless
  description: "Gamma/(mu_s H_f) at which wrinkling, creasing and delaminated buckling have the same onset strain"
- id: period_doubling_min_modulus_ratio
  name: smallest modulus ratio for wrinkles to go into period doubling
  dimension: dimensionless
  description: "mu_f / mu_s needed for the transition from wrinkling to period doubling at lambda_p = 1 (from Cao and Hutchinson)"
- id: advanced_boundary_point_adhesion
  name: normalized adhesion energy of a labelled corner point of an advanced-mode phase diagram
  dimension: dimensionless
  description: "Gamma/(mu_s H_f) of a point where boundaries between advanced modes (period doubling, folding, localized ridge, delaminated buckling from wrinkles) meet or end (Fig. 12)"
- id: advanced_boundary_point_modulus_ratio
  name: modulus ratio of a labelled corner point of an advanced-mode phase diagram
  dimension: dimensionless
  description: "mu_f/mu_s of a point where boundaries between advanced modes meet or end (Fig. 12)"
- id: substrate_shear_modulus
  name: shear modulus of the substrate elastomer
  dimension: "[mass]/[length]/[time]**2"
  description: "mu_s of Ecoflex 0010, from a neo-Hookean fit to a uniaxial tension test"
- id: film_shear_modulus
  name: shear modulus of the film elastomer
  dimension: "[mass]/[length]/[time]**2"
  description: "mu_f of Sylgard 184 at a given crosslinker concentration, from a neo-Hookean fit to a uniaxial tension test"
- id: film_thickness
  name: film thickness
  dimension: "[length]"
  description: "H_f, the undeformed thickness of the spin-cast Sylgard film"
- id: adhesion_energy
  name: film-substrate adhesion energy
  dimension: "[mass]/[time]**2"
  description: "Gamma, the energy per unit reference area to separate the Sylgard film from the Ecoflex substrate, measured by a peel test"
- id: uniaxial_stretch
  name: stretch in a uniaxial tension test
  dimension: dimensionless
  description: "lambda, deformed over undeformed length of a tensile specimen"
- id: nominal_stress_uniaxial
  name: nominal stress in a uniaxial tension test
  dimension: "[mass]/[length]/[time]**2"
  description: "S, force over undeformed cross-sectional area of a tensile specimen"
- id: delam_wrinkle_boundary_modulus_ratio
  name: modulus ratio on the delaminated-buckling/wrinkling boundary of the initial modes
  dimension: dimensionless
  description: "mu_f/mu_s at which the critical strains for delaminated buckling and wrinkling from the flat state are equal, at a given Gamma/(mu_s H_f)"
- id: delam_crease_boundary_modulus_ratio
  name: modulus ratio on the delaminated-buckling/creasing boundary of the initial modes
  dimension: dimensionless
  description: "mu_f/mu_s at which the critical strains for delaminated buckling and creasing from the flat state are equal, at a given Gamma/(mu_s H_f)"
- id: wrinkle_to_delamination_strain
  name: applied compressive strain at the onset of delaminated buckling from the wrinkled state
  dimension: dimensionless
  description: "e_c wrinkle-buckle, nominal applied strain at which a delaminated buckle has the energy of the wrinkled state (Eqs. 7 and 8 applied to the wrinkled state)"
- id: wrinkle_wavenumber_dimensionless
  name: dimensionless wave number of the wrinkling mode
  dimension: dimensionless
  description: "k H_f at the critical wrinkling mode, wave number referenced to the undeformed film times film thickness"
- id: wrinkling_onset_film_stretch
  name: film stretch along the compression at the onset of wrinkling
  dimension: dimensionless
  description: "1 - e_c wrinkle, the principal stretch of the film along the compression (e = DL/L, plane strain) at the wrinkling bifurcation"
