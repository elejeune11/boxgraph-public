# Values wang2014 takes from other records, linked to the value that record prints.
- datum: eps_crease
  from_datum: eps_c_printed
  evidence: >
    wang2014 takes its crease onset strain, e_c crease = 0.35 (p. 6; "approximately 0.35" on p. 4), from the
    finite-element crease analyses of Hong et al. [55] (ref-55 = hong2009) and Wong et al. [56]. Both are the
    nominal applied compressive strain of an incompressible neo-Hookean solid in plane strain at which the creased
    state has the energy of the flat state; hong2009 prints the predicted critical strain as epsilon_c = 0.35 (p. 2).
