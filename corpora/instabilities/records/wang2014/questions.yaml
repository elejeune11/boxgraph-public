- id: q_boundary_prestretch
  kind: unexplained_difference
  about: [mu_b_lp2, mu_b_lp3, wrinkle_linear_stability, wrinkle_crease_boundary]
  text: >
    The printed critical modulus ratios between wrinkling and creasing fall with prestretch (1.54, 1.22, 1.14
    for lambda_p = 1, 2, 3). Cao and Hutchinson's plane-strain linear stability analysis, which the paper says
    it follows, with the paper's constant crease strain 0.35, gives a boundary close to 1.54 at lambda_p = 1
    but a lower value at lambda_p = 2 and a much higher one at lambda_p = 3, because in that analysis the
    wrinkling strain at mu_f/mu_s near 1 is not monotonic in the prestretch (about 0.456, 0.371 and 0.404 at
    mu_f/mu_s = 1 for lambda_p = 1, 2, 3; Cao and Hutchinson's own Fig. 4 shows the lambda_p = 3 curve
    starting near 0.40). The paper's Fig. 14(b) appears instead to show the wrinkling strain at mu_f/mu_s = 1
    falling steadily with lambda_p. The paper does not say how its curves for lambda_p > 1 were computed
    (which prestretch state, plane strain or uniaxial, or which reference for the strain), so the difference
    cannot be traced from the paper.
