    finite-element results (eps_B, eps_M, the T- and R-points, the curves of its figures). Its one
    experimental value, Gent & Cho's nominal crease strain 0.28-0.42 for rubber compressed by bending
    (diab2013/gent_cho_crease_strain, cited from its ref. 1), is a crease onset under bending. No model here
    outputs a crease onset strain (the 0.35 here is a datum from hong2009, eps_crease).
    wrinkle_linear_stability, run at mu_f/mu_s = 1 and lambda_p = 1, gives Biot's plane-strain wrinkling
    threshold 0.456; crossing that with a crease onset would fold the crease threshold into Biot's. In the
    other direction, diab2013's runnable models (Eq. 2.8 and its inversion, the Biot strain, the M-point
    of Eqs. 2.10-2.12) give bifurcation strains and a normalized wavenumber k/a of a half-space whose
    modulus decays exponentially with depth. None of these was measured here. The measurements here are
    moduli and a thickness range (inputs), peel-test adhesion energies (Fig. 3), tension curves (Fig. 13)
    and the observed initial modes of Fig. 7(a), whose datum is each experiment's modulus ratio, not a
    strain or a wavenumber. A bonded film on a substrate is also not the exponentially graded solid of
    diab2013, so k/a has no value for these experiments. See diab2013/q_no_validation_wang2014.
