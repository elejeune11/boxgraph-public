    compressed uniaxially by a mounting layer. No model here outputs a crease onset strain (0.35 is an
    input from hong2009). (2) jin2015's models against the measurements here: its wrinkle analysis and
    equal-strain boundaries give onset strains, wavelengths and a boundary modulus ratio, none of which
    was measured here. The Fig. 7(a) data are each experiment's modulus ratio with its observed mode, at
    lambda_p = 2, which jin2015's models do not include. jin2015 says its subcritical creases explain why
    creasing was observed here above the predicted modulus ratio (jin2015 p. 6), but that rests on its
    finite-element crease simulations, which cannot be rerun (jin2015/q_crease_fe). It is a qualitative
