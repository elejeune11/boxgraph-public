notes: >
  Scope: the quantitative core of the initial-mode phase diagram. Strain convention: the applied
  compressive strain is nominal, e = DL/L of the bonded film (film stretch 1 - e, substrate stretch
  lambda_p (1 - e)), in plane strain (p. 3). In this convention Biot's plane-strain critical stretch 0.544
  is e = 0.456 and the paper's crease strain 0.35 (taken from Hong et al. 2009, ref. 55) is a stretch of
  0.65; the paper keeps the two thresholds distinct (crease 0.35 is constant in mu_f/mu_s, wrinkling
  falls with mu_f/mu_s).
  Models: (1) the exact plane-strain wrinkling bifurcation of a neo-Hookean film on a prestretched deep
  neo-Hookean substrate, which the paper performs "following Cao and Hutchinson [29]" without printing the
  equations; the code is the same eigenvalue solver as cao2012/bilayer_plane_strain (described_from ref-29).
  (2) The wrinkling/creasing phase boundary, stated in words as the intersection of the wrinkling curve with
  the constant crease strain 0.35 (Fig. 6(a)); it reproduces the printed critical modulus ratios 1.54
  (lambda_p = 1, also the triple point), 1.22 (lambda_p = 2) and 1.14 (lambda_p = 3). (3) Eq. 5, the
  stiff-film approximation, as printed with Lambda = (1 + lambda_p^2), and a corrected variant with
  Lambda = (1 + lambda_p^2)/2 (Cao and Hutchinson's form; the printed form does not reduce to the classical
  result at lambda_p = 1); the paper prints no number from Eq. 5, so both are compared with the exact model
  as approximations at mu_f/mu_s = 20 and 100 (added). (4) The delaminated-buckling finite-element
  analysis (Eqs. 6-8) is recorded as not runnable with its printed example result (e = 0.28, D = 10.2 Hf).
  The printed maximum wrinkling strain "around 0.465" (mu_f/mu_s = 1, lambda_p = 1) is compared with the
  exact model (0.456, Biot's value); being approximate it gets no verdict, and a question records the
  likely digit transposition.
  Left out: the flat-state energy Eq. 3 and the dimensional form Eq. 4 (no printed number); the peel-test
  formula for the adhesion energy (Fig. 3 gives no forces); all finite-element results that are only plotted
  (Figs. 5, 6(a), 10, 11, 12, 14), the phase boundaries involving delamination, folding, period doubling and
  ridges (finite-element energies, not rerunnable), the experimental points of Fig. 7(a) (categorical modes
  on the diagram) and the stress-stretch curves of Fig. 13. No figure was digitized in the first reading.
  Experimental material parameters (moduli, thickness range) are recorded as data for later validation jobs.
  Figure pass (2026-11-18): calibrated code readings (figures.yaml, figures.md) of the wrinkling curves of
  Figs. 6(a) and 14(b) (lambda_p = 1, 1.5, 3), compared with the linear stability model by sweeps; the
  measured adhesion energies of Fig. 3 with error bars; the experimental modes on the lambda_p = 2 diagram
  (Fig. 7(a)); the measured tension curves of Fig. 13, compared with a neo-Hookean fit model at the printed
  moduli; and, as finite-element data without a model, the delamination boundaries of Figs. 6(b), 7(a), 7(b)
  and the curve of Fig. 10(c). Energy landscapes of single finite-element cases (Figs. 5(b-d), 10(b), 11,
  14(a)) and the advanced-mode boundaries of Fig. 12 are left out (figures.md says why).
