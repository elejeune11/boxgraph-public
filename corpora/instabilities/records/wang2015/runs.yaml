# Eq. 4 at the triple point's modulus ratio
- id: run_eq4_triple_point
  model: eq4_wrinkle_onset
  inputs: {mu_ratio: triple_point_ratio}
  outputs: {eC: eC_wrinkle_eq4_at_triple}
# Modulus ratios of the experiments from the printed moduli
- id: run_ratio_sylgard_min
  model: modulus_ratio
  inputs: {mu_f: mu_f_sylgard_min, mu_s: mu_s_ecoflex}
  outputs: {ratio: ratio_sylgard_min_computed}
- id: run_ratio_sylgard_max
  model: modulus_ratio
  inputs: {mu_f: mu_f_sylgard_max, mu_s: mu_s_ecoflex}
  outputs: {ratio: ratio_sylgard_max_computed}
- id: run_ratio_rubber
  model: modulus_ratio
  inputs: {mu_f: mu_f_rubber, mu_s: mu_s_ecoflex}
  outputs: {ratio: ratio_rubber_computed}
- id: run_ratio_ldpe
  model: modulus_ratio
  inputs: {mu_f: mu_f_ldpe, mu_s: mu_s_ecoflex}
  outputs: {ratio: ratio_ldpe_computed}
- id: run_ratio_kapton
  model: modulus_ratio
  inputs: {mu_f: mu_f_kapton, mu_s: mu_s_ecoflex}
  outputs: {ratio: ratio_kapton_computed}
# Normalized adhesion of the strongly bonded experiments at the printed lower bound Gamma = 10^3 J/m^2
- id: run_adhesion_sylgard
  model: normalized_adhesion
  inputs: {Gamma: Gamma_strong, mu_s: mu_s_ecoflex, Hf: Hf_sylgard}
  outputs: {G: Gamma_norm_sylgard_computed}
- id: run_adhesion_kapton
  model: normalized_adhesion
  inputs: {Gamma: Gamma_strong, mu_s: mu_s_ecoflex, Hf: Hf_kapton}
  outputs: {G: Gamma_norm_kapton_computed}
# Figure readings (figures.yaml): each model swept over the x positions of a reading
- id: run_eq4_fig3a
  model: eq4_wrinkle_onset
  inputs: {}
  sweep: {mu_ratio: eq4_curve_fig3a}
  outputs: {eC: eq4_at_fig3a_ratios}
- id: run_accordion_fig5a_line
  model: accordion_eqs9_12
