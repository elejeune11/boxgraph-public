- id: mismatch_strain
  name: mismatch strain between film and substrate
  dimension: dimensionless
  description: "eM = (Lf - Ls)/Lf, the nominal plane-strain mismatch strain between the detached, stress-free film (length Lf) and substrate (length Ls) at the current state; when the substrate is fully relaxed the overall compressive strain in the film e = (Lf - L)/Lf equals eM, so 1 - eM is the in-plane stretch of the film (eM = 0.456 corresponds to Biot's plane strain critical stretch 0.544)"
- id: crease_onset_mismatch_strain
  name: critical mismatch strain for the flat to crease transition
  dimension: dimensionless
  description: "eC_crease, the mismatch strain eM (nominal, plane strain, compressive) at which the flat state gives way to creases (Eq. 3); 1 - eC_crease is the critical in-plane stretch of the film, to be set against Biot's surface instability stretch 0.544 (strain 0.456)"
- id: wrinkle_onset_mismatch_strain
  name: critical mismatch strain for the flat to wrinkle transition
  dimension: dimensionless
  description: "eC_wrinkle, the mismatch strain eM (nominal, plane strain) at which the flat film-substrate structure transits to wrinkles (Eq. 4); also the strain at the flat-crease-wrinkle triple point"
- id: fold_onset_mismatch_strain
  name: mismatch strain at which wrinkles transit into folds
  dimension: dimensionless
  description: "the mismatch strain eM on the wrinkle-fold phase boundary, or at which folds are observed to form from wrinkles"
- id: period_double_onset_mismatch_strain
  name: mismatch strain at which wrinkles transit into period-doubles
  dimension: dimensionless
  description: "the mismatch strain eM on the wrinkle-period-double phase boundary, or at which period-doubles are observed to form"
- id: ridge_onset_mismatch_strain
  name: mismatch strain at which wrinkles transit into ridges
  dimension: dimensionless
  description: "the mismatch strain eM on the wrinkle-ridge phase boundary, or at which ridges are observed to form"
- id: crease_to_fold_mismatch_strain
  name: mismatch strain at which creases develop into folds
  dimension: dimensionless
  description: "the mismatch strain above which creases on a compliant film (0.5 < mu_f/mu_s < 1.3) develop into folds"
- id: shear_modulus_ratio
  name: film to substrate shear modulus ratio
  dimension: dimensionless
  description: "mu_f / mu_s, the ratio of the shear moduli of the incompressible neo-Hookean film and substrate"
- id: crease_wrinkle_boundary_modulus_ratio
  name: modulus ratio separating creasing from wrinkling of the flat state
  dimension: dimensionless
  description: "the value of mu_f/mu_s below which the flat state creases and above which it wrinkles (the triple point's modulus ratio)"
- id: delamination_boundary_modulus_ratio
  name: modulus ratio on the boundary of the delaminated-buckle region
  dimension: dimensionless
  description: "the value of mu_f/mu_s above which the film delaminates (delaminated-buckle) at a given mismatch strain eM and normalized adhesion energy Gamma/(mu_s H_f) (red curves of Fig. 4)"
- id: crease_fold_boundary_modulus_ratio
  name: modulus ratio on the crease to fold phase boundary beyond the triple point
  dimension: dimensionless
  description: "the value of mu_f/mu_s of the short horizontal phase boundary right of the triple point (eM > 0.35) between crease (below) and fold (above) in Fig. 3A"
- id: fold_period_double_boundary_modulus_ratio
  name: modulus ratio on the fold to period-double phase boundary
  dimension: dimensionless
  description: "the value of mu_f/mu_s of the approximately horizontal phase boundary between fold and period-double (Figs. 2 and 3A)"
- id: period_double_ridge_boundary_modulus_ratio
  name: modulus ratio on the period-double to ridge phase boundary
  dimension: dimensionless
  description: "the value of mu_f/mu_s of the approximately horizontal phase boundary between period-double and ridge (Figs. 2 and 3A)"
- id: normalized_adhesion_energy
  name: adhesion energy normalized by substrate shear modulus and film thickness
  dimension: dimensionless
  description: "Gamma/(mu_s H_f), the work to detach a unit area of film from the substrate in the stress-free state over mu_s H_f"
- id: adhesion_energy
  name: film-substrate adhesion energy
  dimension: "[mass]/[time]**2"
  description: "Gamma, the work required to detach the film from a unit area of the substrate in the stress-free state (J/m^2)"
- id: film_shear_modulus
  name: shear modulus of the film
  dimension: "[pressure]"
  description: "mu_f, the shear modulus of the neo-Hookean film"
- id: substrate_shear_modulus
  name: shear modulus of the substrate
  dimension: "[pressure]"
  description: "mu_s, the shear modulus of the neo-Hookean substrate (Ecoflex 0010 in the experiments)"
- id: film_thickness
  name: thickness of the film
  dimension: "[length]"
  description: "H_f, the thickness of the detached stress-free film"
- id: substrate_thickness
  name: thickness of the substrate
  dimension: "[length]"
  description: "H_s, the thickness of the substrate"
- id: crease_wavelength_over_film_thickness
  name: crease pattern wavelength over film thickness
  dimension: dimensionless
  description: "lambda_crease / H_f, the spacing of periodic creases normalized by the film thickness (Eq. 7)"
- id: initial_wrinkle_wavelength_over_film_thickness
  name: wrinkle wavelength at initiation over film thickness
  dimension: dimensionless
  description: "lambda^C_wrinkle / H_f, the wavelength of wrinkles just transited from the flat state, normalized by the film thickness (Eq. 8)"
- id: accordion_strain_ratio
  name: ratio of current to critical film stretch
  dimension: dimensionless
  description: "(1 - eM)/(1 - eC_wrinkle), the abscissa of Fig. 5: the in-plane stretch at the current mismatch strain over the stretch at wrinkle initiation"
- id: wrinkle_wavelength_over_initial
  name: wrinkle wavelength over wrinkle wavelength at initiation
  dimension: dimensionless
  description: "lambda_wrinkle / lambda^C_wrinkle (Eq. 9)"
- id: fold_wavelength_over_initial
  name: fold wavelength over wrinkle wavelength at initiation
  dimension: dimensionless
  description: "lambda_fold / lambda^C_wrinkle (Eq. 10)"
- id: period_double_wavelength_over_initial
  name: period-double wavelength over wrinkle wavelength at initiation
  dimension: dimensionless
  description: "lambda_period-double / lambda^C_wrinkle (Eq. 11)"
- id: period_double_half_wavelength_over_initial
  name: half the period-double wavelength over wrinkle wavelength at initiation
  dimension: dimensionless
  description: "lambda_period-double / (2 lambda^C_wrinkle), as plotted for period-doubles in Fig. 5A"
- id: ridge_wavelength_over_initial
  name: ridge wavelength over wrinkle wavelength at initiation
  dimension: dimensionless
  description: "lambda_ridge / lambda^C_wrinkle (Eq. 12)"
- id: wrinkle_amplitude_over_initial_wavelength
  name: wrinkle amplitude over wrinkle wavelength at initiation
  dimension: dimensionless
  description: "A_wrinkle / lambda^C_wrinkle, the amplitude of the sinusoidal wrinkle normalized by the initial wavelength (Eq. 13, Fig. 5B)"
