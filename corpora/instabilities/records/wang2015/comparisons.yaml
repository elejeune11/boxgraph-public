# Eq. 4 against the printed triple point (both are the paper's own statements of the flat-wrinkle boundary)
- id: cmp_eq4_triple_point
  purpose: reproduction
  computed: eC_wrinkle_eq4_at_triple
  printed: triple_point_eM
  note: "Eq. 4's lower branch at mu_f/mu_s = 1.3 against the printed triple point eM = 0.35"
# Printed modulus ratios against the printed moduli
- id: cmp_ratio_sylgard_min
  purpose: consistency
  computed: ratio_sylgard_min_computed
  printed: ratio_sylgard_min
  note: "the softest Sylgard film (3.1 kPa) is taken to be the mu_f/mu_s = 0.3 film; the paper pairs them only through the stated ranges (~3 kPa, ~0.3)"
- id: cmp_ratio_sylgard_max
  purpose: consistency
  computed: ratio_sylgard_max_computed
  printed: ratio_sylgard_max
  note: "the stiffest Sylgard film (1.4 MPa) is taken to be the largest Sylgard ratio, 130.74; the next ratio, 1.59 x 10^3, belongs to natural rubber"
- id: cmp_ratio_rubber
  purpose: consistency
  computed: ratio_rubber_computed
  printed: ratio_rubber
  note: "natural rubber (~16 MPa) is taken to be the 1.59 x 10^3 film, the three ridge-forming films being rubber, LDPE and Kapton in order of modulus"
- id: cmp_ratio_ldpe
  purpose: consistency
  computed: ratio_ldpe_computed
  printed: ratio_ldpe
  note: "LDPE (~96 MPa) is taken to be the 9.11 x 10^3 film (Fig. 3E's 9110)"
- id: cmp_ratio_kapton
  purpose: consistency
  computed: ratio_kapton_computed
  printed: ratio_kapton
  note: "Kapton (0.83 GPa) is taken to be the 7.94 x 10^4 film"
# Strong adhesion: Gamma > 10^3 J/m^2 against Gamma/(mu_s H_f) > 10^3 (a bound: no verdict)
- id: cmp_adhesion_sylgard
  purpose: consistency
  computed: Gamma_norm_sylgard_computed
  printed: Gamma_norm_strong
  note: "with the ~200 um Sylgard films; the printed value is a bound, so there is no verdict (see q_adhesion_bound)"
- id: cmp_adhesion_kapton
  purpose: consistency
  computed: Gamma_norm_kapton_computed
  printed: Gamma_norm_strong
  note: "with the 25 um Kapton film; the printed value is a bound, so there is no verdict"
# The computed phase boundaries against the observed onsets (strong adhesion, Fig. 3).
# The paper prints the observed onsets approximately (~, ≈): no verdict, links only.
- id: val_crease_onset
  purpose: validation
  computed: eC_crease_eq3
  printed: crease_onset_measured
  note: "Eq. 3 (computed, Maxwell criterion) against the observed first creases for mu_f/mu_s = 0.3 and 0.64"
- id: val_fold_onset
  purpose: validation
  computed: wrinkle_fold_boundary_eM
  printed: fold_onset_measured
  note: "computed wrinkle-fold boundary region 0.3 < eM < 0.35 (1.3 < mu_f/mu_s < 12) against the observed folds for mu_f/mu_s = 1.86, 3.64 and 9.79; the computed side is the range's midpoint"
- id: val_pd_onset
  purpose: validation
  computed: wrinkle_pd_boundary_eM
  printed: pd_onset_measured
  note: "computed wrinkle-period-double region 0.3 < eM < 0.32 (12 < mu_f/mu_s <= 800) against the observed period-doubles for mu_f/mu_s = 14.77, 67.24 and 130.74"
- id: val_ridge_onset
  purpose: validation
  computed: wrinkle_ridge_boundary_eM
  printed: ridge_onset_measured
  note: "computed wrinkle-ridge boundary eM ≈ 0.33 (800 < mu_f/mu_s < 10^6) against the observed ridges for mu_f/mu_s = 1.59 x 10^3 to 7.94 x 10^4"
# Figure readings (figures.yaml)
- id: cmp_eq4_fig3a
  purpose: reproduction
  computed: eq4_at_fig3a_ratios
  printed: eq4_curve_fig3a
  note: "Eq. 4 as printed against the plotted 'Theory' curve of Fig. 3A, mu_f/mu_s = 1.5 to 100 (above ~200 the curve runs into the axis ticks)"
