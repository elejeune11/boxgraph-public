id: accordion_eqs9_12
name: modified accordion model for the wavelengths of wrinkles, folds, period-doubles and ridges (Eqs. 9-12), in the variables of Fig. 5A
role: model
stated: {page: 5, printed_page: "5", quote: "We adopt a modified accordion model to", where: Eqs. 9-12}
equation: "lambda_wrinkle/lambda^C_wrinkle ≈ (1 - eM)/(1 - eC_wrinkle) (9); lambda_fold/lambda^C_wrinkle ≈ (1 - eM)/(1 - eC_wrinkle) (10); lambda_period-double/lambda^C_wrinkle ≈ 2(1 - eM)/(1 - eC_wrinkle) (11); lambda_ridge/lambda^C_wrinkle ≈ (1 - eM)/(1 - eC_wrinkle) (12)"
inputs:
  s: {quantity: accordion_strain_ratio, unit: dimensionless, description: "(1 - eM)/(1 - eC_wrinkle), the abscissa of Fig. 5A; eC_wrinkle from Eq. 4"}
outputs:
  lam_wrinkle: {quantity: wrinkle_wavelength_over_initial, unit: dimensionless}
  lam_fold: {quantity: fold_wavelength_over_initial, unit: dimensionless}
  lam_pd: {quantity: period_double_wavelength_over_initial, unit: dimensionless}
  half_lam_pd: {quantity: period_double_half_wavelength_over_initial, unit: dimensionless}
  lam_ridge: {quantity: ridge_wavelength_over_initial, unit: dimensionless}
settings: {}
stochastic: false
