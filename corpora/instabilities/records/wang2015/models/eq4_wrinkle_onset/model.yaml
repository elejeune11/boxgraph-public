id: eq4_wrinkle_onset
name: critical mismatch strain for wrinkling, curve approximating the computed flat-wrinkle boundary (Eq. 4)
role: model
stated: {page: 4, printed_page: "4", quote: "can be approximated as a curve on", where: Eq. 4}
equation: "eC_wrinkle ≈ 0.41 (mu_f/mu_s)^-0.59 for 1.3 <= mu_f/mu_s <= 16; 0.50 (mu_f/mu_s)^-0.66 for mu_f/mu_s > 16"
inputs:
  mu_ratio: {quantity: shear_modulus_ratio, unit: dimensionless, description: "mu_f / mu_s"}
outputs:
  eC: {quantity: wrinkle_onset_mismatch_strain, unit: dimensionless}
settings: {}
stochastic: false
