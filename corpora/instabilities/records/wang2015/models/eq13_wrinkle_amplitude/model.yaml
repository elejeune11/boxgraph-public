id: eq13_wrinkle_amplitude
name: wrinkle amplitude from conservation of arc length over one wavelength (Eq. 13), in the variables of Fig. 5B
role: model
stated: {page: 5, printed_page: "5", quote: "length of wrinkles at various mismatch strains to be equal", where: Eq. 13}
equation: "integral_0^lambda_wrinkle sqrt(1 + [(A_wrinkle sin(2 pi x / lambda_wrinkle))']^2) dx ≈ lambda^C_wrinkle, with lambda_wrinkle/lambda^C_wrinkle from Eq. 9"
built_from: [accordion_eqs9_12]
inputs:
  s: {quantity: accordion_strain_ratio, unit: dimensionless, description: "(1 - eM)/(1 - eC_wrinkle), the abscissa of Fig. 5B; by Eq. 9 it equals lambda_wrinkle/lambda^C_wrinkle"}
outputs:
  A: {quantity: wrinkle_amplitude_over_initial_wavelength, unit: dimensionless}
settings: {}
stochastic: false
