notes: >
  Theory, finite element computation and experiment; the Supplementary Information is not
  included. Strain convention: eM = (Lf - Ls)/Lf is a nominal plane strain mismatch strain, and
  with the substrate relaxed it is the film's compressive strain, so 1 - eM is the film's
  in-plane stretch. The crease threshold eC_crease = 0.35 (Eq. 3, for mu_f/mu_s < 1.3) is the
  energy (Maxwell) threshold of Refs. 12 and 43 (hong2009), i.e. a critical stretch of 0.65,
  distinct from Biot's linear surface instability at stretch 0.544 (eM = 0.456); the observed
  crease onset is printed as ~0.36 (mu_f/mu_s = 0.3, 0.64). Recorded as such, not folded into
  Biot's value.
  In scope: Eq. 4 (the two-branch power law for the flat-wrinkle boundary, runnable; its lower
  branch reproduces the printed triple point eM = 0.35 at mu_f/mu_s = 1.3, and its upper branch
  0.50 (mu_f/mu_s)^-0.66 is the paper's fit to the stiff film limit, to be related by the
  relation jobs to the classical (1/4)(3 mu_s/mu_f)^(2/3) of huang2005/cao2012); Eq. 7 (crease
  wavelength, from Ref. 48), Eq. 8 (initial wrinkle wavelength, from Ref. 50), the accordion
  wavelengths Eqs. 9-12 and the arc-length amplitude Eq. 13, all runnable, written in the
  variables of Fig. 5; the finite element phase diagram (Eqs. 1, 2, 5, 6), entered as a
  non-runnable model whose printed boundaries (Eq. 3, the triple point, the fold/period-double
  and period-double/ridge lines at mu_f/mu_s ≈ 12 and ≈ 800, the onset regions of p. 5) are
  predicted data, validated against the observed onsets of Fig. 3 (printed with ~ or ≈, so no
  verdict); the experiments' modulus ratios recomputed from the printed moduli (consistency);
  the normalized adhesion of the strongly bonded experiments (a bound, no verdict, question
  q_adhesion_bound); Table 1 in full (42 entries, all entered as estimated, question
  q_table1_origin). No added inputs were needed.
  Left out: the peel-test formula Gamma = (1 - cos theta + e_d/2) F/b (no printed numbers), the
  section values Gamma/(mu_s H_f) = 0.13-66.63 of Fig. 4 (they only label the panels), the
  experimental ratios that enter no comparison (0.64, 1.84/1.86, 3.64, 9.79, 14.77, 67.24), the
  substrate thickness (~5 mm), strain rates, peel rates and baking times, and the ranges stated
  in the Discussion (summaries of Table 1). The plotted results (Fig. 3A theory curve, Fig. 5A
  and 5B theory curves and measured points) are left for a figure pass because the figure
  rendering commands were not available to this job; figures.md says what each would test, and
  Eqs. 7-13 are therefore not yet compared. Page images were checked for Eqs. 3, 4, 7-13,
  Table 1 and the Methods units (the OCR reads um as mm).
  Figure pass (2026-11-18): Figs. 3A, 4A-F and 5A-B are now read with calibrated code readings
  (figures.yaml, figures.md). The plotted theory curves reproduce Eq. 4 (within 3%), Eqs. 9-12 and
  Eq. 13 (within 0.4%). The measured wavelengths and amplitudes of Fig. 5 are validations of
  Eqs. 9-13: wrinkles agree, folds lie above and ridges below Eqs. 10 and 12, and the amplitudes lie
  below Eq. 13, most at the lowest modulus ratio (q_fig5a_series_offsets, q_fig5b_claim_read). The
  finite element boundaries of Figs. 3A and 4 are recorded as predicted data for the relation jobs.
