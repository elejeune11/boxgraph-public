  text: >-
    No validation is entered between this record and wang2014 (ref. 39), in either direction
    (cross-validation job 2026-11-18). This paper cites ref. 39 for the Maxwell criterion, the potential
    energy (Eq. 1), the bonding method and the claim that the adhesive layer does not change the
    patterns; it compares none of its models with a value measured in ref. 39. (1) This record's models
    against wang2014's measurements: wang2014 measures moduli (mu_s = 10.4 kPa, the Sylgard moduli), film
    thicknesses, adhesion energies (Fig. 3), uniaxial tension curves (Fig. 13) and the categorical
    initial modes of its experiments on the lambda_p = 2 diagram (Fig. 7(a)). None of Eqs. 4 and 7-13
    gives a modulus, an adhesion energy or a stress; the modes of Fig. 7(a) are labels placed at set
    conditions, not values, and they were obtained with a prestretched substrate held at lambda_p = 2,
    which this record's mismatch-strain models do not contain. modulus_ratio and normalized_adhesion
    only process inputs. (2) wang2014's models against this record's measurements: wang2014's runnable
    models give the wrinkling onset strain (linear stability, Eq. 5), the wrinkling/creasing boundary
    ratio and a neo-Hookean tension curve. This paper measures the crease onset (~0.36), the fold
    (~0.33), period-double (≈ 0.32) and ridge (≈ 0.33) onsets, and the wavelengths and amplitudes of
    Fig. 5 normalized by the initial wavelength; it prints no measured wrinkling onset strain, no
    measured boundary ratio and no tension curve. wang2014's crease strain 0.35 is a constant taken from
    hong2009 (a datum, not a model), and its advanced-mode and delamination results are finite element
    energies that cannot be run. So no model of either record, run on the other's conditions, gives a
    quantity the other measured. The comparison of the two papers' predicted thresholds and boundaries
    (crease 0.35, wrinkling curves, boundary ratios 1.3 against 1.54) is a relation between models, not
    a validation. The other direction is wang2014/q_no_validation_wang2015.
  citation: {page: 6, quote: "the adhesive layer does not affect the instability patterns", where: text}
