- id: q_no_validation_trujillo2008
  kind: choice
  about: [biot_strain_eq28, biot_stretch_eq28, bifurcation_strain_eq28, bifurcation_wavenumber_eq28, m_point_eq211, m_point_eq211_corrected, gent_cho_crease_strain, trujillo2008/ec_mean_modulus_series, trujillo2008/ec_mean_thickness_series, trujillo2008/fig3a_ec_points, trujillo2008/fig3b_ec_points, trujillo2008/hh0_onset_measured]
  text: >-
    (Cross-validation against trujillo2008, job 2026-11-18; pair chosen from the corpus list, relate_with.)
    No validation is entered in either direction. This paper does not cite trujillo2008, and trujillo2008
    (2008) predates it. trujillo2008 measures the critical effective strain for creasing of surface-attached
    gels that swell, e_c = 1 - l0/l, about 0.33 (Fig. 3, means 0.33 +/- 0.02 and 0.33 +/- 0.01), and the
    thickness ratio h/h0 = 2.0 +/- 0.1 at onset (Fig. 4). The loading there is equibiaxial and the gels are
    homogeneous through their thickness. The runnable models here are all plane strain. Eq. 2.8 and its
    inversion give the linear bifurcation strain of a solid whose modulus decays exponentially with depth,
    at a wavenumber kbar = k/a that has no value for a homogeneous gel. The Biot strain eps_B = 0.456 is a
    plane-strain bifurcation, and this paper says the surface "creases at a strain lower than" it (p. 2), so
    it is not its prediction of a crease onset. The M-point (Eqs. 2.10-2.12) belongs to the graded solid.
    The homogeneous crease bound 0.35 comes from finite-element unloading that cannot be rerun
    (q_fem_not_runnable). Running any of these at trujillo2008's onset would test them outside the loading
    they state, and none gives h/h0. In the other direction, this record holds no measurement. Its one
    experimental value, Gent & Cho's 0.28-0.42 (gent_cho_crease_strain, cited from ref. 1), is a nominal
    surface strain of rubber compressed by bending. trujillo2008's models give Biot's equibiaxial threshold
    (lambda1^2 lambda3 = 0.296), not a strain under bending; its other models process its own figures.
    Setting the measured e_c 0.33 beside eps_B = 0.456 or the plane-strain crease threshold 0.35 is a
    relation between thresholds of different loadings, for the relation jobs. See
    trujillo2008/q_no_validation_diab2013.
  citation: {page: 2, printed_page: "2", quote: "unstably creases at a strain lower than the Biot critical strain", where: text}
