  text: >-
    (Cross-validation against wang2014, which cites this paper as its ref. 32; job 2026-11-18; pair chosen
    from the citation and the corpus list.) No validation is entered, in either direction. wang2014 cites
    this paper only in a group of works on instability modes (its p. 1, refs. 14, 24, 26, 28-33), and it
    compares none of its measurements with this paper's analysis. Its measurements are the shear moduli of
    Ecoflex and Sylgard and a film thickness range (inputs), peel-test adhesion energies (Fig. 3), uniaxial
    tension curves (Fig. 13) and the observed initial modes of the Fig. 7(a) experiments, whose datum is
    each experiment's modulus ratio. This record's runnable models (Eq. 2.8 and its inversion, the Biot
    strain eps_B, the M-point of Eqs. 2.10-2.12) give bifurcation strains and the normalized wavenumber
    kbar = k/a of a neo-Hookean half-space whose modulus decays exponentially with depth. None of these
    quantities was measured in wang2014: it prints no onset strain or wavelength for its experiments. A film
    bonded to a substrate of another modulus is a step in modulus, not the grading Q = Q0 exp(a X2), so
    kbar has no value there. Placing eps_B = 0.456 or eps_M = 0.272 beside wang2014's wrinkling analysis
    (0.456 at mu_f/mu_s = 1) or its crease strain 0.35 is model against model, for the relation jobs. In
    the other direction, this record holds no measurement. Its one experimental value, Gent & Cho's
    0.28-0.42 under bending, is a crease onset, which no wang2014 model outputs: wang2014's crease strain
    0.35 is a datum from hong2009, and its wrinkling model gives Biot's wrinkling threshold, which this
    paper says the surface creases below. See wang2014/q_no_validation_diab2013.
  citation: {page: 2, printed_page: "2", quote: "unstably creases at a strain lower than the Biot critical strain", where: text}
