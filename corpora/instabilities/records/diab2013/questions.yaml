  text: >-
    (Cross-validation against tallinen2015, which cites this paper as its ref. 37; job 2026-11-18.) No
    validation is entered in either direction. tallinen2015 is a theory and finite-element paper with no
    measurement: every datum there is predicted, derived or a reported input (its sulcification stretch
    0.647 from its ref. 32, the brain's modulus ratio of about 1 from its ref. 2), so this record's models
