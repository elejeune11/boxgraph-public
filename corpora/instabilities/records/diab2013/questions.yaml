- id: q_crease_threshold_definitions
  kind: reading
  about: [crease_lower_bound_homogeneous, hong_crease_strain, hohlfeld_crease_vanishing, gent_cho_crease_strain, eps_M_printed, eps_T_printed]
  text: >
    The paper has several crease thresholds that should not be merged: eps_B = 0.456 (linear bifurcation of the
    homogeneous half-space), eps_M = 0.272 (lowest strain of an instantaneous crease in the graded solid), eps_T = 0.174
    (lowest strain of a setback crease in the graded solid), and 0.35 (the homogeneous-limit lower bound on unloading,
    which the paper equates with Hong et al.'s and Hohlfeld's thresholds). All are nominal plane-strain compressive
    strains eps = 1 - lambda. Gent & Cho's 0.28-0.42 is a nominal surface strain in bending, a different loading.
- id: q_hohlfeld_source
  kind: reading
  about: [hohlfeld_crease_vanishing, cmp_lower_bound_hohlfeld, crease_lower_bound_homogeneous]
  text: >
    (Audit.) On p. 11 the paper calls its homogeneous-limit lower bound 0.35 consistent with "Hohlfeld & Mahadevan
    [18]" (Unfolding the sulcus, 2011), but the 0.35 it compares against is printed only on p. 2, attributed to
    Hohlfeld [8] (PhD thesis, 2008). The datum hohlfeld_crease_vanishing keeps from_source ref-8 as printed on p. 2;
    whether ref-18 states the same 0.35 is not shown in this paper.
  citation: {page: 11, printed_page: "11", quote: "which is consistent with the findings of Hong et al", where: text}
