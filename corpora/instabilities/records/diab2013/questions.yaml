  about: [biot_strain_eq28, biot_stretch_eq28, bifurcation_strain_eq28, bifurcation_wavenumber_eq28, m_point_eq211, m_point_eq211_corrected, hong2009/eps_exp_printed, hong2009/eta_exp_printed, gent_cho_crease_strain]
  text: >-
    (Cross-validation against hong2009, ref. 9; job 2026-11-18.) No validation from this record's models to
    hong2009's measurements is entered. hong2009 measures nothing itself; it records two experimental values
    from the literature: the crease strain epsilon_exp = 0.35 of bent elastomer blocks (Gent & Cho, Ghatak &
    Das) and the swelling-ratio range eta_exp = 2.0-3.7 of gels swelling on a substrate. This record's
    runnable models give the linear bifurcation curve of Eq. 2.8, the Biot strain eps_B = 0.456 at which
    it diverges, and the M-point eps_M = 0.272 of the energy variation for the exponentially graded solid.
    None gives the crease onset of a homogeneous solid: this paper says the Biot strain "can be hardly
    reached experimentally because the flat surface unstably creases at a strain lower than" it (p. 2), so
    eps_B is not its prediction of the measured crease strain; the M-point belongs to the graded solid and
    a wrinkle wavenumber kbar, neither defined for a bent rubber block; and the homogeneous-limit crease
    strain 0.35 (crease_lower_bound_homogeneous) comes from finite-element unloading that is not runnable
    here (q_fem_not_runnable). Nothing here gives a swelling ratio. The other direction is entered:
    hong2009/val_eps_c_diab2013_gent_cho sets hong2009's energy criterion against Gent & Cho's range as
    this paper reports it (gent_cho_crease_strain). How eps_B = 0.456 relates to hong2009's
    epsilon_biot = 0.46 and the 0.35 thresholds of the two papers is model against model, for the relation jobs.
