- id: q_eq212b_factor
  kind: possible_error
  about: [m_point_eq211, m_point_eq211_corrected, eps_M_printed]
  text: >
    Eq. 2.12b prints the pressure term of the second variation as -p(2)(u1,1(2)/lambda + lambda u2,2(2)) with factor 1.
    Differentiating the functional (2.1c) twice in the direction (u(2), p(2)) gives that mixed term twice, as the
    factor -2 in Eq. 2.12a does for the third variation. Taken as printed, the energy variation along the bifurcation
    curve does not change sign and gives no M-point; with the factor 2 it changes sign at the printed eps_M. The
    printed model and a variant with the factor 2 are both recorded.
  citation: {page: 7, printed_page: "7", quote: "The terms on the right-hand side of equation (2.11) are determined for a neo-Hookean EDM solid as", where: Eq. 2.12b}
- id: q_second_order_coefficients
  kind: choice
  about: [m_point_eq211, m_point_eq211_corrected]
  text: >
    The second-order coefficients B1, B2, F1, F2, F3 and the second-order pressure were obtained by solving the paper's
    stated governing equations (equilibrium to second order with the stress of Eq. 2.3, traction-free surface Eq. A 10)
    numerically by collocation in the paper's solution forms (Eqs. A 6, A 8, A 9a, 2.9c with the exponents of B 1),
    not from the closed forms A 9b-d and B 2-B 4, which were not transcribed or checked. The first-order fields
    (Eqs. 2.5, 2.6, A 11) are used as printed. Q0 = a = 1 is used; the sign of the energy variation does not depend on them.
- id: q_fig2b_normalization
  kind: reading
  about: [m_point_eq211, eps_M_printed]
  text: >
    The ordinate of figure 2b is delta phi^b / zeta^4 times 4 x 10^-3 with no statement of the units or of how zeta and
    the energy per period are normalized (Q0, a, k). The plotted curve grows without bound as eps -> 0 and returns to
    zero at eps_B, which is not the shape of delta phi^b / zeta^4 per period with zeta the surface amplitude at
    Q0 = a = 1; so only its zero (eps_M) is compared, and the curve is not read.
  citation: {page: 6, printed_page: "6", quote: "Energy variation δϕ b normalized by ζ 4 up to the second-order perturbation mode", where: "Fig. 2b"}
- id: q_A11b_k
  kind: possible_error
  about: [m_point_eq211]
  text: >
    Eq. A 11b prints C1 = -(1/k)(lambda^4 alpha2^2 + kbar^2)/(lambda^4(alpha2^2 - alpha1^2)) with k, not kbar; the unit
    surface amplitude of u2(1) in Eq. 2.5b, -kbar(C1 + C2) = 1, needs 1/kbar. With a = 1 the two coincide, and the sign
    of the energy variation does not depend on the amplitude.
  citation: {page: 16, printed_page: "16", quote: "The second-order expansion of the first Piola–Kirchhoff stress is then given as", where: Eq. A 11b}
