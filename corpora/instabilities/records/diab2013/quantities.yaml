- id: bifurcation_strain
  name: applied nominal compressive strain at a linear bifurcation of the flat surface
  dimension: dimensionless
  description: >
    eps = 1 - lambda, the plane-strain nominal (engineering) compressive strain of the fundamental state at which the
    flat surface of the neo-Hookean solid with exponentially decaying modulus bifurcates into a sinusoidal mode of
    normalized wavenumber kbar (the curve of Eq. 2.8, figure 2a). Its limit for kbar -> infinity (homogeneous
    half-space) is the Biot critical strain eps_B; at the M-point it is eps_M.
- id: biot_critical_stretch
  name: principal stretch along the compression at the Biot critical point
  dimension: dimensionless
  description: >
    lambda_B = 1 - eps_B, the plane-strain stretch of a homogeneous neo-Hookean half-space at its linear surface
    bifurcation; the form in which biot1963 prints the critical point (used only to relate the two records).
- id: normalized_wavenumber
  name: wavenumber relative to the reciprocal decay length of the modulus
  dimension: dimensionless
  description: >
    kbar = k/a, the wavenumber k of the perturbation in the undeformed configuration divided by a, the reciprocal of
    the decay length of the shear modulus Q = Q0 exp(a X2). In isoperiodic compression it is the longest-admissible
    (domain) wavelength 2 pi/k relative to the decay length; kbar -> infinity is the homogeneous half-space, kbar -> 0
    the thin-film limit.
- id: setback_crease_min_strain
  name: minimum applied strain for a setback crease
  dimension: dimensionless
  description: >
    The smallest applied nominal plane-strain compressive strain at which a crease can form in the valley of a
    progressively grown wrinkle (the T-point of the setback-crease curve C2c, from the paper's finite-element analysis).
- id: fold_onset_strain
  name: applied strain at the wrinkle-fold-crease triple point
  dimension: dimensionless
  description: >
    The applied nominal compressive strain at the R-point of the ruga phase diagram, beyond which an isoperiodically
    compressed wrinkle folds before it creases (finite-element analysis).
- id: crease_lower_bound_strain
  name: lower-bound (unloading) crease strain of a homogeneous neo-Hookean half-space
  dimension: dimensionless
  description: >
    The applied nominal plane-strain compressive strain down to which an existing crease survives on unloading, below
    which the surface returns flat; the paper identifies its homogeneous limit with the crease thresholds of Hohlfeld
    and of Hong et al. It is a crease threshold, distinct from the Biot (linear bifurcation) strain.
- id: crease_onset_strain_measured
  name: nominal strain at which creases appear in experiments
  dimension: dimensionless
  description: >
    The nominal surface compressive strain at which creases were observed to form on rubber strips compressed by
    bending (Gent & Cho, as cited).
- id: crease_tip_local_strain
  name: local compressive strain at the crease tip when creasing sets off
  dimension: dimensionless
  description: >
    The local nominal compressive strain at the nucleation point (wrinkle valley or fold root) at which creasing is
    accomplished, in the paper's finite-element analysis.
- id: energy_variation_fig2b
  name: second-order energy variation along the bifurcation curve, in the units of figure 2b
  dimension: dimensionless
  description: >
    delta phi^b / zeta^4 as plotted on the ordinate of figure 2b (labelled "x 10^-3"), along the linear bifurcation
    curve; its normalization (Q0, a, k, energy per period) is not stated (question q_fig2b_normalization), so the
    values are the axis's own numbers. Its zero is the M-point.
- id: setback_crease_strain
  name: applied strain at which a setback crease forms in a wrinkle valley
  dimension: dimensionless
  description: >
    The applied nominal plane-strain compressive strain eps = 1 - lambda at which, in the paper's finite-element
    isoperiodic compression of the graded neo-Hookean solid, a crease forms in the valley of a progressively grown
    wrinkle (curve C2c of figure 5; its minimum over kbar is the T-point).
- id: fold_crease_strain
  name: applied strain at which a crease forms at the root of a fold
  dimension: dimensionless
  description: >
    The applied nominal compressive strain at which a crease forms at the root of a fold channel (curve C4c of the
    inset of figure 5, finite-element analysis).
- id: fold_strain
  name: applied strain at which an isoperiodically compressed wrinkle folds
  dimension: dimensionless
  description: >
    The applied nominal compressive strain at which a wrinkle folds into a channel (curve C24 of the inset of figure 5,
    finite-element analysis); its end at the R-point is fold_onset_strain.
- id: applied_strain
  name: applied nominal compressive strain of an isoperiodic finite-element compression
  dimension: dimensionless
  description: >
    The applied nominal plane-strain compressive strain eps = 1 - lambda along a finite-element isoperiodic compression
    at fixed kbar (abscissa of figures 4 and 6), at which the surface state is recorded; not itself a threshold.
- id: fourier_coefficient_A1
  name: first Fourier coefficient of the surface profile
  dimension: dimensionless
  description: >
    A1, the coefficient of the fundamental (domain-wavelength) harmonic of the Fourier series of the surface profile in
    the finite-element simulation (figure 4), as plotted; the paper does not state its normalization.
- id: fourier_coefficient_A2
  name: second-harmonic Fourier coefficient of the surface profile
  dimension: dimensionless
  description: >
    A2, the coefficient of the second harmonic of the Fourier series of the surface profile (figure 4), as plotted.
- id: growth_rate_A1
  name: growth rate of the first Fourier coefficient with applied strain
  dimension: dimensionless
  description: >
    dA1/deps, the derivative of the first Fourier coefficient with respect to the applied strain in the finite-element
    simulation (figure 4d); it jumps at the wrinkle bifurcation and diverges at creasing.
- id: local_strain_nucleation
  name: local compressive strain at the nucleation point of creasing during compression
  dimension: dimensionless
  description: >
    eps_l, the local nominal compressive strain near the point where a crease nucleates (wrinkle valley or fold root)
    as the applied strain grows, in the finite-element simulation (figure 6); equal to the applied strain while the
    surface is flat, and reaching about eps_B when creasing sets off.
