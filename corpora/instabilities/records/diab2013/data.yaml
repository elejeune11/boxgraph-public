- id: eps_B_printed
  quantity: bifurcation_strain
  unit: dimensionless
  origin: predicted
  printed: "0.456"
  citation: {page: 5, printed_page: "5", quote: "strains between εM (=0.272) and the Biot critical strain, εB (=0.456)", where: text}
  note: >
    The Biot critical strain of plane-strain compression of a homogeneous neo-Hookean half-space, at which kbar of
    Eq. 2.8 diverges. Also printed on pp. 1, 2, 6, 11, 13. Nominal strain eps = 1 - lambda; it corresponds to Biot's
    critical stretch lambda (biot1963, Eq. 4.3).
- id: eps_M_printed
  quantity: bifurcation_strain
  unit: dimensionless
  origin: predicted
  printed: "0.272"
  citation: {page: 8, printed_page: "8", quote: "Consequently, the M-point (εM = 0.272; k̄M = 1.30) breaks up Biot’s bifurcation curve", where: text}
  note: >
    The M-point: the bifurcation strain at which the second-order energy variation (Eq. 2.11, figure 2b) changes sign,
    separating progressive wrinkling (eps < eps_M) from instantaneous creasing (eps_M < eps < eps_B). Also printed on
    pp. 1, 5, 6, 7, 11, 13. It is the smallest applied strain for an instantaneous crease.
