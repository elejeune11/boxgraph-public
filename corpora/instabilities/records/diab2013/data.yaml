- id: crease_lower_bound_homogeneous
  quantity: crease_lower_bound_strain
  unit: dimensionless
  origin: predicted
  printed: "0.35"
  citation: {page: 11, printed_page: "11", quote: "we conclude that the lower bound of the crease strain converges to 0.35", where: text}
  note: >
    The homogeneous-solid limit (a -> 0, kbar -> infinity) of the lower bound of the crease strain, reached by
    unloading creases in the paper's finite-element analysis (chain curve of figure 2a, asymptote eps_H). The paper
    calls it consistent with Hong et al. [9] and Hohlfeld & Mahadevan [18].
- id: hohlfeld_crease_vanishing
  quantity: crease_lower_bound_strain
  unit: dimensionless
  origin: reported
  printed: "0.35"
  citation: {page: 2, printed_page: "2", quote: "depth until it disappears at a compressive strain of 0.35", where: text}
  from_source: ref-8
  note: "Hohlfeld's finite-element result, as cited: post-bifurcation unloading shrinks the crease until it disappears at this strain."
- id: hong_crease_strain
  quantity: crease_lower_bound_strain
  unit: dimensionless
  origin: reported
  printed: "0.35"
  citation: {page: 2, printed_page: "2", quote: "subcritical creasing branch of pitchfork bifurcation beyond the compressive strain of 0.35", where: text}
  from_source: ref-9
  note: >
    As cited: Hong et al. followed progressive crease growth, by pre-pinching the surface in their FEA, beyond this
    compressive strain. hong2009 states it as the energy threshold for creasing of a homogeneous neo-Hookean solid.
- id: gent_cho_crease_strain
  quantity: crease_onset_strain_measured
  unit: dimensionless
  origin: reported
  printed: "0.28 to 0.42"
  citation: {page: 2, printed_page: "2", quote: "compressed by bending creased at a nominal strain in the range 0.28–0.42", where: text}
  from_source: ref-1
  note: "Gent & Cho's experiments as cited: rubber strips compressed by bending, nominal surface strain at creasing."
- id: crease_tip_strain_fem
  quantity: crease_tip_local_strain
  unit: dimensionless
  origin: predicted
  printed: "0.456"
  citation: {page: 13, printed_page: "13", quote: "crease-tip compressive strain reaches the Biot strain, ε = 0.456", where: text}
  note: >
    Finite-element finding: whatever the type of crease, creasing is accomplished when the local crease-tip strain
    reaches the Biot strain (figure 6). The value printed is eps_B itself.
