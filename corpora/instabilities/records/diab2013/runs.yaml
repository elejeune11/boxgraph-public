  outputs: {eps_M: eps_M_eq211}
  note: "The scan settings and collocation sizes are the reader's choices; the paper states no numerical procedure for Eq. 2.12."
- id: run_m_point_corrected
  model: m_point_eq211_corrected
  inputs: {}
