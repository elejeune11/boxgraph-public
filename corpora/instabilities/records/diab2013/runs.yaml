- id: run_biot_strain
  model: biot_strain_eq28
  inputs: {}
  outputs: {eps_B: eps_B_eq28}
- id: run_kbar_at_eps_M
  model: bifurcation_wavenumber_eq28
  inputs: {eps: eps_M_printed}
  outputs: {kbar: kbar_M_eq28}
- id: run_eps_w_eq28
  model: bifurcation_strain_eq28
  inputs: {kbar: kbar_fig4a}
  outputs: {eps: eps_w_eq28}
- id: run_eq28_fig2a
  model: bifurcation_wavenumber_eq28
  inputs: {}
