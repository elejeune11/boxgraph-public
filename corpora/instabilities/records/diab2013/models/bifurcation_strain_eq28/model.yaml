id: bifurcation_strain_eq28
name: bifurcation strain for a given normalized wavenumber (Eq. 2.8 inverted)
role: model
stated: {page: 5, printed_page: "5", quote: "the characteristic equation provides the normalized bifurcation wavenumber", where: Eq. 2.8}
equation: "kbar = 4 lambda^2 sqrt(3 - 2 lambda^4 - lambda^8) / ((lambda^6 - lambda^4 + 3 lambda^2 + 1)(lambda^3 + lambda^2 + lambda - 1)(lambda^3 - lambda^2 + lambda + 1)), solved for eps = 1 - lambda"
inputs:
  kbar: {quantity: normalized_wavenumber, unit: dimensionless, description: "kbar = k/a, held fixed in isoperiodic compression"}
outputs:
  eps: {quantity: bifurcation_strain, unit: dimensionless}
built_from: [bifurcation_wavenumber_eq28]
