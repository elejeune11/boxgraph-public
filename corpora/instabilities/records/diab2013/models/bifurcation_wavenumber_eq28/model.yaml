id: bifurcation_wavenumber_eq28
name: normalized bifurcation wavenumber of the flat EDM neo-Hookean surface (Eq. 2.8)
role: model
stated: {page: 5, printed_page: "5", quote: "the characteristic equation provides the normalized bifurcation wavenumber", where: Eq. 2.8}
equation: "kbar = 4 lambda^2 sqrt(3 - 2 lambda^4 - lambda^8) / ((lambda^6 - lambda^4 + 3 lambda^2 + 1)(lambda^3 + lambda^2 + lambda - 1)(lambda^3 - lambda^2 + lambda + 1)), eps = 1 - lambda"
inputs:
  eps: {quantity: bifurcation_strain, unit: dimensionless, description: "applied nominal plane-strain compressive strain, eps = 1 - lambda (p. 5)"}
outputs:
  kbar: {quantity: normalized_wavenumber, unit: dimensionless}
