notes: >
  Born-digital article with a good text layer, appendices included; equations were read from the page images.
  The quantitative core is the plane-strain isoperiodic compression of an incompressible neo-Hookean half-space whose
  shear modulus decays exponentially with depth (Q = Q0 exp(a X2)), parameterized by the normalized wavenumber
  kbar = k/a. All strains are nominal plane-strain compressive strains eps = 1 - lambda.
  Models: the linear bifurcation curve Eq. 2.8 (forward, kbar(eps), and inverted, eps(kbar)); the Biot critical strain
  as the divergence of Eq. 2.8; and the second-order (Koiter) energy variation Eqs. 2.10-2.12, built on the first-order
  fields Eqs. 2.5, 2.6, A 11 as printed, with the second-order coefficients solved from the stated governing equations
  (choice question), giving the M-point where the energy variation changes sign. Compared: eps_B = 0.456; kbar_M = 1.30
  from Eq. 2.8 at eps_M = 0.272; eps_M and kbar_M from the energy variation; the FEM wrinkle bifurcation strain 0.157 at
  kbar = 0.628 against Eq. 2.8; the homogeneous lower bound of the crease strain 0.35 against the cited 0.35 of
  Hohlfeld and of Hong et al. Hand check before the build: the energy variation as printed (factor 1 on the p(2) term of
  Eq. 2.12b) does not change sign; with the factor 2 that the second variation of Eq. 2.1c gives, it changes sign near
  the printed eps_M. The printed model, its variant and a possible_error question are all recorded; when the energy
  variation never turns negative, the printed model reports the end of the bifurcation curve (eps_B) as its M-point,
  so its comparison with 0.272 is the finding.
  Recorded without a model (finite-element results, ABAQUS, not runnable): the T-point (eps_T = 0.174, kbar = 0.471,
  the minimum strain for any crease), the R-point (0.593, 0.107), the crease-tip strain equal to eps_B, and the
  lower-bound crease strain 0.35. Recorded as cited, for the relation jobs: Gent & Cho's measured crease strain
  0.28-0.42 (bending), Hohlfeld's and Hong et al.'s 0.35. The crease thresholds are kept apart (question
  q_crease_threshold_definitions); eps_B corresponds to biot1963's critical stretch.
  Left out: the FEM settings beyond the question that lists them, the kbar values of the FEM frames (3.00, 0.471,
  0.100; 0.628, 1.30, 2.51; figure 6 curves), the bound kbar < 0.15, and the derivation-only equations. Figures: see
  figures.md; a later figure pass added calibrated readings of figures 2, 4, 5 and 6, with the bifurcation curves of
  figures 2a and 5 compared with Eq. 2.8.
