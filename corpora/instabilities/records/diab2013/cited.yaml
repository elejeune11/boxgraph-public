# Values diab2013 takes from other records, linked to the value that record prints.
- datum: hong_crease_strain
  from_datum: eps_c_printed
  evidence: >
    diab2013 (p. 2) cites Hong et al. [9] (hong2009) for following the creasing branch "beyond the compressive strain
    of 0.35". hong2009's only printed strain of 0.35 from its own analysis is its predicted plane-strain critical
    strain for creasing of a neo-Hookean solid, epsilon_c = 0.35 (p. 2, energy criterion f(epsilon_c) = 0), a
    nominal compressive strain 1 - lambda_1 as in diab2013. diab2013 records it under the quantity
    crease_lower_bound_strain and hong2009 under critical_strain_plane: the same number, as each paper reads it.
# Not linked: crease_lower_bound_homogeneous (0.35, p. 11) is diab2013's own finite-element limit, which the paper
# calls "consistent with" hong2009 but does not take from it; it has no from_source.
