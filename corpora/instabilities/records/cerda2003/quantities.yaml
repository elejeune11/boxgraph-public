- {id: sheet_thickness, name: sheet thickness, dimension: "[length]", description: "thickness t (also h) of the thin elastic sheet, skin layer or vesicle membrane"}
- {id: sheet_width, name: sheet width, dimension: "[length]", description: "width W of the sheet, across the wrinkles"}
- {id: sheet_length, name: sheet length, dimension: "[length]", description: "length L of the sheet between the clamps, along the wrinkles"}
- {id: youngs_modulus, name: Young's modulus of the sheet, dimension: "[mass]/[length]/[time]**2", description: "E"}
- {id: poisson_ratio, name: Poisson's ratio of the sheet, dimension: dimensionless, description: "nu"}
- {id: tensile_strain, name: longitudinal tensile strain, dimension: dimensionless, description: "gamma, the imposed stretching strain of the sheet"}
- {id: bending_stiffness, name: bending stiffness, dimension: "[energy]", description: "B, bending stiffness of the sheet (N m)"}
- {id: tension_per_length, name: tension per unit width, dimension: "[force]/[length]", description: "T, longitudinal tension (force per length) in the sheet"}
- {id: transverse_displacement, name: imposed compressive transverse displacement, dimension: "[length]", description: "Delta, the transverse displacement the wrinkles must absorb across the width W"}
- {id: wrinkle_wavelength, name: wrinkle wavelength, dimension: "[length]", description: "lambda = 2 pi / k"}
- {id: wrinkle_amplitude, name: wrinkle amplitude, dimension: "[length]", description: "A"}
- {id: foundation_stiffness, name: stiffness of the (effective) elastic foundation, dimension: "[force]/[length]**3", description: "K in U_F = 1/2 int K zeta^2 dA"}
- {id: modulus_ratio, name: ratio of sheet to substrate Young's modulus, dimension: dimensionless, description: "E/Es"}
- {id: pinched_fold_thickness, name: thickness of the pinched skin fold, dimension: "[length]", description: "2 Hs, twice the skin-plus-substrate thickness, measured by pinching the back of the hand"}
- {id: substrate_to_sheet_thickness_ratio, name: substrate to sheet thickness ratio, dimension: dimensionless, description: "Hs/t"}
- {id: wavelength_to_thickness_ratio, name: wavelength over sheet thickness, dimension: dimensionless, description: "lambda/t"}
- {id: wavelength_to_substrate_thickness_ratio, name: wavelength over substrate thickness, dimension: dimensionless, description: "lambda/Hs"}
- {id: in_plane_modulus, name: in-plane (stretching) modulus of a membrane, dimension: "[force]/[length]", description: "E t, the membrane's in-plane modulus"}
- {id: pinched_wrinkle_width, name: width of a wrinkle pinched at one end, dimension: "[length]", description: "lambda_d"}
- {id: wrinkle_persistence_length, name: persistence length of a wrinkle, dimension: "[length]", description: "L_d, the distance over which a sheet pinched at one end flattens out"}
