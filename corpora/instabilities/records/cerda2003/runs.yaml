- id: run_stretched_fig1
  model: stretched_sheet
  inputs: {L: L_fig1, t: t_fig1, nu: nu_polyethylene_added, gamma: gamma_fig1}
  outputs: {lam: lam_fig1_pred, A: A_fig1_pred}
  note: >-
    The Fig. 1 sheet with an added Poisson ratio. The paper prints no wavelength or amplitude for it
    (it cites ref. 14 for the experimental check), so these outputs are not compared; a count of the
    wrinkles in the Fig. 1 photograph would be the natural check (figures.md).
- id: run_apple
  model: deep_substrate_wavelength
  inputs: {t: t_apple, E_over_Es: E_over_Es_apple}
  outputs: {lam: lam_apple_pred, lam_over_t: lam_over_t_apple_pred}
- id: run_hand
  model: shallow_substrate_wavelength
  inputs: {two_Hs: two_Hs_hand, Hs_over_t: Hs_over_t_skin, E_over_Es: E_over_Es_skin}
  outputs: {lam: lam_hand_pred, lam_over_Hs: lam_over_Hs_skin_pred}
