- id: nu_polyethylene_added
  quantity: poisson_ratio
  unit: dimensionless
  printed: "0.4"
  basis: >-
    The paper does not give Poisson's ratio of the Fig. 1 polyethylene sheet; about 0.4 is a common
    handbook value for polyethylene. It enters the stretched-sheet wavelength only through
    (1 - nu^2)^(1/4) and the amplitude through nu^(1/2); no printed value is compared with these runs.
  alternatives: ["0.3", "0.46", "0.5"]
  stands_for: nu in the stretched-sheet forms (p. 2)
- id: E_over_Es_brain_added
  quantity: modulus_ratio
  unit: dimensionless
  printed: "10"
  basis: >-
    For the cross-validation against richman1975's intersulcal distances. richman1975 models the cortex
    as a stiff layer (E1 = E2) on an elastic core and takes Ecore/E1 = 1/10 for its prediction (p. 3,
    "for Ecore/E1 = 1/10, l/t ≈ 8"; Fig. 4 caption). That is a modelling choice of that paper, not a
    measured modulus of fetal brain tissue; E/Es = 10 is its inverse. Neither paper measures the moduli.
  alternatives: ["100", "3"]
  stands_for: E/Es in the deep-substrate law lambda ~ t (E/Es)^(1/3), for the fetal cortex on white matter
# Cross-validation against stafford2004 (job 2026-11-14): the deep-substrate law for PS films on PDMS.
- id: E_over_Es_PS_PDMS_added
  quantity: modulus_ratio
  unit: dimensionless
  printed: "2000"
  basis: >-
    For the cross-validation against stafford2004's Fig. 2b wavelengths. stafford2004 prints the PS film
    modulus as 3.4 ± 0.1 GPa (p. 3, Fig. 2 caption) and the PDMS modulus as (1.5-2.0) ± 0.1 MPa (p. 4),
    so E/Es is about 1700 to 2300; 2000 is a round middle value. Neither paper prints the ratio. The
    deep-substrate law carries prefactor: unknown and the build fits its constant, so this value scales
    the fitted constant only and cannot change the verdict.
  alternatives: ["1700", "2300"]
  stands_for: E/Es in the deep-substrate law lambda ~ t (E/Es)^(1/3), for a PS film on PDMS
# Cross-validation against bowden1998 (job 2026-11-14): the deep-substrate law for gold films on PDMS.
- id: E_over_Es_Au_PDMS_added
  quantity: modulus_ratio
  unit: dimensionless
  printed: "4100"
  basis: >-
    For the cross-validation against bowden1998's measured wavelengths. bowden1998 prints Em = 82 GPa for
    gold and Ep = 20 MPa for PDMS (its p. 3, "The parameters for gold and PDMS are"), so Em/Ep = 4100;
    neither paper prints the ratio itself, and this paper's law does not say whether E/Es means Young's or
    plane-strain moduli. The law carries prefactor: unknown, so the value scales only the prefactor the
    measurement implies, not a verdict.
  alternatives: ["3541"]
  stands_for: E/Es in the deep-substrate law lambda ~ t (E/Es)^(1/3), for a gold film on PDMS (alternative is the plane-strain ratio Em(1 - nu_p^2)/[Ep(1 - nu_m^2)] with nu_m = 0.33, nu_p = 0.48)
