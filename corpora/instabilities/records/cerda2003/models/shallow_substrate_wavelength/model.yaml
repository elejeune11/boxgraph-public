id: shallow_substrate_wavelength
name: wrinkle wavelength on a shallow substrate (lambda >> Hs >> t), prefactor 1
role: model
stated: {page: 3, printed_page: "074302-3", quote: "length in such cases is", where: "text, right column"}
prefactor: unknown
equation: "lambda ~ (t Hs)^(1/2) (E/Es)^(1/6)   (from K ~ Es lambda^2/Hs^3); Hs from the pinched fold 2Hs, t = Hs/(Hs/t)"
inputs:
  two_Hs: {quantity: pinched_fold_thickness, unit: mm}
  Hs_over_t: {quantity: substrate_to_sheet_thickness_ratio, unit: dimensionless}
  E_over_Es: {quantity: modulus_ratio, unit: dimensionless}
outputs:
  lam: {quantity: wrinkle_wavelength, unit: mm}
  lam_over_Hs: {quantity: wavelength_to_substrate_thickness_ratio, unit: dimensionless}
settings: {}
stochastic: false
