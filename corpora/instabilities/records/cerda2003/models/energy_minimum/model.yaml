id: energy_minimum
name: wavelength minimizing the reduced energy U(k)
role: model
stated: {page: 2, printed_page: "074302-2", quote: "relating the wave number and the amplitude", where: "text before Eq. 5"}
equation: "U = B k^2 Delta L + pi^2 T Delta/(k^2 L); lambda = 2 pi/k at the minimum of U over k"
inputs:
  B: {quantity: bending_stiffness, unit: N*m}
  T: {quantity: tension_per_length, unit: N/m}
  L: {quantity: sheet_length, unit: m}
  Delta: {quantity: transverse_displacement, unit: m}
outputs:
  lam: {quantity: wrinkle_wavelength, unit: m}
settings: {s_lo: -100.0, s_hi: 100.0, xtol: 1.0e-14}
stochastic: false
