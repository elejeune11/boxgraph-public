id: wrinkle_eq5
name: wrinkle wavelength and amplitude (Eq. 5)
role: model
stated: {page: 2, printed_page: "074302-2", quote: "and the amplitude A are obtained", where: "Eq. 5"}
equation: "lambda = 2 sqrt(pi) (B/T)^(1/4) L^(1/2),  A = sqrt(2)/pi (Delta/W)^(1/2) lambda"
inputs:
  B: {quantity: bending_stiffness, unit: N*m}
  T: {quantity: tension_per_length, unit: N/m}
  L: {quantity: sheet_length, unit: m}
  Delta: {quantity: transverse_displacement, unit: m}
  W: {quantity: sheet_width, unit: m}
outputs:
  lam: {quantity: wrinkle_wavelength, unit: m}
  A: {quantity: wrinkle_amplitude, unit: m}
settings: {}
stochastic: false
