id: stretched_sheet
name: wrinkle wavelength and amplitude of the stretched sheet
role: model
stated: {page: 2, printed_page: "074302-2", quote: "For the stretched sheet, this yields", where: "text after Eq. 5"}
equation: "lambda = (2 pi L t)^(1/2)/[3(1 - nu^2) gamma]^(1/4),  A = (nu L t)^(1/2) [16 gamma/3 pi^2 (1 - nu^2)]^(1/4)"
inputs:
  L: {quantity: sheet_length, unit: m}
  t: {quantity: sheet_thickness, unit: m}
  nu: {quantity: poisson_ratio, unit: dimensionless}
  gamma: {quantity: tensile_strain, unit: dimensionless}
outputs:
  lam: {quantity: wrinkle_wavelength, unit: m}
  A: {quantity: wrinkle_amplitude, unit: m}
settings: {}
stochastic: false
