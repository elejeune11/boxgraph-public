id: bending_stiffness
name: bending stiffness of a thin isotropic sheet
role: model
stated: {page: 2, printed_page: "074302-2", quote: "the deformations which are predominantly in the y", where: "text after Eq. 1"}
equation: "B = E t^3/[12(1 - nu^2)]"
inputs:
  E: {quantity: youngs_modulus, unit: Pa}
  t: {quantity: sheet_thickness, unit: m}
  nu: {quantity: poisson_ratio, unit: dimensionless}
outputs:
  B: {quantity: bending_stiffness, unit: N*m}
settings: {}
stochastic: false
