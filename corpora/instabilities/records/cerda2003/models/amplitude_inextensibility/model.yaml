id: amplitude_inextensibility
name: wrinkle amplitude from the inextensibility constraint (2)
role: model
stated: {page: 2, printed_page: "074302-2", quote: "relating the wave number and the amplitude", where: "text before Eq. 5"}
equation: "A_n^2 k_n^2 W/8 ≈ Delta, with k = 2 pi/lambda; solved for A = (8 Delta/W)^(1/2)/k"
inputs:
  Delta: {quantity: transverse_displacement, unit: m}
  W: {quantity: sheet_width, unit: m}
  lam: {quantity: wrinkle_wavelength, unit: m}
outputs:
  A: {quantity: wrinkle_amplitude, unit: m}
settings: {}
stochastic: false
