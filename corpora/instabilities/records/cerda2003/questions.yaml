- id: q_apple_factor
  kind: unexplained_difference
  about: [lam_over_t_apple, lam_apple, deep_substrate_wavelength]
  text: >-
    lambda ~ t (E/Es)^(1/3) with E/Es ~ 10 gives lambda/t = 10^(1/3) ≈ 2.2, and so lambda ≈ 1.1 mm for
    t ≈ 0.5 mm; the paper writes lambda ~ 3t and lambda ≈ 1.5 mm. With the Eq. 5 prefactor carried
    through (lambda^4 = 16 pi^2 B lambda/Es) the factor would be about (16 pi^2 E/[12(1 - nu^2) Es])^(1/3) ≈ 5,
    so neither prefactor-1 nor the Eq. 5 prefactor gives 3. Both numbers are printed with "~"/"≈", so no
    verdict follows; the difference is noted only.
  citation: {page: 3, printed_page: "074302-3", quote: "we estimate E=Es 10 [16], which yields", where: text}
- id: q_vesicle_inputs
  kind: unstated_input
  about: [B_vesicle, bending_from_wavelength]
  text: >-
    B ≈ 4.6 x 10^-17 N m is computed from B = T lambda^4/16 pi^2 L^2 "using the data given in [21]", but the
    tension T, wavelength lambda and length L of the vesicle are not printed. Ref. 21 as printed is a footnote
    on the scaled Foppl-von Karman equations with no vesicle data; ref. 20 (Walter, Rehage and Leonard), the
    source of Fig. 3(b), is the likely intended reference (possible misnumbering). The result cannot be run.
  citation: {page: 3, printed_page: "074302-3", quote: "Using the data given in [21], we", where: text}
- id: q_vesicle_ref_number
  kind: possible_error
  about: [B_vesicle, t_vesicle]
  text: >-
