    FvK equations; the vesicle paper is [20]. A misnumbered reference is suspected, not settled.
  citation: {page: 4, printed_page: "074302-4", quote: "in-plane modulus in [21] gives the thickness", where: text}
- id: q_vesicle_thickness
  kind: unstated_model
  about: [t_vesicle, membrane_thickness]
  text: >-
