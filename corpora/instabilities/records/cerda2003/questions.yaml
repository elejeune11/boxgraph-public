- id: q_no_validation_shyer2013
  kind: choice
  about: [deep_substrate_wavelength, shallow_substrate_wavelength, wrinkle_eq6_scaling, wrinkle_eq5, L_fig1, W_fig1, t_fig1, gamma_fig1, two_Hs_hand, shyer2013/spacing_fig4b, shyer2013/spacing_fig6c, shyer2013/mu_ratio_fig4b, shyer2013/mu_ratio_fig6c]
  text: >-
    No validation between this record and shyer2013 is entered, in either direction (cross-validation job
    2026-11-18). Neither paper cites the other. shyer2013's measured wavelengths are the fold spacings over
    endoderm thickness of Figs. 4B and 6C (chick E8-E14, mouse E12.5-E15.5), curves against embryonic age.
    The substrate laws here have no age input, so they cannot be run at each age of those curves. Their
    modulus-ratio input is measured only at E8 and E10 (chick) and E14.5 (mouse), and as a shear-modulus
    ratio. More decisively, neither limit of this paper holds for the gut. The deep-substrate law needs
    t << lambda << Hs, and the shallow-substrate law lambda >> Hs >> t. In the gut the mesenchyme is only a
    few endoderm thicknesses thick (stress-free hm = 3 he in the chick schedule, 2 he in the zigzag
    simulation) and is backed by the confining muscle. shyer2013 itself says the wavelength is "comparable
    to the thickness of the endoderm-mesenchyme composite" (p. 5). The endoderm is only about 10 times
    (chick) or 1.5 times (mouse) stiffer than the mesenchyme, not the stiff sheet on a soft foundation these
    laws describe. The spacings are also those of folds far past onset in a growing, muscle-confined tube,
    not of the incipient wrinkles these laws give. Running the deep-substrate law with its fitted prefactor
    would only report a constant, under conditions the law does not cover. In the other direction, this
    record's measurements (the Fig. 1 sheet's length, width, thickness and strain, and the pinched skin fold
    2Hs ≈ 5 mm) are inputs. No shyer2013 model gives any of them: its runnable models are the stress-free
    growth schedules of its own simulations and averages of its own plots.
