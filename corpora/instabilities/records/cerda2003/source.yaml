notes: >
  A four-page letter. Its quantitative core is the wrinkling theory of p. 2: the bending stiffness
  B = Et^3/[12(1 - nu^2)], the energy U = B k^2 Delta L + pi^2 T Delta/(k^2 L) whose minimum gives
  Eq. 5 (lambda = 2 sqrt(pi) (B/T)^(1/4) L^(1/2), A = sqrt(2)/pi (Delta/W)^(1/2) lambda), the closed
  forms for the stretched sheet, the scaling form Eq. 6 (lambda ~ (B/K)^(1/4)), the persistence
  length L_d, the deep- and shallow-substrate wavelength laws (p. 3) and the inverse of Eq. 5,
  B = T lambda^4/(16 pi^2 L^2), with the vesicle thickness from B and an in-plane modulus (p. 4).
  All are entered as models. The paper's own algebra is checked by stated relations: the
  stretched-sheet forms against Eq. 5 under T = E t gamma, Delta = nu gamma W (same_as, lambda and A);
  Eq. 5 against the numeric minimum of the printed energy U (same_as); Eq. 6 against Eq. 5 with
  K = T/L^2 (scales_as). Scaling laws printed with "~" and no prefactor are run with a prefactor of 1,
  which is how the paper itself evaluates them (e.g. lambda ~ 3t from E/Es ~ 10); every number they are
  compared with is printed with "~" or "≈", so no comparison gets a verdict, as is right. Numerical
  results compared: the apple (lambda ~ 3t, lambda ≈ 1.5 mm) and the back of the hand (lambda ≈ Hs,
  lambda ≈ 2.5 mm). The apple estimate is not met by the prefactor-1 law: 10^(1/3) ≈ 2.2, not 3
  (q_apple_factor). The vesicle results (B ≈ 4.6e-17 N m, thickness 43 nm) cannot be run: the tension,
  wavelength, length and in-plane modulus they rest on are not printed, and the reference given for
  them ([21]) is a footnote with no data (q_vesicle_inputs, q_vesicle_thickness); they are recorded
  uncompared. The stretched-sheet forms are run on the Fig. 1 sheet (L ≈ 25 cm, t ≈ 0.01 cm,
  gamma ≈ 0.10) with an added Poisson ratio, but the paper prints no wavelength or amplitude for that
  sheet (it says they were verified in ref. 14), so those outputs are not compared.
  Left out: the strain "gamma ≈ 10^-2" for the Fig. 1 sheet (p. 1; it feeds no model and its meaning
  next to the caption's 0.10 is unclear, q_gamma_fig1), the apple size (≈ 5 cm) and vesicle size
  (≈ 10 um) in the captions, the cell-wrinkle length scales in the Fig. 3 caption, the Sturm-Liouville
  problem Eq. 4 and Euler-Lagrange Eq. 3 (they lead to Eq. 5 through the energy U, which is entered),
  the substrate-stiffness derivation K = Es f(lambda/lp)/lp (its two limits are inside the two
  substrate models) and the scaled FvK equations of footnote 21. The figures are photographs and
  micrographs with no axes (figures.md).
