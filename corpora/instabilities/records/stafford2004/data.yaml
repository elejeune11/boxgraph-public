  note: the open circles of Fig. 3 (nanoindentation on films cast on silicon)
- id: E_fig4_siebimm
  quantity: film_modulus
  unit: GPa
  origin: derived
  figure: fig4_siebimm
  citation: {page: 4, printed_page: "548", quote: "Modulus versus porosity for a series of nanoporous organosilicate", where: "Fig. 4"}
