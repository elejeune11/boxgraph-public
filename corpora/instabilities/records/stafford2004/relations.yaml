# Against cerda2003. Stafford does not cite Cerda and Mahadevan (2003); this relation is proposed.
# Cerda's deep-substrate law lambda ~ t (E/Es)^(1/3) (prefactor unknown) is the scaling of Stafford's Eq. 1,
# d = 2 pi h [(1 - nu_s^2) Ef / (3 (1 - nu_f^2) Es)]^(1/3), for a thin film on a thick substrate.
# Port units: Cerda t and lambda in mm; Stafford h in nm, Ef in GPa, Es in MPa, d in um.
- id: rel_cerda_deep_wavelength_scales_as_eq1
  kind: scales_as
  a: cerda2003/deep_substrate_wavelength
  b: stafford2004/wavelength_eq1
  mapping: {h: "t*1000000", Ef: "E_over_Es/1000", Es: "1", nu_f: "0.33", nu_s: "0.5"}
  output_map: {d: lam}
  regime: {t: [1.0e-5, 1.0e-3], E_over_Es: [10, 100000]}
  provenance: proposed
  reason: >
    Stafford's Eq. 1 is the wavelength of a stiff film of thickness h on a thick soft substrate, which is
    Cerda's deep-substrate case (t << lambda << Hs, K ~ Es/lambda). Both give a wavelength proportional to
    the thickness and to the cube root of the film-to-substrate modulus ratio; Eq. 1 supplies the prefactor
    2 pi [(1 - nu_s^2)/(3 (1 - nu_f^2))]^(1/3) that Cerda's "~" leaves out.
  assumptions:
    - "Cerda's t is Stafford's film thickness h; Cerda's E/Es is Stafford's Ef/Es, with Es fixed at 1 MPa"
    - "the Poisson ratios are held constant (nu_f = 0.33, nu_s = 0.5); they change only the prefactor"

# Against bowden1998. Stafford cites Bowden et al. (1998) as ref-7, but only on journal page 545, which is not
# in the PDF (source.yaml notes); on the pages present Eq. 1 is attributed to refs 11-13, not to ref-7. No
# statement relating the two papers' models can be cited, so these relations are proposed.
# Port units: Bowden Em, Ep in Pa, t in nm, L in um; Stafford Ef in GPa, Es in MPa, h in nm, d in um.
- id: rel_bowden_eq3_approximated_by_eq1
  kind: approximated_by
  a: bowden1998/wavelength_eq3
  b: stafford2004/wavelength_eq1
  mapping: {h: "t", Ef: "Em/1e9", nu_f: "nu_m", Es: "Ep/1e6", nu_s: "nu_p"}
  output_map: {d: L}
  regime: {Em: [1.0e+9, 1.0e+11], Ep: [1.0e+5, 1.0e+7], nu_m: [0.2, 0.5], nu_p: [0.3, 0.5], t: [10, 1000]}
  tolerance: 0.0012
  provenance: proposed
  reason: >
    Both are the wavelength of a stiff film on a thick compliant substrate, with the same plane-strain moduli
    E/(1 - nu^2) and the same cube-root dependence. Stafford's 2 pi / 3^(1/3) = 4.3566 is Bowden's printed
    prefactor 4.36 to three figures, so the two differ by a constant factor 4.36/4.3566 = 1.0008; the
    tolerance 0.0012 is the precision of the printed 4.36 (0.005/4.36 relative).
  assumptions:
    - "Bowden's film (metal, subscript m) and substrate (PDMS, subscript p) are Stafford's f and s"
- id: rel_bowden_eq3_simplified_approximated_by_eq1
  kind: approximated_by
  a: bowden1998/wavelength_eq3_simplified
  b: stafford2004/wavelength_eq1
  mapping: {h: "t", Ef: "Em/1e9", nu_f: "0.5", Es: "Ep/1e6", nu_s: "0.5"}
  output_map: {d: L}
  regime: {Em: [1.0e+9, 1.0e+11], Ep: [1.0e+5, 1.0e+7], t: [10, 1000]}
  tolerance: 0.012
  provenance: proposed
  reason: >
    Bowden's simplified form L = 4.4 t (Em/Ep)^(1/3) drops the Poisson factors, which is exact in Stafford's
    Eq. 1 only when film and substrate have the same Poisson ratio. With nu_f = nu_s Eq. 1 is
    4.3566 h (Ef/Es)^(1/3); Bowden's 4.4 is that to two figures (1.0 % high). The tolerance 0.012 is the
    precision of the printed 4.4 (0.05/4.4 relative).
  assumptions:
    - "equal Poisson ratios of film and substrate (taken as 0.5 here; any equal pair cancels the same way)"
- id: rel_bowden_multilayer_reduces_to_eq1
  kind: reduces_to
  a: bowden1998/multilayer_wavelength
  b: stafford2004/wavelength_eq1
  mapping: {h: "t", Ef: "Em/1e9", nu_f: "nu_m", Es: "Ep/1e6", nu_s: "nu_p"}
  output_map: {d: L}
  limit: {t1: "0"}
  regime: {Em: [1.0e+9, 1.0e+11], nu_m: [0.2, 0.5], t: [10, 1000], E1: [1.0e+6, 1.0e+9], nu_1: [0.3, 0.5],
           t1: [0, 10], Ep: [1.0e+5, 1.0e+7], nu_p: [0.3, 0.5]}
  provenance: proposed
  reason: >
    bowden1998's reconstructed composite-plate model writes the wavelength as L = 2 pi (4 D / Ep_bar)^(1/3).
    Without the modified layer (t1 -> 0) the plate is the film alone, D = Em_bar t^3 / 12, and
    L = 2 pi t (Em_bar / (3 Ep_bar))^(1/3), which is Stafford's Eq. 1 exactly (no rounded prefactor).
  assumptions:
    - "the reader's composite-plate reconstruction of Bowden's multilayer wavelength (reconstructed model)"
