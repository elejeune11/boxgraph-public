- id: q_no_validation_tallinen2015
  kind: choice
  about: [wavelength_eq1, modulus_eq2, porosity_eq4, allen_shortfall, d_fig2b, d_fig1b_caption, E_fig3_indentation, E_fig4_indentation, tallinen2015/stiff_wavelength_asymptote, tallinen2015/mode_wavelength_h, tallinen2015/first_unstable_mode]
  text: >-
    (Cross-validation job 2026-11-14.) No validation is entered between this record and tallinen2015, in
    either direction. Neither paper cites the other (tallinen2015 is later; its stiff-layer citations are
    its refs. 15-20 and 26-28). tallinen2015 holds no measurement: its data are reported inputs, values
    predicted by its own equations, and finite-element points (Figs. 2-4), so this record's models have
    nothing measured there to test against. In the other direction, this record's measurements are
    dimensional: wrinkle wavelengths d in um against thickness h (Figs. 1b, 2b, h_osg/d_osg), and film
    moduli from nanoindentation (Figs. 3, 4). Every tallinen2015 wavelength model returns the ratio l/a or
    l/h, a quantity this paper never prints as measured (making d/h from Fig. 2b would be a number computed
    in this job); no tallinen2015 model gives a film modulus. The conditions differ as well: a glassy film
    (nu_f = 0.33 or 0.26) wrinkled by an applied strain, against incompressible neo-Hookean solids
    compressed by growth. The physical link (Eq. 1 at nu = 0.5 divided by h is tallinen2015's
    stiff-layer asymptote l/a = 2 pi (eta/3)^(1/3)) is model against model, noted in tallinen2015's
    relations.yaml for the relation jobs.
  citation: {none: "a choice of this cross-validation job; the two records hold no common measured quantity"}
- id: q_no_validation_trujillo2008
  kind: choice
  about: [wavelength_eq1, modulus_eq2, modulus_eq2_points, porosity_eq4, d_fig2b, E_fig3_indentation, E_fig4_indentation]
  text: >-
    (Cross-validation against trujillo2008, job 2026-11-18.) No validation entered, in either direction.
    trujillo2008 cites this paper (its ref. 13) only as background on wrinkling of a rigid skin on a soft
    substrate, which it contrasts with creasing of swollen hydrogels bonded to a rigid substrate with no
    capping layer. Its measurements are critical compressive strains for creasing, thickness and free
    swelling ratios, and gel moduli estimated from swelling; no model here gives any of these, and Eq. 1
    (a stiff film on a thick compliant substrate) has no film/substrate pair to apply to there. Nothing
    measured here (wrinkle wavelengths, thicknesses, nanoindentation moduli of glassy films) is predicted by
    trujillo2008's Biot-threshold and swelling models. See trujillo2008/q_no_validation_stafford2004.
  citation: {none: "a choice of this cross-validation job; the two records hold no common measured quantity"}
