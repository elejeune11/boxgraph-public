- id: q_no_validation_from_biot1963
  kind: choice
  about: [wavelength_eq1, modulus_eq2, porosity_eq4, allen_shortfall, d_fig2b, E_fig3_indentation, E_fig4_indentation, biot1963/crit_stretch_plane, biot1963/plane_compression]
  text: >-
    (Cross-validation job 2026-11-14.) No validation is entered between this record and biot1963, in
    either direction. biot1963 holds no measurement (its Table I is computed from its own equations, and
    the paper has no figures), so this record's models have nothing measured there to test against.
    biot1963's models give the critical stretch, load and decay factor of a homogeneous neo-Hookean
    half-space, which has no length scale. None of them predicts this paper's wavelengths or moduli,
    and this paper prints no buckling strain to set against them (see
    biot1963/q_no_validation_stafford2004). The Biot cited here (ref. 9) is the 1937 paper on a beam on
    an elastic foundation, not biot1963.
- id: q_bowden_gold
  kind: unexplained_difference
  about: [wavelength_eq1, bowden1998/L_measured, bowden1998/cmp_L_eq3_vs_measured]
  text: >-
    (Cross-validation against bowden1998, job 2026-11-14.) Eq. 1 with bowden1998's printed gold and PDMS
    constants (82 GPa, 20 MPa, 0.33, 0.48, t = 50 nm) gives about 3.4 um, against the measured 20-50 um: not
    reproduced (55 nm, with the adhesion layer, moves it by only 10 %). This is bowden1998's own finding with
    the same formula (its Eq. 3), which it attributes to a stiffer modified PDMS surface layer under the
    metal; Eq. 1 has no such layer. Whether the miss tells against Eq. 1 or only shows that the gold/PDMS
    samples are not the bilayer Eq. 1 describes is open.
  citation: {none: "the difference is between two records; bowden1998 pp. 2-3 prints the inputs and the range"}
