- id: q_missing_first_page
  kind: reading
  about: []
  text: >-
    The PDF holds journal pages 546-550; page 545 (title, authors, abstract, first part of the
    introduction) is missing, so anything printed there (for example an abstract statement of the
    measured moduli or the thickness range) is not in this record, and the bibliographic data are not
    checked against a page.
  citation: {none: "the page is not in the PDF"}
- id: q_Es_per_sample
  kind: unstated_input
  about: [Es_range, Es_added]
  text: >-
    The PDMS modulus was "measured before each experiment" (Methods, p. 5) but only the range
    (1.5-2.0) ± 0.1 MPa is printed. Every modulus from Eq. 2 is proportional to Es, so the choice inside
    this range moves an inferred modulus by up to about ±14%.
  citation: {page: 5, printed_page: "549", quote: "The modulus of the PDMS was measured before each experiment", where: Methods}
- id: q_nu_s
  kind: unstated_input
  about: [nu_s_added, wavelength_eq1, modulus_eq2]
  text: >-
    Eqs. 1 and 2 need the Poisson's ratio of the PDMS, nu_s, which the paper never states; 0.5 is added.
    Ef from Eq. 2 scales as 1/(1 - nu_s^2), so 0.48 instead of 0.5 lowers it by about 3%.
  citation: {page: 2, printed_page: "546", quote: "where h is the thickness of the upper film", where: text}
- id: q_fig1b_inconsistent
  kind: unexplained_difference
  about: [h_fig1b, d_fig1b_caption, cmp_eq1_fig1b_caption, cmp_eq2_fig1b, cmp_eq2_fig1b_gradient]
  text: >-
    For the PS film of Fig. 1b the paper prints h ≈ 100 nm and d = 8 µm (≈ 8 µm in the text). Eq. 1 with
    the paper's own PS modulus 3.4 GPa, nu_f = 0.33, nu_s = 0.5 and Es anywhere in 1.5-2.0 MPa gives
    d of about 5 µm; Eq. 2 on h ≈ 100 nm and d = 8 µm gives a modulus of roughly 11-15 GPa instead of
    3.4 GPa. A wavelength of 8 µm corresponds by Eq. 1 to a PS film of about 150-160 nm. Either the
    thickness of the micrographed film is not ≈100 nm, or that film is not of the same system; the paper
    does not say.
  citation: {page: 2, printed_page: "546", quote: "micrograph shows a buckling wavelength for a PS film", where: text}
- id: q_porosity_percent
  kind: possible_error
  about: [porosity_range, P_max_added, E_osg_Pmax]
  text: >-
    The porosities are printed as "ranging from 0 to 0.51 percent", but the porogen loadings run "from 0
    to 0.50 mass fraction" and the porosity axis of Fig. 4 runs to about 50 %. The value is probably the
    fraction 0.51 (51 %), with "percent" a slip; the record keeps the printed unit and adds P = 0.51 as a
    fraction for Eq. 4.
  citation: {page: 5, printed_page: "549", quote: "0 to 0.51 percent as determined by X-ray reflectivity", where: text}
- id: q_E0_unstated
  kind: unstated_input
  about: [E0_added, porosity_eq4]
  text: >-
    The fit of Eq. 4 reports a and n but not E0, "the modulus of the matrix". E0 is added as the 9 GPa the
    caption gives at zero porosity; the fitted E0 need not equal that measured point.
  citation: {page: 5, printed_page: "549", quote: "where E0 is the modulus of the matrix and P is the porosity", where: text}
- id: q_eq4_endpoint
  kind: unexplained_difference
  about: [cmp_eq4_Pmax, a_fit, n_fit, E_osg_Pmax]
  text: >-
    Eq. 4 with a = 1, n = 3.45 and E0 = 9 GPa gives about 0.77 GPa at P = 0.51 (0.82 GPa at P = 0.50),
    against the printed 0.6 GPa at the highest porosity. Reaching 0.6 GPa would need E0 near 7 GPa or n
    near 3.8. A least-squares fit need not pass through the end point, and E0 is not printed, so this
    may only say that the fitted curve and the extreme measurement differ by about 0.15 GPa; the Fig. 4
    reading (figure pass) can test the fit against all points.
  citation: {page: 5, printed_page: "549", quote: "From this fit, we ascertain a and n to be 1 and", where: text}
- id: q_allen_formula
  kind: unstated_model
  about: [allen_shortfall, allen_shortfall_PS]
  text: >-
    Allen's plane-stress solution (ref. 10) is used to claim a modulus ≈10% lower than Eq. 2, but its
    formula is not printed. The record reconstructs it as a plane-stress face on an isotropic half-space
    core; with nu_s = 0.5 and nu_f = 0.33 that gives about 10%. With nu_s = 0.48 it gives about 7%; the
    printed ≈10% does not say which nu_s or nu_f the paper used.
  citation: {page: 3, printed_page: "547", quote: "calculated modulus of the upper film that is ≈10% lower than expected", where: text}
- id: q_figures_not_read
  kind: reading
  about: [E_PS_gradient, E_osg_Pmax, porosity_eq4, modulus_eq2]
  text: >-
    The measured data (Fig. 2b wavelength and modulus against thickness, Fig. 3 SIEBIMM and indentation
    moduli against plasticizer, Fig. 4 SIEBIMM and indentation moduli against porosity with the Eq. 4
    curve) are only plotted and were not read in this job; figures.md lists what each would test.
  citation: {page: 3, printed_page: "547", quote: "Modulus versus thickness for a flow-coated thickness gradient sample", where: "Fig. 2 caption"}
- id: q_gradient_range
  kind: reading
  about: [h_PS_gradient_fig2a, h_PS_gradient_text, E_PS_gradient]
  text: >-
    (Audit.) The Fig. 2a caption gives the PS gradient as 140 nm to 280 nm and says the doubling of the
    thickness doubles the buckling period; the text gives 150 nm to 240 nm, and the Fig. 2b axis runs
    from 140 to 260 nm. Fig. 2a (photograph) and Fig. 2b may show different specimens or different
    stretches of the same gradient; the paper does not say. The condition on E_PS_gradient follows the text.
  citation: {page: 3, printed_page: "547", quote: "PS thickness gradient on silicon wafer (140 nm to 280 nm)", where: "Fig. 2 caption"}
- id: q_fig3_thickness_mismatch
  kind: reading
  about: [h_PS_plasticized, h_PS_indentation]
  text: >-
    (Audit, for the figure pass.) The Fig. 3 comparison of SIEBIMM with nanoindentation is made on films
    of different thickness: 110-130 nm for SIEBIMM, about 200-500 nm for indentation. The paper calls the
    indented films "equivalent"; a consistency comparison of the two Fig. 3 series must state these
    differing conditions in conditions_ok.
  citation: {page: 4, printed_page: "548", quote: "ranging from approximately 200 nm to 500 nm cast on silicon wafers", where: text}
- id: q_fig4_zero_porosity
  kind: overstated_claim
  about: [cmp_siebimm_indentation_fig4, E_fig4_siebimm, E_fig4_indentation]
  text: >-
    (Figure pass.) The Fig. 4 caption says SIEBIMM and nanoindentation "show excellent agreement through the
    entire range of porosity", but at the lowest porosity (about 0.7 %) the plotted SIEBIMM modulus reads
    about 9.0 GPa (bar about 8.7-9.3) and the indentation modulus about 6.6 GPa (bar about 6.2-7.0): the bars
    do not overlap. The other five indentation points agree with SIEBIMM within about 0.3 GPa. The paper does
    not comment on the zero-porosity point.
  citation: {page: 4, printed_page: "548", quote: "show excellent agreement through the entire range of porosity", where: "Fig. 4 caption"}
- id: q_fig_settles_porosity_unit
  kind: reading
  about: [q_porosity_percent, porosity_range, P_max_added, E_fig4_siebimm]
  text: >-
    (Figure pass.) The Fig. 4 porosity axis is labelled "Porosity (%)" and its highest plotted point reads at
    50.6 % (fig4_siebimm), so the printed "0 to 0.51 percent" (p. 5) is the fraction 0.51, as P_max_added
    assumes; the caption's end values 9 and 0.6 GPa are also what the figure shows (8.98 and 0.61 GPa read).
  citation: {page: 4, printed_page: "548", quote: "dramatically decreases from 9 GPa to 0.6 GPa", where: "Fig. 4 caption"}
- id: q_fig_eq4_all_points
  kind: reading
  about: [q_eq4_endpoint, cmp_eq4_fig4, cmp_eq4_Pmax]
  text: >-
    (Figure pass.) Swept over all 13 SIEBIMM porosities of Fig. 4, Eq. 4 with a = 1, n = 3.45 and E0 = 9 GPa
    falls within the plotted error bar of every point. At the highest porosity the reading is 0.61 GPa against
    about 0.79 GPa from Eq. 4; that point's bar is hidden in its marker, so the record takes it as at most the
    marker (about 0.44-0.78 GPa), and the comparison there turns on the marker size. The difference noted in
    q_eq4_endpoint is therefore that of one extreme point from a fit through all of them.
  citation: {page: 5, printed_page: "549", quote: "From this fit, we ascertain a and n to be 1 and", where: text}
- id: q_fig2b_settles_fig1b
  kind: reading
  about: [q_fig1b_inconsistent, d_fig2b, h_fig1b]
  text: >-
    (Figure pass.) In Fig. 2b the thinnest PS film plotted, about 152 nm, has a wavelength of about 7.9 µm,
    and the wavelengths rise linearly with thickness as Eq. 1 predicts with the paper's 3.4 GPa
    (cmp_eq1_fig2b reproduced at all ten points). By the paper's own data an 8 µm wavelength belongs to a PS
    film of about 150 nm, which supports the reading in q_fig1b_inconsistent that the micrographed film of
    Fig. 1b is thicker than the printed ≈100 nm (or is not of the same system).
  citation: {page: 3, printed_page: "547", quote: "The linear increase in buckling wavelength (open circles) with film thickness", where: "Fig. 2b"}
- id: q_fig2b_Es
  kind: unstated_input
  about: [cmp_eq2_fig2b_points, Es_added]
  text: >-
    (Figure pass.) Eq. 2 on the ten plotted (h, d) points of Fig. 2b gives moduli 1.5-2.4 % below the plotted
    filled circles with Es = 1.75 MPa (all within their bars); the ratio is nearly constant along the film
    (0.976-0.985), as expected if the paper used one Es near 1.79 MPa for this sample. The sample's Es is not printed.
  citation: {page: 5, printed_page: "549", quote: "The modulus of the PDMS was measured before each experiment", where: Methods}
- id: q_richman_thickness_choice
  kind: choice
  about: [wavelength_eq1, Ef_brain_added, Es_brain_added, richman1975/t_27wk, richman1975/t_normal_fetus]
  text: >-
    (Cross-validation against richman1975.) The 8.5 mm intersulcal distance belongs to richman1975's 27-week
    specimen, whose cortical thickness note 18 gives as ≈ 1.7 mm, while richman1975's own prediction uses
    t ≈ 1.0 mm for the normal fetus. Which thickness is the measurement's condition is open, so Eq. 1 is run
    with both. All three validations rest on the added moduli Ef/Es = 10 (richman1975's modelling choice, not
    a measurement): since d scales as (Ef/Es)^(1/3), the verdicts test that choice as much as Eq. 1.
- id: q_no_validation_from_richman1975
  kind: choice
  about: [d_fig2b, E_fig3_siebimm, E_fig3_indentation, E_fig4_siebimm, E_fig4_indentation, modulus_eq2, richman1975/plate_on_foundation, richman1975/wavelength_from_thickness]
  text: >-
    (Cross-validation job 2026-11-14.) No model of richman1975 is validated against this record's
    measurements. Its plate_on_foundation gives l/t and a critical stress ratio, which this paper does not
    measure (it prints wavelengths and thicknesses, not their ratio, and no stress), and it is a
    reconstruction for two incompressible strata with Ecore/E1 near 1/10, far from PS on PDMS (Ef/Es about
    2000, nu_f = 0.33); its wavelength_from_thickness takes l/t from a datum, and the only printed l/t
    (8, Fig. 4A) is for the brain's Ecore/E1 = 1/10, not for these films. richman1975 has no model of a
    film modulus, so the moduli of Figs. 3 and 4 have nothing there to predict them. In the other direction
    Eq. 2 (modulus from wavelength) is not run on richman1975, since no modulus of the cortex is measured
    there to compare with.
