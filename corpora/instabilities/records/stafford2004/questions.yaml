- id: q_no_validation_from_cao2012_data
  kind: choice
  about: [wavelength_eq1, modulus_eq2, porosity_eq4, allen_shortfall]
  text: >-
    (Cross-validation job 2026-11-14.) No model of this record is validated against cao2012, because
    cao2012 holds no measurement: it is a theory and finite element paper, and every datum it has is
