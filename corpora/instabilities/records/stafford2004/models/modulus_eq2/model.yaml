id: modulus_eq2
name: film modulus from the measured wrinkle wavelength (Eq. 2, Eq. 1 rearranged)
role: model
stated: {page: 2, printed_page: "546", quote: "Equation (1) can be rearranged to solve for the modulus of the", where: "Eq. 2"}
equation: "E_f / (1 - nu_f^2) = 3 E_s / (1 - nu_s^2) (d / (2 pi h))^3"
inputs:
  d:    {quantity: wrinkle_wavelength, unit: um}
  h:    {quantity: film_thickness, unit: nm}
  nu_f: {quantity: film_poisson_ratio, unit: dimensionless}
  Es:   {quantity: substrate_modulus, unit: MPa}
  nu_s: {quantity: substrate_poisson_ratio, unit: dimensionless}
outputs:
  Ef:   {quantity: film_modulus, unit: GPa}
settings: {}
stochastic: false
