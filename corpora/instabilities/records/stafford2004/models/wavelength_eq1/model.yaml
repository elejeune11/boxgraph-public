id: wavelength_eq1
name: critical wrinkle wavelength of a stiff film on a thick soft substrate (Eq. 1)
role: model
stated: {page: 2, printed_page: "546", quote: "wavelength (d) can be expressed by", where: "Eq. 1"}
equation: "d = 2 pi h [ (1 - nu_s^2) E_f / (3 (1 - nu_f^2) E_s) ]^(1/3)"
inputs:
  h:    {quantity: film_thickness, unit: nm}
  Ef:   {quantity: film_modulus, unit: GPa}
  nu_f: {quantity: film_poisson_ratio, unit: dimensionless}
  Es:   {quantity: substrate_modulus, unit: MPa}
  nu_s: {quantity: substrate_poisson_ratio, unit: dimensionless}
outputs:
  d:    {quantity: wrinkle_wavelength, unit: um}
settings: {}
stochastic: false
