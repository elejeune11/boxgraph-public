id: pair_plasticizer
name: SIEBIMM moduli of Fig. 3 taken at the plasticizer concentrations of the indentation points
role: processing
stated: {page: 4, printed_page: "548", quote: "SIEBIMM data show good agreement, within the error of the", where: text}
equation: "E_SIEBIMM at the concentration of each indentation point (nearest plotted point)"
inputs:
  E:     {quantity: film_modulus, unit: GPa, curve: {quantity: plasticizer_fraction, unit: percent}}
  E_at:  {quantity: film_modulus, unit: GPa, curve: {quantity: plasticizer_fraction, unit: percent}}
outputs:
  E:     {quantity: film_modulus, unit: GPa, curve: {quantity: plasticizer_fraction, unit: percent}}
settings:
  max_dx: 0.5   # percent: points closer than this in concentration are at the same concentration
stochastic: false
