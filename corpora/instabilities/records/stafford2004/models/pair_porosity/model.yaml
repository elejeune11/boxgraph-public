id: pair_porosity
name: SIEBIMM moduli of Fig. 4 taken at the porosities of the indentation points
role: processing
stated: {page: 4, printed_page: "548", quote: "show excellent agreement through the entire range of porosity", where: "Fig. 4 caption"}
equation: "E_SIEBIMM at the porosity of each indentation point (nearest plotted point)"
inputs:
  E:     {quantity: film_modulus, unit: GPa, curve: {quantity: porosity, unit: percent}}
  E_at:  {quantity: film_modulus, unit: GPa, curve: {quantity: porosity, unit: percent}}
outputs:
  E:     {quantity: film_modulus, unit: GPa, curve: {quantity: porosity, unit: percent}}
settings:
  max_dx: 0.5   # percent porosity: points closer than this are the same film
stochastic: false
