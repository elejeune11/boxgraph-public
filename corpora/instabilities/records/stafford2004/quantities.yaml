- {id: film_thickness, name: film thickness, dimension: "[length]", description: "h, thickness of the stiff upper (polymer or organosilicate) film"}
- {id: wrinkle_wavelength, name: wrinkle wavelength, dimension: "[length]", description: "d, the dominant wavelength (periodicity) of the buckling pattern, d = 2 pi / q0"}
- {id: film_modulus, name: Young's modulus of the film, dimension: "[mass]/[length]/[time]**2", description: "Ef"}
- {id: substrate_modulus, name: Young's modulus of the substrate, dimension: "[mass]/[length]/[time]**2", description: "Es, the PDMS sheet"}
- {id: film_poisson_ratio, name: Poisson's ratio of the film, dimension: dimensionless, description: "nu_f"}
- {id: substrate_poisson_ratio, name: Poisson's ratio of the substrate, dimension: dimensionless, description: "nu_s"}
- {id: porosity, name: porosity of the film, dimension: dimensionless, description: "P in Eq. 4, the volume fraction of pores"}
- {id: matrix_modulus, name: Young's modulus of the pore-free matrix, dimension: "[mass]/[length]/[time]**2", description: "E0 in Eq. 4"}
- {id: porosity_coefficient, name: porosity coefficient of the Phani-Niyogi law, dimension: dimensionless, description: "a in Eq. 4"}
- {id: porosity_exponent, name: porosity exponent of the Phani-Niyogi law, dimension: dimensionless, description: "n in Eq. 4"}
- {id: modulus_relative_difference, name: relative shortfall of one inferred film modulus against another, dimension: dimensionless, description: "how much lower the film modulus from Allen's plane-stress solution is than the modulus from Eq. 2, for the same wavelength, thickness and substrate: 1 - Ef(Allen)/Ef(Eq. 2)"}
- {id: plasticizer_fraction, name: plasticizer content of the film, dimension: dimensionless, description: "weight fraction of dioctyl phthalate in the PS film (Fig. 3, plotted in %)"}
