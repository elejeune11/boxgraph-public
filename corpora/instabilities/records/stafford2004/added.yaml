- id: Es_added
  quantity: substrate_modulus
  unit: MPa
  printed: "1.75"
  basis: >-
    The middle of the printed range "(1.5-2.0) ± 0.1 MPa" (p. 4). The PDMS modulus was measured before each
    experiment (p. 5) but no value is printed for any one sample.
  alternatives: ["1.5", "2.0", "1.4", "2.1"]
  stands_for: Es in Eqs. 1 and 2
- id: nu_s_added
  quantity: substrate_poisson_ratio
  unit: dimensionless
  printed: "0.5"
  basis: >-
    The paper does not state the Poisson's ratio of the PDMS; an elastomer is close to incompressible,
    and 0.5 is the usual value for Sylgard 184 in this literature.
  alternatives: ["0.48", "0.49", "0.45"]
  stands_for: nu_s in Eqs. 1 and 2
- id: E0_added
  quantity: matrix_modulus
  unit: GPa
  printed: "9"
  basis: >-
    The fitted E0 of Eq. 4 is not printed. Eq. 4 gives Ef = E0 at P = 0, and the Fig. 4 caption (p. 4)
    says the modulus "dramatically decreases from 9 GPa to 0.6 GPa" as the porosity increases from zero,
    so E0 is taken as that 9 GPa.
  alternatives: ["8.5", "9.5", "8"]
  stands_for: E0 in Eq. 4
- id: P_max_added
  quantity: porosity
  unit: dimensionless
  printed: "0.51"
  basis: >-
    The highest porosity, printed as "0 to 0.51 percent" (p. 5), read as a volume fraction 0.51: the
    porogen loadings run "from 0 to 0.50 mass fraction" and the Fig. 4 porosity axis runs to about 50 %.
    Eq. 4 needs P as a fraction (1 - aP with a = 1).
  alternatives: ["0.50", "0.0051"]
  stands_for: P in Eq. 4 at the highest porosity
# Cross-validation against richman1975 (job 2026-11-14): Eq. 1 for the fetal cortex on its core.
- id: Es_brain_added
  quantity: substrate_modulus
  unit: kPa
  printed: "31"
  basis: >-
    For the cross-validation against richman1975's intersulcal distances. Neither paper measures a modulus
    of fetal brain tissue; richman1975 (note 19) cites only adult white-matter estimates of 2 to 7 psi, whose
    middle, 4.5 psi, is about 31 kPa. Eq. 1 depends only on Ef/Es, so this value matters only through
    Ef_brain_added, which is set ten times larger.
  alternatives: ["14", "48"]
  stands_for: Es in Eq. 1, the elastic core (white matter) under the fetal cortex
- id: Ef_brain_added
  quantity: film_modulus
  unit: kPa
  printed: "310"
  basis: >-
    For the cross-validation against richman1975. richman1975 takes Ecore/E1 = 1/10 for its prediction
    (p. 3, "for Ecore/E1 = 1/10, l/t ≈ 8"; Fig. 4 caption), with E1 = E2; that is a modelling choice of
    that paper, not a measured modulus. Ef = 10 Es_brain_added. Alternatives give Ef/Es = 100 and 3.
  alternatives: ["3100", "93"]
  stands_for: Ef in Eq. 1, the cortical layer (both strata, E1 = E2)
- id: nu_brain_added
  quantity: film_poisson_ratio
  unit: dimensionless
  printed: "0.5"
  basis: >-
    For the cross-validation against richman1975, which says "The material was taken to be elastically
    incompressible, an assumption which has little effect on the prediction" (p. 3).
  alternatives: ["0.45"]
  stands_for: nu_f in Eq. 1, the cortical layer
- id: nu_s_brain_added
  quantity: substrate_poisson_ratio
  unit: dimensionless
  printed: "0.5"
  basis: >-
    For the cross-validation against richman1975: the core is taken incompressible like the cortex
    (richman1975 p. 3, "The material was taken to be elastically incompressible").
  alternatives: ["0.45"]
  stands_for: nu_s in Eq. 1, the elastic core
