- id: q_shell_not_rerun
  kind: unstated_model
  about: [shell_inversion]
  text: >
    The shapes of Figs. 4(a-c, g, i), S1 and S2 and the strain and curvature profiles of Fig. 4(d, e) come from
    minimizing Eq. 3, but the paper gives neither the minimization (equations, boundary conditions, method) nor
    formulas for the contracted intrinsic stretches and curvatures (only the sketches of Fig. 3(d-f)), and the
    parameters only approximately (kR approx 10-20 or 20, lambda approx 0.1 pi R, r_p/R approx 0.7; k' > k and
    lambda' > lambda unstated for Fig. 4(c); a of Eq. S1 unstated). The claims that computed shapes 'are in
    quantitative agreement' and 'lie within a standard deviation' of the average shapes cannot be checked here.
    haas2015 and haas2021 later give fuller versions of this model.
  citation: {page: 3, quote: "the model now successfully", where: text}
- id: q_area_estimate
  kind: unstated_model
  about: [area_contraction_estimate, area_decrease_contraction_only]
  text: >
    The 'approx 25%' area decrease expected from posterior contraction alone is stated without its computation.
    The reconstruction (posterior hemisphere area scaled by (r_p/R)^2, bend region and anterior unchanged) gives
    25.5% at r_p/R = 0.7, consistent with it; whether the authors included the bend region or used the computed
    deformed shape is not said.
  citation: {page: 4, quote: "is substantially smaller than the", where: text}
- id: q_snap_inputs
  kind: unstated_input
  about: [snap_speed_scaling, U_after_speedup, E_sheet_added, mu_fluid_added]
  text: >
    The scaling U ~ E h^(5/2)/(mu R^(3/2)) is offered to explain the constant speed U approx 0.03 um/s, but the paper
    gives no E for the cell sheet and no mu, so the scaling is evaluated only with added values. With E = 1 kPa,
    mu = 1 mPa s, h = 7.5 um, R = 50 um it gives a speed of order 0.4 m/s, about 10^7 times the measured one, so the
    implied prefactor is of order 10^-7; an order-one prefactor would need E of order 10^-4 Pa or a far larger
    effective viscosity. The fuller analysis is deferred to unpublished work [32].
  citation: {page: 4, quote: "Hence, there is an e-independent snap", where: text}
- id: q_area_reference_time
  kind: reading
  about: [area_decrease_before_t0, area_decrease_median_text, area_change_points_figS3]
  text: >
    The initial area decrease (approx 10%) depends on the reference time of A0, which differs between embryos
    (Fig. S3: t = -85.5 to -11.7 min), while Fig. 2(b) normalizes by A at t approx -20 min. Two of the ten markers of
    Fig. S3 show an increase (about +15% and +1%), so 'a decrease' is the median, not every embryo.
  citation: {page: 7, quote: "The amount of surface area change", where: "Supplemental Material"}
- id: q_figure_resolution
  kind: choice
  about: [fig2a_red, fig2b_red, fig2c_red, figS3_points, figS3_median]
  text: >
    The page-rendering and figure-check commands were refused in the reading session, so every figure reading is
    made at the resolution of the record's page images (110 dpi), where one pixel is about 0.009 in e/e0, 0.01 in
    A/A0, 0.0014 1/um in kappa* and 0.14% in Fig. S3; the code was developed and checked on those images, not on a
    1200 dpi render, and no overlay was inspected. The intervals include one pixel and the calibration misfit.
    A rereading at higher dpi would narrow them.
- id: q_fig4_shapes_no_axes
  kind: reading
  about: [e_ratio_early_stage, e_ratio_later_stage]
  text: >
    The measured average shapes with standard deviations (Fig. 4(f, h)) and the computed shapes (Fig. 4(g, i)) are
    drawn without axes (scaled by each embryo's diameter, centred at the centre of mass), so they cannot be read
    as values; only the printed e/e0 of the two stages is recorded. The shape data for haas2015/haas2021 therefore
    stop at these two numbers and the Fig. 2 traces.
  citation: {page: 4, quote: "embryos in an early stage", where: "Fig. 4 caption"}
- id: q_audit_e0_reference
  kind: reading
  about: [e_ratio_early_stage, e_ratio_later_stage, e_ratio_fig2a]
  text: >
    (Audit.) Fig. 2(a) normalizes e by its value e0 at t approx -10 min (p. 2), but the Fig. 4 caption
    (p. 4) gives e/e0 = 0.97 +- 0.07 and 0.49 +- 0.09 for the two stages of the averaged shapes without
    saying how e0 is taken there, and the Supplemental Material (p. 6) scales the shapes by each embryo's
    diameter just before the bend region appeared. Whether the Fig. 4 e/e0 uses the same e0 as Fig. 2(a),
    and at which times t the two stages are, is not stated; a model compared with these two numbers needs both.
    The +- is not explicitly called a standard deviation of e/e0: 'Bars indicate standard deviations' refers
    to the outlines, and the Supplemental Material averages 20 profile halves of the 10 embryos.
  citation: {page: 4, quote: "embryos in an early stage", where: "Fig. 4 caption"}
- id: q_fig4e_bend_width
  kind: reading
  about: [shell_inversion, kappa_uncontracted_fig4e, kappa_contracted_fig4e, lambda_early]
  text: >
    (Figure pass.) The red bend-region segments of Fig. 4(e), whose ends are vertical jumps of the computed
    curvature, read at 1800 dpi, run from s/R = 1.32 +- 0.03 to 1.57 +- 0.03 for the uncontracted shape (width
    about 0.25) and from 0.97 +- 0.01 to 1.57 for the contracted one (width about 0.60). The text gives
    lambda approx 0.1 pi R (about 0.31 in s/R) as the early value. Neither width equals it, so the
    lambda used for Fig. 4(d, e) is not the printed early value, or the bend region is placed differently
    than its width suggests; the panel's parameters remain unstated (q_shell_not_rerun). The contracted
    shape's posterior meridional stretch reads 0.713-0.719 in Fig. 4(d), near the r_p/R approx 0.7 of the
    contracted model.
  citation: {page: 4, printed_page: "178101-4", quote: "Asymmetry of meridio", where: "Fig. 4(e)"}
- id: q_audit_S1_wording
  kind: reading
  about: [shell_inversion]
  text: >
    (Audit.) Eq. S1 gives f_phi0 = 1 + a(2s/(pi R) - 1) for s >= pi R/2, which equals 1 (not 0) at the
    equator s = pi R/2, while the text says 'the circumferential stretch vanishes at the equator'; read
    literally only the added stretch a(2s/(pi R) - 1) vanishes there. Likewise the alternative scenario (p. 6)
    prints kappa_s0 = k > 1 'larger than the curvature of the undeformed shell', a curvature compared with a
    pure number; it reads as kR > 1 in units with R = 1. Both are kept as printed in the model's equation;
    neither changes a verdict since the shell model is not runnable.
  citation: {page: 7, quote: "Thus the circumferential stretch vanishes at the equator", where: "text after Eq. S1"}
- id: q_no_validation_haas2015
  kind: reading
  about: [shell_inversion, area_contraction_estimate, snap_speed_scaling, energy_density_eq3, median_of_points]
  text: >-
    No validation is entered between this record and haas2015 in either direction (cross-validation job
    2026-11-19). haas2015 holds no measured data (its only experimental images are micrographs, Fig. 1), so
    no model here can be tested against it. In the other direction, haas2015's runnable models (the scaled
    invagination curvature of its Eq. 3.3 and B 14, the midpoint rotation of B 18 and 3.5, the plane Lame
    disc of 2.9) give none of the quantities measured here (e/e0, A/A0, area changes, kappa* in 1/um,
    speeds); its full shell model, which would, is not runnable, like shell_inversion here
    (q_shell_not_rerun). haas2015 (p. 8) says only that no snap-through appears during invagination in this
    paper's dynamic data, a qualitative constraint, not a value a model predicts. See
    haas2015/q_no_validation_hohn2015.
  citation: {page: 3, printed_page: "178101-3", quote: "In computations, we take", where: "text below Eq. 3"}
- id: q_no_validation_haas2021
  kind: reading
  about: [shell_inversion, area_contraction_estimate, snap_speed_scaling, energy_density_eq3, median_of_points]
  text: >-
    No validation is entered between this record and haas2021 in either direction (cross-validation job
    2026-11-19). haas2021 holds no measured data. Its figures are micrographs, which carry no values, and
    model results (coefficient ratios, the strain profiles and the (k, d) diagram of its Volvox BVP). So no model
    here can be tested against it. In the other direction, haas2021 cites this paper (its ref. 7) only for
    the cell shape changes and for eps h = 0.15, and it compares none of its results with the e/e0, A/A0,
    kappa*, area-change or speed measurements recorded here. Its only model that could give them, the
    axisymmetric Volvox BVP, is not runnable (haas2021/q_volvox_not_rerun), like shell_inversion here
    (q_shell_not_rerun). See haas2021/q_no_validation_hohn2015.
  citation: {page: 3, printed_page: "178101-3", quote: "In computations, we take", where: "text below Eq. 3"}
