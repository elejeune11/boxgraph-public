id: energy_density_eq3
name: Hookean shell energy density, the integrand of Eq. 3 per area element 2 pi r0 ds, with its stretching and bending parts
role: model
stated: {page: 3, printed_page: "178101-3", quote: "the deformed shell minimizes the energy", where: "Eq. 3"}
equation: >
  E = pi E h/(1 - nu^2) int_0^{pi R} r0 (Es^2 + Ephi^2 + 2 nu Es Ephi) ds
    + pi E h^3/(12(1 - nu^2)) int_0^{pi R} r0 (Ks^2 + Kphi^2 + 2 nu Ks Kphi) ds,
  written as E = 2 pi int e r0 ds with e = e_stretch + e_bend; lengths in units of R
inputs:
  Em: {quantity: elastic_modulus_scaled, unit: dimensionless}
  eps: {quantity: thickness_to_radius, unit: dimensionless}
  nu: {quantity: poisson_ratio, unit: dimensionless}
  Es: {quantity: shell_strain, unit: dimensionless}
  Ephi: {quantity: shell_strain, unit: dimensionless}
  Ks: {quantity: curvature_strain_times_radius, unit: dimensionless}
  Kphi: {quantity: curvature_strain_times_radius, unit: dimensionless}
outputs:
  e_stretch: {quantity: shell_energy_density_scaled, unit: dimensionless}
  e_bend: {quantity: shell_energy_density_scaled, unit: dimensionless}
  e: {quantity: shell_energy_density_scaled, unit: dimensionless}
settings: {}
stochastic: false
# A helper for ModelAtlas: Eq. 3 is the energy of shell_inversion, which cannot be run. haas2021 (p. 11, ref. [7]
# = this paper) states that its classical energy density (Eq. 67) has the same structure as the energies of the
# earlier models and is that of a thin Hookean shell with nu = 1/2 and E = 3C; this model lets that be tested.
