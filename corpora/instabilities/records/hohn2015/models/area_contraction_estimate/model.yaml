id: area_contraction_estimate
name: surface area decrease if the posterior hemisphere alone contracted to radius r_p
role: model
stated: {page: 4, printed_page: "178101-4", quote: "is substantially smaller than the", where: text}
equation: "Delta A / A = (1 - (r_p/R)^2) / 2   (reconstructed: the paper prints only the result, approx 25%)"
inputs:
  rp: {quantity: posterior_radius_scaled, unit: dimensionless}
outputs:
  dA: {quantity: surface_area_decrease, unit: percent}
settings: {}
stochastic: false
reconstructed: >
  The paper states the estimate (approx 25%) but not how it was made. The stand-in takes the posterior
  hemisphere's area 2 pi R^2 to shrink to 2 pi r_p^2 (its intrinsic radius r_p) and the anterior hemisphere
  to keep 2 pi R^2, so the total 4 pi R^2 falls by (1 - (r_p/R)^2)/2, with r_p/R = 0.7 as in the model.
