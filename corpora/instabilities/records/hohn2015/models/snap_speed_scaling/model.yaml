id: snap_speed_scaling
name: snap-through speed of a Pogorelov dimple, elastic driving force against viscous resistance at the dimple edge
role: model
stated: {page: 4, printed_page: "178101-4", quote: "Hence, there is an e-independent snap", where: text}
equation: "force ~ E h^(5/2) e^(1/2) / R ; resistance ~ mu U e^(1/2) R^(1/2) ; U ~ E h^(5/2) / (mu R^(3/2))"
inputs:
  E: {quantity: elastic_modulus, unit: Pa}
  h: {quantity: shell_thickness, unit: m}
  mu: {quantity: fluid_viscosity, unit: Pa*s}
  R: {quantity: embryo_radius, unit: m}
outputs:
  U: {quantity: bend_region_speed, unit: m/s}
settings: {}
stochastic: false
prefactor: unknown
