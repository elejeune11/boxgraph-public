- {id: poisson_ratio, name: Poisson's ratio of the shell, dimension: dimensionless}
- {id: thickness_to_radius, name: shell thickness over undeformed radius (epsilon = h/R), dimension: dimensionless}
- id: bend_region_width_over_pi_radius
  name: width of the region of imposed intrinsic curvature over pi R (lambda / (pi R))
  dimension: dimensionless
- id: intrinsic_curvature_times_radius
  name: magnitude k of the imposed meridional intrinsic curvature (kappa_s^0 = -k) times the undeformed radius (k R)
  dimension: dimensionless
- id: posterior_radius_scaled
  name: intrinsic radius of the contracted posterior over the undeformed radius (r_p / R)
  dimension: dimensionless
- id: arclength_scaled
  name: arclength along the undeformed shell from the posterior pole over R (s/R)
  dimension: dimensionless
- id: meridional_stretch
  name: meridional stretch f_s = dS/ds of the deformed shell
  dimension: dimensionless
- id: meridional_curvature_times_radius
  name: meridional curvature kappa_s of the deformed shell times R
  dimension: dimensionless
- id: time_from_speedup
  name: time relative to the abrupt speed-up of the bend region's motion (t = 0 at the speed-up)
  dimension: "[time]"
- id: bend_distance_ratio
  name: distance e from the posterior pole to the bend region over its value e0 at t approx -10 min
  dimension: dimensionless
- id: surface_area_ratio
  name: surface area A of the embryo over its value A0 at t approx -20 min
  dimension: dimensionless
- id: bend_curvature
  name: most negative curvature kappa* of the traced cell sheet in the bend region
  dimension: "1/[length]"
- id: embryo_rank
  name: rank of an embryo when the embryos are sorted by the plotted value (1 = most negative)
  dimension: dimensionless
  description: "a position label for points plotted without an x value (Fig. S3); not a physical quantity"
- id: surface_area_change_before_expansion
  name: percentage change of an embryo's surface area before expansion, from the chosen initial area (negative = decrease)
  dimension: dimensionless
- id: surface_area_decrease
  name: decrease of embryo surface area as a share of its initial value (positive = decrease)
  dimension: dimensionless
- id: surface_area_increase
  name: increase of embryo surface area as a share of its initial value, at or shortly after t = 0
  dimension: dimensionless
- id: final_surface_area_fraction
  name: surface area at the end of the recorded decrease as a share of the initial area
  dimension: dimensionless
- id: bend_region_speed
  name: speed U = de/dt at which the posterior-to-bend distance decreases
  dimension: "[length]/[time]"
- id: speedup_factor
  name: factor by which the speed U increases abruptly midinversion
  dimension: dimensionless
- id: inversion_duration
  name: duration of inversion in Volvox
  dimension: "[time]"
- id: embryo_diameter
  name: initial diameter of the embryos quantified
  dimension: "[length]"
- id: embryo_radius
  name: undeformed radius R of the embryo, as a shell
  dimension: "[length]"
- id: shell_thickness
  name: thickness h of the cell sheet, as a shell
  dimension: "[length]"
- id: elastic_modulus
  name: elastic (Young's) modulus E of the cell sheet
  dimension: "[mass]/[length]/[time]**2"
- id: fluid_viscosity
  name: dynamic viscosity mu of the fluid around the embryo
  dimension: "[mass]/[length]/[time]"
- id: number_of_embryos
  name: number of embryos quantified
  dimension: dimensionless
- id: elastic_modulus_scaled
  name: elastic modulus E of Eq. 3 in a reference unit of stress
  dimension: dimensionless
- id: shell_strain
  name: shell strain Es or Ephi of Eq. 1 (stretch minus intrinsic stretch)
  dimension: dimensionless
- id: curvature_strain_times_radius
  name: curvature strain Ks or Kphi of Eq. 2 times R
  dimension: dimensionless
- id: shell_energy_density_scaled
  name: elastic energy per area element 2 pi r0 ds of Eq. 3, in the stress unit times R
  dimension: dimensionless
