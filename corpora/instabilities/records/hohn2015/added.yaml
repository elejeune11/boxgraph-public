- id: E_sheet_added
  quantity: elastic_modulus
  unit: Pa
  printed: "1000"
  basis: >
    The paper gives no elastic modulus for the cell sheet; 1 kPa is a generic order of magnitude for soft
    cell sheets, chosen only so that the scaling U ~ E h^(5/2)/(mu R^(3/2)) can be evaluated. With the prefactor
    unknown, the implied prefactor scales as 1/E.
  alternatives: ["100", "10000", "100000"]
  stands_for: E in U ~ E h^(5/2)/(mu R^(3/2)) (p. 4)
- id: mu_fluid_added
  quantity: fluid_viscosity
  unit: Pa*s
  printed: "1 x 10^-3"
  basis: >
    The paper names the fluid viscosity mu but gives no value; water near room temperature (the culture is at
    22-24 degC, p. 2). The fluid in the embryonic vesicle is not characterised and may be more viscous.
  alternatives: ["1 x 10^-2", "1 x 10^-1"]
  stands_for: mu in U ~ E h^(5/2)/(mu R^(3/2)) (p. 4)
- id: R_embryo_added
  quantity: embryo_radius
  unit: um
  printed: "50"
  basis: Half the middle of the printed initial diameters, approx 70-130 um (p. 2); the paper gives no R for the scaling
  alternatives: ["35", "65"]
  stands_for: R in U ~ E h^(5/2)/(mu R^(3/2)) (p. 4)
- id: h_sheet_added
  quantity: shell_thickness
  unit: um
  printed: "7.5"
  basis: The model's h/R = 0.15 (p. 3) times the added R = 50 um; the paper gives no measured sheet thickness
  alternatives: ["5", "10", "15"]
  stands_for: h in U ~ E h^(5/2)/(mu R^(3/2)) (p. 4)
