notes: >
  PDF pages 1-5 are the letter, 6-7 the Supplemental Material. A mostly experimental letter: light-sheet
  imaging of type-B inversion in V. globator, with a quasistatic elastic shell model (Eqs. 1-3) and a scaling
  argument for the snap-through speed. Its value for this corpus is the measured data that haas2015 and
  haas2021 are compared with. Recorded as data: the printed model parameters (nu = 1/2, h/R = 0.15,
  lambda approx 0.1 pi R, kR approx 10-20 and approx 20, r_p/R approx 0.7); the measured shapes, e/e0 = 0.97 +- 0.07
  (early) and 0.49 +- 0.09 (later stage), standard deviations over 10 embryos; the timing and area changes
  (speed-up approx 5x to U approx 0.03 um/s, area -10%, +20-30%, to approx 55%, approx 2.5% after the bend forms); and,
  read by code, the representative embryo's e/e0, A/A0 and kappa* against time (Fig. 2, red lines) and the
  ten per-embryo initial area changes of Fig. S3 with their drawn median. Models: the shell model (Eqs. 1-3,
  S1) is entered but not runnable (q_shell_not_rerun); the approx 25% area decrease expected from contraction
  alone is reconstructed as (1 - (r_p/R)^2)/2 = 25.5% (no verdict: printed with ~); the snap-through scaling
  U ~ E h^(5/2)/(mu R^(3/2)) has no prefactor and its E and mu are not given, so it is run with added values and
  only an implied prefactor results (q_snap_inputs); the median of the Fig. S3 markers is checked against
  the drawn median line. Figure readings are at 110 dpi because the rendering and figure-check commands were
  refused (q_figure_resolution). Left out: Fig. 1 (micrographs, renderings), Fig. 3 (sketches), Fig. 4(a-c,
  f-i), S1, S2 (shapes without axes), Fig. 4(d, e) (computed strain and curvature profiles of the unrunnable
  shell model in two small panels whose two same-colour blue curves cross and differ only in line weight at
  the available resolution; their parameters are not fully stated), the other nine embryos' lines in Fig. 2
  (not distinguishable), the imaging settings (laser, camera, intervals 20-300 s), culture conditions, and the
  tracing error of kappa* (< 5%, noted on the datum).
  A second figure pass (2026-11-19), with rendering available, kept the 110-dpi readings and added
  checked high-resolution readings: Fig. 2(a-c) red lines every minute at 1100 dpi, Fig. S3 markers and
  median line at 1000 dpi (with its own median check), and the computed f_s and kappa_s R profiles of
  Fig. 4(d, e) for both shapes at 1800 dpi (predicted; no runnable model produces them here, and their bend
  region widths do not match the printed lambda, q_fig4e_bend_width). See figures.md.
