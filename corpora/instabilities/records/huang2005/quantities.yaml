- {id: youngs_modulus_ratio, name: film to substrate Young's modulus ratio, dimension: dimensionless, description: "E/Es (written E1/E2 once, p. 15)"}
- {id: plane_strain_modulus_ratio, name: film to substrate plane-strain modulus ratio, dimension: dimensionless, description: "E_bar/Es_bar with E_bar = E/(1 - nu^2), Es_bar = Es/(1 - nu_s^2)"}
- {id: film_poisson_ratio, name: Poisson's ratio of the film, dimension: dimensionless, description: "nu"}
- {id: substrate_poisson_ratio, name: Poisson's ratio of the substrate, dimension: dimensionless, description: "nu_s"}
- {id: substrate_to_film_thickness_ratio, name: substrate to film thickness ratio, dimension: dimensionless, description: "H/h"}
- {id: substrate_thickness_times_wavenumber, name: substrate thickness times wave number, dimension: dimensionless, description: "kH, the dimensionless substrate thickness of Fig. 3"}
- {id: substrate_stiffness_g, name: dimensionless substrate stiffness, dimension: dimensionless, description: "g in T3 = g Es_bar k w (Eq. 10)"}
- {id: wavelength_to_film_thickness_ratio, name: equilibrium wrinkle wavelength over film thickness, dimension: dimensionless, description: "lambda_eq/h"}
- {id: critical_membrane_force_normalized, name: critical membrane force normalized by the film's plane-strain stiffness, dimension: dimensionless, description: "N_c/(h E_bar) = f_min"}
- {id: critical_membrane_strain, name: critical isotropic membrane strain, dimension: dimensionless, description: "eps_c, magnitude of eps011 = eps022 at the onset of wrinkling under isotropic biaxial strain"}
- {id: normalized_wrinkle_amplitude, name: normalized equilibrium wrinkle amplitude, dimension: dimensionless, description: "A_eq / (h sqrt(|N011|/N_c - 1)), the ordinate of Fig. 5's bottom row"}
- {id: membrane_force_over_critical, name: initial membrane force over the critical force, dimension: dimensionless, description: "|N011|/N_c"}
- {id: rms_deflection_over_film_thickness, name: RMS deflection over film thickness, dimension: dimensionless, description: "RMS/h, Eq. 29"}
- {id: imposed_membrane_strain, name: imposed isotropic membrane strain, dimension: dimensionless, description: "eps011 = eps022 in the flat state (negative in compression)"}
- {id: average_wavenumber_ratio, name: average wave number of a simulated pattern over the stripe equilibrium wave number, dimension: dimensionless, description: "k_bar/k_eq, k_bar from Eq. 28"}
- {id: film_thickness, name: film thickness, dimension: "[length]", description: "h"}
- {id: wrinkle_wavelength, name: equilibrium wrinkle wavelength, dimension: "[length]", description: "lambda_eq"}
- {id: amplitude_over_film_thickness, name: equilibrium wrinkle amplitude over film thickness, dimension: dimensionless, description: "A_eq/h, the ordinate of the top panels of Figs. 10 and 11"}
