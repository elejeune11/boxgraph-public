    opening angles against d/R (Figs. 4F-I, 6B), fold-number histograms (Fig. 5F), growth curves and
    intensity profiles. None is an output of a model here. This record's models give the wavelength,
    critical membrane force and amplitude of wrinkles in a flat film bonded to an elastic substrate (Eqs.
    10-19), which pulls the film back on both sides of a wrinkle. In trushko2020 the epithelium sits on the
    inside of a thin alginate shell and folds inward into a fluid lumen, so nothing elastic lies behind the
    folds, and the capsule is a one-sided outer constraint, not a bonded foundation. The capsule is also a
    thin shell (a few um to tens of um thick, radius about 100 um), not a thick substrate or a layer on a
    rigid support. The fold count does not come from a selected wavelength: trushko2020 finds that the
    energy grows sublinearly with the number of folds, so one fold is favoured at small excess strain (p. 33,
    "the shape with overall minimal energy has one fold for small excess strain"). Its threshold is set by
    the curvature through K/(lambda R^2), and this record's models have no curvature. Treating the capsule
    or the lumen as an effective foundation would be a new model, not a substitution of inputs, and this
    job may not write one. The same reasoning is in trushko2020's relations.yaml for cerda2003, tallinen2015
