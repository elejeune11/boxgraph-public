    2026-11-19). Neither paper cites the other, and trushko2020 never mentions wrinkling of a film on a
    substrate. huang2005 prints no measurements (its figure data are its own predictions), so trushko2020's
    ring models have nothing here to predict. trushko2020's measurements are capsule moduli, thicknesses
