id: thin_incompressible_eq19
name: thin incompressible substrate limit of the sinusoidal wrinkles (Eq. 19)
role: model
stated: {page: 8, printed_page: "2108", quote: "incompressible, for the thin-substrate limit, we obtain that", where: Eq. 19}
equation: >-
  lambda_eq/(2 pi h) = sqrt(H/h) (E_bar/(18 Es_bar))^(1/6); N_c/(h E_bar) = (h/(4H)) (9 Es_bar/(4 E_bar))^(1/3);
  A_eq/h = sqrt((1/2)(|N011|/N_c - 1))
inputs:
  Ebar_over_Esbar: {quantity: plane_strain_modulus_ratio, unit: dimensionless}
  H_over_h: {quantity: substrate_to_film_thickness_ratio, unit: dimensionless}
outputs:
  lam_over_h: {quantity: wavelength_to_film_thickness_ratio, unit: dimensionless}
  Nc_over_hE: {quantity: critical_membrane_force_normalized, unit: dimensionless}
  amp_coeff: {quantity: normalized_wrinkle_amplitude, unit: dimensionless, description: "A_eq / (h sqrt(|N011|/N_c - 1)) = sqrt(1/2) in Eq. 19"}
settings: {}
stochastic: false
