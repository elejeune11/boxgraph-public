id: g_eq10
name: dimensionless substrate stiffness g of a layer on a rigid support (Eq. 10)
role: model
stated: {page: 5, printed_page: "2105", quote: "We solve the boundary value problem of the elastic field in the substrate", where: Eq. 10}
equation: "g(kH, nu_s) = [(3 - 4 nu_s) cosh(2kH) + 5 - 12 nu_s + 8 nu_s^2 + 2(kH)^2] / [(6 - 8 nu_s) sinh(2kH) - 4kH]"
inputs:
  kH: {quantity: substrate_thickness_times_wavenumber, unit: dimensionless}
  nu_s: {quantity: substrate_poisson_ratio, unit: dimensionless}
outputs:
  g: {quantity: substrate_stiffness_g, unit: dimensionless}
settings: {}
stochastic: false
