id: isotropic_critical_strain
name: critical membrane strain under an isotropic biaxial strain
role: model
stated: {page: 4, printed_page: "2104", quote: "are the initial membrane forces", where: "definition of N011 after Eq. 7"}
from_words: true
equation: "N011 = h E_bar (eps011 + nu eps022); with eps011 = eps022 = -eps_c at onset, |N011| = N_c gives eps_c = (N_c/(h E_bar)) / (1 + nu)"
inputs:
  Nc_over_hE: {quantity: critical_membrane_force_normalized, unit: dimensionless}
  nu: {quantity: film_poisson_ratio, unit: dimensionless}
outputs:
  eps_c: {quantity: critical_membrane_strain, unit: dimensionless}
settings: {}
stochastic: false
