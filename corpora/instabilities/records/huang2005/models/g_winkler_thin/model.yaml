id: g_winkler_thin
name: Winkler (thin compressible substrate) limit of the substrate stiffness g
role: model
stated: {page: 7, printed_page: "2107", quote: "Winkler model is consistent with Eq. (10), which gives the limit", where: "text after Eq. 17"}
equation: "g(kH, nu_s) -> [(1 - nu_s)^2 / (1 - 2 nu_s)] (kH)^-1 as kH -> 0"
inputs:
  kH: {quantity: substrate_thickness_times_wavenumber, unit: dimensionless}
  nu_s: {quantity: substrate_poisson_ratio, unit: dimensionless}
outputs:
  g: {quantity: substrate_stiffness_g, unit: dimensionless}
settings: {}
stochastic: false
