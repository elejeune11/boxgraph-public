id: postbuckling_eq16
name: equilibrium amplitude and wavelength against the membrane force (Eq. 16 with Eqs. 10, 13)
role: model
stated: {page: 7, printed_page: "2107", quote: "The critical membrane force for the onset of the wrinkles is", where: "Eq. 16"}
equation: >-
  A_eq = (2/k_eq) sqrt((|N011| - N_c)/(E_bar h)), with k_eq minimizing f(kh) (Eq. 13, g from Eq. 10) and
  N_c = h E_bar f_min; lambda_eq = 2 pi / k_eq, independent of the membrane force
inputs:
  Ebar_over_Esbar: {quantity: plane_strain_modulus_ratio, unit: dimensionless}
  H_over_h: {quantity: substrate_to_film_thickness_ratio, unit: dimensionless}
  nu_s: {quantity: substrate_poisson_ratio, unit: dimensionless}
  N_over_Nc: {quantity: membrane_force_over_critical, unit: dimensionless}
outputs:
  A_over_h: {quantity: amplitude_over_film_thickness, unit: dimensionless}
  lam_over_h: {quantity: wavelength_to_film_thickness_ratio, unit: dimensionless}
settings: {n_grid: 561}
built_from: [sinusoidal_finite_substrate]
stochastic: false
