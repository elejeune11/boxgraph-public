id: sinusoidal_finite_substrate
name: sinusoidal wrinkles of a film on a substrate of finite thickness (Eqs. 10, 13, 16)
role: model
stated: {page: 7, printed_page: "2107", quote: "The equilibrium wrinkles select the wave number keq that minimizes the function", where: "Eqs. 13, 15, 16"}
equation: >-
  f = (kh)^2/12 + g Es_bar / ((kh) E_bar) (Eq. 13), g = g(kH, nu_s) (Eq. 10); k_eq minimizes f;
  N_c = h E_bar f_min; lambda_eq = 2 pi / k_eq; A_eq = (2/k_eq) sqrt((|N011| - N_c)/(E_bar h)) (Eq. 16)
inputs:
  Ebar_over_Esbar: {quantity: plane_strain_modulus_ratio, unit: dimensionless}
  H_over_h: {quantity: substrate_to_film_thickness_ratio, unit: dimensionless}
  nu_s: {quantity: substrate_poisson_ratio, unit: dimensionless}
outputs:
  lam_over_h: {quantity: wavelength_to_film_thickness_ratio, unit: dimensionless}
  Nc_over_hE: {quantity: critical_membrane_force_normalized, unit: dimensionless}
  amp_coeff: {quantity: normalized_wrinkle_amplitude, unit: dimensionless}
settings: {n_grid: 561}
built_from: [g_eq10]
stochastic: false
