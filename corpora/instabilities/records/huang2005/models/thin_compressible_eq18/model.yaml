id: thin_compressible_eq18
name: thin compressible substrate (Winkler) limit of the sinusoidal wrinkles (Eq. 18)
role: model
stated: {page: 7, printed_page: "2107", quote: "For this thin-substrate limit, we obtain that", where: Eq. 18}
equation: >-
  lambda_eq/(2 pi h) = [H E_bar (1 - 2 nu_s) / (12 h Es_bar (1 - nu_s)^2)]^(1/4);
  N_c/(h E_bar) = [h Es_bar (1 - nu_s)^2 / (3 H E_bar (1 - 2 nu_s))]^(1/2); A_eq/h = sqrt((2/3)(|N011|/N_c - 1))
inputs:
  Ebar_over_Esbar: {quantity: plane_strain_modulus_ratio, unit: dimensionless}
  H_over_h: {quantity: substrate_to_film_thickness_ratio, unit: dimensionless}
  nu_s: {quantity: substrate_poisson_ratio, unit: dimensionless}
outputs:
  lam_over_h: {quantity: wavelength_to_film_thickness_ratio, unit: dimensionless}
  Nc_over_hE: {quantity: critical_membrane_force_normalized, unit: dimensionless}
  amp_coeff: {quantity: normalized_wrinkle_amplitude, unit: dimensionless, description: "A_eq / (h sqrt(|N011|/N_c - 1)) = sqrt(2/3) in Eq. 18"}
settings: {}
stochastic: false
