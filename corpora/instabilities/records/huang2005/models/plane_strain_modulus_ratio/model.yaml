id: plane_strain_modulus_ratio
name: ratio of plane-strain moduli of film and substrate
role: processing
stated: {page: 5, printed_page: "2105", quote: "Young's modulus E s , and", where: "definitions after Eq. 2 (p. 4) and before Eq. 10 (p. 5)"}
equation: "E_bar = E/(1 - nu^2); Es_bar = Es/(1 - nu_s^2); E_bar/Es_bar = (E/Es)(1 - nu_s^2)/(1 - nu^2)"
inputs:
  E_over_Es: {quantity: youngs_modulus_ratio, unit: dimensionless}
  nu: {quantity: film_poisson_ratio, unit: dimensionless}
  nu_s: {quantity: substrate_poisson_ratio, unit: dimensionless}
outputs:
  Ebar_over_Esbar: {quantity: plane_strain_modulus_ratio, unit: dimensionless}
settings: {}
stochastic: false
