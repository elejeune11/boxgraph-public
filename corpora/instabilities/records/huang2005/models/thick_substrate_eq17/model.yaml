id: thick_substrate_eq17
name: thick-substrate limit of the sinusoidal wrinkles (Eq. 17)
role: model
stated: {page: 7, printed_page: "2107", quote: "we reproduce the thick-substrate limits", where: Eq. 17}
equation: "lambda_eq/(2 pi h) = (E_bar/(3 Es_bar))^(1/3); N_c/(h E_bar) = (1/4)(3 Es_bar/E_bar)^(2/3); A_eq/h = sqrt(|N011|/N_c - 1)"
inputs:
  Ebar_over_Esbar: {quantity: plane_strain_modulus_ratio, unit: dimensionless}
outputs:
  lam_over_h: {quantity: wavelength_to_film_thickness_ratio, unit: dimensionless}
  Nc_over_hE: {quantity: critical_membrane_force_normalized, unit: dimensionless}
  amp_coeff: {quantity: normalized_wrinkle_amplitude, unit: dimensionless, description: "A_eq / (h sqrt(|N011|/N_c - 1)), equal to 1 in Eq. 17"}
settings: {}
stochastic: false
