- id: schwarz2020
  file: corpus/cardio/2020_Schwarz.pdf
  pages: [1, 15]
  note: Schwarz, van Lier, van den Wijngaard, Siebes & VanBavel 2020, Front Physiol 10:1611, doi 10.3389/fphys.2019.01611.
    Human left coronary arterial tree from a cryomicrotome (202,184 segments, 30 um to 4 mm); network
    hemodynamics by Poiseuille and Kirchhoff with the Pries diameter-dependent viscosity at Hd 0.4; inlet
    90 mmHg, capillary 20 mmHg. Its released data are the record schwarz_data.
  relate_with: [pries1992, pries2005, pries1990, olufsen2000, olufsen2012]
- id: schwarz_data
  kind: software
  file: corpus/cardio/code/schwarz_data
  papers: [schwarz2020]
  url: https://doi.org/10.34894/XYF65X
  note: >-
    The released data of schwarz2020 (DataverseNL, doi 10.34894/XYF65X; CC0 on the repository, CC BY 4.0 in
    the data guide): the network itself, 'Human Left Coronary graph.mat' (MATLAB 5 file holding the struct
    TreeQ described in the guide; downloaded from the repository, SHA-1
    7be3d8143761272d9d963952daf7b17bf5985185), the three hemodynamics tables (hemodynamics_hum06.xlsx,
    hemodynamics_in-silicoHighP.xlsx, hemodynamics_in-silicoHum6P.xlsx), the authors' DemonstrationCode.m,
    MANIFEST.TXT and 'Schwarz-2019 explanation of data.docx' (explanation_of_data.txt is our plain-text copy of
    it, for reading). Data plus a short MATLAB demonstration, attached as software because the pipeline takes a
    folder only that way; cite values by file and sheet/cell, file and lines, or the .mat field path. Not
    included: the skeleton, Gdistal variations.xlsx, final_tree_bifurcation_summary_all-ld.xlsx, Topology
    data.xlsx and termseg_density.xlsx. With the network, the pressure and flow solution (Poiseuille and
    Kirchhoff, Pries viscosity, 90 and 20 mmHg) can be rerun on the released tree with scipy.io.loadmat.

