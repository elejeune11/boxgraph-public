- id: schwarz_data
  kind: software
  file: corpus/cardio/code/schwarz_data
  papers: [schwarz2020]
  url: https://doi.org/10.34894/XYF65X
  relate_with: [kassab1993, chilian1986, spaan1981, kim2010, mynard2014, mynard2015, olufsen1999, olufsen2012]
  note: >-
    The released data of schwarz2020 (DataverseNL, doi 10.34894/XYF65X; CC0 on the repository, CC BY 4.0 in
    the data guide): the network itself, 'Human Left Coronary graph.mat' (MATLAB 5 file holding the struct
    TreeQ described in the guide; downloaded from the repository, SHA-1
    7be3d8143761272d9d963952daf7b17bf5985185), the three hemodynamics tables (hemodynamics_hum06.xlsx,
    hemodynamics_in-silicoHighP.xlsx, hemodynamics_in-silicoHum6P.xlsx), the authors' DemonstrationCode.m,
    MANIFEST.TXT and 'Schwarz-2019 explanation of data.docx' (explanation_of_data.txt is our plain-text copy of
    it, for reading). Data plus a short MATLAB demonstration, attached as software because the pipeline takes a
    folder only that way; cite values by file and sheet/cell, file and lines, or the .mat field path. The rest
    of the release was added later, each file downloaded from the repository and checked against its SHA-1:
    'Human Left Coronary skeleton.txt' (the raw skeleton, 3,913,549 centre points in 288,198 segments, with the
    LAD, LCX and RCA; the paper analyses LAD and LCX), 'Topology data.xlsx', 'final_tree_bifurcation_summary_
    all-ld.xlsx' (branching statistics, Figs. 2-4), 'Gdistal variations.xlsx' (the stochastic downstream
    conductances, Table 2) and termseg_density.xlsx. Only the release's copy of the paper PDF is left out.
    The network solution (Poiseuille and Kirchhoff, Pries viscosity, 90 and 20 mmHg) can be rerun on the
    released tree with scipy.io.loadmat.

