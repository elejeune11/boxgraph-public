# mapping: b's input symbol -> expression in a's input symbols, numbers in each model's port units
- id: rel_systemic_approx_westkessel_part_max
  kind: approximated_by
  a: shi_cellml_systemic/systemic_left_heart
  b: shi_cellml_westkessel/westkessel_left_heart
  mapping: &heart_and_afterload
    ElaMax: "ElaMax"
    ElaMin: "ElaMin"
    PlaIni: "PlaIni"
    VlaIni: "VlaIni"
    ElvMax: "ElvMax"
    ElvMin: "ElvMin"
    PlvIni: "PlvIni"
    VlvIni: "VlvIni"
    T: "T"
    Tpwb: "Tpwb"
    Tpww: "Tpww"
    Ts1: "Ts1"
    Ts2: "Ts2"
    CVao: "CVao"
    CVmi: "CVmi"
    Vlv0: "Vlv0"
    Vla0: "Vla0"
    Rc: "Rsas + Rsat + Rsar + Rscp"
    Rv: "Rsvn"
    Cv: "Csvn"
    P0v: "P0svn"
    pi: "pi"
  output_map: {P_art_max: P_sas_max}
  regime: &regime
    ElaMax: [0.2, 0.3]
    ElaMin: [0.12, 0.18]
    PlaIni: [0.8, 1.2]
    VlaIni: [3.2, 4.8]
    ElvMax: [2.0, 3.0]
    ElvMin: [0.08, 0.12]
    PlvIni: [0.8, 1.2]
    VlvIni: [4, 6]
    T: [0.9, 1.1]
    Tpwb: [0.9, 0.94]
    Tpww: [0.08, 0.1]
    Ts1: [0.28, 0.32]
    Ts2: [0.43, 0.47]
    CVao: [300, 400]
    CVmi: [350, 450]
    Vlv0: [400, 600]
    Vla0: [15, 25]
    Rsas: [0.0024, 0.0036]
    Csas: [0.005, 0.01]
    Lsas: [0.003, 0.01]
    P0sas: [80, 120]
    Q0sas: [0, 0]
    Rsat: [0.04, 0.06]
    Csat: [0.005, 0.01]
    Lsat: [0.003, 0.01]
    P0sat: [80, 120]
    Q0sat: [0, 0]
    Rsar: [0.4, 0.6]
    Rscp: [0.42, 0.62]
    Rsvn: [0.06, 0.09]
    Csvn: [16, 25]
    P0svn: [0, 5]
    pi: [3.14159, 3.14159]
  tolerance: 0.05
  assumptions: &assumptions
    - "the exact relation is a limit (Csas, Csat, Lsas, Lsat -> 0): the sinus and artery nodes then store no volume and carry no inertia, Qsas = Qsat = Qao, and Sas.Pi = Psvn + (Rsas + Rsat + Rsar + Rscp) Qao, which is the Westkessel valve-into-Zc loop with Zc.Pi = Sas.Pi"
    - "the limit cannot be tested numerically with the ports as written: at their fixed RK4 step (dt = 0.1 ms) the systemic model goes unstable (NaN) once these compliances and inertances fall to about 1e-3 or below; the regime therefore samples small but stable values (C 0.005-0.01 mL/mmHg, L 0.003-0.01 mmHg s^2/mL), well below the code's Csat = 1.6 and so not the released parameter set, and the relation is an approximation within the tolerance"
    - "in that regime the peak aortic valve flow does not settle (it chatters as the sinus compliance shrinks), so only pressure and stroke volume are related"
    - "P0v = P0svn: the initial pressures of the vanishing compliances carry no volume in the limit; the initial inertance flows Q0sas, Q0sat have no counterpart"
  provenance: proposed
  reason: &reason >
    Neither code states a relation to the other. The two CellML workspaces share the left-heart files
    (ModelLeftHeart, TempCDa, TempCDv, EAtrium, EVentricle) line for line, and the Westkessel afterload
    is built from the same TempR and TempRC components as the systemic arteriole, capillary and vein
    segments. With the aortic sinus and artery compliances and inertances negligible, the five-segment
    systemic loop is a characteristic resistance Rsas + Rsat + Rsar + Rscp in series with the vein's
    parallel Csvn and Rsvn draining to the left atrium: the three-element Westerhof afterload of
    MainWestkessel. shi2018 shows both as Fig. 1(b) and Fig. 1(c) but does not state this reduction.
    The relation is between the models, not their parameter values (q_westkessel_values: Rc, Rv, Cv are
    not lumped sums of the systemic segments).
- id: rel_systemic_approx_westkessel_sv
  kind: approximated_by
  a: shi_cellml_systemic/systemic_left_heart
  b: shi_cellml_westkessel/westkessel_left_heart
  mapping: *heart_and_afterload
  output_map: {SV: SV}
  regime: *regime
  tolerance: 0.03
  assumptions: *assumptions
  provenance: proposed
  reason: *reason
- id: rel_westkessel_reduces_to_windkessel_sv
  kind: reduces_to
  a: shi_cellml_westkessel/westkessel_left_heart
  b: shi_cellml_windkessel/windkessel_left_heart
  mapping: &wk_mapping
    ElaMax: "ElaMax"
    ElaMin: "ElaMin"
    PlaIni: "PlaIni"
    VlaIni: "VlaIni"
    ElvMax: "ElvMax"
    ElvMin: "ElvMin"
    PlvIni: "PlvIni"
    VlvIni: "VlvIni"
    T: "T"
    Tpwb: "Tpwb"
    Tpww: "Tpww"
    Ts1: "Ts1"
    Ts2: "Ts2"
    CVao: "CVao"
    CVmi: "CVmi"
    Vlv0: "Vlv0"
    Vla0: "Vla0"
    Cwk: "Cv"
    Rwk: "Rv"
    P0: "P0v"
    pi: "pi"
  limit: {Rc: "0"}
  output_map: {SV: SV}
  regime: &wk_regime
    ElaMax: [0.2, 0.3]
    ElaMin: [0.12, 0.18]
    PlaIni: [0.8, 1.2]
    VlaIni: [3.2, 4.8]
    ElvMax: [2.0, 3.0]
    ElvMin: [0.08, 0.12]
    PlvIni: [0.8, 1.2]
    VlvIni: [4, 6]
    T: [0.9, 1.1]
    Tpwb: [0.9, 0.94]
    Tpww: [0.08, 0.1]
    Ts1: [0.28, 0.32]
    Ts2: [0.43, 0.47]
    CVao: [300, 400]
    CVmi: [350, 450]
    Vlv0: [400, 600]
    Vla0: [15, 25]
    Rc: [0.004, 0.006]
    Rv: [0.5, 0.7]
    Cv: [2.4, 3.0]
    P0v: [0, 5]
    pi: [3.14159, 3.14159]
  tolerance: 0.001
  assumptions: &wk_assumptions
    - "as Rc -> 0 the characteristic resistance Zc (TempR: Pi = Po + R Qi) carries no pressure drop, Zc.Pi = Zv.Pi, and the aortic valve flow CV sqrt(Plv - Zc.Pi) becomes CV sqrt(Plv - Pv): the Westkessel afterload is then the two-element Windkessel TempRC with C = Cv, R = Rv, P0 = P0v"
    - "both ports use the same RK4 scheme at the same dt and t_end, so the limit is exact up to round-off; the Westkessel port's closed-form valve-into-Zc solution is regular at Rc = 0"
  provenance: proposed
  reason: &wk_reason >
    Neither code states a relation to the other, but the two CellML workspaces share the left-heart
    files (ModelLeftHeart, TempCDa, TempCDv, EAtrium, EVentricle) line for line (shi_cellml_westkessel
    notes), and the Westkessel afterload (ModelWestkessel: Zc = TempR in series with Zv = TempRC) is the
    Windkessel afterload (ModelWindKessel: Zwk = TempRC) with the characteristic resistance Zc added
    upstream. Removing Zc (Rc -> 0) gives the Windkessel model with Cwk = Cv, Rwk = Rv, P0 = P0v.
    shi2018 shows the two as Fig. 1(a) and Fig. 1(b) but does not state the reduction. The relation is
    between the models, not their parameter values (the codes' Rv = 0.65, Cv = 2.6 differ from
    R = 0.55, C = 2.8; q_westkessel_values).
