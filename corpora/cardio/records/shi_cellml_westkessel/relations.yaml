  tolerance: 0.1
  assumptions: &kor_assumptions
    - "the lumping is ours: Rc = Rsas (the aortic sinus segment as the characteristic resistance), Rv = Rsat + Rsar + Rscp + Rsvn (the rest of the systemic resistance, aorta to atrium), Cv = Csas + Csat (the arterial compliance, as in shi_cellml_windkessel's rel_windkessel_approximates_korakianitis); neither source prints Rc, Rv or Cv, and the code's Rc = 0.005, Rv = 0.65, Cv = 2.6 are not these sums (q_westkessel_values)"
    - "a's inertances Lsas, Lsat, its venous compliance Csvn, and its whole right heart and pulmonary loop have no counterpart in b; P0v is mapped to a's initial sinus pressure Psas_init"
    - "timings are mapped as fractions of T, as the code uses them; T is held at 1 s because a reports the cycle [10 s, 11 s) and b the cycle [t_end - T, t_end] = [9 s, 10 s], both in steady state at T = 1 s; the regime keeps Tpwb + Tpww >= T, which the code's atrial activation assumes"
    - "pi is mapped to the constant pi; the code writes 3.14159 (q_pi)"
    - "the tolerance (10%) is ours, as in the Windkessel relation"
    - "initial volumes map one to one (Vlv0 = Vlv_init, Vla0 = Vla_init, P0v = Psas_init); b's closed loop holds only LA, LV and Cv, so the volume that a spreads over its venous (Csvn) and pulmonary compartments has no place in b and its circulating volume differs from a's: the large error found is expected from this truncation"
  provenance: proposed
  reason: &kor_reason >
    No source states this relation; the code cites korakianitis2006 only for its parameter values
    (data.yaml from_datum). The code's left heart repeats korakianitis2006's chamber law (Eqs. 1, 4),
    its on-off valves (Eqs. 6-7, the Section 3.1 simplified model) and the ventricular activation that
    korakianitis2006's record takes as the evident correction of Eq. 3, which is why a is the on-off,
    corrected model. It truncates the rest: no right heart or pulmonary loop, and the systemic loop
    (R-L-C sinus and artery, resistive arteriole and capillary, R-C vein; Eqs. 15-20) lumped into a
    three-element Westerhof afterload (Rc, then Cv parallel to Rv) that returns to the left atrium.
    No limit of a's parameters gives b (removing the pulmonary loop and venous compliance is a change
    of circuit, not a limit), so the relation is an approximation, tested around korakianitis2006's
    printed parameters (+-10%).
