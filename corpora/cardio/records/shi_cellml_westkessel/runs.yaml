- id: run_westkessel_code_values
  model: westkessel_left_heart
  inputs:
    ElaMax: ElaMax_code
    ElaMin: ElaMin_code
    PlaIni: PlaIni_code
    VlaIni: VlaIni_code
    ElvMax: ElvMax_code
    ElvMin: ElvMin_code
    PlvIni: PlvIni_code
    VlvIni: VlvIni_code
    T: T_code
    Tpwb: Tpwb_code
    Tpww: Tpww_code
    Ts1: Ts1_code
    Ts2: Ts2_code
    CVao: CVao_code
    CVmi: CVmi_code
    Vlv0: Vlv0_code
    Vla0: Vla0_code
    Rc: Rc_code
    Rv: Rv_code
    Cv: Cv_code
    P0v: P0v_code
    pi: pi_code_ventricle
  settings: {dt: 0.0001, t_end: 10.0}
  outputs:
    P_lv_max: wst_plv_max
    P_lv_min: wst_plv_min
    P_art_max: wst_part_max
    P_art_min: wst_part_min
    V_lv_max: wst_vlv_max
    V_lv_min: wst_vlv_min
    SV: wst_sv
    Q_ao_mean: wst_qao_mean
    Q_mi_mean: wst_qmi_mean
    Q_ao_peak: wst_qao_peak
    Q_mi_peak: wst_qmi_peak
  note: >
    All inputs as written in the code. Solver settings are ours (the CellML holds none): classical
    RK4, dt = 0.1 ms, 10 s simulated from the code's initial values, results over the 10th beat
    (the cycle is periodic to < 0.01% by then; see q_solver and the refinements).
