# shi2018 prints results only for its Fig. 1(d) model (full circulation); the code is its Fig. 1(b)
# reduction (three-element Westerhof afterload, no pulmonary loop). These comparisons judge how
# closely the reduced model, run as released, approximates the printed Fig. 1(d) results. A miss is
# a finding about the reduction and its parameters, not a failed reproduction of a printed result.
- {id: cmp_plv_max, purpose: approximation, computed: wst_plv_max, printed: lv_pressure_max_shi2018, conditions_ok: "Fig. 1(b) reduction of the Fig. 1(d) model, same heart parameters"}
- {id: cmp_plv_min, purpose: approximation, computed: wst_plv_min, printed: lv_pressure_min_shi2018, conditions_ok: "Fig. 1(b) reduction of the Fig. 1(d) model, same heart parameters"}
- {id: cmp_part_max, purpose: approximation, computed: wst_part_max, printed: arterial_pressure_max_shi2018, conditions_ok: "Fig. 1(b) reduction of the Fig. 1(d) model; the pressure at the afterload inlet (upstream of Rc) stands for the arterial pressure"}
- {id: cmp_part_min, purpose: approximation, computed: wst_part_min, printed: arterial_pressure_min_shi2018, conditions_ok: "Fig. 1(b) reduction of the Fig. 1(d) model; the pressure at the afterload inlet (upstream of Rc) stands for the arterial pressure"}
- {id: cmp_qao_mean, purpose: approximation, computed: wst_qao_mean, printed: mean_flow_shi2018, conditions_ok: "Fig. 1(b) reduction of the Fig. 1(d) model", note: "printed as about 5 L/min: no verdict"}
- {id: cmp_qmi_mean, purpose: approximation, computed: wst_qmi_mean, printed: mean_flow_shi2018, conditions_ok: "Fig. 1(b) reduction of the Fig. 1(d) model", note: "printed as about 5 L/min: no verdict"}
- {id: cmp_qao_peak, purpose: approximation, computed: wst_qao_peak, printed: peak_aortic_flow_shi2018, conditions_ok: "Fig. 1(b) reduction of the Fig. 1(d) model", note: "printed as about 1000 mL/s: no verdict"}
- {id: cmp_qmi_peak, purpose: approximation, computed: wst_qmi_peak, printed: peak_mitral_flow_shi2018, conditions_ok: "Fig. 1(b) reduction of the Fig. 1(d) model", note: "printed as about 800 mL/s: no verdict"}
- {id: cmp_vlv_max, purpose: approximation, computed: wst_vlv_max, printed: lv_volume_max_shi2018, conditions_ok: "Fig. 1(b) reduction of the Fig. 1(d) model, same heart parameters"}
- {id: cmp_vlv_min, purpose: approximation, computed: wst_vlv_min, printed: lv_volume_min_shi2018, conditions_ok: "Fig. 1(b) reduction of the Fig. 1(d) model, same heart parameters"}
