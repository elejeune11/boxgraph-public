id: network_1d
name: nonlinear 1-D model of the 37-artery silicone network, purely elastic or Voigt visco-elastic (Eqs. 1, 5)
role: model
stated: {page: 2, printed_page: '2251', quote: Conservation of mass and momentum applied to a 1-D impermeable, where: 'Eqs. 1-5, Section 2.2, Table 2'}
equation: 'dA/dt + d(AU)/dx = 0, dU/dt + U dU/dx + (1/rho) dP/dx = f/(rho A), f = -22 mu pi U (1); P = Pext + (beta/A0)(sqrt(A) - sqrt(A0)) + Gamma/(A0 sqrt(A)) dA/dt, beta = (4/3) sqrt(pi) E h, Gamma =
  (2/3) sqrt(pi) phi h (5); elastic formulation: Gamma = 0'
