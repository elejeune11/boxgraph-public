id: wave_speed_eq5
name: initial wave speed of the elastic tube law (Eq. 5) from Young's modulus and the geometry
role: model
stated: {page: 2, printed_page: "2251", quote: "Expressing Z as a function of A", where: Eq. 5}
equation: "beta = (4/3) sqrt(pi) E h (Eq. 5); c0 = sqrt(beta/(2 rho sqrt(A0))), A0 = pi r0^2 (wave speed of Eq. 5 at A = A0, c^2 = (A/rho) dP/dA, not printed)"
from_words: true
inputs:
  E: {quantity: youngs_modulus, unit: Pa}
  h: {quantity: wall_thickness, unit: m}
  r0: {quantity: initial_lumen_radius, unit: m}
  rho: {quantity: fluid_density, unit: kg/m^3}
outputs:
  c0: {quantity: initial_wave_speed, unit: m/s}
settings: {}
