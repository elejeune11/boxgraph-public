- {id: segment_length, name: length of an arterial segment, dimension: "[length]"}
- {id: initial_lumen_radius, name: initial luminal radius r0 (at P = Pext), dimension: "[length]"}
- {id: wall_thickness, name: average wall thickness h of a silicone vessel, dimension: "[length]"}
- {id: initial_wave_speed, name: initial pulse wave speed c0 (at A = A0), dimension: "[length]/[time]"}
- {id: wall_viscosity_parameter, name: wall viscosity parameter Gamma of the tube law (Eq. 5), dimension: "[mass]/[time]",
   description: "Gamma = (2/3) sqrt(pi) phi h, in Pa s m"}
- {id: peripheral_resistance, name: peripheral resistance Rp of a terminal vessel, dimension: "[mass]/[length]**4/[time]"}
- {id: youngs_modulus, name: Young's modulus E of the silicone, dimension: "[mass]/[length]/[time]**2"}
- {id: silicone_viscosity, name: "viscosity phi of the silicone (Voigt model, Eq. 2)", dimension: "[mass]/[length]/[time]"}
- {id: viscosity_factor, name: multiple of the measured silicone viscosity, dimension: dimensionless}
- {id: fluid_density, name: density rho of the water-glycerol mixture, dimension: "[mass]/[length]**3"}
- {id: fluid_viscosity, name: dynamic viscosity mu of the water-glycerol mixture, dimension: "[mass]/[length]/[time]"}
- {id: external_pressure, name: external (extramural) pressure Pext, dimension: "[mass]/[length]/[time]**2"}
- {id: outflow_pressure, name: pressure downstream of the terminal resistances, dimension: "[mass]/[length]/[time]**2",
   description: "the pressure at which flow through a peripheral resistance ceases (venous side of the setup)"}
- {id: cardiac_period, name: period of the pump cycle, dimension: "[time]"}
- {id: inflow_harmonic_amplitude, name: mean or amplitude of one harmonic of the aortic-root inflow, dimension: "[length]**3/[time]"}
- {id: inflow_harmonic_phase, name: phase of one harmonic of the aortic-root inflow, dimension: dimensionless, description: radians}
- {id: time_in_cycle, name: "time within the last simulated cycle, measured from its start", dimension: "[time]"}
- {id: midpoint_pressure, name: pressure at the midpoint of an arterial segment, dimension: "[mass]/[length]/[time]**2"}
- {id: midpoint_flow_rate, name: volume flow rate at the midpoint of an arterial segment, dimension: "[length]**3/[time]"}
- {id: avg_rel_error_pressure, name: "average over the 70 sites of the relative pressure error E_P over one cycle (Eq. 10)", dimension: dimensionless,
   description: "in percent; elastic or visco-elastic formulation as the datum says"}
- {id: avg_rel_error_flow, name: "average over the 70 sites of the relative flow-rate error E_Q over one cycle (Eq. 10)", dimension: dimensionless,
   description: "in percent; elastic or visco-elastic formulation as the datum says"}
- {id: avg_rel_error_pressure_harm_5_20, name: "average over the 70 sites of the relative error of the 5th-20th pressure harmonic amplitudes (Eq. 11, E_P-hat II)", dimension: dimensionless,
   description: "in percent"}
- {id: avg_rel_error_flow_harm_5_20, name: "average over the 70 sites of the relative error of the 5th-20th flow harmonic amplitudes (Eq. 11, E_Q-hat II)", dimension: dimensionless,
   description: "in percent"}
- {id: relative_diameter_change, name: change of a vessel's diameter over the cardiac cycle relative to its mean diameter,
   dimension: dimensionless, description: "largest over the ascending aorta (Segment 1); in percent"}
# --- figure pass: fig245_quantities
- {id: test_time, name: time from the start of the uniaxial extension test, dimension: "[time]"}
- {id: normalised_load, name: load on the silicone sample in the uniaxial test divided by its maximum (F/Fmax), dimension: dimensionless}
- {id: normalised_extension, name: extension of the silicone sample in the uniaxial test divided by its maximum (psi/psimax), dimension: dimensionless}
- {id: frequency, name: frequency at which a harmonic of a waveform is plotted, dimension: "1/[time]"}
- {id: midpoint_flow_harmonic_amplitude, name: amplitude of one harmonic (or the mean) of the flow-rate waveform at the midpoint of an arterial segment, dimension: "[length]**3/[time]"}
- {id: lumen_area, name: luminal cross-sectional area A at the midpoint of an arterial segment, dimension: "[length]**2"}
- {id: local_lumen_area, name: luminal cross-sectional area A at a point of a vessel (the A of Eq. 5), dimension: "[length]**2"}
- {id: local_pressure, name: pressure P at a point of a vessel (the P of Eq. 5), dimension: "[mass]/[length]/[time]**2"}
