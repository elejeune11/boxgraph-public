id: boundary_layer_lighthill
name: boundary-layer thickness estimate after Lighthill (p. 4)
role: model
stated: {page: 4, printed_page: "1284", quote: "According to Lighthill17 the boundary layer", where: text}
equation: "delta = (nu/omega)^(1/2) = (nu T/(2 pi))^(1/2)"
described_from: ref-17
inputs:
  nu: {quantity: kinematic_viscosity, unit: cm^2/s}
  T: {quantity: cardiac_period, unit: s}
outputs:
  delta: {quantity: boundary_layer_thickness, unit: cm}
settings: {}
stochastic: false
