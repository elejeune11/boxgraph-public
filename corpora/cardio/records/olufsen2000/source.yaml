notes: >
  Scope: the paper's quantitative core. Checked: the Lighthill boundary-layer estimate (p. 4; printed as
  ≈ 0.1 cm, so no verdict; the inputs give 0.090 cm); nu = mu/rho from the p. 10 values against the
  printed nu = 0.046 (p. 4); the asymmetry ratio gamma from Eq. 21 and the scaling factors alpha, beta from
  Eq. 22 (with the printed gamma and with the Eq. 21 gamma); the cardiac period T = 1.1 s against the
  subject's printed heart rate of 51 per minute; and the 5 cm2 aortic-root area against pi r_t^2 with the
  Table 1 inlet radius. Findings: Eq. 21 with the printed eta = 1.16, xi = 2.76 gives gamma ≈ 0.356, not
  0.41 (as in ref. 21, olufsen1999); 51 beats per minute is a period of 1.18 s, not 1.1 s; the text speaks
  of 'four' minimum radii but lists three; the subject's age is 32 (p. 11) and 25 (p. 14). The coupled
  nonlinear 1D network with structured-tree outflow (the paper's main model) is recorded as stated but not
  runnable: its inflow is only the plotted Fig. 3 curve, the connectivity only the Fig. 1 drawing, and p0
  and all numerical settings are unstated; its plotted outputs (Figs. 6, 8, B5) and the measured inflow
  (Fig. 3) are recorded as figure data, so the warnings that they are never compared are expected. A second
  figure pass read Fig. 7 (measured dashed and simulated solid flows at nine sites, where the curves can be
  told apart) and the 40 cm line of Fig. 5, at 1000 dpi (figures.md). Left out as
  feeding no runnable model: Table 1 except the ascending-aorta inlet radius, the Poisson ratios, the
  r_min values, the structured-tree impedance recursion (Eqs. 23-37: no printed impedance values), the
  MRI acquisition parameters, the O(n^2) count of subtree impedances, and the subject's other data. The
  figure commands (`boxgraph figure page/check`) were refused in this session; crops were placed from frame
  lines found in the 110-dpi page images and the readings checked on overlays drawn by the build's own
  figure reader.
