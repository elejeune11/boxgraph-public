- {id: kinematic_viscosity, name: kinematic viscosity of blood, dimension: "[length]**2/[time]", description: "nu = mu/rho"}
- {id: dynamic_viscosity, name: dynamic viscosity of blood, dimension: "[mass]/[length]/[time]"}
- {id: blood_density, name: density of blood, dimension: "[mass]/[length]**3"}
- {id: cardiac_period, name: period of the cardiac cycle, dimension: "[time]"}
- {id: heart_rate, name: heart rate of the subject at rest, dimension: "1/[time]"}
- {id: boundary_layer_thickness, name: thickness of the viscous boundary layer in the large arteries, dimension: "[length]", description: "delta in Eqs. 10-13"}
- {id: radius_exponent, name: exponent of the radius power law at bifurcations, dimension: dimensionless, description: "xi in Eq. 19"}
- {id: area_ratio, name: area ratio of a bifurcation, dimension: dimensionless, description: "eta: summed daughter areas over parent area"}
- {id: asymmetry_ratio, name: asymmetry ratio of a bifurcation, dimension: dimensionless, description: "gamma = (r_d2/r_d1)^2"}
- {id: scaling_factor_alpha, name: radius scaling factor of the larger daughter, dimension: dimensionless, description: "alpha in Eqs. 20, 22"}
- {id: scaling_factor_beta, name: radius scaling factor of the smaller daughter, dimension: dimensionless, description: "beta in Eqs. 20, 22"}
- {id: vessel_radius, name: vessel radius at zero transmural load (p = p0), dimension: "[length]"}
- {id: cross_sectional_area, name: lumen cross-sectional area, dimension: "[length]**2"}
- {id: stiffness_fit_amplitude, name: amplitude k1 of the Eh/r0 law (Eq. 15), dimension: "[mass]/[length]/[time]**2"}
- {id: stiffness_fit_rate, name: rate k2 of the Eh/r0 law (Eq. 15), dimension: "1/[length]"}
- {id: stiffness_fit_offset, name: offset k3 of the Eh/r0 law (Eq. 15), dimension: "[mass]/[length]/[time]**2"}
- {id: bifurcation_loss_coefficient, name: energy loss coefficient K of a bifurcation (Eq. 17), dimension: dimensionless}
- {id: length_to_radius_ratio, name: length-to-radius ratio of structured-tree vessels, dimension: dimensionless}
- {id: time, name: time, dimension: "[time]"}
- {id: axial_position, name: axial distance along the aorta from the aortic valve, dimension: "[length]"}
- {id: volumetric_flow_rate, name: volumetric blood flow rate through a vessel cross-section, dimension: "[length]**3/[time]"}
- {id: arterial_pressure, name: blood pressure in a large artery, dimension: "[mass]/[length]/[time]**2"}
- {id: youngs_modulus, name: Young's modulus of the vessel wall in the circumferential direction, dimension: "[mass]/[length]/[time]**2", description: "E in Eq. 14"}
- {id: wall_thickness, name: thickness of the vessel wall, dimension: "[length]", description: "h in Eq. 14"}
- {id: reference_pressure, name: pressure at which the vessel has its zero-load radius r0, dimension: "[mass]/[length]/[time]**2", description: "p0 in Eq. 14"}
- {id: mean_arterial_pressure, name: mean (time-averaged over a period) blood pressure in a large artery, dimension: "[mass]/[length]/[time]**2"}
