# Added for the cross-validation against schwarz2020 (validations.yaml, val_eta_eq21_vs_schwarz_large).
- id: gamma_schwarz_large_added
  quantity: asymmetry_ratio
  unit: dimensionless
  printed: "0.3481"
  basis: >
    Added, not printed by either paper. schwarz2020 prints the median daughter symmetry S = dS/dL = 0.59 for mothers
    larger than 500 um (schwarz2020/S_median_large, its p. 9), a ratio of daughter diameters. This paper's asymmetry
    ratio is a ratio of daughter areas, gamma = ((r0)_d2/(r0)_d1)^2 (p. 7), so the same bifurcation has gamma = S^2 =
    0.59^2 = 0.3481. It puts Eq. 21 at the symmetry of schwarz2020's large coronary bifurcations.
  alternatives: ["0.41", "0.356"]
  stands_for: gamma in Eq. 21, at the median symmetry of schwarz2020's large-vessel class
