- id: q_no_cross_validation_olufsen1999
  kind: unstated_input
  about: [inflow_fig3, q_aortic_arc_meas_fig7, q_l_subclavian_meas_fig7, q_femoral_meas_fig7, p_systolic_cuff, p_diastolic_cuff, r_t_ascending_aorta, T_fig3_caption, heart_rate_results, network_1d]
  text: >
    Cross-validation with olufsen1999 (ref. 21) found no pair to test, in either direction. This paper's
    measurements are MR flows (Figs. 3, 7), cuff pressures, the inlet radius, the cycle length and the heart rate
    of one subject. The olufsen1999 model that would predict flow or pressure at these sites, its nonlinear 1D
    model (olufsen1999/larger_arteries_1d), is not runnable: the geometry, windkessel parameters and numerical
    settings are not printed. Its runnable models give quantities this paper does not measure: impedance
    (structured_tree_impedance), Eh/r0 (stiffness_eq6), boundary-layer thickness, tree size and gamma.
    olufsen1999's measurements are impedance moduli and phases (Fig. 9, refs. 26/27), aortic and brachial
    pressures (Fig. 12, ref. 41) and a cardiac output. Only this paper's network_1d (not runnable,
    q_network_not_runnable) would predict them. No runnable model here gives impedance (the structured-tree
    recursion, Eqs. 23-37, is not recorded as a model) or cardiac output. On p. 13 this paper says the
    structured tree 'captures the observed oscillations of the impedance'. That claim is about a trend and
    names no data set it is checked against here, so it is not a quantitative prediction. No validation was
    added. A runnable version of either 1D model, or this paper's impedance recursion, would make the Fig. 7
    flows and the Fig. 9 / Fig. 12 measurements testable.
  citation: {page: 13, printed_page: "1293", quote: "the observed oscillations of the impedance in the part of", where: text}
- id: q_no_cross_validation_olufsen2004
  kind: choice
  about: [kinematic_viscosity, period_from_heart_rate, network_1d, inflow_fig3, q_aortic_arc_meas_fig7, p_systolic_cuff, p_diastolic_cuff, r_t_ascending_aorta, T_fig3_caption, heart_rate_results]
  text: >
    Cross-validation with olufsen2004 (which cites this paper as its ref. 20) found no pair to test, in either
    direction. olufsen2004 is analytical and measures nothing: its printed numbers are blood properties (rho,
    mu, nu, origin reported), zeros of J0 quoted from a handbook, a heart rate of 60 per minute and radii chosen
    for its time-scale analysis, and the time-scales its own models produce. So no model of this record
    (kinematic_viscosity, period_from_heart_rate, Eqs. 21-22, the tube law, network_1d) can be judged against
    an olufsen2004 measurement; nu = mu/rho run on olufsen2004's rho and mu would agree or not with a reported,
    not a measured, value, which is a relation between the two papers' inputs, not a validation. In the other
    direction, this paper's measurements (the MR flows of Figs. 3 and 7, the cuff pressures 120/80 mmHg, the
    inlet radius, the cycle length 1.1 s and heart rate 51 per minute) are not produced by any olufsen2004 model:
    those give dimensionless time-scales of a rigid vessel, a dimensionless step response with unstated
    parameters, a vessel inductance, a radius threshold for the time-scale crossing and the impedance of a
    three-element windkessel, and none is driven by a measured flow wave or produces a dimensional flow,
    pressure, period or radius of one subject. olufsen2004 cites this paper only as a one-dimensional network
    model (its pp. 2-3), not as data its models explain. No validation was added.
- id: q_no_cross_validation_reymond2009
  kind: choice
  about: [network_1d, tube_law_eq14, circle_area, period_from_heart_rate, kinematic_viscosity, inflow_fig3, q_aortic_arc_meas_fig7, p_systolic_cuff, p_diastolic_cuff, r_t_ascending_aorta, T_fig3_caption]
  text: >
    Cross-validation with reymond2009 (which cites this paper as its ref. 44) found no pair to test, in either
    direction. The two main models share a shape (a tree giving flow and pressure in time), but both are not
    runnable: network_1d here (q_network_not_runnable) and reymond2009/arterial_tree_1d (its q_1d_not_runnable).
    So neither can be run on the other's measured flows and pressures (Figs. 3, 7 and the cuff 120/80 here;
    Tables 4-5 and Figs. 4-5 there). This record's runnable models give nu, the boundary layer, gamma, alpha, beta,
    pressure from area, area from radius and period from heart rate. reymond2009 measures none of these: it measures
    flows and radial, carotid and temporal pressures, Senzaki et al.'s normalized elastance and literature PWV against
    diameter, and prints no measured lumen area or cycle length. reymond2009's runnable models give PWV, wall
    properties, terminal windkessel ratios, PP and a one-third mean pressure. This paper measures no PWV or wall
    property, and it prints no measured pulse or mean pressure. reymond2009 cites this paper only as a 1-D model
    (its p. 1 and Table 1), not as data its model explains. No validation was added; see
    reymond2009/q_no_validation_vs_olufsen2000.
  citation: {page: 11, printed_page: "1291", quote: "pressures were 120/80 mmHg 共measured with a cuff兲; for", where: text}
- id: q_no_validation_vs_stergiopulos1992
  kind: choice
  about: [network_1d, tube_law_eq14, period_from_heart_rate, inflow_fig3, q_aortic_arc_meas_fig7, q_femoral_meas_fig7, p_systolic_cuff, p_diastolic_cuff]
  text: >
    (Cross-validation with stergiopulos1992, which this paper cites as ref. 28; cross-validation job 2026-11-04.)
    No pair to test was found in either direction. This paper cites ref. 28 only for arterial geometry (p. 2),
    the viscous stress term (p. 4), compliance estimates (p. 5), pressure continuity at bifurcations (p. 6)
    and the windkessel (p. 12), never as
    data a model explains. network_1d here, the only model giving flow or pressure in time, is not runnable
    (q_network_not_runnable), so it cannot be run on stergiopulos1992's measurements (Gosling et al.'s
    pulsatility indices, Fronek et al.'s leg/brachial systolic ratios). This record's runnable models give nu,
    the boundary layer, gamma, alpha, beta, pressure from area, area from radius and period from heart rate,
    none of which is measured there. In the other direction, stergiopulos1992/arterial_tree_1d gives
    ascending-aortic systolic, diastolic and mean pressure, leg/brachial ratios, PI ratios and a mean-flow
    ratio, but not flow in time at named sites (the MR flows of Figs. 3, 7) and not brachial pressure (the
    cuff 120/80 of this subject). Its 55-segment geometry, terminal impedances and inflow are those of a
    generic adult, not this subject's (Table 1, Fig. 3), so it cannot be run on this measurement's
    conditions. The shared dimensional shape of network_1d and arterial_tree_1d is a relation between
    models, not a validation against data. No validation was added; see
    stergiopulos1992/q_no_validation_vs_olufsen2000.
  citation: {page: 11, printed_page: "1291", quote: "pressures were 120/80 mmHg 共measured with a cuff兲; for", where: text}
- id: q_no_validation_vs_westerhof1969
  kind: choice
  about: [network_1d, tube_law_eq14, circle_area, period_from_heart_rate, kinematic_viscosity, inflow_fig3, q_aortic_arc_meas_fig7, p_systolic_cuff, p_diastolic_cuff, r_t_ascending_aorta, T_fig3_caption, heart_rate_results]
  text: >
    (Cross-validation with westerhof1969, which this paper cites as ref. 31.) No validation is entered in either
    direction. This paper cites ref. 31 once, on p. 5: the stiffness formula Eh/r0 = k1 exp(k2 r0) + k3 (Eq. 15) is
    'based on compliance estimates' of refs. 27, 28 and 31. That is a fit to westerhof1969's compliances, which would
    be fit_quality, not validation; but Eq. 15 is not a model of this record (it lives only inside network_1d, which
    is not runnable, q_network_not_runnable), the constants are taken from ref. 21, and westerhof1969's compliances
    are its Table 1 element values (origin reported, computed from literature E, h and r), not measurements. The
    westerhof1969 measurements are decay times and the 'about 50 per cent' stiff-system changes measured on its
    analog, and Luchsinger's and Gabe's apparent wave velocities in man (its Fig. 7). None of this record's runnable
    models (nu, boundary layer, gamma, alpha, beta, pressure from area by Eq. 14, area from radius, period from heart
    rate) gives a decay time, an impedance level or a wave velocity; Eq. 14 gives pressure from area, and no
    westerhof1969 measurement is a pressure at a printed area. The reverse direction is in
    westerhof1969/q_no_validation_vs_olufsen2000.
  citation: {page: 5, printed_page: "1285", quote: "mula based on compliance estimates27,28,31", where: text}

