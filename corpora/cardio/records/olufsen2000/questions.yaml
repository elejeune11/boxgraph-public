- id: q_cuff_pressure_claim
  kind: reading
  about: [p_l_subclavian_fig8, p_systolic_cuff, p_diastolic_cuff]
  text: >
    The cuff pressures 120/80 mmHg are said to 'correspond well' to the pressures computed at the left subclavian
    artery (Fig. 8, E). The plotted curve reaches about 119 mmHg at its peak and about 85 mmHg at its minimum
