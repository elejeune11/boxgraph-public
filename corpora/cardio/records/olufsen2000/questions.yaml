- id: q_gamma_eq21
  kind: possible_error
  about: [gamma_printed, asymmetry_eq21, cmp_gamma_eq21]
  text: >
    Eq. 21 with the printed area ratio eta = 1.16 and exponent xi = 2.76 gives gamma ≈ 0.356, not the printed
    0.41 (eta(gamma) is monotonic on (0, 1], so the root is unique; with gamma = 0.41 Eq. 21 gives eta ≈ 1.171).
    The same value 0.41 is printed from the same inputs in ref. 21 (olufsen1999). The printed alpha = 0.9 and
    beta = 0.6 (Eq. 22) round the same way from either gamma, so they do not tell which gamma was used.
  citation: {page: 7, printed_page: "1287", quote: "asymmetry-ratio ␥ ⫽0.41. The area-ratio", where: "Eq. 21"}
- id: q_period_heart_rate
