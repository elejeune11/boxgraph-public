  about: [T_printed, T_fig3_caption, heart_rate_results, heart_rate_appendix, cmp_period_hr]
  text: >
    The cardiac period used for the inflow and the boundary-layer estimate is T = 1.1 s (p. 4, Fig. 3), but the
    subject's average heart rate at rest is printed as 51 beats per minute (pp. 11, 14), which is a period of
    60/51 ≈ 1.18 s. The paper does not say whether the measured cycle was shortened or which beat was used.
  citation: {page: 11, printed_page: "1291", quote: "His average heart rate at rest was", where: text}
