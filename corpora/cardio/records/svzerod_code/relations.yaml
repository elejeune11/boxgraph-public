# --- ModelAtlas job svzerod_code + yong2025 (2026-11-09). The time-varying coronary block's header cites yong2025
# (OpenLoopCoronaryVarResBC.h line 16); yong2025 itself never mentions svZeroDSolver. The relations above join the
# block to this record's own restatement of yong2025 Eq. 9 (ram_yong_eq9); the three below join it to yong2025's
# own chart, rmicro_eq10 (Eqs. 9-11 with Rmicro,min = frac Rbar and sqrt(Rmicro,max) = kPH sqrt(k Rbar) as
# printed in Eq. 11). The code takes the minimum and maximum directly, so the mapping is yong2025's Eqs. 10-11
# themselves. Regime: Tvc + Tvr <= T throughout (both models assume the activation ends within the cycle).
# Not related: yong2025/coronary_block_svzerod already runs this release's CORONARY_VAR_RES block, driven by
# yong2025's closed loop (~55 inputs); it shares only port dimensions with coronary_kim2010_ode, and no mapping
# writes its closed-loop inputs from a sinusoidal inlet and Pim, so no relation is proposed. yong2025's
# elastance_waveform has no counterpart model here (the chamber block is checked only through test cases).
- id: rel_yong_rmicro_code_port_mean
  kind: same_as
  a: yong2025/rmicro_eq10
  b: svzerod_code/ram_code_port
  mapping: {Ram_min: "frac/100*Rbar", Ram_max: "k_ph**2*k*Rbar", T_vc: "Tvc", T_vr: "Tvr", T: "T"}
  output_map: {Ram_mean: R_mean}
  regime: {Rbar: [30, 120], frac: [60, 90], k: [1.2, 3.0], k_ph: [1.0, 1.5], Tvc: [0.2, 0.4], Tvr: [0.1, 0.3], T: [0.8, 1.2]}
  tolerance: 0.000001
  provenance: stated
  citation: {file: src/model/OpenLoopCoronaryVarResBC.h, lines: "16", quote: "resistance based on \\cite yong25."}
  assumptions:
    - "yong2025's Rmicro,min (frac Rbar, Eqs. 10-11) and Rmicro,max (kPH^2 k Rbar, Eq. 11 as printed) are the code's Ra2_min and Ra2_max; e_n(t) = e_v(t) of Eq. 4 is the code's e(t) with T_vc, T_vr. The relation joins the formulas: the code does not take Rbar, frac or k, and how a user chooses Ra2_min and Ra2_max is not in the code (q_varres_vs_yong)."
    - "The output compared is the cycle average, which yong2025 sets equal to its mean resistance through k; the port averages by the midpoint rule (1e5 points), so the tolerance 1e-6 is ours."
