# --- impedance block (ImpedanceBC) against olufsen2000's Eq. 38 discretized as its Appendix B says
- id: rel_impedance_olufsen_pmax
  kind: approximated_by
  a: svzerod_code/impedance_olufsen_eq38
  b: svzerod_code/impedance_released
  mapping: {Q0: Q0, Q1: Q1, Z: Z, tau: tau, T: T}
  output_map: {P_max: P_max}
  regime:
    Q0: [1, 5]
    Q1: [0.2, 1.5]
    Z: [500, 20000]
    tau: [0.05, 0.5]
    T: [0.5, 1.2]
  tolerance: 0.005
  provenance: stated
  citation: {file: src/model/ImpedanceBC.h, lines: "18-21", quote: "following the structured-tree outflow condition of \\cite olufsen2000."}
  assumptions:
    - "The code's kernel z_m is olufsen2000's z(t_m) times dt (the code's comment, ImpedanceBC.cpp lines 35-36); both use N = 128 steps per period."
    - "The block is compared in its periodic state (after its first cycle, in which the code omits the history terms: q_impedance_startup)."
    - "approximated_by, not same_as: the solver's generalized-alpha step blends the convolution sum of two successive steps, so the block's pressure differs from the discrete sum by a term that falls with the step (q_impedance_alpha); the 0.5% tolerance is ours."
# --- Windkessel block (WindkesselBC) against westerhof1971's three-element model
- id: rel_windkessel_westerhof_modulus
  kind: same_as
  a: westerhof1971/impedance_3el
  b: svzerod_code/windkessel_released_impedance
  mapping: {Rc: Rc, Rp: Rp, C: C, f: f}
  output_map: {modulus: modulus}
  regime:
    Rc: [50, 250]
    Rp: [800, 5000]
    C: [100, 1000]
    f: [0.5, 10]
  tolerance: 0.001
  provenance: proposed
  reason: >
    The code's RCR block (WindkesselBC.h: Rp in series with C parallel to Rd) is the circuit of
    westerhof1971's three-element model (Fig. 1A: Rc in series with Rp parallel to C), so its input
    impedance under a sinusoidal flow should be westerhof1971's. The code cites Vignon & Taylor 2004
    (docs/references.bib vignon04), which is not in this review.
  assumptions:
    - "The code's proximal Rp is westerhof1971's Rc and the code's distal Rd its Rp; Pd = 0."
    - "The 0.1% tolerance is ours; it covers the solver's time discretization (401 points per period)."
