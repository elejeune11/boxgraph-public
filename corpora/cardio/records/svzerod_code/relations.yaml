# --- Windkessel block (WindkesselBC) against stergiopulos1999's three-element windkessel (Fig. 1, top left).
# Unit factors: 1 mmHg*s/ml = 1333.22387415 g/cm^4/s; 1 ml/mmHg = 1e6/1333.22387415 cm^4*s^2/Mg.
# Outputs convert automatically. The regime covers the paper's dog and human values (Tables 1-3).
# The code has no block with an inertance parallel to the proximal resistance, so stergiopulos1999's
# four-element windkessel (zin_4wk) has no counterpart in the release and no relation here.
- id: rel_windkessel_stergiopulos_wk3_modulus
  kind: same_as
  a: stergiopulos1999/zin_3wk
  b: svzerod_code/windkessel_released_impedance
  mapping: {Rc: "1333.22387415*Rc", Rp: "1333.22387415*Rp", C: "1000000*C/1333.22387415", f: "f"}
  output_map: {modulus: mod}
  regime: {Rp: [0.5, 6], Rc: [0.03, 0.6], C: [0.1, 3], f: [0.1, 20]}
  tolerance: 0.001
  provenance: proposed
  reason: >
    The code's RCR block (WindkesselBC.h: proximal Rp in series with C parallel to Rd) is the circuit of
    stergiopulos1999's three-element windkessel (Fig. 1, top left: Rc in series with Rp parallel to C), so
    its input impedance under a sinusoidal flow should be the paper's Rc + Rp/(1 + j omega Rp C). Neither
    source cites the other (the code cites Vignon & Taylor 2004; the paper predates the code).
  assumptions:
    - "The code's proximal Rp is stergiopulos1999's Rc (characteristic impedance) and the code's distal Rd its Rp (peripheral resistance); Pd = 0. The relation joins the circuits; it does not say the paper's fitted Zc of a dog is the parameter any svZeroDSolver user enters."
    - "The 0.1% tolerance is ours; it covers the solver's time discretization (401 points per period)."
- id: rel_windkessel_stergiopulos_wk3_phase
  kind: same_as
  a: stergiopulos1999/zin_3wk
  b: svzerod_code/windkessel_released_impedance
  mapping: {Rc: "1333.22387415*Rc", Rp: "1333.22387415*Rp", C: "1000000*C/1333.22387415", f: "f"}
  output_map: {phase: phase}
  regime: {Rp: [0.5, 6], Rc: [0.03, 0.6], C: [0.1, 3], f: [0.1, 20]}
  tolerance: 0.001
  provenance: proposed
  reason: As rel_windkessel_stergiopulos_wk3_modulus, for the phase of the input impedance.
  assumptions:
