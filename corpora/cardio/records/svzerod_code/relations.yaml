# mapping: b's input symbol -> expression in a's input symbols, numbers in each model's port units.
# The code's headers state which paper each block follows; those statements are the stated relations
# below (citation: file and line). a is the paper's equation (restated in this record from the paper,
# or the paper's own record's model), b is the released block run by the released solver, or the
# code ported.

# --- open-loop coronary block (OpenLoopCoronaryBC) against kim2010's coronary bed equation
- id: rel_coronary_kim2010_qmin
  kind: same_as
  a: svzerod_code/coronary_kim2010_ode
  b: svzerod_code/coronary_released
  mapping: {P_mean: P_mean, P_amp: P_amp, Pim_mean: Pim_mean, Pim_amp: Pim_amp, Ra: Ra, Ram: Ram, Rv: Rv, Ca: Ca, Cim: Cim, Pv: "0", T: T}
  output_map: {Q_min: Q_min}
  regime:
    P_mean: [60, 120]
    P_amp: [5, 40]
    Pim_mean: [0, 100]
    Pim_amp: [10, 100]
    Ra: [30, 270]
    Ram: [10, 300]
    Rv: [5, 140]
    Ca: [0.2, 1.1]
    Cim: [2, 10]
    T: [0.6, 1.2]
  tolerance: 0.001
  provenance: stated
  citation: {file: src/model/OpenLoopCoronaryBC.h, lines: "15", quote: "Open loop coronary boundary condition based on \\cite kim_coronary."}
  assumptions:
    - "kim2010's Rv + Rv-micro is the code's single Rv1 (the code lumps the two venous resistances, which enter kim2010's coefficients only as their sum)."
    - "kim2010's equation has no venous pressure; the code's P_v is set to 0, the case in which the two can agree (q_venous_pressure_term)."
    - "The output compared is the smallest inflow over a cycle under a sinusoidal inlet pressure and a sinusoidal intramyocardial pressure a quarter period apart: the part of the response that depends on Ca, Cim and dPim/dt. The 0.1% tolerance is ours; it covers the solver's time discretization (501 points per cycle)."
# --- ModelAtlas job kim2010 + svzerod_code (2026-11-09). The same block against kim2010's own record (its charts,
# not this record's restatement): kim2010's two steady models, the split of the total coronary flow over the eleven
# outlets (coronary_flow_split) and the flow through the stenosed LAD into outlets c and d (stenosed_lad_flow), each
# against the released solver run on the same network (coronary_split_released, coronary_pair_released). The code's
# header cites kim2010 for the block; kim2010 (2010) predates the code and names no solver. In the steady state
# the capacitances carry no current and a constant Pim does no work, so their values cannot change the flows; they
# are set to fixed values of the size of kim2010's Table 3 (Ca 0.5, Cim 4 x 10^-6 cm^5/dyn) and Pim to 0.
