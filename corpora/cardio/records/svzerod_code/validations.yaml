- id: val_rcr_w71_cat_syst_model_ph
  model: windkessel_released_impedance
  inputs: {Rc: 'westerhof1971/rc_cat_syst', Rp: wk_rd_w71_cat_syst, C: 'westerhof1971/c_cat_syst'}
