  inputs: {Rc: 'westerhof1971/rc_dog_pulm', Rp: wk_rd_w71_dog_pulm, C: 'westerhof1971/c_dog_pulm'}
  sweep: {f: 'westerhof1971/f3_mod_dots_read'}
  output: modulus
  against: 'westerhof1971/f3_mod_dots_read'
  purpose: validation
  quantities: *qw_mod
  conditions_ok: *cw_invivo
  basis: *bw_invivo
- id: val_rcr_w71_dog_pulm_invivo_ph
  model: windkessel_released_impedance
  inputs: {Rc: 'westerhof1971/rc_dog_pulm', Rp: wk_rd_w71_dog_pulm, C: 'westerhof1971/c_dog_pulm'}
  sweep: {f: 'westerhof1971/f3_ph_dots_read'}
  output: phase
