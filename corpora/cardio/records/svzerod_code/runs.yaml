# ===== kim2010's coronary beds on the released coronary block, and kim2010's equation restated, on
# the same inputs (outlet c at rest, Table 4 normal pressure, an added pulse): set side by side
- id: run_cor_c_rest_released
  model: coronary_released
  inputs: {P_mean: P_mean_probe, P_amp: P_amp_probe, Pim_mean: Pim_mean_probe, Pim_amp: Pim_amp_probe, Ra: k_Ra_c_R, Ram: k_Ram_c_R, Rv: k_Rv_c_R, Ca: k_Ca_c_R, Cim: k_Cim_c_R, Pv: Pv_zero, T: k_Tc_rest}
