  inputs: {P_mean: P_mean_probe, P_amp: P_amp_probe, Pim_mean: Pim_mean_probe, Pim_amp: Pim_amp_probe, Ra: k_Ra_c_R, Ram: k_Ram_c_R, Rv: k_Rv_c_R, Ca: k_Ca_c_R, Cim: k_Cim_c_R, T: k_Tc_rest}
  outputs: {Q_mean: cor_c_kim_mean, Q_max: cor_c_kim_max, Q_min: cor_c_kim_min}

