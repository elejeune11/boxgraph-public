- id: q_menon_prints_nothing
  kind: unstated_model
  about: [release_case, coronary_released, varres_released, impedance_released, windkessel_released_impedance]
  text: >
    The paper this code was released with, menon2025, prints no equation, parameter or result (its
    record holds five models in words, none runnable: q_equations_in_docs there). Nothing the code
    computes can therefore be compared with menon2025 itself. What is compared here: the code against
    its own test cases (the analytical solutions their descriptions state, and the results stored with
    the release), and each block against the paper its header cites (kim2010, yong2025, olufsen2000)
    or, for the Windkessel block, the three-element model of westerhof1971.
- id: q_case_units
  kind: unstated_input
  about: [case_pressure, case_flow, release_case]
  text: >
    The test cases (tests/cases/*.json), the solver and its documentation in this folder state no
    units; the solver works in whatever consistent units it is given. The record reads the cases'
    pressures and flows as dyn/cm^2 and mL/s (the cgs units of the release's coronary examples). No
    verdict depends on it: every comparison of a case is between the case's own numbers.
- id: q_hidden_solver_settings
  kind: choice
  about: [abs_tol_default, nliter_default, rho_infty_default, cycle_error_default, period_default]
  text: >
    The solver's numerical defaults are written only in the code: spectral radius rho_infty = 0.5 of
    the generalized-alpha scheme, absolute Newton tolerance 1e-8 on a residual that mixes pressures,
    flows and volumes, at most 30 Newton iterations per step, a steady initial condition by default
    (solved with a time step of a tenth of the period, ImpedanceBC.h), a 1% cycle-to-cycle criterion
    when it is switched on, and a period of 1.0 when none is defined. menon2025 names the scheme and the
    Newton iterations (p. 4) but none of these values. Every run of this record uses them.
  citation: {file: src/solve/SimulationParameters.cpp, lines: "340-353", quote: 'sim_config.value("rho_infty", 0.5)'}
- id: q_t0_is_initial_state
  kind: overstated_claim
  about: [tc_pRCR_Pin, tc_pRCR_Pout, tc_pcor_Pin, tc_pcor_Pout, tc_pRCRd_Pin, tc_pRCRd_Pout, cmp_tc_pRCRd_Pin, st_pRCR_Pin]
  text: >
    The pulsatile cases' descriptions give as "Solutions" the pressures at t0, the start of the cardiac
    cycle, as the steady values Q(0) times the total resistance (4620 and 4400 for R -> RCR, 880 and 660
    for R -> coronary). The rerun gives them exactly in the first output row only because those cases
    output all cycles and their first row is the solver's steady initial state; in the periodic state the
    pressure at the start of a cycle is lower (the release's own stored result for R -> RCR at 10 s,
    st_pRCR_Pin, is about 3494). pulsatileFlow_R_RCR_derivative.json, which outputs only the last cycle,
    copies the same "Solutions", and the rerun's t0 pressures do not match them
    (cmp_tc_pRCRd_Pin, cmp_tc_pRCRd_Pout): the stated solutions test the steady initialization, not the
    dynamics, and are wrong for the case that outputs the periodic cycle. The release's test compares
    with stored results, not with these statements.
  citation: {file: tests/cases/pulsatileFlow_R_RCR_derivative.json, lines: "17", quote: "inlet pressure (at time = t0) = outlet pressure + Q(t = 0) * R_poiseuille = 4400 + 2.2 * 100 = 4620"}
- id: q_stored_precision
