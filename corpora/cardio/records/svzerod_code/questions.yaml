    no validations.yaml line is added. Each of davies2006's measurements was checked against each block here.
    (1) Wave intensities (Table 2 peaks and cumulative values of waves 1-6, their shares, the Fig. 3-5 WI+ and WI-
    traces and peaks): no block has a wave speed or propagation, so none gives a forward/backward separation; the
    blocks' outputs are cycle summaries (flow mean/max/min, mean and peak Ram, pressure mean/max/min, impedance
    modulus/phase), not time derivatives of pressure and velocity, so not even the net intensity can be formed.
    (2) Mean coronary velocity (0.43 ± 0.52 and 0.42 ± 0.35 m/s) and the velocity rises in relaxation and
    contraction: coronary_released, coronary_kim2010_ode, coronary_pair_released and coronary_split_released give
    bed flows in cm^3/s, not velocities. A comparison would need a vessel area davies2006 does not print (it gives
    only the 0.014-inch wire diameter), a factor from Doppler peak to cross-sectional mean velocity
    (davies2006/q_mean_velocity_meaning), the bed's resistances and capacitances for these 20 subjects, which
    neither source states (the only coronary values here are kim2010's beds of one patient and the release's test
    values), and a cycle length, since davies2006 prints no heart rate. With all of these added the test could not
    fail on anything measured. (3) Pressures (146/81 mmHg cohort, the group values, the Fig. 3 and 5 coronary
    pressure traces): in the coronary blocks pressure is an input, not an output. impedance_released and
    impedance_olufsen_eq38 give an outlet pressure from an outlet flow and an impulse response, and
    windkessel_released_impedance an impedance; davies2006 measures no flow and no impedance, and a kernel or
    Windkessel chosen to land on 146/81 mmHg would be a fit to that measurement, not a test. (4) varres_released,
    ram_code_port and ram_yong_eq9 give a microvascular resistance, which davies2006 does not measure;
    release_case reruns fixed test cases. (5) The relations davies2006 reports (suction share against septal
    thickness, age or wave speed; the regression slopes) are trends over subjects that no block models. The other
    direction is empty because this record measures nothing. See davies2006/q_no_validation_vs_svzerod_code and
    q_no_relation_davies2006.
