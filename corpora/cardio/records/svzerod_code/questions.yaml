  about: [cmp_st_pcor_Pin, cmp_st_pvar_Pin, cmp_st_pimp_Pin, cmp_st_pRCR_Pin, cmp_st_valve_P, cmp_st_valve_Q, cmp_st_chamber_P, cmp_st_chamber_Q, cmp_st_clhcor_Pin, cmp_st_clhcor_Qin, cmp_st_coupled_PLA, rtol_tests]
  text: >
    The stored results are written to 10 decimals, more digits than the solver's own tolerances fix:
