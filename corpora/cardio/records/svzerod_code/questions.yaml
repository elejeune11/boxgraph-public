  text: >
    (Relation job davies2006+svzerod_code, 2026-11-10.) Nothing is entered between this record and davies2006,
    the human coronary wave intensity measurements. Neither source mentions the other: the code's block headers
    and docs/references.bib do not cite it, and the 2006 paper is older than the code. So no relation is stated,
    and neither record takes a value from the other (no cited.yaml lines). None is proposed. davies2006's models
    are signal processing of measured increments (wave separation, single-point wave speed, wave intensity) and
    arithmetic on group statistics. This record's models are lumped coronary beds and resistances, and they have
    no wave speed, no wave propagation and no velocity. No input of one maps onto an input of the other. A 0D
    block gives no forward/backward split, so it cannot predict a separated wave intensity. No validation is
    entered either. coronary_released and coronary_kim2010_ode give the flow extrema of a bed driven by a
    sinusoidal pressure and a kim2010 bed (one subject's tuned resistances). davies2006 measures Doppler velocity
    with no vessel diameter, and its pressures would be inputs, not predictions. This is the gap that
    davies2006/q_validation_candidates and davies2006/q_no_validation_vs_kim2010 already describe for the same
    kim2010 beds. See davies2006/q_no_relation_svzerod_code.
