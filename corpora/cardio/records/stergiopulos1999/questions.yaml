    Murgo et al. 1980 (ref. 12); westerhof2009 Fig. 6 plots the averaged impedance of type A and type C beats from
    the same study. Neither paper says whether the analysed beat is one of those averaged. If it is, the averaged
    curve shares data with the beat the parameters came from and the validations are partly circular; they are
    entered as validations because the parameters were not fitted to the averaged curve. The comparisons are point by
    point at the reading precision of the Fig. 6 crosses; one beat's windkessel is not expected to match a group
    mean within those bars, so a 'not reproduced' says the single-beat windkessel is outside the type average's
