- id: q_sample_count
  kind: unstated_input
  about: [n_d71, n_d72, n_d74, n_d76, n_d77, n_d78, n_d79, n_hA, n_hC, info_criteria_eq2_3]
  text: >-
    Eqs. 2-3 need N, the number of samples per heart cycle, which is not printed for any beat; nor is the sampling
    rate. The added N (200 Hz times the heart period for the dogs, rounded; 101 for the human beats) were chosen to
    be consistent with the printed AIC, so the AIC comparisons check one common sampling rate per data set rather
    than each value independently. With these N the computed AIC fall 1-7 below the printed values (at most 1.2%):
    the non-integer N that would match each printed AIC exactly (84.9, 104.2, 127.0, 89.3, 79.8, 128.3, 111.2 for the
    dogs, 101.2-101.4 for the humans) are the same for the three- and four-element fit of a beat, which supports
    Eq. 2 as applied, but no integer N matches them all; dogs 71 and 77 match with N one higher (85, 80). The SC
    comparisons are the more independent test (question q_sc_inconsistent).
- id: q_sc_inconsistent
  kind: unexplained_difference
  about: [sc_3wk_d72, sc_4wk_d72, sc_3wk_d76, sc_4wk_d76, sc_3wk_d78, sc_4wk_d78, sc_3wk_d79, sc_4wk_d79, sc_3wk_hA, sc_4wk_hA, sc_3wk_hC, sc_4wk_hC]
  text: >-
    By Eqs. 2-3, SC - AIC = P (ln N - 2), which depends on N alone. For dogs 71, 74 and 77 the printed differences
    (5-6 for the three-element, 7-9 for the four-element windkessel) agree with the N that reproduces the AIC. For
    dogs 72, 76, 78 and 79 and both human beats the printed SC - AIC is 7-8 and 10-11, which would need N of about
    250-400, far from the N (89-128) that the printed AIC and RMSE imply. Either SC was computed with a different N
    or a different definition than Eq. 3.
  citation: {page: 2, printed_page: "H82", quote: "AIC and SC are defined as follows", where: "Eqs. 2-3"}
