- id: q_no_validation_westerhof1969
  kind: choice
  about: [zin_3wk, zin_4wk, inertance_eq1, fit_3wk_time, fit_4wk_time]
  text: >-
    (Cross-validation with westerhof1969, ref. 21.) No model of this record is validated against a measurement of
    Westerhof et al. 1969. This paper cites ref. 21 only qualitatively (p. 6: the aorta as a reflectionless tube with
    impedance equal to aortic Z_c; inertia in transmission-line models); its distributed model is ref. 17, not the
    1969 analog. The 1969 measurements recorded are decay times and 'about 50 per cent' changes measured on the
    analog itself, and apparent wave velocities in man (Luchsinger, Gabe; Fig. 7). zin_3wk and zin_4wk give input
    impedance only, not a decay time or a wave velocity; the 1969 measured human input impedances (Fig. 6) are not
    read in that record. inertance_eq1 could sum the 1969 Table 1 segments, but the 1969 paper measures no total
    inertance to compare with. The reverse direction (the 1969 models against this record's human Z_c and C,
    Table 2) is entered in westerhof1969/validations.yaml.
- id: q_no_validation_westerhof1971
  kind: choice
  about: [zin_3wk, zin_4wk]
  text: >-
