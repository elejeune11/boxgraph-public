- id: q_no_validation_vs_kim2010
  kind: choice
  about: [zin_3wk, zin_4wk, inertance_eq1_uniform, rc_std_d71, rp_d71, cppm_d71, fig5_mod_measured_fig]
  text: >
    (Cross-validation with kim2010, job 2026-11-06.) No validation is entered in either direction. kim2010's
    ref. 22 is a different Stergiopulos 1999 paper: the pulse pressure method paper, AJP 276: H424-H428, not this
    one (H81-H88); kim2010 does not cite this paper, and this paper (1999) cannot cite kim2010. kim2010's only
    measurements are the canine LAD mean flows of Gould et al. against diameter reduction (its Fig. 6); this
    record's runnable models give aortic input impedance against frequency (zin_3wk, zin_4wk), a segment
    inertance and statistics on Table 1, with no stenosis input and no coronary flow output, so none predicts
    them. kim2010's three-element Windkessels at its upper-branch and descending-aorta outlets have the shape of
    zin_3wk, but their parameters are tuned inputs of a 3D simulation (not recorded there) and no impedance is
    measured, so there is nothing to test. In the other direction, kim2010's runnable models give a human
    patient's mean coronary flows from its own bed resistances, CO = SV/T and percentage rules; this paper prints
    no stroke volume, cardiac output or coronary quantity for its dogs or beats (see
    kim2010/q_no_validation_vs_stergiopulos1999).
  citation: {page: 2, printed_page: "H82", where: text, quote: "Human ascending aortic pressure and flow"}
