- id: p_3wk_with_rp
  quantity: fit_parameter_count
  unit: dimensionless
  printed: "3"
  basis: >-
    Audit alternative to p_3wk. The paper says only Z_c and C were estimated (R_p given), so P = 2 is the reading of
    the record; but P in Eqs. 2-3 is "the number of parameters", which may count R_p as well (R_p, Z_c, C). With
    P = 3 the printed SC - AIC of dogs 72, 76, 78, 79 and both human beats match the N that the printed AIC implies
    (question q_sc_param_count). AIC alone hardly tells the two apart (N shifts by about 0.3).
  alternatives: ["2"]
  stands_for: P in Eqs. 2 and 3 for the three-element windkessel, counting R_p
- id: p_4wk_with_rp
