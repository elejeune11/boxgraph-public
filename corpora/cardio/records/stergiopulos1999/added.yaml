- id: n_hA
  quantity: sample_count
  unit: dimensionless
  printed: "101"
  basis: >-
    N for the type A human beat is not printed, nor the sampling of the waves taken from ref. 12. 101 samples per beat (100 intervals) is assumed; it is also the N at which Eq. 2 and the printed RMSE give the printed AIC of both windkessels for this beat, so only the SC comparisons test it independently.
  alternatives: ["100", "166"]
  stands_for: N in Eqs. 2 and 3 for the type A beat
