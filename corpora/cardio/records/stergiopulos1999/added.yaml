- id: n_d71
  quantity: sample_count
  unit: dimensionless
  printed: "84"
  basis: >-
    N, the number of samples in the heart cycle of dog 71, is not printed. Taken as 200 Hz times the heart period, 200/2.38 = 84.03, rounded; the heart rate 2.38 of Table 1 read as beats/s (question q_hr_unit). The 200 Hz sampling rate is not stated either: it was chosen because, with it, Eq. 2 and the printed RMSE give the printed AIC for the seven dogs, so the AIC comparisons test the RMSE-AIC pairs for one common sampling rate, not independently.
  alternatives: ["83", "85"]
  stands_for: N in Eqs. 2 and 3 for dog 71
