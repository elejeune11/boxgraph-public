notes: >
  The paper fits three- and four-element windkessels to aortic pressure (flow as input) for seven dogs, two human
  beats and a distributed model, and compares the fitted Z_c, C and L with "actual" values. The fits themselves
  cannot be rerun: they need measured waveforms printed only as plots, and runs take scalar inputs, so the two
  time-domain fits are recorded as not runnable (q_fit_not_runnable), as is Eq. 1 (no segment data, q_eq1_inputs).
  All of Tables 1-3 is recorded as printed, except body mass (feeds nothing). What is checked from the printed
  numbers: (1) Eqs. 2-3, AIC and SC of all 18 fits from the printed RMSE, with the unstated sample count N added
  per beat (q_sample_count): AIC agree to 1-7 units, SC disagree for most beats (q_sc_inconsistent, q_sc_d79_4wk);
  (2) the six paired t-tests on Table 1 against the P values in the Results and the abstract, run against both
  C_PPM and C_AR since the paper does not say which "actual" C (q_c_reference); the abstract and Results disagree
  (q_p_abstract_results) and P = 0.81 is not reproduced (q_p_c4); (3) every percentage over- or underestimate
  quoted in the text for the human beats and the distributed model, from Tables 2-3. The heart-rate unit of Table 1
  looks wrong (q_hr_unit). The input-impedance models of the two windkessels (Fig. 1 schematics) are recorded and
  related as the paper states (4WK -> 3WK as L -> infinity), but never run: their only printed results are plotted
  (Fig. 5), and the figure-rendering commands were refused in this session, so no figure was read (figures.md,
  q_figures_unread). Left out: the sensitivity percentages (11, 20, 5%), which rest on the unrunnable fits; the
  text repeat of the human L values; c_u = 4/3 of Eq. 1; and all figures.
  Figure pass (2026-11-02): every value-bearing panel of Figs. 1-5 is now read by calibrated code (figures.yaml,
  figures.md). Fig. 2 agrees with Table 1 in every mean and SE (models mean_se_rc, mean_se_c). Fig. 5 is
  reproduced by zin_3wk/zin_4wk with C_PPM and L = 0.019 in modulus, but its phase curves are reproduced only with
  the legend's line styles swapped (q_fig5_phase_legend). The Fig. 5 harmonics confirm the heart rate is in beats/s
  (q_fig5_harmonics_hr). The waves of Figs. 1, 3, 4 are recorded; no model in the record produces them yet
  (q_waves_model).
