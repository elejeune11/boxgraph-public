- {id: peripheral_resistance, name: peripheral resistance R_p, dimension: "[mass]/[length]**4/[time]", description: "mean pressure over mean flow (standard technique), or the R_p element of a windkessel"}
- {id: characteristic_impedance, name: aortic characteristic impedance Z_c (R_c), dimension: "[mass]/[length]**4/[time]", description: "the characteristic resistance R_c of the proximal aorta: either the average input-impedance modulus between the 3rd and 10th harmonics (standard technique), the R_c element fitted in a windkessel, or the value of the distributed model"}
- {id: total_arterial_compliance, name: total arterial compliance C, dimension: "[length]**4*[time]**2/[mass]", description: "dV/dP of the whole arterial tree: by the pulse pressure or area method, as the C element fitted in a windkessel, or summed over the distributed model"}
- {id: total_arterial_inertance, name: total arterial inertance L, dimension: "[mass]/[length]**4", description: "the L element of the four-element windkessel, or the summed inertance of the distributed model"}
- {id: velocity_profile_coefficient, name: coefficient c_u for a non-flat velocity profile in the segment inertance (Eq. 1), dimension: "dimensionless"}
- {id: heart_rate, name: heart rate, dimension: "1/[time]"}
- {id: pressure_rmse, name: root-mean-square error between measured and windkessel-fitted aortic pressure, dimension: "[mass]/[length]/[time]**2", description: "RMSE = sqrt(RSS/(N - 1)) over the samples of one heart cycle"}
- {id: akaike_criterion, name: Akaike information criterion of a windkessel pressure fit (Eq. 2), dimension: "dimensionless"}
- {id: schwarz_criterion, name: Schwarz criterion of a windkessel pressure fit (Eq. 3), dimension: "dimensionless"}
- {id: sample_count, name: number of samples N in the heart cycle fitted, dimension: "dimensionless"}
- {id: fit_parameter_count, name: number of fitted parameters P of a windkessel, dimension: "dimensionless"}
- {id: p_value, name: two-sided P value of a paired t-test between windkessel estimates and actual values over the dogs, dimension: "dimensionless"}
- {id: relative_overestimate, name: "relative overestimate of a parameter, (estimate - actual)/actual", dimension: "dimensionless"}
- {id: relative_underestimate, name: "relative underestimate of a parameter, (actual - estimate)/actual", dimension: "dimensionless"}
- {id: relative_deviation_magnitude, name: "magnitude of the relative deviation of a parameter, |estimate - actual|/actual", dimension: "dimensionless"}
- {id: frequency, name: frequency of a harmonic, dimension: "1/[time]"}
- {id: input_impedance_modulus, name: modulus of the aortic input impedance, dimension: "[mass]/[length]**4/[time]"}
- {id: input_impedance_phase, name: phase angle of the aortic input impedance, dimension: "dimensionless"}
- {id: mean_characteristic_impedance, name: average over the seven dogs of a characteristic impedance (standard or windkessel estimate), dimension: "[mass]/[length]**4/[time]", description: "the bar heights of Fig. 2, top"}
- {id: mean_total_arterial_compliance, name: average over the seven dogs of a total arterial compliance (standard or windkessel estimate), dimension: "[length]**4*[time]**2/[mass]", description: "the bar heights of Fig. 2, bottom"}
- {id: sem_characteristic_impedance, name: standard error of the mean over the seven dogs of a characteristic impedance, dimension: "[mass]/[length]**4/[time]"}
- {id: sem_total_arterial_compliance, name: standard error of the mean over the seven dogs of a total arterial compliance, dimension: "[length]**4*[time]**2/[mass]"}
- {id: body_mass, name: body mass of the dog, dimension: "[mass]"}
# figure pass
- {id: time_in_cycle, name: time from the start of the plotted heart cycle, dimension: "[time]"}
- {id: aortic_flow, name: ascending aortic blood flow, dimension: "[length]**3/[time]"}
- {id: aortic_pressure, name: ascending aortic blood pressure (measured or produced by a windkessel), dimension: "[mass]/[length]/[time]**2"}
- {id: bar_position, name: "position of a bar in a bar chart, counted from the left (1, 2, ...)", dimension: "dimensionless", description: "the x index of a reading of one bar of Fig. 2; it identifies the bar and enters no result"}
# relation job (Eq. 1 helper)
- {id: blood_density, name: blood density rho, dimension: "[mass]/[length]**3"}
- {id: segment_length, name: length l_s of an arterial segment, dimension: "[length]"}
- {id: segment_radius, name: radius of an arterial segment of uniform cross-section, dimension: "[length]", description: "A = pi R^2 in Eq. 1"}
- {id: segment_inertance, name: inertance L_i of one arterial segment (Eq. 1), dimension: "[mass]/[length]**4"}
