id: reldev_rc
name: relative deviation of an estimated characteristic impedance from its actual value
role: processing
stated: {page: 4, printed_page: "H84", quote: "The four-element windkessel underestimates Zc by", where: "Results, percentages of over- and underestimation"}
equation: "deviation = (estimate - actual)/actual x 100%"
from_words: true
inputs:
  est: {quantity: characteristic_impedance, unit: mmHg*s/ml}
  act: {quantity: characteristic_impedance, unit: mmHg*s/ml}
outputs:
  over: {quantity: relative_overestimate, unit: percent, description: "(est - act)/act"}
  under: {quantity: relative_underestimate, unit: percent, description: "(act - est)/act"}
  mag: {quantity: relative_deviation_magnitude, unit: percent, description: "|est - act|/act"}
settings: {}
stochastic: false
