id: info_criteria_eq2_3
name: Akaike information criterion and Schwarz criterion of a windkessel fit from its RMSE (Eqs. 2-3)
role: processing
stated: {page: 2, printed_page: "H82", quote: "AIC and SC are defined as follows", where: "Eqs. 2-3 and the RSS and RMSE definitions above them"}
equation: "RMSE = sqrt(RSS/(N - 1)); AIC = N ln(RSS) + 2P; SC = N ln(RSS) + P ln(N)"
inputs:
  RMSE: {quantity: pressure_rmse, unit: mmHg, description: "the printed RMSE; RSS = RMSE^2 (N - 1) is taken in mmHg^2, the unit of the printed RMSE"}
  N: {quantity: sample_count, unit: dimensionless}
  P: {quantity: fit_parameter_count, unit: dimensionless}
outputs:
  AIC: {quantity: akaike_criterion, unit: dimensionless}
  SC: {quantity: schwarz_criterion, unit: dimensionless}
settings: {}
stochastic: false
