id: inertance_eq1_uniform
name: inertance of one arterial segment of uniform cross-section (Eq. 1 with constant A)
role: model
stated: {page: 2, printed_page: "H82", quote: "The inertance of a tapered arterial segment (Li ) was", where: "Eq. 1"}
equation: "L_i = integral_0^{l_s} c_u rho/A(x) dx, with A = pi R^2 constant: L_i = c_u rho l_s/(pi R^2)"
inputs:
  cu: {quantity: velocity_profile_coefficient, unit: dimensionless}
  rho: {quantity: blood_density, unit: g/cm^3}
  ls: {quantity: segment_length, unit: cm}
  R: {quantity: segment_radius, unit: cm}
outputs:
  L: {quantity: segment_inertance, unit: g/cm^4}
settings: {}
stochastic: false
# Helper model added by the relation job: olufsen2004 (p. 71) compares its Eq. 27 with this paper's segment
# inertance through the factor c_u = 4/3. Eq. 1 is evaluated for one segment of constant radius, the case in
# which the comparison is made; the summed model inertance_eq1 is not runnable.
