id: mean_se_rc
name: average and standard error over the seven dogs of a characteristic impedance (the bars of Fig. 2, top)
role: processing
stated: {page: 4, printed_page: "H84", quote: "Mean values and standard errors for Zc and C are shown in Fig. 2", where: "Results; Fig. 2 caption"}
equation: "mean = (1/n) sum x_i;  SE = sd/sqrt(n), sd = sqrt(sum (x_i - mean)^2/(n - 1)), n = 7"
from_words: true
inputs:
  x1: {quantity: characteristic_impedance, unit: mmHg*s/ml, description: "dog 71"}
  x2: {quantity: characteristic_impedance, unit: mmHg*s/ml, description: "dog 72"}
  x3: {quantity: characteristic_impedance, unit: mmHg*s/ml, description: "dog 74"}
  x4: {quantity: characteristic_impedance, unit: mmHg*s/ml, description: "dog 76"}
  x5: {quantity: characteristic_impedance, unit: mmHg*s/ml, description: "dog 77"}
  x6: {quantity: characteristic_impedance, unit: mmHg*s/ml, description: "dog 78"}
  x7: {quantity: characteristic_impedance, unit: mmHg*s/ml, description: "dog 79"}
  bar: {quantity: bar_position, unit: dimensionless, description: "which bar of Fig. 2 is reproduced; it identifies the bar and does not enter the result"}
outputs:
  mean: {quantity: mean_characteristic_impedance, unit: mmHg*s/ml}
  se: {quantity: sem_characteristic_impedance, unit: mmHg*s/ml, description: "standard error of the mean, sd/sqrt(n) with the n - 1 sd"}
settings: {}
stochastic: false
