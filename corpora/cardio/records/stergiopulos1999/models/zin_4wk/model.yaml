id: zin_4wk
name: input impedance of the four-element windkessel (inertance parallel to the characteristic impedance)
role: model
stated: {page: 3, printed_page: "H83", quote: "ment windkessel models presented in", where: "Fig. 1, top right (schematic)"}
equation: "(R_c parallel L) in series with (R_p parallel C): Z_in = j omega L R_c/(R_c + j omega L) + R_p/(1 + j omega R_p C), omega = 2 pi f"
from_words: true
inputs:
  Rp: {quantity: peripheral_resistance, unit: mmHg*s/ml}
  Rc: {quantity: characteristic_impedance, unit: mmHg*s/ml}
  C: {quantity: total_arterial_compliance, unit: ml/mmHg}
  L: {quantity: total_arterial_inertance, unit: mmHg*s**2/ml}
  f: {quantity: frequency, unit: Hz}
outputs:
  mod: {quantity: input_impedance_modulus, unit: mmHg*s/ml}
  phase: {quantity: input_impedance_phase, unit: degree}
settings: {}
stochastic: false
