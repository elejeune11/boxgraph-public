id: reldev_l
name: relative deviation of an estimated total arterial inertance from its actual value
role: processing
stated: {page: 4, printed_page: "H84", quote: "indeed within 4% of the sum of all local inertances of", where: "Results, distributed model"}
equation: "deviation = (estimate - actual)/actual x 100%"
from_words: true
inputs:
  est: {quantity: total_arterial_inertance, unit: mmHg*s**2/ml}
  act: {quantity: total_arterial_inertance, unit: mmHg*s**2/ml}
outputs:
  over: {quantity: relative_overestimate, unit: percent, description: "(est - act)/act"}
  under: {quantity: relative_underestimate, unit: percent, description: "(act - est)/act"}
  mag: {quantity: relative_deviation_magnitude, unit: percent, description: "|est - act|/act"}
settings: {}
stochastic: false
