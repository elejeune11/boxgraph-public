id: inertance_eq1
name: inertance of a tapered arterial segment, summed over the distributed model (Eq. 1)
role: model
stated: {page: 2, printed_page: "H82", quote: "The inertance of a tapered arterial segment (Li ) was", where: "Eq. 1"}
equation: "L_i = integral_0^{l_s} c_u rho/A(x) dx; segments in series add; in parallel 1/L_{1+2} = 1/L_1 + 1/L_2"
runnable: false
not_runnable_reason: >-
  The segment lengths and cross-sectional areas of the distributed model (ref. 17) and the blood density are not
  printed, so the summed L of Table 3 (0.0070) cannot be recomputed from this paper.
inputs:
  cu: {quantity: velocity_profile_coefficient, unit: dimensionless}
outputs:
  L: {quantity: total_arterial_inertance, unit: mmHg*s**2/ml}
settings: {}
stochastic: false
