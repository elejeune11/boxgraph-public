id: reldev_c
name: relative deviation of an estimated total arterial compliance from its actual value
role: processing
stated: {page: 4, printed_page: "H84", quote: "For C the deviations are ,4% for the", where: "Results, percentages of over- and underestimation"}
equation: "deviation = (estimate - actual)/actual x 100%"
from_words: true
inputs:
  est: {quantity: total_arterial_compliance, unit: ml/mmHg}
  act: {quantity: total_arterial_compliance, unit: ml/mmHg}
outputs:
  over: {quantity: relative_overestimate, unit: percent, description: "(est - act)/act"}
  under: {quantity: relative_underestimate, unit: percent, description: "(act - est)/act"}
  mag: {quantity: relative_deviation_magnitude, unit: percent, description: "|est - act|/act"}
settings: {}
stochastic: false
