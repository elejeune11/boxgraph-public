  x3: {quantity: total_arterial_compliance, unit: ml/mmHg, description: "dog 74"}
  x4: {quantity: total_arterial_compliance, unit: ml/mmHg, description: "dog 76"}
  x5: {quantity: total_arterial_compliance, unit: ml/mmHg, description: "dog 77"}
  x6: {quantity: total_arterial_compliance, unit: ml/mmHg, description: "dog 78"}
  x7: {quantity: total_arterial_compliance, unit: ml/mmHg, description: "dog 79"}
  y1: {quantity: total_arterial_compliance, unit: ml/mmHg, description: "actual value (pulse pressure or area method), dog 71"}
  y2: {quantity: total_arterial_compliance, unit: ml/mmHg, description: "dog 72"}
  y3: {quantity: total_arterial_compliance, unit: ml/mmHg, description: "dog 74"}
  y4: {quantity: total_arterial_compliance, unit: ml/mmHg, description: "dog 76"}
  y5: {quantity: total_arterial_compliance, unit: ml/mmHg, description: "dog 77"}
  y6: {quantity: total_arterial_compliance, unit: ml/mmHg, description: "dog 78"}
  y7: {quantity: total_arterial_compliance, unit: ml/mmHg, description: "dog 79"}
