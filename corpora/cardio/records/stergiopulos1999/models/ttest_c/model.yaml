id: ttest_c
name: paired t-test of windkessel-estimated against actual total arterial compliance over the seven dogs
role: processing
stated: {page: 2, printed_page: "H82", quote: "on the dog data was used to determine whether the", where: "Methods, Data analysis"}
equation: "paired t-test (significance level P = 0.05): t = mean(x - y)/(sd(x - y)/sqrt(n)), n - 1 degrees of freedom"
