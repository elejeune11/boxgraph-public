  output: phase
  against: 'westerhof2009/fig6_A_ph_data_fig'
  purpose: validation
  quantities: {'westerhof2009/frequency': frequency, 'westerhof2009/input_impedance_phase': input_impedance_phase}
  conditions_ok: *condA
  basis: *b4fit
- id: val_4wk_fit_typeC_mod_vs_murgo
  model: zin_4wk
  inputs: {Rp: rp_hC, Rc: rc_4wk_hC, C: c_4wk_hC, L: l_4wk_hC}
  sweep: {f: 'westerhof2009/fig6_C_mod_data_fig'}
  output: mod
  against: 'westerhof2009/fig6_C_mod_data_fig'
  purpose: validation
  quantities: {'westerhof2009/frequency': frequency, 'westerhof2009/input_impedance_modulus': input_impedance_modulus}
  conditions_ok: *condC
  basis: *b4fit
- id: val_4wk_fit_typeC_ph_vs_murgo
  model: zin_4wk
  inputs: {Rp: rp_hC, Rc: rc_4wk_hC, C: c_4wk_hC, L: l_4wk_hC}
  sweep: {f: 'westerhof2009/fig6_C_ph_data_fig'}
  output: phase
  against: 'westerhof2009/fig6_C_ph_data_fig'
  purpose: validation
  quantities: {'westerhof2009/frequency': frequency, 'westerhof2009/input_impedance_phase': input_impedance_phase}
  conditions_ok: *condC
  basis: *b4fit
