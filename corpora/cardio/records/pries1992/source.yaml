notes: >
  The paper compiles in vitro tube-flow viscosity data and gives empirical fitting
  equations. Recorded as models: Eq. 2 (relative viscosity at discharge hematocrit 0.45
  vs diameter), Eq. 4 (curvature C vs diameter), Eqs. 2+4+6 (diameter-dependent B), Eq. 7
  (combined diameter and hematocrit dependence; it contains Eqs. 3 and 5), and the
  Fahraeus-effect pair Eq. 8/9
  (tube hematocrit from discharge hematocrit) and Eq. 10 (its printed inverse).
  The paper prints few model results as numbers: the comparisons are (i) Eq. 4 against
  the per-data-set C values of Table 2 and the C = 1 assigned to 3.3-6 um capillaries
  (fit_quality), (ii) Eqs. 2+4+6 against the per-data-set B values of Table 2
  (fit_quality), (iii) Eq. 2 and Eq. 7 against the approximate values ~3.2 (large tubes)
  and ~1.25 (at ~7 um) stated in the text (no verdict: approximate), (iv) a round trip
  Eq. 10 then Eq. 8 against the fixed tube hematocrit 0.45 of Fig. 6, which checks that
  the printed Eq. 10 inverts the printed Eq. 8, and (v) the C value -0.901 quoted in the
  Discussion against -0.908 in Table 2 (consistency, a likely misprint).
  Left out: Table 1 (methods; feeds no model), the n, hematocrit ranges and r2 columns
  of Table 2, the r2 = 0.919 of the Eq. 2 fit and the residual regression slopes
  (-0.005 per degC, 0.069 per cP), which are statistics of data not in the record.
  Figures 2-6 carry the fitting lines and data points. The first pass could not render
  figures; a later figure pass (2026-11-04) made calibrated code readings of them
  (figures.yaml, figures.md): the Eq. 2 line and the residual inset of Fig. 2, the Eq. 3
  lines and the measured points of each Fig. 3 panel (Eq. 3 is now a model of its own,
  eq3_eta_hct), the Eq. 4 line of Fig. 4, the three lines and the 0.45 data points of Fig. 5,
  and the six lines of Fig. 6 (the heavy fixed-Hct_T lines through a model chaining Eq. 10
  into Eq. 7, eq7_tube_hct). Lines are compared as reproductions, points as fit_quality.
  Left out: the letter symbols of Figs. 2, 4 and 5 (letters joined by lines, no reference
  point; the Fig. 4 letters are Table 2 values) and the 3.3 um line of Fig. 3 (hidden by its
  markers). The figures add two questions: the steep part of the plotted Eq. 2 lies below the
  printed Eq. 2 (q_fig_eq2_steep), and the Fig. 6 curves start near 3.1-3.3 um, above the
  3.06 um where Eq. 10 fails (q_fig6_start).
