- id: q_no_validation_against_pries1990
  kind: choice
  about: [eq2_eta045, eq3_eta_hct, eq4_C, eq6_B_diameter, eq7_eta_combined, eq7_tube_hct, eq8_ratio, eq8_tube_hct, eq10_discharge_hct]
  text: >
    Added by the validation job against pries1990. No model of this record predicts a measurement
    of pries1990: its measurements are network data in the rat mesentery (fractional red cell flow at
    one bifurcation, Fig. 2; segment hematocrit distributions and their mean, SD and CV, Fig. 5 and
    Table 3; flow velocity by generation, Fig. 6; pressures, Fig. 7; segment counts and inflow
    hematocrits), which need the unpublished network simulation, not a tube-flow viscosity or
    Fahraeus law. pries1990 measures no tube viscosity or tube hematocrit; its Fig. 1 curves, which
    Eq. 8 (described from ref. 40) resembles, are predictions, not measurements. The validation in
    the other direction (pries1990's Eqs. 2-3 against this record's measured viscosities) is in
    pries1990/validations.yaml.
  citation: {page: 7, quote: "a previously compiled (40) paramet"}
