- id: q_no_validation_vs_olufsen2012
  kind: choice
  about: [eq2_eta045, eq3_eta_hct, eq4_C, eq6_B_diameter, eq7_eta_combined, eq7_tube_hct, eq8_ratio, eq8_tube_hct, eq10_discharge_hct]
  text: >
    No validation against olufsen2012 (Olufsen et al., 1D arterial network with structured trees) is entered,
    in either direction (cross-validation job 2026-11-04). Neither paper cites the other or says a model of
    one predicts the other's data. olufsen2012 measures only vessel lengths against radius (Huang et al.
    pulmonary data, its Fig. 5) and MRI inflow waveforms (its Fig. 3); the models here give relative apparent
    viscosity, the hematocrit-curvature C, B and tube hematocrit, none of which is a length or a flow. The
    olufsen2012 models give stiffness, area ratios, lengths, pressures and pulse pressure, not a viscosity,
    so none can be judged against the measured viscosities here (Figs. 2, 3, 5); its network model, the
    only one with a viscosity input, is not runnable. See olufsen2012 q_no_validation_vs_pries1992.
- id: q_no_validation_vs_schwarz2020
  kind: choice
  about: [eta_fig5_points_HD045, eta_fig3_40um_points, eta045_large_tubes, eq2_eta045, eq7_eta_combined]
  text: >
    (Cross-validation with schwarz2020, cross-validation job 2026-11-06.) No validation is added in either
    direction. schwarz2020 measures only geometry of the human coronary tree (segment lengths, daughter symmetry,
    area growth, segment counts, terminal densities, perfused volumes); no model here gives any of these. Its
    viscosity Eq. 3 is the Pries et al. 1994 in vivo law, not this paper's in vitro law: it adds an endothelial-layer
    factor and a different small-vessel term, so its output (in vivo apparent viscosity) is not the in vitro tube
    viscosity measured here, and where the two coincide (large tubes) its shared terms were fitted to these same
    data. The full reasoning is in schwarz2020 q_no_validation_vs_pries1992.
