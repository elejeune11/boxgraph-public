# Calibrated figure readings (mode: code). Shared helpers in figures/_p92.py: each crop is
# straightened by the tilt of its longest axis line; frame lines, ticks and curve runs are
# found in the image; which run is the curve is stated in each reading's code.

# ---- Fig. 2 (p. 4): eta_rel at hematocrit 0.45 against diameter, Eq. 2 line; inset residuals --
- id: fig2_eq2
  page: 4
  where: "Fig. 2"
  what: "the broken fitting line of Eq. 2, where it stands clear of the data letters"
  dpi: 900
  crop: [900, 3990, 6300, 8700]
  x: {quantity: tube_diameter, unit: um}
  y: {quantity: relative_apparent_viscosity, unit: dimensionless}
  mode: code
  code: figures/fig2_eq2.py
  at: ["3.3", "3.6", "4", "1200", "1500", "2000", "2300"]
- id: fig2_residuals
  page: 4
  where: "Fig. 2, inset"
  what: "the filled circles: residuals of the measured eta_rel at hematocrit 0.45 from Eq. 2"
  dpi: 1200
  crop: [5980, 9050, 9634, 10960]
  x: {quantity: tube_diameter, unit: um}
  y: {quantity: viscosity_residual_eq2, unit: dimensionless}
  mode: code
  code: figures/fig2_residuals.py
  at: []

