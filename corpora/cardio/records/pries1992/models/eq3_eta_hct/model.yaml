id: eq3_eta_hct
name: relative apparent viscosity vs discharge hematocrit for one data set (Eq. 3)
role: fit
stated: {page: 5, quote: "a consistently satisfying description of the hematocrit", where: Eq. 3}
equation: "eta_rel = 1 + B * [(1 - Hct_D)^C - 1]"
inputs:
  B: {quantity: viscosity_hct_steepness, unit: dimensionless}
  C: {quantity: viscosity_hct_curvature, unit: dimensionless}
  HctD: {quantity: discharge_hematocrit, unit: dimensionless}
outputs:
  eta: {quantity: relative_apparent_viscosity, unit: dimensionless}
settings: {}
stochastic: false
