id: eq8_ratio
name: tube-to-discharge hematocrit ratio, Fahraeus effect (Eq. 8 as printed, ratio form)
role: model
stated: {page: 7, quote: "ric description of the Fahraeus effect is used", where: Eq. 8}
equation: "Hct_T/Hct_D = Hct_D + (1 - Hct_D) * (1 + 1.7 * e^(-0.35D) - 0.6 * e^(-0.01D))"
inputs:
  HctD: {quantity: discharge_hematocrit, unit: dimensionless}
  D: {quantity: tube_diameter, unit: um}
outputs:
  HctT_HctD: {quantity: tube_discharge_hematocrit_ratio, unit: dimensionless}
settings: {}
described_from: pries1990
stochastic: false
