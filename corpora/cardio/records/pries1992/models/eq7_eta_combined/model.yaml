id: eq7_eta_combined
name: relative apparent viscosity vs tube diameter and discharge hematocrit (Eq. 7 with Eqs. 2 and 4)
role: model
stated: {page: 6, quote: "Substitution of Eq. 6 into Eq. 3 results in", where: Eq. 7}
equation: "eta_rel = 1 + (eta_rel0.45 - 1) * ((1 - Hct_D)^C - 1) / ((1 - 0.45)^C - 1), with eta_rel0.45 from Eq. 2 and C from Eq. 4"
inputs:
  D: {quantity: tube_diameter, unit: um}
  HctD: {quantity: discharge_hematocrit, unit: dimensionless}
outputs:
  eta: {quantity: relative_apparent_viscosity, unit: dimensionless}
settings: {}
built_from: [eq2_eta045, eq4_C]
stochastic: false
