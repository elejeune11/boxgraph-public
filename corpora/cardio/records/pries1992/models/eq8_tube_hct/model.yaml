id: eq8_tube_hct
name: tube hematocrit from discharge hematocrit, Fahraeus effect (Eqs. 8 and 9)
role: model
stated: {page: 7, quote: "ric description of the Fahraeus effect is used", where: Eq. 8}
equation: "Hct_T/Hct_D = Hct_D + (1 - Hct_D) * (1 + 1.7 * e^(-0.35D) - 0.6 * e^(-0.01D)); X = 1 + 1.7 * e^(-0.35D) - 0.6 * e^(-0.01D) (Eq. 9)"
inputs:
  HctD: {quantity: discharge_hematocrit, unit: dimensionless}
  D: {quantity: tube_diameter, unit: um}
outputs:
  HctT: {quantity: tube_hematocrit, unit: dimensionless}
settings: {}
described_from: pries1990
stochastic: false
