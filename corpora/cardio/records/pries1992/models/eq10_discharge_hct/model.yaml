id: eq10_discharge_hct
name: discharge hematocrit from tube hematocrit, the printed solution of Eq. 8 (Eqs. 9 and 10)
role: model
stated: {page: 7, quote: "can be solved for", where: Eq. 10}
equation: "Hct_D = -X/(2 - 2X) + [(X/(2 - 2X))^2 + Hct_T/(1 - X)]^0.5, X = 1 + 1.7 * e^(-0.35D) - 0.6 * e^(-0.01D)"
inputs:
  HctT: {quantity: tube_hematocrit, unit: dimensionless}
  D: {quantity: tube_diameter, unit: um}
outputs:
  HctD: {quantity: discharge_hematocrit, unit: dimensionless}
settings: {}
stochastic: false
