- {id: tube_diameter, name: inner tube diameter, dimension: "[length]", description: "D, inner diameter of the glass tube"}
- {id: relative_apparent_viscosity, name: relative apparent viscosity, dimension: dimensionless, description: "eta_rel, apparent viscosity of the suspension in tube flow divided by the viscosity of the suspending medium"}
- {id: discharge_hematocrit, name: discharge hematocrit, dimension: dimensionless, description: "Hct_D, volume fraction of red cells in the blood leaving the tube"}
- {id: feed_hematocrit, name: feed hematocrit, dimension: dimensionless, description: "Hct_F, volume fraction of red cells in the feed reservoir"}
- {id: tube_hematocrit, name: tube hematocrit, dimension: dimensionless, description: "Hct_T, volume fraction of red cells within the tube"}
- {id: tube_discharge_hematocrit_ratio, name: tube to discharge hematocrit ratio, dimension: dimensionless, description: "Hct_T/Hct_D, the left-hand side of Eq. 8 (Fahraeus effect)"}
- {id: viscosity_hct_steepness, name: steepness B of the viscosity-hematocrit relation, dimension: dimensionless, description: "B in Eq. 3"}
- {id: viscosity_hct_curvature, name: curvature C of the viscosity-hematocrit relation, dimension: dimensionless, description: "C in Eq. 3"}
- {id: viscosity_residual_eq2, name: residual of relative apparent viscosity from Eq. 2, dimension: dimensionless, description: "measured eta_rel at hematocrit 0.45 minus the value of Eq. 2 at the same diameter (Fig. 2 inset)"}
- {id: medium_viscosity, name: viscosity of the suspending medium, dimension: "[mass]/[length]/[time]"}
