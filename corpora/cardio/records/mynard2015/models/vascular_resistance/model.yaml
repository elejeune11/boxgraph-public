id: vascular_resistance
name: vascular resistance as mean pressure drop over cardiac output (SVR, PVR)
role: processing
stated: {page: 7, printed_page: "1449", quote: "SVR mmHg s/mL 0.90 0.80", where: "Table 6 (SVR and PVR are not defined in the paper; the usual definition is used)"}
equation: "R = (P_in - P_out)/CO"
from_words: true
inputs:
  P_in: {quantity: mean_pressure, unit: mmHg}
  P_out: {quantity: mean_pressure, unit: mmHg}
  CO: {quantity: cardiac_output, unit: L/min}
outputs:
  R: {quantity: vascular_resistance, unit: mmHg*s/mL}
settings: {}
stochastic: false
