id: min_volume_from_ef
name: minimum (end-systolic) chamber volume from maximum volume and ejection fraction
role: processing
stated: {page: 7, printed_page: "1449", quote: "LV (EF) – 0.60 0.68", where: "Table 6 (EF is not defined in the paper; the usual definition is used)"}
equation: "EF = (Vmax - Vmin)/Vmax  =>  Vmin = Vmax (1 - EF)"
from_words: true
inputs:
  Vmax: {quantity: chamber_volume, unit: mL}
  EF: {quantity: ejection_fraction, unit: dimensionless}
outputs:
  Vmin: {quantity: chamber_volume, unit: mL}
settings: {}
stochastic: false
