id: cardiac_output_from_ef
name: cardiac output as heart rate times ventricular stroke volume (EF x maximum volume)
role: processing
stated: {page: 7, printed_page: "1449", quote: "Cardiac output L/min 6.2 6.5", where: "Table 6 (the relation is not stated; the usual definition is used)"}
equation: "CO = HR x SV, SV = EF x Vmax"
from_words: true
inputs:
  HR: {quantity: heart_rate, unit: 1/min}
  EF: {quantity: ejection_fraction, unit: dimensionless}
  Vmax: {quantity: chamber_volume, unit: mL}
outputs:
  CO: {quantity: cardiac_output, unit: L/min}
settings: {}
stochastic: false
