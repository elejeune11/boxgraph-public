id: sip_ratio_eq1
name: shortening-induced intracellular pressure as a fraction of ventricular cavity pressure (Eq. 1)
role: model
stated: {page: 3, printed_page: "1445", quote: "pSIP is assumed to be directly proportional", where: "Eq. 1"}
equation: "pSIP = alpha_SIP [pV/(vV - Vp=0,V)]  =>  pSIP/pV = alpha_SIP/(vV - Vp=0,V)"
inputs:
  alpha: {quantity: sip_constant, unit: mL}
  vV: {quantity: chamber_volume, unit: mL}
  Vp0: {quantity: zero_pressure_volume, unit: mL}
outputs:
  ratio: {quantity: sip_pressure_ratio, unit: dimensionless}
settings: {}
stochastic: false
