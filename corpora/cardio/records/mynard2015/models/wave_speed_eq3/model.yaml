id: wave_speed_eq3
name: reference wave speed from reference diameter (Eq. 3, empirical formula after Olufsen)
role: model
stated: {page: 6, printed_page: "1448", quote: "empirical formula suggested by Olufsen et al.", where: "Eq. 3"}
equation: "c0^2 = (2/(3 rho)) Eh/D0 = (2/(3 rho)) [k1 exp(k2 D0/2) + k3]"
described_from: ref-96
inputs:
  rho: {quantity: blood_density, unit: g/cm^3}
  k1: {quantity: wave_speed_coef_k1, unit: g/s^2/cm}
  k2: {quantity: wave_speed_coef_k2, unit: 1/cm}
  k3: {quantity: wave_speed_coef_k3, unit: g/s^2/cm}
  D0: {quantity: vessel_diameter, unit: cm}
outputs:
  c0: {quantity: reference_wave_speed, unit: cm/s}
settings: {}
stochastic: false
