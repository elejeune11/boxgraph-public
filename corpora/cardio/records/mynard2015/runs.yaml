# ---- Eq. 3: smallest c0 in a network = c0 of its largest segment (c0 falls with D0 since k2 < 0) ----
- {id: run_c0_sys_art_min, model: wave_speed_eq3, inputs: {rho: rho_blood, k1: k1_sys_art, k2: k2_sys_art, k3: k3_sys_art, D0: d0_aortic_root_added}, outputs: {c0: c0_sys_art_min_pred}, note: "D0 of the aortic root is added (Supplemental File 1)."}
- {id: run_c0_pulm_art_min, model: wave_speed_eq3, inputs: {rho: rho_blood, k1: k1_pulm_art, k2: k2_pulm_art, k3: k3_pulm_art, D0: d0_mpa_added}, outputs: {c0: c0_pulm_art_min_pred}, note: "D0 of the main pulmonary artery is added (Supplemental File 1)."}
- {id: run_c0_cor_vein_min, model: wave_speed_eq3, inputs: {rho: rho_blood, k1: k1_cor_vein, k2: k2_cor_vein, k3: k3_cor_vein, D0: d_cs_model}, outputs: {c0: c0_cor_vein_min_pred}, note: "The coronary sinus (0.79 cm, p. 6) is taken as the largest coronary vein."}

# ---- Eq. T5: pericardial pressure ----
- {id: run_ppc_initial, model: pericardial_pressure_t5, inputs: {Kpc: k_pc, V0pc: v0_pc, Phi: phi_pc, v_lv: vt0_lv, v_rv: vt0_rv, v_la: vt0_la, v_ra: vt0_ra, v_pcf: v_pcf, v_myo: v_myo}, outputs: {ppc: ppc_initial_pred}, note: "Initial chamber volumes of Table 4 (Vt=0)."}
- {id: run_ppc_end_diastole, model: pericardial_pressure_t5, inputs: {Kpc: k_pc, V0pc: v0_pc, Phi: phi_pc, v_lv: t6_lv_max_model, v_rv: t6_rv_max_model, v_la: t6_la_min_model, v_ra: t6_ra_min_model, v_pcf: v_pcf, v_myo: v_myo}, outputs: {ppc: ppc_end_diastole_pred}, note: "Ventricles at their Table 6 maximum and atria at their Table 6 minimum: about ventricular end-diastole, just after atrial contraction. The atria are at least at their minimum at any instant, so this is a lower bound on the pericardial pressure at ventricular end-diastole."}

# ---- Eq. 1: pSIP / pV at the smallest LV volume ----
- {id: run_lv_min_volume, model: min_volume_from_ef, inputs: {Vmax: t6_lv_max_model, EF: t6_lv_ef_model}, outputs: {Vmin: lv_min_volume_pred}}
