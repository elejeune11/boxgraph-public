- {id: run_svr_no_venous, model: vascular_resistance, inputs: {P_in: t6_aort_mean_model, P_out: p_out_zero_added, CO: t6_co_model}, outputs: {R: svr_no_venous_pred}, note: "Alternative definition: mean aortic root pressure/CO."}
