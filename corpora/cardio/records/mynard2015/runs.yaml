# ---- Table 6 relations ----
- {id: run_co_lv, model: cardiac_output_from_ef, inputs: {HR: t6_hr_model, EF: t6_lv_ef_model, Vmax: t6_lv_max_model}, outputs: {CO: co_from_lv_pred}}
