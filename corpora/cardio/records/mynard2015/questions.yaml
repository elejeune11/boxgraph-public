  citation: {page: 6, quote: "bed resistances were based on data in Stergiopulos"}
- id: q_no_validation_vs_westerhof1969
  kind: choice
  about: [wave_speed_eq3, vascular_resistance, compliance_sum, cardiac_output_from_ef, circulation_1d_0d]
  text: >
    (Cross-validation with westerhof1969, ref. 130, job 2026-11-06.) No model of this record is validated against
    a measurement of westerhof1969. This paper cites ref. 130 only as one source its systemic arterial network
    "was adapted from" (p. 4), not as data any of its models explains. westerhof1969's measurements are the
    pressure decay times 0.8, 0.4, 1.66 and about 0.5 s and the "about 50 per cent" rises in impedance level and
    pulse wave velocity of a stiffened system, all measured on its own electrical analog (not in man, and
    predicted there by its own models), and the apparent wave velocities in man of Luchsinger et al. and Gabe et
    al. as functions of frequency (its Fig. 7). wave_speed_eq3 gives the reference wave speed c0 of a segment
    from its diameter, with no frequency input; an apparent velocity from phase delays includes reflections and
    varies with frequency, and westerhof1969's own reading declines to equate even its plateau with a local
    phase velocity (its figures.md), so the two are not the same quantity; the measured curves also give no
    diameter. The other runnable models (resistance, compliance sum, CO and EF arithmetic, Eq. T5, Eq. 1) give
    no decay time, no relative change and no wave velocity. A decay time or a frequency-dependent apparent
    velocity would need circulation_1d_0d, which is not runnable (q_full_model_not_runnable), and the analog's
    decay times describe an electrical model, not a subject this model represents. For the other direction see
    westerhof1969 q_no_validation_vs_mynard2015.
  citation: {page: 4, quote: "was adapted from previous studies"}
- id: q_no_validation_vs_alastruey2011
  kind: choice
  about: [circulation_1d_0d, wave_speed_eq3, vascular_resistance, compliance_sum, cardiac_output_from_ef]
  text: >
    (Cross-validation with alastruey2011, ref. 2, job 2026-11-06.) No model of this record is validated against a
    measurement of alastruey2011. This paper cites ref. 2 only for the velocity profiles adopted in the convective
    and friction terms of Eq. T2 (p. 3), not as data any of its models explains. alastruey2011's measurements are
    in vitro: the fluid density and viscosity, the silicone's Young's modulus and wall viscosity, the per-segment
    geometry and wave speeds c0 of its 37-tube phantom (Table 2), the load-extension holds and loop of Fig. 2 and
    the midpoint pressure and flow waveforms and flow harmonics of Figs. 3-4. circulation_1d_0d, which shares
    network_1d's shape (flow, pressure from a density), would be needed for the waveforms; it is not runnable
    (q_full_model_not_runnable) and represents the human circulation with a beating heart, not a pump-driven
    silicone network. wave_speed_eq3 could be run at the phantom's diameters, but its coefficients k1-k3 are an
    empirical fit to human arteries (Table 2); the phantom's c0 are set by the silicone's E and wall thickness,
    which Eq. 3 does not take, so its output would not be a prediction of those tubes' measured wave speeds.
    vascular_resistance gives the whole systemic (or pulmonary) resistance from mean pressures and cardiac
    output; the phantom's measured Rp (Table 2) are the resistances of single terminal tubes, a different
    quantity despite the shared dimension. The compliance sum and the CO/EF arithmetic give quantities the
    phantom does not measure (it has a pump, no ventricle, volume or ejection fraction). For the other
    direction see alastruey2011 q_no_validation_vs_mynard2015.
  citation: {page: 3, quote: "boundary layer for the viscous friction term, as adopted"}
- id: q_no_validation_vs_formaggia2003
  kind: choice
  about: [wave_speed_eq3, circulation_1d_0d, vascular_resistance, compliance_sum, cardiac_output_from_ef]
  text: >
    (Cross-validation with formaggia2003, ref. 34, job 2026-11-06.) No model of this record is validated
    against a measurement of formaggia2003, because that record holds none: formaggia2003 is a methods paper
    whose data are the inputs of its numerical tests (density, viscosity, E, h0, radii, the half-sine inlet
    pressure, loss coefficients and angles), the alpha = 1.1 it quotes from its ref. 19, and its own
    simulated A, Q, W1 and W2 (Figs. 6-8, 11-18), all origin reported, predicted or derived. This paper cites
    ref. 34 only for the operator splitting of the viscoelastic term on internal nodes (p. 3), not as data
    any of its models explains. wave_speed_eq3 and formaggia2003/bifurcation_angles share a shape (a velocity
