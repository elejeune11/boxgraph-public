  citation: {page: 6, quote: "with the value of 0.81 measured in humans"}

- id: q_no_validation_vs_olufsen1999
  kind: choice
  about: [wave_speed_eq3, cardiac_output_from_ef, vascular_resistance, circulation_1d_0d]
  text: >
    No validation of this record's models against olufsen1999 (ref. 96) is entered (cross-validation job
    2026-11-06). The paper cites ref. 96 only for the form of its wave-speed formula (Eq. 3, p. 6), not for
    data. olufsen1999's measurements are the cardiac output 4.14 l/min and the inflow curve q(t) of its ref. 20
    (Fig. 4), the input impedance modulus and phase md 0 / md 1 of Mills et al. (Fig. 9), and the aortic,
    subclavian-brachial and radial pressures of Remington and Wood (Fig. 12); its Fig. 3 Eh/r0 points are
    estimates, not measurements, and give a wall stiffness, not a wave speed. wave_speed_eq3 gives only c0,
    which olufsen1999 does not measure. cardiac_output_from_ef would need the heart rate, ejection fraction
    and ventricular volume of olufsen1999's subject, which neither paper states; vascular_resistance needs
    mean pressures and a flow of one condition, which olufsen1999 does not measure together. Impedance spectra
    and pressure waveforms would need circulation_1d_0d, which is not runnable. The model-to-model relation
    between Eq. 3 and olufsen1999's Eq. 6 is in relations.yaml and q_eq3_factor_vs_olufsen1999. In the other
    direction see olufsen1999 q_no_validation_vs_mynard2015.
  citation: {page: 6, quote: "empirical formula suggested by Olufsen et al."}

- id: q_no_validation_vs_olufsen2000
  kind: choice
  about: [wave_speed_eq3, cardiac_output_from_ef, vascular_resistance, min_volume_from_ef, circulation_1d_0d]
  text: >
    No validation of this record's models against olufsen2000 is entered (cross-validation job 2026-11-06).
    This paper does not cite olufsen2000 (its Olufsen reference, ref. 96, is olufsen1999) and never sets its
    results against olufsen2000's data. olufsen2000 measures, for one young male subject, the heart rate 51/min,
    the cardiac period 1.1 s (Fig. 3 caption), the ascending-aorta inlet radius 1.25 cm (Table 1), the cuff
    pressures 120/80 mmHg, and MR flow waveforms at the ascending aorta (Fig. 3) and nine further sites (Fig. 7).
    None is the output of a runnable model here: wave_speed_eq3 gives a wave speed, which olufsen2000 does not
    measure (it could be run at D0 = 2 x 1.25 cm, but there is nothing to set it against);
    cardiac_output_from_ef and min_volume_from_ef need an ejection fraction and ventricular volume of that
    subject, which neither paper states, and give a cardiac output or volume olufsen2000 does not measure
    (the mean of the Fig. 3 inflow would be a computed number, not a printed measurement); vascular_resistance
    needs a mean pressure drop and a cardiac output of one condition, which olufsen2000 does not give (the cuff
    gives only systolic and diastolic values). The flow waveforms and cuff pressures would need
    circulation_1d_0d, which is not runnable, and they belong to a different subject from the ones the model
    is tuned to. The model-to-model relation between Eq. 3 and olufsen2000's Eqs. 14-15 is in relations.yaml
    (rel_wave_speed_from_olufsen2000_tube_law). In the other direction see olufsen2000
    q_no_validation_vs_mynard2015.
  citation: {page: 6, quote: "empirical formula suggested by Olufsen et al."}

- id: q_c0_vs_pwv_reymond2009
  kind: choice
  about: [wave_speed_eq3, circulation_1d_0d, cardiac_output_from_ef, vascular_resistance]
  text: >
    (Cross-validation with reymond2009, ref. 104, job 2026-11-06.) One validation is entered: Eq. 3 with the
    systemic-artery coefficients of Table 2, run at each lumen diameter of reymond2009's Fig. 3, against the
    literature PWV plotted there. Two choices are open. (1) c0 is taken as the same quantity as measured PWV:
    c0 is the wave speed at the 80 mmHg reference pressure, while the Fig. 3 values are PWV measured at the
    sources' own pressures in subjects of various ages. Both papers set c0 or PWV(Pref) beside such
    measurements, but a PWV measured at a higher mean pressure would be higher than c0. (2) The systemic-artery
    coefficients are used for every Fig. 3 point, including the small cerebral arteries of Giller and Aaslid,
    since this paper applies one set of coefficients to all its systemic arteries, cerebral ones included.
    The validation comes out not reproduced: Eq. 3 gives wave speeds below the measured PWV over the Fig. 3
    diameter range, the more so for the small arteries, where reymond2009's own fit also lies below the points
    (its p. 5, "it seems to underestimate the PWV"). Choice (1) leans the same way, since c0 is defined at a
    pressure below mean arterial pressure.
    Not used: the shared shape of cardiac_output_from_ef and reymond2009/arterial_tree_1d is no pair to test,
    since reymond2009 measures no ejection fraction or ventricular volume and arterial_tree_1d is not runnable.
    vascular_resistance would need a measured resistance in reymond2009, which it does not give. The Fig. 4 in
    vivo waveforms taken from ref. 104 are reymond2009's measurements, but the model that would predict them,
    circulation_1d_0d, is not runnable (q_full_model_not_runnable). No Table 6 quantity is measured in
    reymond2009 (it gives no heart rate, cardiac output, chamber volume or ejection fraction of its volunteers).
  citation: {page: 6, quote: "empirical formula suggested by Olufsen et al.", where: "Eq. 3"}
- id: q_no_validation_vs_stergiopulos1992
  kind: choice
  about: [circulation_1d_0d, wave_speed_eq3, vascular_resistance, t6_aort_mean_ref, t6_aort_pulse_ref, aoroot_p_fig4_invivo]
  text: >
    (Cross-validation with stergiopulos1992, ref. 116, job 2026-11-06.) No model of this record is validated
    against a measurement of stergiopulos1992. Its measurements are the Gosling et al. pulsatility indices
    (aorta, groin, knee, ankle) and the Fronek et al. leg/brachial systolic indices for normal subjects and two
