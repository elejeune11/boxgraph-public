- id: q_full_model_not_runnable
  kind: unstated_input
  about: [circulation_1d_0d]
  text: >
    The closed-loop model that produces Tables 6 and 8 and Figs. 4-7 cannot be run from this paper: the network
    geometry and every vascular bed parameter are in Supplemental Files 1-2 (record mynard2015_data), and the grid,
    time step and coronary layer parameters are not printed. Its printed results are recorded and checked only
    against each other, against the paper's own reference data, and through the sub-models that can be run alone.
- id: q_mu_av_ratio
  kind: possible_error
  about: [mu_av_la, mu_av_ra, cmp_mu_av_la]
  text: >
    The text says the left atrial mu_AV is 2/3 of the right atrial value, which gives 0.022 g/cm7/s from RA 0.033.
    Table 4 prints LA 0.050 and RA 0.033, so LA is 3/2 of RA. Either the table's LA and RA entries are swapped, or the
    text has the ratio inverted. Annulus displacement is larger at the tricuspid than at the mitral annulus, which fits
    the text (left smaller than right). An erratum was published in 2016; it is not part of this record.
  citation: {page: 7, quote: "mated as 2/3 of the right atrial value based on mitral"}
- id: q_ppc_above_claim
  kind: unexplained_difference
  about: [ppc_normal_claim, cmp_ppc_end_diastole, cmp_ppc_initial]
  text: >
    With the printed Kpc = 0.5 mmHg, V0,pc = 641 mL and Phi_pc = 40 (mL), Eq. T5 gives 0.5 mmHg exactly when the
    chambers hold 641 - 30 - 192 = 419 mL in total. At ventricular end-diastole, Table 6 gives at least 141 + 156 +
    75 + 58 = 430 mL (ventricles at their maximum, atria at their minimum), so ppc is at least about 0.66 mmHg. With
    the Table 4 initial volumes (446 mL) it is about 0.98 mmHg. The statement 'less than 0.5 mmHg under normal
    conditions' then holds only for part of the beat or for a mean, which the paper does not say.
  citation: {page: 8, quote: "a pericardial pressure of less than 0.5 mmHg under"}
- id: q_phi_pc_unit
  kind: reading
  about: [phi_pc]
  text: "Phi_pc = 40 is printed with no unit. The record reads it as mL, the unit the exponent of Eq. T5 requires."
  citation: {page: 8, quote: "Fpc = 40, while pericardial cavity volume"}
- id: q_sip_ratio_reading
  kind: reading
  about: [sip_ratio_max_claim, cmp_sip_ratio_max]
  text: >
    'Maximum pSIP was 20% of left ventricular cavity pressure' is read as the largest ratio pSIP/pV over the beat. By
    Eq. 1 this ratio is alpha_SIP/(vV - Vp=0) = 8.2/(vV - 10), largest at the smallest LV volume. Table 6 gives
    141 x (1 - 0.60) = 56.4 mL, so the ratio is about 17.7%, not 20%; 20% needs vV of about 51 mL. The sentence may
    instead mean peak pSIP over peak LV pressure, which needs the waveforms and cannot be checked here.
  citation: {page: 7, quote: "that maximum pSIP was 20% of left ventricular cavity"}
- id: q_co_lv_rv
  kind: unexplained_difference
  about: [cmp_co_from_lv, cmp_co_from_rv, t6_co_model]
  text: >
    HR x EF x Vmax gives 6.35 L/min for the LV (75 x 0.60 x 141 mL) and 6.20 L/min for the RV (75 x 0.53 x 156 mL),
    against the printed cardiac output of 6.2 L/min. The LV value agrees only at the edge of what the rounding of its
    three inputs allows. The volumetric LV stroke volume may include valve regurgitation during closure (dynamic valves, Eqs. T14-T15) that
    the net output excludes, or cardiac output may be measured elsewhere. The paper does not define it.
- id: q_svr_definition
  kind: unstated_model
  about: [vascular_resistance, cmp_svr, cmp_svr_no_venous, cmp_pvr]
  text: >
    SVR and PVR are not defined. (mean AoRt - mean RA)/CO reproduces SVR 0.90; mean AoRt/CO gives 0.94. For PVR,
    (mean PT - mean LA)/CO gives 0.068 from the rounded Table 6 values, against the printed 0.06.
- id: q_c0_sys_art_min
  kind: unexplained_difference
  about: [cmp_c0_sys_art_min, c0_min_sys_art, d0_aortic_root_added]
  text: >
    Eq. 3 with the Table 2 systemic arterial coefficients and rho = 1.06 g/cm3 gives at most about 460.4 cm/s as
    D0 grows (sqrt(2 k3/(3 rho))), so a minimum of 461 needs a largest systemic arterial D0 of about 1.8 cm, smaller
    than a typical aortic root. The difference is within the rounding of the printed k3 (33.7) and rho (1.06). The
    aortic root diameter of Supplemental File 1 would settle this.
- id: q_mu0_arterial_5
  kind: overstated_claim
  about: [claim_mu0_arterial_max, cmp_t8_mu0_arterial_max, t8_mu0_mpa_fcw]
  text: >
    The text says removing AV plane motion (mu = 0) has a negligible effect (<5%) on arterial waves other than the
    MPA FEWls, but Table 8 gives -5% for the MPA FCWee: equal to the bound, not below it, at the printed precision.
  citation: {page: 11, quote: "fect (<5%) on arterial waves"}
- id: q_lvemax_60
  kind: reading
  about: [t8_lvemax_aort_fcw, t8_lvemax_aort_few]
  text: >
    'Depressed LV contractility most significantly affects aortic root FCWee and FEWls (by ~60%)': Table 8 gives -60
    and +56. The FEWls magnitude increases, which the wording does not say. Approximate claims are not compared.
- id: q_audit_grid_nodes
  kind: reading
  about: [circulation_1d_0d]
  text: >
    Audit: the not_runnable_reason says the finite element grid is not stated, but p. 4 prints the size of the
    1D networks (396 segments, 5359 nodes, 188 junctions) and the steady-state rule (9 cycles for the baseline).
    The node spacing per segment and the time step are still not printed, so the model stays not runnable;
    the printed node count could be entered as a setting of circulation_1d_0d.
  citation: {page: 4, quote: "segments, 5359 nodes and 188 junctions in the 1D net-"}
- id: q_table2_eq_label
  kind: reading
  about: [wave_speed_eq3]
  text: "The Table 2 caption says its coefficients are used in Eq. (T3); they are the k1, k2, k3 of Eq. (3)."
  citation: {page: 6, quote: "Coefficients used in Eq. (T3) for calculation of wave speed"}
- id: q_fig4_scales
  kind: reading
  about: [fig4_aoroot_flow_mod, fig4_aoroot_flow_iv, aoroot_flow_fig4_model]
  text: >
    Figure readings: in Fig. 4 only the bottom row prints time labels and the model panels print no y labels.
    Each panel is read on its own x ticks matched to the bottom row's 0.2, 0.4, 0.6, 0.8 s (the four ticks stand
    at the same places in every panel), and each model panel on the y labels of the in vivo panel beside it. The
    model axes' own tick marks sit on those label rows (the reading code checks this and says on how many), so a
    shared y range is what the figure shows, but the paper does not state it. The time axes of the in vivo
    curves are as replotted by the authors (one cycle from an origin they chose), so in vivo and model curves
    are not aligned in time by anything the paper states.
  citation: {page: 8, quote: "Comparison of published human flow and pressure waveforms"}
- id: q_fig4_scaled_velocity
  kind: reading
  about: [aoroot_flow_fig4_invivo, mpa_flow_fig4_invivo, ivc_flow_fig4_invivo, svc_flow_fig4_invivo, lipv_flow_fig4_invivo, mhv_flow_fig4_invivo, hpv_flow_fig4_invivo, lts_flow_fig4_invivo, lad_flow_fig4_invivo]
  text: >
    The asterisked in vivo flow waveforms of Fig. 4 are measured velocities converted to flow 'by assuming the
    same peak flow value as in the model'. Their shape is measured but their amplitude is the model's peak, so a
    later validation against them can test timing and shape, not the size of the flow.
  citation: {page: 8, quote: "velocity waveform has been has been converted to a flow waveform"}
- id: q_fig5_fig7_peaks
  kind: unexplained_difference
  about: [aoroot_wif_fig5, wi_peak_fwd_path_a_fig7, rbrach_wif_fig5, wi_peak_fwd_path_b_fig7]
  text: >
    Fig. 7 plots the peak forward wave intensity along each path; its first circle (AoRt, about 0 cm) reads
    about 10^6.5 W/m^2/s^2 in every panel, about 3.2 x 10^6. The aortic root FCWee of Fig. 5 peaks at about
    2.65 x 10^6 on its linear axis (10^6.42). The right brachial artery shows the same gap (Fig. 5 peak about
    1.6 x 10^6; Fig. 7(b) at the RBrach label about 10^6.29, 1.9 x 10^6). Both gaps (about 0.08 in log10, 20%)
    are larger than either reading's interval. Fig. 7 may take the largest value along each 1D segment rather
    than at the location of Fig. 5, or use another time step or sampling; the paper does not say. For the main
    pulmonary artery the two figures agree within their readings (Fig. 6 peak about 2.0 x 10^5; Fig. 7(f)
    MPA about 10^5.32).
  citation: {page: 10, quote: "Peak forward (black solid) and backward (red dashed) wave intensity"}
- id: q_fig7_orders
  kind: reading
  about: [wi_peak_fwd_path_a_fig7, wi_peak_bwd_path_a_fig7, wi_peak_fwd_path_f_fig7, wi_peak_bwd_path_f_fig7]
  text: >
    With Fig. 7 read, the text's 'proximal arterial backward waves are approximately 1-1.5 orders of magnitude
    smaller than forward waves' can be looked at: at the aortic root (first circles of panels a-e) the circles
    differ by about 1.55-1.6 in log10, at the edge of the stated range; in the main pulmonary artery (f) by about
    1.4. The claims are approximate and are not compared (no verdict); the readings
    wi_peak_*_fig7 hold the values.
  citation: {page: 9, quote: "are approximately 1–1.5 orders of magnitude smaller"}

# Added by the ModelAtlas job with olufsen1999.
- id: q_eq3_factor_vs_olufsen1999
  kind: unexplained_difference
  about: [wave_speed_eq3]
  text: >
    Eq. 3 is said to be the empirical formula of Olufsen et al. (ref. 96 = olufsen1999), but olufsen1999
    prints c0^2 = (4/3) Eh/(rho r0) at the reference area, while Eq. 3 is 2/(3 rho) [k1 exp(k2 D0/2) + k3],
    i.e. (2/3) Eh/(rho r0) with Olufsen's Eh/r0 fit: c0 differs by a factor sqrt(2)
    (relation rel_wave_speed_olufsen1999_printed, not verified). Eq. 3 agrees with the factor 2/3 that
    olufsen1999's own Eq. 5 gives (rel_wave_speed_olufsen1999_eq5factor, verified; olufsen1999
    q_wave_speed_factor). The middle expression of Eq. 3, 2Eh/(3 rho D0), equals (1/3) Eh/(rho r0) and agrees
    with neither; the right-hand side, which is what is used, takes Eh/r0 (not Eh/D0) from Olufsen's fit.
    Mynard's coronary-artery coefficients (20.00 x 10^6, -22.5, 86.5 x 10^4) equal Olufsen's printed
    k1, k2, k3 (2.00 x 10^7, -22.53, 8.65 x 10^5) to rounding, but are not said to come from it.
  citation: {page: 6, quote: "empirical formula suggested by Olufsen et al."}

- id: q_no_validation_vs_boileau2015
  kind: choice
  about: [circulation_1d_0d, wave_speed_eq3, vascular_resistance, t6_svr_ref, t6_aort_mean_ref, d_cs_human]
  text: >
    No validation against boileau2015 is entered, in either direction (cross-validation job 2026-11-06).
    Neither paper cites the other or uses the other's data. boileau2015's measurements are the in vitro pressure
    and flow waveforms of its ref. 45 in a 37-vessel silicone network (its Figs. 6-9). circulation_1d_0d, which
    would give pressures and flows in time, is not runnable (q_full_model_not_runnable) and is built for the
    human circulation, not that network. Its runnable parts give a wave speed from a diameter with coefficients
    fitted to human vessels (wave_speed_eq3), a pericardial pressure, a pSIP ratio, cardiac output from EF,
    a vascular resistance from mean pressures and a compliance sum; none of these is a pressure or flow at a
    time, which is all boileau2015 measures. The shared dimension of circulation_1d_0d's SVR and
    boileau2015/adan56_terminal_impedance's R1 does not make them the same quantity: SVR is the whole systemic
    resistance, R1 the characteristic impedance of one terminal vessel. In the other direction, boileau2015's
    runnable models (areas, wave speeds from E, h and area, terminal impedance, Windkessel mean pressure,
    Gaussian inflow, viscous peak decay) give no quantity that this record's measurements (Table 6 reference
    ranges, coronary sinus diameter, Fig. 4 in vivo waveforms) quantify under conditions either paper states
    (boileau2015 q_no_validation_vs_mynard2015).
  citation: {page: 7, where: "Table 6", quote: "SVR mmHg s/mL 0.90 0.80"}

- id: q_no_validation_vs_mynard2014_data
  kind: choice
  about: [wave_speed_eq3, circulation_1d_0d, d_cs_human]
  text: >
    No validation against mynard2014_data (the Supplemental Data File of ref. 91) is entered, in either
    direction (cross-validation job 2026-11-06). mynard2014_data holds only parameters of the coronary 1D
    network model (segment lengths, diameters and wave speeds c0, all origin reported), with no measurement,
    so no model of this record can be validated against it. Running wave_speed_eq3 over its c0-vs-D0 tables
    would compare two papers' parameter choices, not a model with a measurement. This paper cites ref. 91
    for its coronary model and the distribution of coronary resistances (p. 3, p. 6), not for data. In the
    other direction, mynard2014_data's only model (wave_speed_eq1) gives a wave speed, and none of this
    record's measurements (Table 6 reference ranges, the coronary sinus diameter, the Fig. 4 in vivo
    waveforms) is a wave speed (mynard2014_data q_no_validation_vs_mynard2015).
  citation: {page: 6, quote: "reported by Fisher et al.32 As in Mynard et al.91"}

- id: q_no_validation_vs_mynard2015_data
  kind: choice
  about: [wave_speed_eq3, compliance_sum, vascular_resistance, circulation_1d_0d]
  text: >
    No validation of this record's models against mynard2015_data is entered (cross-validation job 2026-11-06).
    mynard2015_data is the paper's two supplemental parameter tables: it holds no measurement, only released
    model inputs and the paper's printed values copied for its comparisons, so there is nothing of it for
    wave_speed_eq3 or any other model here to be tested against (its own wave_speed_eq3 already reproduces
    Table 2 from the released diameters). In the other direction, three of this record's measurements are
