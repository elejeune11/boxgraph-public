  text: >
    (Cross-validation with mynard2014, ref. 91, job 2026-11-06.) No model of this record is validated against a
    measurement of mynard2014. This paper cites ref. 91 only for the design of its coronary bed model ("identical
    to that in Mynard et al.", p. 3), its resistance and intramyocardial pressure rules (pp. 6-7) and its
    validation (p. 4). It never says that its own model reproduces ref. 91's data. mynard2014's measurements
    are all from anaesthetised adult sheep and newborn lambs: Table 1 weights, heart rates, mean aortic
    pressure and Cx flow per 100 g; the Experiment column of Table 2 (Cx flow features and phase durations);
    the measured AoQ, AoP and LVP of Fig. 3; and the proximal Cx flow of each animal in Figs. 7-8. None of
    these is produced by a runnable model here. The closed-loop model whose coronary bed could give a Cx flow
    (circulation_1d_0d) is not runnable, and it is set up for an adult human, not a sheep. wave_speed_eq3 gives
    a wave speed, but mynard2014 measures none: its 9.0 m/s proximal Cx wave speed is an assumption (origin
    reported), and the proximal Cx diameter is not printed. Its Table 1 holds no ventricular volumes or EF,
    so cardiac_output_from_ef cannot be checked against it. It holds no cardiac output or resistance either,
    so vascular_resistance cannot be. Its SIP curve (Fig. 3) is derived, not measured, so sip_ratio_eq1 cannot
    be. Both papers' wave-speed formulas (Eq. 3 here, Eq. 1 there, Olufsen's form) share a shape. That makes
    them related models, not a model and a measurement. For the other direction see
    mynard2014/q_no_validation_vs_mynard2015.
