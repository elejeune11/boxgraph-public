- id: d0_aortic_root_added
  quantity: vessel_diameter
  unit: cm
  printed: "3.0"
  basis: >
    The largest systemic artery (the aortic root) gives the smallest c0 of Eq. 3. Its reference diameter is only in
    Supplemental File 1 (record mynard2015_data). 3.0 cm is a typical young-adult aortic root diameter. Above about
    2 cm the k1 term of Eq. 3 is negligible for systemic arteries, so c0 hardly depends on this choice.
  alternatives: ["2.5", "3.5", "1.8"]
  stands_for: D0 of the largest systemic arterial segment in Eq. 3
- id: d0_mpa_added
  quantity: vessel_diameter
  unit: cm
  printed: "2.7"
  basis: >
    The largest pulmonary artery (the main pulmonary artery) gives the smallest pulmonary arterial c0 of Eq. 3. Its
    diameter is only in Supplemental File 1 (from refs. 30, 62, 88, 135). 2.7 cm is a typical adult value. Above about
    2 cm the k1 term is negligible, so c0 hardly depends on this choice.
  alternatives: ["2.4", "3.0"]
  stands_for: D0 of the largest pulmonary arterial segment in Eq. 3
- id: p_out_zero_added
  quantity: mean_pressure
  unit: mmHg
  printed: "0"
  basis: >
    The paper does not define SVR. One common definition divides mean arterial pressure by cardiac output, with no
    downstream (venous) pressure subtracted. This run tests that reading against the (MAP - RAP)/CO reading.
  alternatives: ["4"]
  stands_for: downstream pressure in the SVR definition
