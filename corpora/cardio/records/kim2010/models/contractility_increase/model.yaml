id: contractility_increase
name: maximum left ventricular elastance (contractility) raised by a relative increase (moderate exercise)
role: model
stated: {page: 10, printed_page: "3204", quote: "The contractility of this subject was increased 10% for", where: text}
equation: "E_LV,max,exercise = E_LV,max,rest x (1 + 10%), stated in words"
from_words: true
inputs:
  E_rest: {quantity: max_lv_elastance, unit: mmHg/cc}
  r: {quantity: contractility_relative_increase, unit: percent}
outputs:
  E_ex: {quantity: max_lv_elastance, unit: mmHg/cc}
settings: {}
stochastic: false
