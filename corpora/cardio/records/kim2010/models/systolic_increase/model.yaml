id: systolic_increase
name: systolic aortic pressure raised by a relative increase (light exercise target)
role: model
stated: {page: 6, printed_page: "3200", quote: "increased by 20% compared to the resting state", where: text}
equation: "P_sys,exercise = P_sys,rest x (1 + 20%), stated in words"
from_words: true
inputs:
  P_rest: {quantity: systolic_aortic_pressure, unit: mmHg}
  r: {quantity: systolic_pressure_relative_increase, unit: percent}
outputs:
  P_ex: {quantity: systolic_aortic_pressure, unit: mmHg}
settings: {}
stochastic: false
