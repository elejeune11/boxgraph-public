id: coronary_increase_by
name: mean coronary flow at moderate exercise, increased by 350% over rest (read as "by")
role: model
stated: {page: 5, printed_page: "3199", quote: "the mean coronary flow was increased by 350%", where: text}
equation: "Q_exercise = Q_rest (1 + 350%), stated in words"
from_words: true
inputs:
  Q_rest: {quantity: stenosed_lad_mean_flow, unit: cc/s}
  r: {quantity: coronary_flow_relative_increase, unit: percent}
outputs:
  Q_ex: {quantity: stenosed_lad_mean_flow, unit: cc/s}
settings: {}
stochastic: false
