id: coronary_increase_to
name: mean coronary flow at moderate exercise, 350% of rest (read as "to")
role: model
stated: {page: 13, printed_page: "3207", quote: "we designed that the mean flow increased 350% at", where: text}
equation: "Q_exercise = Q_rest x 350%"
from_words: true
variant_of: coronary_increase_by
corrections:
  - equation: "text, p. 3199: the mean coronary flow was increased by 350%"
    change: "Q_exercise = 3.5 Q_rest instead of Q_exercise = (1 + 3.5) Q_rest"
    evidence: "Table 4 (p. 3204) gives a normal LAD mean flow of 1.1 cc/s at rest and 3.7 cc/s at moderate exercise, a factor near 3.4, not 4.5; p. 3205 says the coronary flow tripled for the exercise condition"
inputs:
  Q_rest: {quantity: stenosed_lad_mean_flow, unit: cc/s}
  r: {quantity: coronary_flow_relative_increase, unit: percent}
outputs:
  Q_ex: {quantity: stenosed_lad_mean_flow, unit: cc/s}
settings: {}
stochastic: false
