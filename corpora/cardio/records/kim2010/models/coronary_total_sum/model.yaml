id: coronary_total_sum
name: total coronary flow as the sum of LAD, LCX and RCA flows
role: model
stated: {page: 7, printed_page: "3201", quote: "artery was 0.6 cc/s, to yield a total coronary flow of", where: text}
equation: "Q_total = Q_LAD + Q_LCX + Q_RCA, stated in words"
from_words: true
inputs:
  Q_LAD: {quantity: lad_mean_flow, unit: cc/s}
  Q_LCX: {quantity: lcx_mean_flow, unit: cc/s}
  Q_RCA: {quantity: rca_mean_flow, unit: cc/s}
outputs:
  Q_total: {quantity: total_coronary_mean_flow, unit: cc/s}
settings: {}
stochastic: false
