id: coronary_fraction_flow
name: mean coronary flow as a fixed fraction of cardiac output
role: model
stated: {page: 4, printed_page: "3198", quote: "assumed that the mean coronary flow is 4.0% of the cardiac output", where: text}
equation: "Q_cor = 4.0% x CO, stated in words"
from_words: true
inputs:
  f: {quantity: coronary_fraction_of_cardiac_output, unit: percent}
  CO: {quantity: cardiac_output, unit: L/min}
outputs:
  Q: {quantity: total_coronary_mean_flow, unit: cc/s}
settings: {}
stochastic: false
