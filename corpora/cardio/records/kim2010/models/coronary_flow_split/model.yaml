id: coronary_flow_split
name: split of total mean coronary flow among LAD, LCX and RCA by the steady (zero-frequency) resistance of each coronary bed model
role: model
stated: {page: 4, printed_page: "3198", quote: "with the following coefficients", where: "Eq. 5 coefficients p0 = 1, q0 = Ra + Ra-micro + Rv + Rv-micro"}
equation: "mean P - mean P_v = (q0/p0) Q for each outlet, q0 = Ra + Ra-micro + Rv + Rv-micro, p0 = 1; with a common mean outlet pressure the flows split as 1/q0"
from_words: true
