- id: q_no_validation_vs_mynard2014
  kind: choice
  about: [coronary_fraction_flow, coronary_flow_split, stenosed_lad_flow, coronary_total_sum, cardiac_output_sv]
  text: >
    (Cross-validation with mynard2014; cross-validation job 2026-11-06.) No model of this record is
    validated against a measurement of mynard2014. Neither paper cites the other (Kim 2010 precedes it;
    Mynard 2014's references do not include Kim et al.), and neither says one's model explains the other's
    data. mynard2014's measurements are of adult sheep and newborn lambs: body, heart and myocardial
    weights, heart rate, mean aortic pressure, proximal circumflex (Cx) flow per 100 g, the Table 2
    phase durations and normalized Cx flow features, the measured Cx flow waveforms of Figs. 7-8 and one
    animal's aortic flow, aortic and LV pressure (Fig. 3). The models here give a human patient's total,
    LAD, LCX and RCA mean flows: coronary_fraction_flow gives total coronary flow as an assumed 4.0% of
    cardiac output, which is not the Cx flow mynard2014 measures (one branch of the left coronary only)
    and is an input rule of this paper, not a prediction; coronary_flow_split and stenosed_lad_flow need
    this patient's Table 3 bed resistances, which mynard2014 does not give for its sheep (its total
    resistance is tuned per animal to the measured Cx flow); cardiac_output_sv needs a stroke volume
    mynard2014 does not print. None therefore gives a measured quantity of mynard2014 on its conditions.
    In the other direction, see mynard2014/q_no_validation_vs_kim2010.
  citation: {page: 4, printed_page: "3198", quote: "assumed that the mean coronary flow is 4.0% of the cardiac output", where: text}
