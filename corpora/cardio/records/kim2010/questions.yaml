  text: "At rest the downstream resistances were lowered with stenosis severity 'until the same mean flow was achieved', yet with the Table 4 pressures the Table 3 resistances of outlets c and d give flows rising from about 1.0 cc/s (normal) to about 1.3 cc/s (75%), and none is 1.1 cc/s. The Table 4 pressure is computed downstream of the stenosis, not at the outlets, and the outlet pressure is not printed, so the difference cannot be settled from the paper."
