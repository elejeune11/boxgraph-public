id: fahraeus_eq1
name: Fahraeus effect, tube to discharge hematocrit ratio for rat blood (Eq. 1)
role: model
stated: {page: 4, quote: "parametric description of the reduction of tube", where: Eq. 1}
equation: "HT/HD = HD + (1 - HD)(1 + 1.7 e^(-0.415 D) - 0.6 e^(-0.011 D))"
inputs:
  D: {quantity: vessel_diameter, unit: um}
  HD: {quantity: discharge_hematocrit, unit: dimensionless}
outputs:
  HT_HD: {quantity: tube_discharge_hematocrit_ratio, unit: dimensionless}
settings: {}
stochastic: false
