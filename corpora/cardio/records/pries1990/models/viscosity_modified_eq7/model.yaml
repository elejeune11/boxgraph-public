id: viscosity_modified_eq7
name: modified relative apparent viscosity in vivo, as printed (Eq. 7 applied to Eqs. 2 and 3)
role: model
stated: {page: 6, quote: "Equations 2 and 3, with a diameter-dependent factor", where: Eq. 7}
equation: "eta_rel' = eta_rel (D^4/(D - W))"
inputs:
  D: {quantity: vessel_diameter, unit: um}
  HD: {quantity: discharge_hematocrit, unit: dimensionless}
  W: {quantity: viscosity_width_parameter, unit: um}
outputs:
  eta_rel_mod: {quantity: relative_apparent_viscosity, unit: dimensionless, description: "as printed the factor D^4/(D - W) carries um^3; computed with D and W in um"}
settings: {}
built_from: [viscosity_invitro]
stochastic: false
