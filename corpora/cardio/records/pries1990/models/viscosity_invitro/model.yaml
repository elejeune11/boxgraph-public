id: viscosity_invitro
name: relative apparent viscosity from in vitro data, Fahraeus-Lindqvist effect (Eqs. 2 and 3)
role: model
stated: {page: 4, quote: "equation for the variation of relative apparent viscos", where: "Eqs. 2 and 3"}
equation: "eta_rel = 1 + (e^(HD alpha) - 1)/(e^(0.45 alpha) - 1) (110 e^(-1.424 D) + 3 - 3.45 e^(-0.035 D)); alpha = 4/[1 + e^(-0.593 (D - 6.74))]"
inputs:
  D: {quantity: vessel_diameter, unit: um}
  HD: {quantity: discharge_hematocrit, unit: dimensionless}
outputs:
  eta_rel: {quantity: relative_apparent_viscosity, unit: dimensionless}
settings: {}
stochastic: false
