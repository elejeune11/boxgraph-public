id: network_flow_simulation
name: blood flow simulation in a microvascular network (linear and rheological analyses alternated)
role: model
stated: {page: 2, quote: "The numerical method consists essentially of", where: "Network Flow Simulation, pp. 2-3"}
equation: "at each node sum_i J_i (p_i - p0) = 0 with Poiseuille conductances J = Q/dp; hematocrits by red cell conservation and the phase-separation relation; viscosity by Eqs. 2-3 (or Eq. 7); tube hematocrit by Eq. 1; outer iteration to convergence"
inputs:
  D: {quantity: vessel_diameter, unit: um, description: "diameter of every segment (with lengths and topology of the whole network)"}
  HD_in: {quantity: inflow_hematocrit, unit: dimensionless}
  W: {quantity: viscosity_width_parameter, unit: um}
outputs:
  NINV: {quantity: inverted_segment_count, unit: dimensionless}
  HD_mean: {quantity: mean_segment_hematocrit, unit: dimensionless}
  HD_sd: {quantity: sd_segment_hematocrit, unit: dimensionless}
settings: {outer_iterations: "20-30", linear_solver: successive overrelaxation}
built_from: [fahraeus_eq1, viscosity_invitro, viscosity_modified_eq7, phase_separation, inflow_velocity]
runnable: false
not_runnable_reason: >
  The networks' segment diameters, lengths and topology (913, 546 and 436 segments), the measured
  flow directions and hematocrits, and the boundary flows after their manual reduction (factors
  between 0.85 and 0.2 on about 10% of the output segments) are not published; without them none
  of the network results (Tables 1-3, Figs. 4-7) can be recomputed.
stochastic: false
