id: phase_separation
name: red cell distribution at a diverging bifurcation, logit relation with Eqs. 4-6
role: model
stated: {page: 4, quote: "was developed to describe the distribution of blood", where: "logit relation (p. 4) and Eqs. 4-6 (p. 5)"}
equation: "logit FQE = A + B logit((FQB - X0)/(1 - 2 X0)); logit x = ln[x/(1 - x)]; A = -6.96 ln(Dalpha/Dbeta)/DF; B = 1 + 6.98 (1 - HD)/DF; X0 = 0.4/DF"
inputs:
  FQB: {quantity: fractional_blood_flow, unit: dimensionless, description: "fractional blood flow into daughter branch alpha"}
  DF: {quantity: vessel_diameter, unit: um, description: "diameter of the feeding (parent) vessel"}
  Dalpha: {quantity: vessel_diameter, unit: um, description: "diameter of daughter branch alpha"}
  Dbeta: {quantity: vessel_diameter, unit: um, description: "diameter of the other daughter branch beta"}
  HD: {quantity: discharge_hematocrit, unit: dimensionless, description: "discharge hematocrit in the feeding vessel"}
outputs:
  FQE: {quantity: fractional_erythrocyte_flow, unit: dimensionless, description: "fractional red cell flow into daughter branch alpha"}
settings: {}
stochastic: false
