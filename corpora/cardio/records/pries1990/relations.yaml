# mapping: b's input symbol -> expression in a's input symbols, numbers in each model's port units
- id: rel_eq1_adapted_to_rat
  kind: derived_from
  a: pries1992/eq8_ratio
  b: pries1990/fahraeus_eq1
  mapping: {HD: "HctD", D: "D"}
  steps: ["subs: D = D*(92/55)**(1/3)"]
  regime: {HctD: [0.1, 0.8], D: [3, 100]}
  provenance: stated
  citation: {page: 4, quote: "This equation has been adapted to rat blood by",where: Eq. 1}
  assumptions:
    - "the human-blood description the paper adapts is the one pries1992 (which cites this paper for it) prints as Eq. 8"
    - "scaling the exponents with the cube root of mean red cell volume (human 92 fl, rat 55 fl) is read as multiplying each diameter exponent by (92/55)^(1/3)"
