- id: q_eq7_form
  kind: possible_error
  about: [viscosity_modified_eq7, viscosity_modified_eq7_corrected, eta_fig3_045]
  text: >
    Eq. 7 is printed as eta_rel' = eta_rel (D^4/(D - W)). That factor has the dimension of a length
    cubed and, with D in um, multiplies the viscosity by about 10^6 at D = 100 um, whereas Fig. 3
    (W = 3.5 um) stays between about 1 and 25. Fig. 3 agrees with the factor (D/(D - W))^4
    (corrected variant viscosity_modified_eq7_corrected). The printed form is kept as the paper's model.
  citation: {page: 6, quote: "Equations 2 and 3, with a diameter-dependent factor", where: Eq. 7}
- id: q_network_not_runnable
  kind: unstated_input
  about: [network_flow_simulation]
  text: >
    The network simulation cannot be rerun: the diameters, lengths and topology of the three
    networks, the measured flow directions and hematocrits, and the individually reduced boundary
    flows are not published. Its results (Tables 1-3, Figs. 4-7, the r2 values for subsets of
    segments on p. 6) can therefore only be checked for internal consistency, as done here for
    the Table 2 percentages and the Table 3 coefficients of variation.
  citation: {page: 4, quote: "with factors between 0.85 and 0.2. Flow had to be"}
- id: q_nseg_B
  kind: possible_error
  about: [nseg_B_abstract, nseg_B]
  text: >
    The abstract gives the three networks as 436, 583 and 913 vessel segments; Table 1 and the text
    on p. 3 give 546 for network B, and the Table 2 percentages for network B (e.g. 30 = 5.5%)
    follow from 546, not from 583 (30/583 = 5.1%).
  citation: {page: 1, quote: "mesentery with 436, 583, and 913 vessel segments, respectively"}
- id: q_phase_separation_domain
  kind: unstated_model
  about: [phase_separation]
  text: >
    The logit relation is defined only for X0 < FQB < 1 - X0. The text says X0 is the minimal
    fractional blood flow needed to draw red cells into a branch; the model sets FQE = 0 below X0
    and FQE = 1 above 1 - X0, which the paper does not state. No printed number tests this model
    alone: the diameters and hematocrit of the bifurcation in Fig. 2 are not given.
  citation: {page: 4, quote: "defines the minimal"}
- id: q_rat_scaling
  kind: unstated_input
  about: [fahraeus_eq1]
  text: >
    Eq. 1 is said to be adapted to rat blood by scaling the diameter-dependent exponents of a
    human relation by the cube root of mean red cell volume (92 fl human, 55 fl rat), but the human
    exponents are not printed, so the scaling cannot be checked from this paper.
  citation: {page: 4, quote: "scaling the diameter-dependent exponents with the"}
- id: q_fig1_large_D
  kind: unexplained_difference
  about: [fahraeus_eq1, ht_hd_fig1_045, ht_hd_fig1_01, ht_hd_fig1_03, cmp_fig1u_HD045]
  text: >
    Above about D = 60 um the Fig. 1 (upper panel) curves lie 0.003-0.013 above Eq. 1 as printed,
    increasingly so for lower HD (at D = 95 um, HD = 0.1: read 0.823, Eq. 1 gives 0.810); the
    HD = 0.45 curve is judged only close there. The curves match Eq. 1 with a last exponent of about
    0.012 per um instead of the printed 0.011 (0.0119 gives 0.825 at that point), which is what
    scaling an exponent of 0.01 by the cube root of 92/55 would give; the paper does not print the
    human exponents, so this is not checkable here. The printed coefficient is kept.
  citation: {page: 4, quote: "This equation has been adapted to rat blood by", where: Eq. 1}
- id: q_W_fig3
  kind: reading
  about: [W_fig3, W_network_A, W_networks_BC]
  text: >
    Fig. 3 is drawn for W = 3.5 um, between the optimal values found for the networks (4 um for
    network A, 3.4 um for B and C); the simulations of Table 2 conditions 3 and 6 used the optimal
    values, not the Fig. 3 value.
- id: q_ninv_1_4_percent
  kind: unexplained_difference
  about: [nseg_B, ninv_pct_B]
  text: >
    Added by the audit. The text on p. 4 says the modification of boundary conditions "reduced the
    number of segments with inverted flow direction to 1-4% of the total number of segments". Table 1
    gives NINV after modification as 25, 24 and 7 for 913, 546 and 436 segments, i.e. 2.7%, 4.4% and
    1.6%; network B (4.4%) lies above the stated 4%. Table 1 values are not recorded as data (first
    reader's scope), so this is not compared; the same counts 25, 24, 7 appear in Table 2 under
    conditions 2 and 5 (uniform viscosity), consistent with the zero-hematocrit runs of p. 3.
  citation: {page: 4, quote: "inverted flow direction to 1-4% of the total number"}
- id: q_fig2_domain
  kind: reading
  about: [phase_separation, q_phase_separation_domain, fqe_fig2_alpha, fqe_fig2_beta]
  text: >
    Added by the figure pass, bearing on q_phase_separation_domain. In Fig. 2 the two logit fit
    lines run along FQE = 0 below a small FQB and along FQE = 1 near FQB = 1, and measured points
    lie there (filled circles at FQE = 0 for the two smallest FQB, open circles at FQE = 1 for the
    largest). For this one bifurcation the figure thus draws the relation the model assumes
    outside X0 < FQB < 1 - X0 (FQE = 0 below, FQE = 1 above). It shows only one bifurcation and
    states no rule, so it supports but does not settle that question. The two daughter series
    also mirror each other (FQB to 1 - FQB, FQE to 1 - FQE), as conservation at one bifurcation
    requires; the readings cannot be compared point by point because their x values differ.
  citation: {page: 5, quote: "represent the logit fit to the measurements in both daughter"}
- id: q_p92_species_scaling
  kind: choice
  about: [viscosity_invitro, D_p92_fig3_3p3, D_p92_fig3_4p4, D_p92_fig3_5p6, D_p92_fig3_6, D_p92_fig3_9, D_p92_fig3_12, D_p92_fig3_40]
  text: >
    Added by the validation job against pries1992. Eqs. 2-3 are stated "in rat blood" (p. 4), derived
    from human in vitro data; pries1990 prints the cube-root red cell volume scaling (92 fl human,
    55 fl rat) only for Eq. 1 and does not print the human form of Eqs. 2-3. The pries1992
    measurements are of human (and some other) blood in glass tubes. The validations run Eqs. 2-3 at
    the printed tube diameter; the alternative is the rat-equivalent diameter 0.842 D (the
    alternatives of the D_p92_fig3_* added inputs), which moves the viscosity minimum and the steep
    small-tube rise to larger human-tube diameters. The Fig. 5 sweep (diameters from the measured
    points) can only be run at the printed diameters.
  citation: {page: 4, quote: "Literature data obtained with human blood were used to define"}
- id: q_p92_fit_overlap
  kind: choice
  about: [viscosity_invitro]
  text: >
    Added by the validation job against pries1992. Eqs. 2-3 were fitted to literature data cited as
    refs. 13-15 (Chien et al.'s review, Fahraeus, Fahraeus and Lindqvist); the pries1992 compilation
    of 163 points at HD 0.45 (its Figs. 2 and 5) draws on 15 literature studies plus new and earlier
    unpublished data, and may include some of the same measurements. Neither paper says which points
    were behind the 1990 fit, so the comparison is entered as a validation, not as a fit; the Fig. 3
    points for 9-40 um are pries1992's new measurements and cannot have been used in 1990.
  citation: {page: 4, quote: "Literature data obtained with human blood were used to define"}
- id: q_no_validation_pries2005
  kind: choice
  about: [viscosity_invitro, viscosity_modified_eq7, viscosity_modified_eq7_corrected, fahraeus_eq1, phase_separation, network_flow_simulation]
  text: >-
    (Cross-validation job, pries1990 + pries2005.) No validation is added in either direction.
    pries2005 (which cites this paper as ref. 31) measures only the distribution of vessel diameters
    in its three networks (its Fig. 2 box plot); no model here outputs a diameter distribution.
    pries2005's other plotted values (Figs. 1, 2, 4) are its own model output, and its VERR, NINV and
    HERR come from a simulation of networks whose data are not published. This record's measured
    data (Fig. 2 FQE, Table 3 and Fig. 5 hematocrits, Fig. 6 velocities, Fig. 7 pressures) are
    predicted only by network simulations, unrunnable in both records (q_network_not_runnable), and
    pries2005 does not say its models explain them.
  citation: {page: 4, quote: "was developed to describe the distribution of blood"}
