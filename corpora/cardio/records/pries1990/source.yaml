notes: >
  Scope: the paper's closed-form rheological laws and the numbers that can be checked against them
  or against each other. Eq. 1 (Fahraeus effect) and Eqs. 2-3 (in vitro viscosity) are compared
  with the five curves of each panel of Fig. 1, read by code at 1200 dpi; Eq. 7 (modified viscosity)
  with the five curves of Fig. 3 (W = 3.5 um). Eq. 7 is printed as eta_rel (D^4/(D - W)), which is
  dimensionally inconsistent and misses Fig. 3 by orders of magnitude; a corrected variant with
  (D/(D - W))^4 reproduces all of Fig. 3. Eqs. 1-3 reproduce Fig. 1, except that above about 60 um
  the Fig. 1 upper curves lie slightly above Eq. 1 (HD = 0.45 is only close there; question
  q_fig1_large_D). The network simulation itself is recorded as not runnable: the network geometry
  and topology, measured flow directions and hematocrits, and the hand-adjusted boundary flows are
  not published. Of its results, what can be checked is internal arithmetic: the Table 2
  percentages (NINV over the Table 1 segment counts) and the Table 3 coefficients of variation all
  reproduce, the Fig. 4 insets (n, r2) agree with Tables 1 and 2, and the abstract's 583 segments for
  the middle network disagree with Table 1 (546). The phase-separation relation (p. 4, Eqs. 4-6) and
  the inflow velocity relation v = 0.4 D - 1.9 (p. 3) are recorded as models; neither has a printed
  result of its own (Fig. 2's bifurcation is not specified), and the velocity relation is run once
  on the ~35 um main arteriole. Left out: Table 1 node counts, boundary-node counts, NNEG and NINV
  before and after boundary modification, and the Table 2 r2 values other than condition 3 (outputs
  of the unrunnable network simulation with nothing to check them against); the mean measured and
  predicted hematocrits of Table 3 are recorded (they feed the CV check) but not compared with each
  other, as the prediction cannot be reproduced; the r2 values for network subsets (p. 6), the red
  cell volumes used to scale Eq. 1 to rat blood (92 and 55 fl; the human exponents are not printed),
  and Figs. 4 and 8 (see figures.md). The page images were checked for every equation and table
  value recorded. A second figure pass read the point plots by code: Fig. 2 (both daughter
  branches, measured), Fig. 5 (measured and predicted hematocrit distributions, networks A and C),
  Fig. 6 (AV velocity by generation, measured ref. 17 and predicted) and Fig. 7 (pressure against
  diameter: cat mesentery data of refs. 25 and 26 and the two network A simulations, only where the
  overlapping glyphs can be told apart). They are recorded as data with no runs: no model in the
  record produces them (network simulation not runnable; Fig. 2's bifurcation not specified).
