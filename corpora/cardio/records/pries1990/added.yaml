# Tube diameters of the pries1992 Fig. 3 panels, for the validations of Eqs. 2-3 against those
# measurements (validations.yaml). pries1990 states no such diameters; pries1992 prints them as
# the panel labels of Fig. 3 and the diameter column of Table 2, but holds them only as table
# indices and datum conditions, not as data of their own (its 20 um is a datum, D_20, used directly).
# The alternative in each is the rat-equivalent diameter: pries1990's Eqs. 2-3 are stated for rat
# blood, adapted from human data by scaling with the cube root of red cell volume (p. 4, 92 fl
# human, 55 fl rat), so a human-blood tube of diameter D corresponds to (55/92)^(1/3) D = 0.842 D.
- id: D_p92_fig3_3p3
  quantity: vessel_diameter
  unit: um
  printed: "3.3"
  basis: "the tube diameter of the pries1992 Fig. 3 panel (Table 2, Gaehtgens & Pries 3.3 um), the condition of pries1992/eta_fig3_33um_points"
  alternatives: ["2.78"]
  stands_for: D in Eqs. 2-3, for the pries1992 Fig. 3 3.3 um measurements
