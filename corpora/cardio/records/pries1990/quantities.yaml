- {id: vessel_diameter, name: vessel (tube) inner diameter, dimension: "[length]", description: "D in Eqs. 1-3 and 7; DF, Dalpha, Dbeta in Eqs. 4-6"}
- {id: discharge_hematocrit, name: discharge hematocrit, dimension: dimensionless, description: "HD: red cell volume flow over blood volume flow in a segment"}
- {id: tube_discharge_hematocrit_ratio, name: ratio of tube to discharge hematocrit, dimension: dimensionless, description: "HT/HD (Fahraeus effect, Eq. 1, Fig. 1 upper panel)"}
- {id: relative_apparent_viscosity, name: relative apparent viscosity of blood, dimension: dimensionless, description: "apparent blood viscosity divided by plasma viscosity (Eqs. 2, 7; Figs. 1 lower panel and 3)"}
- {id: viscosity_width_parameter, name: diameter offset W of the modified viscosity law, dimension: "[length]", description: "W in Eq. 7"}
- {id: blood_flow_velocity, name: average blood flow velocity in a segment, dimension: "[length]/[time]", description: "v in the inflow boundary relation v = 0.4 D - 1.9"}
- {id: fractional_blood_flow, name: fractional blood flow into a daughter branch, dimension: dimensionless, description: "FQB: daughter branch blood flow over parent vessel blood flow"}
- {id: fractional_erythrocyte_flow, name: fractional red cell flow into a daughter branch, dimension: dimensionless, description: "FQE: daughter branch red cell flow over parent vessel red cell flow"}
- {id: segment_count, name: number of vessel segments in a network, dimension: dimensionless}
- {id: inverted_segment_count, name: number of segments with predicted flow direction inverted relative to observation, dimension: dimensionless, description: "NINV"}
- {id: inverted_segment_fraction, name: segments with inverted flow direction as a fraction of all segments, dimension: dimensionless, description: "NINV in percent of the network's segments (Table 2)"}
- {id: hematocrit_r2, name: squared correlation coefficient between predicted and measured segment discharge hematocrits, dimension: dimensionless, description: "r2HD"}
- {id: mean_segment_hematocrit, name: mean discharge hematocrit over the segments of a network, dimension: dimensionless}
- {id: sd_segment_hematocrit, name: standard deviation of discharge hematocrit over the segments of a network, dimension: dimensionless}
- {id: cv_segment_hematocrit, name: coefficient of variation of discharge hematocrit over the segments of a network, dimension: dimensionless}
- {id: inflow_hematocrit, name: discharge hematocrit of the blood entering a network, dimension: dimensionless}
- {id: segments_per_hematocrit_class, name: number of vessel segments in a discharge hematocrit class, dimension: dimensionless, description: "frequency of Fig. 5: segments of a network whose discharge hematocrit falls in one 0.05-wide class"}
- {id: av_generation, name: generation number of an arteriovenous segment, dimension: dimensionless, description: "x axis of Fig. 6"}
- {id: av_velocity_by_generation, name: average flow velocity of the arteriovenous segments of one generation, dimension: "[length]/[time]", description: "y axis of Fig. 6: a mean over the segments of a generation, not the velocity of one segment"}
- {id: signed_vessel_diameter, name: vessel diameter class on the arteriovenous axis, dimension: "[length]", description: "x axis of Fig. 7: the diameter class, negative on the arterial side and positive on the venous side"}
- {id: pressure_percent_of_head, name: pressure difference to the 60 um outflow venules in percent of the total pressure head, dimension: dimensionless, description: "y axis of Fig. 7: the pressure head between 45 um input arterioles and 60 um venules is 100%"}
