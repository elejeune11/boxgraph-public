# The released solver on Boileau et al.'s benchmarks 2-4 (boileau2015 Sections 4.2-4.4), against the
# 3D reference solution of [33] (Xiao et al. 2014) that boileau2015 plots in red in Figs. 3-5 (read in its
# record) and boileau_data releases (NumData/3D*.txt; its record checks the readings against the files).
# The solver can represent these three benchmarks exactly as specified: a uniform elastic vessel with
# the tube law of Eq. 3 (the release's LINEAR material), the power-law profile of Eq. 2 (the release's
# exponent), inflow at the inlet and the three-element Windkessel of Eq. 9 (the release's RCR outlet).
# It cannot represent Benchmark 1 as specified (no completely absorbent outlet: q_benchmark_scope),
# Benchmark 5 and 6 are networks of 37 and 56 arteries not built here (q_benchmark_scope). The mesh,
# time step and number of periods are ours (q_benchmark_numerics); the clock of the 3D record is placed
# with the lag boileau_data fitted for the six schemes (b2_lag etc.; q_benchmark_numerics).
- id: val_b2_P_vs_3d
  model: boileau_vessel_svoned
  inputs: &b2 {L: b2_L, rd: 'boileau2015/rd_car', h: 'boileau2015/h_car', E: 'boileau2015/E_car', rho: 'boileau2015/rho_car', mu: b2_mu,
               Pd: 'boileau2015/Pd_car', Pout: 'boileau2015/Pout_car', R1: 'boileau2015/R1_car', C: 'boileau2015/C_car', R2: 'boileau2015/R2_car',
               zeta: b2_zeta, T: 'boileau_data/period_b2', t_ini: 'boileau_data/tini_b2', lag: b2_lag}
  sweep: {t: 'boileau2015/fig3a_P_3d_curve'}
  output: P
  against: 'boileau2015/fig3a_P_3d_curve'
  purpose: validation
  quantities: &qb {'boileau2015/lumen_radius': vessel_radius, 'boileau2015/wall_thickness': wall_thickness, 'boileau2015/youngs_modulus': youngs_modulus,
                   'boileau2015/blood_density': blood_density, 'boileau2015/diastolic_pressure': diastolic_pressure, 'boileau2015/outflow_pressure': outflow_pressure,
                   'boileau2015/proximal_resistance': windkessel_proximal_resistance, 'boileau2015/windkessel_compliance': windkessel_capacitance,
                   'boileau2015/distal_resistance': windkessel_distal_resistance, 'boileau_data/cardiac_period': cardiac_period, 'boileau_data/time': time,
                   'boileau2015/time': time, 'boileau2015/blood_pressure': blood_pressure, 'boileau2015/pressure_difference': pressure_difference,
                   'boileau2015/volume_flow_rate': volume_flow_rate, 'boileau2015/radius_change': radius_change}
  basis: &bb >
    The benchmark is specified so that any 1D solver of Eqs. 1-3 and 9 can run it (boileau2015 Sections 2 and 4),
    and the release solves those equations: its LINEAR material is Eq. 3 with p_ref = Pd, S0 = Ad and
    EHR = (4/3) E h / rd (cvOneDMaterialLinear.cxx line 184), its exponent n gives the friction -2 (n + 2) pi nu
    and momentum coefficient (n + 2)/(n + 1) of the profile of Eq. 2 (cvOneDMaterial.h lines 99-103), and its
    RCR outlet is the Windkessel of Eq. 9 (theory.rst lines 258-267). The six schemes of the paper agree with
    the 3D solution within 0.2-0.3% RMS in pressure and 1% in radius at this site (Table IV); a 1D solver of the
    same equations is expected to come as close. Differences that remain: the release keeps the viscous term
    nu d2Q/dz2 (theory.rst line 23), which Eq. 1 drops, and the 3D solution is a model, not a measurement.
- id: val_b2_dP_vs_3d
  model: boileau_vessel_svoned
  inputs: *b2
  sweep: {t: 'boileau2015/fig3b_dP_3d_curve'}
  output: dP
  against: 'boileau2015/fig3b_dP_3d_curve'
  purpose: validation
  quantities: *qb
  basis: *bb
- id: val_b2_Q_vs_3d
  model: boileau_vessel_svoned
  inputs: *b2
  sweep: {t: 'boileau2015/fig3c_Q_3d_curve'}
  output: Q
  against: 'boileau2015/fig3c_Q_3d_curve'
  purpose: validation
  quantities: *qb
  basis: *bb
- id: val_b2_dr_vs_3d
  model: boileau_vessel_svoned
  inputs: *b2
  sweep: {t: 'boileau2015/fig3d_dr_3d_curve'}
  output: dr
  against: 'boileau2015/fig3d_dr_3d_curve'
  purpose: validation
  quantities: *qb
  basis: *bb

# ---- Benchmark 3, upper thoracic aorta (boileau2015 Table V)
- id: val_b3_P_vs_3d
  model: boileau_vessel_svoned
  inputs: &b3 {L: b3_L, rd: 'boileau2015/rd_ao', h: 'boileau2015/h_ao', E: 'boileau2015/E_ao', rho: 'boileau2015/rho_ao', mu: b2_mu,
               Pd: 'boileau2015/Pd_ao', Pout: 'boileau2015/Pout_ao', R1: 'boileau2015/R1_ao', C: 'boileau2015/C_ao', R2: 'boileau2015/R2_ao',
               zeta: b3_zeta, T: 'boileau_data/period_b3', t_ini: 'boileau_data/tini_b3', lag: b3_lag}
  settings: &s3 {n_elements: 96, steps_per_cycle: 955, n_cycles: 10, inflow_file: boileau_data/Benchmark3_UpperThoracicAorta/inflow.txt}
  sweep: {t: 'boileau2015/fig4a_P_3d_curve'}
  output: P
  against: 'boileau2015/fig4a_P_3d_curve'
  purpose: validation
  quantities: *qb
  basis: &bb3 >
    As val_b2_P_vs_3d, for the upper thoracic aorta (Table V: profile order 9, the same blood). The paper's six schemes
    agree with the 3D solution within about 0.3-0.6% RMS in pressure at this site (Table VI). Pd is taken as
    printed, 9.46 kPa; the page prints a circumflex over the last digit (boileau2015 q_pd_circumflex).
- id: val_b3_dP_vs_3d
  model: boileau_vessel_svoned
  inputs: *b3
  settings: *s3
  sweep: {t: 'boileau2015/fig4b_dP_3d_curve'}
  output: dP
  against: 'boileau2015/fig4b_dP_3d_curve'
  purpose: validation
  quantities: *qb
  basis: *bb3
- id: val_b3_Q_vs_3d
  model: boileau_vessel_svoned
  inputs: *b3
  settings: *s3
  sweep: {t: 'boileau2015/fig4c_Q_3d_curve'}
  output: Q
  against: 'boileau2015/fig4c_Q_3d_curve'
  purpose: validation
  quantities: *qb
  basis: *bb3
- id: val_b3_dr_vs_3d
  model: boileau_vessel_svoned
  inputs: *b3
  settings: *s3
  sweep: {t: 'boileau2015/fig4d_dr_3d_curve'}
  output: dr
  against: 'boileau2015/fig4d_dr_3d_curve'
  purpose: validation
  quantities: *qb
  basis: *bb3

# ---- Benchmark 4, aortic bifurcation (boileau2015 Table VII)
- id: val_b4_mid_P_vs_3d
  model: boileau_bifurcation_svoned
  inputs: &b4 {La: b4_La, rda: 'boileau2015/rd_bao', ha: 'boileau2015/h_bao', Ea: 'boileau2015/E_bao',
               Li: b4_Li, rdi: 'boileau2015/rd_il', hi: 'boileau2015/h_il', Ei: 'boileau2015/E_il',
               rho: 'boileau2015/rho_bif', mu: b2_mu, Pd: 'boileau2015/Pd_bif', Pout: 'boileau2015/Pout_il',
               R1: 'boileau2015/R1_il', C: 'boileau2015/C_il', R2: 'boileau2015/R2_il', zeta: b4_zeta,
               T: 'boileau_data/period_b4', t_ini: 'boileau_data/tini_b4', lag: b4_lag}
  sweep: {t: 'boileau2015/fig5a_mid_P_3d_curve'}
  output: P_mid
  against: 'boileau2015/fig5a_mid_P_3d_curve'
  purpose: validation
  quantities: *qb
  basis: &bb4 >
    As val_b2_P_vs_3d, for the aortic bifurcation (Table VII: profile order 9; identical iliacs, each with the
    Windkessel of Table VII). The release joins the three vessels at one joint with one pressure and
    conservation of mass (theory.rst line 524), where the benchmark's junction keeps the total pressure
    P + rho U^2/2 continuous (boileau2015 Eq. 8; q_junction_static_pressure). The paper's six schemes agree with
    the 3D solution within about 0.2-0.6% RMS in pressure at these sites (Table VIII).
- id: val_b4_mid_Q_vs_3d
  model: boileau_bifurcation_svoned
  inputs: *b4
  sweep: {t: 'boileau2015/fig5b_mid_Q_3d_curve'}
  output: Q_mid
  against: 'boileau2015/fig5b_mid_Q_3d_curve'
  purpose: validation
  quantities: *qb
  basis: *bb4
- id: val_b4_mid_dr_vs_3d
