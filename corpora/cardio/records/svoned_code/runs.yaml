# ---- the stenosis loss of the code (port) on the release's stenosis test case
- {id: run_tsr_stenosis, model: stenosis_code, inputs: {rho: tsr_rho, nu: tsr_nu, Q: tsr_Q, S0: tsr_S0, S1: tsr_S1, L: tsr_L}, outputs: {dp: tsr_dp_pred, Kv: tsr_Kv_pred, La: tsr_La_pred}}

# ---- the profile terms the release's physiological examples use (exponent 1.0, 05_bifurcation_RCR.in line 171)
- {id: run_profile_case05, model: profile_terms_code, inputs: {mu: mu_case05, rho: rho_case05, n: n_case05}, outputs: {delta: delta_case05_pred, N: N_case05_pred},
   note: "delta = 1/2 and N = -6 pi nu at the examples' exponent, against the paper's and the theory notes' 1/3 and -8 pi nu (q_profile_exponent_examples)"}

# ---- Benchmark 2 (common carotid) with the released solver, at one time, for the refinements
- id: run_b2
  model: boileau_vessel_svoned
  inputs: {L: b2_L, rd: b2_rd, h: b2_h, E: b2_E, rho: b2_rho, mu: b2_mu, Pd: b2_Pd, Pout: b2_Pout, R1: b2_R1, C: b2_C, R2: b2_R2,
           zeta: b2_zeta, T: b2_T, t_ini: b2_tini, lag: b2_lag, t: b2_t_probe}
  outputs: {P: b2_P_probe, dP: b2_dP_probe, Q: b2_Q_probe, dr: b2_dr_probe}
  note: "50 elements, 1100 steps per period, 8 periods (the model's settings; ours, refined in refinements.yaml)"

# ---- the RCR outlet at the probe frequency, released solver and theory notes, carotid Windkessel values
- {id: run_rcr_b2, model: rcr_impedance_svoned, inputs: {Rc: b2_R1, Rd: b2_R2, C: b2_C, f: f_probe}, outputs: {modulus: rcr_b2_mod, phase: rcr_b2_ph}}
- {id: run_rcr_b2_theory, model: rcr_impedance_theory, inputs: {Rc: b2_R1, Rd: b2_R2, C: b2_C, f: f_probe}, outputs: {modulus: rcr_b2_mod_theory, phase: rcr_b2_ph_theory}}

