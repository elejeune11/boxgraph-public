- id: q_no_validation_vs_olufsen1999
  kind: choice
  about: [boileau_vessel_svoned, boileau_bifurcation_svoned, olufsen_law_code, profile_terms_code, rcr_impedance_svoned, rcr_impedance_theory, release_case, stenosis_code]
  text: >
    (Cross-validation with olufsen1999, ref. [3] of theory.rst; cross-validation job 2026-11-10.) No validation is
    entered, in either direction. This record is software and holds no measurement, so no olufsen1999 model can be
    judged against it. olufsen1999's measurements are the input impedance spectra md 0 / md 1 of Fig. 9 (Mills et
    al.), the pressure waveforms of Fig. 12 (Remington and Wood), the inflow of Fig. 4 and the cardiac output of
    4.14 l/min; its Fig. 3 points are estimates of Eh/r0 (origin estimated), not measurements. None is a quantity a
    model here gives on that measurement's conditions. (1) rcr_impedance_svoned and rcr_impedance_theory give the
    impedance of an RCR outlet, but neither the paper nor the release prints R1, C, R2 for the bed of Fig. 9
    (olufsen1999 fits its windkessel empirically and prints no values, p. 7), so all three would be added or fitted
    to the same curves: not a test. The structured-tree impedance of olufsen1999 is not in the code
    (q_benchmark_scope). (2) The Fig. 12 pressures depend on the whole systemic network; the runnable solver models
    here are a single vessel and the Benchmark 4 bifurcation, and this job may not add models. (3) The inflow and
    cardiac output are inputs of olufsen1999's 1D model, not outputs of any model here. (4) olufsen_law_code outputs
    pressure from area, not Eh/r0, and its k1, k2, k3 are olufsen1999's fit to the Fig. 3 estimates, so even a
    matching output would be a fit, not a test. That olufsen1999/pressure_area_eq5 and boileau_bifurcation_svoned
    share a dimension (a pressure from a pressure and a length) is a coincidence of shape, not a shared measured
    quantity; the law itself is already related in relations.yaml (rel_olufsen_law_olufsen1999). The release does
    not claim to explain any of olufsen1999's measurements.
  citation: {file: docs/source/content/inputFileGuide.rst, lines: "135-140", quote: "*Outlet* Boundary Condition Type. The following *outlet* boundary conditions are supported:"}
