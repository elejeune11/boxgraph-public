- id: q_no_validation_vs_boileau_data
  kind: choice
  about: [boileau_vessel_svoned, boileau_bifurcation_svoned, olufsen_law_code, profile_terms_code, rcr_impedance_svoned, rcr_impedance_theory, release_case, stenosis_code]
  text: >
    (Cross-validation with boileau_data; cross-validation job 2026-11-10.) No validation is entered against
    boileau_data, in either direction, because neither record holds a measured datum. boileau_data's data.yaml has
    only reported values (the B5 and B6 mesh files, README times, inflow periods) and derived ones (the paper's
    error Tables IV, VI, VIII and X); the in vitro measurements of Benchmark 5 (ExpData) are not entered as data
    there but read from the released files by its waveform adapters, so there is no datum to validate against.
    The released 3D reference solutions of Benchmarks 2-4 are model output of [33], not measurements, and are
    reached here through the red curves read in boileau2015 (the 17 validations already in validations.yaml).
    The in vitro curves themselves are taken up against boileau2015's readings (q_no_validation_vs_boileau2015):
    no model of this record builds that network. In the other direction this record is software and holds no
    measurement, and boileau_data's models are adapters that read released files or compute error norms; they
    predict nothing about the solver.
