- id: q_no_validation_vs_stergiopulos1992
  kind: choice
  about: [boileau_vessel_svoned, boileau_bifurcation_svoned, olufsen_law_code, profile_terms_code, rcr_impedance_svoned, rcr_impedance_theory, release_case, stenosis_code]
  text: >
    (Validation job stergiopulos1992+svoned_code, 2026-11-10.) No validation is entered, in either direction. This
    record is software and holds no measurement, so no stergiopulos1992 model can be judged against it.
    stergiopulos1992's measurements are taken from other works: the pulsatility indices of one patient with a
    severe left femoral stenosis at the aortic bifurcation, groin, knee and ankle (Gosling et al., its Fig. 7), and
    the group-mean thigh, knee and ankle to brachial systolic pressure indices of normal subjects and of patients
    with aortoiliac or femoropopliteal disease (Fronek et al., its p. 9). Each depends on the whole arterial tree
    from the heart to the lower leg, and the patients' stenosis severities, inflow and geometry are not printed.
    (1) The runnable solver models here are a single uniform vessel (boileau_vessel_svoned) and the Benchmark 4
    bifurcation (boileau_bifurcation_svoned), with the benchmarks' inflow files; neither is a body-scale tree with a
    brachial and a leg path, the 55-segment tree of stergiopulos1992 Table 1 is not built in this record, and this
    job may not add models. Running one leg artery alone with an RCR outlet would replace the rest of the tree by
    added inputs and give no brachial reference: not a test. (2) stenosis_code gives the steady pressure drop across
    one stenosis, and stergiopulos1992 measures no pressure drop across a stenosis (its stenosis results, Figs. 3-9,
    are model output, recorded as predicted). (3) olufsen_law_code, profile_terms_code and the RCR impedance models
    give a wall pressure from area, profile coefficients and a terminal impedance, none of which is measured there.
    (4) release_case reruns the release's own test cases, not any configuration of that paper. The release does not
    cite stergiopulos1992. The models are related in relations.yaml (the RCR outlet against Eq. 7), which is a
