# Added by the cross-validation job with stergiopulos1992.
- id: q_no_cross_validation_stergiopulos1992
  kind: unstated_model
  about: [stiffness_eq6, structured_tree_impedance, windkessel_eq7, larger_arteries_1d, Zmod_md0_fig9b, Zmod_md1_fig9b, Zphase_md0_fig9c, Zphase_md1_fig9c, p_aortic_fig12a, p_0cm_fig12b, p_radial_fig12b, co_measured, inflow_fig4]
  text: >
    Cross-validation with stergiopulos1992 (ref. 46 here) found no pair to test, in either direction. This
    paper cites ref. 46 only for the 1D model family, the windkessel outflow and, with refs. 45 and 53, as a
    source of the volume compliances behind the Eh/r0 estimates of Fig. 3 (p. 3). It does not say that any
    of its models explains or is compared with a stergiopulos1992 measurement. The only measured data there
    are the Gosling et al. pulsatility indices (Fig. 7) and the Fronek et al. leg/brachial systolic ratios
    (p. 9). No runnable model here gives either quantity: Eq. 6 gives Eh/r0, the structured tree and the Eq. 7
    windkessel give root input impedance, and the rest give tree counts, a boundary-layer thickness and a
    cardiac-output reduction. The model that would give leg pressures, the 1D model of Eqs. 3-11, is not
    runnable (q_larger_arteries_not_runnable). stergiopulos1992's Table 1 compliances, which feed the Fig. 3
    fit, are model inputs there (origin reported), not measurements, and they are a volume compliance, not
    Eh/r0, so Eq. 6 is not entered against them even as a fit. In the other direction, stergiopulos1992's
    arterial_tree_1d gives scalar pressure and PI ratios and ascending-aortic systolic, diastolic and mean
    pressure, not the impedance spectra of Fig. 9 or the pressure waveforms of Fig. 12 (read here only on the
    upstroke and fall of the aortic curve, not its peak), and it is built on a generic adult's geometry and
    inflow, not on the subjects of refs. 26/27 or 41. Its terminal_impedance_eq7 gives the impedance of one
    terminal windkessel, not the root impedance of the ascending aorta measured in Fig. 9. No validation was added.
  citation: {page: 3, quote: "and Segers et al. (45) we obtain k1"}

