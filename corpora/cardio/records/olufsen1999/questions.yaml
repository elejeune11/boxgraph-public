- id: q_boundary_layer_exponent
  kind: possible_error
  about: [boundary_layer_lighthill, delta_bl_estimate, delta_bl_constant]
  text: >
    The estimate is printed as (nu/omega)^(1/2) = [nu T/(2 pi)]^2 ≈ 0.01 cm. The exponent 2 cannot be
    meant: [nu T/(2 pi)]^2 has dimension length^4. With the printed nu = 0.046 cm^2/s and T = 1.25 s,
    (nu/omega)^(1/2) = [nu T/(2 pi)]^(1/2) ≈ 0.096 cm, ten times the printed 0.01 cm, but in agreement
    with the '(1 mm)' printed a few lines below. The printed 0.01 equals nu T/(2 pi) = 0.0092 with no
    square root. The record models the first, dimensionally consistent form.
  citation: {page: 2, quote: "larger arteries can be estimated from", where: text}
- id: q_wave_speed_factor
  kind: possible_error
  about: [larger_arteries_1d]
  text: >
    The printed wave speed c0^2 = (A/rho) dp/dA = (4/3) Eh/(rho r0) sqrt(A0/A) does not follow from
    Eq. 5: differentiating p - p0 = (4/3)(Eh/r0)(1 - sqrt(A0/A)) gives (A/rho) dp/dA =
    (2/3) Eh/(rho r0) sqrt(A0/A), half the printed value. The compliance printed on p. 5,
    C = 3 A0 r0/(2 Eh), agrees with Eq. 5 (and with the factor 2/3). No printed number rests on c0.
  citation: {page: 3, quote: "the square of the wave propagation velocity", where: text}
- id: q_asymmetry_eq21
  kind: unexplained_difference
  about: [asymmetry_eq21, gamma_printed, eta_chosen, xi_chosen]
  text: >
    With the printed xi = 2.76 and eta = 1.16, Eq. 21 gives gamma ≈ 0.356, not the printed 0.41.
    Conversely gamma = 0.41 with xi = 2.76 gives eta ≈ 1.171 (Eq. 21 itself follows from Eqs. 19-20).
    eta(gamma) is flat here, so a small rounding of eta moves gamma a lot; the tree of Fig. 9 is run
    with the printed gamma = 0.41.
- id: q_tree_leaf_rule
  kind: reading
  about: [structured_tree_impedance]
  text: >
    The paper says branching 'terminates when the radius of any given vessel is less than some given
    minimum radius' and that 'the tree is terminated whenever the radius of the leaves of the tree is
    less than' it. The record reads this as: a vessel whose radius is below r_min is still part of the
    tree and is a leaf (zero impedance at its end). The other reading (vessels below r_min are not
    built; the last vessel above r_min ends in zero impedance) gives a smaller DC impedance
    (about 2240 instead of about 2890 g s^-1 cm^-4 for the Fig. 9 tree with rho = 1.05 g/cm^3).
  citation: {page: 6, quote: "where the tree is terminated whenever the radius of the", where: text}
- id: q_tree_density
  kind: unstated_input
  about: [rho_blood_added, structured_tree_impedance]
  text: >
    The density of blood is not stated (only nu = mu/rho). The impedance of the tree scales nearly in
    proportion to rho; the usual range 1.0-1.06 g/cm^3 changes it by a few per cent only.
- id: q_tree_K_smoothing
  kind: unstated_model
  about: [structured_tree_impedance]
  text: >
    K of Eq. 12 is discontinuous at w = 4; the paper says 'it is possible to construct a smooth
    function for K for all w' but does not give the one used. The record uses the piecewise form as
    printed, with the principal branch of i^(-1/2).
  citation: {page: 5, quote: "because the jump is small it is possible to construct a smooth", where: text}
- id: q_fig9_magnitude
  kind: unexplained_difference
  about: [cmp_tree_Zmod_fig9b, cmp_tree_Zphase_fig9c, structured_tree_impedance]
  text: >
    The structured tree built from the printed inputs (root radius 0.5 cm, minimum radius 0.025 cm,
    l/r = 130, xi = 2.76, gamma = 0.41, Eq. 6 with the printed k1-k3, nu = 0.046 cm^2/s) gives a DC
    impedance of about 2.9 x 10^3 g s^-1 cm^-4 and falls to its characteristic level near
    10^3 already at omega ≈ 2 1/s, whereas the solid line of Fig. 9(B) starts near 9 x 10^3 and keeps
    above 3 x 10^3 up to omega ≈ 5 1/s. Something in the brachiocephalic tree differs from what is
    printed (e.g. the minimum radius, the length rule for the small vessels, or the leaf impedance).
- id: q_fig9_axis_units
  kind: reading
  about: [fig9b_st, fig9c_st]
  text: >
    The caption of Fig. 9 says 'omega = 2 pi f for omega in [0:125] Hz' while the axes are labelled
    omega [s^-1]. The record takes the axis label: omega in 1/s.
  citation: {page: 9, quote: "for v [ [0:125] Hz", where: "Fig. 9"}
- id: q_larger_arteries_not_runnable
  kind: unstated_input
  about: [larger_arteries_1d]
  text: >
    The coupled nonlinear model (Eqs. 3-11) cannot be run from the paper: the geometry of the tree of
    Fig. 1 comes from Segers et al. (ref. 45) and is not printed, the windkessel parameters of
    Figs. 7-8 are fitted but not printed, the inflow exists only as the plotted curve of Fig. 4, and
    the mesh and time step are not given. Its results (Figs. 7, 8, 10, 11) are not checked here.
  citation: {page: 10, quote: "The geometrical data for this model", where: text}
- id: q_lrr_change
  kind: choice
  about: [lrr_brachio, lrr_iberall]
  text: >
    For Fig. 9 the length-to-radius ratio was changed from 50 to 130 to match the measured data;
    the record runs the Fig. 9 tree with 130 for every vessel of the tree, as the text implies.
# --- Added in the audit ---
- id: q_continuity_eq13
  kind: possible_error
  about: [structured_tree_impedance]
  text: >
    Eq. 13 is printed as 'i omega/C P + dQ/dx = 0'. With C = dA/dp this is not dimensionally
    consistent; the linearized continuity equation is i omega C P + dQ/dx = 0, and only that form
    gives the wave speed c = sqrt(A0 K/(rho C)) and g = sqrt(C A0 K/rho) printed on p. 6 (Eq. 14 is
    also printed with rho C/(K A0), i.e. C in the numerator). The record's tree model uses the p. 6
    expressions for c and g, i.e. the consistent form; no runnable model rests on the printed Eq. 13.
  citation: {page: 5, quote: "corresponding continuity equation therefore becomes", where: Eq. 13}
- id: q_cvol_derivative
  kind: possible_error
  about: [stiffness_eq6, Eh_r0_data_fig3]
  text: >
    The volume compliance is printed as Cvol = dp/dV ≈ 3 r0/(2 Eh). A compliance is dV/dp, not dp/dV,
    and 3 r0/(2 Eh) is a relative compliance (1/A0) dA/dp of Eq. 5 at A = A0, not a volume compliance.
    How the plotted Eh/r0 estimates of Fig. 3 were obtained from the Cvol of refs. 45, 46, 53 (per unit
    length? per vessel? normalized?) is therefore not determined by the text.
  citation: {page: 3, quote: "estimates for the volume compli", where: text}
- id: q_dc_power
  kind: unexplained_difference
  about: [dc_root_radius_power, dc_radius_power_printed, cmp_dc_power_r0, cmp_dc_power_r1, cmp_dc_power_r2, cmp_dc_power_r3]
  text: >
    The paper says the DC root impedance is 'approximately inversely proportional to the root radius
    to the third power', noting the agreement is not exact because the number of generations varies.
    The tree of the record (l/r = 50, xi = 2.76, gamma = 0.41, rho = 1.05 g/cm^3) gives a power of
    about 2.1 to 2.55 between root radii 0.1 and 0.5 cm for the printed minimum radii 0.06 to
    0.01 cm, clearly below 3. The root radii the paper used for this statement are not printed
    (r_root_lo_added, r_root_hi_added are the audit's choice).
  citation: {page: 9, quote: "The agreement is not exact, how", where: text}
- id: q_fig9_data_source
  kind: reading
  about: [fig9b_st, fig9c_st]
  text: >
    The text (p. 8) says the measured impedance data are 'adapted from Nichols and O'Rourke (27)',
    while the caption of Fig. 9 (p. 9) says 'Measured data are from Mills et al. (26)'. The record does
    not read the measured curves; a later reader of md 0 and md 1 should cite both.
  citation: {page: 9, quote: "Measured data are from Mills et", where: "Fig. 9"}
- id: q_boundary_layer_reading
  kind: reading
  about: [delta_bl_estimate, boundary_layer_lighthill]
  text: >
    Audit: the 110-dpi page image of p. 2 agrees with the first reading ('[nu T/(2 pi)]^2 ≈ 0.01 cm').
    The model computes the first form (nu/omega)^(1/2); the printed 0.01 cm is closer to nu T/(2 pi)
    = 0.0092 cm (no square root). The record compares the printed ≈ 0.01, which gets no verdict as an
    approximate value; the clear disagreement (0.096 vs 0.01 cm) therefore rests on
    q_boundary_layer_exponent and the consistency comparison with '1 mm', not on a verdict.
