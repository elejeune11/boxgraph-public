# Added by the cross-validation job with olufsen2000.
- id: q_no_cross_validation_olufsen2000
  kind: unstated_input
  about: [Zmod_md0_fig9b, Zmod_md1_fig9b, Zphase_md0_fig9c, Zphase_md1_fig9c, p_aortic_fig12a, p_0cm_fig12b, p_radial_fig12b, co_measured, inflow_fig4, larger_arteries_1d, structured_tree_impedance]
  text: >
    Cross-validation with olufsen2000, which cites this paper as ref. 21, found no pair to test, in
    either direction. olufsen2000's runnable models give gamma, alpha and beta, nu, an area, a period from a
    heart rate, the tube-law pressure from an area, and a boundary-layer thickness. None of these is one of
    this paper's measurements. Those measurements are impedance (Fig. 9), pressures (Fig. 12) and the
    cardiac output and inflow of ref. 20. Its coupled network model (olufsen2000/network_1d), which would
    predict pressures, is not runnable. olufsen2000 measures MR flows (Figs. 3, 7), cuff pressures, an inlet
    radius, the cycle length and a heart rate. Of this record's models, only larger_arteries_1d gives flow
    or pressure, and it is not runnable (q_larger_arteries_not_runnable). structured_tree_impedance gives
    impedance, which olufsen2000 does not measure. No validation was added.
  citation: {page: 11, quote: "Measured data for pressure p(x, t) in aorta (A)", where: "Fig. 12(A)"}
# Added by the cross-validation job with olufsen2004.
- id: q_no_cross_validation_olufsen2004
  kind: unstated_input
  about: [Zmod_md0_fig9b, Zmod_md1_fig9b, Zphase_md0_fig9c, Zphase_md1_fig9c, p_aortic_fig12a, p_0cm_fig12b, p_radial_fig12b, co_measured, inflow_fig4, windkessel_eq7, structured_tree_impedance]
  text: >
    Cross-validation with olufsen2004, which cites this paper as ref. 19, found no pair to test, in either
    direction. olufsen2004 is analytical and measures nothing, so no model here can be judged against it.
    Of its models, only the three-element windkessel (olufsen2004/windkessel3_p73, the same form as Eq. 7
    here) gives a quantity measured here, the input impedance of Fig. 9 (md 0, md 1). Neither paper prints
    R1, R2 and CT for the bed of those measurements: this paper fits CT empirically to the structured tree
    and does not print it (p. H263), and the dotted wk curve of Fig. 9 has no printed parameters. Running it
    would need all three elements added, or fitted to the same curves, so it would not be a test. Its other
    models (rigid-vessel time-scales, step response, inductance) give no quantity measured here. No
    validation was added.
  citation: {page: 7, quote: "windkessel model is fitted empirically to match that"}

# Added by the cross-validation job with reymond2009.
- id: q_no_cross_validation_reymond2009
  kind: unstated_model
  about: [stiffness_eq6, structured_tree_impedance, windkessel_eq7, larger_arteries_1d, Eh_r0_data_fig3, Zmod_md0_fig9b, Zmod_md1_fig9b, Zphase_md0_fig9c, Zphase_md1_fig9c, p_aortic_fig12a, p_0cm_fig12b, p_radial_fig12b, co_measured, inflow_fig4]
  text: >
    Cross-validation with reymond2009, which cites this paper as ref. 43 (only in its Table 1 survey, as the
    source of the structured-tree outflow), found no pair to test, in either direction. reymond2009 measures
    flow and pressure waves and their extremes (Tables 4-5, Figs. 4-5), the elastance curve of Fig. 1B and
    literature pulse wave velocities against diameter (Fig. 3). The runnable models here give Eh/r0 (Eq. 6),
    root input impedance (structured tree, Eq. 7 windkessel), tree ratios, the boundary layer and the
    cardiac-output reduction: none of these is measured there. The model that would give flows and pressures,
    the 1-D model of Eqs. 3-11, is not runnable (q_larger_arteries_not_runnable).
    Eq. 6 does not give pulse wave velocity: turning Eh/r0 into PWV needs the wave-speed relation of p. 2,
    whose printed factor is itself in doubt (q_wave_speed_factor) and which is not a model of this record, so
    the Fig. 3 PWV points of reymond2009 are not crossed with Eh/r0 (related, but a different quantity). A
    wave-speed model added here, with both the printed and the Eq. 5 factor, would make that pair testable. In the other direction, reymond2009's runnable
    models (Eq. 22 PWV, Eq. 22 + 6 distensibility, Eq. 9, R1 = ZC, Eq. 15, pulse and mean pressure
    rules) give quantities this paper does not measure: its Fig. 3 points are estimates of Eh/r0 from
    literature volume compliances, not PWV or distensibility. No validation was added.
  citation: {page: 3, quote: "The data and the fitted curve are shown in Fig. 3"}

# Added by the cross-validation job with stergiopulos1992.
- id: q_no_cross_validation_stergiopulos1992
  kind: unstated_model
  about: [stiffness_eq6, structured_tree_impedance, windkessel_eq7, larger_arteries_1d, Zmod_md0_fig9b, Zmod_md1_fig9b, Zphase_md0_fig9c, Zphase_md1_fig9c, p_aortic_fig12a, p_0cm_fig12b, p_radial_fig12b, co_measured, inflow_fig4]
  text: >
    Cross-validation with stergiopulos1992 (ref. 46 here) found no pair to test, in either direction. This
    paper cites ref. 46 only for the 1D model family, the windkessel outflow and, with refs. 45 and 53, as a
    source of the volume compliances behind the Eh/r0 estimates of Fig. 3 (p. 3). It does not say that any
    of its models explains or is compared with a stergiopulos1992 measurement. The only measured data there
    are the Gosling et al. pulsatility indices (Fig. 7) and the Fronek et al. leg/brachial systolic ratios
    (p. 9). No runnable model here gives either quantity: Eq. 6 gives Eh/r0, the structured tree and the Eq. 7
    windkessel give root input impedance, and the rest give tree counts, a boundary-layer thickness and a
    cardiac-output reduction. The model that would give leg pressures, the 1D model of Eqs. 3-11, is not
    runnable (q_larger_arteries_not_runnable). stergiopulos1992's Table 1 compliances, which feed the Fig. 3
    fit, are model inputs there (origin reported), not measurements, and they are a volume compliance, not
    Eh/r0, so Eq. 6 is not entered against them even as a fit. In the other direction, stergiopulos1992's
    arterial_tree_1d gives scalar pressure and PI ratios and ascending-aortic systolic, diastolic and mean
    pressure, not the impedance spectra of Fig. 9 or the pressure waveforms of Fig. 12 (read here only on the
    upstroke and fall of the aortic curve, not its peak), and it is built on a generic adult's geometry and
    inflow, not on the subjects of refs. 26/27 or 41. Its terminal_impedance_eq7 gives the impedance of one
    terminal windkessel, not the root impedance of the ascending aorta measured in Fig. 9. No validation was added.
  citation: {page: 3, quote: "and Segers et al. (45) we obtain k1"}

# Added by the cross-validation job with westerhof1969.
- id: q_no_validation_vs_westerhof1969
  kind: choice
  about: [stiffness_eq6, structured_tree_impedance, windkessel_eq7, larger_arteries_1d, Eh_r0_data_fig3, Zmod_md0_fig9b, Zmod_md1_fig9b, Zphase_md0_fig9c, Zphase_md1_fig9c, p_aortic_fig12a, p_0cm_fig12b, p_radial_fig12b, co_measured, inflow_fig4]
  text: >
    Cross-validation with westerhof1969 (ref. 53 here) found no pair to test, in either direction. This paper
    cites ref. 53 only as one source of the volume compliances Cvol behind the Eh/r0 estimates of Fig. 3, to
    which Eq. 6 is fitted (p. 3); it does not say any of its models explains a westerhof1969 measurement.
    Those compliances are not measurements in westerhof1969: its Table 1 radii, wall thicknesses and moduli are
    inputs of the analog (origin reported) and the segment compliances are computed from them (predicted), and
    neither record holds an Eh/r0 datum there that Eq. 6's output could be set against, so Eq. 6 is not entered
    even as fit_quality (its fit to the Fig. 3 points is already cmp_eq6_fig3_data here). westerhof1969's
    measurements are the decay times, impedance-level and wave-velocity increases measured on its own analog
    (tau_*, dZin_stiff_printed, dc_stiff_printed) and the apparent wave velocities in man of Luchsinger et al.
    and Gabe et al. (Fig. 7). No runnable model here gives a decay time, a relative change under halved
    compliance, or an apparent wave velocity along the aorta: the structured tree and the Eq. 7 windkessel give
    root input impedance, and the 1D model that would give wave travel is not runnable
    (q_larger_arteries_not_runnable). See westerhof1969 q_no_validation_vs_olufsen1999 for the other direction.
  citation: {page: 3, quote: "With data for Cvol from Westerhof et al. (53)"}
