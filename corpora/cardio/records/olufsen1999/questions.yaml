  kind: unexplained_difference
  about: [val_tree_Zmod_md0, val_tree_Zmod_md1, val_tree_Zphase_md0, val_tree_Zphase_md1, structured_tree_impedance, q_fig9_magnitude]
  text: >
    Figure pass: the measured impedances md 0 and md 1, read from Fig. 9(B) and 9(C), follow the
