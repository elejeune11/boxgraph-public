- id: rho_blood_added
  quantity: blood_density
  unit: g/cm^3
  printed: "1.05"
  basis: >
    The paper gives only the kinematic viscosity nu = mu/rho = 0.046 cm^2/s (p. 2); the density rho
    (in c, g and Eq. 18) is not stated. 1.05 g/cm^3 is a usual value for blood. The impedance
    scales almost in proportion to rho.
  alternatives: ["1.055", "1.0", "1.06"]
  stands_for: rho in Eqs. 12-18
# Added in the audit, for the DC-impedance scaling claim of p. 9.
- id: r_root_lo_added
  quantity: tree_root_radius
  unit: cm
  printed: "0.1"
  basis: >
    The claim of p. 9 (Z(0, 0) about proportional to r_root^-3) concerns the structured trees at the
    terminals of the larger arteries of Fig. 1, whose root radii are not printed. 0.1 cm is taken as
    a small terminal radius of the larger arteries; 0.5 cm (r_root_hi_added) is the brachiocephalic
    root of p. 8, called "rather small".
  alternatives: ["0.15", "0.2"]
  stands_for: smaller root radius of the two-point slope
- id: r_root_hi_added
  quantity: tree_root_radius
  unit: cm
  printed: "0.5"
  basis: >
    The brachiocephalic root radius printed on p. 8; the root radii of the other trees of Fig. 1 are
    not printed (see r_root_lo_added).
  alternatives: ["0.3", "0.4"]
  stands_for: larger root radius of the two-point slope
