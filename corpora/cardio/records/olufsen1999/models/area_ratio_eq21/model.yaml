# Helper added for ModelAtlas: Eq. 21 exactly as printed, giving eta from gamma and xi (gamma = (r_d2/r_d1)^2,
# Eq. 20). asymmetry_eq21 is the same equation solved for gamma; this forward form lets the relation to
# olufsen2012's Eq. 2.18, which gives eta, be tested.
id: area_ratio_eq21
name: area ratio from the asymmetry ratio and the radius exponent (Eq. 21 as printed, forward form)
role: model
stated: {page: 7, printed_page: "H263", quote: "The parameters j, h, and g are not independent but are", where: Eq. 21}
equation: "eta = (1 + gamma) / (1 + gamma^(xi/2))^(2/xi)"
inputs:
  xi: {quantity: radius_exponent, unit: dimensionless}
  gamma: {quantity: asymmetry_ratio, unit: dimensionless}
outputs:
  eta: {quantity: area_ratio, unit: dimensionless}
settings: {}
stochastic: false
