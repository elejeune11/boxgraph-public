id: dc_root_radius_power
name: power of the root radius in the DC root impedance of the structured tree (p. 9)
role: processing
stated: {page: 9, printed_page: "H265", quote: "approximately inversely proportional to the root radius", where: text}
equation: "Z(0, 0) ~ r_root^(-p); p = ln[Z(0,0; r_lo)/Z(0,0; r_hi)] / ln(r_hi/r_lo), Z(0,0) from Eqs. 17-18"
from_words: true
built_from: [structured_tree_impedance]
inputs:
  r_lo: {quantity: tree_root_radius, unit: cm}
  r_hi: {quantity: tree_root_radius, unit: cm}
  r_min: {quantity: tree_minimum_radius, unit: cm}
  lrr: {quantity: length_to_radius_ratio, unit: dimensionless}
  xi: {quantity: radius_exponent, unit: dimensionless}
  gamma: {quantity: asymmetry_ratio, unit: dimensionless}
  k1: {quantity: stiffness_fit_amplitude, unit: g/s^2/cm}
  k2: {quantity: stiffness_fit_rate, unit: 1/cm}
  k3: {quantity: stiffness_fit_offset, unit: g/s^2/cm}
  nu: {quantity: kinematic_viscosity, unit: cm^2/s}
  rho: {quantity: blood_density, unit: g/cm^3}
outputs:
  p: {quantity: dc_impedance_radius_power, unit: dimensionless}
settings: {}
stochastic: false
