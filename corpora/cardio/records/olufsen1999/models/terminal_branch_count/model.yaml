id: terminal_branch_count
name: number of terminal branches of a symmetric tree from the total arteriolar area
role: processing
stated: {page: 6, printed_page: "H262", quote: "In case of a symmetric tree this gives ,2.8 3 106", where: text}
equation: "N = A_total / (pi (d/2)^2)"
from_words: true
inputs:
  A_total: {quantity: arteriolar_total_area, unit: cm^2}
  d: {quantity: arteriolar_diameter, unit: cm}
outputs:
  N: {quantity: terminal_branch_count, unit: dimensionless}
settings: {}
stochastic: false
