id: boundary_layer_lighthill
name: boundary-layer thickness in the larger arteries after Lighthill
role: model
stated: {page: 2, printed_page: "H258", quote: "larger arteries can be estimated from", where: text}
equation: "(nu/omega)^(1/2) = [nu T/(2 pi)]^2 ≈ 0.01 cm"
inputs:
  nu: {quantity: kinematic_viscosity, unit: cm^2/s}
  T: {quantity: cardiac_period, unit: s}
outputs:
  delta: {quantity: boundary_layer_thickness, unit: cm}
settings: {}
stochastic: false
