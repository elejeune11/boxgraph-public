id: cardiac_output_reduction
name: relative reduction of cardiac output by scaling the inflow curve
role: processing
stated: {page: 4, printed_page: "H260", quote: "4.14 to 4.03 l/min, a reduction of 3%", where: text}
equation: "reduction = (CO_measured - CO_scaled) / CO_measured"
from_words: true
inputs:
  co_measured: {quantity: cardiac_output, unit: l/min}
  co_scaled: {quantity: cardiac_output, unit: l/min}
outputs:
  reduction: {quantity: cardiac_output_reduction, unit: percent}
settings: {}
stochastic: false
