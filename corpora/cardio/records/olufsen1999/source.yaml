notes: >
  Scope: the paper's quantitative core. Recorded and checked are: the boundary-layer estimate (p. 2),
  the 3% cardiac-output reduction (p. 4, p. 11), the Eh/r0 fit of Eq. 6 against its plotted fit line
  and against the plotted estimates it was fitted to (Fig. 3), the order of the structured tree
  (terminal count and ~17 generations, p. 6), the asymmetry ratio from Eq. 21 (p. 7), and the
  structured-tree root impedance (Eqs. 6, 12-17, 19-21) for the brachiocephalic tree of Fig. 9,
  compared with the solid s.t. curves read from Fig. 9(B) and 9(C). The Fig. 4 inflow curve is read
  as data. Findings: the boundary-layer estimate is printed with exponent 2 and as ≈ 0.01 cm, but the
  printed inputs give ≈ 0.096 cm (consistent with the '1 mm' printed after it); Eq. 21 with the printed
  xi = 2.76 and eta = 1.16 gives gamma ≈ 0.356, not 0.41; the printed c0^2 is twice what Eq. 5 gives;
  and the tree built from the printed Fig. 9 inputs has a DC impedance of about 2.9 x 10^3 rather than
  the plotted ~9 x 10^3 g s^-1 cm^-4 and a different low-frequency fall-off. The blood density is
  added (1.05 g/cm^3). The leaf rule of the tree (vessels just below r_min included as leaves) is a
  reading of the text, recorded as a question. Left out: the coupled nonlinear 1D model (Eqs. 3-11) is
  recorded as not runnable (geometry from Segers et al. not printed, windkessel parameters not printed,
  no numerical settings), so Figs. 7, 8, 10, 11 are not checked; the single-vessel test geometry
  (100 cm, 0.4 to 0.25 cm), the Poisson ratios, the minimum radii r0-r3 of the Fig. 1 trees, and the
  symmetric-tree closed form for Z(0, 0) (no printed number) feed no runnable model with a printed
  result. The figure commands (`boxgraph figure page/check`, pdftoppm) were refused in the first
  session; crops were placed from the 110-dpi page images and the readings checked on the overlays the
  validator writes. A second, figure pass (2026-11-04) read the measured impedances md 0 and md 1 of
  Fig. 9(B, C) where their dash tracks are apart, compared with the brachiocephalic tree as validation
  (the tree from the printed inputs agrees with neither them nor the plotted s.t. line:
  q_fig9_measured_vs_tree), and read the measured pressures of Fig. 12 where one curve is apart (the
  thick aortic and 0 cm lines, the radial peak); see figures.md.
