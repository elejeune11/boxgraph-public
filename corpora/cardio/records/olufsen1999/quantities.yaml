- {id: kinematic_viscosity, name: kinematic viscosity of blood, dimension: "[length]**2/[time]", description: "nu = mu/rho"}
- {id: blood_density, name: density of blood, dimension: "[mass]/[length]**3", description: "rho"}
- {id: cardiac_period, name: period of one heartbeat, dimension: "[time]", description: "T"}
- {id: boundary_layer_thickness, name: thickness of the velocity boundary layer in the larger arteries, dimension: "[length]", description: "delta, estimated after Lighthill as (nu/omega)^(1/2)"}
- {id: cardiac_output, name: cardiac output, dimension: "[length]**3/[time]", description: "mean inflow to the arterial tree"}
- {id: cardiac_output_reduction, name: relative reduction of the cardiac output by scaling the inflow curve, dimension: "dimensionless"}
- {id: wall_stiffness_Eh_over_r0, name: Young's modulus times wall thickness over radius at zero transmural pressure, dimension: "[mass]/[length]/[time]**2", description: "Eh/r0 of Eq. 6"}
- {id: stiffness_fit_amplitude, name: amplitude k1 of the exponential fit of Eh/r0, dimension: "[mass]/[length]/[time]**2", description: "k1 in Eq. 6"}
- {id: stiffness_fit_rate, name: exponential rate k2 of the fit of Eh/r0 in r0, dimension: "1/[length]", description: "k2 in Eq. 6"}
- {id: stiffness_fit_offset, name: asymptotic offset k3 of the fit of Eh/r0, dimension: "[mass]/[length]/[time]**2", description: "k3 in Eq. 6"}
- {id: vessel_radius, name: vessel radius at zero transmural pressure, dimension: "[length]", description: "r0; the abscissa of Fig. 3"}
- {id: arteriolar_diameter, name: arteriolar diameter at which the vascular bed is counted, dimension: "[length]"}
- {id: arteriolar_total_area, name: total cross-sectional area of the arteriolar bed at a given diameter, dimension: "[length]**2"}
- {id: terminal_branch_count, name: number of terminal branches of a symmetric tree, dimension: "dimensionless"}
- {id: subtree_count, name: number of structured subtrees attached to the larger arteries, dimension: "dimensionless"}
- {id: generation_count, name: number of generations of each structured tree, dimension: "dimensionless"}
- {id: radius_exponent, name: radius exponent xi of the bifurcation law r_pa^xi = r_d1^xi + r_d2^xi, dimension: "dimensionless", description: "Eq. 19"}
- {id: area_ratio, name: area ratio eta of a bifurcation (daughters' total area over parent's area), dimension: "dimensionless", description: "Eq. 20"}
- {id: asymmetry_ratio, name: asymmetry ratio gamma = (r_d2/r_d1)^2 of a bifurcation, dimension: "dimensionless", description: "Eq. 20"}
- {id: length_to_radius_ratio, name: length-to-radius ratio of the vessels of the structured tree, dimension: "dimensionless", description: "lambda = l/r"}
- {id: tree_root_radius, name: radius at the root of a structured tree, dimension: "[length]"}
- {id: tree_minimum_radius, name: minimum radius at which the branches of a structured tree are terminated, dimension: "[length]"}
- {id: time, name: time within the cardiac cycle, dimension: "[time]"}
- {id: inflow_rate, name: volume flow into the ascending aorta, dimension: "[length]**3/[time]", description: "q(0, t) of Fig. 4"}
- {id: arterial_pressure, name: blood pressure in a larger artery, dimension: "[pressure]"}
- {id: angular_frequency, name: angular frequency of a Fourier mode, dimension: "1/[time]", description: "omega"}
- {id: input_impedance_modulus, name: modulus of the input impedance at the root of a tree, dimension: "[mass]/[length]**4/[time]", description: "|Z(0, omega)|"}
- {id: input_impedance_phase, name: phase of the input impedance at the root of a tree, dimension: "dimensionless", description: "phase(Z(0, omega)), in degrees"}
- {id: windkessel_resistance, name: resistance of a windkessel outflow condition, dimension: "[mass]/[length]**4/[time]", description: "R1, R2 in Eq. 7"}
- {id: windkessel_compliance, name: compliance of the vascular bed in a windkessel outflow condition, dimension: "[length]**4*[time]**2/[mass]", description: "CT in Eq. 7"}
- {id: reference_wave_speed, name: wave propagation velocity at the reference area A = A0, dimension: "[length]/[time]", description: "c0 of p. 3 at A = A0"}
- {id: dc_impedance_radius_power, name: power of the root radius in the DC root impedance of a structured tree, dimension: "dimensionless", description: "p in Z(0, 0) ~ r_root^(-p); minus the log-log slope of Z(0, 0) against the root radius"}
- {id: surrounding_pressure, name: pressure of the surroundings of a vessel (zero transmural pressure), dimension: "[pressure]", description: "p0 in Eq. 5"}
- {id: vessel_cross_sectional_area, name: cross-sectional area of a larger artery, dimension: "[length]**2", description: "A(x, t) in Eq. 5"}
