id: coronary_resistance_by_condition
name: coronary resistance (mean aortic pressure / perfusion) for the condition of a Fig. 4 bar
role: processing
stated: {page: 4, printed_page: H782, quote: "quotient of mean aortic pressure and myocar", where: "Methods, Measurement of myocardial perfusion; Fig. 4"}
equation: "coronary resistance = mean aortic pressure / myocardial blood flow, in the condition of the bar (1 control, 2 papaverine)"
from_words: true
built_from: [coronary_resistance]
inputs:
  P_ctl: {quantity: mean_aortic_pressure, unit: mmHg, description: "mean aortic pressure, control"}
  Q_ctl: {quantity: myocardial_perfusion, unit: ml/min/hg, description: "myocardial perfusion, control"}
  P_pap: {quantity: mean_aortic_pressure, unit: mmHg, description: "mean aortic pressure, papaverine"}
  Q_pap: {quantity: myocardial_perfusion, unit: ml/min/hg, description: "myocardial perfusion, papaverine"}
  condition: {quantity: condition_index, unit: dimensionless, description: "1 control, 2 papaverine (the bars of Fig. 4 from the left)"}
outputs:
  R: {quantity: coronary_resistance, unit: mmHg*min*hg/ml}
settings: {}
stochastic: false
