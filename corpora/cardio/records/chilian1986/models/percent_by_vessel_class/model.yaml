id: percent_by_vessel_class
name: mean microvascular pressure as a percentage of mean aortic pressure, for the vessel class of a Fig. 7 point
role: processing
stated: {page: 5, printed_page: H783, quote: "expressing the mean microvascular pressure as a", where: "Methods, Data analysis; Fig. 7"}
equation: "% of aortic pressure = 100 x (mean microvascular pressure) / (mean aortic pressure), for the class of the point (1 large arterioles, 2 medium arterioles, 3 small venules, 4 medium venules)"
from_words: true
built_from: [pressure_percent_of_aortic]
inputs:
  Pa_1: {quantity: mean_aortic_pressure, unit: mmHg, description: "aortic, beside the large arterioles"}
  Pm_1: {quantity: mean_microvascular_pressure, unit: mmHg, description: "large arterioles"}
  Pa_2: {quantity: mean_aortic_pressure, unit: mmHg, description: "aortic, beside the medium arterioles"}
  Pm_2: {quantity: mean_microvascular_pressure, unit: mmHg, description: "medium arterioles"}
  Pa_3: {quantity: mean_aortic_pressure, unit: mmHg, description: "aortic, beside the small venules"}
  Pm_3: {quantity: mean_microvascular_pressure, unit: mmHg, description: "small venules"}
  Pa_4: {quantity: mean_aortic_pressure, unit: mmHg, description: "aortic, beside the medium venules"}
  Pm_4: {quantity: mean_microvascular_pressure, unit: mmHg, description: "medium venules"}
  cls: {quantity: vessel_class_index, unit: dimensionless, description: "1 large arterioles, 2 medium arterioles, 3 small venules, 4 medium venules"}
outputs:
  pct: {quantity: mean_pressure_percent_of_aortic, unit: percent}
settings: {}
stochastic: false
