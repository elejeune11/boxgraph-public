id: segment_resistance_fraction
name: share of total coronary resistance between two vessel classes
role: model
stated: {page: 1, printed_page: H779, quote: "was produced by arterioles between 100 and 200", where: Abstract}
equation: "share between an upstream and a downstream class = (% of aortic pressure upstream) - (% of aortic pressure downstream)"
from_words: true
built_from: [resistance_partition]
inputs:
  pct_up: {quantity: mean_pressure_percent_of_aortic, unit: percent}
  pct_down: {quantity: mean_pressure_percent_of_aortic, unit: percent}
outputs:
  segment: {quantity: resistance_fraction_segment, unit: percent}
settings: {}
stochastic: false
