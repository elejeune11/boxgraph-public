- id: q_mean_of_ratios
  kind: choice
  about: [pressure_percent_of_aortic, relative_diameter_change]
  text: >
    The paper's percentages (Table 6; the 15% diameter changes) are presumably means of per-vessel
    ratios; the record can only form the ratio of the printed group means. The two need not agree
    exactly, which is why Table 6 is compared within its printed SE.
- id: q_mbf_ctl_abstract
  kind: possible_error
  about: [abs_mbf_ctl, t3_mbf_ctl, abs_mbf_pap, t3_mbf_pap]
  text: >
    The abstract gives control myocardial perfusion as 139 ± 9 and papaverine perfusion as 339 ± 52
    ml min-1 100 g-1; Table 3 gives 132 ± 8 (n = 10) and 339 ± 60 (n = 7). The means agree within the SEs
    but are not the same numbers; the abstract may report a different set of animals or an earlier
    analysis, or carry misprints.
