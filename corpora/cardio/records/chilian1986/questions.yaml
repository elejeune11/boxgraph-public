- id: q_70_130_class
  kind: reading
  about: [res_pct_70_130_ctl, res_prox_70_130_ctl, t4_sart_mean_mv]
  text: >
    The results give the pressure in "coronary arterioles 70-130 um" as 50-55% of aortic, "not provided
    in Fig. 6"; Fig. 6 is a single phasic trace and the percentages are in Fig. 7, so Fig. 7 may be
    meant. The record takes these arterioles to be the small-arteriole class of Table 4 (98 ± 14 um).
  citation: {page: 5, printed_page: H783, quote: "in diameter was 50-55% of aortic pressure"}
- id: q_outflow_pressure_zero
  kind: unstated_input
  about: [resistance_partition, segment_resistance_fraction]
  text: >
    Taking the pressure at a site as a percentage of aortic pressure as the distal share of total
    resistance assumes the same flow through the vessels in series and an outflow pressure of zero. The
    paper does not say which downstream pressure it uses; right atrial pressure was 3.5 ± 1.4 mmHg in
    control (Table 3). Using it would change the shares by a few percentage points.
  citation: {page: 5, printed_page: H783, quote: "vascular pressure is 70% of aortic pressure, then 30% of"}
- id: q_proximal_vs_resides
  kind: overstated_claim
  about: [abs_prox_100_ctl, abs_prox_200_ctl]
  text: >
    The method gives the share of resistance proximal to a vessel class, i.e. in everything from the aorta
    to that site, including the epicardial conduit arteries. The abstract and discussion say this share
    "resides in" arterioles larger than 100 um (45%) or in medium-sized arterioles (25%), which credits all
    of it to the arterioles.
  citation: {page: 1, printed_page: H779, quote: "a substantial portion (45%)"}
