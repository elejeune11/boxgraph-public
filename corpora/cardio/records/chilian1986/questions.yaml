- id: q_no_validation_kassab1993
  kind: choice
  about: [pressure_percent_of_aortic, resistance_partition, segment_resistance_fraction, pressure_drop, coronary_resistance, relative_diameter_change]
  text: >
    (Cross-record validation with kassab1993.) No model of this record predicts a measurement of
    kassab1993, and no kassab1993 model predicts one of this record. The models here are arithmetic on
    measured pressures, perfusion and diameter changes of the cat heart; kassab1993 measures pig
    coronary arterial morphometry by Strahler order (diameters, lengths, numbers, connectivity, volume),
    with no pressure, flow or diameter change. kassab1993's models give per-order morphometry of the pig
    tree, and this record's vessel classes (cat arterioles and venules by diameter range, Fig. 3 single
    vessels) carry no order, so they cannot be run on these measurements' conditions without an
    assumed order-to-class match across species. Neither paper cites the other.
- id: q_no_validation_mynard2014
  kind: choice
  about: [coronary_resistance, coronary_resistance_by_condition, pressure_percent_of_aortic, resistance_partition, segment_resistance_fraction, pressure_drop]
  text: >
    (Cross-validation with mynard2014; cross-validation job 2026-11-06.) No model of this record
    predicts a measurement of mynard2014. mynard2014's measurements are sheep and lamb weights, heart
    rate, mean aortic pressure and weight-corrected Cx flow (Table 1), and the measured Cx flow
    waveform features and curves (Table 2, Figs. 7-8). The models here are arithmetic on cat
    microvascular and aortic pressures, perfusion and diameters, and none of them outputs a flow, a
    waveform feature or a weight. coronary_resistance (P/Q) can be run on mynard2014's Table 1 mean
    aortic pressure and Cx flow, but mynard2014 measures no resistance to compare with. Its effective
    resistance (0.72, 0.34) is the paper's own arithmetic (pLM - pRA)/qLM, with a qLM it does not print
    (mynard2014/q_reff). It is a different quantity, because it subtracts right atrial pressure, so
    comparing with it would test a definition, not a measurement. mynard2014 does not cite this
    paper. See mynard2014/q_no_validation_chilian1986.
