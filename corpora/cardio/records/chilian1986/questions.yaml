- id: q_lart_pap_6pct
  kind: unexplained_difference
  about: [res_prox_lart_pap, t6_lart_pap_mean, cmp_prox_lart_pap_res]
  text: >
    The results say that during papaverine large coronary arterioles "contributed to only 6" % of total
    coronary resistance (Fig. 7). Table 6 gives their mean pressure as 96 ± 4% of aortic, i.e. 4% proximal,
    and the Table 5 means (67 of 70 mmHg) give 4.3%. The 6% may come from the systolic or a per-animal
    figure, or be a misprint; the paper does not say.
  citation: {page: 6, printed_page: H784, quote: "oles contributed to only 6 and 10% of total coronary"}
