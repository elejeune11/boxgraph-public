    pass could not run the figure tools, so the bars are not read and the computed resistances
    (Table 3: 76/132 and 72/339) have no printed value to compare against yet.
  citation: {page: 7, printed_page: H785, quote: "Myocardial perfusion and coronary resistance shown for control conditions"}
