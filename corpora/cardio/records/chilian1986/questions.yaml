  text: >
    (Audit.) The share of resistance proximal to the ~100-um arterioles in control is given as 45% (abstract),
    "approximately 45-50%" (results), and "approximately 50%" / "about 50%" (discussion, pp. 6 and 9).
    Table 4 gives 100 - 100 x 44/78 = 43.6%. All statements rest on the same data. The discussion's 50% is at
