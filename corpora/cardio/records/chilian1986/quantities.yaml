- {id: systolic_aortic_pressure, name: systolic aortic pressure, dimension: "[mass]/[length]/[time]**2", description: "Systolic aortic pressure recorded simultaneously with a microvascular pressure (Tables 4, 5)."}
- {id: diastolic_aortic_pressure, name: diastolic aortic pressure, dimension: "[mass]/[length]/[time]**2", description: "Diastolic aortic pressure recorded simultaneously with a microvascular pressure (Tables 4, 5)."}
- {id: mean_aortic_pressure, name: mean aortic pressure, dimension: "[mass]/[length]/[time]**2", description: "Mean aortic (arterial) pressure."}
- {id: systolic_microvascular_pressure, name: systolic coronary microvascular pressure, dimension: "[mass]/[length]/[time]**2", description: "Systolic intraluminal pressure in a class of epicardial coronary microvessels (servo-null micropipette)."}
- {id: diastolic_microvascular_pressure, name: diastolic coronary microvascular pressure, dimension: "[mass]/[length]/[time]**2", description: "Diastolic intraluminal pressure in a class of epicardial coronary microvessels."}
- {id: mean_microvascular_pressure, name: mean coronary microvascular pressure, dimension: "[mass]/[length]/[time]**2", description: "Mean intraluminal pressure in a class of epicardial coronary microvessels."}
- {id: systolic_pressure_percent_of_aortic, name: systolic microvascular pressure as a percentage of systolic aortic pressure, dimension: dimensionless, description: "Table 6, 'Systolic%'."}
- {id: diastolic_pressure_percent_of_aortic, name: diastolic microvascular pressure as a percentage of diastolic aortic pressure, dimension: dimensionless, description: "Table 6, 'Diastolic%'."}
- {id: mean_pressure_percent_of_aortic, name: mean microvascular pressure as a percentage of mean aortic pressure, dimension: dimensionless, description: "Table 6, 'Mean%'; the paper's measure of relative resistance (the share of total coronary resistance distal to the site)."}
- {id: resistance_fraction_proximal, name: fraction of total coronary resistance proximal to a microvessel class, dimension: dimensionless, description: "Share of total coronary resistance between the aorta and the site of measurement."}
- {id: resistance_fraction_distal, name: fraction of total coronary resistance distal to a microvessel class, dimension: dimensionless, description: "Share of total coronary resistance downstream of the site of measurement."}
- {id: resistance_fraction_segment, name: fraction of total coronary resistance between two microvessel classes, dimension: dimensionless, description: "Share of total coronary resistance in the segment between an upstream and a downstream vessel class."}
- {id: pressure_drop_aorta_to_microvessel, name: mean pressure gradient from the aorta to a microvessel class, dimension: "[mass]/[length]/[time]**2", description: "Mean aortic pressure minus mean microvascular pressure."}
- {id: myocardial_perfusion, name: subepicardial myocardial perfusion, dimension: "[length]**3/[time]/[mass]", description: "Microsphere blood flow per unit mass of subepicardial myocardium."}
- {id: coronary_resistance, name: coronary vascular resistance per unit mass, dimension: "[mass]**2/[length]**4/[time]", description: "Mean aortic pressure divided by myocardial perfusion (mmHg min 100 g / ml)."}
- {id: vessel_diameter_control, name: control (covered) microvessel diameter, dimension: "[length]", description: "Diameter of epicardial microvessels with the epicardium covered (pericardium or cellophane)."}
- {id: diameter_change_absolute, name: absolute change in microvessel diameter on atmospheric exposure, dimension: "[length]", description: "Mean absolute value of the diameter change (increases and decreases) after 20 min exposure to the atmosphere."}
- {id: diameter_change_relative, name: relative change in microvessel diameter on atmospheric exposure, dimension: dimensionless, description: "The absolute diameter change as a percentage of the control diameter."}
# Added in the figure pass
- {id: microvessel_diameter, name: diameter of one epicardial microvessel, dimension: "[length]", description: "Diameter of an individual epicardial arteriole or venule, in a given epicardial condition (Fig. 3)."}
- {id: condition_index, name: position of an experimental condition along a figure's x axis, dimension: dimensionless, description: "Fig. 3: 1 covered, 2 exposed to atmosphere, 3 covered with oil. Fig. 4: 1 control, 2 papaverine. What each index is is in the reading's `what`."}
- {id: vessel_class_index, name: position of a microvessel class among the classes of Fig. 7, dimension: dimensionless, description: "1 large arterioles, 2 medium arterioles, 3 small venules, 4 medium venules (Tables 4-6)."}
