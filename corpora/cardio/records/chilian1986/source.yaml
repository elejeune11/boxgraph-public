notes: >
  An experimental paper (cat, beating left ventricle). Its quantitative core is arithmetic on measured
  pressures: microvascular pressure as a percentage of aortic pressure (Table 6, from the pressures of
  Tables 4 and 5), and the rule that this percentage is the share of total coronary resistance
  distal to the site (Methods). The record holds every value of Tables 4, 5 and 6. It recomputes all 24
  Table 6 percentages from the group means, then the resistance shares and the aorta-to-microvessel pressure
  gradients that the abstract, results and discussion claim. It also recomputes the relative diameter
  changes on atmospheric exposure (p. 5) and coronary resistance = mean aortic pressure / perfusion
  (Methods) from Table 3. The abstract's perfusion and mean arterial pressure are compared with Table 3.
  Findings: the "6%" share for large arterioles under papaverine does not follow from Table 6 (4%); the
  abstract's control perfusion (139 ± 9) differs from Table 3 (132 ± 8); and Table 6 gives n = 7 for
  control large arterioles where Table 4 gives n = 6. Every model is stated in words and made runnable
  (from_words). Left out: the microsphere flow equation (MBF = Cm W / Cr), for which no counts are
  printed; Table 1 (restraint validation), Table 2 (repeat measurements) and the blood gases of
  Table 3, which feed no model; the coronary reserve velocity ratios (4.5, 1.2); and values the paper
  quotes from other studies (Tillmanns, Nellis, other organs). No figure was read in the first pass because
  the figure tools were not permitted in that job. A figure pass (2026-11-06) read Figs. 3, 4 and 7 with
  calibrated code (figures.yaml, figures/, figures.md):
  the individual vessel diameters of Fig. 3 (as measured data, with no model); the perfusion and resistance
  bars of Fig. 4 with SE, compared with Table 3 and with R = P/Q from Table 3; and the 8 points of Fig. 7
  with SE, compared with the Mean% from Tables 4/5 and with Table 6. Figs. 1, 2, 5 and 6 are single
  example recordings and are left out.
