id: mean_sd_dpdtp
name: mean ± SD over the nine dogs (dpdtp_max)
role: processing
stated:
  page: 5
  printed_page: '318'
  quote: MEAN ± sn 5 ± 1
  where: Table 2, MEAN ± SD row
equation: mean = sum(x_i)/n; SD = sqrt(sum((x_i - mean)^2)/(n - ddof)), n = 9
from_words: true
inputs:
  x1:
    quantity: dpdtp_max
    unit: 1/s
    description: dog 1
  x2:
    quantity: dpdtp_max
    unit: 1/s
    description: dog 2
  x3:
    quantity: dpdtp_max
    unit: 1/s
    description: dog 3
  x4:
    quantity: dpdtp_max
    unit: 1/s
    description: dog 4
  x5:
    quantity: dpdtp_max
    unit: 1/s
    description: dog 5
  x6:
    quantity: dpdtp_max
    unit: 1/s
    description: dog 6
  x7:
    quantity: dpdtp_max
    unit: 1/s
    description: dog 7
  x8:
    quantity: dpdtp_max
    unit: 1/s
    description: dog 8
  x9:
    quantity: dpdtp_max
    unit: 1/s
    description: dog 9
  ddof:
    quantity: sd_ddof
    unit: dimensionless
    description: '1: sample SD; 0: population SD'
outputs:
  mean:
    quantity: dpdtp_max
    unit: 1/s
  sd:
    quantity: dpdtp_sd_dogs
    unit: 1/s
settings: {}
stochastic: false
