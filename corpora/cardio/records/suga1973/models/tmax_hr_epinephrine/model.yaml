id: tmax_hr_epinephrine
name: Tmax shortening per 100 beats/min heart-rate increase caused by epinephrine
role: processing
stated:
  page: 7
  printed_page: '320'
  quote: The mean value of the rate of shortening of Tmax per 100-beats/min increase in heart rate caused by epinephrine
