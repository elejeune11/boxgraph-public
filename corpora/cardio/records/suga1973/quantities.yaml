- id: correction_volume
  name: correction volume Vd
  dimension: '[length]**3'
  description: Volume-axis intercept of the line through the left uppermost corners of P-V loops; subtracted from ventricular volume
    in E(t)
- id: emax
  name: peak instantaneous pressure-volume ratio Emax
  dimension: '[mass]/[length]**4/[time]**2'
  description: Peak of E(t) = P(t)/[V(t) - Vd] over one beat (left ventricle)
- id: tmax
  name: time to Emax from onset of systole
  dimension: '[time]'
- id: dpdtp_max
  name: peak of (dP/dt)/P
  dimension: 1/[time]
  description: '[(dP/dt)/P]max, P the total left ventricular pressure'
- id: heart_rate
  name: heart rate
  dimension: 1/[time]
- id: emax_ratio
  name: 'alpha: Emax enhanced / Emax control'
  dimension: dimensionless
- id: tmax_ratio
  name: 'beta: Tmax control / Tmax enhanced'
  dimension: dimensionless
- id: dpdtp_ratio
  name: 'gamma: [(dP/dt)/P]max enhanced / control'
  dimension: dimensionless
- id: vd_sd_dogs
  name: between-dog SD of Vd
  dimension: '[length]**3'
  description: Standard deviation across the nine dogs
- id: emax_sd_dogs
  name: between-dog SD of Emax
  dimension: '[mass]/[length]**4/[time]**2'
  description: Standard deviation across the nine dogs
- id: tmax_sd_dogs
  name: between-dog SD of Tmax
  dimension: '[time]'
  description: Standard deviation across the nine dogs
- id: dpdtp_sd_dogs
  name: between-dog SD of [(dP/dt)/P]max
  dimension: 1/[time]
  description: Standard deviation across the nine dogs
- id: emax_ratio_sd_dogs
  name: between-dog SD of alpha
  dimension: dimensionless
- id: tmax_ratio_sd_dogs
  name: between-dog SD of beta
  dimension: dimensionless
- id: dpdtp_ratio_sd_dogs
  name: between-dog SD of gamma
  dimension: dimensionless
- id: tmax_shortening_per_hr
  name: relative shortening of Tmax per 100 beats/min increase in heart rate
  dimension: dimensionless
  description: Percent shortening of Tmax divided by the heart-rate increase in units of 100 beats/min (the paper's '% per 100-beats/min')
- id: tmax_shortening_per_hr_sd
  name: between-dog SD of the Tmax shortening per 100 beats/min
  dimension: dimensionless
- id: p_value
  name: P value of a paired t-test
  dimension: dimensionless
- id: sd_ddof
  name: delta degrees of freedom of a standard deviation
  dimension: dimensionless
  description: 1 for the sample SD (divisor n-1), 0 for the population SD (divisor n)
- id: epinephrine_infusion_rate
  name: epinephrine infusion rate
  dimension: 1/[time]
  description: mass of epinephrine per body mass per time
- id: ventricular_pressure
  name: instantaneous left intraventricular pressure
  dimension: '[mass]/[length]/[time]**2'
- id: ventricular_volume
  name: instantaneous left intraventricular volume
  dimension: '[length]**3'
- id: pv_ratio
  name: instantaneous pressure-volume ratio E(t)
  dimension: '[mass]/[length]**4/[time]**2'
- id: time_in_beat
  name: time from the onset of systole
  dimension: '[time]'
- id: normalized_time
  name: normalized time tN = t/Tmax
  dimension: dimensionless
  description: Time from the onset of systole divided by Tmax of the same beat (Fig. 5)
- id: normalized_pv_ratio
  name: normalized pressure-volume ratio eN = E(t)/Emax
  dimension: dimensionless
  description: Instantaneous pressure-volume ratio divided by its peak Emax in the same beat; the mean over curves is EN(tN) (Fig. 5)
