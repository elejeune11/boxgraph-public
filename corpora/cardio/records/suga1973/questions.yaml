- id: q_crossval_westerhof2009
  kind: unstated_model
  about: [elastance_normalized, pv_ratio]
  text: >
    Cross-validation against westerhof2009 (which cites this paper as ref. 65) found nothing to compare. The
    measurements there are arterial input impedance (Figs. 4, 6), aortic pressure (Fig. 6) and the isolated
    cat-heart pressures and flows of Fig. 8. This record's models give E(t) from P, V and Vd, or E(t) from
    Emax, Tmax and EN (not runnable), plus ratios and statistics of its own data; none outputs an impedance,
    an aortic pressure or a flow. Predicting Fig. 8 would need E(t) coupled to a windkessel load, a model this
    paper does not state, with cat-heart Emax, Tmax and Vd that neither paper gives.
  citation: {page: 8, printed_page: "321", quote: "The mathematical description is given by E(t)", where: "text, Discussion"}
- id: q_crossval_shi2018
  kind: unstated_model
  about: [elastance_normalized, pv_ratio]
  text: >
    Cross-validation against shi2018 (which cites this paper as ref. 10, only as an example of a
    variable-elastance model) found nothing to compare, in either direction. shi2018 holds no
    measurement: its text values and Fig. 5 readings are all output of its own CellML simulation
    (its figures.md: "The paper plots no measured data"), so no model here can be validated against
    it. Its one model that produces results, circulation_fig1d, is not runnable (no equations or
    parameters printed), and its other models only restate its own text values, so none of them
    can be run on this paper's canine measurements (Tables 1, 2, Fig. 5).
  citation: {page: 8, printed_page: "321", quote: "The mathematical description is given by E(t)", where: "text, Discussion"}
- id: q_crossval_korakianitis2006
  kind: unstated_model
  about: [elastance_normalized, pv_ratio]
  text: >
    Cross-validation against korakianitis2006 (which cites this paper as the source of its variable
    elastance model) found nothing to compare, in either direction. korakianitis2006 holds no
    measurement: its data are model parameters (Tables 1-5) and its figures are all output of its
    own simulation, so no model here can be validated against it. Its elastance model
    (elastance_eq2_5) takes Emax- and Tmax-like values as inputs (E_lv,s and T_s1, human values) and
    gives elastance in mmHg/ml against time in s, not the normalized EN(t/Tmax) of Fig. 5. So the
    Emax and Tmax of Tables 1 and 2 are inputs there, not predictions. This paper's
    elastance_normalized is not runnable.
  citation: {page: 8, printed_page: "321", quote: "The mathematical description is given by E(t)", where: "text, Discussion"}
- id: q_crossval_shi2013_ch2
  kind: unstated_model
  about: [elastance_normalized, pv_ratio, en_fig5_s1, en_fig5_s2, en_fig5_s3, en_fig5_s4]
  text: >
    Cross-validation against shi2013_ch2 (which adopts this paper's variable elastance model) found
    nothing to compare, in either direction. shi2013_ch2's one measurement is a volunteer's LV volume
    per MRI phase (its Fig. 2-3). pv_ratio gives E(t) from P, V and Vd, and elastance_normalized is not
    runnable, so neither predicts a volume. In the other direction, shi2013_ch2's elastance_ch2 gives
    e_lv in mmHg/ml against time in s (Eqs. 2-2, 2-3). That is not the normalized EN = E/Emax against
    tN = t/Tmax of Fig. 5. Its E_lv,s and T_s1 play the roles of Emax and Tmax, so the Emax and Tmax of
    Tables 1 and 2 would be its inputs, not predictions. The chapter does not say its activation
    function was fitted to or compared with Fig. 5. Its circulation model gives pressures, flows and
    volumes of a human circulation, not this paper's canine Vd, [(dP/dt)/P]max or heart rates.
  citation: {page: 8, printed_page: "321", quote: "The mathematical description is given by E(t)", where: "text, Discussion"}
- id: q_no_validation_vs_kim2010
  kind: unstated_model
  about: [elastance_normalized, pv_ratio, alpha_ratio, tmax_hr_epinephrine]
  text: >
    Cross-validation against kim2010 (2026-11-06) found nothing to compare, in either direction. Kim et
    al. do not cite this paper and neither says one's model explains the other's data. kim2010's only
    measurements are Gould et al.'s canine LAD mean flows against coronary diameter reduction (its Fig. 6);
    no model here has a stenosis input or a flow output (pv_ratio gives E(t) from P, V and Vd,
    elastance_normalized is not runnable, the rest are ratios and statistics of this paper's own tables).
    kim2010's left ventricular pressure-volume loops (its Fig. 2) are output of its 3D simulation, not
    measurements, so pv_ratio run on them would validate nothing. In the other direction, kim2010's
    contractility_increase raises a human patient's E_LV,max by an authors' chosen 10% for exercise; it
    does not predict the epinephrine Emax of Tables 1 and 2. See kim2010/q_no_validation_vs_suga1973.
  citation: {page: 1, printed_page: "314", quote: "As a means of assessing ventricular performance, we analyzed the time-varying", where: text}
