- id: q_tmax_e_mean
  kind: possible_error
  about: [tmax_e_mean, abs_tmax_e_mean, cmp_tmax_e_mean, cmp_tmax_e_mean_abstract, tmax_e_sd, abs_tmax_e_sd]
  text: >
    The mean of the nine per-dog Tmax values under 2 ug/kg/min epinephrine printed in Table 2
    (125, 152, 145, 145, 144, 121, 215, 128, 143 msec) is 146.4 msec, not the 157 msec printed in
    the bottom row of Table 2 and again in the abstract; their SD is 27.8 (n - 1) or 26.2 (n),
    against 26 printed. Rounding of the per-dog means cannot account for 11 msec. The mean of the
    printed beta column (1.30) does agree with the per-dog values, so either one per-dog entry or the
    printed mean is in error, or the mean was taken over a different set of beats or dogs.
  citation: {page: 6, quote: "12.2 ± 4.5 1.8 =t 0.6 157 ± 26", where: "Table 2"}
- id: q_ttest_load
  kind: unexplained_difference
  about: [t1_p_emax_l2, t1_p_emax_l4, t1_p_emax_l5, t1_p_tmax_l2, t1_p_tmax_l4, cmp_p_emax_l2, cmp_p_emax_l4, cmp_p_emax_l5, cmp_p_tmax_l2, cmp_p_tmax_l4]
  text: >
    A two-sided paired t-test on the per-dog means printed in Table 1 gives, for Emax, P = 0.056
    (load 1 vs 2), 0.34 (vs 4) and 0.068 (vs 5), where Table 1 prints P > 0.5 for each; and for
    Tmax P = 0.57 (vs 2) and 0.55 (vs 4), where it prints P > 0.9. The Tmax P values for loads 3 and
    5 (0.59, 0.65) are consistent with the printed P > 0.5. The conclusion of no significant
    difference at the 5% level still holds, but the printed bounds do not follow from the printed
    table with a paired t-test on per-dog means. The paper may have tested something else (e.g.
    beat-level data or a one-sided test), which it does not say. Printed '> 0.5' gets no verdict,
    so this is recorded here.
  citation: {page: 3, quote: "P values were obtained using a paired i-test", where: "Table 1 legend"}
- id: q_sd_convention
  kind: unexplained_difference
  about: [tmax_c_sd, abs_tmax_c_sd, dpdtp_c_sd, emax_c_sd, cmp_tmax_c_sd, cmp_dpdtp_c_sd, cmp_emax_c_sd, sd_ddof_added]
  text: >
    The between-dog SDs computed from the per-dog values of Table 2 do not all match the printed
    MEAN ± SD row under either convention: Tmax control 31.6 (n - 1) or 29.7 (n) against 29;
    [(dP/dt)/P]max control 5.66 or 5.33 against 6.0; Emax control 1.15 or 1.08 against 1.2. Other
    SDs (Vd, Emax enhanced, alpha, beta, gamma, (dP/dt)/P enhanced) reproduce with n - 1. The
    printed SDs may have been computed from unrounded per-dog means; the paper does not say.
- id: q_ratio_rounding
  kind: possible_error
  about: [alpha_d8, cmp_alpha_d8, gamma_d3, cmp_gamma_d3, gamma_d6, cmp_gamma_d6]
  text: >
    Three per-dog ratios in Table 2 differ from the ratio of the printed means in the same row:
    alpha for dog 8 is 10.7/7.4 = 1.45 against 1.3 printed; gamma for dog 3 is 43/30 = 1.43 against
    1.5; gamma for dog 6 is 54/35 = 1.54 against 1.6. The gamma differences could come from
    rounding of the printed (dP/dt)/P means to integers; the alpha of dog 8 (0.15 off) is harder to
    explain that way. The other 24 ratios reproduce.
  citation: {page: 6, quote: "14-30 90-205 176 10.7 ± 0.48 1.3 0.001", where: "Table 2"}
- id: q_tmax_hr_definition
  kind: unstated_model
  about: [tmax_hr_epinephrine, tmax_hr_epi_mean, tmax_hr_epi_sd, cmp_tmax_hr_epi_mean, cmp_tmax_hr_epi_sd]
  text: >
    The paper does not define how 'the rate of shortening of Tmax per 100-beats/min increase in
    heart rate caused by epinephrine infusion' (129 ± 56%) was computed. The record's model takes,
    for each nonpaced dog of Table 2 (1, 2, 4, 5, 6, 8), the percent shortening relative to control
    Tmax divided by the heart-rate increase in hundreds of beats/min, and averages: 101 ± 49%.
    Shortening relative to the enhanced Tmax instead gives about 134 ± 68%. Neither reproduces
    129 ± 56; the per-dog data behind the printed value, or its definition, are not given.
  citation: {page: 7, quote: "heart rate caused by epinephrine infusion was 129 ± 56%", where: "text, Results"}
- id: q_en_not_runnable
  kind: unstated_model
  about: [elastance_normalized]
  text: >
    E(t) = Emax·EN(t/Tmax) cannot be run: the normalized curve EN(tN) is given only as the plotted
    means (± SD) of Fig. 5, with no formula or table. The four symbol series in Fig. 5 (control,
