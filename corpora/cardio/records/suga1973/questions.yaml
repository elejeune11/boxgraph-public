    small scanned figure, so they were not read.
  citation: {page: 6, quote: "Comparison of mean values of the magnitude of many", where: "Fig. 5"}
- id: q_pv_ratio_no_values
  kind: unstated_input
  about: [pv_ratio]
  text: >
    The definition E(t) = P(t)/[V(t) - Vd] is recorded but never run: the paper prints no paired
    values of pressure and volume, only traces (Figs. 2-4) and the resulting Emax values, which
    were computed by an analog divider from the recorded signals.
- id: q_audit_unrecorded_measurements
  kind: reading
  about: [tmax_hr_epi_mean, tmax_hr_epi_sd]
  text: >
    Audit (second reading): the record leaves out printed group results that have no per-dog values
    behind them: the paced heart-rate effects on p. 7 (Tmax shortening 45 ± 10% per 100 beats/min,
    restated as 45% in the abstract; [(dP/dt)/P]max increase 49 ± 25% per 100 beats/min) and the
    1 and 4 ug/kg/min epinephrine effects (Emax +69 ± 41%, Tmax -21 ± 9%; Emax +125 ± 58%, Tmax
    -43 ± 19%). They cannot be reproduced inside this paper, but they are measurements that a model in
    another paper may predict (e.g. a heart-rate dependence of Tmax), so recording them as measured
    data would make them available for validation. The 45% of the abstract and 45 ± 10% of the text
    agree as printed.
  citation: {page: 7, quote: "pacing was 4 5 ± 1 0 % ( S D ) under both the control", where: "text, Results"}
- id: q_fig5_symbols
  kind: reading
  about: [fig5_s1, fig5_s2, fig5_s3, fig5_s4, en_fig5_s1, en_fig5_s2, en_fig5_s3, en_fig5_s4, elastance_normalized]
  text: >
    Fig. 5 is now read with calibrated readings (63 of 64 plotted means with their SD bars). The four
    symbol series are drawn staggered by about 0.017 in t_N around each nominal t_N = 0, 0.1, ..., 1.5,
    in the same left-to-right order in every group, so the readings follow that order (fig5_s1 leftmost
    to fig5_s4 rightmost). In this bilevel scan the symbols themselves (solid circle, open circle, cross,
    triangle) cannot be told apart, so which series (control, epinephrine, five loads, three heart rates)
    each reading is remains open; the text lists them in that order, which may or may not be the plotting
    order. This resolves the reading problem stated in q_en_not_runnable (the curves can be told apart
    by position) but not the model: EN(tN) is still only plotted, as four sets of means rather than one
    stated curve, and the record's model would need it as a curve-valued input.
  citation: {page: 6, quote: "such a comparison. The solid circles and the open", where: "text, Fig. 5"}
