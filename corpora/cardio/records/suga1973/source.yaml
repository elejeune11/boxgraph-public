notes: >
  An experimental paper (nine canine left ventricles). Its quantitative core is the statistics in
  Tables 1 and 2, all of which follow from per-dog values printed in the same tables, so the record
  checks those: (1) the per-dog ratios alpha, beta, gamma of Table 2 from the per-dog means (27
  comparisons); (2) the mean and between-dog SD of every column that has a MEAN ± SD row (Vd, Emax,
  Tmax, [(dP/dt)/P]max in both states, alpha, beta, gamma), with the abstract's restatement of the
  Emax and Tmax means; each 'mean ± SD' is entered as two printed values, mean and SD, so the mean
  is judged at its own digits and not by the SD; whether SD divides by n - 1 or n is an added input
  with both alternatives; (3) the paired t-tests of Table 1 (load 1 vs loads 2-5), whose printed
  bounds ('> 0.5', '> 0.9') get no verdict, so the computed P values are discussed in a question;
  (4) the 129 ± 56% Tmax shortening per 100 beats/min under epinephrine (p. 7), made runnable from
  words over the six nonpaced dogs. Findings: the enhanced-state mean Tmax (157 msec, Table 2 and
  abstract) is not the mean of its column (146.4); several Table 1 P values are far below the
  printed bounds; some SDs and three per-dog ratios differ; the 129% figure is not reproduced under
  either natural definition. The definitions E(t) = P(t)/[V(t) - Vd] and E(t) = Emax EN(t/Tmax)
  are recorded as models; the first has no printed P-V values to run on, the second is not runnable
  (EN only plotted). Left out: Table 1 load-3 Emax (cut at the page gutter in this copy), aortic
  pressure and cardiac output columns of Table 1 and body weight, LV weight, preload and afterload
  ranges of Table 2 (they feed no computed result), the per-dog P values of Table 2 (they rest on
  beat counts the paper gives only as 'at least 50'), the 1 and 4 ug/kg/min results (69 ± 41%,
  21 ± 9%, 125 ± 58%, 43 ± 19%), the paced heart-rate results (45 ± 10%, 49 ± 25%) and 8 ± 3 msec,
  all of which have no per-dog values printed, and the methods' instrument specifications. Figures:
  2, 3 and 4 are single recorded traces and P-V loops (no values to read for a result); 6 is
  reproduced from another paper; 7 is a circuit diagram and step traces; 5 (the normalized E(t)
  curve) has four overlapping symbol series with overlapping SD bars at a scan resolution where they
  cannot be told apart, so it was not read (see q_en_not_runnable). Page images were low-resolution
  and rendering at higher dpi was not available in this session; table digits were checked against
  enlarged crops of the page images.
  Figure pass (2026-11-02): Fig. 5 was rendered from the PDF at 1200 dpi and read with calibrated code
  readings (fig5_s1 to fig5_s4, the four staggered symbol series by position, 63 of 64 means with SD
  bars; see figures.md and q_fig5_symbols). The other figures remain left out, for the reasons in
  figures.md.
