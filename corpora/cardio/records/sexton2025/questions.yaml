    operation times, cell areas, counts and viability, radial viable-cell profiles, and the PIV branch flow
    fraction of Fig. 5F): network_solution and the tree statistics are tied to the released human network file and
    take no other geometry, so none gives the flow split of the printed three-branch scaffold or any time or cell
    count. network_solution and olufsen_material_s26 share only the shape "pressure from a length and a pressure":
