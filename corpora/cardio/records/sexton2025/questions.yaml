  citation: {none: "a finding of the validation job sexton2025+svv_code, not a printed statement"}
  text: >
    Validation job sexton2025+svv_code (2026-11-09): no validation entered, in either direction. svv_code
    records released code and has no measured data (no datum of origin measured, no figure readings), so no
    model here can be validated against it. Its values are code constants and outputs of its own runs
    (predictions), which the existing relations and comparisons already set against this paper's equations
    (e.g. bifurcation_network against svv_code/resistance_update, same shape, both computing a reduced
    resistance). In the other direction, svv_code's models against this paper's build times, PIV flow
    fractions and cell measurements are considered and not entered for the reasons in
    svv_code/q_no_validation_vs_sexton2025 (timings measured on the paper's stated hardware, p. 36; no model
    gives a flow split or cell survival).
