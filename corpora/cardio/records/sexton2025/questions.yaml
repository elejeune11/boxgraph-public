    impedance spectra, flows or pressure waves of the human brachiocephalic or systemic arteries. (2)
    olufsen1999's models against the measurements here (build and operation times of the code, cell areas,
    counts and viability, the radial viable-cell profiles, and the PIV branch flow fractions of Fig. 5F):
    none of its models gives a quantity of these; its structured tree builds its own self-similar tree from a
