- id: q_fig5f_piv_sum
  kind: unexplained_difference
  about: [q_ratio_piv_fig5f, q_ratio_cfd_fig5f, q_ratio_cfd_mean_fig5f, cmp_fig5f_cfd_vs_piv]
  citation: {page: 6, quote: "Normalized flow rates (q/qin) from PIV", where: "Fig. 5F"}
  text: >
    Read from Fig. 5F, the three CFD branch ratios (about 0.26, 0.40, 0.31) add to about 0.97 and their
    average, the dashed line, is about 0.33: the three branches carry nearly all of the inlet flow in the CFD,
    and the averaged line is then near 1/3 whatever the split. The three PIV means (about 0.33, 0.16, 0.20)
    add to only about 0.70, so about 30% of the measured inlet flow is not found in the three branches. The
    paper reports no significant difference between the branches ("n.s."), but does not say where the rest
    of the flow went (measurement plane, profile assumption in converting PIV velocities to flows, or leaks).
