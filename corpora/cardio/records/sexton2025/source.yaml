notes: >
  Scope. The quantitative core of an article about software: the constrained constructive optimization (CCO)
  tree equations (Eqs. S1-S10, Table S1), the constants of Tables S1 and S3, the arithmetic the paper prints
  (kinematic viscosity, pixels per cell, the 230-fold acceleration), and the paper's released code,
  svVascularize (svv 0.0.57, record svv_code), run in the separate environment corpus/cardio/envs/sim on the
  paper's own constants. Trees are grown in a 1-cm cube with 1000 terminals (Fig. 2E's size) and 4000
  terminals (a size of Fig. S8), each with five seeds, since svv's growth does not repeat for a fixed seed
  (q_svv_nonrepeatable). Flow, pressures and cube size are unstated and taken from svv's defaults and
  Fig. S1, as added inputs with alternatives (q_tree_settings).

  Left out. The partial implicit volumes (Eqs. S11-S20), closed-loop connection (S21), the 3D/1D/0D/FSI
  and advection-diffusion formulations (S22-S48; no printed result follows from them without the authors'
  meshes and trees), the organ-scale trees of 10^4-10^6 terminals and their diameters, distances and build
  times (q_organ_scale, q_fig_s10_units), the timing tables S4-S6 (hardware-specific), the printing and
  viability measurements, and every figure (figures.md says why each one).

  What reproduces. Eq. S6 gives its stated identity; Table S3's nu from its mu and rho; both
  pixels-per-cell values; svv's default exponents and density match Table S1/S3, and svv's stored ratios
  satisfy the identity at every bifurcation.

  What does not. (1) Eq. S10 is printed with beta_k where Eqs. S1-S7 and the released code give beta_k^4;
  the printed form does not equal the Poiseuille network and does not give svv's root R* or root radius,
  the beta^4 variant does (q_s10_beta). (2) svv's stored radii, which it exports, are not the root radius
  times its own stored ratios for most vessels, so Eq. S5 fails at some bifurcations in both directions
  (cmp_tree*_radius_sum_*; q_svv_radii). (3) svv's default viscosity is below Table S1's and its nu rounds
  to 0.036, not 0.037 (q_svv_viscosity). (4) The main text's "nu = 0.04 cP" is a hundredth of the tables'
  viscosity (q_viscosity_main_text). (5) The 230-fold acceleration does not follow from the build times the
  paper sets side by side (q_speedup). Unit and cross-reference slips are in q_table_units.

  Against measured trees (validations.yaml; judged by the validation job). Synthetic trees grown with the
  paper's gamma = 3 are compared with schwarz2020's human large-vessel area growth (1.02) and symmetry
  (0.59), and with kassab1993's pig Horton ratios; a gamma = 2 tree (the paper's own lower bound) is kept
  beside them. With gamma = 3 the large-vessel area growth stays well above the human value, as Murray's
  cube law implies; with gamma = 2 it is near one. What each comparison can and cannot mean, and what was not
  entered (segment counts and lengths by diameter, pressure share), is in q_validation_schwarz and
  q_validation_kassab.

  Figure pass (2026-11-09). The figures left out above are now read where their values can be separated:
  45 calibrated readings (figures.yaml, code in figures/, one datum each) of Figs. 1G, 2B, 2C, 2F, 2H-I
  (lines), 5F, 5P(ii-iii), S2D-F, S4B, S8 (convex lines), S10, S11C (fits) and S15A(i); figures.md says
  what each panel is and why the rest are left out. Checks: Fig. 5P's bars against the printed values,
  Fig. 5F's CFD against its PIV, and Fig. 2B's dashed line against the caption's C α N^2 for full balanced
  trees, which rises some 13 times faster per depth than the line drawn (q_fig2b_scaling). Findings:
  Fig. 2F's top axis label (q_fig2f_axis_label), Fig. 5F's PIV fractions adding to 0.7 (q_fig5f_piv_sum),
  and Fig. S10's axes in cm (q_fig_s10_units_axis).
