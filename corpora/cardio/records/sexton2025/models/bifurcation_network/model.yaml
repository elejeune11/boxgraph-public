id: bifurcation_network
name: reduced resistance of a parent with two terminal daughters solved as a Poiseuille network (Eqs. S1-S4, S6, S7, S9)
role: model
stated: {page: 12, quote: "Combining (Eq. S1, S2, S4, S6", where: "text before Eq. S10"}
equation: "R_i = 8 mu l_i / (pi r_i^4) (S1); dP_i = R_i Q_i (S2); Q_parent = sum Q_i (S3); P_parent = P_i + R_i Q_i (S4); R*_p = R_total r_p^4 (S7)"
inputs:
  mu: {quantity: dynamic_viscosity, unit: cP}
  gamma: {quantity: murray_exponent, unit: dimensionless}
  l_p: {quantity: vessel_length, unit: cm}
  l_a: {quantity: vessel_length, unit: cm}
  l_b: {quantity: vessel_length, unit: cm}
  Q_a: {quantity: vessel_flow, unit: ml/s}
  Q_b: {quantity: vessel_flow, unit: ml/s}
outputs:
  Rstar_p: {quantity: reduced_resistance, unit: dyn*s/cm}
settings: {}
stochastic: false
