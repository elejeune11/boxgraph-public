id: reduced_resistance_s10
name: reduced resistance of a parent with two terminal daughters (Eq. S10 as printed, with Eqs. S6, S7, S9)
role: model
stated: {page: 12, quote: "general relationship for the reduced resistance of any vessel", where: "Eq. S10"}
equation: "R*_i = 8 mu L_i / pi + (sum_{k in C} beta_k / R*_k)^-1, for all i in T"
inputs:
  mu: {quantity: dynamic_viscosity, unit: cP}
  gamma: {quantity: murray_exponent, unit: dimensionless}
  l_p: {quantity: vessel_length, unit: cm}
  l_a: {quantity: vessel_length, unit: cm}
  l_b: {quantity: vessel_length, unit: cm}
  Q_a: {quantity: vessel_flow, unit: ml/s}
  Q_b: {quantity: vessel_flow, unit: ml/s}
outputs:
  Rstar_p: {quantity: reduced_resistance, unit: dyn*s/cm, description: "R* of the parent, R r_p^4 with R the resistance of parent and subtree"}
settings: {}
stochastic: false
