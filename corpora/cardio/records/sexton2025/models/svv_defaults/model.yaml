id: svv_defaults
name: the constants the released svVascularize grows a tree with by default (TreeParameters)
role: model
software: true
stated: {page: 67, quote: "Vascular Generation Symbols and Constants", where: "Table S1"}
equation: "a default svv TreeParameters(): murray_exponent, radius_exponent, length_exponent, kinematic_viscosity, fluid_density, terminal_flow, root and terminal pressure; mu = kinematic_viscosity * fluid_density"
inputs: {}
outputs:
  gamma: {quantity: murray_exponent, unit: dimensionless}
  alpha_r: {quantity: cost_radius_exponent, unit: dimensionless}
  alpha_l: {quantity: cost_length_exponent, unit: dimensionless}
  mu: {quantity: dynamic_viscosity, unit: cP, description: the viscosity svv puts in Eq. S1}
  nu: {quantity: kinematic_viscosity, unit: cm^2/s}
  rho: {quantity: fluid_density, unit: g/cm^3}
  Q_term: {quantity: terminal_flow, unit: ml/s}
  P_root: {quantity: tree_pressure, unit: mmHg}
  P_term: {quantity: tree_pressure, unit: mmHg}
settings: {}
stochastic: false
