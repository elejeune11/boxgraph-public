id: murray_beta
name: parent-daughter radius ratios at a bifurcation from the power law (Eq. S6) and their stated identity
role: model
stated: {page: 12, quote: "we note that", where: "Eq. S6"}
equation: "beta_i = r_i / r_p = (1 + sum_{j in C_i} (r_j / r_i)^gamma)^(-1/gamma), for all i in C; sum_{i in C} beta_i^gamma = 1"
inputs:
  gamma: {quantity: murray_exponent, unit: dimensionless}
  ratio: {quantity: daughter_radius_ratio, unit: dimensionless, description: "r_j / r_i, the other daughter's radius over this daughter's"}
outputs:
  beta_i: {quantity: bifurcation_ratio, unit: dimensionless}
  beta_j: {quantity: bifurcation_ratio, unit: dimensionless}
  beta_sum: {quantity: murray_sum, unit: dimensionless, description: "beta_i^gamma + beta_j^gamma"}
settings: {}
stochastic: false
