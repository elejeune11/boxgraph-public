notes: >
  The paper is analytical: it derives lumped flow-pressure models for a rigid vessel from the
  linearised axisymmetric Navier-Stokes (Womersley) equation by Laplace transform and residues,
  and compares the resulting dimensionless time-scales with the dimensionless cardiac period
  tau = T nu / (2 pi R^2). Its printed numbers are the blood properties (rho, mu, nu), the first
  three zeros of J0 (quoted from Abramowitz and Stegun), the first-order time-scales lambda_q,
  lambda_p (Eqs. 17-18), the second-order time-scales lambda_q1, lambda_q2, lambda_p1, lambda_p2
  (Eqs. 19-20) and their sums (p. 13), the heart rate used for tau, and the radius thresholds
  (about 0.2, 0.5 and 1.5 cm) read from the crossing of tau with the time-scales, including the
  claim that a sixth-order model is needed for lambda_q < tau at R = 1.5 cm.
  Recorded models: nu = mu/rho; the zeros of J0; the first-order time-scales; the second-order
  time-scales (pressure time-scales as the roots of the quadratic from the right-hand operator of
  Eq. 19, as the paper does numerically); the radius at which tau equals a given time-scale
  (the inverse of the printed tau formula, from the paper's reading of Fig. 2); and the order of
  model needed so that 1/beta_n^2 < tau at a given radius. All printed time-scales and the
  sixth-order claim reproduce from the printed inputs. The 0.2 cm threshold matches the
  lambda_q crossing (0.206 cm); the 0.5 cm threshold is printed as approximate and the largest
  time-scale it is said to make negligible (lambda_p1) crosses tau at about 0.44 cm (a question
  records this). The approximate values (lambda_q ~ 0.1729, lambda_p ~ 0.0075, thresholds) get
  no verdict by design.
  Left out: the lumped-element formulas (Eqs. 21-30, 34-36) and the windkessel step response
  (Eq. 31), which the paper never evaluates numerically; the factor 4/3 of Stergiopulos et al.
  versus 8 lambda_q (not a printed number of this paper's own); the series of K(s) in Appendix A
  (checked symbolically while reading: 1 + z/8 + z^2/48 + 11 z^3/3072 is correct; no numeric
  value to record); the 120 mmHg ventricular pressure (background). Fig. 2 (tau versus R) was
  not digitised: the figure-rendering commands were not available in this job, and its curve
  and lines are the printed formula and the printed Eq. 20 values. Figs. 1, 3, 5 are drawings;
  Fig. 4 is a sketch with unstated parameters (see figures.md).
  Figure pass (2026-11-03): Fig. 2 (the tau curve and the five time-scale lines) and Fig. 4 (both
  step-response curves) are now read with calibrated code readings and compared with the printed
  formulas; Fig. 4 does have numbered axes. Eq. 31 is modelled as printed (without p0) and with p0
  restored as a variant, p0 added from the curve before the step (see figures.md).
