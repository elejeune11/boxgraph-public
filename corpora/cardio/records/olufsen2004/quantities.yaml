- {id: blood_density, name: blood density, dimension: "[mass]/[length]**3", description: "mass density of blood, rho"}
- {id: blood_dynamic_viscosity, name: blood dynamic viscosity, dimension: "[mass]/[length]/[time]", description: "dynamic viscosity of blood, mu"}
- {id: blood_kinematic_viscosity, name: blood kinematic viscosity, dimension: "[length]**2/[time]", description: "kinematic viscosity of blood, nu = mu/rho"}
- {id: bessel_j0_zero, name: zero of the Bessel function J0, dimension: "dimensionless", description: "a positive root beta_n of J0(beta_n) = 0"}
- {id: dimensionless_time_scale, name: dimensionless model time-scale, dimension: "dimensionless", description: "a flow or pressure time-scale (lambda) of the lumped rigid-vessel model, in units of R^2/nu (the time scale of t* in Eq. 3)"}
- {id: heart_rate, name: heart rate, dimension: "1/[time]", description: "beats per unit time, HR = 1/T"}
- {id: vessel_radius, name: vessel radius, dimension: "[length]", description: "radius R of the rigid vessel"}
- {id: model_order, name: order of the lumped model, dimension: "dimensionless", description: "number of residues (terms of Eq. 14) kept in the lumped model"}
- {id: dimensionless_cardiac_period, name: dimensionless cardiac period, dimension: "dimensionless", description: "the cardiac time-scale T/(2 pi) in units of R^2/nu, tau = T nu/(2 pi R^2) (p. 68)"}
- {id: dimensionless_time, name: dimensionless time, dimension: "dimensionless", description: "time t* in units of R^2/nu (Eq. 3), the t axis of Fig. 4"}
- {id: dimensionless_flow, name: dimensionless flow, dimension: "dimensionless", description: "volume flow q in the dimensionless units of the lumped equations (Eqs. 15-18), the q axis of Fig. 4"}
- {id: dimensionless_pressure, name: dimensionless pressure, dimension: "dimensionless", description: "pressure drop p in the dimensionless units of the lumped equations; p0 is the step size before t = 0 (p. 74)"}
# relation job (Eq. 27 helper)
- {id: vessel_length, name: vessel length, dimension: "[length]", description: "length L of the rigid vessel (p. 71, where dp/dx = -p/L)"}
- {id: vessel_inductance, name: inductance of the lumped vessel circuit, dimension: "[mass]/[length]**4", description: "the inductor L1 of the resistor-inductor circuit of Fig. 3B (Eqs. 26-27)"}
# relation job (three-element windkessel helper, p. 73)
- {id: windkessel_resistance, name: resistance of a windkessel resistor, dimension: "[mass]/[length]**4/[time]", description: "pressure drop over flow of the resistor R1 or R2 of the three-element windkessel of Fig. 3D (p. 73)"}
- {id: windkessel_compliance, name: compliance of the windkessel capacitor, dimension: "[length]**4*[time]**2/[mass]", description: "the capacitor C1 of the three-element windkessel of Fig. 3D (p. 73)"}
- {id: frequency, name: frequency of a sinusoidal pressure and flow, dimension: "1/[time]"}
- {id: input_impedance_modulus, name: modulus of the input impedance at a frequency, dimension: "[mass]/[length]**4/[time]", description: "|p/q| of a sinusoidal pressure and flow"}
- {id: input_impedance_phase, name: phase angle of the input impedance at a frequency, dimension: "dimensionless", description: "phase of p/q, pressure leading flow positive"}
