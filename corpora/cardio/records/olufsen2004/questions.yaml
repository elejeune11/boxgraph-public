- id: q_eq13_operator_sign
  kind: possible_error
  about: [timescales_second_order]
  text: >
    On p. 70 the paper says that Eq. 13 involves an operator of the form (1 - lambda_n d/dt) with
    lambda_n = 1/beta_n^2, but Eq. 13, f_n' + beta_n^2 f_n = p', gives beta_n^2 (1 + lambda_n d/dt)
    f_n; elsewhere (p. 70) the factors are written (1 + lambda d/dt). No printed number depends on it.
  citation: {page: 10, quote: "involves a single operator of the form", where: text}
- id: q_fig3_caption
  kind: reading
  about: []
  text: >
    The Fig. 3 caption (p. 72) labels A-D differently from the panels and the text: the caption calls
    A "a resistor and an inductor", B "two resistors and an inductor", C the three-element windkessel
    and D the four-element windkessel, while the panels and text have A a resistor, B a resistor and
    inductor, C two resistors and an inductor, D the three-element and E the four-element windkessel.
    The record follows the text. No printed number depends on it.
  citation: {page: 12, quote: "Lumped models: A: A resistor and an inductor", where: "Fig. 3 caption"}
- id: q_appendix_series_sign
  kind: possible_error
  about: []
  text: >
    In Appendix A (p. 78) the third line of the small-s expansion of K(s) is printed as
    (pi/s)(s/8 + s^2/48 - 11 s^3/3072 + O(s^4)). Substituting (i sqrt(s))^2 = -s into the line above,
    1 - [1 + (i sqrt s)^2/8 + (i sqrt s)^4/48 + 11 (i sqrt s)^6/3072], gives s/8 - s^2/48 + 11 s^3/3072;
    the printed fourth line, pi/8 - pi s/48 + 11 pi s^2/3072, agrees with that and not with the third
    line. The signs of the s^2 and s^3 terms in the third line look misprinted. Only the residue pi/8
    is used later, so no printed number depends on it.
  citation: {page: 18, quote: "pole at s = 0 can be found to be π/8 by series expansion", where: "Appendix A"}
- id: q_stergiopulos_factor
  kind: reading
  about: []
  text: >
    On p. 71 the paper says Stergiopulos et al. [29] "have a factor 4/3 instead of 8 lambda_q, which
    is slightly higher". With lambda_q = 0.1729, 8 lambda_q is about 1.383, higher than 4/3 (1.333),
    so "which" must mean 8 lambda_q; read the other way the claim would be wrong. The record does not
    compare it (the first reader left it out as not a number of this paper's own); a later reading
    could add 4/3 from ref-29 and compare it with 8 lambda_q as an approximation.
  citation: {page: 11, quote: "they have a factor 4/3 instead of 8λq, which is slightly higher", where: text}
- id: q_eq31_missing_p0
  kind: possible_error
  about: [step_response_eq31, step_response_eq31_p0, cmp_fig4_eq31]
  text: >
    Eq. 31 is printed as q = alpha (1 - lambda_p/lambda_q) e^(-t/lambda_q), without the step size p0.
    The integral above it, with p = p0 for t <= 0, gives a factor p0, and the text below it says the flow
    jumps to pi p0 (1 - lambda_p/lambda_q)/8. Fig. 4 starts its decay near 9, not near pi/8 (1 - lambda_p/lambda_q)
    of about 0.38. The record keeps the printed form and adds a variant with p0.
  citation: {page: 14, quote: "The above equation for q for t > 0 reduces to", where: Eq. 31}
- id: q_fig4_parameters
  kind: unstated_input
  about: [p0_fig4, q_windkessel_fig4, q_rigid_after_fig4]
  text: >
    The paper does not state the parameters of Fig. 4: the step size p0, and for the windkessel curve
    alpha, lambda_q and lambda_p. The record takes p0 from the flat part of the rigid-vessel curve
    (q = pi p0/8 = 9.43, so p0 = 24) and assumes the rigid-vessel curve uses the printed first-order
    lambda_q and lambda_p (Eq. 18); the windkessel curve is recorded but not run.
- id: q_fig4_caption_dotted
  kind: reading
  about: [q_windkessel_fig4]
  text: >
    The Fig. 4 caption and the text (p. 74) call the windkessel curve dotted; it is drawn dashed. The
