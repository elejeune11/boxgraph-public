  citation: {page: 14, quote: "The dotted curve is for the windkessel model"}
# ---- cross-validation with stergiopulos1999 (ref. 29), 2026-11-03 ----
- id: q_val_stergiopulos_resistance_map
  kind: choice
  about: [windkessel3_p73]
  text: >
    The windkessel helper names both resistors of Fig. 3D by one quantity (windkessel_resistance), so
    stergiopulos1999's characteristic impedance Z_c and peripheral resistance R_p both map to it, Z_c to
    R1 (proximal, in series) and R_p to R2 (parallel to C1). The assignment follows the circuit (the
    paper's R1 R2 C1/(R1 + R2) and R2 C1 coefficients on p. 73 and stergiopulos1999 Fig. 1); swapping R1
    and R2 would give a different impedance and is not entered.
  citation: {page: 13, quote: "the three-element windkessel model of Fig. 3D"}
- id: q_val_stergiopulos_zc_from_same_impedance
  kind: choice
  about: [windkessel3_p73]
  text: >
    (Validations val_wk3_std_d71_mod/ph_vs_stergiopulos.) The standard ("actual") Z_c of dog 71 is, by stergiopulos1999 p. 2, the average modulus of the same
    measured input impedance between the 3rd and 10th harmonics, and R_p is mean pressure over mean flow,
    its 0 Hz value. The three-element windkessel tends to Z_c at high frequency, so its modulus at the
    3rd-5th plotted harmonics is partly set by the measurement it is compared with. Only C_PPM (pulse
    pressure method) and the first two harmonics are independent of it. These are entered as validations,
    as stergiopulos1999 enters its own comparisons of Fig. 5 (cmp_fig5_*_vs_measured), because no
    parameter was adjusted to make the model fit the impedance. C_AR (0.239 ml/mmHg) is the alternative
    standard C; Fig. 5 uses C_PPM (stergiopulos1999 q_fig5_standard_values), so only C_PPM is entered.
- id: q_val_stergiopulos_same_beat
  kind: choice
  about: [windkessel3_p73]
  text: >
    (Validations val_wk3_fit_d71_mod/ph_vs_stergiopulos.) stergiopulos1999 does not say that the impedance of Fig. 5 is computed from the same beat(s) to which
    the Table 1 windkessels were fitted; both are dog 71's ascending aortic pressure and flow. If they are
    the same, the time-domain fit (pressure from flow) is a fit of this impedance weighted by the flow
    harmonics, so the comparison is fit quality; if they were different beats it would be a weak test.
    Entered as fit_quality.
- id: q_val_stergiopulos_not_used
  kind: choice
  about: [inductance_eq27, step_response_eq31, step_response_eq31_p0, timescales_first_order, timescales_second_order, tau_vs_radius]
  text: >
    Of stergiopulos1999's measurements only the dog 71 input impedance (Fig. 5) is predicted by a model
    here. Not used: (1) the total arterial inertance L (Tables 1-3): Eq. 27 gives the inductance of one
    rigid vessel from its length and radius; the dog and human L are windkessel fits, not measurements,
    and the distributed model's summed L comes with no segment geometry, and p. 71 compares Eq. 27 with
    stergiopulos1999's Eq. 1 only through the factor 4/3 versus 8 lambda_q (relations.yaml). (2) The
    measured R_p, Z_c, C, heart rate and body mass of Tables 1-2 and their Fig. 2 means: no model here
    produces them. (3) The measured flow and pressure waves of Figs. 1 and 4: no model here drives a
    windkessel or rigid vessel with a flow wave, and Eq. 31 gives a dimensionless step response with
    unstated parameters. (4) The human beats (Table 2): no measured impedance of those beats is printed
    in stergiopulos1999. The four-element windkessel this paper names (Fig. 3E, p. 75) is not a model of
    the record, so stergiopulos1999's L = 0.019 cannot enter a model here.
- id: q_no_validation_vs_westerhof1969
  kind: choice
  about: [inductance_eq27, windkessel3_p73, timescales_first_order, timescales_second_order, tau_vs_radius, step_response_eq31, step_response_eq31_p0]
  text: >
    (Cross-validation with westerhof1969, ref. 34.) No model of this record is validated against a
    measurement of westerhof1969. This paper cites ref. 34 only among the lumped and distributed models
    'often used to represent blood flow and pressure in the arterial system' (p. 1); it does not say that
    any of its models explains or predicts that paper's data. westerhof1969's measurements are the pressure
    decay times measured on the analog (0.8, 0.4, 1.66 and about 0.5 s), the 'about 50 per cent' rises of
    input impedance level and wave velocity when all capacitors are halved, and the apparent wave velocities
    measured in man by Luchsinger et al. and Gabe et al. (Fig. 7). No model here produces these quantities:
    the rigid-vessel models give dimensionless time-scales, a step response and a vessel inductance, with no
    wave propagation; the three-element windkessel helper gives an input impedance modulus and phase, not a
    decay time or a relative change of an averaged level. Eq. 27 and westerhof1969's segment inertance share
    a form, but the Table 1 inertances are design values computed from printed geometry, not measurements
    (their agreement is a relation between models, not a validation). The analog's impedance curves (Figs.
    3e, 6, 10a) are recorded there as model predictions, not measurements. westerhof1969 has no model to
    judge against this record, which measures nothing.
# ---- cross-validation with westerhof1971 (ref. 35), 2026-11-03 ----
- id: q_val_westerhof1971_choices
  kind: choice
  about: [windkessel3_p73]
  text: >
    (Validations val_wk3_*_vs_westerhof1971.) The three-element windkessel helper is run with westerhof1971's
    Table 1 values for the dog systemic and pulmonary and the cat systemic and pulmonary beds (R_c to R1,
    R_p to R2, C to C1, as in q_val_stergiopulos_resistance_map; both westerhof1971 resistances are one
    quantity there, resistor_resistance, mapped to windkessel_resistance). Measurements used: the
    measured hydraulic-model impedances (Figs. 2-3 lines, Figs. 4-5 crosses) and the pooled in vivo dog
    impedances (Figs. 2-3 dots). Not used: (1) the circles of Figs. 4-5, measured after an adapter was
    added whose inertia 'plays a major role' (westerhof1971 p. 5); neither paper gives the adapter's
    inertance and the windkessel has no element for it, so the model cannot be run on that condition.
    (2) The d-c resistances of the four built models (Fig. 2-5 captions): the windkessel's modulus at
    0 Hz is R1 + R2, but the record has no frequency datum at 0 Hz and westerhof1971's own Eq. 1a model
    (rdc_eq1a) already compares them; adding a 0 Hz input would add nothing new. (3) The theoretical lines
    of Figs. 4-5 are predictions of westerhof1971's own model, not measurements. (4) Table 1 values are
    estimates or design values, not measurements, and the Fig. 6 pressure and flow traces have no scale
    the windkessel could be run against. Above a few hertz the measured hydraulic models show the inertance
    of their tubes (westerhof1971 q_hydraulic_inertance), which the three-element windkessel cannot follow,
    so not-reproduced verdicts there are expected. No model of westerhof1971 can be judged against this
    record, which measures nothing.
  citation: {page: 13, quote: "the three-element windkessel model of Fig. 3D"}
# ---- cross-validation with stergiopulos1992 (ref. 27), 2026-11-03 ----
- id: q_no_validation_vs_stergiopulos1992
  kind: choice
  about: [windkessel3_p73, inductance_eq27, step_response_eq31, step_response_eq31_p0, timescales_first_order, timescales_second_order, tau_vs_radius]
  text: >
    (Cross-validation with stergiopulos1992, ref. 27.) No model of this record is validated against a
    measurement of stergiopulos1992. This paper cites ref. 27 among one-dimensional network models (pp. 2-3)
    and for using 'the windkessel model as a boundary condition at the outflow for the large vessels'
    (p. 78); it does not say that any of its models explains or predicts that paper's data.
    stergiopulos1992's measurements are the pulsatility indices of Gosling et al. at the aortic
    bifurcation, groin, knee and ankle of a patient with a femoral stenosis (Fig. 7), and the segmental
    systolic pressure indices (thigh, knee, ankle over brachial) of Fronek et al. for normal subjects and two
    patient groups (p. 9). Both are site-to-site ratios of pressure or velocity waveforms in a branching
    network with stenoses; no model here produces them: the rigid single-vessel models give dimensionless
    time-scales, a step response and a vessel inductance, and the three-element windkessel helper gives an
    input impedance modulus and phase, with no network, no wave propagation and no stenosis. The windkessel
    helper and stergiopulos1992's terminal impedance (Eq. 7) share a form, but that paper measures no
    impedance (its Table 2 resistances and compliances are model parameters), so their agreement would be a
    relation between models, not a validation. No model of stergiopulos1992 can be judged against this
    record, which measures nothing.
  citation: {page: 18, quote: "use the windkessel model as a boundary condition at the outflow"}
# ---- cross-validation with olufsen2000 (ref. 20), 2026-11-04 ----
- id: q_no_validation_vs_olufsen2000
  kind: choice
  about: [windkessel3_p73, inductance_eq27, step_response_eq31, step_response_eq31_p0, timescales_first_order, timescales_second_order, tau_vs_radius, tau_crossing_radius, order_needed, kinematic_viscosity]
  text: >
