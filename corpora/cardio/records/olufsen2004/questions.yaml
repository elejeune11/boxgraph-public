    measure; none is driven by a measured flow wave to give a pressure or a flow, and neither paper gives
    windkessel elements for olufsen2000's subject. nu = mu/rho run on olufsen2000's values would meet a
    reported, not a measured, nu. olufsen2000's own models cannot be judged against this record, which
    measures nothing.
  citation: {page: 2, quote: "all of the large systemic arteries [19, 20]"}
