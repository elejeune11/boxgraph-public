- id: q_threshold_05
  kind: unexplained_difference
  about: [R_threshold_first_order_printed, cmp_R_first_order, lambda_p1_printed]
  text: >
    The paper says that for 0.2 < R < 0.5 cm the time-scales lambda_q2, lambda_p1 and lambda_p2
    can be neglected against tau (p. 69), and gives 0.5 cm as an approximate bound (pp. 63, 68).
    With the printed nu = 0.046 cm^2/s and HR = 60 beats/min, tau = T nu/(2 pi R^2) equals
    lambda_p1 = 0.0378 at R of about 0.44 cm and lambda_q2 = 0.0328 at about 0.47 cm, so between
    about 0.44 and 0.5 cm tau is smaller than lambda_p1 (Fig. 2 shows the same crossing). Whether
    "approximately 0.5" is meant to cover this is not said.
  citation: {page: 9, quote: "For vessels with a radius 0.2 < R < 0.5 cm, the time-scales", where: text}
- id: q_threshold_choice
  kind: choice
  about: [run_R_quasisteady, run_R_first_order]
  text: >
    The paper reads its radius thresholds off Fig. 2 without saying which time-scale crossing sets
    each one. The record takes the largest time-scale named in each statement (lambda_q for 0.2 cm,
    lambda_p1 for 0.5 cm).
- id: q_fig2_not_read
  kind: reading
  about: [tau_crossing_radius]
  text: >
    Fig. 2 (tau versus R with the six time-scales) was not digitised in this reading, because the
    figure-rendering commands were not available. Its curve is the printed formula
    tau = T nu/(2 pi R^2) and its lines are the printed Eq. 20 and Eq. 18 values; a later reading
