id: tau_vs_radius
name: dimensionless cardiac period as a function of vessel radius (p. 68, Fig. 2)
stated: {page: 8, quote: "the dimensionless period of a cardiac cycle can be written as", where: "tau = T nu/(2 pi R^2)"}
equation: "tau = T nu / (2 pi R^2), T = 1/HR"
inputs:
  nu: {quantity: blood_kinematic_viscosity, unit: cm^2/s}
  HR: {quantity: heart_rate, unit: 1/s}
  R: {quantity: vessel_radius, unit: cm}
outputs:
  tau: {quantity: dimensionless_cardiac_period, unit: dimensionless}
settings: {}
stochastic: false
