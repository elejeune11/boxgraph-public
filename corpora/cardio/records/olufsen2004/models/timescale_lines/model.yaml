id: timescale_lines
name: the first- and second-order time-scales drawn as horizontal lines against R (Fig. 2)
stated: {page: 8, quote: "The horizontal lines show the flow time-", where: "Fig. 2 caption"}
equation: >
  lambda(R) = lambda for every R: lambda_q = lambda_q1 = 1/beta_1^2, lambda_p = (1 - 32/beta_1^4)/beta_1^2
  (Eq. 18), lambda_q2 = 1/beta_2^2, lambda_p1, lambda_p2 the roots of the right-hand operator of Eq. 19
  (Eq. 20)
from_words: true
built_from: [timescales_first_order, timescales_second_order]
inputs:
  beta1: {quantity: bessel_j0_zero, unit: dimensionless}
  beta2: {quantity: bessel_j0_zero, unit: dimensionless}
  R: {quantity: vessel_radius, unit: cm}
outputs:
  lambda_q1: {quantity: dimensionless_time_scale, unit: dimensionless}
  lambda_q2: {quantity: dimensionless_time_scale, unit: dimensionless}
  lambda_p: {quantity: dimensionless_time_scale, unit: dimensionless}
  lambda_p1: {quantity: dimensionless_time_scale, unit: dimensionless}
  lambda_p2: {quantity: dimensionless_time_scale, unit: dimensionless}
settings: {}
stochastic: false
