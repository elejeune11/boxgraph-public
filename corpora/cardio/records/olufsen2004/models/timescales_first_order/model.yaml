id: timescales_first_order
name: relaxation and retardation time-scales of the first-order rigid-vessel model (Eqs. 17-18)
stated: {page: 7, quote: "Equation (17) can be written in the form", where: "Eqs. 17-18"}
equation: "lambda_q = 1/beta_1^2; lambda_p = A/beta_1^2 = A lambda_q; A = 1 - 32/beta_1^4"
inputs:
  beta1: {quantity: bessel_j0_zero, unit: dimensionless}
outputs:
  lambda_q: {quantity: dimensionless_time_scale, unit: dimensionless}
  lambda_p: {quantity: dimensionless_time_scale, unit: dimensionless}
settings: {}
stochastic: false
