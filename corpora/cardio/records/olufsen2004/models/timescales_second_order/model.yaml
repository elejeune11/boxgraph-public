id: timescales_second_order
name: flow and pressure time-scales of the second-order rigid-vessel model (Eqs. 19-20, 24)
stated: {page: 7, quote: "The time-scales for the second-order model can be found by solving", where: "Eqs. 19-20"}
equation: >
  (1/(b1^2 b2^2)) q'' + (1/b1^2 + 1/b2^2) q' + q = (pi/8){(1/(b1^2 b2^2))[1 - 32(1/b1^4 + 1/b2^4)] p''
  + [(1/b1^2 + 1/b2^2) - 32(1/b1^6 + 1/b2^6)] p' + p}; lambda_q1 = 1/b1^2, lambda_q2 = 1/b2^2;
  lambda_p1, lambda_p2 from the characteristic polynomial of the right-hand operator, written as
  lambda_p1 lambda_p2 p'' + (lambda_p1 + lambda_p2) p' + p (Eq. 24); lambda_q = lambda_q1 + lambda_q2,
  lambda_p = lambda_p1 + lambda_p2 (p. 73)
inputs:
  beta1: {quantity: bessel_j0_zero, unit: dimensionless}
  beta2: {quantity: bessel_j0_zero, unit: dimensionless}
outputs:
  lambda_q1: {quantity: dimensionless_time_scale, unit: dimensionless}
  lambda_q2: {quantity: dimensionless_time_scale, unit: dimensionless}
  lambda_p1: {quantity: dimensionless_time_scale, unit: dimensionless}
  lambda_p2: {quantity: dimensionless_time_scale, unit: dimensionless}
  lambda_q_sum: {quantity: dimensionless_time_scale, unit: dimensionless}
  lambda_p_sum: {quantity: dimensionless_time_scale, unit: dimensionless}
settings: {}
stochastic: false
