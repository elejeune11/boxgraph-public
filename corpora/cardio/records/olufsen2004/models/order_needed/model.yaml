id: order_needed
name: number of residues needed for the smallest flow time-scale to fall below tau
stated: {page: 9, quote: "Solely based on the time-scales λq, a sixth-order", where: text}
equation: "smallest n with lambda_qn = 1/beta_n^2 < tau = T nu/(2 pi R^2), T = 1/HR, J0(beta_n) = 0"
from_words: true
inputs:
  nu: {quantity: blood_kinematic_viscosity, unit: cm^2/s}
  HR: {quantity: heart_rate, unit: 1/s}
  R: {quantity: vessel_radius, unit: cm}
outputs:
  n: {quantity: model_order, unit: dimensionless}
settings: {n_max: 100}
stochastic: false
