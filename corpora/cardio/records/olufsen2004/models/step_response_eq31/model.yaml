id: step_response_eq31
name: flow after a pressure step in the first-order rigid-vessel model, as printed (Eq. 31)
stated: {page: 14, quote: "The above equation for q for t > 0 reduces to", where: Eq. 31}
equation: "q = alpha (1 - lambda_p/lambda_q) e^(-t/lambda_q), t > 0; alpha = pi/8 (the factor of the rigid-vessel Eq. 18, which p. 74 writes as alpha), lambda_q = 1/beta_1^2, lambda_p = A lambda_q (Eq. 18)"
inputs:
  beta1: {quantity: bessel_j0_zero, unit: dimensionless}
  t: {quantity: dimensionless_time, unit: dimensionless}
outputs:
  q: {quantity: dimensionless_flow, unit: dimensionless}
settings: {}
stochastic: false
built_from: [timescales_first_order]
