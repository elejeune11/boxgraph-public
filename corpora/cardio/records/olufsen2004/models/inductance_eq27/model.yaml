id: inductance_eq27
name: inductance of the resistor-inductor circuit for a rigid vessel (Eq. 27)
role: model
stated: {page: 11, printed_page: "71", quote: "and the resistance R1 as functions of the vessel and fluid properties", where: "Eq. 27"}
equation: "L1 = 8 lambda_q rho L / (pi R^2)"
inputs:
  lambda_q: {quantity: dimensionless_time_scale, unit: dimensionless}
  rho: {quantity: blood_density, unit: g/cm^3}
  Lv: {quantity: vessel_length, unit: cm}
  R: {quantity: vessel_radius, unit: cm}
outputs:
  L1: {quantity: vessel_inductance, unit: g/cm^4}
settings: {}
stochastic: false
# Helper model added by the relation job: the paper states its relation to Stergiopulos et al. [29] through
# this equation ("a factor 4/3 instead of 8 lambda_q"), which the reader did not model. L is the vessel length
