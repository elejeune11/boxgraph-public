id: tau_crossing_radius
name: vessel radius at which the dimensionless cardiac period equals a model time-scale
stated: {page: 8, quote: "the dimensionless period of a cardiac cycle can be written as", where: "tau = T nu/(2 pi R^2), Fig. 2"}
equation: "tau = T nu / (2 pi R^2), T = 1/HR; R* such that tau(R*) = lambda, i.e. R* = sqrt(nu/(2 pi HR lambda))"
from_words: true
inputs:
  nu: {quantity: blood_kinematic_viscosity, unit: cm^2/s}
  HR: {quantity: heart_rate, unit: 1/s}
  lam: {quantity: dimensionless_time_scale, unit: dimensionless}
outputs:
  R: {quantity: vessel_radius, unit: cm}
settings: {}
stochastic: false
