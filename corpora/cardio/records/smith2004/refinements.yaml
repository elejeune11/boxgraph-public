- {id: ref_closed_dt, run: run_closed_normal, setting: dt, factors: [1, 2, 4], mode: divide, output: Pao_sys,
   tolerance: "0.5%", tolerance_basis: "added: below the printed precision of the pressures it is compared with (1 mmHg in 120)", tolerance_added: true}
- {id: ref_closed_beats, run: run_closed_normal, setting: n_beats, factors: [1, 2, 4], mode: multiply, output: SV_lv,
   tolerance: "0.5%", tolerance_basis: "added: the paper's results are at a periodic steady state; 0.5% is below the printed precision of SV (1 ml in 70)", tolerance_added: true}
- {id: ref_pth0_dt, run: run_closed_pth0, setting: dt, factors: [1, 2, 4], mode: divide, output: CO,
   tolerance: "0.5%", tolerance_basis: "added: well below the printed precision of the 9% decrease built on it", tolerance_added: true}
- {id: ref_two_chamber_dt, run: run_two_chamber, setting: dt, factors: [1, 2, 4], mode: divide, output: Vspt_swing,
   tolerance: "1%", tolerance_basis: "added: below the printed precision of the 3 ml swing", tolerance_added: true}
- {id: ref_two_chamber_beats, run: run_two_chamber, setting: n_beats, factors: [1, 2, 4], mode: multiply, output: Vspt_swing,
   tolerance: "1%", tolerance_basis: "added: periodic steady state, below the printed precision of the 3 ml swing", tolerance_added: true}
