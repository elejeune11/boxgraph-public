- id: q_baseline_fig7_vs_fig8_9
  kind: unexplained_difference
  about: [run_closed_normal, sv_fig7_label, pao_sys_base_printed, pao_dia_base_printed, co_decrease_printed]
  text: >-
    (Audit, by eye on the page images.) The baseline closed-loop state does not look the same in
    Fig. 7 as in Figs. 8 and 9. In Fig. 7 (p. 8) V_lv runs from about 45 to 117 ml and P_lv peaks
    near 125 mmHg. The P_th = -4 mmHg loop of Fig. 8 and the R_sys loop of Fig. 9 (p. 8) reach about
    130-140 ml and peak near 135 mmHg. The record uses one baseline run (run_closed_normal) for the
    Fig. 7 label, for the 120/80 mmHg of the abstract and for the reference of the 9% decrease. If the
    paper's tests started from a different parameter set than Fig. 7, those comparisons do not share
    a baseline. The figure-reading job should confirm or rule this out.
  citation: {page: 8, printed_page: "137", quote: "Change in stroke volume and PV diagram for a change in", where: "Figs. 7, 8, 9"}
- id: q_vein_resistances
  kind: unstated_model
  about: [closed_loop]
  text: >-
    (Audit.) Sec. 2.3 names resistances of "the systemic and pulmonary veins (Rpu and Rvc)", but
    neither Fig. 1 nor any equation contains them, and no value is given. The record's model follows
    Fig. 1 (no R_pu or R_vc: the vein chambers connect straight to the mitral and tricuspid valves).
    The paper does not say whether the simulations had these resistances.
  citation: {page: 6, printed_page: "135", quote: "monary veins (Rpu and Rvc) because changes in blood", where: text}
- id: q_eq19_inlet_inertia
  kind: reading
  about: [closed_loop, two_chamber, q_inlet_inertia]
  text: >-
    (Audit.) Eq. 19 (p. 6) gives the single chamber with inertia on both the inflow and the outflow
    ("both inflow and outflow rates become state variables"). This is more evidence for the
    question q_inlet_inertia: the inertial models in the paper may also have had inertia at the
    inlet (mitral and tricuspid) valves, as the CellML encoding does, while Fig. 1 and the record's
    models put it only at the outlet valves.
  citation: {page: 6, printed_page: "135", quote: "and outﬂow rates become state variables", where: "Eq. 19"}

# --- figure readings (figure job, 2026-11-03) ---
- id: q_fig3_checked
  kind: reading
  about: [fig3_driver, e_fig3, q_fig3_unchecked]
  text: >-
    (Figure job.) The Fig. 3 reading was run with `boxgraph figure check` at its 1200 dpi crop and the
    overlay inspected: every mark sits on the blue curve, and the calibration finds the frame and all
    5 x and 9 y gridlines (misfit 0.0002 s, 0.0011). This settles q_fig3_unchecked: the reading stands.
- id: q_fig3_driver_width
  kind: possible_error
  about: [B_driver, e_fig3, fig3_driver, driver_eq5]
  text: >-
    (Figure job.) The curve of Fig. 3 is narrower than Eq. 5 with the printed A = 1, B = 80, C = 0.27.
    The calibrated reading gives e(0.2 s) = 0.618 [0.591, 0.645] and e(0.35 s) = 0.526 [0.499, 0.553],
    where Eq. 5 with B = 80 gives about 0.68 and 0.60; solving e = exp(-B (t - 0.27)^2) for B at the read
    points away from the peak gives about 100 s^-2 at each of them. Either the printed B = 80 is not the
    value the figure was drawn with, or the figure is not Eq. 5 with these constants. The printed value
    is kept; the comparison cmp_driver_fig3 tests it.
  citation: {page: 4, printed_page: "133", quote: "A¼ 1, B¼ 80, C¼ 0:27 and N¼ 1", where: "Fig. 3, Eq. 5"}
