- id: q_fig7_time_origin
  kind: choice
  about: [closed_loop_trace, two_chamber_trace, run_fig7_trace, run_fig7_trace_b, run_fig6_trace]
  text: >-
    (Figure job.) Figs. 6 and 7 do not say where their time axes start. The trace models read the last
    simulated beat at t modulo the period, with t = 0 at the start of a beat of the driver e(t) (peak at
    C). Fig. 7 repeats with a period of 0.75 s (its curves at t and t + 0.75 s read the same), as the
    printed 80 beats/min requires, and ejection starts near 0.25 s, about where the driver with
    C = 0.375 s (C_closed_added) would start it; with C = 0.27 s the beat is shifted, and any other time
    origin shifts the whole curve. A curve comparison that fails mainly by a shift says this, not that
    the model is wrong.
- id: q_fig11_septum
  kind: choice
  about: [ees_septum_added, closed_loop_loops, run_fig11_loops, q_contractility]
  text: >-
    (Figure job.) To run Fig. 11 the record scales E_es of both free walls by 0.5, 1 and 2, and not the
    septum's (ees_septum_added = 0, alternative 1). Fig. 11 changes both ventricles' loops, so at least
    both free walls are scaled; the paper does not say whether the septum is.
- id: q_no_cross_validation_smith_cellml
  kind: choice
  about: [closed_loop, sv_typical, pao_sys_typical, ppu_typical]
  text: >-
    (Cross-validation job, smith2004 + smith_cellml.) No validation of this record's models against
    smith_cellml, nor of smith_cellml's models against this record, is added. Neither record holds
    a measurement: smith_cellml is the CellML code of this paper's model and prints only parameters
    and initial values; this paper's figures (Figs. 3, 5-11) are all simulation output, and its
    target values (sv_typical, pao_*_typical, ppa_*_typical, pvc_typical, ppu_typical) are reported
    from ref. 8 and 'standard medical references', not measured here. Those targets are already
    validation comparisons in both records (val_*_typical here; val_cyc_*_typical in smith_cellml,
    through copies of these data). The 'clinical data' the paper cites for the 9% decrease and the
    2 x R_sys pressures (p. 8) print no values. The code's agreement with this paper's predicted
    results is reproduction, recorded in smith_cellml's comparisons, not validation.
- id: q_no_validation_stergiopulos1999
  kind: choice
  about: [closed_loop, closed_loop_trace, closed_loop_loops, two_chamber, two_chamber_trace]
  text: >-
    (Cross-validation job, smith2004 + stergiopulos1999.) No validation is added in either direction.
    The paper's ref. 27 is Stergiopulos, Segers & Westerhof 1999, 'Use of pulse pressure method for
    estimating total arterial compliance in vivo' (Am J Physiol 276: H424-8), not the record
    stergiopulos1999 ('Total arterial inertance as the fourth element of the windkessel model', H81-H88);
    it is cited once, among works modelling 'only certain areas of CVS function', and nothing is compared
    with it. This record holds no measurement (see q_no_cross_validation_smith_cellml), so stergiopulos1999's
    windkessels have nothing here to predict. stergiopulos1999 measures, per dog and human beat, R_p, Z_c,
    C (Tables 1-2), aortic flow and pressure waves (Figs. 1, 4) and the input impedance of dog 71 (Fig. 5).
    This record's closed-loop models generate aortic pressure from a whole human heart-and-circulation
    parameter set (taken from CellML) with no characteristic impedance or compliance port, and the paper
    states no parameters for those dogs or beats (no ventricular elastances, volumes, or venous side), so
    running them 'on the measurement's own conditions' would rest almost wholly on added inputs; and no
    model here outputs Z_c, C, or an input impedance. Neither paper says one model explains the other's data.
  citation: {page: 3, printed_page: "132", quote: "lating only certain areas of CVS function", where: text}
- id: q_no_validation_pries2005
  kind: choice
  about: [closed_loop, closed_loop_trace, closed_loop_loops, two_chamber, two_chamber_trace, scale_resistance]
  text: >-
    (Cross-validation job, smith2004 + pries2005.) No validation is added in either direction. pries2005
    cites 'Long, Smith, Pries, Ley & Damiano 2004' (its ref. 18, microviscometry), a different paper; it
    does not cite this one, and neither paper says one model explains the other's data. pries2005's only
    measurement is the distribution of microvessel diameters in rat mesenteric networks (Fig. 2); no model
    here outputs a vessel diameter, a blood viscosity or an endothelial-layer thickness. The paper names
    Poiseuille's law for resistance (Eq. 6), but its resistances are lumped values (from CellML), not
    computed from a diameter and viscosity, so pries2005's viscosity law has no port here to feed. This
    record holds no measurement (see q_no_cross_validation_smith_cellml), so pries2005's models have nothing
    here to predict.
  citation: {page: 7, quote: "using Poiseuille's equation as given in Eq. (6)", where: text}
- id: q_no_validation_vs_kim2010
  kind: choice
  about: [closed_loop, closed_loop_trace, closed_loop_loops, two_chamber, two_chamber_trace]
  text: >-
    (Cross-validation job, smith2004 + kim2010, 2026-11-06.) No validation is added in either direction;
    neither paper cites the other or says one's model explains the other's data. kim2010's only
