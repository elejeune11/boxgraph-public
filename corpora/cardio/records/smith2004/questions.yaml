- id: q_parameters_unstated
  kind: unstated_input
  about: [closed_loop, two_chamber, E_lvf_added, E_rvf_added, E_spt_added, P0_pcd_added, R_sys_added, L_av_added, L_pv_added]
  text: >-
    The paper prints no value for any elastance, end-diastolic parameter, resistance or
    inertance of the closed-loop or two-chamber models; it says only that they are
    "extrapolated from those found over several references". Every such input in this
    record is taken from the later CellML encoding of the model (record smith_cellml), so
    every closed-loop and two-chamber verdict tests the paper's printed results against
    that parameter set, not against values the paper states.
  citation: {page: 7, printed_page: "136", quote: "ciﬁc parameters are extrapolated from those found", where: text}
- id: q_driver_C_closed
  kind: unstated_input
  about: [C_closed_added, C_driver, closed_loop]
  text: >-
    Fig. 3's driver peaks at C = 0.27 s, but the paper does not say which A, B, C the
    closed-loop runs use. The record takes the printed A = 1 and B = 80 and C = 0.375 s
    from the CellML file, with 0.27 s as the alternative.
- id: q_pth_pulmonary
  kind: unstated_model
  about: [pth_pulm_added, closed_loop, co_decrease_printed]
  text: >-
    Eq. 14 applies the thoracic pressure only to the pericardium. The pulmonary artery and
    veins also lie in the thorax, and the CellML encoding adds P_th to their pressures. With
    the CellML parameters, raising P_th from -4 to 0 mmHg reduces cardiac output by far more
    than 9% when P_th acts on the ventricles alone (the model as stated); the alternative
    pth_pulm = 1 shows how much of the difference this choice accounts for.
- id: q_inlet_inertia
  kind: unstated_model
  about: [closed_loop]
  text: >-
    Fig. 1 draws inductors only at the aortic (L.av) and pulmonary (L.pv) valves, and the
    text says inertia is included "around the ventricle exit valves", so the record's
    model uses Eq. 6 at the mitral and tricuspid valves. The CellML encoding also gives the
    mitral and tricuspid valves inertances (L_mt, L_tc). Which form produced Figs. 7-11 is
    not stated.
  citation: {page: 3, printed_page: "132", quote: "around the ventricle exit valves", where: text}
- id: q_valve_sign
  kind: reading
  about: [closed_loop, two_chamber]
  text: >-
    Sec. 2.4.2 says a flow is re-included "when a pressure gradient becomes negative,
    favouring forward flow". The record reads this as: the valve opens when the upstream
    pressure exceeds the downstream one (the gradient along the flow direction is
    negative), and closes when the flow through it becomes negative.
  citation: {page: 6, printed_page: "135", quote: "When a pressure gradient becomes negative, favouring", where: text}
- id: q_numerics
  kind: choice
  about: [closed_loop, two_chamber, run_closed_normal, run_two_chamber]
  text: >-
    The paper gives no solver, step size, number of beats simulated or initial volumes
    ("approximated based on normal heart function"). The record integrates with fixed-step
    RK4 at dt = 0.2 ms, clamps a closing valve's flow at zero, solves Eq. 20 by Newton's
    method at each evaluation, starts from the CellML initial volumes scaled to the
    printed 1500 ml, and reports the last of 100 beats (20 for the two-chamber model);
    refinements in dt and beat count check these choices.
- id: q_two_chamber_boundary
  kind: unstated_input
  about: [two_chamber, P_pu_tc_added, P_ao_tc_added, P_vc_tc_added, P_pa_tc_added, vspt_swing_printed]
  text: >-
    The two-chamber run of Fig. 6 holds "constant inlet and outlet pressures" whose values
    are not printed. The record takes 10 and 100 mmHg for the left ventricle (Fig. 5's
    single-chamber lines, by eye) and 0 and 15 mmHg for the right, with alternatives.
- id: q_swing_fraction
  kind: reading
  about: [vspt_swing_pct_printed, two_chamber]
  text: >-
    "about 4% of the ventricle volume" does not say which ventricle volume (end-diastolic,
    mean, left or right). The model divides the swing by the mean left ventricle volume
    over the beat; the printed value is approximate and gets no verdict.
- id: q_targets_vs_results
  kind: reading
  about: [pao_sys_base_printed, pao_dia_base_printed, pao_sys_typical, sv_typical, sv_fig7_label]
  text: >-
    On p. 7-8 the values 70 ml, 120/80 and 25/8 mmHg are given as "target performance
    metrics" from [8], "as marked" in Fig. 7, so they are recorded as reported reference
    values and compared as validation. The abstract states 120/80 mmHg as a model result
    ("an increase in blood pressure from 120/80 to 165/130 mmHg"), and the Fig. 7 label
    SV=70 marks the simulated stroke volume; those are recorded as predicted.
- id: q_pth_sign
  kind: reading
  about: [Pth_normal]
  text: >-
    The OCR text of p. 8 reads "a normal (4 mmHg)"; the page image shows "(-4 mmHg)", as do
    the abstract and the statement that the thoracic pressure is "generally about -4 mmHg".
    The record uses -4.
- id: q_single_chamber
  kind: unstated_input
  about: [closed_loop]
  text: >-
    The single-chamber results (Fig. 5: settling to one steady state within two beats from
    V0 = 10 and 80 ml; identical results with L = 10^-6 mmHg s^2/ml) are not modelled: the
    paper gives neither the chamber's parameters nor its constant inlet and outlet
    pressures, and the claims are qualitative.
  citation: {page: 7, printed_page: "136", quote: "Fig. 5 plots variations in chamber pressure and vol", where: text}
- id: q_fig3_unchecked
  kind: reading
  about: [fig3_driver, e_fig3]
  text: >-
    The Fig. 3 reading was built without viewing the rendered crop or the check overlay,
    which the reader's session did not permit. Its calibration comes from the frame and
    gridlines found by the code; the overlay should be inspected
    (boxgraph figure check) before its verdict is relied on.
- id: q_contractility
  kind: unstated_input
  about: [closed_loop]
  text: >-
    Figs. 9 and 11 (stroke volume with 0.5 and 2 x R_sys; PV loops with 0.5, 1 and 2 x E_es)
    support only qualitative trend statements in the text, and the paper does not say
    which E_es (left, right, septal free walls) are scaled in Fig. 11. They are not
