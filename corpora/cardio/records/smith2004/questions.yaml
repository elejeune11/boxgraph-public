  kind: unexplained_difference
  about: [q_baseline_fig7_vs_fig8_9, fig7_vlv_data, fig7_plv_data, fig7_pao_data, fig8_lv_edv_data, fig8_lv_esv_data, fig8_lv_pmax_data, fig9_lv_edv_data, fig9_lv_esv_data, fig9_lv_pmax_data, fig11_lv_edv_data, fig11_lv_esv_data, fig11_lv_pmax_data, fig10_pao_max_data, fig10_pao_min_data, run_closed_normal]
  text: >-
