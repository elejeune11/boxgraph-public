  citation: {page: 7, printed_page: "136", quote: "Fig. 7 shows the output pressures and volumes for", where: text}
- id: q_no_validation_vs_mynard2014
  kind: choice
  about: [closed_loop, closed_loop_trace, closed_loop_loops, two_chamber, two_chamber_trace]
  text: >-
    (Cross-validation job, smith2004 + mynard2014, 2026-11-06.) No validation is added in either
    direction. mynard2014's ref. 57 is Smith NP 2004 (Physiol Meas 25: 863-877, a coronary flow and
