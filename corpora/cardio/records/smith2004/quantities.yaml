- {id: time_in_cycle, name: time within the heart beat, dimension: "[time]", description: "time t of the driver function e(t), measured from the start of a beat"}
- {id: driver_activation, name: driver function value, dimension: dimensionless, description: "e(t) of Eq. 5, weighting end-systolic against end-diastolic pressure (Eqs. 3, 4, 16, 17)"}
- {id: driver_amplitude, name: driver amplitude, dimension: dimensionless, description: "A_i of Eq. 5"}
- {id: driver_width_coefficient, name: driver width coefficient, dimension: "1/[time]**2", description: "B_i of Eq. 5"}
- {id: driver_peak_time, name: driver peak time, dimension: "[time]", description: "C_i of Eq. 5, the time of the driver's maximum within the beat"}
- {id: es_elastance, name: end-systolic elastance of a cardiac wall, dimension: "[pressure]/[length]**3", description: "E_es of Eq. 1 for the left or right ventricular free wall or the septum (Eqs. 16, 17, 20)"}
- {id: vessel_elastance, name: elastance of a vascular chamber, dimension: "[pressure]/[length]**3", description: "E_es of Eq. 1 applied to the aorta, vena cava, pulmonary artery or pulmonary vein (Sec. 2.3)"}
- {id: zero_pressure_volume, name: volume at zero end-systolic pressure, dimension: "[length]**3", description: "V_d of Eq. 1"}
- {id: ed_reference_volume, name: reference volume of the end-diastolic relation, dimension: "[length]**3", description: "V_0 of Eqs. 2 and 18"}
- {id: ed_pressure_scale, name: pressure scale of the end-diastolic relation, dimension: "[pressure]", description: "A of Eq. 2, written P_0 in Eqs. 18 and 20"}
- {id: ed_stiffness, name: exponential stiffness of the end-diastolic relation, dimension: "1/[length]**3", description: "lambda of Eqs. 2, 18 and 20"}
- {id: flow_resistance, name: flow resistance, dimension: "[pressure]*[time]/[length]**3", description: "R of Eqs. 6 and 7: a valve or a vascular bed"}
- {id: inertance, name: blood inertance, dimension: "[pressure]*[time]**2/[length]**3", description: "L of Eq. 7"}
- {id: thoracic_pressure, name: pressure in the thoracic cavity, dimension: "[pressure]", description: "P_th of Eq. 14"}
- {id: heart_rate, name: heart rate, dimension: "1/[time]", description: "beats per unit time; the period of e(t) is its reciprocal"}
- {id: stressed_blood_volume, name: total stressed blood volume, dimension: "[length]**3", description: "the sum of the six chamber volumes of the closed loop"}
- {id: pulmonary_thoracic_coupling, name: thoracic pressure applied to the pulmonary vessels, dimension: dimensionless, description: "1 if P_th is added to the pulmonary artery and vein pressures, 0 if it acts on the pericardium only (a reader's switch, not a quantity of the paper)"}
- {id: resistance_factor, name: multiplier of the systemic resistance, dimension: dimensionless, description: "the factor by which R_sys is scaled in Figs. 9 and 10"}
- {id: boundary_pressure, name: constant inlet or outlet pressure of the two-chamber model, dimension: "[pressure]", description: "a pressure held constant at a ventricle's inlet or outlet (Sec. 3, Fig. 6)"}
- {id: stroke_volume, name: ventricular stroke volume, dimension: "[length]**3", description: "maximum minus minimum ventricle volume over a steady beat"}
- {id: cardiac_output, name: cardiac output, dimension: "[length]**3/[time]", description: "stroke volume times heart rate"}
- {id: cardiac_output_decrease, name: relative decrease of cardiac output, dimension: dimensionless, description: "1 - CO(test)/CO(reference)"}
- {id: aortic_systolic_pressure, name: aortic systolic pressure, dimension: "[pressure]", description: "maximum aortic pressure over a steady beat"}
- {id: aortic_diastolic_pressure, name: aortic diastolic pressure, dimension: "[pressure]", description: "minimum aortic pressure over a steady beat"}
- {id: pa_systolic_pressure, name: pulmonary artery systolic pressure, dimension: "[pressure]", description: "maximum pulmonary artery pressure over a steady beat"}
- {id: pa_diastolic_pressure, name: pulmonary artery diastolic pressure, dimension: "[pressure]", description: "minimum pulmonary artery pressure over a steady beat"}
- {id: vena_cava_pressure, name: mean vena cava pressure, dimension: "[pressure]", description: "P_vc, the return pressure to the right heart, averaged over a beat"}
- {id: pulmonary_vein_pressure, name: mean pulmonary vein pressure, dimension: "[pressure]", description: "P_pu (P_pv in the text), the return pressure to the left heart, averaged over a beat"}
- {id: septal_volume_swing, name: oscillation of the septum free wall volume, dimension: "[length]**3", description: "maximum minus minimum V_spt over a beat"}
- {id: septal_swing_fraction, name: septal volume swing relative to ventricle volume, dimension: dimensionless, description: "the swing of V_spt divided by the (mean) left ventricle volume"}

