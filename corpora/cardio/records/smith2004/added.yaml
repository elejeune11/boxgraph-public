- id: L_pv_added
  quantity: inertance
  unit: mmHg*s^2/ml
  printed: "1.4868 x 10^-4"
  stands_for: "L.pv in Fig. 1"
  basis: "not printed; CellML file line 96 (L_pv)"
- id: C_closed_added
  quantity: driver_peak_time
  unit: s
  printed: "0.375"
  stands_for: "C in Eq. 5 for the closed-loop simulations (Figs. 7-11)"
  basis: >-
    The paper prints C = 0.27 only for the profile of Fig. 3 and does not say which C the
    closed-loop runs use. CellML file line 107 has C = 0.375 (half of the 0.75 s period at
    80 beats/min); Fig. 7 shows LV pressure peaking near 0.35-0.4 s, nearer 0.375 than 0.27.
  alternatives: ["0.27"]
- id: pth_pulm_added
  quantity: pulmonary_thoracic_coupling
  unit: dimensionless
  printed: "0"
  stands_for: "whether P_th acts on the pulmonary artery and vein as well as on the pericardium"
  basis: >-
    The paper adds P_th only to the pericardial pressure (Eq. 14) and says nothing about the
    pulmonary vessels, so the model as stated has 0. The CellML file adds P_th to the
    pulmonary artery and vein pressures (lines 934-947 and 1009),
    which is the alternative 1.
  alternatives: ["1"]
# Two-chamber model (Sec. 3, Fig. 6): "constant inlet and outlet pressures", values not printed
- id: P_pu_tc_added
  quantity: boundary_pressure
  unit: mmHg
  printed: "10"
  stands_for: "constant left ventricle inlet pressure of the two-chamber model"
  basis: "not printed; Fig. 5 (single chamber with constant inlet and outlet pressures) shows the inlet line P(1) near 10 mmHg, read by eye"
  alternatives: ["5", "15"]
- id: P_ao_tc_added
  quantity: boundary_pressure
  unit: mmHg
  printed: "100"
  stands_for: "constant left ventricle outlet pressure of the two-chamber model"
  basis: "not printed; Fig. 5 shows the outlet line P(3) at 100 mmHg, read by eye"
  alternatives: ["80", "120"]
- id: P_vc_tc_added
  quantity: boundary_pressure
  unit: mmHg
  printed: "0"
  stands_for: "constant right ventricle inlet pressure of the two-chamber model"
  basis: "not printed; the paper calls the right heart return pressure 'typically around 0 mmHg' (p. 8)"
  alternatives: ["5"]
- id: P_pa_tc_added
  quantity: boundary_pressure
  unit: mmHg
  printed: "15"
  stands_for: "constant right ventricle outlet pressure of the two-chamber model"
  basis: "not printed; roughly the mean of the paper's typical pulmonary artery pressure 25/8 mmHg (p. 8)"
  alternatives: ["8", "25"]

