# The paper prints no parameter values for its ventricles, septum, pericardium, vessels,
# valves or inertances ("extrapolated from those found over several references", p. 7).
# Each value below is taken from the CellML encoding of this model,
# corpus/cardio/code/smith_cellml/smith_chase_nokes_shaw_wake_2004.cellml (record smith_cellml),
# whose documentation says it is "based off the original Matlab code obtained from the
# model authors". The file labels pressures kPa, but the numbers are in mmHg: its P_th
# is -4, the paper's -4 mmHg.
