id: co_decrease
name: relative decrease of cardiac output between two simulations
role: processing
stated: {page: 8, printed_page: "137", quote: "volume, and thus the cardiac output, is decreased by", where: text}
equation: "decrease = 1 - CO_test / CO_ref (the paper's '9% drop', at a fixed heart rate)"
inputs:
  CO_ref: {quantity: cardiac_output, unit: l/min}
  CO_test: {quantity: cardiac_output, unit: l/min}
outputs:
  decrease: {quantity: cardiac_output_decrease, unit: percent}
settings: {}
stochastic: false
