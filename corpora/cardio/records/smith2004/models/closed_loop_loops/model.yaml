id: closed_loop_loops
name: pressure-volume loop features of the closed-loop model with R_sys and E_es scaled (Figs. 8-11)
role: model
stated:
  page: 8
  printed_page: '137'
  quote: shows results for a normal
  where: Figs. 8-11
equation: 'the equations of closed_loop as printed, with R_sys multiplied by rsys_factor (Figs. 9, 10) and the end-systolic
  elastances E_es,lvf and E_es,rvf (and E_es,spt when ees_septum = 1) multiplied by ees_factor (Fig. 11, "changing
  the end systolic elastance, E_es"); over the last beat: EDV = max V, ESV = min V, peak P of each ventricle, and
  max / min P_ao'
