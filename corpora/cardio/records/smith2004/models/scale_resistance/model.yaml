role: processing
stated: {page: 2, printed_page: "131", quote: "when the systemic resistance is doubled", where: text}
equation: "R_sys' = factor x R_sys"
inputs:
  R: {quantity: flow_resistance, unit: mmHg*s/ml}
  factor: {quantity: resistance_factor, unit: dimensionless}
outputs:
  R_scaled: {quantity: flow_resistance, unit: mmHg*s/ml}
settings: {}
stochastic: false
