id: closed_loop
name: closed-loop minimal haemodynamic model with ventricular interaction and outlet-valve inertia (Fig. 1)
role: model
stated: {page: 7, printed_page: "136", quote: "Fig. 7 shows the output pressures and volumes for", where: "Sec. 2, Eqs. 1-20, Fig. 1"}
equation: >-
  Ventricles: P_lv = P_lvf + P_peri, P_rv = P_rvf + P_peri (12, 13); P_peri = P_pcd + P_th (14);
  P_lvf = e P_es,lvf + (1-e) P_ed,lvf etc. (16, 17) with P_es = E_es (V - V_d) (1) and
  P_ed = P_0 (e^{lambda (V - V_0)} - 1) (2); V_lvf = V_lv - V_spt, V_rvf = V_rv + V_spt (9, 10);
  V_spt from Eq. 20; P_pcd = P_0,pcd (e^{lambda_pcd (V_pcd - V_0,pcd)} - 1), V_pcd = V_lv + V_rv (11, 18);
  e(t) = sum A_i e^{-B_i (t - C_i)^2} (5). Vessels: P = E_es (V - V_d) (1).
  Flows: Q = (P_1 - P_2)/R (6) through R_mt, R_tc, R_sys, R_pul; dQ/dt = (P_1 - P_2 - Q R)/L (7)
  through the aortic and pulmonary valves (L.av, L.pv in Fig. 1); dV/dt = Q_in - Q_out (8);
  valves 'open on pressure, close on flow' (Sec. 2.4.2).
inputs:
  E_lvf: {quantity: es_elastance, unit: mmHg/ml}
  Vd_lvf: {quantity: zero_pressure_volume, unit: ml}
  P0_lvf: {quantity: ed_pressure_scale, unit: mmHg}
  lam_lvf: {quantity: ed_stiffness, unit: 1/ml}
  V0_lvf: {quantity: ed_reference_volume, unit: ml}
  E_rvf: {quantity: es_elastance, unit: mmHg/ml}
  Vd_rvf: {quantity: zero_pressure_volume, unit: ml}
  P0_rvf: {quantity: ed_pressure_scale, unit: mmHg}
  lam_rvf: {quantity: ed_stiffness, unit: 1/ml}
  V0_rvf: {quantity: ed_reference_volume, unit: ml}
  E_spt: {quantity: es_elastance, unit: mmHg/ml}
  Vd_spt: {quantity: zero_pressure_volume, unit: ml}
  P0_spt: {quantity: ed_pressure_scale, unit: mmHg}
  lam_spt: {quantity: ed_stiffness, unit: 1/ml}
  V0_spt: {quantity: ed_reference_volume, unit: ml}
  P0_pcd: {quantity: ed_pressure_scale, unit: mmHg}
  lam_pcd: {quantity: ed_stiffness, unit: 1/ml}
  V0_pcd: {quantity: ed_reference_volume, unit: ml}
  P_th: {quantity: thoracic_pressure, unit: mmHg}
  E_ao: {quantity: vessel_elastance, unit: mmHg/ml}
  Vd_ao: {quantity: zero_pressure_volume, unit: ml}
  E_vc: {quantity: vessel_elastance, unit: mmHg/ml}
  Vd_vc: {quantity: zero_pressure_volume, unit: ml}
  E_pa: {quantity: vessel_elastance, unit: mmHg/ml}
  Vd_pa: {quantity: zero_pressure_volume, unit: ml}
  E_pu: {quantity: vessel_elastance, unit: mmHg/ml}
  Vd_pu: {quantity: zero_pressure_volume, unit: ml}
  R_mt: {quantity: flow_resistance, unit: mmHg*s/ml}
  R_av: {quantity: flow_resistance, unit: mmHg*s/ml}
  R_tc: {quantity: flow_resistance, unit: mmHg*s/ml}
  R_pv: {quantity: flow_resistance, unit: mmHg*s/ml}
  R_sys: {quantity: flow_resistance, unit: mmHg*s/ml}
