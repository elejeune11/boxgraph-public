id: two_chamber_trace
name: septum free-wall volume of the two-chamber model at an instant t of a steady beat (Fig. 6)
role: model
stated:
  page: 7
  printed_page: '136'
  quote: The next model simulated ventricular interaction
  where: Sec. 2.2, 2.4.3, Eqs. 9-20
equation: the equations of two_chamber as printed; V_spt (Eq. 20) of the last simulated beat at time t within the
  beat (t modulo 60/HR; t = 0 is the start of a beat of the driver e(t))
built_from:
- two_chamber
inputs:
  E_lvf:
    quantity: es_elastance
    unit: mmHg/ml
  Vd_lvf:
    quantity: zero_pressure_volume
    unit: ml
  P0_lvf:
    quantity: ed_pressure_scale
    unit: mmHg
  lam_lvf:
    quantity: ed_stiffness
    unit: 1/ml
  V0_lvf:
    quantity: ed_reference_volume
    unit: ml
  E_rvf:
    quantity: es_elastance
    unit: mmHg/ml
  Vd_rvf:
    quantity: zero_pressure_volume
    unit: ml
  P0_rvf:
    quantity: ed_pressure_scale
    unit: mmHg
  lam_rvf:
    quantity: ed_stiffness
    unit: 1/ml
  V0_rvf:
    quantity: ed_reference_volume
    unit: ml
  E_spt:
    quantity: es_elastance
    unit: mmHg/ml
  Vd_spt:
    quantity: zero_pressure_volume
    unit: ml
  P0_spt:
    quantity: ed_pressure_scale
    unit: mmHg
  lam_spt:
    quantity: ed_stiffness
    unit: 1/ml
  V0_spt:
    quantity: ed_reference_volume
    unit: ml
  P0_pcd:
    quantity: ed_pressure_scale
    unit: mmHg
  lam_pcd:
    quantity: ed_stiffness
    unit: 1/ml
  V0_pcd:
    quantity: ed_reference_volume
    unit: ml
  P_th:
    quantity: thoracic_pressure
    unit: mmHg
  R_mt:
    quantity: flow_resistance
    unit: mmHg*s/ml
  R_av:
    quantity: flow_resistance
    unit: mmHg*s/ml
  R_tc:
    quantity: flow_resistance
    unit: mmHg*s/ml
  R_pv:
    quantity: flow_resistance
    unit: mmHg*s/ml
  L_av:
    quantity: inertance
    unit: mmHg*s^2/ml
  L_pv:
    quantity: inertance
    unit: mmHg*s^2/ml
  HR:
    quantity: heart_rate
    unit: 1/min
  A:
    quantity: driver_amplitude
    unit: dimensionless
  B:
    quantity: driver_width_coefficient
    unit: 1/s^2
  C:
    quantity: driver_peak_time
    unit: s
  P_pu:
    quantity: boundary_pressure
    unit: mmHg
  P_ao:
    quantity: boundary_pressure
    unit: mmHg
  P_vc:
    quantity: boundary_pressure
    unit: mmHg
  P_pa:
    quantity: boundary_pressure
    unit: mmHg
  t:
    quantity: time_in_cycle
    unit: s
outputs:
  V_spt:
    quantity: septal_volume
    unit: ml
settings:
  dt: 0.0002
  n_beats: 20
  V_lv_initial: 94.6812
  V_rv_initial: 90.7302
stochastic: false
