id: driver_eq5
name: cardiac driver function e(t) with one Gaussian term (Eq. 5, N = 1)
role: model
stated: {page: 4, printed_page: "133", quote: "deﬁnes the driver function where Ai, Bi, Ci and", where: "Eq. 5"}
equation: "e(t) = sum_{i=1}^{N} A_i e^{-B_i (t - C_i)^2}"
inputs:
  A: {quantity: driver_amplitude, unit: dimensionless}
  B: {quantity: driver_width_coefficient, unit: 1/s^2}
  C: {quantity: driver_peak_time, unit: s}
  t: {quantity: time_in_cycle, unit: s}
outputs:
  e: {quantity: driver_activation, unit: dimensionless}
settings: {}
stochastic: false
