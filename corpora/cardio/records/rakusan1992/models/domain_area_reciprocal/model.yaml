id: domain_area_reciprocal
name: mean capillary domain area as the reciprocal of capillary density
role: model
stated: {page: 3, printed_page: "40", where: "Methods, Morphometric Analysis", quote: "polygonal region around each capillary was defined as"}
equation: "A = 1/CD (domains tile the section, so their mean area in a field is the field area over the number of capillaries)"
from_words: true
inputs:
  CD: {quantity: capillary_density, unit: 1/mm^2}
outputs:
  A: {quantity: capillary_domain_area, unit: um^2}
settings: {}
stochastic: false
