id: cd_poly3
name: capillary density as a third-order polynomial of heart weight (Fig. 2)
role: fit
stated: {page: 5, printed_page: "42", where: "Fig. 2 legend", quote: "are best approximated (r=0.93B) as a third-order polynomial"}
equation: "y = 3,599 - 8.45x + 0.013x^2 - 6.76x10^-6 x^3 (y capillary density per mm^2, x heart mass in g)"
inputs:
  a0: {quantity: cd_poly_c0, unit: 1/mm^2}
  a1: {quantity: cd_poly_c1, unit: 1/mm^2/g}
  a2: {quantity: cd_poly_c2, unit: 1/mm^2/g^2}
  a3: {quantity: cd_poly_c3, unit: 1/mm^2/g^3}
  x: {quantity: heart_mass, unit: g}
outputs:
  y: {quantity: capillary_density, unit: 1/mm^2}
settings: {}
stochastic: false
