id: rel_change_capillary_density
name: relative change of mean capillary density from a reference group
role: processing
stated: {page: 2, printed_page: "39", where: "Table 1, difference rows; text p. 4", quote: "Difference from group 1 (%) +8 -25 -4 -4 +1"}
equation: "difference (%) = 100 (value - reference)/reference; decrease (%) = 100 (reference - value)/reference"
from_words: true
inputs:
  ref: {quantity: capillary_density, unit: 1/mm^2}
  val: {quantity: capillary_density, unit: 1/mm^2}
outputs:
  diff: {quantity: relative_difference, unit: percent}
  decrease: {quantity: relative_decrease, unit: percent}
settings: {}
stochastic: false
