id: domain_per_heart
name: each heart's domain area as the reciprocal of its capillary density (Figs. 2 and 3)
role: processing
stated: {page: 3, printed_page: "40", where: "Methods, Morphometric Analysis", quote: "polygonal region around each capillary was defined as"}
equation: "A_i = 1/CD_i for each heart i: the domains tile the section, so their mean area is the area per capillary"
from_words: true
inputs:
  CD: {quantity: capillary_density, unit: 1/mm^2, curve: {quantity: heart_mass, unit: g}}
  A: {quantity: capillary_domain_area, unit: um^2, curve: {quantity: heart_mass, unit: g}}
outputs:
  A_pred: {quantity: capillary_domain_area, unit: um^2, curve: {quantity: heart_mass, unit: g}}
settings: {}
stochastic: false
