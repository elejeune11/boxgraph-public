id: krogh_radius
name: radius of the Krogh tissue cylinder from the mean capillary density
role: model
stated: {page: 3, printed_page: "40", where: "Methods, Morphometric Analysis", quote: "The average radius of the Krogh tissue cylinder was calculated from the capillary density"}
equation: "R = 1/sqrt(pi CD) (in words: the radius of the average tissue cylinder perfused by a single capillary)"
from_words: true
inputs:
  CD: {quantity: capillary_density, unit: 1/mm^2}
outputs:
  R: {quantity: capillary_domain_radius, unit: um}
settings: {}
stochastic: false
