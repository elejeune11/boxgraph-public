  citation: {page: 5, printed_page: "42", where: text, quote: "was 2.5-2.9 times greater in hearts with aortic"}
- id: q_domain_radius_definition
  kind: reading
  about: [krogh_radius, domain_radius_equivalent, dr_inf_c, dr_acq]
  text: >
    The tables' "capillary domain radius" could be the Krogh radius computed from mean density (Methods,
    "calculated from the capillary density") or the mean of the per-domain equivalent radii from the
    image analyzer. The record checks both: R = 1/sqrt(pi CD) per group and sqrt(A/pi) of the mean domain
    area. Whether the per-heart radius was averaged, or the group mean density converted, is not stated;
    the comparisons use group means.
  citation: {page: 3, printed_page: "40", where: "Methods", quote: "The average radius of the Krogh tissue cylinder was calculated from the capillary density"}
- id: q_figures_not_read
  kind: choice
  about: [cd_poly3, da_poly2]
  text: >
    Figs. 2 and 3 plot capillary density and domain area against heart mass for each of the 63 hearts,
    in four symbol types. They were not digitized: the commands that render the page for a calibrated
    reading were refused in this session. Reading them would let the fits be checked against the points
    they were fitted to (fit_quality on individual hearts, not group means) and the Fig. 3 coefficient
    question be settled from the drawn curve.
- id: q_fixation_correction
  kind: choice
  about: [rat_cap_decrease_immersion, cd_adu_c]
  text: >
    The paper applies no correction for immersion fixation: it finds a 4% nonsignificant decrease of
    capillary density with immersion against perfusion fixation in rats and reports the human
    (formalin-immersed) densities uncorrected. Whether shrinkage in paraffin embedding of the human
    tissue (as against historesin for the rats) changes density is not tested. A comparison of these
    densities with in vivo or perfusion-fixed values should keep the fixation in its conditions.
  citation: {page: 3, printed_page: "40", where: text, quote: "There was no increase in the scatter of"}
- id: q_children_age_text
  kind: reading
  about: [myo_chi_c]
  text: >
    The text compares myocyte area between "children 9-11 years old" and young adults, while the
    children group is 9-14 years everywhere else; probably a misprint of the age range, recorded as read.
  citation: {page: 4, printed_page: "41", where: text, quote: "children 9-11 years old and young adults"}
- id: q_congenital_above_fit
  kind: unexplained_difference
  about: [run_cdpoly_inf_as, run_cdpoly_chi_as, run_cdpoly_adu_as, run_cdpoly_coa, run_dapoly_adu_as]
  text: >
    The paper claims congenital stenosis and coarctation lie above the density fit (and below the domain
    fit). The runs at the group mean heart masses give the fit's expectation for each group for the
    reader to set beside the tabulated means (the claim is an inequality, so it gets no verdict). The
    domain claim depends on the Fig. 3 polynomial, which as printed falls at high heart mass (see
    q_dapoly_coefficient), so the printed fit puts the congenital adults (482 um^2 at 780 g) above it.
- id: q_audit_halfway_radius
  kind: reading
  about: [krogh_radius, dr_adu_c]
  text: >
    Audit (second reading). The Methods define the Krogh radius twice: "calculated from the capillary
    density" and, in the next sentence, "calculated as the mean distance halfway between two capillaries in
    cross section". The record models the first as R = 1/sqrt(pi CD) (the circle of area 1/CD). Half the
    nearest-neighbour distance is a different quantity: for a regular hexagonal array it is
    sqrt(1/(2 sqrt(3) CD)), about 5% smaller (11.3 um at 2,249/mm^2 against 11.9 um and the printed
    12.0 ± 0.2 um). The tabulated radii agree with the circle-of-equal-area reading, not with a half
    intercapillary distance; which one the paper computed is not certain, so this is left as a reading
    question beside q_domain_radius_definition, and no model is changed.
  citation: {page: 3, printed_page: "40", where: "Methods, Morphometric Analysis", quote: "calculated as the mean distance halfway be"}
- id: q_audit_abstract_differences
  kind: possible_error
  about: [cd_chi_c, cd_inf_c, bw_coa, cd_coa]
  text: >
    Audit (second reading). The abstract differs from the body in two details: it gives the coarctation
    group as "adults 15-39 years old", while Methods (p. 3) and Table 5 call it young adults 15-30 years;
    and it marks the infant-to-children density decrease "p<0.05", while Table 3 marks it *p<0.01. Values
    are recorded as in the tables; the age range of the coarctation group (and so its match to the 15-30 y
    controls) is uncertain.
  citation: {page: 1, printed_page: "38", where: abstract, quote: "congenital isolated coarctation of the aorta in adults 15-39 years old"}
- id: q_audit_cross_record_density
  kind: unexplained_difference
  about: [cd_adu_c, cd_acq, cd_range_mammals]
  text: >
    Audit (cross-record, not testable here: a comparison can only use this record's data). Normal adult
    human capillary density differs widely across the corpus: 2,249 ± 85/mm^2 here (mean ± SEM, n = 8,
    15-30 y, silver-stained 1-um sections, formalin immersion, LV lateral wall mid- and endomyocardium);
    2,301-3,157/mm^2 in kaneko2011 (one 60-year-old man, upper mid-wall, 3D reconstruction); a median of
    1,044/mm^2 [911-1,188] in mohammed2015's controls (autopsy, median age 74 y, CD31 on 4-um paraffin
    sections, automated counting of 10-78.5 um^2 profiles). campbell2011 reports a length density
    (about 1,141-1,226 mm/mm^3, CD31, biopsies of CABG patients), not a transverse-section count, so it is
    not the same quantity. Age, staining (silver basement membrane against CD31), section thickness,
    counting method and disease all differ; mohammed2015's controls are older than even this paper's
    acquired-stenosis group (1,671/mm^2, 51-86 y). The comparisons belong to the cross-record layer and
    are findings about methods, not errors in either paper.
  citation: {none: "a finding of the cross-record audit between rakusan1992, kaneko2011, campbell2011 and mohammed2015, not a printed statement"}
- id: q_audit_no_blood_volume
  kind: unstated_input
  about: [cd_adu_c, myo_adu_c]
  text: >
    Audit. No model in the corpus is run on these densities to predict a capillary blood volume fraction
    (for comparison with vink2024's myocardial blood volume): the paper states that capillary luminal
    area was not measured (hearts not fixed at known pressure), so capillary diameter is not available
    here, and a transverse density is not a length density without an orientation factor the paper does
    not give.
  citation: {page: 3, printed_page: "40", where: "Methods", quote: "immediately after death, capillary luminal area was"}
- id: q_fig3_drawn_curve
  kind: reading
  about: [da_poly2, da_poly_b2, da_fig3_fit, cmp_dapoly_fig3_fit, q_dapoly_coefficient]
  text: >
    Figure reading (calibrated, fig3_fit). The thick line of Fig. 3 rises monotonically from about 356 um^2
    at 100 g to a plateau of about 633 um^2 at 750-875 g; the printed polynomial y = 274.17 + 0.878x -
    0.001x^2 instead peaks near 440 g and falls to about 277 um^2 at 875 g. The drawn line is matched by
    the printed constant and linear coefficient with an x^2 coefficient of about -0.0005 to -0.00055,
    which is inside the rounding range of the printed "-0.001" (three decimal places): cmp_dapoly_fig3_fit
    is reproduced only through that rounding. This answers q_dapoly_coefficient: the coefficient is
    most likely not a misprinted digit but printed with too few decimals to reproduce the drawn fit (or
    the table means it was fitted to). Values computed from the legend as printed (cmp_dapoly_acq and
    the other group-mean runs) are therefore unreliable above about 300 g. The same holds more mildly for
    Fig. 2 ("0.013" for the x^2 coefficient), whose drawn line the printed cubic reproduces.
  citation: {page: 5, printed_page: "42", where: "Fig. 3 and legend", quote: "as a second-order polynomial: y=274.17+0.878x-"}
