- id: q_dapoly_coefficient
  kind: possible_error
  about: [da_poly2, da_poly_b2, cmp_dapoly_acq, cmp_dapoly_adu_c, cmp_dapoly_chi_c]
  text: >
    The Fig. 3 polynomial as printed, y = 274.17 + 0.878x - 0.001x^2, has its maximum at x = 439 g
    (about 467 um^2) and falls to about 336 um^2 at 800 g, whereas the curve drawn in Fig. 3 rises
    monotonically to roughly 650 um^2 near 800 g (by eye; no calibrated reading), and the acquired
    stenosis group (mean heart mass 634 g) has a mean domain area of 611 um^2, against about 429 um^2
    from the printed polynomial. The x^2 coefficient (or the linear one) is probably misprinted; the
    page shows "-" at a line end followed by "0.001x2". No variant is written, since the correction
    would change a printed number and the figure was not read.
  citation: {page: 5, printed_page: "42", where: "Fig. 3 legend", quote: "as a second-order polynomial: y=274.17+0.878x-"}
- id: q_56_percent
  kind: possible_error
  about: [hw_increase_chi_adu, cmp_hw_inc_chi_adu, run_bw_chi_adu]
  text: >
    The text twice says heart weight increased by 56% between children (9-14 y) and young adults. From
    Table 3 the control heart weight goes from 178 g to 255 g, a 43% increase; the 56% matches the
    body weight increase (37.5 to 58.5 kg, run_bw_chi_adu). The text may have taken the body weight
    ratio for the heart weight ratio.
  citation: {page: 4, printed_page: "41", where: text, quote: "the relative increase in heart weight was much less"}
- id: q_hw_ratio_range
  kind: overstated_claim
  about: [hw_ratio_as_vs_c, cmp_hwratio_adu]
  text: >
    The text says total heart weight with congenital stenosis was 2.5-2.9 times that of age-matched
    controls in all age groups. Table 3 gives 114/40 = 2.85 (infants), 457/178 = 2.57 (children) and
