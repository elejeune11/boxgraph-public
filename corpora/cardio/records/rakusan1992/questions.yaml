- id: q_no_validation_vs_kassab1993
  kind: choice
  about: [krogh_radius, domain_area_reciprocal, domain_radius_equivalent, cd_poly3, da_poly2, myocyte_capillary_ratio]
  text: >
    Validation job kassab1993+rakusan1992 (2026-11-11). No model of this record is validated against
    kassab1993's measurements. The models here take capillary density, myocyte density, domain area or
    heart weight as inputs and give a Krogh or domain radius, a domain area, a myocyte-to-capillary ratio,
    the fitted polynomials of density and domain area in heart weight, or relative changes between groups.
    kassab1993 measures pig coronary arterial casts: mean diameters, lengths, segments per element, element
    numbers and the connectivity matrix by Strahler order, and tree volumes. It prints no capillary
    density, domain area or heart weight that these models could take or predict (its capillary
    morphometry is in a separate paper, its ref. 17), so no measurement there is the output of a model
    here. Neither paper cites the other. Comparing capillary supply between the two (pig casts against
    human transverse sections) would need a relation from vessel numbers by order to capillaries per unit
    tissue area, which neither paper states. For the other direction see
    kassab1993/q_no_validation_vs_rakusan1992.
  citation: {none: "a finding of the validation job between kassab1993 and rakusan1992, not a printed statement"}
- id: q_mohammed_density_vs_fit
  kind: unexplained_difference
  about: [cd_poly3, cd_poly_a0, cd_poly_a1, cd_poly_a2, cd_poly_a3]
  text: >
    (Validation job with mohammed2015; validations.yaml val_cdpoly_mohammed_controls and
    val_cdpoly_mohammed_hfpef.) The Fig. 2 cubic run at mohammed2015's median heart weights gives
    about 1970/mm2 at 335 g (controls) and 1760/mm2 at 538 g (HFpEF), against the measured medians 1044 and
    788/mm2: the measured densities are about half the fitted ones, and the HFpEF/control ratio (0.75) is
    steeper than the cubic's (0.89). Neither paper explains the gap; mohammed2015 warns that absolute
    densities are not comparable across methods (its p. 7). Candidate causes lie in mohammed2015's method:
    the 10 um2 minimum profile area (its total vessel density in controls rises from 1368 to 2214/mm2
    without it), automated CD31 thresholds in 4 um sections, profiles in non-transverse orientation, and
    autopsy tissue of elderly subjects. Measurements considered and not used: mohammed2015's microvascular
    density (10-314 um2, including precapillary arterioles) and its figure readings (MVD histograms and box
    plots, including the HFrEF box, heart weight and fibrosis distributions) are not the capillary density
    the cubic predicts; there is no HFrEF capillary density to set beside its heart weight. The domain-area
    polynomial (da_poly2), the Krogh and domain radius models and the myocyte/capillary ratio give or need
    a domain area, a radius or a myocyte density, none of which mohammed2015 measures.
  citation: {none: "a finding of the validation job between mohammed2015 and rakusan1992, not a printed statement"}
# ---- Cross-record validation job: rakusan1992 with kaneko2011 (2026-11-11) ----
- id: q_kaneko_path_position_vs_fit
  kind: choice
  about: [cd_poly3, hw_kaneko_heart_added]
  text: >
    (Cross-record validation, rakusan1992 with kaneko2011.) The Fig. 2 cubic gives about 2,005/mm2 at the
    320 g of kaneko2011's heart. kaneko2011 prints no whole-heart density, only three densities along one
    arteriole-to-venule path (2,301, 3,130 and 3,157/mm2, mean ± SD over three points each), and which of
    them a wall-averaged density like rakusan1992's should be set against is open, so all three are
    entered. The verdicts are close (arteriolar side, middle) and not reproduced (venular side, whose SD
    of 167 is narrow). The cubic lies below all three; the venular and middle values are about 55% above
    it. Candidate causes, none tested: kaneko2011's counts are local to one capillary bundle of the
    upper middle layer of one heart, with no stated counting area; its man of 60 lies in the age gap
    between rakusan1992's normal (15-30 y) and acquired stenosis (51-86 y) groups; fixation and section
    thickness differ. The heart weight is printed in kaneko2011 (p. 1) but not entered there as a datum,
    so it is carried here as added; its alternatives (300 and 340 g) only show the sensitivity: the cubic
    moves by under 100/mm2 over them, far less than the gap. Measurements of kaneko2011 considered and not
    used: its tissue areas per capillary (434.6, 319.5, 316.7 um2) are derived from its own densities,
    not measured, so the domain-area models (domain_area_reciprocal, da_poly2, krogh_radius) have no
    measurement there to predict; segment lengths, arteriolar-venular distance, bundle and micronecrosis
    sizes, sinus volumes and the Fig. 3 histogram have no counterpart among this record's models.
  citation: {none: "a finding of the validation job between rakusan1992 and kaneko2011, not a printed statement"}
# ---- Cross-record validation job: pandian2025 with rakusan1992 (2026-11-12) ----
- id: q_no_validation_vs_pandian2025
  kind: unstated_model
  about: [krogh_radius, domain_area_reciprocal, domain_radius_equivalent, domain_per_heart, cd_poly3, da_poly2, myocyte_capillary_ratio, heart_mass_ratio, scatter_mean_density, scatter_mean_domain]
  text: >
    (Cross-record validation, pandian2025 with rakusan1992.) No validation was added in either direction.
    Neither paper cites the other. The models here take a capillary density, a myocyte density, a domain
    area or a heart weight and give a Krogh or domain radius, a domain area, a myocyte/capillary ratio,
    the fitted polynomials in heart weight, relative changes between groups or group means of this paper's
    own scatter plots. pandian2025 is an engineered in vitro network (HUVEC + fibroblasts in fibrin,
    perfused with culture medium) and prints none of these inputs or outputs: its measurements are vessel
    diameters and radii (20-40 um; Figs. 2a, 3e, 4b), bead velocities (Figs. 3f, 4c, 4f, the network mean),
    the dextran diffusive permeability (Fig. 4a and Sect. 4.11) and the segmentation volume coverage
    (Fig. 2b). Its vessel radius is not the capillary domain radius tabulated here (the radius of the
    tissue cylinder a capillary supplies), so the two were not mapped. In the other direction no
    pandian2025 model outputs a capillary density, domain area or heart weight. A comparison of capillary
    supply would need the in vitro network's capillaries per transverse section area, which it does not
    print, and an engineered network is not expected to match human myocardium. See
    pandian2025/q_no_validation_rakusan1992.
  citation: {none: "a finding of the validation job between pandian2025 and rakusan1992, not a printed statement"}
