notes: >
  Morphometry of the left ventricular lateral free wall of 63 postmortem human hearts (all fixed by
  immersion in formalin; midmyocardium and endomyocardium pooled; capillaries counted in transverse
  section on silver-stained 1-um sections), in eight groups: control and congenital aortic stenosis in
  infants (<1 y), children (9-14 y) and young adults (15-30 y), congenital coarctation in young adults,
  and acquired aortic stenosis in adults (51-86 y). A preliminary rat study (Table 1) compares perfusion
  fixation in glutaraldehyde with immersion fixation in glutaraldehyde or formalin. Every value of
  Tables 1, 3, 4 and 5 is recorded as printed with its SEM, group and n (n in each datum's note); the
  adult control and adult congenital stenosis rows repeated in Tables 4 and 5 are not entered again
  (Table 4 rounds body weight to 58 and 70 kg; the other repeated values are identical). The paper
  applies no fixation correction: it measures the effect of immersion fixation in the rat (a 4%
  nonsignificant decrease in capillary density) and uses the human densities uncorrected; that 4% and
  the percentages of Table 1 are checked against the table's own means.
  Models: (1) the Krogh cylinder radius from the mean capillary density, R = 1/sqrt(pi CD), stated in
  words (Methods, p. 3), checked against the tabulated domain radius of all eight groups; (2) the mean
  domain area as the reciprocal of density and (3) the equivalent radius of the mean domain area, both
  identities of a tessellation applied to group means and so compared as approximations; (4) the
  third-order polynomial of capillary density on heart mass (Fig. 2) and (5) the second-order polynomial
  of domain area on heart mass (Fig. 3), evaluated at the group mean heart masses of the groups they
  were fitted to (controls and acquired stenosis) and run, without comparison, at the congenital
  groups the paper says lie above (density) or below (domain) the fitted line; (6) relative changes and
  ratios the text and Table 1 print (fixation effects, the 28% and 6% density decreases, the 56% heart
  weight increase, the fourfold heart growth, the 2.5-2.9-fold hypertrophy, the myocyte/capillary
  ratio of Table 1). Findings: R = 1/sqrt(pi CD) reproduces the tabulated radii; the Fig. 3 domain
  polynomial as printed peaks near 440 g and gives about 430 um^2 at the acquired stenosis mean heart
  mass of 634 g against 611 um^2 printed, and contradicts its own plotted curve (a possible misprint
  of the x^2 coefficient); the 56% heart weight increase between children and adults is 43% from
  Table 3 (56% is the body weight increase); the adult hypertrophy ratio 780/255 = 3.06 lies outside
  the printed 2.5-2.9 (judged close). Table values are printed as mean ± SEM, so their comparisons are
  judged against the SEM interval; the approximations (1/CD for the domain area, sqrt(A/pi) for the
  radius) fall inside it in every group even though by Jensen's inequality they are biased low.
  Left out: Figs. 2 and 3 as scatter plots of individual hearts (the figure-rendering commands were
  refused in this session, so no calibrated reading was possible; see figures.md and a question);
  Fig. 1 (drawings of domains, with four single-field densities that feed no model); the correlation
  coefficients r = 0.93 and 0.87; the hedged "approximately 10-fold" body weight, "sixfold" heart
  weight and "almost threefold" hypertrophy; the 23,500 um^2 photomicrograph area. Cross-paper
  comparisons with kaneko2011, campbell2011 and mohammed2015 are not entered here: those records were
  empty when this one was read; spaan1981 uses one capillary density (3500/mm^2) as an input. No model
  in the corpus is run on these densities, since none of them supplies the capillary diameter or
  length that a blood volume fraction would need.
  Figure pass (2026-11-11): Figs. 2 and 3 are now read with calibrated code (figures.yaml, figures.md),
  superseding the "left out" above: the drawn fitted lines and every marker that can be told apart, by
  group (all 13 acquired-stenosis hearts in both figures). The printed cubic reproduces the drawn Fig. 2
  line; the drawn Fig. 3 line is reproduced only within the rounding of the printed x^2 coefficient
  (q_fig3_drawn_curve, answering q_dapoly_coefficient). The acquired-stenosis markers reproduce the
  Table 4 means, and each heart's 1/density agrees with its domain area to about 1-2%. The figures and
  tables hold 62 hearts, the Methods say 63 (q_heart_count).
