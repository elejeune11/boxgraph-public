- {id: capillary_density, name: number of capillaries per unit cross-sectional area of myocardium, dimension: "1/[length]**2", description: "capillary profiles counted in transverse section of the left ventricular wall"}
- {id: myocyte_density, name: number of myocyte profiles per unit cross-sectional area of myocardium, dimension: "1/[length]**2", description: "rat hearts, Table 1"}
- {id: myocyte_capillary_ratio, name: myocytes per capillary in cross section, dimension: "dimensionless"}
- {id: capillary_domain_area, name: mean area of the capillary domain, dimension: "[length]**2", description: "area of the polygon of tissue closer to a capillary than to any other, in transverse section"}
- {id: capillary_domain_radius, name: radius of the tissue cylinder supplied by one capillary, dimension: "[length]", description: "the Krogh radius tabulated as capillary domain radius (Tables 3-5)"}
- {id: sd_log_domain_radius, name: standard deviation of the log domain radii, dimension: "dimensionless", description: "heterogeneity index of capillary spacing; the tables print it multiplied by 1,000"}
- {id: myocyte_area_fraction, name: fraction of tissue cross-sectional area occupied by myocytes, dimension: "dimensionless"}
- {id: heart_mass, name: heart weight, dimension: "[mass]"}
- {id: body_mass, name: body weight, dimension: "[mass]"}
- {id: body_surface_area, name: body surface area, dimension: "[length]**2"}
- {id: relative_difference, name: signed relative difference from a reference group, dimension: "dimensionless", description: "(value - reference)/reference"}
- {id: relative_decrease, name: relative decrease from a reference group, dimension: "dimensionless", description: "(reference - value)/reference"}
- {id: heart_mass_ratio, name: ratio of heart weight to that of a reference group, dimension: "dimensionless"}
- {id: cd_poly_c0, name: constant term of the capillary density polynomial in heart mass, dimension: "1/[length]**2"}
- {id: cd_poly_c1, name: linear coefficient of the capillary density polynomial in heart mass, dimension: "1/[length]**2/[mass]"}
- {id: cd_poly_c2, name: quadratic coefficient of the capillary density polynomial in heart mass, dimension: "1/[length]**2/[mass]**2"}
- {id: cd_poly_c3, name: cubic coefficient of the capillary density polynomial in heart mass, dimension: "1/[length]**2/[mass]**3"}
- {id: da_poly_c0, name: constant term of the domain area polynomial in heart mass, dimension: "[length]**2"}
- {id: da_poly_c1, name: linear coefficient of the domain area polynomial in heart mass, dimension: "[length]**2/[mass]"}
- {id: da_poly_c2, name: quadratic coefficient of the domain area polynomial in heart mass, dimension: "[length]**2/[mass]**2"}
- {id: subject_group, name: "group of hearts (age and disease)", dimension: "dimensionless", description: "categorical label used as a condition"}
- {id: species, name: species, dimension: "dimensionless", description: "categorical label used as a condition"}
- {id: fixation_method, name: fixation of the heart before sectioning, dimension: "dimensionless", description: "categorical label used as a condition"}
