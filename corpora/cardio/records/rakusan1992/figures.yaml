# Figs. 2 and 3 (PDF p. 5): one value per heart against heart mass, in four marker kinds, with the
# fitted polynomial drawn as a thick line between two thin lines. Shared reading code: figures/_scatter.py.
- id: fig2_fit
  page: 5
  where: "Fig. 2"
  what: "the thick middle line (the fitted third-order polynomial), not the two thin lines either side of it"
  dpi: 900
  crop: [840, 960, 3480, 2830]
  x: {quantity: heart_mass, unit: g}
  y: {quantity: capillary_density, unit: 1/mm^2}
  mode: code
