notes: >
  Histology of nonischemic lateral LV wall biopsies (near the base, between LAD and circumflex
  territories) from 46 men and 11 women with extensive coronary artery disease undergoing CABG.
  Scope: the quantitative core. The only stated model that produces printed numbers is the
  supplement's diffusion radius formula, sqrt(1/(pi x capillary length density)); it is run on
  the Table 2 medians and quartiles of length density for each sex and compared with the printed
  diffusion radius (medians as reproductions; quartiles, swapped because the formula is
  decreasing, as approximations). All six agree at the printed precision (e.g. 1226 mm/mm3 gives
  16.1 um against 16). The length density equation (2 sum C / (sum Pt x 0.0016 mm2)) is recorded
  but not runnable: no counts are printed. The counting-grid constants (0.0016 mm2 per point and
  9 squares per frame from the 40 um grid and 120 um frame) are checked. Both printed formulas
  have operator-precedence ambiguities, recorded as reading questions.
  Also checked: the size-normalised ratios of Table 2 (diffusion radius and cardiomyocyte width
  per BSA, per lean body mass, and radius/width), cardiac index and the plasma VEGFR-1/VEGF-A
  ratio, each as the ratio of group medians against the printed median of per-patient ratios
  (approximations: several differ, e.g. women's radius/BSA 9.4 against 9.0 and radius/width 0.70
  and 0.81 against 0.67 and 0.78, as expected for a median of ratios, not an error); and the
  text's women-to-men percentages (47%, 90%, 72%, 28%, 74%, 48%), all of which follow from the
  printed medians. Measurement basis kept in notes and questions: one CD31 section per patient
  of unknown orientation, immersion-fixed paraffin tissue with no shrinkage correction, 45 men
  for length density and radius.
  Left out: Table 1 clinical characteristics other than BSA, lean body mass, cardiac output and
  cardiac index; the echocardiographic values in the Results text; fibrosis, arteriolar counts,
  density and diameter rows of Table 2 and their interquartile ranges other than for length
  density and diffusion radius; Table S1 markers other than VEGF-A and VEGFR-1; P values and
  Spearman coefficients. These feed no model. Fig. 2 (per-patient scatter plots) was not read:
  page rendering was refused in this job (see figures.md); it should be read in a later pass.
  Figure pass (2026-11-11): Fig. 2 was read by code (figures.yaml, figures/_fig2.py), each panel
  for men and women separately: 46/45/45/45 men and 11 women, every point with its interval. Added
  the Spearman coefficients, the legend and footnote counts and the width quartiles as data. Two
  processing models were added. fig2_group_stats recomputes from the points the Table 1/2 medians
  and quartiles, the medians of per-patient ratios, the men's Spearman coefficients and the
  counts; nearly all are reproduced, and the per-patient ratios settle q_ratio_of_medians.
  radius_per_patient applies the diffusion radius formula to each patient's plotted length
  density and compares the result with the plotted radius: the women agree, but every man's
  plotted radius is about 0.5% below the formula (q_fig2_radius_offset). The men's median and
  upper quartile of length density differ slightly from Table 2 (q_fig2_lv_men_median,
  q_fig2_percentile_method). See figures.md.
  Cross-paper consistency checks against rakusan1992, kaneko2011 and mohammed2015 were not
  entered: those records are being built in the same batch and have no data yet; note that this
  paper's values are length densities (mm/mm3), not capillaries per mm2 of transverse section.
