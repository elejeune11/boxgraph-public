id: female_vs_male_percentages
name: percentages by which women's group medians differ from men's
role: processing
from_words: true
stated: {page: 2, printed_page: "187", quote: "BSA of women was 90% of that of men", where: Results}
equation: "x% of = 100 f/m; x% greater = 100 (f/m - 1); x% lower = 100 (1 - f/m), with f and m the group medians (assumed)"
inputs:
  awc_m: {quantity: arteriolar_wall_area_per_circumference, unit: um^2/um}
  awc_f: {quantity: arteriolar_wall_area_per_circumference, unit: um^2/um}
  bsa_m: {quantity: body_surface_area, unit: m^2}
  bsa_f: {quantity: body_surface_area, unit: m^2}
  lbm_m: {quantity: lean_body_mass, unit: kg}
  lbm_f: {quantity: lean_body_mass, unit: kg}
  vegfa_m: {quantity: plasma_vegfa, unit: pg/mL}
  vegfa_f: {quantity: plasma_vegfa, unit: pg/mL}
  vegfr1_m: {quantity: plasma_vegfr1, unit: pg/mL}
  vegfr1_f: {quantity: plasma_vegfr1, unit: pg/mL}
  vratio_m: {quantity: vegfr1_vegfa_ratio, unit: dimensionless}
  vratio_f: {quantity: vegfr1_vegfa_ratio, unit: dimensionless}
outputs:
  awc_excess: {quantity: female_excess_pct, unit: percent}
  bsa_pct: {quantity: female_pct_of_male, unit: percent}
  lbm_pct: {quantity: female_pct_of_male, unit: percent}
  vegfa_excess: {quantity: female_excess_pct, unit: percent}
  vegfr1_deficit: {quantity: female_deficit_pct, unit: percent}
  vratio_deficit: {quantity: female_deficit_pct, unit: percent}
settings: {}
stochastic: false
