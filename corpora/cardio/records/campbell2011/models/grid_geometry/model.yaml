id: grid_geometry
name: area per grid point and grid squares per counting frame of the stereological grid
role: processing
from_words: true
stated: {page: 12, printed_page: "S4", quote: "within each unbiased counting frame there was a 40 µm orthogonal grid", where: "Supplement, Histological analysis"}
equation: "area per grid point = (grid spacing)^2; squares per frame = (frame side / grid spacing)^2"
inputs:
  s: {quantity: grid_spacing, unit: um}
  L: {quantity: counting_frame_side, unit: um}
outputs:
  a: {quantity: grid_point_area, unit: mm^2}
  n: {quantity: grid_squares_per_frame, unit: dimensionless}
settings: {}
stochastic: false
