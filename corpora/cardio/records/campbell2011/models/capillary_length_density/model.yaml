id: capillary_length_density
name: capillary length density from point and profile counts
role: processing
stated: {page: 12, printed_page: "S4", quote: "Capillary length density was calculated using the equation", where: "Supplement, Histological analysis"}
equation: "Length density = 2 · ∑C ÷ ∑Pt · 0.0016mm2"
described_from: ref-S8
inputs:
  C: {quantity: capillary_profile_count, unit: dimensionless}
  Pt: {quantity: grid_point_count, unit: dimensionless}
  a: {quantity: grid_point_area, unit: mm^2}
outputs:
  Lv: {quantity: capillary_length_density, unit: mm/mm^3}
runnable: false
not_runnable_reason: >
  The paper prints no capillary profile or grid point counts, for any patient or group, so the
  equation has nothing to be run on; Table 2 gives only the resulting length densities.
