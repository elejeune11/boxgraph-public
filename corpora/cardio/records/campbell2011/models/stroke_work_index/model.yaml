from_words: true
stated: {page: 3, printed_page: "188", quote: "Left ventricular stroke work index, g.m.m%2 per beat", where: "Table 1"}
equation: "stroke work index = stroke work / BSA (the unit 'g.m.m-2 per beat')"
inputs:
  SW: {quantity: lv_stroke_work, unit: g*m}
  B: {quantity: body_surface_area, unit: m^2}
outputs:
  SWI: {quantity: lv_stroke_work_index, unit: g*m/m^2}
settings: {}
stochastic: false
