- {id: sex, name: sex of the patient group, dimension: dimensionless, description: "used as a condition: male or female"}
- {id: statistic, name: summary statistic of a group, dimension: dimensionless, description: "used as a condition: median, 25th percentile or 75th percentile over the patients of a group"}
- {id: capillary_length_density, name: capillary length per unit volume of LV myocardium, dimension: "1/[length]**2", description: "stereological estimate from CD31-stained 4 um paraffin sections (immersion fixed, no shrinkage correction), one section per patient of unknown orientation"}
- {id: diffusion_radius, name: capillary diffusion radius, dimension: "[length]", description: "radius of the tissue cylinder served by one capillary, sqrt(1/(pi Lv))"}
- {id: cardiomyocyte_width, name: cardiomyocyte width, dimension: "[length]", description: "mean shortest diameter of nucleated cardiomyocyte profiles, reticulin-stained 4 um paraffin section"}
- {id: body_surface_area, name: body surface area, dimension: "[length]**2"}
- {id: lean_body_mass, name: lean body mass (Boer), dimension: "[mass]"}
- {id: width_per_bsa, name: cardiomyocyte width / BSA ratio, dimension: "1/[length]"}
- {id: width_per_lbm, name: cardiomyocyte width / lean body mass ratio, dimension: "[length]/[mass]"}
- {id: radius_per_bsa, name: diffusion radius / BSA ratio, dimension: "1/[length]"}
- {id: radius_per_lbm, name: diffusion radius / lean body mass ratio, dimension: "[length]/[mass]"}
- {id: radius_per_width, name: diffusion radius / cardiomyocyte width ratio, dimension: dimensionless}
- {id: arteriolar_wall_area_per_circumference, name: arteriolar wall area / circumference ratio, dimension: "[length]", description: "arterioles of 20-80 um mean diameter; a measure of wall thickness"}
- {id: cardiac_output, name: cardiac output, dimension: "[length]**3/[time]", description: "thermodilution (Swan-Ganz) immediately after induction of anesthesia"}
- {id: cardiac_index, name: cardiac index, dimension: "[length]/[time]", description: "cardiac output per m2 BSA"}
- {id: plasma_vegfa, name: plasma VEGF-A concentration, dimension: "[mass]/[length]**3"}
- {id: plasma_vegfr1, name: plasma VEGF receptor-1 concentration, dimension: "[mass]/[length]**3"}
- {id: vegfr1_vegfa_ratio, name: plasma VEGFR-1 / VEGF-A ratio, dimension: dimensionless}
- {id: female_pct_of_male, name: value in women as a percentage of that in men, dimension: dimensionless}
- {id: female_excess_pct, name: percentage by which the value in women exceeds that in men, dimension: dimensionless}
- {id: female_deficit_pct, name: percentage by which the value in women is lower than in men, dimension: dimensionless}
- {id: grid_spacing, name: spacing of the orthogonal counting grid, dimension: "[length]"}
- {id: counting_frame_side, name: side of the unbiased counting frame, dimension: "[length]"}
- {id: grid_point_area, name: section area associated with one grid point, dimension: "[length]**2"}
- {id: grid_squares_per_frame, name: number of grid squares per counting frame, dimension: dimensionless}
- {id: capillary_profile_count, name: summed number of capillary profiles counted in the frames, dimension: dimensionless}
- {id: grid_point_count, name: summed number of grid points lying on tissue, dimension: dimensionless}
- {id: lv_stroke_work, name: left ventricular stroke work per beat, dimension: "[mass]*[length]", description: "printed in g.m per beat (gram-metre, the clinical unit), intraoperative after induction of anesthesia"}
- {id: lv_stroke_work_index, name: left ventricular stroke work index per beat, dimension: "[mass]/[length]", description: "stroke work per m2 BSA, printed g.m.m^-2 per beat"}
- {id: myocardium_area_per_section, name: area of myocardium in the biopsy section, dimension: "[length]**2", description: "excludes epicardium"}
- {id: arterioles_per_section, name: number of arterioles counted in the biopsy section, dimension: dimensionless, description: "arterioles in approximate cross or oblique section with diameters 12-151 um"}
- {id: arteriolar_density, name: arterioles per mm2 of myocardium area in section, dimension: "1/[length]**2"}
# Added by the figure pass (Fig. 2)
- {id: spearman_rho_width_bsa, name: Spearman rank correlation of cardiomyocyte width with BSA over the patients of a group, dimension: dimensionless}
- {id: spearman_rho_radius_bsa, name: Spearman rank correlation of diffusion radius with BSA over the patients of a group, dimension: dimensionless}
- {id: spearman_rho_lv_bsa, name: Spearman rank correlation of capillary length density with BSA over the patients of a group, dimension: dimensionless}
- {id: spearman_rho_radius_width, name: Spearman rank correlation of diffusion radius with cardiomyocyte width over the patients of a group, dimension: dimensionless}
- {id: patient_count, name: number of patients with a value, dimension: dimensionless}
