# The circulation model's inputs are the same in every run except where a run overrides them
# (YAML merge key). All initial conditions not printed are in added.yaml.
- id: run_simplified
  model: circulation_valves
  inputs: &base
    CQao: CQao
    CQmi: CQmi
    CQpo: CQpo
    CQti: CQti
    Elvs: Elvs
    Elvd: Elvd
    Plv0: Plv0
    Vlv0: Vlv0
    Ela_max: Ela_max
    Ela_min: Ela_min
    Pla0: Pla0
    Vla0: Vla0
    Ervs: Ervs
    Ervd: Ervd
    Prv0: Prv0
    Vrv0: Vrv0
    Era_max: Era_max
    Era_min: Era_min
    Pra0: Pra0
    Vra0: Vra0
    Csas: Csas
    Rsas: Rsas
    Lsas: Lsas
    Csat: Csat
    Rsat: Rsat
    Lsat: Lsat
    Rsar: Rsar
    Rscp: Rscp
    Rsvn: Rsvn
    Csvn: Csvn
    Cpas: Cpas
    Rpas: Rpas
    Lpas: Lpas
    Cpat: Cpat
    Rpat: Rpat
    Lpat: Lpat
    Rpar: Rpar
    Rpcp: Rpcp
    Rpvn: Rpvn
    Cpvn: Cpvn
    Kp_ao: Kp_ao
    Kf_ao: Kf_ao
    Kb_ao: Kb_ao
    Kv_ao: Kv_ao
    Kp_mi: Kp_mi
    Kf_mi: Kf_mi
    Kb_mi: Kb_mi
    Kv_mi: Kv_mi
    Kp_po: Kp_po
    Kf_po: Kf_po
    Kb_po: Kb_po
    Kv_po: Kv_po
    Kp_ti: Kp_ti
    Kf_ti: Kf_ti
    Kb_ti: Kb_ti
    Kv_ti: Kv_ti
    theta_max_ao: theta_max_ao
    theta_min_ao: theta_min_ao
    theta_max_mi: theta_max_mi
    theta_min_mi: theta_min_mi
    theta_ref_mi: theta_max_mi
    theta_max_po: theta_max_po
    theta_min_po: theta_min_po
    theta_max_ti: theta_max_ti
    theta_min_ti: theta_min_ti
    T: T_period
    Ts1: Ts1_added
    Ts2: Ts2_added
    Tpwb: Tpwb
    Tpww: Tpww
    Vlv_init: Vlv_init_table2
    Vla_init: Vla_init_added
    Vrv_init: Vrv_init_table2
    Vra_init: Vra_init_added
    Psas_init: Psas_init_added
    Psat_init: Psat_init_added
    Psvn_init: Psvn_init_added
    Ppas_init: Ppas_init_added
    Ppat_init: Ppat_init_added
    Ppvn_init: Ppvn_init_added
  settings: {valve_model: on_off}
  outputs:
    Plv_max: plv_max_simplified_pred
    Plv_min: plv_min_simplified_pred
    Psas_max: psas_max_simplified_pred
    Psas_min: psas_min_simplified_pred
    Prv_max: prv_max_simplified_pred
    Ppas_max: ppas_max_simplified_pred
    CO: co_simplified_pred
    Vlv_max: vlv_max_simplified_pred
    Vlv_min: vlv_min_simplified_pred
    SV: sv_simplified_pred
    Qao_max: qao_max_simplified_pred
    Qmi_E: qmi_E_simplified_pred
    Qti_E: qti_E_simplified_pred
  note: "Section 3.1: on-off valves (Eq. 7); the leaflet-angle inputs are carried but unused."

- id: run_normal
  model: circulation_valves
  inputs: *base
  settings: {valve_model: dynamic, vortex_angle_factor: 1}
  outputs:
    Plv_max: plv_max_normal_pred
    Psas_max: psas_max_normal_pred
    Psas_ed: psas_ed_normal_pred
    Prv_max: prv_max_normal_pred
    Ppas_max: ppas_max_normal_pred
    Vlv_max: vlv_max_normal_pred
    Qao_max: qao_max_normal_pred
    Qmi_E: qmi_E_normal_pred
    Qti_E: qti_E_normal_pred
    Qao_rev: qao_rev_normal_pred
    Qpo_rev: qpo_rev_normal_pred
    Qmi_rev: qmi_rev_normal_pred
    Qti_rev: qti_rev_normal_pred
  note: "Section 3.2, Fig. 9: leaflet dynamics with the vortex term as printed in Eq. 14 (K_v Q sin theta)."

- id: run_normal_eq13
  model: circulation_valves
  inputs: *base
  settings: {valve_model: dynamic, vortex_angle_factor: 2}
  outputs:
    Plv_max: plv_max_normal_eq13_pred
    Qao_max: qao_max_normal_eq13_pred
    Qao_rev: qao_rev_normal_eq13_pred
    Qmi_rev: qmi_rev_normal_eq13_pred
    Qmi_E: qmi_E_normal_eq13_pred
  note: "Section 3.2 with the vortex term as printed in Eq. 13 (k_v Q sin 2 theta); see q_eq13_eq14."

- id: run_stenosis
  model: circulation_valves
  inputs:
    <<: *base
    theta_max_mi: theta_stenosis_mi
    theta_ref_mi: theta_max_mi
  settings: {valve_model: dynamic, vortex_angle_factor: 1}
  outputs:
    Plv_max: plv_max_stenosis_pred
    Qmi_E: qmi_E_stenosis_pred
    Qmi_dmin: qmi_dmin_stenosis_pred
    Qmi_A: qmi_A_stenosis_pred
  note: "Section 3.3.1: mitral leaflet limited at 50 deg; Eq. 8 keeps the healthy 75 deg in its denominator (added reading, q_stenosis_eq8)."

- id: run_regurgitation
  model: circulation_valves
  inputs:
    <<: *base
    theta_min_ao: theta_regurgitation_ao
  settings: {valve_model: dynamic, vortex_angle_factor: 1}
  outputs:
    Psas_ed: psas_ed_regurgitation_pred
    Qao_max: qao_max_regurgitation_pred
    Vlv_max: vlv_max_regurgitation_pred
  note: "Section 3.3.2: minimum aortic leaflet angle 25 deg."

- id: run_area_stenosis
  model: valve_area_eq8
  inputs: {theta: theta_stenosis_mi, theta_max: theta_max_mi}
  outputs: {AR: area_fraction_stenosis_pred}

- id: run_sv_printed
  model: stroke_volume
  inputs: {Vmax: vlv_max_simplified, Vmin: vlv_min_simplified}
  outputs: {SV: sv_from_printed_range}
  note: "the paper's own arithmetic on its printed volume range"

- id: run_drop_printed
  model: pressure_drop
  inputs: {P_normal: psas_ed_normal, P_case: psas_ed_regurgitation}
  outputs: {drop: drop_from_printed_pressures}
  note: "the paper's own arithmetic on its printed end-diastolic aortic pressures"
