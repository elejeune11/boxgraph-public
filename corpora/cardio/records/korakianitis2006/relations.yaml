# mapping: b's input symbol -> expression in a's input symbols, numbers in each model's port units
- id: rel_eq4_suga_pv_ratio
  kind: reduces_to
  a: korakianitis2006/lv_elastance_eq4
  b: suga1973/pv_ratio
  mapping: {P: "Plv", V: "Vlv", Vd: "Vlv0"}
  limit: {Plv0: "0"}
  regime: {Plv: [5, 150], Plv0: [0, 5], Vlv: [60, 160], Vlv0: [0, 20]}
  provenance: stated
  citation: {page: 4, printed_page: "1967", quote: "described with the pressure–volume relation using Suga et al’s, (1975) variable elastance model", where: "text, Sec. 2.1.1 and Eq. 4"}
  assumptions:
    - "The text cites 'Suga et al's, (1975)', but the only Suga work in the reference list is Suga, Sagawa and Shoukas 1973 (ref-suga1973), taken here as the work meant."
    - "Eq. 4 is Suga's E(t) = P(t)/[V(t) - Vd] with an added reference pressure P0; it reduces to Suga's ratio as P0 -> 0, with V0 playing the role of Vd."
