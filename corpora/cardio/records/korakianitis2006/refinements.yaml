- {id: ref_dt_simplified, run: run_simplified, setting: dt, factors: [1, 2, 4], mode: divide, output: Plv_max, tolerance: "0.5%", tolerance_basis: "added: a step error well below the gap between the printed peak pressures (126.4 vs 117.9 mmHg)", tolerance_added: true}
- {id: ref_dt_normal, run: run_normal, setting: dt, factors: [1, 2, 4], mode: divide, output: Plv_max, tolerance: "0.5%", tolerance_basis: "added: as for ref_dt_simplified", tolerance_added: true}
- {id: ref_dt_normal_rev, run: run_normal, setting: dt, factors: [1, 2, 4], mode: divide, output: Qao_rev, tolerance: "1%", tolerance_basis: "added: reverse-flow peaks are sharp; 1% of the printed 134.3 ml/s", tolerance_added: true}
- {id: ref_dt_stenosis, run: run_stenosis, setting: dt, factors: [1, 2, 4], mode: divide, output: Plv_max, tolerance: "0.5%", tolerance_basis: "added: as for ref_dt_simplified", tolerance_added: true}
- {id: ref_dt_regurgitation, run: run_regurgitation, setting: dt, factors: [1, 2, 4], mode: divide, output: Psas_ed, tolerance: "0.5%", tolerance_basis: "added: as for ref_dt_simplified", tolerance_added: true}
