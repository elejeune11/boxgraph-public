- id: q_eq3_activation
  kind: possible_error
  about: [circulation_valves, Elvs, Elvd]
  text: >
    Eq. 3 as printed gives e(t) = cos(pi t/T_s1), which falls from +1 to -1 over 0 <= t < T_s1, then
    cos(pi (t + T_s2 - T_s1)/T_s1), then 0. With Eq. 2 and the Table 1 values this makes the left
    ventricular elastance range from 0.1 + 1.2 = 1.3 to 0.1 - 1.2 = -1.1 mmHg/ml, i.e. negative, and
    discontinuous at t = 0, T_s1 and T_s2. The paper's Fig. 2 instead shows the elastance rising
    smoothly from about 0.1 to 2.5 mmHg/ml and back, which Eq. 2 gives only with e(t) between 0 and
    2 (e.g. 1 - cos(pi t/T_s1), then 1 + cos(pi (t - T_s1)/(T_s2 - T_s1))). The record runs Eq. 3 as
    printed; every circulation result rests on it.
  citation: {page: 4, printed_page: "1967", quote: "A commonly used ventricular activation function is used", where: "Eq. 3, Fig. 2"}
- id: q_eq6_sign
  kind: possible_error
  about: [circulation_valves]
  text: >
    The second branch of Eq. 6 (P_lv < P_sas) is printed as +CQ AR sqrt(P_sas - P_lv), with no minus
    sign, so the valve flow is never negative and the reverse flows the paper reports (134.3, 77.3,
    298.7, 306.9 ml/s) cannot arise. In the on-off model Eq. 7 sets AR = 0 on that branch, so the
    sign matters only for the leaflet-dynamics runs. The record runs Eq. 6 as printed.
  citation: {page: 5, printed_page: "1968", quote: "the basic pressure–ﬂow relation in the aortic valve is", where: Eq. 6}
- id: q_eq13_eq14
  kind: possible_error
  about: [circulation_valves, run_normal, run_normal_eq13]
  text: >
    Eq. 13 gives the vortex force as k_v Q sin(2 theta), consistent with the stated assumption that
    vortex intensity is largest at a 45 deg opening, but the combined Eq. 14 has K_v Q sin(theta).
    Both are run (vortex_angle_factor 1 and 2); the default follows Eq. 14.
  citation: {page: 6, printed_page: "1969", quote: "vortex intensity reaches the maximum value when the", where: "Eqs. 13-14"}
- id: q_eq18_psas
  kind: possible_error
  about: [circulation_valves]
  text: >
    Eq. 18 drives the systemic artery flow Q_sat with P_sas - P_svn (the aortic sinus pressure), not
    P_sat - P_svn as the analogy with Eq. 16 would suggest; with Eq. 18 as printed the artery
    compliance C_sat is charged by Q_sas but does not drive downstream flow. The record runs Eq. 18
    as printed and uses the same form for the pulmonary loop ("similar to that of the systemic
    loop").
  citation: {page: 6, printed_page: "1969", quote: "and the ﬂow rate equation is", where: Eq. 18}
- id: q_table3_units
  kind: possible_error
  about: [Kb_ao, Kv_ao, Kb_mi, Kv_mi, Kb_po, Kv_po, Kb_ti, Kv_ti, Kp_mi]
  text: >
    Table 3 prints K_b and K_v in rad/(s m). In Eq. 14 K_b Q and K_v Q must be angular accelerations
    (rad/s2) with Q in ml/s (the unit of CQ in Table 1), which needs rad/(s ml); rad/(s m) is not
    dimensionally possible. The values are entered as rad/(s ml). K_p,mi is printed in m/(s2 mmHg)
    while the other three K_p are rad/(s2 mmHg); entered as rad/(s2 mmHg).
  citation: {page: 7, printed_page: "1970", quote: "Parameters for variable valve opening model", where: Table 3}
- id: q_ts1_ts2
  kind: unstated_input
  about: [Ts1_added, Ts2_added, Ts]
  text: >
    Eq. 3 needs T_s1 (peak of systole) and T_s2 (end of systole). Table 5 gives only Ts = 0.3 s,
    called "systolic duration" in the text. Fig. 2 suggests T_s1 = 0.3 s and T_s2 = 0.45 s, which are
    the values added; if Ts is the end of systole the activation would be much shorter.
  citation: {page: 8, printed_page: "1971", quote: "Ts 0.3 s", where: Table 5}
- id: q_initial_conditions
  kind: unstated_input
  about: [Vla_init_added, Vra_init_added, Psas_init_added, Psat_init_added, Psvn_init_added, Ppas_init_added, Ppat_init_added, Ppvn_init_added, Vlv_init_table2, Vrv_init_table2]
  text: >
    No initial conditions are stated. In this closed loop (vessel pressures are V/C with no
    unstressed volume) the initial state fixes the circulating volume, which sets the level of every
    pressure, flow and volume in the periodic solution, so the added initial values can change every
    verdict.
  citation: {page: 8, printed_page: "1971", quote: "The dynamic system often reaches periodic", where: text}
- id: q_vlv0_table2
  kind: reading
  about: [Vlv_init_table2, Vrv_init_table2]
  text: >
    Table 2 lists "V_lv0 = 800 ml" under Systemic circulation and "V_rv0 = 500 ml" under Pulmonary
    circulation, while Table 1 already gives V_lv,0 = 5 ml and V_rv,0 = 10 ml as the Eq. 4 reference
    volumes. They are read here as initial left and right ventricular volumes (subscript 0 also
    means "initial value"); they may instead be initial volumes of the systemic and pulmonary loops
    (e.g. of the veins), which would change the circulating volume.
  citation: {page: 7, printed_page: "1970", quote: "V lv0 800 ml", where: Table 2}
- id: q_vena_cava
  kind: unstated_model
  about: [Csvc, Cpvc]
  text: >
    Table 2 gives vena cava compliances C_svc and C_pvc (1.5 ml/mmHg), but no equation uses them and
    Fig. 1 has no vena cava element ("The combined effect of venule, vein, and vena cava is modelled
    as the vein segment"). They are recorded but feed no run.
  citation: {page: 4, printed_page: "1967", quote: "The combined effect of venule, vein, and vena cava", where: text}
- id: q_angle_limits
  kind: choice
  about: [circulation_valves]
  text: >
    The paper does not say how the leaflet angle is kept within [theta_min, theta_max] (Table 4).
    The model clamps theta at the limit and sets its angular velocity to zero when it moves outward,
    and starts every leaflet at theta_min at rest. Eq. 14 also holds no explicit stop.
  citation: {page: 8, printed_page: "1971", quote: "Valve opening angle", where: Table 4}
- id: q_scheme
  kind: numerics
  about: [circulation_valves]
  text: >
    The integration scheme of the authors' C program is not stated; only the step DT = 0.0001 s.
    The model uses classical fourth-order Runge-Kutta at that step (setting scheme: rk4; euler is
    the alternative), with the angle limits applied after each step.
  citation: {page: 7, printed_page: "1970", quote: "program is developed in C language to simulate the", where: text}
- id: q_stenosis_eq8
  kind: choice
  about: [run_stenosis, circulation_valves]
  text: >
    For mitral stenosis the maximum mitral angle is changed to 50 deg. If theta_max in the
    denominator of Eq. 8 were also changed, the fully open valve would still have AR = 1 and the
    valve would not be narrowed; the text's "24% of the original valve area" implies the original
    75 deg is kept as reference. The run limits the leaflet at 50 deg and keeps 75 deg in Eq. 8.
  citation: {page: 13, printed_page: "1976", quote: "changed from 75 to 50 , corresponding to 24% of the", where: text}
- id: q_area_24
  kind: unexplained_difference
  about: [area_fraction_stenosis, valve_area_eq8]
  text: >
    The printed "24% of the original valve area" for a 50 deg maximum angle is checked against Eq. 8
