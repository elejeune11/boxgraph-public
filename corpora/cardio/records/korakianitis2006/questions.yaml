    output, not with a measurement. Nor does this record hold a measurement for svzerod_code's models:
    every figure here is model output (figures.md), and the observations this paper says its results
    agree with ("illustrations presented in textbooks") are in neither record. circulation_onoff_corrected
    and svzerod_code/coronary_kim2010_ode share only a port shape (a flow from an inertance, a
    resistance, a pressure and a time): one is a closed-loop circulation with chambers and valves, the
    other an open-loop coronary bed, and neither predicts a quantity the other measures. How the
    release's chamber and valve blocks (ChamberElastanceInductor, ValveTanh) relate to this paper's
    elastance and valve equations is a relation between models for the later job, not a validation.
