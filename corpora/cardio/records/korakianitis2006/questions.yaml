    shape of circulation_onoff_corrected and korakianitis_cellml/closed_loop_onoff is a relation
    between models (the code is this model as released), left for the later job; that record already
    compares the code with this paper's printed results as reproduction. The only observations this
    paper invokes are qualitative: valve motion that "coincides with the illustrations presented in
    textbooks" for echo-cardiography. They are in neither record and quantify nothing.
  citation: {page: 11, quote: "illustrations presented in textbooks (Berne and Levy"}
- id: q_no_cross_validation_shi_cellml_westkessel
  kind: unstated_model
  about: [circulation_onoff_corrected, circulation_valves, circulation_waveform]
