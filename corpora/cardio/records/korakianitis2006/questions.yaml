- id: q_no_cross_validation_shi2018
  kind: unstated_model
  about: [circulation_valves, circulation_waveform]
  text: >
    Cross-validation against shi2018 finds nothing to test. shi2018 holds no measurement: its data
    are the Section 3 results of its own Fig. 1(d) simulation (origin predicted, derived), and its
    figure readings are all of Fig. 5, which is model output ("simulated with the CellML model"; its
    figures.md: "The paper plots no measured data"). Running a model here against those values would
    compare two model outputs (shi2018 assigns "the same values as in [5]", i.e. this paper's
    parameters), which is a relation between models for the later job, not a validation. The data
    this paper says its results agree with ("results illustrated in cardiology textbooks") are in
    neither record.
  citation: {page: 1, printed_page: "1964", quote: "The predicted results agree well with results illustrated in cardiology textbooks"}
- id: q_no_cross_validation_shi_cellml_systemic
  kind: unstated_model
  about: [circulation_valves, circulation_waveform]
  text: >
    Cross-validation against shi_cellml_systemic finds nothing to test. That record is CellML
    code: its data are code parameters (origin reported, 22 of them linked to this paper's Tables
    1, 2 and 5) and results copied from shi2018 and from this paper (predicted, derived), with no
    figure readings. It holds no measurement, so no model here has anything of it to be validated
    against. Running circulation_valves against its copied predictions would compare model with
    model, largely with this paper's own numbers; how the code's left-heart-plus-systemic circuit
    relates to circulation_valves is a relation between models for the later job. Nor does this
    record hold a measurement for the code to be validated against: its figures are all model
    output, and the data this paper says its results agree with ("results illustrated in
    cardiology textbooks") are in neither record.
  citation: {page: 1, printed_page: "1964", quote: "The predicted results agree well with results illustrated in cardiology textbooks"}
- id: q_no_cross_validation_shi_cellml_windkessel
  kind: unstated_model
  about: [circulation_valves, circulation_waveform]
  text: >
    Cross-validation against shi_cellml_windkessel finds nothing to test. That record is the
    CellML code of shi2018's Fig. 1(a) model (left heart with a two-element Windkessel): its data
    are code parameters (origin reported, the heart ones linked to this paper's Tables 1, 2 and 5)
