  citation: {page: 13, printed_page: "1976", quote: "changed from 75 to 50 , corresponding to 24% of the", where: text}
- id: q_theta_min_ao
  kind: possible_error
  about: [theta_min_ao, theta_min_ao_text]
  text: >
    Table 4 gives theta_min,ao = 5 deg, but Section 3.3.2 says the minimum aortic angle "is changed
