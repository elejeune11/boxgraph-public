- id: q_audit_variant_residuals
  kind: unexplained_difference
  about: [circulation_valves_corrected, circulation_valves_corrected_sin, ppas_peak_normal, ppas_peak_simplified, prv_peak_normal, prv_peak_simplified, qpo_rev_normal, qmi_A_stenosis, qmi_max_stenosis, Vlv_init_cellml]
  text: >
    (Audit, revisit.) With Eqs. 3, 6 and 18 corrected and the CellML LV initial volume (500 ml), the
