  citation: {page: 1, printed_page: "1964", quote: "The predicted results agree well with results illustrated in cardiology textbooks"}
- id: q_no_cross_validation_suga1973
  kind: unstated_model
  about: [elastance_eq2_5, lv_elastance_eq4, circulation_valves]
  text: >
    Cross-validation against suga1973 (ref-suga1973) finds nothing to test. This paper says it uses
    "Suga et al's, (1975) variable elastance model" (p. 4): the dog measurements are where its model
    comes from, and it does not claim to predict them. suga1973's measurements are per-dog Emax, Tmax,
    Vd, heart rate and dP/dt (Tables 1, 2) and the normalized curves EN(t/Tmax) of Fig. 5 (en_fig5_s1
    to s4). Emax and Tmax correspond to this paper's inputs (E_lv,s and T_s1, Table 1, human values),
    not its outputs, so no model here predicts them. elastance_eq2_5 gives e_lv in mmHg/ml against
    time in s; Fig. 5 is a dimensionless E(t)/Emax against a dimensionless t/Tmax. A comparison would
    need a normalized output and a normalized time input, which no model of this record has. Eq. 3 as
    printed does not even give a curve that rises to a peak at T_s1 (q_eq3_activation). Equating the
    two would map quantities that only play the same role, so no validation was added. In the other
    direction, this record holds no measurement for suga1973's models: every figure here is model
    output.
  citation: {page: 4, printed_page: "1967", quote: "described with the pressure volume relation using Suga"}
- id: q_no_cross_validation_ursino1998
  kind: unstated_model
  about: [circulation_valves, circulation_waveform, stroke_volume]
  text: >
    Cross-validation against ursino1998 (ref-ursino1998) finds no measurement that a model here
    predicts. This paper cites Ursino (1998) only as a source of loop parameters (Table 2), not as
    data its model explains. The shared shape of circulation_valves and
    ursino1998/circulation_baroreflex is a relation between models, left for the later job.
    ursino1998's measurements all come from cited works:
    afferent firing against carotid sinus pressure (Fig. 3 top, Chapleau and Abboud); cardiac
    output against carotid sinus pressure (Fig. 5 bottom, Kostiuk et al.); dSV/dHR normalized to
    its value at 80 beats/min against paced heart rate (Fig. 6 bottom, Melbin et al.); venous
    volume shifts, heart period change, total resistance, and normalized mean arterial pressure
    and cardiac output against normalized carotid sinus pressure (Fig. 7: Brunner, Eckberg and
    Sleight, Cox, Shoukas, Schmidt); mean arterial pressure at several carotid pulse amplitudes
    (Fig. 8B, Schmidt et al.); and percent changes after hemorrhage in intact dog (Fig. 9 top,
    Kumada et al.). Every one except Fig. 6 bottom is a response to carotid sinus pressure or to
    the baroreflex. circulation_valves has neither: it has no afferent pathway, and its
    resistances, elastances and period are fixed. Under those conditions it gives no such output.
    The hemorrhage changes need the reflex (intact dog) and a percent-change output that no model
    here has. Fig. 6 bottom is a normalized derivative of stroke volume over heart rate, measured
    in dog. stroke_volume and circulation_valves give SV at one period T. Their T_s1 and T_s2 are
    fixed in s (Table 1) and do not scale with rate, and no model here outputs dSV/dHR or its
    normalization. A finite difference of runs would be a new derived model, and it would set
    human parameters against dog data. No validation was added.
  citation: {page: 7, quote: "Parameter settings for systemic and pulmonary loops are"}
- id: q_no_cross_validation_korakianitis_cellml
  kind: unstated_model
  about: [circulation_valves, circulation_onoff_corrected, circulation_waveform]
  text: >
    Cross-validation with korakianitis_cellml finds nothing to test in either direction. Neither
    record holds a measurement. korakianitis_cellml is the released CellML code of this paper's
    on-off valve model: its data are code parameters and initial values (origin reported, linked to
    this paper's Tables 1-2) and the Section 3.1 results it copies from this paper (predicted). It
    has no figure readings. This record's data are inputs and model results, and its figure readings
