  citation: {page: 15, printed_page: "1978", quote: "changed from 0 to 25 , leaving a clearance for leakage", where: text}
- id: q_tricuspid_systole
  kind: reading
  about: [qti_systole_simplified, qti_systole_normal]
  text: >
    "In early systole the peak aortic flow increases from 983.4 to 1128.3 ml/s, and the peak
    tricuspid flow also increases from 712.1 to 844.1 ml/s." The tricuspid valve is closed in early
    systole; by symmetry with the aortic flow this is probably the pulmonary valve flow (Fig. 5(e)
    shows Q(pa) peaking near 730 ml/s). Recorded as printed and not compared.
  citation: {page: 13, printed_page: "1976", quote: "peak tricuspid ﬂow also increases from 712.1 to 844.1 ml/s", where: text}
- id: q_e_peak_window
  kind: choice
  about: [circulation_valves]
  text: >
    The statistics of the analysed cycle (10-11 s) are defined by the reader: E peak = largest
    atrioventricular flow between T_s2 and T_pb; A peak = largest after T_pb; reverse-flow amplitude =
    minus the most negative valve flow; end-diastolic aortic pressure = P_sas at t = 10 s; cardiac
    output = mean aortic valve flow. The paper does not define them.
  citation: {page: 13, printed_page: "1976", quote: "corresponding to the E velocity peak increases", where: text}
- id: q_e_wave_atrial_wrap
  kind: choice
  about: [circulation_valves, Tpwb, Tpww]
  text: >
    T_pb + T_pw = 1.01 s exceeds T = 1 s; Eq. 5 as printed defines e(t) only on 0 <= t < T, so the
    last 0.01 s of atrial activation is cut off at the end of each cycle rather than wrapped into the
    next. The model follows Eq. 5 as printed.
  citation: {page: 8, printed_page: "1971", quote: "T pww 0.09 s", where: Table 5}
- id: q_audit_about_values
  kind: reading
  about: [co_simplified, vlv_max_simplified, vlv_min_simplified, qmi_max_stenosis, qmi_min_stenosis, qmi_A_stenosis, psas_ed_drop_regurgitation]
  text: >
