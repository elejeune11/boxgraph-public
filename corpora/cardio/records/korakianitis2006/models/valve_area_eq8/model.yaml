id: valve_area_eq8
name: valve open area fraction from leaflet angle (Eq. 8)
role: model
stated: {page: 5, printed_page: "1968", quote: "decided by the angular position of the valve leaﬂets", where: Eq. 8}
equation: "AR = A(1 - cos theta)^2 / (A(1 - cos theta_max)^2) = (1 - cos theta)^2/(1 - cos theta_max)^2"
inputs:
  theta: {quantity: leaflet_max_angle, unit: deg, description: "the leaflet angle whose open area is wanted (here the reduced maximum angle)"}
  theta_max: {quantity: leaflet_max_angle, unit: deg, description: "the reference (original) maximum angle"}
outputs:
  AR: {quantity: valve_area_fraction, unit: percent}
settings: {}
stochastic: false
