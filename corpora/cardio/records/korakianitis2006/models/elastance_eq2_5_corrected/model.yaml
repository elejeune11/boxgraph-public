id: elastance_eq2_5_corrected
name: left ventricular and left atrial elastance at an instant t (Eqs. 2, 5 as printed; Eq. 3 corrected), for Fig. 2
role: model
stated: {page: 4, printed_page: "1967", quote: "The time-varying left ventricular elastance, illustrated in", where: "Eqs. 2-3, 5; Fig. 2"}
variant_of: elastance_eq2_5
corrections:
  - equation: Eq. 3
    change: "ventricular activation e(t) = 1 - cos(pi t/T_s1) for 0 <= t <= T_s1, 1 + cos(pi (t - T_s1)/(T_s2 - T_s1)) for T_s1 < t <= T_s2, 0 after, instead of the printed cos(pi t/T_s1) and cos(pi (t + T_s2 - T_s1)/T_s1)"
    evidence: "Fig. 2 (p. 4, reading fig2_elv) shows E(lv) rising smoothly from about 0.1 to 2.5 mmHg/ml at 0.3 s and back by 0.45 s, never negative; Eq. 3 as printed with Eq. 2 gives 1.3 mmHg/ml at t = 0 and -1.1 mmHg/ml at T_s1, a negative elastance. The authors' CellML code has exactly this form: shi_cellml_systemic, EVentricle.cellml line 20 (et = 1 - cos(3.14159 mt/(Ts1 T)), then 1 + cos(3.14159 (mt - Ts1 T)/((Ts2 - Ts1) T)), then 0)."
equation: >
  e_lv(t) = E_lv,d + (E_lv,s - E_lv,d)/2 e(t) (2); e(t) = 1 - cos(pi t/T_s1), 0<=t<=T_s1;
  1 + cos(pi (t - T_s1)/(T_s2 - T_s1)), T_s1<t<=T_s2; 0, T_s2<t<T (3, corrected), t taken within the period;
  atrium as printed (5): e(t) = 1 - cos((t - T_pb)/T_pw 2pi), T_pb<=t<T_pb+T_pw, else 0
built_from: [circulation_valves_corrected]
inputs:
  Elvs: {quantity: chamber_elastance, unit: mmHg/ml}
  Elvd: {quantity: chamber_elastance, unit: mmHg/ml}
  Ela_max: {quantity: chamber_elastance, unit: mmHg/ml}
  Ela_min: {quantity: chamber_elastance, unit: mmHg/ml}
  T: {quantity: heart_period, unit: s}
  Ts1: {quantity: time_peak_systole, unit: s}
  Ts2: {quantity: time_end_systole, unit: s}
  Tpwb: {quantity: p_wave_onset, unit: s}
  Tpww: {quantity: p_wave_duration, unit: s}
  t: {quantity: time, unit: s, description: "time since the start of the simulation (Fig. 2's t axis)"}
outputs:
  Elv: {quantity: lv_elastance, unit: mmHg/ml}
  Ela: {quantity: la_elastance, unit: mmHg/ml}
settings: {}
stochastic: false
