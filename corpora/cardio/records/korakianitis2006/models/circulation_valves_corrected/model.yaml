id: circulation_valves_corrected
name: closed-loop circulation (Eqs. 1-20) with the evident misprints of Eqs. 3, 6, 14 and 18 corrected
role: model
stated: {page: 3, printed_page: "1966", quote: "provided in Fig. 1. The system is modelled in three", where: "Eqs. 1-20, Fig. 1"}
variant_of: circulation_valves
corrections:
  - equation: Eq. 3
    change: "ventricular activation e(t) = 1 - cos(pi t/T_s1) for 0 <= t <= T_s1, 1 + cos(pi (t - T_s1)/(T_s2 - T_s1)) for T_s1 < t <= T_s2, 0 after, instead of the printed cos(pi t/T_s1) and cos(pi (t + T_s2 - T_s1)/T_s1)"
    evidence: "Fig. 2 (p. 4, reading fig2_elv) shows E(lv) rising smoothly from about 0.1 to 2.5 mmHg/ml at 0.3 s and back by 0.45 s, never negative; Eq. 3 as printed with Eq. 2 gives 1.3 mmHg/ml at t = 0 and -1.1 mmHg/ml at T_s1, a negative elastance. The authors' CellML code has exactly this form: shi_cellml_systemic, EVentricle.cellml line 20 (et = 1 - cos(3.14159 mt/(Ts1 T)), then 1 + cos(3.14159 (mt - Ts1 T)/((Ts2 - Ts1) T)), then 0)."
  - equation: Eq. 6
    change: "Q_ao = -CQ_ao AR_ao sqrt(P_sas - P_lv) for P_lv < P_sas (minus sign on the second branch), and likewise for the other three valves"
    evidence: "The printed second branch is positive, so valve flow could never be negative, yet the paper reports reverse flows of 134.3, 77.3, 298.7 and 306.9 ml/s (p. 13) and plots negative valve flows (Figs. 9(b), 9(e), 13(b)). The authors' CellML code has the minus sign: shi_cellml_systemic, TempCDv.cellml line 48 (Qo = -1 CV Tao |Po - Pi|^0.5 for Pi < Po)."
  - equation: Eq. 14
    change: "vortex term K_v Q sin(2 theta) (Eq. 13's form) instead of the printed K_v Q sin(theta)"
    evidence: "Eq. 13 (p. 6) prints k_v Q sin 2theta, and the text above it says the vortex intensity 'reaches the maximum value when the leaflet is at about 45 deg' and falls below and above 45 deg, which sin(2 theta) does and sin(theta) (maximum at 90 deg) does not. No released code of the valve dynamics exists; the other reading (Eq. 14 as printed) is variant circulation_valves_corrected_sin."
  - equation: Eq. 18
    change: "dQ_sat/dt = (P_sat - P_svn - (R_sat + R_sar + R_scp) Q_sat)/L_sat, P_sat instead of the printed P_sas; the pulmonary loop likewise with P_pat"
    evidence: "The text says 'the pressure and flow rate changes in the artery are similar to those in the aortic sinus' (p. 6), i.e. Eq. 16's form with the segment's own pressure; with P_sas the artery compliance C_sat is charged but never discharges into the flow it drives. Fig. 1 (p. 4) draws C_sat at the artery's inlet node P_sat and Q_sat leaving that node through R_sat and L_sat. The authors' CellML code drives the artery flow with the artery pressure: shi_cellml_systemic, TempRLC.cellml line 25 (dP/dt = (Qi - Qo)/C; dQo/dt = (Pi - Po - R Qo)/L) applied to Sat, whose Pi is the artery pressure and whose Po is the arteriole inlet (ModelSys.cellml lines 69-79), with the arteriole and capillary in series as pure resistances (TempR.cellml line 19), which gives (P_sat - P_svn - (R_sat + R_sar + R_scp) Q_sat)/L_sat."
equation: >
  as circulation_valves (Eqs. 1-20 as printed) except: e(t) = 1 - cos(pi t/T_s1), 0<=t<=T_s1;
  1 + cos(pi (t - T_s1)/(T_s2 - T_s1)), T_s1<t<=T_s2; 0, T_s2<t<T (3, corrected);
  Q_ao = -CQ_ao AR_ao sqrt(P_sas - P_lv), P_lv<P_sas (6, corrected);
  vortex term -K_v,ao Q_ao sin 2theta, Q_ao>=0 (14, corrected to Eq. 13's form);
  dQ_sat/dt = (P_sat - P_svn - (R_sat + R_sar + R_scp) Q_sat)/L_sat (18, corrected), pulmonary loop likewise
built_from: [circulation_valves]
