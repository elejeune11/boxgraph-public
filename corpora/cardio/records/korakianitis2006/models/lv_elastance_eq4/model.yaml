id: lv_elastance_eq4
name: left ventricular elastance from pressure and volume (Eq. 4 solved for e_lv)
role: model
stated: {page: 4, printed_page: "1967", quote: "The pressure in the left ventricle is then derived from the", where: "Eq. 4"}
equation: "Plv = Plv,0 + elv (Vlv - Vlv,0) (4), here solved for elv = (Plv - Plv,0)/(Vlv - Vlv,0)"
built_from: [circulation_valves]
inputs:
  Plv: {quantity: lv_pressure, unit: mmHg}
  Plv0: {quantity: chamber_reference_pressure, unit: mmHg}
  Vlv: {quantity: lv_volume, unit: ml}
  Vlv0: {quantity: chamber_reference_volume, unit: ml}
outputs:
  elv: {quantity: lv_elastance, unit: mmHg/ml}
settings: {}
stochastic: false
