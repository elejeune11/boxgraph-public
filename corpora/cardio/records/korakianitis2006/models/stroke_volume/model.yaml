id: stroke_volume
name: stroke volume as the range of left ventricular volume
role: processing
stated: {page: 9, printed_page: "1972", quote: "changes approximately between 50 and 120 ml, with a", where: text}
equation: "SV = V_max - V_min (the paper's arithmetic, implied by 'between 50 and 120 ml, with a stroke volume of 70 ml')"
inputs:
  Vmax: {quantity: lv_volume_max, unit: ml}
  Vmin: {quantity: lv_volume_min, unit: ml}
outputs:
  SV: {quantity: stroke_volume, unit: ml}
settings: {}
stochastic: false
