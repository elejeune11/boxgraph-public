  t_end: 12.2           # added: long enough for every plotted window (Figs. 5-13: 9.8-11.2 s; Figs. 4, 8: 10.9-12.1 s)
  t_record: 9.7
  valve_model: dynamic  # dynamic: Eqs. 8 and 14; on_off: Eq. 7
  vortex_angle_factor: 2  # the Eq. 14 correction: sin(2 theta), as in Eq. 13
  scheme: rk4           # added, as in circulation_valves (q_scheme)
stochastic: false
