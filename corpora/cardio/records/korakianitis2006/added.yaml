- id: Ts1_added
  quantity: time_peak_systole
  unit: s
  printed: "0.3"
  basis: >
    Eq. 3 needs T_s1 (peak of systolic phase); Table 5 gives only "Ts = 0.3 s" (systolic duration),
    and Fig. 2 shows the left ventricular elastance peaking about 0.3 s after the cycle starts.
    The authors' CellML implementation (shi_cellml_systemic, ParaLeftHeart) uses Ts1 = 0.3 T.
  alternatives: ["0.2", "0.25"]
  stands_for: T_s1 in Eq. 3
- id: Ts2_added
  quantity: time_end_systole
  unit: s
  printed: "0.45"
  basis: >
    Eq. 3 needs T_s2 (end of systolic phase), which is not stated. Fig. 2 shows the elastance back
    at its diastolic value about 0.45 s after the cycle starts; the authors' CellML implementation
    uses Ts2 = 0.45 T. If "Ts = 0.3 s" in Table 5 is the end of systole, T_s2 would be 0.3 s.
  alternatives: ["0.3", "0.5"]
  stands_for: T_s2 in Eq. 3
