- id: Psvn_init_added
  quantity: initial_vessel_pressure
  unit: mmHg
  printed: "0"
  basis: >
    Not stated. The authors' CellML implementation starts the systemic vein at 0 mmHg. In a closed
    loop the initial state fixes the circulating volume, so this choice changes every result.
    If Table 2's "V_lv0 = 800 ml" is instead an initial systemic venous volume, P_svn would start
    at 800/20.5 = 39 mmHg.
  alternatives: ["5", "39"]
  stands_for: initial P_svn
- id: Ppas_init_added
  quantity: initial_vessel_pressure
  unit: mmHg
  printed: "20"
  basis: Not stated; a pulmonary arterial pressure within the range the paper reports (peak 26.8 mmHg).
  alternatives: ["10", "25"]
  stands_for: initial P_pas
- id: Ppat_init_added
  quantity: initial_vessel_pressure
  unit: mmHg
  printed: "20"
