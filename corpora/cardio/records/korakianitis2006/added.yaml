  stands_for: initial P_pat
- id: Ppvn_init_added
  quantity: initial_vessel_pressure
  unit: mmHg
  printed: "0"
  basis: >
    Not stated; taken like the systemic vein. If Table 2's "V_rv0 = 500 ml" is an initial
    pulmonary venous volume, P_pvn would start at 500/20.5 = 24 mmHg.
  alternatives: ["5", "24"]
  stands_for: initial P_pvn
- id: Vlv_init_cellml
  quantity: initial_chamber_volume
  unit: ml
  printed: "500"
  basis: >
    (Revisit, audit.) An alternative to the record's choice Vlv_init_table2 (Table 2's "V_lv0 = 800 ml"
    read as the initial LV volume, q_vlv0_table2), which every printed-model run keeps. The authors'
    released CellML code starts the left ventricle at 500 ml: shi_cellml_systemic, ParaLeftHeart.cellml
    line 27 (Vlv0 = 500 UnitV), with the left atrium at 20 ml (line 28, the record's Vla_init_added),
    the aortic sinus and artery at 100 mmHg (ParaSys.cellml lines 17 and 23) and the vein at 0 mmHg
    (line 32), as the record already uses. The code has no right heart or pulmonary loop, so it
    states no right-side initial volume. Used only by the _ic runs of the corrected variants.
  alternatives: ["800"]
  stands_for: initial left ventricular volume V_lv(0)
