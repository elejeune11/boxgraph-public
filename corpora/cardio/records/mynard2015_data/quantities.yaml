- {id: blood_density, name: blood density, dimension: "[mass]/[length]**3"}
- {id: wave_speed_coef_k1, name: wave-speed coefficient k1 of Eq. 3, dimension: "[mass]/[length]/[time]**2", description: "Amplitude of the diameter-dependent term of Eh/D0 (Eq. 3)"}
- {id: wave_speed_coef_k2, name: wave-speed exponent coefficient k2 of Eq. 3, dimension: "1/[length]", description: "Rate of the exponential in diameter of Eh/D0 (Eq. 3)"}
- {id: wave_speed_coef_k3, name: wave-speed coefficient k3 of Eq. 3, dimension: "[mass]/[length]/[time]**2", description: "Diameter-independent term of Eh/D0 (Eq. 3)"}
- {id: vessel_diameter, name: reference vessel diameter, dimension: "[length]", description: "Diameter of a 1D segment at its reference pressure (D0), here from its released reference area A0"}
- {id: vessel_radius, name: reference vessel radius, dimension: "[length]", description: "Radius of a 1D segment at its reference pressure"}
- {id: reference_wave_speed, name: reference wave speed c0 of a 1D segment, dimension: "[length]/[time]"}
- {id: segment_count, name: number of 1D segments in a network, dimension: dimensionless}
- {id: junction_count, name: number of junctions of 1D segments, dimension: dimensionless, description: "Points where the ends of two or more 1D segments meet"}
- {id: bifurcation_count, name: number of bifurcations in a 1D tree, dimension: dimensionless}
- {id: fractal_exponent, name: fractal exponent xi relating parent and daughter diameters (Eq. 2), dimension: dimensionless}
- {id: asymmetry_ratio, name: asymmetry ratio gamma of a bifurcation (Eq. 2), dimension: dimensionless, description: "Squared radius of the smaller daughter over that of the larger"}
- {id: length_radius_ratio, name: length/radius ratio of a pulmonary arterial segment, dimension: dimensionless}
- {id: vein_artery_diameter_ratio, name: vein-to-artery diameter ratio of a paired terminal vein and artery, dimension: dimensionless}
- {id: vascular_compliance, name: compliance of a vascular region, dimension: "[length]**4*[time]**2/[mass]"}
- {id: vascular_resistance, name: vascular resistance of a circulation (systemic or pulmonary), dimension: "[mass]/[length]**4/[time]"}
- {id: bed_time_constant, name: arterial time constant R x Cart of a vascular bed, dimension: "[time]"}
