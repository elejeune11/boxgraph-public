# mapping: b's input symbol -> expression in a's input symbols, in each model's port units (both cgs)
- id: rel_wave_speed_eq3_paper_release
  kind: same_as
  a: mynard2015/wave_speed_eq3
  b: mynard2015_data/wave_speed_eq3
  mapping: {rho: "rho", k1: "k1", k2: "k2", k3: "k3", D0: "D0"}
  regime:
    rho: [1.0, 1.1]
    k1: [2.0e+5, 3.0e+7]
    k2: [-25, -5]
    k3: [1.0e+4, 1.0e+6]
    D0: [0.02, 3.5]
  provenance: proposed
  reason: >
    The released supplemental files hold no wave speeds and no equations; this record's wave_speed_eq3 is our
    re-entry of the paper's Eq. 3 (c0^2 = 2/(3 rho) [k1 exp(k2 D0/2) + k3]) so that it runs on the released
    diameters, with the same ports and units as mynard2015/wave_speed_eq3. The regime spans Table 2's
    coefficients (k1 0.29-20 x 10^6, k2 -22.5 to -5, k3 2.1-86.5 x 10^4) and the range of 1D diameters.
    Proposed, not stated: the release is data and states nothing about models.
