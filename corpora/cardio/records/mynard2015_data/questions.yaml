- id: q_gamma
  kind: possible_error
  about: [gamma_paper, cmp_gamma_min_art, cmp_gamma_max_art, cmp_gamma_min_vein, cmp_gamma_max_vein, run_fractal_art, run_fractal_vein]
  text: >
    The paper prints the asymmetry ratio of Eq. 2 as gamma = r_d2^2/r_d1^2 = 0.43 (p. 5, checked on the page
    image). Every one of the 25 arterial and 25 venous bifurcations of the released pulmonary networks has one
    and the same ratio, and it is not 0.43 but a value near 0.46 (run_fractal_art, run_fractal_vein). The same
    bifurcations follow the printed fractal exponent 2.76 and, for the arteries, the printed length/radius
    ratio 2.55 to many digits (cmp_xi_*, cmp_L_over_r_*), so the released tree was generated by Eq. 2 with an
    asymmetry ratio other than the one printed, or the printed 0.43 is a misprint, or 0.43 is a ratio of a
    different kind (not of squared radii). The number of segments does not tell them apart: the tree regrown
    from the released lobar vessels has 54 segments with either ratio (cmp_n_pulm_regrown_printed,
    cmp_n_pulm_regrown_released).
- id: q_c0_ranges
  kind: unexplained_difference
  about: [cmp_c0_min_sys_art, cmp_c0_max_sys_art, cmp_c0_min_sys_vein, cmp_c0_max_pulm_art, cmp_c0_max_pulm_vein, cmp_c0_min_cor_art, cmp_c0_max_cor_art, c0_max_pulm_art]
  text: >
    Table 2's c0 ranges against Eq. 3 at the extreme released diameters of each network. Five of the twelve
    ends (both coronary venous ends, the lower pulmonary arterial and venous ends, the upper systemic venous end)
    come out at the printed digits with the coefficients as printed. The other seven are reproduced only within
    what the rounding of the printed coefficients allows (the build's input-rounding band: k2 printed as an
    integer moves c0 a lot in small vessels): the four systemic arterial and coronary arterial ends differ from
    the printed numbers by about one unit, the systemic venous lower end and the pulmonary venous upper end by a
    few cm/s, and the pulmonary arterial upper end by about 3% (the released smallest pulmonary artery gives a
    clearly lower c0 than 526). The code is not
    released, so whether the ranges were taken over mesh nodes, over rounded or unrounded coefficients, or over
    another diameter is not known. The printed pulmonary arterial upper end, 526, is the same number as the
    systemic venous upper end in the row above, which the released network does reproduce: possibly a copying
    error in Table 2.
- id: q_head_neck_coefficients
  kind: unstated_input
  about: [cmp_c0_max_sys_art_hn, cmp_c0_min_sys_vein_hn, cmp_c0_max_sys_vein_hn, run_compliance]
  text: >
    Fig. 3 and Supplemental File 1 have separate head/neck arterial, head/neck venous and portal venous networks,
    but Table 2 gives coefficients for six vessel types only, none of them head/neck or portal. Which Eq. 3
    coefficients these 113 segments use is not stated. With the systemic arterial coefficients the head/neck
    arteries reach a c0 far above the systemic arterial upper end of Table 2, and with the systemic venous
    coefficients the head/neck veins reach above the systemic venous upper end (cmp_c0_max_sys_art_hn,
    cmp_c0_max_sys_vein_hn, not reproduced). So either Table 2's ranges leave these networks out, or they use
    other coefficients. The compliance check (run_compliance) assumes the systemic coefficients for them.
- id: q_junctions
  kind: choice
  about: [cmp_n_junctions, cmp_n_junctions_valves, n_junctions_paper]
  text: >
    The paper states 188 junctions. Counting the points where two or more 1D segment ends meet in the released
    connectivity gives one fewer when the two ventricular outflow connections across the valves (LVot-AoRt,
    RVot-MPA) are not junctions, and one more when they are (close, both). Which ends the paper counts as a
    junction is not stated, and the count depends on our reading of the connectivity columns, where several
    names match no segment (q_connectivity_names); no reading we tried gives 188.
- id: q_connectivity_names
  kind: reading
  about: [run_counts]
  text: >
    Some names in the connectivity columns (G-H) of Supplemental File 1 match no segment abbreviation: 'RVertl'
    (for RVert), 'LRadI' (for LRad), 'RDICAI' and 'LDICAI' (for RDICA(I), LDICA(I)), 'vRRetroManA',
    'vRRetroManB', 'vLRetroManA', 'vLRetroManB' (no segment has these names), and 'Intercostals', 'RThigh',
    'LThigh' (bed names not of the 'VB:' form, and not bed names of Supplemental File 2). The adapters match names
    ignoring case, spaces and parentheses, and join ends from both columns, so each of these connections is
    still made from the other segment's side. Note 2 of the sheet says a name with '[xN]' stands for N
    identical vessels (intercostals x35, subscapular x4); the compliance check counts them N times.
- id: q_compliance
  kind: unexplained_difference
  about: [cmp_comp_sys_art, cmp_comp_sys_vein, cmp_comp_liver, cmp_comp_pulm_art, cmp_comp_pulm_vein, cmp_comp_total, run_compliance, run_compliance_coronary]
  text: >
    The paper says the Table 3 compliances were distributed among the beds 'having first subtracted out the 1D
    network compliances' (p. 7), so the released bed compliances plus the 1D compliances should give Table 3.
    The 1D compliance is not released or defined; ours is the reference area compliance A0/(rho c0^2) of each
    segment with c0 from Eq. 3, integrated along a linear taper. With it the systemic veins and pulmonary veins
    are reproduced, the systemic arteries, the liver and the total are close (all slightly above), and the
    pulmonary arteries are not reproduced: well above 6.7 mL/mmHg, as if a much smaller 1D pulmonary arterial
    compliance than ours had been subtracted. The released pulmonary arterial bed compliances alone are below
    6.7, so the beds themselves do not exceed the target. Counting the coronary beds with the
    systemic circulation changes the systemic values little (run_compliance_coronary). The liver: the two
    compliances of the lobules (Cp/a and venous) add to slightly more than 54; Table 3's value is the literature
    target (ref. 81).
- id: q_bed_time_constant
  kind: overstated_claim
  about: [tau_brain, tau_min_other, tau_max_other, run_resistance]
  text: >
    The paper says the Table 3 compliances 'were distributed amongst the respective 0D vascular bed compartments
    according to the inverse of resistance' (p. 7). In the released systemic beds R x Cart is the same for every
    generic bed but one (tau_min_other equals tau_max_other): the brain's is much smaller (tau_brain), and so is
    its venous compliance relative to its conductance. The brain's smaller share of compliance is a choice the
    paper does not state. The released venous-to-arterial compliance ratio is also one fixed number for all
    generic systemic beds, brain included; the paper does not state it.
- id: q_reference_resistance
  kind: unexplained_difference
  about: [cmp_svr_beds, cmp_pvr_beds, t6_svr_model, t6_pvr_model]
  text: >
    The released bed resistances, combined (systemic and coronary beds in parallel, the liver lobules in series
    with the hepatic arterial and splanchnic beds; pulmonary beds in parallel), give a systemic resistance close
    to Table 6's SVR of 0.90 and a pulmonary resistance close to, but above, Table 6's PVR of 0.06. Neither is
    expected to match exactly: the released values are reference resistances, which are pressure- or
    volume-dependent in the model (Note 1 of Supplemental File 2, Eq. T16-T19), and the 1D segments' resistance
    is not included.
- id: q_no_code
  kind: unstated_model
  about: [run_counts, run_compliance, run_resistance]
  text: >
    The release holds only the two parameter tables. The model's own code (Matlab 2014a, p. 4) is not released,
    nor are the heart and valve parameters beyond Tables 4-5, the numerical grid (5359 nodes) or the time step.
    So none of the paper's simulated results (Table 6, Table 8, Figs. 4-11) can be run from it; the release
    checks the inputs the paper describes (network size, wave speeds, the pulmonary and coronary venous
    construction rules, compliance and resistance distributions), not its outputs.

# Added by the cross-validation job with mynard2015 (2026-11-06).
- id: q_pvr_tuned
  kind: choice
  about: [bed_resistance, run_resistance]
  text: >
    val_svr_ref is entered as a fit: the paper says the systemic bed resistances were 'adjusted ... to achieve
    normal mean pressure and cardiac output' (mynard2015 p. 6), which fixes SVR. It says how the systemic, hepatic
    and coronary resistances were set, but not the 29 pulmonary beds'. val_pvr_ref is therefore entered as a
    validation; if the pulmonary resistances were tuned like the systemic ones (to a normal pulmonary trunk
    pressure, also a Table 6 reference from ref. 81), it is a fit instead. Both compare reference bed resistances
    without the 1D networks against in vivo ranges, as in q_reference_resistance. Measurements of mynard2015 not
    used: the Fig. 4 in vivo waveforms and the other Table 6 reference values (heart rate, cardiac output,
    volumes, EF, pressures, E/A, dp/dt) need the closed-loop model, which is not released (q_no_code); the Table 2
    reference wave speeds (441 AoRt, 115 IVC, 260 RPA, 860 LAD), which wave_speed_eq3 at the released diameters
    could predict, are not recorded as data in mynard2015, and the paper chose k1-k3 'to achieve normal wave
    speeds in the large vessels', so they would be fits.
