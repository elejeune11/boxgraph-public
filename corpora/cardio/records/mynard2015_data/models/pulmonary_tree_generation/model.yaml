id: pulmonary_tree_generation
name: pulmonary tree regrown by Eq. 2 and the 5 mm termination rule from the released lobar vessels
role: model
software: true
stated: {none: "printed in mynard2015 p. 5 (1447): 'The 1D network was terminated after a parent radius of 5 mm was reached in both the artery and vein at a particular topological location, leading to 54 pulmonary arteries/veins being included'; root radii from MOESM1_1D_segments.xlsx, sheet '1D segments', column E of LIA0_0, LSA0_0, RIA0_0, RSA0_0 and LIV0_0, LSV0_0, RIV0_0, RSV0_0"}
equation: "r_d1 = r_p (1 + gamma^(xi/2))^(-1/xi), r_d2 = r_d1 sqrt(gamma); branch unless r_art < r_term and r_vein < r_term"
from_words: true
built_from: [network_counts]
inputs:
  xi: {quantity: fractal_exponent, unit: dimensionless}
  gamma: {quantity: asymmetry_ratio, unit: dimensionless}
  r_term: {quantity: vessel_radius, unit: mm}
outputs:
  n_segments: {quantity: segment_count, unit: dimensionless}
settings:
  artery_roots: [LIA0_0, LSA0_0, RIA0_0, RSA0_0]
  vein_roots: [LIV0_0, LSV0_0, RIV0_0, RSV0_0]
  max_segments: 100000
stochastic: false
