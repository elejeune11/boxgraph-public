id: network_diameter_range
name: smallest and largest reference diameter of a released 1D network (Supplemental File 1)
role: processing
software: true
stated: {none: "MOESM1_1D_segments.xlsx, sheet '1D segments', columns E 'Inlet A0' and F 'Outlet A0' (cm2, header rows 7-8), one block per network (block titles in column A). A spreadsheet in a software source cannot be cited by sheet and cell."}
equation: "D = 2 sqrt(A0/pi), over the inlet and outlet A0 of every segment of the blocks"
built_from: [network_counts]
inputs: {}
outputs:
  D_min: {quantity: vessel_diameter, unit: cm}
  D_max: {quantity: vessel_diameter, unit: cm}
settings: {blocks: ["Systemic Arteries"]}
stochastic: false
