id: network_counts
name: numbers of segments and junctions of the released 1D networks (Supplemental File 1)
role: processing
software: true
stated: {none: "MOESM1_1D_segments.xlsx, sheet '1D segments': one numbered row per segment (column A, 1-396), block titles in column A (rows 10-363), connectivity in columns G-H (header row 7). A spreadsheet in a software source cannot be cited by sheet and cell."}
equation: "counts of rows; junctions = groups of joined segment ends from the connectivity columns"
inputs: {}
outputs:
  n_segments: {quantity: segment_count, unit: dimensionless, description: "numbered rows of the sheet"}
  n_pulm_art_tree: {quantity: segment_count, unit: dimensionless, description: "pulmonary arterial segments downstream of LPA and RPA"}
  n_pulm_vein: {quantity: segment_count, unit: dimensionless, description: "segments of the block 'Pulmonary Veins'"}
  n_junctions: {quantity: junction_count, unit: dimensionless, description: "points where two or more 1D segment ends meet"}
settings: {valves_as_junctions: false}
stochastic: false
