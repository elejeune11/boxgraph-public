id: co_decrease
name: relative decrease of cardiac output between two runs
role: processing
stated: {none: "our processing: the paper's '9% drop in cardiac output' (smith2004 p. 2, p. 8) as 1 - CO_test/CO_ref; the code computes no cardiac output"}
equation: "decrease = 1 - CO_test / CO_ref"
inputs:
  CO_ref: {quantity: cardiac_output, unit: L/min}
  CO_test: {quantity: cardiac_output, unit: L/min}
outputs:
  decrease: {quantity: cardiac_output_decrease, unit: percent}
settings: {}
stochastic: false
