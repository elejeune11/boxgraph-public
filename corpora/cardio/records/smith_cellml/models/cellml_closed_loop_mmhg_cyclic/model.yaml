id: cellml_closed_loop_mmhg_cyclic
name: the CellML closed-loop model with its pressure unit read as mmHg and the driver cycled by remainder, run to a periodic state
role: model
stated: {file: smith_chase_nokes_shaw_wake_2004.cellml, lines: "27", quote: "if statements were used instead of a remainder operator to cycle the heart beat"}
equation: >-
  cellml_closed_loop (smith_chase_nokes_shaw_wake_2004.cellml lines 85-1624) with two changes:
  pressures in mmHg where the file declares kPa (as cellml_closed_loop_mmhg), and
  tau = time - k period with k = ceil(time/period) - 1 for every time, the remainder the 13
  pieces of lines 114-359 spell out, so the model can run beyond 13 beats.
variant_of: cellml_closed_loop
built_from: [cellml_closed_loop]
corrections:
  - equation: "units kPa, kPa_per_mL, kPa_second_per_mL, kPa_second2_per_mL (lines 50-83)"
    change: "the pressure unit of the file read as mmHg instead of the declared kilopascal; no number changed"
    evidence: >-
      The file's P_th is -4 (line 100), the paper's 'normal (-4 mmHg)' thoracic pressure; the
      paper states all its pressures in mmHg (L = 10^-6 mmHg s^2/ml, p. 7). Read in kPa as
      declared (1 kPa = 7.5 mmHg), every pressure is 7.5 times what the same numbers give in mmHg.
  - equation: "driver_function tau, lines 111-360"
    change: "tau by the remainder of time over the period for all time, in place of 13 explicit pieces that leave tau undefined after 13 periods"
    evidence: >-
      The file's own documentation (line 27) says the if statements were used 'instead of a
      remainder operator to cycle the heart beat', that the model 'will only simulate 14 heart
      beats' and that 'this can be increased if desired'; the paper's results are for a periodic
      state (its long-term stability, p. 2), which 13 beats need not reach.
