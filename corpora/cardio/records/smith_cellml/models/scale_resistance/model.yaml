id: scale_resistance
name: a resistance multiplied by a factor
role: processing
stated: {none: "our processing: the paper doubles the systemic resistance (smith2004 p. 2, Figs. 9-10); the code has one R_sys and no factor"}
equation: "R_scaled = factor R"
inputs:
  R: {quantity: flow_resistance, unit: kPa*s/mL}
  factor: {quantity: resistance_factor, unit: dimensionless}
outputs:
  R_scaled: {quantity: flow_resistance, unit: kPa*s/mL}
settings: {}
stochastic: false
