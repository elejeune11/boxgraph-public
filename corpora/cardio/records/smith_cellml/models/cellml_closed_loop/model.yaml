id: cellml_closed_loop
name: closed-loop minimal haemodynamic model as written in the CellML file (ported to Python), pressures in the file's declared kPa
role: model
stated: {file: smith_chase_nokes_shaw_wake_2004.cellml, lines: "16", quote: "Minimal haemodynamic system model including ventricular interaction and valve dynamics"}
equation: >-
  Port of smith_chase_nokes_shaw_wake_2004.cellml lines 85-1410 (components) and 1411-1624
  (connections), line by line. Driver (102-389): tau = time - k period for time <= (k+1) period,
  k = 0..12 (undefined beyond 13 periods); e_t = A exp(-B (tau - C)^2).
  Pericardium (390-444): V_pcd = V_lv + V_rv; P_pcd = P_0_pcd (exp(lambda_pcd (V_pcd - V_0_pcd)) - 1);
  P_peri = P_pcd + P_th. Free walls (445-774): V_lvf = V_lv - V_spt, V_rvf = V_rv + V_spt;
  P_es = E_es (V - V_d); P_ed = P_0 (exp(lambda (V - V_0)) - 1); P_xvf = e_t P_es + (1 - e_t) P_ed;
  P_lv = P_lvf + P_peri, P_rv = P_rvf + P_peri. Septum (775-917): 0 = e_t E_es_spt (V_spt - V_d_spt)
  + (one - e_t) P_0_spt (exp(lambda_spt (V_spt - V_0_spt)) - one) - e_t E_es_lvf (V_lv - V_spt)
  - (1 - e_t) P_0_lvf (exp(lambda_lvf (V_lv - V_spt)) - 1) + e_t E_es_rvf (V_rv + V_spt)
  + (1 - e_t) P_0_rvf (exp(lambda_rvf (V_rv + V_spt)) - 1). Vessels (918-1153):
  P_pa = E_es_pa (V_pa - V_d_pa) + P_th, P_pu = E_es_pu (V_pu - V_d_pu) + P_th,
  P_ao = E_es_ao (V_ao - V_d_ao), P_vc = E_es_vc (V_vc - V_d_vc). Flows (1154-1410):
  Q_sys = (P_ao - P_vc)/R_sys, Q_pul = (P_pa - P_pu)/R_pul; for each valve,
  dQ/dt = 0 if (P_up - P_down < 0 and Q < 0) else (P_up - P_down - Q R)/L.
  Volumes: dV/dt = inflow - outflow with a valve flow counted as zero while it is negative.
  Not in the file: the solver (classical RK4 at fixed dt) and the outputs, taken over the last
  simulated beat: SV = max - min V_lv, CO = SV / period, systolic / diastolic = max / min,
  mean = average over the beat.
inputs:
  R_mt: {quantity: flow_resistance, unit: kPa*s/mL}
  R_av: {quantity: flow_resistance, unit: kPa*s/mL}
  R_tc: {quantity: flow_resistance, unit: kPa*s/mL}
  R_pv: {quantity: flow_resistance, unit: kPa*s/mL}
  R_pul: {quantity: flow_resistance, unit: kPa*s/mL}
  R_sys: {quantity: flow_resistance, unit: kPa*s/mL}
  L_tc: {quantity: inertance, unit: kPa*s^2/mL}
  L_pv: {quantity: inertance, unit: kPa*s^2/mL}
  L_mt: {quantity: inertance, unit: kPa*s^2/mL}
  L_av: {quantity: inertance, unit: kPa*s^2/mL}
  P_th: {quantity: thoracic_pressure, unit: kPa}
  A: {quantity: driver_amplitude, unit: dimensionless}
  B: {quantity: driver_width_coefficient, unit: 1/s^2}
  C: {quantity: driver_peak_time, unit: s}
  period: {quantity: heart_period, unit: s}
  P_0_pcd: {quantity: ed_pressure_scale, unit: kPa}
  V_0_pcd: {quantity: ed_reference_volume, unit: mL}
  lambda_pcd: {quantity: ed_stiffness, unit: 1/mL}
  E_es_lvf: {quantity: es_elastance, unit: kPa/mL}
  V_d_lvf: {quantity: zero_pressure_volume, unit: mL}
  P_0_lvf: {quantity: ed_pressure_scale, unit: kPa}
  lambda_lvf: {quantity: ed_stiffness, unit: 1/mL}
  V_0_lvf: {quantity: ed_reference_volume, unit: mL}
  E_es_rvf: {quantity: es_elastance, unit: kPa/mL}
  V_d_rvf: {quantity: zero_pressure_volume, unit: mL}
  P_0_rvf: {quantity: ed_pressure_scale, unit: kPa}
  lambda_rvf: {quantity: ed_stiffness, unit: 1/mL}
  V_0_rvf: {quantity: ed_reference_volume, unit: mL}
  E_es_spt: {quantity: es_elastance, unit: kPa/mL}
  V_d_spt: {quantity: zero_pressure_volume, unit: mL}
  P_0_spt: {quantity: ed_pressure_scale, unit: kPa}
  lambda_spt: {quantity: ed_stiffness, unit: 1/mL}
  V_0_spt: {quantity: ed_reference_volume, unit: mL}
  one: {quantity: unit_constant, unit: dimensionless}
  E_es_pa: {quantity: vessel_elastance, unit: kPa/mL}
  V_d_pa: {quantity: zero_pressure_volume, unit: mL}
  E_es_pu: {quantity: vessel_elastance, unit: kPa/mL}
  V_d_pu: {quantity: zero_pressure_volume, unit: mL}
  E_es_ao: {quantity: vessel_elastance, unit: kPa/mL}
  V_d_ao: {quantity: zero_pressure_volume, unit: mL}
  E_es_vc: {quantity: vessel_elastance, unit: kPa/mL}
  V_d_vc: {quantity: zero_pressure_volume, unit: mL}
  V_lv_init: {quantity: initial_chamber_volume, unit: mL}
  V_rv_init: {quantity: initial_chamber_volume, unit: mL}
  V_pa_init: {quantity: initial_chamber_volume, unit: mL}
  V_pu_init: {quantity: initial_chamber_volume, unit: mL}
  V_ao_init: {quantity: initial_chamber_volume, unit: mL}
  V_vc_init: {quantity: initial_chamber_volume, unit: mL}
  Q_mt_init: {quantity: initial_valve_flow, unit: mL/s}
  Q_av_init: {quantity: initial_valve_flow, unit: mL/s}
  Q_tc_init: {quantity: initial_valve_flow, unit: mL/s}
  Q_pv_init: {quantity: initial_valve_flow, unit: mL/s}
outputs:
  SV_lv: {quantity: stroke_volume, unit: mL}
  SV_rv: {quantity: stroke_volume, unit: mL}
  CO: {quantity: cardiac_output, unit: L/min}
  Pao_sys: {quantity: aortic_systolic_pressure, unit: kPa}
  Pao_dia: {quantity: aortic_diastolic_pressure, unit: kPa}
  Ppa_sys: {quantity: pa_systolic_pressure, unit: kPa}
  Ppa_dia: {quantity: pa_diastolic_pressure, unit: kPa}
  Pvc_mean: {quantity: vena_cava_pressure, unit: kPa}
  Ppu_mean: {quantity: pulmonary_vein_pressure, unit: kPa}
  Vspt_swing: {quantity: septal_volume_swing, unit: mL}
settings:
  dt: 0.0002        # added: the CellML holds no solver settings (q_solver)
  n_beats: 13       # the most the file's driver allows (q_beat_count)
  vspt_guess: 2.0   # added: first Newton guess for the septum volume, which the file leaves to the solver
stochastic: false
