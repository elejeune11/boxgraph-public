notes: >
  What the code is. One CellML 1.0 file, smith_chase_nokes_shaw_wake_2004.cellml (CellML Model
  Repository, changeset 910ec922c5ea), generated by COR in 2009 and curated by Geoffrey Nunns
  (Auckland Bioengineering Institute; authors and year from its metadata, lines 1-11 and 1637-1665).
  The documentation says it is "based off the original Matlab code obtained from the model
  authors", which is not in the corpus. It encodes the closed-loop model of smith2004 (Fig. 1):
  driver, pericardium, left and right free walls, septum (algebraic), four vessels, systemic and
  pulmonary resistances and four valves with inertance; the whole model is the entry point, with
  no solver settings. shaw_2007.ai, .png and .svg are the schematic diagram. No licence file or
  header. url: the CellML Model Repository.

  How it was read. CellML is not run here: lines 85-1624 are ported line by line to Python
  (models/cellml_closed_loop, our code; RK4 at 0.2 ms, Newton for the septum). All 53 values the
  model uses are cited by line. Three readings of the model are run: as written (pressure unit
  kPa as declared, 13 beats, the most the file's driver defines); cellml_closed_loop_mmhg (the
  pressure numbers read as mmHg, nothing else changed); cellml_closed_loop_mmhg_cyclic (also tau
  by remainder, as the documentation says the if statements stand for, 60 beats). Processing
  models (ours) give the cardiac-output decrease, 2 x R_sys, the initial-volume total and the
  heart rate.

  Differences from the paper. (1) The file declares kPa but its numbers are mmHg: its P_th of -4
  is the paper's -4 mmHg, so the cited check of P_th_code against smith2004/Pth_normal differs
  (q_units_kpa). (2) C = 0.375 s against the printed 0.27 of Fig. 3; A = 1 and B = 80 agree
  (q_driver_C). (3) The driver is defined for 13 beats, not the 14 the documentation says, and
  the P_th = 0 and 2 x R_sys cases are still changing at the 13th beat (q_beat_count). (4) Inertance
  and the open-on-pressure, close-on-flow law at all four valves, where the paper's Fig. 1 has
  inertia only at the outlet valves (q_inlet_inertance). (5) P_th is added to the pulmonary artery
  and vein pressures as well as the pericardium, beyond Eq. 14 (q_pth_pulmonary). (6) V_tot = 5.5
  mL is declared and unused (q_vtot). (7) A closing valve's flow is frozen at a small negative value,
  not reset (q_valve_negative_flow); the septum equation omits the free walls' V_d and V_0, which
  are 0 (q_septum_vd). (8) All 46 elastances, end-diastolic parameters, resistances, inertances and
  initial values are hidden choices: the paper prints none of them (q_parameters_not_in_paper).
  Consistent with the paper: the six initial volumes add up to its 1500 ml stressed volume, and
  the 0.75 s period is its 80 beats/min (consistency comparisons).

  What it reproduces. As written (kPa), no printed pressure: they come out 7.5 times the paper's.
  With the pressures read as mmHg, the baseline aortic pressure is near but under 120/80 mmHg, and
  with 2 x R_sys it rises above the printed 165/130; the left stroke volume is below the SV = 70 of
  Fig. 7; raising P_th from -4 to 0 lowers cardiac output by more than the printed 9%, both at the
  13th beat and more so at the periodic state; the closed loop's septum swing exceeds the
  two-chamber model's 3 ml (an approximation only). The pulmonary and venous pressures fall in
  or near the paper's typical ranges (validation). The build gives the exact values and verdicts.
  The paper's record takes its parameters from this file, so the two records' closed-loop
  verdicts differ only by the model forms and numerics each uses.
