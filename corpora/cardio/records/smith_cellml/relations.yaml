  tolerance: 0.05
  provenance: proposed
  reason: >-
    The file encodes the paper's closed loop (its line 27; same equations and, per the paper's record,
    the same parameter values), but adds inertia and the open-on-pressure, close-on-flow law at the
    mitral and tricuspid valves, where the paper's Fig. 1 and its record have none, and freezes a
    closing valve's flow at a small negative value. No limit of a's inputs removes those terms, so
    the run-to-periodic-state reading of the file (no 13-beat cut-off) is an approximation of the
    paper's model, not the same model. Tolerance 5%: about the precision the paper prints its
    cardiac-output result with (a 9% drop). The output is the cardiac output because the model is
    homogeneous in its pressure unit, so the variant's kPa-or-mmHg reading of its numbers leaves
    volumes and flows unchanged under the exact unit conversion of the mapping; its pressure ports,
    labelled mmHg with kPa inputs, are not compared.
  assumptions:
    - "as rel_file_recreates_paper_co (fixed inputs, the file's extra inertances and initial values), with HR over 72-88 beats/min since the cyclic driver is defined at every time; the variant runs 60 beats, the paper's model 100"
