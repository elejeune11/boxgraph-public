  citation: {file: smith_chase_nokes_shaw_wake_2004.cellml, lines: "27", quote: "This model will run in COR, PCEnv and OpenCell to recreate the published results. It is based off the original Matlab code obtained from the model authors."}
  assumptions:
    - "as rel_file_recreates_paper_co, for the aortic systolic pressure (the file's kPa converted to the paper's mmHg)"
