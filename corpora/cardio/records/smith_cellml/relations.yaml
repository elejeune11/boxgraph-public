  tolerance: 0.01
  provenance: stated
  citation: {file: smith_chase_nokes_shaw_wake_2004.cellml, lines: "27", quote: "This model will run in COR, PCEnv and OpenCell to recreate the published results. It is based off the original Matlab code obtained from the model authors."}
  assumptions:
    - "the file as written: pressures in its declared kPa (converted exactly, so the claim is tested in the units the file states), 13 beats as its driver allows; the paper's model at its record's 100 beats"
    - "regime: within 10% of the parameter set both records use (the file's numbers), with P_th over the paper's -4 to 0 mmHg and R_sys from the baseline to its doubled value; tolerance 1%, below the precision of the printed results (9%, 120/80 mmHg)"
    - "HR fixed at the paper's 80 beats/min (the file's period 0.75 s): the file defines its driver for 13 periods only, and at other periods the fixed 0.2 ms step grid ends past 13 periods, where the file's model is undefined"
    - "pth_pulm fixed at 1 and the free walls' V_d, V_0 fixed at 0: the file adds P_th to the pulmonary pressures and leaves the free walls' V_d, V_0 out of its septum equation, so a's switch and those inputs are held where the file's form is the paper's"
    - "the file's mitral and tricuspid inertances (lines 95, 97) and initial valve flows (lines 1157-1160), which the paper's model does not have, at the file's values; its initial volumes as the share of V_tot the file gives (they add up to 1500 ml)"
- id: rel_file_recreates_paper_pao
  kind: same_as
