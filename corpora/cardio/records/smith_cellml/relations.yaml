# Relations between the CellML encoding and the closed-loop model of smith2004.
# mapping: each input of b (the CellML port, pressures in the file's declared kPa) as an expression in
# the inputs of a (smith2004/closed_loop, pressures in mmHg); 7.500616827 is mmHg per kPa.
# Model parameters the paper's model does not have are given the file's own numbers (lines 95, 97,
# 1157-1160), scaled like every other pressure-carrying number so the file's ratios are kept.
- id: rel_file_recreates_paper_co
  kind: same_as
  a: smith2004/closed_loop
  b: smith_cellml/cellml_closed_loop
  mapping: &map
    R_mt: "R_mt/7.500616827"
