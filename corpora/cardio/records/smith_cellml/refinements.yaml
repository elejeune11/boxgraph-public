- {id: ref_code_dt_pao, run: run_code_normal, setting: dt, factors: [1, 2, 4], mode: divide, output: Pao_sys,
   tolerance: "0.5%", tolerance_basis: "added: below the printed precision of the pressures compared (1 mmHg in 120)", tolerance_added: true}
- {id: ref_code_dt_sv, run: run_code_normal, setting: dt, factors: [1, 2, 4], mode: divide, output: SV_lv,
   tolerance: "0.5%", tolerance_basis: "added: below the printed precision of SV (1 ml in 70)", tolerance_added: true}
- {id: ref_code_beats_pth0, run: run_code_pth0, setting: n_beats, factors: [1, 1.0833333333333333], mode: divide, output: SV_lv,
   tolerance: "0.5%", tolerance_basis: "added: whether the 12th and 13th beats agree, i.e. whether the 13 beats the file allows reach a periodic state; below the printed precision of the 9% decrease built on it", tolerance_added: true}
- {id: ref_code_beats_rsys2, run: run_code_rsys2, setting: n_beats, factors: [1, 1.0833333333333333], mode: divide, output: Pao_sys,
   tolerance: "0.5%", tolerance_basis: "added: whether the 12th and 13th beats agree; below the printed precision of 165 mmHg", tolerance_added: true}
- {id: ref_cyc_dt, run: run_cyc_normal, setting: dt, factors: [1, 2], mode: divide, output: Pao_sys,
   tolerance: "0.5%", tolerance_basis: "added: below the printed precision of the pressures compared", tolerance_added: true}
- {id: ref_cyc_beats_pth0, run: run_cyc_pth0, setting: n_beats, factors: [1, 2], mode: multiply, output: SV_lv,
   tolerance: "0.5%", tolerance_basis: "added: checks the 60th beat is periodic", tolerance_added: true}
- {id: ref_cyc_beats_rsys2, run: run_cyc_rsys2, setting: n_beats, factors: [1, 2], mode: multiply, output: Pao_sys,
   tolerance: "0.5%", tolerance_basis: "added: checks the 60th beat is periodic", tolerance_added: true}
