- {id: driver_amplitude, name: driver amplitude, dimension: dimensionless, description: "A of the driver function e_t = A exp(-B (tau - C)^2)"}
- {id: driver_width_coefficient, name: driver width coefficient, dimension: "1/[time]**2", description: "B of the driver function"}
- {id: driver_peak_time, name: driver peak time, dimension: "[time]", description: "C of the driver function, the time of its maximum within the beat"}
- {id: heart_period, name: period of the heart beat, dimension: "[time]", description: "the period with which the driver repeats"}
- {id: heart_rate, name: heart rate, dimension: "1/[time]", description: "beats per unit time"}
- {id: es_elastance, name: end-systolic elastance of a cardiac wall, dimension: "[pressure]/[length]**3", description: "E_es of the left or right ventricular free wall or the septum"}
- {id: vessel_elastance, name: elastance of a vascular chamber, dimension: "[pressure]/[length]**3", description: "E_es of the aorta, vena cava, pulmonary artery or pulmonary vein"}
- {id: zero_pressure_volume, name: volume at zero end-systolic pressure, dimension: "[length]**3", description: "V_d of P_es = E_es (V - V_d)"}
- {id: ed_reference_volume, name: reference volume of the end-diastolic relation, dimension: "[length]**3", description: "V_0 of P_ed = P_0 (exp(lambda (V - V_0)) - 1)"}
- {id: ed_pressure_scale, name: pressure scale of the end-diastolic relation, dimension: "[pressure]", description: "P_0 of P_ed = P_0 (exp(lambda (V - V_0)) - 1)"}
- {id: ed_stiffness, name: exponential stiffness of the end-diastolic relation, dimension: "1/[length]**3", description: "lambda of P_ed = P_0 (exp(lambda (V - V_0)) - 1)"}
- {id: flow_resistance, name: flow resistance, dimension: "[pressure]*[time]/[length]**3", description: "R of a valve or a vascular bed"}
- {id: inertance, name: blood inertance, dimension: "[pressure]*[time]**2/[length]**3", description: "L of a valve: dQ/dt = (P_up - P_down - Q R)/L"}
- {id: thoracic_pressure, name: pressure in the thoracic cavity, dimension: "[pressure]", description: "P_th"}
- {id: unit_constant, name: the number one, dimension: dimensionless, description: "a constant 1 written as a variable of the code"}
- {id: total_blood_volume, name: total blood volume, dimension: "[length]**3", description: "V_tot of the code's heart_parameters"}
- {id: stressed_blood_volume, name: total stressed blood volume, dimension: "[length]**3", description: "the sum of the six chamber volumes of the closed loop"}
- {id: initial_chamber_volume, name: initial volume of a chamber, dimension: "[length]**3", description: "the value of a chamber volume at time 0 of a simulation"}
- {id: initial_valve_flow, name: initial flow through a valve, dimension: "[length]**3/[time]", description: "the value of a valve flow at time 0 of a simulation"}
- {id: resistance_factor, name: multiplier of the systemic resistance, dimension: dimensionless, description: "the factor by which R_sys is scaled"}
- {id: stroke_volume, name: ventricular stroke volume, dimension: "[length]**3", description: "maximum minus minimum ventricle volume over a beat"}
- {id: cardiac_output, name: cardiac output, dimension: "[length]**3/[time]", description: "left ventricular stroke volume divided by the period"}
- {id: cardiac_output_decrease, name: relative decrease of cardiac output, dimension: dimensionless, description: "1 - CO(test)/CO(reference)"}
- {id: aortic_systolic_pressure, name: aortic systolic pressure, dimension: "[pressure]", description: "maximum aortic pressure over a beat"}
- {id: aortic_diastolic_pressure, name: aortic diastolic pressure, dimension: "[pressure]", description: "minimum aortic pressure over a beat"}
- {id: pa_systolic_pressure, name: pulmonary artery systolic pressure, dimension: "[pressure]", description: "maximum pulmonary artery pressure over a beat"}
- {id: pa_diastolic_pressure, name: pulmonary artery diastolic pressure, dimension: "[pressure]", description: "minimum pulmonary artery pressure over a beat"}
- {id: vena_cava_pressure, name: mean vena cava pressure, dimension: "[pressure]", description: "P_vc averaged over a beat"}
- {id: pulmonary_vein_pressure, name: mean pulmonary vein pressure, dimension: "[pressure]", description: "P_pu averaged over a beat"}
- {id: septal_volume_swing, name: oscillation of the septum free wall volume, dimension: "[length]**3", description: "maximum minus minimum V_spt over a beat"}
