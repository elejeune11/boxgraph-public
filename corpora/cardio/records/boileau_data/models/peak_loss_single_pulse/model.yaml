id: peak_loss_single_pulse
name: loss of the inviscid single pulse's peak pressure between the first and last released times (Benchmark 1)
role: processing
software: true
stated: {file: Benchmark1_SinglePulseModel/README.txt, lines: "13-15", quote: "col 2 to 9: pressure [kPa] for t={0.1,0.3,0.5,0.7,0.9,1.1,1.3,1.5} [s]"}
equation: "loss = 100 (1 - max_x P(x, 1.5 s) / max_x P(x, 0.1 s))"
inputs: {}
outputs:
  loss: {quantity: inviscid_peak_loss, unit: percent}
settings: {file: "", first_column: 2, last_column: 9}
