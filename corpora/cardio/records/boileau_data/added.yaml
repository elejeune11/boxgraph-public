- id: lag_b2
  quantity: time_lag
  unit: s
  printed: '0.056'
  basis: 'Not stated: the README gives tini, the start of the last 1D cycle, but not where t = 0 of the 3D record (NumData/3D*.txt) falls on the 1D clock. Fitted by the reader to the paper''s own tables:
    of the lags -5 to +65 ms (1 ms steps), this is the one at which the recomputed RMS and MAX errors of these solvers match the printed ones (misfit about 0.003%). The DCG lag is always 1 ms more, as if
    its files were stamped one step late (q_alignment). The SYS and DIAS errors hardly depend on it; the RMS and MAX comparisons of these runs are fits of one number to 4-12 printed values per solver.'
  alternatives: ['0', '0.055']
  stands_for: the time origin of the reference record on the 1D clock, B2, the five solvers whose files start at t = 0
