- id: lag_b5
  quantity: time_lag
  unit: s
  printed: '-0.001'
  basis: 'Not stated. Fitted by the reader: of the lags -6 to +6 ms (1 ms steps), -1 ms is the one at which the recomputed RMS and MAX errors of these four solvers match Table X (misfit 0.01% for FEM, FVM,
    STM; 0.1% for McC; the anterior tibial pressure left out of the fit, q_b5_tibial). So these comparisons test that one lag fits the 28 sites x metrics of each solver.'
  alternatives: ['0']
  stands_for: the time origin of the reference record on the 1D clock, B5, FEM, FVM, McC and STM (files start at t = 0, McC at -0.00025 s)
- id: lag_b5_late
  quantity: time_lag
  unit: s
  printed: '0'
  basis: 'Neither the paper nor the READMEs say how the in vitro record (ExpData, t from 0) is placed on the 1D clock beyond time_shifts.txt. Taken as stated: t = 0 of the measurement at the file''s tini.
    Fitted check: of the lags -6 to +6 ms, this one gives the printed RMS and MAX errors of DCG and LCG (Table X) to their last digit.'
  alternatives: ['-0.001']
  stands_for: the time origin of the reference record on the 1D clock, B5, DCG and LCG (files start at t = 0.001 s)
