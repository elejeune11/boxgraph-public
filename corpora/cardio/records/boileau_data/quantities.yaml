- {id: time, name: time, dimension: '[time]', description: 'a time column of a data file, or a time given in a README'}
- {id: cardiac_period, name: period of the prescribed inflow, dimension: '[time]', description: the period T given in the comment of an inflow.txt file}
- {id: time_lag, name: offset of the reference record's time origin from the stated start of the last 1D cycle, dimension: '[time]', description: 'added: the time t_ref = 0 of the 3D or in vitro record
    lies at t_ini + t_lag on the 1D file''s clock'}
- {id: pressure_rms_error, name: root mean square relative error of a 1D pressure waveform against the reference, dimension: dimensionless, description: 'Eq. 10 of boileau2015 for pressure, in per cent
    in its Tables IV, VI, VIII and X'}
- {id: pressure_max_error, name: maximum relative error of a 1D pressure waveform against the reference, dimension: dimensionless, description: 'Eq. 11 of boileau2015 for pressure, in per cent in its Tables
    IV, VI, VIII and X'}
- {id: pressure_systolic_error, name: relative error in the systolic (maximum) value of a 1D pressure waveform against the reference, dimension: dimensionless, description: 'Eq. 12 of boileau2015 for pressure,
    in per cent in its Tables IV, VI, VIII and X'}
- {id: pressure_diastolic_error, name: relative error in the diastolic (minimum) value of a 1D pressure waveform against the reference, dimension: dimensionless, description: 'Eq. 13 of boileau2015 for
    pressure, in per cent in its Tables IV, VI, VIII and X'}
- {id: flow_rms_error, name: root mean square relative error of a 1D flow rate waveform against the reference, dimension: dimensionless, description: 'Eq. 10 of boileau2015 for flow rate, in per cent in
    its Tables IV, VI, VIII and X'}
- {id: flow_max_error, name: maximum relative error of a 1D flow rate waveform against the reference, dimension: dimensionless, description: 'Eq. 11 of boileau2015 for flow rate, in per cent in its Tables
    IV, VI, VIII and X'}
- {id: flow_systolic_error, name: relative error in the systolic (maximum) value of a 1D flow rate waveform against the reference, dimension: dimensionless, description: 'Eq. 12 of boileau2015 for flow
    rate, in per cent in its Tables IV, VI, VIII and X'}
- {id: flow_diastolic_error, name: relative error in the diastolic (minimum) value of a 1D flow rate waveform against the reference, dimension: dimensionless, description: 'Eq. 13 of boileau2015 for flow
    rate, in per cent in its Tables IV, VI, VIII and X'}
- {id: radius_change_rms_error, name: root mean square relative error of a 1D change in radius from diastole waveform against the reference, dimension: dimensionless, description: 'Eq. 10 of boileau2015
    for change in radius from diastole, in per cent in its Tables IV, VI, VIII and X'}
- {id: radius_change_max_error, name: maximum relative error of a 1D change in radius from diastole waveform against the reference, dimension: dimensionless, description: 'Eq. 11 of boileau2015 for change
    in radius from diastole, in per cent in its Tables IV, VI, VIII and X'}
- {id: radius_change_systolic_error, name: relative error in the systolic (maximum) value of a 1D change in radius from diastole waveform against the reference, dimension: dimensionless, description: 'Eq.
    12 of boileau2015 for change in radius from diastole, in per cent in its Tables IV, VI, VIII and X'}
- {id: radius_change_diastolic_error, name: relative error in the diastolic (minimum) value of a 1D change in radius from diastole waveform against the reference, dimension: dimensionless, description: 'Eq.
    13 of boileau2015 for change in radius from diastole, in per cent in its Tables IV, VI, VIII and X'}
- {id: pressure_difference_rms_error, name: root mean square relative error of a 1D pressure difference between inlet and outlet waveform against the reference, dimension: dimensionless, description: 'Eq.
    10 of boileau2015 for pressure difference between inlet and outlet, in per cent in its Tables IV, VI, VIII and X'}
- {id: pressure_difference_max_error, name: maximum relative error of a 1D pressure difference between inlet and outlet waveform against the reference, dimension: dimensionless, description: 'Eq. 11 of
    boileau2015 for pressure difference between inlet and outlet, in per cent in its Tables IV, VI, VIII and X'}
- {id: pressure_difference_systolic_error, name: relative error in the systolic (maximum) value of a 1D pressure difference between inlet and outlet waveform against the reference, dimension: dimensionless,
  description: 'Eq. 12 of boileau2015 for pressure difference between inlet and outlet, in per cent in its Tables IV, VI, VIII and X'}
- {id: pressure_difference_diastolic_error, name: relative error in the diastolic (minimum) value of a 1D pressure difference between inlet and outlet waveform against the reference, dimension: dimensionless,
  description: 'Eq. 13 of boileau2015 for pressure difference between inlet and outlet, in per cent in its Tables IV, VI, VIII and X'}
- {id: blood_pressure, name: blood pressure at a site of the vessel or network, dimension: '[pressure]'}
- {id: volume_flow_rate, name: volume flow rate through a cross-section at a site, dimension: '[length]**3/[time]'}
- {id: radius_change, name: change in lumen radius from its diastolic value, dimension: '[length]'}
- {id: pressure_difference, name: pressure at the inlet minus pressure at the outlet of a vessel, dimension: '[pressure]'}
- {id: inviscid_peak_loss, name: decrease of the peak pressure of the inviscid single pulse as it travels along the vessel, dimension: dimensionless, description: 'relative to its peak near the inlet, in
    per cent'}
- {id: segment_length, name: length of an arterial segment, dimension: '[length]'}
- {id: initial_lumen_radius, name: lumen radius of a segment at zero transmural pressure (37-artery network), dimension: '[length]', description: 'mesh.txt col 5 and 6: the radius at the start and the end
    of the segment'}
- {id: wall_thickness, name: wall thickness of a segment, dimension: '[length]'}
- {id: initial_wave_speed, name: pulse wave velocity of a segment at its initial area, dimension: '[length]/[time]'}
- {id: peripheral_resistance, name: resistance of the terminal element of an outlet segment (37-artery network), dimension: '[pressure]*[time]/[length]**3'}
- {id: lumen_radius, name: lumen radius at the proximal or distal end of a segment (ADAN56), dimension: '[length]'}
- {id: proximal_resistance, name: proximal resistance R1 of a three-element Windkessel, dimension: '[pressure]*[time]/[length]**3'}
- {id: distal_resistance, name: distal resistance R2 of a three-element Windkessel, dimension: '[pressure]*[time]/[length]**3'}
- {id: windkessel_compliance, name: compliance C of a three-element Windkessel, dimension: '[length]**4*[time]**2/[mass]'}
