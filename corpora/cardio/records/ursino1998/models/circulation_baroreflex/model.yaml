  Vu_ev0: {quantity: unstressed_volume, unit: "ml"}
  T0: {quantity: heart_period, unit: "s"}
  tau_Emax_lv: {quantity: effector_time_constant, unit: "s"}
  tau_Emax_rv: {quantity: effector_time_constant, unit: "s"}
  tau_R_sp: {quantity: effector_time_constant, unit: "s"}
  tau_R_ep: {quantity: effector_time_constant, unit: "s"}
  tau_Vu_sv: {quantity: effector_time_constant, unit: "s"}
  tau_Vu_ev: {quantity: effector_time_constant, unit: "s"}
  tau_T_s: {quantity: effector_time_constant, unit: "s"}
  tau_T_v: {quantity: effector_time_constant, unit: "s"}
  D_Emax_lv: {quantity: effector_delay, unit: "s"}
  D_Emax_rv: {quantity: effector_delay, unit: "s"}
  D_R_sp: {quantity: effector_delay, unit: "s"}
  D_R_ep: {quantity: effector_delay, unit: "s"}
  D_Vu_sv: {quantity: effector_delay, unit: "s"}
  D_Vu_ev: {quantity: effector_delay, unit: "s"}
  D_T_s: {quantity: effector_delay, unit: "s"}
  D_T_v: {quantity: effector_delay, unit: "s"}
outputs:
  CO: {quantity: cardiac_output, unit: "ml/s"}
  F_sp: {quantity: splanchnic_flow, unit: "ml/s"}
  sp_fraction: {quantity: splanchnic_flow_fraction, unit: "percent"}
  SAP: {quantity: mean_arterial_pressure, unit: "mmHg"}
  T: {quantity: heart_period, unit: "s"}
  Emax_lv: {quantity: end_systolic_elastance, unit: "mmHg/ml"}
  Emax_rv: {quantity: end_systolic_elastance, unit: "mmHg/ml"}
  R_sp: {quantity: hydraulic_resistance, unit: "mmHg*s/ml"}
  R_ep: {quantity: hydraulic_resistance, unit: "mmHg*s/ml"}
  Vu_sv: {quantity: unstressed_volume, unit: "ml"}
  Vu_ev: {quantity: unstressed_volume, unit: "ml"}
settings: {dt: 0.002, t_settle: 150.0, t_average: 20.0}
stochastic: false
# Closed loop (Pcs = Psa). Integrated from a fixed starting state near the basal state for t_settle seconds,
# then outputs are trapezoidal time averages over the whole heart periods completed in the next
# t_average seconds (the paper: a 20-s tracing in stationary conditions, an integer number of heart
# periods, trapezoidal rule). Integration is classical fixed-step Runge-Kutta (the paper used adaptive
# RKF45 with steps up to 0.01 s and tolerance 1e-6); pure delays read the efferent frequency stored at t - D.
