id: emax_ratio
name: right-to-left end-systolic elastance ratio
role: model
stated: {page: 4, printed_page: "H1736", quote: "These data suggest the following ratios between", where: text}
equation: "Emax,rv/Emax,lv"
inputs:
  Emax_rv: {quantity: end_systolic_elastance, unit: mmHg/ml}
  Emax_lv: {quantity: end_systolic_elastance, unit: mmHg/ml}
outputs:
  ratio: {quantity: emax_ratio_rv_lv, unit: dimensionless}
settings: {}
stochastic: false
