id: pacing_co_change
name: change in cardiac output for an imposed increase in heart rate (artificial pacing)
role: model
stated: {page: 7, printed_page: "H1739", quote: "period was cut in the model and heart period was given", where: text}
equation: "Eqs. 1-37 with T imposed (T = 60/HR) in place of Eq. 42; dCO = CO(HR (1 + dHR)) / CO(HR) - 1"
built_from: [circulation_baroreflex]
inputs:
  C_sa: {quantity: compliance, unit: "ml/mmHg"}
  C_sp: {quantity: compliance, unit: "ml/mmHg"}
  C_ep: {quantity: compliance, unit: "ml/mmHg"}
  C_sv: {quantity: compliance, unit: "ml/mmHg"}
  C_ev: {quantity: compliance, unit: "ml/mmHg"}
  C_pa: {quantity: compliance, unit: "ml/mmHg"}
  C_pp: {quantity: compliance, unit: "ml/mmHg"}
  C_pv: {quantity: compliance, unit: "ml/mmHg"}
  Vu_sa: {quantity: unstressed_volume, unit: "ml"}
  Vu_sp: {quantity: unstressed_volume, unit: "ml"}
  Vu_ep: {quantity: unstressed_volume, unit: "ml"}
  Vu_pa: {quantity: unstressed_volume, unit: "ml"}
  Vu_pp: {quantity: unstressed_volume, unit: "ml"}
  Vu_pv: {quantity: unstressed_volume, unit: "ml"}
  R_sa: {quantity: hydraulic_resistance, unit: "mmHg*s/ml"}
  R_sv: {quantity: hydraulic_resistance, unit: "mmHg*s/ml"}
  R_ev: {quantity: hydraulic_resistance, unit: "mmHg*s/ml"}
  R_pa: {quantity: hydraulic_resistance, unit: "mmHg*s/ml"}
  R_pp: {quantity: hydraulic_resistance, unit: "mmHg*s/ml"}
  R_pv: {quantity: hydraulic_resistance, unit: "mmHg*s/ml"}
  L_sa: {quantity: inertance, unit: "mmHg*s^2/ml"}
  L_pa: {quantity: inertance, unit: "mmHg*s^2/ml"}
  Vt: {quantity: total_blood_volume, unit: "ml"}
  C_la: {quantity: compliance, unit: "ml/mmHg"}
  Vu_la: {quantity: unstressed_volume, unit: "ml"}
  R_la: {quantity: hydraulic_resistance, unit: "mmHg*s/ml"}
  P0_lv: {quantity: ed_pressure_scale, unit: "mmHg"}
  kE_lv: {quantity: ed_stiffness, unit: "1/ml"}
  Vu_lv: {quantity: ventricle_unstressed_volume, unit: "ml"}
  kR_lv: {quantity: ventricle_viscosity_coefficient, unit: "s/ml"}
  C_ra: {quantity: compliance, unit: "ml/mmHg"}
  Vu_ra: {quantity: unstressed_volume, unit: "ml"}
  R_ra: {quantity: hydraulic_resistance, unit: "mmHg*s/ml"}
  P0_rv: {quantity: ed_pressure_scale, unit: "mmHg"}
  kE_rv: {quantity: ed_stiffness, unit: "1/ml"}
  Vu_rv: {quantity: ventricle_unstressed_volume, unit: "ml"}
  kR_rv: {quantity: ventricle_viscosity_coefficient, unit: "s/ml"}
  ksys: {quantity: systole_rate_coefficient, unit: "s^2"}
  Tsys0: {quantity: systole_duration, unit: "s"}
  Pn: {quantity: carotid_sinus_pressure, unit: "mmHg"}
  ka: {quantity: afferent_slope_pressure, unit: "mmHg"}
  fmin: {quantity: afferent_frequency, unit: "1/s"}
  fmax: {quantity: afferent_frequency, unit: "1/s"}
  tau_z: {quantity: afferent_time_constant, unit: "s"}
  tau_p: {quantity: afferent_time_constant, unit: "s"}
  fes_inf: {quantity: sympathetic_frequency, unit: "1/s"}
  fes0: {quantity: sympathetic_frequency, unit: "1/s"}
  kes: {quantity: sympathetic_decay_constant, unit: "s"}
  fes_min: {quantity: sympathetic_frequency, unit: "1/s"}
  fev0: {quantity: vagal_frequency, unit: "1/s"}
  fev_inf: {quantity: vagal_frequency, unit: "1/s"}
  kev: {quantity: vagal_sigmoid_scale, unit: "1/s"}
  fcs0: {quantity: afferent_frequency, unit: "1/s"}
  G_Emax_lv: {quantity: emax_gain, unit: "mmHg*s/ml"}
  G_Emax_rv: {quantity: emax_gain, unit: "mmHg*s/ml"}
  G_R_sp: {quantity: resistance_gain, unit: "mmHg*s^2/ml"}
  G_R_ep: {quantity: resistance_gain, unit: "mmHg*s^2/ml"}
  G_Vu_sv: {quantity: volume_gain, unit: "ml*s"}
  G_Vu_ev: {quantity: volume_gain, unit: "ml*s"}
  G_T_s: {quantity: heart_period_gain, unit: "s^2"}
  G_T_v: {quantity: heart_period_gain, unit: "s^2"}
  Emax_lv0: {quantity: end_systolic_elastance, unit: "mmHg/ml"}
  Emax_rv0: {quantity: end_systolic_elastance, unit: "mmHg/ml"}
  R_sp0: {quantity: hydraulic_resistance, unit: "mmHg*s/ml"}
  R_ep0: {quantity: hydraulic_resistance, unit: "mmHg*s/ml"}
  Vu_sv0: {quantity: unstressed_volume, unit: "ml"}
  Vu_ev0: {quantity: unstressed_volume, unit: "ml"}
  T0: {quantity: heart_period, unit: "s"}
  tau_Emax_lv: {quantity: effector_time_constant, unit: "s"}
  tau_Emax_rv: {quantity: effector_time_constant, unit: "s"}
  tau_R_sp: {quantity: effector_time_constant, unit: "s"}
  tau_R_ep: {quantity: effector_time_constant, unit: "s"}
  tau_Vu_sv: {quantity: effector_time_constant, unit: "s"}
  tau_Vu_ev: {quantity: effector_time_constant, unit: "s"}
  tau_T_s: {quantity: effector_time_constant, unit: "s"}
  tau_T_v: {quantity: effector_time_constant, unit: "s"}
  D_Emax_lv: {quantity: effector_delay, unit: "s"}
  D_Emax_rv: {quantity: effector_delay, unit: "s"}
  D_R_sp: {quantity: effector_delay, unit: "s"}
  D_R_ep: {quantity: effector_delay, unit: "s"}
  D_Vu_sv: {quantity: effector_delay, unit: "s"}
  D_Vu_ev: {quantity: effector_delay, unit: "s"}
  D_T_s: {quantity: effector_delay, unit: "s"}
  D_T_v: {quantity: effector_delay, unit: "s"}
  HR: {quantity: heart_rate, unit: "1/min"}
  dHR: {quantity: heart_rate_change, unit: "percent"}
outputs:
  dCO: {quantity: cardiac_output_change, unit: "percent"}
  CO_low: {quantity: cardiac_output, unit: "ml/s"}
  CO_high: {quantity: cardiac_output, unit: "ml/s"}
settings: {dt: 0.002, t_settle: 150.0, t_average: 20.0}
stochastic: false
