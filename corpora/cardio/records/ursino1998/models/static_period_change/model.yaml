id: static_period_change
name: open-loop static change in heart period with carotid sinus pressure (Eqs. 31-42 at steady state)
role: model
stated:
  page: 8
  printed_page: H1740
  quote: comparison of model heart
  where: Fig. 7 legend; Eqs. 38-42
equation: dT = T(Pcs) - T(P_ref), T = G_Ts ln(fes - fes,min + 1) + G_Tv fev + T0 (reflex_static)
built_from:
- reflex_static
inputs:
  Pn:
    quantity: carotid_sinus_pressure
    unit: mmHg
  ka:
    quantity: afferent_slope_pressure
    unit: mmHg
  fmin:
    quantity: afferent_frequency
    unit: 1/s
  fmax:
    quantity: afferent_frequency
    unit: 1/s
  fes_inf:
    quantity: sympathetic_frequency
    unit: 1/s
  fes0:
    quantity: sympathetic_frequency
    unit: 1/s
  kes:
    quantity: sympathetic_decay_constant
    unit: s
  fes_min:
    quantity: sympathetic_frequency
    unit: 1/s
  fev0:
    quantity: vagal_frequency
    unit: 1/s
  fev_inf:
    quantity: vagal_frequency
    unit: 1/s
  kev:
    quantity: vagal_sigmoid_scale
    unit: 1/s
  fcs0:
    quantity: afferent_frequency
    unit: 1/s
  G_Emax_lv:
    quantity: emax_gain
    unit: mmHg*s/ml
  G_Emax_rv:
    quantity: emax_gain
    unit: mmHg*s/ml
  G_R_sp:
    quantity: resistance_gain
    unit: mmHg*s^2/ml
  G_R_ep:
    quantity: resistance_gain
    unit: mmHg*s^2/ml
  G_Vu_sv:
    quantity: volume_gain
    unit: ml*s
  G_Vu_ev:
    quantity: volume_gain
    unit: ml*s
  G_T_s:
    quantity: heart_period_gain
    unit: s^2
  G_T_v:
    quantity: heart_period_gain
    unit: s^2
  Emax_lv0:
    quantity: end_systolic_elastance
    unit: mmHg/ml
  Emax_rv0:
    quantity: end_systolic_elastance
    unit: mmHg/ml
  R_sp0:
    quantity: hydraulic_resistance
    unit: mmHg*s/ml
  R_ep0:
    quantity: hydraulic_resistance
    unit: mmHg*s/ml
  Vu_sv0:
    quantity: unstressed_volume
    unit: ml
  Vu_ev0:
    quantity: unstressed_volume
    unit: ml
  T0:
    quantity: heart_period
    unit: s
  Pcs:
    quantity: carotid_sinus_pressure
    unit: mmHg
  P_ref:
    quantity: carotid_sinus_pressure
    unit: mmHg
    description: the pressure at which the change is zero
outputs:
  dT:
    quantity: heart_period_change
    unit: s
settings: {}
stochastic: false
