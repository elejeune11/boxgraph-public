  printed_page: H1740
  quote: given different constant values ranging between 40 and
  where: text; Fig. 7
equation: Eqs. 1-42 with Pcs a constant instead of Psa; outputs SAP, CO and Rsa + (Rsp + Rsv)||(Rep + Rev), each
  over its value at Pcs = P_norm
