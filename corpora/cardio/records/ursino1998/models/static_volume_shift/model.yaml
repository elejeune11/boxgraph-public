id: static_volume_shift
name: open-loop static volume shifts of the splanchnic and extrasplanchnic beds at constant venous pressure and
  flow
role: model
stated:
  page: 8
  printed_page: H1740
  quote: puted by maintaining constant venous pressures and
  where: text; Fig. 7 top
equation: 'V_bed = Vu_p + C_p P_p + Vu_v + C_v P_v with P_v fixed and P_p = P_v + F R_p (F fixed): shift = [V_bed(P_ref)
  - V_bed(P)]/M = [Vu_v(P_ref) - Vu_v(P) + C_p F (R_p(P_ref) - R_p(P))]/M, Vu_v and R_p from Eqs. 35-37 at steady
  state (reflex_static)'
from_words: true
built_from:
- reflex_static
inputs:
  Pn:
    quantity: carotid_sinus_pressure
    unit: mmHg
  ka:
    quantity: afferent_slope_pressure
    unit: mmHg
  fmin:
    quantity: afferent_frequency
    unit: 1/s
  fmax:
    quantity: afferent_frequency
    unit: 1/s
  fes_inf:
    quantity: sympathetic_frequency
    unit: 1/s
  fes0:
    quantity: sympathetic_frequency
    unit: 1/s
  kes:
    quantity: sympathetic_decay_constant
    unit: s
  fes_min:
    quantity: sympathetic_frequency
    unit: 1/s
  fev0:
    quantity: vagal_frequency
    unit: 1/s
  fev_inf:
    quantity: vagal_frequency
    unit: 1/s
  kev:
    quantity: vagal_sigmoid_scale
    unit: 1/s
  fcs0:
    quantity: afferent_frequency
    unit: 1/s
  G_Emax_lv:
    quantity: emax_gain
    unit: mmHg*s/ml
  G_Emax_rv:
    quantity: emax_gain
    unit: mmHg*s/ml
  G_R_sp:
    quantity: resistance_gain
    unit: mmHg*s^2/ml
  G_R_ep:
    quantity: resistance_gain
    unit: mmHg*s^2/ml
  G_Vu_sv:
    quantity: volume_gain
    unit: ml*s
  G_Vu_ev:
    quantity: volume_gain
    unit: ml*s
  G_T_s:
    quantity: heart_period_gain
    unit: s^2
  G_T_v:
    quantity: heart_period_gain
    unit: s^2
  Emax_lv0:
    quantity: end_systolic_elastance
    unit: mmHg/ml
  Emax_rv0:
    quantity: end_systolic_elastance
    unit: mmHg/ml
  R_sp0:
    quantity: hydraulic_resistance
    unit: mmHg*s/ml
  R_ep0:
    quantity: hydraulic_resistance
    unit: mmHg*s/ml
  Vu_sv0:
    quantity: unstressed_volume
    unit: ml
  Vu_ev0:
    quantity: unstressed_volume
    unit: ml
  T0:
    quantity: heart_period
    unit: s
  Pcs_n:
    quantity: carotid_pressure_normalized
    unit: dimensionless
    description: carotid sinus pressure over P_norm (the x axis of Fig. 7)
  P_norm:
    quantity: carotid_sinus_pressure
    unit: mmHg
    description: the pressure that is 1 on that axis
  P_ref:
    quantity: carotid_sinus_pressure
    unit: mmHg
    description: the pressure at which the shift is zero
  M:
    quantity: body_mass
    unit: kg
  C_sp:
    quantity: compliance
    unit: ml/mmHg
  C_ep:
    quantity: compliance
    unit: ml/mmHg
  F_sp:
    quantity: splanchnic_flow
    unit: ml/s
    description: splanchnic flow, held constant
  F_ep:
    quantity: extrasplanchnic_flow
    unit: ml/s
    description: extrasplanchnic flow, held constant
outputs:
  shift_sp:
    quantity: venous_volume_shift_splanchnic
    unit: ml/kg
  shift_ep:
    quantity: venous_volume_shift_extrasplanchnic
    unit: ml/kg
settings: {}
stochastic: false
