- id: HR_pacing_low
  quantity: heart_rate
  unit: 1/min
  printed: "60"
  basis: "The paper says a 30% increase in heart rate gives a 15% increase in cardiac output when heart rate lies in the range of 60-90 beats/min (p. 10), but not from which rate; the lower end of the range is taken"
  alternatives: ["69.2", "65", "70"]
  stands_for: "starting heart rate of the 30% pacing step"
- id: Pcs_full_low
  quantity: carotid_sinus_pressure
  unit: mmHg
  printed: "0"
  basis: "'Over the whole baroreceptor sensitivity range' (p. 5) and 'total reflex change' are not given as pressures; a pressure far below threshold, where the afferent sigmoid (Eq. 31) is at fmin, is taken"
  alternatives: ["50", "40"]
  stands_for: "low end of the carotid sinus pressure range for the static reflex changes"
- id: Pcs_full_high
  quantity: carotid_sinus_pressure
  unit: mmHg
  printed: "250"
  basis: "As for Pcs_full_low: a pressure far above saturation, where Eq. 31 is at fmax and fes is below fes,min"
  alternatives: ["200", "150"]
  stands_for: "high end of the carotid sinus pressure range for the static reflex changes"
- id: P_ref_fig3
  quantity: carotid_sinus_pressure
  unit: mmHg
  printed: '92'
  basis: Fig. 3 top gives intrasinus pressure in % of an unstated pressure; the text puts the sigmoid's central point at 92
    mmHg (p. 4), taken as 100%
  alternatives:
  - '100'
  - '85'
  stands_for: 100% on the x axis of Fig. 3 top
- id: A_static
  quantity: pulsation_amplitude
  unit: mmHg
  printed: '0'
  basis: the static sigmoid of Fig. 3 top (continuous line) and the static data are without pulsation
  alternatives: []
  stands_for: no pulsation
- id: P_norm_fig7
  quantity: carotid_sinus_pressure
  unit: mmHg
  printed: '92'
  basis: Fig. 7 gives intrasinus pressure 'norm.' without the pressure it is divided by; Pn = 92 mmHg (Table 3), the sigmoid's
    centre, is taken, which puts the simulated 40-150 mmHg (p. 8) at 0.43-1.63 as the curves span
  alternatives:
  - '100'
  - '95'
  stands_for: 1 on the x axes of Fig. 7 (and the pressure where SAP, CO and R are normalized)
- id: P_ref_vol
  quantity: carotid_sinus_pressure
  unit: mmHg
  printed: '150'
  basis: the volume shifts of Fig. 7 top are zero at the right end of the curves, the highest simulated pressure, 150 mmHg
    (p. 8)
  alternatives:
  - '250'
  stands_for: carotid pressure of zero volume shift
- id: P_ref_T
  quantity: carotid_sinus_pressure
  unit: mmHg
  printed: '40'
  basis: the heart period change of Fig. 7 middle left is zero at the left end of the curve, the lowest simulated pressure,
    40 mmHg (p. 8)
  alternatives:
  - '0'
  - '30'
  stands_for: carotid pressure of zero heart period change
- id: F_ep_added
  quantity: extrasplanchnic_flow
  unit: l/min
  printed: '3.73'
  basis: the volume shifts are computed at constant flows (p. 8), not printed; the splanchnic flow is 1.6 l/min, about 30%
    of cardiac output (p. 4), so the rest is 1.6/0.3 - 1.6
  alternatives:
  - '3.2'
  - '4.2'
  stands_for: extrasplanchnic flow held constant in Fig. 7 top right
- id: G_T_v_vagot
  quantity: heart_period_gain
  unit: s^2
  printed: '0'
  basis: vagotomized conditions are fev = 0 in the model (p. 8); in Eq. 40 that is the same as G_T,v = 0
  alternatives: []
  stands_for: vagotomy
