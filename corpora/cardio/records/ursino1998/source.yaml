notes: >
  Scope: the paper's quantitative core, the closed-loop pulsatile model of the heart, circulation
  and carotid baroreflex (Appendix Eqs. 1-42), with every parameter of Tables 1-3 and the text
  (5300 ml blood volume, 70-kg subject). It is recorded as circulation_baroreflex: eight vascular
  compartments, two atria and elastance-variable ventricles with viscous resistance, the afferent
  first-order dynamics and sigmoid, the sympathetic and vagal efferent curves and the delayed
  first-order effectors on Emax, Rsp, Rep, Vu,sv, Vu,ev and heart period. It runs to the
  closed-loop basal steady state (run_basal) and is used by pacing_co_change, where heart period is
  imposed as in the paper's pacing simulations. reflex_static is the open-loop steady state of
  Eqs. 30-42 at a constant carotid pressure, and reflex_range gives the static reflex changes the
  text says the effector gains were set to reproduce. Small models check printed ratios (Emax,rv/Emax,lv
  = 0.59, Vu,rv/Vu,lv = 2.45) and T = 1/HR (1.2 Hz, 72 beats/min, 0.833 s).

  Printed results compared: the basal controlled values in Tables 1 and 2 (Emax,lv, Emax,rv, Rsp, Rep,
  Vu,sv, Vu,ev, T) against the model's closed-loop basal state (consistency) and against the static
  operating point at Pcs = Pn (approximation); the basal splanchnic flow 1.6 l/min and its ~30% share
  of cardiac output; the pacing statement "a 30% increase in heart rate causing only 15% increase in
  cardiac output" (reproduction, starting rate added); and the effector design targets of pp. 4-5
  (~33% Emax change, ~200-210% total resistance increase, 70% splanchnic resistance increase,
  ~15 ml/kg total and 10 ml/kg splanchnic venous unstressed volume changes; validation against the
  cited experimental data). Tables 1/2 and Table 3 cannot agree exactly at any single basal
  sympathetic frequency (q_basal_vs_table3), and the printed Vu ratio 2.45 differs from the Table 2
  values' 2.43 (q_vu_ratio).

  Numerics are added choices: fixed-step RK4 at dt = 0.002 s (the paper used adaptive RKF45 in
  SIMNON, steps up to 0.01 s, tolerance 1e-6), 150 s of settling from a fixed starting state, and
  20-s whole-period trapezoidal averages as the paper describes; refinements cover dt, settling and
  averaging time.

  Left out: every figure (Figs. 2-9). Almost all of the paper's results are only plotted, but the
  figure-reading commands were not available to this reading job, so no figure is read
  (figures.md lists what each holds; q_figures_not_read). With them left out, the open-loop
  pulsatility, Starling-curve, Fig. 7 open-loop and hemorrhage (10% loss in 5 s, 80 s) simulations
  have no printed number to compare and are not run, though circulation_baroreflex contains the
  equations they need (the Starling preparation with fixed Pra and SAP and the hemorrhage input
  I(t) of Eq. 11 would need small extensions). Also left out are qualitative statements, the
  parameter-assignment percentages that feed no equation (canine-to-human volume rescaling of 1/3 to
  1/4), and ka = (fmax - fmin)/(4 Gb), since Gb is not printed.

  Figure pass (2026-11-03): the figures are now read with calibrated code (figures.yaml, the
  record's figures/ code; figures.md gives each panel, its calibration and what was left out), so
  the "left out: every figure" above is superseded. Read: Fig. 2 middle and bottom, Fig. 3 (static
  sigmoid, the three pulsation curves, both data sets, modulus and phase), Fig. 5 (five of six
  Starling curves, and the percent changes with Kostiuk's data), Fig. 6, Fig. 7 (model lines,
  Brunner, Eckberg, Cox, Shoukas and Schmidt data), Fig. 8 (three of four series in each panel)
  and Fig. 9. Left out: Fig. 2 top (a loop), Fig. 4 (3-D perspective surfaces), and the series
  drawn with thin x, + and asterisk marks, and the vagotomized model lines of Fig. 7 bottom, which
  could not be told apart from the lines over them. New models run them: afferent_transfer (Eq. 30 in the
  frequency domain), afferent_pulsatile (Eqs. 30-31 under a sinusoidal pressure), static_volume_shift
  (from the words "constant venous pressures and flows", q_fig7_volume_shift), static_period_change,
  open_loop_static (circulation_baroreflex with the carotid pressure held) and pacing_curve. The
  added choices are 100% = 92 mmHg in Fig. 3, the normalizing and reference pressures of Fig. 7
  and the constant extrasplanchnic flow (q_fig3_percent, q_fig7_axes, q_fig7c_axis). The Starling
  curves, the pulsating open-loop curves of Fig. 8A and the hemorrhage bars of Fig. 9 are recorded
  without a run (q_figures_read). The Fig. 9 model bars are compared with Kumada's.
