# Circulation (Table 1, Fig. 1, Eqs. 1-11)
- {id: compliance, name: compartment compliance, dimension: "[length]**3/[pressure]", description: "C of a vascular compartment or of an atrium: stressed volume stored per unit pressure"}
- {id: unstressed_volume, name: compartment unstressed volume, dimension: "[length]**3", description: "Vu of a vascular compartment or of an atrium: volume at zero pressure"}
- {id: hydraulic_resistance, name: hydraulic resistance, dimension: "[pressure]*[time]/[length]**3", description: "R of a vascular compartment or of an atrioventricular valve"}
- {id: inertance, name: blood inertance, dimension: "[pressure]*[time]**2/[length]**3", description: "L of a large-artery compartment"}
- {id: total_blood_volume, name: total blood volume, dimension: "[length]**3", description: "Vt, blood volume contained in the whole circulation"}
# Heart (Table 2, Eqs. 12-29)
- {id: ed_pressure_scale, name: end-diastolic pressure-volume scale, dimension: "[pressure]", description: "P0 in Eqs. 18 and 29"}
- {id: ed_stiffness, name: end-diastolic pressure-volume exponent, dimension: "1/[length]**3", description: "kE in Eqs. 18 and 29"}
- {id: ventricle_unstressed_volume, name: ventricle end-systolic unstressed volume, dimension: "[length]**3", description: "Vu of a ventricle: x-axis intercept of the end-systolic pressure-volume line (Eq. 18)"}
- {id: end_systolic_elastance, name: end-systolic elastance, dimension: "[pressure]/[length]**3", description: "Emax, slope of the end-systolic pressure-volume line of a ventricle"}
- {id: ventricle_viscosity_coefficient, name: ventricle viscous resistance coefficient, dimension: "[time]/[length]**3", description: "kR in Eqs. 16 and 27: ventricle resistance per unit isometric pressure"}
- {id: heart_period, name: heart period, dimension: "[time]", description: "T, duration of one cardiac cycle"}
- {id: heart_rate, name: heart rate, dimension: "1/[time]", description: "HR = 1/T"}
- {id: systole_duration, name: duration of systole, dimension: "[time]", description: "Tsys, and Tsys,0 in Eq. 22"}
- {id: systole_rate_coefficient, name: systole shortening coefficient, dimension: "[time]**2", description: "ksys in Eq. 22"}
# Baroreflex (Table 3, Eqs. 30-42)
- {id: carotid_sinus_pressure, name: carotid sinus pressure, dimension: "[pressure]", description: "Pcs, or the central point Pn of the afferent sigmoid (Eq. 31)"}
- {id: afferent_slope_pressure, name: afferent sigmoid slope parameter, dimension: "[pressure]", description: "ka in Eqs. 31-32"}
- {id: afferent_frequency, name: carotid sinus nerve spike frequency, dimension: "1/[time]", description: "fcs and its limits fmin, fmax and central value fcs,0"}
- {id: afferent_time_constant, name: afferent dynamics time constant, dimension: "[time]", description: "tau_z and tau_p in Eq. 30"}
- {id: sympathetic_frequency, name: efferent sympathetic spike frequency, dimension: "1/[time]", description: "fes and the constants fes,0, fes,inf, fes,min (Eqs. 33, 35)"}
- {id: sympathetic_decay_constant, name: sympathetic efferent decay constant, dimension: "[time]", description: "kes in Eq. 33 (per unit afferent frequency)"}
- {id: vagal_frequency, name: efferent vagal spike frequency, dimension: "1/[time]", description: "fev and the constants fev,0, fev,inf (Eq. 34)"}
- {id: vagal_sigmoid_scale, name: vagal sigmoid slope parameter, dimension: "1/[time]", description: "kev in Eq. 34"}
- {id: emax_gain, name: end-systolic elastance reflex gain, dimension: "[pressure]*[time]/[length]**3", description: "G_Emax in Eq. 35, printed per spikes/s"}
- {id: resistance_gain, name: peripheral resistance reflex gain, dimension: "[pressure]*[time]**2/[length]**3", description: "G_R in Eq. 35, printed per spikes/s"}
- {id: volume_gain, name: venous unstressed volume reflex gain, dimension: "[length]**3*[time]", description: "G_Vu in Eq. 35, printed per spikes/s"}
- {id: heart_period_gain, name: heart period reflex gain, dimension: "[time]**2", description: "G_T,s and G_T,v in Eqs. 38 and 40, printed per spikes/s"}
- {id: effector_time_constant, name: effector time constant, dimension: "[time]", description: "tau_theta in Eqs. 36, 39, 41"}
- {id: effector_delay, name: effector pure delay, dimension: "[time]", description: "D_theta in Eqs. 35, 38, 40"}
- {id: body_mass, name: body mass, dimension: "[mass]"}
# Results
- {id: cardiac_output, name: mean cardiac output, dimension: "[length]**3/[time]", description: "time-averaged flow out of the left ventricle"}
- {id: splanchnic_flow, name: mean splanchnic blood flow, dimension: "[length]**3/[time]", description: "time-averaged flow through the splanchnic peripheral resistance Rsp"}
- {id: splanchnic_flow_fraction, name: splanchnic share of cardiac output, dimension: dimensionless}
- {id: mean_arterial_pressure, name: mean systemic arterial pressure, dimension: "[pressure]"}
- {id: emax_ratio_rv_lv, name: right-to-left end-systolic elastance ratio, dimension: dimensionless, description: "Emax,rv / Emax,lv"}
- {id: vu_ratio_rv_lv, name: right-to-left ventricle unstressed volume ratio, dimension: dimensionless, description: "Vu,rv / Vu,lv"}
- {id: heart_rate_change, name: relative increase in heart rate, dimension: dimensionless}
- {id: cardiac_output_change, name: relative increase in mean cardiac output, dimension: dimensionless}
- {id: emax_reflex_change, name: reflex change in end-systolic elastance relative to basal, dimension: dimensionless, description: "change of Emax,lv between two carotid sinus pressures, as a fraction of its basal value"}
- {id: splanchnic_resistance_increase, name: reflex increase in splanchnic resistance, dimension: dimensionless, description: "relative increase of Rsp from high to low carotid sinus pressure"}
- {id: total_resistance_increase, name: reflex increase in total systemic resistance, dimension: dimensionless, description: "relative increase of the total systemic resistance from high to low carotid sinus pressure"}
- {id: reflex_venous_volume_change_total, name: total reflex change in venous unstressed volume per body mass, dimension: "[length]**3/[mass]", description: "magnitude of the change in Vu,sv + Vu,ev over a carotid pressure range, per kg"}
- {id: reflex_venous_volume_change_splanchnic, name: reflex change in splanchnic venous unstressed volume per body mass, dimension: "[length]**3/[mass]", description: "magnitude of the change in Vu,sv over a carotid pressure range, per kg"}
# Figure readings (pass 2026-11-03)
- {id: carotid_pressure_normalized, name: "carotid sinus pressure relative to a reference pressure", dimension: "dimensionless", description: "Pcs over the pressure that is 1 (or 100%) on the x axes of Figs. 3, 5 and 7"}
- {id: carotid_pressure_frequency, name: "frequency of a sinusoidal carotid sinus pressure", dimension: "1/[time]"}
- {id: afferent_gain_normalized, name: "normalized modulus of the baroreceptor transfer function", dimension: "dimensionless", description: "|P~/Pcs| of Eq. 30 in the frequency domain"}
- {id: afferent_phase, name: "phase of the baroreceptor transfer function", dimension: "dimensionless", description: "angle of P~/Pcs of Eq. 30, in degrees"}
- {id: pulsation_amplitude, name: "peak-to-peak amplitude of a sinusoidal carotid sinus pressure", dimension: "[pressure]"}
- {id: stroke_volume, name: "stroke volume of the left ventricle", dimension: "[length]**3"}
- {id: dsv_dhr_normalized, name: "slope of stroke volume against heart rate, normalized to its value at 80 beats/min", dimension: "dimensionless", description: "Fig. 6 bottom"}
- {id: venous_volume_shift_splanchnic, name: "blood volume shifted out of the splanchnic bed per body mass", dimension: "[length]**3/[mass]", description: "Fig. 7 top left, at constant flow and venous pressure"}
- {id: venous_volume_shift_extrasplanchnic, name: "blood volume shifted out of the extrasplanchnic bed per body mass", dimension: "[length]**3/[mass]", description: "Fig. 7 top right, at constant flow and venous pressure"}
- {id: heart_period_change, name: "change in heart period from its value at low carotid sinus pressure", dimension: "[time]", description: "Fig. 7 middle left"}
- {id: total_resistance_normalized, name: "total systemic resistance relative to its value at the reference carotid pressure", dimension: "dimensionless"}
- {id: mean_arterial_pressure_normalized, name: "mean systemic arterial pressure relative to its value at the reference carotid pressure", dimension: "dimensionless"}
- {id: cardiac_output_normalized, name: "mean cardiac output relative to its value at the reference carotid pressure", dimension: "dimensionless", description: "a ratio (Fig. 7) or a percentage (Fig. 5 bottom)"}
- {id: right_atrial_pressure, name: "right atrial pressure held constant (Starling preparation)", dimension: "[pressure]", description: "x axis of Fig. 5 top"}
- {id: fig9_variable, name: "which variable a Fig. 9 bar shows", dimension: "dimensionless", description: "1 SAP, 2 CO, 3 HR, 4 R: the groups of bars in Fig. 9, left to right"}
- {id: hemorrhage_percent_change, name: "percent change of a hemodynamic variable 80 s after a 10% hemorrhage", dimension: "dimensionless", description: "Fig. 9"}
- {id: extrasplanchnic_flow, name: "mean extrasplanchnic blood flow", dimension: "[length]**3/[time]", description: "time-averaged flow through Rep"}
- {id: time, name: time, dimension: "[time]"}
- {id: arterial_pressure, name: "instantaneous systemic arterial pressure", dimension: "[pressure]", description: "Psa(t), Fig. 2 middle"}
- {id: ventricular_outflow, name: "instantaneous flow out of the left ventricle", dimension: "[length]**3/[time]", description: "Fig. 2 bottom"}
