notes: >
  A morphometric paper: one formalin-fixed, paraffin-embedded block of the upper middle layer of the
  left ventricular anterior wall of one man of 60 (320 g heart, normal coronaries, fixed 3 h post
  mortem, no vessel injection), 200 serial 6 um sections, capillaries reconstructed in 3D; plus
  micronecrosis sizes measured in 10 autopsy hearts. All values are SD (p. 2). There are no equations;
  the record holds the three arithmetic relations the paper states or does. (1) The "theoretical
  tissue region supplied by a single capillary" (434.6, 319.5, 316.7 um2) is the reciprocal of the
  capillary density on the arteriolar side, middle and venular side (model capillary_tissue_area):
  all three reproduce. The same relation applied to the rat density the paper quotes from Batra et al.
  (2,247/mm2) gives about 445 um2, outside the 456-499 um2 that study reports, so Batra's tissue regions
  are not the reciprocal of its average density (a question). (2) The microcirculatory unit length and
  the micronecrosis length are stated to be twice the arteriolar-venular distance (model
  twice_av_distance); the inputs are approximate (~350 um) so these comparisons get no verdict. (3) The
  micronecrosis cross section is stated to equal the capillary bundle cross section (model
  necrosis_equals_bundle), again from approximate values (about 130 by 120 um). The block thickness
  (1.2 mm) is checked against 200 sections of 6 um. Consistency comparisons with the literature values
  the paper itself quotes (pig arteriolar-venular distance and capillary segment lengths of Kassab and
  Fung 1994, normal adult human density of Roberts and Wearn 1941, the 2,000-4,000/mm2 range of Rakusan
  et al. 1992) are entered as consistency checks with conditions_ok saying what differs; comparisons with
  the other human capillary records of the corpus (rakusan1992, campbell2011, mohammed2015) are for the
  cross-record job, since a comparison here can only use this record's data. Recorded but not modelled:
  the sinus volumes and sizes, the sinus count per cm3 (whose reconstruction volume is not stated;
  question), the terminal arteriole diameter, the arteriolar- and venular-side segment lengths, and the
  rat densities of Gerdes et al. Left out: the patients' ages, the magnifications and the hardware.
  Fig. 3 (histogram of capillary segment lengths, 20 um bins) was not digitized in the first pass (the
  figure commands were refused then); a later figure pass read it with calibrated code (fig3_hist) and
  checks its count, binned mean and SD against the printed n = 220 and 61.5 ± 41.6 um (model
  histogram_stats): the bars sum to 216 (question q_fig3_n_216; see figures.md). Fig. 4 prints its densities as a table, which are recorded. Figs. 1, 2, 5-8
  are reconstructions, micrographs and schemata with no values to read.
