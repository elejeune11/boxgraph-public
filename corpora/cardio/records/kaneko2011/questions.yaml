- id: q_area_relation_unstated
  kind: unstated_model
  about: [capillary_tissue_area, area_art, area_mid, area_ven]
  text: "The paper does not say how the 'theoretical tissue region supplied by a single capillary' was computed. The printed 434.6, 319.5 and 316.7 um2 equal 10^6 divided by the mean densities 2,301, 3,130 and 3,157 /mm2, so the record takes A = 1/N (10^6/3,157 = 316.76, which rounds to 316.8; the printed 316.7 is truncated, or the mean density was not exactly 3,157); a Voronoi or Krogh-cylinder area, as in Batra et al., would differ."
  citation: {page: 2, quote: "The theoretical tissue regions supplied by a single capillary on"}
- id: q_batra_area_density
  kind: unexplained_difference
  about: [area_rat_ven_batra, area_rat_art_batra, density_rat_batra, cmp_area_rat_batra]
  text: "The rat values quoted from Batra et al. (ref. 4) do not obey the reciprocal relation used for the human values: 1/(2,247 /mm2) is about 445 um2, below both the arteriolar (499) and venular (456) regions quoted from the same work. The paper sets its own reciprocal regions beside Batra's as like quantities; either Batra's regions are computed otherwise or the density is from a different group of that study."
  citation: {page: 4, quote: "the theoretical tissue region supplied by a single capillary"}
- id: q_av_similar
  kind: overstated_claim
  about: [av_distance, av_pig, cmp_av_pig]
  text: "The paper calls the pig arteriolar-venular distance of 510 um (Kassab and Fung) 'similar' to its ~350 um; it is about 45% longer. The human value is approximate and from one heart, so this comparison gets no verdict."
  citation: {page: 4, quote: "respectively. These distances are similar to"}
- id: q_seglen_pig
  kind: unexplained_difference
  about: [seg_len_mean, seg_len_pig]
  text: "The human mean capillary segment length (61.5 um) lies above the whole pig range quoted from Kassab and Fung (21.1-54.5 um). The paper reports both without comment. Species, method (sections against silicone casts) and the definition of a segment (Kassab and Fung's are per capillary order) differ."
  citation: {page: 4, quote: "Kassab and Fung (13) found a capillary"}
- id: q_density_vs_normal
  kind: unexplained_difference
  about: [density_art, density_rw_normal_range, density_rw_normal_mean]
  text: "The arteriolar-side density (2,301 /mm2) is below the whole normal adult range of Roberts and Wearn (2,993-4,066) and close to their hypertrophied mean (2,483); only the middle and venular values fall in the normal range. The paper says its densities are similar to those of other studies. Its tissue is formalin-fixed and paraffin-embedded with no stated shrinkage correction, which would raise a density measured in shrunken tissue, not lower it; the counts are from three points on each side of one path in one heart."
  citation: {page: 5, quote: "data for capillary densities were similar to those measured in"}
- id: q_density_n
  kind: reading
  about: [density_art, density_mid, density_ven, seg_len_art, seg_len_ven]
  text: "The densities are means ± SD over three counting points per side (Fig. 4), but the area counted at each point and the n behind the SD are not stated; the arteriolar- and venular-side segment lengths give no n. The overall mean segment length (61.5 um, n = 220) lies between the side means (58.9 and 71.1 um), as it should if it pools them with any middle segments, but the split cannot be checked."
  citation: {page: 2, quote: "the numbers of capillaries per millimeters squared were measured in the cross section"}
- id: q_sinus_count_volume
  kind: unstated_input
  about: [sinus_count_density]
  text: "The ~60,000 sinuses per cm3 is 'based on the number in the field of reconstruction', but neither the number of sinuses counted (two precapillary sinuses are named, capillary sinuses are not counted) nor the volume of that field is stated (the second-step field is 0.6 mm across; the first-step field is 2.3 mm across and 342 um thick; the block is 1.2 mm thick). The count cannot be reproduced."
  citation: {page: 2, quote: "based on the number in the field of reconstruction"}
- id: q_sinus_volume_size
  kind: unexplained_difference
  about: [sinus_vol_5c, cap_sinus_diameter, cap_sinus_length]
  text: "The capillary sinus of Fig. 5C has a printed volume of 4,180 um3, but a cylinder of the printed capillary-sinus sizes (30-50 um across, 50-80 um long) holds about 35,000-157,000 um3, and even a 30 x 50 um ellipsoid holds about 24,000 um3. Either the volumes were measured differently (lumen only, from the reconstruction) or the sizes are of the outer outline; the paper does not say."
  citation: {page: 2, quote: "The capillary sinuses ranged from 30 to 50"}
- id: q_reconstruction_depth
  kind: reading
  about: [n_sections, block_thickness_printed]
  text: "200 sections of 6 um make the 1.2 mm piece, but the first reconstruction step covers 342 um of thickness (57 sections) and the capillary reconstruction (25 images of a 0.6 mm field) states no depth. How much of the 200-section stack the capillary measurements use is not stated."
  citation: {page: 2, quote: "within the visual area of 2.3 mm in diameter and 342"}
- id: q_fig3_not_read
  kind: reading
  about: [seg_len_mean]
  text: "Fig. 3 (histogram of 220 capillary segment lengths in 20 um bins) was not digitized: the figure commands were refused in the session that wrote this record. Its bar heights would allow checking the printed n = 220 and mean 61.5 um against the histogram."
  citation: {page: 4, quote: "Frequency histograms of capillary segmental length"}
- id: q_unit_claim
  kind: overstated_claim
  about: [twice_av_distance, necrosis_equals_bundle, necrosis_length, necrosis_major, necrosis_minor]
  text: "The equality of micronecrosis size and microcirculatory unit rests on an approximate arteriolar-venular distance and bundle size from a single reconstructed heart, compared with lesions from 10 other hearts; the comparisons have no verdict because the inputs are approximate. The lesion major axis (131.5 ± 31.2 um) has an SD of nearly a quarter of its mean."
  citation: {page: 6, quote: "described above suggest that an intramyocardial"}
- id: q_density_vs_rakusan_adults
  kind: unexplained_difference
  about: [density_art, density_mid, density_ven, density_rakusan_range]
  text: "Audit (cross-record, not testable here: a comparison can only use this record's data). The paper cites Rakusan et al. 1992 (ref. 18, record rakusan1992) only for the 2,000-4,000/mm2 range of all adult mammals and calls its own densities similar. The human adult control value of that same study is 2,249 ± 85 /mm2 (mean ± SEM, n = 8, ages 15-30, formalin immersion-fixed transverse sections; rakusan1992/cd_adu_c). The arteriolar-side density here (2,301) agrees with it; the middle and venular values (3,130 and 3,157) are about 40% higher. Differences: one man of 60, upper middle layer, three counting points per side of one arteriole-venule path, no stated counting area; Rakusan counts are averaged over the LV wall of 8 younger hearts. The like-with-like comparison is a job for the cross-record layer."
  citation: {page: 5, quote: "data for capillary densities were similar to those measured in"}
- id: q_density_vs_campbell_length_density
  kind: unexplained_difference
  about: [density_art, density_mid, density_ven, area_art, area_ven]
  text: "Audit (cross-record). The paper states most capillaries run parallel to the fibers (p. 2), so a length density per volume would be at least the transverse density, i.e. about 2,300-3,160 mm/mm3 here, against the median 1,226 (men) and 1,141 (women) mm/mm3 of Campbell et al. 2011 (record campbell2011, CD31 biopsies of CABG patients, sections of unknown orientation). Equivalently, the Krogh radius sqrt(A/pi) of the tissue regions printed here (434.6 and 316.7 um2) is about 11.8 and 10.0 um, against Campbell's diffusion radius of 16-17 um. Disease, sampling site, staining and section orientation all differ; neither paper makes the comparison, and no relation between the two quantities is stated in this paper, so none is modelled."
  citation: {page: 2, quote: "most of the capillaries had a parallel arrangement with respect to the"}
- id: q_fig3_n_216
  kind: unexplained_difference
  about: [seg_len_hist_fig3, seg_count_fig3, cmp_fig3_n, q_fig3_not_read]
  text: "Read with calibrated code (fig3_hist), the ten bars of Fig. 3 are 35, 39, 50, 29, 24, 18, 9, 5, 4 and 3 segments (each within 0.15 of a whole number), which sum to 216, not the n = 220 printed in the legend and the Results. Either four segments lie outside the plotted 0-200 um range (longer than 200 um, which the axis does not show), or the histogram and the printed n come from different counts. The binned mean (61.9 um) and SD (42.0 um) are close to the printed 61.5 ± 41.6 um, so the histogram and the printed statistics describe nearly the same segments; four segments longer than 200 um would raise the mean by more than 2 um above the binned value, so they would not fit the printed mean either unless the binned midpoints overstate it."
  citation: {page: 4, quote: "Frequency histograms of capillary segmental length"}
# ---- Cross-record validation job: kaneko2011 with campbell2011 ----
- id: q_no_validation_campbell2011
  kind: unstated_model
  about: [capillary_tissue_area, density_art, density_mid, density_ven]
  text: "(Cross-record validation, kaneko2011 with campbell2011.) No validation was added in either direction. Neither paper cites the other. This record's capillary_tissue_area model (A = 1/N) takes a capillary density in transverse section and gives a tissue area per capillary; campbell2011 measures neither: it measures a capillary length density per volume (Lv = 2 QA from single sections of unknown orientation) and derives a diffusion radius from it. campbell2011's diffusion_radius model takes a length density, which this record does not measure; a transverse density equals it only for straight capillaries parallel to the fibres cut exactly across, a relation neither paper states, so the two quantities were not mapped as one. The other models of this record (segment-length histogram, micronecrosis, serial sections) have no counterpart among campbell2011's measurements. The size of the difference is recorded in q_density_vs_campbell_length_density."
  citation: {page: 2, quote: "The theoretical tissue regions supplied by a single capillary on", where: text}
# ---- Cross-record validation job: kaneko2011 with chilian1986 (2026-11-11) ----
- id: q_no_validation_chilian1986
  kind: choice
  about: [capillary_tissue_area, twice_av_distance, histogram_stats, necrosis_equals_bundle, serial_section_stack]
  text: "(Cross-record validation, kaneko2011 with chilian1986.) No validation was added in either direction. The models here take and give geometry of the human capillary network: tissue area per capillary from capillary density, unit and micronecrosis length from the arteriolar-venular distance, segment-length statistics from the Fig. 3 histogram, micronecrosis axes from the capillary bundle axes, and block thickness from serial sections. chilian1986 measures none of these. It measures cat epicardial microvascular and aortic pressures, subepicardial perfusion, and arteriole and venule diameters with their change on atmospheric exposure. Its models give pressure shares, resistances and relative diameter changes, and this record measures no pressure, flow or diameter change for them to predict. The only quantity both records measure is a vessel diameter (cat arterioles of about 50-200 um; human terminal arterioles here). No model in either record outputs a diameter, so comparing them would only test species and vessel class, not a model. Neither paper cites the other. See chilian1986/q_no_validation_kaneko2011."
  citation: {none: "a finding of the validation job between kaneko2011 and chilian1986, not a printed statement"}
# ---- Cross-record validation job: kaneko2011 with kassab1993 (2026-11-11) ----
- id: q_no_validation_kassab1993
  kind: choice
  about: [capillary_tissue_area, twice_av_distance, histogram_stats, necrosis_equals_bundle, serial_section_stack, seg_len_pig, av_pig]
  text: "(Cross-record validation, kaneko2011 with kassab1993.) No validation was added in either direction. The models here take a capillary density, an arteriolar-venular distance, a segment-length histogram, capillary bundle axes or a section count, quantities of the capillary network. kassab1993 measures the pig coronary arterial tree by Strahler order 1-11 (diameters, lengths, segments per element, element counts, connectivity, volumes); it records no capillary density, arteriolar-venular distance, segment-length histogram or bundle size, so no model here has an input it measures or an output it measures. The pig values this paper quotes (arteriolar-venular distance 510 um, capillary segment lengths 21.1-54.5 um) are from Kassab and Fung 1994 (ref. 13), not from kassab1993, which this paper does not cite; they are already compared here as consistency checks (q_av_similar, q_seglen_pig). The terminal arteriole diameter (15 um) is the only measurement with a counterpart there (order-1 arterial diameters), but no model of kassab1993 predicts a human vessel diameter; see kassab1993/q_no_validation_vs_kaneko2011."
  citation: {none: "a finding of the validation job between kaneko2011 and kassab1993, not a printed statement"}
# ---- Cross-record validation job: kaneko2011 with mohammed2015 (2026-11-11) ----
- id: q_no_validation_mohammed2015
  kind: unstated_model
  about: [capillary_tissue_area, twice_av_distance, histogram_stats, necrosis_equals_bundle, serial_section_stack, density_art, density_mid, density_ven]
  text: "(Cross-record validation, kaneko2011 with mohammed2015.) No validation was added to this record. Neither paper cites the other. The only model here that takes a quantity mohammed2015 measures is capillary_tissue_area (A = 1/N from a capillary density in transverse section), but mohammed2015 measures no tissue area per capillary for it to predict, and the paper's own areas are derived from its own densities. The other models (segment-length histogram, arteriolar-venular distance, micronecrosis axes, serial sections) have no counterpart among mohammed2015's measurements (autopsy CD31 profile densities, fibrosis, heart weight, coronary stenosis scores, counts). mohammed2015's microvascular density (10-314 um2 profiles, including precapillary arterioles) is not this record's capillary density and was not mapped. In the other direction, this record's three densities are set beside mohammed2015's control capillary density through its identity model same_density (mohammed2015/validations.yaml: val_capd_c_kaneko, val_capd_c_kaneko_art, val_capd_c_kaneko_ven; see mohammed2015/q_kaneko_path_position): consistency checks, not model tests."
  citation: {none: "a finding of the validation job between kaneko2011 and mohammed2015, not a printed statement"}
# ---- Cross-record validation job: kaneko2011 with rakusan1992 (2026-11-11) ----
- id: q_validation_rakusan1992_scope
  kind: choice
  about: [capillary_tissue_area, density_art, density_mid, density_ven, area_art]
  text: >
    (Cross-record validation, kaneko2011 with rakusan1992.) capillary_tissue_area (A = 1/N) was run on
    rakusan1992's measured capillary densities of its three normal age groups and compared with the
    domain areas it measured from polygons drawn around each capillary; all three are reproduced. This
    tests only the reading of the printed areas as 1/N (q_area_relation_unstated): the polygon areas of a
    tiled section average to the area per capillary. Only the normal groups were used because this
    paper's heart is normal; the relation is geometric and would apply equally to rakusan1992's
    stenosis and coarctation groups, which add no new test of it. rakusan1992's Krogh radii are not
    this model's output. The other models here (segment-length histogram, twice the arteriolar-venular
    distance, micronecrosis equal to the bundle, serial sections) have no counterpart among
    rakusan1992's measurements. In the other direction, rakusan1992's Fig. 2 cubic is tested against
    this record's three densities at the 320 g heart weight printed on p. 1 (rakusan1992/val_cdpoly_kaneko_*,
    rakusan1992/q_kaneko_path_position_vs_fit); the heart weight is not a datum of this record.
  citation: {page: 2, quote: "The theoretical tissue regions supplied by a single capillary on", where: text}
# ---- Cross-record validation job: kaneko2011 with schwarz2020 (2026-11-11) ----
- id: q_no_validation_schwarz2020
  kind: choice
  about: [capillary_tissue_area, twice_av_distance, histogram_stats, necrosis_equals_bundle, serial_section_stack, terminal_arteriole_d, density_art, density_mid, density_ven, sinus_count_density]
  text: >
    (Cross-record validation, kaneko2011 with schwarz2020.) No validation was added in either direction, and
    neither paper cites the other (schwarz2020 is later and names no capillary morphometry). The models here
    take a capillary density in transverse section, an arteriolar-venular distance, a capillary segment-length
    histogram, capillary bundle axes or a section count. schwarz2020 measures none of these: its cast stops at
    about 30-45 um, and it measures arterial segment counts and shares by diameter class, terminal-segment
    densities per cm3 of wall layer, arterial segment lengths (Fig. 2, 1 mm bins of mm-long segments), daughter
    symmetry, area growth and perfused volumes. Its terminal density (end segments of the cast per cm3) is not
    this record's capillary density (capillary profiles per mm2 of section) nor its sinus density, so they were
    not mapped. Running histogram_stats on schwarz2020's Fig. 2A would only reprocess that paper's own data,
    and it prints medians, not a mean and SD, to set it against. In the other direction, schwarz2020's
    runnable models are power laws of flow, pressure, velocity and conductance on diameter, fitted over
    vessels of 75-800 um, plus Poiseuille, shear-stress and area-growth relations; this record measures no
    flow, pressure, velocity, shear stress, branching symmetry or area growth for them to predict. The only
    model that reaches the capillary scale, schwarz2020's in silico extension down to 5.0-7.5 um, is not
    runnable and outputs conductances, not this record's terminal arteriole diameter (15 um) or segment
    lengths. See schwarz2020/q_no_validation_vs_kaneko2011.
  citation: {none: "a finding of the validation job between kaneko2011 and schwarz2020, not a printed statement"}
# ---- Cross-record validation job: kaneko2011 with spaan1981 (2026-11-11) ----
- id: q_no_validation_spaan1981
  kind: choice
  about: [capillary_tissue_area, twice_av_distance, histogram_stats, necrosis_equals_bundle, serial_section_stack, density_art, density_mid, density_ven, sinus_vol_5a, sinus_vol_5b, sinus_vol_5c]
  text: >
    (Cross-record validation, kaneko2011 with spaan1981.) No validation was added in either direction.
    This paper cites spaan1981 (ref. 21) only for the idea that systolic-diastolic flow variations come
    from an intramyocardial pump, and suggests that its precapillary and capillary sinuses act as such a
    pump (p. 5); it quantifies no sinus volume change, flow or pressure, so no model of spaan1981 (volume
    fractions, capacitances, RC times, the R_a-R_c regression, Eq. 2, the waterfall model) has a
    measurement here to predict. spaan1981's capillary_volume_fraction could be run on this record's
    densities, but no capillary volume fraction is measured here to set it against. In the other
    direction, this record's models (area per capillary as 1/density, twice the arteriolar-venular
    distance, the segment-length histogram, the bundle-necrosis equality, the section stack) give
    quantities spaan1981 does not measure: its measurements are canine phasic pressures and flows,
    resistances, the Fig. 4A excursion area, LV mass, p_im and wedge pressure, and its capillary density
    (3500/mm2) is reported from Bassingthwaighte et al., not measured. See
    spaan1981/q_no_validation_vs_kaneko2011.
  citation: {page: 5, printed_page: H758, quote: "Spaan et al. (21) have suggested that", where: text}
