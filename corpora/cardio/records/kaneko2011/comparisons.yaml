- {id: cmp_area_art, purpose: reproduction, computed: area_art_pred, printed: area_art}
- {id: cmp_area_mid, purpose: reproduction, computed: area_mid_pred, printed: area_mid}
- {id: cmp_area_ven, purpose: reproduction, computed: area_ven_pred, printed: area_ven}
- id: cmp_area_rat_batra
  purpose: consistency
  computed: area_rat_batra_pred
  printed: area_rat_ven_batra
  conditions_ok: "Batra et al.'s average rat density against their venular-side region, the smaller of the two they report: if the region were the reciprocal of density, the average would lie between 456 and 499 um2"
  note: "tests whether the paper's reciprocal relation also holds for the rat values it quotes beside its own"
- {id: cmp_unit_length, purpose: reproduction, computed: unit_length_pred, printed: unit_length_printed}
- id: cmp_necrosis_length
  purpose: validation
  computed: necrosis_length_pred
  printed: necrosis_length
  conditions_ok: "the paper's claim: arteriolar-venular distance from one heart, micronecrosis length from 10 other autopsy hearts"
- id: cmp_necrosis_major
  purpose: validation
  computed: necrosis_major_pred
  printed: necrosis_major
  conditions_ok: "the paper's claim: bundle size from one heart, micronecroses from 10 other autopsy hearts"
- id: cmp_necrosis_minor
  purpose: validation
  computed: necrosis_minor_pred
  printed: necrosis_minor
  conditions_ok: "the paper's claim: bundle size from one heart, micronecroses from 10 other autopsy hearts"
- id: cmp_fig3_n
  purpose: consistency
  computed: seg_count_fig3_pred
  printed: seg_count_fig3
  note: "the sum of the Fig. 3 bars against the n printed in its legend; bar heights are whole numbers, so this is exact"
- id: cmp_fig3_mean
  purpose: approximation
  computed: seg_len_mean_fig3_pred
  printed: seg_len_mean_fig3
  note: "the mean of the binned lengths (bin midpoints) against the printed mean of the measured lengths; binning alone can shift the mean by a few um"
- id: cmp_fig3_sd
  purpose: approximation
  computed: seg_len_sd_fig3_pred
  printed: seg_len_sd_fig3
  note: "the SD of the binned lengths (bin midpoints, no Sheppard correction) against the printed SD"
- {id: cmp_block_thickness, purpose: consistency, computed: block_thickness_pred, printed: block_thickness_printed}
# ---- against the literature values the paper quotes ----
- id: cmp_av_pig
  purpose: consistency
  computed: av_distance
  printed: av_pig
  conditions_ok: "the paper calls these distances similar; human LV upper middle layer, fixed paraffin sections, against pig LV silicone-elastomer casts (Kassab and Fung 1994)"
- id: cmp_av_rat
  purpose: consistency
  computed: av_distance
  printed: av_rat
  conditions_ok: "the paper calls these distances similar; human against rat LV"
- id: cmp_av_rabbit
  purpose: consistency
  computed: av_distance
  printed: av_rabbit
  conditions_ok: "the paper calls these distances similar; human against rabbit LV"
- id: cmp_seglen_pig
  purpose: consistency
  computed: seg_len_mean
  printed: seg_len_pig
  conditions_ok: "human LV mean over 220 segments against the range of pig LV values of Kassab and Fung 1994 (silicone casts); species and method differ"
- id: cmp_density_mid_rw
  purpose: consistency
  computed: density_mid
  printed: density_rw_normal_mean
  conditions_ok: "the paper says its densities are similar to other studies; mid-path density of one man of 60, fixed paraffin sections, against the mean of normal adult hearts injected with India ink or Chicago blue (Roberts and Wearn 1941); site and method differ"
- id: cmp_density_art_rw_range
  purpose: consistency
  computed: density_art
  printed: density_rw_normal_range
  conditions_ok: "arteriolar-side density of one heart against the range over normal adult hearts of Roberts and Wearn 1941"
- id: cmp_density_mid_rw_range
  purpose: consistency
  computed: density_mid
  printed: density_rw_normal_range
  conditions_ok: "mid-path density of one heart against the range over normal adult hearts of Roberts and Wearn 1941"
- id: cmp_density_ven_rw_range
  purpose: consistency
  computed: density_ven
  printed: density_rw_normal_range
  conditions_ok: "venular-side density of one heart against the range over normal adult hearts of Roberts and Wearn 1941"
- id: cmp_density_art_rakusan
  purpose: consistency
  computed: density_art
  printed: density_rakusan_range
  conditions_ok: "the 2,000-4,000/mm2 range Rakusan et al. 1992 give for adult hearts of all mammals studied, quoted by the paper as agreeing with its values"
- id: cmp_density_mid_rakusan
  purpose: consistency
  computed: density_mid
  printed: density_rakusan_range
  conditions_ok: "as cmp_density_art_rakusan, for the mid-path density"
- id: cmp_density_ven_rakusan
  purpose: consistency
  computed: density_ven
  printed: density_rakusan_range
  conditions_ok: "as cmp_density_art_rakusan, for the venular-side density"
