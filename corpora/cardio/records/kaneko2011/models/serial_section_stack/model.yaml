id: serial_section_stack
name: thickness of a piece cut into serial sections
role: processing
from_words: true
stated: {page: 2, printed_page: H755, quote: "Two-hundred serial sections of 6", where: text}
equation: "thickness = number of sections x section thickness (implied: a 1.2 mm piece cut into 200 serial 6 um sections)"
inputs:
  n: {quantity: section_count, unit: dimensionless}
  t: {quantity: section_thickness, unit: um}
outputs:
  T: {quantity: block_thickness, unit: mm}
settings: {}
stochastic: false
