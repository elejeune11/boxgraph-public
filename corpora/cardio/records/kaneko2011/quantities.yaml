- {id: arteriolar_venular_distance, name: arteriolar-venular distance, dimension: "[length]", description: "linear distance between an arteriole and an adjacent venule (functional capillary length)"}
- {id: capillary_segment_length, name: capillary segment length, dimension: "[length]", description: "length of a capillary segment from one branch point to the next"}
- {id: capillary_segment_count, name: number of capillary segments, dimension: dimensionless, description: "number of capillary segments measured, in total or in one length bin of a histogram"}
- {id: capillary_segment_length_sd, name: standard deviation of capillary segment length, dimension: "[length]", description: "spread (SD) of the segment lengths over the segments measured"}
- {id: capillary_density, name: capillary density in transverse section, dimension: "1/[length]**2", description: "number of capillary profiles per unit area of a myocardial cross section"}
- {id: tissue_area_per_capillary, name: theoretical tissue region supplied by one capillary, dimension: "[length]**2", description: "cross-sectional tissue area per capillary"}
- {id: capillary_bundle_major_axis, name: major axis of the capillary bundle from one central arteriole, dimension: "[length]", description: "transverse extent of the capillaries leaving one central arteriole, larger axis"}
- {id: capillary_bundle_minor_axis, name: minor axis of the capillary bundle from one central arteriole, dimension: "[length]", description: "transverse extent of the capillaries leaving one central arteriole, smaller axis"}
- {id: micronecrosis_major_axis, name: major axis of an intramyocardial micronecrosis in cross section, dimension: "[length]"}
- {id: micronecrosis_minor_axis, name: minor axis of an intramyocardial micronecrosis in cross section, dimension: "[length]"}
- {id: micronecrosis_length, name: length of an intramyocardial micronecrosis along the fibers, dimension: "[length]", description: "measured in the horizontal (longitudinal) section"}
- {id: microcirculatory_unit_length, name: length of the intramyocardial microcirculatory unit, dimension: "[length]", description: "from one venule through the central arteriole to the venule on the other side"}
- {id: terminal_arteriole_diameter, name: terminal arteriole diameter, dimension: "[length]"}
- {id: sinus_volume, name: volume of a precapillary or capillary sinus, dimension: "[length]**3"}
- {id: capillary_sinus_diameter, name: capillary sinus diameter, dimension: "[length]"}
- {id: capillary_sinus_length, name: capillary sinus length, dimension: "[length]"}
- {id: sinus_number_density, name: number of precapillary and capillary sinuses per tissue volume, dimension: "1/[length]**3"}
- {id: section_count, name: number of serial sections, dimension: dimensionless}
- {id: section_thickness, name: thickness of one histological section, dimension: "[length]"}
- {id: block_thickness, name: thickness of the sectioned tissue piece, dimension: "[length]"}
- {id: species, name: species, dimension: dimensionless, description: "used as a condition"}
- {id: subject_group, name: subject group, dimension: dimensionless, description: "used as a condition: normal adult, hypertrophied, autopsy cases without coronary disease"}
- {id: capillary_path_position, name: position along the arteriole-to-venule capillary path, dimension: dimensionless, description: "used as a condition: arteriolar side, middle, venular side"}
- {id: wall_layer, name: layer of the left ventricular wall, dimension: dimensionless, description: "used as a condition"}
