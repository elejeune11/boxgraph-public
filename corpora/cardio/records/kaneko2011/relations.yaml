- id: rel_tissue_area_same_as_rakusan_domain
  kind: same_as
  a: rakusan1992/domain_area_reciprocal
  b: kaneko2011/capillary_tissue_area
  mapping: {N: "CD"}
  output_map: {A: A}
  regime: {CD: [1000, 5000]}
  provenance: proposed
  reason: >
    Both take the tissue area served by one capillary in a transverse section as the reciprocal of the
    capillary density (Rakusan's mean capillary domain area, Kaneko's "theoretical tissue region supplied
    by a single capillary"), CD and N both in capillaries per mm^2 and the area in um^2. Kaneko attributes
    the concept to Batra et al. (its ref. 4), not to Rakusan (its ref. 18, cited only for the 2,000-4,000/mm^2
    density range), so the relation is proposed, not stated. The regime spans the adult and hypertrophied
    densities both papers report.
