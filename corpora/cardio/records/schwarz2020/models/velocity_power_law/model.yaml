id: velocity_power_law
name: allometric fit of centerline velocity on segment diameter
role: fit
stated: {page: 7, printed_page: "7", quote: "The diameter velocity relation was", where: text}
equation: "v = 3.00 10^4 d^0.89 (d in m, v in cm/s)"
inputs:
  a: {quantity: velocity_fit_prefactor, unit: dimensionless}
  b: {quantity: velocity_fit_exponent, unit: dimensionless}
  d: {quantity: vessel_diameter, unit: m}
outputs:
  v: {quantity: centerline_velocity, unit: cm/s}
settings: {}
stochastic: false
