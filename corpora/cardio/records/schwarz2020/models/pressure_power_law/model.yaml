id: pressure_power_law
name: allometric fit of local pressure on segment diameter
role: fit
stated: {page: 7, printed_page: "7", quote: "The pressure-diameter relation was", where: text}
equation: "P = 5.40 10^3 d^0.60 (d in [250, 800] 10^-6 m, P in mmHg)"
inputs:
  a: {quantity: pressure_fit_prefactor, unit: dimensionless}
  b: {quantity: pressure_fit_exponent, unit: dimensionless}
  d: {quantity: vessel_diameter, unit: m}
outputs:
  P: {quantity: node_pressure, unit: mmHg}
settings: {}
stochastic: false
