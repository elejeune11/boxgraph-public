id: conductance_power_law
name: allometric fit of distal arterial conductance on segment diameter
role: fit
stated: {page: 6, printed_page: "6", quote: "by the allometric relation Gis", where: "text, pp. 6-7"}
equation: "G = a d^b (d in m, G in m^3/(Pa s)); in silico: Gis = 1.64 10^-3 d^2.49; heart: G = 1.58 10^-4 d^-2.22"
inputs:
  a: {quantity: conductance_fit_prefactor, unit: dimensionless}
  b: {quantity: conductance_fit_exponent, unit: dimensionless}
  d: {quantity: vessel_diameter, unit: m}
outputs:
  G: {quantity: distal_conductance, unit: m^3/(Pa*s)}
settings: {}
stochastic: false
