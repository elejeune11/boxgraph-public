id: perfusion_from_flow
name: perfusion as the flow of a 100-200 um segment over the weight of its perfusion territory
role: processing
stated: {page: 5, printed_page: "5", quote: "Perfusion was derived by relating the flow through", where: text}
equation: "perfusion = Q / (V rho_tissue)"
from_words: true
inputs:
  Q: {quantity: segment_flow, unit: ml/min}
  V: {quantity: perfused_volume, unit: cm^3}
  rho: {quantity: tissue_density, unit: g/cm^3}
outputs:
  perfusion: {quantity: perfusion, unit: ml/min/g}
settings: {}
stochastic: false
