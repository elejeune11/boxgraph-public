id: area_growth_linear_fit
name: linear regression of area growth on mother diameter and symmetry (dM in m)
role: fit
stated: {page: 5, printed_page: "5", quote: "Linear regression showed that area growth", where: text}
equation: "A = -0.66 dM + 0.34 S + 1.13, dM in [75, 600] 10^-6 m"
inputs:
  c_d: {quantity: area_growth_fit_coefficient_d, unit: dimensionless}
  c_S: {quantity: area_growth_fit_coefficient_S, unit: dimensionless}
  c_0: {quantity: area_growth_fit_intercept, unit: dimensionless}
  dM: {quantity: vessel_diameter, unit: m, description: "the unit of dM in the formula is not printed; m follows the range '[75, 600] 10^-6 m' and the paper's other fits ('d in m')"}
  S: {quantity: daughter_symmetry, unit: dimensionless}
outputs:
  A: {quantity: area_growth, unit: dimensionless}
settings: {}
stochastic: false
