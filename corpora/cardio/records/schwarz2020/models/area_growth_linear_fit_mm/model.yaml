id: area_growth_linear_fit_mm
name: linear regression of area growth on mother diameter and symmetry, read with dM in mm
role: fit
stated: {page: 5, printed_page: "5", quote: "Linear regression showed that area growth", where: text}
equation: "A = -0.66 dM + 0.34 S + 1.13, dM in mm"
variant_of: area_growth_linear_fit
corrections:
  - equation: "area-growth fit, p. 5"
    change: "dM in the formula taken in mm (equivalently -660 dM with dM in m)"
    evidence: >
      With dM in m (as '[75, 600] 10^-6 m' suggests) the term -0.66 dM changes A by less than
      4 x 10^-4 over the fitted range, which cannot express the text's 'area growth increased with
      decreasing mother diameter' (highly significant coefficient) nor Fig. 4's fall of area growth
      with mother diameter; with dM in um the fit gives A between -48 and -395, a negative area
      ratio. Only a unit of order mm gives area growth near 1 for large and above 1 for small mothers.
inputs:
  c_d: {quantity: area_growth_fit_coefficient_d, unit: dimensionless}
  c_S: {quantity: area_growth_fit_coefficient_S, unit: dimensionless}
  c_0: {quantity: area_growth_fit_intercept, unit: dimensionless}
  dM: {quantity: vessel_diameter, unit: mm}
  S: {quantity: daughter_symmetry, unit: dimensionless}
outputs:
  A: {quantity: area_growth, unit: dimensionless}
settings: {}
stochastic: false
