id: flow_ratio_power_law
name: ratio of flows at two diameters implied by the flow power law
role: processing
stated: {page: 7, printed_page: "7", quote: "allometric fit of flow", where: text}
equation: "Q(d1)/Q(d2) = (d1/d2)^gamma"
from_words: true
inputs:
  gamma: {quantity: flow_fit_exponent, unit: dimensionless}
  d1: {quantity: vessel_diameter, unit: m}
  d2: {quantity: vessel_diameter, unit: m}
outputs:
  ratio: {quantity: flow_ratio, unit: dimensionless}
settings: {}
stochastic: false
