id: flow_power_law
name: allometric fit of segment flow on segment diameter
role: fit
stated: {page: 7, printed_page: "7", quote: "allometric fit of flow", where: text}
equation: "Q = a d^gamma; Q = 5.07 10^8 d^2.53 (d in m, Q in ml/min)"
inputs:
  a: {quantity: flow_fit_prefactor, unit: dimensionless}
  gamma: {quantity: flow_fit_exponent, unit: dimensionless}
  d: {quantity: vessel_diameter, unit: m}
outputs:
  Q: {quantity: segment_flow, unit: ml/min}
settings: {}
stochastic: false
