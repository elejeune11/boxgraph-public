id: velocity_fit_from_flow_fit
name: centerline-velocity power law implied by the flow power law under Poiseuille flow
role: processing
stated: {page: 7, printed_page: "7", quote: "centerline velocity followed the same", where: text}
equation: "Poiseuille flow (p. 4): v_center = 2 Q/(pi d^2/4); with Q = a d^gamma (ml/min, m): v = [8 a (10^-6/60) 100/pi] d^(gamma - 2) in cm/s"
from_words: true
inputs:
  a: {quantity: flow_fit_prefactor, unit: dimensionless}
  gamma: {quantity: flow_fit_exponent, unit: dimensionless}
outputs:
  a_v: {quantity: velocity_fit_prefactor, unit: dimensionless}
  b_v: {quantity: velocity_fit_exponent, unit: dimensionless}
settings: {}
stochastic: false
