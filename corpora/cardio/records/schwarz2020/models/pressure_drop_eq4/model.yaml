id: pressure_drop_eq4
name: pressure drop over a segment from its flow and conductance, Eq. 4
role: model
stated: {page: 4, printed_page: "4", quote: "the flow (Qi→j ) through and the conductance", where: Eq. 4}
equation: "Q_i->j = G_ij (P_i - P_j), solved for P_i - P_j"
inputs:
  Q: {quantity: segment_flow, unit: m^3/s}
  G: {quantity: segment_conductance, unit: m^3/(Pa*s)}
outputs:
  dP: {quantity: pressure_drop, unit: Pa}
settings: {}
stochastic: false
