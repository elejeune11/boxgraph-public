id: pressure_fraction
name: local pressure as a percentage of systemic pressure
role: processing
stated: {page: 11, printed_page: "11", quote: "predicts a median pressure in 100 µm vessels around 32%", where: text}
equation: "fraction = P / P_systemic"
from_words: true
inputs:
  P: {quantity: node_pressure, unit: mmHg}
  P_sys: {quantity: systemic_pressure, unit: mmHg}
outputs:
  f: {quantity: pressure_fraction, unit: percent}
settings: {}
stochastic: false
