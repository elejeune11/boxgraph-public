id: absolute_viscosity
name: absolute blood viscosity from the relative viscosity of Eq. 3 and the plasma viscosity
role: processing
stated: {page: 4, printed_page: "4", quote: "an empirical diameter-dependent relationship derived by Pries et al.", where: Eq. 3}
equation: "mu_abs = mu (Eq. 3, relative to plasma) x mu_plasma"
from_words: true
inputs:
  mu_rel: {quantity: relative_viscosity, unit: dimensionless}
  mu_p: {quantity: plasma_viscosity, unit: Pa*s}
outputs:
  mu: {quantity: blood_viscosity, unit: Pa*s}
settings: {}
stochastic: false
