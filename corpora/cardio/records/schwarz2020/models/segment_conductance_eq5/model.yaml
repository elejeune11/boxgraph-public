id: segment_conductance_eq5
name: Poiseuille conductance of a segment, Eq. 5
role: model
stated: {page: 4, printed_page: "4", quote: "the flow (Qi→j ) through and the conductance", where: Eq. 5}
equation: "G_ij = pi d_ij^4 / (128 mu_ij l_ij)"
inputs:
  d: {quantity: vessel_diameter, unit: m}
  mu: {quantity: blood_viscosity, unit: Pa*s, description: "absolute blood viscosity; Eq. 3 gives it relative to plasma, and the plasma viscosity is not stated (q_plasma_viscosity)"}
  l: {quantity: segment_length, unit: m}
outputs:
  G: {quantity: segment_conductance, unit: m^3/(Pa*s)}
settings: {}
stochastic: false
