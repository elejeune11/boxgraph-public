id: density_share
name: percentage of the terminal-segment density in a diameter class (Table 1, density columns)
role: processing
stated: {page: 6, printed_page: "6", quote: "TABLE 1 | Segment distribution.", where: "Table 1"}
equation: "share = 100 rho / rho_total"
from_words: true
inputs:
  rho: {quantity: terminal_density, unit: 1/cm^3}
  total: {quantity: terminal_density, unit: 1/cm^3}
outputs:
  share: {quantity: terminal_density_share, unit: percent}
settings: {}
stochastic: false
