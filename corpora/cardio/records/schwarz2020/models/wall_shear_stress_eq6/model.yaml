id: wall_shear_stress_eq6
name: wall shear stress from the pressure gradient in a segment, Eq. 6
role: model
stated: {page: 5, printed_page: "5", quote: "the frictional forces with the wall balance the force from the", where: Eq. 6}
equation: "tau_ij = (P_i - P_j) d_ij / (4 l_ij)"
inputs:
  dP: {quantity: pressure_drop, unit: Pa}
  d: {quantity: vessel_diameter, unit: m}
  l: {quantity: segment_length, unit: m}
outputs:
  tau: {quantity: wall_shear_stress, unit: Pa}
settings: {}
stochastic: false
