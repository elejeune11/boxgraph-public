- {id: cmp_eq8_gamma2_large, purpose: approximation, computed: A_eq8_gamma2, printed: A_median_large,
   note: "Eq. 8 with gamma close to 2 against the median area growth of > 400 um segments, which the paper reads as 'an exponent close to 2 rather than 3' (p. 11). The symmetry 0.59 is the median for > 500 um mothers; at gamma = 2 Eq. 8 gives 1 whatever S."}
- {id: cmp_eq8_gamma3_large, purpose: approximation, computed: A_eq8_gamma3, printed: A_median_large,
   note: "Eq. 8 with gamma = 3 (Murray), the alternative the paper rejects for large coronaries."}
- {id: cmp_Afit_large_m, purpose: approximation, computed: A_fit_large_m, printed: A_median_large,
   note: "the linear fit as printed (dM in m) at dM = 500 um and the median symmetry 0.59, against the median area growth of > 400 um segments (a fit of the mean evaluated at class medians against a class median)"}
- {id: cmp_Afit_large_mm, purpose: approximation, computed: A_fit_large_mm, printed: A_median_large,
   note: "the same with dM read in mm (variant)"}

- {id: cmp_velocity_exponent, purpose: consistency, computed: v_exponent_from_flow, printed: v_fit_exponent,
   note: "Under the paper's Poiseuille flow the centerline velocity of each segment is 8 Q/(pi d^2), so a velocity-diameter power law should have exponent gamma_Q - 2. The two laws are separate non-linear fits of scattered data (r2 0.83 and 0.21), so exact agreement is not implied; the comparison measures how far they are from the relation they share."}
- {id: cmp_velocity_prefactor, purpose: consistency, computed: v_prefactor_from_flow, printed: v_fit_prefactor,
   note: "as cmp_velocity_exponent, for the prefactor (v in cm/s, d in m)"}

- {id: cmp_flow_ratio, purpose: approximation, computed: flow_ratio_from_fit, printed: flow_ratio_large_100um,
   note: "The flow law over the whole range, evaluated at 1 mm and 100 um, against the printed 'about 3,000-times' (medians of > 1 mm arteries and of 100 um segments). The printed value is approximate (no verdict); 1 mm is the lower bound of the larger class."}
- {id: cmp_pressure_fraction_100um, purpose: approximation, computed: P_fraction_100um_from_fit, printed: P_fraction_100um,
   note: "The pressure law (fitted on 250-800 um) extrapolated to 100 um, as a share of the 90 mmHg inlet pressure, against the printed 'around 32%'. Approximate printed value (no verdict)."}

