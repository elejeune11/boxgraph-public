   conditions_ok: "a ratio of medians (flow law at 150 um over the median volume) set against the median of the ratios",
   note: "The flow law at the middle of the 100-200 um truncation range over the median perfused volume times an added tissue density, against the median perfusion 5.6 ml/min/g."}
