- id: dM_large_added
  quantity: vessel_diameter
  unit: um
  printed: "500"
  basis: >
    A mother diameter representative of the large-vessel class whose median symmetry (0.59, mother
    diameter > 500 um, p. 9) and median area growth (1.02, segments > 400 um, p. 5) are printed;
    the linear area-growth fit is stated for dM up to 600 um. The paper gives no single diameter.
  alternatives: ["400", "600"]
  stands_for: dM in the area-growth fit A = -0.66 dM + 0.34 S + 1.13 (p. 5)
- id: systemic_pressure_added
  quantity: systemic_pressure
  unit: mmHg
  printed: "90"
  basis: >
    The paper's "32% of systemic pressure" (p. 11) is taken relative to the coronary inlet pressure
    of the simulations, 90 mmHg (p. 5); the paper does not say which pressure it means.
  alternatives: ["100"]
  stands_for: systemic pressure on p. 11
- id: plasma_viscosity_added
  quantity: plasma_viscosity
  unit: mPa*s
  printed: "1.2"
  basis: >
    Added in the audit. Eq. 3 (Pries et al.) gives viscosity relative to plasma and Eq. 5 needs an
    absolute viscosity; the paper does not state the plasma viscosity (q_plasma_viscosity). 1.2 mPa s
    is a usual value for human plasma at 37 degC. Used only to turn the flow law into a wall shear stress.
  alternatives: ["1.0", "1.35"]
  stands_for: the plasma viscosity that scales mu in Eq. 5
- id: d_perfusion_added
  quantity: vessel_diameter
  unit: um
  printed: "150"
  basis: >
    Added in the audit. Perfusion is the flow through 100-200 um segments over the weight of their
    territory (p. 5); the middle of that range is taken as the diameter at which the flow law is evaluated.
  alternatives: ["100", "200"]
  stands_for: diameter of the truncated 100-200 um segments (p. 7)
- id: tissue_density_added
  quantity: tissue_density
  unit: g/cm^3
  printed: "1.05"
  basis: >
    Added in the audit. The weight of a perfusion territory needs a tissue density, which the paper
    does not state (q_network_data). 1.05 g/cm3 is a usual myocardial density.
  alternatives: ["1.0", "1.06"]
  stands_for: density turning Voronoi volume into weight (p. 5)
