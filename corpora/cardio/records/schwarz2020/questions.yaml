- id: q_velocity_flow_laws
  kind: unexplained_difference
  about: [cmp_velocity_exponent, cmp_velocity_prefactor, velocity_power_law, flow_power_law]
  text: >
    Under the paper's Poiseuille flow, centerline velocity is 8 Q/(pi d^2) segment by segment, so the
    flow law Q = 5.07 10^8 d^2.53 implies a velocity law with exponent 2.53 - 2 and a prefactor fixed
    by 5.07 10^8 (run_velocity_from_flow), whereas the printed velocity law is v = 3.00 10^4 d^0.89.
    Neither the exponent nor the prefactor agrees. The paper states the fits were non-linear and gives
    r2 = 0.21 for velocity, so some difference is expected, but its size is not explained.
  citation: {page: 7, quote: "The diameter velocity relation was", where: text}
- id: q_flow_ratio
  kind: unexplained_difference
  about: [cmp_flow_ratio, flow_ratio_large_100um]
  text: >
    'About 3,000-times as much blood per vessel' for arteries > 1 mm (median 36.6 ml/min) against
    100 um segments, whereas the whole-range flow law gives the ratio (1 mm/100 um)^2.53
