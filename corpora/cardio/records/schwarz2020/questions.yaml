    The scaling law is Eq. 7. On p. 11 'fitting Equation 7 or alternatively by fitting any reformulation
    of Equation 6' likewise seems to mean Eqs. 8 and 7.
  citation: {page: 10, quote: "law (Eq. 6), area growth (A) at that node would be directly related", where: text}
- id: q_plasma_viscosity
  kind: unstated_input
  about: [viscosity_eq3, segment_conductance_eq5, network_hemodynamics]
  text: >
