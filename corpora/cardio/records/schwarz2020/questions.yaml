- id: q_no_validation_vs_schwarz_data
  kind: choice
  about: [area_growth_eq8, area_growth_linear_fit, flow_power_law, pressure_power_law, velocity_power_law, conductance_power_law, perfusion_from_flow, network_hemodynamics, total_all, total_terminal, perfused_volume_total]
  text: >
    (Cross-validation with schwarz_data, cross-validation job 2026-11-06.) No validation is added in
    either direction. schwarz_data is this paper's own released data, the same network and its solution
    by the same authors, so it holds no independent measurement. Its only measured data are copies of
    this paper's 4,954 territories and 358 cm3. No model here outputs a count or a perfused volume, and
    perfusion_from_flow would need a tissue density that neither source states. The release's
    branching tables, which the area-growth models (Eq. 8 and the linear fit) would predict, are not in
    the copy that was read. The power laws are fitted to the workbook class medians, and those
    medians are network outputs, not measurements. That agreement is already checked in schwarz_data
    as reproductions of the printed fits. In the other direction, schwarz_data's element_total
    (nIE + nSE) recounts the same graph that gives Table 1's 202,184 segments. That is bookkeeping, not
    a prediction (schwarz_data cmp_element_total). See schwarz_data/q_no_validation_vs_schwarz2020.
  citation: {page: 13, quote: "The datasets generated for this study are available on request", where: text}
- id: q_no_validation_vs_kassab1993
  kind: choice
  about: [area_growth_eq8, area_growth_linear_fit, area_growth_linear_fit_mm, segment_conductance_eq5, conductance_power_law, flow_power_law, pressure_power_law, velocity_power_law, network_hemodynamics]
  text: >
    No validation is entered against kassab1993's measurements. This paper cites Kassab et al. (1993)
    only as earlier porcine morphometry (pp. 2, 8) and, on p. 9, says its pig segment lengths "are closer to
