- id: q_no_validation_vs_olufsen2000
  kind: choice
  about: [wall_shear_stress_eq6, flow_power_law, pressure_power_law, viscosity_eq3, segment_conductance_eq5, area_growth_eq8, network_hemodynamics, A_median_large, d_f4_symhi_median, d_f4_symlo_median, d_f2b_median, S_median_large, d_f3a_median]
  text: >
    (Cross-validation with olufsen2000, cross-validation job 2026-11-06; neither paper cites the other.) No model of
    this record is validated against an olufsen2000 measurement. olufsen2000 measures one subject's MR flows in time
    at the ascending aorta and eight other systemic sites (its Figs. 3, 7), cuff pressures 120/80 mmHg, the inlet
    radius of the ascending aorta, the cycle length 1.1 s and the heart rate. This record's runnable models give a
    segment's wall shear stress, conductance, pressure drop and viscosity from a diameter, a length and a pressure drop
    or flow (none of which olufsen2000 measures at one site), coronary power laws of flow, pressure, velocity and
    conductance against segment diameter (fitted to this coronary tree; run at the aorta's 2.5 cm they would be far
    outside the 30 um-4 mm range they were fitted over and describe a different circulation), and the area growth of
    Eq. 8, which olufsen2000 does not measure. The shape-suggested pair, wall_shear_stress_eq6 and
    olufsen2000/tube_law_eq14, are an elastic wall law and a force balance: neither gives the other's measurement.
    In the other direction, olufsen2000/area_ratio_eq21 (the same form as Eq. 8) predicts this record's median area
    growth 1.02 of > 400 um bifurcations: see olufsen2000/validations.yaml. Not used: the Fig. 4 class medians of area
    growth by symmetry group (each pools symmetries 0.0-0.5 or 0.5-1.0, and the median symmetry of each group is not
    printed, so Eq. 21 has no single gamma to run at), the Fig. 3A symmetries (olufsen2000's runnable asymmetry_eq21
    gives an area ratio of radii squared, gamma = S^2, a different quantity from S that cannot be mapped), and the
    segment lengths of Fig. 2B (olufsen2000's length-to-radius ratio 50 lives only inside its non-runnable network_1d).
  citation: {none: "a finding of the cross-record job between schwarz2020 and olufsen2000, not a printed statement"}
