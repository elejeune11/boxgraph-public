    36.6/3000 ml/min. The medians come from the network and 1 mm is only the lower bound of the larger
    class, so the law need not match; the paper does not reconcile the two.
  citation: {page: 7, quote: "as much blood per vessel as 100", where: text}
- id: q_eq8_large_vessels
  kind: overstated_claim
  about: [cmp_eq8_gamma2_large, cmp_eq8_gamma3_large, A_median_large]
  text: >
    The paper reads the median area growth of 1.02 in the largest class as suggesting a scaling
    exponent close to 2 rather than 3. Eq. 8 gives exactly 1 at gamma = 2 for any symmetry, and at
    the median symmetry 0.59 gamma = 3 gives a value well above 1.02; 1.02 thus lies between, much
