- id: q_no_validation_vs_pries1992
  kind: choice
  about: [viscosity_eq3, relative_viscosity, network_hemodynamics, A_median_large, S_median_large]
  text: >
    (Cross-validation with pries1992, cross-validation job 2026-11-06.) No validation is added in either direction.
    Schwarz's Eq. 3 cites Pries et al. 1994 and Secomb and Pries 2013 (p. 4), not pries1992, and neither paper says
    one's model explains the other's data. The only model here with an output pries1992 measures is viscosity_eq3,
    and it was considered against every pries1992 viscosity measurement: the 163 compiled points at HD 0.45 (Fig. 5,
    eta_fig5_points_HD045), the per-diameter data against hematocrit (Fig. 3, 3.3-40 um), the Fig. 2 inset residuals
    and the approximate text values (~3.2 above 1,000 um, ~1.25 at ~7 um). All are in vitro: red cell suspensions
    in glass tubes, relative to the suspending medium. Eq. 3 is the 1994 in vivo law, which departs on purpose from
    the in vitro description: it adds an endothelial-layer factor (d/(d - 1.1))^2 inside and outside the hematocrit
    term and replaces pries1992's small-tube term 220 e^(-1.3 D) by 6 e^(-0.085 d), terms fitted to in vivo network
    data, not to these tubes. Its output is in vivo apparent viscosity, the quantity Schwarz needs for vessels; the
    measurements are in vitro tube viscosity. This record's own relation rel_viscosity_eq3_reduces_to_pries1992_eq7_large_d
    calls them different measured quantities, and pries2005 keeps them as two quantities and validates only its in
    vitro law against these data. Mapping them would make the verdict test the in vivo correction against data it was
    built to depart from (at HD 0.45, Eq. 3 over pries1992 Eq. 2 is about 1.2 at 40 um, 2 at 20 um and 7 at 4-7 um,
    computed by hand; many of the 163 points lie below 30 um);
    a sweep cannot be limited to the large tubes (>~100 um) where the two coincide. Where they coincide the shared
    terms (3.2 - 2.44 e^(-0.06 D^0.645), and C = pries1992 Eq. 4) were fitted to these same data, so it would be a
    fit, not a test; that agreement is already stated as a form relation (reduces_to at large d). In the other
    direction, pries1992's models (Eqs. 2-10: in vitro viscosity, B, C, tube hematocrit) output none of this
    record's measurements, which are all geometric (segment lengths, daughter symmetry, area growth, segment counts,
    terminal densities, perfused volumes).
  citation: {page: 4, quote: "diameter-dependent relationship derived by Pries et al. was used", where: Eq. 3}
