- id: q_no_validation_vs_pries1990
  kind: choice
  about: [viscosity_eq3, velocity_power_law, pressure_power_law, pressure_fraction, flow_power_law, area_growth_eq8, network_hemodynamics, A_median_large, S_median_large]
  text: >
    (Cross-validation with pries1990, cross-validation job 2026-11-06.) No validation is added in either direction.
    This paper cites Pries et al. 1994 and Secomb and Pries 2013 for Eq. 3 (p. 4), not pries1990, and neither paper
