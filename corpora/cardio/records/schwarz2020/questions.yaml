- id: q_validation_vs_chilian1986
  kind: choice
  about: [pressure_power_law, pressure_fraction, perfusion_from_flow, P_100um_from_fit, systemic_pressure_added]
  text: >
    (Cross-validation with chilian1986, cross-validation job 2026-11-06.) This paper cites Chilian 1991, not
    chilian1986, for measured pressure in 80-120 um vessels (p. 11). One validation is entered:
    the pressure law at 100 um, as a share of the 90 mmHg inlet pressure, against chilian1986's measured
