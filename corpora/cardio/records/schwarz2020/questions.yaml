- id: q_G_exponent_sign
  kind: possible_error
  about: [Gheart_exponent, Gheart_exponent_discussion, conductance_power_law]
  text: >
    The heart conductance law is printed G = 1.58 10^-4 d^-2.22 (p. 7, minus sign checked on the page
    image), yet the same exponent is given as 2.22 on p. 12 ('scaled with diameter to the power 2.22'),
    the internal-segment exponent is 2.18, the in silico law has +2.49, and the text says the heart line
    agrees with the in silico one. A negative exponent would make distal conductance fall with
    diameter. The minus sign is likely a misprint; the value is kept as printed and both are run at
    400 um (run_Gheart_400um, run_Gheart_400um_p12) beside the in silico law (run_Gis_400um): only the
    p. 12 exponent puts the heart law near the in silico one.
  citation: {page: 7, quote: "yet also agrees well for larger segments", where: text}
- id: q_A_fit_unit
  kind: possible_error
  about: [area_growth_linear_fit, area_growth_linear_fit_mm, A_fit_coef_d]
  text: >
    The area-growth fit A = -0.66 dM + 0.34 S + 1.13 states its range as dM in [75, 600] 10^-6 m but
    not the unit of dM in the formula. In m the diameter term is negligible (< 4 10^-4); in um A is
    negative. Only a unit near mm gives sensible values; the variant reads dM in mm. Which unit was
    used is not stated.
  citation: {page: 5, quote: "Linear regression showed that area growth", where: text}
- id: q_eq_reference
  kind: reading
