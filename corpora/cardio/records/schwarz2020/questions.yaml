    (187-192 um) arteriole shares (Table 6, Fig. 7, and the Table 4/5 pressures they come from). The large
    arterioles lie inside the fitted range, but this record has no run of the pressure law at those diameters
    to feed pressure_fraction, and a validation runs one model. The absolute pressures cannot be set against
    the law's mmHg either: the law holds at a 90 mmHg inlet and chilian1986's aortic pressure is 66-78 mmHg.
    Also not used: the venular pressures, because this is an arterial-only model. chilian1986's perfusion
    (Table 3, Fig. 4) is not used either. perfusion_from_flow rests on the flow law at one added diameter,
