notes: >
  Scope: the paper's quantitative core. The network hemodynamics (Eqs. 3-6 with Kirchhoff's law on
  the 202,184-segment reconstructed tree, distal conductances imputed from 50 in silico trees, 1000
  stochastic simulations) is recorded as not runnable. The network is not printed (released as
  schwarz_data), the tree-generating distributions and the extrapolation below 30 um are only
  plotted or described, and the plasma viscosity (Eq. 3 is relative) and tissue density are not
  stated. Its component equations are recorded as runnable models: Eq. 3 (Pries viscosity, d taken
  in um, run once at 100 um and Hd 0.4), Eq. 5 (Poiseuille conductance), Eq. 6 (wall shear stress)
  and Eqs. 7-8 (area growth under a scaling law). What can be checked from the printed numbers:
  (1) Table 1. Every percentage in the five columns reproduces from the printed counts and densities
  over their printed totals. Counts are entered without thousands separators.
  (2) Eq. 8 against the median area growth 1.02 of the largest class at median symmetry 0.59. Gamma = 2
  gives exactly 1 and gamma = 3 gives far more. The paper's "close to 2 rather than 3" holds as a direction.
  (3) The linear area-growth fit. The unit of dM is not stated. With m, as the printed range suggests,
  the diameter term vanishes and the fit misses 1.02; a variant with dM in mm comes close.
  (4) The flow and centerline-velocity power laws are inconsistent with each other under the paper's
  own Poiseuille flow (exponent and prefactor). (5) The flow law's ratio between 1 mm and 100 um is
  set against the printed "about 3,000-times", and the pressure law extrapolated to 100 um against
  "around 32%". Both printed values are approximate, so neither gets a verdict, and both differ
  markedly (questions). (6) The heart conductance law is printed with exponent -2.22 but 2.22 on
  p. 12. Both are run at 400 um beside the in silico law; kept as printed with a possible_error question.
  Figures (second pass, 2026-11-06): every plot of data in Figs. 2-6 is read with calibrated code
  readings (figures.yaml, figures.md). The power laws reproduce their own plotted fit lines in Fig. 5B-D.
  In Fig. 5A the heart line reproduces only with the exponent of p. 12 (2.22), not the printed -2.22.
  The medians bear out the printed '3,000-times', 'around 32%' and '5 Pa' (questions q_fig5*). The
  measured distributions (Figs. 2-4) and the perfusion box plots (Fig. 6) are recorded for later models.
  Left out: Table 2 (stochastic variability, outputs of the unrunnable network;
  its identical CV columns for flow and shear stress are as Poiseuille flow requires), the diameter
  and length medians and interdecile ranges of Table 1, node and loop counts (91%, 8%, 3,202), the
  1.22 +/- 0.05 million in silico segments, r2 values, the Discussion's literature values (Chilian,
  VanBavel and Spaan, PET perfusion, Kern velocities, other species' exponents) and the
  diameter-dependent flow exponents 3.21 and 2.55 and shear-stress peak at 630 um (only checkable
  from Fig. 5). A few network outputs (36.6 ml/min, ~5 Pa, 5.6 ml/min/g, perfused volumes) are
  recorded as data for later comparison with runs on schwarz_data. Page images were checked for every
  equation and fit coefficient recorded.
