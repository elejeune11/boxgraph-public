- {id: chamber_elastance, name: heart chamber elastance, dimension: "[pressure]/[length]**3", description: "maximum or minimum elastance of a heart chamber in the variable-elastance law (EAtrium, EVentricle)"}
- {id: chamber_reference_pressure, name: chamber reference pressure, dimension: "[pressure]", description: "Pini in TempCD: the chamber pressure at the reference volume Vini (P_0 in Korakianitis and Shi 2006, Eq. 4)"}
- {id: chamber_reference_volume, name: chamber reference volume, dimension: "[length]**3", description: "Vini in TempCD: the volume at which chamber pressure equals Pini (V_0 in Korakianitis and Shi 2006, Eq. 4)"}
- {id: initial_chamber_volume, name: initial heart chamber volume, dimension: "[length]**3", description: "chamber volume at t = 0 (the code's Vlv0, Vla0, the initial_value of V in TempCD)"}
- {id: initial_vessel_pressure, name: initial vessel pressure, dimension: "[pressure]", description: "pressure of the Windkessel compliance at t = 0 (P0 in ParaWindKessel)"}
- {id: valve_flow_coefficient, name: valve flow coefficient, dimension: "[length]**3/[time]/[pressure]**0.5", description: "CV in TempCD: flow = CV*|dP|^0.5 through an open valve"}
- {id: vascular_compliance, name: vascular compliance, dimension: "[length]**3/[pressure]", description: "C of the Windkessel (TempRC)"}
- {id: vascular_resistance, name: vascular resistance, dimension: "[pressure]*[time]/[length]**3", description: "R of the Windkessel (TempRC)"}
- {id: heart_period, name: heart period, dimension: "[time]", description: "T, the length of one heart cycle"}
- {id: p_wave_onset_fraction, name: onset of the P wave as a fraction of the period, dimension: dimensionless, description: "Tpwb in EAtrium: atrial activation starts at Tpwb*T"}
- {id: p_wave_duration_fraction, name: duration of the P wave as a fraction of the period, dimension: dimensionless, description: "Tpww in EAtrium: atrial activation lasts Tpww*T"}
- {id: peak_systole_fraction, name: time of peak ventricular activation as a fraction of the period, dimension: dimensionless, description: "Ts1 in EVentricle: activation peaks at Ts1*T"}
- {id: end_systole_fraction, name: time of end of ventricular activation as a fraction of the period, dimension: dimensionless, description: "Ts2 in EVentricle: activation ends at Ts2*T"}
- {id: pi_constant, name: the constant pi as written in the code, dimension: dimensionless, description: "the number the code uses for pi in the activation functions"}
- {id: peak_lv_pressure, name: peak left ventricular pressure, dimension: "[pressure]", description: "maximum left ventricular pressure over one heart cycle"}
- {id: min_lv_pressure, name: minimum left ventricular pressure, dimension: "[pressure]", description: "minimum left ventricular pressure over one heart cycle"}
- {id: peak_arterial_pressure, name: peak systemic arterial pressure, dimension: "[pressure]", description: "maximum systemic arterial pressure over one heart cycle (here the Windkessel pressure)"}
- {id: min_arterial_pressure, name: minimum systemic arterial pressure, dimension: "[pressure]", description: "minimum systemic arterial pressure over one heart cycle (here the Windkessel pressure)"}
- {id: mean_valve_flow, name: mean aortic or mitral valve flow, dimension: "[length]**3/[time]", description: "flow through the aortic (or mitral) valve averaged over one heart cycle (cardiac output)"}
- {id: peak_aortic_flow, name: peak aortic valve flow, dimension: "[length]**3/[time]", description: "maximum forward flow through the aortic valve over one heart cycle"}
- {id: peak_mitral_flow, name: peak mitral valve flow, dimension: "[length]**3/[time]", description: "maximum forward flow through the mitral valve over one heart cycle"}
- {id: max_lv_volume, name: maximum left ventricular volume, dimension: "[length]**3", description: "largest left ventricular volume over one heart cycle (end-diastolic volume)"}
- {id: min_lv_volume, name: minimum left ventricular volume, dimension: "[length]**3", description: "smallest left ventricular volume over one heart cycle (end-systolic volume)"}
- {id: stroke_volume, name: left ventricular stroke volume, dimension: "[length]**3", description: "largest minus smallest left ventricular volume over one heart cycle"}
