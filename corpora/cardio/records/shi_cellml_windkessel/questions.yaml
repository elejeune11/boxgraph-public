- id: q_windkessel_values
  kind: unstated_input
  about: [Cwk_code, Rwk_code, P0wk_code, windkessel_left_heart]
  text: >
    The Windkessel resistance (0.55 mmHg s/mL) and compliance (2.8 mL/mmHg) are hidden choices:
    shi2018 prints no parameter value, and korakianitis2006 (whose values shi2018 says the models
    use) has no two-element Windkessel. They are not lumped sums of the korakianitis2006 systemic
    segments either (the series resistances there add to 1.148 mmHg s/mL, the compliances to
    22.18 mL/mmHg). With R = 0.55 the circuit carries about 9 L/min at a mean pressure near
    100 mmHg, close to twice the 5 L/min that shi2018 prints for its Fig. 1(d) model.
  citation: {file: ParaWindKessel.cellml, lines: "12-13", quote: 'name="Rwk"'}
- id: q_vlv0_initial
  kind: unexplained_difference
  about: [Vlv0_code, Vla0_code]
  text: >
    The code starts the left ventricle at 500 mL and the left atrium at 20 mL, with the
    Windkessel at 0 mmHg: 520 mL in all, which is the circulating volume of this closed loop.
    korakianitis2006 Table 2 prints V_lv0 = 800 ml (read in that record as an initial LV volume,
    itself uncertain: its q_vlv0_table2), and no initial LA volume. The total volume sets the
    filling pressures and so the stroke volume of the reduced model; neither paper states it for
    the Fig. 1(a) model.
  citation: {file: ParaLeftHeart.cellml, lines: "27-28", quote: 'name="Vlv0"'}
- id: q_timing_fractions
  kind: choice
  about: [Tpwb_code, Tpww_code, Ts1_code, Ts2_code]
  text: >
    The code writes the activation times as dimensionless fractions of the period T (Tpwb = 0.92,
    Tpww = 0.09, Ts1 = 0.3, Ts2 = 0.45, used as Tpwb*T etc.), while korakianitis2006 prints them in
    seconds (T_pwb 0.92 s, T_pww 0.09 s, Ts 0.3 s) with T = 1 s. With T = 1 s they are the same
    times, so they are not linked for a unit check here. The code settles what korakianitis2006
    leaves open (its q_ts1_ts2): Ts1 = 0.3 T is the peak of activation and Ts2 = 0.45 T its end,
    the values that record had to add from its Fig. 2. Ts2 is printed in neither paper.
  citation: {file: ParaLeftHeart.cellml, lines: "21-24", quote: 'name="Ts2"'}
- id: q_elastance_form
  kind: unexplained_difference
  about: [windkessel_left_heart]
  text: >
    The code's ventricular activation is et = 1 - cos(pi t/Ts1) rising to 2 at Ts1, then
    1 + cos(pi (t - Ts1)/(Ts2 - Ts1)) falling to 0 at Ts2, with E = Emin + et (Emax - Emin)/2, so
    E runs from Emin to Emax. Eq. 3 of korakianitis2006 as recorded there is written with
    cos(t/T_s1 pi) and cos((t + T_s2 - T_s1)/T_s1 pi), which does not give this curve. The code's
    form is the usual one; whether korakianitis2006 Eq. 3 is a misprint is for the cross-record pass.
  citation: {file: EVentricle.cellml, lines: "20", quote: '<apply><eq/><ci>et</ci>'}
- id: q_valves_simplified
  kind: choice
  about: [windkessel_left_heart]
  text: >
    The valves are on-off diodes (Tao = 1 when the upstream pressure is at least the downstream,
    else 0) with an orifice law Q = CV |dP|^0.5, as in korakianitis2006 Eqs. 6-7, not the leaflet
    dynamics of its Eqs. 8 and 14 that its main results use. The code's own documentation says so:
    valve dynamics "have to be simplified in the current CellML implementation". No backflow is
    possible (the backward branch is multiplied by Tao = 0).
  citation: {file: MainWindKessel.cellml, lines: "19", quote: "have to be simplified in the current CellML implementation"}
- id: q_solver
  kind: numerics
  about: [run_windkessel_code_values, windkessel_left_heart]
  text: >
    The CellML files hold no simulation settings (no end time, step or solver). The port uses
    classical RK4 at dt = 0.1 ms for 10 s from the code's initial values and reports the 10th
    beat; halving and quartering dt and doubling the simulated time change the results by less
    than 0.01% (refinements.yaml). shi2018 says OpenCell offers backward Euler, Adams-Moulton and
    implicit Runge-Kutta schemes but not which was used.
- id: q_pi
  kind: choice
  about: [pi_code_atrium, pi_code_ventricle]
  text: >
    pi is written as 3.14159 in both activation functions (relative error 8e-7). The effect on the
    results is far below printed precision; the port uses the code's number. The port takes one pi
    input for both functions since both files write the same number.
  citation: {file: EAtrium.cellml, lines: "22", quote: "3.14159"}
- id: q_unit_pressure
  kind: choice
  about: [windkessel_left_heart]
  text: >
    The code defines its pressure unit UnitP as 133 Pa, not 133.322 Pa (1 mmHg). Every value and
    equation is in UnitP, so the results in UnitP are what the record calls mmHg; only a conversion
    to SI would carry the 0.24% difference.
  citation: {file: Units.cellml, lines: "6", quote: 'multiplier="133"'}
- id: q_validation_claim_code
  kind: overstated_claim
  about: [windkessel_left_heart, wk_sv, wk_qao_mean]
  text: >
    The code's documentation says its results "have been validated against the original C
    implementation as well as those published data in literature". Neither the C code nor any
    result of this Fig. 1(a) model is published in shi2018. Run as released, it gives LV
    pressures and arterial pressures close to the ranges shi2018 prints for Fig. 1(d), but a
    stroke volume near 150 mL and a cardiac output near 9 L/min, about twice the printed 75 mL
    and 5 L/min (comparisons.yaml).
  citation: {file: MainWindKessel.cellml, lines: "21", quote: "The results have been validated against the original C implementation"}
- id: q_no_printed_results
  kind: unstated_model
  about: [windkessel_left_heart]
  text: >
    shi2018 shows this Fig. 1(a) model only as a schematic and prints no result of it; its only
    results (Fig. 5, Section 3) are for the Fig. 1(d) model, whose CellML is in another record
    (shi_cellml_systemic). So nothing here is a reproduction; the comparisons judge the reduction
    against the full model's printed results (purpose approximation).
- id: q_no_cross_validation_systemic
  kind: unstated_model
  about: [windkessel_left_heart]
  text: >
    Cross-validation against shi_cellml_systemic finds nothing to test. That record, like this
    one, is CellML code: its data are code parameters (origin reported) and results of shi2018 and
    korakianitis2006 copied from the papers (predicted, derived), and it has no figure readings. It
    holds no measurement, so windkessel_left_heart has nothing of it to be validated against. The
    two codes share the left-heart files line for line; how their afterloads differ is a relation
    between models (for the later job), not a validation.
- id: q_no_cross_validation_shi2018
  kind: unstated_model
  about: [windkessel_left_heart]
  text: >
    Cross-validation against shi2018 finds nothing to test. That record holds no measurement: its
    data are the Section 3 results of its own Fig. 1(d) simulation (predicted, derived), and its 20
    Fig. 5 readings are all model output (its figures.md: "The paper plots no measured data").
    The "clinical data" that shi2018 says ref [5]'s model was validated against are in neither
    record. The shape match between windkessel_left_heart and text_max_lv_volume_over_pressure is
    beside the point: the latter is a processing model that holds the paper's printed 130 mL, not a
    measurement. How this Fig. 1(a) reduction approximates shi2018's printed Fig. 1(d) results is
    already compared here (comparisons.yaml, purpose approximation). Fig. 1(a) has no printed or
    plotted result in shi2018, so there is nothing to validate against for these conditions either.
- id: q_no_cross_validation_korakianitis2006
  kind: unstated_model
  about: [windkessel_left_heart]
  text: >
    Cross-validation against korakianitis2006 (ref-korakianitis2006) finds nothing to test. That
    record holds no measurement: its data are table parameters (origin reported) and the results of
    its own simulations (predicted, derived), and its 78 figure readings are all model output (its
    figures.md: "The paper's plots are all model output; it shows no measurements"). Running
    windkessel_left_heart against them would compare model with model, and with a different
    afterload (a Windkessel in place of the systemic and pulmonary loops), which is a relation
    between models for the later job, not a validation. The "cardiology textbooks" korakianitis2006
    says its results agree with are in neither record. Nor does this record hold a measurement for
    a korakianitis2006 model to be validated against: its data are code parameters and shi2018's
    printed simulation results.
- id: q_no_cross_validation_westkessel
  kind: unstated_model
  about: [windkessel_left_heart]
  text: >
    Cross-validation against shi_cellml_westkessel finds nothing to test, in either direction.
    Both records are CellML code from the same repository: their data are code parameters (origin
    reported) and shi2018's printed Fig. 1(d) simulation results (predicted, derived), with no
    measured datum and no figure readings in either. So windkessel_left_heart has no measurement
    there to be validated against, and this record holds none for westkessel_left_heart. Neither
    code names the other or says it explains the other's results. The two models share the left
    heart and differ only in the afterload (two-element Windkessel here, three-element Westerhof
    there); comparing their outputs would be model against model, a relation for the later job,
    not a validation.
  citation: {file: ParaWindKessel.cellml, lines: "12", quote: 'initial_value="2.8" name="Cwk"'}
- id: q_no_cross_validation_korakianitis_cellml
  kind: unstated_model
  about: [windkessel_left_heart]
  text: >
    Checking against korakianitis_cellml found nothing to validate in either direction. Both
    records are CellML code by Shi and Hose. Their data are code parameters (origin reported) and
    model results copied from papers (predicted, derived: shi2018 Section 3 here, korakianitis2006
    Section 3.1 there). Neither has a measured datum or figure readings. The ref-korakianitis2006
    cited here is the paper that supplies the heart parameters, not a source of measurements. So
    windkessel_left_heart has no measurement in that record to be validated against, and this
    record holds none for closed_loop_onoff. The two models share the left heart (TempCDa, TempCDv,
    EAtrium, EVentricle and the same parameters) and differ in the afterload: a two-element
    Windkessel here, the full systemic and pulmonary loops there. Comparing their outputs would be
    a model against a model, a relation for a later job, not a validation. No validation was added.
