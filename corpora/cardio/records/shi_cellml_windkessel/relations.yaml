  assumptions: &wkassume
    - "The 'more complex model that is published separately' is taken to be the closed-loop CellML of korakianitis_cellml (workspace shi_hose_2009, by the same authors): the documentation names no model, and it is the most complex of the series and the only one published in its own workspace; its heart templates (TempCDa, TempCDv, EAtrium, EVentricle) are the ones this code uses."
    - "'Reduction' is read as an approximation, not a limit: the right heart and pulmonary loop are removed and the systemic loop's two compliances, separated by resistance and inertance, are lumped into one Windkessel that returns to the left atrium; no parameter limit makes that exact."
    - "The lumping is ours: Cwk = Csas + Csat (arterial compliance), Rwk = Rsas + Rsat + Rsar + Rscp + Rsvn (systemic resistance, sinus to atrium), P0 = P0sas (the Windkessel starts at the aortic pressure). The code itself writes Cwk = 2.8, Rwk = 0.55 and P0 = 0 (q_windkessel_values), which are not this lumping; the code does not say how they were reduced."
    - "Heart inputs map one to one (same template, same names). The Windkessel loop then holds Vla0 + Vlv0 + Cwk P0 (about 690 mL at the code values) where the closed loop spreads 1327 mL over both circuits, so the reduced loop runs at a different filling: a large error is expected and is the measured finding."
    - "The tolerance (10%) is ours."
