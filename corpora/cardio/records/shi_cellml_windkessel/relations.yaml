  reason: >
    Neither source states a relation, but the CellML is the code of shi2018's Fig. 1(a) model,
    whose parameters shi2018 says are those of korakianitis2006, and its left heart repeats
    korakianitis2006's chamber equations (Eqs. 1, 4: dV/dt = Qin - Qout, P = P0 + e (V - V0)) and
    orifice valves (Eqs. 6-7) with the same printed elastances, reference pressures and volumes and
    CQao, CQmi. It truncates the rest: the right heart and pulmonary loop are removed, the systemic
    loop is lumped into a two-element Windkessel that returns to the left atrium, and the valves are
    on-off only (a is run at its own setting, the leaflet dynamics of Eqs. 8, 14). No limit makes this
    exact, so it is an approximation, tested on peak LV pressure within 10% around korakianitis2006's
    printed parameters (+-10%, timings +-5%; initial conditions as in its added.yaml). The lumping
    Cwk = Csas + Csat (arterial compliance) and Rwk = Rsas + Rsat + Rsar + Rscp + Rsvn (total
    systemic resistance, aorta to atrium) is ours; neither paper prints a Windkessel R or C (the code
    has R = 0.55, C = 2.8). Timings map as fractions of T, as the code uses them. The two ventricular
    activation functions also differ as recorded (q_elastance_form), so a large error is expected
    and is the measured finding.
# a is the closed-loop CellML (korakianitis_cellml, workspace shi_hose_2009), b this Windkessel CellML.
# Both are ports in mL, mmHg, s with the same chamber, activation and on-off valve templates, so the
# heart inputs map one to one; the Windkessel R, C and initial pressure are a lumping of a's systemic loop.
