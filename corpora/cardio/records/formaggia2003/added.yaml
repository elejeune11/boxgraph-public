- id: alpha3_text_zero
  quantity: bifurcation_angle
  unit: rad
  printed: "0"
  basis: "the text (p. 15) says 'alpha1 = alpha2 = 0 corresponds to the case where we impose just the continuity of the total pressure', i.e. no angle losses; the legend's dotted line reads alpha2 = 0; alpha3 = 3. Read here as alpha2 = alpha3 = 0"
  alternatives: ["3"]
  stands_for: "alpha_3 of the dotted line of Figs. 6-8"
