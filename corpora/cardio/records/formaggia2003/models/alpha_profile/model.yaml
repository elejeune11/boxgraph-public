id: alpha_profile
name: momentum-correction coefficient of the power-law velocity profile
role: model
stated: {page: 4, printed_page: "254", quote: "For a profile law of the form", where: "text below Eq. 4"}
equation: "s(x) = zeta^-1 (zeta + 2)(1 - x^zeta), alpha = (zeta + 2)(zeta + 1)^-1"
inputs:
  zeta: {quantity: profile_exponent, unit: dimensionless}
outputs:
  alpha: {quantity: momentum_correction_coefficient, unit: dimensionless}
settings: {}
