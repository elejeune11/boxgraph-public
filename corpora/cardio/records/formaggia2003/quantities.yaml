- {id: profile_exponent, name: exponent zeta of the power-law velocity profile, dimension: dimensionless, description: "s(x) = zeta^-1 (zeta + 2)(1 - x^zeta); zeta = 2 is Poiseuille flow"}
- {id: momentum_correction_coefficient, name: momentum-correction (Coriolis) coefficient alpha, dimension: dimensionless}
- {id: young_modulus, name: Young's modulus of the vessel wall, dimension: "[mass]/[length]/[time]**2"}
- {id: wall_thickness, name: vessel-wall thickness at the reference configuration h0, dimension: "[length]"}
- {id: reference_radius, name: vessel reference radius R0, dimension: "[length]"}
- {id: vessel_length, name: length of one vessel domain, dimension: "[length]"}
- {id: blood_density, name: blood density rho, dimension: "[mass]/[length]**3"}
- {id: kinematic_viscosity, name: kinematic viscosity of blood nu, dimension: "[length]**2/[time]"}
- {id: inlet_pressure_amplitude, name: amplitude of the half-sine pressure pulse imposed at the inlet, dimension: "[mass]/[length]/[time]**2"}
- {id: inlet_pulse_period, name: period of the half-sine inlet pressure pulse, dimension: "[time]"}
- {id: loss_coefficient, name: coefficient gamma_i of the total-pressure loss at a bifurcation (Eq. 37), dimension: dimensionless}
- {id: bifurcation_angle, name: "angle of a daughter branch to the main branch (alpha_2, alpha_3)", dimension: dimensionless}
- {id: time, name: time from the start of the inlet pulse, dimension: "[time]"}
- {id: cross_section_area, name: vessel cross-section area A at a point, dimension: "[length]**2"}
- {id: characteristic_w1, name: forward characteristic variable W1 = Q/A + 4 c1 at a point (Eq. 18), dimension: "[length]/[time]"}
- {id: characteristic_w2, name: backward characteristic variable W2 = Q/A - 4 c1 at a point (Eq. 18), dimension: "[length]/[time]"}
- {id: axial_position, name: position z along the vessel axis, dimension: "[length]"}
- {id: flow_rate, name: volume flow rate Q through a cross-section, dimension: "[length]**3/[time]"}
- {id: area_difference, name: difference in cross-section area between the solutions with and without an added wall term (Section 4), dimension: "[length]**2"}
- {id: flow_rate_difference, name: difference in flow rate between the solutions with and without an added wall term (Section 4), dimension: "[length]**3/[time]"}
- {id: pressure, name: pressure P on an axial section of the vessel, dimension: "[mass]/[length]/[time]**2", description: "P of Eqs. 3 and 9"}
- {id: external_pressure, name: pressure outside the vessel Pext (taken constant), dimension: "[mass]/[length]/[time]**2", description: "Pext of Eq. 9"}
