- id: ref_bif_dt
  run: run_bif_rc_c3_f6_W2_dashdot
  setting: dt
  factors: [1, 2, 4]
  mode: divide
  output: W2_1
  tolerance: "0.5"
  tolerance_basis: "added: half a cm/s, below the reading precision of Fig. 6 (about 1-2 cm/s)"
  tolerance_added: true
- id: ref_bif_mesh
  run: run_bif_rc_c3_f6_W2_dashdot
  setting: n_elements
  factors: [1, 2, 4]
  mode: multiply
  output: W2_1
  tolerance: "0.5"
  tolerance_basis: "added: half a cm/s, below the reading precision of Fig. 6 (about 1-2 cm/s)"
  tolerance_added: true
- id: ref_bif_mesh_area
  run: run_bif_rc_c3_f7_A_dashed
  setting: n_elements
  factors: [1, 2, 4]
  mode: multiply
  output: A_2
  tolerance: "0.001"
  tolerance_basis: "added: 0.001 cm^2, below the reading precision of Fig. 7 (about 0.002 cm^2)"
  tolerance_added: true
- id: ref_endo_dt
  run: run_endo_f12_W2
  setting: dt
  factors: [1, 2]
  mode: divide
  output: W2_2
  tolerance: "0.5"
  tolerance_basis: "added: half a cm/s, below the reading precision of Fig. 12 (about 1 cm/s). The mesh is not refined: the printed dt is close to the scheme's stability limit (Eq. 24) in the stiff endografted domains, so a finer mesh needs a smaller dt"
  tolerance_added: true
