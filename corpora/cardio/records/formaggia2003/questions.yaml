- id: q_eq15_friction_sign
  kind: possible_error
  about: [bifurcation_angles, endograft_bifurcation]
  text: >
    (audit) Eq. 15 prints the momentum source as B_Q = K_R Q/A + ..., with a plus sign, while Eq. 3 has
    + K_R Q/A on the left-hand side, so that moving it to the right (Eq. 13, dU/dt + dF/dz = B) gives
    B_Q = - K_R Q/A. With the printed sign friction would accelerate the flow. The models follow Eq. 3
    (BQ = -K_R Q/A); with beta and A0 constant in each vessel the other terms of Eq. 15 vanish.
