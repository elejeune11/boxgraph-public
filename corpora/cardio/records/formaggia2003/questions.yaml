    characteristic W2 at its rest value (the B = 0 form the paper describes) and extrapolate W1. With
    K_R = 8 pi nu the friction over a 10 cm vessel is small.
  citation: {page: 9, printed_page: "259", quote: "When B(U) = 0 they are equivalent to imposing a constant value"}
