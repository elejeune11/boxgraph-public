- id: q_inlet_condition
  kind: choice
  about: [bifurcation_angles, endograft_bifurcation, f6_W1_fig]
  text: >
    The text says a half-sine pressure wave is imposed at the inlet. Imposing the pressure there
    reflects the waves that return from the bifurcation, so W1 at the middle of Omega_1 would not return
    to rest while W2 is still disturbed; in Fig. 6 W1 returns exactly to rest at the end of the pulse
    (about 0.113 s) although W2 is still away from rest until about 0.14 s. The plotted results look like
    the incoming characteristic being imposed (Eq. 25, 'W1(t) = g1(t)') as the forward wave of the pressure
    pulse. Both are run: 'pressure' (as printed) and 'characteristic' (runs 'rc').
  citation: {page: 15, printed_page: "265", quote: "imposed a half-sine input pressure wave of period"}
- id: q_pulse_shape
  kind: choice
  about: [T_bif, T_endo]
  text: >
    'A half-sine input pressure wave of period 0.1 s' is read as P(t) = P_amp sin(pi t/T) for
    0 <= t <= T and 0 after, a pulse lasting T, which is what Fig. 6 shows (the pulse passes the middle of
    Omega_1 in about 0.1 s). The other reading, sin(2 pi t/T) for t <= T/2, would last 0.05 s.
  citation: {page: 15, printed_page: "265", quote: "imposed a half-sine input pressure wave of period"}
- id: q_outlet_condition
  kind: choice
