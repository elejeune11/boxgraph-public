- id: q_no_validation_vs_olufsen2000
  kind: choice
  about: [tube_law_eq9, bifurcation_angles, endograft_bifurcation, alpha_profile]
  text: >
    No validation against olufsen2000 is entered, in either direction (cross-validation job 2026-11-04).
    This paper cites olufsen2000 (ref. 13) only as another network of 1D models (p. 1) and as having also
    placed a bifurcation at one point without angles (p. 13); it neither uses nor compares with that
    paper's measurements. The measurements of olufsen2000 are the MR flows of one subject (Fig. 3 inflow
    and the nine Fig. 7 sites), his cuff pressures (120/80 mmHg), heart rate and the Table 1 inlet
    radius. bifurcation_angles and endograft_bifurcation are idealized three- and six-domain channels
    driven by a half-sine inlet pressure, with equal lengths and non-reflecting outlets: run on the
    measurements' own conditions (a 24-segment patient network, the Fig. 3 inflow, structured-tree
    outflow) they would no longer be this paper's models but olufsen2000's network_1d, which is not
    runnable. tube_law_eq9 gives pressure from area, but no area is measured with the cuff pressures
    (only the reference radius, an input), and olufsen2000 gives no E and h0 for its arteries, only the
    fitted Eh/r0 of its Eq. 15. The radius, heart rate and period are inputs, not outputs, of any model
    here. In the other direction, this record holds no measured datum (every plot is model output), so
    no model of olufsen2000 can be tested against it. That olufsen2000/tube_law_eq14 and tube_law_eq9
    have the same shape is a relation between models, not a validation against data.
  citation: {page: 13, printed_page: "263", quote: "This approach has been followed also by other authors, like [13]"}
- id: q_no_validation_vs_stergiopulos1992
  kind: choice
  about: [tube_law_eq9, bifurcation_angles, endograft_bifurcation, alpha_profile]
  text: >
    No validation against stergiopulos1992 is entered, in either direction (cross-validation job
    2026-11-04). Neither paper cites the other. The measurements recorded in stergiopulos1992 are the
    pulsatility indices of Gosling et al. (1971) at the aortic bifurcation, groin, knee and ankle of one
    patient with a femoral stenosis (Fig. 7), and the segmental systolic pressure indices of Fronek et
    al. (1973) at thigh, knee and ankle for normal, aortoiliac and femoropopliteal groups. Both are
    dimensionless ratios at sites of the human leg. No model here outputs a pulsatility index or a
    systolic pressure ratio. bifurcation_angles and endograft_bifurcation are idealized 10 cm channels
    driven by a half-sine inlet pressure with non-reflecting outlets. On the measurements' conditions
    (a whole arterial tree with a stenosis and peripheral resistances) they would no longer be this
    paper's models. tube_law_eq9 gives pressure from area, but stergiopulos1992 measures no area, and
    its wall law (Eq. 9, logarithmic) and properties are not this law's E and h0. alpha_profile gives a
    profile coefficient that no measurement there quantifies. In the other direction, this record holds
    no measured datum (every plot is model output), so no model of stergiopulos1992 can be tested
    against it. That tube_law_eq9 and stergiopulos1992/arterial_tree_1d both give a pressure is a
    relation between models, not a validation against data.
  citation: {page: 5, printed_page: "255", quote: "Pressure and area will then be related by an algebraic law of the type", where: "Eqs. 6, 9, 10"}
- id: q_no_validation_vs_westerhof1969
  kind: choice
  about: [tube_law_eq9, bifurcation_angles, endograft_bifurcation, alpha_profile]
  text: >
    No validation against westerhof1969 is entered, in either direction (cross-validation job
    2026-11-04). This paper cites westerhof1969 (ref. 16) only as an example of lumped-parameter
    models based on ordinary differential equations (pp. 251-252); it does not say that any of its
    models explains, fits or predicts that paper's measurements. The measurements recorded in
    westerhof1969 are the pressure decay time constants measured on the electrical analog (0.8, 0.4,
    1.66 and about 0.5 s, p. 136), the about-50% increases of input-impedance level and wave velocity
    of the analog when its capacitors are halved, and the apparent wave velocity in man versus
    frequency of Luchsinger et al. and Gabe et al. (Fig. 7). No model here gives these quantities:
    bifurcation_angles and endograft_bifurcation are idealized three- and six-vessel channels driven
    by a half-sine inlet pressure with non-reflecting outlets, with no peripheral resistance (so no
    diastolic decay time) and no input impedance or apparent, reflection-affected wave velocity of a
    whole tree; run on the conditions of those measurements (the 121-segment human tree) they would
    no longer be this paper's models. tube_law_eq9 gives pressure from area and alpha_profile a
    profile coefficient, neither measured there. In the other direction, this record holds no
    measured datum (every plotted value is model output), so no model of westerhof1969 can be tested
    against it.
  citation: {page: 1, printed_page: "251", quote: "lumped-parameter models [4, 14] based on a system of ordinary differential equations", where: text}

- id: q_no_validation_vs_boileau2015
  kind: choice
  about: [bifurcation_angles, endograft_bifurcation, tube_law_eq9, alpha_profile]
  text: >
    No model of this record is validated against boileau2015 (cross-validation job 2026-11-04). The
    only measurements there are the in vitro pressure and flow waveforms of [45] (Matthys et al. 2007)
    at eight sites of a 37-artery silicone network (boileau2015 Figs. 6-9, fig6a_P_exp_curve to
    fig9b_Q_exp_curve). bifurcation_angles and endograft_bifurcation are this paper's idealized three-
    and six-vessel channels (R0 = 0.5 cm, E and h equal in all vessels) driven by a 0.1 s half-sine
    inlet pressure with non-reflecting outlets; run on the conditions of those measurements (37
    segments of different geometry, a measured inflow, terminal resistances) they would no longer be
    this paper's models, and the waveforms at the measured sites are not outputs of either.
    tube_law_eq9 gives pressure from cross-sectional area, which boileau2015 does not record as measured
    at those sites, and alpha_profile a profile coefficient, not measured there. boileau2015 cites this
    paper (its ref. 10) for the form of the tube law and as a 1D method, not for data. The pairing's
    shared shape (boileau2015/initial_area_eq16 and bifurcation_angles both take a length and a
    pressure and give an area) is a coincidence of dimensions, not of measured quantity. In the other
    direction, this record holds no measured datum, so no boileau2015 model can be tested against it.
  citation: {page: 15, where: text, quote: "At the inlet of 1 we have imposed a half-sine input pressure wave"}

- id: q_no_validation_vs_alastruey2011
  kind: choice
  about: [tube_law_eq9, bifurcation_angles, endograft_bifurcation, alpha_profile]
  text: >
    No model of this record is validated against alastruey2011 (cross-validation job 2026-11-04). This
    paper does not mention alastruey2011, which is later; alastruey2011 cites this paper only for the
    derivation of its tube law, Eq. 5, from a generalised string model (its p. 3), not for data. The
    measurements of alastruey2011 are the fluid density and viscosity, the silicone's Young's modulus
    and viscosity, the uniaxial load-extension curves of Fig. 2, the geometry and foot-to-foot wave
    speeds of Table 2 for the 37-segment silicone network, the harmonic amplitudes of the measured
    inflow, and the in vitro pressure and flow waveforms at four sites (Fig. 3). tube_law_eq9 gives
    pressure from cross-sectional area, but no area (or diameter) is measured there together with a
    pressure; the radii of Table 2 are reference radii, an input of the law, not its output. It gives
    no wave speed or load, so neither Table 2's wave speeds nor Fig. 2 are its outputs (a wave speed
    from this law would be a new model, not one of this record). bifurcation_angles and
    endograft_bifurcation are idealized three- and six-vessel channels driven by a 0.1 s half-sine inlet
    pressure with non-reflecting outlets; run on the measurements' conditions (37 segments, the
    measured inflow, terminal resistances) they would no longer be this paper's models, and the
    waveforms at the measured sites are not outputs of either. alpha_profile gives a profile
    coefficient, not measured there. That tube_law_eq9 and alastruey2011/network_1d both give a
    pressure is a likeness of models, not a validation against data. In the other direction, this
    record holds no measured datum, so no alastruey2011 model can be tested against it.
  citation: {page: 5, printed_page: "255", quote: "Pressure and area will then be related by an algebraic law of the type", where: "Eqs. 6, 9, 10"}
