# Denominators of Table 2 rows whose percentages are not shares of the 28 / 22 / 6 patients
- id: n_med_tot_added
  quantity: count
  unit: dimensionless
  printed: "27"
  conditions: {group: ANOCA}
  basis: >-
    Table 2 does not print how many patients had medication data. 13 (48.1%), 16 (59.3%), 7 (25.9%), 19 (70.4%)
    each give 27 patients; the totals of the other rows are shares of 28.
  alternatives: ["28"]
  stands_for: denominator of the 'Medication at study admission' percentages, Total column
- id: n_med_women_added
  quantity: count
  unit: dimensionless
  printed: "21"
  conditions: {group: "ANOCA women"}
  basis: "11 (52.4%), 5 (23.8%), 15 (71.4%), 13 (61.9%) each give 21 women; the men's percentages are shares of 6"
  alternatives: ["22"]
  stands_for: denominator of the medication percentages, Women column
- id: n_hmr_tot_added
  quantity: count
  unit: dimensionless
  printed: "21"
  conditions: {group: ANOCA}
  basis: "Table 2 does not print how many patients had HMR measured; 2 (9.5%) gives 21"
  alternatives: ["28"]
  stands_for: denominator of 'Increased HMR (>2.5), %', Total column
- id: n_hmr_women_added
  quantity: count
  unit: dimensionless
  printed: "17"
  conditions: {group: "ANOCA women"}
  basis: "1 (5.9%) gives 17 women"
  alternatives: ["22"]
  stands_for: denominator of 'Increased HMR', Women column
- id: n_hmr_men_added
  quantity: count
  unit: dimensionless
  printed: "4"
  conditions: {group: "ANOCA men"}
  basis: "1 (25.0%) gives 4 men; 17 + 4 = 21"
  alternatives: ["6"]
  stands_for: denominator of 'Increased HMR', Men column

# Age-predicted maximum heart rate
- id: hrmax_factor_added
  quantity: max_heart_rate_factor
  unit: dimensionless
  printed: "1"
  basis: >-
    2.5 names an 'age predicted maximum heart rate' and cites ref. 20 but gives no formula; the usual one is
    220 - age. The supplement's endpoint 'maximal heart rate (i.e. ((220-age) x 0,85)' is the alternative and is
    run as well (target_hr_factor).
  alternatives: ["0.85"]
  stands_for: f in HRpred = f (220 - age)

# Density of myocardium, to turn the cited mL per 100 g into a volume fraction
- id: tissue_density_added
  quantity: myocardial_tissue_density
  unit: g/mL
  printed: "1.05"
  basis: "The paper gives the coronary blood content per mass (12 mL per 100 g) and MBV per volume (mL/mL); it states no tissue density. 1.05 g/mL is the usual value for myocardium."
  alternatives: ["1.0", "1.06"]
  stands_for: conversion of 'mL of blood per 100 g of myocardium' to mL/mL
