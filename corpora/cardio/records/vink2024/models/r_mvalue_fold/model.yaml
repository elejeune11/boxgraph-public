  B: {quantity: mbf_fold_change, unit: dimensionless, curve: {quantity: insulin_sensitivity, unit: umol/kg/min}, description: "the points of the second group (blue)"}
outputs:
  r: {quantity: correlation_mvalue_fold, unit: dimensionless}
settings: {}
stochastic: false
