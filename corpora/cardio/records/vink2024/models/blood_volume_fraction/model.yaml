id: blood_volume_fraction
name: coronary and microvascular blood volume per myocardial volume from the blood content per mass
role: model
from_words: true
stated: {page: 6, printed_page: "6", quote: "The coronary circulation contains about 12 mL of blood per 100 g of", where: "4.1 Myocardial blood volume"}
equation: "phi = c rho; phi_micro = s c rho (c blood per mass of myocardium, rho myocardial density, s the microcirculation's share)"
inputs:
  c: {quantity: coronary_blood_content, unit: mL/g}
  s: {quantity: microcirculation_blood_share, unit: percent}
  rho: {quantity: myocardial_tissue_density, unit: g/mL}
outputs:
  phi: {quantity: myocardial_blood_volume_fraction, unit: mL/mL}
  phi_micro: {quantity: myocardial_blood_volume, unit: mL/mL}
settings: {}
stochastic: false
