id: pooled_table2
name: Table 2 Total column (mean and SD) from the women and men columns
role: processing
from_words: true
stated: {page: 4, printed_page: "4", quote: "Data are presented as mean ± SD.", where: "Table 2"}
equation: >-
  mean = (n1 m1 + n2 m2)/(n1 + n2);
  SD^2 = [(n1 - 1) s1^2 + (n2 - 1) s2^2 + n1 n2/(n1 + n2) (m1 - m2)^2] / (n1 + n2 - 1)
  (the sample mean and SD of the union of two groups; group 1 women, group 2 men)
inputs:
  n1: {quantity: count, unit: dimensionless}
  n2: {quantity: count, unit: dimensionless}
  age_m1: {quantity: age, unit: yr}
  age_s1: {quantity: age, unit: yr}
  age_m2: {quantity: age, unit: yr}
  age_s2: {quantity: age, unit: yr}
  bmi_m1: {quantity: body_mass_index, unit: kg/m^2}
  bmi_s1: {quantity: body_mass_index, unit: kg/m^2}
  bmi_m2: {quantity: body_mass_index, unit: kg/m^2}
  bmi_s2: {quantity: body_mass_index, unit: kg/m^2}
  ef_m1: {quantity: ejection_fraction, unit: percent}
  ef_s1: {quantity: ejection_fraction, unit: percent}
  ef_m2: {quantity: ejection_fraction, unit: percent}
  ef_s2: {quantity: ejection_fraction, unit: percent}
  cfr_m1: {quantity: coronary_flow_reserve, unit: dimensionless}
  cfr_s1: {quantity: coronary_flow_reserve, unit: dimensionless}
  cfr_m2: {quantity: coronary_flow_reserve, unit: dimensionless}
  cfr_s2: {quantity: coronary_flow_reserve, unit: dimensionless}
  hr0_m1: {quantity: heart_rate, unit: 1/min}
  hr0_s1: {quantity: heart_rate, unit: 1/min}
  hr0_m2: {quantity: heart_rate, unit: 1/min}
  hr0_s2: {quantity: heart_rate, unit: 1/min}
  hrmax_m1: {quantity: heart_rate, unit: 1/min}
  hrmax_s1: {quantity: heart_rate, unit: 1/min}
  hrmax_m2: {quantity: heart_rate, unit: 1/min}
  hrmax_s2: {quantity: heart_rate, unit: 1/min}
