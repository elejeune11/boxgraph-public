id: r2_interobserver
name: R2 of the linear fit of observer-1 MBV on observer-2 MBV over patients and controls pooled (the square of Pearson r)
role: processing
from_words: true
stated: {page: 3, printed_page: "3", quote: "Pearson’s correlation tested the", where: "2.6 Statistical analysis; Supplemental Fig. 2"}
equation: "R2 = r^2, r = sum (x - mx)(y - my) / sqrt(sum (x - mx)^2 sum (y - my)^2)"
inputs:
  A: {quantity: myocardial_blood_volume, unit: mL/mL, curve: {quantity: myocardial_blood_volume, unit: mL/mL}, description: "the points of the first group (red)"}
  B: {quantity: myocardial_blood_volume, unit: mL/mL, curve: {quantity: myocardial_blood_volume, unit: mL/mL}, description: "the points of the second group (blue)"}
outputs:
  R2: {quantity: r2_interobserver_mbv, unit: dimensionless}
settings: {}
stochastic: false
