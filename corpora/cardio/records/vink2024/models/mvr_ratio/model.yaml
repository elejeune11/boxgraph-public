id: mvr_ratio
name: microvascular recruitment as the ratio of MBV in a stimulated state to MBV at baseline
role: model
stated: {page: 3, printed_page: "3", quote: "calculated as MBVhyperinsulinemia/MBVbaseline", where: "2.4 (and 2.5: MBVstress/MBVbaseline)"}
equation: "MVR = MBVhyperinsulinemia/MBVbaseline; contraction-induced MVR = MBVstress/MBVbaseline"
inputs:
  MBVx: {quantity: myocardial_blood_volume, unit: mL/mL, description: "MBV during hyperinsulinemia or during dobutamine stress"}
  MBV0: {quantity: myocardial_blood_volume, unit: mL/mL, description: "MBV at baseline"}
outputs:
  MVR: {quantity: microvascular_recruitment, unit: dimensionless}
settings: {}
stochastic: false
