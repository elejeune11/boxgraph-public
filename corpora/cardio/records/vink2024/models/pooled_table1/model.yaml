id: pooled_table1
name: Table 1 Total column (mean and SD) from the ANOCA and control columns
role: processing
from_words: true
stated: {page: 4, printed_page: "4", quote: "Data are presented as mean ± SD or median and IQR.", where: "Table 1"}
equation: >-
  mean = (n1 m1 + n2 m2)/(n1 + n2);
  SD^2 = [(n1 - 1) s1^2 + (n2 - 1) s2^2 + n1 n2/(n1 + n2) (m1 - m2)^2] / (n1 + n2 - 1)
  (the sample mean and SD of the union of two groups; group 1 ANOCA, group 2 controls)
inputs:
  n1: {quantity: count, unit: dimensionless}
  n2: {quantity: count, unit: dimensionless}
  age_m1: {quantity: age, unit: yr}
  age_s1: {quantity: age, unit: yr}
  age_m2: {quantity: age, unit: yr}
  age_s2: {quantity: age, unit: yr}
  bmi_m1: {quantity: body_mass_index, unit: kg/m^2}
  bmi_s1: {quantity: body_mass_index, unit: kg/m^2}
  bmi_m2: {quantity: body_mass_index, unit: kg/m^2}
  bmi_s2: {quantity: body_mass_index, unit: kg/m^2}
  ef_m1: {quantity: ejection_fraction, unit: percent}
  ef_s1: {quantity: ejection_fraction, unit: percent}
  ef_m2: {quantity: ejection_fraction, unit: percent}
  ef_s2: {quantity: ejection_fraction, unit: percent}
  hb_m1: {quantity: hemoglobin_concentration, unit: mmol/L}
  hb_s1: {quantity: hemoglobin_concentration, unit: mmol/L}
  hb_m2: {quantity: hemoglobin_concentration, unit: mmol/L}
  hb_s2: {quantity: hemoglobin_concentration, unit: mmol/L}
  creat_m1: {quantity: creatinine_concentration, unit: umol/L}
  creat_s1: {quantity: creatinine_concentration, unit: umol/L}
  creat_m2: {quantity: creatinine_concentration, unit: umol/L}
  creat_s2: {quantity: creatinine_concentration, unit: umol/L}
  plt_m1: {quantity: platelet_count, unit: 1/nL}
  plt_s1: {quantity: platelet_count, unit: 1/nL}
  plt_m2: {quantity: platelet_count, unit: 1/nL}
  plt_s2: {quantity: platelet_count, unit: 1/nL}
  ldl_m1: {quantity: ldl_cholesterol, unit: mmol/L}
  ldl_s1: {quantity: ldl_cholesterol, unit: mmol/L}
  ldl_m2: {quantity: ldl_cholesterol, unit: mmol/L}
  ldl_s2: {quantity: ldl_cholesterol, unit: mmol/L}
outputs:
  age_m: {quantity: age, unit: yr}
  age_s: {quantity: age, unit: yr}
  bmi_m: {quantity: body_mass_index, unit: kg/m^2}
  bmi_s: {quantity: body_mass_index, unit: kg/m^2}
  ef_m: {quantity: ejection_fraction, unit: percent}
  ef_s: {quantity: ejection_fraction, unit: percent}
  hb_m: {quantity: hemoglobin_concentration, unit: mmol/L}
  hb_s: {quantity: hemoglobin_concentration, unit: mmol/L}
  creat_m: {quantity: creatinine_concentration, unit: umol/L}
  creat_s: {quantity: creatinine_concentration, unit: umol/L}
  plt_m: {quantity: platelet_count, unit: 1/nL}
