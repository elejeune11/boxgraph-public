id: missing_percent
name: share of MBV values missing in one MCE condition
role: processing
from_words: true
stated: {page: 3, printed_page: "3", quote: "55 during baseline MCE (missing 1.8%), 54 during", where: "3.2 Myocardial blood volume"}
equation: "missing % = 100 (N - n) / N (of the N participants); the alternative reading 100 (N - n) / n (of the values obtained) is the second output"
inputs:
  N: {quantity: count, unit: dimensionless, description: "participants who should have had the measurement (56)"}
  n: {quantity: count, unit: dimensionless, description: "MBV values obtained in that condition"}
outputs:
  of_total: {quantity: missing_percent, unit: percent, description: "missing over all participants"}
  of_obtained: {quantity: missing_percent, unit: percent, description: "missing over the values obtained"}
settings: {}
stochastic: false
