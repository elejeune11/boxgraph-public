id: percent_of_group
name: the percentage printed beside a count, as the count over its denominator
role: processing
from_words: true
stated: {page: 3, printed_page: "3", quote: "Categorical variables are presented as counts (%)", where: "2.6 Statistical analysis"}
equation: "% = 100 k / n (k the count in the category, n the number of the group it is a share of)"
inputs:
  k: {quantity: count, unit: dimensionless, description: "the count printed before the percentage"}
  n: {quantity: count, unit: dimensionless, description: "the denominator: the group size, or the subgroup the row is a share of"}
outputs:
  pct: {quantity: percent_of_group, unit: percent}
settings: {}
stochastic: false
