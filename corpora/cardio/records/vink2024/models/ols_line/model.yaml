id: ols_line
name: least-squares line of observer-1 MBV on observer-2 MBV through the per-participant points (SPSS "R2 Linear" fit line)
role: fit
from_words: true
stated: {page: 13, printed_page: "S5", quote: "Scatterplot showing the observations from both observers at baseline MBV", where: "Supplemental Fig. 2 (legend: R2 Linear = 0,690)"}
equation: "y = a + b x, (a, b) minimizing sum (y - a - b x)^2 over all points"
inputs:
  A: {quantity: myocardial_blood_volume, unit: mL/mL, curve: {quantity: myocardial_blood_volume, unit: mL/mL}, description: "the patients' points"}
  B: {quantity: myocardial_blood_volume, unit: mL/mL, curve: {quantity: myocardial_blood_volume, unit: mL/mL}, description: "the controls' points"}
  L: {quantity: myocardial_blood_volume, unit: mL/mL, curve: {quantity: myocardial_blood_volume, unit: mL/mL}, description: "the read line; only its x positions are used"}
outputs:
  y: {quantity: myocardial_blood_volume, unit: mL/mL, curve: {quantity: myocardial_blood_volume, unit: mL/mL}, description: "the fitted line at the read line's x positions"}
settings: {}
stochastic: false
