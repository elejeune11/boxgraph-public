id: heart_rate_reserve
name: heart rate reserve as peak minus resting heart rate
role: model
stated: {page: 3, printed_page: "3", quote: "to calculate heart rate reserve, defined as the difference between peak", where: "2.5 Dobutamine-induced stress"}
equation: "HRR = peak heart rate - resting heart rate"
inputs:
  HRmax: {quantity: heart_rate, unit: 1/min, description: "maximal heart rate in dobutamine stress"}
  HRrest: {quantity: heart_rate, unit: 1/min, description: "resting (baseline) heart rate"}
outputs:
  HRR: {quantity: heart_rate_reserve, unit: 1/min}
settings: {}
stochastic: false
