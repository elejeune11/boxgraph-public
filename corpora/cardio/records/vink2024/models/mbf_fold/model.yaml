id: mbf_fold
name: recruitment of MBF as the fold change of MBF from baseline
role: model
from_words: true
stated: {page: 16, printed_page: "S8", quote: "recruitment of MBF, calculated as fold MBF", where: "Supplemental Fig. 5; Supplemental Table 3"}
equation: "fold MBF = MBF(hyperinsulinemia or dobutamine stress) / MBF(baseline)"
inputs:
  MBFx: {quantity: myocardial_blood_flow, unit: mL/min/g}
  MBF0: {quantity: myocardial_blood_flow, unit: mL/min/g}
outputs:
  fold: {quantity: mbf_fold_change, unit: dimensionless}
settings: {}
stochastic: false
