- id: q_no_corpus_mbv_model
  kind: choice
  about: [myocardial_blood_volume, mbv_base_c_m, mbv_base_a_m]
  text: >-
    (Batch 10.) No model in the corpus predicts this paper's MBV under matching conditions. spaan1981 computes a
    capillary volume fraction (0.068, from 3500 capillaries/mm2 and 5 um diameter) and a capillary + small-artery
    fraction (0.091) for the dog; kassab1993 and kaneko2011 give vessel volumes and capillary geometry; rakusan1992,
    campbell2011 and mohammed2015 give human capillary densities, from which a capillary volume fraction could be
    computed (density x pi d^2 / 4) but none of them states it. Against any of these the MCE MBV (0.39-0.48) is four
    to six times larger (see q_mbv_magnitude): it is an acoustic ratio, end-systolic and relative to the LV cavity,
    not a morphometric volume, so a validation would test the MCE calibration rather than a model. The only
    cross-record check entered is the Discussion's cited 12 mL/100 g against spaan1981's dye-dilution 10-15%.
    The paper gives no MBV, MBF or MVR by sex, so its sex breakdown (22 women, 6 men per group) cannot be used.

- id: q_perfused_capillaries_mbv
  kind: reading
  about: [perfused_capillary_share, cbv_content, micro_share, mbv_base_c_m, q_mbv_magnitude, q_no_corpus_mbv_model]
  text: >-
    (Audit.) 4.1 also states, citing ref. 22 (a review), that at rest "around half of the capillaries in the myocardium
    are simultaneously filled with blood", so the MCE MBV at rest would see roughly half the morphometric capillary
    volume, and recruitment could at most double it. Both points widen rather than close the gap of q_mbv_magnitude:
    a capillary volume fraction from rakusan1992, kaneko2011, campbell2011 or mohammed2015 (fixed tissue, all
    capillaries counted) would have to be halved before it is set against MBV at rest (0.39-0.44 mL/mL), and the
    printed MVR medians near 1 show no such recruitment. The statement is recorded (perfused_capillary_share) but
    not run: it is given in words and from a review, and no corpus model predicts a perfused fraction.
  citation: {page: 6, printed_page: "6", quote: "around half of the capillaries in the myocardium are", where: "4.1"}
  citation: {page: 2, printed_page: "2", quote: "passing the total blood content within the microcirculation, determines", where: "1. Introduction"}

# ---- figure pass (2026-11-11): calibrated readings, figures.yaml and figures.md ----
- id: q_fig_vs_text_precision
  kind: reading
  about: [cmp_fig2a_a_means, cmp_fig2a_c_means, cmp_fig3c_c_mean, cmp_sfig5a_a_means, cmp_sfig5a_c_means, q_mbf_unit]
  text: >-
    The figure-vs-text checks judge a bar read from a figure against the printed mean at the printed precision (three
    decimals), so they come out "close" (Fig. 2A, Fig. 3C controls) or "not reproduced" (Suppl. Fig. 5A) although every
    printed mean lies inside the reading's own interval: Fig. 2A's six bars, Fig. 3C's two and Suppl. Fig. 5A's six bars
    agree with 3.2, 3.5 and Supplemental Table 3. The SD error bars also span mean ± the printed SD. The verdicts are
    the reading's precision, not a disagreement between figure and text. For q_mbf_unit, Suppl. Fig. 5A plots the
    table's numbers under the axis label "dB/sec": the figure and table hold the same values, and the figure cannot
    say which unit is meant.

- id: q_fig2b_entities
  kind: possible_error
  about: [fig2b_epi_fig, fig2b_mva_fig, sfig6_epi_fig, q_fig2b_legend]
  text: >-
    Read from the image, the "Epicardial spasm (n=11)" bars of Fig. 2B carry two dots at baseline and stress and one
    at insulin, which has no error bar; Suppl. Fig. 6 shows one dot. This matches the 3 patients with epicardial spasm
    of Table 2 and 3.1, not 11, which supports q_fig2b_legend. Also, the epicardial-spasm and microvascular-angina bars
    have the same height at baseline (both 0.373 read) and at stress (both 0.400 read), within 2 px, although their
    dots and error bars differ. A two-for-two coincidence of group means is possible but unlikely, so a bar of one
    group may have been plotted with the other's mean.
  citation: {page: 5, printed_page: "5", quote: "Comparison among different ANOCA entities", where: "Fig. 2B"}

- id: q_scatter_fused
  kind: reading
  about: [cmp_r_sfig7a, cmp_r_sfig7b, cmp_r_sfig8a, cmp_r_sfig8b, sfig7a_anoca, sfig7a_control, sfig7b_anoca, sfig7b_control, sfig8a_anoca, sfig8a_control, sfig8b_anoca, sfig8b_control]
  text: >-
    In Suppl. Figs. 7-8, red dots overlap one another and cover blue triangles. The reading counts fused markers from
    their area and splits them, but dense chains are under-counted and covered triangles are lost: it finds 47 (7A),
    51 (7B), 43 (8A) and 43 (8B) markers. Only about 54 MBV values per state exist, and fewer M-values or HRRs may be
    plotted, so the true counts are unknown. The r of the read points differs from the printed r by 0.03-0.04 in each
    panel (not reproduced). That is the size of error the missing markers can cause, so these four verdicts test the
    reading, not the paper. Where markers stand apart (Suppl. Fig. 4, 21 markers; Suppl. Fig. 2, 54 rings), the printed
    r and R2 are reproduced.
  citation: {page: 3, printed_page: "3", quote: "Pearson’s correlation tested the", where: "2.6; Suppl. Figs. 7-8"}

- id: q_sfig2_line
  kind: overstated_claim
  about: [cmp_sfig2_identity, cmp_sfig2_ols, sfig2_line_fig, identity_line, ols_line]
  text: >-
    The caption of Suppl. Fig. 2 says "The diagonal line indicates perfect agreement between the two observers". The
    line drawn is not y = x: it passes about 0.27 at observer-2 MBV 0.20 and about 0.68 at 0.70, a slope of about 0.8
    (cmp_sfig2_identity not reproduced). It is the least-squares line through the plotted rings (cmp_sfig2_ols
    reproduced at both ends), the fit the legend's "R2 Linear = 0,690" labels. The scatter about the line therefore
    shows the residual about the fit, not the disagreement between observers. Points with a slope below 1 mean
    observer 1 reads high MBV lower than observer 2, which the caption does not mention.
  citation: {page: 13, printed_page: "S5", quote: "The diagonal line indicates perfect", where: "Supplemental Fig. 2 caption"}

- id: q_territory_weights
  kind: choice
  about: [territory_mean, cmp_terr_mean_a, cmp_terr_mean_c, sfig3a_anoca, sfig3c_control]
  text: >-
    MBV of the whole myocardium is the mean over all myocardial ROIs (2.3); the paper does not give how many ROIs fall
    in each coronary territory (Suppl. Fig. 1 maps segments to territories). The record compares the whole-myocardium
    means with an equal-weight mean of the three territory bars of Suppl. Fig. 3. For ANOCA the mean is about 0.004
    below the printed means at all three states. For controls it matches at baseline and insulin within 0.007, but at
    stress it is 0.504 against 0.476. With LAD segments weighted more, as on a 17-segment map, the stress value would
    rise further. Missing territory values, which drop a participant from one territory's mean but not from the
    overall mean, could explain the gap. The weights are a choice; the gap is a finding of the figure, not settled.
  citation: {page: 3, printed_page: "3", quote: "myocardium by averaging all myocardial ROI’s, and for the individual", where: "2.3"}

- id: q_fig3_means
  kind: reading
  about: [fig3a_anoca_fig, fig3a_control_fig, fig3b_anoca_fig, fig3b_control_fig, sfig5b_anoca_fig, sfig5b_control_fig, q_ratio_medians, q_mvalue_unit]
  text: >-
    Fig. 3A-B and Suppl. Fig. 5B plot means ± SD, as their captions say, while the text prints medians [IQR]. Read
    means are 38.7 and 64.8 μmol/kg/min for the M-value, against medians of 36.8 and 69.1. The figures thus confirm
    that caption and text report different statistics (q_mvalue_unit), not a misprint. The plotted mean MVRs (1.04,
    1.04; 1.06, 1.14) exceed the ratios of the plotted mean MBVs (1.02, 1.02; 1.03, 1.09), as a mean of ratios
    usually does. The approximation comparisons pass only because their interval is the SD bar. The text's medians
    of per-person ratios (q_ratio_medians) can be neither recomputed nor contradicted from the bars.
  citation: {page: 5, printed_page: "5", quote: "presented as mean ± SD. A) Insulin-induced and contraction-induced MVR", where: "Fig. 3 caption"}

- id: q_no_validation_davies2006
  kind: choice
  about: [q_no_corpus_mbv_model, blood_volume_fraction, mvr_by_state, mbf_fold, heart_rate_reserve, pooled_table1]
  text: >-
    (Validation job davies2006+vink2024, 2026-11-11; davies2006 is in this record's relate_with.) No entry in
    validations.yaml, in either direction. davies2006 measures intracoronary pressure, Doppler velocity and wave
    intensity (six waves: peaks, cumulative intensities, shares) in the left main, LAD and circumflex of 20
    people at rest, with blood pressure, septal thickness and age. This record's models are definitions on MCE
    and clinical measurements: the coronary blood content as a volume fraction, MVR and fold MBF (ratios between
    study states), heart rate reserve under dobutamine and its age adjustment, the pooled Total columns, counts
    and Pearson r. None gives a pressure, velocity or wave intensity, and davies2006 has no blood volume, no
    stimulated state and no peak heart rate, so no model here can be run on its conditions to give one of its
    measurements. pooled_table1 run on davies2006's LVH and non-LVH blood pressures would only repeat that record's
    own pooled_systolic and pooled_diastolic reproductions, not test a model. Resting coronary velocity in
    davies2006 is not CFR or HMR (both need adenosine hyperemia). Neither paper cites the other. The reverse
    direction is in davies2006's q_no_validation_vink2024.
- id: q_no_validation_kim2010
  kind: choice
  about: [q_no_corpus_mbv_model, blood_volume_fraction, mvr_by_state, fold_by_state, mbf_fold, heart_rate_reserve, pooled_table1]
  text: >-
    (Validation job kim2010+vink2024, 2026-11-11; kim2010 is in this record's relate_with.) No entry in
    validations.yaml, in either direction. kim2010's only measurements are Gould et al.'s canine coronary flows at
    rest and in hyperemia against LAD diameter reduction, as plotted in its Fig. 6 (scaled to its axis in an
    unstated way); everything else in kim2010 is output of a patient-specific 3D simulation of one healthy subject,
    not a measurement. This record's models are definitions on MCE and clinical measurements (a blood volume
    fraction from a blood content per mass, MVR and fold MBF as ratios between states, heart rate reserve, pooled
    group statistics, correlation coefficients); none gives a coronary volume flow as a function of stenosis
    severity, so none can be run on Gould's conditions. A ratio of Gould's hyperemic to resting flow would be
    arithmetic on two measurements, not a model's prediction of one. In the other direction no kim2010 model gives
    a blood volume, a flow per gram or a reserve ratio (see kim2010/q_no_validation_vs_vink2024). Neither paper
    cites the other.
- id: q_no_validation_svzerod_code
  kind: choice
  about: [q_no_corpus_mbv_model, blood_volume_fraction, mvr_by_state, fold_by_state, mbf_fold, heart_rate_reserve, pooled_table1]
  text: >-
    (Validation job svzerod_code+vink2024, 2026-11-11; svzerod_code is in this record's relate_with.) No entry in
    validations.yaml, in either direction. svzerod_code measures nothing (its data are solver settings, test-case
    values and stored runs, kim2010's and yong2025's printed parameters), so no model here can be judged against
    it. Its blocks give coronary bed flows (cm^3/s) from given resistances, capacitances and pressures, a
    microvascular resistance over the cycle, outlet pressures and an input impedance; none gives a blood volume
    per volume of myocardium, a flow per gram, or a Doppler-velocity CFR or HMR, and neither source states
    these patients' bed parameters or pressures, so no block can be run on this paper's conditions to give one
    of its measurements. The paper does not mention lumped models or the code. Details in
    svzerod_code/q_no_validation_vs_vink2024.
