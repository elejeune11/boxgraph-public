  text: >-
    No heart rates or ages are printed for the controls' dobutamine test (Table 2 covers patients only), so neither
    their heart rate reserve (67.1) nor their age-adjusted reserve (107.2) can be recomputed. For the patients the
    difference of the mean heart rates, 55.1, is close to but not the printed 54.8: likely the patients who did not
    complete the test enter one mean and not the other.
  citation: {page: 5, printed_page: "5", quote: "(54.8 BPM ± 21.6 vs. 67.1 BPM ± 11.9, respectively p = 0.018)", where: "3.5"}

- id: q_ratio_medians
  kind: reading
  about: [cmp_mvr_ins_a, cmp_mvr_ins_c, cmp_mvr_dob_a, cmp_mvr_dob_c, cmp_fold_ins_a, cmp_fold_ins_c, cmp_fold_dob_a, cmp_fold_dob_c]
  text: >-
    MVR and fold MBF are printed as medians of per-participant ratios; only group means of MBV and MBF are printed, so
    the record compares the ratio of the means (an approximation). For MVR the two differ by 0.5-3% (e.g. 1.018 vs
    0.992 for insulin in patients). For the controls' fold MBF they differ by about 10% (1.068 vs 0.972 with insulin,
    1.194 vs 1.077 with dobutamine): the controls' MBF ratios must be strongly skewed, or the MBF means include
    participants without a ratio. Not an error; the medians cannot be checked from what is printed.
  citation: {page: 11, printed_page: "S3", quote: "MBF, ratio baseline-dobutamine, 0.867 [0.524-1.121] 1.077 [0.855-1.517] 0.030", where: "Supplemental Table 3"}

- id: q_mbv_magnitude
  kind: unexplained_difference
  about: [cmp_mbv_from_content_ctrl, mbv_base_c_m, cbv_content, micro_share, myocardial_blood_volume, tissue_density_added]
  text: >-
    The paper defines MBV as "the total blood content within the microcirculation" and cites about 12 mL of blood
    per 100 g of myocardium, about 90% of it in the microcirculation. With a density of 1.05 g/mL (added; 1.0-1.06
    changes little) that is 0.11 mL/mL, while the MBV it reports is 0.39-0.48 mL/mL, four times more. The MCE MBV is
    an intensity ratio A/A_LV, called "relative myocardial blood volume" in 4; the unit mL/mL treats the LV cavity
    signal as 1 mL of blood per mL, which holds only if the intensity is linear in bubble concentration and the
    myocardial and cavity signals are attenuated alike. The paper does not discuss the gap. The cited 12 mL/100 g
    itself agrees with spaan1981's 10-15% (validations.yaml).
  citation: {page: 6, printed_page: "6", quote: "The coronary circulation contains about 12 mL of blood per 100 g of", where: "4.1"}

- id: q_mbf_formula
  kind: unstated_model
  about: [myocardial_blood_flow, s3_mbf_base_a_m, mbv_from_plateau]
  text: >-
    MBF is reported in mL/min/g (Supplemental Table 3; 3.4) but the paper gives no formula for it: 2.3 only says beta
    "represents the myocardial blood flow velocity (s^-1)" and cites Vogel et al. (ref. 5), whose MBF is rBV x beta /
    tissue density. The values (30-43 mL/min/g) are about thirty times usual human myocardial blood flow (about 1
    mL/min/g at rest), so they cannot be absolute flows in mL/min/g; with MBV ~0.4 they would need beta near 1.4/s
    and no conversion. Supplemental Fig. 5A labels the same quantity "MBF (dB/sec)", i.e. A x beta in acoustic units
    (see q_mbf_unit).
  citation: {page: 2, printed_page: "2", quote: "and β is the rate of signal intensity increase that represents the", where: "2.3"}

- id: q_mbf_unit
  kind: possible_error
  about: [myocardial_blood_flow, s3_mbf_base_a_m, s3_mbf_dob_a_m, txt_mbf_dob_a_m]
  text: >-
    MBF is printed in "ml/min/g" in Supplemental Table 3 and "mL/min/g" in 3.4, while the axis of Supplemental Fig.
    5A, which shows the same means (about 34, 36, 32, 39, 30, 43), reads "MBF (dB/sec)". The two units are not
    convertible. The values are recorded in mL/min/g as printed in the table and text.
  citation: {page: 11, printed_page: "S3", quote: "Myocardial Blood Flow (ml/min/g)", where: "Supplemental Table 3; Supplemental Fig. 5A"}

- id: q_mvalue_unit
  kind: possible_error
  about: [mval_a_med, mval_c_med, disc_mval_a, disc_mval_c]
