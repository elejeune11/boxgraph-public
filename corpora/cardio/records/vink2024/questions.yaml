- id: q_figure_labels
  kind: reading
  about: [s3_mbf_dob_a_m, mvr_ins_a_med, hrr_a_m]
  text: >-
    Small label slips, recorded for the reader: 4.2 cites "Supplemental Fig. 3A" and "3C" for MBF, which is in
    Supplemental Fig. 5 (Supplemental Fig. 3 is MBV per territory); Fig. 3's caption calls its third panel "D)";
    Supplemental Fig. 3's caption labels the circumflex panel "B)" (it is C); Supplemental Table 3's abbreviation
