  citation: {page: 5, printed_page: "5", quote: "healthy controls (36.8 mol/kg/min [32.2–44.3] vs 69.1 mol/kg/min", where: "3.5"}

- id: q_fig2b_legend
  kind: possible_error
  about: [txt_epi_n, t2_epi_tot_n]
  text: >-
