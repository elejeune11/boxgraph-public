  text: >-
    MBV is computed per ROI as the plateau A of y = A (1 - e^(-beta t)) over the plateau of the adjacent LV cavity,
    then averaged over all myocardial ROIs. No intensity curve, plateau or per-ROI MBV is printed, so none of the
    printed MBV values can be recomputed; the model is recorded but cannot be run.
  citation: {page: 3, printed_page: "3", quote: "MBV as the ratio of plateau signal intensity in the myocardium (A) to", where: "2.3"}

