- id: q_hrr_age_adjusted
  kind: unexplained_difference
  about: [hrr_age_adjusted, hrradj_a_med, cmp_hrradj_a_220, cmp_hrradj_a_085, hrmax_factor_added]
  text: >-
    The age-adjusted heart rate reserve is printed as a median of 100.0% [69.4–118.9] in patients. The formula of
    2.5 on Table 2's means (max 132.2, rest 77.1, age 56.8) gives 64% with the usual age-predicted maximum 220 - age,
    and 89% with the supplement's maximal heart rate 0.85 (220 - age). A median of 100% means half the patients
    reached at least their predicted maximum, while the mean peak heart rate (132.2) is 31 beats below 220 - age.
    A median of ratios need not equal the ratio of means, but not by this much. The formula as printed,
    "(maximum heart rate-resting heart rate/age predicted maximum heart rate-resting heart rate) x100", has no
    parentheses around the differences and does not say which age-predicted maximum was used.
  citation: {page: 3, printed_page: "3", quote: "age using the formula (maximum heart rate-resting heart rate/age", where: "2.5"}

- id: q_hrr_controls
  kind: unstated_input
