  purpose: consistency
  computed: mbv_from_content_pred
  printed: mbv_base_c_m
  conditions_ok: >-
    The paper defines MBV as 'the total blood content within the microcirculation' (p. 2) and cites about 12 mL per
    100 g with about 90% in the microcirculation (p. 6); the computed value is that statement as a volume fraction,
    set beside the resting MBV of the healthy controls. The cited value is for diastole (pig, ref. 21); MBV was
    read on end-systolic frames.

