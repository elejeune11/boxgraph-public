notes: >
  MICORDIS: a cross-sectional study of 28 ANOCA patients (22 women, 6 men; invasive coronary function testing)
  and 28 age- and sex-matched healthy controls. Myocardial blood volume (MBV) and blood flow (MBF) were measured by
  myocardial contrast echocardiography at rest, during a hyperinsulinemic-euglycemic clamp and during dobutamine
  stress. Pages 9-19 are the supplement.
  The paper's quantitative core is clinical arithmetic, not a physiological model. Its one measurement model, the
  MCE replenishment fit y = A (1 - e^(-beta t)) with MBV = A/A_LV (Vogel), is recorded but cannot be run: no
  intensities are printed. It gives no formula for MBF. The runnable models are the stated definitions and the
  arithmetic behind printed numbers: MVR = MBV(stimulus)/MBV(baseline), fold MBF, heart rate reserve and its age
  adjustment, count percentages, the Total columns of Tables 1-2 (pooled mean and SD, summed counts), the missing
  shares of MBV values, and the Discussion's coronary blood content as a volume fraction.
  Results: nearly all of the 150-odd percentages and count sums of Tables 1-2, the text and the abstract
  reproduce, as do the pooled Total means and SDs (except thrombocytes), and the text against Supplemental
  Table 3, the abstract and the Discussion. Findings: Table 2's chest discomfort "23 (39.3)" (23/28 = 82.1%); ROI
  exclusion percentages (4.65%, 4.94%) that fit no printed denominator; "missing" shares computed over values
  obtained, not over participants; Table 1's thrombocyte total and total-cholesterol median (4.1 below its own
  IQR and below both group medians); EF SD 5.6 vs 5.5 for the same patients; an age-adjusted heart rate reserve
  median of 100% where the group means give 64% (220 - age) or 89% (0.85 (220 - age)); 16 patients with
  vasomotor dysfunction where the categories give 17. Unit slips: M-value in mol/kg/min (μmol elsewhere), MBF in
  mL/min/g in the table but dB/sec on Suppl. Fig. 5, with values about thirty times physiological flow. MBV
  itself (0.39-0.48 mL/mL) is four times what the paper's own statements imply (about 12 mL/100 g, 90%
  microvascular, about 0.11 mL/mL); the cited 12 mL/100 g agrees with spaan1981's 10-15% (validations.yaml).
  MVR and fold MBF are printed as medians of per-person ratios and are compared, as approximations, with ratios
  of group means.
  Batch 10: no corpus model predicts MCE MBV under matching conditions (q_no_corpus_mbv_model). The paper has no
  capillary morphometry and gives no MBV, MBF or MVR by sex. CFR (2.87 ± 0.57), HMR (median 1.70), the vasospasm
  and CMD counts and the sex breakdown are recorded.
  Left out, since they feed no model: p values (except where two printed p values disagree; questions only),
  the medians and IQRs of Table 1's laboratory values other than total cholesterol, eGFR, estradiol, the ICC,
  echo and dosing settings (MI, frame rate, infusion rates, acetylcholine and adenosine doses) and the inclusion
  criteria. Figures were not digitized: rendering was refused in this job (figures.md lists what each holds).
  Fig. 2B, Suppl. Fig. 3 (MBV per territory) and Suppl. Fig. 6 hold values printed nowhere else and should be
  read in a later pass. Printed decimal commas ("36,4", "16,7", "0,85") and the thousands point in "10.033" are
  recorded in ASCII form with a note on the datum.
  Figure pass (2026-11-11): every plotted panel with values is now read by calibrated code (figures.yaml,
  figures.md, 38 readings); the earlier sentence that figures were not digitized is superseded. Bar charts (Figs.
  2A-B, 3A-C; Suppl. Figs. 3, 5, 6) are recorded as tables over the study state (study_state_index) with their SD
  bars. Figs. 2A, 3C and Suppl. Fig. 5A agree with the printed means and SDs within the reading
  (q_fig_vs_text_precision). New data: MBV by CFT entity and by coronary territory, M-value by entity, the plotted
  means of MVR, M-value and fold MBF. Scatters: the printed r of Suppl. Fig. 4 and R2 of Suppl. Fig. 2 are
  reproduced from the read points. Suppl. Fig. 2's "perfect agreement" line is the least-squares fit
  (q_sfig2_line). Suppl. Figs. 7-8 are read only in part (q_scatter_fused). Findings: q_fig2b_entities,
  q_territory_weights, q_fig3_means. New models: mvr_by_state, fold_by_state, territory_mean, the r models, and
  identity_line and ols_line. No existing value, model or question was changed.
