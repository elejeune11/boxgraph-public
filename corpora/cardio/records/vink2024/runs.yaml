# Table 1 Total column from the ANOCA and control columns (mean, SD)
- id: run_pool_t1
  model: pooled_table1
  inputs: {n1: t1_n_anoca, n2: t1_n_ctrl,
           age_m1: t1_age_a_m, age_s1: t1_age_a_s, age_m2: t1_age_c_m, age_s2: t1_age_c_s,
           bmi_m1: t1_bmi_a_m, bmi_s1: t1_bmi_a_s, bmi_m2: t1_bmi_c_m, bmi_s2: t1_bmi_c_s,
           ef_m1: t1_ef_a_m, ef_s1: t1_ef_a_s, ef_m2: t1_ef_c_m, ef_s2: t1_ef_c_s,
           hb_m1: t1_hb_a_m, hb_s1: t1_hb_a_s, hb_m2: t1_hb_c_m, hb_s2: t1_hb_c_s,
           creat_m1: t1_creat_a_m, creat_s1: t1_creat_a_s, creat_m2: t1_creat_c_m, creat_s2: t1_creat_c_s,
           plt_m1: t1_plt_a_m, plt_s1: t1_plt_a_s, plt_m2: t1_plt_c_m, plt_s2: t1_plt_c_s,
           ldl_m1: t1_ldl_a_m, ldl_s1: t1_ldl_a_s, ldl_m2: t1_ldl_c_m, ldl_s2: t1_ldl_c_s}
  outputs: {age_m: t1_age_tot_m_pred, age_s: t1_age_tot_s_pred, bmi_m: t1_bmi_tot_m_pred, bmi_s: t1_bmi_tot_s_pred,
            ef_m: t1_ef_tot_m_pred, ef_s: t1_ef_tot_s_pred, hb_m: t1_hb_tot_m_pred, hb_s: t1_hb_tot_s_pred,
            creat_m: t1_creat_tot_m_pred, creat_s: t1_creat_tot_s_pred, plt_m: t1_plt_tot_m_pred, plt_s: t1_plt_tot_s_pred,
            ldl_m: t1_ldl_tot_m_pred, ldl_s: t1_ldl_tot_s_pred}
# Table 2 Total column from the women and men columns (mean, SD)
- id: run_pool_t2
  model: pooled_table2
  inputs: {n1: t2_n_women, n2: t2_n_men,
           age_m1: t2_age_w_m, age_s1: t2_age_w_s, age_m2: t2_age_m_m, age_s2: t2_age_m_s,
           bmi_m1: t2_bmi_w_m, bmi_s1: t2_bmi_w_s, bmi_m2: t2_bmi_m_m, bmi_s2: t2_bmi_m_s,
           ef_m1: t2_ef_w_m, ef_s1: t2_ef_w_s, ef_m2: t2_ef_m_m, ef_s2: t2_ef_m_s,
           cfr_m1: t2_cfr_w_m, cfr_s1: t2_cfr_w_s, cfr_m2: t2_cfr_m_m, cfr_s2: t2_cfr_m_s,
           hr0_m1: t2_hr0_w_m, hr0_s1: t2_hr0_w_s, hr0_m2: t2_hr0_m_m, hr0_s2: t2_hr0_m_s,
           hrmax_m1: t2_hrmax_w_m, hrmax_s1: t2_hrmax_w_s, hrmax_m2: t2_hrmax_m_m, hrmax_s2: t2_hrmax_m_s}
  outputs: {age_m: t2_age_tot_m_pred, age_s: t2_age_tot_s_pred, bmi_m: t2_bmi_tot_m_pred, bmi_s: t2_bmi_tot_s_pred,
            ef_m: t2_ef_tot_m_pred, ef_s: t2_ef_tot_s_pred, cfr_m: t2_cfr_tot_m_pred, cfr_s: t2_cfr_tot_s_pred,
            hr0_m: t2_hr0_tot_m_pred, hr0_s: t2_hr0_tot_s_pred, hrmax_m: t2_hrmax_tot_m_pred, hrmax_s: t2_hrmax_tot_s_pred}

# Percentages in the text (3.1) and the abstract, from the text's counts and the 28 patients
- {id: run_txt_men_pct, model: percent_of_group, inputs: {k: txt_men_n, n: t1_n_anoca}, outputs: {pct: txt_men_pct_pred}}
- {id: run_txt_epi_pct, model: percent_of_group, inputs: {k: txt_epi_n, n: t1_n_anoca}, outputs: {pct: txt_epi_pct_pred}}
- {id: run_txt_mvs_pct, model: percent_of_group, inputs: {k: txt_mvs_n, n: t1_n_anoca}, outputs: {pct: txt_mvs_pct_pred}}
- {id: run_txt_incon_pct, model: percent_of_group, inputs: {k: txt_incon_n, n: t1_n_anoca}, outputs: {pct: txt_incon_pct_pred}}
- {id: run_txt_cmd_pct, model: percent_of_group, inputs: {k: txt_cmd_n, n: t1_n_anoca}, outputs: {pct: txt_cmd_pct_pred}}
- {id: run_txt_neg_pct, model: percent_of_group, inputs: {k: txt_neg_n, n: t1_n_anoca}, outputs: {pct: txt_neg_pct_pred}}
- {id: run_txt_both_pct, model: percent_of_group, inputs: {k: txt_both_n, n: t1_n_anoca}, outputs: {pct: txt_both_pct_pred}}
# CFT categories of 3.3 add up to the 28 patients
- {id: run_cft_sum, model: count_sum3, inputs: {a: txt_dysfunction_n, b: txt_equivocal_n, c: txt_normal_n}, outputs: {total: cft_sum_pred}}

# MCE data yield (3.2)
- {id: run_roi_excl_a_pct, model: percent_of_group, inputs: {k: roi_excl_a_n, n: roi_total}, outputs: {pct: roi_excl_a_pct_pred}, note: "the only ROI total printed is the 10.033 of both groups"}
- {id: run_roi_excl_c_pct, model: percent_of_group, inputs: {k: roi_excl_c_n, n: roi_total}, outputs: {pct: roi_excl_c_pct_pred}, note: "the only ROI total printed is the 10.033 of both groups"}
- {id: run_mbv_count_sum, model: count_sum3, inputs: {a: mbv_n_base, b: mbv_n_ins, c: mbv_n_dob}, outputs: {total: mbv_n_total_pred}}
- {id: run_miss_base, model: missing_percent, inputs: {N: t1_n_tot, n: mbv_n_base}, outputs: {of_total: miss_base_of_total, of_obtained: miss_base_of_obtained}}
- {id: run_miss_ins, model: missing_percent, inputs: {N: t1_n_tot, n: mbv_n_ins}, outputs: {of_total: miss_ins_of_total, of_obtained: miss_ins_of_obtained}}
- {id: run_miss_dob, model: missing_percent, inputs: {N: t1_n_tot, n: mbv_n_dob}, outputs: {of_total: miss_dob_of_total, of_obtained: miss_dob_of_obtained}}

# Microvascular recruitment from the group mean MBVs (2.4, 2.5)
- {id: run_mvr_ins_a, model: mvr_ratio, inputs: {MBVx: mbv_ins_a_m, MBV0: mbv_base_a_m}, outputs: {MVR: mvr_ins_a_from_means}}
- {id: run_mvr_ins_c, model: mvr_ratio, inputs: {MBVx: mbv_ins_c_m, MBV0: mbv_base_c_m}, outputs: {MVR: mvr_ins_c_from_means}}
- {id: run_mvr_dob_a, model: mvr_ratio, inputs: {MBVx: mbv_dob_a_m, MBV0: mbv_base_a_m}, outputs: {MVR: mvr_dob_a_from_means}}
- {id: run_mvr_dob_c, model: mvr_ratio, inputs: {MBVx: mbv_dob_c_m, MBV0: mbv_base_c_m}, outputs: {MVR: mvr_dob_c_from_means}}
# Fold MBF from the group mean MBFs (Supplemental Table 3)
- {id: run_fold_ins_a, model: mbf_fold, inputs: {MBFx: s3_mbf_ins_a_m, MBF0: s3_mbf_base_a_m}, outputs: {fold: fold_ins_a_from_means}}
- {id: run_fold_ins_c, model: mbf_fold, inputs: {MBFx: s3_mbf_ins_c_m, MBF0: s3_mbf_base_c_m}, outputs: {fold: fold_ins_c_from_means}}
- {id: run_fold_dob_a, model: mbf_fold, inputs: {MBFx: s3_mbf_dob_a_m, MBF0: s3_mbf_base_a_m}, outputs: {fold: fold_dob_a_from_means}}
- {id: run_fold_dob_c, model: mbf_fold, inputs: {MBFx: s3_mbf_dob_c_m, MBF0: s3_mbf_base_c_m}, outputs: {fold: fold_dob_c_from_means}}

# Heart rate reserve from the Table 2 heart rates (ANOCA; no heart rates of the controls are printed)
- {id: run_hrr_a, model: heart_rate_reserve, inputs: {HRmax: t2_hrmax_tot_m, HRrest: t2_hr0_tot_m}, outputs: {HRR: hrr_a_from_means}}
- {id: run_hrradj_a_220, model: hrr_age_adjusted, inputs: {HRmax: t2_hrmax_tot_m, HRrest: t2_hr0_tot_m, age: t2_age_tot_m, f: hrmax_factor_added}, outputs: {HRRadj: hrradj_a_220_from_means}}
- {id: run_hrradj_a_085, model: hrr_age_adjusted, inputs: {HRmax: t2_hrmax_tot_m, HRrest: t2_hr0_tot_m, age: t2_age_tot_m, f: target_hr_factor}, outputs: {HRRadj: hrradj_a_085_from_means}}

# Microvascular blood volume per myocardial volume implied by the Discussion's 12 mL/100 g and 90 %
- {id: run_cbv, model: blood_volume_fraction, inputs: {c: cbv_content, s: micro_share, rho: tissue_density_added}, outputs: {phi: cbv_fraction_pred, phi_micro: mbv_from_content_pred}}

