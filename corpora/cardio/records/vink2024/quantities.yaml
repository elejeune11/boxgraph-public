# Conditions
- {id: group, name: study group, dimension: dimensionless, description: "used as a condition: ANOCA (patients), control (healthy controls), total (both), ANOCA women, ANOCA men"}

- {id: study_state_index, name: "study state of a measurement, as an index", dimension: dimensionless, description: "the x of every figure reading: 1 baseline (rest), 2 hyperinsulinemia (HE clamp), 3 dobutamine-induced stress (figure pass)"}
- {id: coronary_territory, name: coronary territory of the ROIs, dimension: dimensionless, description: "used as a condition: LAD, RCA or CX (Suppl. Figs. 1 and 3)"}

# Counts and shares
- {id: count, name: "number of participants, regions of interest or measurements", dimension: dimensionless, description: "a count: of participants in a group or category, of ROIs, or of MBV values obtained"}
- {id: percent_of_group, name: share of a group falling in a category, dimension: dimensionless, description: "printed as the percentage in 'count (%)'"}
- {id: missing_percent, name: share of the intended measurements that is missing, dimension: dimensionless}

# Baseline characteristics (Tables 1 and 2), as group means
- {id: age, name: age of the participants, dimension: "[time]"}
- {id: body_mass_index, name: body mass index, dimension: "[mass]/[length]**2"}
- {id: ejection_fraction, name: left ventricular ejection fraction, dimension: dimensionless}
- {id: hemoglobin_concentration, name: blood hemoglobin concentration, dimension: "[substance]/[length]**3"}
- {id: creatinine_concentration, name: serum creatinine concentration, dimension: "[substance]/[length]**3"}
- {id: platelet_count, name: blood thrombocyte count per volume, dimension: "1/[length]**3"}
- {id: ldl_cholesterol, name: LDL-cholesterol concentration, dimension: "[substance]/[length]**3"}
- {id: total_cholesterol, name: total cholesterol concentration, dimension: "[substance]/[length]**3"}
- {id: coronary_flow_reserve, name: "coronary flow reserve (hyperemic over resting Doppler flow velocity, LAD)", dimension: dimensionless}
- {id: hyperemic_microvascular_resistance, name: "hyperemic microvascular resistance index (HMR): distal pressure over Doppler flow velocity during adenosine hyperemia", dimension: "[pressure]*[time]/[length]"}
- {id: heart_rate, name: heart rate, dimension: "1/[time]"}
- {id: heart_rate_reserve, name: "heart rate reserve: peak minus resting heart rate during dobutamine stress", dimension: "1/[time]"}
- {id: heart_rate_reserve_age_adjusted, name: "heart rate reserve as a percentage of the age-predicted reserve, (max HR - rest HR)/(age-predicted max HR - rest HR) x 100", dimension: dimensionless}
- {id: max_heart_rate_factor, name: factor applied to 220 - age to give the maximal heart rate, dimension: dimensionless}

# Myocardial contrast echocardiography
- id: myocardial_blood_volume
  name: myocardial (microvascular) blood volume per volume of myocardium
  dimension: dimensionless
  description: >-
    The paper's MBV, printed in mL/mL: by MCE, the plateau intensity A of the myocardial replenishment curve over
    the plateau intensity of the adjacent LV cavity (A/A_LV, Vogel et al.), averaged over all myocardial ROIs, on
    end-systolic frames. Also used for a blood volume per myocardial volume computed from a blood content per mass.
- {id: microvascular_recruitment, name: "microvascular recruitment, MBV in a stimulated state over MBV at baseline", dimension: dimensionless}
- {id: myocardial_blood_flow, name: myocardial blood flow by MCE, dimension: "[length]**3/[mass]/[time]", description: "printed in ml/min/g (Supplemental Table 3); the supplement's Fig. 5 axis reads dB/sec"}
- {id: mbf_fold_change, name: "MBF in a stimulated state over MBF at baseline (fold MBF)", dimension: dimensionless}
- {id: insulin_sensitivity, name: "insulin sensitivity, M-value: glucose infusion rate in the last 30 min of the clamp per body weight", dimension: "[substance]/[mass]/[time]"}

# Coronary blood content (Discussion)
- {id: coronary_blood_content, name: blood volume of the coronary circulation per mass of myocardium, dimension: "[length]**3/[mass]"}
- {id: microcirculation_blood_share, name: share of the myocardial blood volume held in the microcirculation, dimension: dimensionless}
- {id: myocardial_tissue_density, name: density of myocardium, dimension: "[mass]/[length]**3"}
- {id: myocardial_blood_volume_fraction, name: coronary (all vessels) blood volume per volume of myocardium, dimension: dimensionless}

# Cited in the Discussion (added in the audit)
- {id: perfused_capillary_fraction, name: share of myocardial capillaries perfused with blood at a given moment, dimension: dimensionless}
- {id: oxygen_extraction_fraction, name: "myocardial oxygen extraction (arteriovenous O2 difference over arterial O2 content)", dimension: dimensionless}

# ---- per-participant scatter plots (figure pass, 2026-11-11) ----
- {id: correlation_hmr_mbv, name: "Pearson r of baseline MBV against HMR (ANOCA patients)", dimension: dimensionless}
- {id: correlation_mvalue_mvr, name: "Pearson r of insulin-induced MVR against the M-value (patients and controls)", dimension: dimensionless}
- {id: correlation_mvalue_fold, name: "Pearson r of fold MBF during hyperinsulinemia against the M-value (patients and controls)", dimension: dimensionless}
- {id: correlation_hrr_mvr, name: "Pearson r of contraction-induced MVR against heart rate reserve (patients and controls)", dimension: dimensionless}
- {id: correlation_hrr_fold, name: "Pearson r of fold MBF during dobutamine stress against heart rate reserve (patients and controls)", dimension: dimensionless}
- {id: r2_interobserver_mbv, name: "R2 of the linear fit of observer-1 on observer-2 baseline MBV", dimension: dimensionless}
