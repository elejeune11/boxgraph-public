- id: run_systemic_code_values
  model: systemic_left_heart
  inputs:
    ElaMax: ElaMax_code
    ElaMin: ElaMin_code
    PlaIni: PlaIni_code
    VlaIni: VlaIni_code
    ElvMax: ElvMax_code
    ElvMin: ElvMin_code
    PlvIni: PlvIni_code
    VlvIni: VlvIni_code
    T: T_code
    Tpwb: Tpwb_code
    Tpww: Tpww_code
    Ts1: Ts1_code
    Ts2: Ts2_code
    CVao: CVao_code
    CVmi: CVmi_code
    Vlv0: Vlv0_code
    Vla0: Vla0_code
    Rsas: Rsas_code
    Csas: Csas_code
    Lsas: Lsas_code
    P0sas: P0sas_code
    Q0sas: Q0sas_code
    Rsat: Rsat_code
    Csat: Csat_code
    Lsat: Lsat_code
    P0sat: P0sat_code
    Q0sat: Q0sat_code
    Rsar: Rsar_code
    Rscp: Rscp_code
    Rsvn: Rsvn_code
    Csvn: Csvn_code
    P0svn: P0svn_code
    pi: pi_code_ventricle
  settings: {dt: 0.0001, t_end: 10.0}
  outputs:
    P_lv_max: sys_plv_max
    P_lv_min: sys_plv_min
    P_sas_max: sys_psas_max
    P_sas_min: sys_psas_min
    P_sat_max: sys_psat_max
    P_sat_min: sys_psat_min
    V_lv_max: sys_vlv_max
    V_lv_min: sys_vlv_min
    SV: sys_sv
    Q_ao_mean: sys_qao_mean
    Q_mi_mean: sys_qmi_mean
    Q_ao_peak: sys_qao_peak
    Q_mi_peak: sys_qmi_peak
  note: >
    All inputs as written in the code. Solver settings are ours (the CellML holds none): classical
    RK4, dt = 0.1 ms, 10 s simulated from the code's initial values, results over the 10th beat
    (see q_solver and refinements.yaml).
