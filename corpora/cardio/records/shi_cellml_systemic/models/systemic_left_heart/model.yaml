id: systemic_left_heart
name: left atrium and ventricle (variable elastance, on-off valves) with a five-segment systemic loop (sinus, artery, arteriole, capillary, vein), ported from the CellML
role: model
stated: {file: MainSystemic.cellml, lines: "28", quote: "The systemic loop is sub-divided into a number of segments"}
equation: >
  LA, LV (TempCDa, TempCDv): dV/dt = Qi - Qo; Pi = Pini + E (V - Vini); Tao = 1 if Pi >= Po else 0;
  Qo = CV Tao |Pi - Po|^0.5 (Pi >= Po), -CV Tao |Po - Pi|^0.5 (Pi < Po).
  Ventricle (EVentricle): mt = t - T floor(t/T); et = 1 - cos(3.14159 mt/(Ts1 T)) (0 <= mt <= Ts1 T),
  1 + cos(3.14159 (mt - Ts1 T)/((Ts2 - Ts1) T)) (Ts1 T < mt <= Ts2 T), 0 (Ts2 T < mt < T); E = Emin + et (Emax - Emin)/2.
  Atrium (EAtrium): et = 1 - cos(2 3.14159 (mt - (Tpwb - 1) T)/(Tpww T)) (0 <= mt <= (Tpwb + Tpww - 1) T),
  0 ((Tpwb + Tpww - 1) T < mt <= Tpwb T), 1 - cos(2 3.14159 (mt - Tpwb T)/(Tpww T)) (Tpwb T < mt <= T); E = Emin + et (Emax - Emin)/2.
  Sas, Sat (TempRLC): dPi/dt = (Qi - Qo)/C; dQo/dt = (Pi - Po - R Qo)/L.
  Sar, Scp (TempR): Pi = Po + R Qi; Qo = Qi.
  Svn (TempRC): dPi/dt = (Qi - Qo)/C; Qo = (Pi - Po)/R.
  Connections: LA.Po = LV.Pi, LA.Qo = LV.Qi; LV.Po = Sas.Pi, LV.Qo = Sas.Qi; Sas -> Sat -> Sar -> Scp -> Svn (Po = next Pi,
  Qo = next Qi); Svn.Po = LA.Pi, Svn.Qo = LA.Qi.
# Notes (the schema has no notes field): model.py ports MainSystemic.cellml (connections, lines
# 65-81), ModelLeftHeart.cellml (lines 51-123), ModelSys.cellml (lines 50-130), TempCDa.cellml
# (lines 46-55), TempCDv.cellml (lines 46-54), EAtrium.cellml (lines 19-24), EVentricle.cellml
# (line 20), TempRLC.cellml (line 25), TempR.cellml (line 19) and TempRC.cellml (line 22). The two
# resistors Sar and Scp are algebraic and carry the artery flow Qsat, so Sat.Po = Psvn +
# (Rsar + Rscp) Qsat. Seven state variables: Vla, Vlv, Psas, Qsas, Psat, Qsat, Psvn. The
# integrator (RK4 at fixed dt) is ours (q_solver). The port is our code, not the source's.
inputs:
  ElaMax: {quantity: chamber_elastance, unit: mmHg/mL}
  ElaMin: {quantity: chamber_elastance, unit: mmHg/mL}
  PlaIni: {quantity: chamber_reference_pressure, unit: mmHg}
  VlaIni: {quantity: chamber_reference_volume, unit: mL}
  ElvMax: {quantity: chamber_elastance, unit: mmHg/mL}
  ElvMin: {quantity: chamber_elastance, unit: mmHg/mL}
  PlvIni: {quantity: chamber_reference_pressure, unit: mmHg}
  VlvIni: {quantity: chamber_reference_volume, unit: mL}
  T: {quantity: heart_period, unit: s}
  Tpwb: {quantity: p_wave_onset_fraction, unit: dimensionless}
  Tpww: {quantity: p_wave_duration_fraction, unit: dimensionless}
  Ts1: {quantity: peak_systole_fraction, unit: dimensionless}
  Ts2: {quantity: end_systole_fraction, unit: dimensionless}
  CVao: {quantity: valve_flow_coefficient, unit: mL/(s*mmHg^0.5)}
  CVmi: {quantity: valve_flow_coefficient, unit: mL/(s*mmHg^0.5)}
  Vlv0: {quantity: initial_chamber_volume, unit: mL}
  Vla0: {quantity: initial_chamber_volume, unit: mL}
  Rsas: {quantity: vascular_resistance, unit: mmHg*s/mL}
  Csas: {quantity: vascular_compliance, unit: mL/mmHg}
  Lsas: {quantity: vascular_inertance, unit: mmHg*s^2/mL}
  P0sas: {quantity: initial_vessel_pressure, unit: mmHg}
  Q0sas: {quantity: initial_vessel_flow, unit: mL/s}
  Rsat: {quantity: vascular_resistance, unit: mmHg*s/mL}
  Csat: {quantity: vascular_compliance, unit: mL/mmHg}
  Lsat: {quantity: vascular_inertance, unit: mmHg*s^2/mL}
  P0sat: {quantity: initial_vessel_pressure, unit: mmHg}
  Q0sat: {quantity: initial_vessel_flow, unit: mL/s}
  Rsar: {quantity: vascular_resistance, unit: mmHg*s/mL}
  Rscp: {quantity: vascular_resistance, unit: mmHg*s/mL}
  Rsvn: {quantity: vascular_resistance, unit: mmHg*s/mL}
  Csvn: {quantity: vascular_compliance, unit: mL/mmHg}
  P0svn: {quantity: initial_vessel_pressure, unit: mmHg}
  pi: {quantity: pi_constant, unit: dimensionless}
outputs:
  P_lv_max: {quantity: peak_lv_pressure, unit: mmHg}
  P_lv_min: {quantity: min_lv_pressure, unit: mmHg}
  P_sas_max: {quantity: peak_aortic_pressure, unit: mmHg, description: "maximum aortic sinus pressure (Sas.Pi)"}
  P_sas_min: {quantity: min_aortic_pressure, unit: mmHg, description: "minimum aortic sinus pressure (Sas.Pi)"}
  P_sat_max: {quantity: peak_arterial_pressure, unit: mmHg, description: "maximum systemic artery pressure (Sat.Pi)"}
  P_sat_min: {quantity: min_arterial_pressure, unit: mmHg, description: "minimum systemic artery pressure (Sat.Pi)"}
  V_lv_max: {quantity: max_lv_volume, unit: mL}
  V_lv_min: {quantity: min_lv_volume, unit: mL}
  SV: {quantity: stroke_volume, unit: mL}
  Q_ao_mean: {quantity: mean_valve_flow, unit: L/min}
  Q_mi_mean: {quantity: mean_valve_flow, unit: L/min}
  Q_ao_peak: {quantity: peak_aortic_flow, unit: mL/s}
  Q_mi_peak: {quantity: peak_mitral_flow, unit: mL/s}
settings:
  dt: 0.0001     # added: the CellML files hold no solver settings (q_solver)
  t_end: 10.0    # added: simulated time; results over the last period [t_end - T, t_end]
stochastic: false
