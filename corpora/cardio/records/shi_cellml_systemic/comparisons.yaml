- {id: cmp_part_min_shi, purpose: approximation, computed: sys_psat_min, printed: arterial_pressure_min_shi2018, conditions_ok: "Fig. 1(c) reduction of the Fig. 1(d) model; the systemic artery pressure P_sat stands for the arterial pressure (q_arterial_pressure)"}
