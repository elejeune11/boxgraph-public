# Neither paper prints a result of this model. The code is shi2018's Fig. 1(c) model (left heart and
# the systemic loop, venous return straight to the left atrium); shi2018 prints results only for its
# Fig. 1(d) model, and korakianitis2006 for its full circulation (both loops, both hearts). The same
# heart and systemic parameters are used in all three, so these comparisons judge how closely the
# code, run as released, approximates the printed full-circulation results (purpose approximation).

# --- against shi2018 Section 3 (Fig. 1(d) model, CellML in OpenCell)
- {id: cmp_plv_max_shi, purpose: approximation, computed: sys_plv_max, printed: lv_pressure_max_shi2018, conditions_ok: "Fig. 1(c) reduction of the Fig. 1(d) model: same heart and systemic parameters, no pulmonary loop"}
- {id: cmp_plv_min_shi, purpose: approximation, computed: sys_plv_min, printed: lv_pressure_min_shi2018, conditions_ok: "Fig. 1(c) reduction of the Fig. 1(d) model: same heart and systemic parameters, no pulmonary loop"}
