- {id: ref_dt_plv, run: run_systemic_code_values, setting: dt, factors: [1, 2, 4], mode: divide, output: P_lv_max,
   tolerance: "0.1%", tolerance_basis: "added: well below the printed precision (0.1 mmHg) of the values compared", tolerance_added: true}
- {id: ref_dt_qao, run: run_systemic_code_values, setting: dt, factors: [1, 2, 4], mode: divide, output: Q_ao_peak,
   tolerance: "0.1%", tolerance_basis: "added: well below the printed precision (0.1 mL/s) of the values compared", tolerance_added: true}
- {id: ref_dt_sv, run: run_systemic_code_values, setting: dt, factors: [1, 2, 4], mode: divide, output: SV,
   tolerance: "0.1%", tolerance_basis: "added: well below the printed precision (whole mL) of the values compared", tolerance_added: true}
- {id: ref_tend_sv, run: run_systemic_code_values, setting: t_end, factors: [1, 2], mode: multiply, output: SV,
   tolerance: "0.1%", tolerance_basis: "added: checks the 10th beat is already periodic", tolerance_added: true}
- {id: ref_tend_psas, run: run_systemic_code_values, setting: t_end, factors: [1, 2], mode: multiply, output: P_sas_min,
   tolerance: "0.1%", tolerance_basis: "added: checks the 10th beat is already periodic", tolerance_added: true}
