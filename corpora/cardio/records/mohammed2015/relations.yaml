# mapping: b's input symbol -> expression in a's input symbols, numbers in each model's port units
- id: rel_density_reduction_rakusan1992
  kind: same_as
  a: mohammed2015/relative_reduction
  b: rakusan1992/rel_change_capillary_density
  mapping: {ref: "a", val: "b"}
  output_map: {decrease: r}
  regime: {a: [500, 4000], b: [300, 4000]}
  provenance: proposed
  reason: >
    Both papers report a loss of vessel density as a percentage of the reference group's value,
    100 (reference - group)/reference: mohammed2015's '27% reduction in median MVD' (control median as
    reference) and rakusan1992's 'decrease (%)' of mean capillary density from its reference group.
    The relation says only that the two percentages are defined alike, so they may be set side by side;
    it does not say that MVD (all microvessels, autopsy, median) and rakusan1992's capillary density
    (mean, transverse section) are the same quantity. A plain ratio, so it joins no family.
