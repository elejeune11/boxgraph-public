id: r2_group_pehw
name: R2 of a one-predictor least-squares regression from its coefficient and standard error (percent expected heart weight on group)
role: processing
stated: {page: 3, printed_page: "552", where: "Statistical Analysis; Table 3 (p. 5)", quote: "for categorical variables as appropriate. We used least-squares linear"}
equation: "R2 = t^2 / (t^2 + n - 2), t = b / SE (the standard identity for ordinary least squares with one predictor; not printed in the paper)"
from_words: true
inputs:
  b:  {quantity: pehw_group_coefficient, unit: percent, description: "Table 3 regression coefficient of Group (HFpEF)"}
  se: {quantity: pehw_group_coefficient, unit: percent, description: "its printed standard error"}
  n:  {quantity: patient_count, unit: dimensionless, description: "subjects in the regression"}
outputs:
  r2: {quantity: variance_explained, unit: dimensionless}
settings: {}
stochastic: false
