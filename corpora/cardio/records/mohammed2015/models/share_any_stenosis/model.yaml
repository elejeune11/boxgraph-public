id: share_any_stenosis
name: share of patients with at least one vessel with > 50% stenosis, from the Fig. 1D distribution
role: processing
stated: {page: 1, printed_page: "550", where: abstract, quote: "more severe CAD (65% with ≥1 vessel with >50% diameter stenosis in HFpEF versus 13% in"}
equation: "s = 100 x sum of the bars at >= 1 vessel / sum of all bars"
from_words: true
inputs:
  P: {quantity: patient_percentage, unit: percent, curve: {quantity: stenosed_vessel_count, unit: dimensionless}}
outputs:
  s: {quantity: patient_percentage, unit: percent}
settings: {}
stochastic: false
