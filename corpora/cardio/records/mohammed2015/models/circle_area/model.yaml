id: circle_area
name: area of a circular vessel profile from its luminal diameter (size classes)
role: model
stated: {page: 3, printed_page: "552", where: text, quote: "assumed a circular shape excluding longitudinally cut microvessels"}
equation: "area = pi d^2 / 4 (the paper states the circular shape and pairs the areas 78.5 and 314 um2 with the diameters 10 and 20 um; it prints no formula)"
from_words: true
inputs:
  d: {quantity: vessel_luminal_diameter, unit: um}
outputs:
  A: {quantity: vessel_profile_area, unit: um^2}
settings: {}
stochastic: false
