equation: "p = 100 k / n (implied wherever the paper prints 'k (p%)' or 'p% of n')"
from_words: true
inputs:
  k: {quantity: patient_count, unit: dimensionless}
  n: {quantity: patient_count, unit: dimensionless}
outputs:
  p: {quantity: patient_percentage, unit: percent}
settings: {}
stochastic: false
