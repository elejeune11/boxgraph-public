id: hist_median_pehw
name: median of percent expected heart weight from its frequency distribution (histogram)
role: processing
stated: {page: 3, printed_page: "552", where: text, quote: "Variables are summarized as median (25th–75th percentiles) or %"}
equation: "median = lower edge of the bin holding the 50th percentile + (50 - % below it) / (% in it) x bin width (bars normalised to their total)"
from_words: true
inputs:
  P: {quantity: patient_percentage, unit: percent, curve: {quantity: percent_expected_heart_weight, unit: percent}}
  f: {quantity: bin_label_position, unit: dimensionless}
outputs:
  m: {quantity: percent_expected_heart_weight, unit: percent}
settings: {}
stochastic: false
