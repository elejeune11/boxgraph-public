id: vessel_share
name: microvessels as a share of all detected vessel profiles
role: processing
stated: {page: 12, printed_page: "S1", where: text, quote: "Total vascular density (97% vessels < 314 um) defined using exclusion of"}
equation: "share = MVD (10-314 um2) / total vessel density (all >= 10 um2) x 100%"
from_words: true
inputs:
  mvd: {quantity: microvascular_density, unit: 1/mm^2}
  total: {quantity: total_vessel_density, unit: 1/mm^2}
outputs:
  s: {quantity: vessel_share, unit: percent}
settings: {}
stochastic: false
