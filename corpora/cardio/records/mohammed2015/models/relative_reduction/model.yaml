id: relative_reduction
name: relative reduction of the HFpEF median against the control median
role: processing
stated: {page: 4, printed_page: "553", where: text, quote: "reduction in median MVD) and within each myocardial region"}
equation: "reduction = (MVD_control - MVD_HFpEF) / MVD_control x 100% (stated in words: '27% reduction in median MVD')"
from_words: true
inputs:
  a: {quantity: microvascular_density, unit: 1/mm^2, description: control median}
  b: {quantity: microvascular_density, unit: 1/mm^2, description: HFpEF median}
outputs:
  r: {quantity: relative_reduction, unit: percent}
settings: {}
stochastic: false
