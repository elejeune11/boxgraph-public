id: hist_median_fib
name: median of % area fibrosis from its frequency distribution (histogram)
role: processing
stated: {page: 3, printed_page: "552", where: text, quote: "Variables are summarized as median (25th–75th percentiles) or %"}
equation: "median = lower edge of the bin holding the 50th percentile + (50 - % below it) / (% in it) x bin width (bars normalised to their total)"
from_words: true
inputs:
  P: {quantity: patient_percentage, unit: percent, curve: {quantity: fibrosis_area_fraction, unit: percent}}
  f: {quantity: bin_label_position, unit: dimensionless}
outputs:
  m: {quantity: fibrosis_area_fraction, unit: percent}
settings: {}
stochastic: false
