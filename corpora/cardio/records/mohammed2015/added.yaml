- id: n_regression_added
  quantity: patient_count
  unit: dimensionless
  printed: "228"
  basis: >
    Table 3 does not print how many subjects entered each regression; taken as all 104 controls and 124 HFpEF
    (228, p. S1). Subjects without serial coronary sections (5 HFpEF lack them, p. 4) or without a fibrosis or
    MVD value (the restricted analyses drop subjects, pp. 4-5) may be missing from some regressions.
  alternatives: ["223", "207"]
  stands_for: n in R2 = t^2 / (t^2 + n - 2) for the Table 3 Group (HFpEF) rows (added in audit)
- id: bin_label_pos_added
  quantity: bin_label_position
  unit: dimensionless
  printed: "0.5"
  basis: >
    The frequency distributions of Figs. 1A-C, 2A and 3A label each bin by one number under its bars; the paper
    does not say whether that is the bin's centre or an edge. Taken as the centre, the default of the
    plotting program's frequency distributions (figure pass). With integer CAD scores in bins of 2 (Fig. 1C)
    the bin edges are themselves uncertain.
  alternatives: ["0", "1"]
  stands_for: f in the histogram-median models (hist_median_*), the label's position within its bin
