- id: q_no_model_predicts_rakusan1992
  kind: unstated_model
  about: [same_density, percentage, relative_reduction, circle_area]
  text: >
    (Validation job with rakusan1992.) No model of this record predicts a measurement of rakusan1992. The
    models here are descriptive statistics of this paper's own data (percentages, counts, relative changes
    between its groups, medians of its histograms, R2 and correlations of its regressions) and the circle
    area of the size cut-offs; none takes a condition of rakusan1992's hearts (heart weight, age, group)
    and gives a capillary density, domain area, domain radius or heart weight there. The paper cites
    rakusan1992 (ref. 30) only for the heart weight of aortic stenosis (780 g), a value it reports, not
    one a model here produces. The like-with-like density comparisons through same_density
    (validations.yaml) are consistency checks, not model tests. The other direction is tested in
    rakusan1992/validations.yaml (its Fig. 2 cubic at this paper's median heart weights; see
    rakusan1992/q_mohammed_density_vs_fit).
  citation: {page: 7, printed_page: "556", where: text, quote: "aortic stenosis (780 g)"}
- id: q_no_validation_vink2024
  kind: unstated_model
  about: [same_density, percentage, relative_reduction, circle_area, vessel_share]
  text: >
    (Validation job mohammed2015+vink2024.) No model of this record predicts a measurement of vink2024, and
    no entry is added to validations.yaml. vink2024 measures myocardial blood volume and flow by contrast
    echocardiography at rest, under hyperinsulinemia and under dobutamine, with CFR, HMR, M-value, heart rates
    and clinical counts in ANOCA patients and controls. The models here are descriptive statistics of this
    paper's own autopsy data (percentages, counts, relative changes, histogram medians, R2 and r), the circle
    area of the profile size cut-offs, the share of microvessels among all vessels, and same_density (a
    carried-over profile density); none gives a blood volume, a flow, a recruitment ratio or a reserve, and
    vink2024 measures no vessel density. percentage or count_sum run on vink2024's counts would only repeat
    that record's own reproductions. relative_reduction (27% lower MVD in HFpEF) run on vink2024's MBV means
    would compute a different quantity in a different disease, a trend comparison the task excludes.
    Neither paper cites the other. The reverse direction is in vink2024/q_no_validation_mohammed2015.
- id: q_no_validation_campbell2011
  kind: unstated_model
  about: [same_density, circle_area, vessel_share, relative_reduction, capd_c_med, mvd_c_med]
  text: >
    (Validation job campbell2011+mohammed2015.) No model of this record predicts a measurement of
    campbell2011, and no entry is added to validations.yaml. campbell2011 measures capillary length
    density (mm/mm3) and the diffusion radius derived from it, cardiomyocyte width, arteriolar wall
    area per circumference, arterioles per section and per mm2 (12-151 um), body size, haemodynamics
    and plasma VEGF in LV biopsies of living CABG patients. The models here are descriptive statistics
    of this paper's own autopsy data, the circle area of the profile size cut-offs, the microvessel
    share, and same_density, which carries a profile density per mm2 of section: a different quantity
    from campbell2011's length density per tissue volume (no orientation or tortuosity factor is stated
    by either paper), so mapping them would cross quantities that only share a dimension. This paper's
    MVD includes precapillary arterioles of 10-20 um but is not campbell2011's arteriolar density
    (12-151 um, cross or oblique profiles only). Neither paper cites the other. The reverse direction is
    in campbell2011/q_no_validation_mohammed2015.
# ---- Validation job kaneko2011+mohammed2015 (2026-11-11) ----
- id: q_kaneko_path_position
  kind: choice
  about: [same_density, capd_c_med]
  text: >
    (Validation job kaneko2011+mohammed2015.) kaneko2011 prints three capillary densities along one
    arteriole-to-venule path of one heart (arteriolar side 2301 +/- 123, middle 3130 +/- 501, venular side
    3157 +/- 167 /mm2) and no whole-wall average. This paper's control median (1044/mm2) counts every capillary
    profile of a transmural section, so it samples all path positions; which kaneko2011 value it should be set
    beside is open, and all three are entered (val_capd_c_kaneko, _art, _ven). The control median is below all
    three (45% of the arteriolar-side value, a third of the others); the method differences listed in
    q_capd_methods and q_capd_vs_literature apply. These are like-with-like consistency checks through the
    identity same_density, not tests of a model: neither paper models a capillary density, and neither cites
    the other. The HFpEF median (788) is not set beside kaneko2011, whose heart is normal.
  citation: {page: 7, printed_page: "556", where: text, quote: "vary widely, thereby hampering comparisons of absolute"}
