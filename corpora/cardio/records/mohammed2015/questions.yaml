- id: q_capd_methods
  kind: reading
  about: [capd_c_med, mvd_c_med, microvascular_density, capillary_density]
  text: >
    Measurement basis: profiles counted in one transmural, formalin-fixed, paraffin-embedded 4 um section at
    autopsy, by automated CD31 detection with a 10 um2 minimum stain area, in whatever orientation the fibres
    run (the paper says longitudinal profiles above 314 um2 are excluded, and that midwall fibres are cut
    lengthwise, Fig. S4); no correction for shrinkage or orientation. MVD minus capillary density (1316 -
    1044 medians) leaves about 270 'precapillary arterioles' (78.5-314 um2) per mm2, far more than the
    arteriolar densities usually reported, which suggests that obliquely cut capillaries are counted in that
    class. Values are therefore not a capillary density in strict transverse section and not an in vivo value.
  citation: {page: 3, printed_page: "552", where: text, quote: "assumed a circular shape excluding longitudinally cut microvessels"}

- id: q_capd_vs_literature
  kind: unexplained_difference
  about: [capd_c_med, capd_h_med, same_density]
  text: >
    The control median capillary density (1044/mm2) is about half of rakusan1992's young adult controls
    (2249 +/- 85) and a third of kaneko2011's reconstructed human LV (3130 +/- 501), and below the
    2000-4000/mm2 that rakusan1992 gives for adult mammalian hearts; the HFpEF median (788) is about half of
    rakusan1992's elderly acquired aortic stenosis hearts (1671 +/- 66). The paper notes that methods vary
    widely and hamper comparison of absolute values (p. 7). Candidate causes: the 10 um2 minimum area
    (without it total density rises from 1368 to 2214/mm2 in controls, p. S1), thin 4 um sections and
    automated thresholds that miss collapsed or weakly stained capillaries, autopsy tissue and age.
    Recorded as a finding, not an error (validations.yaml: val_capd_c_rakusan_adult, val_capd_c_rakusan_mammals,
    val_capd_c_kaneko, val_capd_h_rakusan_acquired_as).
  citation: {page: 7, printed_page: "556", where: text, quote: "vary widely, thereby hampering comparisons of absolute"}

