notes: >
  Autopsy study (Mayo Clinic, 1977-2010) of 124 HFpEF patients, 104 controls dying of noncardiac
  causes and 27 HFrEF patients. Microvascular density (MVD) was counted by automated detection of
  CD31-stained vessel profiles in one transmural, formalin-fixed, paraffin-embedded 4 um section of
  the mid-ventricular LV wall (inferior wall by default), counting profiles of 10 to 314 um2
  (capillaries 10-78.5 um2, precapillary arterioles 78.5-314 um2) per mm2 of tissue; no shrinkage
  correction. Page 1 also carries an unrelated 'Related Papers' banner from the download site, which
  is not part of the source; PDF page 11 is the journal's cover sheet for the supplement, and pages
  12-27 are the supplement (its own page labels 1-16, recorded here as S1-S16).
  The paper states no physical model; its quantitative core is descriptive statistics. What is
  checked: (1) the stated circular-profile relation between the size cut-offs, area = pi d^2/4,
  which gives 78.5 um2 at 10 um and 314 um2 at 20 um (all four reproduce); (2) the 27% reduction in
  median MVD from the Table 2 medians 1316 and 961 (reproduces) and the 'percentage of expected
  cardiac weight was 50% higher' from 112 and 169 (50.9%: close, not reproduced at the printed
  precision); (3) every percentage printed beside its count (Results, Tables S1-S4, creatinine
  availability) and the counts that should add up. Most reproduce; not reproduced are Table S1's
  community hypertension 479 (85%) (86.5%) and CAD 311 (55%) (56.1%), Table S4's HFrEF men 16 (56%)
  (59.3%), Table 2's RV hypertrophy 50% against the 4 + 57 = 61 of 124 patients in the Results
  (49.2%), the 40 HFpEF patients without stenosis >50% in the restricted MVD analysis against
  119 - 77 = 42, and the Fig. S5 group sizes (71 + 32 = 103 controls, 25 + 97 = 122 HFpEF; with
  97 hypertensives 78.2%, against Table 1's 79% and Table S1's 98). Each has a question. The build's
  input-rounding rule treats each printed count as rounded to +/- 0.5, so some of these (16/27,
  61/124, 97/124, 71 + 32, and 169/112 for the '50%') may be judged reproduced within the rounding
  range; patient counts are exact, so the questions stand (q_counts_exact). (4) Values
  printed twice (abstract and Table 2; Table 3 R2 and the text's percentages) agree. (5) The share of
  vessels below 314 um2 ('97%') against the ratio of median MVD to median total density with the
  10 um2 exclusion (96.2% controls, 92.9% HFpEF; an approximation, since a ratio of medians is not
  a pooled share).
  Cross-record checks (validations.yaml): the median capillary density of controls (1044/mm2) and
  of HFpEF (788/mm2) against rakusan1992 (adult controls 2249 +/- 85, acquired aortic stenosis
  1671 +/- 66, mammalian range 2000-4000) and kaneko2011 (3130 +/- 501 in one reconstructed human
  LV, midpoint of the capillary path). All are far apart, as expected from the methods: automated
  CD31 detection with a 10 um2 minimum profile area in thin autopsy sections of elderly hearts
  versus manual counts in perfusion- or immersion-fixed tissue of young adults; the paper itself
  warns that absolute MVD values are not comparable across methods (p. 7). These are findings, not
  errors; campbell2011 reports capillary length density (mm/mm3), a different quantity, and is not
  compared. The aortic stenosis heart weight the Discussion cites (780 g, ref 30) is linked to
  rakusan1992's adult congenital AS mean (cited.yaml).
  Left out: Table 1 values other than the group sizes and percentages checked; BMI, BSA and the
  indexed heart weights of Table 2 (a median of ratios cannot be recomputed from medians); Table 3
  regression coefficients and P values (no data to refit); the echocardiographic and ECG values;
  the correlation coefficients; Table S1 ages, EF, BSA and BMI. None feeds a model. No figure was
  read: page rendering was refused in this job (see figures.md); Fig. 2B (MVD by wall layer),
  Fig. 4A/B (MVD and fibrosis box plots including HFrEF, which would test Table 2's HFpEF upper
  quartile of 1370), Fig. 1D and Fig. S5 should be read in a later pass.
  Figure pass (2026-11-11): every figure that plots values was read with calibrated code readings
  (figures.yaml, figures/_kit.py; figures.md says panel by panel what was read and what was left out):
  the histograms of Figs. 1A-D, 2A and 3A (control and HFpEF), the Tukey box plots of Figs. 2B, 4A-B
  (including the HFrEF boxes, printed nowhere else) and S5A-B, and the scatter plots of Fig. S6. Left
  out: micrographs and stained sections (Figs. 2C-D, 3C-F), method drawings (Figs. S1-S4), and the dense
  overlapping clouds of Figs. 3B, 4C and S7. Checks added: the Fig. 4 box medians and quartiles against
  Table 2 (all reproduce except the HFpEF MVD upper quartile: the box top is near 1190, not 1370, which
  settles q_mvd_h_q75); medians interpolated in the five frequency distributions against Table 2 (with an
  added bin-centre assumption); the Fig. 1D share with stenosis against the abstract's 13% and 65%; the
  correlation of the Fig. S6 markers against the printed r. Findings: the Epi and Endo boxes of Fig. 2B
  are identical in both groups, and the Fig. 2A bars do not add to 100% (questions).
