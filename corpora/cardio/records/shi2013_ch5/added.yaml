- id: g_added
  quantity: gravity
  unit: m/s^2
  printed: "9.81"
  basis: The chapter uses rho*g*h (Eqs. 5-2, 5-4, 5-8 to 5-11, 5-15) but does not state g; standard gravity
  alternatives: ["9.80665", "9.8"]
  stands_for: g
- id: ke_as_N_per_m
  quantity: diaphragm_stiffness
  unit: N/m
  printed: "1.5e4"
  basis: >
    An alternative reading of Table 5-1, not a value the chapter states: the printed number 1.5e4
    taken in N/m instead of the printed mmHg·m (1.5e4 mmHg·m is 2.0e6 N/m). With the printed unit,
    Eq. 5-13 gives a diaphragm deflection of order (Ps,a·As)/ke = 7.5e-5 m, about 100 times
    smaller than the 0.0065 m amplitude the chapter reports (p. 12) and plots (Fig. 5-5(a)); with
    N/m (pressure force in newtons) it gives about 0.006 m. See question q_diaphragm_units.
  alternatives: ["1.9998e6"]
  stands_for: k_e in Eq. 5-13
- id: kf_as_N_s_per_m
  quantity: diaphragm_damping
  unit: N*s/m
  printed: "25."
  basis: >
    An alternative reading of Table 5-1, as for ke_as_N_per_m: the printed number 25 taken in
    N·s/m instead of the printed mmHg·m·s (3333 N·s/m).
  alternatives: ["3333"]
  stands_for: k_f in Eq. 5-13
