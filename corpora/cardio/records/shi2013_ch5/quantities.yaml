- {id: time, name: time, dimension: "[time]", description: "simulation time t (the figures plot 35-38 s)"}
- {id: drive_period, name: period of the driving air pressure, dimension: "[time]", description: "T in Eq. 5-12"}
- {id: hydraulic_resistance, name: hydraulic resistance, dimension: "[pressure]*[time]/[length]**3", description: "R of a segment of the bioreactor (lower or upper media chamber, tissue construct)"}
- {id: hydraulic_compliance, name: hydraulic compliance, dimension: "[length]**3/[pressure]", description: "C of a segment of the bioreactor (chambers, tissue construct, valve tubing)"}
- {id: hydraulic_inertance, name: hydraulic inertance, dimension: "[pressure]*[time]**2/[length]**3", description: "L of a media chamber"}
- {id: segment_height, name: height of a bioreactor part, dimension: "[length]", description: "h_cl, h_cu, h_s: heights giving the hydrostatic terms rho*g*h"}
- {id: reservoir_media_height, name: height of the media column in the reservoir, dimension: "[length]", description: "h_a in Eq. 5-15"}
- {id: diaphragm_mass, name: mass of the silicon diaphragm, dimension: "[mass]", description: "m_s in Eq. 5-13"}
- {id: diaphragm_area, name: area of the silicon diaphragm, dimension: "[length]**2", description: "A_s in Eqs. 5-13, 5-14"}
- {id: diaphragm_damping, name: frictional coefficient of the diaphragm, dimension: "[force]*[time]/[length]", description: "k_f in Eq. 5-13: force per unit diaphragm velocity"}
- {id: diaphragm_stiffness, name: elastic coefficient of the diaphragm, dimension: "[force]/[length]", description: "k_e in Eq. 5-13: force per unit diaphragm displacement"}
- {id: air_pressure_mean, name: mean air chamber pressure, dimension: "[pressure]", description: "P_s,0 in Eq. 5-12"}
- {id: air_pressure_amplitude, name: amplitude of the air chamber pressure, dimension: "[pressure]", description: "P_s,a in Eq. 5-12"}
- {id: valve_flow_coefficient, name: valve flow coefficient, dimension: "[length]**3/[time]/[pressure]**0.5", description: "CQ in the orifice laws Eqs. 5-8, 5-10"}
- {id: atmospheric_pressure, name: atmospheric pressure, dimension: "[pressure]", description: "P_atm in Eq. 5-15 (gauge reference)"}
- {id: media_density, name: density of the culture media, dimension: "[mass]/[length]**3", description: "rho"}
- {id: gravity, name: gravitational acceleration, dimension: "[length]/[time]**2", description: "g in the hydrostatic terms rho*g*h"}
- {id: air_chamber_pressure, name: air chamber pressure, dimension: "[pressure]", description: "P_s, Eq. 5-12"}
- {id: lower_chamber_pressure, name: pressure in the lower media chamber, dimension: "[pressure]", description: "P_cl"}
- {id: tissue_construct_pressure, name: pressure at the tissue construct, dimension: "[pressure]", description: "P_ct"}
- {id: upper_chamber_pressure, name: pressure in the upper media chamber, dimension: "[pressure]", description: "P_cu"}
- {id: tissue_construct_flow, name: flow-rate through the tissue construct, dimension: "[length]**3/[time]", description: "Q_ct"}
- {id: inlet_valve_flow, name: flow-rate through the inlet valve, dimension: "[length]**3/[time]", description: "Q_ci"}
- {id: diaphragm_flow,name: flow-rate produced by the diaphragm motion, dimension: "[length]**3/[time]", description: "Q_s = A_s dl/dt, Eq. 5-14; positive into the lower chamber"}
- {id: diaphragm_displacement, name: displacement of the silicon diaphragm, dimension: "[length]", description: "l in Eq. 5-13; positive towards the lower media chamber"}
- {id: diaphragm_velocity, name: velocity of the silicon diaphragm, dimension: "[length]/[time]", description: "u = dl/dt"}
- {id: peak_tissue_construct_pressure, name: highest pressure at the tissue construct over a cycle, dimension: "[pressure]"}
- {id: min_tissue_construct_pressure, name: lowest pressure at the tissue construct over a cycle, dimension: "[pressure]"}
- {id: peak_tissue_construct_flow, name: highest flow-rate through the tissue construct over a cycle, dimension: "[length]**3/[time]"}
- {id: min_tissue_construct_flow, name: lowest flow-rate through the tissue construct over a cycle, dimension: "[length]**3/[time]"}
- {id: diaphragm_oscillation_amplitude, name: amplitude of the diaphragm oscillation, dimension: "[length]", description: "half the range of l over a cycle, about its neutral position"}
- {id: diaphragm_neutral_offset, name: offset of the diaphragm's neutral position towards the air chamber, dimension: "[length]", description: "minus the mid-range of l over a cycle (positive: towards the air chamber)"}
