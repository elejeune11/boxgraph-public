notes: >
  Scope: the paper's quantitative core, which is morphometric data (Tables 1-3, 5, 6, 9, 10) and the
  computations the paper does on them. Recorded models: (1) the least-squares Horton-law fits of
  Eqs. 2, 4 and 5 (log10 of mean diameter, length and number against order, with R2 and the ratio
  between successive orders), run on the Table 1-3 means and the Table 9 numbers (segment numbers as
  N x S/E, as p. 10 says) and compared with all 96 entries of Table 4; (2) Eq. 3, ratio = 10^b, applied
  to the printed b (24 consistency checks); (3) Eqs. 10 and 11, the extrapolation of the elements of the
  missing subtrees of the RCA cast by the Table 6 connectivity matrix and its propagated error, compared
  with the Extrapolated and Corrected Total columns and the SEs of Table 10; (4) Eqs. 6a and 7a summed
  over orders, compared with the cumulative volumes of the three trees (p. 13); (5) small arithmetic of
  the text: C(m,n) N_n for the p. 13 example (24 and 2) and the 1.4 x 10^6 elements of the heart (sum of
  the Table 9 whole-heart column). Findings: the element-based fits, the segment-based diameter and
  number fits and all of Eqs. 10-11 reproduce (one Table 10 entry, 396, is only close because the
  computed value sits on the rounding boundary); the slopes b of Eq. 5 are printed positive although the
  fit is negative (q_number_slope_sign); the segment-length constants of Table 4 do not follow from the
  segment lengths of Tables 1-3 (q_segment_length_fits); the RCA volume is only close (q_volume_rca).
  Recording choices: thousands separators are dropped from printed numbers ("1,458" -> "1458"). Inputs
  printed as mean +- SD or mean +- SE are recorded as the mean alone, the full cell in `note`, so that the
  spread does not pass for printed precision; the SEs of Table 6 that Eq. 11 uses are recorded apart.
  Printed results keep their +- (Table 10 totals, the cumulative volumes). Left out: the SDs and n of
  Tables 1-3 and 5 (no model uses them); row 0 of Table 6 (capillaries; Eq. 10 counts orders 1-11);
  Tables 7 and 8 (the LAD and LCX intact and cut counts are not printed, so Eq. 10 cannot be rerun for
  them, q_table9_other_columns); the SE of the volumes (q_volume_se); the 3.0 x 10^6 segments of p. 13
  (needs S/E of the LCCA trunk); the diameter-defined ordering rule of Eq. 1 and the Poiseuille flow of
  Eqs. 8-9, which produce no printed number; animal and casting data in Methods; the Fig. 4 caption
  example; Figs. 1-5 (drawings and photographs). Page images were checked for every table value; Table 9's OCR
  "14424" is 144 +- 4 on the page.
  Figures (second pass, figures.md): the points of Figs. 6-11 are read by calibrated code, one reading
  per tree, where the overlapping markers can be told apart. Figs. 6-9 agree with the tables they plot
  (consistency), except RCA order 11 of Fig. 7 and RCA order 3 of Fig. 9 (close). Figs. 10 and 11 are
  compared with Eqs. 6a and 7a per order: they follow from the segment mean diameters, not the
  element ones (q_fig10_segment_diameters), and with segment diameters the cumulative volumes
  reproduce for all three trees (cmp_volume_*_segD); the element-diameter runs are kept.
