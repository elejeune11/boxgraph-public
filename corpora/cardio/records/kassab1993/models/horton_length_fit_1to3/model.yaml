id: horton_length_fit_1to3
name: least-squares fit of Horton's law for mean length, orders 1-3 (Eq. 4)
role: fit
stated: {page: 9, printed_page: H358, quote: equation for the element length (L) can be written as, where: Eq. 4}
equation: log10 L_n = a + b n
inputs:
  L1: {quantity: vessel_length, unit: um}
  L2: {quantity: vessel_length, unit: um}
  L3: {quantity: vessel_length, unit: um}
outputs:
  a: {quantity: horton_intercept_length, unit: dimensionless}
  b: {quantity: horton_slope_length, unit: dimensionless}
  R2: {quantity: fit_r_squared, unit: dimensionless}
  ratio: {quantity: horton_ratio_length, unit: dimensionless}
settings: {}
stochastic: false
