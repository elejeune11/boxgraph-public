  D5: {quantity: vessel_diameter, unit: um}
  D6: {quantity: vessel_diameter, unit: um}
  D7: {quantity: vessel_diameter, unit: um}
  D8: {quantity: vessel_diameter, unit: um}
  D9: {quantity: vessel_diameter, unit: um}
  D10: {quantity: vessel_diameter, unit: um}
  D11: {quantity: vessel_diameter, unit: um}
outputs:
  a: {quantity: horton_intercept_diameter, unit: dimensionless}
  b: {quantity: horton_slope_diameter, unit: dimensionless}
