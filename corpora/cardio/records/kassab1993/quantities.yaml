- {id: strahler_order, name: diameter-defined Strahler order number, dimension: dimensionless, description: "order n of a vessel in the diameter-defined Strahler system; capillaries are order 0"}
- {id: vessel_diameter, name: mean lumen diameter of the vessels of an order, dimension: "[length]", description: "mean over the segments, or over the elements (segments of one order in series), of a given order"}
- {id: vessel_length, name: mean length of the vessels of an order, dimension: "[length]", description: "mean length of the segments, or of the elements, of a given order"}
- {id: segments_per_element, name: segment-to-element numbers ratio S/E, dimension: dimensionless, description: "average number of segments in series per element of an order (Table 5)"}
- {id: element_count, name: total number of vessel elements of an order in a tree, dimension: dimensionless}
- {id: element_count_se, name: standard error of the total number of elements of an order, dimension: dimensionless}
- {id: intact_element_count, name: number of intact elements of an order in the cast, dimension: dimensionless, description: "Table 10, column Intact"}
- {id: cut_element_count, name: number of elements of an order cut or broken off the cast, dimension: dimensionless, description: "Table 10, column Cut"}
- {id: extrapolated_element_count, name: number of elements of an order in the missing subtrees, dimension: dimensionless, description: "N'_n of Eq. 10; Table 10, column Extrapolated"}
- {id: element_count_all_orders, name: total number of arterial elements of all orders, dimension: dimensionless}
- {id: connectivity_ratio, name: connectivity matrix component C(n m), dimension: dimensionless, description: "number of elements of the daughter order springing directly from parent elements of the parent order, divided by the number of parent elements"}
- {id: connectivity_ratio_se, name: standard error of a connectivity matrix component, dimension: dimensionless}
- {id: connected_element_count, name: number of elements of one order springing from all elements of another order, dimension: dimensionless, description: "C(m, n) N_n"}
- {id: horton_intercept_diameter, name: intercept a of log10 mean diameter (um) against order, dimension: dimensionless}
- {id: horton_slope_diameter, name: slope b of log10 mean diameter against order, dimension: dimensionless}
- {id: horton_ratio_diameter, name: diameter ratio between successive orders, dimension: dimensionless}
- {id: horton_intercept_length, name: intercept a of log10 mean length (um) against order, dimension: dimensionless}
- {id: horton_slope_length, name: slope b of log10 mean length against order, dimension: dimensionless}
- {id: horton_ratio_length, name: length ratio between successive orders, dimension: dimensionless}
- {id: horton_intercept_number, name: intercept a of log10 number of vessels against order, dimension: dimensionless}
- {id: horton_slope_number, name: slope b of log10 number of vessels against order, dimension: dimensionless}
- {id: horton_ratio_number, name: number ratio between successive orders, dimension: dimensionless, description: "ratio of the numbers of vessels of order n-1 and order n"}
- {id: fit_r_squared, name: correlation coefficient R2 of a straight-line fit, dimension: dimensionless}
- {id: arterial_tree_volume, name: cumulative blood volume of a coronary arterial tree, dimension: "[length]**3"}
- {id: order_total_csa, name: total cross-sectional area of all vessel elements of one order, dimension: "[length]**2", description: "A_n of Eq. 6a, plotted in Fig. 10"}
- {id: order_blood_volume, name: total blood volume of all vessel elements of one order, dimension: "[length]**3", description: "V_n of Eq. 7a, plotted in Fig. 11"}
