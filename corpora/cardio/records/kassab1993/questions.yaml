- id: q_no_validation_vs_schwarz2020
  kind: choice
  about: [horton_diameter_fit_11, horton_length_fit_4to11, horton_number_fit_11, extrapolation_eq10, order_csa_11, order_volume_11, tree_volume_11]
  text: >
    No validation is entered against schwarz2020's measurements. This paper, earlier, says nothing of
    schwarz2020; schwarz2020 cites it (pp. 2, 8) as earlier porcine morphometry and says on p. 9 that its
    pig segment lengths "are closer to our findings", a comparison of data with data, not a prediction by a
    model. The models here are the Horton fits (Eqs. 2-5), the Eq. 10-11 extrapolation of element counts and
    the per-order area and volume sums (Eqs. 6a, 7a), each a function of the Strahler order n run on this
    paper's own pig diameters, lengths, numbers and connectivity matrix. schwarz2020's measurements are of one
    human heart, binned by diameter class, not by order: segment shares and terminal densities (Table 1),
    segment lengths per diameter class (Fig. 2), daughter symmetry per mother class (Fig. 3), area growth at
    nodes (Fig. 4, the 1.02 median), the 441 um median length and perfused volumes. No Strahler order is
    assigned to any of them, so no model here can be run on their conditions, and the order-level area A_n
    is a sum over all elements of an order, not an area ratio at one node. Running a Horton law on a
    diameter class would need an order-to-diameter map that neither paper gives for the human tree.
    For the other direction see schwarz2020/q_no_validation_vs_kassab1993.
  citation: {none: "a finding of the cross-record job between kassab1993 and schwarz2020, not a printed statement"}
