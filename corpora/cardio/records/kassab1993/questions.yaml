  text: >
    Table 4 gives "Ratio is that between successive orders" without saying which way. For diameter and
    length it is D_n/D_(n-1) = 10^b (Eq. 3). For the number of vessels the printed ratios (3.50 etc.)
    are above one, so the fit models report N_(n-1)/N_n = 10^(-b); the Eq. 3 check (ratio_from_b_number)
    applies 10^b to the printed, positive b.
