- id: q_no_validation_chilian1986
  kind: choice
  about: [order_diameter_11, horton_diameter_fit_11, order_volume_11, tree_volume_11, extrapolation_eq10]
  text: >
    (Cross-record validation with chilian1986.) No model of this record is validated against the
    measurements of chilian1986, and none of chilian1986 against this record's. The models here give
    morphometry of the pig coronary arterial tree by Strahler order (mean diameter, length, number,
    cross-sectional area and volume of an order, Horton fits, the Eq. 10 extrapolation). chilian1986
    measures cat epicardial microvascular and aortic pressures, microsphere perfusion and individual
    arteriole and venule diameters (Fig. 3, the diameter ranges of Tables 4 and 5), none assigned a
    Strahler order, so no model here can be run on those measurements' conditions: matching a cat
    vessel class to a pig order by diameter would be an assumption, and would compare only species-
    unrelated anatomy. The pressure-flow use of the data (Poiseuille, Eqs. 8-9) produces no number in
    this record and is not a model here. Neither paper cites the other.
- id: q_no_validation_chilian1986_reverse
  kind: choice
  about: [order_diameter_10, order_diameter_11]
  text: >
    (Cross-record validation with chilian1986.) chilian1986's models (pressure as a percentage of aortic
    pressure, resistance partition, pressure drop, resistance = pressure / perfusion, relative diameter
    change) take pressures, perfusion or diameter changes as inputs. This record measures none of these
    (only the perfusion pressure of the casting, a preparation setting), so its measurements are not
    predicted by any chilian1986 model.
