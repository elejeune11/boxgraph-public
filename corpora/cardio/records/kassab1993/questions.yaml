- id: q_number_slope_sign
  kind: possible_error
  about: [t4_N_b_e_rca, t4_N_b_e_lad, t4_N_b_e_lcx, t4_N_b_s_rca, t4_N_b_s_lad, t4_N_b_s_lcx, horton_number_fit_11, horton_number_fit_10]
  text: >
    Table 4 prints the slope b of Eq. 5 (log10 N_n = a + b n) for the total number of vessels as
    positive (0.544, 0.545, 0.553, 0.450, 0.458, 0.474). The numbers of Table 9 fall with order, so a
    least-squares fit gives the same magnitudes with a negative sign, and Eq. 5 with the printed
    positive b and a = 6.35 would give numbers that grow with order. The intercepts, R2 and the ratios
    (read as N_(n-1)/N_n) all reproduce, so the minus sign appears to have been dropped. The values are
    kept as printed.
  citation: {page: 10, quote: "data fit a straight line. Thus an equation similar to Eq. 2", where: "Eq. 5, Table 4"}
- id: q_number_ratio_direction
