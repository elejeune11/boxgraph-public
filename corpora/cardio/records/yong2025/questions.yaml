  citation: {page: 4, printed_page: "4", quote: "elevated pulmonary vascular resistance (from 0.04 to 0.41", where: "Sec. 2.5"}
- id: q_pa_node
  kind: choice
  about: [coronary_closed_loop, s3_Ppa_max_normal]
  text: >
    The pulmonary artery has no compliance at the valve outlet (Fig. 1: resistance first, then compliance), as the
    aorta has none at its root. 'PA pressure' is taken at the pulmonary valve outlet, like the aortic pressure at
    the aortic root (Supp. Fig. S1: 'central aortic pressure is equivalent to proximal coronary pressures'). The
