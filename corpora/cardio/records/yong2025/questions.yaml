  text: >
    Eq. 14 prints mDSFR as the ratio of the flow integrals over diastole and over systole, but every mDSFR in
    Table 1 equals the ratio of the table's own mean diastolic and mean systolic flows (cmp_ratio_*). With systole
    38 % of the cycle the two definitions differ by a factor of about 1.6. The printed model (Eq. 14 as printed)
    and a variant using the ratio of means are both run and compared.
  citation: {page: 5, printed_page: "5", quote: "where Q(t) is the time-varying flow rate", where: "Eq. 14"}
- id: q_table_s1_headers
