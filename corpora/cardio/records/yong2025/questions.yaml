    newborn lambs: Table 1 (body and heart weights, heart rate 107 and 206 /min, mean aortic pressure, Cx
    flow per 100 g), Table 2 (Cx flow phase durations and cycle-mean-normalized phase flows) and Figs. 3, 7, 8
    (per-animal Cx flow, aortic flow and pressure, LV pressure). The coronary models here give human LAD, LCx,
    RCA and GCV flows, and they are closed loops: their ~55 inputs (chamber elastances and timings, systemic,
    pulmonary and coronary R and C, Supp. Tables S1-S2) are human values. Neither paper states any of them for
    sheep or lambs, and no model here takes a measured aortic or ventricular pressure as input. A sheep run
    would therefore rest almost entirely on added inputs, and its agreement or disagreement would test those
    inputs, not the model. The candidates that stay are not predictions either. The systolic and phase
    fractions (sys_frac) are set by the timing inputs Tvc and Tvr. The LCx mean flow is set by the calibration
    to 4 % of cardiac output and the Sankaran split, so a flow per 100 g would also need an added human
    territory mass, and then a comparison with sheep. mynard2014's phase flows S1a-D1f are defined by
