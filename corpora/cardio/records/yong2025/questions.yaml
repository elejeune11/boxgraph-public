- id: q_volume
  kind: unstated_input
  about: [P_init_added, coronary_closed_loop]
  text: >
    The circulating blood volume (equivalently, the initial capacitor pressures of the Simulink model) is not
    stated. The model is linear with no unstressed volumes, so every pressure, flow and volume scales with it while
    the ratios (pDSFR, mDSFR, EF, flow shares, systolic duration) do not depend on it. With the added 7 mmHg the
    cardiac output is about 2.8 l/min; with 10 mmHg about 4.0 l/min, near the printed 4.1. The absolute flows and
    pressures compared therefore test the paper only through this unstated volume.
- id: q_chamber_pv_law
  kind: unstated_model
  about: [coronary_closed_loop]
  text: >
    The chamber pressure-volume law is given only as 'time-varying capacitors whose capacitance is inversely related
    to elastance (E = 1/C)'. It is implemented as P = E(t) V with no unstressed volume, as a capacitor implies; a
    nonzero unstressed volume would change the pressure-volume loops and the pulse pressure.
  citation: {page: 2, printed_page: "2", quote: "The four cardiac chambers are modelled as time-varying capacitors", where: "Sec. 2.2"}
- id: q_pvr
