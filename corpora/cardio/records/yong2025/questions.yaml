  text: >
    The column headers of Supp. Table S1 are empty in the supplement (only the units show), so which symbol each
    column holds is read, not printed. The chamber columns are taken as E_max, E_min, contraction duration,
    relaxation duration, and for the atria t_ac, t_ar. With T = 1 s these make Eq. 5 continuous (t_ar + T_ar - T =
    0.14 s; t_ac + T_ac = t_ar = 0.97 s), which supports the reading. The valve columns are taken as R_open and
    R_closed (Eq. 6).
