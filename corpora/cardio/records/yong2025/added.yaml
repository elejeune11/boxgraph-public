- id: P_init_added
  quantity: initial_pressure
  unit: mmHg
  printed: '7'
  basis: Not stated. The chambers obey P = E(t) V with no unstressed volume (E = 1/C, Sec. 2.2) and every vessel is a linear R or C, so the circulating volume set by the starting state scales every pressure,
    flow and volume in proportion and leaves every ratio (pDSFR, mDSFR, ejection fraction, flow shares, timing) unchanged. Every compartment starts at one pressure, the normal mean systemic filling pressure
    of about 7 mmHg in Guyton and Hall's textbook (Hall, 2016, which the supplement cites). It was not chosen to match any printed result.
  alternatives:
  - '10'
  - '5'
  stands_for: initial capacitor pressures (the circulating volume) of the Simulink model
- id: R_pc_PH_added
  quantity: vascular_resistance
  unit: mmHg*s/ml
  printed: '0.41'
  basis: Sec. 2.5 raises 'pulmonary vascular resistance (from 0.04 to 0.41 mmHg.s/ml)' but no resistance of Supp. Table S1 is 0.04. The printed PH value is given to the pulmonary capillary resistance, the
    dominant pulmonary resistance (0.1 of the 0.116 total).
  alternatives:
  - '0.47'
  - '1.025'
  stands_for: pulmonary capillary resistance in PH
