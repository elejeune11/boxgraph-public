# Values of Supp. Table S1 taken from korakianitis2006 (relation job korakianitis2006+yong2025, 2026-11-09).
# The supplement says (p. 12): "Systemic and pulmonary circulation parameters are primarily based on
# Korakianitis and Shi (2006) with minor adjustments of compliance to achieve physiologically representative
# flow and pressure. The systemic arterial compartment was consolidated for simplification."
# Linked: each resistance of a compartment that has one named counterpart in korakianitis2006 Table 2 (p. 7),
# since the paper says only compliances were adjusted, and the one compliance that was evidently not adjusted.
# Not linked: C_sv (70 against Csvn 20.5) and C_pa (3.55 against Cpat 3.8), the compliances the paper says it
# adjusted, so not the cited values; R_sa and C_sa, the consolidated systemic arterial compartment (it stands
# for Rsat + Rsar + Rscp and Csat in some combination the paper does not give); R_aorta (0.0398), which has no
# counterpart (Rsas is 0.003 and the paper does not say where 0.0398 comes from); the cardiac chamber and valve
# values, which the supplement sources from Blanco and Feijoo (2010), not from korakianitis2006.
- datum: R_sv
  from_source: ref-korakianitis2006
  from_datum: Rsvn
  evidence: "Supp. Table S1 'Systemic Venous' resistance; korakianitis2006 Table 2 R_svn, the systemic venous resistance. The supplement says systemic parameters are based on Korakianitis and Shi (2006) with only compliances adjusted."
- datum: R_pa
  from_source: ref-korakianitis2006
  from_datum: Rpat
  evidence: "Supp. Table S1 'Pulmonary Artery' resistance; korakianitis2006 Table 2 R_pat, the pulmonary artery resistance (R_pas, the pulmonary sinus, has no counterpart in yong2025's pulmonary circulation). Pulmonary parameters are based on Korakianitis and Shi (2006) with only compliances adjusted."
- datum: R_pc
  from_source: ref-korakianitis2006
  from_datum: Rpcp
  evidence: "Supp. Table S1 'Pulmonary Capillary' resistance; korakianitis2006 Table 2 R_pcp, the pulmonary capillary resistance. The supplement says pulmonary parameters are based on Korakianitis and Shi (2006) with only compliances adjusted; the printed values differ (0.1 against 0.25, see q_korakianitis_pc)."
- datum: R_pvn
  from_source: ref-korakianitis2006
  from_datum: Rpvn
  evidence: "Supp. Table S1 'Pulmonary Vein' resistance; korakianitis2006 Table 2 R_pvn, the pulmonary venous resistance. Pulmonary parameters are based on Korakianitis and Shi (2006) with only compliances adjusted."
- datum: C_pvn
  from_source: ref-korakianitis2006
  from_datum: Cpvn
  evidence: "Supp. Table S1 'Pulmonary Vein' compliance; korakianitis2006 Table 2 C_pvn, the pulmonary venous compliance. The supplement says compliances were adjusted, but this one is printed as the same 20.5, so it is taken as the cited value unadjusted."
