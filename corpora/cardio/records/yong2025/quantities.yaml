- id: heart_period
  name: cardiac cycle duration
  dimension: '[time]'
  description: T in Eqs. 4-5
- id: chamber_elastance
  name: heart chamber elastance
  dimension: '[pressure]/[length]**3'
  description: E_max or E_min of a chamber in Eq. 3
- id: contraction_duration
  name: duration of chamber contraction
  dimension: '[time]'
  description: T_vc (ventricles) or T_ac (atria) in Eqs. 4-5
- id: relaxation_duration
  name: duration of chamber relaxation
  dimension: '[time]'
  description: T_vr (ventricles) or T_ar (atria) in Eqs. 4-5
- id: atrial_contraction_onset
  name: time in the cycle at which the atria start to contract
  dimension: '[time]'
  description: t_ac in Eq. 5
- id: atrial_relaxation_onset
  name: time in the cycle at which the atria start to relax
  dimension: '[time]'
  description: t_ar in Eq. 5
- id: valve_resistance
  name: valve resistance
  dimension: '[pressure]*[time]/[length]**3'
  description: R_open or R_closed of a diode-resistor valve (Eq. 6)
- id: vascular_resistance
  name: vascular resistance
  dimension: '[pressure]*[time]/[length]**3'
  description: R_k of a vascular compartment (Eq. 1)
- id: vascular_compliance
  name: vascular compliance
  dimension: '[length]**3/[pressure]'
  description: C_k of a vascular compartment (Eq. 2)
- id: microvascular_resistance_mean
  name: cycle-mean coronary microvascular resistance
  dimension: '[pressure]*[time]/[length]**3'
  description: 'Rmicro_bar: the constant resistance of the conventional model and the cycle mean of Rmicro(t)'
- id: microvascular_resistance_max
  name: maximum coronary microvascular resistance
  dimension: '[pressure]*[time]/[length]**3'
  description: Rmicro,max = k Rmicro_bar
- id: microvascular_resistance_min
  name: minimum (basal) coronary microvascular resistance
  dimension: '[pressure]*[time]/[length]**3'
  description: Rmicro,min
- id: basal_resistance_fraction
  name: basal microvascular resistance as a fraction of the mean
  dimension: dimensionless
  description: Rmicro,min / Rmicro_bar (70 % LCA, 75 % RCA)
- id: resistance_scale_factor
  name: maximum-to-mean microvascular resistance factor
  dimension: dimensionless
  description: k in Eqs. 10-11
- id: ph_resistance_factor
  name: PH adjustment of the right coronary resistance
  dimension: dimensionless
  description: k_PH in Eq. 11
- id: imp_ratio
  name: ratio of intramyocardial to intraventricular pressure
  dimension: dimensionless
  description: 0.6 in Eq. 12
- id: initial_pressure
  name: initial pressure of every compartment
  dimension: '[pressure]'
  description: the state the simulation starts from; with no unstressed volumes it fixes the circulating volume
- id: coronary_flow_systolic_mean
  name: mean coronary flow in systole
  dimension: '[length]**3/[time]'
  description: mean over mitral valve closure to aortic valve closure
- id: coronary_flow_diastolic_mean
  name: mean coronary flow in diastole
  dimension: '[length]**3/[time]'
  description: mean over aortic valve closure to the end of the cycle
- id: coronary_flow_systolic_peak
  name: peak coronary flow in systole
  dimension: '[length]**3/[time]'
  description: largest flow in systole
- id: coronary_flow_diastolic_peak
  name: peak coronary flow in diastole
  dimension: '[length]**3/[time]'
  description: largest flow in diastole
- id: coronary_flow_cycle_mean
  name: cycle-averaged coronary flow
  dimension: '[length]**3/[time]'
  description: mean over the cardiac cycle
- id: peak_dsfr
  name: peak diastolic-systolic flow ratio
  dimension: dimensionless
  description: pDSFR, Eq. 13
- id: mean_dsfr
  name: mean diastolic-systolic flow ratio
  dimension: dimensionless
  description: mDSFR, Eq. 14
- id: cardiac_output
  name: cardiac output
  dimension: '[length]**3/[time]'
  description: cycle-mean aortic valve flow
- id: aortic_pressure_max
  name: maximum aortic pressure
  dimension: '[pressure]'
  description: over one cycle, at the aortic root
- id: aortic_pressure_min
  name: minimum aortic pressure
  dimension: '[pressure]'
  description: over one cycle, at the aortic root
- id: aortic_pressure_mean
  name: mean aortic pressure
  dimension: '[pressure]'
  description: cycle mean, at the aortic root
- id: pa_pressure_max
  name: maximum pulmonary arterial pressure
  dimension: '[pressure]'
  description: over one cycle
- id: pa_pressure_min
  name: minimum pulmonary arterial pressure
  dimension: '[pressure]'
  description: over one cycle
- id: pa_pressure_mean
  name: mean pulmonary arterial pressure
  dimension: '[pressure]'
  description: cycle mean (mPAP)
- id: stroke_volume
  name: left ventricular stroke volume
  dimension: '[length]**3'
  description: max minus min LV volume
- id: ejection_fraction
  name: left ventricular ejection fraction
  dimension: dimensionless
  description: stroke volume / end-diastolic volume
- id: systolic_duration_fraction
  name: systolic duration as a share of the cycle
  dimension: dimensionless
  description: (aortic valve closure - mitral valve closure) / T
- id: systolic_diastolic_duration_ratio
  name: systolic to diastolic duration ratio
  dimension: dimensionless
  description: systolic duration / diastolic duration
- id: coronary_flow_fraction
  name: coronary share of cardiac output
  dimension: dimensionless
  description: total coronary inflow / aortic valve flow
- id: left_coronary_flow_fraction
  name: left coronary share of total coronary flow
  dimension: dimensionless
  description: (LAD + LCx) / (LAD + LCx + RCA)
- id: lad_share_of_left_flow
  name: LAD share of left coronary flow
  dimension: dimensionless
  description: LAD / (LAD + LCx)
- id: periodicity_change
  name: cycle-to-cycle change of mean aortic pressure
  dimension: dimensionless
  description: steadiness check of a simulation
- id: elastance_fold_change
  name: fold change of a maximum elastance
  dimension: dimensionless
  description: ratio of two E_max values
- id: cross_sectional_area
  name: vessel cross-sectional area
  dimension: '[length]**2'
  description: lumen area used to turn velocity into flow
- id: vessel_diameter
  name: vessel diameter
  dimension: '[length]'
  description: diameter of a circular lumen
- id: flow_mae
  name: mean absolute error of a flow waveform
  dimension: '[length]**3/[time]'
  description: MAE of Eq. 15 between a simulated and an in vivo waveform
# --- figure pass (2026-11-09): calibrated readings of Figs. 2-8 and Supp. Figs. S1-S2
- id: cardiac_cycle_fraction
  name: time in the cardiac cycle over the period
  dimension: dimensionless
  description: the 'Cardiac cycle' / 'Normalised cardiac cycle' axis of the waveform figures; 0 at the start of systole
- id: time_in_cycle
  name: time from the start of ventricular contraction
  dimension: '[time]'
  description: the 'Time (s)' axis of Figs. 2B-C and 3B
- id: coronary_flow
  name: instantaneous coronary arterial flow
  dimension: '[length]**3/[time]'
  description: distal (intramural) arterial flow Q(t)
- id: coronary_venous_flow
  name: instantaneous coronary venous flow
  dimension: '[length]**3/[time]'
  description: flow in a coronary vein (GCV, LCx vein)
- id: coronary_flow_velocity
  name: coronary blood flow velocity
  dimension: '[length]/[time]'
  description: Doppler flow velocity measured in vivo
- id: aortic_pressure
  name: instantaneous aortic pressure
  dimension: '[pressure]'
  description: Pa, central aortic (proximal coronary) pressure
- id: distal_coronary_pressure
  name: instantaneous distal coronary pressure
  dimension: '[pressure]'
  description: Pd, after the epicardial resistance
- id: pa_pressure
  name: instantaneous pulmonary artery pressure
  dimension: '[pressure]'
  description: pressure at the pulmonary valve outlet
- id: aortic_flow
  name: instantaneous aortic valve flow
  dimension: '[length]**3/[time]'
- id: pa_flow
  name: instantaneous pulmonary valve flow
  dimension: '[length]**3/[time]'
- id: microvascular_resistance
  name: instantaneous microvascular resistance
  dimension: '[pressure]*[time]/[length]**3'
  description: Rmicro(t) of Eqs. 10-11
- id: figure_bar_position
  name: position of a bar in a bar chart
  dimension: dimensionless
  description: 1, 2, ... from the left; what each bar is is said in the reading
- id: coronary_flow_systolic_contribution
  name: systolic part of the cycle-mean coronary flow
  dimension: '[length]**3/[time]'
  description: the darker lower segment of the stacked bars of Fig. 7C ('Sys')
