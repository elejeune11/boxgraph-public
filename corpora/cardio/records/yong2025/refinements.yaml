- id: ref_dt_vrimp
  run: run_cl_vrimp
  setting: dt
  factors:
  - 1
  - 2
  - 4
  mode: divide
  output: mDSFR_lad
  tolerance: 1.5%
  tolerance_basis: 'the paper''s: ''difference between two simulations with consecutive time step refinement levels was less than 1.5 %'' (p. 4)'
  tolerance_added: false
- id: ref_dt_vrimp_rca
  run: run_cl_vrimp
  setting: dt
  factors:
  - 1
  - 2
  - 4
  mode: divide
  output: mDSFR_rca
  tolerance: 1.5%
  tolerance_basis: the paper's 1.5 % (p. 4)
  tolerance_added: false
- id: ref_dt_rimp
  run: run_cl_rimp
  setting: dt
  factors:
  - 1
  - 2
  - 4
  mode: divide
  output: Q_mean_lad
  tolerance: 1.5%
  tolerance_basis: the paper's 1.5 % (p. 4)
  tolerance_added: false
- id: ref_tend_vrimp
  run: run_cl_vrimp
  setting: t_end
  factors:
  - 1
  - 2
  mode: multiply
  output: Q_mean_lad
  tolerance: 0.5%
  tolerance_basis: 'added: the 60 s run must be periodic; a longer run should change the mean flow by less than its printed precision'
  tolerance_added: true
