id: dsfr_from_means
name: mean diastolic-systolic flow ratio as the ratio of the printed mean flows (Table 1)
role: processing
stated: {page: 4, printed_page: "4", quote: "The peak diastolic-systolic flow ratio (pDSFR) and mean diastolic", where: "Eq. 14 and Table 1"}
equation: "mDSFR = mean diastolic flow / mean systolic flow (the ratio Table 1's own rows imply; Eq. 14 prints a ratio of integrals)"
inputs:
  Qs_mean: {quantity: coronary_flow_systolic_mean, unit: ml/s}
  Qd_mean: {quantity: coronary_flow_diastolic_mean, unit: ml/s}
outputs:
  ratio: {quantity: mean_dsfr, unit: dimensionless}
settings: {}
stochastic: false
