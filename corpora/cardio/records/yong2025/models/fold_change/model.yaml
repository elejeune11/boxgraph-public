id: fold_change
name: fold change of the RV maximum elastance in PH (Sec. 2.5)
role: processing
stated: {page: 4, printed_page: "4", quote: "increased 2.5-fold from 0.40 to 1.00 mmHg/ml", where: "Sec. 2.5"}
equation: "fold = Emax,PH / Emax,normal"
inputs:
  a: {quantity: chamber_elastance, unit: mmHg/ml}
  b: {quantity: chamber_elastance, unit: mmHg/ml}
outputs:
  fold: {quantity: elastance_fold_change, unit: dimensionless}
settings: {}
stochastic: false
