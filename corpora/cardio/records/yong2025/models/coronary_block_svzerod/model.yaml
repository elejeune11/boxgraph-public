id: coronary_block_svzerod
name: the paper's coronary territories run in the released svZeroDSolver (CORONARY_VAR_RES and CORONARY blocks), driven by the closed-loop rebuild
role: model
stated:
  page: 3
  printed_page: '3'
  quote: Our model is based on Mantero et al. (1992) and Kim et al. (2010)
  where: Sec. 2.3, Eqs. 2, 10-12
equation: 'svZeroDSolver OpenLoopCoronaryVarResBC (src/model/OpenLoopCoronaryVarResBC.cpp lines 9-38): R_am(t) = [(sqrt(R_am,max) - sqrt(R_am,min)) e(t) + sqrt(R_am,min)]^2 with e(t) of Eq. 4; Ra1 - Ca
  - R_am(t) - Cim(P_im) - Rv1 - P_v (OpenLoopCoronaryBC.cpp). Inlet pressure, P_im and P_v from coronary_closed_loop.'
