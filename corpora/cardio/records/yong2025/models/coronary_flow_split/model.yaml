id: coronary_flow_split
name: steady flow split between coronary territories from their series resistances (Supp. Table S2)
role: model
stated: {page: 13, quote: "flow split between left and right coronaries was set", where: "Supp. coronary circulation model parameters"}
equation: "Q_k proportional to 1/(Ra,k + Rmicro,k + Rv,k); 70%-30% left-right, 55%-45% LAD-LCX"
inputs:
  Ra_lad: {quantity: vascular_resistance, unit: mmHg*s/ml}
  Rm_lad: {quantity: microvascular_resistance_mean, unit: mmHg*s/ml}
  Rv_lad: {quantity: vascular_resistance, unit: mmHg*s/ml}
  Ra_lcx: {quantity: vascular_resistance, unit: mmHg*s/ml}
  Rm_lcx: {quantity: microvascular_resistance_mean, unit: mmHg*s/ml}
  Rv_lcx: {quantity: vascular_resistance, unit: mmHg*s/ml}
  Ra_rca: {quantity: vascular_resistance, unit: mmHg*s/ml}
  Rm_rca: {quantity: microvascular_resistance_mean, unit: mmHg*s/ml}
  Rv_rca: {quantity: vascular_resistance, unit: mmHg*s/ml}
outputs:
  lad_share: {quantity: lad_share_of_left_flow, unit: percent}
  left_share: {quantity: left_coronary_flow_fraction, unit: percent}
settings: {}
from_words: true
stochastic: false
