id: area_to_diameter
name: diameter of a circular vessel cross-section from its area (Supp. MAE normalisation)
role: processing
stated: {page: 14, quote: "The cross sections correspond to diameters of 2.89 mm", where: "Supp. normalisation of data"}
equation: "d = sqrt(4 A / pi)"
inputs:
  A: {quantity: cross_sectional_area, unit: mm^2}
outputs:
  d: {quantity: vessel_diameter, unit: mm}
settings: {}
from_words: true
stochastic: false
