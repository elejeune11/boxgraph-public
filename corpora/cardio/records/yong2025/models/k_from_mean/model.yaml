id: k_from_mean
name: resistance factor k such that the cycle mean of Rmicro(t) equals the constant resistance (Sec. 2.3)
role: model
stated: {page: 3, printed_page: "3", quote: "with k determined such that mean Rmicro (t) match the desired constant", where: "text after Eq. 9"}
equation: "mean over the cycle of Rmicro(t) (Eq. 10 or 11, kPH = 1) = Rmicro_bar, solved for k"
inputs:
  frac: {quantity: basal_resistance_fraction, unit: percent}
  Tvc: {quantity: contraction_duration, unit: s}
  Tvr: {quantity: relaxation_duration, unit: s}
  T: {quantity: heart_period, unit: s}
outputs:
  k: {quantity: resistance_scale_factor, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
