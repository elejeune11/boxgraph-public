id: coronary_waveform
name: waveforms of the closed-loop coronary circulation (Eqs. 1-12) at a phase of the cycle
role: model
stated:
  page: 2
  printed_page: '2'
  quote: The coronary circulation is modelled using a closed-loop LPM as
  where: Sec. 2, Eqs. 1-14, Fig. 1, Supp. Tables S1-S2
equation: Q_k = (P_k,1 - P_k,2)/R_k (1); Q_k = dC_k(P_k,lumen - P_k,ext)/dt (2); E_k(t) = (E_k,max - E_k,min) e_n(t) + E_k,min (3); e_v(t) = 1/2[1 - cos(pi t/T_vc)], 0<=t<=T_vc; 1/2[1 + cos(pi (t - T_vc)/T_vr)],
  T_vc<t<=T_vc+T_vr; 0 after (4); e_a(t) as Eq. 5; Q_valve = (P_n,1 - P_n,2)/R_valve, R_valve = R_open or R_closed (6); Rmicro-LCA(t) = [(sqrt(k_LCA Rbar) - sqrt(0.7 Rbar)) e_n(t) + sqrt(0.7 Rbar)]^2 (10);
  Rmicro-RCA(t) = [(k_PH sqrt(k_RCA Rbar) - sqrt(0.75 Rbar)) e_n(t) + sqrt(0.75 Rbar)]^2 (11); P_k,ext = P_im = 0.6 P_V (12); pDSFR = max_{Tes<=t<=Ted} Q / max_{0<=t<=Tes} Q (13); mDSFR = int_{Tes}^{Ted}
  Q dt / int_0^{Tes} Q dt (14); circuit of Fig. 1
