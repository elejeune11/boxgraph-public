- id: run_Z0_printed_inputs
  model: char_impedance
  inputs: {Lp: Lp_aorta_printed, Cp: Cp_aorta_printed}
  outputs: {Z0: Z0_from_printed_pred}
- id: run_Z0_segment_2a
  model: char_impedance
  inputs: {Lp: s2a_Lp_pred, Cp: s2a_Cp_pred}
  outputs: {Z0: Z0_from_2a_pred}
- id: run_c_printed_inputs
  model: phase_velocity
  inputs: {Lp: Lp_aorta_printed, Cp: Cp_aorta_printed}
  outputs: {c: c_from_printed_pred}
- id: run_c_segment_2a
  model: phase_velocity
  inputs: {Lp: s2a_Lp_pred, Cp: s2a_Cp_pred}
  outputs: {c: c_from_2a_pred}
- id: run_lumping_15cps
  model: lumping_error
  inputs: {gdz: gdz_15cps}
  outputs: {err_L: err_L_pred, err_pi: err_pi_pred}
- id: run_rc_normal
  model: rc_decay
  inputs: {R: R_normal, Ctot: total_compliance_pred, k: k_normal}
  outputs: {tau: tau_normal_pred}
- id: run_rc_stiff
  model: rc_decay
  inputs: {R: R_normal, Ctot: total_compliance_pred, k: k_stiff}
  outputs: {tau: tau_stiff_pred}
- id: run_rc_high_caption
  model: rc_decay
  inputs: {R: R_high, Ctot: total_compliance_pred, k: k_normal}
  outputs: {tau: tau_high_caption_pred}
- id: run_rc_high_twice
  model: rc_decay
  inputs: {R: R_high_twice, Ctot: total_compliance_pred, k: k_normal}
  outputs: {tau: tau_high_twice_pred}
- id: run_rc_low
  model: rc_decay
  inputs: {R: R_low, Ctot: total_compliance_pred, k: k_normal}
  outputs: {tau: tau_low_pred}
- id: run_translation
  model: unit_translation
  inputs: {kp: kp_coefficient, kq: kq_printed, kt: kt_printed}
  outputs: {kR: kR_pred, kL: kL_pred, kC: kC_pred, kV: kV_pred}
- id: run_Z0_s5c
  model: char_impedance
  inputs: {Lp: s5c_Lp_pred, Cp: s5c_Cp_pred}
  outputs: {Z0: Z0_s5c_pred}
  note: "Z0 of the last abdominal aorta segment, the mother vessel of the aortic bifurcation (added by the audit)"
- id: run_Z0_s6a
  model: char_impedance
  inputs: {Lp: s6a_Lp_pred, Cp: s6a_Cp_pred}
  outputs: {Z0: Z0_s6a_pred}
  note: "Z0 of the common iliac artery (paired, D), the daughters of the aortic bifurcation (added by the audit)"
- id: run_reflection_aortic_bifurcation
  model: branch_reflection
  inputs: {Z0_m: Z0_s5c_pred, Z0_d1: Z0_s6a_pred, Z0_d2: Z0_s6a_pred}
  outputs: {Gamma: gamma_aortic_bifurcation_pred}
  note: "Added choice: the aortic bifurcation (5C into two 6A) as an example branch point, daughters loaded by their own Z0 (see q_branch_choice)"
- id: run_stiffening
  model: stiffening_increase
  inputs: {k: k_stiff}
  outputs: {dZ: dZ_stiff_pred, dc: dc_stiff_pred}
