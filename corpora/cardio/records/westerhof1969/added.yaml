- id: k_normal
  quantity: compliance_reduction_factor
  unit: dimensionless
  printed: "1"
  basis: The normal setting of the model has every capacitor at its Table 1 value; the paper states no factor because none is applied.
  alternatives: []
  stands_for: "the 'normal' capacitor setting C (p. 128, switch values C/4, C/2, C, 2C, 4C)"
- id: R_high_twice
  quantity: total_peripheral_resistance
  unit: g/cm^4/s
  printed: "2840"
  basis: "The text (p. 136) says all peripheral resistances were made 'twice as large' as normal (2 x 1420), while the Fig. 9(b) caption prints R = 3600; this is the text's version, used beside the caption's."
  alternatives: ["3600", "3400"]
  stands_for: R of the high-peripheral-resistance case
- id: kp_coefficient
  quantity: tf_pressure
  unit: dimensionless
  printed: "1"
  basis: "Table 2 prints 1 mmHg = b V: the coefficient of the unstated scale b is 1. b cancels in the resistance, inertance and distensibility translations, and the volume translation is also given per b."
  alternatives: []
  stands_for: "b V per mmHg, divided by b (Table 2)"
