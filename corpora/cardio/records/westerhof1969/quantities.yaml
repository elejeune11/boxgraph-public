- {id: segment_length, name: length of an arterial segment, dimension: "[length]", description: "Delta z, the length of one lumped segment of artery (Table 1)"}
- {id: internal_radius, name: internal radius of an artery, dimension: "[length]", description: "r in Table 1 and the Fig. 1 formulas"}
- {id: wall_thickness, name: arterial wall thickness, dimension: "[length]", description: "h in Table 1 and the Fig. 1 formulas"}
- {id: youngs_modulus, name: Young's modulus of the vessel wall, dimension: "[mass]/[length]/[time]**2", description: "E (static Young's modulus)"}
- {id: blood_viscosity, name: viscosity of blood, dimension: "[mass]/[length]/[time]", description: "eta"}
- {id: blood_density, name: density of blood, dimension: "[mass]/[length]**3", description: "rho"}
- {id: segment_compliance, name: total compliance of one segment, dimension: "[length]**4*[time]**2/[mass]", description: "C' times Delta z: the capacitor of one segment (Table 1, Total segment Compliance C)"}
- {id: segment_inertance, name: inertance of one segment (first inductor), dimension: "[mass]/[length]**4", description: "L'_1 times Delta z (Table 1, L_1)"}
- {id: segment_resistance, name: Poiseuille resistance of one segment (first resistor), dimension: "[mass]/[length]**4/[time]", description: "R'_1 times Delta z (Table 1, R_1)"}
- {id: compliance_per_length, name: compliance per unit length of artery, dimension: "[length]**3*[time]**2/[mass]", description: "C' (transverse capacitance per unit length)"}
- {id: inertance_per_length, name: inertance per unit length of artery, dimension: "[mass]/[length]**5", description: "L'_1 = rho / S, inertance per unit length"}
- {id: characteristic_impedance, name: characteristic impedance of an artery, dimension: "[mass]/[length]**4/[time]", description: "Z0, approximated by sqrt(L'/C') (Eq. 1)"}
- {id: phase_velocity, name: local phase velocity of the pressure wave, dimension: "[length]/[time]", description: "c, approximated by 1/sqrt(L'C') (Eq. 3)"}
- {id: gamma_dz, name: propagation constant times segment length, dimension: dimensionless, description: "gamma Delta z for a lumped segment at a given frequency"}
- {id: lumping_error_inverted_l, name: relative error in characteristic impedance from lumping with an inverted L network, dimension: dimensionless, description: "error in Z0 of the lumped line, inverted-L segments"}
- {id: lumping_error_pi, name: relative error in characteristic impedance from lumping with a symmetrical (Pi) network, dimension: dimensionless, description: "error in Z0 of the lumped line, Pi segments"}
- {id: total_arterial_length, name: total length of all arteries modeled, dimension: "[length]", description: "sum of segment lengths over the whole model"}
- {id: total_compliance, name: total compliance of the arterial tree, dimension: "[length]**4*[time]**2/[mass]", description: "sum of all capacitors of the model"}
- {id: total_peripheral_resistance, name: total peripheral resistance of the systemic tree, dimension: "[mass]/[length]**4/[time]", description: "R, the parallel combination of all peripheral resistances"}
- {id: compliance_reduction_factor, name: factor by which all capacitances are divided, dimension: dimensionless, description: "1 for the normal model; 2 for the 'old age hypertension' (stiff) setting"}
- {id: pressure_decay_time_constant, name: time constant of diastolic pressure decay in the ascending aorta, dimension: "[time]"}
- {id: tf_pressure, name: electric volts per mmHg of the analog (per unit b), dimension: dimensionless, description: "Table 2: 1 mmHg = b V; the coefficient of b"}
- {id: tf_flow, name: electric amperes per cm3/s of the analog (per unit b), dimension: dimensionless, description: "Table 2: 1 cm3/s = 0.752 b 10^3 amp; the coefficient of b"}
- {id: tf_time, name: electric seconds per hemodynamic second, dimension: dimensionless, description: "Table 2 time scaling"}
- {id: tf_volume, name: electric coulombs per cm3 (per unit b), dimension: dimensionless, description: "Table 2: 1 cm3 = 0.752 b 10^-6 C; the coefficient of b"}
- {id: tf_resistance, name: ohms per g cm-4 s-1, dimension: dimensionless, description: "Table 2 resistance translation"}
- {id: tf_inertance, name: henries per g cm-4, dimension: dimensionless, description: "Table 2 inertance translation"}
- {id: tf_distensibility, name: farads per g-1 cm4 s2, dimension: dimensionless, description: "Table 2 distensibility translation"}
- {id: reflection_coefficient, name: reflection coefficient for a forward wave at a branch point, dimension: dimensionless, description: "Gamma_L of Eq. 5, with the load formed by the daughter branches"}
- {id: relative_increase_input_impedance, name: relative increase of the input impedance level, dimension: dimensionless, description: "increase of the average level of |Z_in| (or Z0) of the stiff system over the normal one"}
- {id: relative_increase_wave_velocity, name: relative increase of the pulse wave velocity, dimension: dimensionless, description: "increase of the (foot-to-foot or phase) wave velocity of the stiff system over the normal one"}
- {id: frequency, name: frequency of a harmonic, dimension: "1/[time]", description: "f, the abscissa of Figs. 3, 5, 6, 7 and 10 (cps)"}
- {id: input_impedance_modulus, name: modulus of the input impedance, dimension: "[mass]/[length]**4/[time]", description: "|Z_in|, pressure harmonic over flow harmonic at the input (Figs. 3, 10)"}
- {id: input_impedance_phase, name: phase of the input impedance, dimension: dimensionless, description: "phase angle of Z_in, in degrees (Figs. 3, 5, 6, 10)"}
- {id: normalized_input_impedance_modulus, name: modulus of the input impedance over the peripheral resistance times 100, dimension: dimensionless, description: "|Z_in|/R x 100, the ordinate of Figs. 5 and 6 (R is the bed's peripheral resistance)"}
- {id: apparent_wave_velocity, name: apparent phase velocity of a pressure harmonic in the aorta, dimension: "[length]/[time]", description: "c_app = f x 360 x dz / dphi (p. 12), the ordinate of Fig. 7"}
- {id: leg_peripheral_resistance, name: peripheral resistance of a whole leg, dimension: "[mass]/[length]**4/[time]", description: "R of Fig. 5, the d-c resistance the leg's |Z_in| is divided by"}
