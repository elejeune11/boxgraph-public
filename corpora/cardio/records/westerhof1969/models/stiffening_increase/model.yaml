id: stiffening_increase
name: increase of characteristic impedance and wave velocity when all capacitances are divided by k
role: model
stated: {page: 17, printed_page: "136", quote: "wave velocity is about 50 per cent higher, as", where: "text, p. 136 ('as expected'), with Eqs. 1 and 3 as approximated on p. 140"}
equation: "Z0 ~ sqrt(L'/C'), c ~ 1/sqrt(L'C'); C' -> C'/k multiplies both by sqrt(k): increase = sqrt(k) - 1"
inputs:
  k: {quantity: compliance_reduction_factor, unit: dimensionless}
outputs:
  dZ: {quantity: relative_increase_input_impedance, unit: percent}
  dc: {quantity: relative_increase_wave_velocity, unit: percent}
settings: {}
from_words: true
built_from: [char_impedance, phase_velocity]
stochastic: false
