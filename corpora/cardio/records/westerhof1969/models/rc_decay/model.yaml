id: rc_decay
name: RC time of the model (windkessel decay time)
role: model
stated: {page: 17, printed_page: "136", quote: "mental error, equal to the respective RC", where: "text, p. 136"}
equation: "tau = R C, C = sum of all capacitors (divided by the compliance factor k), R = peripheral resistance of the entire system"
inputs:
  R: {quantity: total_peripheral_resistance, unit: g/cm^4/s}
  Ctot: {quantity: total_compliance, unit: cm^4*s^2/g}
  k: {quantity: compliance_reduction_factor, unit: dimensionless}
outputs:
  tau: {quantity: pressure_decay_time_constant, unit: s}
settings: {}
from_words: true
built_from: [total_compliance]
stochastic: false
