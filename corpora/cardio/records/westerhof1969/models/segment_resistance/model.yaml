id: segment_resistance
name: first resistor of the longitudinal impedance of a segment (Fig. 1, n = 1)
role: model
stated: {page: 4, printed_page: "124", quote: "by multiplying R; Ra, Lk and C' by AZ", where: "Fig. 1 key, R'_n"}
equation: "R'_n = 8 pi eta n / S^2, S = pi r^2; R_1 = R'_1 Delta z"
inputs:
  eta: {quantity: blood_viscosity, unit: P}
  r: {quantity: internal_radius, unit: cm}
  dz: {quantity: segment_length, unit: cm}
outputs:
  R: {quantity: segment_resistance, unit: g/cm^4/s}
settings: {n: 1}
stochastic: false
