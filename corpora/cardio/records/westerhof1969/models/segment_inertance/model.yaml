id: segment_inertance
name: first inductor of the longitudinal impedance of a segment (Fig. 1, n = 1)
role: model
stated: {page: 4, printed_page: "124", quote: "by multiplying R; Ra, Lk and C' by AZ", where: "Fig. 1 key, L'_n"}
equation: "L'_n = (rho / S) 1/(2n - 1), S = pi r^2; L_1 = L'_1 Delta z"
inputs:
  rho: {quantity: blood_density, unit: g/cm^3}
  r: {quantity: internal_radius, unit: cm}
  dz: {quantity: segment_length, unit: cm}
outputs:
  L: {quantity: segment_inertance, unit: g/cm^4}
  Lp: {quantity: inertance_per_length, unit: g/cm^5}
settings: {n: 1}
stochastic: false
