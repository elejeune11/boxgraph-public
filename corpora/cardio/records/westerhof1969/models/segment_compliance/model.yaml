id: segment_compliance
name: transverse capacitance of a segment of artery (Fig. 1)
role: model
stated: {page: 4, printed_page: "124", quote: "by multiplying R; Ra, Lk and C' by AZ", where: "Fig. 1 key, C'"}
equation: "C' = 3 pi r^2 (a + 1)^2 / (E (2a + 1)), a = r/h; C = C' Delta z"
inputs:
  r: {quantity: internal_radius, unit: cm}
  h: {quantity: wall_thickness, unit: cm}
  E: {quantity: youngs_modulus, unit: g/cm/s^2}
  dz: {quantity: segment_length, unit: cm}
outputs:
  C: {quantity: segment_compliance, unit: cm^4*s^2/g}
  Cp: {quantity: compliance_per_length, unit: cm^3*s^2/g}
settings: {}
stochastic: false
