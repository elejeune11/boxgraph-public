id: branch_reflection
name: reflection coefficient at a bifurcation for a forward wave (Eq. 5 with a parallel load)
role: model
stated: {page: 22, printed_page: "139", quote: "The load reflection coefficient may be defined", where: "Eq. 5; load at a bifurcation, p. 140"}
equation: "Gamma_L = (Z_L - Z_0)/(Z_L + Z_0), Z_L = parallel combination of the input impedances of the two daughter branches (taken as their characteristic impedances)"
inputs:
  Z0_m: {quantity: characteristic_impedance, unit: g/cm^4/s, description: "Z_0 of the mother vessel"}
  Z0_d1: {quantity: characteristic_impedance, unit: g/cm^4/s, description: "input impedance of daughter branch 1"}
  Z0_d2: {quantity: characteristic_impedance, unit: g/cm^4/s, description: "input impedance of daughter branch 2"}
outputs:
  Gamma: {quantity: reflection_coefficient, unit: dimensionless}
settings: {}
from_words: true
built_from: [char_impedance]
stochastic: false
