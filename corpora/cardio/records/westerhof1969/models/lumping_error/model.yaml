id: lumping_error
name: order of the lumping error in characteristic impedance, inverted-L vs symmetrical (Pi) segments
role: model
stated: {page: 10, printed_page: "130", quote: "resulting from lumping are in the", where: "Section D, p. 130"}
equation: "error in Z0 (inverted L) ~ (gamma Delta z / 2); error in Z0 (Pi) ~ (gamma Delta z / 2)^2"
inputs:
  gdz: {quantity: gamma_dz, unit: dimensionless}
outputs:
  err_L: {quantity: lumping_error_inverted_l, unit: percent}
  err_pi: {quantity: lumping_error_pi, unit: percent}
settings: {}
from_words: true
stochastic: false
