id: char_impedance
name: characteristic impedance of a lossless artery (Eq. 1, approximated)
role: model
stated: {page: 23, printed_page: "140", quote: "impedance of the ascending aorta is (from", where: "Eq. 1 and p. 140"}
equation: "Z0 = sqrt(Z_l' Z_t') ~ sqrt(L_1'/C')"
inputs:
  Lp: {quantity: inertance_per_length, unit: g/cm^5}
  Cp: {quantity: compliance_per_length, unit: cm^3*s^2/g}
outputs:
  Z0: {quantity: characteristic_impedance, unit: g/cm^4/s}
settings: {}
stochastic: false
