- id: q_4b_resistance
  kind: possible_error
  about: [s4b_R, cmp_R_s4b]
  text: "Table 1 prints R_1 = 1.62 g cm^-4 s^-1 for segment 4B (r = 0.675 cm, dz = 5.2 cm), but 8 eta dz/(pi r^4) gives 1.91 (+18%). L_1 of the same row (3.82) agrees with r = 0.675, and the neighbouring rows 4A and 4C reproduce, so the R_1 entry, not the radius, looks off."
  citation: {page: 6, quote: "48 Aorta thoracalis", where: "Table 1, 4B"}
- id: q_9d_compliance
  kind: possible_error
  about: [s9d_C, cmp_C_s9d]
  text: "Table 1 prints C = 2.24 x 10^-6 for segment 9D (r = 0.238, h = 0.050, E = 4.0, dz = 6.1); Fig. 1's C' formula gives 2.57 (+15%). Per unit length the printed value (0.367) is lower than both neighbours, 9C (0.462) and 9E (0.369), although 9D's radius lies between theirs."
  citation: {page: 6, quote: "9D A.femoraiis", where: "Table 1, 9D"}
- id: q_9b_compliance
  kind: unexplained_difference
  about: [s9b_C, cmp_C_s9b]
  text: "Segment 9B: printed C = 3.30 x 10^-6, computed 3.15 (-4.7%), well beyond the rounding of r and h."
  citation: {page: 6, quote: "9B A.femoralis", where: "Table 1, 9B"}
- id: q_table1_rounding
  kind: unexplained_difference
  about: [cmp_C_s2b, cmp_C_s4a, cmp_R_s5a, cmp_C_s17a, cmp_C_s18a, cmp_C_s19a, cmp_R_s26ag, cmp_C_s26ag, cmp_C_s26aa]
  text: "Most Table 1 elements recomputed from the printed r, h, E and dz agree within 1-3%, which is still outside the printed precision (3 significant figures), so the strict verdict is often 'not reproduced'. L_1 and R_1 mostly reproduce; C fails most often. The radii and wall thicknesses are printed to 2-3 significant figures and C depends steeply on r/h (R_1 on r^-4: r = 0.083 vs 0.0841 alone moves R_1 by 5%, cf. 26AG/26AJ/26BF/26BI). So the table was probably computed from unrounded radii and thicknesses (scaled from Noordergraaf 1956 and Fry et al. 1964), which the paper does not give."
- id: q_total_length
  kind: unexplained_difference
  about: [cmp_total_length, total_length_printed]
  text: "The paper says the total length of the arteries modeled is 720 cm. The Table 1 segment lengths, with paired (D) rows counted twice to make the 121 segments, sum to 706.8 cm (-1.8%)."
  citation: {page: 8, quote: "The total length of the arteries modeled is 720 cm", where: text}
- id: q_high_resistance
  kind: possible_error
  about: [R_high, R_high_twice, cmp_tau_high_caption, cmp_tau_high_twice, tau_high]
  text: "The text says that in the high-resistance case all peripheral resistances were made twice as large as normal (2 x 1420 = 2840), but the Fig. 9(b) caption prints R = 3600, and Fig. 11(a) prints R = 3400 for a 'twice' case. With R = 3600 and the sum of the Table 1 capacitors (5.91 x 10^-4 g^-1 cm^4 s^2), RC = 2.13 s against the printed decay time 1.66 s. With R = 2840, RC = 1.68 s. The caption's R does not fit the paper's own statement that decay times are close to the RC times. Likewise the low case: Fig. 9(c) prints 850, while half of 1420 is 710 (RC 0.50 s vs 0.42 s, against 'about 0.5')."
  citation: {page: 17, quote: "twice as large and two, in which they are", where: text}
- id: q_table2_flow
  kind: possible_error
  about: [kq_printed, cmp_kR, cmp_kV, cmp_kL, cmp_kC]
  text: "Table 2 prints flow 1 cm3/s = 0.752 b 10^3 amp (positive exponent on the page image). With 1 mmHg = b V, this gives 1 g cm^-4 s^-1 = 1.0 x 10^-6 ohm (printed: 1 ohm) and 1 cm3 = 0.752 b C (printed: 0.752 b 10^-6 C). With 0.752 b 10^-3 amp, every line of Table 2 (resistance 1 ohm, inertance 10^-3 H, distensibility 10^-3 F, volume 0.752 b 10^-6 C) follows. The flow exponent looks like a sign misprint. The record keeps the printed 10^3."
  citation: {page: 8, quote: "Flow 1cm%ec-' = O-752 b 10s amp", where: "Table 2"}
- id: q_b_unstated
  kind: unstated_input
  about: [kp_coefficient]
  text: "Table 2's pressure scale b (1 mmHg = b V) is never given. It cancels in the impedance translations; the record carries only its coefficient 1 as an added input."
- id: q_network_not_runnable
  kind: unstated_input
  about: [arterial_tree_analog]
  text: "The full 121-segment network (Fig. 2) produces the paper's main results: input impedances (Figs. 3, 5, 6, 10), wave travel (Figs. 4, 7, 10) and pressure and flow wave shapes (Figs. 8, 9, 11). It cannot be rebuilt from this paper alone. The regional peripheral resistances are only referred to Westerhof (1968). The interconnection is given only as a drawing (Fig. 2). The correction-network depth n (3 to 5, 'depending upon the radius') is given per segment only through the 'last element' column."
  citation: {page: 5, quote: "A table of the values is given by", where: text}
- id: q_proximal_aorta_values
  kind: reading
  about: [Lp_aorta_printed, Cp_aorta_printed, cmp_Lp_segment_2a, cmp_Cp_segment_2a]
  text: "p. 140 uses L' = 0.15 and C' = 27 x 10^-6 for the 'proximal aorta' without units or a segment. The record compares them with the per-unit-length values of segment 2A (0.155 and 26.7 x 10^-6), which both reproduce. Segment 2B or an average would serve too."
- id: q_lumping_order
  kind: overstated_claim
  about: [cmp_err_L, cmp_err_pi, err_L_printed]
  text: "The 25% and 6% errors are order-of-magnitude statements ('in the order of (gamma dz/2)'), evaluated at gamma dz 'about 0.5'. The record reproduces them as (gamma dz/2) and (gamma dz/2)^2, which is how the paper evidently computed them. They are not error bounds."
- id: q_dz_range
  kind: unexplained_difference
  about: [dz_range_printed, s20a_dz, s19a_dz, s27b_dz]
  text: "p. 124 says the segment length dz ranges from 2 to 7.5 cm in the model, but Table 1 prints dz = 1.0 cm for 20A (A. coelica), 7.9 cm for 19A and 7.7 cm for 27B. (Added by the audit.)"
  citation: {page: 4, quote: "ranges from 2 to 7.5 cm in", where: text}
- id: q_radius_threshold
  kind: unexplained_difference
  about: [r_individual_printed, s11e_r, s12a_r, s18d_r, s19a_r, s26af_r, s26ag_r]
  text: "The Discussion (p. 137) says the model accounts individually for arteries larger than 0.15 cm in radius and for smaller ones in regional combinations (p. 125: peripheral beds of 'radii generally smaller than 0.15 cm'). Table 1 has 16 rows with r below 0.15 cm: 11E (0.141), 12A-12E (0.130), 18D (0.142), 19A (0.091), 26AF/AI/BE/BH (0.129) and 26AG/AJ/BF/BI (0.083). (Added by the audit.)"
  citation: {page: 19, quote: "larger than O-15cm in radius and for smaller", where: "Discussion"}
- id: q_branch_choice
  kind: choice
  about: [run_reflection_aortic_bifurcation, cmp_gamma_aortic_bifurcation, gamma_branch_printed]
  text: "The paper gives no branch point for its 'in the order of 0.1 or smaller'. The audit checks one: the aortic bifurcation (5C into two 6A). Each daughter's input impedance is taken as its own Z0 = sqrt(L'/C'). This follows p. 140, where reflections of forward waves are small and the load is the parallel combination of the daughters' input impedances. Other branch points (aortic arch, renal, iliac/femoral) would give other values. The topology for them is only drawn (Fig. 2). (Added by the audit.)"
  citation: {page: 23, quote: "parallel combination of the input impedances", where: text}
- id: q_stiff_expected
  kind: reading
  about: [cmp_dZ_stiff, cmp_dc_stiff, stiffening_increase]
  text: "The paper says the foot-to-foot velocity of the stiff system (all C halved) is 'about 50 per cent higher, as expected' and the input impedance level is 'about 50 per cent' higher. The lossless relations it uses (Z0 ~ sqrt(L'/C'), c ~ 1/sqrt(L'C'), p. 140) give sqrt(2) - 1 = 41%. The audit reads 'as expected' this way; the paper does not state which expectation it means. (Added by the audit.)"
  citation: {page: 17, quote: "wave velocity is about 50 per cent higher, as", where: text}
- id: q_impedance_level_85
  kind: reading
  about: [Z0_aorta_printed, cmp_Z0_printed_inputs]
  text: "p. 139 says the whole-tree input impedance stays near 85 g cm^-4 s^-1 at higher frequencies (from Fig. 6), 'of the same value as the characteristic impedance of the proximal aorta'. p. 140 computes that impedance as 75. The first reader left the 85 out because it is read off Fig. 6. A figure reading could add it as a consistency comparison. (Added by the audit.)"
  citation: {page: 22, quote: "mains in the neighborhood of 85 g cm-4sec-1", where: text}
- id: q_figures_not_read
  kind: reading
  about: [arterial_tree_analog]
  text: "The plotted results (Figs. 3-7, 10) were not digitized in this reading because the page-rendering figure tools were not available to the reader. The Luchsinger, Patel and Gabe measurements in Figs. 4-7 are human data that later records could validate models against."
- id: q_validation_human_subjects
  kind: choice
  about: [char_impedance, total_compliance, Lp_aorta_printed, Cp_aorta_printed]
  text: "(Cross-validation with stergiopulos1999: validations val_Z0_aorta_vs_rc_std_hA, val_Z0_aorta_vs_rc_std_hC, val_Ctot_vs_cppm_hA, val_Ctot_vs_car_hA, val_Ctot_vs_cppm_hC, val_Ctot_vs_car_hC.) The analog's aortic characteristic impedance (p. 140) and summed compliance are set against Z_c and C measured in two human subjects in Stergiopulos et al. 1999, Table 2 (type A and type C beats; C by both the pulse pressure and the area method, since neither is preferred there). The analog is a generic normal adult tree, not either subject, so which subject, if any, it should match is open; each pairing is entered. The summed compliance leaves out the arteries below about 0.15 cm radius (p. 137) and so is expected to fall short of an in vivo total compliance. The models are not fitted to these data, so the entries are validations."
- id: q_no_windkessel_validation
  kind: choice
  about: [tau_normal, tau_stiff, tau_high, tau_low, dZin_stiff_printed, dc_stiff_printed, fig7_luchsinger_fig, fig7_gabe_fig]
  text: "(Cross-validation with stergiopulos1999.) No measurement of this record is validated against the windkessel models of Stergiopulos et al. (zin_3wk, zin_4wk, input impedance only). The decay times and the 'about 50 per cent' changes are measured on the analog, not in man, and are predicted by this record's own models; a windkessel impedance model gives no decay time and no wave velocity, and the 50 per cent statements are approximate (no verdict). The apparent wave velocities of Luchsinger and Gabe (Fig. 7) are wave-travel quantities that a lumped model does not produce. The measured human input impedances of Fig. 6 (Patel, Gabe) are not read (figures.md), so there is no curve to run the windkessels against."
- id: q_no_validation_vs_westerhof1971
  kind: choice
  about: [rc_decay, char_impedance, phase_velocity, total_compliance, arterial_tree_analog]
  text: "(Cross-validation with westerhof1971.) No model of this record is validated against a measurement of westerhof1971. That paper's measurements are the perfusate viscosity and density, the d-c resistances and input impedances of its hydraulic models of the dog and cat systemic and pulmonary trees (Figs. 2-5), and literature in vivo impedances of the dog (dots of Figs. 2-3). This record's models describe the human systemic tree (and its analog) and the network that would give an input impedance is not runnable (q_network_not_runnable); the hydraulic models are windkessels whose decay time and compliance were set by design, not measured. The reverse direction is entered in westerhof1971 (val_tau_man_vs_analog_*: its tau = Rp C against this record's measured decay times; q_val_analog_decay). The analog's impedance curves (Figs. 3e, 6, 10a) are recorded as the model's predictions, not measurements, so westerhof1971's three-element model is not validated against them; the stiff-system 'about 50 per cent' changes and the Fig. 7 wave velocities are quantities its models do not produce."
- id: q_no_validation_vs_westerhof2009
  kind: choice
  about: [char_impedance, total_compliance, rc_decay, phase_velocity, arterial_tree_analog, tau_normal, tau_stiff, tau_high, tau_low, fig7_luchsinger_fig, fig7_gabe_fig]
  text: "(Cross-validation with westerhof2009, which cites this paper as ref. 71.) No validation is entered in either direction. westerhof2009's measurements are aortic input impedance modulus and phase (its Fig. 4, from ref. 76; Fig. 6, human type A and C beats from Murgo et al., ref. 39), ascending aortic pressure (Fig. 6) and isolated cat-heart peak and minimum pressure and peak flow (Fig. 8, ref. 15). Of this record's models, only the analog network (arterial_tree_analog) would give an input impedance or a pressure wave, and it is not runnable (q_network_not_runnable). The runnable ones give the aortic characteristic impedance, phase velocity, summed compliance and RC decay time, none of which westerhof2009 measures. The high-frequency input impedance modulus in its Fig. 6 is not the characteristic impedance: westerhof2009 says only that the two are about equal (p. 3), so Z0 was not set against it. westerhof2009 cites this paper only as a distributed model and as a source of the three-element windkessel's characteristic impedance ('in the three-element Windkessel [71, 73]', p. 3). It does not say that this paper's model explains any of its data. For the other direction, see westerhof2009 q_no_validation_on_westerhof1969."
- id: q_no_validation_vs_olufsen2004
  kind: choice
  about: [rc_decay, char_impedance, phase_velocity, total_compliance, segment_inertance, arterial_tree_analog]
  text: "(Cross-validation with olufsen2004, which cites this paper as ref. 34.) No validation is entered in either direction. olufsen2004 is analytical and records no measurement (no datum of origin measured, no figure of data), so no model of this record can be judged against it. For the reverse direction, see olufsen2004 q_no_validation_vs_westerhof1969: none of its models gives a decay time, a relative change of impedance level or wave velocity, or an apparent wave velocity, the quantities measured here."
- id: q_no_validation_vs_stergiopulos1992
  kind: choice
  about: [rc_decay, char_impedance, phase_velocity, total_compliance, stiffening_increase, arterial_tree_analog, tau_normal, tau_stiff, tau_high, tau_low, fig7_luchsinger_fig, fig7_gabe_fig]
  text: "(Cross-validation with stergiopulos1992, which cites this paper for its segment compliances.) No validation is entered in either direction. stergiopulos1992's measurements are the pulsatility indices of Gosling et al. (Fig. 7) and the segmental systolic pressure indices of Fronek et al. (p. 9). This record's runnable models give a characteristic impedance, phase velocity, segment and total compliance, an RC decay time and the stiff-system changes; none gives a pulsatility index or a systolic pressure ratio, and the analog network that would give pressure waves is not runnable (q_network_not_runnable). In the other direction, stergiopulos1992's models give no decay time, impedance level or apparent wave velocity, the quantities measured here, and stergiopulos1992 does not say its model explains any of this paper's data. See stergiopulos1992 q_no_validation_vs_westerhof1969."
- id: q_no_validation_vs_formaggia2003
  kind: choice
  about: [rc_decay, char_impedance, phase_velocity, total_compliance, stiffening_increase, arterial_tree_analog, tau_normal, tau_stiff, tau_high, tau_low, fig7_luchsinger_fig, fig7_gabe_fig]
  text: "(Cross-validation with formaggia2003, which cites this paper as ref. 16, only as an example of lumped-parameter models.) No validation is entered in either direction. formaggia2003 records no measurement (no datum of origin measured; every plotted value there is the output of its own 1D models on idealized test channels), so no model of this record can be judged against it. For the reverse direction, see formaggia2003 q_no_validation_vs_westerhof1969: none of its models gives a decay time, a relative change of impedance level or wave velocity, or an apparent wave velocity of a whole tree, the quantities measured here, and formaggia2003 does not say its models explain any of this paper's data."
- id: q_no_validation_vs_olufsen2000
  kind: choice
  about: [rc_decay, char_impedance, phase_velocity, total_compliance, segment_compliance, segment_resistance, segment_inertance, arterial_tree_analog]
  text: "(Cross-validation with olufsen2000, which cites this paper as ref. 31.) No validation is entered in either direction. olufsen2000's measurements are, for one young subject, MR flows in time at the ascending aorta and nine sites (its Figs. 3, 7), cuff pressures 120/80 mmHg, the ascending-aortic radius 1.25 cm, the cycle length 1.1 s and heart rate 51 per minute. Only this record's analog network (arterial_tree_analog) would give flows or pressures in time, and it is not runnable (q_network_not_runnable); it also represents a generic adult, not that subject. The runnable models give a characteristic impedance, phase velocity, segment and total compliance, resistance and inertance, an RC decay time and the stiff-system changes; olufsen2000 measures none of these, and this record's radii are inputs, not predictions, so they cannot be set against the measured 1.25 cm. olufsen2000 cites this paper only for compliance estimates behind its stiffness formula (its p. 5), not as data either model explains. For the other direction see olufsen2000 q_no_validation_vs_westerhof1969."
- id: q_no_validation_vs_olufsen1999
  kind: choice
  about: [char_impedance, phase_velocity, rc_decay, total_compliance, segment_compliance, arterial_tree_analog]
  text: "(Cross-validation with olufsen1999, which cites this paper as ref. 53, for the volume compliances behind its Eh/r0 fit.) No validation is entered in either direction. olufsen1999's measurements are the cardiac output (4.14 l/min) and MR inflow of its ref. 20 (Fig. 4), the impedance modulus and phase md 0 / md 1 of Mills et al. (Fig. 9, which it calls brachiocephalic) and the pressure waves of Remington and Wood (Fig. 12). Only this record's analog network would give an input impedance spectrum, flows or pressure waves, and it is not runnable (q_network_not_runnable). char_impedance gives the characteristic impedance sqrt(L'/C') of the ascending aorta, a single number with no frequency input; p. 140 says only that the input impedance above about 2 cps 'should be close to' it, and figures.md already declines to compare an input impedance level with a characteristic impedance, so it is not set against the measured impedance moduli, whose site the measuring paper's reader does not even agree on (olufsen1999 q_fig9_data_source). The other runnable models give phase velocity, segment and total compliance, resistance, inertance, an RC decay time and the stiff-system changes, none of which olufsen1999 measures. For the other direction see olufsen1999 q_no_validation_vs_westerhof1969."
  citation: {page: 23, quote: "close to the characteristic impedance of the"}
- id: q_no_validation_vs_mynard2015
  kind: choice
  about: [char_impedance, phase_velocity, rc_decay, total_compliance, stiffening_increase, arterial_tree_analog]
  text: "(Cross-validation with mynard2015, which cites this paper as ref. 130, as one source of its systemic arterial network.) No validation is entered in either direction. mynard2015's measurements are literature reference values of Table 6 (heart rate, cardiac output, systemic and pulmonary vascular resistance, chamber volumes and ejection fractions, mean and pulse pressures, E/A ratios, dP/dt), a coronary sinus diameter of 0.81 cm, and the in vivo flow and pressure waveforms of its Fig. 4. This record's runnable models give the aortic characteristic impedance and phase velocity, segment and total compliance, resistance and inertance, an RC decay time, the stiff-system changes and unit factors; none of these is a quantity mynard2015 measures. Its resistances are per segment or the printed peripheral resistances (inputs), not a whole-body vascular resistance from pressure and flow, and its radii are inputs, so nothing predicts the coronary sinus diameter (the analog has no coronary or venous segments). The waveforms would need the analog network (arterial_tree_analog), which is not runnable (q_network_not_runnable), and represent other subjects. mynard2015 does not say this paper's model explains any of its data. For the other direction see mynard2015 q_no_validation_vs_westerhof1969."
