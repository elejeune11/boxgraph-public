  quantities: {stergiopulos1999/total_arterial_compliance: total_compliance}
  conditions_ok: "The analog represents a generic normal adult human tree; the measurement is one human subject (type A beat), by the pulse pressure method. Both are the total compliance of the human systemic arterial tree; the comparison tests whether the model's summed compliance is of the right size for man. The analog leaves out arteries below about 0.15 cm radius (p. 137), whose compliance the in vivo measurement includes."
  basis: "p. 136: the RC time uses C 'the summation of all the capacitors of the entire' system, the model's total compliance. Stergiopulos et al. compute the total compliance of their distributed model in the same way, 'by summing the volume compliances of all arterial segments' (p. 2), and compare it with C measured in vivo."
