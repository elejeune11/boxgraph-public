# Models of this record judged against measurements printed in stergiopulos1999 (human beats, Table 2).
# The analog is a model of the normal adult human systemic tree; Stergiopulos et al. report Z_c and C
# measured in two human subjects (type A and type C beats, data of their ref. 12). Neither paper fitted
# these models to those measurements, so these are validations.

# ---- Characteristic impedance of the ascending aorta (p. 140) vs measured Z_c (standard technique) ----
- id: val_Z0_aorta_vs_rc_std_hA
  model: char_impedance
  inputs: {Lp: Lp_aorta_printed, Cp: Cp_aorta_printed}
  output: Z0
  against: stergiopulos1999/rc_std_hA
  quantities: {stergiopulos1999/characteristic_impedance: characteristic_impedance}
  conditions_ok: "The analog represents a generic normal adult human tree; the measurement is one human subject (type A beat). Both are the characteristic impedance of the human proximal aorta, so the comparison tests whether the model's aortic properties are of the right size for man, not a subject-specific prediction."
  basis: "p. 140: for frequencies above about 2 cps 'the input impedance should be close to the characteristic impedance of the ascending aorta', which the model gives as sqrt(L'/C') from Table 1. Stergiopulos et al. measure Z_c as the average input-impedance modulus over the higher harmonics (standard technique), and relate Z_c to 'the local inertia and compliance of the very proximal ascending aorta' (p. 6, citing this paper, ref. 21)."
- id: val_Z0_aorta_vs_rc_std_hC
  model: char_impedance
  inputs: {Lp: Lp_aorta_printed, Cp: Cp_aorta_printed}
  output: Z0
  against: stergiopulos1999/rc_std_hC
  quantities: {stergiopulos1999/characteristic_impedance: characteristic_impedance}
  conditions_ok: "The analog represents a generic normal adult human tree; the measurement is one human subject (type C beat). Both are the characteristic impedance of the human proximal aorta, so the comparison tests whether the model's aortic properties are of the right size for man, not a subject-specific prediction."
  basis: "p. 140: for frequencies above about 2 cps 'the input impedance should be close to the characteristic impedance of the ascending aorta', which the model gives as sqrt(L'/C') from Table 1. Stergiopulos et al. measure Z_c as the average input-impedance modulus over the higher harmonics (standard technique), and relate Z_c to 'the local inertia and compliance of the very proximal ascending aorta' (p. 6, citing this paper, ref. 21)."

