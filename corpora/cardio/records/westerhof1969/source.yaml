notes: >
  Scanned paper; all numbers were read from 300-600 dpi renders of the page images (the OCR garbles exponents,
  e.g. "1.66" reads "166" and "11E 5.3" reads "9::"). In scope: (1) Table 1, the 79 printed rows (121 segments,
  D rows paired): for every row the total segment compliance C, inertance L_1 and resistance R_1 are recomputed
  from the printed r, h, E, dz and the Fig. 1 formulas with eta = 3 x 10^-2 P and rho = 1.05 g/cm3 (237
  reproduction comparisons); (2) the totals over the table: total length (printed 720 cm) and total compliance,
  which with the printed peripheral resistances gives the RC decay times that the paper compares with the
  measured 0.8, 0.4, 1.66 and about 0.5 s; (3) Z0 = sqrt(L'/C') and c = 1/sqrt(L'C') of the proximal aorta
  (p. 140), from the printed 0.15 and 27 x 10^-6 and from segment 2A; (4) the lumping-error orders (25%, 6%)
  at gamma dz = 0.5; (5) Table 2's hemodynamic-electric translation factors, checked against each other.
  Findings: L_1 and R_1 mostly reproduce; many C values and some R_1 miss by 1-3%, consistent with rounded
  inputs; 4B R_1 (+18%), 9D C (+15%) and 9B C (-5%) look like table errors; the summed segment lengths give
  706.8 cm, not 720; the Fig. 9(b) R = 3600 does not fit the measured 1.66 s, while the text's "twice" (2840)
  does; Table 2's flow factor 10^3 is inconsistent with the rest of the table, while 10^-3 would make every row agree.
  Left out: the full analog network (not runnable: peripheral resistances only in Westerhof 1968, topology
  only drawn; recorded as a non-runnable model), all plotted results (Figs. 3-7, 10, not digitized because
  the figure tools could not be run in this reading; see figures.md), oscillograph traces (Figs. 8, 9, 11), the
  "last element" column of Table 1 (structure of the correction network, no number to compare), the original
  E = 4 x 10^6, the 85 g cm-4 s-1 impedance level read off Fig. 6, the 2%/3 deg longitudinal-impedance
  tolerances, the stroke volume (83 cm3) and calibrations, and the Fig. 5 leg resistance, none of which feeds
  a runnable model. Unit note: Table 1's scaled column units are written with SI prefixes (Mg) because a
  numeric factor inside a unit string is not supported.
