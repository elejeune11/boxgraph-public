- {id: lumen_diameter, name: arterial lumen diameter, dimension: "[length]", description: "lumen diameter of an arterial segment at its proximal or distal end, at the reference transmural pressure"}
- {id: transmural_pressure, name: transmural (distending) pressure, dimension: "[mass]/[length]/[time]**2", description: "reference pressure at which Table 2 geometry and distensibility hold"}
- {id: distensibility, name: wall distensibility, dimension: "[length]*[time]**2/[mass]", description: "area compliance per unit lumen area, C_A/A = 1/(rho PWV^2), at the reference pressure"}
- {id: pwv_fit_coefficient, name: coefficient a2 of the PWV-diameter power law (Eq. 22), dimension: dimensionless, description: "printed without units; PWV in m/s for d in mm"}
- {id: pwv_fit_exponent, name: exponent b2 of the PWV-diameter power law (Eq. 22), dimension: dimensionless}
- {id: blood_density, name: blood density, dimension: "[mass]/[length]**3"}
- {id: viscoelastic_slope, name: slope a3 of the viscoelastic coefficient against mean diameter (Eq. 9), dimension: "1/[length]"}
- {id: viscoelastic_intercept, name: intercept b3 of the viscoelastic coefficient (Eq. 9), dimension: dimensionless}
- {id: viscoelastic_coefficient, name: viscoelastic coefficient ã of the creep function (Eq. 8), dimension: dimensionless}
- {id: terminal_resistance, name: total terminal (windkessel) resistance R1 + R2, dimension: "[mass]/[length]**4/[time]"}
- {id: terminal_compliance, name: terminal windkessel compliance CT, dimension: "[length]**4*[time]**2/[mass]"}
- {id: r1_fraction, name: proximal-to-total terminal resistance ratio R1/RT, dimension: dimensionless}
- {id: systolic_flow_rate, name: peak systolic volume flow rate at an arterial site, dimension: "[length]**3/[time]"}
- {id: mean_flow_rate, name: cycle-mean volume flow rate at an arterial site, dimension: "[length]**3/[time]"}
- {id: systolic_pressure, name: systolic pressure at an arterial site, dimension: "[mass]/[length]/[time]**2"}
- {id: diastolic_pressure, name: diastolic pressure at an arterial site, dimension: "[mass]/[length]/[time]**2"}
- {id: pulse_pressure, name: pulse pressure at an arterial site, dimension: "[mass]/[length]/[time]**2"}
- {id: diastolic_flow_rate, name: minimal (diastolic) volume flow rate at an arterial site, dimension: "[length]**3/[time]", description: "the 'Diastolic Flow Rate' column of Table 4; the text calls it the minimal flow (p. 8)"}
- {id: mean_pressure, name: cycle-mean pressure at an arterial site, dimension: "[mass]/[length]/[time]**2"}
- {id: relative_discrepancy_mean, name: mean over locations of the relative model-measurement discrepancy, dimension: dimensionless}
- {id: relative_discrepancy_sd, name: SD over locations of the relative model-measurement discrepancy, dimension: dimensionless}
- {id: discrepancy_normalization_weight, name: weight of the model value in the denominator of a relative discrepancy, dimension: dimensionless, description: "0: relative to in vivo; 1: relative to model; 0.5: relative to their mean"}
- {id: pressure_rms_difference, name: RMS over the cycle of the pressure difference between a model variant and the control model, dimension: "[mass]/[length]/[time]**2"}
- {id: flow_rms_difference, name: RMS over the cycle of the flow difference between a model variant and the control model, dimension: "[length]**3/[time]"}
- {id: relative_rms_difference, name: RMS difference relative to the reference (control) model, dimension: dimensionless}
- {id: internal_resistance_coefficient, name: coefficient kappa of the LV internal resistance (Eq. 19), dimension: "[time]/[length]**3"}
- {id: ventricular_dead_volume, name: LV dead volume V0, dimension: "[length]**3"}
- {id: minimal_elastance, name: minimal LV elastance Emin, dimension: "[mass]/[length]**4/[time]**2"}
- {id: maximal_elastance, name: maximal LV elastance Emax, dimension: "[mass]/[length]**4/[time]**2"}
- {id: end_diastolic_pressure, name: LV end-diastolic pressure, dimension: "[mass]/[length]/[time]**2"}
- {id: venous_resistance, name: venous (filling) resistance of the heart model, dimension: "[mass]/[length]**4/[time]"}
- {id: heart_rate, name: heart rate, dimension: "1/[time]"}
- {id: time_to_max_elastance, name: time to maximal elastance tmax, dimension: "[time]"}
- {id: csf_pressure, name: mean cerebrospinal fluid pressure acting on intracranial arteries, dimension: "[mass]/[length]/[time]**2"}
- {id: pulse_wave_velocity, name: pulse wave velocity in an artery, dimension: "[length]/[time]", description: "PWV, the y axis of Fig. 3 and the output of Eq. 22"}
- {id: time_from_scale_bar, name: time within the cardiac cycle from the left end of a panel's 0.8 s scale bar, dimension: "[time]", description: "the x axis of the waveform panels of Figs. 4-6, which print no time origin, only a 0.8 s scale bar under each panel"}
- {id: flow_rate, name: instantaneous volume flow rate at an arterial site, dimension: "[length]**3/[time]", description: "a point of a flow waveform"}
- {id: blood_pressure, name: instantaneous blood pressure at an arterial site, dimension: "[mass]/[length]/[time]**2", description: "a point of a pressure waveform"}
- {id: normalized_time, name: time normalized by the time to maximal elastance, dimension: dimensionless, description: "tN, the x axis of Fig. 1B"}
- {id: normalized_elastance, name: normalized ejecting LV elastance EN, dimension: dimensionless, description: "E(t) normalized to its maximum, of an ejecting heart (Senzaki et al.), Fig. 1B"}
- {id: normalized_isovolumic_elastance, name: normalized isovolumic LV elastance E*N, dimension: dimensionless, description: "the isovolumic elastance E* (Eq. 20) normalized, Fig. 1B"}
