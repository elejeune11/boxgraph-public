- id: q_no_validation_vs_stergiopulos1999
  kind: choice
  about: [ref-62, arterial_tree_1d, r1_minimal_reflection, pwv_eq22, pulse_pressure, mean_pressure_dia_pp, qsys_vivo_asc_aorta, wave4a_f_vivo_fig]
  text: >
    (Cross-validation with stergiopulos1999, job 2026-11-04.) No validation is entered in either direction.
    The pair was chosen because ref. 62 is a Stergiopulos 1999 paper, but ref. 62 is Stergiopulos, Segers and Westerhof,
    "Use of pulse pressure method for estimating total arterial compliance in vivo", AJP 276: H424-H428. stergiopulos1999
    is Stergiopulos, Westerhof and Westerhof, "Total arterial inertance as the fourth element of the windkessel model",
    AJP 276: H81-H88. That paper is not in this reference list, and no in-text citation of ref. 62 turns up in the page text.
    This paper says nothing about the four-element windkessel or the dog and Murgo et al. beats analysed there.
    This record's 1-D model, the one that could give aortic input impedance or aortic waves, is not runnable
    (q_1d_not_runnable). Its runnable models (Eqs. 6, 9, 15, 22, R1 = ZC, PP, the one-third rule, the discrepancy
    and Table 6 statistics) need segment diameters, PWV, terminal-bed values or systolic/diastolic pressures.
    stergiopulos1999 measures none of these: it measures whole-body R_p, Z_c, C_PPM, C_AR and heart rate of seven dogs,
    aortic pressure and flow waves, and dog 71's input impedance. The R1 = ZC rule applies to a terminal bed's WK3, not to
    the whole-body Z_c/R_p of a dog, and that ratio is not printed as a measurement there.
    In the other direction, stergiopulos1999's runnable models (zin_3wk, zin_4wk: input impedance against frequency;
    Eq. 1 inertance; statistics on its own Table 1) predict no quantity measured here. This paper measures flows and
    radial, carotid and temporal pressures in time (Tables 4-5, Figs. 4-5) and literature PWV against diameter (Fig. 3),
    and it measures no input impedance. Its terminal WK3 values (Table 2) are model inputs, not measurements.
  citation: {page: 1, quote: "vessels are terminated with three-element windkessels", where: abstract}
- id: q_no_validation_vs_westerhof1969
  kind: choice
  about: [ref-71, arterial_tree_1d, pwv_eq22, distensibility_eq22_eq6, pwv_lit_fig3, EN_measured_fig1b, qsys_vivo_asc_aorta, psys_vivo_radial]
  text: >
    (Cross-validation with westerhof1969, ref. 71, job 2026-11-04.) No validation is entered in either direction.
    This paper cites ref. 71 for the tree geometry it builds on (p. 4) and for the finding that the original
    Noordergraaf/Westerhof tree gives nonphysiological aortic reflections (p. 3); it says nowhere that either model
    predicts or is compared with the other paper's measurements.
    westerhof1969's measurements are (a) decay time constants, input-impedance and wave-velocity increases measured on
    its own electrical analog (tau_normal, tau_stiff, tau_high, tau_low, dZin_stiff_printed, dc_stiff_printed), which
    are model outputs of that analog and quantities no model here gives; and (b) the apparent wave velocity in man of
    Luchsinger et al. and Gabe et al. against frequency (Fig. 7). Apparent (phase) velocity at each harmonic is not the
    foot-to-foot PWV of pwv_eq22, and pwv_eq22 takes a diameter, not a frequency, so it has no input for those
    conditions; the full 1-D model that could give phase delays is not runnable (q_1d_not_runnable).
    In the other direction, westerhof1969's runnable models give per-segment R, L, C, Z0, phase velocity
    1/sqrt(L'C'), reflection coefficients, the total compliance and the RC decay time; its full analog is not runnable.
    This paper measures flows and radial, carotid and temporal pressures in time (Tables 4-5, Figs. 4-5), Senzaki
    et al.'s normalized elastance (Fig. 1B) and literature PWV against diameter (Fig. 3). Only the last is a
    quantity a Westerhof model gives, but westerhof1969/phase_velocity takes a segment's L' and C', not a diameter,
    so it cannot be run at Fig. 3's diameters, and no single Fig. 3 point belongs to a named Westerhof segment.
  citation: {page: 4, quote: "which was later adapted by Westerhof et al", where: "Geometry, p. 4"}
- id: q_no_validation_vs_olufsen2000
  kind: choice
  about: [ref-44, arterial_tree_1d, pwv_eq22, distensibility_eq22_eq6, r1_minimal_reflection, pulse_pressure, mean_pressure_dia_pp, qsys_vivo_asc_aorta, qmean_vivo_asc_aorta, psys_vivo_radial, wave4a_f_vivo_fig, pwv_lit_fig3]
  text: >
    (Cross-validation with olufsen2000, ref. 44, job 2026-11-04.) No validation is entered in either direction.
    This paper cites ref. 44 only as one of the 1-D models of the tree "under various physiological" conditions (p. 1)
    and as a row of its Table 1 survey (p. 2: complete tree, approximated velocity profiles, structured-tree outflow).
    It does not say that its model explains or is compared with Olufsen et al.'s measurements, nor the reverse.
    The pair shares a shape: olufsen2000/network_1d and this record's arterial_tree_1d both map a tree to flows and
    pressures in time. Neither is runnable (q_1d_not_runnable here; olufsen2000/q_network_not_runnable). So this
    model cannot be run on olufsen2000's MR flows (Figs. 3, 7), cuff pressures (120/80 mmHg), inlet radius or 1.1 s
    cycle, and olufsen2000's model cannot be run on Tables 4-5 or Figs. 4-5.
    Neither record's runnable models give a quantity the other paper measures. Here, Eq. 22 (PWV), Eqs. 6 and 9
    (distensibility, viscoelastic coefficient), Eq. 15, R1 = ZC, PP = Ps - Pd, the one-third mean rule and the
    discrepancy and Table 6 statistics either take diameters and give PWV or wall properties, or act on this paper's
    own tables. olufsen2000 measures no PWV, distensibility or wall property. Its cuff 120/80 is a systolic/diastolic
    pair, but it prints no measured pulse or mean pressure for PP or the one-third rule to predict.
    olufsen2000's runnable models (nu = mu/rho, the Lighthill boundary layer, Eqs. 21-22 gamma, alpha and beta,
    the Eq. 14 tube law, A = pi R^2, T = 1/HR) give viscosity, layer thickness, tree ratios, pressure from area,
    area from radius and period from heart rate. This paper measures none of these. It prints no measured lumen
    area or cycle length, and its Fig. 3 PWV points are literature values that no olufsen2000 model gives.
    A runnable version of either 1-D model would make the Table 4 / Fig. 7 flows testable across the pair.
  citation: {page: 1, quote: "arterial tree (6, 48, 50, 69) under various physiological (44,", where: Introduction}

