- id: q_no_validation_vs_stergiopulos1992
  kind: choice
  about: [arterial_tree_1d, pwv_eq22, pulse_pressure, mean_pressure_dia_pp, qsys_vivo_asc_aorta, psys_vivo_radial, wave5f_p_vivo_fig]
  text: >
    (Cross-validation with stergiopulos1992, ref. 64, cross-validation job 2026-11-04.) No validation is entered in
    either direction. This record's 1-D model, the one that would predict stergiopulos1992's measurements (the Fronek
    et al. leg/brachial systolic indices and the Gosling et al. pulsatility indices), is not runnable
    (q_1d_not_runnable), and its listed outputs are flows and pressures, not those ratios. This record's runnable
