id: table6_relative_pressure
name: relative RMS pressure difference of Table 6 from its absolute value, with one reference magnitude per column
role: processing
stated: {page: 12, quote: "in absolute relative to the reference model in", where: "Table 6 footnote"}
equation: "relative (%) = absolute RMS difference / reference magnitude × 100"
inputs:
  rms: {quantity: pressure_rms_difference, unit: mmHg, description: absolute RMS difference of the row}
  rms_ref: {quantity: pressure_rms_difference, unit: mmHg, description: absolute RMS difference of the first row (viscoelasticity only)}
  pct_ref: {quantity: relative_rms_difference, unit: percent, description: relative RMS difference printed in the first row}
outputs:
  pct: {quantity: relative_rms_difference, unit: percent}
settings: {}
stochastic: false
