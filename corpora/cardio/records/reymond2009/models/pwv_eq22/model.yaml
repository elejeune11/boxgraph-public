id: pwv_eq22
name: pulse wave velocity against mean lumen diameter, the empirical inverse power fit (Eq. 22)
role: fit
stated: {page: 5, quote: "To that effect, we fitted an empirical", where: "Eq. 22"}
equation: "PWV(d̄) ≈ a2 / d̄^b2"
inputs:
  d: {quantity: lumen_diameter, unit: mm, description: mean lumen diameter (the x axis of Fig. 3)}
  a2: {quantity: pwv_fit_coefficient, unit: dimensionless, description: "a2 of Eq. 22; read as PWV in m/s for d in mm (q_eq22_units)"}
  b2: {quantity: pwv_fit_exponent, unit: dimensionless}
outputs:
  PWV: {quantity: pulse_wave_velocity, unit: m/s}
settings: {}
stochastic: false
