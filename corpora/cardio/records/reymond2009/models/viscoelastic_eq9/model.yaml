id: viscoelastic_eq9
name: viscoelastic coefficient linear in mean lumen diameter (Eq. 9)
role: model
stated: {page: 3, quote: "increases linearly as the diameter decreases from heart to periphery", where: Eq. 9}
equation: "ã ≅ a3 · d̄ + b3"
inputs:
  d_prox: {quantity: lumen_diameter, unit: mm}
  d_dist: {quantity: lumen_diameter, unit: mm}
  a3: {quantity: viscoelastic_slope, unit: 1/mm}
  b3: {quantity: viscoelastic_intercept, unit: dimensionless}
outputs:
  va: {quantity: viscoelastic_coefficient, unit: dimensionless}
settings: {}
stochastic: false
