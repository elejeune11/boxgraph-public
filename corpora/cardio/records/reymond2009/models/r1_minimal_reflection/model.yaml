id: r1_minimal_reflection
name: proximal windkessel resistance fraction R1/RT from minimal high-frequency reflection (R1 = ZC, Eq. 14)
role: model
stated: {page: 3, quote: "the condition for minimal reflection at high frequencies is R1", where: "Eq. 14 and text, p. 3"}
equation: "ZC = rho · PWV / A;  R1 = ZC;  R1/RT"
inputs:
  d: {quantity: lumen_diameter, unit: mm, description: "lumen diameter of the last segment at the terminal site (its distal diameter; q_r1_diameter)"}
  a2: {quantity: pwv_fit_coefficient, unit: dimensionless}
  b2: {quantity: pwv_fit_exponent, unit: dimensionless}
  rho: {quantity: blood_density, unit: kg/m^3}
  RT: {quantity: terminal_resistance, unit: Pa*s/m^3}
outputs:
  ratio: {quantity: r1_fraction, unit: dimensionless}
settings: {}
stochastic: false
