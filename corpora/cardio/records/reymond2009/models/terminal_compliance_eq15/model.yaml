id: terminal_compliance_eq15
name: terminal windkessel compliance proportional to the terminal vessel's distal area compliance (Eq. 15), scaled from a reference bed
role: model
stated: {page: 3, quote: "is assumed to be proportional to the area compliance", where: Eq. 15}
equation: "C_Ti ≅ C_T · C_Ai / Σ C_A^i;  hence C_Tj = C_Tref · C_Aj / C_Aref, with C_A = distensibility · π d^2/4"
inputs:
  CT_ref: {quantity: terminal_compliance, unit: ml/mmHg, description: printed terminal compliance of the reference bed (right radial)}
  D_ref: {quantity: distensibility, unit: 1/mmHg}
  d_ref: {quantity: lumen_diameter, unit: mm, description: distal lumen diameter of the reference terminal segment}
  D: {quantity: distensibility, unit: 1/mmHg}
  d: {quantity: lumen_diameter, unit: mm, description: distal lumen diameter of the terminal segment}
outputs:
  CT: {quantity: terminal_compliance, unit: ml/mmHg}
settings: {}
stochastic: false
