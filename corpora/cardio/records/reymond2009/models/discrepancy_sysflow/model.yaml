id: discrepancy_sysflow
name: mean and SD of the relative model-measurement discrepancy in peak systolic flow (Tables 4-5)
role: processing
stated: {page: 8, quote: "for peak systolic flow", where: "Results, p. 8"}
equation: "discrepancy = |model - in vivo| / reference, reported as means ± SD over the locations of Tables 4-5"
inputs:
  v1: {quantity: systolic_flow_rate, unit: ml/s, description: "in vivo value at location 1"}
  v2: {quantity: systolic_flow_rate, unit: ml/s, description: "in vivo value at location 2"}
  v3: {quantity: systolic_flow_rate, unit: ml/s, description: "in vivo value at location 3"}
  v4: {quantity: systolic_flow_rate, unit: ml/s, description: "in vivo value at location 4"}
  v5: {quantity: systolic_flow_rate, unit: ml/s, description: "in vivo value at location 5"}
  v6: {quantity: systolic_flow_rate, unit: ml/s, description: "in vivo value at location 6"}
  v7: {quantity: systolic_flow_rate, unit: ml/s, description: "in vivo value at location 7"}
  v8: {quantity: systolic_flow_rate, unit: ml/s, description: "in vivo value at location 8"}
  v9: {quantity: systolic_flow_rate, unit: ml/s, description: "in vivo value at location 9"}
  m1: {quantity: systolic_flow_rate, unit: ml/s, description: "model value at location 1"}
  m2: {quantity: systolic_flow_rate, unit: ml/s, description: "model value at location 2"}
  m3: {quantity: systolic_flow_rate, unit: ml/s, description: "model value at location 3"}
  m4: {quantity: systolic_flow_rate, unit: ml/s, description: "model value at location 4"}
  m5: {quantity: systolic_flow_rate, unit: ml/s, description: "model value at location 5"}
  m6: {quantity: systolic_flow_rate, unit: ml/s, description: "model value at location 6"}
  m7: {quantity: systolic_flow_rate, unit: ml/s, description: "model value at location 7"}
  m8: {quantity: systolic_flow_rate, unit: ml/s, description: "model value at location 8"}
  m9: {quantity: systolic_flow_rate, unit: ml/s, description: "model value at location 9"}
  w: {quantity: discrepancy_normalization_weight, unit: dimensionless, description: 'denominator (1 - w) in vivo + w model'}
outputs:
  mean: {quantity: relative_discrepancy_mean, unit: percent}
  sd: {quantity: relative_discrepancy_sd, unit: percent}
settings: {}
stochastic: false
