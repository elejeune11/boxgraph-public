id: mean_pressure_dia_pp
name: mean pressure from diastolic and pulse pressure (one-third rule, p. 7)
role: processing
stated: {page: 7, quote: "Mean sphygmomanometer pressure is calculated as", where: "In Vivo Measurements, p. 7"}
equation: "Pmean ≅ Pdiastole + 1/3 PP"
inputs:
  Pdiastole: {quantity: diastolic_pressure, unit: mmHg}
  PP: {quantity: pulse_pressure, unit: mmHg}
outputs:
  Pmean: {quantity: mean_pressure, unit: mmHg}
settings: {}
stochastic: false
