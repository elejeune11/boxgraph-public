- id: w_norm_added
  quantity: discrepancy_normalization_weight
  unit: dimensionless
  printed: "0.5"
  basis: >
    The paper gives the discrepancies between Tables 4-5 model and in vivo values as percentages (p. 8) without
    saying what the difference is relative to. Relative to the mean of the two values (w = 0.5) is one reading;
    relative to in vivo (0) or to model (1) are the others.
  alternatives: ["0", "1"]
  stands_for: "the denominator of the % discrepancies of p. 8"
