- {id: stack_res_y, quantity: image_resolution, unit: 1/um, origin: reported, printed: "0.8316", citation: {none: "TIFF tag 283 (YResolution) of the same stack: 831600/1000000 pixels per micron"}, conditions: {sample: "Control-Dex-3-trimmed.tif"}}
- {id: stack_spacing_z, quantity: slice_spacing, unit: um, origin: reported, printed: "5.6962", citation: {none: "ImageJ description (TIFF tag 270) of the same stack: 'spacing=5.6962', 'unit=micron'"}, conditions: {sample: "Control-Dex-3-trimmed.tif"}}
- {id: stack_nx, quantity: image_size_pixels, unit: dimensionless, origin: reported, printed: "753", citation: {none: "TIFF tag 256 (ImageWidth) of the same stack: 753"}, conditions: {sample: "Control-Dex-3-trimmed.tif"}}
- {id: stack_ny, quantity: image_size_pixels, unit: dimensionless, origin: reported, printed: "753", citation: {none: "TIFF tag 257 (ImageLength) of the same stack: 753"}, conditions: {sample: "Control-Dex-3-trimmed.tif"}}
