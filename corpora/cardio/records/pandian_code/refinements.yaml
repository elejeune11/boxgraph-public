- {id: ref_capsules_lumen, run: run_capsules_block, setting: dx, factors: [1, 2, 4], mode: divide, output: lumen_fraction,
   tolerance: "1%", tolerance_basis: "added: the voxelized volume should not change the fraction's second digit; dx 4 um is near the script's own voxel (3.54 um)", tolerance_added: true}
- {id: ref_capsules_endo, run: run_capsules_block, setting: dx, factors: [1, 2, 4], mode: divide, output: endo_fraction,
   tolerance: "1%", tolerance_basis: "added: as ref_capsules_lumen", tolerance_added: true}
