  reason: >
    The stated relation (rel_cellml_simplified_valves) read with korakianitis2006's evident misprints
    corrected (Eqs. 3, 6, 14, 18), the forms the code itself has: the code's on-off valves would then
    approximate the corrected leaflet-dynamics circulation of the paper's Section 3.2.
  assumptions:
    - "The tolerance (5% on the mean aortic flow) is ours."
    - "T is held at 1 s, as in rel_cellml_simplified_valves."
