  reason: &onoffreason >
    The code's valves are on-off diodes (TempCDa/TempCDv: Tao = 1 if Pi >= Po else 0), which is
    korakianitis2006's simplified model of Section 3.1 ("on-off heart valve model as described by
    Eq. (7)"), and its activation, reverse-flow and artery-flow equations are the forms korakianitis2006's
    record takes as the evident corrections of Eqs. 3, 6 and 18. Run side by side at the paper's inputs
    the two agree to about 1e-5. They are not quite one model: the code's atrial activation
    (EAtrium.cellml line 22) carries a P wave that runs past T into the next beat, where korakianitis2006's
    Eq. 5 cuts it at T, and the code assumes Tpwb + Tpww >= 1 (for a shorter P wave its third branch
    starts a second wave before T). The regime keeps Tpwb + Tpww >= T, as at the paper's 0.92 + 0.09 s,
    and the tolerance (0.1%) is ours.
