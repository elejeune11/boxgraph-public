- {id: ref_dt_plv, run: run_code_values, setting: dt, factors: [1, 2, 4], mode: divide, output: P_lv_max,
   tolerance: "0.1%", tolerance_basis: "added: well below the printed precision (0.1 mmHg) of the values compared", tolerance_added: true}
- {id: ref_dt_qmi, run: run_code_values, setting: dt, factors: [1, 2, 4], mode: divide, output: Q_mi_E,
   tolerance: "0.1%", tolerance_basis: "added: well below the printed precision (0.1 ml/s) of the values compared", tolerance_added: true}
- {id: ref_dt_sv, run: run_code_values, setting: dt, factors: [1, 2, 4], mode: divide, output: SV,
   tolerance: "0.1%", tolerance_basis: "added: well below the printed precision (whole ml) of the values compared", tolerance_added: true}
- {id: ref_tend_sv, run: run_code_values, setting: t_end, factors: [1, 2], mode: multiply, output: SV,
   tolerance: "1%", tolerance_basis: "added: checks the 11th beat, which the paper analyses, is close to periodic; differences far smaller than those to the printed values", tolerance_added: true}
- {id: ref_tend_psas, run: run_code_values, setting: t_end, factors: [1, 2], mode: multiply, output: P_sas_min,
   tolerance: "1%", tolerance_basis: "added: checks the 11th beat is close to periodic", tolerance_added: true}
- {id: ref_tend_prv, run: run_code_values, setting: t_end, factors: [1, 2], mode: multiply, output: P_rv_max,
