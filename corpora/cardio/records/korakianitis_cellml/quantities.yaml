- {id: chamber_elastance, name: heart chamber elastance, dimension: "[pressure]/[length]**3", description: "maximum or minimum elastance of a heart chamber in the variable-elastance law (EAtrium, EVentricle)"}
- {id: chamber_reference_pressure, name: chamber reference pressure, dimension: "[pressure]", description: "Pini in TempCD: the chamber pressure at the reference volume Vini (P_0 in korakianitis2006 Eq. 4)"}
- {id: chamber_reference_volume, name: chamber reference volume, dimension: "[length]**3", description: "Vini in TempCD: the volume at which chamber pressure equals Pini (V_0 in korakianitis2006 Eq. 4)"}
- {id: initial_chamber_volume, name: initial heart chamber volume, dimension: "[length]**3", description: "chamber volume at t = 0 (V0 in TempCD; Vlv0, Vla0, Vra0, Vrv0 in ParaHeart)"}
- {id: initial_vessel_pressure, name: initial vessel pressure, dimension: "[pressure]", description: "pressure of a vessel compliance at t = 0 (P0 in TempRLC and TempRC)"}
- {id: initial_vessel_flow, name: initial vessel flow, dimension: "[length]**3/[time]", description: "flow through a vessel inertance at t = 0 (Q0 in TempRLC)"}
- {id: valve_flow_coefficient, name: valve flow coefficient, dimension: "[length]**3/[time]/[pressure]**0.5", description: "CV in TempCD: flow = CV*|dP|^0.5 through an open valve (CQ in korakianitis2006 Eq. 6)"}
- {id: vascular_compliance, name: vascular compliance, dimension: "[length]**3/[pressure]", description: "C of a vessel segment (TempRLC, TempRC)"}
- {id: vascular_resistance, name: vascular resistance, dimension: "[pressure]*[time]/[length]**3", description: "R of a vessel segment (TempRLC, TempR, TempRC)"}
- {id: vascular_inertance, name: vascular inertance, dimension: "[pressure]*[time]**2/[length]**3", description: "L of a vessel segment (TempRLC): the inertia of the blood"}
- {id: heart_period, name: heart period, dimension: "[time]", description: "T, the length of one heart cycle"}
- {id: p_wave_onset_fraction, name: onset of the P wave as a fraction of the period, dimension: dimensionless, description: "Tpwb in EAtrium: atrial activation starts at Tpwb*T"}
- {id: p_wave_duration_fraction, name: duration of the P wave as a fraction of the period, dimension: dimensionless, description: "Tpww in EAtrium: atrial activation lasts Tpww*T"}
- {id: peak_systole_fraction, name: time of peak ventricular activation as a fraction of the period, dimension: dimensionless, description: "Ts1 in EVentricle: activation peaks at Ts1*T"}
- {id: end_systole_fraction, name: time of end of ventricular activation as a fraction of the period, dimension: dimensionless, description: "Ts2 in EVentricle: activation ends at Ts2*T"}
- {id: pi_constant, name: the constant pi as written in the code, dimension: dimensionless, description: "the number the code uses for pi in the activation functions"}
- {id: code_pressure_unit, name: size of the code's pressure unit, dimension: "[pressure]", description: "UnitP in Units.cellml, the unit every pressure of the code is written in"}
- {id: code_volume_unit, name: size of the code's volume unit, dimension: "[length]**3", description: "UnitV in Units.cellml, the unit every volume of the code is written in"}
- {id: peak_lv_pressure, name: peak left ventricular pressure, dimension: "[pressure]", description: "maximum over one periodic heart cycle"}
- {id: min_lv_pressure, name: minimum left ventricular pressure, dimension: "[pressure]", description: "minimum over one periodic heart cycle"}
- {id: peak_aortic_pressure, name: peak aortic pressure, dimension: "[pressure]", description: "maximum aortic sinus pressure (P_sas, P(ao) in the paper's figures) over one cycle"}
- {id: min_aortic_pressure, name: minimum aortic pressure, dimension: "[pressure]", description: "minimum aortic sinus pressure over one cycle"}
- {id: peak_rv_pressure, name: peak right ventricular pressure, dimension: "[pressure]", description: "maximum over one cycle"}
- {id: peak_pulmonary_artery_pressure, name: peak pulmonary artery pressure, dimension: "[pressure]", description: "maximum pulmonary artery sinus pressure P_pas over one cycle"}
- {id: mean_aortic_flow, name: mean aortic valve flow (cardiac output), dimension: "[length]**3/[time]", description: "aortic valve flow averaged over one cycle"}
- {id: lv_volume_max, name: maximum left ventricular volume, dimension: "[length]**3", description: "end-diastolic volume, maximum over one cycle"}
- {id: lv_volume_min, name: minimum left ventricular volume, dimension: "[length]**3", description: "end-systolic volume, minimum over one cycle"}
- {id: stroke_volume, name: left ventricular stroke volume, dimension: "[length]**3", description: "largest minus smallest left ventricular volume over one cycle"}
- {id: peak_aortic_valve_flow, name: peak forward aortic valve flow, dimension: "[length]**3/[time]", description: "maximum aortic valve flow over one cycle"}
- {id: mitral_E_peak_flow, name: mitral flow at the E peak, dimension: "[length]**3/[time]", description: "largest mitral flow in early diastole, between the end of ventricular activation and the start of atrial activation"}
- {id: tricuspid_E_peak_flow, name: tricuspid flow at the E peak, dimension: "[length]**3/[time]", description: "largest tricuspid flow in the same window"}
