id: closed_loop_onoff
name: four-chamber heart (variable elastance, on-off valves) with five-segment systemic and pulmonary loops, closed, ported from the CellML
role: model
stated: {file: ModelMain.cellml, lines: "28", quote: "The model comprises three main parts: the heart, the systemic loop, and the pulmonary loop"}
equation: >
  Chambers LA, RA (TempCDa) and LV, RV (TempCDv): dV/dt = Qi - Qo; Pi = Pini + E (V - Vini); Tao = 1 if Pi >= Po else 0;
  Qo = CV Tao |Pi - Po|^0.5 (Pi >= Po), -1 CV Tao |Po - Pi|^0.5 (Pi < Po).
  Ventricles (EVentricle): mt = t - T floor(t/T); et = 1 - cos(3.14159 mt/(Ts1 T)) (0 <= mt <= Ts1 T),
  1 + cos(3.14159 (mt - Ts1 T)/((Ts2 - Ts1) T)) (Ts1 T < mt <= Ts2 T), 0 (Ts2 T < mt < T); E = Emin + et (Emax - Emin)/2.
  Atria (EAtrium): et = 1 - cos(2 3.14159 ((mt - Tpwb T) + T)/(Tpww T)) (0 <= mt <= (Tpwb + Tpww) T - T),
  0 ((Tpwb + Tpww) T - T < mt <= Tpwb T), 1 - cos(2 3.14159 (mt - Tpwb T)/(Tpww T)) (Tpwb T < mt <= T); E = Emin + et (Emax - Emin)/2.
  Sinus and artery Sas, Sat, Pas, Pat (TempRLC): dPi/dt = (Qi - Qo)/C; dQo/dt = (Pi - Po - R Qo)/L.
  Arteriole and capillary Sar, Scp, Par, Pcp (TempR): Pi = Po + R Qi; Qo = Qi.
  Vein Svn, Pvn (TempRC): dPi/dt = (Qi - Qo)/C; Qo = (Pi - Po)/R.
  Loop (ModelMain, ModelHeart, ModelSys, ModelPul): LA -> LV -> Sas -> Sat -> Sar -> Scp -> Svn -> RA -> RV -> Pas -> Pat -> Par
  -> Pcp -> Pvn -> LA, each Po = next Pi and Qo = next Qi.
# Notes (the schema has no notes field). model.py is our code, a line-by-line port of:
#   ModelMain.cellml lines 106-128 (heart to loops connections), ModelHeart.cellml lines 106-232
#   (chambers, activation functions and parameter mappings; ParaHeart is imported twice, as
#   ParaLHeart and ParaRHeart, lines 44-50), ModelSys.cellml lines 51-131, ModelPul.cellml lines
#   50-130, TempCDa.cellml lines 32-41, TempCDv.cellml lines 32-40, EAtrium.cellml lines 19-24,
#   EVentricle.cellml line 20, TempRLC.cellml line 25, TempR.cellml line 19, TempRC.cellml line 22.
# The resistors Sar, Scp (Par, Pcp) are algebraic and carry the artery flow Qsat (Qpat), so
# Sat.Po = Psvn + (Rsar + Rscp) Qsat. Fourteen state variables: Vla, Vlv, Vra, Vrv, Psas, Qsas,
# Psat, Qsat, Psvn, Ppas, Qpas, Ppat, Qpat, Ppvn. Both ventricles share T, Ts1, Ts2 and both atria
# T, Tpwb, Tpww (one ParaHeart file). The integrator (RK4 at fixed dt) is ours (q_solver).
# Outputs are taken over the last period [t_end - T, t_end]; with t_end = 11 s that is the 10th to
# 11th s the paper analyses. The E peak is the largest mitral (tricuspid) flow with
# Ts2 T < mt <= Tpwb T, the window korakianitis2006 q_e_peak_window uses.
inputs:
  ElaMax: {quantity: chamber_elastance, unit: mmHg/mL}
  ElaMin: {quantity: chamber_elastance, unit: mmHg/mL}
  PlaIni: {quantity: chamber_reference_pressure, unit: mmHg}
  VlaIni: {quantity: chamber_reference_volume, unit: mL}
  ElvMax: {quantity: chamber_elastance, unit: mmHg/mL}
  ElvMin: {quantity: chamber_elastance, unit: mmHg/mL}
  PlvIni: {quantity: chamber_reference_pressure, unit: mmHg}
  VlvIni: {quantity: chamber_reference_volume, unit: mL}
  EraMax: {quantity: chamber_elastance, unit: mmHg/mL}
  EraMin: {quantity: chamber_elastance, unit: mmHg/mL}
  PraIni: {quantity: chamber_reference_pressure, unit: mmHg}
  VraIni: {quantity: chamber_reference_volume, unit: mL}
  ErvMax: {quantity: chamber_elastance, unit: mmHg/mL}
  ErvMin: {quantity: chamber_elastance, unit: mmHg/mL}
  PrvIni: {quantity: chamber_reference_pressure, unit: mmHg}
  VrvIni: {quantity: chamber_reference_volume, unit: mL}
  T: {quantity: heart_period, unit: s}
  Tpwb: {quantity: p_wave_onset_fraction, unit: dimensionless}
  Tpww: {quantity: p_wave_duration_fraction, unit: dimensionless}
  Ts1: {quantity: peak_systole_fraction, unit: dimensionless}
  Ts2: {quantity: end_systole_fraction, unit: dimensionless}
  CVao: {quantity: valve_flow_coefficient, unit: mL/(s*mmHg^0.5)}
  CVmi: {quantity: valve_flow_coefficient, unit: mL/(s*mmHg^0.5)}
  CVpa: {quantity: valve_flow_coefficient, unit: mL/(s*mmHg^0.5)}
  CVti: {quantity: valve_flow_coefficient, unit: mL/(s*mmHg^0.5)}
  Vlv0: {quantity: initial_chamber_volume, unit: mL}
  Vla0: {quantity: initial_chamber_volume, unit: mL}
  Vra0: {quantity: initial_chamber_volume, unit: mL}
  Vrv0: {quantity: initial_chamber_volume, unit: mL}
  Rsas: {quantity: vascular_resistance, unit: mmHg*s/mL}
  Csas: {quantity: vascular_compliance, unit: mL/mmHg}
  Lsas: {quantity: vascular_inertance, unit: mmHg*s^2/mL}
  P0sas: {quantity: initial_vessel_pressure, unit: mmHg}
  Q0sas: {quantity: initial_vessel_flow, unit: mL/s}
  Rsat: {quantity: vascular_resistance, unit: mmHg*s/mL}
  Csat: {quantity: vascular_compliance, unit: mL/mmHg}
  Lsat: {quantity: vascular_inertance, unit: mmHg*s^2/mL}
  P0sat: {quantity: initial_vessel_pressure, unit: mmHg}
  Q0sat: {quantity: initial_vessel_flow, unit: mL/s}
  Rsar: {quantity: vascular_resistance, unit: mmHg*s/mL}
  Rscp: {quantity: vascular_resistance, unit: mmHg*s/mL}
  Rsvn: {quantity: vascular_resistance, unit: mmHg*s/mL}
  Csvn: {quantity: vascular_compliance, unit: mL/mmHg}
  P0svn: {quantity: initial_vessel_pressure, unit: mmHg}
  Rpas: {quantity: vascular_resistance, unit: mmHg*s/mL}
  Cpas: {quantity: vascular_compliance, unit: mL/mmHg}
  Lpas: {quantity: vascular_inertance, unit: mmHg*s^2/mL}
  P0pas: {quantity: initial_vessel_pressure, unit: mmHg}
  Q0pas: {quantity: initial_vessel_flow, unit: mL/s}
  Rpat: {quantity: vascular_resistance, unit: mmHg*s/mL}
  Cpat: {quantity: vascular_compliance, unit: mL/mmHg}
  Lpat: {quantity: vascular_inertance, unit: mmHg*s^2/mL}
  P0pat: {quantity: initial_vessel_pressure, unit: mmHg}
  Q0pat: {quantity: initial_vessel_flow, unit: mL/s}
  Rpar: {quantity: vascular_resistance, unit: mmHg*s/mL}
  Rpcp: {quantity: vascular_resistance, unit: mmHg*s/mL}
  Rpvn: {quantity: vascular_resistance, unit: mmHg*s/mL}
  Cpvn: {quantity: vascular_compliance, unit: mL/mmHg}
  P0pvn: {quantity: initial_vessel_pressure, unit: mmHg}
  pi: {quantity: pi_constant, unit: dimensionless}
outputs:
  P_lv_max: {quantity: peak_lv_pressure, unit: mmHg}
  P_lv_min: {quantity: min_lv_pressure, unit: mmHg}
  P_sas_max: {quantity: peak_aortic_pressure, unit: mmHg, description: "maximum aortic sinus pressure (Sas.Pi)"}
  P_sas_min: {quantity: min_aortic_pressure, unit: mmHg, description: "minimum aortic sinus pressure (Sas.Pi)"}
  P_rv_max: {quantity: peak_rv_pressure, unit: mmHg}
  P_pas_max: {quantity: peak_pulmonary_artery_pressure, unit: mmHg, description: "maximum pulmonary artery sinus pressure (Pas.Pi)"}
  V_lv_max: {quantity: lv_volume_max, unit: mL}
  V_lv_min: {quantity: lv_volume_min, unit: mL}
  SV: {quantity: stroke_volume, unit: mL}
  Q_ao_mean: {quantity: mean_aortic_flow, unit: L/min}
  Q_ao_peak: {quantity: peak_aortic_valve_flow, unit: mL/s}
  Q_mi_E: {quantity: mitral_E_peak_flow, unit: mL/s}
  Q_ti_E: {quantity: tricuspid_E_peak_flow, unit: mL/s}
settings:
  dt: 0.0001     # added: the CellML files hold no solver settings; the paper's DT (q_solver)
  t_end: 11.0    # the paper analyses the 10th to 11th s; results over [t_end - T, t_end]
stochastic: false
