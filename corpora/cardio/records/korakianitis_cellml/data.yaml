# Values written in the code that ModelMain uses (ModelMain imports ModelHeart, ModelSys and
# ModelPul, and through them ParaHeart, ParaSys, ParaPul, TempCDa, TempCDv, EAtrium, EVentricle,
# TempRLC, TempR, TempRC and Units). Every .cellml file in the folder is imported.
# Units: the code's UnitP (133 Pa) is entered as mmHg, UnitV (0.001 L) as mL, UnitQ as mL/s,
# UnitR as mmHg*s/mL, UnitC as mL/mmHg, UnitL as mmHg*s^2/mL, UnitE as mmHg/mL, UnitCV as
# mL/(s*mmHg^0.5) (Units.cellml; q_unit_pressure). Where korakianitis2006 prints the same
# parameter (Tables 1, 2, text p. 8), from_datum names it and the build checks the two.
# ParaHeart.cellml is imported twice (ModelHeart lines 44-50): ParaLHeart feeds only the left-heart
# values and ParaRHeart only the right-heart values (ModelHeart lines 146-212); the timing values are
# fed to both sides.

