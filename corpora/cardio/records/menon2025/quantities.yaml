- {id: blood_pressure, name: blood pressure at a block's inlet or outlet, dimension: "[mass]/[length]/[time]**2", description: "pressure degree of freedom at a node between blocks"}
- {id: blood_flow_rate, name: volumetric blood flow rate through a block, dimension: "[length]**3/[time]", description: "flow degree of freedom at a node between blocks"}
- {id: intramyocardial_pressure, name: intramyocardial pressure acting on the coronary bed, dimension: "[mass]/[length]/[time]**2", description: "pressure the contracting myocardium exerts on the coronary vessels"}
- {id: valve_pressure_difference, name: pressure difference across a heart valve, dimension: "[mass]/[length]/[time]**2", description: "upstream minus downstream pressure across the valve"}
- {id: time, name: time within the simulation, dimension: "[time]", description: "simulation time"}
- {id: chamber_volume, name: blood volume of a cardiac chamber, dimension: "[length]**3", description: "volume of the chamber modeled as a time-varying capacitor"}
