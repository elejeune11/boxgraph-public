id: coronary_bc
name: coronary boundary condition block with intramyocardial pressure (open-loop and closed-loop left/right versions)
role: model
stated: {page: 5, quote: "coronary boundary conditions that include the intramyocardial pressure experienced by coronary arteries", where: "Software details"}
equation: "(in words) coronary boundary conditions including intramyocardial pressure; Fig. 1 names the classes OpenLoopCoronaryBC, ClosedLoopCoronaryBC, ClosedLoopCoronaryLeftBC and ClosedLoopCoronaryRightBC"
inputs:
  Q_in: {quantity: blood_flow_rate, unit: mL/s, description: flow into the coronary bed}
  P_im: {quantity: intramyocardial_pressure, unit: mmHg, description: intramyocardial pressure acting on the bed}
outputs:
  P_in: {quantity: blood_pressure, unit: mmHg, description: pressure at the coronary outlet}
from_words: true
runnable: false
not_runnable_reason: >
  The paper gives no circuit, equation or parameter for the coronary block; the sentence cites six
  works together (H. Kim et al. 2010, H. J. Kim et al. 2009, Menon et al. 2023, Menon, Khan et al. 2024,
  Mirramezani et al. 2019, Vignon-Clementel et al. 2006) without saying which block follows which. The
  block's equations are checked against kim2010 in the code record svzerod_code.
