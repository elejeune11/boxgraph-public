    measurements, and none is entered as a fit. kassab1993's measured values are pig coronary casts by
    diameter-defined Strahler order: mean segment and element diameters and lengths, S/E, element counts per
    order, the connectivity matrix and cumulative tree volumes (Tables 1-3, 5, 6, 9, 10; Figs. 6-11). No svv
    model orders vessels by Strahler order or outputs a per-order table: tree_growth and tree_biventricle give
    whole-tree statistics (terminal and segment counts, root and smallest diameter, Murray sums, median area
    growth and symmetry above a diameter, the 0D root pressure); tree_parameters gives constants and
    resistance_update one bifurcation. Considered and not used: (1) the Horton ratios of Table 4 are fits of
    the paper's own data, and a grown tree's ratios would need a Strahler ordering the code does not do
    (sexton2025's record sets its cube trees against those ratios); (2) root_diameter against the order-11
    mean diameter, and min_diameter against order 1: a single root or the smallest segment is not the mean of
    an order, and svv's diameters follow from its default root flow (0.0625 mL/s for 1000 terminals) and
    pressures, not from pig LAD, LCX or RCA flows, which neither record states and no svv model takes as an
    input; (3) n_segments, n_terminals_grown and domain_volume against the element counts and tree volumes:
    these follow from the terminal count and domain, inputs here, and the pig trees' 10^5-10^6 elements are
    beyond this record's run size (q_scale). In the other direction, svv_code has no measured data
