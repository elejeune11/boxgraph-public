- id: q_viscosity_code
  kind: unexplained_difference
  about: [nu_code, mu_export_arg_code, cmp_nu, cmp_mu_growth, cmp_cube_mu_export, cmp_biv_mu_export, tree_parameters]
  citation: {file: svv/tree/data/data.py, lines: "263-264", quote: "3.6e-2, 'kinematic_viscosity', from_system=self._CGS_SYSTEM"}
  text: >
    The paper gives mu = 4 cP for tree generation (Table S1) and for CFD (Table S3), with rho = 1.06 and
    nu = 0.037. The code stores a kinematic viscosity of 3.6e-2 cm^2/s (not 0.037) and a density of 1.06. Tree
    growth puts their product, 3.816 cP, in Eq. S1 (root.py line 266; bifurcation.py lines 628, 705), below
    Table S1's 4 cP (cmp_mu_growth). The 0D export puts the kinematic viscosity alone where a dynamic
    viscosity belongs (zerod_tree.py lines 146, 165: R = 8 nu l / (pi r^4)), so the exported resistances use
    3.6 cP (cmp_*_mu_export), and so does the 3D set-up (simulation.py lines 805, 834). export_0d_simulation
    has a viscosity argument of 0.04 (Table S3's 4 cP in poise) that it never uses. The main text's "nu =
    0.04 cP" (sexton2025 p. 5, q_viscosity_main_text there) may be this unused 0.04 in poise. Both 3.816 and
    3.6 cP count as reproducing the printed "4" only because a one-digit "4" allows 3.5 to 4.5; the kinematic
    viscosity, printed to two digits, is only close (cmp_nu).
- id: q_svv_radii
  kind: unexplained_difference
  about: [tree_growth, tree_biventricle, cmp_cube_radius_max, cmp_cube_radius_min, cmp_biv_radius_max,
          cmp_biv_radius_min, cmp_cube_check_max, cmp_cube_check_min, cmp_biv_check_max, cmp_cube_P_root_0d_mu,
          cmp_biv_P_root_0d_mu]
  citation: {file: svv/tree/branch/bifurcation.py, lines: "2190-2193", quote: "This function is used to check the values assigned in the current tree."}
  text: >
    In trees svv grows, its stored reduced resistances, flows and ratios are exactly what its own check
    function naive() recomputes from the tree (rstar_root_dev and root_radius_dev are zero), and the ratios
    satisfy the paper's identity (cmp_*_beta_*). The radius of every other vessel, which svv stores in column
    21 and exports to its solids, centerlines and 0D models, is not the radius its own naive_radius() gives
    from the root radius and the ratios: for about two thirds of vessels they differ by more than 1%, some by
    as much as the radius itself (radius_dev_max, frac_radius_dev_1pct). The exported radii therefore break
    Eq. S5 at many bifurcations, in both directions (cmp_*_radius_*; the median is one), while the check's
    radii keep it (cmp_*_check_*). The largest sums are not reproduced; the smallest pass only because the
    identity is printed as a bare "1", whose one digit allows 0.5 to 1.5. Near the root the stored and check
    radii agree, so the large-vessel statistics of the validations are the same with either.
    The stored column appears to be updated incrementally during growth (bifurcation.py, the tmp_28 scaling
    column, around lines 686-1070) and not refreshed downstream. The same was found in sexton2025's record
    (q_svv_radii there). Whether the paper's printed trees carry the same deviation is not known.
- id: q_export_outlets
  kind: possible_error
  about: [cmp_cube_outlet_R, cmp_biv_outlet_R, Pd_export_code, outlet_R_zero_paper]
  citation: {file: svv/simulation/fluid/rom/zero_d/zerod_tree.py, lines: "131-133", quote: "terminal_vessels = np.argwhere(tree.data[: ,16 ]==-1).flatten()"}
  text: >
    export_0d_simulation means to give each outlet a resistance R_total A_total / A_i, so that the outlets in
    parallel have R_total = (P_term - P_distal) / Q_root (lines 131-133, 214), with distal pressure 0 (line
    213, whose comment names svv's terminal pressure). It finds the terminals as the rows whose column 16 is
    -1, but svv marks a missing child with NaN (c_update.py line 14, the export's own line 208), so it finds
    none: the total outlet area is 0 and every outlet resistance is 0 (outlet_R_max). The exported model thus
    has zero-resistance outlets at zero pressure, which is what sexton2025's Movie S2 caption says its 0D
    models had ("Zero resistance boundary conditions are applied uniformly across all outlets", p. 73): the
    code reproduces the paper's statement (cmp_*_outlet_R), but by a terminal test that cannot succeed rather
    than by the resistance the code computes for them. Steady pressures in the export are then the pressure
    drop across the tree only.
- id: q_export_pressure
  kind: unexplained_difference
  about: [cmp_cube_P_root_0d, cmp_cube_P_root_0d_mu, cmp_biv_P_root_0d, cmp_biv_P_root_0d_mu, tree_growth]
  text: >
    svv grows each tree so that the root flow passes from root pressure (100 mmHg) to terminal pressure (60 mmHg)
    with every terminal carrying the terminal flow (Eqs. S3, S8, S9). Its own 0D export of the same tree, run
    with svZeroDSolver at that root flow and outlets held at the terminal pressure, needs a different root
    pressure, about 5 mmHg lower (cmp_*_P_root_0d), and delivers outlet flows that differ from the terminal
    flow by more than the terminal flow itself at some outlets (outlet_flow_dev_max). Part is the export's viscosity (3.6 cP against the growth's 3.816 cP,
    q_viscosity_code); the rest remains when that is removed (cmp_*_P_root_0d_mu) and is the stored radii
    (q_svv_radii). The 0D results of the paper (Fig. 3D-E, Movie S2) were computed from exported trees; how
    much they carry these differences is not known.
- id: q_s10_code
  kind: possible_error
  about: [resistance_update, rel_update_s10_beta4, rel_update_s10_printed]
  citation: {file: svv/tree/utils/c_update.py, lines: "35-37", quote: "(lbif ** 4.0) / data[left, 25] + (rbif ** 4.0) / data[right, 25]"}
  text: >
    The code's reduced-resistance update uses beta^4 / R* in the sum over daughters (c_update.py lines 35-37;
    the growth's own update and svv's check function naive(), bifurcation.py line 2183, likewise), as Eqs.
    S1-S7 imply; the paper prints Eq. S10 with beta / R* (sexton2025 q_s10_beta). rel_update_s10_beta4 and
    rel_update_s10_printed test the code against both forms.
- id: q_update_resistance_loop
  kind: possible_error
  about: [resistance_update]
  citation: {file: svv/tree/utils/c_update.py, lines: "6-12", quote: "max_depth = int(np.max(data[:, 26])) if size else 0"}
  text: >
    update_resistance in c_update.py (and its Cython twin c_update.pyx, lines 21-26) computes the largest
    depth once and keeps only the vessels at that depth in each pass; it never lowers max_depth, so on any
    table with vessels at more than one depth the loop never ends. svv calls it only on the single root vessel
    (root.py line 266), where it is harmless; the growth updates resistances elsewhere (c_local_optimize).
    resistance_update calls it on a bifurcation laid out daughters first at one depth, which its single pass
    then handles in the intended order; this layout is ours. update_radii also reads the parent from a fourth
    connectivity column (line 56) that svv's three-column connectivity (root.py line 265) does not have; the
    adapter appends it.
- id: q_seed
  kind: numerics
  about: [seed_repeat, run_seed_before, run_seed_after, tree_growth, tree_biventricle]
  citation: {file: svv/domain/domain.py, lines: "179-190", quote: "self.random_generator = np.random.Generator(np.random.PCG64(seed=self.random_seed))"}
  text: >
    Domain.set_random_seed only stores the seed; svv makes the random generator it draws terminal points and
    the root from when the domain is created or built (domain.py lines 186-190, 374, 404, 460-461). Set before
    Domain.create, a seed (with Python's random and numpy's global generator also seeded) repeats a tree
    exactly (run_seed_before: zero differences). Set after Domain.build, it has no effect and two growths
    differ from the root on (run_seed_after). sexton2025's record set the seed after build and concluded that
    "a fixed seed does not repeat an svv tree" (its q_svv_nonrepeatable); its growth script, not svv, is the
    cause. Its five-seed means remain valid statistics, but its trees could have been repeated exactly. The
    paper states no seeds. This record's tree runs set the seed first; each repeats, and their spread over
    three seeds is a spread over trees, not over reruns. The growth has no step size or mesh to refine (the
    number of terminals is an input), so no refinement series is recorded.
- id: q_hidden_growth_settings
  kind: unstated_input
  about: [flow_ratio_code, threshold_exponent_code, threshold_adjuster_code, n_points_code, n_closest_code,
          max_iter_code, proximity_code, bound_lo_code, bound_hi_code, decay_code, convexity_tol_code,
          nonconvex_limit_code]
  citation: {file: svv/tree/branch/bifurcation.py, lines: "92-103", quote: "flow_ratio = kwargs.get('flow_ratio', 20)"}
  text: >
    The growth step depends on settings the paper never states: a terminal is attached only to vessels whose
    flow is at most 20 terminal flows (flow_ratio), 50 candidate points per attempt each tried against its 2
    nearest vessels, a minimum distance V^(1/3) / n^1.5 shrunk by 0.9 when no point is found, points within 4
    radii of a vessel rejected, at most 20 optimizer iterations with the bifurcation point's coordinates bound
    to [0.05, 0.95], a sampling probability lowered by 0.9 in a cell that received a terminal, a convexity
    tolerance of 1e-2 and a limit of 100 nonconvex attempts. Four of the defaults differ from the code's own
    docstring (flow_ratio 10, threshold_exponent 1.0, n_points 100, n_closest_vessels 10, lines 65-81). The
    paper's tree statistics, timings and Fig. 2C alignment may depend on them; which values the paper's runs
    used is not stated. The optimizer is called as L-BFGS-B (as the paper says, p. 3) with a constraint
    1 - a0 - a1 >= 0 (line 229) that this method does not accept: scipy ignores it with a warning, so only the
    bounds hold.
- id: q_hidden_defaults
  kind: unstated_input
  about: [q_numerator_code, q_divisor_code, P_root_code, P_term_code, param_Q_term, param_P_root, param_P_term]
  citation: {file: svv/tree/data/data.py, lines: "269-278", quote: "0.125 / 2000.0, 'volumetric_flow'"}
  text: >
    The code's default terminal flow (0.125 / 2000.0 mL/s), root pressure (100 mmHg) and terminal pressure
    (60 mmHg) appear nowhere in the paper, whose Table S1 lists Q and Delta P without values. They set the
    absolute size of every tree (radii scale with the fourth root of flow over pressure drop). Why 0.125 and
    2000 is not said.
- id: q_biventricle_units
  kind: reading
  about: [tree_biventricle, run_biventricle_1000]
  text: >
    biventricle_tissue.stl has no stated unit and the code does not say whether it is the paper's biventricle
    (Figs. 2E, 4A). Read in svv's units (cm) it is about 8.6 x 10.6 x 7.0 and encloses about 210 cm^3, the size
    of a human heart's ventricles, which supports cm. The validations take it so; in mm its vessels would be
    ten times smaller and none would pass schwarz2020's 400 um.
- id: q_scale
  kind: choice
  about: [run_cube_1000, run_biventricle_1000]
  text: >
    The runs grow 1000-terminal trees, the size of Fig. 2E, three seeds each, to keep validation within
    minutes (about 15 s per cube tree and 45 s per biventricle tree here). The paper's organ-scale trees
    (10^4-10^6 terminals, Table S6) and its timings (Tables S5-S6, hardware-specific) are not rerun.
