- {id: cmp_biv_check_max, purpose: reproduction, computed: biv_check_sum_max, printed: murray_identity_paper}
- {id: cmp_biv_P_root_0d, purpose: consistency, computed: biv_P_root_0d, printed: P_root_code, note: q_export_pressure}
- {id: cmp_biv_P_root_0d_mu, purpose: consistency, computed: biv_P_root_0d_mu, printed: P_root_code}
- {id: cmp_biv_mu_export, purpose: consistency, computed: biv_mu_export, printed: mu_s3_paper}
