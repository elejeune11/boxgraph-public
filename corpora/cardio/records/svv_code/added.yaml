# ---- the domain of the cube trees (tree_growth)
- id: cube_edge_added
  quantity: domain_edge_length
  unit: cm
  printed: "1"
  basis: >
    Neither the paper nor the code gives the size of the cube of Fig. 2E. pyvista's default Cube, which svv's
    examples grow in, has edge 1 in the code's unit (cm, data.py's cgs default), and Fig. S1's lattices use
    "a 1cm cube tissue volume" (sexton2025 p. 37). The same choice as sexton2025's record (cube_edge_added).
  alternatives: ["2"]
  stands_for: the cube tissue domain of Fig. 2E

# ---- one bifurcation for resistance_update (as sexton2025's record, so the two can be set side by side)
- {id: l_parent_added, quantity: vessel_length, unit: cm, printed: "0.1",
   basis: "an illustrative parent length (sexton2025's l_parent_added); svv's update holds for any lengths",
   alternatives: ["0.3"], stands_for: length of the parent}
- {id: l_a_added, quantity: vessel_length, unit: cm, printed: "0.05",
   basis: "an illustrative daughter length (sexton2025's l_a_added)", alternatives: ["0.02"], stands_for: length of daughter a}
- {id: l_b_added, quantity: vessel_length, unit: cm, printed: "0.08",
   basis: "an illustrative daughter length (sexton2025's l_b_added)", alternatives: ["0.2"], stands_for: length of daughter b}
- {id: Q_a_added, quantity: vessel_flow, unit: ml/s, printed: "6.25 x 10^-5",
   basis: "one terminal's flow at svv's default (0.125 / 2000.0 mL/s)", alternatives: ["1.25 x 10^-4"], stands_for: flow of daughter a}
- {id: Q_b_added, quantity: vessel_flow, unit: ml/s, printed: "1.25 x 10^-4",
   basis: "twice daughter a's flow, so that the two daughters differ", alternatives: ["6.25 x 10^-5"], stands_for: flow of daughter b}
