- id: cmp_kappa_control_formula
  purpose: consistency
  computed: kappa_control_formula
  printed: kappa_fibrin_control
  conditions_ok: >
    Both are the hydraulic permeability of the untreated endothelial layer of the CFD model: the printed value
    is the one assumed for it (and for the fibrin, from ref. 31), the computed one is the paper's own formula
    for the IL-1beta layer applied to the control diffusive permeability. If the formula stands for the
    layer's permeability, the two should be of one order.
  note: see q_kappa_value, q_kappa_dimension and q_kappa_order
- id: cmp_v_poiseuille
  purpose: consistency
  computed: v_poiseuille_control
  printed: v_avg_network
  conditions_ok: >
    One straight rigid tube of radius 15 um and length 906 um (both added) under the control CFD vessel inlet
    pressure (3.15 Pa) and 0 Pa outlet, set against the average velocity over three in vitro networks (beads
    and CFD). A network with a leaky porous wall and interstitium is not one tube, so only the order is
    tested; the printed 'about 100' gets no verdict.
- id: cmp_tau_poiseuille
  purpose: consistency
  computed: tau_poiseuille_control
  printed: wss_avg_network
  conditions_ok: >
    As cmp_v_poiseuille: the wall shear stress of one straight tube under the control inlet pressure, against
    the CFD average over the vessel walls of three control networks ('about 0.1', no verdict).
- id: cmp_tau_from_v
  purpose: consistency
  computed: tau_from_printed_v
  printed: wss_avg_network
  conditions_ok: >
    The two printed averages (about 100 um/s, about 0.1 dyn/cm2) linked through Poiseuille flow in a tube of
    the added 15 um radius; in the network the average of 4 mu v / r over vessels is not 4 mu <v> / <r>, and
    the velocity average includes the bead tracks.
- id: cmp_head_vs_grid_drop
  purpose: consistency
  computed: dp_head
  printed: dp_grid_printed
  conditions_ok: >
    The 4 mm media head that drives the bead perfusion (p. 5), converted to a pressure, against the '~18 Pa
    pressure drop' of the grid model (p. 7, Fig. S5); the paper does not say at which time of the draining
    (Fig. 4e) the grid model's pressures were taken, so the head is an upper bound.
- id: cmp_s5b_range_vs_text
  purpose: consistency
  computed: dp_s5b_range
  printed: dp_grid_printed
  conditions_ok: The span of the Fig. S5b (control) pressure colour bar against the text's '~18 Pa pressure drop', which cites Fig. S5 for both devices.
- id: cmp_s5c_range_vs_text
  purpose: consistency
  computed: dp_s5c_range
  printed: dp_grid_printed
  conditions_ok: The span of the Fig. S5c (IL-1beta) pressure colour bar against the same '~18 Pa'.

