- id: cmp_pd_printed_vs_bars
  purpose: consistency
  computed: pd_printed_at_bars
  printed: fig4a_pd_bars
  conditions_ok: >
    Both are the diffusive permeability of the single-channel device's endothelium to 70 kDa dextran, control and
    IL-1beta: the values Sect. 4.11 prints for the CFD (5e-8 and 50e-8, unit printed m2/s, taken in m/s) against the
    bars of Fig. 4a (axis 10^-6 cm/s). The bars' statistic is unstated (mean, by the dots: cmp_pd_mean_vs_bars). This
    tests the reading of the printed unit (q_pd_unit).
- id: cmp_pd_mean_vs_bars
  purpose: consistency
  computed: pd_mean_of_points
  printed: fig4a_pd_bars
  conditions_ok: The mean of each group's plotted dots against the bar drawn over them; tests that the bars are means.
- id: cmp_fig3f_cfd_vs_beads
  purpose: validation
  computed: fig3f_cfd_central
  printed: fig3f_expt_central
  conditions_ok: >
    Same control networks, same quantity (velocity in the vessels): the CFD central line against the bead-tracking
    central line of each network (Fig. 3f), the paper's own validation. Not like for like in sampling: the CFD
    values include vessels the beads did not perfuse (p. 7), and the bead speeds were taken 5 s after a 4 mm head
    while the CFD uses fixed inlet pressures.
- id: cmp_fig4f_cfd_vs_beads
  purpose: validation
  computed: fig4f_cfd_central
  printed: fig4f_expt_central
  conditions_ok: As cmp_fig3f_cfd_vs_beads, for the three IL-1beta networks (Fig. 4f).
