id: r2_linear_fit
name: goodness of fit R2 of a least-squares line of algorithm diameter on manual diameter (Fig. 2a)
role: processing
from_words: true
stated: {page: 4, printed_page: "4 of 13", quote: "resulting in a goodness of fit of R2 = 0.967", where: "text, Fig. 2a"}
equation: "R2 = 1 - SS_res / SS_tot of the least-squares line y = a + b x through the points (= r^2, Pearson)"
inputs:
  P: {quantity: vessel_diameter, unit: um, curve: {quantity: manual_vessel_diameter, unit: um}, description: "the points of one algorithm in Fig. 2a"}
outputs:
  R2: {quantity: goodness_of_fit, unit: dimensionless}
settings: {}
stochastic: false
