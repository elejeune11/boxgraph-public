id: kappa_from_pd
name: hydraulic permeability of the endothelial layer from its diffusive permeability
role: model
stated: {page: 11, printed_page: "11 of 13", quote: "where κ (m2) is the hydraulic permeability, Pd is the diffusive perme", where: "Sect. 4.11"}
equation: "kappa ~ Pd mu L / eps_p"
inputs:
  Pd: {quantity: diffusive_permeability, unit: m/s}
  mu: {quantity: endothelial_layer_viscosity, unit: Pa*s}
  L: {quantity: characteristic_length, unit: m}
  eps: {quantity: porosity, unit: dimensionless}
outputs:
  kappa: {quantity: hydraulic_permeability, unit: m^2, description: "the number Pd mu L / eps_p in SI units, as the paper evidently intends; the dimensions of the right side are Pa m2, not m2 (q_kappa_dimension)"}
settings: {}
stochastic: false
