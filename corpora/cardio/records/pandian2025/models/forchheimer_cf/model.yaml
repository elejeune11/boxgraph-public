id: forchheimer_cf
name: Forchheimer friction factor of a porous compartment from its porosity
role: model
stated: {page: 11, printed_page: "11 of 13", quote: "the porous is related to its porosity", where: "Sect. 4.11, C_f equation"}
equation: "C_f = 1.75 / sqrt(150 eps_p^3)"
inputs:
  eps: {quantity: porosity, unit: dimensionless}
outputs:
  Cf: {quantity: forchheimer_friction_factor, unit: dimensionless}
settings: {}
stochastic: false
