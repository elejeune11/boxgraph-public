id: pressure_range
name: pressure drop across the grid model as the span of its pressure colour bar
role: processing
stated: {none: "added by the reader: the text's '~18 Pa pressure drop' (p. 7) cites Fig. S5, whose pressure colour bars give the largest and smallest pressure in the grid model"}
from_words: true
equation: "dp = p_max - p_min"
inputs:
  p_max: {quantity: grid_model_pressure, unit: Pa}
  p_min: {quantity: grid_model_pressure, unit: Pa}
outputs:
  dp: {quantity: device_pressure_drop, unit: Pa}
settings: {}
stochastic: false
