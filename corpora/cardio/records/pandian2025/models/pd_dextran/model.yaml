id: pd_dextran
name: diffusive permeability of the endothelium from the dextran time course
role: processing
stated: {page: 10, printed_page: "10 of 13", quote: "where r is the radius of the vessel (estimated from the image), and", where: "Sect. 4.6, second equation"}
equation: "P_D = (2 r_vessel / I_vessel) dI_gel/dt"
described_from: ref-24
inputs:
  r: {quantity: vessel_radius, unit: um, description: "radius of the single-channel vessel, from the image"}
  I_vessel: {quantity: dextran_intensity, unit: dimensionless, description: "dextran intensity within the vessel"}
  dIgel_dt: {quantity: dextran_intensity_rate, unit: 1/s, description: "rate of rise of the dextran intensity in the fibrin gel"}
outputs:
  PD: {quantity: diffusive_permeability, unit: cm/s}
settings: {}
stochastic: false
