id: hydrostatic_head
name: pressure difference of a media height difference between the ports (reader's check)
role: model
stated: {none: "added by the reader: the paper drives the bead perfusion with a 4 mm media pressure differential (p. 5) and states no conversion to a pressure"}
from_words: true
equation: "dp = rho g h"
inputs:
  rho: {quantity: fluid_density, unit: kg/m^3}
  g: {quantity: gravitational_acceleration, unit: m/s^2}
  h: {quantity: media_head_height, unit: mm}
outputs:
  dp: {quantity: device_pressure_drop, unit: Pa}
settings: {}
stochastic: false
