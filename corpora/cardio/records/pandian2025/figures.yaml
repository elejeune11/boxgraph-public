# Calibrated figure readings (figure pass, 2026-11-12). Every reading is made by the record's own code in
# figures/, run on the page region rendered at `dpi`; crops are in pixels of the page at that dpi. See
# figures.md for what each panel is and what was left out.

# ---- Fig. 2a (p. 5): algorithm diameters against manual diameters of the same vessels (raster figure) ----
- id: fig2a_inhouse
  page: 5
  where: "Fig. 2(a)"
  what: "every pink filled square (In-house code): diameter from the paper's algorithm against the manual diameter"
  dpi: 900
  crop: [2220, 690, 4320, 3000]
  x: {quantity: manual_vessel_diameter, unit: um}
  y: {quantity: vessel_diameter, unit: um}
  mode: code
  code: figures/fig2a_inhouse.py
  at: []
- id: fig2a_muves
  page: 5
  where: "Fig. 2(a)"
  what: "every teal filled diamond (mu-ves, i.e. muVES3D): diameter against the manual diameter"
  dpi: 900
  crop: [2220, 690, 4320, 3000]
  x: {quantity: manual_vessel_diameter, unit: um}
  y: {quantity: vessel_diameter, unit: um}
  mode: code
  code: figures/fig2a_muves.py
  at: []
- id: fig2a_reaver
  page: 5
  where: "Fig. 2(a)"
  what: "every light blue open circle (Reaver): diameter against the manual diameter"
  dpi: 900
  crop: [2220, 690, 4320, 3000]
  x: {quantity: manual_vessel_diameter, unit: um}
  y: {quantity: vessel_diameter, unit: um}
  mode: code
  code: figures/fig2a_reaver.py
  at: []

