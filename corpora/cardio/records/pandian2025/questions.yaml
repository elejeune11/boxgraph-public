# ---- Cross-record validation job: pandian2025 with pries1992 (2026-11-12) ----
- id: q_no_validation_pries1992
  kind: unstated_model
  about: [poiseuille_tube, wss_from_velocity, hydrostatic_head, pressure_range, kappa_from_pd, pd_dextran, forchheimer_cf, r2_linear_fit, group_mean_points, pd_by_group, mu_media, mu_endo_printed]
  text: >
    (Cross-record validation, pandian2025 with pries1992.) No validation was added in either direction.
    Neither paper cites the other (refs. 32 and 33, cited for the assumed 3e-3 'similar to that of whole
    blood', are the authors' own vein papers). pries1992 measures only the relative apparent viscosity of
    blood in glass tubes (Figs. 2, 3, 5 and the text values ~3.2 and ~1.25 at Hct_D 0.45) and the tube
    diameter of that minimum; no model here outputs a relative apparent viscosity: poiseuille_tube and
    wss_from_velocity take a viscosity as an input and give a velocity or a wall shear stress, which
    pries1992 does not measure. In the other direction the pries1992 laws (Eqs. 2-10) give blood viscosity
    and hematocrits as functions of hematocrit and tube diameter; this network is perfused with cell-free
    culture medium, for which Eq. 7 reduces to eta_rel = 1 at Hct_D = 0 and predicts nothing measured here
    (the paper measures no viscosity; mu_media and mu_endo_printed are assumed values, and the latter is an
    endothelial-layer parameter, not a blood viscosity). Running Eq. 7 at the 20-40 um diameters with an
    assumed hematocrit would set a law against an assumption, not against a measurement.
  citation: {none: "a finding of the validation job between pandian2025 and pries1992, not a printed statement"}
# ---- Cross-record validation job: pandian2025 with pries2005 (2026-11-12) ----
- id: q_no_validation_pries2005
  kind: unstated_model
  about: [poiseuille_tube, wss_from_velocity, hydrostatic_head, pressure_range, kappa_from_pd, pd_dextran, forchheimer_cf, r2_linear_fit, group_mean_points, pd_by_group, diameter_range, fig3e_radius_central, fig4b_radius_median, fig3f_expt_central, fig4a_pd_bars]
  text: >
    (Cross-record validation, pandian2025 with pries2005.) No validation was added in either direction.
    Neither paper cites the other, and this paper does not discuss an endothelial surface layer or blood
    rheology. pries2005's one measurement is the rat-mesentery vessel-diameter distribution of its Fig. 2
    (pries2005/diameter_percentiles_fig); no model here gives a diameter distribution (r2_linear_fit and
    group_mean_points summarize this paper's own figures, the others give velocities, shear stress,
    pressures, permeabilities or C_f). In the other direction the pries2005 laws output blood viscosities
    (vitro_viscosity, vivo_viscosity), ESL thicknesses (esl_thickness and the Discussion arithmetic), HT/HD
    ratios and diameters of viscosity or Weff extrema; this network is perfused with cell-free culture medium
    (no hematocrit, no measured viscosity: mu_media is assumed), so the viscosity and Fahraeus laws predict
    nothing measured here. The endothelial layer of this CFD model is a porous monolayer whose thickness is
    not printed (q_cfd_not_runnable), not the in vivo glycocalyx Weff/Wph of pries2005, and nothing measures
    it. The measured diameters (diameter_range, Figs. 2a, 3e, 4b) and bead velocities (Figs. 3f, 4c, 4f) and
    the dextran P_D (Fig. 4a) are predicted by no pries2005 model, and an engineered 20-40 um network is not
    expected to match rat mesentery.
  citation: {none: "a finding of the validation job between pandian2025 and pries2005, not a printed statement"}
# ---- Cross-record validation job: pandian2025 with rakusan1992 (2026-11-12) ----
- id: q_no_validation_rakusan1992
  kind: unstated_model
  about: [poiseuille_tube, wss_from_velocity, hydrostatic_head, pressure_range, kappa_from_pd, pd_dextran, forchheimer_cf, r2_linear_fit, group_mean_points, pd_by_group, diameter_range, fig3e_radius_central, fig4b_radius_median]
  text: >
    (Cross-record validation, pandian2025 with rakusan1992.) No validation was added in either direction.
    Neither paper cites the other. This record's models give vessel velocities, wall shear stress, pressure
    drops, permeabilities, a Forchheimer friction factor and statistics of this paper's own figures, for an
    in vitro HUVEC + fibroblast network in fibrin perfused with culture medium; rakusan1992 measures none of
    these. Its measurements are human (and, in Table 1, rat) post-mortem left-ventricular morphometry in
    transverse section: capillary density, myocyte density, myocyte/capillary ratio, capillary domain area
    and radius, the log-SD of domain radii, myocyte area fraction, heart and body weight and body surface
    area. No model here outputs any of them. Its capillary domain radius is the radius of the tissue
    cylinder a capillary supplies, not a vessel radius, so it was not mapped to vessel_radius. In the other
    direction rakusan1992's models take a capillary density, a domain area, a myocyte density or a heart
    weight, none of which this paper prints (the vessel length per volume of the released sample is in
    pandian_code, from one trimmed test stack of a 3D random network, not a count of oriented capillaries
    per transverse section area). An engineered 20-40 um network is in any case not expected to match human
    myocardial capillaries. See rakusan1992/q_no_validation_vs_pandian2025.
  citation: {none: "a finding of the validation job between pandian2025 and rakusan1992, not a printed statement"}
