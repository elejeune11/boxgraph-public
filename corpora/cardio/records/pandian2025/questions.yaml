  kind: unstated_model
  about: [poiseuille_tube, wss_from_velocity, hydrostatic_head, pressure_range, kappa_from_pd, pd_dextran, forchheimer_cf, diameter_range]
  text: >
    (Cross-record validation, pandian2025 with kaneko2011.) No validation was added in either
    direction. Neither paper cites the other. This record's models give vessel velocities, wall shear
    stress, pressure drops, permeabilities and a friction factor of an in vitro network perfused with
    culture medium; its processing models (r2_linear_fit, group_mean_points, pd_by_group) work on this
    paper's own figures. kaneko2011 measures none of these. Its measurements are human post-mortem
    capillary morphometry from serial sections: capillary densities, segment lengths and their
    histogram, arteriolar-venular distance, capillary bundle and micronecrosis axes, sinus volumes and
    sizes, and a terminal arteriole diameter. It measures no flow, velocity, pressure or permeability.
    Its diameters (terminal arteriole 15 um, capillary sinuses 30-50 um) could only enter
    poiseuille_tube as an input, and kaneko2011 measures no velocity or wall shear stress to set the
    result against. In the other direction, kaneko2011's models take a capillary density, an
    arteriolar-venular distance, a segment-length histogram or bundle axes, none of which this paper
    prints. An engineered 20-40 um network is in any case not expected to match human tissue
    capillaries. See kaneko2011/q_no_validation_pandian2025.
