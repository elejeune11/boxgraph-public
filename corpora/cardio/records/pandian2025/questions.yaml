- id: q_pd_unit
  kind: possible_error
  about: [pd_control_printed, pd_il1b_printed, pd_control_mps, pd_il1b_mps, pd_dextran]
  text: >
    The diffusive permeabilities are printed as 5e-8 and 50e-8 m2/s (p. 11). The paper's own definitions,
    J = P_D (C_vessel - C_gel) and P_D = 2 r / I_vessel dI_gel/dt (p. 10), make P_D a velocity, and Fig. 4a
    plots it in 10^-6 cm/s (control bar near 5, IL-1beta bar near 35, by eye; the figure was not read in this
    job). 5e-8 m/s = 5 x 10^-6 cm/s agrees with the control bar, so the printed unit is probably meant as m/s;
    the record keeps the printed values with the printed unit and uses them in m/s as added inputs. The
    IL-1beta value 50e-8 is then about 1.4 times the IL-1beta bar of Fig. 4a (by eye), which should be
    checked with a calibrated reading.
  citation: {page: 11, quote: "ability of the endothelial monolayer (control—5e-8 m2/s and IL-1β"}
- id: q_mu_unit
  kind: possible_error
  about: [mu_endo_printed, mu_endo_pas]
  text: >
    The viscosity in the hydraulic permeability formula is printed "3e-3 Pa" (p. 11), a pressure; a dynamic
    viscosity "similar to that of whole blood" is 3e-3 Pa s. The record keeps the printed unit and uses
    3e-3 Pa s as an added input. Why a viscosity of the endothelial monolayer (rather than of the medium,
    1.002e-3 Pa s, which flows through it) is used is not said.
  citation: {page: 11, quote: "(assumed 3e-3 Pa, similar to that of whole blood32,33)"}
- id: q_kappa_dimension
  kind: possible_error
  about: [kappa_from_pd]
  text: >
    kappa ~ Pd mu L / eps_p is dimensionally inconsistent: with Pd in m/s, mu in Pa s and L in m the right
    side is in Pa m2 (with the printed units, m2/s, Pa and m, it is Pa m3/s), not m2. Kedem-Katchalsky or
    Starling relations link a hydraulic conductivity L_p (m/(Pa s)) to kappa = L_p mu L, not a diffusive
    permeability. The model is entered as printed, its number taken in SI units.
  citation: {page: 11, quote: "where κ (m2) is the hydraulic permeability, Pd is the diffusive perme"}
- id: q_kappa_order
  kind: possible_error
  about: [kappa_il1b_formula, kappa_control_formula, kappa_fibrin_control, cmp_kappa_control_formula]
  text: >
