    control layer (with Pd in m/s), five to six orders of magnitude below the 1.2e-7 m2 assumed for the control
    layer. Taken as printed, the IL-1beta treated endothelium would then be some 2 x 10^4 times less permeable
    to flow than the untreated one in the CFD, the opposite of the leakage the paper reports for IL-1beta
    (pp. 7-8). The paper does not print the kappa it used for IL-1beta, so which value entered the CFD cannot
    be checked.
  citation: {page: 11, quote: "devices it was calculated as below"}
