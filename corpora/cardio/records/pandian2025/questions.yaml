- id: q_pd_factor
  kind: possible_error
  about: [pd_dextran, pd_control_printed, pd_il1b_printed]
  text: >
    The printed P_D = (2 r_vessel / I_vessel) dI_gel/dt (p. 10, checked on the page image) has the factor 2r.
