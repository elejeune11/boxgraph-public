- id: q_ns_sign
  kind: possible_error
  about: [rho_media, mu_media, q_cfd_not_runnable]
  text: >
    The Navier-Stokes equation for the vessel lumen is printed (p. 11, checked on the page image) as
    rho (v . grad) v = - div [ -p I + mu (grad v + (grad v)^T) ], with a minus sign in front of the divergence.
    The usual steady form, and the Brinkman equation printed just below it, have + div [ -p I + ... ]. As printed,
    the pressure gradient and the viscous term both have the wrong sign. This is probably a typesetting slip,
    because COMSOL solves the standard form. The record has no runnable model of the CFD (q_cfd_not_runnable), so
    nothing depends on it.
  citation: {page: 11, quote: "where ρ is the fluid density (1000 kg m3 for media)", where: "Navier-Stokes equation"}
