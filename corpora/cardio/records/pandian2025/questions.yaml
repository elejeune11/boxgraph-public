  text: >
    (Cross-record validation, pandian2025 with pandian_code, its released code.) No validation was added in this
    record. Its models give velocities, wall shear stress, pressure drops, permeabilities, a friction factor and
    statistics of its own figures; the code record measures none of these (its values are settings written in the
    code, the sample stack's tags and the sample network's geometry, which its own models compute), and its one
    measured datum is a copy of this record's diameter_range. The paper's CFD, which would predict the sample's flow,
    is not runnable (q_cfd_not_runnable). In the other direction pandian_code/sample_network, run on the released
    sample, is judged against diameter_range (pandian_code/val_D_median_vs_paper_range,
    val_D_mean_lw_vs_paper_range; pandian_code/q_validation_pandian2025, which also bears on q_fig_radius_text).
