    volume-to-surface ratio, r/2 = d/4; the commonly used form, as in the microvessel protocol the paper cites for
    its MATLAB code (ref. 26, not in the corpus), is P_D = (1/I) dI/dt d/4. With 2r the printed P_D would be 4
    times the usual form. The paper cites ref. 24 for the formula, and the printed P_D values cannot be
    recomputed (no intensities are printed), so whether the factor is a misprint or a different geometry cannot
    be checked here.
  citation: {page: 10, quote: "where r is the radius of the vessel (estimated from the image), and"}
- id: q_pd_citation
  kind: reading
  about: [pd_dextran]
  text: >
