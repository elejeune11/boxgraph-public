- id: q_eq12_constants
  kind: possible_error
  about: [fahraeus_vitro, cmp_f4bot_vitro_hd60, cmp_f4bot_vitro_hd45, cmp_f4bot_vitro_hd30, cmp_f4bot_vitro_hd20, cmp_f4bot_vitro_hd10]
  text: "The thin (glass-tube) HT/HD curves of Fig. 4 bottom are not reproduced by Eq. 12 as printed (exponents -0.415 D and -0.011 D): the printed form lies below the curves at small diameters (by several hundredths near 5 um) and differs in shape up to ~200 um, while the thin viscosity curves of Fig. 4 top are reproduced by Eqs. 5-7 at every read point. The readings agree with the same expression with exponents -0.35 D and -0.01 D, the form of this parametric relation in the earlier literature the paper cites (ref. 27 and its predecessors); this was checked by hand outside the record and is not entered as a variant, since it changes printed numbers. Either Eq. 12's constants are misprinted or the figure was drawn with the older constants. Since fahraeus_vivo and fahraeus_vivo_core use Eq. 12 inside, their comparisons with Fig. 4 bottom carry this difference too."
  citation: {page: 3, quote: "A previously published parametric", where: "Eq. 12"}
- id: q_eq13_figure
  kind: possible_error
  about: [fahraeus_vivo, fahraeus_vivo_core, q_eq13_factor]
  text: "Fig. 4 bottom, read in this pass, bears on q_eq13_factor: Eq. 13 as printed (factor (D/Dph)^2) misses every read point of all five thick HT/HD curves (cmp_f4bot_vivo_hd*), its values lying above the in vitro curves where the figure has them below; the variant with (Dph/D)^2 (cmp_f4bot_vivo_hd*_core) reproduces most points, more for the higher hematocrits, and the rest differ in the way the Eq. 12 constants do (q_eq12_constants). The figure supports the corrected direction of the factor."
  citation: {page: 6, where: "Fig. 4 (bottom)", quote: "Thick black lines, present results for different HD values"}
