  kind: unexplained_difference
  about: [vivo_viscosity, cmp_f4top_vivo_hd60, cmp_f4top_vivo_hd45, cmp_f4top_vivo_hd30, cmp_f4top_vivo_hd20]
  text: "The thick viscosity curves of Fig. 4 top are reproduced by eta_vivo = eta_vitro(Dph) (D/Deff)^4 with Eqs. 5-11 from ~6 um to 1000 um at every hematocrit, and at all diameters for HD 10%, but below ~5 um (3.2-5 um, where the free-flow diameter Dph falls toward 3 um) the model lies 10-30% above the curves for HD 20-60%, more for higher hematocrit. The readings there sit on the curves in the overlays. The text does not say how the curves were computed at the smallest diameters (e.g. whether the 2.8-um red-cell constraint of Fig. 2, or a lower limit on Dph in the in vitro law, was applied)."
