- id: q_no_validation_smith2004
  kind: choice
  about: [ref-18, diameter_percentiles_fig, vivo_viscosity, esl_thickness]
  text: >-
    (Cross-validation job, pries2005 + smith2004.) No validation is added in either direction. The
    paper's ref. 18 is Long, Smith, Pries, Ley & Damiano 2004 (PNAS 101: 10060-5, microviscometry),
    and ref. 44 is Smith, Long, Damiano & Ley (near-wall micro-PIV); neither is the record smith2004
    (Smith, Chase, Nokes, Shaw & Wake, a lumped heart-and-circulation model, Med Eng Phys 26), which
    this paper does not cite. The ESL estimates of refs. 18 and 44 are cited in the Discussion but are
    not in smith2004. This record's only measurement is the distribution of vessel diameters in the
    networks (diameter_percentiles_fig, Fig. 2); no smith2004 model outputs a vessel diameter, an
    in vivo viscosity, an ESL thickness or a hematocrit ratio. smith2004 holds no measurement (its
    figures are simulation output, its typical pressures and stroke volume are reported from other
    sources), and this record's models (viscosity, ESL thickness, Fahraeus relations) output none of its
    quantities: its resistances are lumped parameters, not computed from a vessel diameter and viscosity.
  citation: {page: 7, quote: "velocimetry, Long et al. (18) and Smith et al. (44) estimated", where: text}
- id: q_p92_validations_are_fits
  kind: choice
  about: [vitro_viscosity, vitro_minimum, fahraeus_vitro]
  text: >
    Added by the validation job against pries1992. Eqs. 5-7 are pries1992's Eqs. 2, 4 and 7 (ref. 27),
    whose constants pries1992 fitted to the very tube data it plots in Figs. 3 and 5, so the nine
    validations against pries1992's measured points are entered as fit_quality, not as tests. Not
    used: pries1992's eye-stated measurements ~3.2 (large tubes), ~1.25 and ~7 um (the minimum) at HD
    0.45, which are approximate (no verdict) and are already restated here as eta_large_tube_printed
    and eta_small_tube_printed with comparisons; pries1992's Fig. 2 inset (residuals from Eq. 2, a
    quantity no model here outputs). pries1992 measures no tube hematocrit, so Eq. 12 (fahraeus_vitro)
    has nothing there to be judged against. The Fig. 3 panel diameters are added (D_p92_fig3_*) since
    pries1992 prints them only as panel labels.
  citation: {page: 2, quote: "These data were used to derive a parametric"}
- id: q_no_validation_pries1990
  kind: choice
  about: [ref-31, diameter_percentiles_fig, network_simulation, vivo_viscosity, fahraeus_vitro, eta_lipowsky]
  text: >-
    (Cross-validation job, pries1990 + pries2005.) No validation is added in either direction.
    pries2005 cites pries1990 (ref. 31) for its phase-separation approach (p. 2, "according to the
    approach described earlier (31) with modifications"), for the in vitro Fahraeus relation Eq. 12
    (p. 3) and for mechanisms proposed earlier (p. 6); it does not say that its models explain or
    are compared with any pries1990 measurement. pries1990's measurements are network data (Table 3
    segment hematocrits, Fig. 5 hematocrit distributions, Fig. 6 AV velocities of its ref. 17, Fig. 7
    pressures of its refs. 25-26), inflow hematocrits and segment counts, and Fig. 2's FQE against
    FQB at one bifurcation whose diameters and hematocrit are not printed. The only model here that
    produces such quantities is network_simulation, which is not runnable (q_network_data); the
    closed-form laws (vitro_viscosity, vivo_viscosity, esl_thickness, fahraeus_vitro, fahraeus_vivo)
    output viscosities, layer thicknesses and HT/HD ratios, none of which pries1990 measures (its
    Figs. 1 and 3 are drawn from its own Eqs. 1-3 and 7, origin predicted). This record's only
    measurement, the vessel-diameter distribution of Fig. 2 (diameter_percentiles_fig), is predicted
    by no pries1990 model. Lipowsky's 4.2 cP at ~30 um (eta_lipowsky) is reported from ref. 16, not
    measured by either paper, is absolute rather than relative to plasma, and has no stated
    hematocrit, so pries1990's in vivo law (Eq. 7) cannot be run on its conditions; it was not used.
  citation: {page: 2, quote: "approach described earlier (31) with modifications to render"}
