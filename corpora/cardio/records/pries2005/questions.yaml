- id: q_eq13_factor
  kind: possible_error
  about: [fahraeus_vivo, fahraeus_vivo_core]
  text: "Eq. 13 multiplies (HT/HD)vitro at Dph by (D/Dph)^2 >= 1, which raises HT/HD in vivo above the in vitro value at the free-flow diameter, whereas the text (p. 5) and Fig. 4 bottom show a deeper minimum in vivo than in vitro near 10 um. Red cells confined to a core of diameter Dph fill a fraction (Dph/D)^2 of the anatomic cross section, so the factor was probably meant as (Dph/D)^2 (variant fahraeus_vivo_core). With no figure reading in this record, neither form is compared with a printed value."
  citation: {page: 3, quote: "and multiplying by a factor to reflect the difference", where: "Eq. 13"}
- id: q_eq14_ratio
  kind: possible_error
  about: [network_simulation]
  text: "Eq. 14 gives cell velocity Vc = Vb (HT/HD)vivo. Since HT/HD < 1 (Fahraeus effect: red cells move faster than the mean blood velocity), continuity of red cell flux gives Vc = Vb (HD/HT); the printed form makes cells slower than blood. Eq. 14 feeds only the non-runnable network fit, so no printed number tests it."
  citation: {page: 3, quote: "Cell velocity was then calculated as follows", where: "Eq. 14"}
- id: q_intro_hd40
  kind: possible_error
  about: [eta_large_tube_printed, eta_small_tube_printed, HD_intro]
  text: "The introduction gives relative viscosities of ~3.2 (tubes above ~1 mm) and ~1.25 (6-7 um) for a discharge hematocrit of 40%. These are the values of eta_0.45 (Eq. 6), i.e. for HD = 45%: at HD = 40% Eqs. 5-7 give about 2.8 at 1 mm. The '40%' may be a slip for 45%."
  citation: {page: 1, quote: "fraction of red blood cells or discharge hematocrit of 40%"}
- id: q_hd_unstated
  kind: unstated_input
  about: [HD_vitro_minimum, HD_figure]
  text: "The statements on the location of the in vitro viscosity minimum, the peak of the effective ESL thickness, the abstract's thickness range and the minimum of in vivo viscosity give no hematocrit; 0.45 was added, with alternatives. The peak location and Wph do not depend on HD in Eqs. 8-10."
- id: q_network_data
  kind: unstated_input
  about: [network_simulation, Doff_fit, Dcrit_fit, D50_fit, Eamp_fit, Ewidth_fit, Epeak_fit, EHD_fit]
  text: "The network simulation and the fit that produced the parameters of Eqs. 8-11, and the deviation parameters VERR, HERR and NINV of Fig. 1, need the three measured network data sets, which are not published; the fitted parameters cannot be checked here."
- id: q_eamp_units
  kind: reading
  about: [Eamp_fit, Ewidth_fit, Eamp_fit_hd_independent]
  text: "Eamp and Ewidth are printed without units. They were read as um and 1/um because Eamp is the height of a thickness (Eq. 9) and the paper states that all diameters are given in micrometres."
- id: q_range_ends
  kind: reading
  about: [Wph_abstract_lo, Wph_abstract_hi, W_transition_lo, W_transition_hi]
  text: "The printed ranges '~0.8-1 um for 10- to 40-um vessels' and 'ESL thickness of ~0.5-0.7 um' with '7 to 9 um' -> '8-10.4 um' were split end to end (low with low, high with high), which is the reading under which the paper's 8 and 10.4 follow; the abstract's range was read as Wph at 10 and at 40 um."
- id: q_vivo_min_range
  kind: choice
  about: [run_vivo_minimum]
  text: "The minimum of in vivo effective viscosity was sought above 11 um (just above Dcrit), to exclude the small-diameter branch below the ESL peak seen in Fig. 4; the text does not state the range searched."
- id: q_figures
  kind: reading
  about: [esl_thickness, vivo_viscosity, fahraeus_vivo]
  text: "Figs. 1, 2 and 4 carry the paper's main plotted results (deviation parameters, Weff and Wph against diameter, in vivo and in vitro viscosity and HT/HD against diameter). The figure tools could not be run in this job, so they were not read; a later reading should add them and compare them with the runs of esl_thickness, vivo_viscosity, vitro_viscosity, fahraeus_vitro and both forms of Eq. 13."
