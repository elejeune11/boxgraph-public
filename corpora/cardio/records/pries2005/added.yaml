- id: HD_vitro_minimum
  quantity: discharge_hematocrit
  unit: dimensionless
  printed: "0.45"
  basis: "The statements of a viscosity minimum at 5-7 um (p. 2) and 6-7 um (abstract) give no hematocrit; 0.45 is the hematocrit the law is normalised at (Eq. 6)"
  alternatives: ["0.1", "0.3", "0.6"]
  stands_for: HD in Eqs. 5-7 for the location of the minimum
- id: D_tube_10
  quantity: tube_diameter
  unit: um
  printed: "10"
  basis: "A tube diameter equal to the 10-um anatomic diameter at which the in vivo runs are made, for the in vitro curve of Fig. 4 bottom (glass tubes of equivalent diameters); no value of it is compared"
  alternatives: ["8", "12"]
  stands_for: D in Eq. 12 for the in vitro reference
- id: HD_figure
  quantity: discharge_hematocrit
  unit: dimensionless
  printed: "0.45"
  basis: "Fig. 2 and Fig. 4 show HD of 10, 20, 30, 45 and 60%; the text on the peak (p. 3), on the abstract's thickness range and on the minimum of the in vivo viscosity (p. 5) gives no hematocrit; 0.45 is the middle curve"
  alternatives: ["0.1", "0.3", "0.6"]
  stands_for: HD in Eqs. 8-11 and the in vivo viscosity for the statements on Figs. 2 and 4
