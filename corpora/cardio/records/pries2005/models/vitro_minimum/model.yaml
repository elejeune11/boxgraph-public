id: vitro_minimum
name: diameter of minimal relative apparent viscosity in vitro (Eqs. 5-7)
role: model
stated: {page: 2, quote: "apparent viscosity is obtained, and the presence of suspended red", where: "text after Eq. 7"}
equation: "D_min = argmin over D of eta_vitro(D, HD) (Eqs. 5-7)"
inputs:
  HD: {quantity: discharge_hematocrit, unit: dimensionless}
outputs:
  D_min: {quantity: tube_diameter, unit: um}
settings: {D_lo: 3.3, D_hi: 1000.0, n: 200001}
stochastic: false
from_words: true
built_from: [vitro_viscosity]
