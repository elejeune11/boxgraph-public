id: esl_from_volume
name: average ESL thickness from total layer volume and endothelial area
role: model
stated: {page: 7, quote: "the corresponding average ESL thickness would be", where: Discussion}
equation: "W = V_ESL / S_endothelium"
inputs:
  V: {quantity: esl_volume, unit: ml}
  S: {quantity: endothelial_area, unit: m^2}
outputs:
  W: {quantity: esl_thickness, unit: um}
settings: {}
stochastic: false
from_words: true
