id: vitro_viscosity
name: in vitro viscosity law (Eqs. 5-7)
role: model
stated: {page: 2, quote: "according to the following equation", where: "Eqs. 5-7"}
equation: "eta_vitro = 1 + (eta_0.45 - 1) [(1 - HD)^C - 1]/[(1 - 0.45)^C - 1]; eta_0.45 = 220 exp(-1.3 D) + 3.2 - 2.44 exp(-0.06 D^0.645); C = (0.8 + e^(-0.075 D)) (-1 + 1/(1 + 10^-11 D^12)) + 1/(1 + 10^-11 D^12)"
inputs:
  D: {quantity: tube_diameter, unit: um, description: "tube diameter; all diameters are given in micrometers"}
  HD: {quantity: discharge_hematocrit, unit: dimensionless, description: "as a fraction (the law is normalised at HD = 0.45)"}
outputs:
  eta_vitro: {quantity: relative_viscosity_vitro, unit: dimensionless}
settings: {}
stochastic: false
described_from: pries1992
