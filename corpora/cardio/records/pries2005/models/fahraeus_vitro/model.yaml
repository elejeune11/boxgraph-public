id: fahraeus_vitro
name: in vitro Fahraeus effect (Eq. 12)
role: model
stated: {page: 3, quote: "A previously published parametric", where: "Eq. 12"}
equation: "(HT/HD)vitro = HD + (1 - HD) (1 + 1.7 e^(-0.415 D) - 0.6 e^(-0.011 D))"
inputs:
  D: {quantity: tube_diameter, unit: um}
  HD: {quantity: discharge_hematocrit, unit: dimensionless}
outputs:
  ratio: {quantity: hematocrit_ratio_vitro, unit: dimensionless}
settings: {}
stochastic: false
