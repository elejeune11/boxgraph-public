notes: >
  In scope: the in vitro viscosity law as printed here (Eqs. 5-7, from ref. 27), the
  ESL thickness functions (Eqs. 8-11) with the optimised parameter set (EHD > 0), the
  ESL-based in vivo viscosity eta_vivo = eta_vitro(Dph) (D/Deff)^4, the in vitro and
  in vivo Fahraeus relations (Eqs. 12-13), and the Discussion's arithmetic (layer
  thickness from Lipowsky's 4.2 vs ~1.5 cP at ~30 um; average thickness from ~720 ml
  over ~350 m^2; the 7-9 um tube transition moved to 8-10.4 um anatomic by a
  ~0.5-0.7 um layer). Compared: the location of the in vitro viscosity minimum
  (5-7 um, 6-7 um), the peak of Weff at 10.5 um, Wph at 10 and 40 um against the
  abstract's ~0.8-1 um, the minimum of in vivo viscosity (~30-50 um), the
  introduction's ~3.2 and ~1.25, and the three Discussion results. Many printed
  values carry a tilde and get no verdict. Unstated hematocrits were added as 0.45
  with alternatives. Eq. 13 as printed gives HT/HD in vivo above the in vitro value
  (above 1 at 10 um), against the paper's text and Fig. 4; a variant with (Dph/D)^2
  is recorded beside it, but with no figure reading neither is compared. Eq. 14 and
  the introduction's '40%' are flagged as possible errors. Not runnable: the network
  simulation and parameter fit (Eqs. 1-4, 14), since the network data are not
  published; its fitted parameters are data with origin fitted. Left out: Figs. 1, 2
  and 4 were not read, because the figure-rendering commands were refused in this
  job (see figures.md); the hematocrit-independent parameter set is recorded only
  where it differs (Eamp 1.23, EHD 0) and is not run; measurement precision (0.25,
  0.11), network sizes and flows, the velocity deviation 0.54 +/- 0.79 mm/s, plasma
  viscosity ~1.05 cP, the 2.8 um red-cell constraint and the literature thickness
  estimates in the Discussion feed no model and were left out.
  Figure pass (2026-11-04): Figs. 1, 2 and 4 are now read with calibrated code readings
  (figures.yaml, figures/, figures.md): the three bar charts of Fig. 1 with their SEM error
  bars (recorded, not compared: the network simulation is not runnable), the box plot of
  measured diameters in Fig. 2, the five Weff curves and the Wph boundary of Fig. 2, and the
  twenty curves of Fig. 4 (in vivo and glass-tube viscosity and HT/HD at HD 10-60%). The
  hematocrits labelled on the curves are recorded as data (hd_fig_*), and each curve is
  compared with its model swept over the read diameters; Fig. 4 bottom is compared with both
  forms of Eq. 13. Fig. 3 (micrographs) has no values.
