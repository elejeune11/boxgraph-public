- {id: vessel_diameter, name: apparent anatomic vessel diameter, dimension: "[length]", description: "D, the lumen diameter of a microvessel as measured by intravital microscopy (without visualisation of the ESL)"}
- {id: tube_diameter, name: glass tube lumen diameter, dimension: "[length]", description: "D in the in vitro viscosity law (Eqs. 5-7) and the in vitro Fahraeus relation (Eq. 12): the inner diameter of a glass tube, or the diameter it is evaluated at"}
- {id: discharge_hematocrit, name: discharge hematocrit, dimension: dimensionless, description: "HD, the flow fraction of red blood cells in the blood passing through a vessel"}
- {id: relative_viscosity_vitro, name: relative apparent blood viscosity in glass tubes, dimension: dimensionless, description: "eta_vitro of Eq. 5: apparent viscosity relative to the suspending medium (in vitro viscosity law)"}
- {id: relative_viscosity_vivo, name: effective relative blood viscosity in vivo, dimension: dimensionless, description: "eta_vivo = eta_vitro (D/Deff)^4: effective viscosity relative to plasma, referred to the anatomic diameter"}
- {id: esl_thickness_effective, name: effective ESL thickness, dimension: "[length]", description: "Weff of Eq. 11: the rheologically effective thickness of the endothelial surface layer"}
- {id: esl_thickness_physical, name: physical ESL thickness, dimension: "[length]", description: "Wph of Eq. 10: the assumed physical thickness of the layer"}
- {id: esl_thickness, name: endothelial surface layer thickness, dimension: "[length]", description: "a layer thickness inferred by a method the paper quotes or by its own arithmetic (not Eqs. 10-11)"}
- {id: esl_offset_diameter, name: ESL threshold diameter, dimension: "[length]", description: "Doff of Eqs. 8-9: diameter below which the layer thickness is zero"}
- {id: esl_critical_diameter, name: ESL peak diameter, dimension: "[length]", description: "Dcrit of Eq. 9: diameter of the peak of the biphasic component"}
- {id: esl_half_diameter, name: ESL asymptote half-saturation parameter, dimension: "[length]", description: "D50 of Eq. 8"}
- {id: esl_max_thickness, name: maximal ESL thickness, dimension: "[length]", description: "Wmax of Eq. 8: thickness approached at large diameters"}
- {id: esl_peak_amplitude, name: amplitude of the peak component, dimension: "[length]", description: "Eamp of Eq. 9: height of the biphasic component (a thickness, in micrometres since all diameters are)"}
- {id: esl_peak_decay, name: decay rate of the peak component, dimension: "1/[length]", description: "Ewidth of Eq. 9: exponential decay rate above Dcrit"}
- {id: esl_peak_weight, name: weight of the peak component in the physical thickness, dimension: dimensionless, description: "Epeak of Eq. 10"}
- {id: esl_hematocrit_sensitivity, name: hematocrit sensitivity of the peak component, dimension: dimensionless, description: "EHD of Eq. 11"}
- {id: hematocrit_ratio_vitro, name: tube-to-discharge hematocrit ratio in glass tubes, dimension: dimensionless, description: "(HT/HD)vitro of Eq. 12 (Fahraeus effect in vitro)"}
- {id: hematocrit_ratio_vivo, name: tube-to-discharge hematocrit ratio in vivo, dimension: dimensionless, description: "(HT/HD)vivo of Eq. 13, HT referred to the anatomic vessel volume"}
- {id: blood_viscosity_vivo, name: absolute apparent blood viscosity in microvessels in vivo, dimension: "[mass]/[length]/[time]", description: "apparent viscosity measured in single microvessels in vivo (micropipette)"}
- {id: blood_viscosity_vitro, name: absolute apparent blood viscosity in glass tubes, dimension: "[mass]/[length]/[time]", description: "apparent viscosity in glass tubes of the same diameter"}
- {id: esl_volume, name: total ESL volume, dimension: "[length]**3", description: "whole-body volume of the endothelial surface layer"}
- {id: endothelial_area, name: total endothelial surface area, dimension: "[length]**2", description: "whole-body endothelial surface area"}
- {id: percentile_rank, name: percentile of a distribution, dimension: dimensionless, description: "the x of the Fig. 2 box plot reading: 5, 10, 25, 50, 75, 90, 95 (per cent of the vessels below the value)"}
- {id: condition_index, name: position of a bar along a categorical axis, dimension: dimensionless, description: "1, 2, 3, 4 left to right in Fig. 1: In vitro 92, In vivo 94, In vivo ESL without and with HD dependence"}
- {id: velocity_error, name: velocity deviation parameter VERR, dimension: dimensionless, description: "mean square deviation between measured and simulated flow velocities in the networks (Fig. 1), as the paper defines it"}
- {id: inverted_segments, name: number of segments with inverted flow direction NINV, dimension: dimensionless, description: "segments whose simulated flow direction is opposite to the observed (Fig. 1)"}
- {id: hematocrit_error, name: hematocrit deviation parameter HERR, dimension: dimensionless, description: "mean square deviation between measured and simulated hematocrits (Fig. 1)"}
