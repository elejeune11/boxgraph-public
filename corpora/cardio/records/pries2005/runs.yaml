  model: vivo_viscosity
  inputs: {HD: hd_fig_60, Doff: Doff_fit, Dcrit: Dcrit_fit, D50: D50_fit, Wmax: Wmax_vanHaaren, Eamp: Eamp_fit, Ewidth: Ewidth_fit, Epeak: Epeak_fit, EHD: EHD_fit}
