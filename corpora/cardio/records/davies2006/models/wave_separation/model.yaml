id: wave_separation
name: separation of a pressure increment into parts of proximal (dP+) and distal (dP-) origin
role: processing
stated: {page: 4, printed_page: "1770", quote: "The change in pressure is separated into wave components", where: "Eqs. for dP+ and dP-"}
equation: "dP+ = (1/2)(dP + rho c dU) ; dP- = (1/2)(dP - rho c dU)"
inputs:
  dP: {quantity: pressure_increment, unit: Pa}
  dU: {quantity: velocity_sample_increment, unit: m/s}
  rho: {quantity: blood_density, unit: kg/m^3}
  c: {quantity: wave_speed, unit: m/s}
outputs:
  dPp: {quantity: pressure_increment_forward, unit: Pa}
  dPm: {quantity: pressure_increment_backward, unit: Pa}
settings: {}
stochastic: false
