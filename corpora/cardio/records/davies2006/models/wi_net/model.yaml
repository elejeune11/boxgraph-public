id: wi_net
name: net wave intensity as the product of the time derivatives of pressure and velocity
role: processing
stated: {page: 4, printed_page: "1770", quote: "intensity as the product of the first time derivatives of pressure and", where: "Eq. for WInet"}
equation: "WInet = WI+ + WI- = (dP/dt)(dU/dt)"
inputs:
  dPdt: {quantity: pressure_rate, unit: Pa/s}
  dUdt: {quantity: velocity_rate, unit: m/s^2}
outputs:
  WInet: {quantity: wave_intensity_net, unit: W/m^2/s^2}
settings: {}
stochastic: false
