stated: {page: 5, printed_page: "1771", quote: "pressure was 1.9 mm Hg (2.5% of mean value), and of peak", where: Reproducibility}
equation: "percent = 100 SD_diff / mean"
from_words: true
inputs:
  sd: {quantity: replicate_sd_diastolic, unit: mmHg}
  mean: {quantity: diastolic_bp, unit: mmHg}
outputs:
  pct: {quantity: replicate_percent_diastolic, unit: percent}
settings: {}
stochastic: false
