id: single_point_wave_speed
name: single-point (sum of squares) estimate of local wave speed
role: processing
stated: {page: 4, printed_page: "1770", quote: "We have used the single-point technique, which uses", where: "Eq. for c"}
equation: "c = (1/rho) sqrt(sum dP^2 / sum dU^2)  (sums over an integer number of cardiac cycles)"
described_from: ref-19
inputs:
  sum_dP2: {quantity: sum_squared_pressure_increments, unit: Pa^2}
  sum_dU2: {quantity: sum_squared_velocity_increments, unit: m^2/s^2}
  rho: {quantity: blood_density, unit: kg/m^3}
outputs:
  c: {quantity: wave_speed, unit: m/s}
settings: {}
stochastic: false
