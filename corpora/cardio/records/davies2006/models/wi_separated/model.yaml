id: wi_separated
name: separated wave intensity of proximal (WI+) and distal (WI-) origin, and their sum
role: processing
stated: {page: 4, printed_page: "1770", quote: "WInet represents the net wave intensity, the sum of WI⫹ and WI⫺", where: "Eqs. for WI+ and WI-"}
equation: "WI+ = (1/(4 rho c)) (dP/dt + rho c dU/dt)^2 ; WI- = -(1/(4 rho c)) (dP/dt - rho c dU/dt)^2 ; WInet = WI+ + WI-"
inputs:
  dPdt: {quantity: pressure_rate, unit: Pa/s}
  dUdt: {quantity: velocity_rate, unit: m/s^2}
  rho: {quantity: blood_density, unit: kg/m^3}
  c: {quantity: wave_speed, unit: m/s}
outputs:
  WIp: {quantity: wave_intensity_forward, unit: W/m^2/s^2}
  WIm: {quantity: wave_intensity_backward, unit: W/m^2/s^2}
  WInet: {quantity: wave_intensity_net, unit: W/m^2/s^2}
settings: {}
stochastic: false
