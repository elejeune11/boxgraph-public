# Calibrated figure readings of davies2006 (mode: code). Shared code: figures/_scatter.py (Figs. 6-7,
# raster spreadsheet charts) and figures/_traces.py (Figs. 3-5, wave intensity, pressure and velocity
# traces). Every reading is a measurement (one subject's traces, or one marker per subject).

# ---- Fig. 6 (p. 8): backward suction wave % against LV septum --------------------------------------
- id: fig6_points
  page: 8
  where: "Fig. 6"
  what: "every marker (one per subject): backward-traveling suction wave percentage against LV septal thickness; the regression line is not read"
  dpi: 1200
  crop: [1440, 1040, 3920, 4040]
  x: {quantity: septal_wall_thickness, unit: cm}
  y: {quantity: share_wi_w5, unit: percent}
  mode: code
  code: figures/fig6_points.py
  at: []

# ---- Fig. 7 (p. 8): forward suction wave % against "Age (years)" ----------------------------------
- id: fig7_points
  page: 8
  where: "Fig. 7"
  what: "every marker (one per subject): forward-traveling suction wave percentage against the x axis labelled Age (years), read on the printed axis labels (q_fig7_axes); the regression line is not read"
  dpi: 1200
  crop: [1440, 9120, 4000, 12000]
  x: {quantity: age, unit: year}
  y: {quantity: share_wi_w4, unit: percent}
  mode: code
  code: figures/fig7_points.py
  at: []

