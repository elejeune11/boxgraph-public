- id: n_correlation_added
  quantity: subject_count
  unit: dimensionless
  printed: "20"
  basis: >
    The paper does not say over which subjects the correlation of the forward suction wave percentage with
    wall thickness was formed; the whole cohort of 20 (p. 3) is taken. Added by the audit.
  alternatives: ["10"]
  stands_for: n in the P value of r = -0.15 (p. 6)
# ---- end of systole on the time axes of Figs. 3 and 5 (curve-port job, 2026-11-11; q_yong2025_dsfr) ----
- id: ts_fig3_relaxation
  quantity: time_in_cycle
  unit: ms
  printed: "365"
  basis: >
    The paper takes diastole to start with the onset of ventricular relaxation (p. 4). In Fig. 3 the grey onset
    line of the forward suction wave (wave 4, the start of relaxation) crosses the time axis near 365 ms, read by
    eye from the page image (the onset lines are not digitized). The figures do not mark end-systole otherwise.
  alternatives: ["463"]
  stands_for: end of systole for the diastolic-to-systolic velocity ratio of Fig. 3
- id: ts_fig3_incisura
  quantity: time_in_cycle
  unit: ms
  printed: "463"
  basis: >
    End of ejection taken at the pressure incisura of Fig. 3, where the onset line of the backward suction wave
    (wave 5) and late forward pushing wave (6) crosses the time axis, near 463 ms (by eye). Closer to an end-systole
    defined by valve closure, as a lumped model's Tes would be.
  alternatives: ["365"]
  stands_for: end of systole for the diastolic-to-systolic velocity ratio of Fig. 3
- id: ts_fig5_relaxation
  quantity: time_in_cycle
  unit: ms
  printed: "357"
  basis: >
    As ts_fig3_relaxation, for Fig. 5: the onset line of wave 4 crosses the time axis near 357 ms (by eye).
  alternatives: ["410"]
  stands_for: end of systole for the diastolic-to-systolic velocity ratio of Fig. 5
- id: ts_fig5_incisura
  quantity: time_in_cycle
  unit: ms
  printed: "410"
  basis: >
    As ts_fig3_incisura, for Fig. 5: the onset line at the pressure incisura (waves 5 and 6) near 410 ms (by eye).
  alternatives: ["357"]
  stands_for: end of systole for the diastolic-to-systolic velocity ratio of Fig. 5
