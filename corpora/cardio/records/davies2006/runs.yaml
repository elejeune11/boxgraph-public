# ---- Table 2: proportions from the cumulative means (ratio of means; the paper averaged per-subject ratios)
- id: run_share_from_cumulative
  model: wave_share
  inputs: {I1: t2_cum_w1, I2: t2_cum_w2, I3: t2_cum_w3, I4: t2_cum_w4, I5: t2_cum_w5, I6: t2_cum_w6}
  outputs: {p1: share_calc_w1, p2: share_calc_w2, p3: share_calc_w3, p4: share_calc_w4, p5: share_calc_w5, p6: share_calc_w6}
  note: The six waves' summed cumulative means stand for the cycle total (the paper's total may include smaller waves).
# ---- 55% of wave intensity with ventricular relaxation (waves 4-6)
- id: run_relaxation_from_table
  model: relaxation_share
  inputs: {p4: t2_share_w4, p5: t2_share_w5, p6: t2_share_w6}
  outputs: {s: relaxation_share_from_table}
- id: run_relaxation_from_cumulative
  model: relaxation_share
  inputs: {p4: share_calc_w4, p5: share_calc_w5, p6: share_calc_w6}
  outputs: {s: relaxation_share_from_cumulative}
# ---- 94% of accelerating wave energy from waves 2 and 5
- id: run_accelerating_from_table
  model: accelerating_share
  inputs: {p2: t2_share_w2, p5: t2_share_w5, p6: t2_share_w6}
  outputs: {s: accelerating_share_from_table}
- id: run_accelerating_from_cumulative
  model: accelerating_share
  inputs: {p2: share_calc_w2, p5: share_calc_w5, p6: share_calc_w6}
  outputs: {s: accelerating_share_from_cumulative}
# ---- whole cohort from the LVH (n1 = 10) and non-LVH (n2 = 20 - 10) groups
- id: run_pooled_systolic
  model: pooled_systolic
  inputs: {N: n_subjects, n1: n_lvh, m1: sbp_lvh, s1: sbp_lvh_sd, m2: sbp_nonlvh, s2: sbp_nonlvh_sd}
  outputs: {mean: sbp_pooled_mean, sd: sbp_pooled_sd}
- id: run_pooled_diastolic
  model: pooled_diastolic
  inputs: {N: n_subjects, n1: n_lvh, m1: dbp_lvh, s1: dbp_lvh_sd, m2: dbp_nonlvh, s2: dbp_nonlvh_sd}
  outputs: {mean: dbp_pooled_mean, sd: dbp_pooled_sd}
- id: run_pooled_share_w5
  model: pooled_share_w5
  inputs: {N: n_subjects, n1: n_lvh, m1: share_w5_lvh, m2: share_w5_nonlvh}
  outputs: {mean: share_w5_pooled}
- id: run_pooled_share_w1
  model: pooled_share_w1
  inputs: {N: n_subjects, n1: n_lvh, m1: share_w1_lvh, m2: share_w1_nonlvh}
  outputs: {mean: share_w1_pooled}
# ---- reproducibility percentages, against the cohort mean pressures (q_replicate_percent)
- id: run_replicate_systolic
  model: replicate_percent_systolic
  inputs: {sd: rep_sd_sbp, mean: sbp_all}
  outputs: {pct: rep_pct_sbp_calc}
- id: run_replicate_diastolic
  model: replicate_percent_diastolic
  inputs: {sd: rep_sd_dbp, mean: dbp_all}
  outputs: {pct: rep_pct_dbp_calc}
# ---- P value printed with r = -0.15 (added by the audit, q_p_fsuction_septum)
- id: run_p_fsuction_septum
  model: correlation_p_value
  inputs: {r: r_fsuction_septum, n: n_correlation_added}
  outputs: {p: p_fsuction_septum_calc}
# ---- "only one quarter" the slope
- id: run_slope_ratio
  model: slope_ratio
  inputs: {a: slope_lvh, b: slope_nonlvh}
  outputs: {r: slope_ratio_calc}

