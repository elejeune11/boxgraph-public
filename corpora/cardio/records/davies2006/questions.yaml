- id: q_accel_94
  kind: unexplained_difference
  about: [share_accel_printed, cmp_accelerating_table, cmp_accelerating_cumulative]
  text: >
    The abstract says 94% of the wave energy accelerating blood forward came from 2 waves (2 and 5). The
    accelerating waves are 2, 5 and 6 (Table 1, Figs. 3 and 5); with Table 2's proportions (22.3, 30, 6.1) or
    its cumulative means (14.3, 18.2, 4.0 x 10^3), waves 2 and 5 carry about nine tenths of the accelerating
    intensity, not 94% (the build gives the exact values). A mean of per-subject ratios can differ from a ratio
    of means, and the paper does not say how the 94% was formed, so this is recorded as unexplained rather than
    as an error. Waves 2 and 5 together are 52.3% of all cumulative intensity, so the 94% is not a share of
    the total either.
