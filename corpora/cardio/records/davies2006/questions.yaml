# ---- curve-port rerun (2026-11-11): the wave intensity analysis rebuilt on the digitized traces ----
- id: q_wia_rebuilt
  kind: choice
  about: [q_wia_not_run, wia_traces, single_point_wave_speed, run_wia_fig3, run_wia_fig5, run_wia_fig3_sg50, run_wia_fig5_sg50, run_c_fig3, run_c_fig5, rho_blood]
  text: >
    Answers q_wia_not_run. With curve ports the analysis is run on the digitized pressure and velocity traces of
    Figs. 3 and 5 (model wia_traces, built from the printed single_point_wave_speed, wave_separation and
    wi_separated): c from the sums of squared increments over the read span (20-930 ms in Fig. 3, 20-840 ms in
    Fig. 5, about one cycle; the paper sums over an integer number of cycles), the separated pressures and
    velocities, and WI+ and WI- resampled onto the x values of the digitized WI traces. rho is the printed 1050 kg
    m^-3. What the paper does not give is a setting: the sampling step (10 ms, the reading grid; also 2 ms, see
    q_wia_grid), and the Savitzky-Golay window, run both without filtering and with an added 50 ms window of order 2
    (run_wia_*_sg50). Ensemble averaging does not arise: each figure is already one averaged beat. The single-point
    c is 25.4 m/s for Fig. 3 and 14.8 m/s for Fig. 5 (the build gives the values; the printed equation, run on the
    model's sums, gives the same). The paper prints no wave speed to compare. Against the digitized traces, the
    computed WI+ and WI- follow the shape and timing of every labelled wave, and on the 10 ms grid wave 2 of Fig. 3
    (about 1.97 x 10^5 against 1.96 x 10^5 read) and wave 5 of Figs. 3 and 5 come out at the plotted height. The
    curve comparisons are still not reproduced point by point: on steep flanks a 10 ms difference shifts a peak by
    a few ms, while the reading intervals are only about 1-2% of the peak heights. Narrow peaks come out low: wave 2
    of Fig. 5 by about a fifth, and wave 3 of Fig. 5 by about a third. The 50 ms filter lowers every peak further
    (wave 2 of Fig. 3 to 1.65 x 10^5). These differences come from the steps listed here, not from the printed
    equations.
  citation: {page: 4, printed_page: "1770", quote: "filtered by using a Savitzky-Golay filter17 and ensembled by using", where: "Analysis of Hemodynamic Data"}
- id: q_wia_grid
  kind: numerics
  about: [run_wia_fig3_2ms_s10, run_wia_fig5_2ms_s10, run_wia_fig3_2ms, run_wia_fig5_2ms, ref_grid_fig3_WIp_max, ref_grid_fig3_WIm_min, ref_grid_fig3_c, ref_grid_fig5_WIp_max, ref_grid_fig5_WIm_min, ref_grid_fig5_c, fig3_pressure_2ms, fig3_velocity_2ms, fig5_pressure_2ms, fig5_velocity_2ms]
  text: >
    The traces were read again every 2 ms with the same code (fig3_/fig5_pressure_2ms, velocity_2ms) and the
    analysis repeated at steps of 10, 4 and 2 ms (refinements ref_grid_*). The peaks do not settle: the largest WI+
    of Fig. 3 goes from about 2.0 to 2.9 to 6.4 x 10^5, and that of Fig. 5 from 4.3 to 6.5 to 12 x 10^5. The
    plotted peaks are 1.96 and 5.45 x 10^5. Below about 5 ms the step meets the resolution of the printed raster:
    the read lines move in steps of one image pixel (about 0.17 mmHg and 0.002-0.003 m/s), and the squared
    differences of that staircase drive the intensities up. The wave speed changes less (25.4, 24.5 and 24.0 m/s
    for Fig. 3; 14.8 to 15.0 m/s for Fig. 5). So the reading grid cannot be refined to the paper's 1 ms: the 10 ms grid
    smooths the narrowest peaks (wave 2 of Fig. 5 is about 30 ms wide and comes out about 21% low), and finer grids
    add reading noise. The 2 ms readings themselves are checked by their overlays and agree with the 10 ms readings
    where the two grids meet.
