    which is the sign of each wave's effect on flow (accelerating +, decelerating -; Table 1 and the shading of
    Figs. 3 and 5), not the sign of the intensity as the paper defines it. By the printed equations WI+ is never
    negative and WI- never positive, yet the forward suction wave (4, a WI+ wave) is printed -2 x 10^5 and the
    backward suction wave (5, a WI- wave) +5.5 x 10^5; Fig. 3 plots wave 4 above zero in the WI+ panel and wave 5
    below zero in the WI- panel. The values are entered as printed. Anyone comparing a model's separated
    intensities with Table 2 must compare magnitudes, or flip the signs of waves 4 and 5 (and of 1 and 3 for a
    model that plots backward waves negative).
