    kim2010's bed resistances on this paper's pressures (143/80 mmHg, non-LVH) would mix one subject's tuned
    resistances with another cohort's pressures. No kim2010 model gives a wave intensity, a wave speed or a
    velocity increment. See kim2010/q_no_validation_vs_davies2006.
