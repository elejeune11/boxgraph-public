- id: q_p_fsuction_septum
  kind: possible_error
  about: [p_fsuction_septum, r_fsuction_septum, cmp_p_fsuction_septum, n_correlation_added]
  text: >
    Added by the audit. "This wave was not significantly related to wall thickness (r = -0.15, P = 0.08)": the
    usual t test of a Pearson r gives P of about 0.5 for |r| = 0.15 with 20 subjects (about 0.7 with 10); P = 0.08
    would need |r| near 0.4. The r, the P or the test differs from what is printed. The other printed bounds
    are close to the edge but are inequalities and get no verdict: r = 0.51 with n = 20 gives P of about 0.022
    against the printed P < 0.02, and r = 0.64 gives about 0.0024 against P < 0.002; r = -0.52 (P < 0.02) and
    r = -0.61 (P < 0.005) agree. The velocity P = 0.95 (0.43 ± 0.52 vs 0.42 ± 0.35 m/s, n = 10 each) is about
    0.96 by an unpaired t test, within what the rounding of the printed means allows, so it is not entered.
  citation: {page: 6, printed_page: "1772", quote: "significantly related to wall thickness (r⫽⫺0.15, P⫽0.08)", where: text}
