# The paper defines WInet both as the sum of the separated intensities and as the product of the time
# derivatives (p. 4); the two forms must be one model.
- id: rel_winet_sum
  kind: same_as
  a: davies2006/wi_separated
  b: davies2006/wi_net
  mapping: {dPdt: "dPdt", dUdt: "dUdt"}
  output_map: {WInet: WInet}
  regime:
    dPdt: [-2.0e+5, 2.0e+5]
    dUdt: [-10, 10]
    rho: [1000, 1100]
    c: [2, 40]
  provenance: stated
  citation: {page: 4, printed_page: "1770", quote: "WInet represents the net wave intensity, the sum of WI⫹ and WI⫺", where: "Eqs. for WI+, WI- and WInet"}
