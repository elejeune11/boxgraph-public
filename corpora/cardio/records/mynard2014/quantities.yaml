- {id: body_weight, name: body weight of the animal, dimension: "[mass]"}
- {id: myocardial_weight, name: weight of the left ventricular free wall and septum (LVFWS), dimension: "[mass]",
   description: "The myocardial weight used for allometric scaling of the 1D coronary network."}
- {id: heart_weight, name: total heart weight, dimension: "[mass]"}
- {id: heart_to_body_weight_ratio, name: total heart weight per body weight (HW/BW), dimension: dimensionless}
- {id: heart_rate, name: heart rate, dimension: "1/[time]"}
- {id: mean_aortic_pressure, name: cycle-mean aortic blood pressure, dimension: "[mass]/[length]/[time]**2",
   description: "Measured mean aortic pressure; the paper prescribes measured aortic pressure (delayed) at the left main inlet, so its mean is also the mean left main pressure pLM."}
- {id: right_atrial_pressure, name: right atrial pressure (venous outflow pressure of the coronary model), dimension: "[mass]/[length]/[time]**2"}
- {id: cx_flow_per_mass, name: mean proximal circumflex flow per 100 g of its stained perfusion territory, dimension: "[length]**3/[time]/[mass]"}
- {id: lm_flow_per_mass, name: mean left main coronary flow per 100 g LV, dimension: "[length]**3/[time]/[mass]"}
- {id: effective_coronary_resistance, name: "total effective vascular resistance of the left main coronary bed, weight-corrected ((pLM - pRA)/qLM)",
   dimension: "[mass]**2/[length]**4/[time]"}
- {id: allometric_scaling_exponent, name: allometric power relating 1D segment length and diameter to myocardial weight, dimension: dimensionless}
- {id: segment_length_ratio, name: ratio of mean 1D segment length in adults to that in newborns, dimension: dimensionless}
- {id: heart_rate_ratio, name: ratio of newborn to adult heart rate, dimension: dimensionless}
- {id: heart_weight_ratio, name: ratio of adult to newborn heart weight, dimension: dimensionless}
- {id: wave_speed, name: pulse wave speed in the proximal circumflex artery, dimension: "[length]/[time]"}
- {id: relative_wave_speed_change, name: relative change applied to the wave speed of all 1D segments, dimension: dimensionless}
- {id: phase_duration_fraction, name: duration of a phase of the Cx flow waveform as a fraction of heart period, dimension: dimensionless,
   description: "Phases S1 (early systolic transient), S2 (rest of systole), D1 (early diastolic transient), D2 (rest of diastole), Fig. 4."}
- {id: phase_duration_fraction_difference, name: difference between two phase-duration fractions, dimension: dimensionless}
- {id: normalized_cx_flow, name: proximal Cx flow normalized to its cycle-average flow, dimension: dimensionless,
   description: "A phase mean (S2, D1+D2) or a feature point value (S1a-S1c, D1d-D1f, Fig. 4) of the normalized waveform."}
- {id: normalized_cx_flow_difference, name: difference between two normalized Cx flow values, dimension: dimensionless,
   description: "Either model minus experiment (Table 2 Difference column) or the excursion between two feature points (S1b - S1c, D1e - D1f)."}
- {id: relative_flow_difference, name: relative difference of a normalized flow between newborns and adults, dimension: dimensionless}
- {id: aortic_pressure, name: aortic pressure waveform, dimension: "[mass]/[length]/[time]**2"}
- {id: lv_cavity_pressure, name: left ventricular cavity pressure waveform, dimension: "[mass]/[length]/[time]**2"}
- {id: microvascular_volume_variation, name: "cyclic variation of vascular volume in a transmural microvascular compartment, relative to its volume", dimension: dimensionless}
- {id: normalized_rms_error, name: RMS error between simulated and measured Cx flow waveforms normalized to maximal flow, dimension: dimensionless}
- {id: volume_resistance_share, name: share of total effective resistance due to the systolic reduction of microvascular volume, dimension: dimensionless}
- {id: early_systolic_flow_integral_fraction, name: share of the total flow integral over the cycle accounted for by the early-systolic flow transient, dimension: dimensionless}
- {id: late_systolic_flow_integral_fraction, name: share of the total flow integral over the cycle accounted for by late systole, dimension: dimensionless}
- {id: plot_time_fraction, name: time as a fraction of the plotted interval, dimension: dimensionless,
   description: "x of a waveform panel without x ticks: 0 at the y axis line, 1 at the end of the plotted interval (Figs. 6-9)."}
- {id: time, name: time from the start of the plotted interval, dimension: "[time]"}
- {id: cx_flow, name: proximal circumflex coronary arterial flow (waveform), dimension: "[length]**3/[time]"}
- {id: microvascular_flow, name: total microvascular flow summed over the 0D compartments (arterial or venous side; all layers or one transmural layer), dimension: "[length]**3/[time]"}
- {id: microvascular_volume, name: total vascular volume of the arterial compartments of one transmural layer, dimension: "[length]**3"}
- {id: normalized_territory_flow, name: flow in a left coronary 1D segment normalised to its cycle-mean flow, dimension: dimensionless}
- {id: lumen_area, name: local lumen cross-sectional area of a conduit artery, dimension: "[length]**2"}
- {id: local_arterial_pressure, name: local blood pressure in a conduit artery, dimension: "[mass]/[length]/[time]**2"}
- {id: aortic_flow, name: ascending aortic flow (waveform), dimension: "[length]**3/[time]"}
- {id: lm_inlet_pressure, name: left main inlet pressure prescribed to the model (LMP), dimension: "[mass]/[length]/[time]**2"}
- {id: lv_volume, name: left ventricular cavity volume (waveform), dimension: "[length]**3"}
- {id: lv_elastance, name: left ventricular chamber elastance (LVP over LVV), dimension: "[mass]/[length]**4/[time]**2"}
- {id: cavity_induced_extracellular_pressure, name: cavity-induced extracellular pressure (CEP) in one transmural layer, dimension: "[mass]/[length]/[time]**2"}
- {id: shortening_induced_intracellular_pressure, name: shortening-induced intracellular pressure (SIP), dimension: "[mass]/[length]/[time]**2"}
# For the helper model wave_speed_eq1 (Eq. 1), added by the ModelAtlas job with olufsen1999.
- {id: blood_density, name: density of blood, dimension: "[mass]/[length]**3", description: "rho"}
- {id: stiffness_fit_amplitude, name: coefficient k1 of the wave-speed formula, dimension: "[mass]/[length]/[time]**2", description: "k1 in Eq. 1"}
- {id: stiffness_fit_rate, name: exponential rate k2 of the wave-speed formula in r0, dimension: "1/[length]", description: "k2 in Eq. 1"}
- {id: stiffness_fit_offset, name: coefficient k3 of the wave-speed formula, dimension: "[mass]/[length]/[time]**2", description: "k3 in Eq. 1"}
- {id: vessel_radius, name: reference radius of a 1D segment, dimension: "[length]", description: "r0 in Eq. 1"}
- {id: reference_wave_speed, name: reference wave speed of a 1D segment, dimension: "[length]/[time]", description: "c0 in Eq. 1, before the uniform scaling"}
