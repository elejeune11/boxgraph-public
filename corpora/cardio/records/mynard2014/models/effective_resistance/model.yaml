id: effective_resistance
name: total effective vascular resistance of the left main coronary bed
role: processing
stated: {page: 12, quote: "coronary artery (LM) of adults and newborns, calculated as", where: text}
equation: "R = (p̄LM - pRA) / q̄LM"
inputs:
  pLM: {quantity: mean_aortic_pressure, unit: mmHg, description: mean left main pressure (measured aortic pressure is prescribed at the LM inlet)}
  pRA: {quantity: right_atrial_pressure, unit: mmHg}
  qLM: {quantity: lm_flow_per_mass, unit: mL/min/hg, description: mean left main flow per 100 g LV}
outputs:
  R: {quantity: effective_coronary_resistance, unit: mmHg*min*hg/mL}
