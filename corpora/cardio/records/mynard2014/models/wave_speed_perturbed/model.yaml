id: wave_speed_perturbed
name: wave speed increased and decreased by a fixed percentage (sensitivity analysis, Fig. 9A)
role: processing
from_words: true
stated: {page: 41, quote: "all 1D segments increased/decreased by 22%, values shown are for the proximal circumflex", where: "Fig. 9 caption"}
equation: "c_up = c (1 + s), c_down = c (1 - s)"
inputs:
  c: {quantity: wave_speed, unit: m/s, description: baseline proximal Cx wave speed}
  s: {quantity: relative_wave_speed_change, unit: percent}
outputs:
  c_up: {quantity: wave_speed, unit: m/s}
  c_down: {quantity: wave_speed, unit: m/s}
