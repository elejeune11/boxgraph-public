id: relative_decrease
name: relative decrease of a normalized flow in newborns compared with adults
role: processing
from_words: true
stated: {page: 13, quote: "the model also predicted an 8 ± 6% lower diastolic flow in newborns", where: text}
equation: "r = (adult - newborn) / adult"
inputs:
  a: {quantity: normalized_cx_flow, unit: dimensionless, description: adult value}
  n: {quantity: normalized_cx_flow, unit: dimensionless, description: newborn value}
outputs:
  r: {quantity: relative_flow_difference, unit: percent}
