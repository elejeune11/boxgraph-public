id: heart_weight_ratio
name: adult/newborn total heart weight ratio from heart-to-body weight ratio and body weight
role: processing
from_words: true
stated: {page: 18, quote: "adult sheep and newborn lambs, whose heart weights differ by a factor of four", where: text}
equation: "HW = (HW/BW) x BW; ratio = HW_adult / HW_newborn"
inputs:
  r_a: {quantity: heart_to_body_weight_ratio, unit: g/kg, description: adult HW/BW}
  BW_a: {quantity: body_weight, unit: kg, description: adult body weight}
  r_n: {quantity: heart_to_body_weight_ratio, unit: g/kg, description: newborn HW/BW}
  BW_n: {quantity: body_weight, unit: kg, description: newborn body weight}
outputs:
  ratio: {quantity: heart_weight_ratio, unit: dimensionless}
