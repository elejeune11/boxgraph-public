- id: q_lm_adult_added
  quantity: lm_flow_per_mass
  unit: mL/min/hg
  printed: "71"
  basis: >
    The paper gives the effective resistance (pLM - pRA)/qLM per 100 g LV (p. 12) but not the left main
    flow qLM it used. Taken equal to the adult group mean weight-corrected Cx flow of Table 1
    (71 ± 35 mL/min/100g), i.e. assuming the left main bed is perfused per gram as the Cx territory is.
  alternatives: ["36", "106"]
  stands_for: qLM in (pLM - pRA)/qLM, adult sheep (alternatives are the Table 1 mean minus and plus one SD)
- id: q_lm_newborn_added
  quantity: lm_flow_per_mass
  unit: mL/min/hg
  printed: "129"
  basis: >
    As for adults: qLM per 100 g LV is not printed; taken equal to the newborn group mean weight-corrected
    Cx flow of Table 1 (129 ± 38 mL/min/100g).
  alternatives: ["91", "167"]
  stands_for: qLM in (pLM - pRA)/qLM, newborn lambs (alternatives are the Table 1 mean minus and plus one SD)
