- id: q_no_validation_vs_alastruey2011
  kind: choice
  about: [multiscale_coronary, wave_speed_eq1, wave_speed_perturbed]
  text: >
    (Cross-validation with alastruey2011; cross-validation job 2026-11-06.) No model of this record is
    validated against a measurement of alastruey2011. Ref. 73 of this paper is Waters, Alastruey et al.
    2011, a review of coronary models (Prog Biophys Mol Biol 104: 49-76), cited as a review (p. 3), not
    Alastruey et al. 2011 (J Biomech); ref. 1 is Alastruey et al. 2012 (J Eng Math). Neither paper says one's
    model explains the other's data. alastruey2011's measurements are of a silicone 37-segment phantom:
    Table 2's radii, lengths, thicknesses, wave speeds and resistances, the fluid's density and viscosity,
    the silicone's E, the uniaxial load-extension test and the midpoint pressure and flow waveforms.
    wave_speed_eq1 is Olufsen's empirical stiffness fit of in vivo arteries, c0(r0) with k1, k2, k3; run on
    the phantom's radii it would predict what an artery of that radius has, not what a silicone tube of
    E = 1.2 MPa has, so it is no test of the phantom's measured c0 (and its coefficients are not in this
    record). wave_speed_perturbed scales a given wave speed by a percentage, which the phantom does not
    vary. multiscale_coronary is not runnable and models a coronary tree with myocardial loading, not the
    phantom. The shared shape of wave_speed_eq1 and alastruey2011/wave_speed_eq5 is a coincidence of
    dimensions. In the other direction, see alastruey2011/q_no_validation_vs_mynard2014.
  citation: {page: 3, quote: "a void that has been recognized", where: text}
- id: q_no_validation_vs_formaggia2003
  kind: choice
  about: [multiscale_coronary, wave_speed_eq1, wave_speed_perturbed]
  text: >
    (Cross-validation with formaggia2003; cross-validation job 2026-11-06.) No model of this record is
    validated against a measurement of formaggia2003, and none can be: formaggia2003 is a methods paper
    whose record holds no measured datum (its printed results are simulations of idealized test
    channels, Figs. 6-8 and 11-18). This paper cites it (ref. 19) only for the numerical treatment of the
    viscoelastic term, not for data or for a model that explains data. That wave_speed_eq1 and
    formaggia2003/bifurcation_angles both give a velocity from a density and a length is a coincidence
    of dimensions: bifurcation_angles gives the blood velocity in a simulated channel, wave_speed_eq1 the
    reference wave speed of Olufsen's stiffness fit, and neither output is measured in the other paper.
    In the other direction, see formaggia2003/q_no_validation_vs_mynard2014.
  citation: {page: 6, quote: "operator splitting technique as described elsewhere", where: text}
- id: q_no_validation_vs_kim2010
  kind: choice
  about: [multiscale_coronary, effective_resistance, segment_length_ratio, wave_speed_eq1, wave_speed_perturbed]
  text: >
    (Cross-validation with kim2010; cross-validation job 2026-11-06.) No model of this record is
