- id: q_no_validation_vs_olufsen1999
  kind: choice
  about: [wave_speed_eq1, wave_speed_perturbed, effective_resistance, multiscale_coronary]
  text: >
    (Cross-validation with olufsen1999, cross-validation job 2026-11-06.) No model of this record is
    validated against a measurement of olufsen1999. This paper cites it (ref. 46) only for the form of Eq. 1
    and its coefficients k1, k2, k3 (p. 5); it does not say that any of its models explains or predicts
    olufsen1999's data. olufsen1999's measured data are the human cardiac output (4.14 l/min) and the MR
    inflow of its Fig. 4 (ref. 20), the input impedance modulus and phase md 0 and md 1 of its Fig. 9 (ref.
    26/27), and the aortic, subclavian-brachial and radial pressures of its Fig. 12 (ref. 41). None is a
    quantity a runnable model here gives: wave_speed_eq1 and wave_speed_perturbed give wave speeds, and
    olufsen1999 measures none. Its Fig. 3 Eh/r0 points are estimates from literature compliances (origin
    estimated, not measured) and a stiffness, not a wave speed; and because k1, k2, k3 were fitted to those
    same points (Eq. 6), crossing them would test the fit, which olufsen1999 already does
    (cmp_eq6_fig3_data, fit_quality). effective_resistance is the left main coronary resistance per 100 g of
    myocardium, not the brachiocephalic DC impedance of Fig. 9: they share a dimension only in part and not
    a meaning. multiscale_coronary, the only model of flow and pressure waveforms, is not runnable
    (q_multiscale_not_runnable) and models the sheep coronary circulation, not human systemic arteries. In
    the other direction see olufsen1999 q_no_validation_vs_mynard2014.
  citation: {page: 5, quote: "Following Olufsen (46), stiffness of the 1D segments", where: text}
- id: q_no_validation_vs_reymond2009
  kind: choice
  about: [ref-53, multiscale_coronary, wave_speed_eq1, wave_speed_perturbed, effective_resistance]
  text: >
    (Cross-validation with reymond2009, ref. 53, job 2026-11-06.) No model of this record is validated
    against a measurement of reymond2009. This paper cites ref. 53 once (p. 3), as an example that 1D models
    have been validated in vivo for systemic large arteries; it does not say that any of its models explains or
    predicts reymond2009's data. reymond2009's measurements are the volunteers' flows and pressures (its
    Tables 4-5 and the averaged waveforms of Figs. 4-5), Senzaki et al.'s normalized elastance (Fig. 1B) and
    the literature PWV against lumen diameter (Fig. 3). multiscale_coronary, the only model here of flows and
    pressures, is not runnable (q_multiscale_not_runnable) and models the left coronary tree of sheep and lambs,
    not the human systemic sites of Tables 4-5. wave_speed_eq1 is the one candidate for Fig. 3, and it was
    considered and not used: its output is the reference wave speed before "all wave speed values were
    uniformly scaled to achieve a target wave speed in the proximal Cx" (p. 5), so its absolute level is not
    a wave speed this paper's model gives any artery, only the relative stiffness along the tree (unlike
    mynard2015/wave_speed_eq3, whose coefficients were chosen to give normal human wave speeds and which is
    validated against Fig. 3, mynard2015/val_c0_eq3_vs_reymond2009_fig3_pwv). Its coefficients k1, k2, k3 and
    rho are also not data of this record (only of mynard2014_data). wave_speed_perturbed scales a given wave
    speed by a percentage, and effective_resistance is a coronary resistance per 100 g of myocardium; neither
    is measured in reymond2009. In the other direction see reymond2009/q_no_validation_vs_mynard2014.
  citation: {page: 3, quote: "although this has been performed for systemic large arteries", where: text}
- id: q_no_validation_vs_smith2004
  kind: choice
  about: [ref-57, multiscale_coronary, effective_resistance, wave_speed_eq1, wave_speed_perturbed]
  text: >
    (Cross-validation with smith2004; cross-validation job 2026-11-06.) No model of this record is
    validated against smith2004, and none in the other direction. This pair was proposed because this paper
    cites "Smith, 2004" (ref. 57), but ref. 57 is Smith NP, "A computational study of the interaction
