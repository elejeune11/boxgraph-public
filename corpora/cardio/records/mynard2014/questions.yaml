  citation: {page: 26, quote: "Smith NP. A computational study of the interaction between coronary blood flow", where: "References, ref. 57"}
- id: q_no_validation_vs_spaan1981
  kind: choice
  about: [ref-64, multiscale_coronary, effective_resistance]
  text: >
    (Cross-validation with spaan1981; cross-validation job 2026-11-06.) No model of this record is
    validated against spaan1981's measurements. The paper cites ref. 64 (Spaan, Breuls & Laird 1981)
