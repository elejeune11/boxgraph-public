- id: q_multiscale_not_runnable
  kind: unstated_input
  about: [multiscale_coronary]
  text: >
    The multi-scale model (Eqs. 1-8) produces Table 2's Model column, the RMS errors (16.7% and 14.5%), the
    40% and 42% share of total effective resistance from systolic volume reduction, the transmural volume
    swings (17%, 7%, 1.6%, 2.3%), the LAD/septal flow-integral percentages (3.2%, -1.4%, 4.3%, -0.7%, 7.9%,
    4.9%) and Figs. 5-10, but its per-animal inputs (aortic flow, aortic and LV pressure waveforms) are not
    published, the network geometry is in a separate supplement, and the numerical scheme's settings
    (time step, mesh) are not given. None of these results can be recomputed from this paper.
  citation: {page: 11, quote: "Only one free (i.e. fitting) parameter was considered in the validation procedure"}
