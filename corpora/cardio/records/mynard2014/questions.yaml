- id: q_fig78_pointwise
  kind: reading
  about: [cmp_fig7a, cmp_fig7b, cmp_fig7c, cmp_fig7d, cmp_fig7e, cmp_fig7f, cmp_fig7g, cmp_fig7h, cmp_fig7i,
