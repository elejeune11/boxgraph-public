- id: q_no_validation_vs_mynard2015
  kind: choice
  about: [multiscale_coronary, wave_speed_eq1, effective_resistance]
  text: >
    (Cross-validation with mynard2015, cross-validation job 2026-11-06.) No model of this record is validated
    against a measurement of mynard2015. That paper is later than this one, which therefore says nothing of its
    data. Its measured data are all adult human values: Table 6's reference ranges (heart rate, cardiac output,
