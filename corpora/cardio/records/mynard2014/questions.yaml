  text: >
    (pLM - pRA)/qLM from the Table 1 group means (mean aortic pressure 80 and 78 mmHg, pRA = 5 mmHg, qLM taken
    as the Cx flow of 71 and 129 mL/min/100g) is about 1.06 (adults) and 0.57 (newborns)
    mmHg·min·100g/mL, against the printed 0.72 ± 0.35 and 0.34 ± 0.09: the printed values are lower by a
