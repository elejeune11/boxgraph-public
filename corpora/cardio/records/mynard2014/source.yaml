notes: >
  Read from the accepted manuscript; page numbers are the manuscript's (equal to the PDF pages), not the
  journal's, so no journal page labels are recorded. The paper's central result, the multi-scale coronary
  model (1D network, Eqs. 1-4, with 55 three-layer 0D microvascular beds, Eqs. 5-8) run on subject-specific
  inputs of nine adult sheep and nine newborn lambs, is recorded as a model that cannot be run here: the
  per-animal pressure and flow waveforms are not published, the network geometry is in the Supplemental
  Data File (record mynard2014_data), and the numerical settings are not given (q_multiscale_not_runnable).
  Its printed outputs (Table 2's Model column, RMS errors, volume swings, resistance shares,
  flow-integral percentages, Figs. 5-10) are therefore recorded or listed but not recomputed. What the
  record checks is the arithmetic the paper does on its own printed numbers: (1) Table 2, entered cell by
  cell (84 values, mean ± SD), with its Difference column recomputed as Model minus Experiment and its
  S1b - S1c and D1e - D1f rows recomputed from their components (36 consistency checks; judged against
  the printed ± SD, but they also agree to the last printed digit, q_table2_sd_tolerance), and the
  paper's own validation claim, each printed Model group mean against the Experiment mean ± SD (28
  validation comparisons; the model's values are printed, not recomputed here); (2) the
  Results text against Table 2 (S1 and D1 durations; the newborn D1 SD differs, q_d1_sd) and the 8 ± 6%
  lower model diastolic flow in newborns from the Table 2 model means; (3) the Discussion's ratios from
  Table 1: newborn/adult heart rate 1.9, heart weights differing by a factor of four (read as total heart
  weight, q_hw_ratio), and the adult/newborn mean 1D segment length 1.7 from the allometric scaling with
  power 0.35 on LV free wall + septum weights; (4) the Fig. 9A curve labels 7 and 11 m/s from the stated
  ±22% change of the 9.0 m/s Cx wave speed; (5) the effective LM resistance (pLM - pRA)/qLM, 0.72 and
  0.34 mmHg·min·100g/mL, which needs an added qLM (taken as Table 1's Cx flow per 100 g); computed from
  group means it is 0.6-0.7 times lower in the paper in both groups (q_reff). Left out because they feed
  no runnable model: Eq. 1's coefficients and the 1D constants (rho, mu, xi = 22, zero-area pressure,
  Gamma formula, pRV = 0.2 pLV), the 0D parameters (C1, C2, V0,1, V0,2, the 1.14 transmural ratio,
  R1 = 1.2 Rm, R2 = 0.5 Rm, gamma = 0.75, Cpa and Cpv at 10%, SIP at 20% of peak pLV, EF = 0.68, the
  15 and 8 ms delays, human reference weights 104 and 54 g); the CEP layer fractions 5/6, 1/2, 1/6
  (printed as fractions, which have no printed precision to judge); anaesthetic doses and lamb ages;
  AoBP pulse pressure; the canine LAD wave speed 8.6 m/s and the Chilian & Marcus percentages (3.5%,
  -7.2%), which are cited data; the approximate Cx diameters (~4 and ~2 mm) and "almost twice" the
  newborn weight-corrected flow, which have no printed precision; and the 5.3 and 3.2 g/kg ventricular
  weight ratios, which need total ventricular weights the paper does not print (q_ventricular_ratio).
  Figures were not digitized in the first reading (q_figures_not_read); a later figure job read Figs. 3
  and 5-10 as 91 calibrated curves from the full-page figure images (pp. 45-52), compared each animal's
  simulated with its measured Cx flow (Figs. 7-8) and the Fig. 9 baselines with one another
  (figures.md, q_figures_read). Table 3 (a summary of earlier models) has
  no numbers.
