- id: run_hr_ratio
  model: heart_rate_ratio
  inputs: {HR_n: hr_newborn, HR_a: hr_adult}
  outputs: {ratio: hr_ratio_calc}
  note: Ratio of the Table 1 group means.
- id: run_hw_ratio
  model: heart_weight_ratio
  inputs: {r_a: hwbw_adult, BW_a: bw_adult, r_n: hwbw_newborn, BW_n: bw_newborn}
  outputs: {ratio: hw_ratio_calc}
  note: Group-mean heart weight taken as the product of the Table 1 group means of HW/BW and BW (not the mean of individual products).
- id: run_seglen_ratio
  model: segment_length_ratio
  inputs: {W_a: lvfws_adult, W_n: lvfws_newborn, b: scaling_power}
  outputs: {ratio: seglen_ratio_calc}
  note: Every 1D segment is scaled by the same factor, so the mean segment length scales as (W/W_human)^0.35; group means of W are used.
- id: run_ws_perturbed
  model: wave_speed_perturbed
  inputs: {c: c_cx, s: ws_change}
  outputs: {c_up: c_up_calc, c_down: c_down_calc}
- id: run_dflow_drop
  model: relative_decrease
  inputs: {a: t2_Dmean_adult_model, n: t2_Dmean_newborn_model}
  outputs: {r: dflow_drop_calc}
  note: From the Table 2 Model group means of (D1+D2) mean flow.
- id: run_reff_adult
  model: effective_resistance
  inputs: {pLM: aobp_mean_adult, pRA: p_ra, qLM: q_lm_adult_added}
  outputs: {R: reff_adult_calc}
  note: Ratio of group means; qLM per 100 g LV is added (taken as the Table 1 Cx flow per 100 g).
- id: run_reff_newborn
  model: effective_resistance
  inputs: {pLM: aobp_mean_newborn, pRA: p_ra, qLM: q_lm_newborn_added}
  outputs: {R: reff_newborn_calc}
  note: Ratio of group means; qLM per 100 g LV is added (taken as the Table 1 Cx flow per 100 g).
