notes: >
  A review with almost no numbers of its own. Recorded are the models it defines, each with the cited work
  it attributes the model to (described_from): the peripheral resistance R = (Pao,mean - Pven,mean)/CO and
  the compliance C = DV/DP (SV/PP method, ref 47); the two-element diastolic decay (Frank, ref 18) and the
  decay with an intercept pressure (ref 68); Zc = PWV rho/A (Fig. 5 caption); the input impedances of the
  two-, three- and four-element windkessels (refs 18, 73, 63), built from the Fig. 5 circuits since the
  paper prints no impedance formula; Burattini's (a + jwb)/(1 + jwc) model (ref 6); Liu's pressure-dependent
  compliance C(P) (ref 82); the time-delay phase 360 td f; and the arithmetic behind "a factor 4" from
  Table 2. The area, two-area and pulse-pressure methods are recorded as non-runnable (they act on measured
  waveforms that the paper does not give). Stated relations: 3WK reduces to 2WK at Zc = 0, 4WK to 3WK as
  L grows without bound, and Burattini's model has the 3WK impedance form. Values recorded with their
  cited source (from_source): Table 2 sensitivities (ref 61), the Fig. 8 load settings R and C (ref 15),
  Zc = 5-7% of R (ref 72), the up-to-60% SV/PP overestimation (ref 50), b = -0.01, the 10% decay-start
  delay, the 0.2 HR / 3 HR frequency bands and the age changes of R and C. Comparisons: the factor 4
  (reproduced from Table 2, systolic and diastolic columns both give 4.1), the 8 ms delay giving "2.9 f"
  and "about 30 deg at 10 Hz" (printed as approximate, so no verdict; the computed values are 2.88 and
  28.8), and the 2WK phase reaching -90 deg at high frequencies (with added R, C, f). Finding: the Table 2
  footnote defines sensitivity as 100(Y/X)/(Y/X), which is identically 100 (deltas lost in print). Left out:
  the Wesseling cardiac-output iteration and the parameter-estimation, input-impedance and transient
  methods (fitting procedures without data), and the qualitative Table 1. A second pass read the figures
  with calibrated code readings (figures.yaml, figures.md): Fig. 4 measured impedance and the 2-, 3- and
  4-element windkessel curves (modulus and phase), Fig. 6 pressures and the averaged impedance points with
  their bars and the 3WK curves, and Fig. 8 peak and minimum pressure and peak flow per R, C panel. The
  windkessel curves are recorded as predicted data without runs, because the review prints none of their
  parameters. Figs. 2, 3 and 7 have no calibratable axes.
