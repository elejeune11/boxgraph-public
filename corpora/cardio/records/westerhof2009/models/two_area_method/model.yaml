id: two_area_method
name: two-area method for R and C
role: fit
stated: {page: 7, printed_page: "137", quote: "The two-area method is based on the following equation", where: "Eq. integral Q dt, p. 7"}
equation: "integral_t1^t2 Q dt = C (P1 - P2) + (1/R) integral_t1^t2 P dt, applied to onset-to-peak systole and peak systole-to-end diastole"
described_from: ref-56
inputs:
  P: {quantity: aortic_pressure, unit: mmHg, description: measured aortic pressure waveform}
  Q: {quantity: cardiac_output, unit: ml/s, description: measured aortic flow waveform}
outputs:
  R: {quantity: peripheral_resistance, unit: mmHg*s/ml}
  C: {quantity: total_arterial_compliance, unit: ml/mmHg}
settings: {}
runnable: false
not_runnable_reason: It acts on measured pressure and flow waveforms, and the paper gives none.
stochastic: false
