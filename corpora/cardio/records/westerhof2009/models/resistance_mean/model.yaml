id: resistance_mean
name: peripheral resistance from mean pressures and cardiac output
role: model
stated: {page: 2, printed_page: "132", quote: "with Pao,mean and Pven,mean mean aortic and venous pressure", where: "Eq. for R, p. 1-2"}
equation: "R = (Pao,mean - Pven,mean)/CO ≈ Pao,mean/CO"
inputs:
  Pao_mean: {quantity: mean_aortic_pressure, unit: mmHg}
  Pven_mean: {quantity: mean_venous_pressure, unit: mmHg}
  CO: {quantity: cardiac_output, unit: ml/s}
outputs:
  R: {quantity: peripheral_resistance, unit: mmHg*s/ml}
settings: {}
stochastic: false
