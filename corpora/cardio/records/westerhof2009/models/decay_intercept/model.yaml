id: decay_intercept
name: diastolic pressure decay towards an intercept pressure
role: model
stated: {page: 7, printed_page: "137", quote: "The intercept pressure, Pi, depends on vasoactive state", where: "Eq. P(t) = P0 e^-t/RC + Pi, p. 7"}
equation: "P(t) = P0 e^(-t/RC) + Pi"
described_from: ref-68
inputs:
  P0: {quantity: diastolic_start_pressure, unit: mmHg}
  Pi: {quantity: intercept_pressure, unit: mmHg}
  R: {quantity: peripheral_resistance, unit: mmHg*s/ml}
  C: {quantity: total_arterial_compliance, unit: ml/mmHg}
  t: {quantity: time_in_diastole, unit: s}
outputs:
  P: {quantity: diastolic_aortic_pressure, unit: mmHg}
settings: {}
stochastic: false
