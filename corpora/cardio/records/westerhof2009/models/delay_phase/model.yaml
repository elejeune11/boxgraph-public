id: delay_phase
name: impedance phase caused by a pressure-flow time delay
role: model
stated: {page: 4, printed_page: "134", quote: "between pressure and flow of 8 ms translates into phase", where: "text, 360 x 8 x 10^-3 f"}
equation: "phase = 360 td f  (degrees)"
inputs:
  td: {quantity: pressure_flow_time_delay, unit: s}
  f: {quantity: frequency, unit: Hz}
outputs:
  k: {quantity: delay_phase_per_frequency, unit: degree/Hz, description: "360 td"}
  phase: {quantity: delay_phase, unit: degree}
settings: {}
stochastic: false
