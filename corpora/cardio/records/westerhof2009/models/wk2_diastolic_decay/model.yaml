id: wk2_diastolic_decay
name: exponential diastolic pressure decay of the two-element windkessel
role: model
stated: {page: 2, printed_page: "132", quote: "with Pes = end-systolic aortic pressure", where: "Eq. for Pdia(t), p. 2; also P(t) = P0 e^-t/RC, p. 7"}
equation: "Pdia(t) = Pes e^(-t/RC)"
described_from: ref-18
inputs:
  Pes: {quantity: diastolic_start_pressure, unit: mmHg}
  R: {quantity: peripheral_resistance, unit: mmHg*s/ml}
  C: {quantity: total_arterial_compliance, unit: ml/mmHg}
  t: {quantity: time_in_diastole, unit: s}
outputs:
  Pdia: {quantity: diastolic_aortic_pressure, unit: mmHg}
settings: {}
stochastic: false
