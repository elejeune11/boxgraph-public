id: area_method
name: area method for the diastolic decay time RC
role: processing
stated: {page: 7, printed_page: "137", quote: "The area method [31]. The decay time in diastole is", where: "Eq. RC = integral, p. 7"}
equation: "RC = integral_t1^t2 P/(P1 - P2) dt"
described_from: ref-31
inputs:
  P: {quantity: diastolic_aortic_pressure, unit: mmHg, description: measured diastolic pressure waveform from t1 to t2}
outputs:
  RC: {quantity: decay_time, unit: s}
settings: {}
runnable: false
not_runnable_reason: It acts on a measured diastolic pressure waveform, and the paper gives none.
stochastic: false
