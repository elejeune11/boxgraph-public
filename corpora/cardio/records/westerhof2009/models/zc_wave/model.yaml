id: zc_wave
name: aortic characteristic impedance from wave speed, blood density and aortic area
role: model
stated: {page: 3, printed_page: "133", quote: "Zc is aortic characteristic impedance and equals PWVq/A", where: "Fig. 5 caption"}
equation: "Zc = PWV rho / A"
inputs:
  PWV: {quantity: pulse_wave_velocity, unit: cm/s}
  rho: {quantity: blood_density, unit: g/cm^3}
  A: {quantity: aortic_area, unit: cm^2}
outputs:
  Zc: {quantity: characteristic_impedance, unit: g/cm^4/s}
settings: {}
stochastic: false
