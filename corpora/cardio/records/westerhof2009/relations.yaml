- id: rel_wk3_is_westerhof1971_3el
  kind: same_as
  a: westerhof1971/impedance_3el
  b: westerhof2009/wk3_impedance
  # 1971 ports are cgs (g/cm^4/s = dyn s/cm^5; C in cm^4 s^2/Mg = 1e-6 cm^5/dyn); 2009 ports are
  # mmHg s/ml and ml/mmHg. 1 mmHg = 1333.22387415 dyn/cm^2.
  mapping: {Zc: "Rc/1333.22387415", R: "Rp/1333.22387415", C: "C*1e-6*1333.22387415", f: "f"}
  output_map: {Zmod: modulus}
  regime: {Rc: [25, 1200], Rp: [100, 21000], C: [2, 1700], f: [0.1, 20]}
  provenance: stated
  citation: {page: 3, printed_page: "133", quote: "in the three-element Windkessel [71, 73], can be seen as a", where: text}
  assumptions:
    - "the 1971 paper's Rc is the characteristic impedance of the 2009 Zc (both papers put it in series with Rp parallel to C); the regime spans the 1971 Table 1 values"
