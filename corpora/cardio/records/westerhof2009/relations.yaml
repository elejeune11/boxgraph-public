- id: rel_zc_wave_is_westerhof1969_char_impedance
  kind: same_as
  a: westerhof1969/char_impedance
  b: westerhof2009/zc_wave
  # Both in cgs. With L' = rho/A (westerhof1969 segment_inertance, n = 1) and c = 1/sqrt(L'C')
  # (westerhof1969 phase_velocity), Z0 = sqrt(L'/C') = rho c / A. rho is fixed at 1.05 g/cm^3 and
  # A chosen so that rho/A = L'; Zc depends only on rho/A, so the choice of rho is immaterial.
  mapping: {PWV: "1/sqrt(Lp*Cp)", rho: "1.05", A: "1.05/Lp"}
  output_map: {Zc: Z0}
  regime: {Lp: [0.01, 10], Cp: [1.0e-7, 1.0e-3]}
  provenance: proposed
  reason: >
    The 2009 paper cites ref 71 for the characteristic impedance of the three-element windkessel and
    says it equals wave speed times blood density over aortic area; the 1969 paper computes the
    characteristic impedance of a lossless artery as sqrt(L'/C') with L' = rho/(pi r^2) and phase
    velocity 1/sqrt(L'C'), which is algebraically the same expression. The 2009 paper does not
    state this equivalence itself.
  assumptions:
    - "the 1969 inertance per length is the n = 1 inductor rho/S of its Fig. 1, so rho/A = L'"
    - "both models are the lossless (inviscid) approximation"
