- id: r_added
  quantity: peripheral_resistance
  unit: mmHg*s/ml
  printed: "1"
  basis: The paper states the high-frequency limit of the two-element windkessel phase without parameter values; 1 mmHg s/ml is a typical human systemic value
  alternatives: ["0.5", "2"]
  stands_for: R of the two-element windkessel (Fig. 5)
- id: c_added
  quantity: total_arterial_compliance
  unit: ml/mmHg
  printed: "1.5"
  basis: Typical human total arterial compliance; the paper gives none for this statement
  alternatives: ["0.5", "3"]
  stands_for: C of the two-element windkessel (Fig. 5)
- id: f_high_added
  quantity: frequency
  unit: Hz
  printed: "100"
  basis: '"for high frequencies"; the phase only tends to -90 deg, so a frequency well above the plotted 12 Hz is taken'
  alternatives: ["12", "1000"]
  stands_for: a high frequency in "its phase angle reaches -90°"
