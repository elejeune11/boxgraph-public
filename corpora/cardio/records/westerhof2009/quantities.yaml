- {id: peripheral_resistance, name: total peripheral resistance R, dimension: "[pressure]*[time]/[length]**3"}
- {id: total_arterial_compliance, name: total arterial compliance C, dimension: "[length]**3/[pressure]"}
- {id: characteristic_impedance, name: aortic characteristic impedance Zc, dimension: "[pressure]*[time]/[length]**3"}
- {id: total_arterial_inertance, name: total arterial inertance L (fourth element), dimension: "[pressure]*[time]**2/[length]**3"}
- {id: mean_aortic_pressure, name: mean aortic pressure, dimension: "[pressure]"}
- {id: mean_venous_pressure, name: mean venous pressure, dimension: "[pressure]"}
- {id: cardiac_output, name: cardiac output (mean flow), dimension: "[length]**3/[time]"}
- {id: stroke_volume, name: stroke volume (volume change DV), dimension: "[length]**3"}
- {id: pulse_pressure, name: aortic pulse pressure (pressure change DP), dimension: "[pressure]"}
- {id: diastolic_start_pressure, name: aortic pressure at the start of the fitted diastolic decay (Pes or P0), dimension: "[pressure]"}
- {id: diastolic_aortic_pressure, name: aortic pressure during diastole, dimension: "[pressure]"}
- {id: intercept_pressure, name: asymptotic intercept pressure Pi of the diastolic decay, dimension: "[pressure]"}
- {id: decay_time, name: decay time RC of the diastolic aortic pressure, dimension: "[time]"}
- {id: time_in_diastole, name: time since the start of the fitted diastolic decay, dimension: "[time]"}
- {id: pulse_wave_velocity, name: pulse wave velocity in the proximal aorta, dimension: "[length]/[time]"}
- {id: blood_density, name: blood density, dimension: "[mass]/[length]**3"}
- {id: aortic_area, name: cross-sectional area of the proximal aorta, dimension: "[length]**2"}
- {id: frequency, name: frequency of a harmonic, dimension: "1/[time]"}
- {id: input_impedance_modulus, name: modulus of the arterial input impedance, dimension: "[pressure]*[time]/[length]**3"}
- {id: input_impedance_phase, name: phase angle of the arterial input impedance, dimension: "dimensionless"}
- {id: impedance_numerator_constant_b, name: "constant b of the impedance form (a + jwb)/(1 + jwc)", dimension: "[pressure]*[time]**2/[length]**3"}
- {id: impedance_time_constant_c, name: "constant c of the impedance form (a + jwb)/(1 + jwc)", dimension: "[time]"}
- {id: pressure_flow_time_delay, name: time delay between measured pressure and flow, dimension: "[time]"}
- {id: delay_phase_per_frequency, name: impedance phase added by a time delay per unit frequency, dimension: "[time]"}
- {id: delay_phase, name: impedance phase added by a pressure-flow time delay, dimension: "dimensionless"}
- {id: normalized_sensitivity, name: "sensitivity of a pressure or stroke volume to an arterial or cardiac parameter, 100 (DY/Y)/(DX/X)", dimension: "dimensionless"}
- {id: sensitivity_ratio, name: ratio of the magnitudes of two normalized sensitivities, dimension: "dimensionless"}
- {id: nonlinear_pv_coefficient, name: "exponential coefficient b of the pressure-volume relation V = a e^(bP) + c", dimension: "1/[pressure]"}
- {id: end_systolic_pressure, name: aortic pressure at end-systole Ps, dimension: "[pressure]"}
- {id: end_diastolic_pressure, name: aortic pressure at end-diastole Pd, dimension: "[pressure]"}
- {id: aortic_pressure, name: aortic pressure at which compliance is evaluated, dimension: "[pressure]"}
- {id: pressure_area, name: area under the aortic pressure curve over a part of the beat (As or Ad), dimension: "[pressure]*[time]"}
- {id: zc_fraction_of_resistance, name: characteristic impedance as a fraction of peripheral resistance, dimension: "dimensionless"}
- {id: decay_start_delay_fraction, name: delay after valve closure before the decay fit starts as a fraction of the heart period, dimension: "dimensionless"}
- {id: svpp_compliance_overestimation, name: overestimation of compliance by the stroke volume over pulse pressure method, dimension: "dimensionless"}
- {id: frequency_over_heart_rate, name: frequency as a multiple of heart rate (bounds of the impedance frequency ranges), dimension: "dimensionless"}
- {id: age_resistance_increase, name: relative increase of peripheral resistance with age, dimension: "dimensionless"}
- {id: age_compliance_decrease_factor, name: factor by which total arterial compliance decreases with age, dimension: "dimensionless"}
- {id: time_in_beat, name: time from the start of a plotted heart beat, dimension: "[time]"}
- {id: ascending_aortic_pressure, name: ascending aortic pressure over a heart beat, dimension: "[pressure]"}
- {id: peak_aortic_pressure, name: highest aortic pressure of a beat (systolic pressure), dimension: "[pressure]"}
- {id: minimum_aortic_pressure, name: lowest aortic pressure of a beat (diastolic pressure), dimension: "[pressure]"}
- {id: peak_aortic_flow, name: highest aortic flow of a beat, dimension: "[length]**3/[time]"}
