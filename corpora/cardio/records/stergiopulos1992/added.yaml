- id: rho_blood
  quantity: blood_density
  unit: g/cm^3
  printed: '1.05'
  basis: the paper uses rho in Eqs. 2-8 but prints no value; a usual value for blood
  alternatives:
  - '1.06'
  - '1.0'
  stands_for: rho
- id: mu_blood
  quantity: blood_viscosity
  unit: P
  printed: '0.035'
  basis: the paper uses mu in Eqs. 3 and 8 but prints no value; a usual value for blood
  alternatives:
  - '0.04'
  - '0.03'
  stands_for: mu
- id: cu_added
  quantity: shear_inertia_coefficient
  unit: dimensionless
  printed: '1'
  basis: c_u is a function of the frequency parameter (p. 2) that the paper does not give; 1 drops the unsteady
    correction of Eq. 3
  alternatives:
  - '1.33'
  stands_for: c_u in Eqs. 3 and 6
- id: cv_added
  quantity: shear_viscous_coefficient
  unit: dimensionless
  printed: '1'
  basis: c_v is a function of the frequency parameter (p. 2) that the paper does not give; 1 is Poiseuille friction
  alternatives:
  - '1.5'
  - '2'
  stands_for: c_v in Eqs. 3 and 6
- id: T_added
  quantity: cardiac_period
  unit: s
  printed: '1.0'
  basis: 'read by eye from Fig. 2(b): the proximal boundary condition repeats after about 1 s; not stated in the
    text'
  alternatives:
  - '0.95'
  - '1.05'
  stands_for: period of the aortic flow pulse
- id: Ts_added
  quantity: ejection_duration
  unit: s
  printed: '0.3'
  basis: 'read by eye from Fig. 2(b): the forward ejection lasts about 0.3 s; the waveform is only plotted, and
    is taken here as a half sine'
  alternatives:
  - '0.27'
  - '0.35'
  stands_for: duration of the aortic flow pulse
- id: Qmax_added
  quantity: peak_aortic_inflow
  unit: mL/s
  printed: '500'
  basis: 'read by eye from Fig. 2(b): the proximal boundary condition peaks near 500 ml/s; the waveform is only
    plotted'
  alternatives:
  - '450'
  - '550'
  stands_for: peak of the aortic flow pulse
- id: pv_added
  quantity: venous_pressure
  unit: mmHg
  printed: '0'
  basis: 'Eq. 7 has no outflow pressure: the terminal impedance drains to zero pressure'
  alternatives:
  - '5'
  stands_for: pressure downstream of R2
- id: xi_mid
  quantity: stenosis_position
  unit: dimensionless
  printed: '0.5'
  basis: the paper does not say where in the segment the stenosis sits, nor which diameter D it divides Ls by; the
    segment midpoint
  alternatives:
  - '0'
  - '1'
  stands_for: position of the stenosis in segment 39 or 46
- id: Kt_added
  quantity: stenosis_turbulent_coefficient
  unit: dimensionless
  printed: '1.52'
  basis: Eq. 8 is from Young and Tsai (1973), whose coefficients the paper does not print; the value usually quoted
    from that work
  alternatives:
  - '1.0'
  stands_for: Kt
- id: Ku_added
  quantity: stenosis_inertance_coefficient
  unit: dimensionless
  printed: '1.2'
  basis: Eq. 8 is from Young and Tsai (1973), whose coefficients the paper does not print; the value usually quoted
    from that work
  alternatives:
  - '1.0'
  stands_for: Ku
- id: kva_added
  quantity: stenosis_viscous_length_coefficient
  unit: dimensionless
  printed: '0.83'
  basis: the paper says Kv depends on the stenosis geometry and on A0/As but gives no formula; Kv = 32 (0.83 Ls
    + 1.64 Ds)/D0 (A0/As)^2 of the Young group
  alternatives:
  - '1.0'
  stands_for: Kv
- id: kvb_added
  quantity: stenosis_viscous_throat_coefficient
  unit: dimensionless
  printed: '1.64'
  basis: 'as for the length coefficient: the throat-diameter term of the same Kv formula'
  alternatives:
  - '0'
  stands_for: Kv
