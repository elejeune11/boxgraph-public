- id: q_no_validation_vs_westerhof1969
  kind: choice
  about: [arterial_tree_1d, arterial_tree_1d_dilated, compliance_sum, terminal_impedance_eq7, PI0_knee_gosling, sys_ratio_thigh_fronek_normal]
  text: >
    (Cross-validation with westerhof1969, cited here as ref-westerhof1969.) No validation is entered in either
    direction. This paper takes westerhof1969's segment volume compliances as inputs (p. 3, cited.yaml) and
    names it only as a similar model without coronary circulation (p. 11); it never says its model explains
    or is compared with westerhof1969's measurements. Those measurements are the decay times of the analog
    (0.8, 0.4, 1.66, about 0.5 s), the stiff-system rises of input impedance level and wave velocity ("about
    50 per cent", no verdict in any case) and the apparent wave velocities of Luchsinger et al. and Gabe et al.
    in man (Fig. 7). None of this record's models outputs a decay time, an impedance level or an apparent
    (phase-delay) wave velocity: arterial_tree_1d gives systolic pressure ratios, PI ratios, flow ratios,
    aortic pressures and dt_max, and its dt_max (dx/c) is a numerical bound, not the measured apparent
    velocity. Mapping any of them would join quantities that share only a dimension (the time-shaped ports of
    arterial_tree_1d and westerhof1969/rc_decay are a resistance and a compliance, but the tree has no decay-time
    output). The decay times are moreover measured on westerhof1969's analog, with its own resistances, not
    on this tree. In the other direction, westerhof1969's runnable models (char_impedance, phase_velocity,
    total_compliance, rc_decay, ...) give no pulsatility index or systolic pressure ratio, and its network
    (arterial_tree_analog) is not runnable, so none predicts the Gosling et al. or Fronek et al. measurements
    recorded here.
  citation: {page: 11, printed_page: '1487', quote: "other similar models (i.e. Westerhof et al., 1969)", where: text}

