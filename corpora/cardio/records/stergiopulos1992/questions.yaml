  citation: {page: 7, printed_page: "1483", quote: "Effect of severity of femoral stenosis on left posterior", where: "Fig. 4"}
- id: q_figure_sweeps
  kind: numerics
  about: [run_fig3_constant, run_fig3_reduced, run_fig8_flat, run_fig8_band, run_fig6_fig9, arterial_tree_1d]
  text: >
    Each figure line is read at many stenosis levels and recorded whole as data (fig*_curve). The comparisons
    use one level per line, read by the same code (fig*_pt): 90 % for the solid line of Fig. 3, 20 % for its
    dashed line, 30 % (flat lines) and 80 % (band) for Fig. 8, and 80 % for Figs. 6 and 9. The reason is
    cost. One autoregulated point takes 5-10 simulations of about 4 s each. Every build repeats each run for
    18 alternatives of the added inputs and 16 rounding ends of the printed inputs, so a whole-curve sweep
    would take several hours to build. The whole-curve data stay recorded for a cheaper model or a later
    build. Fig. 3's dotted line (resting flow with vasodilation) is not compared: the record's autoregulation
    holds Q/Qn at 1 by construction.
- id: q_fig3_elevated_flow
  kind: unexplained_difference
  about: [cmp_fig3_reduced, arterial_tree_1d_dilated, fig3_reduced_pt, q_inflow]
  text: >
    With every terminal resistance distal to the abdominal stenosis at 20 % of its value, the record's tree
    gives Q/Qn = 2.46 through segment 39 at 20 % stenosis. Fig. 3 plots 3.91 (and 3.94 near 0 %). The record
    prescribes the aortic inflow, so the cardiac output is fixed and dilating the leg beds only draws flow
    away from the other beds. Nearly four times the normal flow through the abdominal aorta needs the total
    inflow to rise. Either the paper drove this case with a prescribed pressure rather than the flow pulse of
    Fig. 2(b), or "distal" covers more beds than those fed through segment 39. The paper says neither.
  citation: {page: 5, printed_page: "1481", quote: "supplied by the stenosed artery, at 20% of the original", where: "text (Fig. 3)"}
