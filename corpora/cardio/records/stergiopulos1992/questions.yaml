- id: q_no_validation_vs_olufsen2004
  kind: choice
  about: [arterial_tree_1d, terminal_impedance_eq7]
  text: >
    (Cross-validation with olufsen2004, which cites this paper as ref. 27.) No model of this record is
    validated against a measurement of olufsen2004: that paper is analytical and measures nothing (its data
    are blood properties, Bessel zeros, derived time-scales and its own model curves). It cites this paper
    only among one-dimensional network models with windkessel outflow conditions. Its own models give no
    pulsatility index or systolic pressure ratio, so none of them predicts the Gosling et al. or Fronek et al.
    measurements recorded here (see olufsen2004 q_no_validation_vs_stergiopulos1992).
- id: q_no_validation_vs_stergiopulos1999
  kind: choice
  about: [arterial_tree_1d, terminal_impedance_eq7, compliance_sum]
  text: >
    (Cross-validation with stergiopulos1999, which cites this paper as ref. 17.) No model of this record is
    validated against a measurement of stergiopulos1999, and no model of that record against the Gosling et al.
    or Fronek et al. measurements here. stergiopulos1999 uses this paper's tree only to generate model aortic
    pressure and flow (its Table 3, model values, not measurements). Its measurements are R_p, Z_c, C and the
