- id: q_no_validation_vs_formaggia2003
  kind: choice
  about: [arterial_tree_1d, PI_aorta_gosling, sys_ratio_thigh_fronek_normal]
  text: >
    (Cross-validation with formaggia2003; cross-validation job 2026-11-04.) Neither paper cites the other.
