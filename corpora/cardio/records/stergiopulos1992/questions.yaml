- id: q_eq4_not_runnable
  kind: unstated_model
  about: [arterial_tree_eq4, eq4_zero_compliance, p_star_eq4, arterial_tree_1d]
  text: >
    Eq. 4 with the coefficients the paper takes from Eq. 9 (C0' = K/p0, C1' = -K/(2 p0^2), p0 = 97 mmHg) has
    dA/dp = A0 K (2 p0 - p)/p0^2, which vanishes at p = 2 p0 = 194 mmHg and is negative above it (model
    eq4_zero_compliance). In the reader's implementation of the tree the arm and leg systolic pressures pass
    194 mmHg in the first beat and the explicit scheme diverges, so the model as stated cannot be run here.
    Fig. 2(a) itself shows a peripheral (femoral) peak near 27 kPa by eye, about 200 mmHg, above 2 p0. The
    paper's own code (Stergiopulos 1990 thesis) must therefore treat the wall law differently from Eq. 4 as
    printed, or keep pressures below 194 mmHg in a way the paper does not describe. The runnable model
    arterial_tree_1d uses Eq. 9 itself, which Eq. 4 approximates.
  citation: {page: 3, printed_page: "1479", quote: "This relationship can be expanded in a series", where: "Eqs. 4 and 9"}
- id: q_compliance_sum
  kind: unexplained_difference
  about: [cmp_compliance_sum, Csum_printed]
  text: >
    The 55 volume compliances of Table 1 add to 625.688 x 10^-6 cm^5/dyn, which is 0.8342 ml/mmHg with
    1 mmHg = 1333.22 dyn/cm^2; the paper prints 0.835. The difference (0.1%) is in the last printed digit; it
    could come from a different mmHg conversion (about 1334.5 dyn/cm^2 would give 0.835) or from rounding.
- id: q_terminal_compliance
  kind: unexplained_difference
  about: [cmp_CT_6, run_terminal_compliance, terminal_compliance, Cres_printed]
  text: >
    The terminal compliances of Table 2 are in the proportions of C_Ti = C_vol,res R_total/R_Ti (each R_Ti
    of Table 2), but every printed C_Ti is 1.120 times what the formula gives with C_vol,res = 0.165 ml/mmHg
    and R_total the parallel combination of the 28 terminal resistances. The 28 printed C_Ti add to about
    0.185 ml/mmHg, not the 0.165 the text says is distributed. Taking R_total as the input resistance of the
    whole tree (adding Poiseuille resistances of the segments, mu = 0.035-0.045 P) raises R_total by only 4-5%,
    so it does not explain the factor. Which residual compliance or R_total the table was computed with is not
    stated.
  citation: {page: 3, printed_page: "1479", quote: "where R,, is the total resistance of the arterial system", where: "text"}
- id: q_R_total
  kind: choice
  about: [terminal_compliance]
  text: >
    R_total is described as "the total resistance of the arterial system". The model takes it as the parallel
    combination of the terminal resistances, so the C_Ti sum to C_vol,res as the text says they should.
- id: q_LD
  kind: unexplained_difference
  about: [cmp_LD_abdominal, cmp_LD_femoral, xi_mid]
  text: >
    The printed length-to-diameter ratios 1.6 (abdominal, Ls = 1.5 cm) and 4.8 (femoral, Ls = 2 cm) imply
    diameters of 0.94 cm and 0.42 cm. Table 1 gives segment 39 a diameter of 1.16 to 1.10 cm and segment 46 a
    diameter of 0.52 to 0.38 cm, so Ls/D at the midpoint is 1.33 and 4.45, and no single position in the
    segments gives both printed ratios (the abdominal ratio would need a diameter below any in segment 39).
    The paper does not say which diameter it uses. The femoral ratio counts as reproduced only because
    "2 cm" is printed with one significant digit, and the rounding band of the inputs (3.3 to 5.6) covers 4.8.
  citation: {page: 5, printed_page: "1481", quote: "1.5 cm, giving a length to diameter ratio of 1.6", where: "text"}
- id: q_inflow
  kind: unstated_input
  about: [T_added, Ts_added, Qmax_added, arterial_tree_1d]
  text: >
    The proximal boundary condition (the aortic flow pulse) is only plotted (Fig. 2b), with a small backflow
    after ejection. The record uses a half-sine pulse with period, duration and peak read by eye from that
    figure and no backflow. The mean pressures, and to a smaller degree the systolic ratios, depend on it.
  citation: {page: 6, printed_page: "1482", quote: "Proximal Boundary Condition", where: "Fig. 2(b)"}
- id: q_numerics
  kind: choice
  about: [arterial_tree_1d, run_tree_control, ref_tree_dt, ref_tree_dx]
  text: >
    The paper's scheme ("simple explicit", first order, upwind convective term) is detailed only in the
    Stergiopulos (1990) thesis; dx and dt are not printed (only dt_max of the order of 0.001 s). The record's
    scheme is a staggered forward-backward Euler scheme with flows on cell faces, friction and stenosis losses
    semi-implicit, convective term upwinded inside segments and dropped on faces at bifurcations, dx = 1 cm and
    dt = 5e-5 s (1e-4 s diverged when dx was refined to 0.25 cm), three heart cycles from a uniform pressure equal to mean inflow times total terminal resistance
    (the paper runs two or three cycles from arbitrary values).
- id: q_shear
  kind: unstated_input
  about: [cu_added, cv_added]
  text: >
    The shear stress coefficients c_u and c_v are functions of the frequency parameter (p. 2) whose values are
    not given; the record takes the quasi-steady Poiseuille values. The paper says the predicted waveforms were
    fairly insensitive to the shear stress model.
  citation: {page: 5, printed_page: "1481", quote: "flow conditions, the predicted waveforms were fairly", where: "text"}
- id: q_sys_ratio_knee_ankle
  kind: unexplained_difference
  about: [cmp_sys_ratio_knee, cmp_sys_ratio_ankle, cmp_sys_ratio_thigh]
  text: >
    In the record's tree (Eq. 9 wall law, half-sine inflow, added rho, mu, c_u, c_v), the normal systolic
    pressure over the brachial systolic pressure is 1.20 at the upper thigh, inside the printed range of 1.1
    to 1.2. At the knee and the ankle it is 1.31 and 1.30, above that range. The distal ratios depend on the
    unstated inflow waveform, wave speeds, viscosity and the choice of sites, and on the wall law the paper's
    code really used (q_eq4_not_runnable). The paper's model cannot be run as printed, so this difference
    cannot be traced to any one of them.
