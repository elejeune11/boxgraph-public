- id: ref_tree_dt
  run: run_tree_control
  setting: dt
  factors:
  - 1
  - 2
  - 4
  mode: divide
  output: sys_ratio_ankle
  tolerance: 2%
  tolerance_basis: 'added: the printed ratio is a range 1.1 to 1.2, about 9% wide; 2% is well inside it'
  tolerance_added: true
- id: ref_tree_dx
  run: run_tree_control
  setting: dx
  factors:
  - 1
  - 2
  - 4
  mode: divide
  output: sys_ratio_ankle
  tolerance: 2%
  tolerance_basis: 'added: the printed ratio is a range 1.1 to 1.2, about 9% wide; 2% is well inside it'
  tolerance_added: true
