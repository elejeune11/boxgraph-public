  output: p_asc_mean
  against: 'mynard2015/t6_aort_mean_ref'
  purpose: validation
  quantities: {'mynard2015/mean_pressure': aortic_pressure}
  conditions_ok: >
    mynard2015's mean_pressure is the time-averaged pressure at any site; this datum is the one at the aortic root
    (Table 6, "AoRt (mean)"), and p_asc_mean is the time average of this record's aortic_pressure in the ascending
    aorta at the root (p. 3, "the root of the ascending aorta immediately distal to the aortic valve"), so here the
    two are the same quantity. The measurement is the range over healthy resting adults (Milnor, mynard2015 ref. 81);
    the model is a single "healthy young adult" (p. 3). Its prescribed inflow (added: period 1.0 s, half sine of
    peak 500 mL/s over 0.3 s) gives heart rate 60 beats/min and cardiac output about 5.7 L/min, both inside the
    same table's reference ranges (53 to 89 beats/min, 3.6 to 9.4 L/min), so the model sits inside the population
    the range describes.
  basis: >
    The control case is stated to be "representative of a healthy young adult" (p. 3, "are considered
    representative of a healthy young adult, and will be referred to as the control case"). With the inflow
    prescribed, its mean aortic pressure follows from the total terminal resistances, which "were taken from the
    data published by Schaaf and Abbrecht (1972)" (p. 3), and the outflow pressure; none were set from Milnor's
    pressures, so this is a test, not a fit. The reference pressure p0 = 97 mmHg of Eq. 9 is the wall law's
    distending pressure, not a pressure the model is forced to; it is equal to Table 6's reference mean, which
    is noted but does not set the mean. mynard2015 adapts these same bed resistances (its p. 6, "bed resistances
    were based on data in Stergiopulos et al.").
