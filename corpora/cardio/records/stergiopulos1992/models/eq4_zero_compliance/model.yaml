id: eq4_zero_compliance
name: pressure at which Eq. 4 with the Eq. 9 coefficients has zero compliance
stated:
  page: 3
  printed_page: '1479'
  quote: This relationship can be expanded in a series
  where: Eqs. 4 and 9
equation: A = A0[1 + C0'(p - p0) + C1'(p - p0)^2], C0' = K/p0, C1' = -K/(2 p0^2); dA/dp = 0 at p = 2 p0
inputs:
  p0:
    quantity: reference_pressure
    unit: mmHg
outputs:
  p_star:
    quantity: zero_compliance_pressure
    unit: mmHg
