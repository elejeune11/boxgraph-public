not_runnable_reason: with C0' = K/p0 and C1' = -K/(2 p0^2) the compliance of Eq. 4 is A0 K (2 p0 - p)/p0^2, zero
  at p = 2 p0 = 194 mmHg and negative above; in the reader's implementation (the paper's scheme is in a thesis)
  the arm and leg systolic pressures pass 194 mmHg in the first beat and the explicit scheme diverges. The runnable
  model arterial_tree_1d uses Eq. 9 itself.
