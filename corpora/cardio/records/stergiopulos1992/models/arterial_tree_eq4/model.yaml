id: arterial_tree_eq4
name: 1D model of the 55-segment arterial tree with the quadratic wall law of Eq. 4 (as stated)
stated:
  page: 2
  printed_page: '1478'
  quote: Governing equations. The mathematical model is
  where: Eqs. 1-8
equation: dA/dt + dQ/dx = 0 (1); cu dQ/dt + d(Q^2/A0)/dx + (A0/rho) dp/dx + B1 Q = 0 (6), B1 = 8 cv pi mu/(rho A0);
  A = A0[1 + C0'(p - p0) + C1'(p - p0)^2] (4), C0' = K/p0, C1' = -K/(2 p0^2); dQ/dt = (1/R1) dp/dt + p/(R1 R2 CT)
  - (1 + R1/R2) Q/(R1 CT) (7); dp = 4 Kv mu/(pi D^3) Q + Kt rho/(2 A0^2)(A0/As - 1)^2 Q|Q| + Ku rho Ls/A0 dQ/dt
  (8)
