- id: segment_length
  name: length of an arterial segment
  dimension: '[length]'
- id: lumen_radius
  name: lumen radius of an arterial segment at one of its ends
  dimension: '[length]'
- id: segment_volume_compliance
  name: volume compliance of one arterial segment, Cvol
  dimension: '[length]**4*[time]**2/[mass]'
- id: summed_segment_compliance
  name: volume compliance of all arterial segments of the model together
  dimension: '[length]**4*[time]**2/[mass]'
- id: total_arterial_compliance
  name: total volume compliance of the human arterial system
  dimension: '[length]**4*[time]**2/[mass]'
- id: residual_compliance
  name: 'residual volume compliance: total minus arterial segment compliances'
  dimension: '[length]**4*[time]**2/[mass]'
- id: terminal_compliance
  name: compliance CT of one terminal (modified windkessel) impedance
  dimension: '[length]**4*[time]**2/[mass]'
- id: terminal_resistance
  name: total resistance RT = R1 + R2 of one terminal impedance
  dimension: '[mass]/[length]**4/[time]'
- id: terminal_resistance_ratio
  name: ratio R1/RT of the series resistance to the total terminal resistance
  dimension: dimensionless
- id: frequency
  name: frequency of one harmonic of pressure and flow
  dimension: 1/[time]
- id: terminal_impedance_modulus
  name: modulus of the impedance p/Q of one terminal (modified windkessel)
  dimension: '[mass]/[length]**4/[time]'
- id: terminal_impedance_phase
  name: phase of the impedance p/Q of one terminal (modified windkessel)
  dimension: dimensionless
- id: reference_pressure
  name: reference distending pressure p0 of the pressure-area law
  dimension: '[mass]/[length]/[time]**2'
- id: venous_pressure
  name: pressure at the outflow of the terminal impedances
  dimension: '[mass]/[length]/[time]**2'
- id: zero_compliance_pressure
  name: pressure at which a pressure-area law stops being compliant (dA/dp = 0)
  dimension: '[mass]/[length]/[time]**2'
- id: aortic_pressure
  name: blood pressure in the ascending aorta
  dimension: '[mass]/[length]/[time]**2'
- id: blood_density
  name: density of blood
  dimension: '[mass]/[length]**3'
- id: blood_viscosity
  name: dynamic viscosity of blood
  dimension: '[mass]/[length]/[time]'
- id: shear_inertia_coefficient
  name: coefficient c_u of the inertia term of the wall shear stress model (Eq. 3)
  dimension: dimensionless
- id: shear_viscous_coefficient
  name: coefficient c_v of the viscous term of the wall shear stress model (Eq. 3)
  dimension: dimensionless
- id: cardiac_period
  name: duration of one heart cycle
  dimension: '[time]'
- id: ejection_duration
  name: duration of systolic ejection into the aorta
  dimension: '[time]'
- id: peak_aortic_inflow
  name: peak volume flow into the ascending aorta
  dimension: '[length]**3/[time]'
- id: percent_stenosis
  name: stenosis severity, percentage area reduction (1 - As/A0) x 100
  dimension: dimensionless
- id: stenosis_length
  name: length Ls of a stenosis
  dimension: '[length]'
- id: stenosis_position
  name: position of a stenosis along its segment, as a fraction of the segment length from the proximal end
  dimension: dimensionless
- id: stenosis_length_to_diameter
  name: length of a stenosis divided by the arterial diameter
  dimension: dimensionless
- id: stenosis_turbulent_coefficient
  name: coefficient Kt of the nonlinear term of the stenosis equation (Eq. 8)
  dimension: dimensionless
- id: stenosis_inertance_coefficient
  name: coefficient Ku of the inertia term of the stenosis equation (Eq. 8)
  dimension: dimensionless
- id: stenosis_viscous_length_coefficient
  name: coefficient a in Kv = 32 (a Ls + b Ds)/D0 (A0/As)^2, multiplying the stenosis length
  dimension: dimensionless
- id: stenosis_viscous_throat_coefficient
  name: coefficient b in Kv = 32 (a Ls + b Ds)/D0 (A0/As)^2, multiplying the throat diameter
  dimension: dimensionless
- id: systolic_pressure_ratio
  name: systolic pressure at a leg site divided by the brachial systolic pressure
  dimension: dimensionless
- id: terminal_resistance_reduction
  name: reduction of the total terminal resistance of the beds distal to a stenosis, percent of the original value
  dimension: dimensionless
- id: stable_time_step
  name: largest time step of the explicit scheme, dx/c
  dimension: '[time]'
- id: pulsatility_index
  name: pulsatility index PI = (Qmax - Qmin)/Qmean of a flow pulse
  dimension: dimensionless
- id: pulsatility_index_ratio
  name: pulsatility index divided by the pulsatility index under normal conditions, PI/PI0
  dimension: dimensionless
- id: time
  name: time within the plotted cycles
  dimension: '[time]'
- id: aortic_inflow
  name: volume flow into the ascending aorta (the proximal boundary condition), as a function of time
  dimension: '[length]**3/[time]'
- id: femoral_pressure
  name: blood pressure in the femoral artery
  dimension: '[mass]/[length]/[time]**2'
- id: posterior_tibial_pressure
  name: blood pressure at the distal end of the left posterior tibial artery (ankle)
  dimension: '[mass]/[length]/[time]**2'
- id: distal_resistance_fraction
  name: total terminal resistance of the beds distal to a stenosis, as a percentage of its original value
  dimension: dimensionless
- id: mean_flow_ratio
  name: mean flow through the stenosed segment divided by its normal value, Q/Qn
  dimension: dimensionless
