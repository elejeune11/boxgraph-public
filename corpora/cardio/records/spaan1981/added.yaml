- id: lv_mass_fig7_added
  quantity: lv_mass
  unit: g
  printed: "109"
  basis: >-
    The paper normalizes the Fig. 7 intramyocardial capacitance per 100 g LV but does not state the LV
    mass of the Fig. 7 dog; the only LV mass printed is 109 g, for the dog of Fig. 4 (p. 8). With
    C_im = 3 s / 35 mm Hg s/ml, the printed "approximately 0.07 ml/mm Hg per 100 g" implies about 122 g.
  alternatives: ["85", "122", "150"]
  stands_for: LV mass dividing C_im to give ml/mm Hg per 100 g LV (p. 9)
- id: rc_for_fraction_added
  quantity: coronary_resistance_mean_flow
  unit: mmHg*s/ml
  printed: "100"
  basis: >-
    The paper says R_a is 63% of the total resistance (p. 9) without saying at which R_c; its
    regression R_a = 0.63 R_c - 12.9 has an intercept, so the fraction depends on R_c. 100 is the
    R_c = R_a + R_v of the Fig. 7 dog (65 + 35) and lies within the Fig. 6 range (about 20-140 on the
    axis). Added by the audit.
  alternatives: ["60", "140", "1000"]
  stands_for: R_c at which R_a / R_c is evaluated (p. 9, "63% of the total resistance")
