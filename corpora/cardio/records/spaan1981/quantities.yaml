- {id: capillary_diameter, name: capillary diameter in the dog left ventricle, dimension: "[length]"}
- {id: capillary_density, name: number of capillaries per unit cross-sectional area of myocardium, dimension: "1/[length]**2"}
- {id: capillary_volume_fraction, name: capillary volume as a fraction of myocardial volume, dimension: "dimensionless"}
- {id: small_artery_volume_fraction, name: intramyocardial (small) artery volume as a fraction of myocardial volume, dimension: "dimensionless"}
- id: myocardial_blood_volume_fraction
  name: myocardial blood volume as a fraction of wall volume
  dimension: "dimensionless"
  description: >-
    The paper compares the sum of its capillary and small-artery fractions with the total myocardial
    blood volume measured by dye dilution; both are recorded under this quantity so that the
    comparison the paper makes can be made (veins are not in the sum; see q_sum_vs_total).
- {id: cbf_excursion_area, name: area between the systolic coronary flow curve and mean flow over one beat (a volume), dimension: "[length]**3"}
- {id: intramyocardial_volume_variation, name: amplitude of the variation of intramyocardial blood volume around its mean, dimension: "[length]**3"}
- {id: lv_mass, name: left ventricular mass, dimension: "[mass]"}
- {id: initial_phase_rc_time, name: "RC time of the rapid initial phase of the left main pressure decay after clamping (R_a C_ep)", dimension: "[time]"}
- {id: slow_phase_rc_time, name: "RC time of the slow phase of the left main pressure decay after clamping (R_v C_im)", dimension: "[time]"}
- {id: intramyocardial_discharge_time_constant, name: "time constant of discharge of the intramyocardial capacitance through R_a and R_v in parallel", dimension: "[time]"}
- {id: arterial_phasic_resistance, name: "coronary resistance to the phasic arterial flow component, R_a", dimension: "[pressure]*[time]/[length]**3"}
- {id: venous_resistance, name: "venous-side coronary resistance, R_v", dimension: "[pressure]*[time]/[length]**3"}
- {id: coronary_resistance_mean_flow, name: "coronary resistance to mean flow, R_c = (P_lc - P_w)/mean CBF = R_a + R_v", dimension: "[pressure]*[time]/[length]**3"}
- {id: ra_rc_regression_slope, name: "slope of the regression of R_a on R_c (Fig. 6)", dimension: "dimensionless"}
- {id: ra_rc_regression_intercept, name: "intercept of the regression of R_a on R_c (Fig. 6)", dimension: "[pressure]*[time]/[length]**3"}
- {id: ra_rc_correlation, name: "correlation coefficient of the regression of R_a on R_c", dimension: "dimensionless"}
- {id: arterial_resistance_fraction, name: "R_a as a fraction of the total coronary resistance to mean flow, R_a / R_c", dimension: "dimensionless"}
- {id: eq2_fit_correlation, name: "correlation coefficient of the fit of Eq. 2 to the p_lc vs q_c points at one P_lc (Fig. 5)", dimension: "dimensionless"}
- {id: epicardial_capacitance, name: "capacitance of the epicardial coronary arteries, C_ep", dimension: "[length]**3/[pressure]"}
- {id: intramyocardial_capacitance, name: "intramyocardial capacitance of the whole perfused bed, C_im", dimension: "[length]**3/[pressure]"}
- {id: intramyocardial_capacitance_per_mass, name: intramyocardial (coronary blood volume-pressure) capacitance per mass of left ventricle, dimension: "[length]**3/[pressure]/[mass]"}
- {id: intramyocardial_pump_pressure, name: "p_im: systolic-diastolic difference of intramyocardial blood pressure (driving pressure of the phasic flow)", dimension: "[pressure]"}
- {id: lv_systolic_pressure, name: mean systolic left ventricular pressure, dimension: "[pressure]"}
- {id: coronary_wedge_pressure, name: "coronary wedge pressure P_w (left main pressure after a 15 s occlusion)", dimension: "[pressure]"}
- {id: mean_left_main_pressure, name: "mean left main coronary arterial pressure, P_lc (condition)", dimension: "[pressure]"}
- {id: phasic_flow_component, name: "q_c: phasic coronary flow component (end-diastolic minus minimal systolic flow)", dimension: "[length]**3/[time]"}
- {id: phasic_pressure_component, name: "p_lc: phasic left main pressure component (systolic minus end-diastolic)", dimension: "[pressure]"}
