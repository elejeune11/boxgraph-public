# Figure readings by the record's own code (figures/*.py). Every build renders the crop at the
# dpi given and runs the code on it. Fig. 5 and Fig. 6 share calibration code (_fig6_common.py)
# and Fig. 5 its marker code (_fig5_common.py).
# --- Fig. 5 (p. 5): p_lc vs q_c in one dog, one series per P_lc (legend: square 65, down-pointing
#     triangle 90, circle 125, up-pointing triangle 155 mm Hg) ---
