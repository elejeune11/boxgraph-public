- id: q_waterfall_not_runnable
  kind: unstated_model
  about: [waterfall_20_layer]
  text: >-
    The 20-layer waterfall simulation whose predictions are plotted in Fig. 6 is described only in
    outline (layer resistances, LV pressure waveform and stenosis grades not given), so it cannot be
    rerun.
- id: q_fig6_points_read
  kind: reading
  about: [ra_rc_regression, ra_rc_r, ra_rc_slope, ra_rc_intercept]
  text: >-
    (Figure reading; bears on q_figures_not_read and q_ra_63_percent.) Fig. 6 is now read by code: 25
    measured points in six symbol types (4 open triangles, 8 filled circles, 4 filled squares, 3 open
    circles, 4 open squares, 2 filled triangles), as the printed n = 25 says, with the three encircled
    symbols taken as the waterfall model's points. The regression is compared with the points of each
    dog (fit_quality); its slope, intercept and r are not refitted, because a model takes scalar
    inputs and not the plotted points as a whole. The plotted R_c run from about 30 to about 138
    mm Hg s/ml, wider than the 60-140 used in q_ra_63_percent, so R_a / R_c from the regression falls
    further below 0.63 at the low end.
  citation: {page: 6, quote: "Each dog is represented by a different type of symbol"}
