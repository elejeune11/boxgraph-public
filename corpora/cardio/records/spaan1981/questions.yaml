- id: q_wedge_14_vs_measured
  kind: unexplained_difference
  about: [wedge_pressure, resistance_split, ra_rc_regression]
  text: >-
    (Audit.) The Summary (p. 1) says R_c "was defined as (P̄_lc - 14 mm Hg)/mean coronary flow", a fixed
