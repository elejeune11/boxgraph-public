    15 s occlusion in each experiment, and p. 10 gives P_w as 14 mm Hg. Whether a single 14 mm Hg or
    per-dog wedge pressures were used for the R_c of Fig. 6 is not clear.
  citation: {page: 1, quote: "was defined as (Pic - 14 nun Hg)/mean coronary flow"}
- id: q_figures_not_read
  kind: reading
  about: [ra_rc_regression, ra_rc_slope, ra_rc_intercept, ra_rc_r, p_im_mean, potential_source_eq2]
  text: >-
    The Fig. 5 (p_lc vs q_c, four P_lc in one dog) and Fig. 6 (R_a vs R_c, 25 points, six dogs) data
