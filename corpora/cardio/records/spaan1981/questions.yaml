- id: q_capillary_fraction_rounding
  kind: unexplained_difference
  about: [cmp_capillary_fraction, capillary_fraction_printed]
  text: >-
    3500/mm^2 x pi (5 um)^2 / 4 gives 0.0687, which rounds to 0.069; the paper prints 0.068
    (truncated, or computed with slightly different inputs).
  citation: {page: 8, quote: "calculates a capillary volume fraction of 0.068"}
- id: q_sum_vs_total
  kind: overstated_claim
  about: [cmp_volume_sum_morgenstern, total_blood_volume_morgenstern]
  text: >-
    The sum of the capillary and intramural artery fractions (0.068 + 0.023 = 9.1%) is said to agree
    with a total myocardial blood volume of 10-15%, but it lies below that range and leaves out the
    veins, which the total includes.
  citation: {page: 8, quote: "arterial volume agrees with the dye dilution, mean"}
- id: q_lv_mass_fig7
  kind: unstated_input
  about: [lv_mass_fig7_added, Cim_per_mass_printed]
  text: >-
    The intramyocardial capacitance from Fig. 7 is given per 100 g LV, but the LV mass of that dog is
    not stated. C_im = 3 s / 35 mm Hg s/ml = 0.086 ml/mm Hg, so "approximately 0.07 per 100 g" needs an
    LV mass of about 122 g; with the 109 g of the Fig. 4 dog it would be 0.079 per 100 g.
- id: q_fig7_resistances_source
  kind: unstated_input
  about: [Ra_fig7, Rv_fig7]
  text: >-
    R_a = 65 and R_v = 35 mm Hg s/ml for the Fig. 7 experiment are given without saying how they were
    obtained (from a Fig. 5-type regression in that dog, or from the Fig. 6 regression).
- id: q_ra_fig7_vs_regression
  kind: unexplained_difference
  about: [cmp_ra_fig7_vs_regression, Ra_fig7, ra_rc_slope, ra_rc_intercept]
  text: >-
    With R_c = R_a + R_v = 100 mm Hg s/ml, the Fig. 6 regression gives R_a = 0.63 x 100 - 12.9 = 50.1,
    against the R_a = 65 used for Fig. 7. The Fig. 7 values are printed as approximate, so no verdict
    is drawn; the scatter of Fig. 6 (r = 0.939) may account for part of it.
- id: q_ra_63_percent
  kind: overstated_claim
  about: [ra_rc_slope, ra_rc_intercept]
  text: >-
    The Discussion says R_a is 63% of the total resistance, but the regression has an intercept of
    -12.9 mm Hg s/ml, so R_a / R_c = 0.63 - 12.9 / R_c, which is 0.47-0.54 over R_c = 60-140 mm Hg s/ml
    (the range of Fig. 6), not 0.63.
  citation: {page: 9, quote: "component,\" is 63% of the total resistance, it is"}
- id: q_ra_fraction_rc
  kind: choice
  about: [cmp_ra_fraction, rc_for_fraction_added, ra_fraction_printed]
  text: >-
    (Audit.) The 63% is checked as R_a / R_c from the paper's own regression at an added R_c = 100
    mm Hg s/ml, which gives 0.50. No R_c in the Fig. 6 range gives 0.63; the fraction only tends to
    0.63 as R_c grows without bound (alternative 1000 gives 0.62), so the paper appears to have quoted
    the slope as the fraction (see q_ra_63_percent).
  citation: {page: 9, quote: "component,\" is 63% of the total resistance, it is"}
- id: q_regression_curves_fig4
  kind: possible_error
  about: [p_im_mean, potential_source_eq2]
  text: >-
    (Audit.) p. 5 says "Regression curves, as shown in Figure 4, resulted in standard deviations in
    p_im in the order of 10%"; the regression curves of p_lc vs q_c are in Figure 5 (Fig. 4 shows
    recordings), so "Figure 4" is probably meant as Figure 5.
  citation: {page: 5, quote: "shown in Figure 4, resulted in standard deviations"}
