- id: q_no_validation_vs_kim2010
  kind: choice
  about: [potential_source_eq2, ra_rc_regression, ra_fraction_regression, resistance_split, epicardial_capacitance_rc, intramyocardial_capacitance_rc, parallel_discharge_time, waterfall_20_layer, plc_vs_qc_90_fig5, ra_vs_rc_filled_square_fig6, p_im_mean]
  text: >
    (Cross-validation with kim2010; cross-validation job 2026-11-06.) No validation is entered in either
    direction. Spaan et al. (1981) precede Kim et al. (2010) and Kim et al. do not cite them; neither
    paper says one's model explains the other's data. kim2010's only measurements are the canine LAD mean
    flows of Gould et al. against percent diameter reduction, at rest and in hyperemia (kim2010 Fig. 6,
    gould_rest_fig6, gould_hyperemia_fig6). This record's models give capillary and small-artery volume
    fractions, capacitances and time constants from RC times, R_a from R_c by the printed regression,
    p_lc from q_c (Eq. 2, inputs per curve not printed) and the 20-layer waterfall model (not runnable);
    none has a stenosis grade as input or a mean coronary flow as output, so none gives Gould's measured
    quantity. In the other direction, kim2010's runnable models are steady mean-flow relations for a human
    patient and give none of this record's measured phasic quantities (p_lc against q_c, R_a against
    R_c, p_im, the Fig. 4A area). See kim2010/q_no_validation_vs_spaan1981.
  citation: {page: 1, printed_page: "584", quote: "nary blood flow are not due to varying resistances", where: text}
- id: q_no_validation_vs_mynard2014
  kind: choice
  about: [resistance_split, potential_source_eq2, volume_variation_amplitude, epicardial_capacitance_rc, intramyocardial_capacitance_rc]
  text: >
    (Cross-validation with mynard2014; cross-validation job 2026-11-06.) No model of this record is
    validated against mynard2014's measurements; mynard2014 (2014) cites this paper, not the other way.
    mynard2014 measures, in sheep and lambs, heart rate, weights, mean aortic pressure, mean Cx flow per
    100 g (Table 1), normalized Cx flow features and phase durations (Table 2) and Cx flow waveforms
    (Figs. 7-8). The models here need inputs mynard2014 does not print for those animals: Eq. 2 and
    resistance_split need R_a or p_im (no phasic pressure-flow split is measured); the capacitance models
    need the RC times of a pressure decay after clamping; volume_variation_amplitude needs the area between
    systolic and mean CBF, which mynard2014 does not print (reading it off one Fig. 7 panel would be a new
    processing of their curve, and its output, an intramyocardial volume swing, is measured there by no
    one). None outputs a quantity mynard2014 measures. See mynard2014/q_no_validation_vs_spaan1981.
  citation: {page: 1, printed_page: "584", quote: "nary blood flow are not due to varying resistances", where: text}
