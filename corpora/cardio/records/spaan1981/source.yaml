notes: >
  The paper's printed numbers come from three places. (1) The experiments: phasic pressure vs phasic
  flow at constant mean left main pressure, fitted with the potential-source equivalent Eq. 2
  (p_lc = -q_c R_a + p_im) per curve (Fig. 5), and the regression R_a = 0.63 R_c - 12.9 over the 25
  fitted points of Fig. 6, with p_im = 53.1 +/- 7.02 mm Hg. These are recorded as data (fitted /
  measured) but are not recomputed: the fits need the plotted points of Figs. 5 and 6 as a whole,
  which a run over scalar inputs cannot take. A later figure pass read both figures by code
  (figures.md): the 35 Fig. 5 points of four P_lc, the 25 Fig. 6 points by dog, compared (fit_quality)
  with the printed regression at their R_c, and the Fig. 6 waterfall-model points as predicted data
  (questions q_fig6_points_read, q_fig7_dog_not_in_fig6, q_fig5_fits_not_rerun). (2) The Discussion's back-of-envelope
  arithmetic, which is the record's checked core: capillary volume fraction from diameter and density
  (0.068), small-artery volume fraction as one third of it (0.023), their sum against the 10-15% total
  blood volume of Morgenstern et al., the intramyocardial volume swing as half the Fig. 4A area
  (0.13 ml -> +/- 0.06 ml), and the capacitances and time constants from the Fig. 7 decay
  (R_a C_ep = 0.2 s, R_v C_im = 3 s, R_a = 65, R_v = 35 mm Hg s/ml): C_ep = 0.003 ml/mm Hg, C_im about
  0.07 ml/mm Hg per 100 g LV, and the parallel discharge time constant 2 s; the capacitances are also
  compared with the literature values the paper cites as agreeing. The LV mass of the Fig. 7 dog is not
  stated and is added (109 g, the Fig. 4 dog). (3) A consistency check the paper does not make: the
  Fig. 7 resistances (R_a = 65, R_v = 35, so R_c = 100) against the Fig. 6 regression, which gives
  R_a = 50 at R_c = 100; the Fig. 7 values are printed as approximate, so this gets no verdict and is
  recorded as a question. Eq. 2 itself is recorded as a model but not run: no printed number comes
  from it without the Fig. 5 points. The 20-layer waterfall simulation of Fig. 6 is recorded as a not runnable
  model (layer resistances and pressure waveforms not given). Left out because they feed no model:
  blood gas values (pH, PCO2, PO2, saturation), dog weights and anaesthetic doses, cannula and tubing
  dimensions, heart-rate and LV-pressure ranges of the regression data, the 0.15 s transient damping,
  the 12 s wedge-pressure settling time, the 5.6 and 4.1 um capillary diameters and the 35% and 5% wall
  volumes of other studies, and the "more than 2 ml per 100 g" and "few percent" statements, which
  print no checkable number.
