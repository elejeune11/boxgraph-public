id: parallel_discharge_time
name: discharge time constant of the intramyocardial capacitance through R_a and R_v in parallel
role: model
stated: {page: 9, printed_page: "592", quote: "these resistances may be regarded as being in par-", where: Discussion}
equation: "tau = C_im R_a R_v / (R_a + R_v)  (the capacitance discharges via the veins, R_v, and retrograde via R_a, in parallel)"
from_words: true
inputs:
  Cim: {quantity: intramyocardial_capacitance, unit: ml/mmHg}
  Ra: {quantity: arterial_phasic_resistance, unit: mmHg*s/ml}
  Rv: {quantity: venous_resistance, unit: mmHg*s/ml}
outputs:
  tau: {quantity: intramyocardial_discharge_time_constant, unit: s}
settings: {}
stochastic: false
