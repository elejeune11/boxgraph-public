id: capillary_volume_fraction
name: capillary volume fraction as capillary density times capillary cross-sectional area
role: model
stated: {page: 7, printed_page: "590", quote: "ume can be calculated as the product of capillary", where: Discussion}
equation: "capillary volume / myocardial volume = capillary density x capillary cross-sectional area (= n pi d^2 / 4)"
from_words: true
inputs:
  d: {quantity: capillary_diameter, unit: um}
  n: {quantity: capillary_density, unit: 1/mm^2}
outputs:
  phi_c: {quantity: capillary_volume_fraction, unit: dimensionless}
settings: {}
stochastic: false
