id: volume_variation_amplitude
name: amplitude of the intramyocardial blood volume variation as half the area between systolic CBF and mean CBF
role: model
stated: {page: 8, printed_page: "591", quote: "maximal variation in V,m can be calculated from the", where: Discussion}
equation: "V_im varies +/- (area outlined by systolic CBF and mean CBF) / 2 around its mean"
from_words: true
inputs:
  A: {quantity: cbf_excursion_area, unit: ml}
outputs:
  dV: {quantity: intramyocardial_volume_variation, unit: ml}
settings: {}
stochastic: false
