id: waterfall_20_layer
name: waterfall model of Downey and Kirk without diodes, wall divided into 20 layers (Fig. 6 curves)
role: model
stated: {page: 7, printed_page: "590", quote: "calculations, we divided the myocardial wall into 20", where: Discussion}
equation: >-
  20 parallel layers, resistances adjusted for equal mean flow per layer; tissue pressure falling
  linearly from LV pressure at the endocardium to zero at the outermost layer; the mean slope of the
  computed p_lc vs q_c curve taken as the a.c. resistance R_a
from_words: true
described_from: ref-downey1975
runnable: false
not_runnable_reason: >-
  The layer resistances, the LV pressure waveform, the stenosis grades and the way q_c and p_lc were
  taken from the simulated waveforms are not given; the predictions are only plotted (three lines in
  Fig. 6), and no figure could be read in this job.
inputs:
  Rc: {quantity: coronary_resistance_mean_flow, unit: mmHg*s/ml}
  Plv: {quantity: lv_systolic_pressure, unit: mmHg}
outputs:
  Ra: {quantity: arterial_phasic_resistance, unit: mmHg*s/ml}
settings: {n_layers: 20}
stochastic: false
