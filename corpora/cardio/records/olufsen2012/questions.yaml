- id: q_no_validation_vs_olufsen1999
  kind: choice
  about: [network_1d_structured_tree, stiffness_eq28, pulse_pressure_eq42, pressure_log_radius_eq31, lnl_fig5_points_large, lnl_fig5_points_small, q_fig3a_aorta, q_fig3b_pulm]
  text: >
    No validation against olufsen1999 is entered, in either direction (cross-validation job 2026-11-04).
    This paper takes the 1999 model as its point of departure (p. 20) and its tree parameters xi, gamma, eta
    from it (p. 9; cited.yaml), but it never sets a result of its own against a 1999 measurement. The
    measurements of olufsen1999 are the cardiac output of ref. 20 (co_measured), the inflow of Fig. 4, the
    measured input impedance modulus and phase of Fig. 9 (md 0, md 1; Mills et al. / Nichols and O'Rourke) and
    the aortic, subclavian-brachial and radial pressure waves of Fig. 12 (Remington and Wood). Here the only
    model that gives systemic pressures or flows is network_1d_structured_tree, which is not runnable, and no
    model gives an input impedance. The runnable models are the area-ratio relations (Eqs. 2.16-2.18), the
    pulmonary length-radius fit and its prefactor (Fig. 5, Eq. 2.19), the pulmonary wall stiffness 3/(4 epsilon)
    (Eq. 2.8), the Eq. 3.1 pressure-radius fit to this paper's own simulation and the pulmonary pulse-pressure
    regression of Syyed et al. (Eq. 4.2): none gives a quantity 1999 measured at 1999's conditions. In
    particular, Eq. 2.8 is pulmonary and constant in r0, while the 1999 Eh/r0 points of Fig. 3 are systemic
    (and estimated, not measured), and the 2012 systemic stiffness Eq. 2.5 exists only inside the non-runnable
    network; Eq. 4.2 is a pulmonary regression, while all 1999 pressures are systemic. In the other direction,
    the measurements here are the Huang et al. pulmonary length-radius points (Fig. 5) and the MRI inflows of
    Fig. 3 (model inputs); no 1999 model gives a vessel length (its tree only fixes L = lrr r) or a flow
    waveform (its 1D model is not runnable). See olufsen1999 q_no_validation_vs_olufsen2012.
  citation: {page: 20, printed_page: "299", quote: "The systemic arteries model originally developed by Olufsen (1999) has been"}
