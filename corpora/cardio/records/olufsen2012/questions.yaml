- id: q_Eh_r0_pulmonary
  kind: possible_error
  about: [Eh_r0_pulmonary, epsilon_pulmonary, stiffness_eq28]
  text: >
    Eq. 2.8 with epsilon ≈ 0.02 mmHg^-1 gives Eh/r0 = 3/(4 x 0.02) = 37.5 mmHg, but the paper states it uses 34.5 mmHg.
    Either the printed 34.5 is a misprint for 37.5, or a different epsilon (about 0.0217 mmHg^-1) was used. Which value
    entered the simulations is not stated.
  citation: {page: 7, printed_page: "286", quote: "for the pulmonary vessels, we use Eh/r0 = 34.5 mmHg"}
- id: q_gamma_definition
  kind: possible_error
  about: [gamma_base, area_ratio_eq218, area_ratio_eq216_217]
  text: >
    Eq. 2.17 prints gamma = r_d1/r_d2, but the right-hand form of Eq. 2.18, (1 + gamma)/(1 + gamma^(xi/2))^(2/xi), follows
    from Eqs. 2.16 and the left-hand form only if gamma = (r_d2/r_d1)^2 (the definition used in Olufsen 1999). With gamma = 0.41
    as printed, the two forms give different eta (about 1.17 and 1.10). Since alpha > beta (p. 13), r_d1/r_d2 would exceed 1
    if d1 is the alpha daughter, which 0.41 does not.
- id: q_eta_base
  kind: unexplained_difference
  about: [eta_base, xi_base, gamma_base]
  text: >
    With xi = 2.76 and gamma = 0.41, the right-hand form of Eq. 2.18 gives eta ≈ 1.171, not the printed 1.16; the left-hand
    form with gamma read literally from Eq. 2.17 gives ≈ 1.10. The printed triple (xi, eta, gamma) is not consistent under
    either reading at the printed precision.
