- id: q_PuA_pulse_eq42
  kind: unexplained_difference
  about: [table2_PuA_pulse_vs_mean, pulse_pressure_eq42]
  text: >
    The clinical relation Eq. 4.2 predicts pulse pressure rising with mean pulmonary pressure (about 5, 9 and 27 mmHg at
