- id: q_no_validation_vs_olufsen2004
  kind: choice
  about: [network_1d_structured_tree, stiffness_eq28, pulse_pressure_eq42, pulse_coefficients_eq42, pressure_log_radius_eq31, length_radius_loglinear_fig5, prefactor_eq219, area_ratio_eq218, area_ratio_eq216_217, lnl_fig5_points_large, lnl_fig5_points_small, q_fig3a_aorta, q_fig3b_pulm]
  text: >
