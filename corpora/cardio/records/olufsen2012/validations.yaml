# Cross-validation against schwarz2020 (cross-validation job 2026-11-06). Neither paper cites the other.
# Eqs. 2.16-2.18 give the area ratio eta (summed daughter areas over parent area) of a bifurcation obeying the radius
# power law with exponent xi; schwarz2020 measures the same ratio ("area growth") at coronary bifurcations, with the
# daughter symmetry S = dS/dL, the ratio of the smaller to the larger daughter diameter.
- id: val_eta_eq216_217_vs_schwarz_large
  model: area_ratio_eq216_217
  inputs: {xi: xi_base, gamma: schwarz2020/S_median_large}
  output: eta
  against: schwarz2020/A_median_large
  purpose: validation
  quantities: {schwarz2020/daughter_symmetry: asymmetry_ratio, schwarz2020/area_growth: area_ratio}
  conditions_ok: >
    schwarz2020's median area growth 1.02 is for mothers larger than 400 um, its median symmetry 0.59 for mothers
    larger than 500 um; the model at the median symmetry is set against the median area growth, as schwarz2020
    itself does with its Eq. 8 (cmp_eq8_gamma3_large). Mothers above 400 um in diameter (radii above 200 um) lie in
    the range of this paper's systemic structured trees, which branch from the terminal large arteries down to
    r_min = 100 um (p. 9). The coronary bed is a systemic bed.
  basis: >
    This paper builds its small-artery trees on r_p^xi = r_d1^xi + r_d2^xi with 'for both the systemic and the
    pulmonary trees, we let xi = 2.76' (p. 9), and Eqs. 2.16-2.18 give the area ratio such a bifurcation has at a
    given asymmetry. The model takes gamma = r_d1/r_d2, the ratio of daughter radii as Eq. 2.17 prints it (the
    smaller over the larger, since gamma = 0.41 < 1), which is schwarz2020's S (a ratio of diameters is the same
    ratio of radii); with it the model is the same form as schwarz2020's Eq. 8, and the same number as the
    right-hand form of Eq. 2.18 with gamma = S^2 (q_schwarz_gamma_form). xi rests on Olufsen (1999), not on
    schwarz2020's coronary nodes, so this is a test.

# Cross-validation against schwarz_data, the released human left coronary tree (validation job
# olufsen2012+schwarz_data, 2026-11-09). Neither source cites the other. What was considered and not entered is in
# q_val_schwarz_data_scope.
- id: val_eta_eq218_tree_vs_coronary_area_growth
  model: area_ratio_eq218
  inputs: {xi: xi_base, gamma: gamma_base}
  output: eta
  against: 'schwarz_data/p_A_median_large'
  purpose: validation
  quantities: {'schwarz_data/area_growth': area_ratio}
  conditions_ok: >
    This paper's systemic structured trees stand for the small arteries of man from the terminal large arteries
    down to r_min = 100 um (p. 9), with one xi and gamma, and so one eta, at every bifurcation ('constant scaling
    throughout each of the vascular beds', p. 9). The measurement is the median over the bifurcations of one human
    left coronary tree, cast in the arrested, vasodilated state, with mothers wider than 400 um (radii above
    200 um), inside that size range. Same species and the same kind of vessel (distributing systemic arteries);
    a different organ (femoral bed against the heart), and a median over many asymmetric bifurcations against a
    constant meant to hold at each. The median of the ratio is the statistic closest to such a constant. The
    tree's own asymmetry is not imposed: the model is run at the tree this paper builds, as its prediction.
  basis: >
    'As in previous studies (Olufsen 1999), for both the systemic and the pulmonary trees, we let xi = 2.76,
    eta = 1.16 and gamma = 0.41' (p. 9), with eta tied to xi and gamma by Eq. 2.18. The right-hand form of
    Eq. 2.18 is the form this paper computes with (its Fig. 8(a) is reproduced by it, q_fig8a_gamma_form), so
    area_ratio_eq218 at the printed xi and gamma is the area ratio of the bifurcations of the trees this paper
    simulates: its prediction of the area ratio of a real systemic arterial bifurcation of that size. The
    release's area growth A (daughters' summed area over the mother's) is the same ratio as eta of Eq. 2.18's
    left-hand form; schwarz2020 printed its median 1.02 for segments over 400 um ('on average the
    cross-sectional area remained stable', schwarz2020 p. 5) and schwarz_data reproduces it from the network.
    Nothing here was fitted to it: xi and gamma come from Olufsen (1999) and the literature it cites. The printed
    gamma is used, not the printed eta = 1.16, which Eq. 2.18 does not give back exactly (q_eta_base); the tree is
    built from xi and gamma. This is the same test as olufsen1999/val_eta_eq21_vs_coronary_area_growth, here for
    the 2012 paper's own statement of the tree.
