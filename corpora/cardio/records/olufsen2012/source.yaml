notes: >
  The paper's printed results come almost entirely from a full 1D large-artery simulation coupled to structured-tree
  outflow conditions (Table 2, Eq. 3.1, Figs. 6-13). That model is recorded as not runnable
  (network_1d_structured_tree): the inflows are only plotted, blood density/viscosity, tree root radii and numerical
  settings are not printed. Its printed inputs (k1-k3 of Eq. 2.5, epsilon and Eh/r0 for the pulmonary arteries,
  xi, gamma, eta, r_min, l_rr) and Table 2 are recorded. The closed-form relations that produce printed numbers are
  checked: Eh/r0 = 3/(4 epsilon) (Eq. 2.8) gives 37.5 mmHg against the printed 34.5 (possible error); the area ratio
  of Eq. 2.18 at xi = 2.76, gamma = 0.41 gives about 1.17 (right-hand form) or 1.10 (definitions with gamma = r_d1/r_d2
  as printed in Eq. 2.17) against the printed 1.16; e^2.52 = 12.4 (Eq. 2.19) and its consistency with the
  intercept and slope printed on Fig. 5; and the pulse pressure law Eq. 4.2 derived from the Syyed et al. regressions
  Eq. 4.1. Eq. 4.2 is also set against the main pulmonary artery rows of Table 2 as a validation, which the paper
  itself discusses as a mismatch. Left out: Table 1 geometry and the MRI imaging parameters (they feed only the
  non-runnable network), Eq. 3.1 and the Levy et al. log-linear law (fitted to simulated curves of Fig. 7(d)), the
  mmHg-Pa conversion, and all figure readings: the figure rendering tools were refused by this session's permissions,
  so Fig. 5 (Huang et al. points) and Fig. 8(a) (eta against xi, checkable by Eq. 2.18) are not digitized; see
  figures.md. Questions record the gamma definition clash between Eqs. 2.17 and 2.18, the apparent lost digit in the
  Fig. 5 small-radius slope, the femoral 'plateau of around 33 mmHg' against Table 2, and the xi = 2.2 cases outside
  the range stated with Eq. 2.16.
  Figure pass (2026-11-04): every figure with values is now read by calibrated code (figures.yaml, figures/,
  figures.md), and the remark above about refused figure tools no longer applies. That covers Fig. 3 (measured
  inflows), Fig. 5 (Huang et al. points and both drawn lines), Figs. 6(a), 7(a,d), 8, 9, 10, 11 and Fig. 13 rows 3-4.
  New comparisons: the Fig. 5 labels and Eq. 2.19 against the drawn lines and the points (the dashed-line slope
  0.04733 fails; the drawn slope is about 0.47); Eq. 2.18 against Fig. 8(a) (the right-hand form reproduces it, the
  left-hand form with gamma = r_d1/r_d2 does not); Eq. 3.1 against the Fig. 7(d) centre lines (the pulmonary relation
  fails); Fig. 6(a) against Fig. 3. Left out: drawings, figures with same-colour curves that cannot be told apart
  (Figs. 6(b,c), 7(b,c)), and curves drawn over one another (Figs. 6(d), 12, Fig. 13 rows 1-2).
