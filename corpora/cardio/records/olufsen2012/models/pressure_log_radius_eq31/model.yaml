id: pressure_log_radius_eq31
name: log-linear fit of mean pressure against vessel radius in a structured-tree bed (Eq. 3.1)
role: fit
stated: {page: 15, printed_page: "294", quote: "These are approximately linear, giving the following relations", where: "Eq. 3.1"}
equation: "psys = 60 log10 rsys - 110, ppulm = 14 log10 rpulm - 25  (p in mmHg, r in um)"
inputs:
  a: {quantity: pressure_log_radius_slope, unit: mmHg}
  b: {quantity: pressure_log_radius_intercept, unit: mmHg}
  log10r: {quantity: log10_vessel_radius_um, unit: dimensionless}
outputs:
  p: {quantity: mean_pressure, unit: mmHg}
settings: {}
stochastic: false
