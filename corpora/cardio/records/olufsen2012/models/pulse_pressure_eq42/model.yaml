id: pulse_pressure_eq42
name: pulmonary artery pulse pressure from mean pressure, clinical regression of Syyed et al. (Eq. 4.2)
role: model
stated: {page: 24, printed_page: "303", quote: "From this, the pulse pressure can be computed as", where: "Eq. 4.2"}
equation: "pS - pD = 0.79 pbar + 1.12"
inputs:
  pbar: {quantity: mean_pressure, unit: mmHg}
  a: {quantity: pressure_regression_slope, unit: dimensionless}
  b: {quantity: pressure_regression_intercept, unit: mmHg}
outputs:
  pulse: {quantity: pulse_pressure, unit: mmHg}
settings: {}
stochastic: false
