- id: k1_fit
  quantity: stiffness_coefficient_k1
  unit: g*s^-2*cm^-1
  printed: "6.8 x 10^6"
  basis: >
    Not stated anywhere: fitted by the reader. A least-squares fit of c0^2 = a exp(b D0/2) + k to all 121
    (D0, c0) rows of the sheet fits them to about 5e-15 relative, with b = -18.000 /cm and a/k = 7.8613 =
    6.8e6/8.65e5. With the paper's k3 kept, the uniform scaling to 900 cm/s at Cx-36 then needs exactly
    k1 = 6.8e6 and k2 = -18 /cm. Only k1/k3 and k2 are fixed by the sheet; the overall scale is absorbed by
    the scaling to the Cx target (q_eq1_constants).
  alternatives: ["2 x 10^7"]
  stands_for: k1 in Eq. 1, as the released wave speeds imply
- id: k2_fit
  quantity: stiffness_coefficient_k2
  unit: 1/cm
  printed: "-18"
  basis: Fitted by the reader to the sheet's c0 and D0 columns with r0 = D0/2, together with k1_fit (q_eq1_constants).
  alternatives: ["-22.53"]
  stands_for: k2 in Eq. 1, as the released wave speeds imply
