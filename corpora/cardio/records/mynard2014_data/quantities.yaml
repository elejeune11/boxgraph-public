- {id: segment_number, name: number of a 1D segment of the coronary network, dimension: dimensionless,
   description: "The number in the sheet's Segment ID (LM-1 ... LPD-67), as in Fig. 1 of mynard2014."}
- {id: penetrating_artery_number, name: number of a penetrating artery of the coronary network, dimension: dimensionless,
   description: "The number in the sheet's Penetrating Artery ID (P1 ... P55)."}
- {id: segment_length, name: length of a 1D arterial segment (unscaled), dimension: "[length]"}
- {id: reference_diameter, name: reference lumen diameter of a 1D arterial segment (unscaled), dimension: "[length]"}
- {id: reference_wave_speed, name: reference pulse wave speed c0 of a 1D arterial segment, dimension: "[length]/[time]"}
- {id: stiffness_coefficient_k1, name: coefficient k1 of the wave speed-radius relation (Eq. 1), dimension: "[mass]/[length]/[time]**2"}
- {id: stiffness_coefficient_k2, name: coefficient k2 (exponential decay rate with radius) of the wave speed-radius relation (Eq. 1), dimension: "1/[length]"}
- {id: stiffness_coefficient_k3, name: coefficient k3 of the wave speed-radius relation (Eq. 1), dimension: "[mass]/[length]/[time]**2"}
- {id: blood_density, name: blood density, dimension: "[mass]/[length]**3"}
