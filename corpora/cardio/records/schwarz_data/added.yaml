# Second pass (the network file). Neither the guide nor the network states the hematocrit or the plasma
# viscosity behind the stored conductances (TreeQ.settings names only 'pries1996'; its fluidviscosity
# 0.0032 belongs to the first submission, guide line 227).
- id: Hd_release_added
  quantity: discharge_hematocrit
  unit: dimensionless
  printed: "0.45"
  basis: >
    The hematocrit at which Eq. 3 (Pries et al. 1994) and Eq. 5 give the stored conductances
    TreeQ.SE.Gseg, SE.G (inlets) and IE.G of every segment, together with a plasma viscosity of
    1.0 mPa s: run_net_release reproduces them to the 6 figures recorded (cmp_net_G_*), and the
    paper's Hd = 0.4 (run_net_paper) does not. At Hd 0.45 Eq. 3's hematocrit factor is 1, so the
    relation reduces to its 0.45 form. Inferred by us; stated nowhere.
  alternatives: ["0.4"]
  stands_for: Hd in Eq. 3 as the release's solution used it
- id: mu_p_release_added
  quantity: plasma_viscosity
  unit: mPa*s
  printed: "1.0"
  basis: >
    The plasma viscosity that, with Hd 0.45, makes Eq. 3-5 give the stored conductances (see
    Hd_release_added). Whether some other plasma viscosity does so at Hd 0.4 is what the
    alternatives of mu_p_paper_added in run_net_paper try. Inferred by us; stated nowhere.
  alternatives: ["1.2", "1.12"]
  stands_for: the plasma viscosity that scales mu in Eq. 5
- id: mu_p_paper_added
  quantity: plasma_viscosity
  unit: mPa*s
  printed: "1.0"
  basis: >
    For the run on the paper's stated inputs (Hd 0.4, 90 and 20 mmHg), which leaves the plasma
    viscosity unstated (schwarz2020 q_plasma_viscosity): the value the release's conductances imply
    (mu_p_release_added). schwarz2020's own added value is 1.2 mPa s; 1.12 mPa s is a value
    within the range the single stored conductances would need at Hd 0.4 (reader's exploration).
  alternatives: ["1.2", "1.12"]
  stands_for: the plasma viscosity that scales mu in Eq. 5

# Validation job chilian1986+schwarz_data (2026-11-09): the diameter windows of chilian1986's vessel classes,
# over which network_pressure_share takes the tree's segments. chilian1986 holds no datum for them.
- id: d_lo_chilian_70_130_added
  quantity: vessel_diameter
  unit: um
  printed: "70"
  basis: >
    chilian1986 p. 5 states the class as "coronary arterioles 70-130 um in diameter" in the sentence that gives
    their 50-55% (chilian1986/res_pct_70_130_ctl); its record has the range only in that quote, so it is entered
    here. Its discussion restates the class as "75-130 um" (p. 6, chilian1986/disc_prox_75_130_ctl); Chilian 1991,
    which schwarz2020 cites (p. 11), uses 80-120 um.
  alternatives: ["75", "80"]
  stands_for: d_lo of network_pressure_share for chilian1986's 70-130 um arterioles
- id: d_hi_chilian_70_130_added
  quantity: vessel_diameter
  unit: um
  printed: "130"
  basis: As d_lo_chilian_70_130_added, the upper end of chilian1986's stated 70-130 um.
  alternatives: ["120"]
  stands_for: d_hi of network_pressure_share for chilian1986's 70-130 um arterioles
- id: d_lo_chilian_mart_added
  quantity: vessel_diameter
  unit: um
  printed: "180"
  basis: >
    chilian1986's medium arterioles (187 ± 6 um control, 192 ± 8 um papaverine, mean ± SE; Tables 4-5) are called
    "arterioles 180-220 um in diameter" in its results (p. 5; OCR "MO-220") and "175-200 um" in its discussion
    (p. 6). The results' range is taken; the papaverine class mean ± one SD (8 x sqrt(5) = 18 um) is 174-210 um.
  alternatives: ["175"]
  stands_for: d_lo of network_pressure_share for chilian1986's medium arterioles
- id: d_hi_chilian_mart_added
  quantity: vessel_diameter
  unit: um
  printed: "220"
  basis: As d_lo_chilian_mart_added, the upper end of chilian1986's "180-220 um" (p. 5).
  alternatives: ["200", "210"]
  stands_for: d_hi of network_pressure_share for chilian1986's medium arterioles
- id: d_lo_chilian_lart_added
  quantity: vessel_diameter
  unit: um
  printed: "260"
  basis: >
    chilian1986 gives no range for its large arterioles, only 325 ± 18 um (mean ± SE, n = 14) under papaverine
    (Table 5) and 300 ± 31 um (n = 6) in control (Table 4). The window is the papaverine mean ± one SD recovered from
    the SE (18 x sqrt(14) = 67 um), 258-392 um, rounded. Ours; chilian1986 states no window.
  alternatives: ["290", "300"]
  stands_for: d_lo of network_pressure_share for chilian1986's large arterioles
- id: d_hi_chilian_lart_added
  quantity: vessel_diameter
  unit: um
  printed: "390"
  basis: As d_lo_chilian_lart_added, the upper end of the papaverine class mean ± one SD.
  alternatives: ["360", "350"]
  stands_for: d_hi of network_pressure_share for chilian1986's large arterioles
