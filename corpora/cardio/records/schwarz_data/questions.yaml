  kind: choice
  about: [tree_strahler, tree_strahler_order, kassab1993/t4_D_ratio_e_lad, kassab1993/t4_D_ratio_e_lcx,
          kassab1993/t4_L411_ratio_e_lad, kassab1993/t4_L411_ratio_e_lcx, kassab1993/t4_N_ratio_e_lad,
          kassab1993/t4_N_ratio_e_lcx]
  text: >
    Validation job kassab1993+schwarz_data (2026-11-09); its entries are val_kassab_D_ratio_lad, _lcx,
    val_kassab_L_ratio_lad, _lcx, val_kassab_N_ratio_lad, _lcx in validations.yaml. Neither source cites the other for a prediction: the release
    and its guide do not name Kassab; kassab1993 is the earlier paper. Six validations set tree_strahler's Horton
    ratios of the released human left coronary tree (diameter, length, number, by elements) against kassab1993's
    Table 4 ratios for the pig LAD and LCX. Choices, stated by neither source: (1) The tree's ordering is
    tree_strahler's, with all its choices (q_strahler_choices: flow direction from the release's solution, the
    'pair' rule, element diameter as the mean of its segments, all 8 orders in the fit). (2) Element-based ratios,
    since tree_strahler counts and measures elements; kassab1993's segment-based ratios (Table 4) are not entered.
    (3) Length: kassab1993 prints two length ratios per tree; the orders 4-11 ratio is entered as the one whose
    range (from about 30 um up) the tree covers; the orders 1-3 ratio (1.14-1.19) is for vessels below the tree's
    truncation and is not entered. (4) LAD and LCX: the release is one tree holding both, so each pig tree is a
    separate test of the same statistic; the RCA ratios are not entered (no RCA in the release).
    (5) Fit range: the pig diameter and number fits run over orders 1-11, from capillary-sized arterioles to the
    main stems, while the tree's 8 orders run from about 77 um to 3.4 mm, which in the pig would be about orders
    5-11. kassab1993 prints no ratio over its orders 5-11 for diameter or number, so the ranges cannot be
    matched; if the pig's law bends at the small orders (as its length law does), part of any difference is
    range, not anatomy.
    Not entered: (a) per-order mean diameters, lengths and counts (Tables 1-3, 9), S/E (Table 5) and the
    connectivity matrix (Table 6): they are indexed by order, and the tree's order n is not the pig's order n
    (order numbering starts at the smallest vessel kept, which differs by a factor of about 8 in diameter); an
    order-to-order map (from the top, or by diameter) is a choice neither paper supports, and would decide the
    verdict. (b) The Horton intercepts a and the fit R2: a depends on the numbering, R2 is a quality of a fit,
    not a measurement of a tree. (c) The cumulative volumes and element totals (pp. 13-14): those of a pig heart
    to the capillaries, against a human tree truncated at 30 um; no model here is run on the pig's conditions.
    (d) The figure readings of Figs. 6-11: they plot the same per-order tables. In the other direction, no model
    of kassab1993 predicts a measurement of this record: its models take per-order pig means, counts or
    connectivity as inputs, and this record's measurements (Table 1 shares, densities and medians by diameter
    class, topology, symmetry and area growth at nodes, perfused volumes) are not by order
    (kassab1993/q_validation_schwarz_data).
    How the two differ, and why the comparison still means something: a pig and a human heart, a cast with
    silicone elastomer to the capillaries against a micro-CT of a cast to about 30 um; the ratios of a Horton law
    are the statistics kassab1993 offers as the description of a coronary tree, and tree_strahler computes them by
    kassab1993's own rule, so a human tree that differs from the pig's is a finding about the anatomy or about the
    rule on a tree with loops and trifurcations, not a failure of either record.
  citation: {none: "a finding of the validation job between kassab1993 and schwarz_data, not a printed statement"}
- id: q_no_validation_vs_kim2010
  kind: choice
  about: [network_solution, tree_effective_resistance, kim2010/gould_rest_fig6, kim2010/gould_hyperemia_fig6]
  text: >
    Validation job kim2010+schwarz_data (2026-11-09). No validation is entered in either direction, and
    neither source cites the other. Measurements of kim2010: only the Gould et al. canine mean flows that
    its Fig. 6 plots against percent diameter reduction of a temporary stenosis in the dog's left
    circumflex artery (kim2010 p. 13). They are drawn on a cc/s axis whose scaling to the human patient
    kim2010 does not state (kim2010/q_fig6_gould_scaling). No model of this record has a stenosis. Only
    the 0% points could be set against network_solution's inlet flows (Q_LAD, Q_LCX), and the two
    quantities would be the same only through that unstated scaling. They would also differ in species,
    artery, state (rest or contrast hyperemia in vivo, against an arrested cast solved in steady flow
    without tone at 90/20 mmHg) and heart size. A verdict would judge the scaling, not the tree.
    kim2010's other numbers (LAD, LCX and RCA mean flows, cardiac output, the Table 3 bed resistances)
    are results of its 3D model or parameters tuned to one patient, not measurements. Setting them beside
    the tree's inlet flows or effective resistance relates two models; that is the relation job's work.
    In the other direction, no kim2010 model gives a quantity this record measures: its models give
    mean coronary flows from bed resistances or a share of cardiac output, not a diameter, a length, a
    count or a branching statistic. See kim2010/q_no_validation_vs_schwarz_data.
  citation: {none: "a finding of the validation job between kim2010 and schwarz_data, not a printed statement"}
- id: q_validation_vs_mynard2014
  kind: choice
  about: [tree_effective_resistance, network_solution, P_sink_mat, mynard2014/cxq_adult,
          mynard2014/cxq_newborn, mynard2014/reff_adult_text, mynard2014/reff_newborn_text]
  text: >
    Validation job mynard2014+schwarz_data (2026-11-09). Neither source cites the other. One validation is entered,
    val_mynard_cxq_adult: the released tree's LAD + LCX inflow per 100 g of perfused tissue, solved with its inlet at
    the adult sheep's measured mean aortic pressure (80 mmHg), against the sheep's measured mean Cx flow per 100 g of
    the stained Cx territory, 71 ± 35 mL/min/100g (mynard2014 Table 1). The tree gives about 260 mL/min/100g, some 3.7
    times the sheep's mean and far outside its SD: not reproduced. The size of the gap is that of a resting flow
    against a fully dilated one (a coronary flow reserve of 3-4), which is what one expects of a cast tree solved
    without tone against beating hearts with tone intact; the tree's imputed distal conductances (q_gdist_law), which
    set most of its resistance, and the species are the other differences. The verdict is a result, not a failure.
    Choices made: (1) the distal pressure is the release's 20 mmHg (P_sink_mat), the pressure its distal conductances
    were imputed against, not mynard2014's right atrial 5 mmHg, which sits below a venous bed the tree does not have;
    with 5 mmHg the tree's flow would be higher still (the network is linear: (80 - 5)/(80 - 20) = 1.25 times).
    (2) Cx flow per Cx territory is set against the tree's total flow per total territory; both are mean arterial
    inflow per 100 g of the myocardium the vessels supply. (3) The inlet is the aortic mean, which mynard2014
    prescribes at the left main; the tree starts at the LAD and LCX.
    Considered and not entered: (a) the newborn lambs (cxq_newborn, 129 ± 38 at 78 ± 11 mmHg): an adult human tree
    says nothing about the neonatal sheep heart, whose weight-corrected flow is "almost twice that in adults"
    (mynard2014 p. 11) at a heart rate 1.9 times higher; the adult sheep is the closer comparison. (b) mynard2014's effective
    resistances 0.72 ± 0.35 and 0.34 ± 0.09 mmHg·min·100g/mL (tree_effective_resistance R_eff, about 0.23 at
    80/20 mmHg): they are not measurements; the paper calls them (pLM - pRA)/qLM without saying whether qLM is
    measured or simulated, includes the venous side and the intramyocardial compression (40-42% of it, p. 12), and
    they do not follow from Table 1's means (mynard2014/q_reff). The flow, which the resistance rests on, is tested
    instead. (c) The measured Cx flow waveforms of Figs. 7-8 (fig7*_meas, fig8*_meas): the tree is steady and has no
    waveform, and the time-mean of a reading is not a datum. (d) The other measurements of Table 1 (weights, heart
    rate, pressures) and Table 2 (waveform features): no model here gives them.
    In the other direction no mynard2014 model predicts a measurement of this record: multiscale_coronary is not
    runnable; effective_resistance needs a measured flow, and this record has none (its flows are network_solution's
    outputs); the remaining models are ratios, differences, wave speed and allometric segment-length scaling between
    two animals, none a statistic of one tree's diameters, lengths, counts or branching
    (mynard2014/q_no_validation_vs_schwarz_data).
  citation: {none: "a finding of the validation job between mynard2014 and schwarz_data, not a printed statement"}
- id: q_no_validation_vs_mynard2015
  kind: choice
  about: [network_solution, tree_effective_resistance, tree_table1, mynard2015/lad_flow_fig4_invivo,
          mynard2015/cs_flow_fig4_invivo, mynard2015/d_cs_human, mynard2015/t6_aort_mean_ref, mynard2015/t6_co_ref]
  text: >
    Validation job mynard2015+schwarz_data (2026-11-09). No validation is entered in either direction; neither source
    cites the other (relations.yaml). This record's models against mynard2015's measurements: mynard2015 measures
    nothing in the coronary arteries that the released tree's steady solution gives. (a) Its only coronary arterial
    measurement is the in vivo LAD flow waveform of Fig. 4 (lad_flow_fig4_invivo, from its ref. 35), a velocity
    waveform converted to flow "by assuming the same peak flow value as in the model" (mynard2015/q_fig4_scaled_velocity):
    its amplitude, and so its time-mean, is mynard2015's model's, not a measurement. network_solution's Q_LAD is a
    steady flow of an arrested, cast, toneless tree with no waveform, and the time-mean of a reading is not a datum.
    (b) The coronary sinus flow waveform (cs_flow_fig4_invivo) and diameter (d_cs_human, 0.81 cm) are venous; the tree
    has no veins. (c) The Table 6 reference ranges (heart rate, cardiac output, SVR, PVR, chamber volumes, EF, mean and
    pulse pressures, E/A, dP/dt) are of the whole circulation; no model here gives them. The mean aortic pressure
    (t6_aort_mean_ref, 80 to 113 mmHg) is an input of network_solution, not an output, and coronary flow is not
    measured as a share of cardiac output, so no flow fraction can be compared. (d) The other Fig. 4 waveforms are
    of non-coronary vessels. The tree's coronary flow per 100 g is set against a measurement of mynard2014 instead
    (val_mynard_cxq_adult, q_validation_vs_mynard2014). For the other direction see
    mynard2015/q_no_validation_vs_schwarz_data.
  citation: {none: "a finding of the validation job between mynard2015 and schwarz_data, not a printed statement"}
- id: q_no_validation_vs_olufsen1999
  kind: choice
  about: [network_solution, tree_structured_params, tree_effective_resistance, olufsen1999/co_measured, olufsen1999/inflow_fig4, olufsen1999/Zmod_md0_fig9b, olufsen1999/p_aortic_fig12a, olufsen1999/xi_chosen, olufsen1999/eta_chosen, olufsen1999/lrr_iberall]
  text: >
    Validation job olufsen1999+schwarz_data (2026-11-09). No model of this record is entered against a
    measurement of olufsen1999. Its measurements are all of the systemic circulation of man: the cardiac
    output and the ascending-aortic inflow of Fig. 4 (ref. 20), the brachiocephalic input impedance md 0 and
    md 1 of Fig. 9 (refs. 26-27), and the aortic, subclavian, brachial and radial pressures of Fig. 12
    (ref. 41). The models here solve or measure the left coronary arterial tree only; none gives a cardiac
    output, an aortic flow, a brachiocephalic impedance or a peripheral systemic pressure, and the coronary
    inflow (network_solution Q_LAD + Q_LCX) is a part of the cardiac output, not the same quantity. The
    structured-tree parameters tree_structured_params measures (xi, gamma, eta, l/r, p) have counterparts in
    olufsen1999 (xi_chosen 2.76, eta_chosen 1.16, gamma_printed 0.41, lrr_iberall 50 +- 10,
    dc_radius_power_printed ~3), but those are choices taken from the literature (origin reported or derived)
    or a prediction of its own model (p), not measurements, so they are not validation targets; the
    relation job set them side by side (q_olufsen_params). In the other direction olufsen1999's Eq. 21 is
    entered against this record's measured median area growth: olufsen1999/val_eta_eq21_vs_coronary_area_growth,
    and olufsen1999/q_val_schwarz_data_scope says what else was considered.
  citation: {none: "a finding of the validation job between olufsen1999 and schwarz_data, not a printed statement"}
- id: q_no_validation_vs_olufsen2012
  kind: choice
  about: [network_solution, tree_structured_params, tree_table1, olufsen2012/lnl_fig5_points_large,
          olufsen2012/lnl_fig5_points_small, olufsen2012/q_fig3a_aorta, olufsen2012/q_fig3b_pulm]
  text: >
    Validation job olufsen2012+schwarz_data (2026-11-09). No model of this record is entered against a
    measurement of olufsen2012, and neither source cites the other. olufsen2012 measures two things: the mean
    lengths and radii of human pulmonary arteries by Strahler order (Fig. 5, from Huang et al. 1996) and the
    MRI inflows to the ascending aorta and main pulmonary artery of Fig. 3 (inputs of its network model). The
    models here solve or measure the human left coronary arterial tree only. Its segment lengths by diameter
    (tree_table1) are of coronary segments between nodes, while Huang's points are pulmonary vessels averaged by
    order (elements, from casts down to about 10 um): a different organ and a different vessel definition, so
    the tree's lengths are a second measurement, not a prediction of the pulmonary ones. No model here gives an
    aortic or pulmonary inflow waveform; the tree's steady coronary inflow is a small part of the aortic flow.
    olufsen2012's other numbers (Table 2, Eq. 3.1, Figs. 6-13) are results of its own model, not measurements;
    Eq. 3.1 is set beside network_solution as a relation (rel_network_solution_approx_olufsen2012_eq31), and its
    tree parameters xi, gamma, eta, l_rr are taken from the literature (reported), not measured. In the other
    direction olufsen2012's Eq. 2.18 at its own tree values is entered against this record's measured median area
    growth (olufsen2012/val_eta_eq218_tree_vs_coronary_area_growth); olufsen2012/q_val_schwarz_data_scope says
    what else was considered.
  citation: {none: "a finding of the validation job between olufsen2012 and schwarz_data, not a printed statement"}
- id: q_no_validation_vs_spaan1981
  kind: choice
  about: [tree_lumen_volume_fraction, tree_effective_resistance, network_pressure_share, network_solution,
          spaan1981/artery_fraction_printed, spaan1981/total_blood_volume_morgenstern, spaan1981/wedge_pressure,
          spaan1981/ra_vs_rc_filled_square_fig6, spaan1981/p_im_mean, spaan1981/area_fig4a]
  text: >
    Validation job schwarz_data+spaan1981 (2026-11-09). No validation is entered in either direction; neither
    source cites the other. spaan1981's measurements are of the beating, anaesthetized dog heart in vivo: p_lc
    against q_c (Fig. 5), R_a against R_c (Fig. 6), p_im, the systolic LV pressure, the wedge pressure, the Fig. 4A
    area and one LV mass. Every one is a phasic quantity, a quantity of an intact bed with its venous side, or an
    input: the released tree's solution is steady, has no wall compliance and no intramyocardial pump, so it gives
    no p_lc, q_c, R_a, p_im or volume swing; its inlet-to-distal resistance (tree_effective_resistance) is per 100 g
    of perfused tissue and has no venous resistance, while spaan1981's R_c = R_a + R_v includes R_v and is stated
    for no perfused mass (relations.yaml); the wedge pressure would set this tree's distal pressure, which is an
    input here (P_sink_mat), not an output. The one place the records meet, the arterial lumen volume fraction
    (q_lumen_volume_vs_spaan1981, tree_lumen_volume_fraction), was considered and not entered: (1) spaan1981's
    0.023 (artery_fraction_printed, origin estimated) is not a measurement but the output of its own rule-of-thumb
    model (one third of a capillary fraction computed from a chosen diameter and density); setting the tree against
    it would judge a measured anatomy by an estimate, the wrong way round; (2) the reverse, spaan1981's model judged
    against the tree, is not possible either, since that model's inputs are capillary diameter and density, which
    the tree (truncated at about 30 um) does not have, and this record holds no datum of the lumen fraction, only
    a run; (3) spaan1981 defines its 'small arteries' by no diameter, so any window is our choice, and the tree,
    missing the arterioles below its truncation, gives only a lower bound on the same tissue's arterial volume. The
    10-15% total blood volume spaan1981 quotes from Morgenstern et al. (measured by them, dye dilution, beating
    dog) includes capillaries and veins and is a different quantity from the tree's arterial lumen fraction. The
    difference between the tree's fraction and 0.023 stays a relation-level observation (q_lumen_volume_vs_spaan1981),
    not a verdict. See spaan1981/q_no_validation_vs_schwarz_data.
  citation: {none: "a finding of the validation job between schwarz_data and spaan1981, not a printed statement"}
- id: q_no_validation_vs_sexton2025
  kind: choice
  about: [network_solution, network_pressure_share, tree_table1, tree_branching, tree_strahler,
          sexton2025/q_ratio_piv_fig5f, sexton2025/viability_fig5p, sexton2025/t_gyrus_8000_new,
          sexton2025/olufsen_material_s26, sexton2025/svv_tree]
  text: >
    Validation job schwarz_data+sexton2025 (2026-11-09). No model of this record is entered against a measurement
    of sexton2025, and sexton2025 does not cite Schwarz et al. sexton2025's measurements are build and operation
    times of its software, cell areas, live-cell counts, viabilities and radial viable-cell profiles in printed
    hydrogels, and the PIV branch flow fractions of a printed three-branch scaffold (Fig. 5F). The models here solve
    or measure the released human left coronary network only (network_solution, network_pressure_share and the
    tree_* statistics read TreeQ from the release file); none takes another geometry, so none gives the scaffold's
    flow split, and none gives a time or a cell count. network_solution and sexton2025's olufsen_material_s26 share
    the shape "pressure from a length and a pressure" but no quantity: one is a steady Poiseuille-Kirchhoff solve
    of the cast's geometry, the other a wall law relating pressure to lumen area and stiffness, which the cast does
    not measure. The statistics this record computes on the human tree (area growth, symmetry, Strahler ratios,
    pressure share) are model outputs here, not measurements, so a synthetic tree is not validated against them;
    the measured medians they rest on are schwarz2020's, against which sexton2025's svv_tree is already validated
    (sexton2025/val_A_large_schwarz, val_S_large_schwarz). In the other direction see
    sexton2025/q_validation_schwarz_data.
  citation: {none: "a finding of the validation job between schwarz_data and sexton2025, not a printed statement"}
- id: q_no_validation_vs_svv_code
  kind: choice
  about: [network_solution, network_pressure_share, tree_table1, tree_branching, tree_strahler,
          'svv_code/tree_growth', 'svv_code/tree_biventricle', 'svv_code/resistance_update']
  text: >
    Validation job schwarz_data+svv_code (2026-11-09). No model of this record is entered against svv_code: the
    code record has no measured data. Its values are the code's constants, the outputs of trees it grows, and an
    illustrative bifurcation. The models here solve or measure the released human network only (TreeQ read from
    the release file), and none takes a synthetic tree as input. network_solution and svv_code/resistance_update,
    the pair suggested by shape (lengths and pressures), are both steady Poiseuille models, but
    resistance_update's pressures are outputs at added inputs, not measurements. For the other direction, svv
    trees against this record's measurements, see svv_code/q_no_validation_vs_schwarz_data. Those measurements are
    copies of schwarz2020's printed values, and svv_code is already validated against the originals.
  citation: {none: "a finding of the validation job between schwarz_data and svv_code, not a printed statement"}
