- id: q_velocity_flow_fits
  kind: reading
  about: [cmp_v_from_Q_power, cmp_v_from_Q_loglin, cmp_v_exponent, cmp_Q_exponent, cmp_net_Q_b, cmp_net_v_b, cmp_net_v_from_Q, network_solution, schwarz2020/q_velocity_flow_laws]
  text: >
    The paper's flow and velocity laws are inconsistent with each other under Poiseuille flow
    (schwarz2020 q_velocity_flow_laws). The workbooks show why. Both printed laws are the authors'
    non-linear ('all power') fits, which the workbook reproduces. In every workbook the log-linear
    ('all') slopes of flow and velocity differ by 2 to many digits, as Poiseuille flow requires for a
    least-squares fit in log space. The non-linear fit of flow, which weights the largest flows most,
    gives a much lower exponent, whereas the non-linear velocity exponent stays close to its
    log-linear one. So the printed velocity exponent agrees with the log-linear flow slope minus 2
    (cmp_v_from_Q_loglin) and not with the printed flow exponent minus 2 (cmp_v_from_Q_power). The
    difference comes from the fitting method; the paper does not say so.
    Second pass (the network file): the rerun settles which data the laws were fitted on. A
    non-linear least-squares fit of y = a d^b in linear space over all 202,184 segments of the
    rerun (flow |Q| in ml/min, centerline velocity 8 Q/(pi d^2) in cm/s, d in m) gives the printed
    flow and velocity laws, prefactor, exponent and r2 (cmp_net_Q_*, cmp_net_v_*); so does the
    pressure law on the segments of 250-800 um (cmp_net_P_*). Both laws come from the same
    Poiseuille solution segment by segment, yet the flow exponent minus 2 is not the velocity
    exponent (cmp_net_v_from_Q): the linear-space fits weight the segments differently, so the two
    laws need not agree. The workbooks' 'all' and 'pooled' fits are not plain log-log regressions of
    the segments; they remain unexplained (q_unexplained_fits).
  citation: {file: explanation_of_data.txt, lines: "266", quote: "Fits: The black fits in Fig. 5 and the power fits reported in the text."}
