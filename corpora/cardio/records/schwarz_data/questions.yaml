  text: >
    (Cross-validation with schwarz2020, cross-validation job 2026-11-06.) No validation is added in
    either direction. This release is the data of schwarz2020 itself: the same network, the same
    solution and the same authors. The paper's data statement (p. 13) says only that the data are
    available on request, so neither source says that a model of one explains the other's
    measurements. Considered and not used: (1) element_total (nIE + nSE) against schwarz2020's
    measured 202,184 segments of Table 1. Both count the same graph, so this is bookkeeping, not a
    prediction, and it is already compared here (cmp_element_total, with n_elements_doc linked to
    schwarz2020/total_all). nSE is linked to the 100,961 terminal segments in the same way.
    (2) perfusion_sheet, network_medians and the workbook fits against schwarz2020's Fig. 5 medians
    and Fig. 6 perfusion box plots. Those are outputs of the network solution (origin predicted), not
    measurements, and the workbooks are the very tables the figures were drawn from. Setting one
    against the other would check how the plot was drawn, not test a model. The printed values that
    come from them are already compared here as reproductions. (3) territory_density. Its tissue
    density has no counterpart that schwarz2020 measures. The only measured values here
    (n_perf_paper, p_perfused_volume_total) are copies of the paper's own measurements, and no model of
    schwarz2020 outputs a territory count or a perfused volume. The branching statistics (Figs. 2-4)
    that schwarz2020's area-growth models would predict are not in this copy of the release
    (q_network_absent).
    Second pass (read job): the record now has a runnable network model (network_solution) whose
    outputs include the perfused volume and the territory count, and schwarz2020's network model
    (network_hemodynamics) is its unrunnable counterpart. The reproductions against the paper's
    printed values are entered here (cmp_net_*); whether any of them counts as a validation, or the
    two models as related, is left to the relation and validation jobs.
