  text: >
    The release states choices the paper does not. In building the graph: centerline points whose
    diameter estimate has a coefficient of variation above CVlim = 1 are left out of the element
    diameter; an element whose points all have zero diameter is given 30 um; the terminal source
    elements of the poorest 0.5% quality are removed (the paper says only 'based on quality
