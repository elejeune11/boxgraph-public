  text: >
    The paper prints the heart conductance law as G = 1.58 10^-4 d^-2.22 (p. 7) and the exponent as
    2.22 on p. 12. The released workbook settles it: its 'all power, slope' for conductance is
    positive, and the 'power fit' column it tabulates against diameter rises with diameter with the
    same positive exponent (run_wb_hum06). The minus sign on p. 7 is a misprint of the paper; the
    printed value is kept as printed (cmp_G_exponent, not reproduced) beside the p. 12 value
    (cmp_G_exponent_p12). Second pass: the rerun of the network fits the law itself, on the distal
    conductance Q / (P_down - P_cap) of every segment, and gets the printed prefactor, r2 and the
    positive exponent (cmp_net_G_a, cmp_net_G_r2, cmp_net_G_b_p12; cmp_net_G_b against -2.22), and the
    internal-segment exponent 2.18 (cmp_net_G_b_internal).
