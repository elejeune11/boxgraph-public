- id: q_strahler_choices
  kind: choice
  about: [tree_strahler, tree_strahler_order, kassab1993/horton_diameter_fit_11, kassab1993/horton_length_fit_4to11, kassab1993/horton_number_fit_11]
  text: >
    (Relation job kassab1993+schwarz_data, 2026-11-09.) tree_strahler and tree_strahler_order apply
    kassab1993's diameter-defined Strahler ordering (its Eq. 1, p. 4) and Horton fits (Eqs. 2-5) to the
    released network, so that kassab1993's order statistics of the pig trees can be set against the same
    statistics of this human tree. Neither source orders this network by Strahler; every choice below is
    ours. (1) Direction: the flow of the network solution on the stored boundary pressures (as
    run_net_release); a segment's daughters are the segments flowing out of its downstream node. The
    network's 3,202 loops are crossed one way under that flow. (2) The rule. kassab1993 says both "when two
    vessels of a given order meet, the order number of the offspring is increased by one if and only if its
    diameter is larger ... by an amount specified by a criterion" and "a vessel is of order n if and only
    if its diameter lies between these bounds". The model's default ('pair') takes the first literally: a
    segment's order is its largest daughter order m, plus one only where two daughters of order m meet and
    its diameter exceeds Eq. 1b. It converges here in 13 cycles to 8 orders (about 77 um to 3.4 mm mean
    element diameter); the diameter ranges of successive orders still overlap (order 4: 261 +- 103 um,
    order 5: 413 +- 166 um), unlike kassab1993's claim that the final orders do not. The setting
    'one_step' (raise by one wherever the diameter exceeds Eq. 1b, without the meeting condition) does not
    converge in 50 cycles, oscillates between 10 and 14 orders and gives a much smaller diameter ratio
    (1.24 at its 50th cycle); a variant that raises the order as often as the diameter exceeds the bounds
    collapses to a single order. So only 'pair' gives a usable ordering of this tree. (3) Element diameter:
    kassab1993 does not say how an element's diameter follows from its segments'; the mean of the
    segments' diameters is used. The length-weighted mean does not converge in 50 cycles, but at its 50th
    cycle the Horton ratios are close (diameter 1.72 against 1.69, length 1.90 against 1.87, number 4.72
    against 4.55). (4) Elements: a segment continues into its widest daughter of its own order; a daughter
    of a merge continues the widest parent. (5) The truncation: the network stops at about 30 um, where
    kassab1993's casts reach the capillaries (order 1 there is about 9 um). Order 1 here is the smallest
    resolved vessels, terminal segments of any diameter are order 1 before revision, and order numbers do
    not correspond between the two papers; only the ratios and the shape of the laws may be compared.
    (6) Only the left coronary tree (LAD and LCX together, one network) is in the release; kassab1993
    orders RCA, LAD and LCX apart. No run is entered in this job (runs are not among the files it may
    write); the cross-record validation job runs these models in its own entries.
  citation: {file: explanation_of_data.txt, lines: "61", quote: "The file Human Left Coronary graph.mat contains all the data that was used for this study."}
- id: q_olufsen_params
  kind: choice
  about: [tree_structured_params, tree_branching, network_solution, olufsen1999/xi_chosen, olufsen1999/eta_chosen, olufsen1999/gamma_printed, olufsen1999/lrr_iberall, olufsen1999/lrr_default, olufsen1999/dc_radius_power_printed]
  text: >
    (Relation job olufsen1999+schwarz_data, 2026-11-09.) tree_structured_params measures olufsen1999's
    structured-tree parameters on the released network. Its choices, none stated by either source:
    (1) Bifurcations are tree_branching's: nodes with one inflowing mother and two outflowing daughters
    under the flow of the release's solution inputs, all nodes kept (as the paper's printed branching
    numbers are, q_outlier_rules). olufsen1999's tree is binary; the network also has trifurcations (8%)
    and loops, which are left out of the node statistics. (2) gamma = (dS/dL)^2 and eta = (dL^2 + dS^2)/dM^2
    are olufsen1999's Eq. 20 with radii replaced by diameters (the ratios are the same); eta is schwarz2020's
    area growth A. (3) xi is solved per node from Eq. 19. Where the larger daughter is at least as wide as
    the mother (about 23-30% of the nodes, by threshold) no positive exponent fits; such nodes are counted
    as xi = +inf in the median rather than dropped, since dropping them would bias the median low (the
    median over the solvable nodes alone is 2.0 at dM >= 200 um, against 2.8 with them). The median
    is therefore a median of per-node exponents, not the exponent of a fit of Eq. 19 to all nodes.
    (4) lrr is the element length over its radius. An element runs from node to node, so every side
    branch, however small, cuts a vessel; olufsen1999's vessel runs from one bifurcation of its binary
    tree to the next, where both daughters are comparable. The tree's median l/r (about 5-10) is
    therefore not the l/r of a vessel between comparable branchings, which would be longer; no rule
    for joining elements into such vessels is stated by either source, so none is applied here.
    (5) The DC power p is the least-squares slope of ln R_root on ln r over elements with flow, where
    R_root = (P_up - P_cap)/Q is the steady resistance seen from the element's upstream end to the
    distal pressure (olufsen1999 Eq. 18's Z(0, 0) of a tree rooted there, here including the release's
    imputed distal conductances below each sink element, q_gdist_law). In a network with loops this is
    an effective resistance of the element's flow path, not that of a separate subtree. olufsen1999's p
    is from varying the root radius of trees with a fixed minimum radius (dc_root_radius_power); the
    tree's is a slope across the vessels of one tree, whose distal ends are set by the cast's 30 um
    truncation and the imputed conductances. No run is entered in this job; the validation job runs the
    model in its own entries.
  citation: {file: explanation_of_data.txt, lines: "243", quote: "daughter symmetry versus mother diameter in 3-nodes with one mother (inflow) segment"}
- id: q_rel_eq31_software_run
