    only absolute viscosity the release states, 0.0032 Ns/m2, is said to belong to the first
    submission and not to the final version. So the plasma viscosity that turns the relative
    viscosity of Eq. 3 into the conductances remains unstated here as in the paper.
    Second pass (the network file): runs now answer it. The stored conductances (TreeQ.SE.Gseg,
    TreeQ.SE.G of the inlets, TreeQ.IE.G) are Eq. 3 (the in vivo relation of Pries et al. 1994, as the
    paper prints it) in Eq. 5 with Hd 0.45 and a plasma viscosity of 1.0 mPa s: run_net_release
    reproduces the stored conductances of a 3.9 mm, a 3.1 mm, an 85 um and a 71 um segment to the 6
    figures recorded (cmp_net_G_LCX, cmp_net_G_LAD, cmp_net_G_IE1, cmp_net_G_SE1). So the 'pries1996'
    label names the 1994 relation, the absolute viscosity is the plasma viscosity 1.0 mPa s times
    Eq. 3, and the hematocrit differs from the paper's (q_hematocrit). TreeQ.settings.fluidviscosity
    still holds 0.0032, which no conductance uses.
