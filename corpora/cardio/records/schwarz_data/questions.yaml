  text: >
    Relation job olufsen2012+schwarz_data (2026-11-09). rel_network_solution_approx_olufsen2012_eq31 sets
    olufsen2012's Eq. 3.1 (p_sys = 60 log10 r - 110, the log-linear summary of its structured tree's mean
