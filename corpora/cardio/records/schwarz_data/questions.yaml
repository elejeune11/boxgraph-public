    distal pressure from 0 to 20 mmHg. Its test comes out unverifiable, but only because the relation test
    runs each model without the source folder, and network_solution, like every model here that loads the
    release (software: true), reads the file from it and stops. The mapping and regime are not the cause.
    Run directly on the release, the model gives class-median pressures above Eq. 3.1 across the whole regime,
    by more than the stated 0.2 tolerance at most points, so the relation is expected to be not verified once
    the test can run it. The difference is largest at the small radii with the 20 mmHg distal pressure (Eq. 3.1
    reaches 10 mmHg at r = 100 um, its bed's r_min). The tree's pressure also rises more steeply with log r
    between r = 100 and 400 um than 60 mmHg per decade. The relation is left as entered, so that it is tested
    when the test can run software models.
- id: q_lumen_volume_vs_spaan1981
  kind: choice
  about: [tree_lumen_volume_fraction, spaan1981/artery_fraction_printed, spaan1981/small_artery_volume_fraction]
  text: >
    Relation job schwarz_data+spaan1981 (2026-11-09). No relation joins the two records' models (see
    relations.yaml), but they meet at one statistic: spaan1981 estimates the volume of the small
    (intramural) arteries as one third of the capillary volume, 0.023 of myocardial volume (p. 8, a rule of
    thumb from Berne and Levy), and quotes 5% of wall volume for intramural arteries plus veins in the
    arrested, maximally dilated dog heart. tree_lumen_volume_fraction, added for this, gives the lumen volume
    of the released segments in a diameter window over the tree's summed Voronoi volume. Choices in it,
    stated by neither source: (1) each segment is a cylinder with its stored diameter and length; (2) the
    tissue volume is the sum of TreeQ.SE.VVoronoi, the volume network_solution's perfusion uses; (3) which
    window stands for spaan1981's 'small arteries' is not defined by spaan1981 (no diameters given), so the
    window is an input. The comparison differs in kind on each side, which the validation job must state:
    spaan1981's 0.023 is an estimate (one third of a computed capillary fraction) for the beating dog heart;
    the tree is one arrested human left coronary tree, cast filled (its filling pressure sets the stored
    diameters), truncated at about 30 um, so arterioles below that are missing and its fraction is a lower
    bound on the arterial volume of the same tissue. Run directly on the release, the whole tree's lumen is
    on the order of 1% of the perfused volume and the segments up to 400 um about a third of that, well
    below 0.023; no run is entered in this job, the validation job runs the model in its own entries.
  citation: {file: explanation_of_data.txt, lines: "163", quote: "Perfusion: Tissue perfusion, calculated as Q / (heart weight* VVoronoi / sum (all Voronoi volumes))"}
- id: q_validation_vs_chilian1986
  kind: choice
  about: [network_pressure_share,
          d_lo_chilian_70_130_added, d_hi_chilian_70_130_added, d_lo_chilian_mart_added, d_hi_chilian_mart_added,
          d_lo_chilian_lart_added, d_hi_chilian_lart_added, chilian1986/res_pct_70_130_ctl,
          chilian1986/t6_mart_pap_mean, chilian1986/t6_lart_pap_mean]
  text: >
    Validation job chilian1986+schwarz_data (2026-11-09). Neither source cites the other (schwarz2020 cites Chilian
    1991). Three validations (val_chilian_pct_70_130_ctl, val_chilian_pct_mart_pap, val_chilian_pct_lart_pap) set the released tree's pressure share by vessel size (network_pressure_share) against
    chilian1986's microvascular pressure as a percentage of aortic pressure. Choices, stated by neither paper:
    (1) The tree's statistic is the median over every segment in the window, in every layer of the wall;
    chilian1986's is the mean over a few subepicardial vessels (n = 5-14) chosen by visibility.
    (2) The windows are added: 70-130 um as chilian1986 states it; 180-220 um for the medium arterioles from its
    results text; the large arterioles' window is our mean ± one SD from Table 5 (added.yaml).
    (3) The inlet is the mean aortic pressure chilian1986 measured beside each class, the measurement's printed
    condition. The distal pressure stays at the release's 20 mmHg (P_sink_mat): chilian1986 states none for the cat,
    and the network is linear only in P_in - P_cap, so the share depends on P_cap / P_in. At the release's own
    90 mmHg inlet the share is a few points lower; at a zero distal pressure it would be lower still. Neither
    alternative brings the share near chilian1986's values, judged by a direct run of the model on the release.
    (4) The share against a 98 um control class uses Table 4's small-arteriole aortic mean as the condition of the
    "70-130 um" statement (p. 5), which Table 6 does not list.
    Not entered: (a) Table 6's control values for large and medium arterioles (96%, 77%): the tree has no tone, and
    chilian1986 measured both classes dilated, which is the matching state (entered). The 70-130 um control value is
    entered only because no dilated value exists at that size. (b) The venular values: the tree is arterial only.
    (c) The absolute pressures of Tables 4-5 (mmHg): no model here outputs pressure over a diameter window;
    network_solution's P_class is per 20 um class at one diameter, and the share is what chilian1986 reports as
    its result; the share at the measured aortic pressure carries the same information. (d) The perfusion of
    Table 3 (132 and 339 ml/min/100 g): the tree's perfusion (network_solution perf_median) is per perfusion
    territory of a human heart at 90/20 mmHg with imputed distal conductances and no venous side, while
    chilian1986's is microsphere flow in cat subepicardium at 66-78 mmHg; the tree has no input that sets the
    resistance of the cat's vasculature, so the model would not be run on the measurement's conditions.
    (e) Fig. 3's diameters and the 15% diameter changes on exposure to air: no model here predicts a diameter
    change. (f) The resistance shares (25%, 45-50%, 10%) are chilian1986's arithmetic on the same shares, so they
    add no measurement beyond the three entered.
    How the two differ, and why the comparison still means something: a dog or cat coronary bed and this human
    tree have the same branching physics, and the share upstream of a vessel size is the question both papers ask
    (schwarz2020 p. 11 compares its ~32% at 100 um with Chilian 1991). A tree where the large epicardial arteries
    and long intramural runs of a human heart already spend most of the pressure, against a small cat heart in
    which 300 um arterioles sit near the aortic pressure, is a difference of anatomy and size that this result
    makes visible, not a failure of either record.
  citation: {none: "a finding of the validation job between chilian1986 and schwarz_data, not a printed statement"}
