# quantities shared with schwarz2020 keep that record's ids and meaning
- {id: vessel_diameter, name: vessel segment diameter, dimension: "[length]"}
- {id: segment_length, name: vessel segment length, dimension: "[length]"}
- {id: node_pressure, name: blood pressure at a node or in a segment, dimension: "[mass]/[length]/[time]**2"}
- {id: segment_flow, name: volumetric blood flow through a segment, dimension: "[length]**3/[time]"}
- {id: wall_shear_stress, name: wall shear stress in a segment, dimension: "[mass]/[length]/[time]**2"}
- {id: fluid_viscosity, name: dynamic viscosity of the perfusing fluid, dimension: "[mass]/[length]/[time]"}
- {id: perfusion, name: myocardial perfusion (flow per weight of perfusion territory), dimension: "[length]**3/[time]/[mass]"}
- {id: perfusion_quartile_low, name: 25th percentile of perfusion over the perfusion territories, dimension: "[length]**3/[time]/[mass]"}
- {id: perfusion_quartile_high, name: 75th percentile of perfusion over the perfusion territories, dimension: "[length]**3/[time]/[mass]"}
- {id: perfused_volume, name: myocardial volume perfused by a segment or tree, dimension: "[length]**3"}
- {id: segment_count, name: number of segments (elements) of the network or of a kind of segment, dimension: dimensionless}
- {id: node_count, name: number of nodes of the network graph of a kind, dimension: dimensionless}
- {id: perfusion_territory_count, name: number of perfusion territories (perfusion branches), dimension: dimensionless}
- {id: diameter_class_count, name: number of diameter classes a hemodynamics table is aggregated over, dimension: dimensionless}
- {id: simulation_count, name: number of simulations (or in silico trees) a result is aggregated over, dimension: dimensionless}
- {id: pixel_size, name: voxel edge length of the cryomicrotome images, dimension: "[length]"}
- {id: heart_weight, name: weight of the whole heart, dimension: "[mass]"}
- {id: territory_weight, name: weight of the myocardium perfused by the left coronary tree, dimension: "[mass]"}
- {id: tissue_density, name: myocardial tissue density implied by weight over perfused volume, dimension: "[mass]/[length]**3"}
- {id: tree_volume_fraction, name: Voronoi volume of the left coronary tree (LAD and LCX) over that of all trees including the RCA, dimension: dimensionless}
- {id: diameter_cv_limit, name: largest coefficient of variation of a centerline point's diameter estimate kept for the element diameter, dimension: dimensionless}
- {id: excluded_quality_fraction, name: fraction of terminal source elements removed as poorest in quality, dimension: dimensionless}
- {id: daughter_mother_ratio_limit, name: largest ratio of largest daughter to mother diameter kept in the branching analysis, dimension: dimensionless}
- {id: pressure_fraction, name: local pressure as a fraction of the inlet (systemic) pressure, dimension: dimensionless}
- {id: flow_ratio, name: ratio of the flow per vessel in larger vessels to that in smaller vessels, dimension: dimensionless}
- {id: wss_peak_diameter, name: diameter at which the median wall shear stress is largest, dimension: "[length]"}
- {id: conductance_fit_prefactor, name: "prefactor of the distal conductance-diameter power law (G in m^3/(Pa s), d in m)", dimension: dimensionless}
- {id: conductance_fit_exponent, name: exponent of the distal conductance-diameter power law, dimension: dimensionless}
- {id: conductance_fit_r2, name: coefficient of determination of the conductance-diameter power law fit, dimension: dimensionless}
- {id: pressure_fit_prefactor, name: "prefactor of the pressure-diameter power law (P in mmHg, d in m)", dimension: dimensionless}
- {id: pressure_fit_exponent, name: exponent of the pressure-diameter power law, dimension: dimensionless}
- {id: pressure_fit_r2, name: coefficient of determination of the pressure-diameter power law fit, dimension: dimensionless}
- {id: flow_fit_prefactor, name: "prefactor of the flow-diameter power law (Q in ml/min, d in m)", dimension: dimensionless}
- {id: flow_fit_exponent, name: exponent of the flow-diameter power law, dimension: dimensionless}
- {id: flow_fit_r2, name: coefficient of determination of the flow-diameter power law fit, dimension: dimensionless}
- {id: velocity_fit_prefactor, name: "prefactor of the centerline velocity-diameter power law (v in cm/s, d in m)", dimension: dimensionless}
- {id: velocity_fit_exponent, name: exponent of the centerline velocity-diameter power law, dimension: dimensionless}
- {id: velocity_fit_r2, name: coefficient of determination of the velocity-diameter power law fit, dimension: dimensionless}
# added in the second pass (the network file), with schwarz2020's ids
- {id: discharge_hematocrit, name: discharge hematocrit, dimension: dimensionless}
- {id: plasma_viscosity, name: viscosity of blood plasma, dimension: "[mass]/[length]/[time]"}
- {id: segment_conductance, name: hydraulic conductance of one segment, dimension: "[length]**4*[time]/[mass]"}
- {id: distal_conductance, name: total hydraulic conductance of the arterial network distal to a segment, dimension: "[length]**4*[time]/[mass]"}
- {id: centerline_velocity, name: centerline blood velocity in a segment, dimension: "[length]/[time]"}
# added in the third pass (the rest of the release); ids shared with schwarz2020 keep its meaning
- {id: segment_share, name: share of a diameter class in all segments of a column of Table 1, dimension: dimensionless}
- {id: terminal_density, name: density of terminal segments in left-ventricular myocardium, dimension: "1/[length]**3"}
- {id: terminal_density_share, name: share of a diameter class in the terminal-segment density of a myocardial region, dimension: dimensionless}
- {id: median_segment_diameter, name: median diameter of a set of segments, dimension: "[length]"}
- {id: diameter_decile_low, name: 10th percentile of the diameter of a set of segments (lower end of the interdecile range), dimension: "[length]"}
- {id: diameter_decile_high, name: 90th percentile of the diameter of a set of segments (upper end of the interdecile range), dimension: "[length]"}
- {id: median_segment_length, name: median length of a set of segments, dimension: "[length]"}
- {id: length_quartile_low, name: 25th percentile of the length of a set of segments, dimension: "[length]"}
- {id: length_quartile_high, name: 75th percentile of the length of a set of segments, dimension: "[length]"}
- {id: node_type_share, name: share of the internal nodes that connect a given number of segments, dimension: dimensionless}
- {id: loop_count, name: number of independent loops (arcades) of the network graph, dimension: dimensionless}
- {id: component_count, name: number of connected components of the network graph, dimension: dimensionless}
- {id: perfused_volume_quartile_low, name: 25th percentile of the perfused volume of the perfusion territories, dimension: "[length]**3"}
- {id: perfused_volume_quartile_high, name: 75th percentile of the perfused volume of the perfusion territories, dimension: "[length]**3"}
- {id: daughter_symmetry, name: daughter symmetry S = dS/dL at a bifurcation (a median over bifurcations where so described), dimension: dimensionless}
- {id: symmetry_quartile_low, name: 25th percentile of daughter symmetry over bifurcations, dimension: dimensionless}
- {id: symmetry_quartile_high, name: 75th percentile of daughter symmetry over bifurcations, dimension: dimensionless}
- {id: area_growth, name: area growth A at a bifurcation (daughter over mother cross-sectional area; a median where so described), dimension: dimensionless}
- {id: area_growth_fit_coefficient_d, name: coefficient of mother diameter in the linear area-growth fit, dimension: dimensionless, description: printed without a unit; the dM unit is stated per value}
- {id: area_growth_fit_coefficient_S, name: coefficient of symmetry in the linear area-growth fit, dimension: dimensionless}
- {id: area_growth_fit_intercept, name: intercept of the linear area-growth fit, dimension: dimensionless}
- {id: area_growth_fit_r2, name: coefficient of determination of the linear area-growth fit, dimension: dimensionless}
- {id: pressure_cv, name: coefficient of variation of a segment's pressure over the stochastic simulations (a statistic over segments), dimension: dimensionless}
- {id: flow_cv, name: coefficient of variation of segment flow over the stochastic simulations (a statistic over segments), dimension: dimensionless}
- {id: wss_cv, name: coefficient of variation of a segment's wall shear stress over the stochastic simulations (a statistic over segments), dimension: dimensionless}
- {id: pressure_mad, name: mean absolute deviation of a segment's pressure over the stochastic simulations (a statistic over segments), dimension: "[mass]/[length]/[time]**2"}
- {id: flow_mad, name: mean absolute deviation of a segment's flow over the stochastic simulations (a statistic over segments), dimension: "[length]**3/[time]"}
- {id: wss_mad, name: mean absolute deviation of a segment's wall shear stress over the stochastic simulations (a statistic over segments), dimension: "[mass]/[length]/[time]**2"}
- {id: agreement_pcc, name: Pearson correlation over segments between the stochastic median and a deterministic model, dimension: dimensionless}
- {id: agreement_beta, name: slope of the least-squares line of the stochastic median on a deterministic model over segments, dimension: dimensionless}
- {id: point_count, name: number of centre points of the skeleton (of a kind), dimension: dimensionless}
- {id: neighbour_slot_count, name: number of neighbour fields per centre point in the skeleton file, dimension: dimensionless}
# Kassab's (1993) diameter-defined Strahler statistics of the network (relation job kassab1993+schwarz_data, 2026-11-09)
- {id: strahler_order, name: diameter-defined Strahler order number (kassab1993 Eq. 1), dimension: dimensionless}
- {id: iteration_count, name: number of cycles an iterative ordering rule was applied, dimension: dimensionless}
- {id: convergence_flag, name: whether an iterative procedure reached a fixed point (1) or not (0), dimension: dimensionless}
- {id: element_count, name: number of elements (segments of one Strahler order in series) of an order or of the network, dimension: dimensionless}
- {id: order_mean_diameter, name: mean diameter of the elements or segments of one Strahler order, dimension: "[length]"}
- {id: order_diameter_sd, name: standard deviation of the element diameters of one Strahler order, dimension: "[length]"}
- {id: order_mean_length, name: mean length of the elements or segments of one Strahler order, dimension: "[length]"}
- {id: segments_per_element, name: segment-to-element numbers ratio S/E of one Strahler order, dimension: dimensionless}
- {id: connectivity_ratio, name: "connectivity matrix component C(n, m): elements of order n springing directly from elements of order m per element of order m", dimension: dimensionless}
- {id: horton_intercept_diameter, name: intercept a of log10 mean element diameter (um) against Strahler order, dimension: dimensionless}
- {id: horton_slope_diameter, name: slope b of log10 mean element diameter against Strahler order, dimension: dimensionless}
- {id: horton_ratio_diameter, name: diameter ratio between successive Strahler orders (10^b), dimension: dimensionless}
- {id: horton_intercept_length, name: intercept a of log10 mean element length (um) against Strahler order, dimension: dimensionless}
- {id: horton_slope_length, name: slope b of log10 mean element length against Strahler order, dimension: dimensionless}
- {id: horton_ratio_length, name: length ratio between successive Strahler orders (10^b), dimension: dimensionless}
- {id: horton_intercept_number, name: intercept a of log10 element number against Strahler order, dimension: dimensionless}
- {id: horton_slope_number, name: slope b of log10 element number against Strahler order, dimension: dimensionless}
- {id: horton_ratio_number, name: number ratio N_(n-1)/N_n between successive Strahler orders (10^-b), dimension: dimensionless}
- {id: horton_fit_r2, name: R2 of a Horton-law straight-line fit of log10 of a per-order mean on order, dimension: dimensionless}
- {id: lm_flow_per_mass, name: "mean coronary inflow (LAD + LCX inlets) per 100 g of perfused tissue (mynard2014's id)", dimension: "[length]**3/[time]/[mass]"}
- {id: effective_coronary_resistance, name: "weight-corrected effective resistance of the left coronary bed, (inlet - distal pressure) / inflow per 100 g (mynard2014's id)", dimension: "[mass]**2/[length]**4/[time]"}
# ModelAtlas job olufsen1999+schwarz_data (2026-11-09): olufsen1999's structured-tree parameters, measured on the
# network by tree_structured_params (olufsen1999's ids, so that the two can be set side by side).
- {id: radius_exponent, name: "radius exponent xi of the bifurcation law dM^xi = dL^xi + dS^xi (olufsen1999 Eq. 19; olufsen1999's id); here a median over bifurcations", dimension: dimensionless}
- {id: asymmetry_ratio, name: "asymmetry ratio gamma = (dS/dL)^2 of a bifurcation, the square of the daughter symmetry S (olufsen1999 Eq. 20; olufsen1999's id); here a median", dimension: dimensionless}
- {id: length_to_radius_ratio, name: "length-to-radius ratio l/(d/2) of a network element (olufsen1999's lambda; olufsen1999's id); here a median or quartile", dimension: dimensionless}
- {id: dc_impedance_radius_power, name: "power p of the root radius in the steady (DC) resistance downstream of a vessel, R ~ r^-p (olufsen1999's id)", dimension: dimensionless}
- {id: bifurcation_share, name: "share of the one-mother two-daughter nodes of a kind (e.g. with the larger daughter at least as wide as the mother)", dimension: dimensionless}
# ModelAtlas job schwarz_data+spaan1981 (2026-11-09): arterial lumen volume of the network (tree_lumen_volume_fraction).
- {id: small_artery_volume_fraction, name: "arterial lumen volume as a fraction of the myocardial (tissue) volume it lies in (spaan1981's id); here the lumen of the network's segments in a diameter window over the summed Voronoi volume", dimension: dimensionless}
- {id: arterial_lumen_volume, name: summed lumen volume of arterial segments, dimension: "[length]**3"}
- {id: lumen_volume_share, name: share of the network's whole lumen volume held by the segments in a diameter window, dimension: dimensionless}
