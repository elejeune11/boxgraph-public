# the authors' fits as the three released workbooks hold them
- {id: run_wb_hum06, model: hemodynamics_workbook, inputs: {}, settings: {file: hemodynamics_hum06.xlsx},
   outputs: {G_a: G_a_hum06, G_b: G_b_hum06, G_r2: G_r2_hum06, G_b_line: G_b_line_hum06,
             Q_a: Q_a_hum06, Q_b: Q_b_hum06, Q_r2: Q_r2_hum06, Q_b_loglin: Q_b_loglin_hum06,
             P_a: P_a_hum06, P_b: P_b_hum06, P_r2: P_r2_hum06,
             v_a: v_a_hum06, v_b: v_b_hum06, v_r2: v_r2_hum06, v_b_loglin: v_b_loglin_hum06,
             n_classes_G: n_classes_G_hum06, n_classes_Q: n_classes_Q_hum06},
   note: "the reconstructed heart with extrapolated microcirculation (Fig. 5, brown)"}
- {id: run_wb_hum6p, model: hemodynamics_workbook, inputs: {}, settings: {file: hemodynamics_in-silicoHum6P.xlsx},
   outputs: {G_a: G_a_hum6p, G_b: G_b_hum6p, G_r2: G_r2_hum6p, G_b_line: G_b_line_hum6p,
             Q_a: Q_a_hum6p, Q_b: Q_b_hum6p, Q_r2: Q_r2_hum6p, Q_b_loglin: Q_b_loglin_hum6p,
             P_a: P_a_hum6p, P_b: P_b_hum6p, P_r2: P_r2_hum6p,
             v_a: v_a_hum6p, v_b: v_b_hum6p, v_r2: v_r2_hum6p, v_b_loglin: v_b_loglin_hum6p,
             n_classes_G: n_classes_G_hum6p, n_classes_Q: n_classes_Q_hum6p},
   note: "the in silico trees of the second (final) iteration (Fig. 5, blue)"}
- {id: run_wb_highp, model: hemodynamics_workbook, inputs: {}, settings: {file: hemodynamics_in-silicoHighP.xlsx},
   outputs: {G_a: G_a_highp, G_b: G_b_highp, G_r2: G_r2_highp, G_b_line: G_b_line_highp,
             Q_a: Q_a_highp, Q_b: Q_b_highp, Q_r2: Q_r2_highp, Q_b_loglin: Q_b_loglin_highp,
             P_a: P_a_highp, P_b: P_b_highp, P_r2: P_r2_highp,
             v_a: v_a_highp, v_b: v_b_highp, v_r2: v_r2_highp, v_b_loglin: v_b_loglin_highp,
             n_classes_G: n_classes_G_highp, n_classes_Q: n_classes_Q_highp},
   note: "the in silico trees of the first iteration (topological branching), not used for the paper's results"}

# the velocity exponent the flow fits imply under Poiseuille flow
- {id: run_v_from_Q_power, model: velocity_exponent_from_flow, inputs: {gamma: Q_b_hum06}, outputs: {b_v: v_b_from_Q_power}}
- {id: run_v_from_Q_loglin, model: velocity_exponent_from_flow, inputs: {gamma: Q_b_loglin_hum06}, outputs: {b_v: v_b_from_Q_loglin}}

# the released per-territory perfusion
- {id: run_perfusion, model: perfusion_sheet, inputs: {},
   outputs: {n: n_perf_released, median: perfusion_median_released, p25: perfusion_p25_released, p75: perfusion_p75_released}}
- {id: run_perfusion_matlab, model: perfusion_sheet, inputs: {}, settings: {percentile_method: matlab},
   outputs: {n: n_perf_released_m, median: perfusion_median_released_m, p25: perfusion_p25_released_m, p75: perfusion_p75_released_m},
   note: "quartiles as Matlab's prctile takes them"}

# class medians of the network solution at the paper's diameters (smoothed and pooled medians)
- {id: run_medians_smoothed, model: network_medians, inputs: {d: p_d_100um, d_cut: p_d_wss_cut}, settings: {column: E},
   outputs: {P: P_100um_smoothed, Q: Q_100um_smoothed, d_class: d_class_smoothed, wss_below: wss_below300_smoothed, d_wss_peak: d_wss_peak_smoothed}}
- {id: run_medians_pooled, model: network_medians, inputs: {d: p_d_100um, d_cut: p_d_wss_cut}, settings: {column: B},
   outputs: {P: P_100um_pooled, Q: Q_100um_pooled, d_class: d_class_pooled, wss_below: wss_below300_pooled, d_wss_peak: d_wss_peak_pooled}}
- {id: run_P_fraction_100um, model: pressure_fraction, inputs: {P: P_100um_smoothed, P_in: P_inlet_doc}, outputs: {f: P_fraction_100um_released},
   note: "relative to the inlet pressure the network solution used (11970 Pa)"}
- {id: run_flow_ratio, model: flow_ratio, inputs: {Q_1: p_Q_large_median, Q_2: Q_100um_smoothed}, outputs: {ratio: flow_ratio_released},
   note: "the paper's median of > 1 mm arteries over the released median of the class nearest 100 um"}

# counts and weights stated in the release
- {id: run_element_total, model: element_total, inputs: {n_IE: n_IE, n_SE: n_SE}, outputs: {n: n_elements_sum}}
- {id: run_territory_density, model: territory_density, inputs: {W: heart_weight_doc, f: Vtree_of_Vtot, V: p_perfused_volume_total},
   outputs: {W_tree: W_tree_left, rho: rho_implied}}

# ---- second pass: the pressure and flow solution rerun on the released network
# (a) with the boundary pressures stored in the network and the hematocrit and plasma viscosity its
#     conductances imply: does the rerun give the stored solution, the workbooks and the paper's numbers?
- id: run_net_release
  model: network_solution
  inputs: {P_in: P_inlet_mat, P_cap: P_sink_mat, Hd: Hd_release_added, mu_p: mu_p_release_added,
           d: p_d_100um, d_fit_lo: p_P_fit_lo, d_fit_hi: p_P_fit_hi, d_large: p_d_large, d_cut: p_d_wss_cut,
           W: heart_weight_doc, f_tree: Vtree_of_Vtot}
  outputs: {d_class: net_d_100um, n_class: net_n_100um, P_class: net_P_100um, Q_class: net_Q_100um,
            G_class: net_G_100um, wss_class: net_wss_100um, v_class: net_v_100um,
            G_a: net_G_a, G_b: net_G_b, G_r2: net_G_r2, G_b_internal: net_G_b_internal,
            Q_a: net_Q_a, Q_b: net_Q_b, Q_r2: net_Q_r2, P_a: net_P_a, P_b: net_P_b, P_r2: net_P_r2,
            v_a: net_v_a, v_b: net_v_b, v_r2: net_v_r2, Gdist_a: net_Gdist_a, Gdist_b: net_Gdist_b,
            Q_total: net_Q_total, Q_LCX: net_Q_LCX, Q_LAD: net_Q_LAD, G_LCX: net_G_LCX, G_LAD: net_G_LAD,
            G_SE1: net_G_SE1, G_IE1: net_G_IE1, P_IN1: net_P_IN1, wss_IE1: net_wss_IE1,
            Q_large_median: net_Q_large, wss_small_median: net_wss_small, d_wss_peak: net_d_wss_peak,
            perf_median: net_perf_median, perf_p25: net_perf_p25, perf_p75: net_perf_p75, n_perf: net_n_perf,
            V_perfused: net_V_perfused, V_territory_median: net_V_territory_median}
  note: "boundary pressures as TreeQ.SE.sourceP holds them; Hd 0.45 and plasma viscosity 1.0 mPa s as the stored conductances imply; class statistics for the class containing 100 um (90-110 um)"
# (b) on the paper's stated inputs: 90 and 20 mmHg, Hd 0.4 (p. 4); the plasma viscosity is unstated
- id: run_net_paper
  model: network_solution
  inputs: {P_in: P_inlet_doc_mmHg, P_cap: P_capillary_doc_mmHg, Hd: p_Hd, mu_p: mu_p_paper_added,
           d: p_d_100um, d_fit_lo: p_P_fit_lo, d_fit_hi: p_P_fit_hi, d_large: p_d_large, d_cut: p_d_wss_cut,
           W: heart_weight_doc, f_tree: Vtree_of_Vtot}
  outputs: {d_class: netp_d_100um, n_class: netp_n_100um, P_class: netp_P_100um, Q_class: netp_Q_100um,
            G_class: netp_G_100um, wss_class: netp_wss_100um, v_class: netp_v_100um,
            G_a: netp_G_a, G_b: netp_G_b, G_r2: netp_G_r2, G_b_internal: netp_G_b_internal,
            Q_a: netp_Q_a, Q_b: netp_Q_b, Q_r2: netp_Q_r2, P_a: netp_P_a, P_b: netp_P_b, P_r2: netp_P_r2,
            v_a: netp_v_a, v_b: netp_v_b, v_r2: netp_v_r2, Gdist_a: netp_Gdist_a, Gdist_b: netp_Gdist_b,
            Q_total: netp_Q_total, Q_LCX: netp_Q_LCX, Q_LAD: netp_Q_LAD, G_LCX: netp_G_LCX, G_LAD: netp_G_LAD,
            G_SE1: netp_G_SE1, G_IE1: netp_G_IE1, P_IN1: netp_P_IN1, wss_IE1: netp_wss_IE1,
            Q_large_median: netp_Q_large, wss_small_median: netp_wss_small, d_wss_peak: netp_d_wss_peak,
            perf_median: netp_perf_median, perf_p25: netp_perf_p25, perf_p75: netp_perf_p75, n_perf: netp_n_perf,
            V_perfused: netp_V_perfused, V_territory_median: netp_V_territory_median}
  note: "the paper's Hd 0.4 and 90/20 mmHg (taken at 133.322 Pa/mmHg); the release's distal conductances TreeQ.SE.Gdist kept as they are"
# (c) the class medians of the release run at the workbook's classes
- id: run_net_release_classes
  model: network_solution
  inputs: {P_in: P_inlet_mat, P_cap: P_sink_mat, Hd: Hd_release_added, mu_p: mu_p_release_added,
           d_fit_lo: p_P_fit_lo, d_fit_hi: p_P_fit_hi, d_large: p_d_large, d_cut: p_d_wss_cut,
           W: heart_weight_doc, f_tree: Vtree_of_Vtot}
  sweep: {d: wb_P_classes}
  outputs: {d_class: net_d_classes, P_class: net_P_classes, Q_class: net_Q_classes, G_class: net_G_classes,
            wss_class: net_wss_classes, v_class: net_v_classes}
  note: "d takes each class diameter of hemodynamics_hum06.xlsx column A (classes 1-11)"
# derived from the release run
- {id: run_net_P_fraction_100um, model: pressure_fraction, inputs: {P: net_P_100um, P_in: P_inlet_mat}, outputs: {f: net_P_fraction_100um},
   note: "median mid-segment pressure of the 90-110 um class over the stored inlet pressure"}
- {id: run_net_flow_ratio, model: flow_ratio, inputs: {Q_1: net_Q_large, Q_2: net_Q_100um}, outputs: {ratio: net_flow_ratio},
   note: "median flow of segments > 1 mm over that of the 90-110 um class, both from the rerun"}
- {id: run_net_v_from_Q, model: velocity_exponent_from_flow, inputs: {gamma: net_Q_b}, outputs: {b_v: net_v_b_from_Q},
   note: "the velocity exponent the rerun's own non-linear flow exponent implies under Poiseuille flow"}

# ==== third pass: the rest of the release
# ---- Table 1 from the network (per class: sweep over the classes of the printed table)
- id: run_t1_classes
  model: tree_table1
  inputs: {}
  sweep: {d: p_T1_all}
  outputs: {n_all: net_T1_all, n_internal: net_T1_internal, n_terminal: net_T1_terminal,
            share_all: net_T1_share_all, share_terminal: net_T1_share_terminal,
            dens_epi: net_T1_dens_epi, dens_mid: net_T1_dens_mid, dens_endo: net_T1_dens_endo,
            dshare_epi: net_T1_dshare_epi, dshare_mid: net_T1_dshare_mid, dshare_endo: net_T1_dshare_endo,
            L_median: net_L_classes, L_q1: net_L_q1_classes, L_q3: net_L_q3_classes}
  note: "d takes each class lower bound of Table 1 (30 ... 400 um)"
- id: run_t1_summary
  model: tree_summary
  inputs: {}
  outputs: {n_all: net_T1_total_all, n_term: net_T1_total_terminal, n_regions: net_n_regions,
            n_in: net_n_in, n_sn: net_n_sn,
            dens_epi: net_T1_dens_total_epi, dens_mid: net_T1_dens_total_mid, dens_endo: net_T1_dens_total_endo,
            d_med_all: net_T1_dmed_all, d_p10_all: net_T1_dp10_all, d_p90_all: net_T1_dp90_all, l_med_all: net_T1_lmed_all,
            d_med_term: net_T1_dmed_term, d_p10_term: net_T1_dp10_term, d_p90_term: net_T1_dp90_term, l_med_term: net_T1_lmed_term,
            d_med_epi: net_T1_dmed_epi, d_p10_epi: net_T1_dp10_epi, d_p90_epi: net_T1_dp90_epi, l_med_epi: net_T1_lmed_epi,
            d_med_mid: net_T1_dmed_mid, d_p10_mid: net_T1_dp10_mid, d_p90_mid: net_T1_dp90_mid, l_med_mid: net_T1_lmed_mid,
            d_med_endo: net_T1_dmed_endo, d_p10_endo: net_T1_dp10_endo, d_p90_endo: net_T1_dp90_endo, l_med_endo: net_T1_lmed_endo,
            pct_3: net_pct_3, pct_4: net_pct_4, pct_more: net_pct_more, n_loops: net_n_loops, n_components: net_n_components,
            V_territory_q1: net_V_territory_q1, V_territory_median: net_V_territory_median_mm3, V_territory_q3: net_V_territory_q3}

# ---- branching from the network, mothers by the flow of our own solution (as run_net_release)
- id: run_branch_classes
  model: tree_branching
  inputs: {P_in: P_inlet_mat, P_cap: P_sink_mat, Hd: Hd_release_added, mu_p: mu_p_release_added,
           d_S_large: p_d_S_large, d_A_large: p_d_A_large, d_fit_lo: p_A_fit_lo, d_fit_hi: p_A_fit_hi}
  sweep: {d: p_f4_n_symhi}
  outputs: {n_nodes_class: net_n_mothers_classes, S_median: net_S_classes, S_q1: net_S_q1_classes, S_q3: net_S_q3_classes,
            n_symhi: net_n_symhi, n_symlo: net_n_symlo, A_median_symhi: net_A_symhi_classes, A_median_symlo: net_A_symlo_classes}
  note: "every one-mother two-daughter node kept (no outlier rule)"
- id: run_branch
  model: tree_branching
  inputs: {P_in: P_inlet_mat, P_cap: P_sink_mat, Hd: Hd_release_added, mu_p: mu_p_release_added, d: p_A_fit_lo,
           d_S_large: p_d_S_large, d_A_large: p_d_A_large, d_fit_lo: p_A_fit_lo, d_fit_hi: p_A_fit_hi}
  outputs: {n_nodes: net_n_nodes_1m2d, n_multi_mother: net_n_multi_mother, S_median_large: net_S_large, A_median_large: net_A_large,
            c_d: net_A_fit_c_d, c_d_mm: net_A_fit_c_d_mm, c_S: net_A_fit_c_S, c_0: net_A_fit_c_0, fit_r2: net_A_fit_r2, n_fit: net_A_fit_n}
  note: "every one-mother two-daughter node kept; the class outputs (d = 75 um) are not used"
- id: run_branch_rules
  model: tree_branching
  inputs: {P_in: P_inlet_mat, P_cap: P_sink_mat, Hd: Hd_release_added, mu_p: mu_p_release_added, d: p_A_fit_lo,
           d_S_large: p_d_S_large, d_A_large: p_d_A_large, d_fit_lo: p_A_fit_lo, d_fit_hi: p_A_fit_hi}
  settings: {ratio_limit: 1.15, require_l_gt_d: true}
  outputs: {n_nodes: netr_n_nodes_1m2d, S_median_large: netr_S_large, A_median_large: netr_A_large,
            c_d: netr_A_fit_c_d, c_d_mm: netr_A_fit_c_d_mm, c_S: netr_A_fit_c_S, c_0: netr_A_fit_c_0, fit_r2: netr_A_fit_r2, n_fit: netr_A_fit_n}
  note: "the guide's outlier rules (line 235): larger daughter at most 1.15 times the mother, every element longer than its diameter"

# ---- the workbooks, recomputed
- id: run_bifwb_classes
  model: bifurcation_workbook
  inputs: {d_S_large: p_d_S_large}
  sweep: {d: p_T1_all}
  outputs: {n_segments: wbb_n_segments, n_mothers: wbb_n_mothers, n_length: wbb_n_length, L_median: wbb_L_classes,
            n_sym: wbb_n_sym, S_median: wbb_S_classes, n_area_hi: wbb_n_area_hi, n_area_lo: wbb_n_area_lo,
            A_median_hi: wbb_A_hi_classes, A_median_lo: wbb_A_lo_classes}
- id: run_bifwb
  model: bifurcation_workbook
  inputs: {d_S_large: p_d_S_large, d: p_A_fit_lo}
  outputs: {pct_3: wbb_pct_3, pct_4: wbb_pct_4, pct_more: wbb_pct_more, n_internal_nodes: wbb_n_internal_nodes,
            n_length_all: wbb_n_length_all, L_median_all: wbb_L_median_all, n_pairs: wbb_n_pairs,
            S_median_large: wbb_S_large, A_median_top_class: wbb_A_top_class}
- id: run_termwb_classes
  model: termseg_workbook
  inputs: {}
  sweep: {d: p_T1_all}
  outputs: {n_all: wbt_T1_all, n_terminal: wbt_T1_terminal, share_all: wbt_T1_share_all, share_terminal: wbt_T1_share_terminal,
            dens_epi: wbt_T1_dens_epi, dens_mid: wbt_T1_dens_mid, dens_endo: wbt_T1_dens_endo,
            dshare_epi: wbt_T1_dshare_epi, dshare_mid: wbt_T1_dshare_mid, dshare_endo: wbt_T1_dshare_endo}
- id: run_termwb
  model: termseg_workbook
  inputs: {d: p_A_fit_lo}
  outputs: {n_all_total: wbt_total_all, n_internal_total: wbt_total_internal, n_terminal_total: wbt_total_terminal,
            dens_total_epi: wbt_dens_total_epi, dens_total_mid: wbt_dens_total_mid, dens_total_endo: wbt_dens_total_endo,
            n_regions: wbt_n_regions, n_regions_stated: wbt_n_regions_stated,
            d_med_epi: wbt_dmed_epi, d_p10_epi: wbt_dp10_epi, d_p90_epi: wbt_dp90_epi, l_med_epi: wbt_lmed_epi,
            d_med_mid: wbt_dmed_mid, d_p10_mid: wbt_dp10_mid, d_p90_mid: wbt_dp90_mid, l_med_mid: wbt_lmed_mid,
            d_med_endo: wbt_dmed_endo, d_p10_endo: wbt_dp10_endo, d_p90_endo: wbt_dp90_endo, l_med_endo: wbt_lmed_endo}
  note: "the class outputs (d = 75 um) are not used"
- id: run_topowb_classes
  model: topology_workbook
  inputs: {d_S_large: p_d_S_large, d_A_large: p_d_A_large, d_fit_lo: p_A_fit_lo, d_fit_hi: p_A_fit_hi}
  sweep: {d: p_T1_all}
  outputs: {n_class: wbo_T1_all}
- id: run_topowb
  model: topology_workbook
  inputs: {d: p_A_fit_lo, d_S_large: p_d_S_large, d_A_large: p_d_A_large, d_fit_lo: p_A_fit_lo, d_fit_hi: p_A_fit_hi}
  outputs: {n_rows: wbo_n_rows, n_internal: wbo_n_internal, n_source: wbo_n_source,
            d_med: wbo_dmed_all, d_p10: wbo_dp10_all, d_p90: wbo_dp90_all, l_med: wbo_lmed_all,
            n_node_rows: wbo_n_node_rows, n_nodes: wbo_n_nodes_1m2d, S_median_large: wbo_S_large, A_median_large: wbo_A_large,
            c_d: wbo_A_fit_c_d, c_S: wbo_A_fit_c_S, c_0: wbo_A_fit_c_0, fit_r2: wbo_A_fit_r2}
- id: run_table2
  model: stochastic_table2
  inputs: {}
  outputs: {P_cv_median: wbg_P_cv_med, P_cv_p95: wbg_P_cv_p95, P_mad_median: wbg_P_mad_med, P_mad_p95: wbg_P_mad_p95,
            P_pcc_fit: wbg_P_pcc_fit, P_beta_fit: wbg_P_beta_fit, P_pcc_medG: wbg_P_pcc_medG, P_beta_medG: wbg_P_beta_medG,
            Q_cv_median: wbg_Q_cv_med, Q_cv_p95: wbg_Q_cv_p95, Q_mad_median: wbg_Q_mad_med, Q_mad_p95: wbg_Q_mad_p95,
            Q_pcc_fit: wbg_Q_pcc_fit, Q_beta_fit: wbg_Q_beta_fit, Q_pcc_medG: wbg_Q_pcc_medG, Q_beta_medG: wbg_Q_beta_medG,
            WSS_cv_median: wbg_WSS_cv_med, WSS_cv_p95: wbg_WSS_cv_p95, WSS_mad_median: wbg_WSS_mad_med, WSS_mad_p95: wbg_WSS_mad_p95,
            WSS_pcc_fit: wbg_WSS_pcc_fit, WSS_beta_fit: wbg_WSS_beta_fit, WSS_pcc_medG: wbg_WSS_pcc_medG, WSS_beta_medG: wbg_WSS_beta_medG,
            n_elements_P: wbg_n_elements,
            P_IE1_medG: wbg_P_IE1_medG, P_IE1_fit: wbg_P_IE1_fit, P_SE1_medG: wbg_P_SE1_medG, P_SE1_fit: wbg_P_SE1_fit,
            Q_LCX_medG: wbg_Q_LCX_medG, Q_LCX_fit: wbg_Q_LCX_fit, Q_LAD_medG: wbg_Q_LAD_medG, Q_LAD_fit: wbg_Q_LAD_fit}
  note: "percentiles as Matlab's prctile (the sheet's own P95 values follow it)"

# ---- the skeleton against the network
- id: run_skeleton
  model: skeleton_network
  inputs: {pixel: pixel_size_doc, d0: diam_if_all_0}
  note: "CVlim = 1 (datum CVlim) is the model's setting"
  outputs: {n_points_header: skel_n_points_header, n_segments_header: skel_n_segments_header, n_points: skel_n_points,
            n_segments: skel_n_segments, n_neighbour_slots: skel_n_slots, n_node_points: skel_n_node_points,
            n_elements_in_skeleton: skel_n_elements_found, n_skeleton_segments_in_network: skel_n_segments_in_network,
            n_skeleton_segments_not_in_network: skel_n_segments_not_in_network, n_elements_same_ends: skel_n_same_ends,
            n_d_match_internal: skel_n_d_match_internal, n_d_match_terminal: skel_n_d_match_terminal, d_med_skeleton: skel_dmed}
