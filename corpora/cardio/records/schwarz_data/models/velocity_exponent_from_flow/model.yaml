id: velocity_exponent_from_flow
name: exponent of the centerline-velocity power law implied by a flow power law under Poiseuille flow
role: processing
from_words: true
stated: {none: "the paper's Poiseuille flow (schwarz2020 Eqs. 4-5, p. 4) gives each segment's centerline velocity as 8 Q/(pi d^2); this source states no velocity relation"}
equation: "Q = a d^gamma and v = 8 Q/(pi d^2) segment by segment give v proportional to d^(gamma - 2)"
inputs:
  gamma: {quantity: flow_fit_exponent, unit: dimensionless}
outputs:
