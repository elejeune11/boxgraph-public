id: flow_ratio
name: ratio of two segment flows
role: processing
from_words: true
stated: {none: "the paper's 'about 3,000-times as much blood per vessel' (schwarz2020 p. 7) is a ratio of the median flow of arteries larger than 1 mm to that of 100 um segments; this source states no ratio"}
equation: "ratio = Q_1 / Q_2"
inputs:
  Q_1: {quantity: segment_flow, unit: ml/min}
  Q_2: {quantity: segment_flow, unit: ml/min}
outputs:
  ratio: {quantity: flow_ratio, unit: dimensionless}
settings: {}
stochastic: false
