id: pressure_fraction
name: local pressure as a percentage of the inlet pressure
role: processing
from_words: true
stated: {file: explanation_of_data.txt, lines: "120", quote: "Assumptions here are input pressure 11970 N/m2 (90 mmHg)"}
equation: "f = 100 P / P_in"
inputs:
  P: {quantity: node_pressure, unit: mmHg}
  P_in: {quantity: node_pressure, unit: mmHg}
outputs:
  f: {quantity: pressure_fraction, unit: percent}
settings: {}
stochastic: false
