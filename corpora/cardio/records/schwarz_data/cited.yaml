# Which value of schwarz2020 each copied Table 1 column is (relation job schwarz2020+schwarz_data,
# 2026-11-08). The other values this record copies from the paper with from_source and no from_datum
# (the r2 of the power laws, the perfusion quartiles, the 630 um shear-stress peak, Table 2 apart from
# the flow CV, the p. 5 node shares and loops, the p. 8 volume quartiles, the thresholds 250, 300, 400,
# 500, 75 and 600 um, the guide's heart weight and counts) are not data of schwarz2020's record, so they
# stay unlinked. The Table 1 counts and LV densities are in schwarz2020's record only as the index of
# its share tables, not as data of their own, and stay unlinked too.
- datum: p_T1_share_all
  from_datum: share_all
  evidence: >
    Both are the percentages of Table 1's column 'All' (schwarz2020 p. 6), the same ten printed values
    in the same row order (30-45 um to >= 400 um). This record indexes them by the class's lower
    diameter bound, schwarz2020's record by the printed count of the same row.
- datum: p_T1_share_terminal
  from_datum: share_terminal
  evidence: >
    Both are the percentages of Table 1's column 'Terminal' (schwarz2020 p. 6), the same ten printed
    values in the same row order; indexed here by diameter class, there by the row's printed count.
- datum: p_T1_dshare_epi
  from_datum: share_subepi
  evidence: >
    Both are the density percentages of Table 1's column 'Subepicardium' (schwarz2020 p. 6), the same
    ten printed values in the same row order; indexed here by diameter class, there by the row's
    printed density.
- datum: p_T1_dshare_mid
  from_datum: share_midmyo
  evidence: >
    Both are the density percentages of Table 1's column 'Midmyocardium' (schwarz2020 p. 6), the same
    ten printed values in the same row order; indexed here by diameter class, there by the row's
    printed density.
- datum: p_T1_dshare_endo
  from_datum: share_subendo
  evidence: >
    Both are the density percentages of Table 1's column 'Subendocardium' (schwarz2020 p. 6), the same
    ten printed values in the same row order; indexed here by diameter class, there by the row's
    printed density.
