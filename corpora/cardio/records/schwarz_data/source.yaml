notes: >
  What the source is. Part of the data released with schwarz2020 (DataverseNL, doi 10.34894/XYF65X,
  CC BY 4.0, as the explanation document states; no LICENSE file). Present: the network itself,
  'Human Left Coronary graph.mat' (MATLAB 5 file, struct TreeQ with IN, SN, SE, IE, info, settings;
  added in the second pass, SHA-1 7be3d814..., downloaded from the repository and covered by the
  digest in `version`), three hemodynamics workbooks (hemodynamics_hum06.xlsx: the reconstructed
  heart's solution, per-territory perfusion, class medians and power fits for Figs. 5-6;
  hemodynamics_in-silicoHum6P.xlsx: the in silico trees of the final iteration;
  hemodynamics_in-silicoHighP.xlsx: those of the first iteration), the authors'
  DemonstrationCode.m (Matlab, about 100 lines; no entry point beyond its script sections),
  MANIFEST.TXT and the explanation of the data (cited from explanation_of_data.txt, our plain-text
  copy of the .docx). Not present: the skeleton, 'Gdistal variations.xlsx',
  'final_tree_bifurcation_summary_all-ld.xlsx', 'Topology data.xlsx' and 'termseg_density.xlsx'.
  The authors' analysis software is not released (the explanation says so). year and authors are
  the paper's; language matlab is that of the demonstration code and the .mat file. log.md lists
  what each pass added and changed.

  How it was read. Values the release states (boundary pressures, graph counts, pixel size, heart
  weight, volume fraction, graph-building settings, outlier rules, class and simulation counts) are
  data cited by file and lines, linked to the paper's datum where that record has one. Workbook
  adapters (software: true, our own xlsx reader) read the fits, perfusion values and class medians:
  hemodynamics_workbook, perfusion_sheet, network_medians. Small models of our own derive a velocity
  exponent, a pressure fraction, a flow ratio, the element total and an implied tissue density.
  DemonstrationCode.m only extracts data from the .mat file; its two parts stay recorded as models
  (demo_element_export, demo_mother_daughter), not runnable, with no port. Second pass: the network
  is read with scipy.io.loadmat and nothing of it is copied. network_solution, our own solver (not
  a port; software: true only to read the file at run time), solves the paper's model on it: Eq. 3
  in Eq. 5 per segment, sinks in series with the release's distal conductances TreeQ.SE.Gdist,
  Kirchhoff at the 98,022 internal nodes, a sparse solve, then class medians, the paper's power-law
  fits, flow, shear stress and perfusion statistics. It is run on the pressures stored in
  TreeQ.SE.sourceP with the hematocrit and plasma viscosity the stored conductances imply
  (run_net_release; added inputs) and on the paper's stated 90/20 mmHg and Hd 0.4 (run_net_paper).
  A few stored values are data, cited by field path, written to 6 figures, and the workbook's class
  medians of classes 1-11 are written to 4 figures with their cells named (q_typed_precision).

  What reproduces. The released fits reproduce every power law the paper prints (prefactor,
  exponent, r2 of the conductance, flow, pressure and velocity laws, and the in silico Gis), and the
  released perfusion values its territory count, median and interquartile range. Element counts
  add up to the paper's 202,184. Second pass: the rerun reproduces the stored solution at every
  value checked: the conductances of the two inlets, an internal and a sink segment, both inlet
  flows, a node pressure and a shear stress. So the stored solution is the Poiseuille-Kirchhoff
  solution of the paper's equations, with Hd 0.45, plasma viscosity 1.0 mPa s and 11998.8/2666.4
  N/m2. From its own segments it then reproduces the paper's printed results: all four power laws
  with their r2 (the conductance law on the distal conductance Q/(P_down - P_cap), with a positive
  exponent, and the 2.18 of the internal segments), the 36.6 ml/min median of arteries above 1 mm,
  the perfusion median and interquartile range, the 4,954 territories, the 358 cm3 perfused volume
  and the 20.2 mm3 median territory. It also gives the approximate 32%, about 3,000 times and
  around 5 Pa without a verdict. The workbook's class medians for 43.8-239.7 um agree to about 1%
  or better, but not to all 4 figures recorded (q_class_rule).

  What does not, and differences from the paper. (1) The heart conductance exponent is positive in
  the workbook and in the rerun: the printed minus sign (p. 7) is a misprint (q_G_exponent_sign).
  (2) The printed velocity and flow laws disagree under Poiseuille flow because of the linear-space
  fitting, which the rerun confirms on the same solution (q_velocity_flow_fits). (3) The
  shear-stress peak at 630 um is the smoothed workbook medians' class (close). The pooled medians,
  and the rerun's 20 um classes, peak lower (q_wss_peak). (4) The guide's N/m2 boundary pressures
  (11970, 2660) are the mmHg labels times 133. The network holds and uses 11998.8 and 2666.4
  (x 133.32), consistent with 90 and 20 mmHg; the first reading's statement that the solution used
  the guide's values was wrong and is corrected in q_pressure_conversion. (5) The stored
  conductances use Hd 0.45, not the paper's 0.4. At 0.4 they are not reproduced, and the paper's
  results only fall within the rounding of the printed '0.4' (q_hematocrit). The 'pries1996' label
  is Pries 1994's in vivo relation, and the plasma viscosity is 1.0 mPa s (q_viscosity_label). (6) A
  power law fitted to the imputed distal conductances is not the printed in silico law (q_gdist_law).
  (7) The final-iteration workbook has one more class in four sheets than the 63 stated
  (q_hum6p_classes). (8) Choices the paper does not state: CVlim 1, 30 um for diameterless elements,
  removal of the poorest 0.5% of terminal elements, the 1.15 outlier rule (q_hidden_choices), and
  the tissue density the perfusion weights imply (q_density). Table 1's two >= 400 um terminal
  segments are the inlets (q_terminal_includes_inlets). Not checked: Table 2 (its 1000 stochastic
  simulations need in silico distributions not released), Table 1's class counts and the branching
  statistics of Figs. 2-4 (computable from the network but not modelled here), the workbook classes
  above 240 um (their class rule is unstated), the workbooks' 'all' and 'pooled' fits, the in silico
  flow, pressure and velocity laws, and DemonstrationCode.m (Matlab, not run).
