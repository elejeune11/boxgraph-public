notes: >
  What the source is. The data released with schwarz2020 (DataverseNL, doi 10.34894/XYF65X). The
  repository marks it CC0; the data guide states CC BY 4.0, which is recorded as the licence. There
  is no LICENSE file. The whole release is now in the folder, except the release's copy of the
  paper's PDF, and the digest in `version` covers all of it. Each file added after the first reading
  was downloaded from the repository and checked against its SHA-1. The files are: 'Human Left
  Coronary skeleton.txt' (the raw skeleton: 3,913,549 centre points in 288,198 segments, LAD, LCX
  and RCA); 'Human Left Coronary graph.mat' (struct TreeQ, the LAD and LCX graph with the stored
  hemodynamic solution); 'Topology data.xlsx' (element diameters and lengths, and flow-based mother
  and daughter diameters, made with DemonstrationCode.m); 'final_tree_bifurcation_summary_all-ld.xlsx'
  (data points of Figs. 2-4); 'termseg_density.xlsx' (Table 1); 'Gdistal variations.xlsx' (per-element
  results of the 1000 stochastic simulations and the deterministic runs, Table 2); the three
  hemodynamics workbooks (Figs. 5-6 and the power laws); DemonstrationCode.m (Matlab, about 100 lines,
  not run); MANIFEST.TXT; and the guide 'Schwarz-2019 explanation of data.docx', cited from our
  plain-text copy explanation_of_data.txt. The authors' analysis software is not released. year and
  authors are those of the paper. log.md says what each of the three passes added and changed.

  How it was read. Values the release states are data cited by file and lines. Values held only in
  binary or spreadsheet files are cited by field path or by sheet and cell; a few of them are typed
  to 6 or 4 figures (q_typed_precision). Every model is our own code. It is marked `software: true`
  only so that it can read the files at run time, and nothing of the files is copied. Second pass:
  network_solution solves the paper's Poiseuille-Kirchhoff model (Eqs. 3-5, Pries viscosity) on the
  network. Third pass:
  - tree_table1 and tree_summary recount Table 1 and the p. 5 topology from the network.
  - tree_branching computes the Eq. 1-2 branching statistics at the bifurcations, with mothers and
    daughters set by the flow of network_solution.
  - termseg_workbook, topology_workbook and bifurcation_workbook recompute the same results from each
    workbook's data points.
  - stochastic_table2 recomputes Table 2 from the per-element sheets.
  - skeleton_network streams the 440 MB skeleton and checks it against the network.
  The paper's printed values are copied in with from_source, and from_datum where schwarz2020's
  record holds them.

  What reproduces. First and second pass: the network rerun reproduces the stored solution. With the
  stored 90/20 mmHg and Hd 0.45, it also reproduces every printed power law, the flows, the perfusion
  statistics and the volumes (see log.md and the questions). Third pass:
  - Table 1 is reproduced in every cell, from the network and from termseg_density.xlsx. That covers
    the class counts and shares of all and of terminal segments, the LV densities and their shares,
    the totals, the diameter medians and interdecile ranges, and the length medians. The
    'diameter-length' sheet of Topology data.xlsx gives the class counts and the All column too.
  - The p. 5 topology: 91% bifurcations, 8% trifurcations and 3,202 loops (the cycle rank of the
    graph).
  - The p. 8 interquartile range of territory volume (7.2-56.5 mm3).
  - The p. 9 median symmetry 0.59 (mothers > 500 um) and the p. 5 median area growth 1.02
    (> 400 um), from the network, Topology data.xlsx and the bifurcation workbook.
  - Every group size printed above Fig. 4's bars.
  - All of Table 2 that carries a verdict: the CV and MAD medians and 95th percentiles, PCC and beta
    for both deterministic models, and the text's 7.4%. These match the workbook's own 'Table 2'
    sheet as well. The two flow MADs are printed as bounds and get no verdict.
  - The stored network solution is the deterministic 'median G' run of the Table 2 workbook, not the
    'power fit' run (q_stored_solution_median_g).
  - The skeleton holds the counts the guide states. Each network element names a skeleton segment
    of its own, and the remaining 86,014 segments are the RCA, loose segments and segments removed in
    cleaning.

  What does not, and differences from the paper and the guide. Earlier passes: the heart
  conductance exponent's minus sign (p. 7) is a misprint; the hematocrit is 0.45, not the stated 0.4;
  the guide's N/m2 pressures are rounded conversions; the 'pries1996' label names Pries 1994; and the
  other points are in q_G_exponent_sign, q_hematocrit, q_pressure_conversion, q_viscosity_label,
  q_velocity_flow_fits, q_wss_peak, q_class_rule, q_hum6p_classes, q_gdist_law, q_density and
  q_hidden_choices. Third pass:
  (1) The area-growth regression A = -0.66 dM + 0.34 S + 1.13 (r2 0.047; p. 5) is not reproduced,
  with or without the guide's outlier rules and from either the network or Topology data.xlsx. The
  dM coefficient has the printed size only with dM in mm (q_area_growth_fit).
  (2) The guide says that elements shorter than their diameter and nodes with a daughter over 1.15
  times the mother were excluded. Yet the printed branching numbers and Fig. 4's group sizes follow
  from all nodes, and with the rules applied they are no longer reproduced (q_outlier_rules).
  (3) Table 1's counts depend on the release's floating-point class edges. With exact decimal edges,
  the 1,814 elements given the assumed 30 um fall out of the first class (q_class_edges).
  (4) The LV densities are per cm3 of the summed Voronoi volumes of a region's terminal elements, a
  choice stated nowhere (q_region_volume).
  (5) The guide says a skeleton point has 18 neighbour slots. The file has 15, and its header names
  14 (q_skeleton_slots).
  (6) The skeleton's raw radii give the stored element diameter only where no correction was made.
  The correction rule is not released, and the raw median is below Table 1's 92.3 um
  (q_skeleton_diameters).
  (7) Table 2's statistics are not defined in the paper. They are reproduced with pooled per-element
  medians and 95th percentiles (Matlab's percentile rule) and with beta taken as the slope of the
  stochastic median on the deterministic run (q_table2_reading).
  Not checked here:
  - The class medians behind Figs. 2B, 3A and 4. They are computed (net_L_classes, net_S_classes,
    net_A_*_classes and wbb_*_classes), but the paper gives them only as box plots, which
    schwarz2020's record reads. The comparison is left to the relation and validation jobs
    (q_figure_curves).
  - The 1000 stochastic simulations themselves. The in silico conductance distributions are not
    released.
  - DemonstrationCode.m, which is Matlab. Its output, Topology data.xlsx, agrees with the network.
