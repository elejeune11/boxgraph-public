- {id: la_pressure, name: left atrial pressure, dimension: "[pressure]", description: "instantaneous left atrial pressure, P(la)"}
- {id: aortic_sinus_pressure, name: aortic sinus pressure, dimension: "[pressure]", description: "instantaneous pressure in the systemic aortic sinus compartment, P(sas)"}
- {id: systemic_artery_pressure, name: systemic artery pressure, dimension: "[pressure]", description: "instantaneous pressure in the systemic artery compartment, P(sat)"}
- {id: systemic_vein_pressure, name: systemic vein pressure, dimension: "[pressure]", description: "instantaneous pressure in the systemic vein compartment, P(svn)"}
- {id: mitral_flow, name: mitral valve flow, dimension: "[length]**3/[time]", description: "instantaneous flow through the mitral valve, Q(mi)"}
- {id: aortic_flow, name: aortic valve flow, dimension: "[length]**3/[time]", description: "instantaneous flow through the aortic valve, Q(ao)"}
- {id: systemic_artery_flow, name: systemic artery flow, dimension: "[length]**3/[time]", description: "instantaneous flow in the systemic artery compartment, Q(sat)"}
- {id: lv_volume, name: left ventricular volume, dimension: "[length]**3", description: "instantaneous left ventricular volume, V(lv)"}
