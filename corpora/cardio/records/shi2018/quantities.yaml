- {id: peak_lv_pressure, name: peak left ventricular pressure, dimension: "[pressure]", description: "maximum left ventricular pressure over one heart cycle"}
- {id: min_lv_pressure, name: minimum left ventricular pressure, dimension: "[pressure]", description: "minimum left ventricular pressure over one heart cycle"}
- {id: peak_arterial_pressure, name: peak systemic arterial pressure, dimension: "[pressure]", description: "maximum systemic arterial pressure over one heart cycle (the paper's 'arterial pressure')"}
- {id: min_arterial_pressure, name: minimum systemic arterial pressure, dimension: "[pressure]", description: "minimum systemic arterial pressure over one heart cycle"}
- {id: mean_valve_flow, name: mean aortic and mitral valve flow, dimension: "[length]**3/[time]", description: "flow through the aortic (and mitral) valve averaged over one heart cycle (cardiac output)"}
