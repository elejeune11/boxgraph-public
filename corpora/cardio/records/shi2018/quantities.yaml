- {id: stroke_volume, name: left ventricular stroke volume, dimension: "[length]**3", description: "volume ejected by the left ventricle in one beat"}
- {id: time, name: simulated time, dimension: "[time]", description: "time in the simulation, as on the t(s) axes of Fig. 5"}
