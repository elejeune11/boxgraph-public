  citation: {page: 7, printed_page: "6", quote: "between 55 mL to 130 mL, producing a stroke volume"}
- id: q_validation_claim
  kind: overstated_claim
  about: [circulation_fig1d]
  text: >
    The abstract says the models are validated and that results agree well with published data,
    and Section 3 says they agree with the original base model [5] in shape and range. The only
    evidence shown is a comparison in words of a few ranges with a textbook [18]; no
    quantitative comparison with [5] or with data is given, and the Fig. 1(a)-(c) models show no
    results at all.
  citation: {page: 7, printed_page: "6", quote: "The results also agree with that presented in"}
- id: q_mean_flow_vs_stroke_volume
  kind: unstated_input
  about: [mean_flow_text, stroke_volume_text]
  text: >
    (Audit.) The mean flow of about 5 L/min and the stroke volume of 75 mL should be linked by
    the heart rate (mean flow = SV x HR), but the paper prints no heart rate or heart period, so
    the two printed results cannot be checked against each other here. A 75 mL stroke volume
    gives 5 L/min at about 67 beats/min; the heart period in ref [5] or the CellML files would
    allow a consistency comparison.
  citation: {page: 7, printed_page: "6", quote: "flows show an average flow-rate of about 5 L/min", where: text}
- id: q_fig5_lv_volume_read
  kind: unexplained_difference
  about: [lv_volume_min_text, lv_volume_max_text, stroke_volume_text, V_lv_min_fig5c, V_lv_max_fig5c, V_lv_min_fig5d, V_lv_max_fig5d, cmp_text_vmin_fig5d, cmp_text_vmax_fig5d, cmp_text_vmin_fig5c, cmp_text_vmax_fig5c, q_lv_volume_fig]
  text: >
    (Figure pass.) The calibrated readings settle q_lv_volume_fig: Fig. 5(c) and the edges of the
    loop in Fig. 5(d) agree with each other and put the smallest left ventricular volume a few mL
    below the printed 55 mL and the largest slightly above the printed 130 mL (comparisons
