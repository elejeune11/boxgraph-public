- id: q_solver_unstated
  kind: unstated_input
  about: [circulation_fig1d]
  text: >
    OpenCell offers backward Euler, Adams-Moulton and a two-stage implicit Runge-Kutta scheme;
    the paper does not say which scheme, step size or tolerances produced Fig. 5, nor how many
    cycles were run before the plotted beat (the plot starts near t = 6.9 s).
  citation: {page: 3, printed_page: "2", quote: "including the Backwards Euler scheme"}
- id: q_lv_pressure_min_fig
  kind: reading
  about: [lv_pressure_min_text]
  text: >
    Read by eye (no calibrated reading), the left ventricular pressure in Fig. 5(a) and the
    pressure-volume loop in Fig. 5(d) do not seem to reach 0 mmHg; the lowest point of the loop
    is several mmHg above 0. The text's "0 to 120 mmHg" may be a rounded description. A
    calibrated reading of Fig. 5 would settle it.
  citation: {page: 7, printed_page: "6", quote: "varies from 0 to 120 mmHg, and the arterial pressure"}
