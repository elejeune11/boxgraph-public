- id: q_no_cross_validation_shi2013_ch2
  kind: unstated_model
  about: [circulation_fig1d, text_max_lv_volume_over_pressure, text_max_lv_volume_over_time, text_min_lv_volume_over_time]
  text: >
    Cross-validation against shi2013_ch2 (Shi's thesis chapter on the lumped-parameter circulation
    with KG diaphragm and valve dynamics) finds nothing to test, in either direction. Its one
    measurement is fig2_3_vlv_mri_read, a healthy volunteer's LV volume per MRI phase (Fig. 2-3).
    No model here predicts it: circulation_fig1d, the only model of a circulation, is not runnable
    (q_model_unstated), and the text_* models are processing models that hold this paper's own
    printed extremes (55, 130 mL; 0, 120 mmHg) at the positions where Fig. 5 was read. They are not
    predictions of the volunteer's volume. Their outputs are maximum or minimum volume, not LV
    volume, and they are indexed by time or pressure, not MRI phase (the phase-to-time mapping is
    unstated). text_max_lv_volume_over_pressure shares a shape with shi2013_ch2/circulation_ch2,
    but that does not make it a predictor. This record holds no measurement ("The paper plots no
    measured data", figures.md), so circulation_ch2 has nothing here to be validated against.
    Neither paper cites the other; this one compares its results only with ref [5] and a textbook.
    No validation was added.
  citation: {page: 7, printed_page: "6", quote: "simulated with the CellML model", where: "Fig. 5"}
