  kind: reading
  about: [lv_volume_min_text, lv_volume_max_text]
  text: >
    Read by eye, the left ventricular volume in Fig. 5(c) and the left edge of the loop in
    Fig. 5(d) are near 53 mL rather than 55 mL, and the right edge near 131-132 mL. If so, the
