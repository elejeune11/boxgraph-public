- id: q_fig5_heart_period
  kind: reading
  about: [q_mean_flow_vs_stroke_volume, mean_flow_text, stroke_volume_text, P_la_fig5a, Q_mi_fig5b]
  text: >
    (Figure pass.) Fig. 5 shows the heart period the text omits: the atrial-contraction bump of
    P(la) (Fig. 5(a)) and the A wave of Q(mi) (Fig. 5(b)) recur about 1 s apart (near t = 6.95 s and
    7.95 s). With that period, the stroke volume read from Fig. 5(c,d) gives a mean flow near the
    printed "about 5 L/min". The period is read here by eye from the positions of the readings; a
    later pass could read it by code (the times of the two P(la) peaks) and add a consistency
    comparison of mean flow, stroke volume and heart rate.
  citation: {page: 7, printed_page: "6", quote: "flows show an average flow-rate of about 5 L/min", where: text}
- id: q_fig5_arterial_which
  kind: reading
  about: [arterial_pressure_min_text, arterial_pressure_max_text, P_sas_fig5a, P_sat_fig5a]
  text: >
    (Figure pass.) The text's "arterial pressure ... 80-120 mmHg" does not say which of the two
    plotted arterial curves it means, P(sas) (aortic sinus) or P(sat) (systemic artery). In Fig. 5(a)
    P(sas) runs a few mmHg above P(sat) throughout; the lowest values read are near 80 mmHg for
    P(sat) and a few mmHg higher for P(sas). Their peaks (near t = 7.25-7.3 s) overlap P(lv) and each
    other and were not read, so the 120 mmHg end is not compared.
  citation: {page: 7, printed_page: "6", quote: "stays in the range of 80-120 mmHg", where: text}
- id: q_no_cross_validation_korakianitis2006
  kind: unstated_model
  about: [circulation_fig1d, stroke_volume_difference]
  text: >
    Cross-validation against korakianitis2006 finds nothing to test. That record holds no
    measurement: its data are model parameters (origin reported) and results of its own simulation
    (predicted, derived), and its 78 figure readings are all of model output (its figures.md: the
    plots "are all model output; it shows no measurements"). Besides, the model here that produces
    results, circulation_fig1d, is not runnable, and the others are processing models of this
    paper's own text values. This paper says ref [5] "has been validated against clinical data",
    but those clinical data are in neither record.
  citation: {page: 3, printed_page: "2", quote: "against clinical data under various physiological and"}
