    circulation_fig1d is not runnable, and the runnable models are processing of this paper's own
    text values (stroke volume, held text values). The other way, this record holds no
    measurement at all (every value is the output of circulation_fig1d), so no westerhof1971
    model (impedance_3el, tau_rpc, the design equations) can be validated against it; its
    impedance_3el would also need parameter values and an aortic flow that this paper does not
    print.
