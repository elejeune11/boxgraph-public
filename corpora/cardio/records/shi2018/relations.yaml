- id: rel_stroke_volume_same
  kind: same_as
  a: korakianitis2006/stroke_volume
  b: shi2018/stroke_volume_difference
  mapping: {V_max: "Vmax", V_min: "Vmin"}
  regime: {Vmax: [100, 200], Vmin: [20, 90]}
  provenance: proposed
  reason: >
    Both papers get the stroke volume as the range of left ventricular volume (korakianitis2006 p. 9,
    "between 50 and 120 ml, with a stroke volume of 70 ml"; shi2018 p. 7, "between 55 mL to 130 mL,
    producing a stroke volume of 75 mL"), and shi2018's results are those of korakianitis2006's model.
    The form is a plain difference.
- id: rel_fig1c_code_from_fig1d
  kind: derived_from
  a: shi2018/circulation_fig1d
  b: shi_cellml_systemic/systemic_left_heart
  mapping: {}   # circulation_fig1d has no inputs (the paper prints none), so b's inputs cannot be written in a's symbols
  steps:
    - "remove the right atrium, right ventricle, pulmonary and tricuspid valves and the pulmonary loop (the paper: the Fig. 1(d) model 'has also been reduced into a series of simpler ones')"
    - "keep the systemic loop as in Fig. 1(d) (the paper: 'exactly the systemic circulation part of the model in Figure 1(d)')"
    - "return the systemic venous outflow directly to the left atrium (shown in the Fig. 1(c) schematic, not said in words)"
  assumptions:
    - "shi_cellml_systemic is the CellML model of Fig. 1(c) that the paper releases at ref [19]; the paper does not name the file"
  provenance: stated
  citation: {page: 4, printed_page: "3", quote: "which is exactly the systemic circulation part of", where: "Section 2.1"}
- id: rel_fig1a_code_from_fig1d
  kind: derived_from
  a: shi2018/circulation_fig1d
  b: shi_cellml_windkessel/windkessel_left_heart
  mapping: {}   # circulation_fig1d has no inputs (the paper prints none), so b's inputs cannot be written in a's symbols
  steps:
    - "remove the right atrium, right ventricle, pulmonary and tricuspid valves and the pulmonary loop (the paper: 'the pulmonary circulation is neglected')"
    - "replace the multi-compartment systemic loop with a two-element Windkessel compartment (the paper: 'the systemic loop is represented by a two-element Windkessel compartment representing the vessel elasticity and frictional loss in the arteries only')"
    - "return the Windkessel outflow directly to the left atrium (shown in the Fig. 1(a) schematic, not said in words)"
  assumptions:
    - "shi_cellml_windkessel is the CellML model of Fig. 1(a) that the paper releases at ref [19] (the paper: the models in Figure 1(a,d) have been represented in CellML); the paper does not name the file"
    - "the Windkessel R and C are printed in neither paper, so the reduction cannot be checked numerically"
  provenance: stated
  citation: {page: 3, printed_page: "2", quote: "simpler ones. In the simplest case, the pulmonary", where: "Section 2.1, Fig. 1(a)"}
- id: rel_fig1b_code_from_fig1d
  kind: derived_from
  a: shi2018/circulation_fig1d
  b: shi_cellml_westkessel/westkessel_left_heart
  mapping: {}   # circulation_fig1d has no inputs (the paper prints none), so b's inputs cannot be written in a's symbols
  steps:
    - "remove the right atrium, right ventricle, pulmonary and tricuspid valves and the pulmonary loop (as for Fig. 1(a): 'the pulmonary circulation is neglected')"
    - "replace the two-element Windkessel of Fig. 1(a) with a three-element Westerhof compartment, a characteristic resistance in series with a compliance and peripheral resistance (the paper: 'the two-element Windkessel compartment is replaced with a three-element Westerhof compartment, as illustrated in Figure 1(b)')"
    - "return the afterload outflow directly to the left atrium (shown in the Fig. 1(b) schematic, not said in words)"
  assumptions:
    - "shi_cellml_westkessel is the CellML model of Fig. 1(b) in the repository of ref [19]; the paper says only the Fig. 1(a,d) models were put in CellML and does not name the file"
    - "Rc, Rv and Cv are printed in neither paper, so the reduction cannot be checked numerically"
  provenance: stated
  citation: {page: 4, printed_page: "3", quote: "ment is replaced with a three-element Westerhof com", where: "Section 2.1, Fig. 1(b)"}
