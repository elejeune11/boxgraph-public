id: circulation_fig1d
name: closed-loop circulation model with multi-compartment afterload (Fig. 1(d)), as implemented in CellML
role: model
stated: {page: 3, printed_page: "2", quote: "values as in [5], which have been validated against the", where: "Section 2.1, Fig. 1(d), Table 1"}
equation: "not printed: four variable-elastance chambers (TempCD, EAtrium, EVentricle) with diode-like valves, and systemic and pulmonary loops of TempRLC/TempRC/TempR segments (Table 1 schematics)"
described_from: korakianitis2006
inputs: {}
outputs:
  P_lv_max: {quantity: peak_lv_pressure, unit: mmHg}
  P_lv_min: {quantity: min_lv_pressure, unit: mmHg}
  P_art_max: {quantity: peak_arterial_pressure, unit: mmHg}
  P_art_min: {quantity: min_arterial_pressure, unit: mmHg}
  Q_mean: {quantity: mean_valve_flow, unit: L/min}
  Q_ao_peak: {quantity: peak_aortic_flow, unit: mL/s}
  Q_mi_peak: {quantity: peak_mitral_flow, unit: mL/s}
  V_lv_max: {quantity: max_lv_volume, unit: mL}
  V_lv_min: {quantity: min_lv_volume, unit: mL}
runnable: false
not_runnable_reason: >
  The paper prints neither the governing equations nor any parameter value, initial condition,
  heart period or solver setting. It shows the components only as circuit schematics (Table 1)
  and says the equations and parameters are those of ref [5] (Korakianitis and Shi 2006) and the
  CellML files in the repository (ref [19]). Running it would mean supplying every equation and
  input from other sources, so it is not made runnable here.
