id: stroke_volume_difference
name: stroke volume as the range of left ventricular volume
role: processing
stated: {page: 7, printed_page: "6", quote: "between 55 mL to 130 mL, producing a stroke volume", where: text}
equation: "SV = V_lv,max - V_lv,min (stated in words: the volume changes between 55 and 130 mL, producing a stroke volume of 75 mL)"
from_words: true
inputs:
  V_max: {quantity: max_lv_volume, unit: mL}
  V_min: {quantity: min_lv_volume, unit: mL}
outputs:
