id: initial_area_eq16
name: initial (zero-pressure) area from the diastolic area and pressure (Eq. 16, with beta of Eq. 3)
stated: {page: 15, where: Eq. 16, quote: "that yields the reference diastolic area Ad at P D Pd is calculated using"}
equation: "A0 = Ad (1 - sqrt(Ad) Pd / beta)^2,  beta = (4/3) sqrt(pi) E h"
inputs:
  Ad: {quantity: diastolic_area, unit: m^2}
  Pd: {quantity: diastolic_pressure, unit: Pa}
  E:  {quantity: youngs_modulus, unit: Pa}
  h:  {quantity: wall_thickness, unit: m}
outputs:
  A0: {quantity: initial_area, unit: m^2}
settings: {}
