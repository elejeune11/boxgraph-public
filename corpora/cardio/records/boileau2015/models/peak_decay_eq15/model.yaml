id: peak_decay_eq15
name: exponential damping of the viscous pulse peak with distance (Eq. 15)
stated: {page: 15, where: Eq. 15, quote: "the asymptotic exponential damping rate given by the theoretical solution"}
equation: "Ppeak,visc(x) = Ppeak,inv exp(-(zeta + 2) pi mu x / (rho c0 A0))"
inputs:
  zeta: {quantity: velocity_profile_order, unit: dimensionless}
  mu:   {quantity: blood_viscosity, unit: Pa*s}
  rho:  {quantity: blood_density, unit: kg/m^3}
  c0:   {quantity: pulse_wave_velocity, unit: m/s}
  A0:   {quantity: diastolic_area, unit: m^2}
  x:    {quantity: distance_along_vessel, unit: m}
outputs:
  ratio: {quantity: peak_pressure_ratio, unit: dimensionless, description: "Ppeak,visc(x) / Ppeak,inv"}
settings: {}
