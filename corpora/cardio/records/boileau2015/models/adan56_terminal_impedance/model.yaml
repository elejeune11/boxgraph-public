id: adan56_terminal_impedance
name: characteristic impedance of an ADAN56 terminal vessel, with wall thickness from Eq. 17
stated: {page: 21, where: Eq. 17, quote: "Wall thickness is calculated using the following empirical expression"}
equation: "h = R0 [a exp(b R0) + c exp(d R0)] (Eq. 17);  A = pi R0^2 = Ad;  R1 = rho c / A with c from Eq. 5 and beta of Eq. 3"
built_from: [characteristic_impedance]
inputs:
  R0:  {quantity: lumen_radius, unit: m}
  E:   {quantity: youngs_modulus, unit: Pa}
  rho: {quantity: blood_density, unit: kg/m^3}
  a:   {quantity: thickness_coef_a, unit: dimensionless}
  b:   {quantity: thickness_coef_b, unit: 1/m}
  c:   {quantity: thickness_coef_c, unit: dimensionless}
  d:   {quantity: thickness_coef_d, unit: 1/m}
outputs:
  R1: {quantity: proximal_resistance, unit: Pa*s/m^3}
settings: {}
