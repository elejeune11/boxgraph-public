id: cfl_table1
name: Courant-Friedrichs-Lewy number of a scheme (Table I footnote)
role: processing
stated: {page: 6, where: Table I footnote, quote: "is the Courant-Friedrichs-Lewy number used for each"}
equation: "CFL = lambda Delta t / Omega_e,  lambda = max |U + c|"
inputs:
  c:  {quantity: pulse_wave_velocity, unit: m/s, description: "wave speed c at the point where |U + c| is largest"}
  U:  {quantity: flow_velocity, unit: m/s, description: "mean axial velocity U at that point"}
  dt: {quantity: time_step, unit: s}
  dx: {quantity: element_size, unit: m}
outputs:
  CFL: {quantity: cfl_number, unit: dimensionless}
settings: {}
