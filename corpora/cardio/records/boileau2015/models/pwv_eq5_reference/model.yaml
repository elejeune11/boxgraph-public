id: pwv_eq5_reference
name: pulse wave velocity at the reference area (Eq. 5 with A = Ad, beta of Eq. 3)
stated: {page: 4, where: Eq. 5, quote: "Using Equation (3) leads to the following expression"}
equation: "c = sqrt(beta / (2 rho Ad)) A^(1/4),  beta = (4/3) sqrt(pi) E h;  here A = Ad"
inputs:
  Ad:  {quantity: diastolic_area, unit: m^2}
  E:   {quantity: youngs_modulus, unit: Pa}
  h:   {quantity: wall_thickness, unit: m}
  rho: {quantity: blood_density, unit: kg/m^3}
outputs:
  c: {quantity: pulse_wave_velocity, unit: m/s}
settings: {}
