id: pwv_at_pressure
name: pulse wave velocity at a given pressure (Eq. 3 solved for A, then Eq. 5)
stated: {page: 9, where: Table III footnote, quote: "The resulting wave speed at mean pressure is cm"}
equation: "P - Pext = Pd + beta/Ad (sqrt(A) - sqrt(Ad)) with Pext = 0;  c = sqrt(beta / (2 rho Ad)) A^(1/4);  beta = (4/3) sqrt(pi) E h"
built_from: [pwv_eq5_reference]
inputs:
  P:   {quantity: mean_pressure, unit: Pa}
  Pd:  {quantity: diastolic_pressure, unit: Pa}
  Ad:  {quantity: diastolic_area, unit: m^2}
  E:   {quantity: youngs_modulus, unit: Pa}
  h:   {quantity: wall_thickness, unit: m}
  rho: {quantity: blood_density, unit: kg/m^3}
outputs:
  c: {quantity: pulse_wave_velocity, unit: m/s}
settings: {}
