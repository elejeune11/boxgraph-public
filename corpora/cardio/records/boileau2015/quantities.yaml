- {id: blood_density, name: blood mass density, dimension: "[mass]/[length]**3", description: "rho"}
- {id: blood_viscosity, name: blood dynamic viscosity, dimension: "[pressure]*[time]", description: "mu"}
- {id: velocity_profile_order, name: order of the axial velocity profile, dimension: dimensionless, description: "zeta in Eq. 2"}
- {id: diastolic_pressure, name: diastolic (reference) pressure of the tube law, dimension: "[pressure]", description: "P_d in Eq. 3"}
