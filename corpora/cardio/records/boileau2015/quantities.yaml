- {id: pulse_duration, name: duration of a pulse wave, dimension: "[time]", description: "the width T of the single-pulse inflow, or the systolic period T_s of a physiological inflow"}
- {id: wavelength, name: pulse wavelength, dimension: "[length]", description: "duration of the pulse times its wave speed (c0 T, T_s c_m)"}
