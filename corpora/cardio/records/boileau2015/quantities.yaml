- {id: thickness_coef_a, name: coefficient a of the wall-thickness law, dimension: dimensionless, description: "a~ in Eq. 17"}
- {id: thickness_coef_b, name: exponent rate b of the wall-thickness law, dimension: "1/[length]", description: "b~ in Eq. 17"}
- {id: thickness_coef_c, name: coefficient c of the wall-thickness law, dimension: dimensionless, description: "c~ in Eq. 17"}
- {id: thickness_coef_d, name: exponent rate d of the wall-thickness law, dimension: "1/[length]", description: "d~ in Eq. 17"}
- {id: time_step, name: time step of a numerical scheme, dimension: "[time]", description: "Delta t of Table I"}
- {id: element_size, name: "size of an element, cell or stencil of a numerical scheme", dimension: "[length]", description: "Omega_e of Table I"}
- {id: cfl_number, name: Courant-Friedrichs-Lewy number, dimension: dimensionless, description: "CFL = lambda Delta t / Omega_e of Table I"}
- {id: flow_velocity, name: cross-sectional mean axial blood velocity, dimension: "[length]/[time]", description: "U of Eq. 1"}
- {id: relative_rms_error, name: relative root mean square error of a 1D solution against reference data, dimension: dimensionless, description: "E^RMS of Eq. 10, in per cent in Tables IV, VI, VIII and X"}
