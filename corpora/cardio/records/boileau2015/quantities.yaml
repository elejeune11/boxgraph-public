- {id: mean_pressure, name: time-averaged pressure over a cardiac cycle, dimension: "[pressure]"}
- {id: pulse_wave_velocity, name: pulse wave velocity, dimension: "[length]/[time]", description: "c of Eqs. 4-5; c0 at the initial area of the single pulse, c_m at mean pressure"}
- {id: proximal_resistance, name: proximal resistance R1 of a three-element Windkessel, dimension: "[pressure]*[time]/[length]**3", description: "R1 in Eq. 9; the paper sets it equal to the characteristic impedance of the end point (p. 5)"}
- {id: distal_resistance, name: distal resistance R2 of a three-element Windkessel, dimension: "[pressure]*[time]/[length]**3", description: "R2 in Eq. 9"}
