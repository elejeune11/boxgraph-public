- id: q_no_validation_vs_olufsen2000
  kind: choice
  about: [tube_law_eq3, windkessel_mean_pressure, pwv_at_pressure, characteristic_impedance, fig6a_P_exp_curve, fig6a_Q_exp_curve]
  text: >
    No validation against olufsen2000 is entered, in either direction (cross-validation job 2026-11-04).
    This paper cites olufsen2000 (ref. 9) only as background: among earlier 1D models (p. 2), for the
    Lax-Wendroff scheme (p. 2) and for structured-tree impedance outflow conditions (p. 5); it compares
    none of its models with olufsen2000's data. olufsen2000's measurements are the MR flows of one subject
    (its Figs. 3 and 7), his heart rate, a cuff pressure of 120/80 mmHg and an ascending-aortic radius.
    None of this record's runnable models gives a flow waveform. tube_law_eq3 has the same shape as
    olufsen2000/tube_law_eq14, but to predict a pressure it needs a lumen area at that pressure, and
    olufsen2000 prints no measured area at the cuff pressures (nor E and h for that subject);
    pwv_at_pressure and characteristic_impedance give a wave speed and an impedance that olufsen2000 does
    not measure; windkessel_mean_pressure would need terminal resistances R1, R2 for that subject that
    neither paper states, so its value would rest on added fits, not be a prediction. In the other
    direction, this record's measurements (the in vitro waveforms of [45], Figs. 6-9) are in a 37-artery
    silicone network that olufsen2000's network_1d does not describe and cannot run (it is not runnable;
    olufsen2000 q_no_validation_vs_boileau2015).
  citation: {page: 5, where: text, quote: "structured-tree networks and impedance boundary conditions"}

- id: q_no_validation_vs_reymond2009
  kind: choice
  about: [windkessel_mean_pressure, pwv_eq5_reference, pwv_at_pressure, characteristic_impedance, fig6a_P_exp_curve, fig6a_Q_exp_curve]
  text: >
    No validation against reymond2009 is entered, in either direction (cross-validation job 2026-11-04).
    This paper cites reymond2009 (ref. 66) only for the observation that the dynamic pressure term matters
    little (p. 30); it compares none of its models with reymond2009's data. reymond2009 measures in vivo
    systolic, mean and diastolic flows at nine sites (Table 4), systolic, diastolic, pulse and mean pressures at
    the radial, carotid and temporal arteries (Table 5), averaged waveforms (Figs. 4-5), Senzaki's normalized
    elastance (Fig. 1B) and literature PWV against diameter (Fig. 3). windkessel_mean_pressure shares the shape
    of reymond2009/arterial_tree_1d (pressure from flow and resistances), but the three pressure sites are not
    Windkessel inlets with a measured inflow: no flow is measured at the radial or temporal terminals, and the
    carotid is not a terminal; and reymond2009's terminal resistances RT = R1 + R2 were themselves estimated
    from the measured mean flow distribution (reymond2009 p. 3), so a mean pressure from them would be circular,
    not a test. pwv_eq5_reference and pwv_at_pressure would need E and h for each artery of Fig. 3, which
    neither paper gives for those literature points (ADAN56's E = 225 kPa and Eq. 17 thickness belong to this
    paper's network, and no model here takes a diameter), and they take an area, not the diameter Fig. 3 is
    indexed by. No model here gives a flow, a pulse pressure or an elastance. In the other direction, the in
    vitro waveforms of [45] (Figs. 6-9) are pressures and flows in time in a 37-vessel silicone network;
    reymond2009's 1-D tree is not runnable and describes the human tree, and its runnable models (Eq. 22 PWV,
    distensibility, viscoelastic coefficients, R1/RT, terminal compliance, pulse and mean pressure from
    systolic and diastolic values) give no quantity these curves quantify (reymond2009
    q_no_validation_vs_boileau2015).
  citation: {page: 30, where: text, quote: "in accordance with previous observations"}

- id: q_no_validation_vs_mynard2015
  kind: choice
  about: [adan56_terminal_impedance, windkessel_mean_pressure, characteristic_impedance, circle_area, fig6a_P_exp_curve, fig6a_Q_exp_curve]
  text: >
    No validation against mynard2015 is entered, in either direction (cross-validation job 2026-11-06).
    Neither paper cites the other (this paper cites only earlier Mynard works, refs. 16 and 56, as background).
    mynard2015's measurements are the in vivo reference ranges of its Table 6 (heart rate, cardiac output,
    SVR, PVR, chamber volumes and ejection fractions, mean and pulse pressures, E/A ratios, dP/dt), a human
    coronary sinus diameter (0.81) and the in vivo waveforms of its Fig. 4, all population or subject values from
    cited works. adan56_terminal_impedance shares a dimension with mynard2015's SVR, but it gives R1 = rho c / A
    of one ADAN56 terminal vessel (a characteristic impedance), not the resistance of the whole systemic
    circulation, (mean aortic - mean right atrial pressure) / cardiac output, that Table 6's SVR range measures;
    mapping proximal_resistance onto vascular_resistance would join two quantities that only share a dimension.
    windkessel_mean_pressure gives the mean pressure at one Windkessel terminal of a benchmark network from its
    R1, R2 and inflow; mynard2015's measured mean pressures (aortic root, pulmonary trunk, atria, portal vein)
    are not Windkessel inlets with a stated inflow and resistances, so a value would rest wholly on added
    inputs. circle_area gives an area, not the measured diameter. No model here gives a flow or pressure
    waveform, a volume, an ejection fraction or a heart rate. In the other direction, mynard2015's full model
    (circulation_1d_0d) is not runnable and describes the human circulation, not the 37-vessel silicone network
    of [45] (Figs. 6-9); its runnable parts (Eq. 3 wave speed, Eq. T5 pericardial pressure, Eq. 1 pSIP ratio,
    CO from EF, vascular resistance from mean pressures, compliance sums) give no quantity those curves
    quantify (mynard2015 q_no_validation_vs_boileau2015).
  citation: {page: 2, where: text, quote: "Mynard and Nithiarasu [16], Low et al."}
