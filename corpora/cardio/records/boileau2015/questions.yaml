    prints (a value the build must compute, not one to add), and it would repeat alastruey2011's own comparison
    of the same Eq. 5 with the same inputs (q_c0_E there). tube_law_eq3, pwv_at_pressure and
    characteristic_impedance give pressure, wave speed and R1 from geometry, none of them a quantity measured
    there (Fig. 5's A-P curves are simulated, and Rp is a terminal resistance from mean pressure and flow, not
    rho c / A).
  citation: {page: 20, where: text, quote: "the flow rate measured in vitro is prescribed as the inflow boundary condition"}

