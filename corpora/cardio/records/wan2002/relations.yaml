- id: rel_N_eq6_from_eq4_nu
  kind: same_as
  a: wan2002/profile_terms_eq6
  b: wan2002/profile_terms_eq3_5_nu
  mapping: {n: "n", nu: "nu"}
  output_map: {N: N}
  regime: {n: [1, 12], nu: [0.03, 0.05]}
  provenance: stated
  citation: {page: 2, printed_page: "196", quote: "the profile to be axisymmetric and of the form", where: "Eqs. 3-6"}
