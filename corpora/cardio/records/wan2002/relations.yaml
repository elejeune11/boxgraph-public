# Relations the paper states. Units: dyn/cm^2 = g/s^2/cm.
# The constitutive law "suggested by Olufsen [11]" (p. 2): Eq. 11 here is olufsen1999's Eq. 5, and Eq. 14
# its Eq. 6, with S for A. The reference states differ in name (q_reference_state_olufsen).
- id: rel_pressure_area_olufsen1999
  kind: same_as
  a: wan2002/pressure_area_eq11
  b: olufsen1999/pressure_area_eq5
  mapping: {k1: "k1", k2: "k2", k3: "k3", r0: "r0", p0: "p0", A: "S"}
  output_map: {p: p}
  regime: {k1: [1.0e7, 3.0e7], k2: [-30, -15], k3: [5.0e5, 1.2e6], r0: [0.1, 1.5], p0: [0, 1.5e5], S: [0.02, 10.0]}
  provenance: stated
  citation: {page: 2, printed_page: "196", quote: "used is that suggested by Olufsen", where: "Eq. 11"}
- id: rel_stiffness_olufsen1999
  kind: same_as
  a: wan2002/stiffness_eq14
  b: olufsen1999/stiffness_eq6
  mapping: {k1: "k1", k2: "k2", k3: "k3", r0: "r0"}
  output_map: {Eh_r0: Eh_r0}
  regime: {k1: [1.0e7, 3.0e7], k2: [-30, -15], k3: [5.0e5, 1.2e6], r0: [0.05, 1.5]}
  provenance: stated
  citation: {page: 2, printed_page: "196", quote: "used is that suggested by Olufsen", where: "Eqs. 11 and 14"}
