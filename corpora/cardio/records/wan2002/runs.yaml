# ---- Figs. 1 and 2 as curves: the released solver at the times of the figure readings ----
- id: run_fig1_curves
  model: single_segment_svoned_curve
  inputs: {r0: r0_segment, L: L_segment, k1: k1_default, k2: k2_default, k3: k3_default, n: n_poiseuille, rho: rho_added, nu: nu_added, R: R_segment_added, p_ref: p_ref_added}
  sweep: {t: fig1_flow_inlet_read}
  outputs: {Q_in: fig1_Q_in_pred, Q_out: fig1_Q_out_pred, p_in: fig1_p_in_pred, p_out: fig1_p_out_pred}
  note: "the run of run_segment, read at 0.05-0.85 s of its last cycle; all four readings of Fig. 1 are at these times"
- id: run_fig2_curves
  model: bifurcation_svoned_curve
  inputs: {n_in: elements_bifurcation_inlet, n_br: elements_bifurcation_branch, h: element_size_bifurcation, r_in: r_bif_inlet_added, r_br: r_bif_branch_added, k1: k1_default, k2: k2_default, k3: k3_default, n: n_poiseuille, rho: rho_added, nu: nu_added, R: R_bif_added, p_ref: p_ref_added}
  sweep: {t: fig2a_flow_read}
  outputs: {Q_in: fig2_Q_in_pred, p_in: fig2_p_in_pred, Q_r: fig2_Q_r_pred, p_r: fig2_p_r_pred, Q_l: fig2_Q_l_pred, p_l: fig2_p_l_pred}
  note: "the run of run_bifurcation, read at 0.05-0.85 s of its last cycle; all readings of Fig. 2 are at these times"
