id: length_diameter_ratio
name: length-to-diameter ratio of a segment from its length and radius
role: processing
stated: {page: 6, printed_page: "200", quote: "specified to be 16 cm (length to diameter ratio of 20)", where: text}
equation: "L/D = L/(2 r0)"
from_words: true
inputs:
  L: {quantity: vessel_length, unit: cm}
  r0: {quantity: vessel_radius, unit: cm}
outputs:
  LD: {quantity: length_to_diameter_ratio, unit: dimensionless}
settings: {}
stochastic: false
