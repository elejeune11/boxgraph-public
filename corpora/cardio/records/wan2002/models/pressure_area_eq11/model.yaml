id: pressure_area_eq11
name: pressure from luminal area, Olufsen's law (Eq. 11 with Eqs. 13-14)
role: model
stated: {page: 2, printed_page: "196", quote: "The particular constitutive relationship that we have", where: "Eq. 11, with Eqs. 12-14"}
equation: "p(S, z, t) = p0(z) + (4/3) Eh/r0(z) (1 - sqrt(S0(z)/S(z, t))) (11); p0(z) = p(z, 0) (12); r0 = (S0/pi)^(1/2) (13); Eh/r0 = k1 exp(k2 r0) + k3 (14)"
built_from: [stiffness_eq14]
inputs:
  k1: {quantity: stiffness_fit_amplitude, unit: g/s^2/cm}
  k2: {quantity: stiffness_fit_rate, unit: 1/cm}
  k3: {quantity: stiffness_fit_offset, unit: g/s^2/cm}
  r0: {quantity: vessel_radius, unit: cm, description: "S0 = pi r0^2 (Eq. 13)"}
  p0: {quantity: reference_pressure, unit: g/s^2/cm}
  S: {quantity: vessel_cross_sectional_area, unit: cm^2}
outputs:
  p: {quantity: arterial_pressure, unit: g/s^2/cm}
settings: {}
stochastic: false
