id: speedup_ratio
name: speed-up of the 1D over the 3D solution, as the ratio of their CPU times
role: processing
stated: {page: 2, printed_page: "196", quote: "flow problem can be solved roughly 5000 times faster", where: text}
equation: "speed-up = t_cpu,3D / t_cpu,1D"
from_words: true
inputs:
  cpu3: {quantity: cpu_time, unit: min}
  cpu1: {quantity: cpu_time, unit: min}
outputs:
  s: {quantity: speedup_factor, unit: dimensionless}
settings: {}
stochastic: false
