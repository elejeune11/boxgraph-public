id: flow_difference_table1
name: difference of the 1D mean flow from the 3D mean flow, in percent of the 3D flow (Table I, Difference column)
role: processing
stated: {page: 7, printed_page: "201", quote: "Flow (cc/s) 1D 3D Difference (%)", where: "Table I"}
equation: "Difference = 100 (Q_1D - Q_3D)/Q_3D"
from_words: true
inputs:
  q1d: {quantity: mean_flow_rate, unit: cm^3/s}
  q3d: {quantity: mean_flow_rate, unit: cm^3/s}
outputs:
  diff: {quantity: flow_difference_1d_3d, unit: percent}
settings: {}
stochastic: false
# The paper does not define the Difference; relative to the 3D flow is the reading under which the
# signs and all but one of the printed values follow (q_table1_difference_definition).
