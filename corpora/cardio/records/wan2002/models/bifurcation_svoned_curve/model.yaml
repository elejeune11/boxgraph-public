id: bifurcation_svoned_curve
name: symmetric bifurcation of Fig. 2, run with the released svOneDSolver, flow and pressure at a time of the last cycle
role: model
stated: {page: 6, printed_page: "200", quote: "We next consider pulsatile flow in a symmetric", where: "Results, Fig. 2"}
equation: "as bifurcation_svoned; outputs interpolated linearly at time t of the last computed cycle (t = 0 at its start)"
built_from: [bifurcation_svoned]
inputs:
  t: {quantity: time_in_cycle, unit: s}
  n_in: {quantity: element_count, unit: dimensionless}
  n_br: {quantity: element_count, unit: dimensionless}
  h: {quantity: element_size, unit: cm}
  r_in: {quantity: vessel_radius, unit: cm}
  r_br: {quantity: vessel_radius, unit: cm}
  k1: {quantity: stiffness_fit_amplitude, unit: g/s^2/cm}
  k2: {quantity: stiffness_fit_rate, unit: 1/cm}
  k3: {quantity: stiffness_fit_offset, unit: g/s^2/cm}
  n: {quantity: profile_exponent, unit: dimensionless}
  rho: {quantity: blood_density, unit: g/cm^3}
  nu: {quantity: kinematic_viscosity, unit: cm^2/s}
  R: {quantity: outlet_resistance, unit: g/s/cm^4}
  p_ref: {quantity: reference_pressure, unit: mmHg}
outputs:
  Q_in: {quantity: flow_rate, unit: cm^3/s, description: "inlet (Fig. 2 A)"}
  p_in: {quantity: arterial_pressure, unit: mmHg, description: "inlet (Fig. 2 A)"}
  Q_r: {quantity: flow_rate, unit: cm^3/s, description: "right outlet (Fig. 2 B)"}
  p_r: {quantity: arterial_pressure, unit: mmHg, description: "right outlet (Fig. 2 B)"}
  Q_l: {quantity: flow_rate, unit: cm^3/s, description: "left outlet (Fig. 2 C)"}
  p_l: {quantity: arterial_pressure, unit: mmHg, description: "left outlet (Fig. 2 C)"}
settings:
  subdivide: 1
  steps_per_cycle: 100
  n_cycles: 3
  quad_points: 2
  tolerance: 1.0e-8
  formulation: 1
  stabilization: 1
  q_init: 0.0
  inflow_file: corpus/cardio/code/svoned_code/Tests/SystemTests/cases/05_bifurcation_RCR.in
  inflow_table: AORTAFLOW
stochastic: false
# Written for a sweep over a reading of Fig. 2 (time axis), made in the later figure stage.
