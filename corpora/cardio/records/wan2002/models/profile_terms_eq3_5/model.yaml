id: profile_terms_eq3_5
name: delta and N from their definitions (Eqs. 3-4, as printed) evaluated on the power-law profile (Eq. 5)
role: model
stated: {page: 2, printed_page: "196", quote: "The variables d and N are defined as", where: "Eqs. 3-5"}
equation: "delta = (1/S) int_S (phi^2 - 1) da (3); N = oint_dS dphi/dm dl (4); phi(r) = ((n + 2)/n)(1 - (r/R)^n) (5)"
inputs:
  n: {quantity: profile_exponent, unit: dimensionless}
outputs:
  delta: {quantity: momentum_flux_correction, unit: dimensionless}
  Nint: {quantity: profile_wall_gradient_integral, unit: dimensionless, description: "the right-hand side of Eq. 4 as printed, which has no viscosity factor and is dimensionless"}
settings: {}
stochastic: false
# The integrals are evaluated numerically (Gauss-Legendre over the radius; the wall derivative by a
# one-sided finite-difference stencil), independently of the closed forms of Eq. 6.
