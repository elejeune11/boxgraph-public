# Added by the cross-validation job with reymond2009.
- id: q_no_validation_vs_reymond2009
  kind: choice
  about: [wave_speed_eq21, abdominal_aorta_1d, bifurcation_svoned, single_segment_svoned, k1_default, k2_default, k3_default]
  text: >
    (Cross-validation with reymond2009, which cites this paper as ref. 69, job 2026-11-10.) No validation is
    entered in either direction. reymond2009 cites this paper only as a row of its Table 1 survey of 1-D
    models (p. 2), and neither paper says that its model explains or is compared with the other's data.
    This paper prints no measurements (figures.md: every plot is a computed 1D or 3D result), so no model of
    reymond2009 has anything here to be validated against.
    In the other direction, reymond2009 measures flows and radial, carotid and temporal pressures in its own
    subjects (Tables 4-5, Figs. 4-5), Senzaki et al.'s normalized elastance (Fig. 1B) and literature PWV
    against lumen diameter (Fig. 3, pwv_lit_fig3). The 1-D solver models here (single_segment_svoned,
    bifurcation_svoned, abdominal_aorta_1d) share the shape of reymond2009/arterial_tree_1d, but they run
    this paper's idealized geometries with its own inflow, not reymond2009's tree or subjects, so they do
    not give the flows or pressures measured there. The only quantity crossed is wave speed:
    wave_speed_eq21 gives c0 = ((2/3)(Eh/r0)/rho)^(1/2) with Olufsen's Eh/r0 (k1_default, k2_default,
    k3_default), the same law as mynard2015/wave_speed_eq3, which is validated against pwv_lit_fig3. But
    wave_speed_eq21 takes the reference radius r0 (vessel_radius), while pwv_lit_fig3 is indexed by lumen
    diameter. A radius and a diameter are different quantities, so the curve cannot be swept into this
    port, and a validation entry cannot halve its index. This record's models may not be changed by this
    job. A model that takes the diameter (or a sweep that converts the index) would make this test
    possible. The k values were set "to experimental data" (p. 3), not to reymond2009's six sources, so it
    would be a validation, not a fit.
  citation: {page: 3, printed_page: "197", quote: "to experimental data and are set to default values of", where: "Eq. 14 text"}
