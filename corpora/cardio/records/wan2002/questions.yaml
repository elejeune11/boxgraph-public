  text: >
    The paper's stated goal is to "rank outcomes of proposed surgical procedures in the same order as a
    fully three-dimensional simulation" (p. 2), and it reports that the 1D solutions "compare
    favorably" (p. 8) and show "overall good agreement" (p. 9). In Table I the 1D and 3D columns order
    the three treatment plans differently at every one of the four outlet locations: by the 3D flows
    the end-to-side AFB gives the most flow at the R femoral, R popliteal and L popliteal locations
    (8.24 vs 11.05, 4.64 vs 5.15, 5.66 vs 6.03 cc/s), while by the 1D flows the end-to-end AFB does
    (8.98, 5.05, 5.72); at the L femoral the 1D puts the Fem-Fem plan first (15.72) and the 3D the
    end-to-side AFB (13.02). The plan with the least flow is the same in both at every location
    (Fem-Fem at three, end-to-end AFB at the L femoral); the first two places are swapped at all four.
    No 1D-3D difference of a branch flow is within the printed precision (comparisons cmp_1d3d_*),
    and they reach -38% and +142%. The paper does not discuss the ranking it set out to show.
