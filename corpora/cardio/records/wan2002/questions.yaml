    as an essential condition (Eqs. 49-52). The released solver keeps that form as formulation 0, but
    with a RESISTANCE outlet it stops at the first time step ("Calculated a NaN for the residual"):
    on the paper's single segment here, and also on the release's own test cases tube_r, bifurcation_R
    and 02_simpleArtery_Resistance switched to formulation 0 (they complete with formulation 1; the
    pressure-outlet cases tube_pressure and bifurcation_P complete with both). The record therefore
    runs the release's conservative form (formulation 1), whose resistance outlet is the boundary flux
    term of the theory notes, not the paper's Eqs. 49-52. Whether the paper's own method gives the same
    flows and pressures cannot be checked with the release.
