    case of Poiseuille flow") carry a factor nu that Eq. 4 lacks. The record keeps Eq. 4 as printed
    (profile_terms_eq3_5, output Nint) and adds the variant with the factor nu (profile_terms_eq3_5_nu),
    compared with Eq. 6 in cmp_N_eq4_nu_eq6 and rel_N_eq6_from_eq4_nu. The release's theory notes
    (docs/source/content/theory.rst) give only the result N = -8 pi nu.
