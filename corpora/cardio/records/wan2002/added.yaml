- id: rho_added
  quantity: blood_density
  unit: g/cm^3
  printed: "1.06"
  basis: The paper names the density rho (p. 2) but gives no value; 1.06 g/cm^3 is the value of every example input file of the released solver and the usual value for blood
  alternatives: ["1.05"]
  stands_for: rho in Eqs. 2, 21, 23
- id: nu_added
  quantity: kinematic_viscosity
  unit: cm^2/s
  printed: "0.0377"
  basis: The paper names the kinematic viscosity nu (p. 2) but gives no value; a dynamic viscosity of 0.04 P (the released solver's example input files) over the density 1.06 g/cm^3
  alternatives: ["0.033", "0.04"]
  stands_for: nu in Eqs. 2, 6, 22
- id: p_ref_added
  quantity: reference_pressure
  unit: mmHg
  printed: "85"
  basis: >
    Eq. 12 sets p0(z) = p(z, 0), the initial pressure, at which the area is S0 = pi r0^2, but the
    initial state is not printed; 85 mmHg is the reference pressure of the released solver's example
    input files ("Ref Pressure 1333.22*85 where 85 is in mmHg"), about the diastolic pressure of Fig. 1
  alternatives: ["0", "100"]
  stands_for: p0 in Eqs. 11-12 (the solver's material reference pressure)
- id: R_segment_added
  quantity: outlet_resistance
  unit: g/s/cm^4
  printed: "3100"
  basis: >
    The outlet resistance of the single segment (Fig. 1) is not printed. With p = QR at the outlet
    (Eq. 8), Fig. 1's outlet pressure over outlet flow is roughly 2.3 mmHg s/cc (about 185 mmHg at
    80 cc/s, 80 mmHg at 35 cc/s, read by eye), about 3100 dyn s/cm^5
  alternatives: ["2600", "3600"]
  stands_for: R in Eq. 8, single segment
- id: r_bif_inlet_added
  quantity: vessel_radius
  unit: cm
  printed: "0.8"
  basis: The bifurcation's dimensions "were chosen to correspond approximately to the human aortic bifurcation" (p. 6); its radii are not printed. 0.8 cm is a typical radius of the distal abdominal aorta
  alternatives: ["0.6", "1.0"]
  stands_for: radius of the inlet branch of Fig. 2
- id: r_bif_branch_added
  quantity: vessel_radius
  unit: cm
  printed: "0.5"
  basis: Not printed (p. 6); 0.5 cm is a typical radius of a common iliac artery
  alternatives: ["0.4", "0.6"]
  stands_for: radius of each daughter branch of Fig. 2
- id: R_bif_added
  quantity: outlet_resistance
  unit: g/s/cm^4
  printed: "6200"
  basis: The two equal outlet resistances of the bifurcation are not printed (p. 6); twice the single segment's added resistance, so that each branch, carrying half the same inflow, sees about the same pressure
  alternatives: ["5200", "7200"]
  stands_for: R in Eq. 8, each outlet of Fig. 2
