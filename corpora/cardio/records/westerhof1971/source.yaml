notes: >
  Scope: the design calculations of the hydraulic three-element windkessel. Ten models: the quality
  factor of a resistor tube (Eq. 2) and the tube impedance it implies (Eq. 10); the turbulence and
  inlet-length minimum-length criteria (Eqs. 7a/7b, reduced to Eqs. 11a/11b) and Eq. 11b applied to
  the stated pressure drops; the Poiseuille constant of Eq. 8b and the numbers of tubes of Table 1;
  tau = RpC and the air volumes (Eq. 9) of Table 1; and Eq. 1a against the d-c resistances measured
  on the constructed models (Figs. 2-5 captions). Most results reproduce. Not reproduced or only close:
  the Eq. 11a/11b coefficients and the Eq. 8b constant (all about 8-12% off the values from the printed
  bore, viscosity and density); the pulmonary R_p minimum length (0.92 cm in the text, 1.3 cm in the
  table, about 2.9 cm from Eq. 11b); the 15% modulus increase at 15 Hz (Eq. 10 gives about 17%); several
  Table 1 integers that look rounded to two significant figures; three measured d-c resistances off
  R_c + R_p by 0.4-4%. The air volumes rest on added atmospheric and pulmonary mean pressures. Left out:
  the dog Z0 and the compliances (radii and decay data not given), the 40% resistance error for a 10%
  bore error and the 20/50/25 mm Hg pressure-drop estimates (approximate arithmetic feeding no printed
  result beyond those recorded), the slit-width remark (from cited work), and Figs. 2-5, which carry
  measured impedance data but could not be digitized because the figure-rendering commands were refused
  in this job (see figures.md). Table 1 minimum lengths are identical in all four species columns; only
  the man column is recorded and used for every species.
  Figure pass (2026-11-02): Figs. 2-5 are read with calibrated code readings (figures.yaml,
  figures.md): the drawn lines, the literature dots (Figs. 2-3) and the crosses and circles
  (Figs. 4-5), modulus and phase, 20 readings in all. Each is compared with a new model,
  impedance_3el (the three-element network of Fig. 1A, from words), run with the Table 1 values:
  reproductions for the theoretical lines of Figs. 4-5, validations for the measured data. Fig. 4's
  theoretical line lies under the model with the Table 1 values at high frequency (levels off near
  1.13 x 10^3 against R_c = 1,200); the measured hydraulic models turn to positive phase at high
  frequency, which the three-element model cannot follow. Fig. 6 (single recordings, no time scale)
  is left out.
