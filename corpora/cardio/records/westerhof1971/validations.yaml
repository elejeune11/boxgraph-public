  basis: "p. 1: the three-element model of Fig. 1A stands for the aortic input impedance of the systemic tree; Table 1 gives its values for man. westerhof2009 p. 3 plots Fig. 4's measured impedance against the three-element windkessel, which it cites to this paper (ref. 73)."

# ---- Cross-validation with westerhof1969 (ref. 27): tau = Rp C against the analog's measured decay times ----
# The three-element model of this paper is the reduction of the 1969 analog of the human systemic tree
# (p. 1, refs. 26, 27), and Table 1's man values come in part from that work (p. 5, refs. 22, 26, 27).
# The 1969 paper measured the diastolic decay time on the analog at three peripheral resistances and
# with all capacitors halved (1969 p. 136). Here tau = Rp C is run with the analog's printed peripheral
# resistance for each setting (the measurement's own condition) and this paper's total compliance for
# man. Table 1's C for man is not shown to be fitted to these decay times (with its own Rp = 1200 it
# gives the printed tau = 1.0 s, not 0.8 s), so these are validations; see q_val_analog_decay.
- id: val_tau_man_vs_analog_normal
  model: tau_rpc
  inputs: {Rp: 'westerhof1969/R_normal', C: c_man_syst}
  output: tau
  against: 'westerhof1969/tau_normal'
  purpose: validation
  quantities: {'westerhof1969/total_peripheral_resistance': resistor_resistance, 'westerhof1969/pressure_decay_time_constant': diastolic_time_constant}
  conditions_ok: "The measurement is on the 1969 electrical analog of a generic normal adult human systemic tree, not in a subject; this paper's C is its estimate for the same generic human systemic tree. The analog's total peripheral resistance R = 1420 is used as Rp (p. 1: 'The Rp represents the peripheral resistance'); the comparison tests whether this paper's compliance for man matches the analog's lumped compliance."
  basis: "p. 5: 'The total arterial capacitance (C) was calculated assuming a time function of exp(-t/RpC) = exp(-t/tau) for the diastolic pressure wave', with man data 'taken from the literature (22, 26, 27)'. westerhof1969 p. 136 says the measured decay times equal 'the respective RC' of the analog, R its peripheral resistance and C 'the summation of all the capacitors'. The 1969 analog is the system the three-element model was reduced from (p. 1: 'resulted from the work on a very extensive electrical model of the systemic arterial tree (26, 27)')."
- id: val_tau_man_vs_analog_high_caption
  model: tau_rpc
  inputs: {Rp: 'westerhof1969/R_high', C: c_man_syst}
  output: tau
  against: 'westerhof1969/tau_high'
  purpose: validation
  quantities: {'westerhof1969/total_peripheral_resistance': resistor_resistance, 'westerhof1969/pressure_decay_time_constant': diastolic_time_constant}
  conditions_ok: "Analog of a generic human tree at high peripheral resistance; Rp is the R = 3600 printed in the 1969 Fig. 9(b) caption. The 1969 text says the resistances were made 'twice as large' (2840), so the condition is open (q_val_analog_decay) and both readings are entered."
  basis: "As val_tau_man_vs_analog_normal: tau = Rp C (p. 5), and the analog's decay time equals its RC (westerhof1969 p. 136); here at the high-resistance setting as the 1969 Fig. 9(b) caption gives it."
- id: val_tau_man_vs_analog_high_twice
  model: tau_rpc
  inputs: {Rp: 'westerhof1969/R_high_twice', C: c_man_syst}
  output: tau
  against: 'westerhof1969/tau_high'
  purpose: validation
  quantities: {'westerhof1969/total_peripheral_resistance': resistor_resistance, 'westerhof1969/pressure_decay_time_constant': diastolic_time_constant}
  conditions_ok: "Analog of a generic human tree at high peripheral resistance; Rp is the 1969 record's added 2 x 1420 (its text: 'twice as large'), the alternative to the caption's 3600 (q_val_analog_decay)."
  basis: "As val_tau_man_vs_analog_normal: tau = Rp C (p. 5), and the analog's decay time equals its RC (westerhof1969 p. 136); here at the high-resistance setting as the 1969 text gives it."
- id: val_tau_man_vs_analog_low
  model: tau_rpc
  inputs: {Rp: 'westerhof1969/R_low', C: c_man_syst}
  output: tau
  against: 'westerhof1969/tau_low'
  purpose: validation
  quantities: {'westerhof1969/total_peripheral_resistance': resistor_resistance, 'westerhof1969/pressure_decay_time_constant': diastolic_time_constant}
  conditions_ok: "Analog of a generic human tree at low peripheral resistance, R = 850 (1969 Fig. 9(c) caption)."
  basis: "As val_tau_man_vs_analog_normal: tau = Rp C (p. 5), and the analog's decay time equals its RC (westerhof1969 p. 136); here at the low-resistance setting."
- id: val_tau_man_vs_analog_stiff
  model: tau_rpc
  inputs: {Rp: 'westerhof1969/R_normal', C: c_man_syst_halved}
  output: tau
  against: 'westerhof1969/tau_stiff'
  purpose: validation
  quantities: {'westerhof1969/total_peripheral_resistance': resistor_resistance, 'westerhof1969/pressure_decay_time_constant': diastolic_time_constant}
  conditions_ok: "Analog of a generic human tree at normal resistance with every capacitance divided by 2 (westerhof1969 k_stiff); neither paper states the total compliance for this setting, so C is the added c_man_syst_halved."
  basis: "As val_tau_man_vs_analog_normal: tau = Rp C (p. 5); westerhof1969 p. 136 gives the stiff system's decay time as its RC with all capacitance values halved."

# ---- Cross-validation with stergiopulos1999 (which cites this paper as its ref. 22) ----
# The three-element model of Fig. 1A, run with stergiopulos1999's printed values for dog 71 (Table 1:
# R_p, standard Z_c, C_PPM or C_AR), against the input impedance measured in that dog (stergiopulos1999
# Fig. 5, squares at harmonics 1-5). Those element values were derived from the same dog's pressure and
# flow: Z_c as the mean measured modulus over harmonics 3-10 (which includes harmonics 3-5 plotted) and
# R_p as mean pressure over mean flow. The modulus comparisons are therefore entered as fit quality; the
# phase was used for no element value and is a test (q_val_stergiopulos_fit).
- id: val_3el_dog71_cppm_mod
  model: impedance_3el
  inputs: {Rc: 'stergiopulos1999/rc_std_d71', Rp: 'stergiopulos1999/rp_d71', C: 'stergiopulos1999/cppm_d71'}
  sweep: {f: 'stergiopulos1999/fig5_mod_measured_fig'}
  output: modulus
  against: 'stergiopulos1999/fig5_mod_measured_fig'
  purpose: fit_quality
  quantities: {'stergiopulos1999/characteristic_impedance': resistor_resistance, 'stergiopulos1999/peripheral_resistance': resistor_resistance, 'stergiopulos1999/total_arterial_compliance': total_arterial_compliance, 'stergiopulos1999/frequency': frequency, 'stergiopulos1999/input_impedance_modulus': input_impedance_modulus}
  conditions_ok: "The model's R_c and R_p are the two resistors of the Fig. 1A network; stergiopulos1999 gives for dog 71 the R_c (its Z_c) and R_p of the same three-element network, so the network is run on the measured dog's own values. This paper's Table 1 values (for its hydraulic models) are not used."
  basis: "Fitted, not a test: stergiopulos1999 p. 2, 'Zc was estimated from the average of the modulus of the Zin between the 3rd and 10th harmonics' and 'From mean pressure and mean flow, Rp was calculated by division', both from the same dog's recording whose input impedance Fig. 5's squares show. The model is this paper's Fig. 1A, which p. 1 says describes the input impedance of 'all major beds of the arterial systems of both man and dog'; stergiopulos1999 p. 1 credits the three-element windkessel to this paper (ref. 22): it 'can fit experimental data well (15, 18, 22)'."
- id: val_3el_dog71_cppm_phase
  model: impedance_3el
  inputs: {Rc: 'stergiopulos1999/rc_std_d71', Rp: 'stergiopulos1999/rp_d71', C: 'stergiopulos1999/cppm_d71'}
  sweep: {f: 'stergiopulos1999/fig5_ph_measured_fig'}
  output: phase
  against: 'stergiopulos1999/fig5_ph_measured_fig'
  purpose: validation
  quantities: {'stergiopulos1999/characteristic_impedance': resistor_resistance, 'stergiopulos1999/peripheral_resistance': resistor_resistance, 'stergiopulos1999/total_arterial_compliance': total_arterial_compliance, 'stergiopulos1999/frequency': frequency, 'stergiopulos1999/input_impedance_phase': input_impedance_phase}
  conditions_ok: "The model's R_c and R_p are the two resistors of the Fig. 1A network; stergiopulos1999 gives for dog 71 the R_c (its Z_c) and R_p of the same three-element network, so the network is run on the measured dog's own values."
  basis: "p. 1: the Fig. 1A model describes the input impedance, whose phase is 'quite strongly negative at low frequencies and about zero or positive for higher frequencies', in 'all major beds of the arterial systems of both man and dog'. The dog 71 elements come from the modulus (Z_c), the mean pressure and flow (R_p) and the pulse pressure method (C_PPM; stergiopulos1999 p. 2), not from the measured phase, so the phase is a test. C_PPM is the C with which stergiopulos1999's own Fig. 5 lines are reproduced (its figures.md)."
- id: val_3el_dog71_car_mod
  model: impedance_3el
  inputs: {Rc: 'stergiopulos1999/rc_std_d71', Rp: 'stergiopulos1999/rp_d71', C: 'stergiopulos1999/car_d71'}
  sweep: {f: 'stergiopulos1999/fig5_mod_measured_fig'}
  output: modulus
  against: 'stergiopulos1999/fig5_mod_measured_fig'
  purpose: fit_quality
  quantities: {'stergiopulos1999/characteristic_impedance': resistor_resistance, 'stergiopulos1999/peripheral_resistance': resistor_resistance, 'stergiopulos1999/total_arterial_compliance': total_arterial_compliance, 'stergiopulos1999/frequency': frequency, 'stergiopulos1999/input_impedance_modulus': input_impedance_modulus}
  conditions_ok: "As val_3el_dog71_cppm_mod, with dog 71's area-method C_AR, the other 'actual' C of stergiopulos1999 (q_val_stergiopulos_fit)."
  basis: "As val_3el_dog71_cppm_mod: Z_c and R_p come from the same dog's measured impedance and means (stergiopulos1999 p. 2), so this is fit quality; C_AR is from the area method (stergiopulos1999 p. 2, 'C was estimated using the area method')."
- id: val_3el_dog71_car_phase
  model: impedance_3el
  inputs: {Rc: 'stergiopulos1999/rc_std_d71', Rp: 'stergiopulos1999/rp_d71', C: 'stergiopulos1999/car_d71'}
  sweep: {f: 'stergiopulos1999/fig5_ph_measured_fig'}
  output: phase
  against: 'stergiopulos1999/fig5_ph_measured_fig'
  purpose: validation
  quantities: {'stergiopulos1999/characteristic_impedance': resistor_resistance, 'stergiopulos1999/peripheral_resistance': resistor_resistance, 'stergiopulos1999/total_arterial_compliance': total_arterial_compliance, 'stergiopulos1999/frequency': frequency, 'stergiopulos1999/input_impedance_phase': input_impedance_phase}
  conditions_ok: "As val_3el_dog71_cppm_phase, with dog 71's area-method C_AR (q_val_stergiopulos_fit)."
  basis: "As val_3el_dog71_cppm_phase: the Fig. 1A model's phase for the dog's own elements; no element value was taken from the measured phase. C_AR is the area-method C of stergiopulos1999 p. 2."
