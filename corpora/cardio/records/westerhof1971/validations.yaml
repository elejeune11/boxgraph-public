# The three-element model of this paper (Fig. 1A), run with the Table 1 estimates for the systemic
# tree of man, judged against the human aortic input impedance measured in other work and plotted in
# westerhof2009 (Fig. 4, adapted from its ref. 76; Fig. 6, Murgo et al. 1980, its ref. 39). The Table 1
# values are this paper's estimates for man, made before and independently of those measurements, and
# are not fitted to them, so these are validations. The windkessel curves drawn in westerhof2009's
# figures are fitted to the data, but they are not this model's run: here only the Table 1 values enter.

- id: val_3el_man_vs_murgo_typeA_mod
  model: impedance_3el
  inputs: {Rc: rc_man_syst, Rp: rp_man_syst, C: c_man_syst}
  sweep: {f: 'westerhof2009/fig6_A_mod_data_fig'}
  output: modulus
  against: 'westerhof2009/fig6_A_mod_data_fig'
  purpose: validation
  quantities: {'westerhof2009/frequency': frequency, 'westerhof2009/input_impedance_modulus': input_impedance_modulus}
  conditions_ok: "Table 1 gives estimates for a generic normal adult man; the measurement is the averaged aortic input impedance of type A beats in normal men (Murgo et al.). Both are the input impedance of the human systemic arterial tree, so the comparison tests whether the model with the man estimates is of the right size, not a subject-specific prediction."
  basis: "p. 1: the three-element model of Fig. 1A stands for the input impedance of the arterial tree, 'This qualitative description of the input impedance is correct for all major beds of the arterial systems of both man and dog'; Table 1 gives its parameter values for man (systemic). westerhof2009 p. 3 draws its Fig. 6 human aortic impedance with the three-element windkessel, which it cites to this paper (ref. 73)."
- id: val_3el_man_vs_murgo_typeA_phase
  model: impedance_3el
  inputs: {Rc: rc_man_syst, Rp: rp_man_syst, C: c_man_syst}
  sweep: {f: 'westerhof2009/fig6_A_ph_data_fig'}
  output: phase
  against: 'westerhof2009/fig6_A_ph_data_fig'
  purpose: validation
  quantities: {'westerhof2009/frequency': frequency, 'westerhof2009/input_impedance_phase': input_impedance_phase}
  conditions_ok: "Table 1 gives estimates for a generic normal adult man; the measurement is the averaged aortic input impedance of type A beats in normal men (Murgo et al.). Both are the input impedance of the human systemic arterial tree, so the comparison tests whether the model with the man estimates is of the right size, not a subject-specific prediction."
  basis: "p. 1: the three-element model of Fig. 1A stands for the input impedance of the arterial tree, whose phase is 'quite strongly negative at low frequencies and about zero or positive for higher frequencies' in man and dog; Table 1 gives its parameter values for man (systemic). westerhof2009 p. 3 draws its Fig. 6 human aortic impedance with the three-element windkessel (ref. 73, this paper)."
