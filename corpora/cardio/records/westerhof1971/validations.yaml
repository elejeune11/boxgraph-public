  basis: "p. 1: the three-element model of Fig. 1A stands for the input impedance of the arterial tree of man and dog; Table 1 gives its parameter values for man (systemic). westerhof2009 p. 3 draws its Fig. 6 human aortic impedance with the three-element windkessel (ref. 73, this paper)."
