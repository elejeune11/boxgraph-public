  conditions_ok: "westerhof2009 calls Fig. 4 'an example of measured aortic input impedance' without naming the species or subject (question q_fig4_species_man). Its scale (about 1 mmHg s/ml at low frequency) is that of the human systemic tree, and the review's text around it concerns mammals generally; the comparison is made with the man estimates of Table 1 as a test of size, not of a subject."
  basis: "p. 1: the three-element model of Fig. 1A stands for the aortic input impedance of the systemic tree; Table 1 gives its values for man. westerhof2009 p. 3 plots Fig. 4's measured impedance against the three-element windkessel, which it cites to this paper (ref. 73)."
