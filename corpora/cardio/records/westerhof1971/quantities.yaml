- {id: resistor_resistance, name: hydraulic resistance of a resistor element of the mock arterial system, dimension: "[mass]/[length]**4/[time]", description: "pressure drop over flow of one resistor of the three-element model (R_p or R_c), as listed in Table 1"}
- {id: input_resistance_dc, name: d-c input resistance of the whole model, dimension: "[mass]/[length]**4/[time]", description: "modulus of the input impedance at zero frequency"}
- {id: total_arterial_compliance, name: total arterial compliance (model capacitance C), dimension: "[length]**4*[time]**2/[mass]"}
- {id: diastolic_time_constant, name: time constant of the diastolic pressure decay (tau = R_p C), dimension: "[time]"}
- {id: reservoir_air_volume, name: air volume above the liquid in the air-reservoir capacitance, dimension: "[length]**3"}
- {id: atmospheric_pressure, name: atmospheric pressure, dimension: "[pressure]"}
- {id: mean_arterial_pressure, name: mean arterial pressure (gauge), dimension: "[pressure]"}
- {id: tube_bore_diameter, name: bore diameter of the resistor conduits, dimension: "[length]"}
- {id: liquid_viscosity, name: dynamic viscosity of the perfusate, dimension: "[mass]/[length]/[time]"}
- {id: liquid_density, name: density of the perfusate, dimension: "[mass]/[length]**3"}
- {id: frequency, name: frequency of the oscillation, dimension: "1/[time]"}
- {id: quality_factor, name: quality factor Q = R/(omega L) of a resistor tube, dimension: "dimensionless"}
- {id: quality_factor_frequency_product, name: quality factor times frequency (the constant in Q = const/f), dimension: "1/[time]"}
- {id: tube_impedance_modulus_increase, name: relative increase of the modulus of the tube impedance over its d-c resistance, dimension: "dimensionless"}
- {id: tube_impedance_phase, name: phase angle of the tube impedance, dimension: "dimensionless"}
- {id: reynolds_number_max, name: largest Reynolds number accepted to avoid turbulence, dimension: "dimensionless"}
- {id: inlet_pressure_drop_coefficient, name: coefficient of the inlet-length extra pressure drop relative to Poiseuille drop (1.1 in Eq. 5), dimension: "dimensionless"}
- {id: accepted_nonlinearity, name: accepted ratio of extra (inlet) pressure drop to Poiseuille pressure drop, dimension: "dimensionless"}
- {id: turbulence_length_coefficient, name: numerical coefficient of the turbulence minimum-length criterion (Eq. 7a), dimension: "dimensionless"}
- {id: min_length_per_pressure_drop, name: "minimum resistor length per unit pressure drop (turbulence criterion, Eq. 11a)", dimension: "[length]/[pressure]"}
- {id: min_length_sq_per_pressure_drop, name: "squared minimum resistor length per unit pressure drop (inlet-length criterion, Eq. 11b)", dimension: "[length]**2/[pressure]"}
- {id: resistor_pressure_drop, name: maximum pressure drop over a resistor, dimension: "[pressure]"}
- {id: resistor_length, name: length of the resistor conduits (the minimum admissible length where Table 1 gives it), dimension: "[length]"}
- {id: resistance_per_length_per_tube, name: Poiseuille resistance of one conduit per unit length (the constant in R = const l/N), dimension: "[mass]/[length]**5/[time]"}
- {id: tube_count, name: number of conduits in parallel in a resistor, dimension: "dimensionless"}
- {id: input_impedance_modulus, name: modulus of the input impedance at a frequency, dimension: "[mass]/[length]**4/[time]", description: "|Z| against frequency, as plotted in Figs. 2-5"}
- {id: input_impedance_phase, name: phase angle of the input impedance at a frequency, dimension: "dimensionless", description: "phase of Z (pressure leading flow positive), as plotted in Figs. 2-5"}
