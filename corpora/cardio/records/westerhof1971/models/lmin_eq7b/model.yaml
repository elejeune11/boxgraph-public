id: lmin_eq7b
name: minimum resistor length from the inlet-length criterion (Eqs. 3, 5, 6, 7b, 11b)
role: model
stated: {page: 2, printed_page: "777", quote: "Substitution of equations 6 and 3 into equation 5 gives", where: Eq. 7b}
equation: "DeltaP_e/DeltaP_p = (1.1/8)(r/l) R_e <= 0.1 (5); with (3) and (6): l^2 >= (11/64) r DeltaP r^3 rho/mu^2 (7b)"
inputs:
  a: {quantity: inlet_pressure_drop_coefficient, unit: dimensionless, description: "the 1.1 of Eq. 5"}
  eps: {quantity: accepted_nonlinearity, unit: dimensionless, description: "the 0.1 of Eq. 5"}
  d: {quantity: tube_bore_diameter, unit: mm, description: "bore; r = d/2"}
  rho: {quantity: liquid_density, unit: g/cm^3}
  mu: {quantity: liquid_viscosity, unit: poise}
outputs:
  k11b: {quantity: min_length_sq_per_pressure_drop, unit: cm^2/mmHg, description: "l_min^2/DeltaP of Eq. 11b"}
settings: {}
stochastic: false
