id: air_volume_eq9
name: air volume of the reservoir for a desired capacitance (Eq. 9)
role: model
stated: {page: 2, printed_page: "777", quote: "From PV = RT and C = dV/dP it", where: Eq. 9}
equation: "C = V/P, P = atmospheric pressure plus mean arterial pressure (p. 3)"
inputs:
  C: {quantity: total_arterial_compliance, unit: cm^4*s^2/g}
  Patm: {quantity: atmospheric_pressure, unit: mmHg}
  Pmean: {quantity: mean_arterial_pressure, unit: mmHg}
outputs:
  V: {quantity: reservoir_air_volume, unit: cm^3}
settings: {}
stochastic: false
