id: lmin_eq7a
name: minimum resistor length from the turbulence criterion (Eqs. 3, 6, 7a, 11a)
role: model
stated: {page: 2, printed_page: "777", quote: "Substitution of equation 6 into equation 3, and assuming that", where: Eq. 7a}
equation: "R_e = vbar r/nu (3); vbar = DeltaP r^2/(8 mu l) (6); R_e < 1100 gives l > 1.14 10^-4 DeltaP r^3 rho/mu^2 (7a)"
inputs:
  Re: {quantity: reynolds_number_max, unit: dimensionless}
  d: {quantity: tube_bore_diameter, unit: mm, description: "bore; r = d/2"}
  rho: {quantity: liquid_density, unit: g/cm^3}
  mu: {quantity: liquid_viscosity, unit: poise}
outputs:
  c7a: {quantity: turbulence_length_coefficient, unit: dimensionless, description: "1/(8 Re), the constant of Eq. 7a"}
  k11a: {quantity: min_length_per_pressure_drop, unit: cm/mmHg, description: "l_min/DeltaP of Eq. 11a"}
settings: {}
stochastic: false
