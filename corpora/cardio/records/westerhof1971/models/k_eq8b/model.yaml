id: k_eq8b
name: Poiseuille resistance constant of the conduits (Eq. 8b, R = const l/N)
role: model
stated: {page: 2, printed_page: "777", quote: "A resistance of lower value is obtained by using N tubes in parallel", where: Eq. 8b}
equation: "R = 8 mu l/(pi r^4 N)  (8b); R ≅ 1.5 10^5 l/N"
inputs:
  d: {quantity: tube_bore_diameter, unit: mm, description: "bore; r = d/2"}
  mu: {quantity: liquid_viscosity, unit: poise}
outputs:
  K: {quantity: resistance_per_length_per_tube, unit: g/cm^5/s, description: "8 mu/(pi r^4)"}
settings: {}
stochastic: false
