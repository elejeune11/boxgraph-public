id: q_eq2
name: quality factor of a resistor tube (Eq. 2, Womersley small alpha)
role: model
stated: {page: 1, printed_page: "776", quote: "factor of the resistor", where: Eq. 2}
equation: "Q = 6/alpha^2 >> 1; alpha^2 = r^2 omega/nu; omega = 2 pi f; nu = mu/rho"
inputs:
  d: {quantity: tube_bore_diameter, unit: mm, description: "bore; r = d/2"}
  mu: {quantity: liquid_viscosity, unit: poise}
  rho: {quantity: liquid_density, unit: g/cm^3}
  f: {quantity: frequency, unit: Hz}
outputs:
  Q: {quantity: quality_factor, unit: dimensionless}
  Qf: {quantity: quality_factor_frequency_product, unit: Hz, description: "Q times f, the constant of Eq. 10"}
settings: {}
stochastic: false
