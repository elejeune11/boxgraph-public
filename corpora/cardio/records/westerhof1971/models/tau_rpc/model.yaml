id: tau_rpc
name: diastolic decay time constant tau = R_p C
role: model
stated: {page: 5, printed_page: "780", quote: "The total arterial capacitance (C) was calculated assuming a", where: "p. 5, exp(-t/RpC) = exp(-t/tau); Table 1 row tau = RpC"}
equation: "tau = R_p C"
inputs:
  Rp: {quantity: resistor_resistance, unit: g/cm^4/s}
  C: {quantity: total_arterial_compliance, unit: cm^4*s^2/g}
outputs:
  tau: {quantity: diastolic_time_constant, unit: s}
settings: {}
stochastic: false
