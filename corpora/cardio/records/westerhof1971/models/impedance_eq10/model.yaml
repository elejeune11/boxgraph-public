id: impedance_eq10
name: modulus increase and phase of a resistor tube impedance from Q (Eq. 10)
role: model
stated: {page: 2, printed_page: "777", quote: "the inverse of the tangent of the phase angle of the impedance of the tube", where: "text below Eq. 2; Eq. 10"}
equation: "Q = R/(omega L) = 1/tan(phi); Q ≅ 25/f; |Z_t| = sqrt(R^2 + (omega L)^2)"
from_words: true
inputs:
  Qf: {quantity: quality_factor_frequency_product, unit: Hz, description: "the constant in Q = Qf/f (25 in Eq. 10)"}
  f: {quantity: frequency, unit: Hz}
outputs:
  Q: {quantity: quality_factor, unit: dimensionless}
  dmod: {quantity: tube_impedance_modulus_increase, unit: percent, description: "(|Z_t|/R - 1) x 100"}
  phase: {quantity: tube_impedance_phase, unit: degree}
settings: {}
stochastic: false
