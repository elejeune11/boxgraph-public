- {id: ref_dt_simplified, run: run_simplified, setting: dt, factors: [1, 2, 4], mode: divide, output: Plv_max, tolerance: "0.1%", tolerance_basis: "added: a step error well below the printed precision of the peak pressures (0.1 mmHg in 117.4 mmHg)", tolerance_added: true}
- {id: ref_dt_kg_atrial, run: run_kg_atrial, setting: dt, factors: [1, 2, 4], mode: divide, output: l_min, tolerance: "0.5%", tolerance_basis: "added: below the printed precision of the displacement (0.0001 m in 0.0286 m)", tolerance_added: true}
- {id: ref_dt_valves_signed, run: run_valves_signed, setting: dt, factors: [1, 2, 4], mode: divide, output: Qao_max, tolerance: "0.1%", tolerance_basis: "added: below the printed precision of the peak flows (0.1 ml/s in 1088.6 ml/s is 0.01%; 0.1% allows for the clamped leaflet limits)", tolerance_added: true}
- {id: ref_dt_all_signed, run: run_all_signed, setting: dt, factors: [1, 2, 4], mode: divide, output: Plv_max, tolerance: "0.1%", tolerance_basis: "added: as for ref_dt_simplified", tolerance_added: true}
