  text: >
    The chapter reports "the converged solution of the 11th period, from the 10th to the 11th second"
    (p. 23) but its figures plot the response from 10 s to about 11.1 s. The record takes every statistic
    over 10 s <= t < 11 s. The atrial contraction (T_pwb = 0.92 s, T_pww = 0.09 s) wraps across the end of
