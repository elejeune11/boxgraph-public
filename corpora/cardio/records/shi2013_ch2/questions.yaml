- id: q_eq2_13_sign
  kind: possible_error
  about: [circulation_ch2, circulation_ch2_signed, run_valves, run_all]
  text: >
    The second branch of Eq. 2-13 (P_lv < P_sas) is printed as +CQ_ao AR_ao sqrt(P_sas - P_lv), with no
    minus sign, so a valve flow is never negative and the regurgitant flows the chapter reports (feature
    FQ1) cannot arise; with leaflet dynamics an open leaflet then carries forward flow against an adverse
    pressure difference. With on-off valves (Eq. 2-14) AR = 0 on that branch and the sign does not matter.
    The record runs Eq. 2-13 as printed (run_valves, run_all) and with the sign corrected
    (circulation_ch2_signed: run_valves_signed, run_all_signed).
  citation: {page: 17, printed_page: "65", quote: "the basic pressure-flow relation in the aortic valve is described", where: "Eq. 2-13"}
- id: q_kg_units
  kind: possible_error
  about: [circulation_ch2, Kst_la, Kst_lv, Kf_sav, Ke_sav, m_sav, run_kg]
  text: >
    Eq. 2-10 is a force balance, M_sav d2l/dt2 = K_e,la e_la - K_e,lv e_lv + (P_lv - P_la) A_sav - k_f,sav
    dl/dt - k_e,sav l, but Table 2-3 gives coefficients named K_st,la, K_st,lv (not K_e,la, K_e,lv) with
    the unit m/(s^2 mmHg), K_f,sav in 1/s and K_e,sav in 1/s^2, i.e. per unit mass, and the tissue-force
    term K_st e (e in mmHg/ml) is m/(s^2 ml) in either reading, neither a force nor an acceleration. The
    record takes K_st e numerically (dropping the per-ml factor) and runs two readings: Eq. 2-10 as
    printed with M_sav multiplying the acceleration and the Table 2-3 numbers as the coefficients
    (kg_form eq2_10, the record's choice), and every term divided by the mass, as the Table 2-3 units say
    (model setting kg_form: per_mass). The pressure term is converted to SI (mmHg to Pa) in both. In the
    per-mass reading the pressure term alone, (P_lv - P_la) A_sav/m_sav, is about 15000 m/s^2 in systole,
    and with K_e,sav = 9000 1/s^2 a static displacement of order 1 m (A_sav l about 800 ml) results; run
    by the reader with the KG-alone settings it diverges (non-finite state within the first beat), so it
    gives no value to compare and is not recorded as a run. With K_f,sav = 0.0004 1/s the per-mass oscillator (natural frequency 15 Hz) is almost
    undamped. Neither reading gives the smooth displacement of Fig. 2-12 reaching -0.0286 m.
  citation: {page: 22, printed_page: "70", quote: "Table 2-3 Parameters for KG diaphragm motion modelling", where: "Eq. 2-10, Table 2-3"}
- id: q_kg_volume
  kind: reading
  about: [circulation_ch2]
  text: >
    Eqs. 2-11 and 2-12 write V_lv = V_lv + A_sav l and V_la = V_la - A_sav l. The record reads them as
    the chamber volume used in Eq. 2-4 being the volume integrated from the valve flows (Eq. 2-1) plus
    (ventricle) or minus (atrium) the displaced volume A_sav l at that instant, with A_sav l converted
    from m^3 to ml, and reports chamber volumes including that term. Applying the correction cumulatively
