id: elastance_ch2
name: left ventricular and left atrial elastance over a heart cycle (Eqs. 2-2, 2-3, 2-5, 2-6)
role: model
stated: {page: 12, printed_page: "60", quote: "The time-varying ventricle elastance is a function of the characteristic elastance", where: "Eqs. 2-2, 2-3 (pp. 12-13), 2-5, 2-6 (p. 14)"}
equation: >
  e_lv(t) = E_lv,d + (E_lv,s - E_lv,d)/2 ebar_lv(t) (2-2);
  ebar_lv = 1 - cos(t/T_s1 pi), 0<=t<T_s1; 1 + cos((t - T_s1)/(T_s2 - T_s1) pi), T_s1<=t<T_s2; 0, T_s2<=t<T (2-3);
  e_la(t) = E_la,min + (E_la,max - E_la,min)/2 ebar_la(t) (2-5);
  ebar_la = 1 - cos((t - T_pwb + T)/T_pww 2pi), 0<=t<T_pwb+T_pww-T; 0; 1 - cos((t - T_pwb)/T_pww 2pi), T_pwb<=t<T (2-6);
  t taken modulo T
inputs:
  Elvs: {quantity: chamber_elastance, unit: mmHg/ml}
  Elvd: {quantity: chamber_elastance, unit: mmHg/ml}
  Ela_max: {quantity: chamber_elastance, unit: mmHg/ml}
  Ela_min: {quantity: chamber_elastance, unit: mmHg/ml}
  T: {quantity: heart_period, unit: s}
  Ts1: {quantity: time_peak_systole, unit: s}
  Ts2: {quantity: time_end_systole, unit: s}
  Tpwb: {quantity: p_wave_onset, unit: s}
  Tpww: {quantity: p_wave_duration, unit: s}
  t: {quantity: time, unit: s}
outputs:
  elv: {quantity: lv_elastance, unit: mmHg/ml}
  ela: {quantity: la_elastance, unit: mmHg/ml}
settings: {}
stochastic: false
