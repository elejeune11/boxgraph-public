  CQmi: {quantity: valve_flow_coefficient, unit: ml/(s*mmHg^0.5)}
  CQpo: {quantity: valve_flow_coefficient, unit: ml/(s*mmHg^0.5)}
  CQti: {quantity: valve_flow_coefficient, unit: ml/(s*mmHg^0.5)}
  Elvs: {quantity: chamber_elastance, unit: mmHg/ml}
  Elvd: {quantity: chamber_elastance, unit: mmHg/ml}
  Plv0: {quantity: chamber_reference_pressure, unit: mmHg}
  Vlv0: {quantity: chamber_reference_volume, unit: ml}
  Ela_max: {quantity: chamber_elastance, unit: mmHg/ml}
  Ela_min: {quantity: chamber_elastance, unit: mmHg/ml}
  Pla0: {quantity: chamber_reference_pressure, unit: mmHg}
  Vla0: {quantity: chamber_reference_volume, unit: ml}
  Ervs: {quantity: chamber_elastance, unit: mmHg/ml}
  Ervd: {quantity: chamber_elastance, unit: mmHg/ml}
  Prv0: {quantity: chamber_reference_pressure, unit: mmHg}
  Vrv0: {quantity: chamber_reference_volume, unit: ml}
  Era_max: {quantity: chamber_elastance, unit: mmHg/ml}
  Era_min: {quantity: chamber_elastance, unit: mmHg/ml}
