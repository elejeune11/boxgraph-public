id: circulation_ch2
name: closed-loop circulation with variable-elastance chambers, KG diaphragm motion and on-off or leaflet-dynamics valves (Eqs. 2-1 to 2-23)
role: model
stated: {page: 11, printed_page: "59", quote: "Components of the whole circulation system are modelled as illustrated in Figure 2-5", where: "Eqs. 2-1 to 2-23, Fig. 2-5"}
equation: >
  dV_lv/dt = Q_mi - Q_ao (2-1); e_lv(t) = E_lv,d + (E_lv,s - E_lv,d)/2 ebar_lv(t) (2-2);
  ebar_lv = 1 - cos(t/T_s1 pi), 0<=t<T_s1; 1 + cos((t - T_s1)/(T_s2 - T_s1) pi), T_s1<=t<T_s2; 0, T_s2<=t<T (2-3);
  P_lv = P_lv,0 + e_lv (V_lv - V_lv,0) (2-4); without atrial contraction e_la = E_la,min;
  with it e_la(t) = E_la,min + (E_la,max - E_la,min)/2 ebar_la(t) (2-5),
  ebar_la = 1 - cos((t - T_pwb + T)/T_pww 2pi), 0<=t<T_pwb+T_pww-T; 0; 1 - cos((t - T_pwb)/T_pww 2pi), T_pwb<=t<T (2-6);
  M_sav d2l/dt2 = K_e,la e_la - K_e,lv e_lv + (P_lv - P_la) A_sav - k_f,sav dl/dt - k_e,sav l (2-10);
  V_lv = V_lv + A_sav l (2-11); V_la = V_la - A_sav l (2-12);
  Q_ao = CQ_ao AR_ao sqrt(P_lv - P_sas), P_lv>=P_sas; CQ_ao AR_ao sqrt(P_sas - P_lv), P_lv<P_sas (2-13);
  AR_ao = 1 if P_lv>=P_sas else 0 (2-14) or AR_ao = (1 - cos theta)^2/(1 - cos theta_max)^2 (2-15);
  d2theta/dt2 = K_p,ao (P_lv - P_sas) cos theta - K_f,ao dtheta/dt (2-17);
  dP_sas/dt = (Q_ao - Q_sas)/C_sas (2-18); dQ_sas/dt = (P_sas - P_sat - R_sas Q_sas)/L_sas (2-19);
  dP_sat/dt = (Q_sas - Q_sat)/C_sat (2-20); dQ_sat/dt = (P_sat - P_svn - (R_sat + R_sar + R_scp) Q_sat)/L_sat (2-21);
  dP_svn/dt = (Q_sat - Q_svn)/C_svn (2-22); Q_svn = (P_svn - P_ra)/R_svn (2-23);
  right heart, other valves and pulmonary loop "similar"
