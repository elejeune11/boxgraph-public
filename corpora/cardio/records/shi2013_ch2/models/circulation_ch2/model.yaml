settings:
  dt: 0.0001                 # Table 2-5
  t_end: 11.0                # "the converged solution of the 11th period, from the 10th to the 11th second"
  t_window: 10.0
  atrial_contraction: false  # true: Eqs. 2-5, 2-6; false: e_la = E_la,min
  kg_motion: false           # true: Eqs. 2-10 to 2-12
  valve_dynamics: false      # true: Eqs. 2-15, 2-17; false: Eq. 2-14
  kg_form: eq2_10            # eq2_10: Eq. 2-10 with M_sav as printed; per_mass: Table 2-3 units (q_kg_units)
stochastic: false
