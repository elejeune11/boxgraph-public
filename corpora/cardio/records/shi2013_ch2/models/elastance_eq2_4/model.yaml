id: elastance_eq2_4
name: left ventricular elastance implied by the pressure-volume law (Eq. 2-4)
role: model
stated: {page: 13, printed_page: "61", quote: "The pressure in the left ventricle is then derived from the instantaneous volume and elastance values", where: "Eq. 2-4"}
equation: >
  Plv = Plv,0 + elv (Vlv - Vlv,0) (2-4), here solved for elv: elv = (Plv - Plv,0)/(Vlv - Vlv,0).
  A helper for the relation to Suga et al. 1973, whose model the chapter says it adopts (pp. 12-13)
  and which is stated as the ratio E(t) = P(t)/[V(t) - Vd]; Eq. 2-4 as printed is the chamber law
  of circulation_ch2.
inputs:
  Plv: {quantity: lv_pressure, unit: mmHg}
  Vlv: {quantity: lv_volume, unit: ml}
  Plv0: {quantity: chamber_reference_pressure, unit: mmHg}
  Vlv0: {quantity: chamber_reference_volume, unit: ml}
outputs:
  elv: {quantity: lv_elastance, unit: mmHg/ml}
settings: {}
stochastic: false
