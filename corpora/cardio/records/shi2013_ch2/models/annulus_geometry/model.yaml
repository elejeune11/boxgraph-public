id: annulus_geometry
name: sectional area and mass of the annulus fibrosus from its diameter, thickness and density
role: model
stated: {page: 21, printed_page: "69", quote: "the annulus fibrosus has a sectional area of", where: text}
equation: "A = pi d^2 / 4 (circular section of diameter d); m = rho A h"
from_words: true
inputs:
  d: {quantity: annulus_diameter, unit: mm}
  h: {quantity: annulus_thickness, unit: mm}
  rho: {quantity: tissue_density, unit: kg/m^3}
outputs:
  A: {quantity: annulus_area, unit: m^2}
  m: {quantity: annulus_mass, unit: kg}
settings: {}
stochastic: false
