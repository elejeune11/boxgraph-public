id: circulation_ch2_signed
name: closed-loop circulation (Eqs. 2-1 to 2-23) with the reverse-flow sign of Eq. 2-13 corrected
role: model
stated: {page: 11, printed_page: "59", quote: "Components of the whole circulation system are modelled as illustrated in Figure 2-5", where: "Eqs. 2-1 to 2-23, Fig. 2-5"}
variant_of: circulation_ch2
corrections:
  - equation: Eq. 2-13
    change: "Q_ao = -CQ_ao AR_ao sqrt(P_sas - P_lv) for P_lv < P_sas (minus sign on the second branch), and likewise for the mitral, pulmonary and tricuspid valves"
    evidence: "The printed second branch is positive (p. 17), so a valve flow could never be negative, yet the chapter's purpose is to simulate 'regurgitant flow on valve closure' (p. 1), it reports regurgitant flows across all four valves with leaflet dynamics (feature FQ1, pp. 41, 47-48) and a pressure drop 'of about 16mmHg in the aorta' caused by aortic regurgitation (p. 41); a flow driven back by P_sas > P_lv must be negative. The authors' CellML code of the same circulation has the minus sign (korakianitis_cellml, TempCDv.cellml). With on-off valves (Eq. 2-14) AR = 0 on that branch, so the correction matters only with leaflet dynamics."
equation: >
  as circulation_ch2 except Q_ao = -CQ_ao AR_ao sqrt(P_sas - P_lv), P_lv < P_sas (2-13, corrected), and likewise
  for the other three valves
built_from: [circulation_ch2]
