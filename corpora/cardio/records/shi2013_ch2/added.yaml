- id: theta_max_added
  quantity: leaflet_max_angle
  unit: deg
  printed: "75"
  basis: >
    Eq. 2-15 needs the fully open leaflet angle theta_max, which the chapter does not state.
    Figs. 2-15 and 2-16 (pp. 37-38) plot the open leaflets of all four valves at about 75 degrees,
    and the authors' companion paper (korakianitis2006, Table 4) gives theta_max = 75 degrees.
  alternatives: ["60", "85"]
  stands_for: theta_max in Eq. 2-15 (all four valves)
- id: Vla_init_added
  quantity: initial_chamber_volume
  unit: ml
  printed: "20"
  basis: >
    Not stated (the text gives initial volumes for the ventricles only, p. 22). The authors' CellML
    code of the same circulation (korakianitis_cellml, shi_cellml_systemic) starts the atria at 20 ml.
  alternatives: ["50"]
  stands_for: initial left atrial volume
- id: Vra_init_added
  quantity: initial_chamber_volume
  unit: ml
  printed: "20"
  basis: Not stated; taken equal to the left atrium, as in the authors' CellML code.
  alternatives: ["50"]
  stands_for: initial right atrial volume
- id: Psas_init_added
  quantity: initial_vessel_pressure
  unit: mmHg
  printed: "100"
  basis: >
    Not stated: "Pressures for the vasculature can be set at the normal physiological ranges observed
    clinically" (p. 22). The authors' CellML code starts the aortic sinus at 100 mmHg.
  alternatives: ["80"]
  stands_for: initial P_sas
- id: Psat_init_added
  quantity: initial_vessel_pressure
  unit: mmHg
  printed: "100"
  basis: Not stated (p. 22). The authors' CellML code starts the systemic artery at 100 mmHg.
  alternatives: ["80"]
  stands_for: initial P_sat
- id: Psvn_init_added
  quantity: initial_vessel_pressure
  unit: mmHg
  printed: "0"
  basis: >
    Not stated (p. 22). The authors' CellML code starts the systemic vein at 0 mmHg. In a closed
    loop the initial state fixes the circulating volume and so every pressure and volume.
  alternatives: ["5"]
  stands_for: initial P_svn
- id: Ppas_init_added
  quantity: initial_vessel_pressure
  unit: mmHg
  printed: "30"
  basis: >
    Not stated (p. 22). The authors' CellML code of the closed loop (korakianitis_cellml) starts the
    pulmonary arteries at 30 mmHg.
  alternatives: ["15"]
  stands_for: initial P_pas
- id: Ppat_init_added
  quantity: initial_vessel_pressure
  unit: mmHg
  printed: "30"
  basis: Not stated; as P_pas, following the authors' CellML code.
  alternatives: ["15"]
  stands_for: initial P_pat
- id: Ppvn_init_added
  quantity: initial_vessel_pressure
  unit: mmHg
  printed: "0"
  basis: Not stated; as the systemic vein, following the authors' CellML code (veins at 0 mmHg).
  alternatives: ["5"]
  stands_for: initial P_pvn
