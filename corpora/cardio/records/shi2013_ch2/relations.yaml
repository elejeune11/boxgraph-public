- id: rel_pv_law_suga
  kind: reduces_to
  a: shi2013_ch2/elastance_eq2_4
  b: suga1973/pv_ratio
  mapping: {P: "Plv", V: "Vlv", Vd: "Vlv0"}
  output_map: {E: elv}
  limit: {Plv0: "0"}
  regime: {Plv: [5, 150], Vlv: [60, 150], Plv0: [0.5, 2], Vlv0: [2, 40]}
  provenance: stated
  citation: {page: 12, printed_page: "60", quote: "ventricular pressure is described as a linear function of the chamber volume and the chamber elastance", where: "text before Eq. 2-1; Eq. 2-4 (p. 13)"}
  assumptions:
    - "The chapter names Suga et al.'s variable elastance model for its pressure-volume law (pp. 12, 13) and prints it as Eq. 2-4 with a reference pressure Plv,0; Suga's E(t) = P(t)/[V(t) - Vd] has none, so the chapter's law becomes Suga's when Plv,0 -> 0, with Vlv,0 in the role of Vd."
    - "Suga's P is the total left ventricular pressure and Vd the volume-axis intercept of the end-systolic line; mapping them to the chapter's Plv and Vlv,0 joins the forms, not the quantities (the chapter prints Vlv,0 = 5.0 ml, Suga measures Vd in dogs)."
    - "elastance_eq2_4 is Eq. 2-4 solved for elv, entered as a helper so the two laws give the same output."
- id: rel_elastance_suga
  kind: derived_from
  a: suga1973/elastance_normalized
  b: shi2013_ch2/elastance_ch2
  mapping: {Elvs: "Emax", Ts1: "Tmax/1000", t: "t/1000"}
  output_map: {elv: E}
  steps:
    - "take Suga et al.'s variable elastance model E(t) = Emax EN(t/Tmax) (p. 12)"
    - "replace the measured normalized curve EN by 'a commonly used activation function' (Eq. 2-3, p. 13), raised from E_lv,d to E_lv,s (Eq. 2-2)"
    - "for the atrium, adopt the same model with the values of parameters and the form of the activation function adapted (Eqs. 2-5, 2-6, p. 13)"
  provenance: stated
  citation: {page: 13, printed_page: "61", quote: "Again Suga et al.'s variable elastance model (Suga et al. 1973) is adopted", where: "text before Eq. 2-5; also p. 12 before Eq. 2-1"}
  assumptions:
    - "Eq. 2-2 peaks at t = T_s1 with e_lv = E_lv,s, so E_lv,s plays the role of Emax and T_s1 of Tmax (ms in Suga, s in the chapter); the chapter's other inputs (E_lv,d, T_s2, T, the atrial ones) have no counterpart in Suga's two-parameter description."
    - "Suga's EN is only plotted (Fig. 5), so elastance_normalized does not run and the relation cannot be tested; the chapter's words stand as the evidence. Whether the cosine activation of Eq. 2-3 follows Suga's EN is a question for the figure reading, not for this relation."
