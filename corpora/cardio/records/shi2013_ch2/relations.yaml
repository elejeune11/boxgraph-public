  reason: &creason >
    Neither source states this relation. The chapter never mentions the CellML code; it is "adapted
    from" Korakianitis and Shi 2006, Med. Eng. Phys. 28, 613-628 (p. 1, ref-korakianitis-shi2006a), and
    the CellML documentation cites the same paper as its ref. 1 (korakianitis_cellml ref-korakianitis2006mep)
    among the C original it ports, by the same author (Shi). Their equations are the same: the chamber law
    with activation 1 - cos / 1 + cos (Eqs. 2-2 to 2-4; EVentricle.cellml), the orifice law with on-off
    valves (Eqs. 2-13, 2-14; TempCDa/TempCDv, where the reverse branch is multiplied by Tao = 0, so the
    sign of Eq. 2-13's reverse branch, q_eq2_13_sign in this record, does not matter), the R-L-C loops with the
    arteriole and capillary resistances in series with the artery (Eq. 2-21; TempR carrying Qsat), and
    the same atrial activation, including its wrap past T into the next beat (Eq. 2-6; EAtrium.cellml
    line 22). What the chapter's simplified configuration leaves out is atrial contraction ("without
    atrial contraction e_la = E_la,min"), which the code always has. With the atrial elastance held at its
    minimum (E_a,max -> E_a,min) the two codes, run side by side at the code's values (R_pvn = 0.006),
    agree on every shared output to about 1e-9 (scratch run, build/cardio/relate-check). Hence reduces_to
    in that limit. The chapter's atrial-contraction configuration would be the code itself, but it is a
    setting of circulation_ch2, not an input, and is not tested here; the KG diaphragm and leaflet-dynamics
    configurations have no counterpart in the code.
  assumptions:
    - "The limit E_a,max -> E_a,min is taken at E_a,min = 0.15 mmHg/ml, the value both print (Table 2-1; ParaHeart.cellml); the relation tester takes limits to a number, so E_a,min is held at that point."
    - "T is held at 1 s: the chapter's code reports [10 s, 10 s + T) and the port [t_end - T, t_end] with t_end = 11 s, the same cycle only for T = 1 s; the code's timing fractions then equal the chapter's times."
    - "The code's pi is held at the constant pi; at the code's 3.14159 the outputs move by about 1e-6."
    - "The code's initial vessel flows are held at zero, where the chapter's model starts them."
    - "b's KG diaphragm and leaflet inputs are mapped to the chapter's values; they do nothing with kg_motion and valve_dynamics off."
- id: rel_simplified_from_cellml_co
  kind: reduces_to
  a: korakianitis_cellml/closed_loop_onoff
  b: shi2013_ch2/circulation_ch2
  mapping: *cmap
  output_map: {CO: Q_ao_mean}
  limit: *climit
  regime: *cregime
  tolerance: 0.00001
  provenance: proposed
  reason: *creason
  assumptions:
    - "As rel_simplified_from_cellml_psas, for the mean aortic flow; the code averages one period by the trapezoidal rule over both end points, the chapter by the sample mean over [10 s, 11 s), which agree only to the extent the 11th cycle is periodic."
    - "The tolerance (1e-5) is ours: it admits the difference of the two averaging rules (about 3e-6 in the limit at the regime's samples), not a difference of the models."
