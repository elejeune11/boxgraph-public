  reason: &reason >
    No source states this relation: the chapter is adapted from the authors' two 2006 Medical
    Engineering & Physics papers (p. 1, ref-korakianitis-shi2006a, -2006b), not from korakianitis2006
    (J. Biomech.), and cites none of its values. But the chapter's simplified model is the same
    authors' circulation: the same chamber law (Eqs. 2-2 to 2-4; korakianitis2006's Eqs. 2-4, with the activation 1 - cos / 1 + cos that korakianitis2006's record takes as the
    evident correction of its Eq. 3), the same orifice law with on-off valves (Eqs. 2-13, 2-14;
    Eqs. 6, 7), and the same R-L-C loops with the artery flow driven by P_sat - P_svn (Eq. 2-21; the
    corrected Eq. 18). What the chapter's simplified configuration leaves out is atrial contraction
    ("without atrial contraction e_la = E_la,min", Eq. 2-5), which korakianitis2006's model always has
    (Eq. 5). With the atrial elastance held at its minimum (E_a,max -> E_a,min) the two codes give
    the same numbers at the paper values (every shared output to the last digit). Hence reduces_to,
    in that limit; the chapter's other configurations (atrial contraction, KG diaphragm, leaflet
    dynamics) have no settings-free counterpart here and are not tested.
  assumptions:
    - "The limit E_a,max -> E_a,min is taken at E_a,min = 0.15 mmHg/ml, the value both papers print (Table 1 of korakianitis2006, Table 2-1 of the chapter); the relation tester takes limits to a number, so E_a,min is held at that point."
    - "T is held at 1 s: both codes report the cycle [10 s, 10 s + T) with t_end = 11 s, a whole cycle only for T = 1 s."
    - "b's KG diaphragm and leaflet inputs are mapped to the chapter's values; they do nothing with kg_motion and valve_dynamics off."
