# Parameters (Tables 2-1 to 2-5)
- {id: chamber_elastance, name: heart chamber elastance, dimension: "[pressure]/[length]**3", description: "characteristic elastance of a heart chamber in the variable elastance law (Eqs. 2-2, 2-5): systolic/diastolic or maximum/minimum value"}
- {id: chamber_reference_pressure, name: chamber reference pressure, dimension: "[pressure]", description: "P_0 in Eq. 2-4"}
- {id: chamber_reference_volume, name: chamber reference volume, dimension: "[length]**3", description: "V_0 in Eq. 2-4, the volume at which chamber pressure equals P_0"}
- {id: initial_chamber_volume, name: initial heart chamber volume, dimension: "[length]**3", description: "volume of a heart chamber at the start of the simulation"}
- {id: initial_vessel_pressure, name: initial vessel pressure, dimension: "[pressure]", description: "pressure of a vascular compliance at the start of the simulation"}
- {id: vascular_compliance, name: vascular compliance, dimension: "[length]**3/[pressure]", description: "C of a vascular segment"}
- {id: vascular_resistance, name: vascular resistance, dimension: "[pressure]*[time]/[length]**3", description: "R of a vascular segment"}
- {id: vascular_inertance, name: vascular inertance, dimension: "[pressure]*[time]**2/[length]**3", description: "L of a vascular segment"}
- {id: valve_flow_coefficient, name: valve flow coefficient, dimension: "[length]**3/[time]/[pressure]**0.5", description: "CQ in the orifice law Eq. 2-13"}
- {id: valve_pressure_coefficient, name: leaflet pressure-effect coefficient, dimension: "1/[time]**2/[pressure]", description: "K_p in Eq. 2-17: angular acceleration per unit pressure difference"}
- {id: valve_friction_coefficient, name: leaflet friction coefficient, dimension: "1/[time]", description: "K_f in Eq. 2-17"}
- {id: leaflet_max_angle, name: maximum leaflet opening angle, dimension: dimensionless, description: "theta_max in Eq. 2-15: fully open leaflet angle"}
- {id: leaflet_min_angle, name: minimum leaflet opening angle, dimension: dimensionless, description: "fully closed leaflet angle"}
- {id: heart_period, name: heart period, dimension: "[time]"}
- {id: time_peak_systole, name: time of peak systolic activation, dimension: "[time]", description: "T_s1 in Eq. 2-3"}
- {id: time_end_systole, name: time of end of systolic activation, dimension: "[time]", description: "T_s2 in Eq. 2-3"}
- {id: p_wave_onset, name: onset of the P wave, dimension: "[time]", description: "T_pwb in Eq. 2-6"}
- {id: p_wave_duration, name: duration of the P wave, dimension: "[time]", description: "T_pww in Eq. 2-6"}
- {id: kg_tissue_coefficient, name: KG diaphragm tissue-strain coefficient, dimension: "[length]/[time]**2/[pressure]", description: "K_st in Table 2-3 (K_e,la, K_e,lv in Eqs. 2-8 to 2-10), with the unit Table 2-3 prints"}
- {id: kg_friction_coefficient, name: KG diaphragm friction coefficient, dimension: "1/[time]", description: "K_f,sav (k_f,sav in Eq. 2-10), with the unit Table 2-3 prints"}
- {id: kg_elastic_coefficient, name: KG diaphragm elastic coefficient, dimension: "1/[time]**2", description: "K_e,sav (k_e,sav in Eq. 2-10), with the unit Table 2-3 prints"}
- {id: annulus_mass, name: mass of the annulus fibrosus (KG diaphragm), dimension: "[mass]", description: "M_sav in Eq. 2-10, m_sav in Table 2-3"}
- {id: annulus_area, name: sectional area of the annulus fibrosus (KG diaphragm), dimension: "[length]**2", description: "A_sav in Eqs. 2-10 to 2-12"}
- {id: annulus_diameter, name: diameter of the mitral annulus fibrosus, dimension: "[length]"}
- {id: annulus_thickness, name: thickness of the annulus fibrosus, dimension: "[length]"}
- {id: tissue_density, name: tissue density, dimension: "[mass]/[length]**3"}
# Results of the circulation model, each over the analysed heart cycle (10th to 11th s)
- {id: peak_lv_pressure, name: peak left ventricular pressure, dimension: "[pressure]"}
- {id: min_lv_pressure, name: minimum left ventricular pressure, dimension: "[pressure]"}
- {id: peak_aortic_pressure, name: peak aortic pressure, dimension: "[pressure]", description: "maximum aortic sinus pressure P_sas"}
- {id: min_aortic_pressure, name: minimum aortic pressure, dimension: "[pressure]", description: "minimum aortic sinus pressure P_sas"}
- {id: peak_rv_pressure, name: peak right ventricular pressure, dimension: "[pressure]"}
- {id: peak_pulmonary_artery_pressure, name: peak pulmonary artery pressure, dimension: "[pressure]", description: "maximum pulmonary artery sinus pressure P_pas"}
- {id: mean_aortic_flow, name: mean aortic valve flow, dimension: "[length]**3/[time]", description: "aortic valve flow averaged over one cycle"}
- {id: lv_volume_max, name: maximum left ventricular volume, dimension: "[length]**3"}
- {id: lv_volume_min, name: minimum left ventricular volume, dimension: "[length]**3"}
- {id: rv_volume_max, name: maximum right ventricular volume, dimension: "[length]**3"}
- {id: stroke_volume, name: left ventricular stroke volume, dimension: "[length]**3", description: "maximum minus minimum left ventricular volume"}
- {id: la_volume_max, name: maximum left atrial volume, dimension: "[length]**3"}
- {id: lv_volume_p_wave, name: left ventricular volume at the onset of atrial contraction, dimension: "[length]**3", description: "V_lv at t = T_pwb, before the step increase due to atrial contraction"}
- {id: rv_volume_p_wave, name: right ventricular volume at the onset of atrial contraction, dimension: "[length]**3"}
- {id: la_volume_p_wave, name: left atrial volume at the onset of atrial contraction, dimension: "[length]**3"}
- {id: ra_volume_p_wave, name: right atrial volume at the onset of atrial contraction, dimension: "[length]**3"}
- {id: la_volume_trough, name: left atrial volume at its late-diastolic trough, dimension: "[length]**3", description: "smallest left atrial volume from T_pwb to 0.1 s into the next cycle"}
- {id: ra_volume_trough, name: right atrial volume at its late-diastolic trough, dimension: "[length]**3"}
- {id: peak_aortic_valve_flow, name: peak aortic valve flow, dimension: "[length]**3/[time]"}
- {id: peak_mitral_valve_flow, name: peak mitral valve flow, dimension: "[length]**3/[time]"}
- {id: peak_pulmonary_valve_flow, name: peak pulmonary valve flow, dimension: "[length]**3/[time]"}
- {id: peak_tricuspid_valve_flow, name: peak tricuspid valve flow, dimension: "[length]**3/[time]"}
- {id: mitral_E_peak_flow, name: mitral flow at the E peak, dimension: "[length]**3/[time]", description: "largest mitral flow after the end of systole (T_s2) and before the P wave (T_pwb)"}
- {id: tricuspid_E_peak_flow, name: tricuspid flow at the E peak, dimension: "[length]**3/[time]"}
- {id: mitral_EA_ratio, name: mitral E/A ratio, dimension: dimensionless, description: "ratio of the early (E) to the late (A) peak of transmitral flow"}
- {id: tricuspid_EA_ratio, name: tricuspid E/A ratio, dimension: dimensionless}
- {id: kg_displacement_min, name: peak KG diaphragm displacement towards the ventricle, dimension: "[length]", description: "smallest (most negative) l over the cycle; positive l is into the atrium"}
- {id: kg_displacement_max, name: peak KG diaphragm displacement towards the atrium, dimension: "[length]", description: "largest l over the cycle"}
# Waveforms plotted in the figures (Figs. 2-3, 2-6, 2-9 to 2-21)
- {id: time, name: time since the start of the simulation, dimension: "[time]", description: "the t axis of the waveform figures"}
- {id: lv_pressure, name: left ventricular pressure, dimension: "[pressure]"}
- {id: la_pressure, name: left atrial pressure, dimension: "[pressure]"}
- {id: rv_pressure, name: right ventricular pressure, dimension: "[pressure]"}
- {id: ra_pressure, name: right atrial pressure, dimension: "[pressure]"}
- {id: aortic_sinus_pressure, name: aortic sinus pressure, dimension: "[pressure]", description: "P_sas, P(sas) in the figures"}
- {id: pulmonary_sinus_pressure, name: pulmonary artery sinus pressure, dimension: "[pressure]", description: "P_pas, P(pas) in the figures"}
- {id: aortic_valve_flow, name: aortic valve flow, dimension: "[length]**3/[time]"}
- {id: mitral_valve_flow, name: mitral valve flow, dimension: "[length]**3/[time]"}
- {id: pulmonary_valve_flow, name: pulmonary valve flow, dimension: "[length]**3/[time]"}
- {id: tricuspid_valve_flow, name: tricuspid valve flow, dimension: "[length]**3/[time]"}
- {id: lv_volume, name: left ventricular volume, dimension: "[length]**3"}
- {id: la_volume, name: left atrial volume, dimension: "[length]**3"}
- {id: rv_volume, name: right ventricular volume, dimension: "[length]**3"}
- {id: ra_volume, name: right atrial volume, dimension: "[length]**3"}
- {id: kg_displacement, name: KG diaphragm displacement, dimension: "[length]", description: "l in Eq. 2-10, left heart; positive into the atrium"}
- {id: aortic_leaflet_angle, name: aortic valve leaflet opening angle, dimension: dimensionless}
- {id: mitral_leaflet_angle, name: mitral valve leaflet opening angle, dimension: dimensionless}
- {id: pulmonary_leaflet_angle, name: pulmonary valve leaflet opening angle, dimension: dimensionless}
- {id: tricuspid_leaflet_angle, name: tricuspid valve leaflet opening angle, dimension: dimensionless}
- {id: lv_elastance, name: left ventricular elastance, dimension: "[pressure]/[length]**3", description: "e_lv(t), Eq. 2-2"}
- {id: la_elastance, name: left atrial elastance, dimension: "[pressure]/[length]**3", description: "e_la(t), Eq. 2-5"}
- {id: mri_phase, name: MRI cardiac phase number, dimension: dimensionless, description: "index of the MRI acquisition phase within one heart cycle (Fig. 2-3)"}
