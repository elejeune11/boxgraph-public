# The overview's text: what the page says that the build cannot. Every number on the page
# comes from the build; this file holds the words around them. Used by
#   make build CORPUS=motor_clutch
title: "Cell adhesion and the motor-clutch model: a literature review"
notice:
  title: "Work in progress:"
  text: results are produced by agent jobs and not yet reviewed by people;
  link: check a record before citing it
  href: https://github.com/elejeune11/boxgraph-public
intro:
  - All models are wrong, but some are useful (George E. P. Box). This page is a literature review in which each paper's models are taken as stated and put to work, to see where each one holds.
  - Every value is traced to the page it was printed on. Every model is rebuilt and run on the paper's own inputs and compared with what the paper reports, at the precision it was printed with. Relations between the models of different papers are tested, not assumed, and values one paper takes from another are checked against the source. Where a model of one paper predicts what another paper measured, it is run on that measurement's conditions and judged against it; a model fitted to that measurement is reported as a fit, not a test.
  - Nothing is corrected or overwritten, and every result is rebuilt each time a source is added, so the review changes as the literature does. A disagreement is recorded as a result, with the open question it raises.
links:
  - {text: "All reviews", href: "../"}
  - {text: "The design and the code (GitHub)", href: "https://github.com/elejeune11/boxgraph-public"}
  - {text: "A second review: 0D and 1D cardiovascular models", href: "../cardio/"}
case_studies:
  - id: numerics
    teaches: A paper against itself
    title: A simulated result and its time step
    summary: >-
      Chan and Odde (2008) simulate a motor-clutch model with a fixed time step and compare
      its retrograde flow with measurements. The record rebuilds the simulation from the
      paper and asks whether the agreement holds as the time step is refined.
    steps:
      - text: >-
          The paper compares the simulated retrograde flow on a soft gel (260 Pa) with the
          measured mean of 78 ± 4 nm/s. Rebuilt from the paper's equations and parameters and
          run at its 5 ms time step, with five random seeds, the model gives the same value.
        show: "comparison: chan2008/val_v_260"
      - text: >-
          A time step is a numerical setting, not part of the model, so the record halves it
          three times. On the soft gel the flow falls and settles near 45 nm/s, outside the 5%
          tolerance of the value at 5 ms.
        show: "refinement: chan2008/ref_dt_260"
      - text: At the settled step, the comparison with the measured mean no longer holds.
        show: "comparison: chan2008/val_v_260_fine"
      - text: >-
          The same refinement on a stiff gel (57 kPa) moves the flow by about 2%, so there the
          result belongs to the model.
        show: "refinement: chan2008/ref_dt_57k"
      - text: >-
          Running four times longer at 5 ms changes the soft-gel flow by less than 1%, so the
          dependence is on the time step, not on how long the simulation runs.
        show: "refinement: chan2008/ref_t_260"
      - text: >-
          The rebuilt simulation needs stepping rules the paper does not state in full. A
          different scheme could depend on the time step differently, so the record states
          its assumptions and keeps this as an open question.
        show: "question: chan2008/q_binding_rule"

  - id: family
    teaches: Papers against each other
    title: One rate law in six papers
    summary: >-
      Six papers from 1978 to 2018 use a rate for a bond that breaks under force, each in its
      own symbols. ModelAtlas tests each pair of these models instead of taking the citations
      on trust, and models that agree under a mapping form a family.
    steps:
      - text: >-
          Bell (1978) gives the reverse rate of a bond under force as the unloaded rate times an
          exponential of the force per bond. The later papers write the same law with their own
          symbols and parameters.
        show: "family: bell1978/loaded_reverse_rate"
      - text: >-
          Chan and Odde (2008) state that their clutch off-rate is Bell's. The test maps one
          model's inputs onto the other's and evaluates both across the range the papers use.
        show: "relation: chan2008/rel_bell_off_rate"
      - text: >-
          Some relations are stated by neither paper. The reader proposed that Erdmann and
          Schwarz's single-bond rate is the same as Chan and Odde's off-rate, and the same test
          verifies it.
        show: "relation: chan2008/rel_erdmann_off_rate"
      - text: >-
          A verified relation lets one paper's model run on another paper's inputs. In a second
          family, Bell's critical-force formula, run on Erdmann and Schwarz's inputs, gives the
          value they print.
        show: "cross_check: erdmann2004/rel_bell_critical_force"

  - id: code
    teaches: A paper against its own code
    title: A paper and the code released with it
    summary: >-
      Andreu et al. (2021) released the MATLAB code behind their molecular clutch model. The
      record reads the code as a source of its own, checks each parameter written in it
      against the value the paper prints, and runs a Python port of the code against the
      paper's figure.
    steps:
      - text: >-
          Each parameter in the code is cited by file and line and compared with the paper's
          tables. Thirteen of the fourteen agree. The clutch spring constant is one.
        show: "cited: andreu2021_code/kc_code"
      - text: The actin breaking force is another.
        show: "cited: andreu2021_code/Fbreaking_code"
      - text: >-
          One parameter is written differently. The supplementary table gives the substrate
          spring constant as 1 µN/nm, and the code sets it to 10⁻³ N/m, which is 1 pN/nm. The
          record keeps both values as printed.
        show: "cited: andreu2021_code/ksub_code"
      - text: >-
          Which value the figures rest on is recorded as an open question, with the evidence
          for each reading. The record runs the model with both.
        show: "question: andreu2021/q_ksub_unit"
      - text: >-
          With the code's value, a Python port of the released model reproduces the paper's
          Fig. 2e model curve, value by value.
        show: "comparison: andreu2021_code/cmp_fig2e_2p5"
