# The corpus for this review. file is under corpus/motor_clutch/ (git-ignored); pages are PDF pages.
- id: bell1978
  file: corpus/motor_clutch/1978_Bell.pdf
  pages: [1, 10]
  note: "A 1978 scan with OCR text: equations and exponents are often garbled, so read numbers from the page images. Page 10 ends with the start of an unrelated article; page 11 is a publisher notice."
- id: erdmann2004
  file: corpus/motor_clutch/2004_Erdmann.pdf
  pages: [1, 4]
  note: "A four-page letter."
- id: chan2008
  file: corpus/motor_clutch/2008_Chan.pdf
  pages: [2, 61]
  note: "A JSTOR download. Page 1 is a JSTOR cover; page 2 begins with the end of an unrelated article and the paper starts lower on page 2. The paper runs to page 6; the Supporting Online Material (methods, model, Table S1 of parameters, figures) is pages 7-61 and is part of this source."
- id: bangasser2013
  file: corpus/motor_clutch/2013_Bangasser.pdf
  pages: [1, 21]
  note: Biophysical Journal article (pp. 581-592) on PDF pages 1-12; its Supporting Material (algorithm,
    parameter sensitivity, Table S1 of parameters for experimental validation, supplementary figures)
    is PDF pages 13-21 and is part of this source. The model extends Chan and Odde 2008's motor-clutch
    model.
- id: andreu2021
  file: corpus/motor_clutch/2021_Andreu.pdf
  pages: [1, 23]
  note: PDF pp. 1-12 are the article (Nature Communications 12:4229, 2021); pp. 13-23 are the Supplementary
    Information (methods detail, Supplementary Figures and Tables, including Table S2 of model parameters).
    Its source data and its MATLAB code (Supplementary Software 1) are attached as andreu2021_data and
    andreu2021_code.
- id: andreu2021_code
  kind: software
  file: corpus/motor_clutch/code/andreu2021_code
  papers: [andreu2021]
  note: 'Supplementary Software 1 of Andreu et al. 2021: the MATLAB molecular clutch model under cyclic
    stretch (cmstretchg.m, called by stretchscriptg.m with the paper''s parameters), the script that builds
    the loading-rate-dependent rate tables (loading rate script.m, koffcb.m) and the tables and experimental
    data it loads (kofflr.mat, experimental data.mat; read them with scipy.io.loadmat).'
- id: andreu2021_data
  kind: dataset
  file: corpus/motor_clutch/data/andreu2021_data.xlsx
  papers: [andreu2021]
  note: Source data of Andreu et al. 2021, one sheet per figure (Figure 1-5, Figure S1-S5, Table S2).
- id: gardel2008
  file: corpus/motor_clutch/2008_Gardel.pdf
  pages: [1, 10]
  note: 'Gardel et al. 2008, J Cell Biol 183:999-1005 (Report), with its supplementary material in the
    same PDF. Mostly experiments: traction stress and actin retrograde flow speed in focal adhesions,
    a biphasic relationship.'
- id: kong2009
  file: corpus/motor_clutch/2009_Kong.pdf
  pages: [1, 14]
  note: 'Kong et al. 2009, J Cell Biol 185:1275-1284, with supplementary material in the same PDF. Experiments:
    lifetimes of integrin a5b1-fibronectin bonds under force (catch bonds), with the fits of bond-lifetime
    models.'
- id: bangasser2013b
  file: corpus/motor_clutch/2013b_Bangasser.pdf
  pages: [1, 20]
  note: 'Bangasser and Odde 2013, Cell Mol Bioeng 6:449-459: master-equation analysis of the motor-clutch
    model. PDF pp. 1-9 are the article; the Supplementary Information starts at p. 10. The Odde lab''s
    MATLAB re-implementation of the Chan and Odde model (odde_code) is attached.'
- id: elosegui2014
  file: corpus/motor_clutch/2014_Elosegui-Artola.pdf
  pages: [1, 34]
  note: 'Elosegui-Artola et al. 2014, Nature Materials 13:631-637, followed by its Supplementary Information
    in the same PDF: rigidity sensing through two integrin types, with a molecular clutch model.'
- id: chaudhuri2015
  file: corpus/motor_clutch/2015_Chaudhuri.pdf
  pages: [1, 23]
  note: Chaudhuri et al. 2015, Nature Communications 6:6364. PDF pp. 1-7 are the article; the Supplementary
    Information starts at p. 8. A motor-clutch model on viscoelastic (stress-relaxing) substrates.
- id: craig2015
  file: corpus/motor_clutch/2015_Craig.pdf
  pages: [2, 26]
  note: Craig, Stricker, Gardel and Mogilner 2015, Physical Biology 12:035002. PDF p. 1 is a publisher
    download page, not the paper; the article starts on p. 2. A model for the adhesion clutch that explains
    the biphasic flow-traction relation of Gardel et al. 2008.
- id: elosegui2016
  file: corpus/motor_clutch/2016_Elosegui-Artola.pdf
  pages: [1, 26]
  note: Elosegui-Artola et al. 2016, Nature Cell Biology 18:540-548. PDF pp. 1-11 are the article and
    methods; the Supplementary Information starts at p. 12. A molecular clutch model with talin unfolding.
- id: gong2018
  file: corpus/motor_clutch/2018_Gong.pdf
  pages: [1, 20]
  note: Gong et al. 2018, PNAS 115:E2686-E2695. PDF pp. 1-10 are the article; the Supporting Information
    starts at p. 11. A motor-clutch model on viscoelastic substrates and its timescales.
- id: odde_code
  kind: software
  file: corpus/motor_clutch/code/odde_code
  papers: [chan2008, bangasser2013, bangasser2013b]
  note: 'MATLAB scripts by B. Bangasser (Odde lab, 2010) from the lab website: an event-stepping (Gillespie)
    re-implementation of the Chan and Odde 2008 motor-clutch model. motorclutch1_1.m simulates one run;
    motorclutch2_3.m sweeps substrate stiffness over several runs. Parameters differ from Chan and Odde''s
    published set in places (e.g. nm = nc = 50, Kc = 0.8 pN/nm, kon = 0.3 1/s in motorclutch2_3.m): record
    them as written and compare with each paper.'
