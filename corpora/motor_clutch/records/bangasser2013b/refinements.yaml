- {id: ref_r1_rtol, run: run_cycle_r1, setting: rtol, factors: [1, 10, 100], mode: divide, output: t_cycle,
   tolerance: "0.1%", tolerance_basis: "added: well below the 2-digit precision of the printed 15 s", tolerance_added: true}
- {id: ref_r1_gfail, run: run_cycle_r1, setting: g_fail, factors: [1, 10, 100], mode: divide, output: t_cycle,
   tolerance: "0.1%", tolerance_basis: "added: the failure criterion is the reader's; it must not move the printed 2-digit cycle time", tolerance_added: true}
- {id: ref_r3_rtol, run: run_cycle_r3, setting: rtol, factors: [1, 10, 100], mode: divide, output: t_cycle,
   tolerance: "0.1%", tolerance_basis: "added: well below the 2-digit precision of the printed 73 s", tolerance_added: true}
- {id: ref_r3_gfail, run: run_cycle_r3, setting: g_fail, factors: [1, 10, 100], mode: divide, output: t_cycle,
   tolerance: "0.1%", tolerance_basis: "added: the failure criterion is the reader's; it must not move the printed 2-digit cycle time", tolerance_added: true}
- {id: ref_opt_n25_grid, run: run_opt_ode_n25, setting: points_per_decade, factors: [1, 2, 4], mode: multiply, output: ks_opt,
   tolerance: "1%", tolerance_basis: "added: well below the 1-digit precision of the printed optimum (1 pN/nm)", tolerance_added: true}
- {id: ref_opt_n3600_grid, run: run_opt_ode_n3600, setting: points_per_decade, factors: [1, 2, 4], mode: multiply, output: ks_opt,
   tolerance: "1%", tolerance_basis: "added: well below the precision of the printed optimum (200 pN/nm)", tolerance_added: true}
- {id: ref_opt_n3600_rtol, run: run_opt_ode_n3600, setting: rtol, factors: [1, 10, 100], mode: divide, output: ks_opt,
   tolerance: "1%", tolerance_basis: "added: well below the precision of the printed optimum (200 pN/nm)", tolerance_added: true}
