id: motors_for_traction
name: number of motors needed for a traction force when each motor stalls at Fm (p. 9, in words)
role: model
stated: {page: 9, printed_page: "457", quote: "the number of motors must be of order", where: text}
equation: "n = F / Fm  (in words: 'To achieve traction force on the order of 1000 pN, the number of motors must be of order 1000 if each one has Fm ≈ 1 pN')"
from_words: true
inputs:
  F:  {quantity: traction_force, unit: pN}
  Fm: {quantity: motor_stall_force, unit: pN}
outputs:
  n:  {quantity: number_of_motors_and_clutches, unit: dimensionless}
settings: {}
stochastic: false
