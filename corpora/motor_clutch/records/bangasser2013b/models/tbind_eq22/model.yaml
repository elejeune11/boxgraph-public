id: tbind_eq22
name: time for all clutches to bind, high-nc form with Euler's constant (Eq. 22)
role: model
stated: {page: 4, printed_page: "452", quote: "Therefore, for high nc, we can approximate this limit as", where: "Eq. 22"}
equation: "tbind = (1/kon) [ln(nc) + c],  c ≈ 0.577 (Euler's constant)"
inputs:
  nc:  {quantity: n_clutches, unit: dimensionless}
  kon: {quantity: clutch_on_rate, unit: 1/s}
outputs:
  tbind: {quantity: ensemble_binding_time, unit: s}
settings: {}
stochastic: false
# A helper model for the relator: the paper states Eq. 22 as the high-nc approximation of the sum of
# Eq. 20, which it takes from ref. 1 ("As previously shown"). Euler's constant is used at full precision
# (the paper prints c ≈ 0.577).
