id: eq31_factors
name: "the motor factor Fm/vu and the number factor n/ln(n) of Eq. 31"
role: model
stated: {page: 8, printed_page: "456", quote: "The first quantity, Fm/vu, pertains to the motors", where: "Eq. 31"}
equation: "κs,opt = (Fm/vu) (n/ln(n)) ln(1/ε) kon"
inputs:
  Fm: {quantity: motor_stall_force, unit: pN}
  vu: {quantity: unloaded_motor_velocity, unit: um/s}
  n:  {quantity: number_of_motors_and_clutches, unit: dimensionless}
outputs:
  ratio: {quantity: motor_force_velocity_ratio, unit: pN*s/um}
  nfac:  {quantity: motor_number_log_factor, unit: dimensionless}
settings: {}
stochastic: false
