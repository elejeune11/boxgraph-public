- id: ks_S1_alt_added
  quantity: substrate_stiffness
  unit: pN/nm
  printed: "0.01"
  basis: >-
    Not the paper's stated value (0.1 pN/nm, Fig. S1 legend). The single-clutch force balance stalls
    at κs xs = nm Fm = 2 pN, so the 200 nm plateau of Fig. S1C corresponds to κs = 0.01 pN/nm. Run
    beside the stated value to test that reading (q_figS1_stiffness).
  alternatives: ["0.1"]
  stands_for: "κsub of Fig. S1, as the plotted substrate position implies"

# ==== cross-validation against chan2008 (2026-11-02): κs of Chan and Odde's gels ==============
- id: ks_chan_260Pa_added
  quantity: substrate_stiffness
  unit: pN/nm
  printed: "0.174"
  basis: >-
    Neither paper states the spring constant of the 260 Pa gel of chan2008 Fig. 3C. Chan and Odde convert
    gel modulus to spring constant with their Eq. 13, κsub = πEδ/(1+υ), and use a fitting parameter
    Δ = 277 nm "to account for our underestimate of κsub" (chan2008 SOM p. 18), with υ = 0.3 for the
    gels. Taking Δ in place of δ (as chan2008/L_eq13_added does): π × 260 Pa × 277 nm / 1.3 = 0.174 pN/nm.
    Alternatives: δ + Δ = 427 nm gives 0.268 pN/nm; δ = 150 nm as printed in Eq. 13 gives 0.0942 pN/nm.
    This paper itself only says "1-1000 kPa (κs ≈ 1-1000 pN/nm)" (p. 9), i.e. ~1 pN/nm per kPa, which
    would give 0.26 pN/nm, inside this range.
  alternatives: ["0.268", "0.0942"]
  stands_for: "κs of the 260 Pa polyacrylamide gel of chan2008 Fig. 3C"
- id: ks_chan_57kPa_added
  quantity: substrate_stiffness
  unit: pN/nm
  printed: "38.2"
  basis: >-
    As ks_chan_260Pa_added, for the 57 kPa gel of chan2008 Fig. 3C: π × 57 kPa × 277 nm / 1.3 = 38.2
    pN/nm. Alternatives: Δ read as δ + Δ = 427 nm gives 58.8 pN/nm; δ = 150 nm gives 20.7 pN/nm. All
    lie far on the stiff side of the base set's optimum, where the ODE flow is near vu.
  alternatives: ["58.8", "20.7"]
  stands_for: "κs of the 57 kPa polyacrylamide gel of chan2008 Fig. 3C"

# ==== cross-validation against owen2017 (2026-11-22): κs at a fibroblast adhesion in 3D fibrin ===
# Used only by validations.yaml (val_relspeed_owen2017_*); no run of this record's own uses it.
- id: ks_owen_fibrin_added
  quantity: substrate_stiffness
  unit: pN/nm
  printed: "0.141"
  basis: >-
    Neither paper states the spring constant an adhesion pulls against in owen2017's 3D fibrin gels.
    owen2017 gives a continuum estimate, κ = πEr/2(1+η) (Supp. p. 3, its model continuum_stiffness), with
    r = 0.5 um ("approximately the size of a focal adhesion") and the bulk gel modulus E = 270 Pa from
    G = 90 Pa with η = 0.5 (Fig. S10 caption): 0.141 nN/um = 0.141 pN/nm. The same value is added for
    the same purpose in bangasser2013 (ksub_owen_fibrin_added). Alternatives: the bulk moduli without and
    with cells (~200 and ~300 Pa, owen2017 p. 8) give 0.105 and 0.157; owen2017's clutch-model value
    κ = 1 pN/nm (Supp. p. 6; run directly as val_relspeed_owen2017_kappa1); the network nodes "up to
    ~24 nN/um" (p. 8, Fig. 6B), an order of magnitude apart between nodes, so 24 and 2.4.
  alternatives: ["0.105", "0.157", "1", "2.4", "24"]
  stands_for: "κs at an adhesion of a fibroblast in owen2017's 3D fibrin gel"
