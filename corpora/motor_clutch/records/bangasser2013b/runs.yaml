# ==== clutch-ensemble ODEs: cycle time against r (Supplement p. 14, Fig. S2E) ================
- id: run_cycle_r1
  model: clutch_ensemble_cycle
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, ks: ks_S2E_added, r: r_S2E_low}
  outputs: {t_cycle: tcycle_r1_pred, v_mean: vmean_r1_pred}
- id: run_cycle_r3
  model: clutch_ensemble_cycle
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, ks: ks_S2E_added, r: r_S2E_high}
  outputs: {t_cycle: tcycle_r3_pred, v_mean: vmean_r3_pred}

# ==== Fig. 2: base set on 0.1 pN/nm, r = 2 ===================================================
- id: run_cycle_fig2
  model: clutch_ensemble_cycle
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, ks: ks_fig2, r: r_fig2}
  outputs: {t_cycle: tcycle_fig2_pred, v_mean: vmean_fig2_pred}
- id: run_tc_fig2_mid
  model: clutch_ensemble_timecourse
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, ks: ks_fig2, r: r_fig2}
  sweep: {t: xs_fig2c_ode}
  outputs: {xs: xs_fig2_pred, Fc: Fc_fig2_pred, vf: vf_fig2_pred}
- id: run_tc_fig2_Pb
  model: clutch_ensemble_timecourse
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, ks: ks_fig2, r: r_fig2}
  sweep: {t: Pb_fig2b_ode}
  outputs: {Pb: Pb_fig2_pred}

# ==== Fig. S2F: ODE cycle time against stiffness, r = 2 =======================================
- id: run_cycle_S2F_r2
  model: clutch_ensemble_cycle
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, r: r_S2F_2}
  sweep: {ks: tcycle_figS2f_r2}
  outputs: {t_cycle: tcycle_S2F_r2_pred}

# ==== Fig. 4B: ODE optimum stiffness at nm = nc = 25 and 3600, r = 3 ==========================
- id: run_opt_ode_n25
  model: clutch_ensemble_optimum
  inputs: {nm: n_fig4_low_m, Fm: Fm_base, vu: vu_base, nc: n_fig4_low_c, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, r: r_fig4}
  outputs: {ks_opt: ksopt_ode_n25_pred}
- id: run_opt_ode_n3600
  model: clutch_ensemble_optimum
  inputs: {nm: n_fig4_high_m, Fm: Fm_base, vu: vu_base, nc: n_fig4_high_c, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, r: r_fig4}
  outputs: {ks_opt: ksopt_ode_n3600_pred}

# ==== Eq. 30 at nm = nc = 25 and 3600 (the Fig. 4 end points) =================================
- id: run_eq30_n25
  model: optimum_eq30
  inputs: {Fm: Fm_base, nm: n_fig4_low_m, kon: kon_base, vu: vu_base, nc: n_fig4_low_c, eps: eps_choice}
  outputs: {ks_opt: ksopt_eq30_n25_pred}
- id: run_eq30_n3600
  model: optimum_eq30
  inputs: {Fm: Fm_base, nm: n_fig4_high_m, kon: kon_base, vu: vu_base, nc: n_fig4_high_c, eps: eps_choice}
  outputs: {ks_opt: ksopt_eq30_n3600_pred}

# ==== Discussion, p. 9 ========================================================================
- id: run_log_factor
  model: log_cycle_factor
  inputs: {eps: eps_choice, m: eps_multiplier_added}
  outputs: {L: L_pred, fold: L_fold_pred}
- id: run_motors_for_traction
  model: motors_for_traction
  inputs: {F: traction_order, Fm: Fm_order}
  outputs: {n: n_traction_pred}
- id: run_eq31_factors
  model: eq31_factors
  inputs: {Fm: Fm_order, vu: vu_order, n: n_order}
  outputs: {ratio: Fm_vu_pred, nfac: nfac_pred}
- id: run_eq31_coefficient
  model: eq31_coefficient
  inputs: {ratio: Fm_vu_subst, nfac: nfac_subst, L: L_subst}
  outputs: {C: coef_eq31_pred}
- id: run_eq31_rates
  model: eq31_rates
  inputs: {C: coef_eq31, q: kon_koff_ratio}
  sweep: {ks: kon_range_text}
  outputs: {kon: kon_range_pred, koff: koff_range_pred}

# ==== Fig. S1: single clutch, one motor, base set otherwise, at the end of the plotted time ===
- id: run_single_S1
  model: single_clutch_ode
  inputs: {nm: nm_S1, Fm: Fm_base, vu: vu_base, nc: nc_S1, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, ks: ks_S1, t: t_S1_late}
  outputs: {pb: pb_S1_pred, xs: xs_S1_pred, Fc: Fc_S1_pred, koff_i: koff_S1_pred}
- id: run_single_S1_alt
  model: single_clutch_ode
  inputs: {nm: nm_S1, Fm: Fm_base, vu: vu_base, nc: nc_S1, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, ks: ks_S1_alt_added, t: t_S1_late}
  outputs: {pb: pb_S1alt_pred, xs: xs_S1alt_pred, Fc: Fc_S1alt_pred, koff_i: koff_S1alt_pred}
  note: "κs = 0.01 pN/nm instead of the printed 0.1, to test the reading in q_figS1_stiffness"

