# ==== CROSS-VALIDATION against bangasser2013 (2026-11-02) ====
- id: q_xval_bangasser2013
  kind: choice
  about: [clutch_ensemble_cycle, clutch_ensemble_optimum, clutch_offrate_eq5, single_clutch_ode]
  text: >-
    No validation of this record's models against bangasser2013's measurements is entered. That record's
    measured data are all re-plotted from other papers. (1) Kong et al.'s integrin-fibronectin lifetimes
    against force (bangasser2013/tau_kong_fig7c, a catch bond). The only lifetime this record gives is
    the slip-bond Bell off-rate of Eq. 5 for a generic clutch (koff, Fb of the Chan and Odde base set);
    this paper never applies it to integrin bonds, so running it on Kong et al.'s forces would test
    nothing the paper claims. (2) Chan and Odde's neuron retrograde flow rates against substrate Young's
    modulus (bangasser2013/v_figS1b_measured). Eqs. 8-12 and 19 give a cycle-mean flow against substrate
    spring constant, and this paper prints only an order-of-magnitude correspondence "1-1000 kPa
    (κs ≈ 1-1000 pN/nm)" (p. 9), not a conversion for those gels; a sweep over the measured moduli needs
    that conversion as a model, which this job may not add. The base set used here is Chan and Odde's,
    fitted to those same neuron data, so such a check would be fit_quality, not validation. (3) The
    normalized migration and traction of Fig. 1 (bangasser2013/migration_fig1a_*, traction_fig1b_*):
    each is normalized to its cell type's maximum and no motor-clutch parameters are given for those
    cells, so the ODEs predict only the biphasic trend, not the values. Open choice: a later job with a
    modulus-to-stiffness conversion model could enter (2) as fit_quality.
  citation: {page: 9, printed_page: "457", quote: "to obtain an optimum substrate stiffness in the range", where: text}

# ==== CROSS-VALIDATION against bell1978 (2026-11-02): none added ====
- id: q_xval_bell1978_none
  kind: choice
  about: [clutch_offrate_eq5, clutch_ensemble_cycle, single_clutch_ode, motors_for_traction]
  text: >-
    No validation of this record's models against bell1978's measurements is entered. This paper cites
    bell1978 (ref. 3) only as the source of the force-dependent off-rate law it uses (Eq. 5), not as data
    its models explain or are compared with. bell1978's measured data are force_adhesive (about 1 dyne to
    detach one cell, from its ref. 52) and the inhibiting sugar concentrations c_sugar_low and
    c_sugar_high (0.001 and 0.01 M, from its ref. 49). The sugar concentrations are conditions, and no
    model here has an inhibitor input or output. force_adhesive is the force to pull an adherent cell off
    a surface. The nearest outputs here are the traction of one motor-clutch module (motors_for_traction,
    clutch_ensemble_*) and the clutch forces of the ODEs. Those are forces a cell's motors exert at a
    given substrate stiffness, not a detachment force, and neither paper gives the module count, clutch
    parameters or stiffness for the cells of ref. 52. The value is also printed only as an order of
    magnitude ("~ 1"), which gets no verdict. clutch_ensemble_cycle has the same shape as bell1978's
    detach_time_eq17 (a time from a force and a rate), but that is a relation between models, not a
    measurement, and is left to the job that relates models across papers.
  citation: {page: 1, printed_page: "449", quote: "according to a force-dependent Bell model.3", where: text}

# ==== CROSS-VALIDATION against chan2008 (2026-11-02) ====
- id: q_xval_chan2008_r
  kind: choice
  about: [clutch_ensemble_cycle, r_fig2, r_fig4, ks_chan_260Pa_added, ks_chan_57kPa_added]
  text: >-
    The validations val_flow_chan_260Pa and val_flow_chan_57kPa against chan2008's measured flow run the ODEs at r = 2, the shape parameter this
    paper uses with the base set (Fig. 2, p. 5). Fig. 4 (flow against stiffness) uses r = 3, and Fig. S2F
    says r = 2 matches the cycle time below 1 pN/nm while lower r matches better on stiffer substrates.
    The choice changes the predicted flow on the 260 Pa gel about two-fold (r = 3 roughly halves it), and
    little on the 57 kPa gel. It is open which r should stand for Chan and Odde's filopodia.
  citation: {page: 5, printed_page: "453", quote: "simulated cycles, and r = 2 was used for the ODE", where: text}
- id: q_xval_chan2008_unused
  kind: choice
  about: [clutch_ensemble_cycle, clutch_ensemble_timecourse, single_clutch_ode]
  text: >-
    chan2008 measurements considered and not used for validation here: (1) the Fig. 3D measured means and
    the Fig. S8C bars (chan2008/v_fig3d_exp_*, v_figS8C_*) are curves indexed by gel modulus; a sweep
    needs a modulus-to-spring-constant conversion as a model in this record, which it does not have (only
    the two printed Fig. 3C means are entered, with an added κs each); v_fig3d_exp_red repeats the 57 kPa
    gel. (2) v_stiff_text is printed "~110" (approximate, no verdict). (3) T_max_fig, the peak filopodial
    traction: no model here outputs a peak traction force, and nm was set to that value (chan2008 Table
    S1). (4) failures_figS5D, a failure frequency (1/s): the nearest output here is the ODE cycle time,
    a different quantity, and the bead-step failures are not shown to be whole-module load-and-fail
    cycles. (5) contact bead distance δ, the displacement/step histograms (Figs. 4D, S4, S5, S11D) and the
    scaled surface tension (Fig. 4E): no model here predicts them.
  citation: {page: 3, printed_page: "451", quote: "the base parameter set from Chan and Odde6", where: text}
# cross-record validation against chaudhuri2015 (2026-11-02): none added
- id: q_xval_chaudhuri2015_none
  kind: choice
  about: [clutch_ensemble_cycle, clutch_ensemble_timecourse, clutch_ensemble_optimum, single_clutch_ode, optimum_eq30]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    chaudhuri2015. chaudhuri2015 cites Bangasser et al. 2013 (Biophys. J., its ref. 20; the
    bangasser2013 record), not this paper, and neither paper says one's model explains the other's
    data. chaudhuri2015's measurements are cell-spreading areas after 20 h (Figs. 3b, 3c, 4b, Supp.
    Figs. 4, 5), gel moduli and stress relaxation and rheology curves (Fig. 2, Supp. Fig. 3, Supp.
    Table 1), and fractions of cells with stress fibres, attached or proliferating, and nuclear YAP
    ratios (Figs. 3e, 4a, 4d, 4e). The models here give a load-and-fail cycle time, a cycle-mean
    F-actin flow rate, clutch states over time and an optimal substrate stiffness; none of them
    outputs a spread area, a gel property or a cell fraction, and turning a flow rate into an area at
    20 h would need a spreading model this paper does not state. chaudhuri2015 also measures no flow
    rate or traction to run the ODEs against.
