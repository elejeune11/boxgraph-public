  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of gong2018.
    gong2018 cites this paper (its ref. 16, SI Table S1 ref. 1) as a source of its motor-clutch
    parameters and for the trend that, without reinforcement, the FA lifetime "is proportional to its
    lifetime timescale" (gong2018 p. 8); it never runs these ODEs against its data. gong2018's
    measurements are cell spreading areas (Figs. 4D, 5D, 6D, S5A), spreading speeds on elastic gels
    extracted from those areas with an adjusted initial radius and spreading timescale (Fig. S7), and
    gel relaxation stiffness curves (Figs. 4B, 5B, S6A). The models here output a load-and-fail cycle
    time, a cycle-mean F-actin flow rate, clutch states and an optimal substrate spring constant. None
    is a spreading area, a spreading speed or a gel property: gong2018's spreading speed is Vs = Vp - Vf
    (its Eq. 6), and the polymerization speed Vp, the spreading model and the reinforcement rule are not
    part of this paper's models; adding them would make the result gong2018's model, not this one.
    gong2018 also measures no flow rate, traction or cycle time. Although clutch_ensemble_cycle and
    gong2018/lifetime_timescale have the same shape (a time from force, stiffness and velocity), the
    cycle times here are predictions, not measurements, so there is nothing to validate either against.
    In the other direction, see gong2018/q_xval_bangasser2013b_none.
