    clutch-model κ = 1 pN/nm. The network nodes go up to ~24 nN/um and differ by an order of magnitude
    between nodes, so no single κs is the gel's. The motor and clutch numbers (nm = nc = 75) and kon, koff,
    Fb, κc are Chan and Odde's neuron filopodia set. owen2017 gives no motor number, and its Ct = 500 is a
    generic choice for a different model. On the base set the cycle-mean flow cannot fall below its value
    at the optimum stiffness (Fig. 4), so a different κs cannot bring it down to owen2017's ~1 nm/s.
    Matching the measurement needs a different motor-clutch balance, for example many more clutches per
    motor, as owen2017 p. 10 proposes. Neither paper gives one for these cells.
