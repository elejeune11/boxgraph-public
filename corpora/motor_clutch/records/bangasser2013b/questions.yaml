# cross-record validation against odde_code (2026-11-02): none added
- id: q_xval_odde_code_none
  kind: choice
  about: [clutch_ensemble_cycle, clutch_ensemble_timecourse, clutch_ensemble_optimum, single_clutch_ode, optimum_eq30, fig6b_ode_cal, fig6b_mc1_cal, fig6b_mc100_cal]
  text: >-
    (Cross-record validation.) No validation was entered in either direction between this record and
    odde_code. odde_code is software (the Odde lab MATLAB event-stepping motor-clutch scripts) and holds
    no measured data. Its data are the code's parameters and predicted curves copied from the papers'
    records, so no model here has a measurement there to be judged against. This paper's own `measured`
    data are only the computation times of Fig. 6(b) (fig6b_ode_cal, fig6b_mc1_cal, fig6b_mc100_cal):
    how long the authors' ODE solver and Monte Carlo software ran on their computer. The paper has no
    experimental measurement; it compares its ODEs with Monte Carlo simulations, which are predictions.
    odde_code's mc_event_port outputs flow, traction, failure frequency, cycle time, engaged clutches,
    clutch tension and simulated time, but not a computation time. A run time depends on the machine
    and the implementation (MATLAB on the authors' computer, against a Python port here), so it is not
    a quantity of the motor-clutch model. clutch_ensemble_cycle and odde_code/mc_event_port have the
    same shape, and odde_code already compares its port with this paper's Monte Carlo optimum at
    nm = nc = 25 (cmp_b13b_opt_n25). Both are relations between models and predictions, not
    measurements, and are left to the job that relates models across papers.
