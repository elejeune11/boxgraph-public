# ==== against chan2008's measured retrograde flow (2026-11-02) ================================
# The clutch-ensemble ODEs (Eqs. 8-12, 19) with Chan and Odde's base parameter set (Table S1 here,
# from ref. 6) give a cycle-mean F-actin flow rate at a substrate spring constant. chan2008 prints the
# mean measured flow on two gels (Fig. 3C). The base set's nc and kon, and the κs of each gel (via the
# fitted Δ of chan2008 Eq. 13), were set by Chan and Odde to match these flow data, so each entry is
# fit_quality, not an independent test.
- id: val_flow_chan_260Pa
  model: clutch_ensemble_cycle
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, ks: ks_chan_260Pa_added, r: r_fig2}
  output: v_mean
  against: chan2008/v_fig3c_260
  purpose: fit_quality
  quantities: {chan2008/retrograde_flow_rate: cycle_mean_flow_rate}
  conditions_ok: >-
    chan2008 states the gel by its Young's modulus (260 Pa); the model takes a spring constant, entered
    as ks_chan_260Pa_added from chan2008's own Eq. 13 with its fitted Δ. The measured mean is over many
    load-and-fail cycles of many filopodia, the model's over one cycle, which repeats identically.
  basis: >-
    This paper solves its ODEs with "the base parameter set from Chan and Odde6" (p. 3) and states that
    the ODE model "reproduces the biphasic response to substrate stiffness" (p. 5) of that motor-clutch
    model. Fitted, not tested: chan2008 Table S1 sets nc "to slow retrograde flow to experimentally
    observed levels" and kon "to match dynamics observed in this study", and the κsub of each gel rests on
    Δ = 277 nm, introduced "to test how well our model predictions of F-actin retrograde flow fit with
    our experimental measurements" (chan2008 SOM p. 18). r = 2 is this paper's choice for the base set
    (p. 5); r = 3 (Fig. 4) is the open alternative (q_xval_chan2008_r).
- id: val_flow_chan_57kPa
  model: clutch_ensemble_cycle
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, ks: ks_chan_57kPa_added, r: r_fig2}
  output: v_mean
  against: chan2008/v_fig3c_57k
  purpose: fit_quality
  quantities: {chan2008/retrograde_flow_rate: cycle_mean_flow_rate}
  conditions_ok: >-
    chan2008 states the gel by its Young's modulus (57 kPa); the model takes a spring constant, entered
    as ks_chan_57kPa_added from chan2008's own Eq. 13 with its fitted Δ.
  basis: >-
    As val_flow_chan_260Pa, on the stiff gel. Fitted, not tested: the base set's nc and kon and the
    gel's κsub (via Δ = 277 nm) were set by Chan and Odde to match their measured flow (chan2008 Table S1,
    SOM p. 18).

# ==== against owen2017's measured actin-adhesion relative speed (2026-11-22) ====================
# The clutch-ensemble ODEs with Chan and Odde's neuron base set give a cycle-mean F-actin flow past the
# clutches' substrate anchor. owen2017 measures the speed of actin (α-actinin-1) relative to its zyxin
# adhesion in fibroblasts in 3D fibrin. Nothing of the base set was fitted to owen2017, so these are
# validations: does the 2D-calibrated model carry to the 3D measurement as it stands?
- id: val_relspeed_owen2017_table1
  model: clutch_ensemble_cycle
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, ks: ks_owen_fibrin_added, r: r_fig2}
  output: v_mean
  against: owen2017/t1_diff_velocity
  purpose: validation
  quantities: {owen2017/actin_adhesion_relative_speed: cycle_mean_flow_rate}
  conditions_ok: >-
    The model's v_mean is <vf> averaged over one load-and-fail cycle, which repeats identically; over a
    whole cycle the substrate returns to its start, so this is also the mean speed of actin past the
    clutches' substrate anchor. owen2017's value is the mean magnitude of |v_zyx - v_actn| from positions
    10 ± 1 min apart (Table 1), a lag of many model cycles, i.e. the same slippage of actin past the
    adhesion. The measured speeds are unsigned and both directions occur (owen2017
    q_no_continuous_rearward_flow); the model's flow is rearward only, so it is compared as a speed. The
    cells (fibroblasts in 3D fibrin vs. neuron filopodia on polyacrylamide), the motor and clutch numbers
    and the substrate spring differ from the base set's conditions; κs is the added continuum estimate
    for the fibrin gel (ks_owen_fibrin_added, with alternatives); r = 2 is this paper's ODE base choice.
  basis: >-
    owen2017 explains its slow actin motion with the motor-clutch force balance: actin velocity is
    "determined by the balance of cytoskeletally generated force and drag on actin generated by
    mechanical linkages to cellular adhesions (Bangasser et al., 2013 ...)" and "Low velocities, such as
    we observe, may reflect a situation in which a relatively large number of mechanical clutches ...
    overwhelm the contractile forces generated by myosin" (owen2017 p. 10). The citation is to the
    Biophys J paper (bangasser2013), whose model this paper's ODEs average (p. 3: "the base parameter
    set from Chan and Odde"); the ODE flow is that velocity of actin past the adhesion.
- id: val_relspeed_owen2017_kappa1
  model: clutch_ensemble_cycle
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, ks: owen2017/kappa_1, r: r_fig2}
  output: v_mean
  against: owen2017/t1_diff_velocity
  purpose: validation
  quantities: {owen2017/actin_adhesion_relative_speed: cycle_mean_flow_rate, owen2017/adhesion_effective_stiffness: substrate_stiffness}
  conditions_ok: >-
    As val_relspeed_owen2017_table1, with the stiffness owen2017 itself puts into its clutch model for
    these adhesions, κ = 1 pN/nm (Supp. p. 6), in place of the added continuum estimate. owen2017's κ is
    the effective spring a clutch pulls against ("molecular linkages in series with the local ECM"),
    which is the role of κs here.
  basis: >-
    As val_relspeed_owen2017_table1. owen2017 judges its own eqn. 13 against this measurement with
    κ = 1 pN/nm (owen2017 val_v_eq13_table1); this runs the corpus's ODE clutch ensemble on the same
    stiffness.
- id: val_relspeed_owen2017_range
  model: clutch_ensemble_cycle
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, ks: ks_owen_fibrin_added, r: r_fig2}
  output: v_mean
  against: owen2017/v_elongation_observed
  purpose: validation
  quantities: {owen2017/actin_adhesion_relative_speed: cycle_mean_flow_rate}
  conditions_ok: >-
    As val_relspeed_owen2017_table1. The measurement is a range, "0-3 nm s-1", for owen2017's study and
    previous work (Endlich et al. 2007), not a summary statistic; the model's single cycle-mean flow is
    judged against it as an interval.
  basis: >-
    owen2017 judges its own clutch model (eqn. 13) against this range ("in good agreement with the
    observed rate of stress fiber elongation (0-3 nm s-1) in our study", Supp. p. 6) and cites the
    motor-clutch force balance for the velocity (p. 10); this model gives the same velocity of actin
    relative to the adhesion.
