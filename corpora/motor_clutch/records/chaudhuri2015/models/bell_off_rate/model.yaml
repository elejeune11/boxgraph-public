id: bell_off_rate
name: force-dependent clutch off rate (Bell model, Supp. Note 1)
role: model
stated: {page: 18, printed_page: "11", quote: "the force-dependent off-rate", where: "Supp. Note 1, unnumbered equation"}
equation: "k*off = koff e^(Fclutch/Frup)"
described_from: sref-5
inputs:
  koff:    {quantity: clutch_off_rate_unloaded, unit: 1/s}
  Fclutch: {quantity: clutch_force, unit: pN}
  Frup:    {quantity: bond_rupture_force, unit: pN}
outputs:
  koff_star: {quantity: clutch_off_rate_loaded, unit: 1/s}
