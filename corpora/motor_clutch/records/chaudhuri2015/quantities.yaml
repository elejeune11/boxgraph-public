- {id: clutch_off_rate_unloaded, name: unloaded off rate of a molecular clutch, dimension: "1/[time]", description: "koff in the Bell model koff* = koff exp(Fclutch/Frup)"}
- {id: clutch_off_rate_loaded, name: force-dependent off rate of a molecular clutch, dimension: "1/[time]", description: "koff*"}
- {id: bond_rupture_force, name: characteristic rupture force per bond, dimension: "[force]", description: "Frup, the force scale of the Bell model"}
- {id: clutch_force, name: retarding force sustained by one clutch, dimension: "[force]", description: "Fclutch"}
- {id: total_clutch_force, name: sum of retarding forces in all adhesion sites, dimension: "[force]", description: "sum over clutches of Fclutch"}
- {id: unloaded_motor_velocity, name: unloaded myosin motor velocity, dimension: "[length]/[time]", description: "vu"}
- {id: stall_force, name: force required to stop actin retrograde flow, dimension: "[force]", description: "Fstall"}
- {id: clutch_on_rate, name: clutch binding rate, dimension: "1/[time]", description: "kon"}
- {id: clutch_stiffness, name: spring constant of one molecular clutch, dimension: "[force]/[length]", description: "kappa_clutch"}
- {id: substrate_stiffness, name: substrate spring stiffness, dimension: "[force]/[length]", description: "the (initial) stiffness of one substrate linkage, the x axis of Fig. 1b-d, Fig. 5b and Supp. Fig. 1d"}
- {id: linkage_stiffness_element, name: spring constant of a Burgers-model element (E1 or E2), dimension: "[force]/[length]", description: "E1 (Maxwell) and E2 (Voigt) element stiffness, given in pN nm^-1 in Supp. Table 2"}
- {id: linkage_damping_element, name: damping coefficient of a Burgers-model element (eta1 or eta2), dimension: "[force]*[time]", description: "given in pN s in Supp. Table 2"}
- {id: linkage_stress, name: stress sustained in a substrate linkage, dimension: "[force]/[length]", description: "σ of Supp. Eq. 2, taken in the units of E·ε (E in pN/nm, strain dimensionless); the paper gives no unit"}
- {id: initial_adhered_length, name: initial adhered length of the cell, dimension: "[length]"}
- {id: ligand_line_density, name: adhesion ligand density along the substrate, dimension: "1/[length]", description: "ligands per nm, Supp. Table 2"}
- {id: n_clutches, name: number of molecular clutches, dimension: dimensionless}
- {id: retrograde_flow_velocity, name: actin retrograde flow velocity, dimension: "[length]/[time]", description: "v_retrograde"}
- {id: spreading_speed, name: cell spreading velocity, dimension: "[length]/[time]", description: "v_spread = vu - v_retrograde; in Supp. Fig. 1d, its average over a simulation"}
- {id: time_step, name: simulation time step, dimension: "[time]"}
- {id: n_time_steps, name: number of simulation time steps, dimension: dimensionless}
- {id: ligand_area_density, name: adhesion ligand density per substrate area, dimension: "1/[length]**2", description: "the curve labels of Fig. 1b-d, in lig um^-2 (a different measure from the line density of Supp. Table 2)"}
- {id: tensile_extension_rate, name: imposed extension rate in a simulated tensile test, dimension: "[length]/[time]", description: "Supp. Fig. 1f, printed as nm/ms"}
- {id: simulated_duration, name: simulated time of one run, dimension: "[time]"}
- {id: n_simulation_runs, name: number of independent simulation runs averaged, dimension: dimensionless}
# added by the figure reading (second pass)
- {id: condition_index, name: position of a bar or condition along a categorical axis, dimension: dimensionless, description: "1, 2, 3 ... left to right, as named in each reading's what"}
- {id: initial_youngs_modulus, name: initial Young's modulus of an alginate gel measured by AFM, dimension: "[mass]/[length]/[time]**2"}
- {id: cell_spread_area, name: projected area of a spread cell, dimension: "[length]**2", description: "measured (Figs. 3-4, Supp. Figs. 4-5) or simulated (the lattice model's spread area, Fig. 1b,c, printed in nm^2 x 10^4)"}
- {id: spread_area_difference, name: difference in simulated spread area between stress-relaxing and elastic substrates, dimension: "[length]**2", description: "Fig. 1d"}
- {id: fraction_cells_stress_fibres, name: percentage of cells forming stress fibres, dimension: dimensionless}
- {id: fraction_cells_attached, name: percentage of plated cells attached after 20 min, dimension: dimensionless}
- {id: fraction_cells_proliferating, name: percentage of proliferating cells, dimension: dimensionless}
- {id: yap_nuclear_ratio, name: ratio of nuclear to cytoplasmic YAP (normalized), dimension: dimensionless}
- {id: time, name: time since the start of a test, dimension: "[time]"}
- {id: normalized_stress, name: stress in a stress-relaxation test divided by its initial value, dimension: dimensionless}
- {id: frequency, name: oscillation frequency in shear rheology, dimension: "1/[time]"}
- {id: normalized_storage_modulus, name: storage modulus G' divided by G' at 1 Hz, dimension: dimensionless}
- {id: normalized_loss_modulus, name: loss modulus G'' divided by G' at 1 Hz, dimension: dimensionless}
- {id: loss_modulus, name: shear loss modulus G'' of a gel, dimension: "[mass]/[length]/[time]**2"}
- {id: storage_loss_ratio, name: ratio G'/G'' of a gel, dimension: dimensionless}
- {id: lead_node_spacing, name: average spacing of the lead node in the lattice model, dimension: "[length]", description: "Fig. 5b"}
- {id: tensile_force, name: force in a simulated tensile test of the substrate, dimension: "[force]", description: "Supp. Fig. 1f, printed in units of 0.1 pN"}
