- id: q_kT
  kind: unstated_input
  about: [kT_310K, steady_linear, cusp_sigma_m]
  text: >
    The temperature in beta = 1/kBT of Eq. 4 is not stated. 310 K (37 degC, the culture temperature) is
    added; with 298 K the cusp density of the linear KD model moves from about 42.6 to 40.9 um^-2. The
    fitted catch-bond distances (Table T1, Fig. S4) were fitted with some kBT the paper does not give.
  citation: {page: 20, quote: "β = 1/kBT is", where: "after Eq. 4"}
- id: q_ly_WT
  kind: unstated_input
  about: [ly_WT, ly_WT_bound, steady_linear]
  text: >
    Table T1 gives ly > 300 nm for the linear WT model and says its value 'did not have a strong effect'.
    In the model as printed (Eq. 11), ly = 300 nm lowers the traction on soft substrates markedly
    (at E = 1 kPa, P = 22.7 Pa against 32.2 Pa for ly >= 3000 nm); the plotted linear WT curve of
    Fig. 2c (about 30 Pa at 1 kPa) agrees with a large ly. The value used by the authors is not given.
  citation: {page: 55, quote: "model parameter did not have a strong effect on the", where: "Table T1"}
- id: q_stability_wording
  kind: reading
  about: [steady_linear]
  text: >
    Extended Data Fig. 1 states that a stationary point is stable 'if dFm/dv > dFc/dv'. In its own
    panel (a) both slopes are negative and Fm is the steeper, so in signed terms dFm/dv < dFc/dv there;
    the statement holds for the magnitudes of the slopes. The model here takes a root as stable when
    d(Fc - Fm)/dv > 0, which follows from the caption's own argument (above the root the clutches
    resist more than the motors pull) and makes the single root of a monotonic case stable.
  citation: {page: 30, quote: "If dFm/dv > dFc/dv [panel (a)], the corresponding stationary point", where: "Extended Data Fig. 1"}
- id: q_sm43_bistable
  kind: unexplained_difference
  about: [sm_KD_bleb15, cmp_P_KD_sm43_ed5a, cmp_sm_cusp]
  text: >
    Extended Data Fig. 5a draws the sigma_m = 43 um^-2 KD curve with a vertical dashed jump near
    E = 2 x 10^4 Pa, i.e. as just inside the bistable region, and the text puts the onset of bistability at
    ~44 um^-2. With the Table T1 inputs and kBT at 310 K the cusp computed here is at about 42.6 um^-2,
    just below 43, so the computed curve at 43 drops steeply but continuously. The difference is within
    what the unstated kBT and the rounding of the printed parameters allow.
  citation: {page: 13, quote: "Reducing σm to ~44 μm−2 results in the appearance of two", where: "Fig. 5d caption"}
