    T1) with elosegui2014/koff_a5b1, entered as printed under its header 's-1 x 10^2' (49.44 s^-1). If
    the header means value x 10^-2 (4.944e-3 s^-1, the reading the SPR dissociation curves of Fig. 2a
    favour, elosegui2014/q_fig2a_koff_timescale), the gap is about as large in the other direction
    (about 77 times instead of 130 times). Neither reading agrees with the force-free limit of Eq. 4, so
