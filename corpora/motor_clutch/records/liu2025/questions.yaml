- id: q_xval_bangasser2013b_none
  kind: choice
  about: [steady_linear, force_velocity_eq7, fc_v_eq9, koff_eq4, loading_rate_text, talin_linker_wlc, 'bangasser2013b/fig6b_ode_cal', 'bangasser2013b/fig6b_mc1_cal', 'bangasser2013b/fig6b_mc100_cal']
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    bangasser2013b, and this paper does not cite it: its ref. 11 is Bangasser, Rosenfeld & Odde,
    Biophys. J. 2013 (record bangasser2013), not the Cell. Mol. Bioeng. master-equation paper, so the
    pairing's "liu2025 cites Bangasser 2013 (ref-11)" names the other record. bangasser2013b's only
    measured data are the computation (run) times of its ODE and Monte Carlo software on the authors'
    computer (Fig. 6b: fig6b_ode_cal, fig6b_mc1_cal, fig6b_mc100_cal); no model here outputs a
    computation time. Everything else bangasser2013b plots is model output (ODE or Monte Carlo
    curves), which is a matter for relations between models, not validation. The shared shape of
    force_velocity_eq7 and bangasser2013b/clutch_ensemble_cycle (a velocity from a force and a
    velocity) is such a model-to-model matter; see relations.yaml, where the reasons no relation is
    entered between steady_linear and clutch_ensemble_cycle are given. In the other direction, see
    bangasser2013b/q_xval_liu2025_none.
  citation: {page: 25, where: "References, ref. 11", quote: "Determinants of maximal force transmission in a motor-clutch model of cell"}

# ==== CROSS-VALIDATION against chan2008 (2026-11-21): none added ====
- id: q_xval_chan2008_none
  kind: unstated_input
  about: [steady_linear, fc_v_eq9, koff_eq4, force_velocity_eq7, loading_rate_text, 'chan2008/v_fig3d_exp_sem', 'chan2008/v_fig3c_260', 'chan2008/v_fig3c_57k', 'chan2008/T_max_text', 'chan2008/delta_text']
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    chan2008 (ref. 7, SI ref. [7]). This paper cites Chan & Odde only among earlier clutch models
    (p. 1), for clutch stiffnesses of 1-1,000 pN/nm (pp. 2, 15), for the linear force-velocity law
    Eq. 7 (p. 21) and for flow in filopodia occurring "at an almost constant rate (v(t) ≈ const.)"
    (pp. 14, 21). That last is a trend in time that chan2008 does not quantify (its kymographs are
    not read), and Liu never runs its model against Chan's numbers. steady_linear does give the
    actin flow v at a Young's modulus E, the quantity of chan2008's Fig. 3C/3D flows on 260 Pa to
    57 kPa gels, but every parameter set here (Table T1, Extended Data Table 2) was fitted to MEFs
    on fibronectin (ref. 13 data); neither paper states sigma_m, sigma_c, k0on, r, R or the
    integrin-fibronectin catch-bond rates for chick forebrain neuron filopodia, and chan2008's
    clutch parametrisation (nc, kon, Bell koff, Fb) does not map onto them, so a run would not be on
    the measurement's own cells and would rest wholly on added inputs. The other measured
    quantities differ: Chan's 110 ± 25 pN is the peak load-and-fail traction of one filopodium
    (Cerruti, Eq. 11), while Liu's steady state gives a time-averaged stress P over an adhesion
    complex; the contact distance δ and the bead-step and failure statistics have no output here.
    The shared port shape of steady_linear and chan2008/cerruti_force_eq11 is formal (see
    relations.yaml). In the other direction, see chan2008/q_xval_liu2025_none.
  citation: {page: 14, quote: "occurs at an almost constant rate", where: text}
