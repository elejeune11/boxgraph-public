# ==== cross-record validation with andreu2021 (2026-11-21): none added =========================
- id: q_xval_andreu2021_none
  kind: reading
  about: [steady_linear, cusp_sigma_m, saddle_nodes_sigma_m, fc_v_eq9, koff_eq4, loading_rate_text, 'andreu2021/fig1b_flow', 'andreu2021/clutch_stretch_sim']
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    andreu2021, which this paper does not cite. The one andreu2021 measurement a model here would
    output is the actin retrograde flow of MEFs on 0.6 kPa gels (andreu2021 Fig. 1b, fig1b_flow):
    steady_linear gives the flow v at a Young's modulus E, and its linear WT parameters are for MEFs
    on 10 ug/ml fibronectin (Table T1, fitted to the ref. 13 data of Fig. 2c,d, not to andreu2021), so
    it would be a true validation. But fig1b_flow is one two-entry datum indexed by a condition index
    (1 = 0.6 kPa gel, 2 = glass), not by E: a scalar run at E = 0.6 kPa cannot be compared with the
    two-entry table, a sweep cannot take a condition index as E (different quantities), and the glass
    point was measured at the lamellipodium edge where adhesion is still low (andreu2021 p. 2), a state
    steady_linear does not represent; andreu2021 holds no datum for the 0.6 kPa rigidity itself. It
    becomes checkable if andreu2021 records the 0.6 kPa flow as its own datum with the rigidity as a
    condition. Other andreu2021 measurements considered and not used: paxillin adhesion lengths and
    YAP ratios (Figs. 1, 2, 4, 5, Supplementary Figs. 1, 3, 5, 6), which no model here outputs; bead
    speed, force loading rate, stiffness and paxillin recruitment under optical-tweezer oscillation
    (Fig. 3, Supplementary Fig. 4) and AFM moduli and peak forces (Fig. 4d,h, Supplementary Fig. 5),
    which are cell-level responses to imposed motion that no model here represents (the per-clutch
    loading rate of loading_rate_text is a different quantity from the loading rate applied to a
    bead); and the stretch calibration of Supplementary Fig. 2. andreu2021/clutch_stretch_sim has the
    same input shape as cusp_sigma_m but has no motors and outputs an integrin density under cyclic
    stretch, not a myosin density. In the other direction, see andreu2021/q_xval_liu2025_none.
  citation: {page: 5, where: "Fig. 2(c,d)", quote: "collected for MEF WT cells (red circles) and MEF Talin 1 KO"}


