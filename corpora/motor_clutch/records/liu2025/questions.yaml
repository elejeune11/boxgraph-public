    1 nm, unfolded R3 domain); the unfolded R3 contour length and how the parts combine are not stated,
    so its printed results (clutch tensions 0.7-1.3 pN, 1-2% unfolded clutches, Fig. 4 loading rates)
    are not checked here. The authors' MATLAB code (record liu_code) should settle this.
  citation: {page: 44, quote: "we used the freely-jointed chain model for the rod part", where: "Appendix F"}
