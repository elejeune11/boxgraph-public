    its parameters to, so the eight entries against it are fit_quality, none a test: Fig. 3d,e control and
    shRNA tractions and flows (Liu's Fig. 2c,d; linear WT and KD models, Table T1) and Fig. 6h,i tractions
    under 15 and 50 uM blebbistatin (Liu's Extended Data Fig. 5; only sigma_m refitted). Considered and not
    used: (1) Fig. 6b (10 ug/ml, untreated) and Fig. 1a and the Supplementary Fig. 2 means: the same cells as
    Fig. 3d (elosegui2016 figures.md), so a second entry would count one fit twice. (2) Fig. 6a,c (1 and 100
