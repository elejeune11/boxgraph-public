  kind: choice
  about: [steady_linear, talin_wt, cusp_sigma_m, koff_eq4]
  text: >
    Cross-validation with elosegui2014 (ref. 12). liu2025 cites it only as a previous clutch model
    (p. 2, p. 21: 'Following previous studies7,11,12,13,14') and for the clutch stiffness range, never as
