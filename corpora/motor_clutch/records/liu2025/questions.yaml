# ==== cross-record validation with bangasser2013 (2026-11-21): none added =======================
- id: q_xval_bangasser2013_none
  kind: unstated_model
  about: [koff_eq4, steady_linear]
  text: >-
    (Cross-record validation.) No model of this record is validated against bangasser2013's
    measurements. Its bond data (tau_kong_fig7c, Kong et al.'s a5b1 lifetimes redrawn in Fig. 7C) are
    lifetimes; koff_eq4 outputs an off-rate, the reciprocal, which a quantity mapping cannot express.
    Its flow data (v_figS1b_measured) are chick forebrain neuron filopodia from Chan and Odde, for
    which this paper states no parameter set (its sets are for MEF WT and talin-depleted MEFs); its
