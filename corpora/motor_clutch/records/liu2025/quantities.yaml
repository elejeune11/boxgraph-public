- {id: youngs_modulus, name: Young's modulus of the substrate, dimension: "[pressure]"}
- {id: clutch_assembly_rate, name: assembly rate of a molecular clutch in the relaxed state (k0on), dimension: "1/[time]"}
- {id: zero_load_off_rate, name: zero-load dissociation rate of one term of the integrin-ECM catch bond, dimension: "1/[time]"}
- {id: transition_distance, name: transition-state distance of the integrin-ECM bond, dimension: "[length]"}
- {id: thermal_energy, name: thermal energy kBT, dimension: "[energy]"}
- {id: motor_free_speed, name: unloaded myosin II speed v0, dimension: "[length]/[time]"}
- {id: actin_flow_speed, name: retrograde actin flow speed, dimension: "[length]/[time]"}
- {id: motor_stall_force, name: stall force of one myosin II motor, dimension: "[force]"}
- {id: myosin_density, name: density of myosin II motors near the cell-substrate interface, dimension: "1/[length]**2"}
- {id: clutch_site_density, name: density of sites available for clutch formation, dimension: "1/[length]**2"}
- {id: engaged_clutch_density, name: density of engaged molecular clutches, dimension: "1/[length]**2"}
- {id: clutch_spring_constant, name: spring constant of (the intracellular part of) a molecular clutch, dimension: "[force]/[length]"}
- {id: adhesion_site_size, name: characteristic size r of the adhesion site of one clutch, dimension: "[length]"}
- {id: adhesion_complex_size, name: characteristic size R of a cell-adhesion complex, dimension: "[length]"}
- {id: adhesion_complex_area, name: area S of a cell-adhesion complex, dimension: "[length]**2"}
- {id: linear_limit_extension, name: clutch extension ly beyond which the force stays at k ly, dimension: "[length]"}
- {id: traction_stress, name: cell traction stress P, dimension: "[pressure]"}
- {id: clutch_tension, name: mean tension of an engaged clutch, dimension: "[force]"}
- {id: clutch_traction_per_site, name: traction force per site available for clutch formation (Fc/Nc), dimension: "[force]"}
- {id: substrate_deformation, name: large-scale substrate deformation xs, dimension: "[length]"}
- {id: talin_tension, name: tension applied to talin, dimension: "[force]"}
- {id: talin_extension_difference, name: difference of talin end-to-end extension between two tensions, dimension: "[length]"}
- {id: force_loading_rate, name: force-loading rate of a molecular clutch, dimension: "[force]/[time]"}
- {id: eccentricity, name: eccentricity of the ellipse of a cell-adhesion complex, dimension: dimensionless}
- {id: elliptic_integral_Ie, name: elliptic integral Ie of Appendix A, dimension: dimensionless}
- {id: myosin_density_ratio, name: ratio of a myosin density to the density at the onset of bistability, dimension: dimensionless}
- {id: protein_average_stiffness, name: average elasticity (force over extension) of a protein construct in the 0-10 pN range, dimension: "[force]/[length]"}
- {id: wlc_contour_length, name: contour length of the talin unstructured peptide linker, dimension: "[length]"}
- {id: persistence_length, name: persistence length of a polypeptide chain, dimension: "[length]"}
- {id: talin_domain_count, name: number of force-transmitting globular domains in the talin rod, dimension: dimensionless}
- {id: talin_domain_size, name: average size of a talin globular domain, dimension: "[length]"}
- {id: r3_unfolding_rate, name: zero-load unfolding rate of the talin R3 domain, dimension: "1/[time]"}
- {id: r3_refolding_rate, name: zero-load refolding rate of the talin R3 domain, dimension: "1/[time]"}
- {id: r3_unfolding_force, name: characteristic unfolding force of the talin R3 domain, dimension: "[force]"}
- {id: sites_added_per_unfolding, name: average number of new clutch sites added upon R3 unfolding and vinculin binding (alpha), dimension: dimensionless}
- {id: vinculin_clutch_assembly_rate, name: second-order assembly rate of clutches involving vinculin-bound talin, dimension: "[length]**2/[time]"}
- {id: vinculin_r3_binding_rate, name: binding rate of vinculin to the unfolded talin R3 domain, dimension: "1/[time]"}
- {id: bond_off_rate, name: dissociation rate koff of the integrin-fibronectin bond under a given force, dimension: "1/[time]"}
- {id: talin_extension, name: end-to-end extension of a talin molecule under tension, dimension: "[length]"}
- {id: fibronectin_concentration, name: concentration of the fibronectin solution used to coat the substrate, dimension: "[mass]/[length]**3"}
- {id: myosin_stack_density, name: density of myosin II filament stacks measured in cells, dimension: "1/[length]**2"}
- {id: category_index, name: "number of a category in a bar chart, as printed under the bar or in its legend (cell line, substrate, tension bin)", dimension: dimensionless}
- {id: substrate_viscous_coefficient, name: viscous coefficient xi_s of the Maxwell element representing a liquid-like substrate, dimension: "[force]*[time]/[length]"}
- {id: vinculin_r3_off_rate, name: dissociation rate of vinculin from the unfolded talin R3 domain, dimension: "1/[time]"}
- {id: motor_load_force, name: "total force Fm generated by the myosin II motors of one cell-adhesion complex (equal to the clutch traction Fc)", dimension: "[force]"}
- {id: myosin_number, name: number Nm of myosin II motors pulling actin within one cell-adhesion complex, dimension: dimensionless}
