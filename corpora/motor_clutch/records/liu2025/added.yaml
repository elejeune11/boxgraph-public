- id: kT_310K
  quantity: thermal_energy
  unit: pN*nm
  printed: "4.28"
  basis: "beta = 1/kBT appears in Eq. 4 but no temperature is stated for the model; the cells are cultured at 37 degC (p. 23), kB x 310 K = 4.28 pN nm"
  alternatives: ["4.11", "4.14"]
  stands_for: "1/beta in Eq. 4"
- id: ly_WT
  quantity: linear_limit_extension
  unit: nm
  printed: "10^4"
  basis: "Table T1 gives only 'ly > 300 nm' for linear WT and says its value had no strong effect; the steady state is the same (to 4 digits) for any ly from 3000 nm up, so a value in that range stands for 'large'"
  alternatives: ["300", "1000"]
  stands_for: "ly of the linear WT model (Eq. 11)"
- id: S_FA
  quantity: adhesion_complex_area
  unit: um**2
  printed: "9.08"
  basis: "area of a round adhesion complex of radius R = 1700 nm (pi R^2); S is not stated. It enters only xs, which no comparison uses (P, v, n_on and F1 do not depend on S)"
  alternatives: ["4.5"]
  stands_for: "S in Eq. 10 (Fc = P S)"
- id: F_zero_spr
  quantity: clutch_tension
  unit: pN
  printed: "0"
  basis: "added for val_koff_zero_force_spr_a5b1: the SPR dissociation of elosegui2014 (p. 6, Biacore, purified integrin over immobilized FN7-10) applies no force to the bond, so Eq. 4 is evaluated at zero load"
  alternatives: []
  stands_for: "|F| in Eq. 4 for the condition of the elosegui2014 SPR measurement"
