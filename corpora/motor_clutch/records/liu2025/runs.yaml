# ratio of the fitted untreated and 15 uM blebbistatin KD densities (added in the audit)
- id: run_ratio_fitted_KD
  model: density_ratio
  inputs: {sm_a: sm_KD, sm_b: sm_KD_bleb15}
  outputs: {ratio: bistab_ratio_fitted}
