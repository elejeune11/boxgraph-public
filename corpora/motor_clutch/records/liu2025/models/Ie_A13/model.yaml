id: Ie_A13
name: elliptic integral Ie in complete elliptic integrals (Supplementary Eq. A13)
role: model
stated: {page: 38, quote: "arrive at the following expression for the elliptic integral", where: "Eq. A13"}
equation: "Ie(ec) = 4/(3 pi ec^2) [(1 + ec^2) Ke(ec) - Ee(ec)]"
inputs:
  ec: {quantity: eccentricity, unit: dimensionless}
outputs:
  Ie: {quantity: elliptic_integral_Ie, unit: dimensionless}
