id: koff_eq4
name: two-term catch-bond dissociation rate of the integrin-fibronectin bond (Eq. 4)
role: model
stated: {page: 52, quote: "shows two-term exponential fitting [Eq. (4) in the main text]", where: "Fig. S4; Eq. 4"}
equation: "koff(F) = k0off exp(beta xt |F|) + k0'off exp(beta x't |F|), beta = 1/kBT"
inputs:
  k0off: {quantity: zero_load_off_rate, unit: 1/s}
  k0offp: {quantity: zero_load_off_rate, unit: 1/s}
  xt: {quantity: transition_distance, unit: nm}
  xtp: {quantity: transition_distance, unit: nm}
  kT: {quantity: thermal_energy, unit: pN*nm}
  F: {quantity: clutch_tension, unit: pN}
outputs:
  koff: {quantity: bond_off_rate, unit: 1/s}
settings: {}
stochastic: false
