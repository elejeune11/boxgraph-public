id: Ie_A11
name: elliptic integral Ie by direct quadrature (Supplementary Eq. A11)
role: model
stated: {page: 38, quote: "the determinant of the Jacobian of the above transformation", where: "Eq. A11"}
equation: "Ie(ec) = (1/3pi) int_0^2pi [2 - (1 + ec^2) sin^2 phi] / (1 - ec^2 sin^2 phi)^(3/2) dphi"
inputs:
  ec: {quantity: eccentricity, unit: dimensionless}
outputs:
  Ie: {quantity: elliptic_integral_Ie, unit: dimensionless}
