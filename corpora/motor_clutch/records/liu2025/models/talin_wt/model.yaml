id: talin_wt
name: talin WT model, two-state (R3 folded / unfolded) clutches with talin-like elasticity (Supplementary Appendix F)
role: model
stated: {page: 44, quote: "must be replaced by the following matrix equations", where: "Eqs. F1-F8"}
equation: "dpon/dl = (1/v) A(l) pon (F1); ku = ku0 exp(F^f/Fu) (F3); kf/ku = exp(-dG/kBT) (F4, F5); Fc = Nc int F^T pon dl / (1 - alpha int pon^u dl) (F8)"
inputs:
  E: {quantity: youngs_modulus, unit: Pa}
outputs:
  P: {quantity: traction_stress, unit: Pa}
runnable: false
not_runnable_reason: >
  The force-extension curves F^f(l) and F^u(l) are given only in words (freely-jointed chain of 12 rigid
  5 nm domains plus a worm-like-chain linker of 37 nm, persistence length 1 nm); the contour length of
  the unfolded R3 domain, how the chain parts combine with the substrate spring, and the definition of
  the zero-extension states are not stated, so the force-extension curves cannot be rebuilt as the paper
  computed them. The paper's MATLAB code (record liu_code) is the place to recover them.
