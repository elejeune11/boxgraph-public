id: loading_rate_text
name: force-loading rate of a talin clutch from its extension difference and the actin flow (Results, Fig. 4g)
role: model
stated: {page: 12, quote: "we easily found the values of the force-loading rate in both cases"}
equation: "rate = (10 pN - 5 pN) / (extension difference) x retrograde actin flow"
from_words: true
inputs:
  F1: {quantity: talin_tension, unit: pN}
  F2: {quantity: talin_tension, unit: pN}
  dx: {quantity: talin_extension_difference, unit: nm}
  v: {quantity: actin_flow_speed, unit: nm/s}
outputs:
  rate: {quantity: force_loading_rate, unit: pN/s}
