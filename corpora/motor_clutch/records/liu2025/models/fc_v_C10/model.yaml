id: fc_v_C10
name: traction per clutch site for slip bonds, closed form with a Meijer G-function (Supplementary Eq. C10)
role: model
stated: {page: 42, quote: "the following formula for the cell traction force can be derived", where: "Eq. C10"}
equation: "Fc = Nc/(beta xt) phi(a,eps)/(1 + phi(a,eps)) a G^{3,0}_{2,3}(a | 0,0; -1,-1,-1) / E1(a), a = k0off/(beta k v xt), phi = a e^(eps+a) E1(a), eps = ln(k0on/k0off)"
inputs:
  v: {quantity: actin_flow_speed, unit: nm/s}
  kon: {quantity: clutch_assembly_rate, unit: 1/s}
  k0off: {quantity: zero_load_off_rate, unit: 1/s}
  xt: {quantity: transition_distance, unit: nm}
  kT: {quantity: thermal_energy, unit: pN*nm}
  k: {quantity: clutch_spring_constant, unit: pN/nm}
outputs:
  fc: {quantity: clutch_traction_per_site, unit: pN}
