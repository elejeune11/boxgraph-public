id: density_ratio
name: ratio of two myosin densities (the 'decreases by ≳1.6 times' of the Results)
role: processing
stated: {page: 14, quote: "the density of myosin II motors in them decreases by ≳1.6 times", where: text}
equation: "ratio = sigma_m(untreated) / sigma_m(15 uM blebbistatin)"
from_words: true
inputs:
  sm_a: {quantity: myosin_density, unit: 1/um**2, description: "the larger density"}
  sm_b: {quantity: myosin_density, unit: 1/um**2, description: "the smaller density"}
outputs:
  ratio: {quantity: myosin_density_ratio, unit: dimensionless}
