# No relation is entered between liu2025/steady_linear and chan2008/motor_clutch. Chan's model is a
# Monte Carlo of clutches loaded together through one shared substrate spring (load-and-fail); Liu's is the
# stationary master-equation distribution at constant flow with a local spring per clutch and no shared
# spring in the force balance. Liu contrasts its steady state with load-and-fail (p. 17) rather than
# reducing to it, and no limit of either makes it the other. chan2008/cerruti_force_eq11 and steady_linear
# share only port dimensions: Eq. 11 infers a point force from two bead displacements, which no Liu model
# does. Chan's κsub = πEδ/(1+ν) (Eq. 13) and Liu's k's = 4πrE/9 (Eq. 1, inside steady_linear) are both
# modulus times length; that is a form too plain to relate, and Liu does not cite Chan for Eq. 1.

# Relations to Elosegui-Artola et al. 2014 (record elosegui2014; ref. 12), checked 2026-11-21: none entered.
# Liu cites ref. 12 only as one of the earlier molecular-clutch models: in a list of applications (p. 1),
# for stiff clutches of 1-1,000 pN/nm (p. 2, p. 15; Extended Data Table 1, p. 78: "> 8000" pN/s and
# "1000" pN/nm for [12]), and among "previous studies7,11,12,13,14" for the linear force-velocity relation
# Eq. 7 (p. 21). Elosegui's only clutch model, integrin_clutch_sim, is not runnable (its equations and
# parameters are in an SI that is blank in that record's copy) and its readable text states neither a
# force-velocity law nor a clutch stiffness, so there is no port-level model to map Eq. 7 or
# steady_linear onto; the stiffness Liu attributes to ref. 12 cannot be checked from that record. The other
# elosegui2014 models (kont/koff/kon_eff ratios, density_fold) are arithmetic on Elosegui's SPR and
# density data, which no Liu model uses. Liu's catch-bond inputs (k0off, k0'off, xt, x't, sc, R_FA) and
# Fig. 3 data come from ref. 13 / SI ref. [10] (record elosegui2016), not from ref. 12, so cited.yaml has
# no link to elosegui2014 either.

# Relations to Elosegui-Artola et al. 2016 (record elosegui2016; ref. 13 = SI ref. [10]), checked 2026-11-21:
# none entered. Liu uses ref. 13 for data and parameters (traction and flow of MEF WT and talin-depleted cells,
# Figs. 2c,d, 3a,b, Extended Data Fig. 5; the catch-bond rates it refits as Eq. 4, Fig. S4; σc and R, Table T1;
