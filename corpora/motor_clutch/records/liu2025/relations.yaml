# No relation is entered between steady_linear (or fc_v_eq9) and bangasser2013b/clutch_ensemble_cycle,
# although both give a flow speed from motor force, rates and stiffnesses. steady_linear is the
# stationary distribution pon(l) of asynchronously loaded clutches at a constant flow v (Eqs. 8-9), each
# clutch in series with its own local substrate spring; clutch_ensemble_cycle is the ensemble mean over
# one synchronous load-and-fail cycle on one shared substrate spring, with a gamma closure (Eq. 19), and
# its mean extension <xc> has no stationary state while the flow is non-zero. No limit takes one to the
# other: the shared spring cannot be switched off in bangasser2013b (κs -> oo still loads all clutches
# together), and this paper contrasts its steady state with "the load-and-fail and frictional slippage
# mechanisms" (p. 17) rather than reducing to them. Their outputs (a steady-state speed against a
# cycle-mean speed) are also different quantities. The optimum of bangasser2013b (optimum_eq30,
# clutch_ensemble_optimum) has no counterpart among this paper's models, which output traction at one
# Young's modulus, not the stiffness that maximizes it.

