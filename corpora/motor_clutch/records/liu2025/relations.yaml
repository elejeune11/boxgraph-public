# Relations to Bangasser, Fan, Odde 2013 (Cell Mol Bioeng; record bangasser2013b), checked 2026-11-21.
# This paper does not cite bangasser2013b (its ref. 11 is the Biophys J paper, record bangasser2013), so
# no relation to it is stated and cited.yaml has no link to it. Units pN, nm, s on both sides.
- id: rel_koff_eq4_slip_reduces_to_b13b_eq5
  kind: reduces_to
  a: liu2025/koff_eq4
  b: bangasser2013b/clutch_offrate_eq5
