# which is elosegui2016's kc = 1 nN/nm) and force-loading rates (> 8000 pN/s) it argues against. It states no
# mapping, reduction or derivation from Elosegui's model. None is proposed either:
# - clutch_no_talin_sim (and clutch_talin_sim) is a fixed-step Monte Carlo of clutches loaded together through
#   one shared substrate spring, ksub = c E ra (load-and-fail); steady_linear (and its talin and cusp variants)
#   is the stationary master-equation distribution pon(l) at a constant flow, with a local substrate spring
#   per clutch, k's = 4 pi r E / 9, in series with the clutch, and no shared spring in the force balance. No
#   limit of either makes it the other (Liu contrasts its steady state with "the load-and-fail scenario",
#   p. 17), as recorded above for chan2008 and bangasser2013b. Both describe talin-depleted cells and are fitted
#   to the same data, which makes them rival accounts of one data set, not two charts of one model.
# - cusp_sigma_m shares only port dimensions with clutch_no_talin_sim: it outputs the myosin density and the
#   Young's modulus at the cusp of Eq. 8's saddle-node points, which Elosegui's simulation does not define.
# - Liu's force_velocity_eq7 ("Following previous studies7,11,12,13,14", p. 21) and Eq. 4 have counterparts
#   only inside Elosegui's simulations (its motor law and its three-term catch bond); elosegui2016 has no
#   stand-alone motor or off-rate model to relate them to, and Liu's Eq. 4 is its own fit to Elosegui's
#   lifetimes, not Elosegui's catch-bond law. Liu's talin_wt (not runnable) unfolds R3 by a Bell slip bond,
