# Relations to Bangasser, Rosenfeld & Odde 2013 (Biophys J; record bangasser2013; ref. 11), checked 2026-11-21.
# Liu cites ref. 11 only in lists of earlier molecular-clutch models (p. 1), for stiff clutches of 1-1,000 pN/nm
# (pp. 2, 15; Extended Data Table 1, p. 78, an image whose values are not data in this record) and for the linear
# force-velocity relation Eq. 7 (p. 21). No Liu datum names ref. 11, so cited.yaml has no link to bangasser2013.
