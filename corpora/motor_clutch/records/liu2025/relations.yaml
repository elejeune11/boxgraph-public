    - "Bangasser credits the law to its ref. 1 (Chan and Odde); the matching relation to chan2008 is entered above"
- id: rel_koff_eq4_same_as_b13_catch_slip_eq9
  kind: same_as
  a: liu2025/koff_eq4
  b: bangasser2013/catch_slip_eq9
  mapping: {koff: "k0off", Fb: "kT/xt", koffc: "k0offp", Fc: "-kT/xtp", F: "F"}
  output_map: {koff_star: koff}
  regime:
    k0off: [0.00001, 1]
    k0offp: [0.01, 1]
    xt: [0.5, 1.5]
    xtp: [-0.2, -0.05]
    kT: [4.1, 4.3]
    F: [0, 40]
  provenance: proposed
  reason: >-
    Both papers write the integrin-ligand catch bond as one bond with two force-dependent pathways, a sum of two
    exponentials in the force: Liu's Eq. 4, k0off exp(xt F/kBT) + k0'off exp(x't F/kBT), and Bangasser's Eq. 9,
    koff exp(Fi/Fb) + koff,c exp(-Fi/Fc). With Fb = kBT/xt and Fc = -kBT/x't (x't < 0, the catch pathway, as
    Liu's fitted x't = -0.11 nm) the two are one law. Liu does not cite Bangasser for Eq. 4 (it fits Eq. 4 to
    ref. 13's data and cites ref. 67 for catch bonds), so the relation is proposed. Liu's slip-bond limit
    (k0'off = 0) of this law is related to the Bell off-rates of chan2008, bangasser2013b and gong2018 above.
  assumptions:
    - "Liu's zero-load rates k0off, k0'off are Bangasser's koff and koff,c, and the tension F of an engaged clutch is Bangasser's force Fi on one clutch (correspondences of quantities, not merged)"
    - "F >= 0 (tension), so |F| = F in Eq. 4; x't < 0 so that Bangasser's Fc is positive"
    - "the relation joins the rate laws; Bangasser fits Eq. 9 to Kong's lifetimes (ref. 32 there), Liu fits Eq. 4 to Elosegui-Artola's rates, and the fitted values differ"
# No other relation is entered. steady_linear (and its talin and cusp variants) against motor_clutch_ssa: as for
# chan2008 above, Bangasser's SSA loads clutches together through one shared substrate spring (load-and-fail),
# Liu's is the stationary master-equation distribution at constant flow with a local spring per clutch; Liu
# contrasts the two (p. 17) and no limit makes one the other. Bangasser's optimal_stiffness and its scaling and
# sensitivity models (nc_multiplier_eq5, scale_*_eq5, sensitivity_eq3, range_eq2, sr_eq4, nc_limits) concern the
# stiffness that maximizes traction in the SSA, which no Liu model outputs. binding_time_eq10 (mean time for nc
# clutches to bind) has no Liu counterpart: Liu's kon enters only through the steady-state distribution.

# Relations to Kong et al. 2009 (record kong2009; ref. 67), checked 2026-11-21: none entered.
# Liu cites ref. 67 once (Methods, p. 20), qualitatively: integrin-ECM bonds "exhibit catch-bond behaviour ...
# in the range 0-30 pN and force-induced bond dissociation at higher forces67", as the reason for the two-term
# off-rate Eq. 4. The fit of Eq. 4 and its parameters (k0off, k0'off, xt, x't; Table T1, p. 55; Fig. S4, p. 52)
# are to data "digitalized from ref. [10]" (elosegui2016), not from Kong, so no Liu datum names kong2009 and
# cited.yaml has no link to it. Kong's two models state no catch-bond law: survival_first_order (ln N = ln N0 - k t)
# reads one off-rate from a lifetime distribution, which no Liu model does; series_bonds (rates of two bonds in
# series add) has the same sum-of-rates form as Eq. 4, but Eq. 4's terms are two force-dependent pathways of one
# integrin-fibronectin bond, not two bonds in series, Liu does not say so, and a sum of two rates is a form too
# plain to relate. Kong's measured lifetimes against force (e.g. lt_FN_a5b1Fc_CaMg) could test Eq. 4 against
# independent data, but that is a validation run, not a relation between models.

# Relations to Alonso-Matilla, Provenzano & Odde 2023 (record alonsomatilla2023; ref. 49), checked 2026-11-21.
# Liu cites ref. 49 once (Discussion, p. 17): with the substrate as one spring for its global deformation,
# "it can be theoretically shown that for soft molecular clutches, the system will lose its ability to sense
# substrate rigidity and will always reach the same steady state ... regardless of the substrate stiffness ...49".
# That is a claim about ref. 49's own model (its mean field, Eqs. 3-4, has a steady state with a stationary
# substrate, in which the substrate stiffness drops out: rigid_steady_state, Eqs. S31-S36), not a mapping onto a
# Liu model; it is not entered (a test of mean_field against rigid_steady_state as K -> oo is a relation inside
# alonsomatilla2023, and mean_field takes about a minute per run on stiff substrates). No Liu datum names ref. 49,
# so cited.yaml has no link to alonsomatilla2023 (Liu's k0off, xt etc. are its own fit to elosegui2016's data;
# alonsomatilla2023's Delta = 2.4 nm and kB T = 4.114 pN nm are not Liu's values). alonsomatilla2023 is the earlier
# paper and does not cite Liu.
# Proposed below: the off-rate laws, as for chan2008, bangasser2013b and gong2018 above.
# Not entered:
# - alonsomatilla2023/rigid_steady_state and liu2025/steady_linear. On a rigid substrate (E -> oo, so k -> kc),
#   with slip bonds only (k0'off -> 0) and no cap (ly -> oo), Liu's Eqs. 8-9 are the same balance as Eqs. S31-S36:
#   clutches bind unstretched at kon per free site, stretch at the flow speed, unbind at k0off exp(xt kc l/kBT),
#   and the motors' linear force-velocity law balances the total clutch tension. Liu's bound fraction int pon dl =
#   kon Z/(v + kon Z) is S35's n_b* = tau beta*/(tau beta* + v_e*). Under F = sm Fst xt/(sc kBT),
#   tau = kon/k0off, omega = v0 kc xt/(kBT k0off), their outputs should agree as P = sc (kBT/xt) T* and
#   v = (kBT k0off/(xt kc)) v_e*. But every Alonso-Matilla output is dimensionless and every Liu output
#   carries a unit (Pa, nm/s, 1/um^2, pN), so no output pair can be compared without a helper model. A helper
#   is allowed only for a stated relation, and no paper states this one. A scales_as test would fail on the
#   unit prefactors in sc, kBT, xt, k0off and kc, not on the physics. The correspondence is recorded here for
#   a later job that may add the dimensional form.
# - alonsomatilla2023/bell_rupture_force (Fb = kB T / Delta) and fc_v_C10. They share only the input shape
#   (an energy and a length). Eq. C10's prefactor Nc/(beta xt) is the same ratio, but its output is the traction
#   per clutch site at a given flow, a different quantity from a characteristic rupture force. Liu's Eq. 4
#   uses that ratio as the Bell rupture force, kBT/xt, and that is the mapping of the relation below.
# - kopt_eq6 and the other optimum models. Liu outputs traction at one Young's modulus, not the stiffness that
#   maximizes it (as for bangasser2013b above). mean_field / mean_field_dimensional against steady_linear: one
#   shared global substrate spring (load-and-fail cycles, time-averaged traction in pN) against a local spring per
#   clutch at a stationary flow (a traction stress in Pa). These are the different mechanisms Liu contrasts on
#   p. 17, and no limit makes one the other except the rigid one above.
- id: rel_koff_eq4_slip_reduces_to_alonso_bell
  kind: reduces_to
  a: liu2025/koff_eq4
  b: alonsomatilla2023/clutch_off_rate_bell
  mapping: {koff: "k0off", Fc: "F", Fb: "kT/xt"}
  output_map: {koff_load: koff}
  limit: {k0offp: "0"}
  regime:
    k0off: [0.01, 1]
    k0offp: [0.01, 1]
    xt: [0.5, 1.5]
    xtp: [-0.2, -0.05]
    kT: [4.1, 4.3]
    F: [0, 20]
  provenance: proposed
  reason: >-
    The paper's slip-bond special case, k0'off = 0 in Eq. 4 (SI Appendix C, p. 42: "In the special
    case of slip-bonds"), leaves koff = k0off exp(xt |F|/kBT). That is Alonso-Matilla's Bell law for the clutch
    off-rate, k_off^load = k_off e^{|Fc|/Fb} (p. 2, ref. 52 there), with Fb = kBT/xt. Alonso-Matilla itself takes
    Fb = kB T / Delta, Delta from a fit of Bell's model (SI legend C). Liu cites ref. 49 only for a steady-state
    claim (p. 17), not for its off-rate, so the relation is proposed.
  assumptions:
    - "Liu's zero-load rate k0off of the slip term stands for Alonso-Matilla's unloaded off-rate k_off, Liu's tension F of an engaged clutch for the clutch force Fc, and Liu's xt for Alonso-Matilla's transition distance Delta (correspondences of quantities, not merged)"
    - "F >= 0 (tension), so |F| = F in both laws"
