- id: q_dt_steps
  kind: numerics
  about: [time_step_C, num_time_steps_C, simulation_time_C]
  text: >
    The drivers set time_step = 0.0002 (hours, by the comment "defaut is 0.002 hr"), num_time_steps =
    10000 and simulation_time = 20. The comments say "max is equal to (simulation_time*500)" and "2 is
    1000 timesteps", i.e. 500 steps per hour or 0.002 h per step, ten times the dt set; 10000 steps of
    0.0002 h last 2 h, not 20 h. How Chaste reconciles SetDt, SetNumTimeSteps and SetEndTime is in classes
    not released. The paper states no time step, and its migration runs last 24 hours (p. 29), not 20.
- id: q_rest_criterion
  kind: choice
  about: [rest_disp_C, rest_disp_D]
  text: >
    The paper's step 1 applies the protrusive force "only if it is at equilibrium (at rest)" without a
    criterion (bagchi2025 q_chain_not_runnable). The code's criterion is a leader-node x displacement in
    one time step of at most 1e-5 (C) or 1e-4 (D, H, "added 8-13-23, value before was 0.00001") in mesh
    units: a step-size-dependent threshold, and a tenfold difference between the versions.
- id: q_threshold_length
  kind: reading
  about: [max_threshold_length_C, max_threshold_length_D, constant_threshold_length_C]
  text: >
    The code passes max_threshold_division_length = 0.675 (and an unused constant 0.95) to the threshold
    division; the paper prints alpha_eps = 0.675 as a threshold division strain (Eq 10, S2/S3 Tables). In
    the code's units the cell rest length is 0.5, so 0.675 as a length would be a strain of 0.35. The
    method that uses the value is not released, so whether it is a length or a strain cannot be settled;
    the cited value matches the paper's number.
