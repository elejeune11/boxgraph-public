  text: >
    The folder named Chaste_12_30_22_control holds the latest edits of the three (dated up to 9-6-23,
    after the 8-14-23 and 9-5-23 folders). Its driver is set to the S3 Table's connected column for the
    damping and threshold profiles (gamma_eta 20, sigma_eta 1, gamma_eps 0.8, sigma_eps 2) and connected
    ligands (islongcollagen true), but to the disconnected column's sigma_k = 5; the disconnected values
