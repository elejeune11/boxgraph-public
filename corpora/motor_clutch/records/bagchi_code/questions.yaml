- id: q_framework_missing
  kind: unstated_model
  about: [chain_sim, kc_profile_extremes, stdev_kcell_C, nd_factor_kcell_C, max_threshold_length_C, kmin_duro_D, pbind_min_H]
  text: >
    The release keeps only the files the authors added (VertexAmrit/**, the *_ab drivers, MeshAttributes_ab).
    The methods that implement the paper's Eqs 10-14 are called but not defined there:
    SetVariableSpringConstant and SetVariableDampingConstant (Eqs 11, 12), GenerateBasicRandom_ab (the
    threshold division, Eq 10), SetSpringConstantDurotaxis (Eq 14), SetBindingProbabilityHaptotaxis (Eq 13),
    and the damping division of ComputeForcesIncludingDamping. They belong to Chaste classes the authors
    modified (MutableVertexMesh, CellsGenerator, AbstractNumericalMethod) and left out. So the formulas of
    Eqs 10-14 cannot be read in the code; only the parameters the drivers pass to them, and the drivers'
    own Gaussian block (lines 223-258), can.
