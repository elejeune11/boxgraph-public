- id: q_haptotaxis_rule
  kind: unstated_model
  about: [haptotaxis_H, pbind_min_H, pbind_max_H]
  text: >
    In H the cell-collagen link force acts only when the collagen node's binding probability is at least
    a fresh rand()/RAND_MAX (CollagenCellLinkForce_ab.cpp lines 94-97), drawn at every force evaluation,
    so a link that exists is switched on and off at random step by step rather than bound once, which the
    paper's "limits the node binding capacity" does not describe. rand() is never seeded (srand(time(0))
    is commented out, H line 149), so every run draws the same sequence. Eq 13's alpha appears nowhere in
    the released code; only the bounds 0 and 1 of the probability are set.
