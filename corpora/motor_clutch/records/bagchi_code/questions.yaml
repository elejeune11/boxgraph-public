- id: q_s3_columns
  kind: unexplained_difference
  about: [cmp_delta_eps_conn_C, cmp_delta_eps_conn_C_s10, cmp_delta_eps_disc_C, cmp_delta_eps_disc_D36, cmp_delta_eta_conn_C, cmp_delta_eta_disc_C]
  text: >
    In the drivers one s sets both the damping Gaussian (delta_eta) and the threshold Gaussian's prefactor
    (delta_eps). The S3 Table's columns are not one setting of it: the connected delta_eta (1.75e-71) needs
    s = 1, its sigma_eta, but its delta_eps (1.02e-19) needs s = 10; the disconnected delta_eta (3.97e-3)
    needs s = 8, its sigma_eta, but its delta_eps (6.11e-5, the S2 value) needs s = 10. As shipped, C
    (s = 1) gives 1.03e-18 for the connected delta_eps, ten times the printed 1.02e-19. The deltas may have
    been copied from runs with different settings, or the printed exponent -19 is a misprint of -18.
