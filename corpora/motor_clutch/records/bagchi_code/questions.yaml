- id: q_sim_not_run
  kind: unstated_model
  about: [chain_sim]
  text: >
    The chain simulation is not ported: the Chaste classes it depends on are not in the release
    (q_framework_missing), and the drivers stop before Solve() (q_exit_before_solve). The paper's simulated
    results (rest after 6 and 21 min, speed and traction ratios, migration efficiencies) therefore remain
    unchecked by the code as well as by the paper (bagchi2025 q_chain_not_runnable). What the released
    files do settle for the paper's unstated rules: the clutch rule (after each protrusion the leader node
    attaches to the nearest collagen node, measured in x, and keeps its rest length if the node is
    unchanged; OffLatticeSimulation_ab1.cpp lines 474-525), forces between layers in x only, protrusion
    at both end nodes, the rest criterion (q_rest_criterion), the meshes' sizes and the time step
    (q_dt_steps).
- id: q_no_cross_validation_bagchi2025
  kind: unstated_model
  about: [chain_sim, bagchi2025/v_ratio_af_rf_p5, bagchi2025/v_ratio_af_rf_s2a_p16, bagchi2025/v_ratio_af_rf_s3a_p16, bagchi2025/v_ratio_af_rf_s3a_p12]
  text: >
    No validation of this record's models against bagchi2025's measurements, and none the other way. This
    record holds no measurements (it is software: every datum is a code parameter), so no bagchi2025 model
    can be tested against it. Of bagchi2025's measurements (the AF/RF speed ratios 1.56, 1.33, 1.34 and the
    measured panels of Figs 1, 2, 4 and S1-S3: strain rates, speeds, tractions, stresses, cell areas,
    divisions, correlation functions, fibre-angle histograms), the paper compares only the speed and
    traction ratios, the strain-rate wave order and chi_4 with its simulation (p. 16: "in experiments we
    had observed that cells on AF travel 1.56–1.33 times faster"). The only model here that could produce
    them is chain_sim, which is not runnable (q_sim_not_run), and its one declared output is a rest time,
    which no measurement quantifies. The runnable models (stiffness_unit_map, damping_unit_map,
    driver_profile_extremes, kc_profile_extremes) give parameter values and profile extremes, not measured
    quantities. A comparison of the simulated connected/disconnected speed ratio with the measured AF/RF
    ratio would also need connected ligand to stand for AF, a mapping the paper assumes.
  citation: {none: "the statement quoted is on bagchi2025's p. 16, not in this record's code files"}
