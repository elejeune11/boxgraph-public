- id: q_exit_before_solve
  kind: possible_error
  about: [chain_sim]
  text: >
    As released, every driver calls exit(0) after setting the meshes' parameters and before any force is
    added or Solve() is called (C line 424, D line 437, H line 455, each "uncommented 10-20-22 for
    plotting Kx, t_d_l, dc"). Run as the README says (ctest -R TestRunningVertexBasedSimulationTutorial_ab1),
    none of the three versions simulates anything; the line must be commented out to produce the paper's
    simulations. The README also names the test "Simulation" where the file says "Simulations".
  citation: {file: Chaste_12_30_22_control/cell_based/test/VertexAmrit/TestRunningVertexBasedSimulationsTutorial_ab1.hpp, lines: "424", quote: "exit(0);		//uncommented 10-20-22 for plotting Kx, t_d_l, dc"}
- id: q_code_units
  kind: unstated_input
  about: [stiffness_unit_map, damping_unit_map, collagen_k_C, substrate_k_C, cell_collagen_link_k_C, substrate_collagen_link_k_C, protrusive_force_C, nd_factor_dc_D, cmp_kl_map, cmp_kcl_map, cmp_kls_map, cmp_eta_l_map, cmp_eta_c_map]
  text: >
    The code writes stiffnesses, dampings and the protrusive force without units (500, 1500, 2500, 1000;
    2, 2, 5; 6750), and the paper states no conversion to the S1 Table's nN/um, nN um-1 s and nN. The
    comparisons test the hypothesis of one factor per kind: the substrate spring's factor 6.17/500 maps the
    collagen spring and both links onto the S1 Table, and the substrate damping's 0.22/2 maps the collagen
    and cell damping, so the S1 Table is the code's set in other units. The protrusive force has no second
    force to test a factor on (6750 against 3083 nN). Two consequences for the paper: (1) the S2/S3 Tables
    mix units: gamma_eta (75, 20, 400) and gamma_k are the code's numbers in code units (nd_factor_dc_D =
    75), while beta_eta (0.55, 0.28) is in nN um-1 s (the code has 5 and 2.51); this is the factor of
    about 9 the paper record finds in Eq 12 (bagchi2025 q_eq12_scale) and, for stiffness, the factor of
    about 81 (500/6.17) it finds in Eq 11 (bagchi2025 q_eq11_scale). (2) the factors also fix the code's
    time and length units only together with the force unit, which neither source states; the code's
    comment gives hours for the time step.
- id: q_gamma_k
  kind: unexplained_difference
  about: [nd_factor_kcell_C, nd_factor_kcell_D]
  text: >
    The drivers pass ND_factor_kcell = 100 to SetVariableSpringConstant in all three versions (comments:
    "//10", and "made it to 100 (10000000 - OG)"), while the S2 Table prints gamma_k = 1000 and the S3
    Table 1000 (connected) and 10000 (disconnected). With SetVariableSpringConstant not released, whether
    the method multiplies the factor further cannot be seen.
- id: q_cell_spring_50
  kind: unexplained_difference
  about: [cell_k_D, cmp_kc_map_D]
  text: >
    D and H set a uniform cell spring stiffness of 50 (SetSpringConstant after SetVariableSpringConstant),
    which the substrate factor maps to about one eighth of the S1 Table's 4.92 nN/um (0.8 times the
    substrate's 6.17, i.e. 400 in code units). C comments both lines out ("commented 8-16-23"). Which of
    the two calls sets the cell springs in D and H is decided in MutableVertexMesh, not released.
