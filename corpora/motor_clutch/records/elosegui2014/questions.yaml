- id: q_koff_column_multiplier
  kind: possible_error
  about: [koff_a5b1, koff_avb6, kont_a5b1, kont_avb6]
  text: >
    The Fig. 2a table heads its columns 'Kont (M-1 s-1 x 10^5)' and 'Koff (s-1 x 10^2)'. Read the same way
    for both columns (value x 10^n), kont is 7.724e5 and 3.893e5 M^-1 s^-1, plausible, but koff is 49.44 and
    1506 s^-1, implausibly fast for bonds whose dissociation is followed over 60 s in Fig. 2a. If instead the
    koff column shows koff x 10^2, koff is 4.944e-3 and 0.1506 s^-1. The header is ambiguous or uses opposite
    conventions in its two columns. The record enters both literally; every comparison uses ratios within a
    column, where the multiplier cancels.
  citation: {page: 3, printed_page: "633", quote: "Integrin Kont (M−1 s−1 × 105) Koff (s−1 × 102)", where: "Fig. 2a table"}
- id: q_kon_fivefold
  kind: unexplained_difference
  about: [cmp_kon_fivefold, kon_fold_model, kon_ratio_pred]
  text: >
    With the paper's own kon = kont * dint, its printed kont values (ratio 0.504) and its fivefold density ratio,
    kon(avb6)/kon(a5b1) is about 2.5, but the clutch model was run with kon fivefold, said to match the trends
    measured in Fig. 2. The paper also argues from bead recruitment (Fig. 2d-g, Supplementary Note 2, unreadable
    here) that kon had to increase even more than koff; with the SPR koff ratio of about 30 that would need a kon
    ratio above 30, while the model's own koff ratio is 3. The fivefold kon matches neither the kont*dint estimate
    nor the 'more than koff' argument with the SPR values; it agrees only with 'more than the model's own koff'.
  citation: {page: 2, printed_page: "632", quote: "indicating that kon had to increase", where: text}
- id: q_koff_threefold
  kind: unexplained_difference
  about: [cmp_koff_threefold, koff_fold_model, koff_ratio_spr]
  text: >
    The SPR koff values give koff(avb6)/koff(a5b1) of about 30 (15.06 / 0.4944), described as 'strongly
    increased'; the clutch model raises koff only threefold and calls this 'matching thus the trends in bond
    dynamics ... measured in Fig. 2'. The match is in direction only, not in magnitude (a factor of ten apart).
    The paper does not say why the model's factor is 3 (the SI, which may, is unreadable here).
  citation: {page: 6, printed_page: "636", quote: "koff (threefold), matching thus the trends in bond dynamics", where: text}
- id: q_kon_dimension
  kind: reading
  about: [kon_eff_ratio]
  text: >
    kon = kont * dint is not dimensionally homogeneous as printed: kont is in M^-1 s^-1 (a 3D rate constant),
    dint is an areal density (integrins per um^2, Fig. 2b), and kon in a clutch model is a rate in s^-1. A
    conversion factor (a binding volume or reach) is implied but not stated. The record uses the relation only
    as a ratio between two integrin types, where that factor cancels if it is the same for both.
  citation: {page: 2, printed_page: "632", quote: "defining an effective binding rate kon as kon", where: text}
