- id: q_xval_bangasser2013b_none
  kind: choice
  about: [integrin_clutch_sim, kon_eff_ratio, koff_ratio, kont_ratio, density_fold]
  text: >
    No model of this record is entered as predicting a measurement of bangasser2013b. This paper's ref. 20
    is Bangasser, Rosenfeld and Odde 2013 (Biophys. J.; the bangasser2013 record), not bangasser2013b, and
    neither paper says one's model explains the other's data. bangasser2013b is a theory paper: its only
    measurements are the run times of its ODE and Monte Carlo software on the authors' computer (Fig. 6b,
    fig6b_ode_cal, fig6b_mc1_cal, fig6b_mc100_cal), which no model here predicts; the integrin-FN clutch
    model is not runnable in any case (q_si_unreadable), and the other models are ratios of this paper's
    SPR rates and densities. In the other direction, see bangasser2013b/q_xval_elosegui2014_none.
  citation: {page: 4, printed_page: "634", quote: "one proposed previously7,20 (see Fig. 3 and Methods for details)", where: text}
# cross-record validation against bangasser2013 (2026-11-02): none added
- id: q_xval_bangasser2013_none
  kind: choice
  about: [integrin_clutch_sim, kon_eff_ratio, koff_ratio, kont_ratio, density_fold]
  text: >
    (Cross-record validation.) No model of this record is validated against a measurement of
    bangasser2013 (ref. 20). Its measurements, all quoted from other works, are: normalized migration
    of four cell types (Fig. 1A), normalized traction of three (Fig. 1B), Kong et al.'s integrin-FN
    bond lifetimes against force (Fig. 7C), and Chan and Odde's neuron retrograde flows (Fig. S1B).
    The one model here about clutches on substrates, integrin_clutch_sim, is not runnable
    (q_si_unreadable). It outputs traction, actin flow and integrin density for myoepithelial cells,
    with parameters for those cells, and the paper applies it to none of these cell types. The Kong
    lifetimes are an input of that model, not a prediction ("koff values determined experimentally
    ... as a function of the applied force", p. 4; see q_no_validation_kong2009). The other models are
    ratios of this paper's own SPR rates and integrin densities, which bangasser2013 does not measure.
    The paper cites ref. 20 for the model it expands on and for how rates modulate rigidity sensing,
    not as data its model explains. In the other direction, see bangasser2013/q_xval_elosegui2014_none.
  citation: {page: 4, printed_page: "634", quote: "To address this, we developed a model that expands on", where: text}
