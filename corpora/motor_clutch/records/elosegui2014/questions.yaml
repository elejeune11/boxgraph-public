  kind: unstated_model
  about: [integrin_clutch_sim, flow_model_fig3e, kont_ratio, koff_ratio, kon_eff_ratio, density_fold]
  text: >
    (Cross-validation.) No model of this record is validated against the measurements of gardel2008
    (ref. 26: local traction stress and F-actin speed in PtK1 focal adhesions). The paper cites ref. 26 only
    for a trend: the clutch model gives "an inverse relationship between force and actin rearward flow as
    previously reported" (Fig. 3e). That is a qualitative agreement, and gardel2008 measures no quantity on
    substrate stiffness that the model outputs at stated conditions. Even so, the model cannot be run: its
    equations and parameters are in the unreadable Supplementary Information (q_si_unreadable). The
    other models are ratios of this paper's own SPR rates and integrin densities, which gardel2008 does
    not measure.
