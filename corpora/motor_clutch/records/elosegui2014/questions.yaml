- id: q_no_validation_bell1978
  kind: unstated_model
  about: [integrin_clutch_sim, kont_ratio, koff_ratio, kon_eff_ratio, density_fold, detachment_time_fig2c]
  text: >
    (Cross-validation.) No validation was added between this record and bell1978 (ref. 9). The paper
    cites Bell only for bonds whose unbinding is "determined by force"; it never says Bell's model
    predicts any of its measurements, nor that its own models predict Bell's. Of this record's
    measurements, only the bead detachment times of Fig. 2c (0.5 nN, at most 2 min) are a quantity a
    bell1978 model (Eq. 17 or 22) outputs, but running it would need the number of integrin-FN bonds
    per bead and the bond's barrier range, which neither paper states, and a k- whose power of ten is
    ambiguous here (q_koff_column_multiplier); the paper also treats a5b1-FN as a catch bond, not a
    Bell slip bond. The other measurements (tractions, actin flow, integrin densities and recruitment,
    SPR responses) are outputs of no bell1978 model. In the other direction, this record's clutch
    model is not runnable (q_si_unreadable) and its other models are ratios of its own values, so none
    predicts bell1978's measurements (a force of about 1 dyne on a cell, sugar concentrations).
  citation: {page: 1, printed_page: "631", quote: "bonds, which have long been described to be determined by force9", where: text}
