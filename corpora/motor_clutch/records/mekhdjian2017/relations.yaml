    - "represent reinforcement as recruitment of new clutches from a finite pool: kadd* = kadd nthreshold favailable, with nthreshold the number of clutches above Fthreshold and favailable = (nclutch,max - nclutch(t))/nclutch,max (Eqs. 10-12), in place of a raised binding rate"
    - "keep the conversion of the 1D simulated force to a 2D traction stress over a circular adhesion of radius radhesion (Ghibaudo et al.), as Elosegui-Artola et al. 2014 used with their stochastic simulations (Supplement p. 24, Eqs. 4-5)"
  provenance: stated
  citation: {page: 26, quote: "Based on recent studies investigating mechanisms of stiffness-dependent adhesion reinforcement", where: "Supplement: Addition of a kinetic rate for clutch reinforcement"}
  assumptions:
    - "the main text (p. 6) calls this paper's model 'similar to recently proposed models (Elosegui-Artola et al., 2014, 2016)'; 'similar to' and 'based on' are read as a derivation in words, with the steps above taken from the Supplement's own description of how its rule differs"
    - "the paper reads Elosegui-Artola et al. 2014's reinforcement as recruitment of more integrin via force on a catch bond ('direct force applied to an integrin-fibronectin catch bond that recruits more integrin', p. 26); elosegui2014's own words (its p. 4) are that integrin density increases when the force on a bond exceeds a threshold before breakage"
    - "unverifiable by test: elosegui2014/integrin_clutch_sim is not runnable, so no mapping is given; both models take the substrate as a Young's modulus in kPa"

