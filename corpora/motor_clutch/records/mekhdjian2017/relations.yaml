# Relations this paper states about its models. a is derived from b.
- id: rel_reinforced_from_bangasser2013
  kind: derived_from
  a: mekhdjian2017/motor_clutch_reinforced
  b: bangasser2013/motor_clutch_ssa
  steps:
    - "the first-reaction ('indirect') Gillespie method is replaced by the direct method: one random number for the time step from the summed rates (Eq. 13), a second to select the event"
    - "a third kind of event is added: a new, unbound clutch joins at the substrate position at rate kadd* = kadd nthreshold favailable (Eqs. 10-12), up to nclutch,max; clutches are never removed"
    - "the substrate spring is given as an effective Young's modulus by Eq. 5 and the traction as a stress by Eq. 4, both through an adhesion radius"
  provenance: stated
  citation: {page: 28, quote: "instead of a separate random variable for each event (the indirect approach), as was used previously(Bangasser et al., 2013)", where: "Supplement: Model implementation"}
  assumptions:
    - "with kadd = 0 the clutch rules (Bell slip bond, linear force-velocity, force balance, clutch position update) are those of Bangasser et al. 2013, as the Supplement says ('as previously described'); the parameter values Fm, vu, kon, koff, Fb, κc of Figs. 5b and S4b equal Bangasser et al.'s Table 1 base set, only nm and nc differ"
- id: rel_reinforced_from_chan2008
  kind: derived_from
  a: mekhdjian2017/motor_clutch_reinforced
  b: chan2008/motor_clutch
  steps:
    - "Chan and Odde's filopodial motor-clutch model (fixed-step Monte Carlo) is taken over through Bangasser et al. 2013 and simulated by the direct Gillespie method"
    - "the filopodium becomes a whole simulated cell: its spread area is added through an actin mass balance (Eqs. 6-9), and clutch reinforcement through Eqs. 10-12"
  provenance: stated
  citation: {page: 24, quote: "We modified an existing motor-clutch model of cell traction forces generated by neuron", where: "Supplemental Materials, first paragraph"}
  assumptions:
    - "Chan and Odde sign retrograde quantities negative; this record takes them positive"
- id: rel_reinforced_offrate_from_bell
  kind: derived_from
  a: mekhdjian2017/motor_clutch_reinforced
  b: bell1978/loaded_reverse_rate
  steps:
    - "each engaged clutch unbinds at koff exp(Fclutch/Fbond), a single exponential Bell law with characteristic bond force Fbond"
  provenance: stated
  citation: {page: 24, quote: "scales with clutch extension according to a single exponential Bell", where: "Supplemental Materials, first paragraph"}
  assumptions:
    - "Bell's kT/γ is the characteristic bond force Fbond and Bell's force per bond is the force on one clutch"
# Proposed (relator, pairing with bangasser2013): with no reinforcement (kadd = 0, nclutch,max = nclutch) the
# reinforced model has the clutch rules of Bangasser et al.'s SSA, and the direct and first-reaction Gillespie
# methods sample the same process; only the random stream and the run length (10^6 events against 1000 s)
# differ. Eq. 5 turns Bangasser's κsub into an effective modulus: E[kPa] = 9 κsub[pN/nm] / (4 π r[nm] 1e-3);
# r_adh is fixed at the record's added 550 nm, which cancels in the traction force and the flow.
# Not entered: bangasser2013/catch_slip_eq9 against motor_clutch_reinforced: Mekhdjian uses only the slip
# bond (Supplement p. 24, "a single exponential Bell's law"), never Eq. 9's catch term, and a rate law and a
# whole simulation share no output; the "same shape" match is only in port dimensions. The optimum stiffness
# (traction_optimum, a curve-processing model in kPa) against bangasser2013/optimal_stiffness: one takes a
# whole curve, so relations cannot test it; Mekhdjian cites Bangasser only for the existence of an optimum.
# No cited.yaml: no datum of this record says it is taken from Bangasser et al. (no from_source); the per-
# molecule values equal Bangasser's Table 1 but the paper does not say they were taken from it.
- id: rel_ssa_approx_reinforced_flow
  kind: approximated_by
  a: bangasser2013/motor_clutch_ssa
  b: mekhdjian2017/motor_clutch_reinforced
  mapping: {nm: "nm", Fm: "Fm", vu: "vu", nc: "nc", kon: "kon", koff: "koff", Fb: "Fb", kc: "kc",
            E: "9000*ksub/(4*pi*550)", r_adh: "550", kadd: "0", Fthresh: "1e9", ncmax: "nc"}
  output_map: {v_retro: v_retro}
  regime: {nm: [40, 60], Fm: [1.6, 2.4], vu: [100, 140], nc: [40, 60], kon: [0.24, 0.36], koff: [0.08, 0.12],
           Fb: [1.6, 2.4], kc: [0.64, 0.96], ksub: [0.01, 100]}
  tolerance: 0.1
  provenance: proposed
  reason: >-
    Mekhdjian et al. say their clutch rules and position update are Bangasser et al.'s ("as previously
    described (Bangasser et al., 2013)", Supplement p. 28) and that only the Gillespie variant changes, from
    the indirect (first-reaction) to the direct method, plus reinforcement. With kadd = 0 there is no
    reinforcement, and the two algorithms are exact samplings of one Markov process, so the time-averaged
    flows should agree up to run noise.
  assumptions:
    - "kadd = 0 and nclutch,max = nclutch: no clutch is ever added (Fthresh is then unused); the Fig. 5 runs of this paper are of this kind"
    - "E from κsub by this paper's Eq. 5 with r_adh = 550 nm (the record's added value); the flow does not depend on r_adh once κsub is fixed"
    - "regime: +-20% around Bangasser et al.'s Table 1 base set, over Fig. 2's stiffness range (0.01-100 pN/nm)"
    - "tolerance 0.1 (added): allows for the noise of one seeded run of each and the different run lengths"
- id: rel_ssa_approx_reinforced_traction
  kind: approximated_by
  a: bangasser2013/motor_clutch_ssa
  b: mekhdjian2017/motor_clutch_reinforced
  mapping: {nm: "nm", Fm: "Fm", vu: "vu", nc: "nc", kon: "kon", koff: "koff", Fb: "Fb", kc: "kc",
            E: "9000*ksub/(4*pi*550)", r_adh: "550", kadd: "0", Fthresh: "1e9", ncmax: "nc"}
  output_map: {F_sub: F_mean}
  regime: {nm: [40, 60], Fm: [1.6, 2.4], vu: [100, 140], nc: [40, 60], kon: [0.24, 0.36], koff: [0.08, 0.12],
           Fb: [1.6, 2.4], kc: [0.64, 0.96], ksub: [0.01, 100]}
  tolerance: 0.1
  provenance: proposed
  reason: "as rel_ssa_approx_reinforced_flow, for the time-averaged traction force κsub x_sub (before Eq. 4 makes it a stress)"
  assumptions:
    - "both outputs are the time average of κsub x_sub in pN"
    - "mapping, regime and tolerance as in rel_ssa_approx_reinforced_flow"

# Relations to Bangasser and Odde 2013 (Cell Mol Bioeng, record bangasser2013b; relator, 2026-11-22).
# This paper never cites bangasser2013b: its "Bangasser et al., 2013" is the Biophys J paper (record
# bangasser2013; reference lists p. 19 and p. 30), so no relation is stated and no value is taken from it
# (no cited.yaml). bangasser2013b states that its clutch-ensemble ODEs approximate the Gillespie MC of
# Bangasser et al. 2013 (bangasser2013b relations, rel_ssa_flow_approximated_by_ode); this paper states
# that its clutch rules are that MC's. One direct relation is therefore proposed, with reinforcement off.
# Not entered: the cycle time (motor_clutch_reinforced outputs no load-and-fail cycle time); the traction
# (clutch_ensemble_cycle outputs no mean force); the optimum (traction_optimum processes a whole curve and
# clutch_ensemble_optimum is the minimum of flow, not the maximum of traction); Eq. 30 and the Eq. 31
# arithmetic, which this paper never uses.
- id: rel_reinforced_flow_approximated_by_ensemble_ode
  kind: approximated_by
  a: mekhdjian2017/motor_clutch_reinforced
  b: bangasser2013b/clutch_ensemble_cycle
  mapping: {nm: "nm", Fm: "Fm", vu: "vu", nc: "nc", kon: "kon", koff: "koff", Fb: "Fb", kc: "kc",
            ks: "4*pi*r_adh*E*1e-3/9", r: "2"}
  output_map: {v_mean: v_retro}
  regime: {nm: [75, 75], Fm: [2, 2], vu: [120, 120], nc: [75, 75], kon: [1, 1], koff: [0.1, 0.1], Fb: [2, 2],
           kc: [5, 5], E: [0.130221, 0.130221], r_adh: [550, 550], kadd: [0, 0], Fthresh: [1.0e9, 1.0e9],
           ncmax: [75, 75]}
  tolerance: 0.25
  provenance: proposed
  reason: >-
    With kadd = 0 this paper's model has the clutch rules of Bangasser et al. 2013's SSA ("as previously
    described", Supplement p. 28), sampled by the direct instead of the first-reaction Gillespie method.
    Bangasser and Odde 2013 state that their mean-field clutch-ensemble ODEs (Eqs. 8-12 with the gamma
    closure Eq. 19, r = 2 in their Fig. 2) approximate that MC "for many clutches" (their p. 453). So the
    ODE's cycle-mean flow is proposed to approximate this model's time-averaged retrograde flow, at the
    conditions where Bangasser and Odde make that comparison.
  assumptions:
    - "kadd = 0 and nclutch,max = nclutch: no clutch is added (Fthresh is then unused), so the ensemble size is fixed as in the ODEs"
    - "κsub from E by this paper's Eq. 5 with r_adh = 550 nm (this record's added value); E = 0.130221 kPa gives κsub = 0.1 pN/nm, the Fig. 2 stiffness of bangasser2013b"
    - "pinned at bangasser2013b's Table S1 base set (Chan and Odde's), the only conditions at which that paper states the MC-ODE comparison; the stochastic run (10^6 events) is too slow to sweep"
    - "the time-averaged flow of a long stochastic run and the ODE flow averaged over one load-and-fail cycle both stand for the mean retrograde flow (a correspondence of quantities: retrograde_flow_rate and cycle_mean_flow_rate)"
    - "tolerance 0.25 is the relator's choice, as in bangasser2013b's own MC-ODE relations"

# Relations to Bangasser et al. 2017 (Nat Commun, record bangasser2017; relator, 2026-11-22).
# Neither paper cites the other (this paper's reference lists, pp. 19 and 30, have only Bangasser et
# al. 2013; bangasser2017 never names Mekhdjian et al.), so no relation is stated and no value is taken
# across (no cited.yaml). Both build on Bangasser et al. 2013's clutch rules and both simulate them by
# the direct Gillespie method; bangasser2017's one-module stand-in (module_ssa) and this paper's model
# with reinforcement off are then one Markov process, proposed below as approximated_by (two stochastic
# runs differing in run length and random stream). Not entered: bangasser2017/cms against
# motor_clutch_reinforced (the "same shape" of ports): the cms is not runnable in its record and adds
# module turnover, polymerization and a cell body; the single-module comparison tests the shared
# rules. off_rate_eq1 / motor_velocity_eq2: this paper has no separate off-rate or force-velocity
# model to relate. spread_area_pss (Eqs. 6-9) against g_actin_pool / polymerization_eq3: both are
# actin mass balances, but one processes a whole flow curve, so relations cannot test it.
# Relator's check: at the base set and κs = 1 pN/nm one run gives 54.6 nm/s here against 54.7-55.2 for
# module_ssa; the relation test over the regime gives not_verified (max relative error 0.208 flow,
# 0.298 traction), left as found; the update order and run lengths noted below are candidate causes.
- id: rel_module_ssa_approx_reinforced_flow
  kind: approximated_by
  a: bangasser2017/module_ssa
  b: mekhdjian2017/motor_clutch_reinforced
  mapping: {nm: "nm", Fm: "Fm", vu: "vm", nc: "nc", kon: "kon", koff: "koff", Fb: "Fb", kc: "kc",
            E: "9000*ks/(4*pi*550)", r_adh: "550", kadd: "0", Fthresh: "1e9", ncmax: "nc"}
  output_map: {v_retro: v_flow}
  regime: {nm: [80, 120], Fm: [1.6, 2.4], vm: [100, 140], nc: [60, 90], kon: [0.8, 1.2], koff: [0.08, 0.12],
           Fb: [1.6, 2.4], kc: [0.64, 0.96], ks: [0.01, 100]}
  tolerance: 0.1
  provenance: proposed
  reason: >-
    Bangasser et al. 2017 build each module of their simulator on the rules of Bangasser et al. 2013
    ("each following rules as previously", p. 7) and simulate it by the direct Gillespie method (their
    Eqs. 10-11); Mekhdjian et al. take the same rules ("as previously described (Bangasser et al.,
    2013)", Supplement p. 28) and the same direct method (Eq. 13), adding clutch reinforcement. With
    kadd = 0 the two sample one Markov process, so their time-averaged retrograde flows should agree up
    to run noise.
  assumptions:
    - "module_ssa is bangasser2017's one-module stand-in for its whole-cell simulator (reconstructed: fixed cell body, no polymerization or module turnover)"
    - "kadd = 0 and nclutch,max = nclutch: no clutch is ever added (Fthresh is then unused)"
    - "E from κs by this paper's Eq. 5 with r_adh = 550 nm (this record's added value); the flow does not depend on r_adh once κs is fixed"
    - "both advance engaged clutches with the flow set by the substrate position before the event; module_ssa does so before executing the event, motor_clutch_reinforced after, so a clutch bound in the event is stretched over that interval in the latter only"
    - "regime: +-20% around bangasser2017's Supplementary Table 2 module set (n*m = 100, n*c = 75, kon = 1 1/s, koff = 0.1 1/s, Fb = Fm = 2 pN, v*m = 120 nm/s, κc = 0.8 pN/nm), over κs = 0.01-100 pN/nm"
    - "tolerance 0.1 (added): allows for the noise of one seeded run of each and the different run lengths (500 s against 10^6 events, about 10^4 s)"
- id: rel_module_ssa_approx_reinforced_traction
  kind: approximated_by
  a: bangasser2017/module_ssa
  b: mekhdjian2017/motor_clutch_reinforced
  mapping: {nm: "nm", Fm: "Fm", vu: "vm", nc: "nc", kon: "kon", koff: "koff", Fb: "Fb", kc: "kc",
            E: "9000*ks/(4*pi*550)", r_adh: "550", kadd: "0", Fthresh: "1e9", ncmax: "nc"}
  output_map: {F_sub: F_trac}
  regime: {nm: [80, 120], Fm: [1.6, 2.4], vm: [100, 140], nc: [60, 90], kon: [0.8, 1.2], koff: [0.08, 0.12],
           Fb: [1.6, 2.4], kc: [0.64, 0.96], ks: [0.01, 100]}
  tolerance: 0.1
  provenance: proposed
  reason: "as rel_module_ssa_approx_reinforced_flow, for the time-averaged traction force κs xs (before Eq. 4 makes it a stress)"
  assumptions:
    - "both outputs are the time average of κs xs in pN, positive in the retrograde direction"
    - "mapping, regime and tolerance as in rel_module_ssa_approx_reinforced_flow"

# Relations to Bell 1978 (record bell1978; relator, 2026-11-22). The paper cites Bell once, for the clutch
# off-rate (Supplement p. 24); rel_reinforced_offrate_from_bell above records that in words against the whole
# simulation. To test it, the off-rate rule the simulation applies to each clutch is entered as the helper
# model bell_off_rate, and stated equal to Bell's loaded reverse rate (Bell p. 623, k- exp(γF/kT Nb)).
# Not entered: bell1978/detach_time_eq17 against motor_clutch_reinforced. Their ports share only dimensions:
# Eq. 17 is the time for a cell under a constant applied force to lose all its bonds, with no motors, flow or
# substrate spring; the clutch model outputs time averages of flow and traction over a run, and t_sim is
# only the length of the run. No paper relates them. No cited.yaml: no datum of this record is taken from Bell.
- id: rel_bell_reverse_rate_same_as_clutch_off_rate
  kind: same_as
  a: bell1978/loaded_reverse_rate
  b: mekhdjian2017/bell_off_rate
  # 1 dyne = 1e7 pN; kT/gamma in eV/nm is 160.2176634 pN
  mapping: {koff: "k_minus", Fclutch: "1e7*f", Fb: "160.2176634*kT/gamma"}
  output_map: {koff_star: k_minus_F}
  regime: {k_minus: [0.01, 10], gamma: [0.1, 1], f: [0, 2.0e-6], kT: [0.025, 0.027]}
  provenance: stated
  citation: {page: 24, quote: "scales with clutch extension according to a single exponential Bell", where: "Supplemental Materials, first paragraph"}
  assumptions:
    - "Bell's force per closed bond F/Nb is the force on one clutch, Fclutch = κclutch × extension (correspondence of quantities, not merged)"
    - "the characteristic bond force Fbond stands for Bell's kT/γ; Bell does not print this combination as a parameter"
    - "regime (relator's): Bell's γ ~ 0.1-1 nm and kT near 37 °C; forces up to 20 pN per clutch, about ten times Fbond = 2 pN"

# Relations to Chan and Odde 2008 (Science, record chan2008; relator, 2026-11-22). The paper cites Chan and
# Odde for the model it modifies (Supplement p. 24; main text pp. 5, 6, 14, 17); rel_reinforced_from_chan2008
# above records that in words. Two testable relations are proposed below: the same off-rate rule, and the
# whole simulation with reinforcement off. Chan and Odde sign Fm, vu, Fb and clutch tensions negative
# (retrograde = -x, their Table S1); this record takes them positive, so the mappings negate them.
# Not entered: chan2008/cerruti_force_eq11 against motor_clutch_reinforced (the "same shape" of ports, force
# from length and pressure): Eq. 11 turns two measured bead displacements into a point force, a processing
# step of Chan's experiment with no motors or clutches; the simulation shares only port dimensions.
# chan2008/ksub_eq13 against modulus_eq5: both convert between a substrate spring and a Young's modulus, but
# by different geometries (Chan's 1-D Cerruti length δ with Poisson's ratio, κ = πEδ/(1+ν); this paper's
# circular adhesion after Ghibaudo et al., E = 9κ/(4πr)), neither paper relates them, and with no shared
# length the two give no common law to test. chan2008/motor_clutch_E: the same simulation as motor_clutch
# with Eq. 13 in front; the motor_clutch relation below tests the shared rules without the differing E-to-κ
# step. chan2008/force_velocity_eq3: this record has no separate force-velocity model. No cited.yaml: no
# datum of this record says it is taken from Chan and Odde (no from_source), and the clutch parameters of
# Figs. 5b and S4b are Bangasser et al.'s base set, not Chan's Table S1 (Chan's nc = 75, κc = 5 pN/nm,
# kon = 1 1/s differ).
# Relator's check (2026-11-22): the two simulation relations below test not_verified (max relative error
# 0.98 flow, 0.85 traction), left as found. The mapping is not the cause: at Chan's Table S1 set one seeded
# run each gives, for κsub = 0.01 / 0.1 / 1 / 10 / 100 pN/nm, flows of 94 / 81 / 82 / 107 / 109 nm/s for
# Chan's model at his printed Δt = 5 ms against 56 / 47 / 29 / 103 / 109 nm/s here; with Δt = 0.5 ms Chan's
# model gives 67 / 51 / 32 / 103 / 107 nm/s. The miss is mostly the fixed 5 ms step on soft substrates (where
# the step is not small against clutch binding and loading), plus the update order noted for module_ssa.
- id: rel_chan_off_rate_same_as_clutch_off_rate
  kind: same_as
  a: chan2008/off_rate_eq1
  b: mekhdjian2017/bell_off_rate
  mapping: {koff: "koff", Fclutch: "-Fclutch", Fb: "-Fb"}
  regime: {koff: [0.01, 10], Fclutch: [-20, 0], Fb: [-2.4, -1.6]}
  provenance: proposed
  reason: >-
    This paper's simulation is Chan and Odde's motor-clutch model modified ("We modified an existing
    'motor-clutch' model ... (Chan and Odde, 2008; Bangasser et al., 2013)", Supplement p. 24), and its
    clutch unbinding rule is "a single exponential Bell's law model ... and a characteristic bond force,
    Fbond", which is Chan's Eq. 1, koff* = koff exp(Fclutch/Fb). The two are the same law once Chan's
    negative signs are turned positive.
  assumptions:
    - "Chan's Fclutch and Fb are negative by his sign convention (Table S1: Fb = -2 pN); here both are positive, which leaves the ratio Fclutch/Fb unchanged"
    - "Chan's clutch_tension and this record's clutch_force both stand for the force on one engaged clutch, κclutch times its extension (correspondence of quantities, not merged)"
    - "regime (relator's): clutch forces up to ten times |Fb|, |Fb| within 20% of 2 pN"
- id: rel_chan_clutch_approx_reinforced_flow
  kind: approximated_by
  a: chan2008/motor_clutch
  b: mekhdjian2017/motor_clutch_reinforced
  mapping: {nm: "nm", Fm: "-Fm", vu: "-vu", nc: "nc", kon: "kon", koff: "koff", Fb: "-Fb", kc: "kc",
            E: "9000*ksub/(4*pi*550)", r_adh: "550", kadd: "0", Fthresh: "1e9", ncmax: "nc"}
  output_map: {v_retro: v_retro}
  regime: {nm: [60, 90], Fm: [-2.4, -1.6], vu: [-144, -96], nc: [60, 90], kon: [0.8, 1.2], koff: [0.08, 0.12],
           Fb: [-2.4, -1.6], kc: [4, 6], ksub: [0.01, 100]}
  tolerance: 0.1
  provenance: proposed
  reason: >-
    The paper says its model is Chan and Odde's, modified (Supplement p. 24): motors with a linear
    force-velocity relation, Bell slip-bond clutches that are springs, and the substrate position from a
    force balance on engaged clutches "(Chan &Odde, 2008)". With kadd = 0 no clutch is recruited, and what
    remains is Chan's Eqs. 1-5, simulated by the direct Gillespie method instead of Chan's fixed-step Monte
    Carlo. A fixed step of 5 ms against exact event times makes the two approximations of one process, so
    their time-averaged retrograde flows should agree up to run noise and step error.
  assumptions:
    - "kadd = 0 and nclutch,max = nclutch: no clutch is ever added (Fthresh is then unused)"
    - "Chan's Fm, vu and Fb are negative by his sign convention (Table S1); both models output the retrograde flow as a positive rate"
    - "E from κsub by this paper's Eq. 5 with r_adh = 550 nm (this record's added value); the flow does not depend on r_adh once κsub is fixed"
    - "regime: +-20% around Chan's Table S1 set (nm = nc = 75, |Fm| = |Fb| = 2 pN, |vu| = 120 nm/s, kon = 1 1/s, koff = 0.1 1/s, κc = 5 pN/nm), over Table S1's κsub range 0.01-100 pN/nm"
    - "tolerance 0.1 (added): allows for the noise of one seeded run of each, the different run lengths (300 s against 10^6 events) and Chan's 5 ms time step"
- id: rel_chan_clutch_approx_reinforced_traction
  kind: approximated_by
  a: chan2008/motor_clutch
  b: mekhdjian2017/motor_clutch_reinforced
  mapping: {nm: "nm", Fm: "-Fm", vu: "-vu", nc: "nc", kon: "kon", koff: "koff", Fb: "-Fb", kc: "kc",
            E: "9000*ksub/(4*pi*550)", r_adh: "550", kadd: "0", Fthresh: "1e9", ncmax: "nc"}
  output_map: {F_sub: F_mean}
  regime: {nm: [60, 90], Fm: [-2.4, -1.6], vu: [-144, -96], nc: [60, 90], kon: [0.8, 1.2], koff: [0.08, 0.12],
           Fb: [-2.4, -1.6], kc: [4, 6], ksub: [0.01, 100]}
  tolerance: 0.1
  provenance: proposed
  reason: "as rel_chan_clutch_approx_reinforced_flow, for the time-averaged traction force κsub x_sub (before Eq. 4 makes it a stress)"
  assumptions:
    - "both outputs are the time average of κsub x_sub as a positive magnitude in pN (Chan's F_mean is -κsub x_sub in his signs)"
    - "mapping, regime and tolerance as in rel_chan_clutch_approx_reinforced_flow"

# Relations to Chaudhuri et al. 2015 (Nat Commun, record chaudhuri2015; relator, 2026-11-22). The paper cites
# Chaudhuri et al. three times: among works on matrix mechanics (main text p. 2), for spreading as the
# difference between protrusion and retrograde flow (main text p. 6), and for the disk area A = π rcell^2 at
# steady state (Supplement p. 25). The last two are stated as taken over in its spread-area rules; they are
# entered as one derived_from against Chaudhuri's lattice spreading model, where that area rule lives
# (spread area = π (distance spread)^2). It is unverifiable: lattice_spreading is not runnable and
# spread_area_pss processes a whole curve, so the paper's words stand as the evidence and no mapping is given
# (none of spread_area_pss's inputs, total actin, vpolymerization, Lnucleus and a flow curve, is an input of the
# lattice model). The off-rate rule is the same Bell slip bond in both papers, each citing Bell; that is
# proposed as same_as below (Mekhdjian does not cite Chaudhuri for it).
# Not entered: chaudhuri2015/retrograde_flow_eq1 (v_spread = vu - v_retrograde) against Eq. 6
# (vedge = vprotrusion - vretrograde): Eq. 6 is not a separate model in this record but a step inside
# spread_area_pss, and the protrusion speeds differ (Chaudhuri's unloaded motor speed vu, this paper's
# actin-limited vpolymerization [G-actin]/[Actin]Total, Eq. 9). chaudhuri2015/clutch_springs_nolattice against
# motor_clutch_reinforced: one spring per clutch against one shared substrate spring, and the outputs differ
# (a spreading speed against retrograde flow and traction); neither paper relates them. No cited.yaml: no datum
# of this record says it is taken from Chaudhuri et al. (no from_source).
- id: rel_chaudhuri_lattice_area_to_spread_area
  kind: derived_from
  a: chaudhuri2015/lattice_spreading
  b: mekhdjian2017/spread_area_pss
  steps:
