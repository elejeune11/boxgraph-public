# Relations to the Odde lab's released MATLAB motor-clutch code (record odde_code, software; relator,
# 2026-11-22). Neither states a relation to the other: this paper says only that its simulations "were
# written and run in Matlab" (Supplement p. 28) and never names the released scripts; the scripts predate
# it. So nothing is stated and no value is linked (no cited.yaml: no datum of this record has a from_source,
# and odde_code's per-molecule values come from Bangasser et al. 2013, which this record does not say it
# copied). Both implement Bangasser et al. 2013's clutch rules by Gillespie stepping (the code by first-
# reaction, this paper by the direct method); with kadd = 0 they sample one Markov process, so two
# approximated_by relations are proposed, one per output both models have.
# Not entered: bell_off_rate against mc_event_port (the "same shape" of ports: rate from force). The code's
# off-rate koff exp(Fc/(Fb + gain Fc)) is Bell's koff exp(F/Fb) at gain = 0, but it is internal to the event
# loop: mc_event_port outputs time averages of a whole run (fail_freq is the rate of total-disengagement
# events, not one bond's off-rate), so no output of one stands for the output of the other, and no paper
# states the relation in a form that would justify a helper model. traction_optimum against optimum_port:
# one processes a printed curve (maximum of traction stress, in kPa), the other sweeps a simulation for the
# minimum of flow, so they neither share an output quantity nor can be tested by relations.
- id: rel_code_approx_reinforced_flow
  kind: approximated_by
  a: odde_code/mc_event_port
  b: mekhdjian2017/motor_clutch_reinforced
  mapping: {nm: "nm", Fm: "-Fm", vu: "-vu", nc: "nc", kon: "kon", koff: "koff", Fb: "-Fb", kc: "Kc",
            E: "9000*Ksub/(4*pi*550)", r_adh: "550", kadd: "0", Fthresh: "1e9", ncmax: "nc"}
  output_map: {v_retro: v_retro}
  regime: {nm: [40, 60], Fm: [-2.4, -1.6], vu: [-140, -100], nc: [40, 60], kon: [0.24, 0.36], koff: [0.08, 0.12],
           Fb: [-2.4, -1.6], Kc: [0.64, 0.96], gain: [0, 0], Ksub: [0.01, 100]}
  tolerance: 0.1
  provenance: proposed
  reason: >-
    The released scripts are the Odde lab's event-stepping implementation of the Bangasser et al. 2013
    motor-clutch rules (motorclutch2_3.m carries Bangasser's base set); this paper takes the same rules
    ("as previously described (Bangasser et al., 2013)", Supplement p. 28), changes the indirect
    (first-reaction) Gillespie method to the direct one and adds reinforcement. With kadd = 0 and gain = 0
    the two are exact samplings of one Markov process, so their time-averaged retrograde flows should agree
    up to run noise.
  assumptions:
    - "gain = 0: the code's off-rate becomes koff exp(Fc/Fb), this paper's single-exponential Bell law"
    - "kadd = 0 and nclutch,max = nclutch: no clutch is ever added (Fthresh is then unused)"
    - "signs: the code writes vu, Fm and Fb negative (retrograde motion and forces), this paper positive, hence -vu, -Fm, -Fb; both flows are reported positive (the code's retro = mean of -vf)"
    - "E from Ksub by this paper's Eq. 5 with r_adh = 550 nm (this record's added value); the flow does not depend on r_adh once κsub is fixed"
    - "both advance the engaged clutches after executing the event, with the flow set by the substrate position before it, so a clutch bound in the event is stretched over that interval in both (motorclutch2_3.m lines 117-122; this record's motor_clutch_reinforced, written from 'as previously described')"
    - "regime: +-20% around the code's motorclutch2_3.m set (nm = nc = 50, kon = 0.3 1/s, koff = 0.1 1/s, Fm = Fb = -2 pN, vu = -120 nm/s, Kc = 0.8 pN/nm) over its logspace(-2,2) stiffness sweep"
    - "tolerance 0.1 (added): allows for the noise of one seeded run of each and the different run lengths (1e5 against 1e6 events)"
