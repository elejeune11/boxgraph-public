# of Eqs. 4-5 (Ghibaudo et al.) "has been previously employed with stochastic simulations of 1D cell
# traction (Elosegui-Artola et al., 2014; 2016)" (Supplement p. 24; main text p. 17). The relation is
# unverifiable by test: elosegui2014/integrin_clutch_sim is not runnable (its equations and parameters are in
# an SI that renders blank in that record), so the paper's words stand as the evidence and no mapping is given.
# Not entered: the Eq. 4-5 conversion against elosegui2014. That record has no model of the conversion (it is
# in the unreadable SI; the readable text prints no adhesion radius or formula), so there is nothing to relate
# modulus_eq5 to, and a helper written from Mekhdjian's form would assert what elosegui2014 does not print.
# elosegui2014's ratio models (kon_eff_ratio, kont_ratio, koff_ratio, density_fold) have no counterpart here:
# this paper names no integrin type and no binding constant. No cited.yaml: no datum of this record says it is
# taken from Elosegui-Artola et al. 2014 (no from_source), and the reinforcement parameters (kadd, Fthreshold =
# 12 pN, nclutch,max) are this paper's own choices (Supplement p. 27, from talin unfolding studies).
- id: rel_integrin_clutch_to_reinforced
  kind: derived_from
  a: elosegui2014/integrin_clutch_sim
  b: mekhdjian2017/motor_clutch_reinforced
  steps:
    - "keep the clutch ensemble on a compliant substrate whose binding is reinforced by force: Elosegui-Artola et al. 2014 raise the integrin density (and so kon = kont dint) when the force on an integrin-fibronectin catch bond exceeds a threshold (Supplement p. 26)"
