# ==== against owen2017's measured actin speed relative to adhesions, 3D fibrin (2026-11-22) =====
# motor_clutch_reinforced with this paper's Fig. 5b set (MCF10A cells on 2D polyacrylamide, no
# reinforcement: kadd = 0) gives the time-averaged F-actin retrograde flow relative to the clutches'
# substrate anchor. owen2017 measures the speed of alpha-actinin-1 relative to the zyxin plaque it
# flows out of, for fibroblasts in 3D fibrin (Table 1 row 5), and states an observed stress-fibre
# elongation rate of 0-3 nm/s. owen2017 cites this paper's clutch model for that velocity (p. 10).
# Nothing of owen2017 entered this paper's parameters, so these are tests of a 2D-calibrated model in
# 3D. The model runs for both of this paper's cells (untreated nm = 250, nc = 150; TGFβ-treated
# nm = nc = 500), since neither is a fibroblast (q_xval_owen2017_unused). The gel modulus is added
# (E_owen_fibrin_added); the adhesion radius is owen2017's own r = 0.5 um. Same run settings as
# run_val_ctrl / run_val_tgf. This is the same test chan2008, bangasser2013 and elosegui2016 make of
# their clutch models against the same two measurements.
- id: val_relspeed_owen2017_table1_ctrl
  model: motor_clutch_reinforced
  inputs: {nm: nm_low_5c, nc: nc_low_5c, Fm: Fm_5b, vu: vu_5b, kon: kon_5b, koff: koff_5b, Fb: Fb_5b, kc: kc_5b, kadd: kadd_0, Fthresh: Fthresh_s4, ncmax: ncmax_s4, E: E_owen_fibrin_added, r_adh: owen2017/r_adhesion}
  settings: {n_events: 200000, seed: 1}
  replicates: 2
  output: v_retro
  against: owen2017/t1_diff_velocity
  purpose: validation
  quantities: {owen2017/actin_adhesion_relative_speed: retrograde_flow_rate, owen2017/adhesion_radius: adhesion_radius}
  conditions_ok: >-
    The model's v_retro is the time average of the F-actin flow relative to the clutches' substrate
    anchor; owen2017's value is the mean magnitude of the actin velocity relative to its adhesion
    (|v_zyx - v_actn|) from positions 10 ± 1 min apart, which over that lag is the same slippage of actin
    past the adhesion. The measured speeds are unsigned and both directions occur (owen2017
    q_no_continuous_rearward_flow); the model's flow is rearward only, so it is compared as a speed. The
    cells (human foreskin fibroblasts in 3D fibrin vs. untreated MCF10A cells on polyacrylamide), the
    motor and clutch numbers and the substrate all differ from Fig. 5b's conditions; the substrate
    spring comes from Eq. 5 with an added gel modulus and owen2017's adhesion radius. The entry asks
    whether the 2D-calibrated model carries to the 3D measurement as it stands.
  basis: >-
    owen2017 p. 10: the wide range of actin velocities "is consistent with variants of the molecular
    clutch model in which actin velocity is set by the balance of cytoskeletally generated force and drag
    on actin generated by mechanical linkages to cellular adhesions (Bangasser et al., 2013; Mekhdjian et
    al., 2017). Low velocities, such as we observe, may reflect a situation in which a relatively large
    number of mechanical clutches ... overwhelms" the motors. This model is that variant, and its output
    is the speed of actin past the adhesion.
- id: val_relspeed_owen2017_table1_tgf
  model: motor_clutch_reinforced
  inputs: {nm: nm_high_5c, nc: nc_high_5c, Fm: Fm_5b, vu: vu_5b, kon: kon_5b, koff: koff_5b, Fb: Fb_5b, kc: kc_5b, kadd: kadd_0, Fthresh: Fthresh_s4, ncmax: ncmax_s4, E: E_owen_fibrin_added, r_adh: owen2017/r_adhesion}
  settings: {n_events: 200000, seed: 1}
  replicates: 2
  output: v_retro
  against: owen2017/t1_diff_velocity
  purpose: validation
  quantities: {owen2017/actin_adhesion_relative_speed: retrograde_flow_rate, owen2017/adhesion_radius: adhesion_radius}
  conditions_ok: >-
    As val_relspeed_owen2017_table1_ctrl, with the TGFβ-treated cell of Fig. 5c-d (nm = nc = 500, more
    clutches per motor than the untreated cell), which is the nearer of the two to owen2017's reading
    that low speeds need many clutches.
  basis: >-
    As val_relspeed_owen2017_table1_ctrl (owen2017 p. 10, citing this paper's model for the actin
    velocity set by motor force and clutch drag).
- id: val_relspeed_owen2017_range_ctrl
  model: motor_clutch_reinforced
  inputs: {nm: nm_low_5c, nc: nc_low_5c, Fm: Fm_5b, vu: vu_5b, kon: kon_5b, koff: koff_5b, Fb: Fb_5b, kc: kc_5b, kadd: kadd_0, Fthresh: Fthresh_s4, ncmax: ncmax_s4, E: E_owen_fibrin_added, r_adh: owen2017/r_adhesion}
  settings: {n_events: 200000, seed: 1}
  replicates: 2
  output: v_retro
  against: owen2017/v_elongation_observed
  purpose: validation
  quantities: {owen2017/actin_adhesion_relative_speed: retrograde_flow_rate, owen2017/adhesion_radius: adhesion_radius}
  conditions_ok: >-
    As val_relspeed_owen2017_table1_ctrl. The measurement is a range, "0-3 nm s-1", for owen2017's study
    and previous work, not a summary statistic; the model's single mean flow is judged against it as an
    interval.
  basis: >-
    owen2017 judges its own clutch model against this range ("in good agreement with the observed rate of
    stress fiber elongation (0-3 nm s-1) in our study", Supp. p. 6) and cites this paper's model for the
    same velocity (p. 10); this model gives the velocity of actin relative to the adhesion.
- id: val_relspeed_owen2017_range_tgf
  model: motor_clutch_reinforced
  inputs: {nm: nm_high_5c, nc: nc_high_5c, Fm: Fm_5b, vu: vu_5b, kon: kon_5b, koff: koff_5b, Fb: Fb_5b, kc: kc_5b, kadd: kadd_0, Fthresh: Fthresh_s4, ncmax: ncmax_s4, E: E_owen_fibrin_added, r_adh: owen2017/r_adhesion}
  settings: {n_events: 200000, seed: 1}
  replicates: 2
  output: v_retro
  against: owen2017/v_elongation_observed
  purpose: validation
  quantities: {owen2017/actin_adhesion_relative_speed: retrograde_flow_rate, owen2017/adhesion_radius: adhesion_radius}
  conditions_ok: >-
    As val_relspeed_owen2017_range_ctrl, with the TGFβ-treated cell of Fig. 5c-d (nm = nc = 500).
  basis: >-
    As val_relspeed_owen2017_range_ctrl.
