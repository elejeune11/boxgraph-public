# ==== cross-record validation with owen2017 (2026-11-22) =========================================
- id: q_xval_owen2017_unused
  kind: choice
  about: [motor_clutch_reinforced, E_owen_fibrin_added, r_adh_added, nm_low_5c, nc_low_5c, nm_high_5c, nc_high_5c, bell_off_rate, spread_area_pss, total_force_product, traction_optimum, modulus_eq5]
  text: >-
    (Cross-record validation.) motor_clutch_reinforced is judged against owen2017's speed of actin relative
    to its adhesion (Table 1 row 5, 58 ± 3.1 nm/min, and the stated 0-3 nm/s elongation rate), which owen2017
    says is "consistent with variants of the molecular clutch model" including this paper's (owen2017 p. 10).
    Three choices are open. (1) The cell: no set here is for fibroblasts, so the model runs with both Fig. 5b
    cells (untreated nm = 250, nc = 150; TGFβ nm = nc = 500), without reinforcement (kadd = 0, as in Fig. 5);
    the S4b set with reinforcement (nm = nc = 150, kadd 0.01-1 /s) is not run, since its kadd range is a sweep
    the paper does not tie to any one cell. (2) The substrate: owen2017 measures no local stiffness; the gel
    modulus is added (E_owen_fibrin_added, the bulk 270 Pa, with 0.2-50 kPa alternatives) and turned into a
    spring by Eq. 5 with owen2017's printed r = 0.5 um instead of this record's MCF10A-inferred 550 nm. (3) The
    measured quantity: the model's flow is relative to the substrate anchor, so it meets the actin-adhesion
    relative speed (row 5), as chan2008, bangasser2013 and elosegui2016 do with the same measurement. Not used:
    the lab-frame α-actinin-1, paxillin, zyxin and fibrin speeds (Table 1, Table S1), which would need a moving
    substrate frame; paxillin-fibrin slip (row 10), adhesion sliding on the matrix, which the model has no
    element for; the speed difference |v_zyx| - |v_actn| (row 6), not a speed of actin past the adhesion;
    fibrin displacement and strain profiles (Fig. 2, S2), angles, rose plots, correlations and pair counts,
    which need a 3D matrix or directions the model lacks; and the rheology (Fig. S10) and localization error
    (Fig. S9B), not cell mechanics. owen2017 measures no traction stress, cell force or spread area, so T,
    F_sub, spread_area_pss, total_force_product and traction_optimum have nothing to meet; bell_off_rate gives
    an off rate, which owen2017 does not measure; modulus_eq5 needs a spring constant owen2017 measures for no
    adhesion. Tuning nm and nc to owen2017's slow speeds would be a fit made here, so it is not entered.
  citation: {page: 24, quote: "We modified an existing motor-clutch model of cell traction forces", where: "Supplemental Materials"}

# ==== cross-record validation with prahl2020 (2026-11-23): none added ===========================
- id: q_xval_prahl2020_none
  kind: choice
  about: [motor_clutch_reinforced, bell_off_rate, modulus_eq5, spread_area_pss, total_force_product, traction_optimum, 'prahl2020/v_exp', 'prahl2020/mu_exp', 'prahl2020/fig2g_exp', 'prahl2020/eb1_mean']
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of prahl2020, a
    later paper (2020) from the same lab that cites this one (main ref. 30, Supporting ref. S17) only for the
    size of cell traction forces, not for any model result. prahl2020 measures U251 glioma cells migrating in
    PDMS microchannels: the drift velocity and motility coefficient of the cell body (v_exp, mu_exp, Figs. 3A-B,
    4C-D, 5C-D, 6A-B, 7A-B), the MSD of nucleus positions against time lag (Fig. 2G), EB1 microtubule growth
    speeds (Fig. S5B), and cell length and nucleus position in the channel (Figs. S5C-D). No output of this
    record's models is one of these quantities. motor_clutch_reinforced gives the traction stress, the substrate
    force, the engaged clutches and the F-actin retrograde flow of one adhesion on a gel; it has no cell body,
    no leading and trailing ends and no polarity, so it gives no cell displacement, and its retrograde flow
    (actin relative to the clutch anchor) is not the cell's drift velocity along the channel. spread_area_pss
    gives a spread area on a 2D gel, which a cell in a 12 x 5 um channel does not have. total_force_product
    and traction_optimum process traction curves; prahl2020 measures no traction (the PDMS and glass are too
    stiff, prahl2020 p. 10). bell_off_rate gives a clutch off-rate, and modulus_eq5 a gel modulus from a spring
    constant; prahl2020 measures neither. The shared shape of bell_off_rate and prahl2020/slip_bond_s1 (a rate
    from a force and a rate; same Bell form) is a relation between models for the relations job, not a
    validation. In the other direction, see prahl2020/q_xval_mekhdjian2017_none.
  citation: {page: 24, quote: "We modified an existing motor-clutch model of cell traction forces", where: "Supplemental Materials"}
