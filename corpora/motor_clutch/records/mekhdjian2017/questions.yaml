# ==== cross-record validation with chaudhuri2015 (2026-11-22): none added =======================
- id: q_xval_chaudhuri2015_none
  kind: unstated_model
  about: [spread_area_pss, motor_clutch_reinforced, bell_off_rate]
  text: >-
    No model here is validated against chaudhuri2015's measurements. This paper cites chaudhuri2015
    for two things only: protrusion minus retrograde flow as a proxy for spread area (p. 6), and the
    disk area A = π rcell^2 (Supplement p. 25). It does not say that its model explains or predicts any
    chaudhuri2015 measurement. Most of chaudhuri2015's measurements are gel properties: stress
    relaxation, G′ and G″, AFM moduli. None of these is an output of a model here. The other measurements
    are YAP ratios, cell fractions and the spread areas of U2OS cells (Figs. 3b-c, 4b, Supp. Fig. 5) and
    3T3 fibroblasts (Supp. Fig. 4) on RGD-alginate. Of these, only the spread areas on the elastic gels
    are a quantity a model here gives (spread_area_pss, on the flow of motor_clutch_reinforced). That
    test is not made, for three reasons. (1) Every parameter set here is for MCF10A cells, and
    radhesion and [Actin]Total (r_adh_added, Atot_added) were inferred from this paper's own MCF10A
    plateaus. A U2OS or 3T3 run would rest on an inferred actin pool for another cell type, so it would
    test the additions rather than the model. (2) chaudhuri2015 sets ligand density as RGD concentration
    (150-1,500 uM), and no model here has a ligand-density input. (3) The area model needs a flow curve
    run at chaudhuri2015's moduli (1.4, 3.4, 9 kPa). The measured bars are indexed by condition, not by
    modulus, so no curve here can be compared with them point by point. bell_off_rate gives a loaded
    clutch off rate, which neither paper measures. Fig. 7b's adhesion lifetime is the lifetime of a whole
    focal adhesion, in minutes. In the other direction, see chaudhuri2015/q_xval_mekhdjian2017_none.
  citation: {page: 25, quote: "as was previously employed by Chaudhuri et al.", where: "Supplemental Materials, Eq. 6 paragraph"}

