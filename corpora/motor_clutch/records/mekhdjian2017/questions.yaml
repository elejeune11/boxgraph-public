# ==== cross-record validation with bangasser2013 (2026-11-22): none added ========================
- id: q_xval_bangasser2013_none
  kind: unstated_model
  about: [motor_clutch_reinforced, bell_off_rate, modulus_eq5, traction_optimum]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement held by
    bangasser2013. This paper takes that one's model rules and per-molecule parameters (p. 24: "We
    modified an existing 'motor-clutch' model") and cites it for the optimum-stiffness behaviour (p. 6),
    but never says its model, with its MCF10A sets, predicts a number bangasser2013 shows. The measured
    data held by bangasser2013 are all other papers' data redrawn: (1) Chan and Odde's neuron retrograde
    flow against Young's modulus (bangasser2013/v_figS1b_measured, Fig. S1B). motor_clutch_reinforced
    outputs v_retro and takes E, so a sweep is possible in units, but every set this paper gives (nm = 250,
    nc = 150 untreated; nm = nc = 500 TGFβ; nm = nc = 150 with reinforcement) is for MCF10A epithelial
    cells, not chick forebrain neuron filopodia, and its added radhesion was inferred from MCF10A plateaus
    (q_radhesion); a neuron run would need bangasser2013's own fitted base set and a filopodial adhesion
    radius neither paper gives, i.e. bangasser2013's fit to chan2008 again (already entered there as
    val_flow_chan_260Pa / val_flow_chan_57kPa, fit_quality) behind an invented conversion. (2) Kong et
    al.'s integrin lifetimes (bangasser2013/tau_kong_fig7c, a bond lifetime in s): bell_off_rate gives an
    off rate, a different quantity, and is a slip law with Chan-Odde parameters never fitted to or meant
    for Kong's catch bond. (3) The normalized migration and normalized traction of other cell types
    (Fig. 1A-B): no model here outputs a normalized quantity, and these cells (U87, smooth muscle,
    neutrophils, NIH/3T3, neurons, T24, BAEC) have no parameter set here; at most a trend would be
    predicted. In the other direction, see bangasser2013/q_xval_mekhdjian2017_none.
  citation: {page: 24, quote: "We modified an existing motor-clutch model of cell traction forces", where: "Supplemental Materials"}

