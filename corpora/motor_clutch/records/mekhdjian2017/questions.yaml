- id: q_radhesion
  kind: unstated_input
  about: [r_adh_added, motor_clutch_reinforced]
  text: >-
    The adhesion radius radhesion of Eqs. 4-5 sets both the stiffness axis (κsubstrate = 4π radhesion E / 9) and
    the stress (Fsubstrate/π radhesion^2) of every model figure, but no value is printed. The record uses 550 nm,
    inferred from the Fig. S4c plateau (≈ 315 Pa ≈ nm Fm/π r^2 for nm Fm = 300 pN); with it the simulated Fig. 5c
    curves match the printed ones in level and in the position of their maxima, which supports the inference but
    does not replace a printed value.
  citation: {page: 24, quote: "We assume that the cell-substrate contact area is a circle radius", where: "above Eq. 4"}
- id: q_actin_balance
  kind: unstated_input
  about: [spread_area_pss, Atot_added, vpoly_added]
  text: >-
    The spread-area rules (Eqs. 6-9) need [Actin]Total, vpolymerization and Lactin; none is printed. Eq. 8 also
    mixes dimensions: [G-actin] is a length (nm) but v/Lactin is a rate, so ∂[G-actin]/∂t is not a length per time
    unless Lactin is a pure number. The record uses the steady state (vedge = 0) on the time-averaged flow, with
    [Actin]Total = 25 µm inferred from the Fig. S4d plateau and vpolymerization = 200 nm/s from the same laboratory's
    later simulator; the area comparisons test the shape of the curves, not printed inputs.
  citation: {page: 25, quote: "constrained vprotrusion by an actin mass balance", where: "Eqs. 7-8"}
- id: q_nm_fig5_vs_s4
  kind: possible_error
  about: [nm_s4, nm_low_5c, A_s4d_k0, A_s4e_none, A_5d_low, cmp_fig_A_5d_s4d]
  text: >-
    Fig. S4b lists nm = 150 and nc = 150 for the reinforcement simulations, while the Fig. 5c-d cell without
    reinforcement is labelled nm = 250, nc = 150. Fig. S4e's black line ('No reinforcement') is the same curve as
    Fig. 5c-d's solid line, but Fig. S4d's black line (kadd = 0) lies about 20-30% higher in area than either at
    low stiffness. The model run with nm = 150 reproduces the S4d black line and with nm = 250 the Fig. 5d/S4e one,
    so the figures appear to use two motor numbers for the 'no reinforcement' cell; which one Fig. S4e's orange
    line (labelled 12 pN, otherwise S4c's kadd = 1 /s) used is not said.
- id: q_eopt_10kpa
  kind: overstated_claim
  about: [E_opt_text, E_opt_fig, T_5c_high]
  text: >-
    The text puts the optimum stiffness of the TGFβ-treated (nm = nc = 500) simulated cell at '∼10 kPa', but the
    dashed line of Fig. 5c peaks near 1-2 kPa and has fallen to about a third of its peak by 10 kPa. The figure,
    the reader's runs and the text disagree by about an order of magnitude; the '~' gives the printed value no
    verdict, so the difference is stated here.
  citation: {page: 6, printed_page: "1472", quote: "beyond an optimum stiffness (here ∼10 kPa for TGFβ-treated", where: text}
- id: q_total_force_product
  kind: unexplained_difference
  about: [cmp_F_ctrl, cmp_F_tgf, F_5e_ctrl, F_5e_tgf]
  text: >-
    The Fig. 5 legend says total force is average traction stress times spread area, yet the plotted mean total
    forces (in nN) are about 2-3 times the product of the plotted mean stress and mean area (e.g. Ctrl, 1.1 kPa:
    ≈ 114 Pa x ≈ 650 µm^2 ≈ 74 nN against ≈ 240 nN plotted). A mean of per-cell products can exceed the product of
    means only through a strong stress-area correlation; a unit or scaling difference in the total-force panel is
    another possibility. Not resolved from the paper.
  citation: {page: 7, printed_page: "1473", quote: "total force was quantified by multiplying average traction stress by the spread area", where: "Fig. 5 legend"}
- id: q_kadd001_strength
  kind: unexplained_difference
  about: [cmp_T_s4c_k001, cmp_A_s4d_k001, run_s4_k001]
  text: >-
    With kadd = 0.01 /s the printed curves (Fig. S4c-d, solid green) rise again above ≈ 10 kPa, to ≈ 120 Pa at
    50 kPa; the reader's run of Eqs. 10-12 with the S4b parameters adds few clutches at high stiffness (few clutches
    exceed 12 pN while the load is shared) and stays near the kadd = 0 line. How nthreshold is counted (force or
    extension, engaged clutches only), whether runs continue from one stiffness to the next, and over which part of
    the run traction is averaged are not stated and could each explain the difference.
- id: q_no_steady_state
  kind: numerics
  about: [motor_clutch_reinforced, run_s4_k001, run_s4_k01, run_s4_k1, t_sim_text]
  text: >-
    With reinforcement the model has no clutch removal and 'does not achieve a true steady state' (p. 29), so a
    time average depends on the run length (10^6 events, ≈ 10,000 s) and on the averaging window, neither of which
    is defined beyond the event count. The reader averages over the whole run, transient included; at kadd = 1 /s
    this keeps the plateau below the ≈ 315 Pa (stall) level the paper's curves reach.
  citation: {page: 29, quote: "it does not achieve a true steady state", where: "Supplement: Model implementation"}
- id: q_events_short
  kind: choice
  about: [run_5c_low, run_5c_high, run_s4_k0, run_val_ctrl, run_val_tgf, ref_events]
  text: >-
    Runs without reinforcement use 2 x 10^5 events per stiffness (two seeds) instead of the paper's 10^6, to keep
    the build affordable; that model is stationary, and ref_events checks the traction at 2x and 4x the count.
    Runs with reinforcement use the paper's 10^6.
- id: q_fthresh5_inputs
  kind: unstated_input
  about: [Fthresh_5]
  text: >-
    The 5 pN threshold of Fig. S4e (blue lines) gives similar behaviour only 'provided other clutch parameters
    and/or the addition rate (kadd) are also adjusted'; the adjusted values are not given, so the blue lines are not
    run (and not read).
  citation: {page: 27, quote: "provided other clutch parameters and/or the addition rate", where: text}
- id: q_validation_regime
  kind: unexplained_difference
  about: [val_T_ctrl, val_T_tgf, val_A_ctrl, val_A_tgf]
  text: >-
    The paper compares the model with the MCF10A gels of Fig. 5e only qualitatively ('consistent with'): simulated
    traction of the untreated cell falls with stiffness above ≈ 0.5 kPa, while measured Ctrl stress is flat or rises
    at 13.8 kPa; the paper itself notes that low signal on stiff gels kept it from confirming the biphasic trend
    (p. 26). The validation comparisons put numbers on this; their outcome rests on the added radhesion.
  citation: {page: 26, quote: "unable to confirm whether the transformed cells show a distinct biphasic trend", where: "Supplement: Addition of a kinetic rate for clutch reinforcement"}
- id: q_mts_stiffness
  kind: unstated_input
  about: [motor_clutch_reinforced, kadd_1, Fthresh_s4]
  text: >-
    The main text (p. 8) uses the molecular-tension-sensor surfaces as a test of the reinforcement model: they are
    'effectively much stiffer than PA gels', TGFβ-treated cells there show lower traction and smaller spread area
    than on 13.8-kPa gels (Fig. S5), and the paper concludes the data are inconsistent with a model relying
    entirely on force-feedback reinforcement (Fig. S4c-d) but consistent with more motors and clutches (Fig. 5c-d).
    No effective modulus is given for the MTS surface, so neither model can be run at it, and the conclusion
    cannot be checked in the record. It is a qualitative argument from the shapes of the model curves (the
    reinforced curves plateau, the Fig. 5c-d curves fall beyond their optimum).
  citation: {page: 8, printed_page: "1474", quote: "the MTS substrates are effectively much stiffer than PA gels", where: text}
