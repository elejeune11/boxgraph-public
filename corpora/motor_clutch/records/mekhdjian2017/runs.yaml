- id: run_5c_low
  model: motor_clutch_reinforced
  inputs: {nm: nm_low_5c, nc: nc_low_5c, Fm: Fm_5b, vu: vu_5b, kon: kon_5b, koff: koff_5b, Fb: Fb_5b, kc: kc_5b, r_adh: r_adh_added, kadd: kadd_0, Fthresh: Fthresh_s4, ncmax: ncmax_s4}
  sweep: {E: T_5c_low}
  settings: {n_events: 200000, seed: 1}
  replicates: 2
  outputs: {T: T_5c_low_sim, v_retro: v_5c_low_sim}
  note: "2 x 10^5 events per stiffness instead of the paper's 10^6 (reader's choice for build time; without reinforcement the run is stationary, checked by ref_events); two seeds"
- id: run_5c_high
  model: motor_clutch_reinforced
  inputs: {nm: nm_high_5c, nc: nc_high_5c, Fm: Fm_5b, vu: vu_5b, kon: kon_5b, koff: koff_5b, Fb: Fb_5b, kc: kc_5b, r_adh: r_adh_added, kadd: kadd_0, Fthresh: Fthresh_s4, ncmax: ncmax_s4}
  sweep: {E: T_5c_high}
  settings: {n_events: 200000, seed: 1}
  replicates: 2
  outputs: {T: T_5c_high_sim, v_retro: v_5c_high_sim}
  note: "2 x 10^5 events per stiffness instead of the paper's 10^6 (reader's choice for build time; without reinforcement the run is stationary, checked by ref_events); two seeds"
- id: run_area_5d_low
  model: spread_area_pss
  inputs: {v: v_5c_low_sim, Atot: Atot_added, vpoly: vpoly_added, Lnuc: Lnucleus}
  outputs: {A: A_5d_low_sim}
- id: run_area_5d_high
  model: spread_area_pss
  inputs: {v: v_5c_high_sim, Atot: Atot_added, vpoly: vpoly_added, Lnuc: Lnucleus}
  outputs: {A: A_5d_high_sim}
