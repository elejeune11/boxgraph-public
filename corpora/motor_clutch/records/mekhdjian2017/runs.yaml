  inputs: {Fm: Fm_s4, vu: vu_s4, kon: kon_s4, koff: koff_s4, Fb: Fb_s4, kc: kc_s4, r_adh: r_adh_added, nm: nm_s4, nc: nc_s4, Fthresh: Fthresh_s4, ncmax: ncmax_s4, kadd: kadd_1}
