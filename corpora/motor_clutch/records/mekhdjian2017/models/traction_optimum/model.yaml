stated: {page: 6, printed_page: "1472", quote: "beyond an optimum stiffness (here ∼10 kPa for TGFβ-treated", where: text}
equation: "E_opt = argmax_E T(E)"
inputs:
  T: {quantity: traction_stress, unit: Pa, curve: {quantity: substrate_modulus, unit: kPa}}
outputs:
