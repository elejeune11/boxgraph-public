notes: >
  PDF pages 1-17 are the article, 18-50 the Supplemental Information (SI). In scope: the
  parameter estimates of SI Table 1 and Table 2 notes (protrusion motor and clutch counts, Bell
  rupture force, substrate stiffness from Young's modulus, the dimensionless groups of Table 2);
  the mean-field model (Eqs. 3-4), solved here by the method of characteristics (the paper uses
  finite differences, SI p. 46-47) and checked against the SI claims for the Table S2 parameters
  (traction 59-145 pN, maximum at 2.7 kPa) and against Fig. 1(B) (F = 1 and F = 10); the
  analytical optimum substrate stiffness Eq. 6 / S12 (dimensional, and dimensionless against the
  tau = 10 line of Fig. 2(F)), and as an approximation of the mean-field optimum; the
  rigid-substrate steady state Eqs. S31-S36 (Fig. 4: T for tau = 5, 50 at omega = 100 and
  tau = 50 at omega = 1000, n_b for tau = 20 at omega = 100); the high-motor limits Eqs. S55 and
  S57 (Fig. 5(B) tau = 10, 100; Fig. 5(C) tau = 100). Left out: the stochastic-model symbols in
  every figure (single simulations of a model whose code and settings are not given; the
  symbols also share colours with the lines), the time courses and densities of Figs. 2(A, B,
  D, E), 3(C), S2 (no printed number depends on them), the clutch-stiffness scans of Figs. 3
  and S4 and the optimum clutch stiffness of about 3.3 pN/nm (printed as approximate, so no
  verdict, and each point needs a full mean-field scan), the critical activity of Fig. 2(C) and
  Eq. 5 (the constant C1 = 0.4 is a fit to numerical points that are not tabulated), the
  low-F asymptotes S43-S52, the clutch-reinforcement model Eq. 7 / S59-S73 (Figs. 6, S5, S6)
  and the catch-bond model S86-S88 (Fig. S7), whose curves need further mean-field solvers;
  Figs. 5(A) and the inset of 5(B) (optima of the rigid-substrate solution). These are listed as
  open questions where a claim rests on them. Shared reading code for the figures is in
  figures/_fig.py. A second figure pass (figures.md) read Fig. 2(C) (the Eq. 5 line and the
  numerical critical activities), the Fig. 2(F) symbols for tau = 10, Fig. 3(A, B, D) and S4
  (compared at small beta_c with the rigid limit, model rigid_clutch_scan), further Fig. 4(B)
  lines, Fig. 5(A) and the inset of 5(B) (new models rigid_optimum_activity and
  high_motor_optimum_omega, the maxima of S31-S36 over F and of S55-S57 over omega), Fig. S1(B)
  for F = 0.25 and 0.5, and the Eq. 6 lines of Fig. S3; symbols are read by figures/_marks.py.
