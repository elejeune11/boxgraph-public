    a Lorentzian of width 5 x 10^-3 for the delta function, forward-backward Euler), with grid,
    domain, time step, run length and averaging window not stated. The record solves the same
    equations by the method of characteristics (cohorts of clutches by binding position), which has
    no numerical diffusion. Its settings (cohort spacing h, cfl, dt_max, dt_min, run length
    load_times (1 + F/K omega), average over the last 75%) are this record's choices. Coarser
    settings (cfl 0.05, h 0.02, dt_max 0.01) gave time averages off by up to 25% on soft substrates
    for F = 1 (a different branch of load-and-fail cycles); the defaults agree with Fig. 1(B) and
