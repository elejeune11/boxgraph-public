  kind: unstated_model
  about: [clutch_off_rate_bell, mean_field_dimensional, mean_field_optimum, modulus_from_stiffness, kopt_eq6, rigid_steady_state]
  text: >-
    (Cross-record validation.) No model of this record is validated against bangasser2017's
    measurements. This paper cites bangasser2017 (ref. 12; SI ref. 18) as one of the reports that
    traction and motility are biphasic in stiffness and that an optimum stiffness is "observed
    experimentally (12,14)" (p. 2), as a biophysical migration model (p. 13), and for the stiffness to
    modulus equivalence (SI p. 21). It never runs its models against that paper's data. bangasser2017's
    measurements are U251 and ECFN retrograde flow rates (fig3c_*, fig4a_*, figs4c_bars), traction strain
    energies and scaled strain energies (fig3e/3f/4b_*, figs4d-i_*), cell area, aspect ratio, random
    motility coefficient and MSD (fig2c-e_*, fig4c-e_*, figs2e_*), and the approximate cell-type optimum
    moduli (Eopt_ecfn_p3, Eopt_u251_p3, "~1" and "~100" kPa). None of these is an output of a model here.
    The mean-field models give a traction force in pN (not a strain energy, which would need the
    substrate displacement field), bound fraction and dimensionless clutch extension rate (not a
    retrograde flow), and optima. No model gives cell area, shape or motility. The nearest output is
    modulus_from_stiffness's optimal Young's modulus (2.7 kPa from the generic Table S2 values, p. 21).
    But neither paper gives this model's parameters (nm, nc, Fm, vu, kon, koff, Fb, kc, d_s) for U251
    or ECFN cells, and the paper says cell-specific data are needed. Also, the measured optima are
    printed as approximate ("~"), so they get no verdict. Running the model would need a whole added
    parameter set fitted to the cells, which would be a new analysis, not a test of this paper. The
    shared shape of clutch_off_rate_bell and bangasser2017/off_rate_eq1 (a Bell slip law, rate from
    force and rate) is a relation between models, not a validation; neither paper measures off rates.
    In the other direction, this paper prints no measurement (figures.md: every plotted value is a
    model result), so no bangasser2017 model has anything here to be validated against
    (bangasser2017/q_xval_alonsomatilla2023_none).
  citation: {page: 21, quote: "Cell-specific data should be used to parameterize the model", where: "SI, notes to Table 2"}
# cross-record validation against bell1978 (2026-11-21): none added
