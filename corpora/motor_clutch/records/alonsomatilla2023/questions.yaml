  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    bell1978 (its ref. 52). The paper cites it only for the form of the loaded clutch off rate:
    "the clutch lifetime decreases exponentially by force according to Bell's law (52)" (p. 2, and
    SI p. 21); it does not say its model explains or predicts any of Bell's data. bell1978 is a
