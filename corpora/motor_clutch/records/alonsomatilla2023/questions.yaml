    its Fig. 8 is a model curve (bell1978 figures.md). No model here outputs a cell-cell separation
    force or a sugar concentration: the mean-field models give the steady traction of a motor-clutch
    ensemble pulling on a substrate, which is not the force needed to pull two adhering cells apart,
    and no parameters of this record are stated for Coman's cells; the value is also approximate
    ("~") and would get no verdict. clutch_off_rate_bell has the same shape as
    bell1978/loaded_reverse_rate (a rate from a force and a rate); that relates two models, left to
    the job that relates models across papers, and gives no shared measured quantity, since neither
    paper measures an off rate. In the other direction, see bell1978 q_xval_alonsomatilla2023_none.
