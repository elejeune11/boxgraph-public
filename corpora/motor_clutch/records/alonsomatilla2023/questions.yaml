# ==== cross-record validation with bangasser2013 (2026-11-21): none added =======================
- id: q_xval_bangasser2013_none
  kind: unstated_model
  about: [clutch_off_rate_bell, mean_field_dimensional, mean_field_optimum, kopt_eq6, mean_field]
  text: >-
    (Cross-record validation.) No model of this record is validated against bangasser2013's
    measurements, although this paper cites it (ref. 10) for its parameter ranges (Table 1, p. 4) and
    for the stalled and free-flowing regimes, never as data its models explain. bangasser2013 carries
    four measured sets, all redrawn from other works: (1) Kong et al.'s integrin-fibronectin bond
    lifetimes against clamped force (tau_kong_fig7c, Fig. 7C); (2) Chan and Odde's neuron retrograde
    flow against substrate modulus (v_figS1b_measured, Fig. S1B); (3) cell migration normalized to
    each cell type's maximum (migration_fig1a_*, Fig. 1A); (4) traction normalized the same way
    (traction_fig1b_*, Fig. 1B). (1): clutch_off_rate_bell gives a loaded off rate, not a bond
    lifetime, and is a slip law, whose rate only rises with force, while the measured lifetimes
    first rise (a catch bond); this paper's catch-bond law (S86-S88) is not in the record
    (q_left_out_models), and neither paper gives Bell parameters for the integrin-fibronectin bond.
    (2): no model here outputs a retrograde flow; the mean-field models give traction, bound
    fraction and optima. (3) and (4): no model gives a migration speed or a traction normalized to
    a cell type's maximum; mean_field_dimensional gives an absolute traction in pN, with the generic
    Table S2 values (p. 21), which the paper says are not cell-specific ("Cell-specific data should be
    used to parameterize the model"). Turning it into a normalized curve would need cell-specific
    parameters for neurons, T24 cells and BAEC that neither paper states, and the normalized points
    alone do not quantify the absolute traction the model predicts. The shared shape of
    clutch_off_rate_bell and bangasser2013/catch_slip_eq9 (rate from force and rate) is a relation
    between models, not a validation. In the other direction: this paper prints no measurement
    (figures.md: every plotted value is a model result), so no bangasser2013 model has anything here
    to be validated against (bangasser2013/q_xval_alonsomatilla2023_none).
  citation: {page: 21, quote: "Cell-specific data should be used to parameterize the model", where: "SI, notes to Table 2"}

