# ==== cross-record validation with elosegui2016 (2026-11-21): none added ========================
- id: q_xval_elosegui2016_none
  kind: unstated_model
  about: [mean_field_dimensional, mean_field_optimum, modulus_from_stiffness, stiffness_from_modulus, kopt_eq6, clutch_off_rate_bell]
  text: >-
    (Cross-record validation.) No model of this record is validated against elosegui2016's
    measurements. This paper cites elosegui2016 (ref. 14) only for trends: some cells "deviate from the
    biphasic force-rigidity relationship ... through force-mediated clutch reinforcement (14,28)", an
    optimal stiffness "observed experimentally (12,14)" (p. 2), as a reason for adding reinforcement
    (p. 10), and for an equivalent mean-field equation (SI p. 22). It never runs a model against that
    paper's data. elosegui2016's measurements are MEF cell tractions in Pa against gel modulus (Figs. 1a,
    3d, 4a, 4e, 5a, 5e, 6a-i; Supp. Figs. 2, 5a), actin flow speeds in nm/s (Fig. 3e), the 5 kPa threshold
    rigidity at which control and talin-depleted forces diverge (threshold_measured_text), FN-avb3 bond
    lifetimes (Fig. 3a), adhesion lengths, YAP ratios, integrin and pFAK densities, cell areas, pMLC ratios
    and attachment fractions. None is an output of a model here run with stated inputs. (1) Traction:
    mean_field_dimensional gives the time-averaged force of one protrusion in pN (traction_force), not a
    cell-averaged traction stress in Pa (cell_traction); neither paper gives an area that maps one onto the
    other for this model. It is also a slip-bond model without reinforcement, while the measured contrast
    (control vs talin shRNA) is the reinforcement this record leaves out (Eq. 7 / S59-S73,
    q_left_out_models), and its inputs (nm, nc, Fm, vu, kon, koff, Fb, kc, d_s) are generic Table S2 values,
    not MEF values ("Cell-specific data should be used to parameterize the model", p. 21). Taking
    elosegui2016's MEF parameters instead would not supply them: its clutch has a two-exponential catch
    bond, not a Bell slip bond with one Fb and koff, and an adhesion radius rather than a focal adhesion
    diameter for legend E. (2) Flow: no model here outputs a dimensional retrograde flow (rigid_steady_state
    gives only a dimensionless extension rate, on a rigid substrate). (3) Threshold: the 5 kPa threshold is
    where reinforcement switches on, a different quantity from the modulus that maximizes traction
    (modulus_from_stiffness, optimal_youngs_modulus), and the 2.7 kPa optimum printed for that model is for
    the generic Table S2 values. (4) Bond lifetimes: clutch_off_rate_bell is a slip law with generic parameters; the measured FN-avb3
    lifetimes are not the clutch of this model and no Bell parameters are stated for them. The pairing of
    modulus_from_stiffness with elosegui2016/clutch_no_talin_sim by shape (a pressure from a length and a
    stiffness) is not a shared prediction: one converts a spring constant to a modulus, the other is a
    stochastic clutch simulation giving a traction stress. In the other direction, this paper prints no
    measurement (figures.md: every plotted value is a model result), so no elosegui2016 model has anything
    here to be validated against (elosegui2016/q_xval_alonsomatilla2023_none).
  citation: {page: 21, quote: "Cell-specific data should be used to parameterize the model", where: "SI, notes to Table 2"}
