- {id: ref_mf_opt_step, run: run_mf_opt_s2, setting: step, factors: [1, 2, 4], mode: divide, output: T_max,
   tolerance: "1%", tolerance_basis: "added: of the order of the printed precision of 145 pN (half a unit, 0.3%) and of 2.7 kPa (2%)", tolerance_added: true}
- {id: ref_mf_rigid_step, run: run_mf_rigid_s2, setting: step, factors: [1, 2, 4], mode: divide, output: T,
   tolerance: "1%", tolerance_basis: "added: below the half-unit printed precision of 59 pN (0.8%) plus margin", tolerance_added: true}
