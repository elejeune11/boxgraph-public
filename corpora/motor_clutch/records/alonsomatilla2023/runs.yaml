- id: run_fig5a_tau20
  model: rigid_optimum_activity
  inputs: {tau: tau20_fig5a}
  sweep: {omega: Fopt_fig5a_tau20}
  outputs: {Fopt: Fopt_fig5a_tau20_pred}
- id: run_fig5b_inset
  model: high_motor_optimum_omega
  inputs: {}
  sweep: {tau: omega_opt_fig5b_inset}
  outputs: {omega_opt: omega_opt_fig5b_inset_pred}
- id: run_fig3b_rigid_tau10
  model: rigid_clutch_scan
  inputs: {F: F_fig3, tau: tau10_fig3, omega_prime: omega_prime_fig3}
  sweep: {beta_c: T_fig3b_tau10}
  outputs: {T: T_fig3b_tau10_rigid}
- id: run_fig3b_rigid_tau5
  model: rigid_clutch_scan
  inputs: {F: F_fig3, tau: tau5_fig3, omega_prime: omega_prime_fig3}
  sweep: {beta_c: T_fig3b_tau5}
  outputs: {T: T_fig3b_tau5_rigid}
- id: run_fig3d_rigid_F2
  model: rigid_clutch_scan
  inputs: {F: F2_fig3d, tau: tau10_fig3, omega_prime: omega_prime_fig3}
  sweep: {beta_c: T_fig3d_F2}
  outputs: {T: T_fig3d_F2_rigid}
- id: run_fig3d_rigid_F5
  model: rigid_clutch_scan
  inputs: {F: F5_fig3d, tau: tau10_fig3, omega_prime: omega_prime_fig3}
  sweep: {beta_c: T_fig3d_F5}
  outputs: {T: T_fig3d_F5_rigid}
- id: run_figs1b_F025
  model: mean_field
  inputs: {F: F025_figs1, tau: tau_figs1, omega: omega_figs1}
  sweep: {K: nb_figs1b_F025}
  outputs: {nb: nb_figs1b_F025_pred}
- id: run_figs1b_F05
  model: mean_field
  inputs: {F: F05_figs1, tau: tau_figs1, omega: omega_figs1}
  sweep: {K: nb_figs1b_F05}
  outputs: {nb: nb_figs1b_F05_pred}
  note: "slow (minutes per point): on stiff substrates the solver follows the slipping branch (q_stall_bistable)"
- id: run_figs4r_rigid_tau10
  model: rigid_clutch_scan
  inputs: {F: F_figs4, tau: tau10_fig3, omega_prime: omega_prime_figs4}
  sweep: {beta_c: nb_figs4r_tau10}
  outputs: {nb: nb_figs4r_tau10_rigid}
  note: "tau from the Fig. 3(B) legend datum; Fig. S4 has the same legend (tau = 1, 2, 5, 10)"
- id: run_figs4r_rigid_tau5
  model: rigid_clutch_scan
  inputs: {F: F_figs4, tau: tau5_fig3, omega_prime: omega_prime_figs4}
  sweep: {beta_c: nb_figs4r_tau5}
  outputs: {nb: nb_figs4r_tau5_rigid}
  note: "tau from the Fig. 3(B) legend datum; Fig. S4 has the same legend (tau = 1, 2, 5, 10)"
