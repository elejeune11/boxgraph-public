- id: run_fig5a_tau1
  model: rigid_optimum_activity
  inputs: {tau: tau1_fig5a}
  sweep: {omega: Fopt_fig5a_tau1}
  outputs: {Fopt: Fopt_fig5a_tau1_pred}
- id: run_fig5a_tau5
