# Relations to Bangasser et al. 2013 (record bangasser2013, ref. 10). The paper cites ref. 10 for the
# kc-independence of the optimum (p. 8, p. 12) and for the condition that binding time equals cycle time
# (p. 8), but compares its Eq. 6 and its mean-field model only with its own numerics and with the
# dimensionless stochastic model of refs. 2 and 17, never with ref. 10's model. So both are proposed.
# Numbers in each model's port units: 1 pN/nm = 1000 pN/um.
- id: rel_b13_optimum_approx_eq6
  kind: approximated_by
  a: bangasser2013/optimal_stiffness
  b: alonsomatilla2023/kopt_eq6
  mapping: {C2: "0.4", C3: "0.05", nc: "nc", Fb: "Fb", kon: "kon", vu: "vu", koff: "koff", nm: "nm", Fm: "Fm"}
  output_map: {ks_opt: ks_opt}
  regime: {nm: [40, 60], Fm: [1.6, 2.4], vu: [100, 140], nc: [40, 60], kon: [0.24, 0.36], koff: [0.08, 0.12],
           Fb: [1.6, 2.4], kc: [0.4, 1.6]}
  tolerance: 0.25
  provenance: proposed
  reason: >-
    Eq. 6 is Alonso-Matilla's closed-form optimum substrate stiffness for the same clutch scheme as
    Bangasser's (linear motor force-velocity, Bell slip-bond clutches koff exp(F/Fb), linear clutch springs,
    one substrate spring), with no reinforcement and no catch bonds. The paper says Eq. 6 explains why
    the optimum is independent of clutch stiffness "as previously reported in other studies (10,17)"
    (p. 8) and that optimality is reached when binding time equals cycle time (10,17), Bangasser's Fig. 6D
    finding. If so, Eq. 6 with its fitted C2 = 0.4 and C3 = 0.05 should approximate the optimum of
    Bangasser's stochastic model, including over a fourfold range of kc, which Eq. 6 does not contain.
  assumptions:
    - "the two papers' nm, Fm, vu, nc, kon, koff, Fb, kc are the same parameters of one clutch scheme (Table 1 of each)"
    - "C2 = 0.4 and C3 = 0.05 as printed with Eq. 6 (fitted by Alonso-Matilla to their own mean-field numerics)"
    - "Bangasser's optimum is located on a 4-per-decade stiffness grid of one seeded 1000 s SSA run per point (this record's optimal_stiffness)"
    - "regime: +-20% around Bangasser's Table 1 base set (nm = nc = 50, kon = 0.3 /s, koff = 0.1 /s, Fb = Fm = 2 pN, vu = 120 nm/s), kc from 0.4 to 1.6 pN/nm"
    - "tolerance 0.25 (added, chosen before testing): Eq. 6 is a scaling estimate with fitted constants, and 0.25 is about the half-width of one grid step of the optimum search (10^0.125 = 1.33)"
- id: rel_b13_ssa_traction_approx_mean_field
  kind: approximated_by
  a: bangasser2013/motor_clutch_ssa
  b: alonsomatilla2023/mean_field_dimensional
  mapping: {nm: "nm", Fm: "Fm", vu: "vu", nc: "nc", kon: "kon", koff: "koff", Fb: "Fb", kc: "kc", ks: "1000*ksub"}
  output_map: {T: F_mean}
  regime: {nm: [40, 60], Fm: [1.6, 2.4], vu: [100, 140], nc: [40, 60], kon: [0.24, 0.36], koff: [0.08, 0.12],
           Fb: [1.6, 2.4], kc: [0.64, 0.96], ksub: [0.01, 0.1]}
  tolerance: 0.1
  provenance: proposed
  reason: >-
    Alonso-Matilla's mean-field model without reinforcement or catch bonds is a closure of the same
    stochastic clutch scheme Bangasser simulates (linear motor force-velocity, Bell slip bonds
    koff exp(F/Fb), clutch and substrate springs in series), and the paper reports "near-perfect agreement"
    between its mean-field and stochastic solutions (p. 8). A mean-field closure is not exact, so the time-averaged
    traction of the two is compared as an approximation.
  assumptions:
    - "the two papers' nm, Fm, vu, nc, kon, koff, Fb, kc and substrate spring constant are the same parameters of one clutch scheme"
    - "Bangasser's time-averaged traction ksub x_sub over one seeded 1000 s run is the mean-field long-time average T"
    - "regime: +-20% around Bangasser's Table 1 base set, on soft substrates (0.01-0.1 pN/nm, load-and-fail below and near the optimum); stiffer substrates are left out because one mean-field run there takes about a minute"
    - "tolerance 0.1 (added): allows for the noise of one seeded stochastic run"

# Relations to Bangasser and Odde 2013 (record bangasser2013b, ref. 17 / SI ref. S16). The paper says
# its mean-field theory "is a generalization of the model by Bangasser and Odde (17)" (p. 2) and that
# it relaxes "the adjustable parameter assumption made in (17)" (ε of Eq. 30) to derive a more general
# optimum (Eq. 6, p. 2). Both are entered as stated approximated_by relations: the generalization keeps
# the whole density of clutch extensions where ref. 17 keeps one bound probability with a gamma
# closure (Eq. 19), and no limit makes the two the same. Ref. 17's balanced regime is nm = nc, which an
# independent box over nm and nc cannot hold, so the Eq. 30 relations are pinned at the two ends of
# ref. 17's Fig. 4 (nm = nc = 25 and 3600, Table S1 base set otherwise), where ref. 17 itself evaluates
# Eq. 30 and its ODE optimum. Units pN, nm, s on both sides. Not entered: the paper's comparisons with
# "the dimensionless version of the stochastic motor-clutch model (17)" (p. 27) and "a stochastic
# Langevin-type approach (17)" (p. 31): the bangasser2013b record has no stochastic model (its MC is
# ref. 1's, record bangasser2013). Table 1 cites ref. 17 among others for the ranges of vu, kon and koff
# (p. 4), but its data carry no from_source and ranges are not values ref. 17 prints, so cited.yaml has
# no link to bangasser2013b.
# The generalization is entered as derived_from with the paper's steps in words. A numeric
# approximated_by between mean_field_optimum and clutch_ensemble_optimum was tried (2026-11-21) and
# did not finish within 10 minutes: the test runs 40 mean-field optimum searches of 13 mean-field
# runs each. The optima are compared through Eq. 6 below instead.
- id: rel_mean_field_generalizes_b13b_ensemble
  kind: derived_from
  a: bangasser2013b/clutch_ensemble_cycle
  b: alonsomatilla2023/mean_field
  mapping: {F: "nm*Fm/(nc*Fb)", tau: "kon/koff", omega: "vu*kc/(Fb*koff)", K: "ks/(nc*kc)"}
  steps:
    - "ref. 17 introduces a probability that each existing clutch is mechanically linking the actin cytoskeleton and the substrate (its Pb, Eqs. 8-12)"
    - "this paper replaces it by a multibond probability density of finding any clutch with a given extension at any time, and derives its conservation equation (Eq. 1, SI)"
    - "the closure of ref. 17 (balanced motors and clutches, the gamma distribution of clutch forces with its adjustable r, Eq. 19) is dropped"
    - "the equations are made dimensionless with the groups F, tau, omega, K (Table 2), giving Eqs. 3-4"
  provenance: stated
  citation: {page: 2, printed_page: "3370", quote: "mean-field theory is a generalization of the model by", where: "Materials and Methods, first paragraph"}
  assumptions:
    - "the same parameter names are the same parameters of one clutch scheme (nm, Fm, vu, nc, kon, koff, Fb, kc, substrate spring constant ks in pN/nm)"
    - "the steps are the paper's words; they cannot be applied symbolically, so the relation is not tested"
