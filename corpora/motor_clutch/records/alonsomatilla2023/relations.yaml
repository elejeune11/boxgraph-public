- id: rel_odde_ssa_traction_approx_mean_field
  kind: approximated_by
  a: odde_code/mc_event_port
  b: alonsomatilla2023/mean_field_dimensional
  mapping: {nm: "nm", Fm: "-Fm", vu: "-vu", nc: "nc", kon: "kon", koff: "koff", Fb: "-Fb", kc: "Kc", ks: "1000*Ksub"}
  output_map: {T: F_trac}
  regime: {nm: [40, 60], Fm: [-2.4, -1.6], vu: [-144, -96], nc: [40, 60], kon: [0.24, 0.36], koff: [0.08, 0.12],
