    - "the code's time-weighted mean traction -avtrac over one seeded run of 1e5 events (start-up included) is the mean-field long-time average T"
    - "regime: +-20% around motorclutch2_3.m's set (Bangasser 2013's base set), on soft substrates (0.01-0.1 pN/nm) where one mean-field run is short"
    - "tolerance 0.1 (added, chosen before testing): allows for the noise of one seeded stochastic run"

