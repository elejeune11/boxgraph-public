id: motor_count
name: number of myosin motors in the protrusion (SI legend A)
role: model
stated: {page: 19, quote: "cellular protrusion contains a similar motor surface density as that of the cytokinetic ring", where: "SI Table 1, legend A"}
equation: "n_m ~ rho_myo^ring x A, A the lateral surface of the protrusion cylinder (stated in words)"
from_words: true
inputs:
  rho: {quantity: motor_surface_density, unit: 1/um^2}
  A:   {quantity: protrusion_surface_area, unit: um^2}
outputs:
  n: {quantity: n_motors, unit: dimensionless}
settings: {}
built_from: [cylinder_count]
stochastic: false
