id: dimensionless_groups
name: dimensionless motor-clutch parameters (Table 2 definitions)
role: model
stated: {page: 4, printed_page: "3372", quote: "Nondimensionalization of the governing equations yields four dimensionless groups", where: "text and Table 2"}
equation: "F = nm Fm/nc Fb; tau = kon/koff; omega = vu kc/Fb koff; Delta = Fth/Fb"
inputs:
  nm:   {quantity: n_motors, unit: dimensionless}
  Fm:   {quantity: motor_stall_force, unit: pN}
  nc:   {quantity: n_clutches, unit: dimensionless}
  Fb:   {quantity: bond_rupture_force, unit: pN}
  kon:  {quantity: clutch_on_rate, unit: 1/s}
  koff: {quantity: clutch_off_rate_unloaded, unit: 1/s}
  vu:   {quantity: unloaded_motor_velocity, unit: nm/s}
  kc:   {quantity: clutch_stiffness, unit: pN/nm}
  Fth:  {quantity: reinforcement_threshold_force, unit: pN}
outputs:
  F:     {quantity: myosin_activity, unit: dimensionless}
  tau:   {quantity: clutch_kinetic_parameter, unit: dimensionless}
  omega: {quantity: dimensionless_motor_velocity, unit: dimensionless}
  Delta: {quantity: dimensionless_reinforcement_threshold, unit: dimensionless}
settings: {}
stochastic: false
