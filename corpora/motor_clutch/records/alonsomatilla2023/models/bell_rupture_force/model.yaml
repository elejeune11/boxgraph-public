id: bell_rupture_force
name: characteristic clutch rupture force from the Bell transition distance (SI legend C)
role: model
stated: {page: 20, quote: "where is the clutch transition distance that was", where: "SI Table 1, legend C"}
equation: "F_b = k_B T / Delta"
inputs:
  kT:    {quantity: thermal_energy, unit: pN*nm}
  delta: {quantity: bond_transition_distance, unit: nm}
outputs:
  Fb: {quantity: bond_rupture_force, unit: pN}
settings: {}
stochastic: false
