id: kopt_s11
name: optimum substrate stiffness of a motor-dominated protrusion (Eq. S11; main text p. 8)
role: model
stated: {page: 27, quote: "determine the substrate stiffness that maximizes traction forces in a motor-dominated protrusion", where: "Eq. S11"}
equation: "kappa_s,m^opt = C2 nc Fb kon / vu"
inputs:
  C2:  {quantity: optimum_constant_c2, unit: dimensionless}
  nc:  {quantity: n_clutches, unit: dimensionless}
  Fb:  {quantity: bond_rupture_force, unit: pN}
  kon: {quantity: clutch_on_rate, unit: 1/s}
  vu:  {quantity: unloaded_motor_velocity, unit: nm/s}
outputs:
  ks_opt: {quantity: optimal_substrate_stiffness, unit: pN/nm}
settings: {}
stochastic: false
