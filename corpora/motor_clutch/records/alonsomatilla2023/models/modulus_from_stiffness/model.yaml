id: modulus_from_stiffness
name: substrate Young's modulus at a given spring constant (SI legend E, solved for E_s)
role: processing
stated: {page: 20, quote: "the equivalent substrate Young's modulus", where: "SI Table 1, legend E"}
equation: "kappa_s = 2 pi d_s E_s / 9, solved for E_s = 9 kappa_s / (2 pi d_s)"
inputs:
  d:  {quantity: focal_adhesion_diameter, unit: nm}
  ks: {quantity: optimal_substrate_stiffness, unit: pN/um}
outputs:
  E: {quantity: optimal_youngs_modulus, unit: kPa}
settings: {}
built_from: [stiffness_from_modulus]
stochastic: false
