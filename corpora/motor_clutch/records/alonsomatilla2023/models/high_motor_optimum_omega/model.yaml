id: high_motor_optimum_omega
name: load-free velocity of maximal traction in the high-motor rigid limit (inset of Fig. 5(B), from Eqs. S55, S57)
role: model
stated: {page: 10, printed_page: "3378", quote: "with an optimum", where: "Fig. 5 caption, inset of (B)"}
equation: "omega_opt(tau) = argmax over omega of T*(tau, omega), T* the high-motor limit S55, S57"
from_words: true
inputs:
  tau: {quantity: clutch_kinetic_parameter, unit: dimensionless}
outputs:
  omega_opt: {quantity: optimal_motor_velocity, unit: dimensionless}
  Tmax:      {quantity: dimensionless_traction, unit: dimensionless}
settings: {omega_min: 0.1, omega_max: 100000.0, n_grid: 200}
built_from: [rigid_high_motor]
stochastic: false
