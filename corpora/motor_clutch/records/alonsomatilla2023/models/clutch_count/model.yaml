id: clutch_count
name: number of clutches in the protrusion (SI legend B, 'see legend A')
role: model
stated: {page: 19, quote: "The number of clutches can be approximated as", where: "SI Table 1, legend B"}
equation: "n_c ~ rho_c/(l_prot d_prot pi) as printed; computed as rho_c x A, A = pi l_prot d_prot the surface of legend A"
from_words: true
inputs:
  rho: {quantity: clutch_surface_density, unit: 1/um^2}
  A:   {quantity: protrusion_surface_area, unit: um^2}
outputs:
  n: {quantity: n_clutches, unit: dimensionless}
settings: {}
built_from: [cylinder_count]
stochastic: false
