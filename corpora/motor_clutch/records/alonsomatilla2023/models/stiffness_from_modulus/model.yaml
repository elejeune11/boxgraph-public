id: stiffness_from_modulus
name: effective substrate spring constant from Young's modulus (SI legend E)
role: model
stated: {page: 20, quote: "the equivalent substrate Young's modulus", where: "SI Table 1, legend E"}
equation: "kappa_s = 2 pi d_s E_s / 9"
inputs:
  d: {quantity: focal_adhesion_diameter, unit: nm}
  E: {quantity: substrate_youngs_modulus, unit: kPa}
outputs:
  ks: {quantity: substrate_stiffness, unit: pN/um}
settings: {}
stochastic: false
