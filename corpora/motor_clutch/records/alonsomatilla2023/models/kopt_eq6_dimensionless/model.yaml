id: kopt_eq6_dimensionless
name: Eq. 6 in the dimensionless groups, as plotted in Fig. 2(F)
role: model
stated: {page: 6, printed_page: "3374", quote: "Solid lines correspond to our derived analytical solution", where: "Fig. 2(F) caption, Eq. 6"}
equation: "K_opt = kappa_s^opt / nc kappa_c = C2 (tau/omega) / (1 - C3 tau/F)  (Eq. 6 divided by nc kappa_c)"
inputs:
  C2:    {quantity: optimum_constant_c2, unit: dimensionless}
  C3:    {quantity: optimum_constant_c3, unit: dimensionless}
  tau:   {quantity: clutch_kinetic_parameter, unit: dimensionless}
  omega: {quantity: dimensionless_motor_velocity, unit: dimensionless}
  F:     {quantity: myosin_activity, unit: dimensionless}
outputs:
  Kopt: {quantity: optimal_dimensionless_stiffness, unit: dimensionless}
settings: {}
built_from: [kopt_eq6]
stochastic: false
