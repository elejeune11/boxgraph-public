id: kopt_eq6
name: analytical optimum substrate stiffness (Eq. 6 / Eq. S12)
role: model
stated: {page: 8, printed_page: "3376", quote: "apply scaling analysis to estimate tbind and trupt", where: "Eq. 6"}
equation: "kappa_s,i^opt = C2 (nc Fb kon / vu) / (1 - C3 kon nc Fb / (koff nm Fm))"
inputs:
  C2:   {quantity: optimum_constant_c2, unit: dimensionless}
  C3:   {quantity: optimum_constant_c3, unit: dimensionless}
  nc:   {quantity: n_clutches, unit: dimensionless}
  Fb:   {quantity: bond_rupture_force, unit: pN}
  kon:  {quantity: clutch_on_rate, unit: 1/s}
  vu:   {quantity: unloaded_motor_velocity, unit: nm/s}
  koff: {quantity: clutch_off_rate_unloaded, unit: 1/s}
  nm:   {quantity: n_motors, unit: dimensionless}
  Fm:   {quantity: motor_stall_force, unit: pN}
outputs:
  ks_opt: {quantity: optimal_substrate_stiffness, unit: pN/nm}
settings: {}
stochastic: false
