# Port (our code) of cms2Dv1_0.m lines 200-202: the F-actin retrograde flow of one module.
#   mc(i).sdisp=((xsub(1)-xref(1))^2+(xsub(2)-xref(2))^2)^0.5;
#   mc(i).vf=mc(i).vu*(1-((Ksub*mc(i).sdisp)/(mc(i).nm*mc(i).Fm)));
#   if mc(i).vf<0; mc(i).vf=0; end
# The clip at zero (line 202) is not in the paper's Eq. 2 (q_flow_clip). sdisp is a distance, never
# negative.
id: flow_port
name: "module retrograde flow, linear force-velocity with a clip at zero (cms2Dv1_0.m lines 200-202, Python port)"
role: model
stated: {file: cms2Dv1_0.m, lines: "201", quote: "%calculate actin filament velocity"}
equation: "vf = vu*(1-((Ksub*sdisp)/(nm*Fm))); if vf<0, vf=0"
inputs:
  vu:    {quantity: unloaded_motor_velocity, unit: nm/s}
  Ksub:  {quantity: substrate_stiffness, unit: pN/nm}
  sdisp: {quantity: substrate_displacement, unit: nm}
  nm:    {quantity: n_motors_module, unit: dimensionless}
  Fm:    {quantity: motor_stall_force, unit: pN}
outputs:
  vf: {quantity: motor_retraction_velocity, unit: nm/s}
settings: {}
stochastic: false
