- id: n_eng_full_low
  quantity: n_engaged_clutches
  unit: dimensionless
  printed: "75"
  basis: >-
    A module of the low set holding its maximum of clutches (maxm/maxc rule, 0.1 x 750) with all of them
    engaged: the stiffest state of its springs, where the cell spring weighs most. Chosen to show how much
    the code's Kcell changes a module's series stiffness; the code itself sets no such state.
  alternatives: ["40", "10"]
  stands_for: "sum(mc(i).cstate) in cms2Dv1_0.m line 315"
- id: n_eng_full_high
  quantity: n_engaged_clutches
  unit: dimensionless
  printed: "750"
  basis: >-
    As n_eng_full_low for the high set (0.1 x 7,500 clutches per module, all engaged).
  alternatives: ["400", "100"]
  stands_for: "sum(mc(i).cstate) in cms2Dv1_0.m line 315"
