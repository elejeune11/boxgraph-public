# ==== cms2Dv1_0.m: values set inside the simulator ==================================================
- id: nummod_code
  quantity: n_modules
  unit: dimensionless
  origin: reported
  printed: "3"
  citation: {file: cms2Dv1_0.m, lines: "38", quote: "nummod=3; %number of modules (cell protrusions)"}
  from_source: bangasser2017
  from_datum: n_init_modules
- id: maxm_fraction_code
  quantity: module_max_fraction
  unit: dimensionless
  origin: reported
  printed: "0.1"
  citation: {file: cms2Dv1_0.m, lines: "39", quote: "maxm=mpool*0.1; %maximum number of motors in a single module"}
  note: "a rule fixed in the simulator, not a parameter of the shell; Supplementary Table 2 lists n*m as its own parameter (q_module_max_rule)"
- id: maxc_fraction_code
  quantity: module_max_fraction
  unit: dimensionless
  origin: reported
  printed: "0.1"
  citation: {file: cms2Dv1_0.m, lines: "40", quote: "maxc=cpool*0.1; %maximum number of clutches in a single module"}
  note: "the paper states this one-tenth rule only for the clutch sweep of Supplementary Fig. 5E-H (q_module_max_rule)"
- id: vf_newmodule_code
  quantity: new_module_initial_flow
  unit: nm/s
  origin: reported
  printed: "120"
  citation: {file: cms2Dv1_0.m, lines: "264", quote: "mc(nummod).vf=120;"}
  note: "a literal, not vu; overwritten at the next event before it is used for transport, so it can enter only the recorded mean flow of one sample (q_hardcoded_vf)"

# ==== analyzeCMSoutputv1_0.m: constants of the analysis =============================================
- id: jump_cutoff_code
  quantity: jump_speed_cutoff
  unit: nm/s
  origin: reported
  printed: "1000"
  citation: {file: analyzeCMSoutputv1_0.m, lines: "23", quote: "jump_mask = celldisp>(1000*tint);"}
  note: "1000 nm per tint seconds, i.e. 1000 nm/s at tint = 1 s; the paper prints 'large displacements in the simulated cell centre of 1 µm s-1 were removed' (bangasser2017 p. 7); no datum there to link"
- id: pix_code
  quantity: mask_pixel_size
  unit: nm
  origin: reported
  printed: "65.2"
  citation: {file: analyzeCMSoutputv1_0.m, lines: "84", quote: "pix = 65.2;"}
  note: "not in the paper (q_shape_analysis)"
- id: rmc_upper_code
  quantity: rmc_fit_upper_bound
  unit: um^2/min
  origin: reported
  printed: "1000"
  citation: {file: analyzeCMSoutputv1_0.m, lines: "67-68", quote: "'Lower',0,'Upper',1000"}
  note: "bounds of D in the fit of msd = 4 D t (um^2 against min, line 75 comment); not in the paper"

