notes: >
  The Source Data file released with andreu2021 (Nature Communications 12, 4229; the article's Data
  availability says "Source data are provided with this paper"). The licence given is the article's
  (Creative Commons Attribution 4.0); the spreadsheet itself states none. It has eleven sheets. Each holds
  only per-sample values (one per cell, bead, AFM curve, lung or gel point), with a panel label in row 1, a
  condition header in row 2 and values from row 3. No sheet gives means, s.e.m., SD or n, although the
  figures show mean ± s.e.m. So what is recorded is the samples behind each plotted point: one table datum
  per condition, indexed by sample_number (1, 2, ... within the cited cells), values as the cells hold them
  (the shortest decimal that rounds to the stored number). Where blank rows split a column into blocks
  (often of about 10 cells, perhaps separate experiments, which the sheet does not say), each block is its
  own datum (suffix _b1, _b2, ...), so that every cited range is all numbers. Conditions that are
  quantities (stretch, frequency, time, retraction speed, rigidity, ventilation frequency) are in
  `conditions`; the signal shape (triangular or square), treatments and cell types are in `note`.
  Sheets:
  "Figure 1": 1b actin retrograde flow (nm/s) on 0.6 kPa gels and glass (A-B); 1e-h YAP nuclear/cytoplasmic
  ratio and paxillin adhesion length (µm) at 2.5, 5, 10 and 20% stretch, conditions Sq, 2, 1, 0.5, 0.25,
  0.125 Hz, Ns (D-BG). These are the experimental points that Fig. 2e overlays on the model in andreu2021.
  "Figure 2": 2b actin anisotropy (A-F) and 2c adhesion length (G-J), control and Jasplakinolide.
  "Figure 3": 3d-g bead speed (µm/s), force loading rate (pN/s), stiffness (nN/µm) and GFP-paxillin
  recruitment (a.u.) at 0-160 s for 4 Hz and 0.25 Hz beads (A-AV); 3h-k the same at 160 s for all
  frequencies (AW-BY).
  "Figure 4": 4d and 4h apparent Young's modulus (kPa) at retraction speeds 1-8 µm/s, cell and bead AFM
  (A-P); 4k adhesion length and 4l YAP ratio, control and blebbistatin (Q-X); 4n and 4o paxillin recruitment
  over time at 0.25 and 4 Hz, control and blebbistatin (Y-AV).
  "Figure 5": 5c YAP ratio of rat lungs at 0.1, 1.1, 2.1 Hz (A-C); 5d left and right lungs at 1.1 Hz (D-E).
  Column B of 5c (12 lungs) repeats columns D and E of 5d.
  "Figure S1": S1a YAP vs gel rigidity; S1b cell area (µm²); S1c % EdU-positive cells; S1d YAP and
  adhesion length of Talin 1 knockdown cells; S1f-g adhesion length and YAP, Talin 2 shRNA and control.
  "Figure S2": S2a, three rows of 21 values against a row 0-2.0 (gel stretch against transducer voltage,
  by the caption). Not recorded: the figure itself is not in the PDF (p. 15 has only its caption), so the
  axes' units cannot be checked.
  "Figure S3": YAP ratio and adhesion length of HMVEC and SAEC cells at 10% stretch.
  "Figure S4": S4b-d bead displacement amplitude (µm), force amplitude (pN) and stiffness (nN/µm) at 0 s;
  S4e-g loading rate, stiffness and recruitment over time for all conditions, with blebbistatin at 0.25 and
  4 Hz.
  "Figure S5": S5a-b peak force (nN) at retraction speeds 1-8 µm/s, cell and bead AFM; S5d adhesion length,
  control and blebbistatin.
  "Table S2": the 30 AFM points behind each of the seven gel rigidities of Supplementary Table 2 (kPa).
  Left out: Figure S2 (above), and the text cells in rows 403-414 of "Figure 4" (q_fig4h_text_rows).
  Units come from the axis labels in the paper (pp. 3, 6, 7, 13, 17, 18); the sheet states none. The sample
  counts were spot-checked against Supplementary Table 3: Fig. 1e matches; two differences are open
  questions (q_fig4n_n, q_fig1g_pax_n). No mean was computed or written here: means and s.e.m. are for a
  processing model to derive from these samples.
