- id: q_xval_chan2008_none
  kind: unstated_input
  about: [clutch_no_talin_sim, clutch_talin_sim, nf_table, nm_table, kont_table, dint_table, ra_table, 'chan2008/v_fig3d_exp_sem', 'chan2008/v_figS8C_control', 'chan2008/v_fig3c_260', 'chan2008/v_fig3c_57k']
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    chan2008 (ref. 4, ST1-3), although this paper says its talin-depleted results "fully abide" by
    chan2008's clutch model (p. 8) and clutch_no_talin_sim has the same shape as chan2008's
    motor_clutch_E (actin speed from gel modulus, binding rates, stiffnesses and a motor velocity).
    chan2008 measures F-actin retrograde flow in filopodia of embryonic chick forebrain neurons on
    260 Pa to 57 kPa gels (Fig. 3C means, Fig. 3D with SEMs, Fig. S8C), filopodial forces (pN), bead
    displacement histograms and failure rates. clutch_no_talin_sim and clutch_talin_sim, run with this
    record's inputs, predict the periphery of a mouse embryonic fibroblast: nf, nm, kont, dadd and FR
    were adjusted to this paper's MEF tractions (Supplementary Table 1), and ra = 1700 nm is an
    adhesion's radius. Neither paper states nf, kont, dint, nm or ra for a neuron filopodium
    (chan2008's nc clutches, kon and koff are not these ports), and whether talin unfolding
    (clutch_talin_sim) or not (clutch_no_talin_sim) applies to those neurons is stated by neither, so
    a run would not be on the measurement's own cells. The flows are also of different structures
    (filopodia there; the cell periphery here, p. 10). chan2008's filopodial forces (pN), the
    scaled surface tension (dimensionless), bead displacements and failure rates are not outputs of
    these models (they give traction stress in Pa, actin speed and integrin density). In the other
    direction, see chan2008/q_no_validation_elosegui2016.
  citation: {page: 8, printed_page: "547", quote: "or integrin activity fully abides by the clutch model first proposed", where: text}
