id: talin_unfolding_time
name: average talin unfolding time under force, from the slip-bond unfolding rate
role: fit
stated: {page: 24, quote: "was modeled as a simple slip bond (one exponential with a positive exponent) by fitting the curve to previously measured data", where: Supplementary Note}
equation: "t_unf(f) = 1/k_unf(f), k_unf(f) = exp(ln_kunf0) exp(kunf_b f) (a slip bond; coefficients not printed)"
from_words: true
inputs:
  ln_kunf0: {quantity: ln_unfolding_rate_zero_force, unit: dimensionless}
  kunf_b:   {quantity: unfolding_force_coefficient, unit: 1/pN}
  f:        {quantity: talin_force, unit: pN}
outputs:
  t:        {quantity: talin_unfolding_time, unit: s}
settings: {}
stochastic: false
