id: unfold_refold_crossing
name: force on talin where the unfolding rate becomes faster than the refolding rate
role: model
stated: {page: 5, printed_page: "544", quote: "the force where unfolding rates become faster than refolding", where: text}
equation: "k_unf(f) = k_fold(f), with k_unf = exp(ln_kunf0 + kunf_b f) and k_fold = exp(ln_kfold0 + kfold_b f)"
inputs:
  ln_kunf0:  {quantity: ln_unfolding_rate_zero_force, unit: dimensionless}
  kunf_b:    {quantity: unfolding_force_coefficient, unit: 1/pN}
  ln_kfold0: {quantity: ln_refolding_rate_zero_force, unit: dimensionless}
  kfold_b:   {quantity: refolding_force_coefficient, unit: 1/pN}
outputs:
  f_cross: {quantity: talin_unfolding_force, unit: pN}
