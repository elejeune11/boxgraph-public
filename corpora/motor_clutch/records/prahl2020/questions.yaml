    and cites its U251 results only as trends its 1D simulations agree with: cRGD reduces traction and
    migration "consistent with 2D CMS predictions (9)" (p. 7), and the clutch optimum is "Consistent with
    2D simulations" (p. 7). It never runs a model on bangasser2017's measured conditions. Those
