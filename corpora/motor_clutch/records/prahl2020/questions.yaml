    cms_1d (whole-cell drift velocity, motility coefficient) is not runnable and gives no flow or
    traction. force_velocity_s2 gives a module's retrograde flow from its substrate spring force
    and its motor count; applied to supp. fig. 1(c) it would need the number of engaged motors per
    Y-27632 condition (and the split of a whole-cell force into module forces), which neither paper
    states and which Y-27632 changes, so any value would be fitted point by point, not predicted.
    At a fixed motor count it predicts flow falling with load, while the measured flow rises with
    force as myosin activity rises: the measurement varies the motor drive, which is an input
    here, not an output. No model here gives an intensity profile. In the other direction, see
    craig2015 q_xval_prahl2020_none.
  citation: {page: 4, printed_page: "1712", where: text, quote: "grade flow in the motor-clutch model, as previously sug"}
