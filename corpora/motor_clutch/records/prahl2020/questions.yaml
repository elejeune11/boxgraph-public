- id: q_cms_not_runnable
  kind: unstated_model
  about: [cms_1d, v_sim, mu_sim]
  text: >-
    The 1D CMS is stated by its rate laws and force balances (Eqns. S1-S8) and Table S1, but the algorithm is
    referred to ref. S1 (Bangasser et al. 2017): the order of events in a step, the share of motors and
    clutches given to a new module, how bound clutches move with F-actin flow, and the filter on
    displacements. The MATLAB code is not released with the paper; the later C++ simulator (cms1d_cpp_code)
    postdates it. The simulated motility coefficients and velocities (Figs. 1-7, S1, S3) are therefore
    recorded without a run, and the CMS drug predictions (Figs. 4A-B, 5A-B, 6C-D, 7C-D) are not checked.
  citation: {page: 16, printed_page: "S3", quote: "The order of events in each step of the model algorithm is", where: "Simulation implementation and analysis"}
- id: q_cms_numerics
  kind: numerics
  about: [cms_1d, v_sim, mu_sim]
  text: >-
    Every simulated result rests on 36-60 kinetic Monte Carlo runs of 5-7 h simulated time each, with the
    first hour dropped and displacements faster than 1 um/s filtered out; no sensitivity to the run length,
    the discarded hour, the sampling interval or the filter is reported, and the run length varies between
    runs ("5-7 hours").
  citation: {page: 16, printed_page: "S3", quote: "Individual runs represent data collected over 5-7 hours of simulated time", where: "Simulation implementation and analysis"}
