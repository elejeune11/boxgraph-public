  text: >-
    (Cross-record validation.) No model of this record is validated against cms_code, and no model of
    cms_code against this record's measurements. cms_code is the released MATLAB code of the 2D CMS of
    ref. 9 (Bangasser et al. 2017), which the paper names as the model it modifies ("In the previous 2D
    CMS (9)", p. 4) and to which its parameters are calibrated; but every datum of cms_code is a
    parameter set by the code (origin reported), with no measurement and no shipped simulation output,
