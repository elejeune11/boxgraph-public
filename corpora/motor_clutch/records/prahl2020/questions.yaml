    quantity, is not runnable (q_cms_not_runnable) and models a 1D channel with polarity psi_pol, not an
    unconfined 2D gel. force_velocity_s2 gives one module's flow from its substrate spring extension and
    motor count, neither of which bangasser2017 measures for its cells, and no stated mapping takes a gel
    modulus to ksub. msd_drift_eq2 and msd_prw_eq1 are fits: their mu, v, S and P for 2D gels are not
    stated by either paper, and taking them from bangasser2017's own motility coefficients (which that
    paper computed from the same MSD curves by its Eq. 12) would test nothing; Eq. 2 with n = 2, v = 0 is
    Eq. 12 (relations.yaml). In the other direction, see bangasser2017/q_xval_prahl2020_none.
