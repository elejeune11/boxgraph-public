    polarity psi_pol that these measurements belong to; the paper itself built cms_1d because of that
    difference. The runnable ports output one module's flow, a clutch off-rate, a polymerization speed, a
    module birth rate, a series stiffness or motor and clutch counts, none of which this paper measures
    (no retrograde flow, traction or adhesion lifetime is measured here). In the other direction, see
    cms_code/q_xval_prahl2020_none.
