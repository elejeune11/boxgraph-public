    other direction, this record's measurements are U251 migration in 1D confining channels: drift
    velocity and motility coefficient (v_exp, mu_exp, Figs. 3A-B, 4C-D, 5C-D, 6A-B, 7A-B), the MSD curve
    (fig2g_exp), EB1 microtubule growth speeds (eb1_mean, Fig. S5B), cell length and nucleus position
    (Fig. S5C-D). The only cms_code model that outputs a cell-migration quantity is cms2d_code (a 2D
    random motility coefficient and mean module flow), which is not runnable (cms_code/q_not_run) and is
