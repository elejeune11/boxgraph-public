    koff and Fbond: Kong's lifetimes are a catch bond of a5b1 on FNIII7-10 that rises then falls with
    force, which a single exponential cannot give, and neither paper says the one describes the
    other; the shared shape is a model-model relation. force_velocity_s2 gives a module's flow from
    its spring extension and engaged motor count, which Chan and Odde's run-averaged flows do not
    state, so a value would be fitted, not predicted (and the curve is indexed by Young's modulus,
    not a spring constant). cms_1d (drift velocity and motility coefficient in rigid channels) is not
    runnable and has no traction output; the Fig. 1A migration data are normalized curves against
