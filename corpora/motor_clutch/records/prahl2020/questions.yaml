    reproduces the printed Fdrag = -6.5 pN; with the Fig. 3B value it gives about -0.11 pN, 60 times smaller.
    The printed velocity unit looks like a slip; it does not weaken the conclusion that drag is negligible
    (it strengthens it), but the main text's "on the order of 6.5 pN" rests on it.
