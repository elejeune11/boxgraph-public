# cross-record validation against bell1978 (2026-11-19): none added
- id: q_xval_bell1978_none
  kind: choice
  about: [slip_bond_s1, nucleation_s8, ref-64]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    bell1978. bell1978 plots no measured data: its only figure with values, Fig. 8, is a model
    curve. Its only entries with origin measured are force_adhesive ("~ 1" dyne per cell,
    approximate, from its ref. 52) and the inhibiting sugar concentrations c_sugar_low and
    c_sugar_high (0.001 and 0.01 M, from its ref. 49). No model here outputs a whole-cell adhesive
    force or a sugar concentration. slip_bond_s1 is described from bell1978 and gives a clutch off
    rate under tension, but bell1978 measures no off rate. nucleation_s8 has the same shape as
    bell1978/loaded_reverse_rate (a rate from a length and a rate), but it describes actin
    nucleation, not bonds, and no bell1978 measurement is a rate. This paper cites bell1978 only
    for the slip-bond form (Supporting ref. 6). In the other direction, see bell1978
    q_xval_prahl2020_none.
  citation: {page: 14, printed_page: "S1", quote: "scales with force by a single exponential (6), also known as a slip bond", where: "Eqn. S1"}
# cross-record validation against chaudhuri2015 (2026-11-19): none added
- id: q_xval_chaudhuri2015_none
  kind: choice
  about: [cms_1d, slip_bond_s1, force_velocity_s2, ref-44]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    chaudhuri2015. This paper cites chaudhuri2015 (ref. 44) only among the works that describe the
    motor-clutch parameter values and their constraints ("previously described by both our previous
    work and that of several other labs (6,7,9,40-44)", p. 4), never for its data. chaudhuri2015
    measures alginate gel mechanics (initial Young's moduli, stress relaxation, G' and G''), spread
    areas of cells on elastic and stress-relaxing gels, the fractions of cells with stress fibres,
    attached or proliferating, and nuclear YAP ratios. The models here give 1D migration drift
    velocity and motility coefficient (cms_1d, not runnable), clutch off rates (slip_bond_s1),
    retrograde flow rates (force_velocity_s2), actin polymerization and nucleation rates, and MSD fits
    and histogram statistics of this paper's own tracks. None of them gives a spread area, a gel
    modulus or a cell fraction, and chaudhuri2015 measures no off rate or flow rate. The 1D CMS also
    has no viscoelastic substrate (Discussion, p. 9), so it could not address the stress-relaxation
    conditions of those measurements. In the other direction, see chaudhuri2015
    q_xval_prahl2020_none.
  citation: {page: 4, printed_page: "1712", where: text, quote: "previous work and that of several other labs"}
# cross-record validation against craig2015 (2026-11-19): none added
- id: q_xval_craig2015_none
  kind: unstated_model
  about: [cms_1d, force_velocity_s2, slip_bond_s1, polymerization_s3, nucleation_s8, ref-38]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    craig2015. This paper cites craig2015 (ref. 38) only for the suggestion that polymerization and
    myosin motors can both drive F-actin retrograde flow (p. 4), never for its data. craig2015's
    measurements with values are the U2OS lamellar flow speed and total traction force under
    Y-27632 (supp. fig. 1(a)-(c), from its ref. 31), Ptk1 flow speeds printed only as "~20" and "~2"
