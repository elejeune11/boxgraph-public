    - "Mekhdjian's clutch_force (κclutch times extension) and Prahl's clutch_tension Fclutch,i are the force on one engaged clutch, and both Fbond are bond_rupture_force (correspondences of quantities, not merged)"
    - "regime (relator's): clutch forces up to 20 pN, characteristic forces 0.5-10 pN around both papers' 2 pN"
