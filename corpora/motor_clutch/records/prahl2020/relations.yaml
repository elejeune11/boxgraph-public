- id: rel_cms_code_max_rule_same_as_clutch_cap
  kind: same_as
  a: cms_code/module_max_port
  b: prahl2020/module_clutch_cap
  mapping: {f: "fc", nclutch: "cpool"}
  output_map: {nclutch_module: maxc}
  regime: {mpool: [10, 10000], cpool: [10, 10000], fm: [0.05, 0.2], fc: [0.05, 0.2]}
  provenance: proposed
  reason: >-
    Table S1 gives the module clutch maximum as "0.1*nclutch (1)"; the code sets maxc = cpool*0.1 (line 40).
    A product, entered to show that the one-tenth rule of Table S1 is the code's.
- id: rel_cms1d_from_cms_code
  kind: derived_from
  a: cms_code/cms2d_code
  b: prahl2020/cms_1d
  mapping: {nmotor: "mpool", nmotor_module: "mpool/10", nclutch: "cpool", nclutch_module: "cpool/10", Fmotor: "Fm",
            vmotor: "vu", Fbond: "Fb", kclutch: "Kc", kon: "kon", koff: "koff", ksub: "Ksub", kcap: "kcap",
            knuc0: "kmod0", vactin_max: "maxpoly", Atotal: "totact/1000", kcell: "Kcell", Lcell: "lcell/1000",
            Lmin: "lmin", nclutch_cell: "nc"}
  steps:
    - "restrict module nucleation from a uniform angle in the plane to +x (probability psi_pol) or -x (p. S3)"
    - "solve the force balance for the cell position along x only (p. 2, 'we modified the CMS to solve for cell coordinates')"
    - "initial state of two modules in +x and one in -x; sample xcell every 5 min (the code samples every 15 min), drop the first hour, fit Eq. 2 (with drift) to the first half of the MSD"
  provenance: proposed
  reason: >-
    The paper says the 1D CMS "is modified from a previously described 2D CMS (9-12)" (p. 2), that "the order of
    events in each step of the model algorithm is previously described (1)" and that it was run in Matlab (p. S3);
    cms2d_code is the MATLAB 2D CMS released with ref. 9 = S1. The paper does not cite the code, so the relation is
    proposed. Neither model runs (cms2d_code is not ported, cms_1d defers its algorithm), so the steps cannot be applied.
  assumptions:
    - "psi_pol has no counterpart in the 2D code (a uniform nucleation angle), and the outputs differ (rgflow against mu and v)"
    - "nmotor,module and nclutch,module are the code's one-tenth rule (lines 39-40), as Table S1's '0.1*nmotor', '0.1*nclutch'"
    - "Table S1's kcell is 10^4 pN/nm and the code's shells set 1000 pN/nm (cms_code q_kcell): the mapping relates the symbols, not the values"
# Not entered: cms_code/module_assign_port (ceil(maxm (1 - totm/mpool))) has no model here: p. S2 says only that new
# modules "are assigned motors and clutches as a fraction of the available pool". cms_code/keff_port (series cell
# spring, clutches and substrate) is implied by Eqn. S5, which this record does not enter as a model.
# Not linked (cited.yaml): Table S1 values cite ref. S1 (record bangasser2017), not the code; the links run through
# bangasser2017, and cms_code does not cite this paper (it is earlier).
#
# Relations to bangasser2013 (ref. 40 = Supporting ref. S20). The paper says its modules follow "similar rules to
# those described for previous iterations of the motor-clutch model (6,40)" (Fig. 1 legend, p. 3) and that eight of
# its parameters "define the motor-clutch system properties (40)" (p. 4): the eight of Bangasser's Table 1 and
# sensitivity analysis (nm, Fm, vu, nc, kon, koff, Fb, kc). Both models are stochastic simulations and cms_1d is not
# runnable, so the steps cannot be applied: the relation stands on the paper's words.
- id: rel_cms_module_from_bangasser_ssa
  kind: derived_from
  a: bangasser2013/motor_clutch_ssa
