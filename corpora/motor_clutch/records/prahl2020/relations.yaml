- id: rel_catch_slip_eq9_to_slip_bond_s1
  kind: reduces_to
  a: bangasser2013/catch_slip_eq9
  b: prahl2020/slip_bond_s1
  mapping: {koff: "koff", Fclutch: "F", Fbond: "Fb"}
  output_map: {koff_i: koff_star}
  limit: {koffc: "0"}
  regime: {F: [0, 20], koff: [0.01, 1], Fb: [1, 10], koffc: [0.001, 1], Fc: [1, 10]}
  # the numeric limit stops at koffc ~ 1e-8 1/s, leaving a relative residual up to koffc/koff ~ 1e-6
  tolerance: 1.0e-5
  provenance: proposed
  reason: >-
    Prahl's Eqn. S1 cites Bell (ref. S6) for the slip bond, not Bangasser, but says the modules follow the rules of
    Bangasser's motor-clutch model (ref. 40). Bangasser's Eq. 9 is a catch-slip off-rate whose first term, koff
    exp(Fi/Fb), "is identical to the Bell model" and is the off-rate of the rest of that study. With no catch term
    (koffc -> 0), Eq. 9 is Eqn. S1 with Bangasser's Fi as Prahl's Fclutch,i and Fb as Fbond.
  assumptions:
    - "Bangasser's force Fi on one clutch is Prahl's Fclutch,i; Bangasser's rupture force Fb is Prahl's characteristic slip bond force Fbond (both 2 pN in the base sets); correspondences of quantities, not merged"
