# Relations this paper states about its models. Each 1D CMS module is "an instance of the motor-clutch
# model (5)", Supporting ref. 5 = Chan and Odde 2008 (record chan2008), and its clutches unbind by the
# slip bond of ref. 6 = Bell 1978. Chan's Eq. 1 already carries Bell's law (chan2008/rel_bell_off_rate).
- id: rel_slip_bond_chan
  kind: same_as
  a: prahl2020/slip_bond_s1
  b: chan2008/off_rate_eq1
  mapping: {koff: "koff", Fclutch: "Fclutch", Fb: "Fbond"}
  output_map: {koff_star: koff_i}
  regime: {koff: [0.01, 10], Fclutch: [0, 20], Fbond: [1, 10]}
  provenance: stated
  citation: {page: 14, printed_page: "S1", quote: "each functioning as an instance of the motor-clutch", where: "Supporting Methods, before Eqn. S1"}
  assumptions:
    - "Prahl's characteristic bond force Fbond is Chan's Fb, and the force Fclutch,i on the ith clutch is Chan's clutch tension Fclutch"
    - "regime in positive forces; Chan prints Fclutch and Fb both negative, which leaves their ratio unchanged"
# Supporting ref. S6 = Bell 1978: Eqn. S1 is Bell's loaded reverse rate (p. 623) with Fbond = kT/gamma.
- id: rel_slip_bond_bell
  kind: same_as
  a: bell1978/loaded_reverse_rate
  b: prahl2020/slip_bond_s1
  mapping: {koff: "k_minus", Fclutch: "f*1e7", Fbond: "kT*160.2176634/gamma"}
  output_map: {koff_i: k_minus_F}
  regime: {k_minus: [0.01, 10], gamma: [0.1, 2], f: [0, 2e-6], kT: [0.024, 0.028]}
  provenance: stated
  citation: {page: 14, printed_page: "S1", quote: "scales with force by a single exponential (6), also known as a slip bond", where: "Supporting Methods, before Eqn. S1"}
  assumptions:
    - "Bell's force per closed bond F/Nb is Prahl's force on one clutch Fclutch,i (1 dyne = 1e7 pN)"
    - "Prahl's characteristic bond force Fbond stands for Bell's kT/gamma (eV/nm -> pN is 160.2176634)"
    - "Bell's reverse rate k- of a membrane-bound bond is Prahl's unloaded clutch off-rate koff"
# Not entered: nucleation_s8 shares only its shape (a rate from a rate and lengths) with bell1978/loaded_reverse_rate;
# a fourth-power G-actin law has no mapping onto Bell's force exponential.
# Not linked (cited.yaml): no Table S1 value is taken from Bell; Fbond and koff cite refs S21 and S23.
#
# Relations to chaudhuri2015 (ref. 44). This paper cites Chaudhuri only in a group of references for the
# "values of these parameters and the constraints on their relationships" (p. 4, "(6,7,9,40-44)"); it names
# no model of Chaudhuri's and takes no Table S1 value from it (no datum cites ref-44), so nothing is stated
# and no value is linked in cited.yaml. The two relations below are proposed.
- id: rel_chaudhuri_bell_off_rate_same_as_slip_bond
  kind: same_as
  a: chaudhuri2015/bell_off_rate
  b: prahl2020/slip_bond_s1
  mapping: {koff: "koff", Fclutch: "Fclutch", Fbond: "Frup"}
  output_map: {koff_i: koff_star}
  regime: {koff: [0.01, 10], Fclutch: [0, 20], Frup: [1, 10]}
  provenance: proposed
  reason: >-
    Both papers unbind a clutch by the Bell slip bond, both citing Bell 1978 (Chaudhuri sref-5, Prahl
    ref. S6): Chaudhuri's k*off = koff e^(Fclutch/Frup) (Supp. Note 1) and Prahl's Eqn. S1,
    koff,i = koff exp(Fclutch,i/Fbond), are the same exponential law of the force on one clutch over a
    characteristic rupture force; units 1/s and pN on both sides.
  assumptions:
    - "Chaudhuri's rupture force per bond Frup and Prahl's characteristic bond force Fbond are the same parameter of the same law (both 2 pN in the papers' parameter tables), and both Fclutch are the force on one clutch (correspondences of quantities, not merged)"
- id: rel_force_velocity_s2_same_as_chaudhuri_retrograde_flow
  kind: same_as
  a: prahl2020/force_velocity_s2
  b: chaudhuri2015/retrograde_flow_eq1
  mapping: {vu: "vmotor", F_sum: "ksub*dxsub", Fstall: "Fmotor*nmotor_j"}
  output_map: {v_retrograde: vflow}
  regime: {vmotor: [50, 200], ksub: [0.1, 100], dxsub: [0, 50], Fmotor: [1, 3], nmotor_j: [10, 200]}
  provenance: proposed
  reason: >-
    Both are the linear force-velocity law of Chan and Odde's motor-clutch model (Prahl's Eqn. S2 is
    described from chan2008; Chaudhuri builds on "the framework of a previous model by Chan and Odde"):
    retrograde flow slows from the unloaded motor velocity in proportion to the load over the stall force
    of the motors. Prahl writes the load as the substrate spring force ksub dxsub,j and the stall force as
    Fmotor nmotor,j; Chaudhuri writes the summed clutch force and Fstall. Only the retrograde flow is
    mapped; Chaudhuri's second output, v_spread = vu - v_retrograde, has no counterpart in Eqn. S2.
  assumptions:
    - "the substrate spring of a module carries the summed force of its engaged clutches (quasi-static force balance of the motor-clutch model), so ksub dxsub,j is Chaudhuri's sum of Fclutch; in Chaudhuri's lattice model each clutch pulls its own substrate spring, but Supp. Eq. 1 is written in the summed clutch force, which is the load in both"
    - "Chaudhuri's stall force Fstall is the module's total motor stall force, Fmotor nmotor,j (Chan's Eq. 4); Chaudhuri's unloaded velocity vu is Prahl's vmotor"
# Not entered: chaudhuri2015/clutch_springs_nolattice and prahl2020/cms_1d both simulate motor-clutch systems,
# but cms_1d is not runnable, the outputs differ (a spreading speed against a cell migration speed), and
# neither paper states a limit taking one to the other.
# Eqn. S2 (force-velocity) is Chan's Eq. 3 with nmotor,j Fmotor as Chan's Fstall (Eq. 4). chan2008 recorded Eq. 3 only
# inside its full simulation, so a helper model chan2008/force_velocity_eq3 (Eqs. 3-4) was added to test the statement.
- id: rel_force_velocity_chan
  kind: same_as
  a: chan2008/force_velocity_eq3
  b: prahl2020/force_velocity_s2
  mapping: {vmotor: "vu", ksub: "ksub", dxsub: "xsub", Fmotor: "Fm", nmotor_j: "nm"}
  output_map: {vflow: vfilament}
  regime: {vu: [50, 200], ksub: [0.1, 100], xsub: [0, 50], nm: [10, 200], Fm: [1, 3]}
  provenance: stated
  citation: {page: 14, printed_page: "S1", quote: "slows from the myosin II motor unloaded velocity vmotor by a linear force-velocity relationship", where: "Supporting Methods, Eqn. S2; ref. 5 = Chan and Odde 2008"}
  assumptions:
    - "Chan's motor ensemble (nm motors of stall force Fm on one filopodial bundle) is Prahl's module ensemble (nmotor,j motors of stall force Fmotor); Chan's substrate position xsub is Prahl's substrate spring extension dxsub,j"
    - "regime in positive values; Chan prints vu, Fm and xsub negative (retrograde = -x), which leaves vu (1 - ksub xsub/(nm Fm)) the same up to the sign of the velocity, so Chan's vfilament is Prahl's retrograde flow vflow in magnitude"
# The 1D CMS module is stated to be Chan's motor-clutch model; the CMS adds to it actin polymerization, a G-actin pool,
# module nucleation and capping, cell-body clutches and a cell spring. Neither model has a symbolic form and cms_1d is
# not runnable, so the steps cannot be applied: the relation is entered with the paper's words as its evidence.
- id: rel_cms_module_from_chan
  kind: derived_from
  a: chan2008/motor_clutch
  b: prahl2020/cms_1d
  mapping: {nmotor_module: "nm", Fmotor: "Fm", vmotor: "vu", nclutch_module: "nc", kon: "kon", koff: "koff",
            Fbond: "Fb", kclutch: "kc", ksub: "ksub"}
  steps:
    - "each protrusion module j functions as an instance of the motor-clutch model, with nmotor,j motors and nclutch,j clutches drawn from cell pools"
    - "modules extend by actin polymerization from a shared G-actin pool (Eqns. S3-S4), are nucleated at knuc (Eqn. S8) and capped at kcap"
    - "modules are joined to a cell body (with its own clutches) by a cell spring, under the force balances Eqns. S5-S7"
  provenance: stated
  citation: {page: 14, printed_page: "S1", quote: "each functioning as an instance of the motor-clutch model", where: "Supporting Methods; ref. 5 = Chan and Odde 2008"}
  assumptions:
    - "the mapping covers only the module-level inputs both share; cms_1d's cell-level inputs (nmotor, nclutch, kcap, knuc0, vactin_max, Atotal, kcell, Lcell, Lmin, nclutch_cell, psi_pol) have no counterpart in chan2008, and its outputs (motility coefficient, drift velocity) none in chan2008's (flow, traction)"
    - "Chan's signed vu, Fm, Fb are Prahl's positive vmotor, Fmotor, Fbond in magnitude"
# Not linked (cited.yaml): no prahl2020 datum cites ref. 6 / S5 (Chan); Table S1's "~100 nm s-1 observed in other cells
# (5, 19)" and vactin,max "(3, 5)" are an approximate comparison and an estimate citing several works, and chan2008
# prints no vactin,max; chan2008 cites no prahl2020 value (it is earlier).
# Not entered: the 1D CMS (cms_1d) is "modified from a previously described 2D CMS (9-12)"; bangasser2017's record has
# no models yet, and cms_1d is not runnable, so a derived_from relation could not be tested.
#
# Relations to craig2015 (ref. 38). This paper cites Craig once, with Gardel 2008, for the idea that actin
# polymerization and myosin II can both drive F-actin retrograde flow (p. 4, "as previously suggested (37,38)");
# it names no model of Craig's and takes no Table S1 value from it (no datum cites ref-38), so nothing is
# stated and nothing is linked in cited.yaml. None is proposed either:
# - craig2015/hill_eq11 (V_LM = Vmax Ftot/(Fk + Ftot)) and force_velocity_s2 (vflow = vmotor (1 - load/stall))
#   share only the form "a speed from a force": Craig's flow rises and saturates with the total traction set by
#   myosin strength, Prahl's falls linearly with the load opposing the motors. For positive parameters the slopes
#   have opposite signs, and no limit takes one to the other.
# - Craig's adhesion clutch is a continuum friction (drag) on a viscous actin network, not discrete Bell clutches
#   or a motor force-velocity law, so slip_bond_s1 and the Craig field models (clutch_fields, clutch_profile)
#   share no rate law; cms_1d is not runnable and its outputs (motility coefficient, drift) have no Craig counterpart.
#
# Relations to elosegui2014 (ref. 41). This paper cites Elosegui-Artola 2014 only in the same group of references
# for the "values of these parameters and the constraints on their relationships" (p. 4, "(6,7,9,40-44)"); it
# names no model of Elosegui's, the Supporting references (S1-S23) do not include it, and no Table S1 value cites
# ref-41, so nothing is stated and nothing is linked in cited.yaml. None is proposed either:
# - elosegui2014/integrin_clutch_sim is not runnable (its equations are in an unreadable SI) and unbinds by a
#   catch bond with two competing integrin types and reinforcement; slip_bond_s1 is a Bell slip bond, and the
#   paper's statement that a slip bond gives the same qualitative results is not a mapping that could be tested.
# - elosegui2014's runnable models (koff_ratio, kont_ratio, kon_eff_ratio, density_fold) are ratios of SPR binding
#   constants and integrin densities between two integrin types; no model of this paper computes such a ratio.
#   kon_from_koff (kon from koff and the ratio kon/koff) is also a product, but of a clutch's own rates, not a
#   ratio between two bond types: a form too plain to mean anything, so not entered.
#
# Relations to elosegui2016 (ref. 7 = Supporting ref. S19). This paper cites Elosegui-Artola 2016 twice, both for
# values: in the group "(6,7,9,40-44)" for the "values of these parameters and the constraints on their
# relationships" (p. 4), and in Table S1 for vmotor, "Measured in (1); ~100 nm s-1 observed in other cells (5, 19)"
# (p. 22). It names no model of Elosegui's and states no relation, so nothing is stated. Nothing is linked in
# cited.yaml: Table S1's vmotor (120 nm/s) is taken from ref. S1, and the "~100 nm s-1" of refs. 5 and 19 is an
# approximate comparison, not recorded as a datum (Elosegui prints 110 nm/s, Supplementary Table 1). None is proposed:
# - elosegui2016/clutch_no_talin_sim and cms_1d both build on motor-clutch modules (motors with a linear force-velocity
#   law, clutch springs, a substrate spring), but they differ in the off-rate (catch bond against Eqn. S1's slip bond),
#   in kind (one adhesion at fixed position against many nucleating, capped modules with a cell body spring), and in
#   outputs (traction and actin flow against motility coefficient and drift velocity, which have no counterpart);
#   cms_1d is not runnable, so a relation could not be tested, and neither paper states a limit taking one to the other.
#   Their module-level link runs through chan2008 and bangasser2013, already related to each (rel_slip_bond_chan here;
#   rel_chan_clutch_slip_limit and rel_bangasser_ssa_approximated_by_no_talin in elosegui2016).
# - elosegui2016/talin_unfolding_time is a single exponential in force like slip_bond_s1, but of talin unfolding, not
#   of clutch unbinding, and it outputs a time: a shared exponential form only, so not entered.
# - Prahl's 1D CMS has no talin unfolding or integrin recruitment, so clutch_talin_sim, unfold_refold_crossing and
#   threshold_sensitivity have no counterpart.
#
# Relations to gardel2008 (ref. 37). This paper cites Gardel twice: with Craig (ref. 38) for the idea that actin
# polymerization and myosin II can both drive F-actin retrograde flow (p. 4, "as previously suggested (37,38)"), and
# with ref. 30 for the size of traction forces of adherent cells, against which the ~6.5 pN fluid drag is "orders of
# magnitude smaller" (p. 10, "(30,37)"). Neither citation names a model of Gardel's, and the Supporting references
# (S1-S23) do not include it. No Table S1 value or other datum cites ref-37, so nothing is stated and nothing is linked
# in cited.yaml. None is proposed either:
# - gardel2008/switch_speed_claim and switch_speed_by_condition are word claims: the F-actin speed at peak traction is
#   one threshold Vc (8-10 nm/s). No model of this paper outputs the actin speed at peak traction. force_velocity_s2
#   is a monotonic linear motor law with no traction maximum. cms_1d could in principle give a traction-flow curve, but
#   it is not runnable and the paper reports no traction or flow speed from it, so a relation could not be tested.
#
# Relations to gong2018 (ref. 43). This paper cites Gong only in the group of references for the "values of these
# parameters and the constraints on their relationships" (p. 4, "(6,7,9,40-44)"); it names no model of Gong's and
# the Supporting references (S1-S23) do not include it. No Table S1 value or other datum cites ref-43, so nothing
# is stated and nothing is linked in cited.yaml. One relation is proposed:
- id: rel_gong_bell_off_rate_same_as_slip_bond
  kind: same_as
  a: gong2018/bell_off_rate
  b: prahl2020/slip_bond_s1
  mapping: {koff: "roff0", Fclutch: "Fc", Fbond: "Fb"}
  output_map: {koff_i: roff}
  regime: {roff0: [0.01, 10], Fc: [0, 20], Fb: [1, 10]}
  provenance: proposed
  reason: >-
    Both papers unbind a clutch by the Bell slip bond, both citing Bell 1978 (Gong ref. 27, p. 2; Prahl ref. S6):
    Gong's roff,i = roff0 exp(Fc,i/Fb) and Prahl's Eqn. S1, koff,i = koff exp(Fclutch,i/Fbond), are the same
    exponential law of the force on one clutch over a characteristic force; units 1/s and pN on both sides.
  assumptions:
    - "Gong's characteristic force Fb and Prahl's characteristic bond force Fbond are the same parameter of the same law, Gong's clutch force Fc,i and Prahl's Fclutch,i the force on one clutch, and roff0 and koff the unloaded off-rate (correspondences of quantities, not merged)"
    - "gong2018/bell_off_rate is a helper model of a step inside Gong's mean-field ODE, where it is applied to the ensemble clutch force; Prahl applies it to each clutch of a stochastic module"
# Not entered: gong2018's mean-field models (mean_field_sls, mean_field_elastic) against prahl2020/cms_1d: cms_1d
# is not runnable, its outputs (migration speed, motility coefficient) have no counterpart in Gong's spreading speed,
# FA lifetime and mean force, and Gong's substrate is viscoelastic and reinforcing while Prahl's is elastic.
# Not entered: prahl2020/force_velocity_s2 has no counterpart model in gong2018 (Gong's Hill relation is a step inside
# the ODE); gong2018/boussinesq_eq_s9, tbind_estimate and the timescale models have no counterpart in prahl2020.
#
# Relations to cms_code (the MATLAB CMS v1.0 released with Bangasser et al. 2017, ref. 9 = S1). This paper says its
# 1D CMS "is modified from a previously described 2D CMS (9-12)" (p. 2) and that "the order of events ... is
# previously described (1)" (p. S3), and that its simulations "were run in Matlab", but it cites the paper, not the
# released code, and its own code is not released. Every relation to the code is therefore proposed. a is the code's
# port, b this paper's model; the code's actin lengths are in nm, this paper's Atotal, AG and Lcell in um (factor 1000).
# The code's factin (F-actin held in modules) is Atotal - AG by this paper's mass balance, Eqn. S4.
- id: rel_cms_code_off_rate_same_as_slip_bond
  kind: same_as
  a: cms_code/off_rate_port
  b: prahl2020/slip_bond_s1
  mapping: {koff: "koff", Fclutch: "Fc", Fbond: "Fb"}
  regime: {koff: [0.01, 10], Fc: [0, 20], Fb: [1, 10]}
  provenance: proposed
  reason: >-
    The CMS code's clutch off-rate (cms2Dv1_0.m line 181, "off-rate increases with load according to Bell Model")
    is koff exp(|Fc|/Fb); Eqn. S1 is koff,i = koff exp(Fclutch,i/Fbond), and the paper says its modules work "as
    with previous versions" of the CMS (p. S1).
  assumptions:
    - "the code's Fc is the norm of a 2D clutch force, never negative; this paper's 1D Fclutch,i is taken in magnitude (regime in positive forces)"
- id: rel_cms_code_flow_same_as_force_velocity_s2
  kind: same_as
  a: cms_code/flow_port
  b: prahl2020/force_velocity_s2
  mapping: {vmotor: "vu", ksub: "Ksub", dxsub: "sdisp", Fmotor: "Fm", nmotor_j: "nm"}
  regime: {vu: [50, 200], Ksub: [0.01, 10], sdisp: [0.01, 0.9], nm: [10, 1000], Fm: [1, 3]}
  provenance: proposed
  reason: >-
    The code's module flow (cms2Dv1_0.m lines 200-201) is vu (1 - Ksub sdisp/(nm Fm)), Eqn. S2's
    vmotor (1 - ksub dxsub,j/(Fmotor nmotor,j)) term for term.
  assumptions:
    - "regime below stall (Ksub sdisp at most 9 pN against nm Fm at least 10 pN): the code clips the flow at zero beyond stall (line 202, cms_code q_flow_clip), Eqn. S2 prints no clip and gives a negative flow there"
    - "the code's sdisp, the distance of the module's substrate point from its reference, is this paper's substrate spring extension dxsub,j"
- id: rel_cms_code_polyrate_same_as_polymerization_s3
  kind: same_as
  a: cms_code/polyrate_port
  b: prahl2020/polymerization_s3
  mapping: {vactin_max: "maxpoly", AG: "(totact - factin)/1000", Atotal: "totact/1000"}
  regime: {maxpoly: [50, 500], factin: [1000, 90000], totact: [100000, 1000000]}
  provenance: proposed
  reason: >-
    The code's polymerization speed (cms2Dv1_0.m lines 207, 371) is maxpoly (1 - factin/totact), Eqn. S3's
    vactin,max AG/Atotal with AG = Atotal - sum AF,j (Eqn. S4).
  assumptions:
    - "the code's factin (sum over modules of sdist - mdist) is this paper's sum of AF,j, so totact - factin is AG"
    - "capped modules do not polymerize in either (code line 208; p. S2 'capped modules no longer extend')"
- id: rel_cms_code_kmod_same_as_nucleation_s8
  kind: same_as
  a: cms_code/kmod_port
  b: prahl2020/nucleation_s8
  mapping: {knuc0: "kmod0", AG: "(totact - factin)/1000", Atotal: "totact/1000"}
  regime: {kmod0: [0.1, 10], factin: [1000, 90000], totact: [100000, 1000000]}
  provenance: proposed
  reason: >-
    The code's module birth rate (cms2Dv1_0.m line 171) is kmod0 (1 - factin/totact)^4, Eqn. S8's
    knuc,0 (AG/Atotal)^4 with AG = Atotal - sum AF,j.
  assumptions:
    - "the code's factin is this paper's sum of AF,j (Eqn. S4)"
    - "in the 2D code a new module takes a uniform random angle; in the 1D CMS it points +x with probability psi_pol. The rate is the same; only the direction rule differs"
- id: rel_cms_code_max_rule_same_as_motor_cap
  kind: same_as
  a: cms_code/module_max_port
  b: prahl2020/module_motor_cap
  mapping: {f: "fm", nmotor: "mpool"}
  output_map: {nmotor_module: maxm}
  regime: {mpool: [10, 10000], cpool: [10, 10000], fm: [0.05, 0.2], fc: [0.05, 0.2]}
