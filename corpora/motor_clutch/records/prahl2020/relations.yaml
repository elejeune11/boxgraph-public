# - optimal stiffness (module_optimum, gaussian_optimum_*, the fold models): no prahl2020 model outputs an optimum; Prahl
#   cites ref. 9 for the claim that its 1000 pN/nm channels lie above U251's stiffness sensitivity (p. 10), not a model.
# - module_ssa against cms_1d: cms_1d is not runnable; the module-level rules are related one by one above.
#
# Relations to mekhdjian2017 (main-text ref. 30 = Supporting ref. S17; relator, 2026-11-22). This paper cites Mekhdjian
# et al. only for the size of cellular traction forces: Table S1's nmotor source, "~10^2-10^5 required for nN total
# traction force (17)" (p. 22), the drag estimate "much smaller than cellular traction force estimates (17)" (p. 21),
# and "traction forces produced by adherent cells (30,37)" and "relationships between biophysical measurements in 2D
# substrates and confined migration behaviors (30,31)" (p. 10). None names a model of Mekhdjian's, so nothing is stated.
# Nothing is linked in cited.yaml: no datum carries from_source ref-S17 (nmotor = 10^3 is "Adjustable"; the 10^2-10^5
# range is a constraint, not a value Mekhdjian prints). One relation is proposed, the shared slip-bond rule.
- id: rel_mekhdjian_bell_off_rate_same_as_slip_bond
  kind: same_as
  a: mekhdjian2017/bell_off_rate
  b: prahl2020/slip_bond_s1
  mapping: {koff: "koff", Fclutch: "Fclutch", Fbond: "Fb"}
  output_map: {koff_i: koff_star}
  regime: {koff: [0.001, 10], Fclutch: [0, 20], Fb: [0.5, 10]}
  provenance: proposed
  reason: >-
    Both papers unbind each clutch by the Bell slip bond, both citing Bell 1978: Mekhdjian's Supplement (p. 24),
    "a single exponential Bell's law" with a characteristic bond force Fbond, koff* = koff exp(Fclutch/Fbond), and
    Prahl's Eqn. S1, koff,i = koff exp(Fclutch,i/Fbond). One law of the force on one clutch over a characteristic
    bond force; units 1/s and pN on both sides.
