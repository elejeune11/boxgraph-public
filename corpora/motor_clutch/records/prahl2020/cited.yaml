# Values this paper takes from other records' papers, linked to those records' data.
# Table S1 (PDF p. 22) source "(20)" = Supporting ref. S20 = Bangasser et al. 2013 (record bangasser2013).
- {datum: kclutch, from_datum: kc_base, evidence: "Table S1 gives the clutch spring constant 0.8 pN/nm with source (20) = Bangasser et al. 2013; Bangasser's Table 1 prints the clutch spring constant kc = 0.8 pN/nm in its base parameter set"}
# Not linked: Table S1's nclutch (750) also cites (20), but for the rule nclutch ~ nmotor, not a value Bangasser prints
# (Bangasser's base set has nc = 50); the datum carries no from_source.
# Table S1 source "(22)" = Supporting ref. S22 = Bangasser and Odde 2013 (record bangasser2013b).
- {datum: kon, from_datum: kon_base, evidence: "Table S1 gives kon = 1 s-1, 'Theoretical estimate, 10*koff (22)', with (22) = Bangasser and Odde 2013; their Table S1 prints the clutch on-rate kon = 1 s-1 in the base set"}
# Table S1 source "(1)" = Supporting ref. S1 = Bangasser et al. 2017 (record bangasser2017), against its Supplementary Table 2
# (the low motor-clutch set where it prints two values).
- {datum: nmotor_module, from_datum: nm_star_low, evidence: "Table S1's maximum motors per module, 100, '0.1*nmotor (1)'; Bangasser 2017 Supplementary Table 2 prints n*m = 100 for the low set (Nm = 1,000)"}
- {datum: vmotor, from_datum: vm_star, evidence: "Table S1's unloaded myosin II velocity 120 nm/s, 'Measured in (1)'; Bangasser 2017 Supplementary Table 2 prints v*m = 120 nm/s"}
- {datum: nclutch_module, from_datum: nc_star_low, evidence: "Table S1's maximum clutches per module, 75, '0.1*nclutch (1)'; Bangasser 2017 Supplementary Table 2 prints n*c = 75 for the low set (Nc = 750)"}
- {datum: Atotal, from_datum: Atot, evidence: "Table S1's total actin pool for protrusions, 100 um, 'Estimate of total cell protrusion length (1)'; Bangasser 2017 Supplementary Table 2 prints Atot, total possible actin protrusion length, 100 um"}
- {datum: kcell, from_datum: kcell, evidence: "Table S1's cell spring constant 10^4 pN/nm, 'estimated in (1)'; Bangasser 2017 Supplementary Table 2 prints κcell = 10,000 pN/nm"}
- {datum: nclutch_cell, from_datum: nccell_low, evidence: "Table S1's 10 cell body clutches, 'estimated in (1)'; Bangasser 2017 Supplementary Table 2 prints nc,cell = 10 for the low set (100 for the high)"}
# Not linked: frac_motor_module and frac_clutch_module (0.1, from ref. S1): bangasser2017 states the one tenth only in words
# (Supplementary Fig. 5 legend), with no datum. kcap and knuc0 cite "(1, 24)" and "(1, 3)" and carry no from_source; they
# equal Supplementary Table 2's kcap = 0.001 1/s and k*mod = 1 1/s. Lcell (5 um) and Lmin (100 nm) carry no source and equal
# lin and lmin there.
- {datum: kon_koff_ratio, from_datum: kon_koff_ratio, evidence: "Table S1's '10*koff (22)' is Bangasser and Odde's rule 'k = kon = 10koff' (p. 9), the same ratio kon/koff = 10"}
