id: nucleation_s8
name: module nucleation rate, fourth power of the free G-actin fraction (Eqn. S8)
role: model
stated: {page: 15, printed_page: "S2", quote: "the available G-actin pool raised to the fourth power", where: "Eqn. S8"}
equation: "knuc = knuc,0 (AG / Atotal)^4"
inputs:
  knuc0:  {quantity: nucleation_rate_max, unit: 1/s}
  AG:     {quantity: g_actin_pool_length, unit: um}
  Atotal: {quantity: total_actin_length, unit: um}
outputs:
  knuc: {quantity: nucleation_rate, unit: 1/s}
settings: {}
stochastic: false
