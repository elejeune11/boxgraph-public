id: fold_reduction
name: clutch number reduced n-fold from its base value
role: model
stated: {page: 7, printed_page: "1715", quote: "at nclutch ¼ 75 or a 10-fold reduction", where: text}
equation: "nclutch,reduced = nclutch / fold"
from_words: true
inputs:
  nclutch: {quantity: n_clutches_cell, unit: dimensionless}
  fold:    {quantity: fold_reduction, unit: dimensionless}
outputs:
  nclutch_reduced: {quantity: n_clutches_cell, unit: dimensionless}
settings: {}
stochastic: false
