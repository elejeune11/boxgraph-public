id: drag_coefficient_s9
name: hydrodynamic drag coefficient of a cell in a square channel (Eqn. S9, after Li and Sun)
role: model
stated: {page: 20, printed_page: "S7", quote: "estimate the hydrodynamic drag coefficient (dg) for a cell within a square channel", where: "Eqn. S9"}
equation: "dg = 12 μ L / b^2"
inputs:
  mu: {quantity: medium_viscosity, unit: Pa*s}
  L:  {quantity: channel_length, unit: mm}
  b:  {quantity: channel_square_side, unit: um}
outputs:
  dg: {quantity: drag_coefficient, unit: pN*s/um^3}
settings: {}
stochastic: false
