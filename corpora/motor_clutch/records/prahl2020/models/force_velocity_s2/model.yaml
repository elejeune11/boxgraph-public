id: force_velocity_s2
name: linear force-velocity law of the module motors (Eqn. S2)
role: model
stated: {page: 14, printed_page: "S1", quote: "F-actin flow slows from the myosin II motor unloaded velocity", where: "Eqn. S2"}
equation: "vflow = vmotor (1 - κsub Δxsub,j / (Fmotor nmotor,j))"
described_from: chan2008
inputs:
  vmotor:    {quantity: unloaded_motor_velocity, unit: nm/s}
  ksub:      {quantity: substrate_stiffness, unit: pN/nm}
  dxsub:     {quantity: substrate_spring_extension, unit: nm}
  Fmotor:    {quantity: motor_stall_force, unit: pN}
  nmotor_j:  {quantity: n_motors_module, unit: dimensionless}
outputs:
  vflow: {quantity: retrograde_flow_rate, unit: nm/s}
settings: {}
stochastic: false
