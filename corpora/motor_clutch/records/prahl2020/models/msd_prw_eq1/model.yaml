id: msd_prw_eq1
name: persistent random walk MSD (Eq. 1)
role: fit
stated: {page: 6, printed_page: "1714", quote: "The PRW model relates MSD", where: "Eq. 1"}
equation: "<r^2(t)> = n S^2 P^2 (e^(-t/P) + t/P - 1)"
inputs:
  n: {quantity: spatial_dimensions, unit: dimensionless}
  S: {quantity: prw_speed, unit: um/min}
  P: {quantity: persistence_time, unit: min}
  t: {quantity: time_lag, unit: min}
outputs:
  msd: {quantity: mean_squared_displacement, unit: um^2}
settings: {}
stochastic: false
