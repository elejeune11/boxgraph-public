id: hist_mean_eb1
name: binned mean of the frequency histogram of EB1 growth speeds
role: processing
stated: {page: 28, printed_page: "S15", quote: "Histogram of microtubule growth speeds measured in U251 cells expressing", where: "Fig. S5B"}
equation: "mean = sum_k x_k f_k / sum_k f_k (x_k bin centres, f_k frequencies)"
from_words: true
inputs:
  h: {quantity: fraction_in_bin, unit: dimensionless, curve: {quantity: microtubule_growth_speed, unit: nm/s}}
outputs:
  mean: {quantity: microtubule_growth_speed, unit: nm/s}
settings: {}
stochastic: false
