id: drag_force_s10
name: hydrodynamic drag force on a cell moving through a channel (Eqn. S10)
role: model
stated: {page: 21, printed_page: "S8", quote: "Hydrodynamic force can be calculated for a cell moving with velocity", where: "Eqn. S10"}
equation: "Fdrag = -dg A vcell"
inputs:
  dg:    {quantity: drag_coefficient, unit: pN*s/um^3}
  A:     {quantity: channel_cross_section, unit: um^2}
  vcell: {quantity: drift_velocity, unit: um/s}
outputs:
  Fdrag: {quantity: drag_force, unit: pN}
settings: {}
stochastic: false
