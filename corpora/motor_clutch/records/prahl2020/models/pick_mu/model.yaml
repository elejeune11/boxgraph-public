id: pick_mu
name: the motility coefficient of one condition of a figure (x = condition_index)
role: processing
stated: {none: "a selection made by this record, not a model of the paper: it picks the base condition out of a figure so that it can be set beside the value printed in the text"}
equation: "y = c(at)"
inputs:
  c: {quantity: motility_coefficient, unit: "um^2/min", curve: {quantity: condition_index, unit: dimensionless}}
outputs:
  y: {quantity: motility_coefficient, unit: "um^2/min"}
settings: {at: 1}
stochastic: false
