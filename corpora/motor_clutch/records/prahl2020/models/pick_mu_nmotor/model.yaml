id: pick_mu_nmotor
name: the motility coefficient of one condition of a figure (x = n_motors_cell)
role: processing
stated: {none: "a selection made by this record, not a model of the paper: it picks the base condition out of a figure so that it can be set beside the value printed in the text"}
equation: "y = c(at)"
inputs:
  c: {quantity: motility_coefficient, unit: "um^2/min", curve: {quantity: n_motors_cell, unit: dimensionless}}
outputs:
  y: {quantity: motility_coefficient, unit: "um^2/min"}
settings: {at: 1}
stochastic: false
