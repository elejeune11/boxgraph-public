id: hist_stats_v
name: number of entries and binned mean of a histogram of velocities
role: processing
stated: {"page": 6, "printed_page": "1714", "quote": "The histogram of the velocities obtained for", "where": "Fig. 3B, D"}
equation: "n = sum_k N_k; mean = sum_k x_k N_k / n (x_k bin centres, N_k counts)"
from_words: true
inputs:
  h: {quantity: n_in_bin, unit: dimensionless, curve: {quantity: drift_velocity, unit: "um/min"}}
outputs:
  n: {quantity: sample_count, unit: dimensionless}
  mean: {quantity: drift_velocity, unit: "um/min"}
settings: {}
stochastic: false
