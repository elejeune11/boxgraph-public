id: hist_stats_logP
name: number of entries and binned mean of a histogram of log10 persistence times
role: processing
stated: {"page": 27, "printed_page": "S14", "quote": "Persistence time (log10-transformed) for the data in panel", "where": "Fig. S4B"}
equation: "n = sum_k N_k; mean = sum_k x_k N_k / n (x_k bin centres, N_k counts)"
from_words: true
inputs:
  h: {quantity: n_in_bin, unit: dimensionless, curve: {quantity: log10_persistence_time, unit: "dimensionless"}}
outputs:
  n: {quantity: sample_count, unit: dimensionless}
  mean: {quantity: persistence_time, unit: "min", scale: log10}
settings: {}
stochastic: false
