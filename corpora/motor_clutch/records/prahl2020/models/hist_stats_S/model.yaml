id: hist_stats_S
name: number of entries and binned mean of a histogram of PRW speeds
role: processing
stated: {"page": 27, "printed_page": "S14", "quote": "Speeds obtained from fits to a persistent random walk model", "where": "Fig. S4A"}
equation: "n = sum_k N_k; mean = sum_k x_k N_k / n (x_k bin centres, N_k counts)"
from_words: true
inputs:
  h: {quantity: n_in_bin, unit: dimensionless, curve: {quantity: prw_speed, unit: "um/min"}}
outputs:
  n: {quantity: sample_count, unit: dimensionless}
  mean: {quantity: prw_speed, unit: "um/min"}
settings: {}
stochastic: false
