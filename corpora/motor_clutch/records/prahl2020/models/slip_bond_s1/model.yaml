id: slip_bond_s1
name: slip-bond off-rate of a clutch under tension (Eqn. S1)
role: model
stated: {page: 14, printed_page: "S1", quote: "scales with force by a single exponential (6), also known as a slip bond", where: "Eqn. S1"}
equation: "koff,i = koff exp(Fclutch,i / Fbond)"
described_from: bell1978
inputs:
  koff:    {quantity: clutch_off_rate_unloaded, unit: 1/s}
  Fclutch: {quantity: clutch_tension, unit: pN}
  Fbond:   {quantity: bond_rupture_force, unit: pN}
outputs:
  koff_i: {quantity: clutch_off_rate_loaded, unit: 1/s}
settings: {}
stochastic: false
