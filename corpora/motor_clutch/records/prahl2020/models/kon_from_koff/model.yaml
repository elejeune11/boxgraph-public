id: kon_from_koff
name: clutch on-rate as a multiple of the unloaded off-rate (Table S1)
role: model
stated: {page: 22, printed_page: "S9", quote: "Pseudo-first order association rate 1 s-1 Theoretical estimate, 10*koff (22)", where: "Table S1, Source column"}
equation: "kon = 10*koff"
inputs:
  r:    {quantity: on_off_rate_ratio, unit: dimensionless}
  koff: {quantity: clutch_off_rate_unloaded, unit: 1/s}
outputs:
  kon: {quantity: clutch_on_rate, unit: 1/s}
settings: {}
stochastic: false
