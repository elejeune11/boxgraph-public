id: polymerization_s3
name: actin polymerization speed scaled by the free G-actin fraction (Eqn. S3)
role: model
stated: {page: 14, printed_page: "S1", quote: "is defined by a maximum actin polymerization velocity", where: "Eqn. S3 (p. S2)"}
equation: "vactin = vactin,max (AG / Atotal)"
inputs:
  vactin_max: {quantity: actin_polymerization_velocity_max, unit: nm/s}
  AG:         {quantity: g_actin_pool_length, unit: um}
  Atotal:     {quantity: total_actin_length, unit: um}
outputs:
  vactin: {quantity: actin_polymerization_velocity, unit: nm/s}
settings: {}
stochastic: false
