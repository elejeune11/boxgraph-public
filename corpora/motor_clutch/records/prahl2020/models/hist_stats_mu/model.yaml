id: hist_stats_mu
name: number of entries and binned mean of a histogram of motility coefficients
role: processing
stated: {page: 6, printed_page: "1714", quote: "The histogram of the motility coefficients obtained for", where: "Fig. 3A, C"}
equation: "n = sum_k N_k; mean = sum_k x_k N_k / n (x_k bin centres, N_k counts)"
from_words: true
inputs:
  h: {quantity: n_in_bin, unit: dimensionless, curve: {quantity: motility_coefficient, unit: um^2/min}}
outputs:
  n: {quantity: sample_count, unit: dimensionless}
  mean: {quantity: motility_coefficient, unit: um^2/min}
settings: {}
stochastic: false
