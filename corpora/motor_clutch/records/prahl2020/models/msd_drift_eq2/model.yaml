id: msd_drift_eq2
name: diffusion-drift MSD (Eq. 2)
role: fit
stated: {page: 6, printed_page: "1714", quote: "Equation 2 relates", where: "Eq. 2"}
equation: "<r^2(t)> = 2 n mu t + v^2 t^2"
inputs:
  n:  {quantity: spatial_dimensions, unit: dimensionless}
  mu: {quantity: motility_coefficient, unit: um^2/min}
  v:  {quantity: drift_velocity, unit: um/min}
  t:  {quantity: time_lag, unit: min}
outputs:
  msd: {quantity: mean_squared_displacement, unit: um^2}
settings: {}
stochastic: false
