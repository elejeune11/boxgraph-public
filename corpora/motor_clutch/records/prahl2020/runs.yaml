- {id: run_pick_v_fig4b, model: pick_v_nclutch, inputs: {c: fig4b_v_nclutch}, settings: {at: 750}, outputs: {y: v_base_fig4b}}
- {id: run_pick_mu_fig5a, model: pick_mu_nmotor, inputs: {c: fig5a_mu_nmotor}, settings: {at: 1000}, outputs: {y: mu_base_fig5a}}
- {id: run_pick_v_fig5b, model: pick_v_nmotor, inputs: {c: fig5b_v_nmotor}, settings: {at: 1000}, outputs: {y: v_base_fig5b}}
- {id: run_pick_mu_fig6c, model: pick_mu, inputs: {c: fig6c_mu_actin_sim}, settings: {at: 1}, outputs: {y: mu_base_fig6c}}
- {id: run_pick_v_fig6d, model: pick_v, inputs: {c: fig6d_v_actin_sim}, settings: {at: 1}, outputs: {y: v_base_fig6d}}
- {id: run_pick_mu_fig7c, model: pick_mu, inputs: {c: fig7c_mu_knuc_sim}, settings: {at: 1}, outputs: {y: mu_base_fig7c}}
- {id: run_pick_v_fig7d, model: pick_v, inputs: {c: fig7d_v_knuc_sim}, settings: {at: 1}, outputs: {y: v_base_fig7d}}
- {id: run_pick_mu_figs1a, model: pick_mu, inputs: {c: figs1a_mu_psi}, settings: {at: 1}, outputs: {y: mu_base_figs1a}}
- {id: run_pick_v_figs1b, model: pick_v, inputs: {c: figs1b_v_psi}, settings: {at: 1}, outputs: {y: v_base_figs1b}}
- {id: run_pick_mu_figs3a, model: pick_mu, inputs: {c: figs3a_mu_ksub}, settings: {at: 1}, outputs: {y: mu_base_figs3a}}
- {id: run_pick_v_figs3b, model: pick_v, inputs: {c: figs3b_v_ksub}, settings: {at: 1}, outputs: {y: v_base_figs3b}}

# ---- figure pass: Eq. 2 with the mean fitted parameters against the mean MSD curves of Fig. 2G ----
- id: run_eq2_mean_exp
  model: msd_drift_eq2
  inputs: {n: n_dim_added, mu: mu_exp, v: v_exp}
  sweep: {t: fig2g_exp}
  outputs: {msd: msd_eq2_exp_pred}
  note: "Eq. 2 evaluated with the mean mu and mean v of the 403 cells; the mean of v^2 t^2 over cells exceeds (mean v)^2 t^2 by var(v) t^2, so this is an approximation of the mean MSD"
- id: run_eq2_mean_sim
  model: msd_drift_eq2
  inputs: {n: n_dim_added, mu: mu_sim, v: v_sim}
  sweep: {t: fig2g_psi09}
  outputs: {msd: msd_eq2_sim_pred}
  note: "the same with the mean mu and v of the 60 simulated trajectories (psi_pol = 0.9)"
