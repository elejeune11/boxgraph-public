  about: [chain_eqs1_8, threshold_strain_eq10, cell_stiffness_eq11, cell_damping_eq12, binding_prob_eq13, binding_prob_eq13_shifted, substrate_stiffness_eq14, box_median_ratio, stack_speed_ratio, stack_traction_ratio, q_chain_not_runnable]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    prahl2020, and this paper does not cite it (its motor-clutch citations are refs 48 and 58).
    prahl2020 measures single U251 glioma cells migrating in 1D PDMS microchannels: drift velocity and
    motility coefficient (v_exp, mu_exp and the drug and clutch series of Figs. 3-7), the MSD curve
    (Fig. 2G), PRW speed and persistence histograms (Fig. S4), EB1 microtubule growth speeds (Fig. S5B)
    and cell length and nucleus position (Fig. S5C-D). The one model here with a migration output,
    chain_eqs1_8, is not runnable (q_chain_not_runnable), and its outputs (rest time,
    connected/disconnected leading-edge speed and traction ratios) are ratios between ligand
    connectivities of a monolayer chain on collagen, a condition no prahl2020 measurement has; it has
    no confinement, channel or drug input. The closed forms (Eqs 10-14) give node profiles along the
    chain (division strain, cell stiffness and damping, ligand binding probability, substrate spring
    stiffness), none of which prahl2020 measures. The processing models (box_median_ratio,
    stack_speed_ratio, stack_traction_ratio) reduce this paper's own box plots and bars to AF/RF and
    connected/disconnected ratios; prahl2020 has neither condition, and processing another paper's
    data is not a model test. For the other direction see prahl2020/q_xval_bagchi2025_none.
  citation: {page: 12, quote: "we developed a novel motor-clutch model in which the cell monolayer is treated", where: text}
