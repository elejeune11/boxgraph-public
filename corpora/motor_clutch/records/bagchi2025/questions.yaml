# ==== cross-record validation with bangasser2013 (2026-11-21): none added =======================
- id: q_xval_bangasser2013_none
  kind: unstated_model
  about: [chain_eqs1_8, threshold_strain_eq10, cell_stiffness_eq11, cell_damping_eq12, binding_prob_eq13, substrate_stiffness_eq14, q_chain_not_runnable]
  text: >-
    (Cross-record validation.) No model of this record is validated against bangasser2013's
    measurements. This paper does not cite bangasser2013; it calls its chain "a novel motor-clutch
    model" with clutch-like bonds after ref. 58 (p. 12) and cites Chan & Odde (ref. 48) for force
    transmission, not for parameters. bangasser2013's measured data are re-plotted from other works:
    normalized migration and normalized traction of several cell types against substrate Young's
    modulus (Fig. 1A-B), chick neuron retrograde flow against stiffness (Fig. S1B, from chan2008) and
    integrin-fibronectin bond lifetimes against force (Fig. 7C, from kong2009). The one model here
    with a motor-clutch shape, chain_eqs1_8 (outputs: rest time, connected/disconnected speed and
    traction ratios), is not runnable (q_chain_not_runnable), and its outputs are ratios between
    ligand connectivities, a condition none of those measurements has. The closed forms (Eqs 10-14)
    give node profiles of division strain, cell stiffness and damping, binding probability and
    substrate spring stiffness along the chain, none of which bangasser2013 measures. For the other
    direction see bangasser2013/q_xval_bagchi2025_none.
  citation: {page: 12, quote: "we developed a novel motor-clutch model in which the cell monolayer is treated", where: text}

# ==== cross-record validation with bangasser2017 (2026-11-21): none added ==========================
- id: q_xval_bangasser2017_none
  kind: unstated_model
  about: [chain_eqs1_8, threshold_strain_eq10, cell_stiffness_eq11, cell_damping_eq12, binding_prob_eq13, binding_prob_eq13_shifted, substrate_stiffness_eq14, box_median_ratio, stack_speed_ratio, stack_traction_ratio, q_chain_not_runnable]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    bangasser2017, and this paper does not cite it (its motor-clutch citations are refs 48 and 58).
    bangasser2017 measures single U251 glioma cells and ECFNs on polyacrylamide gels of graded Young's
    modulus: random motility coefficient, cell area, aspect ratio, actin retrograde flow, traction strain
    energy and MSD curves (Figs 2-4, Supplementary Figs 2E, 4C-I), with and without blebbistatin and
    cyclo(RGDfV). The one model here with a motor-clutch shape, chain_eqs1_8, is not runnable
    (q_chain_not_runnable), and its outputs (rest time, connected/disconnected speed and traction
    ratios) are ratios between ligand connectivities of a monolayer on collagen, a condition none of
    those measurements has; it has no substrate Young's modulus input. The closed forms (Eqs 10-14) give
    node profiles along the chain, none of which bangasser2017 measures. The processing models
    (box_median_ratio, stack_speed_ratio, stack_traction_ratio) give AF/RF and connected/disconnected
    ratios from this paper's own box plots and two-colour bars; bangasser2017 has neither condition, and
    processing another paper's data is not a model test. For the other direction see
    bangasser2017/q_xval_bagchi2025_none.
  citation: {page: 12, quote: "we developed a novel motor-clutch model in which the cell monolayer is treated", where: text}
# cross-record validation against chan2008 (2026-11-21): none added
- id: q_xval_chan2008_none
  kind: unstated_model
  about: [chain_eqs1_8, threshold_strain_eq10, cell_stiffness_eq11, cell_damping_eq12, binding_prob_eq13, binding_prob_eq13_shifted, substrate_stiffness_eq14, box_median_ratio, stack_speed_ratio, stack_traction_ratio]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of chan2008,
    although this paper cites it (ref. 48). chan2008 measures embryonic chick forebrain neuron filopodia on
    polyacrylamide gels of graded modulus: F-actin retrograde flow, peak filopodial force, contact-bead
    distances, flow and displacement histograms, failure frequency and step counts. The one model here with
    a motor-clutch shape, chain_eqs1_8, is not runnable (q_chain_not_runnable), and its outputs (rest time,
    connected/disconnected speed and traction ratios) are ratios between ligand connectivities of a
    monolayer on collagen, a condition none of those measurements has; it has no substrate-modulus input.
    The closed forms (Eqs 10-14) give node profiles along the chain (division strain, cell stiffness and
    damping, ligand binding probability, substrate spring stiffness), none of which chan2008 measures. The
    processing models (box_median_ratio, stack_speed_ratio, stack_traction_ratio) reduce this paper's own
    box plots and bars; chan2008 has neither AF/RF nor connected/disconnected conditions, and processing
    another paper's data is not a model test. This paper cites chan2008 only for the relay of force by
    myosin on actin bundles (p. 8, and again p. 30), not for a model, a parameter or a data set it
    compares with. For the other direction see chan2008/q_xval_bagchi2025_none.
  citation: {page: 8, quote: "Since relay of force occurs via myosin net", where: text}
# cross-record validation against prahl2020 (2026-11-21): none added
