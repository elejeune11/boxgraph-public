id: stack_traction_ratio
name: disconnected-over-connected traction ratio from a two-colour traction bar (Fig 9l, S4i Fig)
role: processing
from_words: true
stated: {page: 19, quote: "decrease (*2.42 times) in traction forces", where: "text on Fig 9l"}
equation: "ratio = T_disconnected / T_connected, with the bar read two ways: stacked (T_disc = top of blue - top of red) or overlaid (T_disc = top of blue)"
inputs:
  T: {quantity: traction_stress, unit: Pa, curve: {quantity: stack_segment_index, unit: dimensionless},
      description: "x = 1 the top of the red (Connected Ligand) segment, x = 2 the top of the blue (Disconnected Ligand) segment above it"}
outputs:
  ratio_stacked: {quantity: traction_ratio_disc_conn, unit: dimensionless}
  ratio_overlaid: {quantity: traction_ratio_disc_conn, unit: dimensionless}
settings: {}
stochastic: false
