id: threshold_strain_eq10
name: spatial profile of the threshold division strain (Eq 10)
role: model
stated: {page: 29, quote: "we implement a spatially varying threshold division strain", where: "Eq 10"}
equation: "eps_c,th(x_c) = alpha_eps + (gamma_eps) * (delta_eps - 1/(sigma_eps sqrt(2 pi)) e^(-1/2 ((x_c - mu_eps)/sigma_eps)^2))"
inputs:
  alpha: {quantity: threshold_division_strain, unit: dimensionless, description: "alpha_epsilon"}
  gamma: {quantity: eps_profile_gain, unit: dimensionless, description: "gamma_epsilon"}
  delta: {quantity: profile_shift, unit: dimensionless, description: "delta_epsilon"}
  sigma: {quantity: profile_width, unit: dimensionless, description: "sigma_epsilon, in nodes"}
  mu: {quantity: cell_node_index, unit: dimensionless, description: "mu_epsilon, the centre node (not stated)"}
  x: {quantity: cell_node_index, unit: dimensionless, description: "x_c, the node"}
outputs:
  eps_th: {quantity: threshold_division_strain, unit: dimensionless}
settings: {}
stochastic: false
