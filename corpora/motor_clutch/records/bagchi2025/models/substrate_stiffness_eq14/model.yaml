role: model
stated: {page: 32, quote: "we incorporate a linear spatial gradient in substrate spring stiffness", where: "Eq 14"}
equation: "k_s(x_s) = k_min + ((k_max - k_min)/x_max)(x_s)"
inputs:
  kmin: {quantity: substrate_spring_stiffness, unit: nN/um}
  kmax: {quantity: substrate_spring_stiffness, unit: nN/um}
  xmax: {quantity: substrate_node_index, unit: dimensionless, description: "x_max (not stated)"}
  xs: {quantity: substrate_node_index, unit: dimensionless, description: "x_s, the node"}
outputs:
  ks: {quantity: substrate_spring_stiffness, unit: nN/um}
settings: {}
stochastic: false
