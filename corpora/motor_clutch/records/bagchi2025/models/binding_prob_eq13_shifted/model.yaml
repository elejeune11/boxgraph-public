id: binding_prob_eq13_shifted
name: ligand binding probability with 1.5 added outside the inverse tangent (Eq 13, corrected variant)
role: model
stated: {page: 31, quote: "Spatial variation of ligand binding probability", where: "Eq 13"}
equation: "rho_l(x_c) = (tan^-1(alpha(-x_c)) + 1.5)/3"
variant_of: binding_prob_eq13
corrections:
  - equation: Eq 13
    change: "(tan^-1(alpha(-x_c)) + 1.5)/3 instead of the printed tan^-1(alpha(-x_c) + 1.5)/3: the 1.5 is added to the inverse tangent, not to its argument"
    evidence: "Fig 10k (p. 20) shows every curve passing through 0.5 at the same central node and staying between 0 and 1; the printed form gives atan(1.5)/3 = 0.33 at x_c = 0 and negative probabilities for alpha x_c > 1.5 (e.g. -0.49 at the right end for alpha = 0.08), while (atan + 1.5)/3 is 0.5 at x_c = 0 and lies within (-0.02, 1.02)"
inputs:
  alpha: {quantity: haptotaxis_gradient, unit: dimensionless, description: "alpha"}
  n: {quantity: ligand_node_index, unit: dimensionless, description: "the node, as on the x axis of Fig 10k"}
  n0: {quantity: ligand_node_index, unit: dimensionless, description: "the node where x_c = 0 (not stated): x_c = n - n0"}
outputs:
  rho: {quantity: binding_probability, unit: dimensionless}
settings: {}
stochastic: false
