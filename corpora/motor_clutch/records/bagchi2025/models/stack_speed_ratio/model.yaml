id: stack_speed_ratio
name: connected-over-disconnected speed ratio from a two-colour velocity bar (Fig 9l, S4i Fig)
role: processing
from_words: true
stated: {page: 19, quote: "predicts an increase in velocity (*1.38 times)", where: "text on Fig 9l"}
equation: "ratio = v_connected / v_disconnected, with the bar read two ways: stacked (v_disc = top of blue - top of red) or overlaid (v_disc = top of blue)"
inputs:
  v: {quantity: leading_edge_speed, unit: um/hr, curve: {quantity: stack_segment_index, unit: dimensionless},
      description: "x = 1 the top of the red (Connected Ligand) segment, x = 2 the top of the blue (Disconnected Ligand) segment above it"}
outputs:
  ratio_stacked: {quantity: speed_ratio_conn_disc, unit: dimensionless}
  ratio_overlaid: {quantity: speed_ratio_conn_disc, unit: dimensionless}
settings: {}
stochastic: false
