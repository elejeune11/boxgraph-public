id: switch_speed_by_condition
name: maximal traction occurs at the same threshold F-actin speed in every perturbation (stated in words)
role: model
stated: {page: 5, printed_page: "1003", quote: "maximal stresses were always associated with a similar", where: text}
equation: "v(peak traction; condition) = Vc for every condition (control, blebbistatin, CA-Rac, CA-Rho)"
from_words: true
built_from: [switch_speed_claim]
inputs:
  v_c: {quantity: switch_speed, unit: nm/s, description: "the threshold F-actin speed of the biphasic switch"}
  condition: {quantity: condition_index, unit: dimensionless, description: "1 CONTROL, 2 BLEB, 3 CA-RAC, 4 CA-RHO; the claim says the speed does not depend on it"}
outputs:
  v_peak: {quantity: actin_speed_at_peak_traction, unit: nm/s, description: "the F-actin speed at which traction stress is maximal in that condition"}
settings: {}
stochastic: false
