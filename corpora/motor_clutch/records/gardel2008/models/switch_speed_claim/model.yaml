id: switch_speed_claim
name: maximal traction occurs at one threshold F-actin speed, whatever the perturbation (stated in words)
role: model
stated: {page: 1, printed_page: "999", quote: "determined by a threshold F-actin speed of 8–10 nm/s", where: Abstract}
equation: "v(peak traction) = Vc, with Vc = 8-10 nm/s independent of FA protein density, age, stress magnitude, assembly/disassembly status, or subcellular position"
from_words: true
inputs:
  v_c: {quantity: switch_speed, unit: nm/s, description: "the threshold F-actin speed of the biphasic switch"}
outputs:
  v_peak: {quantity: actin_speed_at_peak_traction, unit: nm/s, description: "the F-actin speed at which traction stress is maximal"}
settings: {}
stochastic: false
