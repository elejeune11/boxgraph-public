  note: "printed '2,800'; 7.5% acrylamide / 0.1% bis-acrylamide; control cells and CA-Rac"
- id: G_blebbistatin
  quantity: gel_shear_modulus
  unit: Pa
  origin: reported
  printed: "~1500"
  citation: {page: 6, printed_page: "1004", quote: "with G’ of ⵑ1,500 Pa, for cells treated", where: Methods}
  note: "printed 'ⵑ1,500'; 7.5%/0.05% gel; cells treated with 50 μM blebbistatin"
- id: G_carho
  quantity: gel_shear_modulus
  unit: Pa
  origin: reported
  printed: "~5400"
  citation: {page: 6, printed_page: "1004", quote: "a 7.5%/0.2% gel, with G’ of ⵑ5,400 Pa", where: Methods}
  note: "printed 'ⵑ5,400'; cells expressing CA-Rho"
- id: substrate_modulus_range
  quantity: substrate_modulus
  unit: kPa
  origin: reported
  printed: "1.5 to 6"
  citation: {page: 2, printed_page: "1000", quote: "10–20-μm-thick compliant (1.5–6 kPa) fibronectin", where: text}

# --- correlation coefficients (Fig. S3 E, F) ---
- id: r_high_speed_typical
  quantity: corr_stress_speed_high
  unit: dimensionless
  origin: measured
  printed: "-0.35 to -0.56"
  citation: {page: 10, printed_page: "S3", quote: "typical values of rAT range from 20.35 to 20.56", where: "Fig. S3 legend"}
  note: "the page image shows minus signs ('−0.35 to −0.56'); the OCR renders them as '2'"
- id: r_low_speed_typical
  quantity: corr_stress_speed_low
  unit: dimensionless
  origin: measured
  printed: "0.34 to 0.5"
  citation: {page: 10, printed_page: "S3", quote: "typically range from 0.34 to 0.5", where: "Fig. S3 legend"}

