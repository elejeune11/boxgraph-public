# Values exactly as printed. Page numbers are PDF pages (text/page-NNN.txt).

# --- the threshold speed of the biphasic switch and the speed at peak traction ---
- id: v_switch_threshold
  quantity: switch_speed
  unit: nm/s
  origin: estimated
  printed: "8 to 10"
  citation: {page: 1, printed_page: "999", quote: "determined by a threshold F-actin speed of 8–10 nm/s", where: Abstract}
  note: "printed '8–10 nm/s'; the authors' summary of their measurements, independent of perturbation"
- id: v_peak_stress_range
  quantity: actin_speed_at_peak_traction
  unit: nm/s
  origin: measured
  printed: "8 to 12"
  citation: {page: 3, printed_page: "1001", quote: "intermediate F-actin speeds (8–12 nm/s) and lower stresses", where: text}
  note: "speeds at which the highest stresses are exerted, all grid points throughout the cell front (Fig. 3 A), control cell"
- id: v_peak_gaussian_mean
  quantity: actin_speed_at_peak_traction
  unit: nm/s
  origin: measured
  printed: "~8"
  citation: {page: 3, printed_page: "1001", quote: "stresses was Gaussian distributed around a mean of", where: text}
  note: "printed 'ⵑ8 nm/s (Fig. 1 G)' on the next line: mean of the F-actin speeds at the highest (>95%) stresses"
- id: v_ts_mean
  quantity: actin_speed_at_peak_traction
  unit: nm/s
  origin: measured
  printed: "12.7 ± 3"
  citation: {page: 4, printed_page: "1002", quote: "Mean of v(ts) = 12.7 ± 3 nm/s", where: "Fig. 3 E caption"}
  note: "F-actin speed at ts, the time when the stress of a single FA exceeds 75% of its maximum (Fig. 3 D caption); 26 FAs in four cells"
- id: ts_mean
  quantity: fa_age_at_peak_traction
  unit: min
  origin: measured
  printed: "3 ± 2"
  citation: {page: 4, printed_page: "1002", quote: "Mean of ts = 3 ± 2 min", where: "Fig. 3 E caption"}
- id: sigma_ts_mean
  quantity: traction_stress_at_peak
  unit: Pa
  origin: measured
  printed: "65 ± 28"
  citation: {page: 4, printed_page: "1002", quote: "Mean of ␴(ts) = 65 ±", where: "Fig. 3 F caption"}
  note: "printed 'Mean of σ(ts) = 65 ± 28 Pa' across a line break"
- id: fa_lifetime_cited
  quantity: fa_lifetime
  unit: min
  origin: reported
  printed: "~17"
  citation: {page: 4, printed_page: "1002", quote: "50% of the ⵑ17-min FA lifetime (Gupton", where: text}
  from_source: ref-gupton2006

# --- F-actin speeds across the cell front ---
- id: v_range_cell_front
  quantity: actin_flow_speed
  unit: nm/s
  origin: measured
  printed: "0 to 30"
  citation: {page: 2, printed_page: "1000", quote: "Ji and Danuser, 2005). F-actin speeds ranged from 0", where: text}
- id: v_distal_lamellipodium
  quantity: actin_flow_speed
  unit: nm/s
  origin: measured
  printed: "~25"
  citation: {page: 2, printed_page: "1000", quote: "rapid retrograde flow (ⵑ25 nm/s) in the distal", where: text}
- id: v_lamella
  quantity: actin_flow_speed
  unit: nm/s
  origin: measured
  printed: "~2"
  citation: {page: 2, printed_page: "1000", quote: "slowed to ⵑ2 nm/s in the lamella", where: text}

# --- substrates for traction force microscopy ---
- id: G_control_carac
  quantity: gel_shear_modulus
  unit: Pa
