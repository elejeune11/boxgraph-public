# Calibrated figure readings (first pass with rendering, 2026-11-01). Every reading is made by
# the record's own code (figures/*.py) on the crop the build renders at `dpi`.
# Conditions on categorical axes are numbered: 1 CONTROL, 2 BLEB, 3 CA-RAC (RAC), 4 CA-RHO (RHO).

