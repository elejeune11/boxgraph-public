- id: run_switch_claim
  model: switch_speed_claim
  inputs: {v_c: v_switch_threshold}
  outputs: {v_peak: v_peak_from_threshold}
  note: "the printed threshold is a range (8-10 nm/s); the run takes its midpoint, 9 nm/s (q_threshold_midpoint)"
- id: run_switch_by_condition
  model: switch_speed_by_condition
  inputs: {v_c: v_switch_threshold}
  sweep: {condition: fig4d_speed_data}
  outputs: {v_peak: v_peak_by_condition_pred}
  note: "the threshold of the Abstract (midpoint of 8-10 nm/s) at each condition of Fig. 4 D"
