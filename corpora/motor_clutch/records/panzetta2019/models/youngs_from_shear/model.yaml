id: youngs_from_shear
name: Young's modulus of an isotropic linear elastic solid from its shear modulus
role: processing
reconstructed: >-
  The paper gives PU's Young's modulus as 0.6 MPa (Fig. S1 right, p. 8) but measured PU only in shear
  (the y = 185.07x of Fig. S1, right) and does not say how it obtained the Young's modulus; the
  isotropic relation E = 2(1 + nu) G with an added Poisson's ratio stands in for that step.
stated: {page: 8, quote: "Young’s modulus of PU is about 0.6 MPa", where: "Methods; Fig. S1 (right) label"}
equation: "E = 2 (1 + nu) G"
inputs:
  G:  {quantity: substrate_shear_modulus, unit: kPa}
  nu: {quantity: poisson_ratio, unit: dimensionless}
outputs:
  E: {quantity: substrate_youngs_modulus, unit: MPa}
settings: {}
stochastic: false
