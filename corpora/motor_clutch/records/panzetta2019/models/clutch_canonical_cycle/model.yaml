id: clutch_canonical_cycle
name: canonical clutch-ensemble ODEs with an initial substrate deformation x0, over one load-and-fail cycle (SI Appendix 1)
role: model
stated: {page: 24, quote: "were solved using the MATLAB ODE solver ode15s", where: "SI Appendix 1, Eqs. 3-4, s.1-s.6, 11"}
equation: >-
  dPb/dt = (1 - Pb) kon - Pb <k*off>  [3];  <Fc> = kc(<xc> - xs)  [4];  F0 + nc<Fc> = Fs  [s.1];
  F0 = ks x0  [s.2];  Fs = ks xs  [s.3];  xs = nc kc/(ks + nc kc) <xc> + ks/(ks + nc kc) x0  [s.4];
  vf = vu (1 - (Fs - F0)/(nm Fm)) = vu [1 - ks nc kc/(nm Fm (ks + nc kc)) (<xc> - x0)]  [s.5];
  <k*off> = (1 - Pb) koff + Pb koff (1 - <Fc>/(r Pb Fb))^-r  [11];
  d<xc>/dt = (ks + nc kc)/(ks + Pb nc kc) Pb vu [1 - ks nc kc/(nm Fm (ks + nc kc)) (<xc> - x0)]  [s.6]
inputs:
  nm:   {quantity: n_motors, unit: dimensionless}
  Fm:   {quantity: motor_stall_force, unit: pN}
  vu:   {quantity: unloaded_motor_velocity, unit: nm/s}
  nc:   {quantity: n_clutches, unit: dimensionless}
  kon:  {quantity: clutch_on_rate, unit: 1/s}
  koff: {quantity: clutch_off_rate_unloaded, unit: 1/s}
  Fb:   {quantity: bond_rupture_force, unit: pN}
  kc:   {quantity: clutch_stiffness, unit: pN/nm}
  ks:   {quantity: substrate_stiffness, unit: pN/nm}
  r:    {quantity: gamma_shape_parameter, unit: dimensionless}
  x0:   {quantity: substrate_prestretch, unit: nm}
outputs:
  t_cycle: {quantity: load_fail_cycle_time, unit: s, description: "time at which r Pb Fb - <Fc> falls to g_fail (the abrupt failure)"}
  v_mean:  {quantity: cycle_mean_flow_rate, unit: nm/s, description: "vf averaged over [0, t_cycle] (the reader's reading of 'actin flowrate'; q_flow_definition)"}
settings: {rtol: 1.0e-8, atol: 1.0e-12, g_fail: 1.0e-3, t_max: 1.0e5}
stochastic: false
