- id: q_shift_bound
  kind: unexplained_difference
  about: [figS13r_green_flow, figS13l_flow, rel_two_spring_large_x0_reduces_to_canonical_2ks, rel_two_spring_approximated_by_tangent_stiffness]
  text: >-
    From Eq. 7 the substrate's tangent stiffness lies between ks and 2 ks for any x0 and xs, and at x0 >> l the
    modified model is the canonical model at 2 ks (rel_two_spring_large_x0_reduces_to_canonical_2ks). So at
    inputs shared with the canonical curve, prestrain can lower the optimum stiffness by at most about a factor
    of 2 and cannot change the depth of the minimum at large x0. In Fig. S13 the green minimum (right) lies
    at less than half the canonical optimum (left), and the three minima differ in depth. Either the two
    panels use different inputs (unstated) or they do not follow from Eqs. 3-12 as printed.
  citation: {page: 23, quote: "Blue, purple and green curves relate to increasing values of", where: "Fig. S13"}
- id: q_strain_energy
  kind: overstated_claim
  about: [clutch_two_spring_cycle, rel_two_spring_approximated_by_tangent_stiffness, rel_two_spring_large_x0_reduces_to_canonical_2ks]
  text: >-
    The title claim is that mechanosensing is regulated by strain energy rather than stiffness, and the
    modified model is offered as its basis ("the orthogonal spring is the element able to take memory of
    the strain energy", p. 6). The model has no strain-energy term: x0 enters Eqs. 3-12 only through Fs - F0,
    the substrate's force-displacement curve around x0, whose slope ks (2 - l^3/(l^2 + x0^2)^(3/2)) rises
    with x0. The record tests that the modified model's flow is the canonical model's at that tangent
    stiffness (rel_two_spring_approximated_by_tangent_stiffness, and exactly so at x0 >> l). Within the
    model, then, prestrain acts as a stiffening of the substrate's tangent stiffness (as the paper itself
    says of Fig. 9 on p. 7, "an additional stiffness"); the model does not separate strain energy from that
    stiffness, since both rise together with x0.
  citation: {page: 6, printed_page: "22009", quote: "In this model the orthogonal spring is the ele", where: text}
- id: q_x0_strain
  kind: unstated_input
  about: [x0_blue_added, x0_purple_added, x0_green_added, l_added]
  text: >-
