    clamped force (Fig. 7C, tau_kong_fig7c): no model here outputs a single bond's lifetime; t_cycle
    is the whole ensemble's load-and-fail period, a different quantity despite the shared shape
    (time from force and rate) with bangasser2013/catch_slip_eq9, and Eq. 11's slip off-rate is an
    ensemble mean with an unstated r. (3) Normalized migration (Fig. 1A) and normalized traction
    (Fig. 1B) against modulus: no model here outputs a migration measure or a force. The stress-strain
    fits and youngs_from_shear describe this paper's PDMS and PU only. In the other direction, see
    bangasser2013/q_xval_panzetta2019_none.
  citation: {page: 5, printed_page: "22008", quote: "The model, as extensively explained in other contexts", where: text}

# ==== cross-record validation with elosegui2016 (2026-11-21): none added =========================
- id: q_xval_elosegui2016_none
  kind: unstated_input
  about: [clutch_canonical_cycle, clutch_two_spring_cycle, s1_shear_fit, s1_tensile_fit, youngs_from_shear, 'elosegui2016/fig3e_control_data', 'elosegui2016/fig3e_shrna_data', 'elosegui2016/fig3d_control_data', 'elosegui2016/fig3d_shrna_data']
  text: >-
    (Cross-record validation.) I looked for validations of this record's models against elosegui2016's
    measurements and entered none. This paper cites elosegui2016 (ref. 29) only as a formulation of the
    clutch model ("as extensively explained in other contexts (27, 29)", p. 5; "in agreement with the
    previous formulation of the model (27, 29)", p. 7). It never compares its model with elosegui2016's
    data. The only elosegui2016 measurement a model here could give is the actin retrograde flow of
    control and talin 2 shRNA MEFs against rigidity (Fig. 3e, fig3e_control_data, fig3e_shrna_data), from
    clutch_canonical_cycle at x0 = 0. Three things block it. (1) elosegui2016 indexes that flow by the
    gels' Young's modulus in kPa, but the models here take a substrate spring constant ks in pN/nm.
    elosegui2016 converts a modulus to ksub only through its own added geometry factor and adhesion radius
    (elosegui2016/ksub_factor_added). Entering a ks per gel would mean writing a number the reader
    computed, and a modulus and a spring constant are not one quantity. (2) The inputs here are ref. 42's
    neuron base set (added, q_params_unstated), with Eq. 11's slip-bond mean off-rate. elosegui2016's MEF
    clutch has a catch bond (sum of two exponentials) and different nm, nf and kc, so no MEF parameter set
    fits Eq. 11's inputs (r, Fb) without inventing them. (3) v_mean is a mean over one load-and-fail
    cycle (q_flow_definition), while the Fig. 3e flows are means over cells. No model here outputs a
    force or traction, so Fig. 3d and the other tractions, adhesion lengths, YAP ratios and bond
    lifetimes of elosegui2016 are out of reach. The stress-strain fits and youngs_from_shear describe this
    paper's PDMS and PU only. In the other direction, see elosegui2016/q_xval_panzetta2019_none.
  citation: {page: 7, printed_page: "22010", quote: "with the previous formulation of the model (27, 29)", where: text}
