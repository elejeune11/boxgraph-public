- id: q_params_unstated
  kind: unstated_input
  about: [clutch_two_spring_cycle, clutch_canonical_cycle, nm_added, nc_added, Fm_added, vu_added, kon_added, koff_added, Fb_added, kc_added, r_added, l_added, x0_blue_added, x0_purple_added, x0_green_added, ks_fig9l_added]
  text: >-
    The paper prints no value for any input of its clutch model: not nm, nc, Fm, vu, kon, koff, Fb, kc or
    r, not the rest length l of the orthogonal spring, not the three x0 of Figs. 9 and S13, nor the substrate
    stiffness at which Fig. 9 (left) varies nc. The MATLAB code is not released. Every model curve in the
    record is therefore run on added inputs (ref. 42's base set, with n, l and x0 chosen by the reader), and
    its comparisons with Figs. 9 and S13 test the model's shape at those inputs, not the paper's own runs.
  citation: {page: 6, printed_page: "22009", quote: "for different values of ks, nc, and x0", where: text}
- id: q_flow_definition
  kind: unstated_model
  about: [clutch_two_spring_cycle, clutch_canonical_cycle, figS13l_flow, fig9r_blue_flow]
  text: >-
    Figs. 9 and S13 plot an "actin flowrate" from the ODE solution, but the paper does not say how one flow
    is taken from a time-dependent solution (a mean over a load-and-fail cycle, over a fixed time, or a
    final value). The record takes vf averaged over one cycle, ending at the abrupt failure, as the bangasser2013b
    record does for ref. 42's Fig. 4, whose phrase "optimum stiffness (characterized by the minimum actin
    flow rate)" these figures repeat.
  citation: {page: 8, printed_page: "22011", quote: "The optimum number of clutches (characterized by the minimum", where: "Fig. 9 legend"}
- id: q_initial_state
  kind: choice
  about: [clutch_two_spring_cycle, clutch_canonical_cycle]
  text: >-
    Appendix 1 states the start of the canonical form: xs and <xc> equal (x0) and the clutch force null. The
    initial fraction of bound clutches is not stated; the record starts with Pb = 0, as ref. 42's ODEs do, and
    starts the modified model at xs = <xc> = x0 likewise.
  citation: {page: 24, quote: "At the starting point, when substrate position", where: "SI Appendix 1"}
- id: q_eq13
  kind: possible_error
  about: [clutch_two_spring_cycle]
  text: >-
    Eq. 13, which the text says is Eq. 12 combined with Eqs. 8 and 10, has dxs/dt on both sides: as printed
    it reads dxs/dt = Pb vu [1 - ks/(nm Fm)(2xs - 2x0 + x0 l/sqrt(l^2 + x0^2) - xs l/sqrt(l^2 + xs^2))] /
    (1 - Pb) dxs/dt + Pb vf, which is no explicit ODE (and, read as a quotient of velocities, has the wrong
    dimension). The record does not run Eq. 13; it runs Eqs. 3-12, combining Eq. 12 with Eq. 8 to give
    dxs/dt = Pb vf / (Pb + (dFs/dxs)/(nc kc)). In the limit l -> infinity this is the canonical s.6
    (rel_two_spring_reduces_to_canonical).
  citation: {page: 9, printed_page: "22012", quote: "By using Eqs. 8 and 10, Eq.", where: "Eq. 13"}
- id: q_eq11_ref
  kind: possible_error
  about: [clutch_two_spring_cycle, clutch_canonical_cycle]
  text: >-
    Eq. 11, the mean off-rate (1 - Pb) koff + Pb koff (1 - <Fc>/(r Pb Fb))^-r, is attributed to ref. 39
    (Dupont et al., "Role of YAP/TAZ in mechanotransduction"), which has no clutch model; the expression is
    Eq. 19 of ref. 42 (Bangasser and Odde 2013). The equation itself is entered as printed.
  citation: {page: 9, printed_page: "22012", quote: "The equation used for the average clutch off-rate is the following (39)", where: "Eq. 11"}
