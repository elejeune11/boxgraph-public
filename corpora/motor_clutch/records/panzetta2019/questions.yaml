# ==== cross-record validation with chan2008 (2026-11-21): none added =============================
- id: q_xval_chan2008_none
  kind: unstated_input
  about: [clutch_canonical_cycle, clutch_two_spring_cycle, s1_shear_fit, s1_tensile_fit, youngs_from_shear, 'chan2008/v_fig3c_260', 'chan2008/v_fig3c_57k', 'chan2008/v_stiff_text', 'chan2008/v_fig3d_exp_sem', 'chan2008/T_max_fig']
  text: >-
    (Cross-record validation.) I looked for validations of this record's models against chan2008's
    measurements and entered none. This paper cites chan2008 (ref. 26) only in a list of clutch-model
    works used "to shed light on the basis of the cell mechanosensing mechanism (26-29)" and never
    compares its model with chan2008's data. The only chan2008 measurement a model here could give is
    filopodial retrograde flow (Fig. 3C means, Fig. 3D, the ~110 nm/s of the text, Fig. S8C), from
    clutch_canonical_cycle at x0 = 0. But chan2008 measures that flow against the gels' Young's modulus,
    and the models here take a substrate spring constant ks in pN/nm. Neither paper states ks for those
    gels. Chan's Eq. 13 turns a modulus into ks only through the fitted length Δ = 277 nm, whose place in
    Eq. 13 is itself open (chan2008/q_eq13_delta). Entering ks per gel would mean writing a number the
    reader computed, and a modulus and a spring constant are not one quantity. Even with ks given, the
    run would be fit quality, not a test: the base set here (ref. 42's, added) is Chan's Table S1, whose
    nc and kon were tuned to these flows. Also, v_mean is a mean over one load-and-fail cycle
    (q_flow_definition), whereas Chan's flow is a mean over many filopodia. No model here outputs a
    force, so chan2008's peak filopodial force (T_max) is out of reach, as are its bead distance δ and
    its step, failure and histogram data. The load-and-fail periods of "~10 to 100 s" that t_cycle
    could meet are not recorded as a datum (chan2008/q_cycle_time). The stress-strain fits and
    youngs_from_shear describe this paper's PDMS and PU only. In the other direction, see
    chan2008/q_xval_panzetta2019_none.
  citation: {page: 1, quote: "also used to shed light on the basis of the", where: text}

