    impose substrate strains of 6% and 9% on a 15 mm window. The paper gives no conversion from strain to x0
    or l, and does not say which x0 the curves of Figs. 9 and S13 stand for, so the model cannot be compared
    with the measured strains.
  citation: {page: 6, printed_page: "22009", quote: "represents the deformation applied to the substrate", where: text}
- id: q_isotropy
  kind: reading
  about: [clutch_two_spring_cycle]
  text: >-
    The paper sets the two springs equal ("the same value was chosen for the elastic constants of the 2
    springs", p. 6), so Eqs. 6-8 and 10 use one ks; the record does the same. A different constant for the
    orthogonal spring would scale only its term.
  citation: {page: 6, printed_page: "22009", quote: "then the same value was chosen for the elastic constants", where: text}
# Added by the audit (audit.md).
- id: q_eq_crossrefs
  kind: possible_error
  about: [clutch_two_spring_cycle, clutch_canonical_cycle]
  text: >-
    Three equation cross-references in the model's derivation do not point where the algebra goes. (1) Eq. 10
    is introduced with "Then, Eq. 7 becomes", and s.5 with "the equation 7 becomes" (SI p. 24). What is
    rewritten is the force-velocity relation Eq. 9 (vf = vu(1 - Fs/(nm Fm))) with Fs replaced by Fs - F0,
    not the substrate force Eq. 7. (2) Eq. 8 is said to come from "Combining Eqs. 3-5". It follows from Eqs.
    4, 5, 6 and 7; Eq. 3, the Pb ODE, takes no part. (3) Eq. 9 is called "the Hill equation (42)", but it is
    linear in Fs. None of these changes a model: the record enters Eqs. 8, 10 and s.5 as printed, and they
    agree with Eqs. 4-7 and 9 as the record's algebra checks (model.py comments).
  citation: {page: 9, printed_page: "22012", quote: "of motor clutches. Then, Eq. 7 becomes", where: "text before Eq. 10"}
- id: q_fig9_vs_S13_direction
  kind: reading
  about: [q_fig9_vs_S13, cmp_f9r_vs_s13r_blue, cmp_f9r_vs_s13r_purple, cmp_f9r_vs_s13r_green]
  text: >-
    The auditor disagrees with part of the wording of q_fig9_vs_S13 ("the rise towards stiff substrates is
    slower [in Fig. 9] than in Fig. S13"). Judging by eye from the page images (not a figure reading), the
    Fig. 9 (right) curves reach about 40-60 nm/s at ks = 80-100 pN/nm and about 100 nm/s at 200 pN/nm, while the
    Fig. S13 (right) curves stay below 22 nm/s up to their last point near 90 pN/nm. Fig. S13 looks steeper only
    because its x axis is logarithmic. In flow per unit stiffness, Fig. 9 rises faster, and its values on the stiff
    side are several times those of Fig. S13. Both readings agree that the two figures differ. The
    cmp_f9r_vs_s13r_* comparisons, made from the figure readings, are the measure; this question only flags the wording.
  citation: {page: 23, quote: "Blue, purple and green curves relate to increasing values of", where: "Fig. S13 (right); Fig. 9 (right) p. 8"}
