  kind: unstated_input
  about: [clutch_canonical_cycle, clutch_two_spring_cycle, s1_shear_fit, s1_tensile_fit, youngs_from_shear, 'bangasser2013/v_figS1b_measured', 'bangasser2013/tau_kong_fig7c', 'bangasser2013/migration_fig1a_u87', 'bangasser2013/traction_fig1b_neuron']
  text: >-
    (Cross-record validation.) I looked for validations of this record's models against
    bangasser2013's measurements and entered none. This paper cites bangasser2013 (ref. 27) only as a
    formulation of the canonical clutch model ("as extensively explained in other contexts (27, 29)",
    p. 5; "in agreement with the previous formulation of the model (27, 29)", p. 7) and never sets its
    model against bangasser2013's data. bangasser2013's measured data are all other papers' points
    that it redraws: (1) Chan and Odde's neuron retrograde flows against gel Young's modulus (Fig. S1B,
    v_figS1b_measured) — clutch_canonical_cycle at x0 = 0 gives a flow, but on a spring constant ks in
