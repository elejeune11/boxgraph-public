# Ids shared with bangasser2013b (ref. 42) where the quantity is the same.
- {id: n_motors, name: number of myosin motors in the motor-clutch module, dimension: dimensionless, description: "nm"}
- {id: motor_stall_force, name: stall force of a single myosin motor, dimension: "[force]", description: "Fm"}
- {id: unloaded_motor_velocity, name: unloaded velocity of the myosin motors, dimension: "[length]/[time]", description: "vu"}
- {id: n_clutches, name: number of molecular clutches in the module, dimension: dimensionless, description: "nc"}
- {id: clutch_on_rate, name: on-rate constant of clutch binding, dimension: "1/[time]", description: "kon"}
- {id: clutch_off_rate_unloaded, name: unloaded off-rate constant of a clutch, dimension: "1/[time]", description: "koff"}
- {id: bond_rupture_force, name: characteristic clutch bond rupture force, dimension: "[force]", description: "Fb"}
- {id: clutch_stiffness, name: spring constant of one molecular clutch, dimension: "[force]/[length]", description: "kc"}
- {id: substrate_stiffness, name: spring constant of the compliant substrate, dimension: "[force]/[length]", description: "ks; in the two-spring model, the constant of each of the two springs (Eqs. 6-7)"}
- {id: gamma_shape_parameter, name: shape parameter r of the gamma distribution assumed for the forces on bound clutches, dimension: dimensionless, description: "r in Eq. 11"}
- {id: substrate_prestretch, name: imposed initial displacement of the substrate spring (the applied deformation in the model), dimension: "[length]", description: "x0 in Eqs. 6, 8, 10, 13 and s.2-s.6"}
- {id: orthogonal_spring_length, name: rest length of the substrate spring orthogonal to the clutch axis, dimension: "[length]", description: "l in Eqs. 6-8, 10, 13"}
- {id: cycle_mean_flow_rate, name: F-actin retrograde flow rate averaged over a load-and-fail cycle, dimension: "[length]/[time]", description: "the 'Actin flowrate' of Figs. 9 and S13, which the paper does not define further (q_flow_definition)"}
- {id: load_fail_cycle_time, name: duration of one motor-clutch load-and-fail cycle, dimension: "[time]", description: "in the ODE solution, the time of the abrupt failure"}
# Measured quantities of the experiments (figure readings, figures.yaml)
- {id: time_lag, name: time lag of the particle-tracking mean squared displacement, dimension: "[time]", description: "tau in Eq. 1"}
- {id: tracer_msd, name: ensemble-averaged mean squared displacement of 500 nm particles inside the cells, dimension: "[length]**2", description: "MSD of Eq. 1 (Figs. 2, 4, 5, S4-S6; at a time lag of 1 s in Figs. 3, S4, S5)"}
- {id: tracer_radius_of_gyration, name: averaged radius of gyration of the particles' trajectories, dimension: "[length]", description: "Eq. 2; Fig. S3"}
- {id: condition_index, name: position of a bar in a bar chart (the experimental condition it shows), dimension: dimensionless, description: "1, 2, ... from left to right; each reading's `what` says which condition each index is"}
- {id: cell_spreading_area, name: spread area of a cell, dimension: "[length]**2", description: "Figs. 6G, J, 7E, H, S7, S8"}
- {id: nucleus_area, name: projected area of the cell nucleus, dimension: "[length]**2", description: "Figs. 6I, L, 7G, J, S7, S8"}
- {id: cell_shape_factor, name: cell shape factor (minor axis over major axis), dimension: dimensionless, description: "Figs. 6H, K, 7F, I"}
- {id: cell_orientation, name: angle of the cell's long axis to the stretching direction, dimension: dimensionless, description: "degrees; Fig. S9"}
- {id: cell_count, name: number of cells in an orientation bin, dimension: dimensionless, description: "Fig. S9"}
- {id: cell_youngs_modulus, name: Young's modulus of the cell measured by atomic force microscopy, dimension: "[mass]/[length]/[time]**2", description: "Fig. S10"}
- {id: substrate_tensile_stress, name: tensile stress in the substrate material, dimension: "[mass]/[length]/[time]**2", description: "sigma of Fig. S1 (left, PDMS)"}
- {id: substrate_tensile_strain, name: tensile strain of the substrate material, dimension: dimensionless, description: "epsilon of Fig. S1 (left, PDMS)"}
- {id: substrate_shear_stress, name: shear stress in the substrate material, dimension: "[mass]/[length]/[time]**2", description: "tau of Fig. S1 (right, PU)"}
- {id: substrate_shear_strain, name: shear strain of the substrate material, dimension: dimensionless, description: "gamma of Fig. S1 (right, PU)"}
- {id: substrate_youngs_modulus, name: Young's modulus of the substrate material, dimension: "[mass]/[length]/[time]**2", description: "PDMS about 1 MPa (930 kPa by the fit), PU about 0.6 MPa"}
- {id: substrate_shear_modulus, name: shear modulus of the substrate material, dimension: "[mass]/[length]/[time]**2", description: "the slope y = 185.07x of Fig. S1 (right, PU)"}
- {id: poisson_ratio, name: Poisson's ratio of the substrate material, dimension: dimensionless, description: "not stated by the paper"}
