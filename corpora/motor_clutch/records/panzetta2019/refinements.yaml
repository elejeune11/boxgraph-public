# The ODEs are solved by an adaptive solver (the paper: MATLAB ode15s; here LSODA), with the cycle's
# end found where r Pb Fb - <Fc> falls to g_fail. Neither tolerance is the paper's (it states none).
- {id: ref_two_spring_rtol, run: run_two_spring_ref, setting: rtol, factors: [1, 10, 100], mode: divide, output: v_mean,
   tolerance: "0.5%", tolerance_basis: "added: well below the precision of the figure readings (about 2-5% of the flow)", tolerance_added: true}
- {id: ref_two_spring_gfail, run: run_two_spring_ref, setting: g_fail, factors: [1, 10, 100], mode: divide, output: v_mean,
   tolerance: "0.5%", tolerance_basis: "added: well below the precision of the figure readings (about 2-5% of the flow)", tolerance_added: true}
- {id: ref_two_spring_gfail_t, run: run_two_spring_ref, setting: g_fail, factors: [1, 10, 100], mode: divide, output: t_cycle,
   tolerance: "0.5%", tolerance_basis: "added: as for the flow", tolerance_added: true}
- {id: ref_canonical_rtol, run: run_canonical_ref, setting: rtol, factors: [1, 10, 100], mode: divide, output: v_mean,
   tolerance: "0.5%", tolerance_basis: "added: well below the precision of the figure readings (about 2-5% of the flow)", tolerance_added: true}
- {id: ref_canonical_gfail, run: run_canonical_ref, setting: g_fail, factors: [1, 10, 100], mode: divide, output: v_mean,
   tolerance: "0.5%", tolerance_basis: "added: well below the precision of the figure readings (about 2-5% of the flow)", tolerance_added: true}
