# The paper prints no parameter value for its clutch model (q_params_unstated). It cites the
# master-equation model of Bangasser and Odde (ref. 42, record bangasser2013b) for the canonical
# form, so its base parameter set (Table S1 there) stands in for the unstated values; r = 3 is the
# value of ref. 42's Fig. 4, whose "optimum stiffness (characterized by the minimum actin flow
# rate)" Figs. 9 and S13 echo. The motor and clutch numbers, the stiffness of Fig. 9 (left), x0 and
# l have no source at all. Each is run with its alternatives, one at a time.
- id: Fm_added
  quantity: motor_stall_force
  unit: pN
  printed: "2"
  basis: "Not stated. Ref. 42 (bangasser2013b, Table S1, from Chan and Odde): Fm = 2 pN."
  alternatives: ["1"]
  stands_for: "Fm in Eqs. 9, 10, s.5"
- id: vu_added
  quantity: unloaded_motor_velocity
  unit: nm/s
  printed: "120"
  basis: "Not stated. Ref. 42 (Table S1): vu = 120 nm/s. Fig. 9 (right) approaches about 100 nm/s at the stiffest substrate, consistent with an unloaded velocity of this order."
  alternatives: ["100"]
  stands_for: "vu in Eqs. 9, 10, 13, s.5, s.6"
- id: kon_added
  quantity: clutch_on_rate
  unit: 1/s
  printed: "1"
  basis: "Not stated. Ref. 42 (Table S1): kon = 1 /s."
  alternatives: ["0.3", "3"]
  stands_for: "kon in Eq. 3"
- id: koff_added
  quantity: clutch_off_rate_unloaded
  unit: 1/s
  printed: "0.1"
  basis: "Not stated. Ref. 42 (Table S1): koff = 0.1 /s."
  alternatives: ["0.03", "0.3"]
  stands_for: "koff in Eq. 11"
- id: Fb_added
  quantity: bond_rupture_force
  unit: pN
  printed: "2"
  basis: "Not stated. Ref. 42 (Table S1): Fb = 2 pN."
  alternatives: ["1", "4"]
  stands_for: "Fb in Eq. 11"
- id: kc_added
  quantity: clutch_stiffness
  unit: pN/nm
  printed: "5"
  basis: "Not stated. Ref. 42 (Table S1) and chan2008: kc = 5 pN/nm."
  alternatives: ["1", "10"]
  stands_for: "kc in Eqs. 4, 8, s.4-s.6"
- id: r_added
  quantity: gamma_shape_parameter
  unit: dimensionless
  printed: "3"
  basis: "Not stated. Ref. 42 used r = 3 for its ODE optimum-stiffness curves (Fig. 4 there) and r = 2 for its time courses."
  alternatives: ["2"]
  stands_for: "r in Eq. 11"
- id: nm_added
  quantity: n_motors
  unit: dimensionless
  printed: "2000"
  basis: >-
    Not stated, and no source. With the inputs above the flow depends on ks through ks/n, and n = nm = nc =
    2000 puts the canonical optimum near the 50 pN/nm of Fig. S13 (left), the one curve that has no x0 or
    l: a choice made by looking at that figure, so the comparison with Fig. S13 (left) tests the curve's
    shape and depth rather than its position. Fig. 9 (left) ends at 3600 clutches, the largest n of ref.
    42's Fig. 4 (alternative).
  alternatives: ["1000", "3600"]
  stands_for: "nm in Eqs. 9, 10, 13, s.5, s.6"
- id: nc_added
  quantity: n_clutches
  unit: dimensionless
  printed: "2000"
  basis: "Not stated; as nm_added (nm = nc, as in ref. 42's Fig. 4)."
  alternatives: ["1000", "3600"]
  stands_for: "nc in Eqs. 5, 8, s.4-s.6 (Figs. 9 right and S13)"
- id: ks_fig9l_added
  quantity: substrate_stiffness
  unit: pN/nm
  printed: "30"
  basis: "Fig. 9 (left) varies nc at a substrate stiffness the paper does not state. 30 pN/nm is near the optima of Fig. 9 (right)."
  alternatives: ["10", "100"]
  stands_for: "ks of Fig. 9 (left)"
- id: l_added
  quantity: orthogonal_spring_length
  unit: nm
  printed: "100"
  basis: >-
    Not stated, and no source: the rest length of the orthogonal spring (Eqs. 6-8, 10) is given no value
    and no physical size anywhere. In the model only x0/l and the cycle's excursion relative to l matter;
    100 nm is of the order of the cycle's substrate excursion at the inputs above.
  alternatives: ["30", "1000"]
  stands_for: "l in Eqs. 6-8, 10, 13"
- id: x0_blue_added
  quantity: substrate_prestretch
  unit: nm
  printed: "50"
  basis: >-
    Not stated: Figs. 9 and S13 say only that blue, purple and green are increasing x0. The model's x0 is a
    length; the experiments' deformations are strains (6%, 9%) and no conversion is given (q_x0_strain).
    50, 150 and 500 nm (with l = 100 nm) span the model's range from x0 < l, where the substrate acts with
    stiffness near ks, to x0 >> l, where it acts with 2 ks.
  alternatives: ["20", "100"]
  stands_for: "x0 of the blue curves of Figs. 9 and S13 (right)"
- id: x0_purple_added
  quantity: substrate_prestretch
  unit: nm
  printed: "150"
  basis: "Not stated; see x0_blue_added."
  alternatives: ["100", "300"]
  stands_for: "x0 of the purple curves of Figs. 9 and S13 (right)"
- id: x0_green_added
  quantity: substrate_prestretch
  unit: nm
  printed: "500"
  basis: "Not stated; see x0_blue_added."
  alternatives: ["300", "2000"]
  stands_for: "x0 of the green curves of Figs. 9 and S13 (right)"
- id: x0_canonical_added
  quantity: substrate_prestretch
  unit: nm
  printed: "100"
  basis: >-
    Fig. S13 (left) plots the canonical model for three unstated x0 that give one curve. In s.4-s.6 x0
    enters only through <xc> - x0, so any value gives the same flow; the alternatives show that.
  alternatives: ["0", "1000"]
  stands_for: "x0 of Fig. S13 (left)"
- id: nu_pu_added
  quantity: poisson_ratio
  unit: dimensionless
  printed: "0.5"
  basis: "Not stated. PU is an elastomer, taken as incompressible; E = 2(1 + nu)G then gives E = 3G. Used only to relate the shear slope of Fig. S1 (right) to the 0.6 MPa Young's modulus."
  alternatives: ["0.45", "0.49"]
  stands_for: "nu in E = 2(1 + nu) G (model youngs_from_shear)"
