# Every input is added (added.yaml): the paper prints none (q_params_unstated).
# Each curve run sweeps the x axis of the figure reading it is compared with.
- id: run_s13l
  model: clutch_canonical_cycle
  inputs: &canon {nm: nm_added, Fm: Fm_added, vu: vu_added, nc: nc_added, kon: kon_added, koff: koff_added, Fb: Fb_added, kc: kc_added, r: r_added, x0: x0_canonical_added}
  sweep: {ks: figS13l_flow}
  outputs: {v_mean: s13l_flow_pred, t_cycle: s13l_tcycle_pred}
- id: run_s13r_blue
  model: clutch_two_spring_cycle
