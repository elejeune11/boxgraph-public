# Model curves of Fig. 9 (p. 8) and Fig. S13 (p. 23), read by the record's own code (figures/).
# Both figures are raster images of Excel charts without tick marks; see figures/_fig.py.
# Each series is read only over the x range it covers. The fig9r_*_at_s13 readings read the Fig. 9
# (right) curves at the x positions of the Fig. S13 (right) series of the same colour, so that the
# two figures can be compared point by point.
