id: bonds_in_contact
name: number of bonds over a contact area
role: model
stated: {page: 7, printed_page: "624", quote: "contact area were -- r = 16 JLm 2, this", where: text}
equation: "not printed; 2 x 10^4 bonds per um^2 over a contact area of 16 um^2 'would give ≤ 3 x 10^5 bonds per cell'. Read as n = N A"
from_words: true
inputs:
