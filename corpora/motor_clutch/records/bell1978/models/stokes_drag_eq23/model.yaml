id: stokes_drag_eq23
name: Stokes drag on a stationary cell in a fluid stream (Eq. 23), per unit velocity
role: model
stated: {page: 7, printed_page: "624", quote: "force on the cell will be given by Stokes", where: "Eq. 23"}
equation: "F = 6π eta r v; the record computes F/v = 6π eta r"
inputs:
  eta: {quantity: viscosity, unit: g/cm/s}
  r: {quantity: cell_radius, unit: um}
outputs:
  drag: {quantity: drag_coefficient, unit: dyne*s/cm}
