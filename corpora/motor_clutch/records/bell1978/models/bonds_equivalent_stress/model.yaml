id: bonds_equivalent_stress
name: number of standard bonds per unit area equivalent to a stress or pressure
role: model
stated: {page: 7, printed_page: "624", quote: "responds to 1Q4 standard bonds per", where: text}
equation: "n = sigma/fc, with fc the representative critical force per bond"
from_words: true
inputs:
  sigma: {quantity: force_per_area, unit: dyne/um^2}
  fc: {quantity: critical_force_per_bond, unit: dyne}
outputs:
  n: {quantity: bond_density, unit: um^-2}
