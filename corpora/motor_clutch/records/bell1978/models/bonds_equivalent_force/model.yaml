id: bonds_equivalent_force
name: number of standard bonds a force would break
role: model
stated: {page: 7, printed_page: "624", quote: "dyne. This would be sufficient to break", where: text}
equation: "n = F/fc, with fc the representative critical force per bond"
from_words: true
inputs:
  F: {quantity: force_on_cell, unit: dyne}
  fc: {quantity: critical_force_per_bond, unit: dyne}
outputs:
  n: {quantity: bond_count, unit: dimensionless}
