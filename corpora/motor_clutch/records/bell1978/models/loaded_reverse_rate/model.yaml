id: loaded_reverse_rate
name: reverse rate constant of a bond under force, the replacement for k- in Eq. 12 (p. 623)
role: model
stated: {page: 6, printed_page: "623", quote: "stant in Eq. 12 should be replaced by", where: text}
equation: "k_ exp(γF/kT Nb), with F/Nb the force per bond"
inputs:
  k_minus: {quantity: reverse_rate_membrane, unit: 1/s}
  gamma:   {quantity: barrier_range, unit: nm}
  f:       {quantity: force_per_closed_bond, unit: dyne, description: "F/Nb"}
  kT:      {quantity: thermal_energy, unit: eV/particle}
outputs:
  k_minus_F: {quantity: reverse_rate_loaded, unit: 1/s}
settings: {}
stochastic: false
