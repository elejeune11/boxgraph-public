role: model
stated: {page: 5, printed_page: "622", quote: "pared with the period of a harmonic os-", where: text}
equation: "tau_h ≈ 2π r0 (E0 m)^-1/2   [as the OCR and the page image at hand read; implemented as 2π r0 (E0/m)^-1/2, see q_tau_h_formula]"
