# Rate constants (Eqs. 2-9, 13)
- {id: diffusion_coefficient_solution, name: translational diffusion coefficient of a reactant in solution, dimension: "[length]**2/[time]", description: "Ds(A), Ds(B)"}
- {id: diffusion_coefficient_membrane, name: translational diffusion coefficient of a receptor in the membrane, dimension: "[length]**2/[time]", description: "Dm(A), Dm(B)"}
- {id: membrane_diffusion_sum, name: sum of the membrane diffusion coefficients of the two reactants, dimension: "[length]**2/[time]", description: "Dm(A) + Dm(B)"}
- {id: encounter_distance, name: encounter distance, dimension: "[length]", description: "R_AB, separation at which reactants form an encounter complex"}
- {id: encounter_rate_solution, name: rate constant for forming the encounter complex in solution, dimension: "[length]**3/[substance]/[time]", description: "d+^s"}
- {id: encounter_dissociation_rate_solution, name: rate constant for dissolution of the encounter complex in solution, dimension: "1/[time]", description: "d-^s"}
- {id: encounter_equilibrium_solution, name: equilibrium constant of the encounter step in solution, dimension: "[length]**3/[substance]", description: "Kd^s = d+^s/d-^s"}
- {id: encounter_rate_membrane, name: rate constant for forming the encounter complex between membrane-bound reactants, dimension: "[length]**2/[time]", description: "d+^m"}
- {id: encounter_dissociation_rate_membrane, name: rate constant for dissolution of the encounter complex between membrane-bound reactants, dimension: "1/[time]", description: "d-^m"}
- {id: forward_rate_membrane, name: overall forward rate constant for membrane-bound reactants, dimension: "[length]**2/[time]", description: "k+^m"}
- {id: fraction_of_diffusion_limit, name: forward rate constant as a fraction of its diffusion limit, dimension: dimensionless}
- {id: receptor_count, name: number of receptors (or determinants) on one cell, dimension: dimensionless}
- {id: cell_radius, name: radius of a cell (or microvillus), dimension: "[length]"}
- {id: cell_area, name: surface area of a cell, dimension: "[length]**2"}
- {id: receptor_density, name: number of receptors per unit membrane area, dimension: "1/[length]**2", description: "N1, N2"}
- {id: bond_formation_rate, name: rate of intercellular bond formation per unit contact area, dimension: "1/[length]**2/[time]", description: "dNb/dt"}
# Equilibrium constants (note 45, Eqs. 19-21)
- {id: equilibrium_constant_solution, name: overall equilibrium constant for reactants in solution, dimension: "[length]**3/[substance]", description: "K^s"}
- {id: equilibrium_constant_membrane, name: overall equilibrium constant for membrane-bound reactants, dimension: "[length]**2", description: "K^m, with concentrations per unit area"}
- {id: KN2_product, name: product of the membrane equilibrium constant and the receptor density on cell 2, dimension: dimensionless, description: "K N2"}
- {id: critical_force_alpha, name: dimensionless critical force alpha_c of Eq. 20, dimension: dimensionless}
# Bond strength (Eqs. 15, 16, 19-22)
- {id: barrier_free_energy, name: free energy that a separating force must overcome, dimension: "[energy]/[substance]", description: "E0 in Eqs. 15-16: bond free energy, or the energy barrier to extracting a molecule from the membrane"}
- {id: barrier_range, name: distance over which the separating force acts, dimension: "[length]", description: "r0 (and gamma, set equal to r0)"}
- {id: thermal_energy, name: thermal energy kT, dimension: "[energy]/[substance]"}
- {id: temperature, name: temperature, dimension: "[temperature]"}
- {id: rupture_force, name: force that rapidly ruptures a bond or extracts a molecule, dimension: "[force]", description: "f0 = E0/r0 (Eq. 15), per bond or per molecule"}
- {id: force_per_bond, name: applied force per bond (per potential bond), dimension: "[force]", description: "f = F/N1"}
- {id: critical_force_per_bond, name: critical force per potential bond to detach a cell, dimension: "[force]", description: "fc (Eq. 19)"}
- {id: thermal_force_scale, name: thermal force scale kT/r0, dimension: "[force]", description: "the coefficient of alpha_c in Eq. 21"}
- {id: critical_force_log_coefficient, name: coefficient of ln(KN2) in the approximate critical force, dimension: "[force]", description: "0.7 kT/r0 in Eq. 21"}
- {id: reciprocal_natural_frequency, name: reciprocal natural frequency tau0 in the bond lifetime law, dimension: "[time]"}
- {id: bond_lifetime, name: mean lifetime of a single bond, dimension: "[time]", description: "tau in Eq. 16"}
- {id: reverse_rate_membrane, name: reverse rate constant for membrane-bound reactants, dimension: "1/[time]", description: "k-"}
- {id: force_per_closed_bond, name: applied force per closed bond, dimension: "[force]", description: "F/Nb (p. 623), as distinct from F/N1 per potential bond"}
- {id: reverse_rate_loaded, name: reverse rate constant of a bond under force, dimension: "1/[time]", description: "k- exp(gamma F/kT Nb), the replacement for k- in Eq. 12"}
- {id: detachment_time, name: time for a cell held by many bonds to detach under a force, dimension: "[time]", description: "t in Eq. 22 and Table 2"}
- {id: force_dimensionless, name: force per potential bond in units of kT ln(KN2)/r0, dimension: dimensionless, description: "f* = f r0/kT ln(KN2), the abscissa of Fig. 8"}
- {id: log10_dimensionless_detachment_time, name: log10 of the detachment time in units of 1/k-, dimension: dimensionless, description: "log10 t*, t* = k- t, the ordinate of Fig. 8"}
- {id: oscillator_mass, name: mass of the oscillator fitted to the bond potential, dimension: "[mass]"}
- {id: harmonic_period, name: period of a harmonic oscillator fitted to the bond potential, dimension: "[time]", description: "tau_h"}
# Forces on cells (Eqs. 23-24 and comparisons)
- {id: viscosity, name: fluid viscosity, dimension: "[mass]/[length]/[time]"}
- {id: drag_coefficient, name: Stokes drag force per unit fluid velocity on a cell, dimension: "[mass]/[time]", description: "F/v = 6 pi eta r"}
- {id: flow_velocity, name: fluid velocity relative to the cell, dimension: "[length]/[time]"}
- {id: bonds_per_velocity, name: number of bonds needed to hold a cell per unit fluid velocity, dimension: "[time]/[length]"}
- {id: bond_count, name: "number of bonds (needed, or equivalent to a force)", dimension: dimensionless}
- {id: vibration_frequency, name: vibration frequency of a plucked fiber, dimension: "1/[time]"}
- {id: displacement_amplitude, name: maximum displacement of a plucked fiber, dimension: "[length]"}
- {id: cell_mass, name: mass of one cell, dimension: "[mass]"}
- {id: peak_acceleration, name: peak acceleration of a plucked fiber, dimension: "[length]/[time]**2"}
- {id: force_on_cell, name: total force on one cell, dimension: "[force]"}
- {id: force_per_area, name: force per unit area to be resisted (a stress or a pressure), dimension: "[force]/[length]**2"}
- {id: bond_density, name: "number of bonds per unit area (needed, or equivalent to a stress)", dimension: "1/[length]**2"}
- {id: surface_tension, name: cell surface tension, dimension: "[force]/[length]"}
- {id: force_ratio, name: ratio of the rupture force f0 to the critical force fc, dimension: dimensionless}
- {id: pressure_times_radius, name: product of cell surface pressure and radius, dimension: "[force]/[length]", description: "P R = 2 gamma"}
- {id: contact_area, name: area of contact between a cell and a fiber, dimension: "[length]**2"}
- {id: cell_diameter, name: diameter of a cell, dimension: "[length]"}
- {id: travel_time, name: time for a cell to travel a given distance in a grazing collision, dimension: "[time]"}
- {id: bond_formation_rate_per_receptor, name: maximum bond formation rate per unit area divided by N1, dimension: "1/[time]", description: "k+m N2"}
- {id: contact_area_duration, name: product of contact area and collision duration needed for adhesion, dimension: "[length]**2*[time]"}
# Note added in proof
- {id: lipid_exposure_free_energy, name: "free energy of exposing lipid area to water, per unit area", dimension: "[energy]/[substance]/[length]**2"}
- {id: plug_radius, name: radius of a displaced cylindrical bilayer plug, dimension: "[length]"}
- {id: plug_force_per_radius, name: force to displace a bilayer plug per unit plug radius, dimension: "[force]/[length]"}
# Fig. 5 model (not runnable)
- {id: inhibitor_concentration, name: concentration of competitive free sugar, dimension: "[substance]/[length]**3"}
- {id: bond_reduction_factor, name: factor by which the equilibrium number of bonds is reduced, dimension: dimensionless}
