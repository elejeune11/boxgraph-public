  citation: {page: 23, printed_page: "Supp. p. 6", quote: "Reasonable values for αc range from -0.15 pN-1 nm-1", where: text}
- id: q_alpha_source
  kind: unstated_input
  about: [alpha_m015, alpha_m06]
  text: >-
    How αc = -0.15 and -0.6 pN-1 s-1 follow from the cited catch-bond data (Kong et al. 2009; Chen et al.
