- id: q_validation_mean_vs_range
  kind: overstated_claim
  about: [val_v_eq13_elongation_range, val_v_eq13_table1, v_elongation_observed, t1_diff_velocity]
  text: >-
    The model result (1.7 nm/s at αc = -0.15) is said to be "in good agreement with the observed rate of stress
    fiber elongation (0-3 nm s-1) in our study". The study's own mean relative speed of actin and zyxin plaques
    is 58 ± 3.1 nm/min (Table 1), about 0.97 ± 0.05 nm/s, and the reported distribution runs from below 20 to
    above 180 nm/min (0.3 to 3 nm/s). The model value lies inside the range but well above the measured mean.
    The model's inputs (Ftot = 1 nN, Ct = 500, kon = k0 = 1 s-1, κ = 1 pN/nm) are generic, and αc is free
    between -0.15 and -0.6, so reaching the measured mean takes only a small change in αc. The agreement
    therefore tests the order of magnitude, not the model.
  citation: {page: 7, printed_page: "1965", quote: "with relative velocities ranging from <20 to >180 nm/min", where: text}
- id: q_no_continuous_rearward_flow
  kind: overstated_claim
  about: [t1_actn_all, t1_diff_velocity, clutch_velocity_eq13]
  text: >-
    The paper reports that closer examination "did not reveal a continuous rearward flow of the actin
    cytoskeleton over slower moving adhesions" (abstract; Discussion p. 10), against the 2D clutch picture of
    continuous retrograde flow. The support in the data is directional and qualitative: α-actinin-1
    puncta move both retrograde and anterograde along protrusions (Fig. 4B, 25 protrusions in 18 cells;
    Fig. S11, 13/18 cells with one protrusion), as do paxillin plaques (Fig. 3G) and zyxin plaques (Fig. S14D);
    neighbouring stress fibres move independently (Fig. 4E-F); and new α-actinin-1 puncta nucleate at a subset of
    adhesions and flow into the fibre (Fig. 5D, S14A). Table 1 gives speeds, which are magnitudes and cannot
    show direction. No printed number gives the fraction of retrograde motion or a mean signed velocity along the
    protrusion axis, and the rose plots are not quantified in the text. The measured actin speeds
    (53-95 nm/min, about 1-1.6 nm/s) are 1-2 orders of magnitude below 2D retrograde flow (e.g. 5-20 um/min cited
    on p. 9). So the claim rests on angle distributions read from figures, not on a tested quantity. The
    paper's own clutch model (eqns 11-14) has a single velocity v per adhesion and no direction, so it neither
    predicts nor excludes continuous flow.
  citation: {page: 1, printed_page: "1959", quote: "did not reveal a continuous rearward flow of the actin cytoskeleton", where: abstract}
- id: q_kappa_main
  kind: unexplained_difference
  about: [kappa_ratio_main, cmp_kappa_main, run_kappa_main, bending_ratio_persistence]
  text: >-
    The printed κ ≈ 2.4 × 10^-6 does not follow from the printed inputs, as far as they are given. With
    κb = kB T Lp (T = 310 K, Lp = 40 um), κs = 15 MPa × π(160 nm)^2 and l = 10 um, κ = κb/(κs l^2) is about
    1.4 × 10^-9, some 1700 times smaller. The paper's own second value disagrees with it in direction too:
    with the softer 2 MPa fibre modulus and the same Lp it prints κ ≈ 2 × 10^-8 (computed here about
    1.1 × 10^-8). A 7.5-fold smaller κs must give a 7.5-fold larger κ, yet 2 × 10^-8 is about 100 times smaller
    than 2.4 × 10^-6. The paper does not say how κb was taken from Lp (it calls the estimate a lower bound),
    so the main value may rest on another κb or another l. A cross-link spacing of about 0.24 um would give 2.4 × 10^-6.
    The simulations of Fig. 6 use this value.
  citation: {page: 13, printed_page: "1971", quote: "gives a value of κ ≈ 2.4 × 10−6", where: text}
- id: q_kappa_rod
  kind: unexplained_difference
  about: [kappa_ratio_rod, cmp_kappa_rod, bending_ratio_rod]
  text: >-
    For a uniform rod of diameter d, κb/(κs l^2) = (E π d^4/64)/(E π d^2/4 · l^2) = d^2/(16 l^2), which is
    6.4 × 10^-5 for d = 320 nm and l = 10 um, about three times the printed ≈ 2 × 10^-5. The printed value is
    what the same formula gives with the radius (160 nm) in place of the diameter (1.6 × 10^-5). The fibre
    modulus 14.5 MPa cancels and does not affect the ratio.
  citation: {page: 13, printed_page: "1971", quote: "κ ≈ 2 × 10−5 is calculated when κb is derived by treating each ele", where: text}
- id: q_crosslink_spacing
  kind: reading
  about: [l_crosslink, L_fiber]
  text: >-
    l is defined as "the average distance between cross-links" and set to 10 um, the measured length of a whole
    fibre between its two ends (p. 12). The same paragraph notes that "each fiber typically connected to multiple
    fibers along its 10-um length", so the distance between cross-links would be shorter than 10 um. κ scales
    as 1/l^2.
  citation: {page: 12, printed_page: "1970", quote: "measured to be ∼10 µm. Note that each fiber typically connected", where: text}
- id: q_network_not_runnable
  kind: unstated_model
  about: [fiber_network_point_load, k_node_max]
  text: >-
    The fibre-network simulation behind Fig. 6B and Fig. S16 (and so the "up to ~24 nN/um" node stiffness and
    its spread between nodes) cannot be rerun. Missing are the lattice and its spacing in real units, the domain
    radius, the randomisation (cited to Notbohm et al. 2015a), the number of networks, the beam discretisation,
    the explicit solver's damping, and the conversion to real units. The code is not released (only FIDVC is).
    The node-to-node variation in effective stiffness, the paper's main modelling result, is only plotted, and it
    is not summarised as a distribution.
  citation: {page: 13, printed_page: "1971", quote: "Simulations are performed in dimensionless", where: text}
- id: q_stiffness_scale_mismatch
  kind: reading
  about: [kappa_1, k_node_max, k_cont_printed]
  text: >-
