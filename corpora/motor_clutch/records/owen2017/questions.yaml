- id: q_spooling_rows_imply_fast_zyxin
  kind: unexplained_difference
  about: [t1_diff_speed, t1_actn_coloc_zyx, t1_zyx_coexp, t1_diff_velocity]
  text: >-
    Table 1 rows 6 and 7 are means over the same 192 colocalized zyxin and α-actinin-1 pairs:
    mean(|v_zyx| − |v_actn|) = 29 ± 1.8 and mean |v_actn| = 58 ± 2.8 nm/min. Because a mean is linear, the mean
    zyxin-plaque speed over these pairs is 58 + 29 = 87 nm/min. That is well above the 55 ± 1.5 nm/min of all
    864 zyxin tracks in the same 7 cells, and it means these plaques move faster than their α-actinin-1 puncta.
    The text (p. 6) reports the opposite for paxillin, that adhesions were less mobile than actin. The mean of
    row 7 (58) also equals the mean of row 5 (58 ± 3.1). The rows may be right, for example if colocalized plaques
    are the fast ones, but nothing printed explains this. A positive scalar difference is allowed: the caption
    of Fig. S14E (p. 39) calls it "a lower bound on the spooling speed".
