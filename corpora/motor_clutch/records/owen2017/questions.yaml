    output here is that lifetime. (2) This paper prints no ks, kc, δs or δc (q_alpha_source). Every input
    would have to be added and chosen to match Kong's curves, which is a fit made by this job, not a test
    of the paper's model. The paper made no such fit, so it cannot be entered as fit_quality either.
