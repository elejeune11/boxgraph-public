    agreement" and then "equation 13 yields v = 1.7 nm s-1 for αc = -0.15". Eqn. 13 gives 1.66 nm/s (reproduced);
    eqn. 14 (all clutches bound) gives 1.4 nm/s with the same inputs. The record reads the printed 1.7 as the
    eqn. 13 result, as the sentence that prints it says.
  citation: {page: 23, printed_page: "Supp. p. 6", quote: "Applying values from the literature to eqn. 14 yields values of", where: text}
- id: q_alpha_units
  kind: possible_error
  about: [alpha_m015, alpha_m06, alpha_p06, clutch_force_sensitivity]
  text: >-
    αc is printed with three units: "-0.15 pN-1 nm-1" and "-0.6 pN-1 nm-1" (first paragraph of Supp. p. 6),
    "-0.15 to -0.6 s-1 pN-1" (list of reasonable values) and "pN-1 s-1" (Fig. S17 axis). Eqn. 10,
    koff = k0 + αc F, requires a rate per force, so pN-1 s-1 is dimensionally right and pN-1 nm-1 cannot be.
