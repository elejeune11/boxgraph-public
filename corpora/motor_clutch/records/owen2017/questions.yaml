- id: q_3d_validation_of_2d_models
  kind: choice
  about: [t1_diff_velocity, t1_actn_all, kappa_1, k_node_max]
  text: >-
    The corpus's 2D-calibrated clutch models (chan2008 motor_clutch, bangasser2013, odde_code, mekhdjian2017)
    predict a retrograde flow speed of actin relative to a substrate spring of stiffness κsub. The nearest
    measured quantity here is the speed of actin relative to its adhesion (Table 1, |v_zyx − v_actn|, 58 ± 3.1
    nm/min), with fibrin, paxillin and α-actinin-1 speeds as context. To validate those models against it, a
    cross-validation entry would go in each model's own record. It would need added inputs that this paper
    does not give: the substrate stiffness (no measured local stiffness; κ = 1 pN/nm in the clutch model, up to
    ~24 nN/um from the unrunnable network, or the bulk 200-300 Pa through a Cerruti-type conversion), motor
    number and clutch number for fibroblast stress fibres, and a sign convention (the measured speeds are
    unsigned magnitudes in both directions). The paper's measured speeds are slow (about 1 nm/s), close to a
    stalled clutch. In those models that needs many clutches relative to motors, which is the paper's own
    reading (p. 10). No such entry is made from this record.
  citation: {page: 10, printed_page: "1968", quote: "Low velocities, such as we ob", where: Discussion}
