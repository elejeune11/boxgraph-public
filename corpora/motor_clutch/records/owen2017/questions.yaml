  text: >-
    (Cross-record validation, 2026-11-22.) No model here is validated against a measurement of kong2009,
    which this paper cites twice on Supp. p. 6 (ref-kong2009). Both times it is the basis for the catch-bond
    force sensitivity αc = -0.15. It is never cited as data that a model of this paper explains. The only
    models here that could meet Kong's force-clamp lifetimes are the off-rate laws (eqns 6 and 7). They are
