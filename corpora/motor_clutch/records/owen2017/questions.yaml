- id: q_slip_220_beyond_pole
  kind: possible_error
  about: [v_p06_printed, cmp_v_eq13_p06, clutch_velocity_eq13]
  text: >-
    Eqn. 13 reproduces v = 220 nm/s at αc = 0.6, but only by passing through its pole. With Ftot = 1000 pN,
    Ct = 500 and kon = 1 s-1, kon Ct − αc Ftot changes sign at αc = 0.5 pN-1 s-1; at αc = 0.6 eqn. 11 gives
    Cb = (500 − 600)/2 = −50 bound clutches, and both factors of eqn. 13 are negative, so their product is
    positive. The model has no steady state there (Fig. S17 stops below αc = 0.5, where v already exceeds
    100 nm/s). The paper's reading of the number ("not biologically reasonable, illustrating the relative
    fragility of the slip-bond connection") holds, but 220 nm/s is not a value the model gives for a physical
    adhesion: v diverges as αc approaches 0.5 from below.
  citation: {page: 23, printed_page: "Supp. p. 6", quote: "Note that if αc = 0.6 (slip bond) v = 220 nm", where: text}
- id: q_eq13_or_eq14
  kind: reading
  about: [v_m015_printed, cmp_v_eq14_m015, run_eq14_m015]
  text: >-
