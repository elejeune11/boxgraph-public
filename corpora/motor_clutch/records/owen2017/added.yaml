- id: eta_continuum_added
  quantity: poisson_ratio
  unit: dimensionless
  printed: "0.5"
  basis: >-
    The Supplemental Discussion (p. 20) writes the stiffness as πEr/2(1+η) "where η is Poisson's ratio" but
    gives no value. The paper assumes 0.5 for its own fibrin gels (p. 11, Fig. S10 caption); the 10 kPa
    substrate of the example is a generic continuous gel (polyacrylamide gels are usually taken near 0.45-0.5).
  alternatives: ["0.45", "0.3"]
  stands_for: η in πEr/2(1+η) (Supplemental Discussion)
- id: T_added
  quantity: temperature
  unit: K
  printed: "310"
  basis: >-
    kBT is needed to turn the persistence length into a bending stiffness (κb = kBT Lp), a step the paper
    describes only as estimating "a lower bound on κb from the persistence length" (p. 13) without a
    temperature. Experiments are at 37 degC (p. 11).
  alternatives: ["298"]
  stands_for: T in κb = kB T Lp (Fiber network simulations)
