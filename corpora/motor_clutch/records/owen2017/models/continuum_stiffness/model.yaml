id: continuum_stiffness
name: effective stiffness of a continuous elastic substrate loaded over a disc of radius r (Supplemental Discussion)
role: model
stated: {page: 20, printed_page: "Supp. p. 3", quote: "force is applied over a region of radius r on a gel with Young's modulus E", where: "Supplemental Discussion, Comparison of the effective stiffnesses"}
equation: "κ = πEr/2(1+η)"
inputs:
  E:   {quantity: substrate_modulus, unit: Pa}
  r:   {quantity: adhesion_radius, unit: um}
  eta: {quantity: poisson_ratio, unit: dimensionless}
outputs:
  k: {quantity: adhesion_effective_stiffness, unit: nN/um}
settings: {}
stochastic: false
