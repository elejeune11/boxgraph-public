id: clutch_velocity_eq14
name: actin velocity relative to an adhesion when all clutches are bound (Supp. eqn. 14)
role: model
stated: {page: 23, printed_page: "Supp. p. 6", quote: "causes Cb to approach the physically meaningful upper limit of Cb = Ct", where: "eqn. 14"}
equation: "v = Ftot/(Ct κ) [k0 + αc Ftot/Ct] for k0 > −αc Ftot/Ct; v = 0 for k0 ≤ −αc Ftot/Ct"
inputs:
  Ftot:    {quantity: adhesion_total_force, unit: pN}
  k0:      {quantity: clutch_off_rate_zero_force, unit: 1/s}
  kappa:   {quantity: adhesion_effective_stiffness, unit: pN/nm}
  Ct:      {quantity: clutch_number_total, unit: dimensionless}
  alpha_c: {quantity: clutch_force_sensitivity, unit: 1/pN/s}
outputs:
  v: {quantity: actin_adhesion_relative_speed, unit: nm/s}
settings: {}
stochastic: false
