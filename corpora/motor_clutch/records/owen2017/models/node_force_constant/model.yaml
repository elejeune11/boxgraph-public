id: node_force_constant
name: force on a network node from its effective force constant (secant), F = k u (Results, p. 8; Fig. 6B)
role: model
stated: {page: 8, printed_page: "1966", quote: "average effective force constant of up to", where: text}
equation: "F = k u, k the 'average effective force constant' of a node read as the slope of its force-displacement curve"
from_words: true
inputs:
  k: {quantity: node_effective_stiffness, unit: nN/um}
  u: {quantity: point_load_displacement, unit: um}
outputs:
  F: {quantity: point_load_force, unit: nN}
settings: {}
stochastic: false
