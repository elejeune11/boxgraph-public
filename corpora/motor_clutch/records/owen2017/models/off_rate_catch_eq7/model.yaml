id: off_rate_catch_eq7
name: phenomenological catch-slip clutch off-rate under load (Supp. eqn. 7)
role: model
stated: {page: 21, printed_page: "Supp. p. 4", quote: "Here ks, δs, kc, and δc are the slip and catch parameters", where: "eqn. 7"}
equation: "koff = ks exp(F δs β) + kc exp(−F δc β), β = 1/kBT"
inputs:
  ks:      {quantity: slip_off_rate_zero_force, unit: 1/s}
  kc:      {quantity: catch_off_rate_zero_force, unit: 1/s}
  F:       {quantity: clutch_force, unit: pN}
  delta_s: {quantity: slip_distance, unit: nm}
  delta_c: {quantity: catch_distance, unit: nm}
  kT:      {quantity: thermal_energy, unit: pN*nm}
outputs:
  koff: {quantity: clutch_off_rate, unit: 1/s}
settings: {}
stochastic: false
