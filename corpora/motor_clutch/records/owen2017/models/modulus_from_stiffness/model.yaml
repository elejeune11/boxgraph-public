id: modulus_from_stiffness
name: Young's modulus of the continuous substrate that gives a node's effective stiffness (inverse of the Supplemental Discussion formula)
role: model
stated: {page: 8, printed_page: "1966", quote: "These stiffnesses correspond to effective", where: "text, citing the Supplemental Discussion"}
equation: "E = 2(1+η)κ/(πr), from κ = πEr/2(1+η)"
from_words: true
built_from: [continuum_stiffness]
inputs:
  k:   {quantity: node_effective_stiffness, unit: nN/um}
  r:   {quantity: adhesion_radius, unit: um}
  eta: {quantity: poisson_ratio, unit: dimensionless}
outputs:
  E: {quantity: node_effective_modulus, unit: kPa}
settings: {}
stochastic: false
