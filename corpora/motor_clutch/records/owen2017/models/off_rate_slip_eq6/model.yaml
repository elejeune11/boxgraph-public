id: off_rate_slip_eq6
name: slip-bond clutch off-rate under load (Supp. eqn. 6)
role: model
stated: {page: 21, printed_page: "Supp. p. 4", quote: "Here ks is the off rate at zero force, F is the force per bond", where: "eqn. 6"}
equation: "koff = ks exp(F δs β), β = 1/kBT"
inputs:
  ks:      {quantity: slip_off_rate_zero_force, unit: 1/s}
  F:       {quantity: clutch_force, unit: pN}
  delta_s: {quantity: slip_distance, unit: nm}
  kT:      {quantity: thermal_energy, unit: pN*nm}
outputs:
  koff: {quantity: clutch_off_rate, unit: 1/s}
settings: {}
stochastic: false
