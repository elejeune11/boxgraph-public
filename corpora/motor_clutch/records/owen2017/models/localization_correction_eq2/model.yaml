id: localization_correction_eq2
name: mean displacement corrected for 3D localization error (Supp. eqns 1-2, generalizing Churchman et al. 2005)
role: processing
stated: {page: 19, printed_page: "Supp. p. 2", quote: "where s is the corrected mean displacement", where: "eqn. 2"}
equation: "s = sqrt(<d^2> − 4σxy^2 − 2σz^2)"
described_from: ref-churchman2005
inputs:
  msd:      {quantity: particle_msd_measured, unit: nm**2}
  sigma_xy: {quantity: localization_error_xy, unit: nm}
  sigma_z:  {quantity: localization_error_z, unit: nm}
outputs:
  s: {quantity: particle_displacement_corrected, unit: nm}
settings: {}
stochastic: false
