id: bending_ratio_persistence
name: dimensionless bending-to-stretching ratio of network elements, with κb from the persistence length (Materials and Methods)
role: model
stated: {page: 13, printed_page: "1971", quote: "single dimensionless ratio κ = κb/(κsl2), where κb is the resistance", where: "Fiber network simulations"}
equation: "κ = κb/(κs l^2); κs = Young's modulus × fibre cross-sectional area; κb estimated (lower bound) from the persistence length, here κb = kB T Lp; circular cross section of diameter d"
from_words: true
inputs:
  Lp: {quantity: fiber_persistence_length, unit: um}
  T:  {quantity: temperature, unit: K}
  Ef: {quantity: fiber_youngs_modulus, unit: MPa}
  d:  {quantity: fiber_diameter, unit: nm}
  l:  {quantity: crosslink_spacing, unit: um}
outputs:
  kappa: {quantity: bending_stretching_ratio, unit: dimensionless}
settings: {}
stochastic: false
