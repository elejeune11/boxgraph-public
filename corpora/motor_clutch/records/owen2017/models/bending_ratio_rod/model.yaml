id: bending_ratio_rod
name: dimensionless bending-to-stretching ratio of network elements treated as uniform elastic rods (Materials and Methods)
role: model
stated: {page: 13, printed_page: "1971", quote: "is calculated when κb is derived by treating each ele", where: "Fiber network simulations"}
equation: "κ = κb/(κs l^2) with κb = Ef π d^4/64 (uniform rod of diameter d) and κs = Ef π d^2/4, so κ = d^2/(16 l^2)"
from_words: true
inputs:
  Ef: {quantity: fiber_youngs_modulus, unit: MPa}
  d:  {quantity: fiber_diameter, unit: nm}
  l:  {quantity: crosslink_spacing, unit: um}
outputs:
  kappa: {quantity: bending_stretching_ratio, unit: dimensionless}
settings: {}
stochastic: false
