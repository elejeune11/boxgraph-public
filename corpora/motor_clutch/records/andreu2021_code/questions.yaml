  citation: {file: stretchscriptg.m, lines: "18-19", quote: "kof1 = 0.9;"}
- id: q_unbinding_rate_commented
  kind: reading
  about: [ln_kunf0_lr_code, kunf_b_lr_code, lr_rate_port]
  text: >-
    In 'loading rate script.m' both starting rates are on commented-out lines (28-29), "uncomment desired
    event"; as released the script does not run. Which line was active for which table is inferred from the
