# Ids shared with the paper's record (andreu2021) where the thing measured is the same.
- {id: stretch_amplitude, name: amplitude of the relative actin-substrate movement imposed by stretch, dimension: "[length]", description: "A (Am in stretchscriptg.m); |v| = 2 A fr"}
- {id: stretch_frequency, name: frequency of the applied stretch signal, dimension: "1/[time]"}
- {id: applied_stretch, name: applied biaxial stretch (strain of the substrate), dimension: dimensionless}
- {id: n_fibronectin, name: number of molecular clutches (fibronectin molecules) in the model, dimension: dimensionless}
- {id: integrin_binding_rate_intrinsic, name: intrinsic integrin-fibronectin binding rate (per integrin density), dimension: "[length]**2/[time]"}
- {id: clutch_stiffness, name: spring constant of one clutch, dimension: "[force]/[length]"}
- {id: substrate_stiffness, name: spring constant of the substrate in the clutch model, dimension: "[force]/[length]"}
- {id: talin_force_fraction, name: fraction of clutch force experienced by talin, dimension: dimensionless}
- {id: integrin_density, name: integrin density on the membrane, dimension: "1/[length]**2"}
- {id: integrin_density_increment, name: "integrins added per reinforcement event, per area", dimension: "1/[length]**2"}
- {id: actin_breaking_force, name: force on a clutch above which the actin cytoskeleton breaks, dimension: "[force]"}
- {id: catch_bond_prefactor, name: prefactor of one exponential term of the integrin off-rate k_off(F), dimension: "1/[time]"}
- {id: catch_bond_force_coefficient, name: force coefficient in the exponent of one term of k_off(F), dimension: "1/[force]"}
- {id: custom_term_prefactor, name: "zero-force prefactor of the term koffcb.m case 'cm' adds to k_off(F)", dimension: "1/[time]"}
- {id: custom_term_vanishing_force, name: "force at which the added 'cm' term of k_off(F) has fallen by g/0.1", dimension: "[force]"}
- {id: ln_unfolding_rate_zero_force, name: natural log of the talin unfolding rate at zero force (rate in 1/s), dimension: dimensionless}
- {id: unfolding_force_coefficient, name: force coefficient in the exponent of the talin unfolding rate, dimension: "1/[force]"}
- {id: ln_refolding_rate_zero_force, name: natural log of the talin refolding rate at zero force (rate in 1/s), dimension: dimensionless}
- {id: refolding_force_coefficient, name: force coefficient in the exponent of the talin refolding rate, dimension: "1/[force]"}
- {id: yap_baseline_offset, name: "value the code's scaling gives to the baseline integrin density (bl)", dimension: dimensionless}
- {id: yap_scaling_slope, name: "slope of the code's scaling per unit of relative integrin-density increase (sc)", dimension: dimensionless}
- {id: adhesion_radius, name: radius of the adhesion used to turn the mean force into a stress, dimension: "[length]"}
- {id: yap_ratio, name: nuclear to cytoplasmic YAP ratio, dimension: dimensionless, description: "measured; for the model, the mean integrin density scaled by bl + (d/d_min - 1) sc, as stretchscriptg.m plots it against the measured ratios"}
- {id: adhesion_length, name: focal adhesion length, dimension: "[length]", description: "measured from paxillin stainings; for the model, the YAP-axis value carried to the adhesion-length axis of Fig. 2e"}
- {id: yap_axis_at_zero_length, name: "YAP-axis value level with 0 µm on the adhesion-length axis of Fig. 2e", dimension: dimensionless}
- {id: length_per_yap_unit, name: "adhesion length per unit of YAP ratio on the twin axes of Fig. 2e", dimension: "[length]"}
- {id: loading_rate, name: loading rate on a clutch, dimension: "[force]/[time]"}
- {id: clutch_force, name: force on one clutch (starting force of a ramp), dimension: "[force]"}
- {id: corrected_unbinding_rate, name: integrin unbinding rate corrected for the loading rate, dimension: "1/[time]"}
- {id: corrected_unfolding_rate, name: talin unfolding rate corrected for the loading rate, dimension: "1/[time]"}
- {id: mean_substrate_force, name: time-averaged force on the substrate, dimension: "[force]"}
- {id: mean_traction, name: time-averaged force on the substrate per adhesion area, dimension: "[force]/[length]**2"}
- {id: mean_bound_clutches, name: time-averaged number of bound clutches, dimension: dimensionless}
