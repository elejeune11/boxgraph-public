id: single_bond_rate
name: dissociation rate of one closed bond when force F is shared by i closed bonds
role: model
stated: {page: 1, printed_page: "108102-1", quote: "with the dissociation rate k k0 eF=iFb introduced by Bell", where: text}
equation: "k = k0 e^{F/iFb}"
described_from: bell1978
inputs:
  k0: {quantity: unloaded_dissociation_rate, unit: 1/s}
  F:  {quantity: cluster_force, unit: pN}
  i:  {quantity: closed_bond_number, unit: dimensionless}
  Fb: {quantity: force_scale, unit: pN}
outputs:
  k: {quantity: loaded_dissociation_rate, unit: 1/s}
settings: {}
stochastic: false
