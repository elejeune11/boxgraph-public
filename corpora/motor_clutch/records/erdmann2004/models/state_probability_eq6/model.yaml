id: state_probability_eq6
name: state probability p_i(tau) without rebinding (gamma = 0) under force (Eq. 6)
role: model
stated: {page: 3, printed_page: "108102-3", quote: "to construct pi from pi1 , for   0 we find", where: "Eq. 6"}
equation: "p_i(τ) = (Π_{j=i+1}^{N0} r(j)) Σ_{j=i}^{N0} { Π_{k=i, k≠j}^{N0} e^{-r(j)τ} / [r(k) - r(j)] },  r(j) = j e^{f/j} (Eq. 2)"
inputs:
  N0: {quantity: cluster_size, unit: dimensionless}
  f: {quantity: force_dimensionless, unit: dimensionless}
  i: {quantity: closed_bond_number, unit: dimensionless}
  tau: {quantity: time_dimensionless, unit: dimensionless}
outputs:
  p: {quantity: state_probability, unit: dimensionless}
settings: {}
stochastic: false
