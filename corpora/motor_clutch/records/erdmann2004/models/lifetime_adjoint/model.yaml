id: lifetime_adjoint
name: mean cluster lifetime from the adjoint master equation of Eq. 1, starting from N0 closed bonds
role: model
stated: {page: 3, printed_page: "108102-3", quote: "In general, T can be calculated from the adjoint", where: text}
equation: "T = mean first passage time from i = N0 to i = 0 of Eq. 1 with r(i) = i e^{f/i}, g(i) = γ(N0 - i) (Eq. 2); τ = k0 t"
inputs:
  N0:    {quantity: cluster_size, unit: dimensionless}
  gamma: {quantity: rebinding_rate_dimensionless, unit: dimensionless}
  f:     {quantity: force_dimensionless, unit: dimensionless}
  k0:    {quantity: unloaded_dissociation_rate, unit: 1/s}
outputs:
  T: {quantity: cluster_lifetime, unit: s}
settings: {}
from_words: true
stochastic: false
