id: state_probability_eq5
name: state probability p_i(tau) for f = 0 and a reflecting boundary (Eq. 5)
role: model
stated: {page: 2, printed_page: "108102-2", quote: "ing function given by McQuarrie [11]", where: "Eq. 5"}
equation: "p_i(τ) = C(N0,i) (γ + e^{-(1+γ)τ})^i (1 - e^{-(1+γ)τ})^{N0-i} / (1+γ)^{N0}"
inputs:
  N0: {quantity: cluster_size, unit: dimensionless}
  gamma: {quantity: rebinding_rate_dimensionless, unit: dimensionless}
  i: {quantity: closed_bond_number, unit: dimensionless}
  tau: {quantity: time_dimensionless, unit: dimensionless}
outputs:
  p: {quantity: state_probability, unit: dimensionless}
settings: {}
stochastic: false
