id: mean_bonds_eq1
name: mean number of closed bonds N(tau) from the master equation Eq. 1 with an absorbing boundary, starting from N0 closed bonds
role: model
stated: {page: 2, printed_page: "108102-2", quote: "a function of time   is N  hii  N   i0 ipi", where: text}
equation: "N(τ) = Σ_{i=0}^{N0} i p_i(τ), with p_i(τ) from Eq. 1 (r(i) = i e^{f/i}, g(i) = γ(N0 - i), g(0) = 0) and p_i(0) = δ_{i,N0}; f = (f/N0) N0"
inputs:
  N0: {quantity: cluster_size, unit: dimensionless}
  gamma: {quantity: rebinding_rate_dimensionless, unit: dimensionless}
  f_over_N0: {quantity: force_per_bond_dimensionless, unit: dimensionless}
  tau: {quantity: time_dimensionless, unit: dimensionless}
outputs:
  N: {quantity: mean_closed_bond_number, unit: dimensionless}
settings: {}
built_from: [state_probability_eq1]
from_words: true
stochastic: false
