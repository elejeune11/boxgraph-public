id: cluster_size_harmonic
name: cluster size without rebinding whose lifetime H_N0 reaches a target (harmonic-number approximation)
role: model
stated: {page: 3, printed_page: "108102-3", quote: "Here HN0 are the harmonic numbers and", where: text}
equation: "T = H_N0 ≈ ln N0 + 1/(2N0) + Γ, solved for N0 at given T"
inputs:
  T: {quantity: cluster_lifetime, unit: s}
  k0: {quantity: unloaded_dissociation_rate, unit: 1/s}
  Gamma: {quantity: euler_constant, unit: dimensionless}
outputs:
  N0: {quantity: cluster_size, unit: dimensionless, scale: log10}
settings: {}
stochastic: false
