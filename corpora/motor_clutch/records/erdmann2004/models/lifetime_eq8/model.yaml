id: lifetime_eq8
name: mean cluster lifetime at zero force (Eq. 8), in seconds via tau = k0 t
role: model
stated: {page: 4, printed_page: "108102-4", quote: "be found by using Laplace transforms [10]. We find", where: "Eq. 8"}
equation: "T = 1/(1+γ) [ Σ_{n=1}^{N0} C(N0,n) γ^n / n + H_N0 ],  H_N0 = Σ_{i=1}^{N0} 1/i"
inputs:
  N0: {quantity: cluster_size, unit: dimensionless}
  gamma: {quantity: rebinding_rate_dimensionless, unit: dimensionless}
  k0: {quantity: unloaded_dissociation_rate, unit: 1/s}
outputs:
  T: {quantity: cluster_lifetime, unit: s}
settings: {}
stochastic: false
