id: cluster_size_eq8
name: smallest cluster size whose zero-force lifetime (Eq. 8) reaches a target
role: model
stated: {page: 4, printed_page: "108102-4", quote: "the same cluster lifetime T is", where: text}
equation: "T = 1/(1+γ) [ Σ_{n=1}^{N0} C(N0,n) γ^n / n + H_N0 ], solved for N0 at given T"
built_from: [lifetime_eq8]
inputs:
  T: {quantity: cluster_lifetime, unit: s}
  gamma: {quantity: rebinding_rate_dimensionless, unit: dimensionless}
  k0: {quantity: unloaded_dissociation_rate, unit: 1/s}
outputs:
  N0: {quantity: cluster_size, unit: dimensionless}
settings: {n_max: 100000}
stochastic: false
