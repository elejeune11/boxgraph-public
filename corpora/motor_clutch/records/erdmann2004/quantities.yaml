- {id: cluster_size, name: cluster size N0, dimension: dimensionless, description: number of parallel bonds (receptor-ligand pairs) in the cluster}
- {id: rebinding_rate_dimensionless, name: dimensionless rebinding rate gamma, dimension: dimensionless, description: "gamma = kon/k0"}
- {id: force_dimensionless, name: dimensionless overall force f, dimension: dimensionless, description: "f = F/Fb, the total force on the cluster in units of the force scale"}
- {id: critical_force_per_bond, name: critical force per bond fc/N0, dimension: dimensionless, description: "Bell's critical dimensionless force divided by cluster size"}
- {id: force_scale, name: single-bond force scale Fb, dimension: "[force]", description: "Fb = kB T / xb"}
- {id: critical_force, name: critical overall force Fc on a cluster, dimension: "[force]", description: dimensional total force on the cluster at Bell's stability limit}
- {id: transition_state_distance, name: distance xb to the transition state, dimension: "[length]", description: distance between potential minimum and transition state along the rupture coordinate}
- {id: temperature, name: temperature, dimension: "[temperature]"}
- {id: unloaded_dissociation_rate, name: single-bond dissociation rate k0 at zero force, dimension: "1/[time]"}
- {id: association_rate, name: single-bond association (rebinding) rate kon, dimension: "1/[time]"}
- {id: cluster_lifetime, name: mean cluster lifetime T, dimension: "[time]", description: "mean first passage time to the completely dissociated state i = 0, starting from N0 closed bonds"}
- {id: bond_number_decay_rate, name: decay rate a of the mean number of closed bonds, dimension: dimensionless, description: "rate a in N(tau) ~ Neq exp(-a tau), in units of k0"}
- {id: euler_constant, name: "Euler's constant Gamma", dimension: dimensionless}
- {id: cluster_force, name: constant overall force F on the cluster, dimension: "[force]", description: "F, shared equally between the i closed bonds"}
- {id: closed_bond_number, name: number i of closed bonds, dimension: dimensionless}
- {id: time_dimensionless, name: dimensionless time tau, dimension: dimensionless, description: "tau = k0 t"}
- {id: state_probability, name: state probability p_i, dimension: dimensionless, description: "probability that i bonds are closed at time tau"}
- {id: mean_closed_bond_number, name: mean number N of closed bonds, dimension: dimensionless, description: "N(tau) = <i> = sum_i i p_i(tau)"}
- {id: force_per_bond_dimensionless, name: dimensionless force per bond f/N0, dimension: dimensionless, description: "the overall dimensionless force f divided by the cluster size N0"}
- {id: cluster_lifetime_dimensionless, name: dimensionless mean cluster lifetime T, dimension: dimensionless, description: "mean first passage time to i = 0 from N0 closed bonds, in units of 1/k0 (as plotted in Fig. 4)"}
- {id: loaded_dissociation_rate, name: dissociation rate k of one closed bond under force, dimension: "1/[time]", description: "k = k0 e^{F/iFb}"}
