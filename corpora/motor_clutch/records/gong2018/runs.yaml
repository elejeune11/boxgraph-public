# The mean-field runs all use the Table S1 parameters and the mean-field Fb = 1.3 pN (SI p. 11).
- id: run_fig1_params
  model: mean_field_sls
  inputs: {nm: nm_tableS1, Fm: Fm_tableS1, Fcr: Fcr_tableS1, nc: nc_tableS1, Fb: Fb_meanfield, ron0: ron0_tableS1,
           roff0: roff0_tableS1, kc: kc_tableS1, vu: vu_tableS1, Vp: Vp_tableS1, alpha: alpha_tableS1,
           ka: ka_fig1, kl: kl_fig1, eta: eta_fig1}
  outputs: {Vs: vs_fig1_params, t_life: tlife_fig1_params, Fa: fa_fig1_params}
  note: "the typical set of Fig. 1C-D; Fig. 1D shows t_life and the mean Vs only as a plotted trace (not read)"
- id: run_fig1b_reinf
  model: mean_field_elastic
  inputs: {nm: nm_tableS1, Fm: Fm_tableS1, Fcr: Fcr_tableS1, nc: nc_tableS1, Fb: Fb_meanfield, ron0: ron0_tableS1,
           roff0: roff0_tableS1, kc: kc_tableS1, vu: vu_tableS1, Vp: Vp_tableS1, alpha: alpha_tableS1}
  sweep: {ks: vs_fig1b_reinf}
  outputs: {Vs: vs_fig1b_reinf_pred}
- id: run_fig1b_noreinf
