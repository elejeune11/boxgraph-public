id: relative_increase
name: relative increase of one spreading speed over another
role: processing
stated: {page: 13, quote: "the cell spreading speed increases by only 4%", where: "text, SI p. 3"}
equation: "increase = (V2 - V1) / V1"
inputs:
  V1: {quantity: spreading_speed, unit: nm/s}
  V2: {quantity: spreading_speed, unit: nm/s}
outputs:
  increase: {quantity: relative_speed_increase, unit: percent}
