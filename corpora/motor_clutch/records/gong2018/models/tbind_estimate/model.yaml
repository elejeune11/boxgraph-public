id: tbind_estimate
name: binding time of a stable FA, estimated by assuming most clutches become engaged
role: model
stated: {page: 12, quote: "clutches become engaged) as tbind ≈ lnðNc Þ=ron (3)", where: "SI p. 2 (ref. 3 = Bangasser & Odde 2013)"}
equation: "tbind ≈ ln(Nc)/ron"
inputs:
  Nc:  {quantity: clutch_number, unit: dimensionless}
  ron: {quantity: clutch_on_rate, unit: 1/s}
outputs:
  tbind: {quantity: fa_binding_time, unit: s}
settings: {}
stochastic: false
# A helper model for the relator: the paper states this estimate in words, citing SI ref. 3
# (bangasser2013b), and uses it only to argue tbind ∝ tau_b; it prints no value from it.
