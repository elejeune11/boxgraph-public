id: lifetime_timescale
name: FA lifetime timescale
role: model
stated: {page: 5, quote: "identified as τl = Fm Nm =vu kl", where: "text p. 5; SI p. 12"}
equation: "tau_l = Fm Nm / (vu kl)"
inputs:
  Fm: {quantity: motor_stall_force, unit: pN}
  Nm: {quantity: motor_number, unit: dimensionless}
  vu: {quantity: unloaded_flow_velocity, unit: nm/s}
  kl: {quantity: long_term_stiffness, unit: pN/nm}
outputs:
  tau_l: {quantity: lifetime_timescale, unit: s}
