# cross-record validation against elosegui2016 (2026-11-02): none added
- id: q_xval_elosegui2016_none
  kind: unstated_model
  about: [mean_field_elastic, mean_field_sls, bell_off_rate, Fcr_tableS1]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    elosegui2016 (ref. 20, SI ref. 4). The paper cites it only for integrin recruitment via talin
    unfolding (p. 2) and for adjusting Fcr (Table S1); it does not say its model explains or is
    compared with any of its data. elosegui2016 measures traction stress, actin retrograde flow,
    adhesion lengths, YAP ratios and fibronectin-integrin bond lifetimes. The mean-field models here
    output the spreading speed Vs = Vp - Vf, the cycle duration and the mean clutch force Fa: Vs is
    not the retrograde flow (only related to it through Eq. 6, which no model here outputs as a
    flow), and Fa, a force per ensemble clutch, is not a traction stress (a conversion would need an
    adhesion area and clutch counting this paper does not state). bell_off_rate gives an off-rate,
    not a lifetime, with the generic Table S1 slip-bond roff0 and Fb, not the measured
    fibronectin-a5b1 catch bond of elosegui2016 Fig. 3a. So no model here, run on those conditions,
    gives a measured quantity of elosegui2016.
  citation: {page: 2, quote: "adhesion complex via talin unfolding (20, 21)", where: text}
