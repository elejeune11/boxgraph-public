- {id: motor_number, name: number of myosin motors, dimension: dimensionless, description: "nm (Nm) in Table S1, Eqs. 4, S6"}
- {id: motor_stall_force, name: myosin stall force per motor, dimension: "[force]", description: "Fm"}
- {id: reinforcement_threshold_force, name: threshold average clutch force for reinforcement, dimension: "[force]", description: "Fcr"}
- {id: clutch_number, name: number of clutches, dimension: dimensionless, description: "nc"}
- {id: clutch_rupture_force, name: characteristic breakage force of a clutch, dimension: "[force]", description: "Fb in roff = roff0 exp(Fc/Fb)"}
- {id: clutch_on_rate, name: clutch binding rate, dimension: "1/[time]", description: "ron0, the unreinforced binding rate"}
- {id: clutch_off_rate_unloaded, name: zero-force clutch dissociation rate, dimension: "1/[time]", description: "roff0"}
- {id: clutch_stiffness, name: clutch spring constant, dimension: "[force]/[length]", description: "kc"}
- {id: unloaded_flow_velocity, name: unloaded retrograde flow velocity, dimension: "[length]/[time]", description: "vu"}
- {id: polymerization_speed, name: actin polymerization speed, dimension: "[length]/[time]", description: "Vp"}
- {id: reinforcement_sensitivity, name: integrin density increment rate per unit clutch force, dimension: "1/[force]", description: "alpha"}
- {id: substrate_stiffness, name: stiffness of a purely elastic substrate (spring constant), dimension: "[force]/[length]", description: "ks / k in Fig. 1B; also the spring constant of Eq. S9"}
- {id: long_term_stiffness, name: long-term (equilibrium) substrate stiffness, dimension: "[force]/[length]", description: "kl"}
- {id: additional_stiffness, name: additional stiffness of a Maxwell element, dimension: "[force]/[length]", description: "ka, ka,i"}
- {id: substrate_viscosity, name: dashpot viscosity of a Maxwell element, dimension: "[force]*[time]/[length]", description: "eta, eta_i"}
- {id: relaxation_timescale, name: substrate relaxation timescale of a Maxwell element, dimension: "[time]", description: "tau_s,i = eta_i / ka,i"}
- {id: spreading_speed, name: mean cell spreading speed over a clutch life cycle, dimension: "[length]/[time]", description: "Vs = Vp - Vf"}
- {id: fa_lifetime, name: duration of one clutch formation-breakage cycle, dimension: "[time]", description: "t_life"}
- {id: mean_clutch_force, name: average clutch force over a life cycle, dimension: "[force]", description: "Fa"}
- {id: binding_timescale, name: clutch binding timescale, dimension: "[time]", description: "tau_b = 1/ron"}
- {id: lifetime_timescale, name: FA lifetime timescale, dimension: "[time]", description: "tau_l = Fm Nm / (vu kl)"}
- {id: contact_radius, name: contact radius of an adhesion, dimension: "[length]", description: "R in Eq. S9"}
- {id: elastic_modulus, name: substrate elastic modulus, dimension: "[force]/[length]**2", description: "E in Eq. S9; the modulus a stiffness is converted to"}
- {id: poisson_ratio, name: substrate Poisson ratio, dimension: dimensionless, description: "nu"}
- {id: spring_constant_coefficient, name: spring constant divided by R E (Eq. S9), dimension: dimensionless}
- {id: relative_speed_increase, name: relative increase of spreading speed between two simulations, dimension: dimensionless}
- {id: fa_characteristic_length, name: characteristic length of a focal adhesion used to convert modulus to stiffness, dimension: "[length]", description: "r = 2R (SI p. 2); r in Table S1"}
# second pass (figures)
- {id: initial_substrate_stiffness, name: initial (instantaneous) stiffness of a standard linear solid substrate, dimension: "[force]/[length]", description: "ka + kl"}
- {id: timescale_ratio_s_b, name: ratio of the substrate relaxation timescale to the clutch binding timescale, dimension: dimensionless, description: "tau_s/tau_b (Fig. 3A)"}
- {id: cell_spreading_area, name: projected spreading area of a cell, dimension: "[length]**2", description: "measured or predicted (Rss = R0 + Vs tau_ss); Figs. 4D, 5D, 6D-E, S5A, S5C"}
- {id: gel_relaxation_stiffness, name: measured stiffness of a gel during a stress-relaxation test, dimension: "[force]/[length]", description: "relaxation stiffness k(t), pN/nm (Figs. 4B, 5B)"}
- {id: time_after_loading, name: time since the strain step of a stress-relaxation test, dimension: "[time]", description: "t in Figs. 4B, 5B, S6A"}
- {id: normalized_relaxation_stiffness, name: relaxed stiffness of a gel divided by its initial stiffness, dimension: dimensionless, description: "Fig. S6A"}
- {id: relaxation_spectrum_height, name: height of the relaxation time spectrum H(tau) of a gel, dimension: dimensionless, description: "H(tau) of the generalized Maxwell fit (Figs. 4C, 5C, S6B, S8B-C)"}
- {id: initial_substrate_modulus, name: initial (instantaneous) modulus of a viscoelastic or elastic gel, dimension: "[force]/[length]**2", description: "ka + kl as a modulus, kPa (Fig. 6D-E)"}
- {id: long_term_modulus, name: long-term (relaxed) modulus of a gel, dimension: "[force]/[length]**2", description: "kl as a modulus, kPa (Fig. S5)"}
- {id: category_position, name: "position of a bar among the named categories of a bar chart, counted from 0 at the left", dimension: dimensionless, description: "used only to index bars whose categories are names, not numbers (Fig. S8B-C left: 0 Elastic, 1 Effective timescale, 2 Multiple timescales)"}
- {id: fa_binding_time, name: time for most clutches of an FA to become engaged, dimension: "[time]", description: "tbind ≈ ln(Nc)/ron (SI p. 2, after ref. 3)"}
- {id: clutch_force, name: force on one engaged clutch, dimension: "[force]", description: "Fc,i = kc (xc,i - xs) (p. 2)"}
- {id: clutch_off_rate_loaded, name: dissociation rate of a clutch under force, dimension: "1/[time]", description: "roff,i = roff0 exp(Fc,i/Fb) (p. 2, after ref. 27)"}
