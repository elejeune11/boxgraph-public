notes: >
  Scope: the quantitative core of the article (PDF pp. 1-10) and its Supporting Information (pp. 11-20).
  The central model is the mean-field ("ensemble clutch") motor-clutch model on a viscoelastic substrate,
  Eqs. 1-6 / S3-S8 with the standard linear solid (Eq. 2 / S4), the generalized Maxwell substrate
  (Eqs. S11-S12) and the clutch reinforcement rule (p. 2; SI p. 11), with the Table S1 parameters and the
  mean-field Fb = 1.3 pN (SI pp. 11, 13). It is entered as one model (mean_field_sls) with two wrappers
  (mean_field_elastic for ka = 0, Fig. 1B; mean_field_maxwell2 for two Maxwell elements, Fig. S8D).
  The paper leaves several parts of the algorithm unstated, and each is a numerical setting with a
  'choice' question: when a cycle ends (Pb below one clutch in nc, 1/75), how Fa is averaged (time
  average of the ensemble clutch force over the cycle), whether reinforcement compounds from cycle to
  cycle (taken as cumulative, ron <- ron (1 + alpha (Fa - Fcr)), the reading under which the lifetime
  "gradually increase[s] and even diverge[s]", p. 3), that each cycle starts from a substrate at rest,
  and the cap t_max on a stable (divergent) adhesion. With these, the model gives the paper's elastic
  low-stiffness plateau and the Fig. 2B / S8D low-viscosity values closely; it reaches the reinforced
  saturation at a somewhat higher stiffness than Fig. 1B, and at high viscosity with ka = 2 it settles
  near 100 nm/s where Fig. 2B shows ~118 nm/s (findings, see the comparisons and questions).
  Results compared: Fig. 1B (both curves), Fig. 2B (three curves), Fig. S8D (three curves), all read by
  the record's own figure code (figures/, figures.md); tau_b and tau_l (closed forms, p. 5) against their
  printed values (p. 7, p. 8); Eq. S9 and the 1 pN/nm = 1 kPa conversion (pp. 4, 12); the 4% increase
  printed with Fig. S8B (p. 13).
  Left out: the KMC (Gillespie) simulation, which produces only plotted single trajectories (Fig. 1C-D,
  S1C-D, S2B-D, S3A-B) and the KMC curve of Fig. S1A (not read); the spreading-area model (Eqs. S1-S2,
  Rss = R0 + Vs tau_ss) and every result that rests on substrate parameters taken from the relaxation
  spectra (Figs. 4-6, S5-S8B/C: 97.2, 101.1, 74.6, 75.4 nm/s), because the effective ka, kl, eta of each
  gel and the fitted tau_ss are not printed as numbers (questions q_gel_params, q_area_model); the heat
  maps (Figs. 2A, 2C, 3B, 4E, 5E, 6A-C, S3C, S5B), which carry colour, not readable values; Fig. 3A/C
  (not read in this pass); the Fig. S4 tables, whose low/medium/high levels of kl and eta are not given
  as numbers (q_figS4_levels); the experimental measurements (Figs. 4D, 5D, 6D, S5A, S7 points) and the
  relaxation data (Figs. 4B, 5B, S6), which no model in this record predicts (listed in figures.md);
  Methods numbers (gel recipes, cell culture) that feed no model.
