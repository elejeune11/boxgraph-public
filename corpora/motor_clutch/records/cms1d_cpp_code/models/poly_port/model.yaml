# Port to Python (our code) of the polymerization step, Cell1DPublish.cpp line 411. The code computes a
# distance, the speed times dt; the port returns the speed (the distance per unit dt).
id: poly_port
name: "the code's actin polymerization speed of an uncapped module (Cell1DPublish.cpp line 411, Python port)"
role: model
stated: {file: Cell1DPublish.cpp, lines: "411", quote: "double poly = maxpoly_ *PolyFactor* (double(free_actin_) / double(total_actin_pool_)) * dt;"}
described_from: prahl2020
equation: "poly / dt = maxpoly_ PolyFactor free_actin_ / total_actin_pool_"
inputs:
  vmax:       {quantity: actin_polymerization_velocity_max, unit: nm/s}
  PolyFactor: {quantity: polymerization_factor, unit: dimensionless}
  AG:         {quantity: g_actin_pool_length, unit: nm}
  Atotal:     {quantity: total_actin_length, unit: nm}
outputs:
  vactin: {quantity: actin_polymerization_velocity, unit: nm/s}
settings: {}
stochastic: false
