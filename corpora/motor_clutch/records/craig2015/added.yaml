- id: width_added
  quantity: lamellipodium_width
  unit: um
  printed: "3"
  basis: >
    The Discussion's tension estimate (p. 12) uses the lamellipodial width "measured in [14]" without
    printing it; 3 um is the middle of the "2-4 um" at which the paper says the lamellum begins (p. 2).
  alternatives: ["2", "4"]
  stands_for: "lamellipodial width X in 'average traction stress multiplied by the lamellipodial width' (p. 12)"
- id: gradient_added
  quantity: flow_gradient
  unit: 1/s
  printed: "0.005"
  basis: >
    The Discussion's viscosity estimate (p. 12) uses the flow-rate gradient "measured in [14]" without
    printing it. 0.005 /s is the drop from the ~20 nm/s leading-edge flow (p. 8) to the ~2 nm/s lamellar
    flow (p. 8) over the ~3-4 um lamellipodium, roughly (20 - 2) nm/s / 3.5 um.
  alternatives: ["0.0025", "0.01", "0.02"]
  stands_for: "flow rate gradient dV/dx at the leading edge (p. 12)"
- id: lam_S3_added
  quantity: viscosity_parameter
  unit: dimensionless
  printed: "3"
  basis: >
    The caption of supplemental figure 3 (p. 18) gives F, b, v* and gamma but not lambda. 3 is the
    default of the main text's Fig. 4 and of supplemental figure 4 ("lambda = 3", pp. 10, 18). With
    v* = 3 adhesion hardly weakens, so V~ ~ exp(-x / sqrt(lambda)) roughly, and the drawn V~(2 um) ~ 0.36
    is consistent with lambda near 3.
  alternatives: ["1", "2", "4"]
  stands_for: "lambda in the runs of supplemental figure 3"
- id: vstar_large_added
  quantity: flow_weakening_parameter
  unit: dimensionless
  printed: "1000"
  basis: >
    Fig. 4(g), (h) are drawn "in the absence of actin-flow-dependent adhesion weakening (by setting
    v* >> 1)" (p. 10) without the value used. Since V~ <= 1, exp(-V~/v*) >= 0.999 at v* = 1000, i.e. no
    weakening to the drawing's precision.
  alternatives: ["10", "100", "1e6"]
  stands_for: "v* in the runs of Fig. 4(g), (h)"
- id: vstar_S3_alt
  quantity: flow_weakening_parameter
  unit: dimensionless
  printed: "0.3"
  basis: >
    Alternative to the captioned v* = 3 of supplemental figure 3 (p. 18), which question q_S3_vstar suspects
    is a misprint for 0.3: the text (v* ~ 0.3, p. 7) and every other figure use 0.3. Used only in the
    alternative runs run_figS3a_*_alt, never in place of the printed value.
  alternatives: ["3"]
  stands_for: "v* in the alternative runs of supplemental figure 3(a)"
- id: lam_S3_alt
  quantity: viscosity_parameter
  unit: dimensionless
  printed: "1"
  basis: >
    Supplemental figure 3 does not state lambda. With v* = 0.3 (vstar_S3_alt) and F = b = 0 the model is the
    one of supplemental figure 2, whose lambda = 1 curves (p. 21) have the traction peak of about 0.11 at
    x ~ 2 um that supplemental figure 3(a) shows; lambda = 1 is the value that pairs with that v*.
  alternatives: ["2", "3"]
  stands_for: "lambda in the alternative runs of supplemental figure 3(a)"
- id: lam_fig4def_alt
  quantity: viscosity_parameter
  unit: dimensionless
  printed: "1"
  basis: >
    Alternative to the captioned lambda = 3 for Fig. 4(d)-(f) (p. 10). Question q_fig4def_lambda found that
    Fig. 4(f) at F = 0 matches the model at lambda ~ 1, not 3; the profiles of Fig. 4(d), (e) are run at both.
    Used only in the alternative runs run_fig4d_*_lam1 and run_fig4e_*_lam1.
  alternatives: ["3", "2"]
  stands_for: "lambda in the alternative runs of Fig. 4(d), (e)"
