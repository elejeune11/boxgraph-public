    The captions differ only in v* (3 for supplemental figure 3, 0.3 for supplemental figure 2) and in lambda
    (unstated for figure 3, 1 for this curve of figure 2); F = b = 0 and gamma = 1000 in both. The comparison
    asks whether the drawn figure 3(a) traction is the figure 2 lambda = 1 curve (question q_S3_figure_vstar).
