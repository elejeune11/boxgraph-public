id: network_displacement
name: actin network displacement over a time interval at a given flow speed (Appendix D, Section 2)
role: model
stated: {page: 14, quote: "On the relevant time scale of 10 s, the actin", where: "Appendix D"}
equation: "displacement = V t"
inputs:
  V: {quantity: actin_flow_speed, unit: nm/s}
  t: {quantity: time_interval, unit: s}
outputs:
