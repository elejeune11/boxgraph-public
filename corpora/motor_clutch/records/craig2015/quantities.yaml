# Quantities of craig2015. Dimensionless model quantities are the paper's rescaled variables (Eqs. 5-9, p. 7).
- {id: distance_from_leading_edge, name: distance from the cell leading edge, dimension: "[length]", description: "x in Eqs. 1-9; x = L0 x~ with L0 = 1 um"}
- {id: traction_peak_location, name: distance of the traction peak from the leading edge, dimension: "[length]", description: "where the steady-state traction T(x) is largest"}
- {id: scaled_flow_speed, name: actin retrograde flow speed in units of V0, dimension: dimensionless, description: "V~ = V / V0, V0 = V(x = 0)"}
- {id: scaled_traction, name: traction stress in units of T0, dimension: dimensionless, description: "T~ = T / T0"}
- {id: peak_flow_over_vstar, name: actin flow speed at the traction peak in units of v*, dimension: dimensionless, description: "V~ at the traction peak divided by v*"}
- {id: viscosity_parameter, name: dimensionless actin viscosity lambda, dimension: dimensionless, description: "lambda = mu V0 / (T0 L0^2)"}
- {id: myosin_strength_parameter, name: dimensionless myosin strength F, dimension: dimensionless, description: "F = f m_on / (T0 L0 m_off)"}
- {id: strengthening_parameter, name: dimensionless myosin-dependent adhesion strengthening b, dimension: dimensionless, description: "b = beta T0"}
- {id: flow_weakening_parameter, name: dimensionless characteristic flow speed of adhesion weakening v*, dimension: dimensionless, description: "v* = V* / V0"}
- {id: myosin_detachment_parameter, name: dimensionless myosin transport-to-detachment ratio gamma, dimension: dimensionless, description: "gamma = V0 / (m_off L0)"}
- {id: traction_stress_scale, name: characteristic traction stress, dimension: "[force]/[length]**2", description: "T0; also the average traction stress T-bar of the Discussion"}
- {id: length_scale, name: length scale of the rescaled model, dimension: "[length]", description: "L0"}
- {id: leading_edge_flow_speed, name: actin flow speed at the leading edge, dimension: "[length]/[time]", description: "V0 = V(0)"}
- {id: actin_flow_speed, name: characteristic actin flow speed, dimension: "[length]/[time]"}
- {id: time_interval, name: a time interval, dimension: "[time]"}
- {id: network_displacement, name: displacement of the actin network, dimension: "[length]"}
- {id: drag_scale, name: traction-based drag scale T0 L0^2 / V0, dimension: "[force]*[time]/[length]"}
- {id: actin_network_viscosity, name: viscosity of the actin network (bulk), dimension: "[force]*[time]/[length]**2", description: "as measured, before multiplying by the lamellipodial thickness"}
- {id: lamellipodium_thickness, name: thickness of the lamellipodium, dimension: "[length]"}
- {id: actin_turnover_rate, name: rate of actin turnover, dimension: "1/[time]", description: "r in Appendix D"}
- {id: transport_parameter, name: dimensionless actin transport term epsilon, dimension: dimensionless, description: "epsilon = V0 / (r L0), Appendix D"}
- {id: lamellipodium_width, name: width of the lamellipodium (distance of the lamellipodium-lamellum boundary from the leading edge), dimension: "[length]"}
- {id: membrane_tension, name: "membrane tension (1D, per unit length of edge)", dimension: "[force]/[length]"}
- {id: flow_gradient, name: gradient of the actin flow speed at the leading edge, dimension: "1/[time]", description: "dV/dx at x = 0"}
- {id: lamellar_flow_speed, name: actin flow speed in the lamella, dimension: "[length]/[time]"}
- {id: hill_max_flow_speed, name: maximal lamellar flow speed in Eq. 11, dimension: "[length]/[time]", description: "Vmax"}
- {id: hill_force_constant, name: force constant in Eq. 11, dimension: "[force]", description: "Fk"}
- {id: total_traction_force, name: total traction force of a cell, dimension: "[force]"}
- {id: inhibitor_condition, name: position of a Y-27632 condition on a categorical axis, dimension: dimensionless, description: "1 = WT (untreated), 2 = 2 uM, 3 = 5 uM, 4 = 10 uM Y-27632 (Fig. S1(a), (b))"}

# second pass: fields of the model plotted in the supplemental profile panels
- {id: scaled_myosin_density, name: myosin density in units of M0, dimension: dimensionless, description: "M~ in Eqs. 5-9 (all myosin bound to actin)"}
- {id: scaled_myosin_gradient, name: gradient of the scaled myosin density, dimension: dimensionless, description: "dM~/dx~ (supplemental figure 3(c))"}
- {id: scaled_adhesion_density, name: adhesion density in units of N0, dimension: dimensionless, description: "N~adh in Eqs. 5-9"}
- {id: scaled_myosin_force, name: myosin force density in units of T0, dimension: dimensionless, description: "F~myo = F dM~/dx~"}
- {id: scaled_viscous_force, name: internal viscous force density in units of T0, dimension: dimensionless, description: "lambda d2V~/dx~2, equal to T~ - F~myo by Eq. 5"}
- {id: paxillin_intensity_rel_max, name: paxillin fluorescence intensity relative to its maximum, dimension: dimensionless, description: "measured adhesion marker profile along the distance from the leading edge (Fig. 2(d))"}
- {id: myosin_intensity_rel_max, name: myosin fluorescence intensity relative to its maximum, dimension: dimensionless, description: "measured myosin profile along the distance from the leading edge (Fig. 2(d))"}
- {id: traction_stress, name: traction stress at a point of the cell, dimension: "[force]/[length]**2", description: "local traction T(x) (supplemental figure 1(e), Fig. 3)"}
- {id: adhesion_density_rel_max, name: adhesion density relative to its maximum, dimension: dimensionless, description: "model adhesion density N~adh divided by its largest value along x (Fig. 3, right)"}
