- id: q_eq10_derivation
  kind: reading
  about: [uniform_flow_eq10, cmp_eq10_vs_full]
  text: >
    Eq. 10 follows from Eq. 9 with T~ = F~myo = F only if exp(-V~/v*) is close to 1 (V0 << V*) and
    dM~/dx~ is close to 1 in the lamella; the second condition is not stated. The comparison
    cmp_eq10_vs_full shows how far Eq. 10 is from the full model at the paper's own U2OS fit parameters.
  citation: {page: 10, quote: "steady-state traction distribution (equation (9)) yields", where: "Eq. 10"}
- id: q_L0_two_values
  kind: reading
  about: [L0_model, L0_eps]
  text: >
    L0 is fixed at 1 um in the rescaling of the main text (p. 7) but is called the lamellipodial length and
    set to 2 um in the estimate of epsilon in Appendix D (p. 14). The record keeps both as printed.
  citation: {page: 14, quote: "parameter ε ~ 0.02 μm s−1 / 0.1 s−1 × 2 μm ~ 0.1", where: "Appendix D"}
- id: q_viscosity_units
  kind: reading
  about: [viscosity_printed, tension_viscosity]
  text: >
    The Discussion predicts "a viscosity value of mu ~ 10^3 pN s um^-2", with the units of a bulk viscosity,
    while mu in Eq. 1 is the viscosity times the lamellipodial thickness (p. 8). The record reads the printed
    value as a bulk viscosity and divides by the thickness (~1 um), which does not change the number.
  citation: {page: 12, quote: "to predict a viscosity value of μ ∼ 103 pN s μm−2", where: Discussion}
- id: q_discussion_inputs
  kind: unstated_input
