  citation: {page: 11, quote: "but the highest concentrations of Y-27632 compound", where: "Section 3.4"}
- id: q_S2c_near_edge
  kind: unexplained_difference
  about: [cmp_figS2c_lam1, cmp_figS2c_lam3, cmp_figS2c_lam4]
  text: >
    The traction curves of supplemental figure 2(c) reproduce at their peaks (height v*/e, as the paper states,
    at the right place) but lie a few percent above the model near the leading edge (x <= 1 um) and, for
    lambda = 1, in the far tail. With F = b = 0 the model reduces to lambda V'' = exp(-V/v*) V, so only the
