- id: q_fmyo_analytic
  kind: possible_error
  about: [uniform_flow_eq10, clutch_profile]
  text: >
    Section 3.3 (p. 10) gives, for slow uniform flow, M~ = 1 - exp(-x~/(gamma V~)) from Eq. 7 and "the resulting
    myosin contractile force" F~myo = F exp(-x~/(gamma V~)). By Eq. 6, F~myo = F dM~/dx~ =
    (F / (gamma V~)) exp(-x~/(gamma V~)); the printed expression lacks the factor 1/(gamma V~). The same
    paragraph's "T~ = F~myo ~ F" (used for Eq. 10) also needs dM~/dx~ ~ 1, which this M~ does not give for
    gamma >> 1 (see q_eq10_derivation). No printed number depends on it.
  citation: {page: 10, quote: "and the resulting myosin con-", where: "Section 3.3"}
