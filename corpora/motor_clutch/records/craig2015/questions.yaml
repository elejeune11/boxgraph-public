- id: q_fig4def_lambda
  kind: possible_error
  about: [d_fig4f_peak, d_fig4f_peak_F0, d_fig4c_peak_F0, cmp_fig4f_vs_fig4c_F0, cmp_fig4f_peak]
  text: >
    The Fig. 4 caption gives lambda = 3 for all panels "unless otherwise stated", and (d)-(f) are "Same as
    (a)-(c), except ... b = 0". At F = 0 the myosin terms vanish, so the F = 0 points of Fig. 4(c) and
    Fig. 4(f) should coincide; they do not (Fig. 4(f) puts the F = 0 peak much closer to the leading edge,
    and the F = 0 flow curve of Fig. 4(d) falls off faster than that of Fig. 4(a)). The Fig. 4(f) value at
    F = 0 lies near the lambda = 1 point of supplemental figure 2(a), which suggests panels (d)-(f) were
    computed with a lower lambda than the caption states.
  citation: {page: 10, quote: "as a function of F. (d)–(f) Same as (a)–(c), except", where: "Fig. 4 caption"}
- id: q_adhesion_bc
  kind: possible_error
  about: [clutch_profile, d_figS2c_lam1, d_figS2c_lam2, d_figS2c_lam3, d_figS2c_lam4]
  text: >
    The paper states the boundary condition Nadh(0) = 0 (p. 6), but the traction curves of Fig. 4(e) and
    supplemental figure 2(c) and the adhesion density of supplemental figure 2(e) start from a non-zero
    value at x = 0, as if Nadh(0) followed the bulk expression exp(-V~/v*) with V~ = 1. The record's model
    applies the stated condition; at x = 0 only T~ is affected, and no reading is taken at x = 0.
  citation: {page: 6, quote: "condition Nadh (0) = 0. The parameter β characterizes", where: text}
- id: q_numerics_scheme
  kind: numerics
  about: [clutch_profile, clutch_peak]
  text: >
    The paper solves the time-dependent equations with explicit time stepping and first-order upwind
    advection on 40 segments until steady state (p. 8), but does not give the time step, the stopping
    criterion, the difference used for dM/dx in the myosin force and adhesion terms, or how the traction
    peak is located (grid node or interpolated). The record solves the steady equations of the same
    upwind discretisation directly, uses central differences for dM/dx (setting dM_scheme) and the grid
    node of largest traction (setting peak); both are run settings and can be changed.
  citation: {page: 8, quote: "40 equal segments, and the time steps were set sufﬁ-", where: "Section 2.2"}
- id: q_neumann_choice
  kind: choice
  about: [clutch_profile, clutch_peak, cmp_figS2b_lam4, cmp_figS2c_lam1, cmp_figS2c_lam3]
  text: >
    How the far-end condition dV/dx(L) = 0 is discretised is not stated. The record first used a
    second-order ghost node, which put the plotted flow and traction near x = 8 um below the curves of
    supplemental figure 2(b), (c); a first-order condition (V at the last node equal to V at the one before)
    matches those tails much better, so it was chosen after comparing with the figures and is the setting
    `neumann: first_order`. Both schemes tend to the same limit as the grid is refined (refinement
    ref_figS2b_lam3), so the plotted tail values depend on the paper's numerics, not on the model.
  citation: {page: 6, quote: "L = 8 μm from the leading edge", where: text}
- id: q_S4a_numerics
  kind: numerics
  about: [cmp_figS4a_peak, cmp_figS4a_peak_bwd, ref_figS4a_peak, ref_figS4a_peak_bwd, d_figS4a_peak]
  text: >
    At the paper's 40-segment grid the traction-peak locations of supplemental figure 4(a) depend on how
    dM/dx is differenced. With central differences the computed peaks lie 0.3-0.7 um closer to the leading
    edge than the plotted ones for b >= 40; with backward differences they agree with the figure up to
    b = 130, but at b = 140-150 that scheme gives an unphysical steady state (negative flow at the peak,
    since 1 + b F dM/dx can turn negative). Refined grids settle on values between the two. The plotted
    curve at large b therefore reflects the paper's discretisation rather than Eqs. 5-9 alone.
- id: q_hill_curve
  kind: possible_error
  about: [Fk_fit, Vmax_fit, d_figS1c_fit, cmp_hill_curve]
  text: >
    The fit curve drawn in supplemental figure 1(c) lies above Eq. 11 evaluated with the printed
    Vmax = 6.6 nm/s and Fk = 23 nN at every force read (by much more than the reading precision at low
