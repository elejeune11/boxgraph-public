  citation: {page: 17, quote: "Fk=23nN). (d) Model fit (black line)", where: "Supplemental figure 1 caption"}
- id: q_hill_points
  kind: overstated_claim
  about: [cmp_hill_points, d_figS1c_points]
  text: >
    Eq. 11 with the printed fit parameters passes through three of the four measured points but not the
    lowest-force point (10 uM Y-27632), where the measured flow is far below the curve. The text does say the
    flow is unchanged "for all but the highest concentrations" (p. 11); the caption still calls the curve a fit
