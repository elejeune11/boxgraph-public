# ---- Linear_KD_WT_model.m as written: the linear KD set ------------------------------------------
- id: run_lkd_fig2c
  model: linear_port
  inputs: &lkd {a_1: a1_lkd, a_2: a2_lin, v0: v0_lin, Fst: Fst_lin, sigma_m: sm_lkd, sigma_c: sc_lin, kc: kc_lkd, kon: kon_lkd, l_yield: ly_lkd, k_off_1: koff1_lin, k_off_2: koff2_lin, F_d_1: Fd1_lin, F_d_2: Fd2_lin}
  sweep: {E: P_KD_fig2c_paper}
  outputs: {P: P_lkd_fig2c_port}
- id: run_lkd_fig2d
  model: linear_port
  inputs: *lkd
  sweep: {E: v_KD_fig2d_paper}
  outputs: {v: v_lkd_fig2d_port}
- id: run_lkd_ed5a_sm71
  model: linear_port
  inputs: *lkd
  sweep: {E: P_KD_sm71_ed5a_paper}
  outputs: {P: P_lkd_sm71_port}
