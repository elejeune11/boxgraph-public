# ---- talin_WT_model.m as written ------------------------------------------------------------------
- id: run_tw_Emax
  model: talin_wt_port
  inputs: &tw {E: Emax_tw, a_1: a1_tw, a_2: a2_tw, v0: v0_tw, Fst: Fst_tw, sigma_m: sm_tw, sigma_c: sc_tw, kon: kon_tw, k_off_1: koff1_tw, k_off_2: koff2_tw, F_d_1: Fd1_tw, F_d_2: Fd2_tw, kB: kB_tw, T: T_tw, ku0: ku0_tw, kf0: kf0_tw, x_u: xu_tw, Lp: Lp_tw, L: L_tw, Ng: Ng_tw, N_integrin: Nint_tw, b: b_tw, alpha: alpha_tw}
  outputs: {F_f: Ff_tw_Emax_port, F_u: Fu_tw_Emax_port, unfolded_pct: unfolded_tw_Emax_port, P: P_tw_Emax_port}
  note: "the stiffest substrate of the code's grid, 10^6 Pa (line 46), as the 'rigid substrates' of p. 6 and the plateau of Fig. S1"
- id: run_tw_alpha2_Emax
  model: talin_wt_port
  inputs: {E: Emax_tw, a_1: a1_tw, a_2: a2_tw, v0: v0_tw, Fst: Fst_tw, sigma_m: sm_tw, sigma_c: sc_tw, kon: kon_tw, k_off_1: koff1_tw, k_off_2: koff2_tw, F_d_1: Fd1_tw, F_d_2: Fd2_tw, kB: kB_tw, T: T_tw, ku0: ku0_tw, kf0: kf0_tw, x_u: xu_tw, Lp: Lp_tw, L: L_tw, Ng: Ng_tw, N_integrin: Nint_tw, b: b_tw, alpha: alpha_T1_paper}
  outputs: {F_f: Ff_tw_alpha2_port, F_u: Fu_tw_alpha2_port, unfolded_pct: unfolded_tw_alpha2_port}
  note: "the code's model with Table T1's alpha = 2 in place of the code's 100 (q_alpha)"
- id: run_tw_fig2c
  model: talin_wt_port
  inputs: {a_1: a1_tw, a_2: a2_tw, v0: v0_tw, Fst: Fst_tw, sigma_m: sm_tw, sigma_c: sc_tw, kon: kon_tw, k_off_1: koff1_tw, k_off_2: koff2_tw, F_d_1: Fd1_tw, F_d_2: Fd2_tw, kB: kB_tw, T: T_tw, ku0: ku0_tw, kf0: kf0_tw, x_u: xu_tw, Lp: Lp_tw, L: L_tw, Ng: Ng_tw, N_integrin: Nint_tw, b: b_tw, alpha: alpha_tw}
  sweep: {E: P_WT_fig2c_paper}
  outputs: {P: P_tw_fig2c_port}
- id: run_tw_fig2d
  model: talin_wt_port
  inputs: {a_1: a1_tw, a_2: a2_tw, v0: v0_tw, Fst: Fst_tw, sigma_m: sm_tw, sigma_c: sc_tw, kon: kon_tw, k_off_1: koff1_tw, k_off_2: koff2_tw, F_d_1: Fd1_tw, F_d_2: Fd2_tw, kB: kB_tw, T: T_tw, ku0: ku0_tw, kf0: kf0_tw, x_u: xu_tw, Lp: Lp_tw, L: L_tw, Ng: Ng_tw, N_integrin: Nint_tw, b: b_tw, alpha: alpha_tw}
