- id: q_alpha
  kind: unexplained_difference
  about: [alpha_tw, alpha_wt2, alpha_me, alpha_T1_paper, cmp_alpha_tw, cmp_alpha_wt2, cmp_tw_unfolded, cmp_tw_alpha2_unfolded, talin_wt_port]
  text: >
    The number of new clutch sites per unfolded R3 domain, alpha of Eq. F8, is 100 in talin_WT_model.m
    (line 95) and 200 in WT2_model.m (line 104), but Table T1 prints alpha = 2 for the talin WT model
    and Table T2 says the WT-2 model keeps Table T1's other values; only the master-equation program
    (2.55, line 81) is close to the 2.6 of Table T4. The code applies alpha exactly as Eq. F8 does
    (Nc / (1 - alpha int p_u), lines 351-356), with the denominator floored at 0.01 (line 353-354), so
    the two are the same parameter. Table T1 calls alpha's effect on the traction and flow curves not
    strong; in the port, alpha changes the unfolded share of engaged talin clutches on the stiffest
    substrate (compare cmp_tw_unfolded and cmp_tw_alpha2_unfolded), which is the 1-2% the paper prints.
  citation: {file: talin_WT_model.m, lines: "95", quote: "number_added_sites_per_unfolded_clutch = 100;"}
- id: q_kon_KD
