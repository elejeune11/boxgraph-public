- id: q_xval_elosegui2014_none
  kind: choice
  about: [linear_port, talin_wt_port, wt2_model, master_equation, xt_from_Fd, Fu_from_xu]
  text: >
    No model of this record predicts an elosegui2014 measurement, so no validation is entered. The programs
    cite elosegui2014 ('Artola, Nature Materials, 2014') only in comments beside parameter values (v0 = 110
    nm/s, Fst = 2 pN, a_2 = 550 nm, clutch stiffness 1 nN/nm), which the programs do not use (they set 120
    nm/s, 1700 nm and 1.6 or 0.05 pN/nm); the data they plot and fit are elosegui2016's (q_code_data).
    elosegui2014's measurements are the traction, actin flow and integrin density of MCF10A myo ctrl / myo
    b6 cells against stiffness (Figs. 1b,c, 4d-l), SPR rates and response curves (Fig. 2a), and integrin
    densities, recruitment and bead detachment (Fig. 2b-g). linear_port and talin_wt_port give traction and
    flow, but only with a myosin density, clutch-site density, kon and adhesion size for those cells, which
    neither record states; the code's values are fitted to MEF data, and refitting them to these curves
    would be a fit, not a test. No program outputs an off-rate (the catch-bond terms are inputs only), so
    the SPR koff, which liu2025's Eq. 4 is checked against (liu2025/val_koff_zero_force_spr_a5b1), has no
    model here. The other measurements are quantities no program computes. The reverse direction is in
    elosegui2014/q_xval_liu_code_none.
  citation: {file: Linear_KD_WT_model.m, lines: "20", quote: "= 110 nm/s [Artola, Nature Materials, 2014]"}
