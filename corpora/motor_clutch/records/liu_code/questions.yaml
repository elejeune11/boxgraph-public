# ==== cross-record validation with kong2009 (2026-11-21): none added =======================
- id: q_xval_kong2009_none
  kind: unstated_model
  about: [linear_port, talin_wt_port, wt2_model, master_equation, xt_from_Fd, Fu_from_xu, 'kong2009/lt_FN_a5b1Fc_CaMg', 'kong2009/lt_FN_a5b1Fc_MgEGTA', 'kong2009/lt_FN_a5b1Fc_Mn']
  text: >
    No model of this record predicts a kong2009 measurement, so no validation is entered. The programs name
    Kong 2009 once, in Linear_KD_WT_model.m lines 43-47: a commented-out set of two-exponential catch-bond
    constants ('% [Kong 2009] data': k_off_1 = 5.463, k_off_2 = 0.1381 1/s, F_d_1 = -10.98, F_d_2 = 20.58 pN),
    presumably fitted to Kong's lifetime-force curves. The programs do not use that set, and kong2009 prints
    no such fit. kong2009's measurements are mean lifetimes (+- SEM) of single FNIII7-10/a5b1 chains under a
    clamped force (Figs. 3-6), adhesion frequencies, rupture-force histograms, cantilever stiffness by
    lifetime bin, event counts against lifetime (Fig. S5) and flow-cytometry intensities. No program here
    outputs a bond lifetime: the catch-bond terms k_off_i exp(F/F_d_i) are inputs of linear_port and
    talin_wt_port, which output traction, flow, mean clutch tension and engaged-clutch densities of a whole
    adhesion; xt_from_Fd and Fu_from_xu are unit conversions. Testing the commented Kong set against
    kong2009/lt_FN_a5b1Fc_CaMg would need a lifetime model, 1/(k_off_1 exp(F/F_d_1) + k_off_2 exp(F/F_d_2)),
    that the programs never compute and that equals the mean lifetime only for a single first-order decay,
    which kong2009 itself questions (Fig. S5 subpopulations); it would also be a fit, not a test. In the
    other direction, see kong2009/q_xval_liu_code_none.
  citation: {file: Linear_KD_WT_model.m, lines: "43", quote: "% [Kong 2009] data"}
# ==== cross-record validation with elosegui2016 (2026-11-21) ==================================
- id: q_xval_elosegui2016_scope
  kind: choice
  about: [linear_port, talin_wt_port, wt2_model, master_equation, 'elosegui2016/fig3d_control_data', 'elosegui2016/fig3d_shrna_data', 'elosegui2016/fig1a_control_data', 'elosegui2016/fig1a_shrna_data', 'elosegui2016/fig6b_control_data', 'elosegui2016/fig6g_control_data', 'elosegui2016/fig6a_control_data', 'elosegui2016/fig6d_control_data']
  text: >
    (Cross-record validation against elosegui2016.) Entered: the linear KD, linear WT and talin WT ports with the
    code's own values against elosegui2016's tractions (Fig. 3d), actin flows (Fig. 3e) and the 15 and 50 uM
    blebbistatin tractions (Fig. 6h,i), shRNA cells for the KD set and control cells for the WT sets. All are
    fit_quality: liu2025 fitted these programs' parameters to exactly these data (Fig. 2c,d; Extended Data Fig. 5;
    q_code_data). Which panel carries the measurement is a choice: Fig. 1a, Fig. 3d and Fig. 6b (10 ug/ml) plot the
    same untreated points (elosegui2016 figures.md); Fig. 3d is used because its reading finds the most points.
    The code types in the points at slightly different rigidities (11 and 30 kPa linear, 12 and 29 kPa talin);
    the runs take elosegui2016's read rigidities. Not used, and why: (1) Fig. 6g (5 uM blebbistatin): liu2025
    fits only 15 and 50 uM and prints no myosin density for 5 uM; (2) Fig. 6a,c (1 and 100 ug/ml fibronectin):
    liu2025's per-coating kon, r and sigma_m exist only as readings of its Fig. 3c curves (q_xval_liu2025_scope),
    which no program sets; (3) Fig. 6d-f (GPen): liu2025 does not model integrin inhibition; (4) talin WT at 15 and
    50 uM: no myosin density is printed for it; (5) adhesion lengths, YAP ratios, spread areas, attached-cell
    fractions, alphavbeta3 bond lifetimes (Fig. 3a) and the 5 kPa threshold: no program outputs these quantities
    (the catch-bond terms are inputs, not outputs); (6) L325R, rod/head, IVVI and VD1 rescues: no parameter set for
    them. Nothing in this record is a measurement, so no elosegui2016 model has anything here to predict
    (elosegui2016/q_xval_liu_code_none).
  citation: {file: Linear_KD_WT_model.m, lines: "63", quote: "Experimental data from [Artola, Nat Cell Biol, 2016]"}
- id: q_xval_elosegui2016_wt_plateau
  kind: unexplained_difference
  about: [linear_port, talin_wt_port, 'elosegui2016/fig3d_control_data', 'elosegui2016/fig3e_control_data']
  text: >
    (Validations val_fit_lwt_traction_elosegui2016_fig3d, val_fit_lwt_flow_elosegui2016_fig3e,
    val_fit_tw_traction_elosegui2016_fig3d and val_fit_tw_flow_elosegui2016_fig3e.) The WT fits to elosegui2016's untreated control cells come out not reproduced. elosegui2016's control tractions
    hold a plateau (about 92, 89 and 89 Pa at 4.7, 11.3 and 14.5 kPa) before rising to about 137 Pa at 29 kPa, and the
    flows hold about 57 and 54 nm/s at 11 and 14.5 kPa. The linear WT set rises monotonically through it (a direct run of
    linear_port: 85, 117, 124, 139 Pa and 60, 38, 33, 22 nm/s at 4.7, 11.3, 14.5, 29.4 kPa). It meets the 4.7 and 29 kPa
    points but misses the two middle ones, which elosegui2016 explains by talin unfolding and reinforcement above the
    threshold, an ingredient the linear and talin WT models lack. The talin WT port, fitted to the same points and close to
    the linear WT curve (liu2025 p. 6), also comes out not reproduced on both curves. The same models are close or reproduced at 15 and 50 uM blebbistatin and for the shRNA cells, so
    the misfit is in the shape of the untreated WT curve, not in the reading. liu2025 says 'Both WT models reproduce
    the WT data' (p. 5); judged within the s.e.m. bars, the middle points are not reproduced.
  citation: {file: Linear_KD_WT_model.m, lines: "63", quote: "Experimental data from [Artola, Nat Cell Biol, 2016]"}
