- id: q_master_not_ported
  kind: numerics
  about: [master_equation, dt_me, lstep_me, lmax_me, tend_me]
  text: >
    The master-equation program integrates Eqs. I1-I2 by explicit Euler in time (dt = 5e-5 s to 181 s)
    with an upwind difference in l (step 0.01 nm to 1800 nm): about 3.6e6 steps over 180001 points.
    A faithful port cannot run within a validation, and liu2025's record holds none of its results
    (Fig. 4, Extended Data Figs. 6-7), so it is recorded but not ported. Note the CFL number
    v dt / dl = 120 x 5e-5 / 0.01 = 0.6 at the free motor speed.
  citation: {file: solve_full_master_equation_main.m, lines: "122-123", quote: "time_step = 0.00005;"}
