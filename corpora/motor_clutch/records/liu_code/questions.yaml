- id: q_R3_rigid
  kind: unexplained_difference
  about: [LcR3_tw, LcR3_wt2, talin_wt_port]
  text: >
    Appendix F says the unfolded mechanosensitive domain is described with the worm-like chain model.
    In force_vs_extension_clutch_v2.m the unfolded R3 domain is instead three more rigid bodies of
    b = 5 nm in the freely-jointed chain (line 20, its comment: "upon unfolding of R3 domain, it becomes
    a chain of 4 rigid bodies - alpha helices, with contour length of ~ 20 nm"); the WLC part is the
    37 nm linker alone (line 19). The unfolded contour length 49.6 nm (domain_contour_length) is passed
    to the function but used only in a commented-out line (line 16). This answers liu2025's
    q_talin_model: the talin force-extension curves are the FJC of 12 (folded) or 15 (unfolded)
    domains of 5 nm in series with a 37 nm WLC (Lp = 1 nm) and the substrate spring.
  citation: {file: force_vs_extension_clutch_v2.m, lines: "19-20", quote: "total_wormlike_contour = linker_size;"}
- id: q_hidden_numerics
  kind: choice
  about: [talin_wt_port, linear_port]
  text: >
    Choices in the code that the paper does not print: all off- and unfolding rates capped at 100 /s
    (talin_WT_model.m lines 294-306); clutch force capped at 100 pN beyond 0.9999 of the contour length
    plus 100 / k's, and from the first smoothed value above 100 pN (force_vs_extension_clutch_v2.m line
    34, tabulate_clutch_force_and_energy.m lines 90-91); the force tables are smoothed with a cubic
    smoothing spline, csaps p = 0.1 (line 89), whose effect depends on the extension step v/200; the
    extension range is cut at min(1000 nm, 150 + sqrt(1e4/k's) nm, 20 v s) (line 254), so at small v
    p_on is followed only to 20 v; the march stops when sum(p_on) < 1e-6 (line 337); the denominator
    1 - alpha int p_u is floored at 0.01 (lines 353-355); Fm is floored at -0.5 pN (talin, line 58) or
    -1000 pN (linear, line 57). The steady states are read off a 100 x 100 (v, E) grid by MATLAB's
    contour (line 471), v from 1 to 300 nm/s (talin) or 0.1 to 300 nm/s (linear). The ports keep all
    of these except the E grid.
  citation: {file: talin_WT_model.m, lines: "294", quote: "k_off_step( k_off_step > 1e+2 ) = 1e+2;"}
