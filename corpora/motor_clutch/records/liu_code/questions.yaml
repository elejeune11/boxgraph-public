  text: >
    (Cross-record validation against liu2025.) The validations entered are the linear KD, linear WT and talin WT
    ports, each with the code's own values, against the measured points liu2025 fitted them to (Fig. 2c,d;
    Extended Data Fig. 5a,b): all fit_quality, since these programs are the paper's fitting code. They differ
    from liu2025's own fit checks (liu2025/cmp_*_data_*) only where the code's values differ from Table T1's
    (kon 0.0051, r 0.75 nm, ly 1000 nm, alpha 100). Not used, and why: (1) Extended Data Fig. 5b with the
    talin WT model (dotted curves): neither liu2025 nor the code prints the talin WT myosin densities at 15 and
    50 uM blebbistatin. (2) Fig. 3a,b at 1 and 100 ug/ml fibronectin: the fitted k0on, r and sigma_m per coating
    are only figure readings of liu2025's Fig. 3c (liu2025/kon_talinWT_fig3c etc.), curves over fibronectin
