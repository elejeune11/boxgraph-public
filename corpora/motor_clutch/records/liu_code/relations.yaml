# The talin WT program is the paper's talin WT model (Appendix F, liu2025/talin_wt). liu2025/talin_wt is not
# runnable (its force-extension curves are given only in words), so this relation cannot be tested; it
# records that talin_wt_port is the runnable form of that model. liu2025/talin_wt has E as its only input,
# so the mapping fixes the program's other inputs at the paper's Table T1 talin WT values (PDF p. 55), not
# at the code's own (which differ in alpha, 100 against 2, and Fu, kBT/5.7 against 0.7 pN; q_alpha, q_Fu):
# x_u = kB T/Fu with Fu = 0.7 pN and the code's kB T = 4.278 pN nm.
- id: rel_talin_wt_same_as_talin_wt_port
  kind: same_as
  a: liu2025/talin_wt
  b: liu_code/talin_wt_port
  mapping:
    E: "E"
    a_1: "0.6"
    a_2: "1700"
    v0: "120"
    Fst: "2"
    sigma_m: "82"
    sigma_c: "300"
    kon: "0.3"
    k_off_1: "0.38"
    k_off_2: "0.000054"
    F_d_1: "-38.09"
    F_d_2: "4.411"
    kB: "1.38e-23"
    T: "310"
    ku0: "0.018"
    kf0: "22.2"
    x_u: "1.38e-23*310/1e-21/0.7"
    Lp: "1"
    L: "37"
    Ng: "12"
    N_integrin: "0"
    b: "5"
    alpha: "2"
  output_map: {P: P}
  regime: {E: [1000, 1000000]}
  tolerance: 0.05
  provenance: stated
  citation: {file: talin_WT_model.m, lines: "3-4", quote: "This is the main function of the talin WT model"}
  assumptions:
    - "the program's three-state FJC for the unfolded R3 domain is its form of the paper's 'WLC' description (q_R3_rigid); the relation records the correspondence, not that the two force-extension laws agree"
    - "F_d values are the code's (the paper prints xt = 0.97 and x't = -0.11 nm, the same to the printed digits with kBT at 310 K)"
