  b: liu_code/linear_port
  mapping: *lin_map
  output_map: {P: P}
  regime: &kd_regime
    E: [1000, 1000000]
    kon: [0.0045, 0.0055]
    k0off: [0.00005, 0.00006]
    k0offp: [0.35, 0.4]
    xt: [0.9, 1.0]
    xtp: [-0.12, -0.1]
    kT: [4.2, 4.3]
    v0: [110, 130]
    Fst: [1.8, 2.2]
    sm: [65, 78]
    sc: [280, 320]
    kc: [1.4, 1.8]
    r: [24, 28]
    ly: [140, 160]
    R: [1500, 2000]
    S: [9, 9]
  tolerance: 0.02
  provenance: stated
  citation: {file: Linear_KD_WT_model.m, lines: "3", quote: "This is the main function of the linear KD and linear WT models"}
  assumptions: *lin_assumptions
- id: rel_steady_linear_same_as_linear_port_KD_v
  kind: same_as
  a: liu2025/steady_linear
  b: liu_code/linear_port
  mapping: *lin_map
  output_map: {v: v}
  regime: *kd_regime
  tolerance: 0.02
