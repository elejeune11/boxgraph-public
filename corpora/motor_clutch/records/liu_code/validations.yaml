# ==== Cross-validation against elosegui2016's measurements, 2026-11-21 =================================
# liu2025's fitted data are elosegui2016's (ref. 13): Fig. 2c,d 'from refs. 13,21 collected for MEF WT cells
# ... and MEF Talin 1 KO, Talin 2 shRNA cells' (liu2025 p. 5), Extended Data Fig. 5 'treated with different
# concentrations of the myosin II inhibitor, blebbistatin [13]' (p. 70), and the programs type in points
# 'from [Artola, Nat Cell Biol, 2016]' (q_code_data). So each entry is fit_quality, judged here against the
# record's own readings of elosegui2016's figures. elosegui2016's 'control' cells (talin 1-/- MEFs expressing
# talin 2) are liu2025's 'MEF WT', its 'talin 2 shRNA' cells liu2025's 'MEF Talin 1 KO, Talin 2 shRNA'.
# Tractions are taken from Fig. 3d, the same points as Fig. 1a with fewer hidden markers (elosegui2016
# figures.md). What was not used, and why: q_xval_elosegui2016_scope.

# ---- linear KD set against talin 2 shRNA cells ---------------------------------------------------------
- id: val_fit_lkd_traction_elosegui2016_fig3d
  model: linear_port
  inputs: {a_1: a1_lkd, a_2: a2_lin, v0: v0_lin, Fst: Fst_lin, sigma_m: sm_lkd, sigma_c: sc_lin, kc: kc_lkd, kon: kon_lkd, l_yield: ly_lkd, k_off_1: koff1_lin, k_off_2: koff2_lin, F_d_1: Fd1_lin, F_d_2: Fd2_lin}
  sweep: {E: 'elosegui2016/fig3d_shrna_data'}
  output: P
  against: 'elosegui2016/fig3d_shrna_data'
  purpose: fit_quality
  quantities: {'elosegui2016/substrate_rigidity': youngs_modulus, 'elosegui2016/cell_traction': traction_stress}
  basis: >
    The program's linear KD values were fitted to these tractions of talin 2 shRNA cells (10 ug/ml fibronectin):
    liu2025 Fig. 2c (p. 5), 'Fitting of experimental data for cell traction (c) and retrograde actin flow (d)
    from refs. 13,21', ref. 13 being elosegui2016. A fit, not a test.
- id: val_fit_lkd_flow_elosegui2016_fig3e
  model: linear_port
  inputs: {a_1: a1_lkd, a_2: a2_lin, v0: v0_lin, Fst: Fst_lin, sigma_m: sm_lkd, sigma_c: sc_lin, kc: kc_lkd, kon: kon_lkd, l_yield: ly_lkd, k_off_1: koff1_lin, k_off_2: koff2_lin, F_d_1: Fd1_lin, F_d_2: Fd2_lin}
  sweep: {E: 'elosegui2016/fig3e_shrna_data'}
  output: v
  against: 'elosegui2016/fig3e_shrna_data'
  purpose: fit_quality
  quantities: {'elosegui2016/substrate_rigidity': youngs_modulus, 'elosegui2016/actin_retrograde_flow': actin_flow_speed}
  basis: >
    The linear KD values were fitted to the actin flows of talin 2 shRNA cells: liu2025 Fig. 2d (p. 5), data
    'from refs. 13,21'; elosegui2016 Fig. 3e holds these cells' flows. A fit.
- id: val_fit_lkd_traction_elosegui2016_fig6h
  model: linear_port
  inputs: {a_1: a1_lkd, a_2: a2_lin, v0: v0_lin, Fst: Fst_lin, sigma_m: sm_KD_bleb15_paper, sigma_c: sc_lin, kc: kc_lkd, kon: kon_lkd, l_yield: ly_lkd, k_off_1: koff1_lin, k_off_2: koff2_lin, F_d_1: Fd1_lin, F_d_2: Fd2_lin}
  sweep: {E: 'elosegui2016/fig6h_shrna_data'}
  output: P
  against: 'elosegui2016/fig6h_shrna_data'
  purpose: fit_quality
  quantities: {'elosegui2016/substrate_rigidity': youngs_modulus, 'elosegui2016/cell_traction': traction_stress}
  conditions_ok: >
    The measurement is at 15 uM blebbistatin, a condition the model has no input for; liu2025 represents it by
    the myosin density alone (sigma_m = 43 um^-2, Extended Data Fig. 5a, p. 70), which this run uses.
  basis: >
    Talin 2 shRNA cells at 15 uM blebbistatin, fitted 'by varying only the density of myosin II motors' to the
    linear KD model (liu2025 Extended Data Fig. 5a, p. 70, data from ref. 13 = elosegui2016 Fig. 6h).
- id: val_fit_lkd_traction_elosegui2016_fig6i
  model: linear_port
  inputs: {a_1: a1_lkd, a_2: a2_lin, v0: v0_lin, Fst: Fst_lin, sigma_m: sm_KD_bleb50_paper, sigma_c: sc_lin, kc: kc_lkd, kon: kon_lkd, l_yield: ly_lkd, k_off_1: koff1_lin, k_off_2: koff2_lin, F_d_1: Fd1_lin, F_d_2: Fd2_lin}
  sweep: {E: 'elosegui2016/fig6i_shrna_data'}
  settings: {branch: strong}
  output: P
  against: 'elosegui2016/fig6i_shrna_data'
  purpose: fit_quality
  quantities: {'elosegui2016/substrate_rigidity': youngs_modulus, 'elosegui2016/cell_traction': traction_stress}
  conditions_ok: >
    50 uM blebbistatin, represented in liu2025 by the fitted myosin density sigma_m = 26 um^-2 alone
    (Extended Data Fig. 5a, p. 70).
  basis: >
    Talin 2 shRNA cells at 50 uM blebbistatin, sigma_m = 26 um^-2 fitted to these points (liu2025 Extended Data
    Fig. 5a, p. 70). The measured rigidities (0.6-30 kPa) lie below the bistable range liu2025 plots (lower branch
    from 2e5 Pa), so the strong branch is the steady state; q_xval_liu2025_branch.

