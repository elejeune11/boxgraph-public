  sweep: {E: 'liu2025/P_WT_data_0uM_ed5b'}
  output: P
  against: 'liu2025/P_WT_data_0uM_ed5b'
  purpose: fit_quality
  quantities: {'liu2025/youngs_modulus': youngs_modulus, 'liu2025/traction_stress': traction_stress}
  basis: "Untreated MEF WT cells, fitted with the linear WT set at sigma_m = 85 um^-2: liu2025 Extended Data Fig. 5b (p. 70)."
- id: val_fit_lwt_traction_liu2025_ed5b_15uM
  model: linear_port
  inputs: {a_1: a1_lwt, a_2: a2_lin, v0: v0_lin, Fst: Fst_lin, sigma_m: sm_WT_bleb15_paper, sigma_c: sc_lin, kc: kc_lwt, kon: kon_lwt, l_yield: ly_lwt, k_off_1: koff1_lin, k_off_2: koff2_lin, F_d_1: Fd1_lin, F_d_2: Fd2_lin}
  sweep: {E: 'liu2025/P_WT_data_15uM_ed5b'}
  output: P
  against: 'liu2025/P_WT_data_15uM_ed5b'
  purpose: fit_quality
  quantities: {'liu2025/youngs_modulus': youngs_modulus, 'liu2025/traction_stress': traction_stress}
  basis: "15 uM blebbistatin, sigma_m = 41 um^-2 fitted to these points 'by varying only the density of myosin II motors' (liu2025 Extended Data Fig. 5b, p. 70)."
- id: val_fit_lwt_traction_liu2025_ed5b_50uM
  model: linear_port
  inputs: {a_1: a1_lwt, a_2: a2_lin, v0: v0_lin, Fst: Fst_lin, sigma_m: sm_WT_bleb50_paper, sigma_c: sc_lin, kc: kc_lwt, kon: kon_lwt, l_yield: ly_lwt, k_off_1: koff1_lin, k_off_2: koff2_lin, F_d_1: Fd1_lin, F_d_2: Fd2_lin}
