  sweep: {E: 'liu2025/v_WT_data_fig2d'}
  output: v
  against: 'liu2025/v_WT_data_fig2d'
  purpose: fit_quality
  quantities: {'liu2025/youngs_modulus': youngs_modulus, 'liu2025/actin_flow_speed': actin_flow_speed}
  basis: "The linear WT values were fitted to these MEF WT actin flows: liu2025 Fig. 2d (p. 5). A fit."
- id: val_fit_lwt_traction_liu2025_ed5b_0uM
  model: linear_port
