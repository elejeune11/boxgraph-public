# ==== Cross-validation against liu2025's measurements, 2026-11-21 ===================================
# The programs are liu2025's own fitting code, and every liu2025 measurement a port here outputs is one
# the paper fitted the programs' parameters to: Fig. 2c,d (p. 5, 'Fitting of experimental data for cell
# traction (c) and retrograde actin flow (d)'; p. 6 'Fitting experimental data ... to the steady-state
# solution of the talin WT model') and Extended Data Fig. 5 (p. 70, 'by varying only the density of myosin
# II motors'). So all are fit_quality: they test how well the code's own values (not Table T1's rounded
# ones) fit the measured points, judged against liu2025's readings of them. What was not used: q_xval_liu2025_scope.

# ---- linear KD set (Linear_KD_WT_model.m as written) --------------------------------------------------
- id: val_fit_lkd_traction_liu2025_fig2c
  model: linear_port
  inputs: {a_1: a1_lkd, a_2: a2_lin, v0: v0_lin, Fst: Fst_lin, sigma_m: sm_lkd, sigma_c: sc_lin, kc: kc_lkd, kon: kon_lkd, l_yield: ly_lkd, k_off_1: koff1_lin, k_off_2: koff2_lin, F_d_1: Fd1_lin, F_d_2: Fd2_lin}
  sweep: {E: 'liu2025/P_KD_data_fig2c'}
  output: P
  against: 'liu2025/P_KD_data_fig2c'
  purpose: fit_quality
  quantities: {'liu2025/youngs_modulus': youngs_modulus, 'liu2025/traction_stress': traction_stress}
  basis: >
    The program's linear KD values were fitted to these tractions of MEF Talin 1 KO, Talin 2 shRNA cells:
    liu2025 Fig. 2c (p. 5), 'Fitting of experimental data for cell traction (c) and retrograde actin flow (d)'
    to the linear clutch model; the program types in the same elosegui2016 points to plot against (q_code_data).
- id: val_fit_lkd_flow_liu2025_fig2d
  model: linear_port
  inputs: {a_1: a1_lkd, a_2: a2_lin, v0: v0_lin, Fst: Fst_lin, sigma_m: sm_lkd, sigma_c: sc_lin, kc: kc_lkd, kon: kon_lkd, l_yield: ly_lkd, k_off_1: koff1_lin, k_off_2: koff2_lin, F_d_1: Fd1_lin, F_d_2: Fd2_lin}
  sweep: {E: 'liu2025/v_KD_data_fig2d'}
  output: v
  against: 'liu2025/v_KD_data_fig2d'
  purpose: fit_quality
  quantities: {'liu2025/youngs_modulus': youngs_modulus, 'liu2025/actin_flow_speed': actin_flow_speed}
  basis: "The linear KD values were fitted to these actin flows: liu2025 Fig. 2d (p. 5). A fit, not a test."
- id: val_fit_lkd_traction_liu2025_ed5a_0uM
  model: linear_port
  inputs: {a_1: a1_lkd, a_2: a2_lin, v0: v0_lin, Fst: Fst_lin, sigma_m: sm_lkd, sigma_c: sc_lin, kc: kc_lkd, kon: kon_lkd, l_yield: ly_lkd, k_off_1: koff1_lin, k_off_2: koff2_lin, F_d_1: Fd1_lin, F_d_2: Fd2_lin}
  sweep: {E: 'liu2025/P_KD_data_0uM_ed5a'}
  output: P
  against: 'liu2025/P_KD_data_0uM_ed5a'
  purpose: fit_quality
  quantities: {'liu2025/youngs_modulus': youngs_modulus, 'liu2025/traction_stress': traction_stress}
  basis: >
    Untreated talin-depleted cells, fitted with the linear KD set at sigma_m = 71 um^-2 (the program's line 22):
    liu2025 Extended Data Fig. 5a (p. 70), 'The data were fitted to the linear KD model'.
- id: val_fit_lkd_traction_liu2025_ed5a_15uM
  model: linear_port
  inputs: {a_1: a1_lkd, a_2: a2_lin, v0: v0_lin, Fst: Fst_lin, sigma_m: sm_KD_bleb15_paper, sigma_c: sc_lin, kc: kc_lkd, kon: kon_lkd, l_yield: ly_lkd, k_off_1: koff1_lin, k_off_2: koff2_lin, F_d_1: Fd1_lin, F_d_2: Fd2_lin}
  sweep: {E: 'liu2025/P_KD_data_15uM_ed5a'}
  output: P
  against: 'liu2025/P_KD_data_15uM_ed5a'
  purpose: fit_quality
  quantities: {'liu2025/youngs_modulus': youngs_modulus, 'liu2025/traction_stress': traction_stress}
  basis: >
    15 uM blebbistatin: the code's KD set with the sigma_m = 43 um^-2 fitted to these points 'by varying only
    the density of myosin II motors' (liu2025 Extended Data Fig. 5a, p. 70). No program file sets 43.
- id: val_fit_lkd_traction_liu2025_ed5a_50uM
  model: linear_port
  inputs: {a_1: a1_lkd, a_2: a2_lin, v0: v0_lin, Fst: Fst_lin, sigma_m: sm_KD_bleb50_paper, sigma_c: sc_lin, kc: kc_lkd, kon: kon_lkd, l_yield: ly_lkd, k_off_1: koff1_lin, k_off_2: koff2_lin, F_d_1: Fd1_lin, F_d_2: Fd2_lin}
  sweep: {E: 'liu2025/P_KD_data_50uM_ed5a'}
  settings: {branch: strong}
  output: P
  against: 'liu2025/P_KD_data_50uM_ed5a'
  purpose: fit_quality
  quantities: {'liu2025/youngs_modulus': youngs_modulus, 'liu2025/traction_stress': traction_stress}
  basis: >
    50 uM blebbistatin, sigma_m = 26 um^-2 fitted to these points (liu2025 Extended Data Fig. 5a, p. 70); the
    model is bistable on rigid substrates here, and the strong (high-traction) branch is the one liu2025's own
    fit check uses (liu2025/run_KD_data_50uM_ed5a). Which branch each point belongs to is open: q_xval_liu2025_branch.

