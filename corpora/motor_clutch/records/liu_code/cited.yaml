# Values the programs take from the paper, Liu et al. 2025 (record liu2025), checked 2026-11-21.
# Most links are already in data.yaml (from_datum). These are the values data.yaml leaves unnamed: the
# talin WT column of Table T1 (PDF p. 55), Table T2 (p. 56) and Table T4 (p. 58), which liu2025's record
# now holds as data. Where the code's value differs from the printed one (alpha, kon, r), the link is
# still the same parameter, and the build reports the difference.
# Left unlinked: Ff_main_paper, Ff_si_paper, Fu_si_paper and unfolded_share_paper (liu2025's record holds
# no datum for these printed ranges), and the catch-bond F_d values (from elosegui2016, which prints none).
# ---- talin_WT_model.m against Table T1, talin WT column
- {datum: kon_tw, from_datum: kon_talinWT, evidence: "talin_WT_model.m line 29 k_on, the assembly rate of the talin WT model; Table T1 talin WT column, 0.3 s^-1"}
- {datum: sm_tw, from_datum: sm_talinWT, evidence: "talin_WT_model.m line 39 myosin_density; Table T1 talin WT column, sigma_m = 82 um^-2"}
- {datum: a1_tw, from_datum: r_talinWT, evidence: "talin_WT_model.m line 43 a_1, the adhesion-site size in k's = 4 pi a_1 E/9; Table T1 talin WT column, r = 0.6 nm"}
- {datum: ku0_tw, from_datum: ku0_R3, evidence: "talin_WT_model.m line 77 k_0_unfold, zero-load unfolding rate of R3; Table T1 k0u = 0.018 s^-1 [18]"}
- {datum: kf0_tw, from_datum: kf0_R3, evidence: "talin_WT_model.m line 78 k_0_refold, zero-load refolding rate of R3; Table T1 k0f = 22.2 s^-1 [18]"}
- {datum: Lp_tw, from_datum: Lp_chain, evidence: "talin_WT_model.m line 87 L_p, persistence length of the WLC linker; Table T1 Lp = 1 nm [28]"}
- {datum: L_tw, from_datum: L_linker, evidence: "talin_WT_model.m line 88 linker_size, contour length of the unstructured linker; Table T1 L = 37 nm [27]"}
- {datum: Ng_tw, from_datum: Ng_talin, evidence: "talin_WT_model.m line 91 talin_globular_domain_number; Table T1 Ng = 12 [27]"}
- {datum: b_tw, from_datum: b_domain, evidence: "talin_WT_model.m line 93 globular_domain_size, the FJC segment; Table T1 b = 5 nm"}
- {datum: alpha_tw, from_datum: alpha_talinWT, evidence: "talin_WT_model.m line 95 number_added_sites_per_unfolded_clutch is the paper's alpha of Eq. F8; Table T1 prints alpha = 2, the code sets 100 (q_alpha)"}
# ---- WT2_model.m against Table T2 (other parameters: Table T1)
- {datum: kon1_wt2, from_datum: kon_WT2_nontalin, evidence: "WT2_model.m line 25 k_on_1, non-talin-based clutches; Table T2 non-talin-based, 0.004 s^-1 (the code sets 0.0044)"}
- {datum: kon2_wt2, from_datum: kon_WT2_talin, evidence: "WT2_model.m line 26 k_on_2, talin-based clutches; Table T2 talin-based, 0.091 s^-1"}
- {datum: sm_wt2, from_datum: sm_WT2, evidence: "WT2_model.m line 41 myosin_density; Table T2, 88 um^-2"}
- {datum: kc1_wt2, from_datum: kc_WT2_nontalin, evidence: "WT2_model.m line 45 clutches_stiffness_1, non-talin-based clutches; Table T2, 0.9 pN/nm"}
- {datum: ly1_wt2, from_datum: ly_WT2_nontalin, evidence: "WT2_model.m line 46 l_yield_1, non-talin-based clutches; Table T2, 160 nm"}
- {datum: a11_wt2, from_datum: r_WT2_nontalin, evidence: "WT2_model.m line 48 a_1_1, adhesion-site size of non-talin-based clutches; Table T2, r = 33 nm"}
- {datum: a12_wt2, from_datum: r_WT2_talin, evidence: "WT2_model.m line 49 a_1_2, adhesion-site size of talin-based clutches; Table T2 prints r = 0.3 nm, the code sets 0.25"}
- {datum: ku0_wt2, from_datum: ku0_R3, evidence: "WT2_model.m line 85 k_0_unfold; Table T2 takes the other parameters from Table T1, k0u = 0.018 s^-1"}
- {datum: kf0_wt2, from_datum: kf0_R3, evidence: "WT2_model.m line 86 k_0_refold; Table T1 k0f = 22.2 s^-1"}
- {datum: Fu_wt2, from_datum: Fu_R3, evidence: "WT2_model.m line 87 unfolding_force, the characteristic unfolding force of R3; Table T1 Fu = 0.7 pN [18]"}
- {datum: Lp_wt2, from_datum: Lp_chain, evidence: "WT2_model.m line 93 L_p; Table T1 Lp = 1 nm"}
- {datum: L_wt2, from_datum: L_linker, evidence: "WT2_model.m line 94 linker_size; Table T1 L = 37 nm"}
- {datum: Ng_wt2, from_datum: Ng_talin, evidence: "WT2_model.m line 97 talin_globular_domain_number; Table T1 Ng = 12"}
- {datum: b_wt2, from_datum: b_domain, evidence: "WT2_model.m line 99 globular_domain_size; Table T1 b = 5 nm"}
- {datum: alpha_wt2, from_datum: alpha_talinWT, evidence: "WT2_model.m line 104 number_added_sites_per_unfolded_clutch; Table T2 says the other parameters are Table T1's, alpha = 2; the code sets 200 (q_alpha)"}
# ---- solve_full_master_equation_main.m against Table T1 (talin WT) and Table T4 (vinculin)
- {datum: a1_me, from_datum: r_talinWT, evidence: "solve_full_master_equation_main.m line 16 a_1, the talin clutches' adhesion-site size; the extended talin WT model of Appendix I keeps Table T1's talin WT r = 0.6 nm"}
- {datum: sm_me, from_datum: sm_talinWT, evidence: "solve_full_master_equation_main.m line 20 sigma_m = 82 (the active value); Table T1 talin WT column, 82 um^-2"}
- {datum: kon_me, from_datum: kon_talinWT, evidence: "solve_full_master_equation_main.m line 29 k_on, assembly rate of vinculin-free talin clutches; Table T1 talin WT column, 0.3 s^-1"}
- {datum: konv_me, from_datum: konv0, evidence: "solve_full_master_equation_main.m line 30 k_vinculin_on; Table T4 second-order assembly rate of clutches with vinculin-bound talin, 0.03 um^2 s^-1"}
- {datum: konR3v_me, from_datum: kon_R3v, evidence: "solve_full_master_equation_main.m line 31 k_vinculin_talin; Table T4 binding rate of vinculin to unfolded R3, 5 s^-1 [32]"}
- {datum: koffR3v_me, from_datum: koff_R3v, evidence: "solve_full_master_equation_main.m line 32 k_off_vinculin_talin; Table T4 vinculin dissociation from unfolded R3, 0.014 s^-1 [32]"}
- {datum: alpha_me, from_datum: alpha_vinculin, evidence: "solve_full_master_equation_main.m line 81 number_added_sites_per_unfolded_clutch = 2.55; Table T4 footnote sets alpha = 2.6 for the vinculin model"}
# ---- the paper's printed values recorded in this record
- {datum: Fu_T1_paper, from_datum: Fu_R3, evidence: "both are Table T1's Fu = 0.7 pN [18] (PDF p. 55)"}
- {datum: alpha_T1_paper, from_datum: alpha_talinWT, evidence: "both are Table T1's alpha = 2 (PDF p. 55)"}
- {datum: r_talin_T2_paper, from_datum: r_WT2_talin, evidence: "both are Table T2's r = 0.3 nm of talin-based clutches (PDF p. 56)"}
- {datum: kon_nontalin_T2_paper, from_datum: kon_WT2_nontalin, evidence: "both are Table T2's kon = 0.004 s^-1 of non-talin-based clutches (PDF p. 56)"}
