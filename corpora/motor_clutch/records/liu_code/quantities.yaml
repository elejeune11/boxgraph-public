# Ids shared with liu2025's record where the quantity is the same.
- {id: youngs_modulus, name: Young's modulus of the substrate, dimension: "[pressure]"}
- {id: clutch_assembly_rate, name: assembly rate of a molecular clutch in the relaxed state (k0on), dimension: "1/[time]"}
- {id: zero_load_off_rate, name: zero-load dissociation rate of one term of the integrin-ECM catch bond, dimension: "1/[time]"}
- {id: dissociation_force, name: "characteristic force of one term of the catch-bond off-rate (koff_i exp(F / F_d_i))", dimension: "[force]", description: "the code's form; the paper writes exp(beta x_t F), so F_d = kBT / x_t"}
- {id: transition_distance, name: transition-state distance of the integrin-ECM bond, dimension: "[length]"}
- {id: boltzmann_constant, name: Boltzmann constant as the code writes it, dimension: "[energy]/[temperature]"}
- {id: temperature, name: absolute temperature, dimension: "[temperature]"}
- {id: motor_free_speed, name: unloaded myosin II speed v0, dimension: "[length]/[time]"}
- {id: actin_flow_speed, name: retrograde actin flow speed, dimension: "[length]/[time]"}
- {id: motor_stall_force, name: stall force of one myosin II motor, dimension: "[force]"}
- {id: myosin_density, name: density of myosin II motors near the cell-substrate interface, dimension: "1/[length]**2"}
- {id: clutch_site_density, name: density of sites available for clutch formation, dimension: "1/[length]**2"}
- {id: engaged_clutch_density, name: density of engaged molecular clutches, dimension: "1/[length]**2"}
- {id: clutch_spring_constant, name: spring constant of (the intracellular part of) a molecular clutch, dimension: "[force]/[length]"}
- {id: adhesion_site_size, name: characteristic size r (a_1 in the code) of the adhesion site of one clutch, dimension: "[length]"}
- {id: adhesion_complex_size, name: characteristic size R (a_2 in the code) of a cell-adhesion complex, dimension: "[length]"}
- {id: adhesion_complex_area, name: area S of a cell-adhesion complex, dimension: "[length]**2"}
- {id: linear_limit_extension, name: clutch extension ly beyond which the force stays at k ly, dimension: "[length]"}
- {id: traction_stress, name: cell traction stress P, dimension: "[pressure]"}
- {id: clutch_tension, name: mean tension of an engaged clutch, dimension: "[force]"}
- {id: folded_clutch_tension, name: mean tension of an engaged talin clutch with R3 folded, dimension: "[force]"}
- {id: unfolded_clutch_tension, name: mean tension of an engaged talin clutch with R3 unfolded, dimension: "[force]"}
- {id: unfolded_clutch_share, name: share of engaged talin clutches with the R3 domain unfolded, dimension: dimensionless}
- {id: unfolding_rate_zero_load, name: zero-load unfolding rate of the talin R3 domain (ku0), dimension: "1/[time]"}
- {id: refolding_rate_zero_load, name: zero-load refolding rate of the talin R3 domain (kf0), dimension: "1/[time]"}
- {id: unfolding_distance, name: unfolding transition distance of R3 (the code's divisor of kT in Fu = kT / x_u), dimension: "[length]"}
- {id: unfolding_force, name: characteristic unfolding force Fu of the R3 domain, dimension: "[force]"}
- {id: persistence_length, name: persistence length of a peptide chain (Lp), dimension: "[length]"}
- {id: linker_contour_length, name: contour length L of the unstructured talin linker, dimension: "[length]"}
- {id: unfolded_domain_contour_length, name: contour length of the unfolded R3 domain, dimension: "[length]"}
- {id: talin_domain_number, name: number of force-transmitting globular domains of the talin rod (Ng), dimension: dimensionless}
- {id: integrin_domain_number, name: number of rigid integrin domains in a clutch, dimension: dimensionless}
- {id: globular_domain_size, name: size b of a folded globular domain, dimension: "[length]"}
- {id: sites_per_unfolded_clutch, name: new clutch sites added per unfolded R3 domain (alpha), dimension: dimensionless}
- {id: vinculin_clutch_assembly_rate, name: "second-order assembly rate of clutches with vinculin-bound talin (kon_v)", dimension: "[length]**2/[time]"}
- {id: vinculin_binding_rate, name: binding rate of vinculin to unfolded R3 (kon R3v), dimension: "1/[time]"}
- {id: vinculin_dissociation_rate, name: dissociation rate of vinculin from unfolded R3 (koff R3v), dimension: "1/[time]"}
- {id: substrate_viscosity, name: viscous coefficient of the substrate (xi_s), dimension: "[force]*[time]/[length]"}
- {id: off_rate_factor, name: factor multiplying the off-rate of vinculin-free talin clutches, dimension: dimensionless}
- {id: extension_step, name: extension step of a grid in l, dimension: "[length]"}
- {id: extension_max, name: largest extension of a grid in l, dimension: "[length]"}
- {id: time_step, name: time step of an explicit integration, dimension: "[time]"}
- {id: simulated_time, name: simulated time span, dimension: "[time]"}
