notes: >
  PDF pages 1-10 are the article, 11-13 its Supplementary Information (converted from Word; figure
  captions only). The paper extends the stochastic motor-clutch model of Bangasser et al. 2013 (ref. 35)
  with an orthogonal substrate spring ks^eps0 carrying a residual strain eps0, applied axially (Eqs. 5-6) or
  transversally (Eqs. 7-9). It solves the model by Gillespie simulation (Eq. 12), and reports the optimal
  number of clutches (the minimum of the mean retrograde flow over nc, with nm = nc) for two substrate
  stiffnesses and several strains.

  In scope: Table 1, the simulation (models clutch_axial_ssa and clutch_transverse_ssa), the
  optimum search as described on pp. 3 and 6 (optimal_nc_axial and optimal_nc_transverse), and every
  printed number it produces. These are the optima 40 and 445 at no strain, the "factor of 10", the
  increases of 3%/103% (soft) and 3%/69% (stiff) for axial strain 0.1/3, the "+1 clutch" at strain 0.1 on
  the soft substrate, and the transverse increases 64/71/76% for strain 0.25/0.5/1. The record also
  checks the orthogonal-spring lengths the paper derives from Eq. 1 (4000 nm, 2000 nm, 500 nm).

  The simulations here use time averages, nm = nc, 100 k events per nc and the printed nc grids. With
  Table 1 the record's model does not find the soft-substrate optimum near 40 (its flow keeps falling up
  to nc = 200, q_soft_optimum), and it places the stiff optimum above 445 (q_stiff_optimum). These are
  findings, recorded as questions. The transverse case needed two readings of what the paper leaves
  unstated (q_transverse_fs, q_transverse_load), and Eq. 8 is kept as printed though it looks
  geometrically inconsistent (q_eq8).

  Left out: the figures (2-9, S2, S3). Page rendering for figure reading was not available to this
  reader (q_figures). Figs. 6 and 7B would test intermediate strains and the threshold/saturation
  claims, Fig. 4 the effect of a 100 nm orthogonal spring, and Fig. S2 the claim that the original model
  is insensitive to residual strain. The Fig. 2-3 and Fig. 9 averages print no numbers in the text. The
  canonical model (orthogonal spring removed) is the record's clutch_axial_ssa with ke = 0; no printed
  number rests on it alone, so it has no run.

  Figure pass (2026-11-21): the figures are now read with calibrated readings by the record's own
  code (figures.yaml, figures/, figures.md): Figs. 3, 4, 5A/5B (where the curves lie apart), 6, 7A/7B,
  8A/8B, 9 (bars and error bars) and S2, S3. They are run with flow_nc_axial / flow_nc_transverse (the
  simulation with nm = nc; ke = 0 added for the canonical model) and the optimum searches, and compared.
  Fig. 7B agrees with the printed 64/71/76 %; Fig. 8's colours look swapped against its caption
  (q_fig8_colours); the force axes of Figs. 3 and 9 are labelled nN (q_fig_force_units). Left out: Figs.
  1, S1 (drawings), Fig. 2 (single trajectories), the S3 dashed curve (on the solid one).
