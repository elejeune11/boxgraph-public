id: normalise_optimum
name: optimal nc normalised by the optimal nc at no residual strain (Fig. 8A from Fig. 6)
role: processing
stated: {page: 8, printed_page: "8", quote: "Curves of optimal nc reported in Fig. 6 normalized respect to the optimal nc", where: "Fig. 8 caption"}
equation: "r(eps) = nc_opt(eps) / nc_opt(0), nc_opt(0) = 40 (ks = 0.1) or 445 (ks = 1 pN/nm) as the caption prints"
from_words: true
inputs:
  n:      {quantity: optimal_clutch_number, unit: dimensionless, curve: {quantity: residual_strain, unit: dimensionless}}
  n_ref:  {quantity: optimal_clutch_number, unit: dimensionless}
  grid:   {quantity: optimal_nc_normalised, unit: dimensionless, curve: {quantity: residual_strain, unit: dimensionless}, description: "only its strains are used: where to give the result"}
outputs:
  r: {quantity: optimal_nc_normalised, unit: dimensionless, curve: {quantity: residual_strain, unit: dimensionless}}
