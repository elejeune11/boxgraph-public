id: flow_nc_transverse
name: mean retrograde flow of the modified clutch model (transverse strain) with as many motors as clutches
role: model
stated: {page: 7, printed_page: "7", quote: "levels of longitudinal residual strain", where: "Fig. 7A; Eqs. 2-4, 7-12"}
equation: "clutch_transverse_ssa with nm = nc (p. 5), with the reader's readings of Fs and the motor load (q_transverse_fs, q_transverse_load)"
inputs:
  nc:   {quantity: clutch_number, unit: dimensionless}
  Fm:   {quantity: motor_stall_force, unit: pN}
  vu:   {quantity: unloaded_motor_velocity, unit: nm/s}
  kon:  {quantity: clutch_on_rate, unit: 1/s}
  koff: {quantity: clutch_off_rate_unloaded, unit: 1/s}
  Fb:   {quantity: clutch_rupture_force, unit: pN}
  kc:   {quantity: clutch_stiffness, unit: pN/nm}
  ks:   {quantity: substrate_stiffness, unit: pN/nm}
  ke:   {quantity: orthogonal_spring_stiffness, unit: pN/nm}
  l:    {quantity: orthogonal_spring_rest_length, unit: nm}
  eps0: {quantity: residual_strain, unit: dimensionless}
outputs:
  v_retro:  {quantity: retrograde_flow_rate, unit: nm/s}
  n_eng:    {quantity: engaged_clutch_number, unit: dimensionless}
  F_clutch: {quantity: clutch_force_total, unit: pN}
  x_sub:    {quantity: substrate_position, unit: nm}
  t_cycle:  {quantity: cycle_time, unit: s}
settings: {n_events: 100000, seed: 1, average: time}
stochastic: true
built_from: [clutch_axial_ssa, clutch_transverse_ssa]
