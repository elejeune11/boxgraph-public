id: relative_increase
name: increase of the optimal number of clutches with respect to the control condition
role: processing
stated: {page: 6, printed_page: "6", quote: "control condition (residual strain to 0)", where: text}
equation: "increase = (nc_opt(eps0) - nc_opt(0)) / nc_opt(0), in percent; and nc_opt(eps0) - nc_opt(0) in clutches"
from_words: true
inputs:
  n_ref: {quantity: optimal_clutch_number, unit: dimensionless, description: "optimal nc with no residual strain"}
  n:     {quantity: optimal_clutch_number, unit: dimensionless}
outputs:
  pct: {quantity: optimal_nc_relative_increase, unit: percent}
  dn:  {quantity: optimal_nc_increase, unit: dimensionless}
