id: strain_eq1
name: residual strain of the orthogonal spring, deformed length from undeformed length (Eq. 1)
role: model
stated: {page: 2, printed_page: "2", quote: "The residual strain is deﬁned as", where: Eq. 1}
equation: "eps0 = (l' - l)/l, so l' = l (1 + eps0)"
inputs:
  l:    {quantity: orthogonal_spring_rest_length, unit: nm}
  eps0: {quantity: residual_strain, unit: dimensionless}
outputs:
  l_def: {quantity: orthogonal_spring_deformed_length, unit: nm}
