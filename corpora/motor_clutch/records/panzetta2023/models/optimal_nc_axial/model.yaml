id: optimal_nc_axial
name: optimal number of clutches (minimum of retrograde flow over nc), axial residual strain
role: model
stated: {page: 6, printed_page: "6", quote: "cubic spline interpolation function to determine the optimum values of", where: "text p. 6; simulation grid p. 3"}
equation: >-
  nc_opt = argmin over nc of the mean retrograde flow of clutch_axial_ssa, with nm = nc; the simulation
  is run for n_nc values of nc logarithmically spaced between nc_min and nc_max (rounded to integers)
  and the minimum is taken on a cubic spline through the points (here in log10 nc, q_spline)
from_words: true
inputs:
  Fm:   {quantity: motor_stall_force, unit: pN}
  vu:   {quantity: unloaded_motor_velocity, unit: nm/s}
  kon:  {quantity: clutch_on_rate, unit: 1/s}
  koff: {quantity: clutch_off_rate_unloaded, unit: 1/s}
  Fb:   {quantity: clutch_rupture_force, unit: pN}
  kc:   {quantity: clutch_stiffness, unit: pN/nm}
  ks:   {quantity: substrate_stiffness, unit: pN/nm}
  ke:   {quantity: orthogonal_spring_stiffness, unit: pN/nm}
  l:    {quantity: orthogonal_spring_rest_length, unit: nm}
  eps0: {quantity: residual_strain, unit: dimensionless}
outputs:
  nc_opt: {quantity: optimal_clutch_number, unit: dimensionless}
  v_min:  {quantity: retrograde_flow_rate, unit: nm/s, description: "the spline's minimum flow"}
settings: {nc_min: 10, nc_max: 1000, n_nc: 20, n_events: 100000, seed: 1}
stochastic: true
built_from: [clutch_axial_ssa]
