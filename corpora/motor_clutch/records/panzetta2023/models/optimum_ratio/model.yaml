id: optimum_ratio
name: factor by which the optimal number of clutches grows from the soft to the stiff substrate
role: processing
stated: {page: 6, printed_page: "6", quote: "the optimum number of clutches increased by a", where: text}
equation: "factor = nc_opt(ks = 1 pN/nm) / nc_opt(ks = 0.1 pN/nm)"
from_words: true
inputs:
  n_stiff: {quantity: optimal_clutch_number, unit: dimensionless}
  n_soft:  {quantity: optimal_clutch_number, unit: dimensionless}
outputs:
  ratio: {quantity: optimal_nc_ratio, unit: dimensionless}
