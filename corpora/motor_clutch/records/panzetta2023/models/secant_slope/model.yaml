id: secant_slope
name: rate of change of the normalised optimal nc as the slope of secants between consecutive points (Fig. 8B from Fig. 8A)
role: processing
stated: {page: 8, printed_page: "8", quote: "evaluated as slopes of the secant lines connecting two consecutive points in A", where: "Fig. 8 caption"}
equation: "s(eps_i) = (r(eps_i+1) - r(eps_i)) / (eps_i+1 - eps_i), the value plotted at eps_i (as Fig. 8B places it)"
from_words: true
inputs:
  r:    {quantity: optimal_nc_normalised, unit: dimensionless, curve: {quantity: residual_strain, unit: dimensionless}}
  grid: {quantity: optimal_nc_rate_of_change, unit: dimensionless, curve: {quantity: residual_strain, unit: dimensionless}, description: "only its strains are used"}
outputs:
  s: {quantity: optimal_nc_rate_of_change, unit: dimensionless, curve: {quantity: residual_strain, unit: dimensionless}}
