# figures/_specs.py (what each reading reads), and one stub per reading. Crops are in pixels of the
# PDF page rendered at the dpi given.
# Fig. 3 (p. 5): averages of single 100 k-event runs, ks = 1 pN/nm, canonical (light grey) and
# modified (dark grey; black in C) models at nc = 50 and 400. Bars with error bars that the caption
