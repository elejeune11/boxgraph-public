- id: q_s3_caption
  kind: possible_error
  about: [ldef_s3, lrest_s3_printed, ldef_eps1_s3_printed]
  text: >-
    The Fig. S3 caption (p. 13) says the "initial length" of the orthogonal spring at strain 1 is 1000 nm
    (solid line) and 2000 nm (dashed line). The text (p. 7) says the extra simulation has a deformed length
    of 1000 nm, so an undeformed (initial) length of 500 nm, and that the deformed lengths compared are
    1000 and 2000 nm. With Eq. 1 the caption's 1000 and 2000 nm are the deformed lengths, not the initial
    ones; the caption and the text disagree on which length was held at 1000 nm. The record follows the
    text.
  citation: {page: 13, quote: "initial length of the orthogonal spring associated to a residual strain equal to 1", where: "Fig. S3 caption"}
