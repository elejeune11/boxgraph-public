- id: q_average
  kind: unstated_model
  about: [clutch_axial_ssa, clutch_transverse_ssa]
  text: >-
    The paper reports "average" retrograde flow, clutch numbers, forces and cycle times over 100 k events but
    does not say whether averages are over time or over events. The record uses time averages (as
    bangasser2013); an event average gives a much lower flow at small nc (about 68 nm/s at nc = 10 on the
    stiff substrate, against about 107 nm/s in Figs. 4-5), so the time average is the reading consistent
    with the figures.
  citation: {page: 5, printed_page: "5", quote: "average values of retrograde actin ﬂow rate", where: text}
- id: q_spline
  kind: choice
  about: [optimal_nc_axial, optimal_nc_transverse]
  text: >-
    The optimum is located on a cubic spline through the simulated points (p. 6), but whether the spline
    is in nc or in log nc is not said, nor whether the nc values are rounded to integers. The record
    uses log10 nc (the grid is log-spaced) and integer nc.
  citation: {page: 6, printed_page: "6", quote: "cubic spline interpolation function to determine the optimum values of", where: text}
- id: q_transverse_fs
  kind: unstated_model
  about: [clutch_transverse_ssa, optimal_nc_transverse]
  text: >-
    For the transverse strain, Eq. 7 balances F0 and the clutch forces against Fs, but Fs is printed only
    for the axial case (Eq. 6). The record evaluates the two springs at the total horizontal displacement
    x0 + xs with vertical distance l (P2 fixed), the only reading that makes the spring rotate as the
    paper says it does (p. 7).
  citation: {page: 3, printed_page: "3", quote: "when the force F0 is applied transversally, the equilibrium equation is", where: "Eq. 7"}
- id: q_transverse_load
  kind: unstated_model
  about: [clutch_transverse_ssa]
  text: >-
    Eq. 10 loads the motors with Fs. In the transverse case Fs includes F0 (Eq. 7), which for l = 1000 nm
    and strain 1 is about 2700 pN, more than the stall force nm Fm of any nc simulated (at most 2000 pN),
    so the flow would be negative throughout. The record loads the motors with the summed clutch force,
    which equals Fs in the axial case.
  citation: {page: 3, printed_page: "3", quote: "The F-actin retrograde velocity is related to the force Fs by the Hill's", where: "Eq. 10"}
- id: q_eq8
  kind: possible_error
  about: [clutch_transverse_ssa]
  text: >-
    Eq. 8 gives F0 = ks^eps0 eps0 l + ks x0, adding the full tension of the tilted orthogonal spring to a
    horizontal force. The horizontal component of that tension would be ks^eps0 eps0 l x0/sqrt(l^2 + x0^2).
    With the printed F0 the springs are not in balance at P1' before any clutch engages, so the substrate
    rests a little further along (about 70 nm for strain 1 and ks = 1 pN/nm). The record keeps Eq. 8 as
    printed; the extra offset changes the local substrate stiffness by well under 1%, so it should not
    change the optimum appreciably.
  citation: {page: 3, printed_page: "3", quote: "based on simple geometric considerations, it is possible to derive", where: "Eqs. 8-9"}
- id: q_soft_optimum
  kind: unexplained_difference
  about: [cmp_ncopt_soft_0, cmp_inc_soft_01, cmp_inc_soft_3, cmp_dn_soft_01, cmp_ratio_sim, optimal_nc_axial]
  text: >-
    With Table 1 and nm = nc, the simulated flow on the soft substrate (ks = 0.1 pN/nm) decreases over the
    whole printed grid (10 to 200), from about 110 nm/s at nc = 10 to about 87 nm/s at 200, and its minimum
    lies beyond the grid (near nc = 320 with or without the orthogonal spring, in single runs). Fig. 5A
    instead shows about 80 nm/s at nc = 10 and a minimum of about 73.5 nm/s at nc of about 40. With the
    parameters as printed, the record's model does not reproduce the soft-substrate optimum, so the
    soft-substrate increases cannot be reproduced either. Some parameter or ingredient of the paper's
    soft-substrate runs is not printed or differs from Table 1. The record found nothing that would
    explain it (the canonical model gives the same result).
  citation: {page: 6, printed_page: "6", quote: "factor of 10 passing by 40 on the soft substrate", where: "text; Fig. 5A"}
- id: q_stiff_optimum
  kind: unexplained_difference
  about: [cmp_ncopt_stiff_0, optimal_nc_axial]
  text: >-
    On the stiff substrate single runs of the record's model give an optimum near nc = 565-580 with a
    minimum flow of about 76.7 nm/s, against 445 and about 74 nm/s in the paper (Figs. 4B, 5B). The curve
    is flat near its minimum, so noise moves the optimum. The paper's own optima, 40 and 445, scale with
    ks (as expected when nm = nc), which the stiff result roughly does and the soft result does not.
  citation: {page: 6, printed_page: "6", quote: "to 445 on the", where: text}
- id: q_factor_10
  kind: overstated_claim
  about: [cmp_ratio_printed]
  text: >-
    "Increased by a factor of 10" from 40 to 445 is a factor of 11.1; the statement is loose, not an
    error of substance.
  citation: {page: 6, printed_page: "6", quote: "the optimum number of clutches increased by a", where: text}
- id: q_fig6_caption
  kind: reading
  about: [eps_3]
  text: >-
    The Fig. 6 caption lists the strains as "0, 0.1, 0.25, 0.5, 1, 2 and 31"; the axis and the text
    (p. 5) show 3. The record takes 3.
  citation: {page: 7, printed_page: "7", quote: "0.1, 0.25, 0.5, 1, 2 and 31) are", where: "Fig. 6 caption"}
- id: q_events
  kind: numerics
  about: [optimal_nc_axial, optimal_nc_transverse, clutch_axial_ssa]
  text: >-
    The paper limits every simulation to 100 k events ("Monte Carlo runs equal to 100 k" in the captions,
    1000 k in Fig. S2) and runs one simulation per nc; it gives no seed and no repeat. One run per nc leaves
    noise in a flat minimum, so the optimum from one seed is uncertain by tens of clutches on the stiff
    substrate. The build repeats each optimum over 5 seeds and refines the number of events.
  citation: {page: 3, printed_page: "3", quote: "The number of simulated events has been limited 100 k for all", where: "Sec. 2.2"}
- id: q_figures
  kind: reading
  about: [optimal_nc_axial]
  text: >-
    Figs. 2-9 and S2-S3 (flow against nc for each strain, optimal nc against strain, averages at the optimum)
    were not read in this pass: page rendering for figure reading was not available to the reader. Fig. 6
    (optimal nc against axial strain, both stiffnesses) and Fig. 7B (transverse) hold the values that would
    test the intermediate strains (0.25, 0.5, 1, 2) and the threshold and saturation claims of Sec. 3.4.
  citation: {page: 7, printed_page: "7", quote: "Optimal nc predicted by the modiﬁed version of motor clutch model", where: "Fig. 6"}
