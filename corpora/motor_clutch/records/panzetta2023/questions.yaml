- id: q_no_validation_bangasser2017
  kind: choice
  about: [clutch_axial_ssa, clutch_transverse_ssa, flow_nc_axial, flow_nc_transverse]
  text: >-
    Cross-validation against bangasser2017 (ref. 40) was looked for and none was entered. This paper
    has no measurements of its own, so only its models could be judged against bangasser2017's data;
    bangasser2017's own simulator (cms) is not runnable in its record. The paper says only that its
    optimum "matches experimental observations reported to date [35,40]", a trend (an optimum exists)
    that no number quantifies. The bangasser2017 measurements that this paper's simulation could
    produce (actin retrograde flow of U251 and ECFN cells, Figs. 3c, 4a and the 4 and 100 kPa insets,
    Supplementary Fig. 4C) are indexed by gel Young's modulus in kPa. This model takes a substrate
    spring constant in pN/nm, and neither paper gives a conversion (bangasser2017's q_stiffness_mapping).
    A run would also need clutch and motor numbers for one U251 or ECFN protrusion and the cells'
    residual strain, and neither paper states these. Table 1 is a generic parameter set, not fitted to
    those cells. With every such input added, a verdict would test the added inputs, not the model.
    Strain energy, area, aspect ratio, motility and MSD are not outputs of this model. Revisit if a
    record states a modulus-to-spring-constant mapping for these gels (Chan and Odde 2008, Eq. 13, is
    one candidate) together with clutch and motor numbers per protrusion.
  citation: {page: 5, printed_page: "5", quote: "maximal adhesion strength) and matches experimental observations", where: text}

# ==== cross-record validation with cms_code (2026-11-21): none added =============================
- id: q_xval_cms_code_none
  kind: unstated_model
  about: [clutch_axial_ssa, clutch_transverse_ssa, flow_nc_axial, flow_nc_transverse, optimal_nc_axial, optimal_nc_transverse]
  text: >-
    (Cross-record validation.) I looked for cross-validation against cms_code, the released simulator of
    bangasser2017 (ref. 40), and entered none, because neither record holds a measurement. This
    record's data are all parameters (reported), its model's own simulation outputs (predicted) or
    arithmetic on them (derived). cms_code is software, and every one of its data is a parameter (origin
    reported). clutch_axial_ssa and cms_code/cms2d_code have the same shape: both give a velocity from
    forces, a length, rates, a stiffness and a velocity. That is a likeness of models, not a measurement
    one can predict the other, so it belongs to a relation between models, not to a validation. The paper
    cites ref. 40 only for the original model's account of stiffness-sensitive migration (p. 7). It never
    says it used or compared with the CMS code. Revisit only if either record gains measured data.
  citation: {page: 7, printed_page: "7", quote: "explanation of stiffness sensitive cell migration and the existence of a", where: text}

# ==== cross-record validation with panzetta2019 (2026-11-21): none added =========================
- id: q_xval_panzetta2019_none
  kind: choice
  about: [clutch_axial_ssa, clutch_transverse_ssa, flow_nc_axial, flow_nc_transverse, optimal_nc_axial, optimal_nc_transverse]
  text: >-
    (Cross-record validation.) I looked for validations of this record's models against panzetta2019
    (ref. 39) and entered none. Every panzetta2019 measurement is a quantity these models do not give.
    They are tracer MSD curves and radius of gyration (Figs. 2, 4, 5, S4-S6), cell spreading area, shape
    factor, nucleus area and cell count (Figs. 3, 6, 7, S3, S7-S10), cell Young's modulus, and the
    PDMS/PU stress-strain curves and moduli (Fig. S1). The models' outputs are retrograde flow, engaged
    clutch number, clutch force, substrate position, cycle time and the optimal nc. panzetta2019
    measures no retrograde flow, traction or adhesion size. The paper links the two in words only: the
    rise of the optimal nc by 1 at strain 0.1 on the soft substrate is "supporting the experimental
    evidence of a threshold effect" (p. 9), and the optimal nc stands for FA dimension (p. 7). That is
    a trend: no panzetta2019 number quantifies an optimal clutch number. A run would also need a
    mapping from panzetta2019's 6 % and 9 % macroscopic substrate strains on PDMS (about 1 MPa) to
    eps0, l and ks in pN/nm, and neither paper gives one (panzetta2019's q_x0_strain). panzetta2023
    has no measurements, so panzetta2019's models have nothing here to be validated against either.
  citation: {page: 9, printed_page: "9", quote: "an increase of the optimal nc by 1, supporting the experimental evidence", where: "Sec. 3.4"}

# ==== cross-record validation with bangasser2013b (2026-11-21): none added =======================
- id: q_xval_bangasser2013b_none
  kind: choice
  about: [clutch_axial_ssa, clutch_transverse_ssa, flow_nc_axial, flow_nc_transverse, optimal_nc_axial, optimal_nc_transverse]
  text: >-
    (Cross-record validation.) I looked for validations of this record's models against
    bangasser2013b (ref. 34) and entered none. This paper cites ref. 34 only as background for the
    clutch model ("extended to describe cell-scale processes like cell migration [34]", and stiffness
    sensing [34,36], p. 2), never as data it explains or fits. bangasser2013b is theory: its only data
    of origin measured are the run times of its ODE and Monte Carlo software (Fig. 6(b),
    fig6b_ode_cal, fig6b_mc1_cal, fig6b_mc100_cal), and no model here outputs a computation time. Its
    flows, clutch forces, cycle times and optima (Figs. 2, 4, S1, S2) are predictions of its own ODE and
    Monte Carlo models, not measurements. clutch_axial_ssa has the same shape as
    bangasser2013b/clutch_ensemble_cycle, but comparing two models' predictions is a relation between
    models (reduces_to / same_as), not a validation, and belongs to the job that relates them. In the
    other direction, this record has no measurements (no datum of origin measured), so bangasser2013b's
    models have nothing here to be validated against.
  citation: {page: 2, printed_page: "2", quote: "Then, it has was used to explain the mechanism by which cells sense", where: "Introduction"}

# ==== cross-record validation with chan2008 (2026-11-21): none added =============================
- id: q_xval_chan2008_none
  kind: choice
  about: [clutch_axial_ssa, clutch_transverse_ssa, flow_nc_axial, flow_nc_transverse, optimal_nc_axial, optimal_nc_transverse]
  text: >-
    (Cross-record validation.) I looked for validations of this record's models against chan2008
    (ref. 36) and entered none. The paper cites ref. 36 only for the clutch model's account of
    stiffness sensing ("can explain the mechanism by which cells sense ECM stiffness [34,36]", p. 3;
    also p. 2). It never says its model explains, fits or is compared with chan2008's data. Of
    chan2008's measurements, only the retrograde flows (Fig. 3C means, Fig. 3D points with SEM,
    Fig. S8C bars, the ~110 nm/s of the text) are a quantity these models output. The others are
    flow and bead-displacement histograms, step-size histograms, failure frequencies, radial
    deviations, surface tension, peak filopodial force and the contact-bead distance, which no model
    here gives. The flows are not entered, for three reasons. (1) They are indexed by gel Young's
    modulus (substrate_modulus, Pa), while the models take a substrate spring constant ks in pN/nm.
    A sweep cannot cross the two quantities, and turning a modulus into ks needs chan2008's Eq. 13
    and its unstated length (chan2008 q_eq13_delta, q_fig_same_curve), which is not a model of this
    record. (2) The models run with this paper's Table 1 (kon 0.3 1/s, kc 0.8 pN/nm, vu 120 nm/s),
    not chan2008's neuron set (kon 1 1/s, kc 5 pN/nm, nc = nm = 75, Table S1). No paper gives the
    clutch number of an embryonic chick neuron filopodium under this paper's parameters, and nc
    would decide the verdict. Running with chan2008's own Table S1 instead would repeat chan2008's
    own fit (chan2008 val_fig3d_exp_sem, whose nc, kon and Δ were tuned to these flows), not test
    this model. (3) With no residual strain and ks^eps0 = 0 the model is the canonical clutch
    model, so whether it reproduces chan2008's model is a reduces_to / same_as relation between
    models, for the job that relates them, not a validation. In the other direction this record has
    no measurements (no datum of origin measured), so chan2008's models have nothing here to be
    validated against. Revisit if a paper states ks and nc for chan2008's gels in this model's terms.
  citation: {page: 3, printed_page: "3", quote: "The motor clutch model can explain the mechanism by which cells", where: text}

# ==== cross-record validation with bangasser2013 (2026-11-21): none added ========================
- id: q_xval_bangasser2013_none
  kind: choice
  about: [clutch_axial_ssa, clutch_transverse_ssa, flow_nc_axial, flow_nc_transverse, optimal_nc_axial, optimal_nc_transverse]
  text: >-
    (Cross-record validation.) I looked for validations of this record's models against bangasser2013
    (ref. 35) and entered none. The paper builds on ref. 35 ("a modification to the classical clutch
    model [35]", p. 2; Table 1 is its base set) and says only that its optimum "matches experimental
    observations reported to date [35,40]" (p. 5): a trend (an optimum exists), quantified by no
    number. bangasser2013's measurements, all redrawn from other works, are: (1) Kong et al.'s
    integrin-fibronectin bond lifetimes against force (Fig. 7C, tau_kong_fig7c). No model here gives a
    single bond's lifetime; the clutches here are slip bonds (Eq. 3) inside an ensemble simulation, and
    the model's cycle_time is the ensemble's load-and-fail period, another quantity despite the shared
    shape (time from force and rates) of catch_slip_eq9 and clutch_axial_ssa. (2) Chan and Odde's
    neuron retrograde flows (Fig. S1B, v_figS1b_measured): a quantity clutch_axial_ssa gives, but
    indexed by gel Young's modulus (substrate_modulus, kPa), while the model takes a spring constant
    (substrate_stiffness, pN/nm); the two are different quantities of different dimension and cannot be
    crossed in a sweep, and no model of either record converts one to the other (bangasser2013's
    q_xval_chan2008_ksub, q_xval_chan2008_figS1b_positions). Were they converted, the run would be the
    canonical model (ks^eps0 = 0, no residual strain) with Table 1, which is bangasser2013's base set
    fitted to these same points: a repeat of that paper's fit and a reduces_to relation between
    models, not a test of this paper's orthogonal spring. The same flows from chan2008 itself are
    discussed in q_xval_chan2008_none. (3) Normalized migration (Fig. 1A) and normalized traction
    (Fig. 1B) of eight cell types against modulus, from refs. 2, 4, 7, 10, 11, 12, 15: migration is not
    an output here, and each cell type's clutch and motor numbers, its residual strain and the
    modulus-to-ks conversion are unstated, so a verdict would test added inputs, not the model. In the
    other direction this record has no measurements (bangasser2013/q_xval_panzetta2023_none).
  citation: {page: 5, printed_page: "5", quote: "maximal adhesion strength) and matches experimental observations", where: text}
