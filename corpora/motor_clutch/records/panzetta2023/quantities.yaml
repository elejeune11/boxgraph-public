- {id: clutch_number, name: number of available molecular clutches nc, dimension: dimensionless}
- {id: motor_number, name: number of myosin motors nm, dimension: dimensionless}
- {id: motor_stall_force, name: stall force of one myosin motor Fm, dimension: "[force]"}
- {id: unloaded_motor_velocity, name: velocity of free myosin motors vu, dimension: "[length]/[time]"}
- {id: clutch_on_rate, name: clutch association rate kon, dimension: "1/[time]"}
- {id: clutch_off_rate_unloaded, name: clutch unloaded off rate koff, dimension: "1/[time]"}
- {id: clutch_rupture_force, name: characteristic clutch bond rupture force Fb, dimension: "[force]"}
- {id: clutch_stiffness, name: clutch spring constant kc, dimension: "[force]/[length]"}
- {id: substrate_stiffness, name: substrate spring constant ks, dimension: "[force]/[length]"}
- {id: orthogonal_spring_stiffness, name: spring constant of the orthogonal spring ks^eps0, dimension: "[force]/[length]"}
- {id: orthogonal_spring_rest_length, name: undeformed (reference) length l of the orthogonal spring, dimension: "[length]"}
- {id: orthogonal_spring_deformed_length, name: deformed length l' of the orthogonal spring, dimension: "[length]"}
- {id: residual_strain, name: residual strain eps0 of the orthogonal spring, dimension: dimensionless}
- {id: retrograde_flow_rate, name: mean F-actin retrograde flow rate, dimension: "[length]/[time]"}
- {id: engaged_clutch_number, name: mean number of engaged clutches, dimension: dimensionless}
- {id: clutch_force_total, name: mean summed force of the engaged clutches, dimension: "[force]"}
- {id: substrate_position, name: mean substrate position xs, dimension: "[length]"}
- {id: traction_force, name: mean traction force exerted inside the substrate spring (Fig. 3D), dimension: "[force]"}
- {id: cycle_time, name: mean time between two successive failure events, dimension: "[time]"}
- {id: optimal_clutch_number, name: optimal number of clutches (minimum of the retrograde flow over nc), dimension: dimensionless}
- {id: optimal_nc_relative_increase, name: increase of the optimal nc relative to no residual strain, dimension: dimensionless}
- {id: optimal_nc_increase, name: increase of the optimal nc in clutches relative to no residual strain, dimension: dimensionless}
- {id: optimal_nc_normalised, name: optimal nc divided by the optimal nc at no residual strain (Fig. 8A), dimension: dimensionless}
- {id: optimal_nc_rate_of_change, name: slope of the secant between consecutive points of the normalised optimal nc against strain (Fig. 8B), dimension: dimensionless}
- {id: optimal_nc_ratio, name: ratio of the optimal nc on the stiff substrate to that on the soft one, dimension: dimensionless}
