# Inputs the paper does not state, needed to run its models against its figures (figure pass).
- id: ke_canonical_added
  quantity: orthogonal_spring_stiffness
  unit: pN/nm
  printed: "0"
  basis: >-
    The canonical (original) model of Figs. 3, 4 and S2 is the clutch model without the orthogonal
    spring (pp. 2-4, Fig. S1); in the record's modified model that is ks^eps0 = 0, which leaves
    Fs = ks xs (Eq. 6 without its first term).
  alternatives: []
  stands_for: "ks^eps0 in Eq. 6 for the canonical model"
- id: ks_s2r_added
  quantity: substrate_stiffness
  unit: pN/nm
  printed: "0.1"
  basis: >-
    Fig. S2 (right) plots flow against nc without saying the substrate stiffness. Its minimum, near
    nc = 40 at about 73.5 nm/s, is where the paper places the soft-substrate optimum (40, p. 6) and
    matches Fig. 5A at no strain, so ks = 0.1 pN/nm.
  alternatives: ["1"]
  stands_for: "ks in Fig. S2 (right)"
- id: nc_s2l_added
  quantity: clutch_number
  unit: dimensionless
  printed: "40"
  basis: >-
    Fig. S2 (left) plots flow against substrate stiffness without saying nc (nor nm). Its optimum near
    ks = 0.1 pN/nm with a minimum flow of about 73.5 nm/s equals the minimum of Fig. S2 (right) at
    nc of about 40, the paper's soft-substrate optimum (p. 6); nm = nc as always (p. 5).
  alternatives: ["50", "445"]
  stands_for: "nc and nm in Fig. S2 (left)"
