#
# Relations to Chan and Odde 2008 (ref. 36, record chan2008), reviewed 2026-11-21.
# The paper cites ref. 36 only for what the clutch model explains: stiffness sensing ("the ECM stiffness
# [34,36]", p. 2; "sense ECM stiffness [34,36]", p. 3) and the stiffness optimum ("is maximum [34,36]",
# p. 2); the superscript "36" on p. 5 ("cause the failure of the system36") is a run-in citation in the
# same sense. Its own model is "a modification to the classical clutch model [35]" (p. 2) and its
# master equations are "those introduced by Bengasser et al." (p. 3), not ref. 36's. So no relation to a
# chan2008 model is stated, and no value is taken from ref. 36 (no datum names it as source; chan2008 is
# the earlier paper, so it takes none from this one): no cited.yaml on either side.
#
# Not entered: chan2008/force_velocity_eq3 (the shape that paired the records). This paper's Eq. 10,
# vf = vu (1 - Fs/(nm Fm)), is the same linear motor law as Chan's Eqs. 3-4, but here it sits inside
# clutch_axial_ssa and has no model of its own, and a whole Gillespie simulation is not the same as one
# step of it. The law meets Chan's through the reduction below. The other chan2008 models (off_rate_eq1,
# cerruti_force_eq11, ksub_eq13, motor_clutch_E) have no counterpart here; this paper's substrate is a
# spring stiffness, never a Young's modulus.
#
# The reduction below is proposed: with the orthogonal spring removed (ks^eps0 -> 0), Eq. 6 leaves
# Fs = ks xs and the model is the classical one-module motor-clutch model, which is Chan's SOM Eqs. 1-5
# term for term (Bell off-rate Eq. 3 = Chan Eq. 1, Hooke clutch Eq. 4 = Chan Eq. 2, motor law Eq. 10 =
# Chan Eqs. 3-4, force balance Eq. 5 = Chan Eq. 5), solved by a different algorithm.
# Units pN, nm, s on both sides. Chan signs retrograde quantities negative (Table S1: vu, Fm, Fb < 0) and
# its record reports the flow and mean traction as positive magnitudes; this record counts them positive.
- id: rel_axial_ke0_reduces_to_chan2008_flow
  kind: reduces_to
  a: panzetta2023/clutch_axial_ssa
  b: chan2008/motor_clutch
  mapping: {nm: "nm", Fm: "-Fm", vu: "-vu", nc: "nc", kon: "kon", koff: "koff", Fb: "-Fb", kc: "kc", ksub: "ks"}
  output_map: {v_retro: v_retro}
  limit: {ke: "0"}
  regime: {nc: [40, 60], nm: [40, 60], Fm: [1.6, 2.4], vu: [96, 144], kon: [0.24, 0.36], koff: [0.08, 0.12],
           Fb: [1.6, 2.4], kc: [0.64, 0.96], ks: [0.1, 1], ke: [0, 1], l: [500, 1500], eps0: [0, 1]}
  tolerance: 0.1
  provenance: proposed
  reason: >-
    With ks^eps0 -> 0 this paper's model is Chan and Odde's motor-clutch model (SOM Eqs. 1-5) with the
    substrate as one linear spring: the same Bell off-rate, clutch spring, linear motor law and force
    balance, and a newly engaged clutch starting at the substrate position. Chan steps time at a fixed
    dt; this paper uses Gillespie's first-reaction method (Eq. 12). Both sample the same jump process
    (Chan's to first order in dt), so their time-averaged retrograde flows should agree within sampling
    and time-step error.
  assumptions:
    - "signs: Chan's vu, Fm and Fb are negative by its convention (Table S1), so they map to minus this paper's positive values; Chan's v_retro (time average of -vfilament) and this one (time average of vf, retrograde positive) are then both positive"
    - "the runs differ in algorithm (fixed step dt = 0.005 s for 300 s there; 100,000 events, several thousand seconds here) and random stream; the 10 % tolerance (added, set before the test) is the corpus's tolerance for one-module stochastic relations (as rel_axial_ke0_reduces_to_bangasser2017_module_flow and bangasser2013/rel_chan_fixed_step_approximates_ssa)"
    - "the regime is centred on this paper's Table 1 values (nm, nc 40 to 60, ks 0.1 to 1 pN/nm); l and eps0 drop out in the limit"
    - "probe by the relator after the first test (2026-11-21; nc = nm = 50, Table 1 values, ke = 1e-8, seed 1): flow 101.6 here against 77.6 in Chan's model at ks = 0.1 pN/nm and 105.5 against 99.9 at ks = 1; Chan's result moves by under 5 % with dt ten times smaller (0.0005 s) or the run ten times longer (3000 s), so the gap is not Chan's time step or run length but the two algorithms (fixed-step association/dissociation each step, against a first-reaction step whose rates stay frozen over each event interval); both sides obey their own motor law v = vu (1 - F/(nm Fm)), so the difference is in the clutch load, not in the mapping"
- id: rel_axial_ke0_reduces_to_chan2008_traction
  kind: reduces_to
  a: panzetta2023/clutch_axial_ssa
  b: chan2008/motor_clutch
  mapping: {nm: "nm", Fm: "-Fm", vu: "-vu", nc: "nc", kon: "kon", koff: "koff", Fb: "-Fb", kc: "kc", ksub: "ks"}
