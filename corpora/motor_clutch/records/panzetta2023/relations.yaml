#
# Relations to Bangasser, Rosenfeld and Odde 2013 (ref. 35, record bangasser2013), reviewed 2026-11-21.
# The paper says "we introduced a modification to the classical clutch model [35] by including a second
# spring in the perpendicular direction" (p. 2), that the substrate spring translates "as happens in the
# original motor clutch formulation [34,35]" (p. 4), and compares "the original clutch model and its
# modified version" with no residual strain (Sec. 3.2, Fig. 2: nc = 50 and 400, ks = 1 pN/nm), finding
# the dynamics "not substantially affected by the introduction of the orthogonal spring" (p. 5). Its
# optimum "matches experimental observations reported to date [35,40]" (p. 5) is a statement about
# experiments, not a model relation.
# No value is taken from ref. 35 (no datum names it as source; bangasser2013 is the earlier paper), so
# there is no cited.yaml on either side.
# Not entered:
# - bangasser2013/catch_slip_eq9 (the shape that paired the records): this paper uses only the Bell slip
#   bond koff exp(Fc,i/Fb) (Eq. 3), inside clutch_axial_ssa, with no model of its own; Eq. 9's first term
#   meets it through bangasser2013/rel_ssa_offrate_from_bell and the relations below. Its catch term has
#   no counterpart here, and a whole simulation's cycle time is not a bond lifetime.
# - bangasser2013/optimal_stiffness against optimal_nc_axial: one is an optimum over substrate stiffness
#   at fixed nc, the other over nc (= nm) at fixed stiffness; no mapping relates them.
# Units pN, nm, s on both sides; both records count forces, positions and flow positive in the
# retrograde direction.
- id: rel_axial_derived_from_bangasser2013_ssa
  kind: derived_from
  a: bangasser2013/motor_clutch_ssa
  b: panzetta2023/clutch_axial_ssa
  mapping: {nc: "nc", nm: "nm", Fm: "Fm", vu: "vu", kon: "kon", koff: "koff", Fb: "Fb", kc: "kc", ks: "ksub",
            ke: "ksub", l: "1000", eps0: "0"}
  steps:
    - "keep the classical motor-clutch model of ref. 35 (Bell off-rate, clutch springs, linear motor law, clutch-substrate force balance, Gillespie events)"
    - "include a second spring ks^eps0 perpendicular to the substrate spring, joined to it by a pin-roller at P1 (Fig. 1A; Eq. 6)"
    - "let that spring carry an axial residual strain eps0 by moving its roller from P2 to P2' (Eq. 1, Fig. 1B)"
  provenance: stated
  citation: {page: 2, printed_page: "2", quote: "we introduced a modiﬁcation to the classical clutch model [35] by", where: "Sec. 2.1; also p. 4: 'as happens in the original motor clutch formulation [34,35]'"}
  assumptions:
    - "the steps are the paper's words; adding a spring cannot be applied symbolically, so the derivation stands as stated; it is tested numerically in rel_axial_eps0_approximates_bangasser2013_ssa_* and rel_axial_ke0_reduces_to_bangasser2013_ssa_*"
    - "the mapping of the new ingredients is the reader's: ks^eps0 = ks as the paper sets (Sec. 2.2), l = 1000 nm as printed (p. 7), eps0 = 0"
