# Relations to Bangasser et al. 2017 (ref. 40, record bangasser2017), reviewed 2026-11-21.
# The paper cites ref. 40 twice: its optimal stiffness "matches experimental observations reported to
# date [35,40]" (p. 5), and "the original model has provided a mechanistic explanation of stiffness
# sensitive cell migration and the existence of a stiffness optimum for different cell types [40]"
# (p. 7). Its own model is "a modification to the classical clutch model [35]" (p. 2), ref. 35 being
# Bangasser et al. 2013, not ref. 40. So no relation to a bangasser2017 model is stated, and no value
# is taken from ref. 40 (no cited.yaml). The two relations below are proposed.
#
# Not entered: bangasser2017/cms (the whole-cell migration simulator, whose shape paired these papers).
# It is runnable: false in its record, so no relation to it can be tested, and its outputs (mean module
# flow over many modules, summed traction over modules and cell body, aspect ratio, motility) are
# whole-cell quantities that the one-module model here does not produce. The relation is entered with
# that record's one-module stand-in instead, which is the cms rule set for a single module.
#
# Units pN, nm, s on both sides; both records count forces, positions and flow positive in the
# retrograde direction.
- id: rel_axial_ke0_reduces_to_bangasser2017_module_flow
  kind: reduces_to
  a: panzetta2023/clutch_axial_ssa
  b: bangasser2017/module_ssa
  mapping: {nm: "nm", Fm: "Fm", vm: "vu", nc: "nc", kon: "kon", koff: "koff", Fb: "Fb", kc: "kc", ks: "ks"}
  output_map: {v_flow: v_retro}
  limit: {ke: "0"}
  regime: {nc: [40, 60], nm: [40, 60], Fm: [1.6, 2.4], vu: [96, 144], kon: [0.24, 0.36], koff: [0.08, 0.12],
           Fb: [1.6, 2.4], kc: [0.64, 0.96], ks: [0.1, 1], ke: [0, 1], l: [500, 1500], eps0: [0, 1]}
  tolerance: 0.1
  provenance: proposed
  reason: >-
    With the orthogonal spring removed (ks^eps0 -> 0), Eq. 6 leaves Fs = ks xs and the model is one
    motor-clutch module: Bell off-rate koff exp(Fc,i/Fb) (Eq. 3; bangasser2017 Eq. 1), linear motor
    law vf = vu (1 - Fs/(nm Fm)) (Eq. 10; bangasser2017 Eq. 2), clutch-substrate force balance (Eqs.
    4-5; bangasser2017 Eq. 4), engaged clutches advanced with the F-actin flow and a newly engaged
    clutch starting at the substrate position, solved by Gillespie's algorithm. These are the module
    rules of bangasser2017's CMS, which its record runs as module_ssa. The paper itself says the
    dynamics are "not substantially affected by the introduction of the orthogonal spring" (p. 5).
  assumptions:
    - "the two simulations differ in Gillespie variant (first-reaction method, Eq. 12 here; direct method, bangasser2017 Eqs. 10-11), run length (100,000 events here; 500 s there) and random stream; both are exact samplers of the same jump process, so time averages agree within sampling noise, which the 10 % tolerance (added) is meant to cover"
    - "tolerance basis (added, measured by the relator 2026-11-21 at ke = 1e-8, Table 1 values, nc = nm = 40-60, ks = 0.1-1 pN/nm, 8 seeds each): one module_ssa run of 500 s has a seed-to-seed coefficient of variation up to 3.5 % in traction (range 10 %) and clutch_axial_ssa up to 1 %; the seed-averaged means of the two agree within 1 %. A first tolerance of 5 % was below this noise for a maximum over 20 single runs; 10 % is about three times the largest coefficient of variation, and the value bangasser2017's other module relations use"
    - "panzetta2023's clutch number and motor number stand for bangasser2017's module maxima n*c and n*m that its stand-in module holds (correspondences of quantities, not merged)"
    - "the regime is centred on panzetta2023's Table 1 values (nm = nc between 40 and 60, ks 0.1 to 1 pN/nm); l and eps0 drop out in the limit"
- id: rel_axial_ke0_reduces_to_bangasser2017_module_traction
  kind: reduces_to
  a: panzetta2023/clutch_axial_ssa
  b: bangasser2017/module_ssa
  mapping: {nm: "nm", Fm: "Fm", vm: "vu", nc: "nc", kon: "kon", koff: "koff", Fb: "Fb", kc: "kc", ks: "ks"}
  output_map: {F_trac: F_clutch}
  limit: {ke: "0"}
  regime: {nc: [40, 60], nm: [40, 60], Fm: [1.6, 2.4], vu: [96, 144], kon: [0.24, 0.36], koff: [0.08, 0.12],
           Fb: [1.6, 2.4], kc: [0.64, 0.96], ks: [0.1, 1], ke: [0, 1], l: [500, 1500], eps0: [0, 1]}
  tolerance: 0.1
  provenance: proposed
  reason: >-
    As rel_axial_ke0_reduces_to_bangasser2017_module_flow, for the force: with ks^eps0 -> 0 the summed
    engaged-clutch force here (Eq. 5) equals the substrate force ks xs, which is bangasser2017's
    module traction κs xs (its Eq. 4).
  assumptions:
    - "as rel_axial_ke0_reduces_to_bangasser2017_module_flow; panzetta2023's F_clutch (time average of the summed clutch force) and bangasser2017's F_trac (time average of κs xs) stand for the same force once the orthogonal spring carries none"
#
# Relations to cms_code (the MATLAB CMS v1.0 released with ref. 40), reviewed 2026-11-21: none entered.
# The paper does not cite or use the released code (its references list no code; its simulation is its
# own one-module Gillespie scheme, Sec. 2.2), and no datum here comes from it, so there is no stated
# relation and no cited.yaml line. Not proposed:
# - cms_code/cms2d_code (the whole simulator, the shape that paired the records) is runnable: false, and
#   its output rgflow is a whole-cell average over many modules, not one module's flow; as with
#   bangasser2017/cms above, nothing could be tested.
# - cms_code/off_rate_port and flow_port are single rules; here the same rules (Eqs. 3 and 10) sit inside
#   clutch_axial_ssa and have no model of their own, and the paper states no relation that would justify
#   adding one. They meet through bangasser2017: cms_code/rel_offrate_eq1 and rel_flow_eq2 relate the
#   ports to bangasser2017's Eqs. 1-2, and the relations above relate this model to bangasser2017's module.
#
# Relations to Panzetta et al. 2019 (ref. 39, record panzetta2019), reviewed 2026-11-21.
# The paper says its model extends ref. 39's "first modification of the molecular clutch model" (p. 2)
# and that the orthogonal spring "accounts for the strain energy accumulated within the substrate, when
# a given strain eps0 is introduced [39]" (p. 4). Ref. 39's prestretch x0 moves P1 along the substrate
# spring with an orthogonal spring of stiffness ks and rest length l (its Eqs. 6-7): that is this
# paper's transverse case (Fig. 1C; Eqs. 7-9) with ks^eps0 = ks and eps0 = sqrt(l^2 + x0^2)/l - 1.
# Ref. 39 solves the mean-field ODEs of Bangasser and Odde (2013b) over one load-and-fail cycle; this
# paper simulates the clutches one by one (Gillespie). No value is taken from ref. 39 (no datum names
# it as source), so there is no cited.yaml.
# Units pN, nm, s on both sides; forces, positions and flow positive in the retrograde direction.
- id: rel_transverse_derived_from_panzetta2019_two_spring
  kind: derived_from
  a: panzetta2019/clutch_two_spring_cycle
  b: panzetta2023/clutch_transverse_ssa
  mapping: {nc: "nc", nm: "nm", Fm: "Fm", vu: "vu", kon: "kon", koff: "koff", Fb: "Fb", kc: "kc", ks: "ks",
            ke: "ks", l: "l", eps0: "sqrt(l**2 + x0**2)/l - 1"}
  steps:
    - "keep ref. 39's substrate of two orthogonal springs (Fig. 1; Eqs. 6-7 there)"
    - "let the orthogonal spring carry a residual strain eps0 along its own axis (axial) or by moving P1 (transverse), Eq. 1"
    - "solve the clutches one by one with a Gillespie algorithm (Eq. 12, Sec. 2.2) instead of ref. 39's mean-field ODEs"
  provenance: stated
  citation: {page: 2, printed_page: "2", quote: "by an extension of the clutch model: a stochastic", where: "Introduction; also p. 4: 'when a given strain eps0 is introduced [39]'"}
  assumptions:
    - "the steps are the paper's words; the change from mean-field ODEs to a stochastic simulation is not a step that can be applied symbolically, so the derivation stands as stated and is tested numerically in rel_transverse_approximated_by_panzetta2019_two_spring"
    - "the mapping is the reader's: ref. 39's prestretch x0 is this paper's transverse displacement of P1, giving eps0 by Eq. 9, and ref. 39's orthogonal spring has the substrate's stiffness (ks^eps0 = ks, as this paper also sets, Sec. 2.2)"
- id: rel_transverse_approximated_by_panzetta2019_two_spring
  kind: approximated_by
