  tolerance: 0.1
  provenance: proposed
  reason: >-
    The numerical test of the stated derivation above: ref. 39's two-spring model at prestretch x0 is
    this paper's transverse case at eps0 = sqrt(l^2 + x0^2)/l - 1 with ks^eps0 = ks, solved in the
    mean field (ref. 39's Eqs. 3, 11: <k*off> averaged with a gamma closure of shape r) instead of
    clutch by clutch with the Bell off-rate koff exp(Fc,i/Fb) (Eq. 3 here). A mean-field closure of a
    stochastic model is an approximation, so the error between the two is measured.
  assumptions:
    - "inputs at this paper's Table 1 and stiff substrate (ks = ks^eps0 = 1 pN/nm, the substrate of its transverse-strain results, Fig. 7); l and eps0 sampled over the ranges of its figures (l 500 to 2000 nm, eps0 0 to 1)"
    - "nc = nm = 400, the paper's load-and-fail case (p. 4); the paper always sets nm = nc (p. 5), which a regime of independent ranges cannot keep, and a first test with nc and nm sampled apart over 50 to 1000 left ref. 39's model without a cycle (stalled motors) wherever nm < nc"
    - "r = 3 is panzetta2019's added value (r_added, from ref. 42); this paper has no r"
    - "the outputs are not defined alike: ref. 39's flow is averaged over one load-and-fail cycle from an unbound start, this one's over a run of 100,000 events (time average); both are the readers' readings of 'actin flow rate' in each record"
    - "the F0 of Eq. 8 here, ks^eps0 eps0 l + ks x0 as printed, is not the horizontal force of ref. 39's Eq. 6 at x0 (whose orthogonal term carries a factor x0/sqrt(l^2 + x0^2)); the record's transverse model uses the printed F0, so part of any difference at eps0 > 0 can come from it"
    - "tolerance 0.1 (added, set before the test) is the acceptable error the corpus uses for stochastic-against-deterministic module relations; a probe by the relator at nc = nm = 50 to 1000 found the mean-field flow up to about 25 % below the simulated one near the optimum (nc 200 to 1000)"
