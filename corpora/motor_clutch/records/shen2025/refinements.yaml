- {id: ref_limit_rtol, run: run_limit_Nc5, setting: rtol, factors: [1, 10, 100], mode: divide, output: freq,
   tolerance: "1%", tolerance_basis: "added: the frequency is plotted, read to about 0.1 Hz of 1.6 Hz", tolerance_added: true}
- {id: ref_limit_window, run: run_limit_Nc5, setting: t_transient, factors: [1, 2], mode: multiply, output: amp,
   tolerance: "1%", tolerance_basis: "added: a longer transient must not change the amplitude of a settled limit cycle", tolerance_added: true}
- {id: ref_hopf_grid, run: run_hopf_Nc10, setting: n_grid, factors: [1, 2, 4], mode: multiply, output: vu_hopf,
   tolerance: "0.1%", tolerance_basis: "added: well below the printed precision of 1.7", tolerance_added: true}
