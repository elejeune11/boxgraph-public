# A helper model for the relation to bell1978, which this paper states for the off-rate alone;
# the same law sits inside Eq. 2 and every model of the record built on it.
id: clutch_off_rate
name: loaded clutch off-rate, Bell's model (p. 3, the exponential in Eq. 2)
role: model
stated: {page: 3, printed_page: "014417-3", quote: "engaged clutches increases the detachment rate koff exponen-", where: "text before Eq. 2"}
equation: "koff = koff0 exp(flc/Fb)"
inputs:
  koff0: {quantity: clutch_off_rate_unloaded, unit: 1/s}
  flc: {quantity: clutch_tension, unit: pN}
  Fb: {quantity: clutch_rupture_force, unit: pN}
outputs:
  koff: {quantity: clutch_off_rate_loaded, unit: 1/s}
settings: {}
stochastic: false
