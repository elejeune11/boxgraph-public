id: fixed_point
name: fixed point of the five-dimensional system, stable branch (Eqs. 9-15)
role: model
stated: {page: 4, printed_page: "014417-4", quote: "of the dimension- less dynamical equations are given by", where: "Eqs. 9-15"}
equation: >-
  y~0 = f~s/k~m; nm0 = w~ Nm/(w~ + exp(f~s/f~d)); x~s0 = (nm0 f~s - F~)/k~s;
  x~o0 = (k~s/(nc0 k~c) + 1)(nm0 f~s - F~)/k~s; x~c0 = (nm0 f~s - F~)/(nc0 k~c);
  nc0 + (k~off0/k~on) nc0 exp((nm0 f~s - F~)/(nc0 F~b)) = Nc
inputs:
  w: {quantity: motor_rate_ratio_nd, unit: dimensionless}
  Nm: {quantity: n_motors_total, unit: dimensionless}
  kon: {quantity: clutch_on_rate_nd, unit: dimensionless}
  koff: {quantity: clutch_off_rate_nd, unit: dimensionless}
  fs: {quantity: stall_force_nd, unit: dimensionless}
  fd: {quantity: detachment_force_nd, unit: dimensionless}
  Fb: {quantity: rupture_force_nd, unit: dimensionless}
  km: {quantity: motor_stiffness_nd, unit: dimensionless}
  kc: {quantity: clutch_stiffness_nd, unit: dimensionless}
  ks: {quantity: substrate_stiffness_nd, unit: dimensionless}
  F: {quantity: external_load_nd, unit: dimensionless}
  Nc: {quantity: n_clutches_total, unit: dimensionless}
outputs:
  nm0: {quantity: n_motors_bound, unit: dimensionless}
  nc0: {quantity: n_clutches_bound, unit: dimensionless}
  y0: {quantity: motor_extension_nd, unit: dimensionless}
  xs0: {quantity: substrate_extension_nd, unit: dimensionless}
  xo0: {quantity: actin_displacement_nd, unit: dimensionless}
  xc0: {quantity: clutch_extension_nd, unit: dimensionless}
settings: {}
