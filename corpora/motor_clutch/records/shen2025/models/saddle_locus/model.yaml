id: saddle_locus
name: engaged clutches nc0 at the saddle-node point against Nc,min, over all loads (Eqs. 16-17; Fig. 12)
role: model
stated: {page: 5, printed_page: "014417-5", quote: "The bifurcation point can be obtained through the condi- tion where the derivative", where: "Sec. III A; Eqs. 16, 17; Fig. 12"}
equation: >-
  g'(nc0) = 1 + (k~off0/k~on) e^u (1 - u) = 0 with u = (nm0 f~s - F~)/(nc0 F~b); Nc,min = g(nc0) = nc0 (1 + (k~off0/k~on) e^u)
built_from: [saddle_node]
inputs:
  kon: {quantity: clutch_on_rate_nd, unit: dimensionless}
  koff: {quantity: clutch_off_rate_nd, unit: dimensionless}
  Nc: {quantity: n_clutches_total, unit: dimensionless, description: "Nc,min, the x position of a saddle-node point"}
outputs:
  nc_bif: {quantity: n_clutches_bound, unit: dimensionless}
settings: {}
