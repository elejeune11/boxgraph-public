id: char_scales
name: characteristic scales of the nondimensionalisation (Sec. II B)
role: model
stated: {page: 3, printed_page: "014417-3", quote: "scales for length, time, velocity, and force", where: "Sec. II B"}
equation: "l0 = (kB T/(wd0 Gamma))^1/2, tau = 1/wd0, v0 = l0 wd0, f = (wd0 Gamma kB T)^1/2"
inputs:
  wd0: {quantity: motor_detachment_rate_unloaded, unit: 1/s}
  Gamma_kT: {quantity: actin_friction_per_kT, unit: s/nm^2, description: "Gamma/(kB T)"}
outputs:
  l0: {quantity: char_length, unit: nm}
  tau: {quantity: char_time, unit: s}
  v0: {quantity: char_velocity, unit: nm/s}
  f_kT: {quantity: char_force_per_kT, unit: 1/nm, description: "f/(kB T) = (wd0 Gamma/(kB T))^1/2"}
settings: {}
