id: saddle_node
name: saddle-node bifurcation point Nc,min and nc0 there (Eqs. 16-17 with g'(nc0) = 0)
role: model
stated: {page: 5, printed_page: "014417-5", quote: "The bifurcation point can be obtained through the condi- tion where the derivative", where: "Sec. III A; Eqs. 14, 16, 17"}
equation: >-
  g'(nc0) = 1 + (k~off0/k~on) exp((nm0 f~s - F~)/(nc0 F~b)) (1 - (nm0 f~s - F~)/(nc0 F~b)) = 0;
  Nc,min = g(nc0) = nc0 + (k~off0/k~on) nc0 exp((nm0 f~s - F~)/(nc0 F~b)); F~ = j/10 nm0 f~s (Fig. 12)
inputs:
  w: {quantity: motor_rate_ratio_nd, unit: dimensionless}
  Nm: {quantity: n_motors_total, unit: dimensionless}
  kon: {quantity: clutch_on_rate_nd, unit: dimensionless}
  koff: {quantity: clutch_off_rate_nd, unit: dimensionless}
  fs: {quantity: stall_force_nd, unit: dimensionless}
  fd: {quantity: detachment_force_nd, unit: dimensionless}
  Fb: {quantity: rupture_force_nd, unit: dimensionless}
  load: {quantity: load_fraction, unit: dimensionless, description: "F~ / (nm0 f~s), j/10 in Fig. 12"}
outputs:
  Nc_min: {quantity: n_clutches_total, unit: dimensionless}
  nc_bif: {quantity: n_clutches_bound, unit: dimensionless}
settings: {}
