# Dimensional quantities (Table I)
- {id: motor_attachment_rate, name: myosin motor attachment rate to actin, dimension: "1/[time]"}
- {id: motor_detachment_rate_unloaded, name: bare (unloaded) myosin motor detachment rate, dimension: "1/[time]"}
- {id: n_motors_total, name: total number of available myosin motors, dimension: dimensionless}
- {id: clutch_on_rate, name: clutch attachment rate, dimension: "1/[time]"}
- {id: clutch_off_rate_unloaded, name: unloaded clutch dissociation rate, dimension: "1/[time]"}
- {id: motor_back_velocity, name: reverse motor velocity above the stall force, dimension: "[length]/[time]"}
- {id: motor_stall_force, name: myosin motor stall force, dimension: "[force]"}
- {id: motor_detachment_force, name: characteristic detachment force of a myosin motor, dimension: "[force]"}
- {id: clutch_rupture_force, name: characteristic clutch bond rupture force, dimension: "[force]"}
- {id: motor_stiffness, name: spring stiffness of one myosin motor, dimension: "[force]/[length]"}
- {id: clutch_stiffness, name: spring stiffness of one clutch, dimension: "[force]/[length]"}
- {id: substrate_stiffness, name: substrate spring stiffness, dimension: "[force]/[length]"}
- id: actin_friction_per_kT
  name: viscous friction coefficient of the actin bundle divided by kB T
  dimension: "[time]/[length]**2"
  description: Gamma / (kB T). The paper prints Gamma in kB T s/nm^2; with kB T taken as the unit, the printed number is Gamma/(kB T) in s/nm^2.
- id: substrate_friction_per_kT
  name: substrate friction coefficient divided by kB T
  dimension: "[time]/[length]**2"
  description: gamma / (kB T); printed in kB T s/nm^2.
- {id: thermal_energy, name: thermal energy kB T, dimension: "[energy]"}
- {id: clutch_tension, name: average tension flc = kc xc carried by one attached clutch, dimension: "[force]"}
- {id: clutch_off_rate_loaded, name: clutch dissociation rate koff under the tension flc, dimension: "1/[time]"}
- {id: unloaded_motor_velocity, name: intrinsic velocity vu of a myosin motor at zero load, dimension: "[length]/[time]"}
- {id: motor_load_force, name: average load force fl = km y on one attached myosin motor, dimension: "[force]"}
- {id: motor_velocity, name: velocity vm of an attached myosin motor along the actin bundle, dimension: "[length]/[time]"}
- {id: char_length, name: characteristic length l0 of the nondimensionalisation, dimension: "[length]"}
- {id: char_time, name: characteristic time tau of the nondimensionalisation, dimension: "[time]"}
- {id: char_velocity, name: characteristic velocity v0 of the nondimensionalisation, dimension: "[length]/[time]"}
- id: char_force_per_kT
  name: characteristic force f divided by kB T
  dimension: "1/[length]"
  description: f / (kB T); Table I prints f in kB T/nm.
- {id: char_force, name: characteristic force f of the nondimensionalisation, dimension: "[force]"}
# Dimensionless parameters (Section II B)
- {id: motor_rate_ratio_nd, name: "omega~ = omega_a / omega_d0", dimension: dimensionless}
- {id: clutch_on_rate_nd, name: "k~on = kon / omega_d0", dimension: dimensionless}
- {id: clutch_off_rate_nd, name: "k~off0 = koff0 / omega_d0", dimension: dimensionless}
- {id: clutch_rate_ratio_nd, name: "k~off0 / k~on, ratio of the unloaded clutch off and on rates", dimension: dimensionless}
- {id: stall_force_nd, name: "f~s = fs / f", dimension: dimensionless}
- {id: detachment_force_nd, name: "f~d = fd / f", dimension: dimensionless}
- {id: rupture_force_nd, name: "F~b = Fb / f", dimension: dimensionless}
- {id: motor_stiffness_nd, name: "k~m = km l0 / f", dimension: dimensionless}
- {id: clutch_stiffness_nd, name: "k~c = kc l0 / f", dimension: dimensionless}
- {id: substrate_stiffness_nd, name: "k~s = ks l0 / f", dimension: dimensionless}
- {id: external_load_nd, name: "external load F~ = F / f", dimension: dimensionless}
- id: load_fraction
  name: external load as a fraction of the motor force at steady state
  dimension: dimensionless
  description: F~ / (nm0 f~s), the parameter j/10 of Fig. 12 and the 1/2 and 1 of Figs. 13(a,b).
- {id: motor_velocity_nd, name: "unloaded motor velocity v~u = vu / v0", dimension: dimensionless}
- {id: friction_ratio, name: "substrate to actin friction ratio gamma / Gamma", dimension: dimensionless}
- {id: n_clutches_total, name: total number of available clutches Nc, dimension: dimensionless}
# States and results
- {id: n_motors_bound, name: number of attached motors nm at the fixed point, dimension: dimensionless}
- {id: n_clutches_bound, name: number of engaged clutches nc at the fixed point, dimension: dimensionless}
- {id: actin_displacement_nd, name: "dimensionless actin bundle displacement x~o at the fixed point", dimension: dimensionless}
- {id: motor_extension_nd, name: "dimensionless mean motor extension y~ at the fixed point", dimension: dimensionless}
- {id: substrate_extension_nd, name: "dimensionless substrate extension x~s at the fixed point", dimension: dimensionless}
- {id: clutch_extension_nd, name: "dimensionless mean clutch extension x~c at the fixed point", dimension: dimensionless}
- id: jacobian_determinant
  name: determinant of the 5x5 Jacobian at the stable fixed point
  dimension: dimensionless
- id: oscillation_frequency
  name: frequency of the limit cycle oscillation
  dimension: "1/[time]"
- id: motor_extension_amplitude_nd
  name: amplitude of the oscillation of the dimensionless mean motor extension y~ on the limit cycle
  dimension: dimensionless
