- id: q_f_unit
  kind: possible_error
  about: [f_printed, cmp_f]
  text: >-
    Table I prints the characteristic force as 2.3033 kB T/nm. Its definition f = (wd0 Gamma kB T)^1/2 (p. 3)
    with wd0 = 350 /s and Gamma = 893e-6 kB T s/nm^2 gives f = 0.5591 kB T/nm. The printed number is f in pN
    with kB T = 4.12 pN nm (0.5591 x 4.12 = 2.3033): the unit kB T/nm looks like a misprint for pN. The record
    keeps the printed unit (cmp_f is not reproduced) and uses f in pN, through kT_added, to make the forces
    and stiffnesses dimensionless.
  citation: {page: 4, quote: "Characteristic force f 2.3033 kB T/nm", where: Table I}
- id: q_kT
  kind: unstated_input
  about: [kT_added, run_nondim]
  text: >-
    The temperature (or kB T in pN nm) is not stated. It is needed to turn kc, km, fs, fd, Fb and ks into the
    dimensionless k~c, k~m, f~s, f~d, F~b and k~s. The record takes kB T = 4.12 pN nm, the value that makes
    Table I's f = 2.3033 consistent.
- id: q_A3_J55
  kind: possible_error
  about: [stability_boundaries, det_A3, det_eq20, rel_A3_is_jacobian_of_eq18]
  text: >-
    The entry J55 of the Jacobian A3 is printed as -(Gamma/gamma) nc0 k~c - k~s. The derivative of the fifth
    component of Eq. 18 / A1, (Gamma/gamma)[nc k~c (x~o - x~s) - k~s x~s], with respect to x~s is
    -(Gamma/gamma)(nc0 k~c + k~s). Every other entry of A3 equals the derivative of A1 (checked symbolically).
    The two forms agree only for gamma = Gamma (Fig. 2(a,c,e)); they differ for Fig. 2(b) (gamma = 100 Gamma),
    2(d,f) (2 Gamma) and Fig. 7. Eq. 20 equals det(A3) as printed, which does not depend on gamma, while the
    determinant of the true Jacobian is (Gamma/gamma) times Eq. 20; the sign, and so the paper's use of |J| to
    tell the branches apart, is unaffected. The record keeps the printed A3 (stability_boundaries) and adds
    the corrected variant (stability_boundaries_corrected). Whether the paper's diagrams for gamma != Gamma
    used the printed or the correct entry is not known.
  citation: {page: 14, quote: "We compute the Jacobian matrix about the fixed points of the system", where: Eq. A3}
- id: q_vu0_close
  kind: reading
  about: [vu0_Nc10_caption, cmp_vu0_Nc10]
  text: >-
    The Fig. 6 caption places (Nc, v~u) = (10, 1.7) "close to the upper boundary of the US region in Fig. 2(a)".
    The record compares 1.7 with the Hopf boundary v~u0(10) of the printed Jacobian on the Fig. 2(a)
    conditions; 1.7 is a chosen point near the boundary, so its digits bound the boundary only loosely.
  citation: {page: 9, quote: "positioning this point close to the upper boundary of the US region", where: "Fig. 6 caption"}
- id: q_piecewise_dropped
  kind: unstated_model
  about: [limit_cycle, vb]
  text: >-
    The force-velocity relation of the motors is piecewise (p. 2: vu for fl <= 0, vu(1 - fl/fs) up to fs, vb
    above fs), with vb = 0.2256 um/s in Table I, but the dimensionless system Eq. 6 uses vu(1 - k~m y~/f~s) for
    every y~, and Eq. 1 uses |fl| where Eq. 6 has k~m y~. The fixed point and its Jacobian lie on the linear
    branch, so the stability analysis is unaffected, but on a limit cycle y~ leaves [0, f~s/k~m] (the record's
    run at Nc = 5, v~u = 1 reaches about 2.5 f~s/k~m). The limit_cycle model integrates Eq. 6 as printed;
    whether Fig. 11 used the piecewise relation is not stated.
  citation: {page: 4, quote: "We now proceed to render our dynamical equations into", where: Eq. 6}
- id: q_amplitude_def
  kind: unstated_model
  about: [limit_cycle, amp_Nc5]
  text: >-
    Fig. 11(b,d) plots the "amplitude of y~" of the limit cycle without defining it (half the peak-to-peak
    range, the peak-to-peak range, or the excursion above y~0). The limit_cycle model reports half the
    peak-to-peak range; a comparison with Fig. 11(d) should test the other definitions too.
- id: q_limit_cycle_numerics
  kind: numerics
  about: [limit_cycle, run_limit_Nc5]
  text: >-
    The paper gives no solver, initial state, integration time or method for the frequencies and amplitudes of
    Fig. 11. The record starts at the fixed point with nc raised by 1%, discards 20000 dimensionless time units
    (about 57 s) and measures over the next 20000; the refinements vary the tolerance and the transient.
- id: q_tau_used
  kind: choice
  about: [run_limit_Nc5, tau_printed]
  text: >-
    Frequencies in Hz need tau. The record uses tau = 1/wd0 = 0.002857 s; Table I rounds it to 0.0029 s, which
    would lower the frequencies by 1.5%. The paper does not say which it used.
- id: q_ks_figs8to10
  kind: unstated_input
  about: [run_fixed_Nc10]
  text: >-
    Figs. 8-10 (fixed points against the parameters) and Fig. 11 do not state the substrate stiffness or
    gamma/Gamma. Fig. 11 says it is taken from Fig. 2(a) (ks = kc, gamma = Gamma); the record uses the same for
    Figs. 8-10 (nc0 does not depend on ks; x~o0 and x~s0 do).
- id: q_figures_not_read
  kind: reading
  about: [fixed_point, saddle_node, stability_boundaries, limit_cycle]
  text: >-
    The model results of this paper are only plotted (Figs. 2, 5, 6, 7, 8-10, 11, 12, 13). Their calibrated
    readings, and the comparisons of the record's runs with them, are left to the figure stage. Runs ready
    for it: run_saddle_F0 (Fig. 12, j = 0: the record gives Nc,min = 0.98, nc0 = 0.52, consistent with the
    first red point by eye), run_fixed_Nc10 (Figs. 8, 9), run_hopf_Nc10 (Fig. 2(a)), run_limit_Nc5 (Fig. 11).
# ---- added by the audit ----------------------------------------------------------------------------
- id: q_eq7_gamma_factor
  kind: possible_error
  about: [q_A3_J55]
  text: >-
    Eq. 7 (p. 4) prints dx~c/dtau = nm k~m y~ - (1 + Gamma/gamma) nc k~c x~c + k~s x~s - F~. With x~c = x~o - x~s
    and the third and fifth lines of Eq. 6, the substrate term is (Gamma/gamma) k~s x~s; the printed form drops
    Gamma/gamma from it. It is the same omission as in J55 of A3 (q_A3_J55): in both places Gamma/gamma
    multiplies only the clutch term of the fifth equation. Two independent places with the same form suggest
    the authors' working fifth equation may have been dx~s/dtau = (Gamma/gamma) nc k~c x~c - k~s x~s, so the
    diagrams with gamma != Gamma (Fig. 2(b,d,f), Fig. 7) may have been computed with it. No model in the record
    uses Eq. 7.
  citation: {page: 4, quote: "we can derive the equation for the average exten- sion of the attached clutches", where: Eq. 7}
- id: q_tableII_U_row
  kind: possible_error
  about: [stability_boundaries]
  text: >-
    Table II (p. 6) gives two combinations for U: 2 positive and 3 negative real eigenvalues, and 1 positive
    and 4 negative. The text above it (p. 6, item 2) says "three real negative and two real positive" or "one
    real negative and four real positive". The table's second row contradicts the text, and also contradicts
    |J| < 0 on the stable branch (p. 5): one positive and four negative real eigenvalues give a positive
    determinant, while one negative and four positive give a negative one. The text's version is the
    consistent one. The record's classifier calls any real spectrum with a positive eigenvalue U, so it is
    unaffected.
  citation: {page: 6, quote: "alternatively, there is one real negative and four", where: "Sec. III B item (2); Table II"}
- id: q_case2_trivial
  kind: possible_error
  about: [fixed_point, saddle_node, stability_boundaries]
  text: >-
    Case 2 (p. 5) states that for nm0 f~s - F~ <= 0 Eq. 15 "has only the trivial solution where Nc = nc0 = 0".
    With A = nm0 f~s - F~ <= 0, g(nc0) of Eq. 16 rises monotonically from 0+ (the paper says so) to infinity,
    so Eq. 15 has exactly one positive root for every Nc > 0 (for A = 0, nc0 = Nc/(1 + k~off0/k~on), x~c0 = 0).
    Fig. 13(b) (p. 12) is drawn at F~ = nm0 f~s, i.e. A = 0, and shows S, SS, US and U regions with no N
    region, which agrees with one fixed point existing, not with only the trivial one. The record's models
    follow the text and raise an error for A <= 0, so they cannot reproduce Fig. 13(b) or Fig. 13(e,f) where
    F~ >= nm0 f~s; whether to extend them is left to a later reader.
  citation: {page: 5, quote: "has only the trivial solution where", where: "Case 2"}
- id: q_amplitude_linear
  kind: overstated_claim
  about: [limit_cycle, amp_Nc5]
  text: >-
    Sec. III E (p. 11) and the conclusion (p. 13) say the amplitude of y~ is "proportional to v~u0(Nc) - v~u"
    below the Hopf boundary, which the paper calls supercritical (p. 8). Near a supercritical Hopf point the
    normal form gives an amplitude growing as the square root of the distance from the boundary, not linearly.
    The claim may hold only as a description of Fig. 11(d) away from the boundary. Testable with limit_cycle
    runs at several v~u just below run_hopf's v~u0 at one Nc, against the Fig. 11(d) reading; the audit did not
    run them.
  citation: {page: 11, quote: "the amplitude of ỹ is proportional to", where: "Sec. III E; Fig. 11(d)"}
- id: q_ks_fig2a_choice
  kind: reading
  about: [ks_soft_added]
  text: >-
    The audit agrees that ks = kc on the soft substrate is stated (p. 8: "when the substrate stiffness ks = kc"),
    so ks_soft_added could arguably be a reported datum citing p. 8 rather than an added input; its value
    0.03144 pN/nm then follows from Table I. Left as the first reader entered it.
  citation: {page: 8, quote: "when the substrate stiffness ks = kc and is found to", where: "Sec. III C"}
