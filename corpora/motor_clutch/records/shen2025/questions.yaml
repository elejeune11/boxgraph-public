  kind: reading
  about: [q_A3_J55, q_eq7_gamma_factor, cmp_fig2f_hopf, cmp_fig2f_hopf_corr, cmp_fig2b_hopf, cmp_fig2b_hopf_corr]
  text: >-
    The Fig. 2 readings settle which Jacobian the gamma != Gamma diagrams were computed with. The Hopf
