# cross-record validation against bell1978 (2026-11-21): none added
- id: q_xval_bell1978_none
  kind: reading
  about: [clutch_off_rate, fixed_point, load_of_fraction]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    bell1978. This paper cites bell1978 (ref. 39) only for the exponential form of the clutch off rate
    (Eq. 2), not for data. bell1978's measured data are the force needed to detach adherent cells,
    "~ 1" dyne from its ref. 52 (bell1978/force_adhesive: approximate, so no verdict, and a force on a
    whole cell under conditions bell1978 does not give, not the steady traction of a motor-clutch
    ensemble with Table I parameters), and the free-sugar concentrations 0.001 and 0.01 M of its
    ref. 49 (c_sugar_low, c_sugar_high: inputs to Bell's inhibition estimate, which no model here
    takes or outputs). bell1978 measures no off rate, bond lifetime or force per bond that
    clutch_off_rate would predict. In the other direction this record has no measured datum to test a
    bell1978 model against: see bell1978 q_xval_shen2025_none.
  citation: {page: 3, printed_page: "014417-3", quote: "engaged clutches increases the detachment rate koff exponen", where: "Eq. 2"}
- id: q_xval_bangasser2013b_none
  kind: reading
  about: [motor_force_velocity, fixed_point, limit_cycle, stability_boundaries]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    bangasser2013b. This paper cites bangasser2013b (ref. 25) once, as background for the stick-slip
    dynamics of the motor-clutch paradigm (p. 2). It does not cite it for data and compares none of
    its results with that paper. bangasser2013b's only data of origin measured are the run times of
    its ODE and Monte Carlo software on the authors' computer (Fig. 6(b): fig6b_ode_cal,
    fig6b_mc1_cal, fig6b_mc100_cal). No model here outputs a computation time. Its other plotted
    curves (retrograde flow, clutch force, failure times, optimal stiffness) are predictions of its
    own ODE and Monte Carlo models. Setting them beside motor_force_velocity or fixed_point would
    relate two models, not validate one against data; that is the work of the job relating models.
    In the other direction this record has no measured datum at all (figures.md: every plot is a
    model result); see bangasser2013b/q_xval_shen2025_none.
  citation: {page: 2, printed_page: "014417-2", quote: "subsequently a stick-slip type of dynamics within the motor", where: text}
