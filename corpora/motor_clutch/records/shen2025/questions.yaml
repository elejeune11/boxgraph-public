- id: q_xval_elosegui2016_none
  kind: unstated_model
  about: [motor_force_velocity, clutch_off_rate, fixed_point, limit_cycle, 'elosegui2016/fig3d_control_data', 'elosegui2016/fig3e_control_data', 'elosegui2016/fig3a_lifetime_data', 'elosegui2016/clutch_no_talin_sim']
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of elosegui2016
    (ref. 16), although this paper cites it. It cites it twice, for the clutch picture (p. 1, "converting
    the retrograde actin flow into forward cellular motion [16]") and for a trend of theoretical studies
    (p. 8, "A majority of theoretical studies [16] ... reveal a biphasic relationship"); it never compares
    its model with that paper's data. elosegui2016's measurements are cell traction (Pa) and actin
    retrograde flow (nm/s) of MEFs against gel Young's modulus (kPa) (Figs. 1a, 3d,e, 4-6, S2, S5), the
    fibronectin-a5b1 bond lifetime against force (Fig. 3a), and adhesion lengths, YAP ratios, areas and
    stainings. None is a quantity a model here gives on those conditions: (1) motor_force_velocity gives a
    motor's velocity from its own load and stall force; no motor velocity against motor load is measured
    there (actin flow is measured against substrate rigidity, the shape match with
    elosegui2016/clutch_no_talin_sim being a relation between models for the job relating models).
    (2) clutch_off_rate gives an off-rate of a generic slip bond with this paper's koff0 and Fb (Table I);
    Fig. 3a measures a lifetime of a catch bond, a different quantity, and the off-rate is not fitted to it.
    (3) fixed_point is in dimensionless units with a substrate spring constant k~s, not a gel modulus; at
    the fixed point the motors are at stall so the actin flow is zero, and the substrate force
    nm0 f~s - F~ does not depend on k~s, so it predicts neither the traction nor the flow curves against
    rigidity, and no conversion from kPa to a spring constant or from force to traction stress (Pa) is
    stated by either paper. (4) limit_cycle gives oscillation frequency and amplitude, which elosegui2016
