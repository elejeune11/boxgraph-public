- id: q_fig11_amplitude_ptp
  kind: reading
  about: [q_amplitude_def, cmp_fig11d_Nc5, cmp_fig11d_Nc5_ptp, limit_cycle, limit_cycle_ptp]
  text: >-
    Fig. 11(d) settles the amplitude definition of q_amplitude_def: the plotted amplitude of y~ is the
