- id: q_xval_chan2008_none
  kind: unstated_input
  about: [motor_force_velocity, clutch_off_rate, fixed_point, limit_cycle, limit_cycle_ptp, 'chan2008/v_fig3c_260', 'chan2008/v_fig3c_57k', 'chan2008/v_fig3d_exp_sem', 'chan2008/T_max_text', 'chan2008/failures_figS5D']
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    chan2008. This paper cites chan2008 (ref. 8) for the piecewise linear force-velocity law
    (p. 2) and for kon = 1 s^-1 and k0off = 0.1 s^-1 (Table I), never for data, and compares none
    of its results with chan2008's measurements. Considered and not used: (1) the retrograde flow
    means (chan2008/v_fig3c_260, v_fig3c_57k, v_fig3d_exp_*, v_figS8C_*): fixed_point is a steady
    state with dx~o/dτ~ = 0 and the motors at stall (Eq. 8, y~0 = f~s/k~m), so it predicts no flow,
    and limit_cycle outputs a frequency and an amplitude, not a mean flow. (2) The peak filopodial
    force (chan2008/T_max_text, T_max_fig): fixed_point gives a steady traction nm0 f~s - F~, not the
    peak of a load-and-fail cycle, and with Table I motors (Nm = 100, fs = 4.96 pN, rates of ref. 40)
    rather than chan2008's filopodial set (nm = 75, Fm = -2 pN, vu = -120 nm/s, Table S1).
    (3) The failure frequency against stiffness (chan2008/failures_figS5D) beside limit_cycle's
    oscillation frequency: running it at chan2008's gels would need Nc, v~u, γ and a substrate
    spring k~s for each gel, none of which either paper states for these filopodia (the gel modulus
    reaches a spring only through chan2008's Eq. 13 with its fitted Δ); limit_cycle is deterministic
    and oscillates only inside its Hopf region, so every one of these inputs would be added and the
    verdict would test them, not the model. (4) The motor law: chan2008 measures no motor velocity
    under a known load for motor_force_velocity, and no off rate for clutch_off_rate. The shared
    shape of motor_force_velocity and chan2008/force_velocity_eq3 relates two models, which is the
    job relating models. In the other direction this record has no measured datum; see
    chan2008/q_xval_shen2025_none.
  citation: {page: 2, printed_page: "014417-2", quote: "transmission based on the motor-clutch hypothesis, presented", where: text}
# cross-record validation against bangasser2013 (2026-11-21): none added
- id: q_xval_bangasser2013_none
  kind: unstated_model
  about: [clutch_off_rate, fixed_point, limit_cycle, Fb, 'bangasser2013/tau_kong_fig7c', 'bangasser2013/v_figS1b_measured', 'bangasser2013/migration_fig1a_u87', 'bangasser2013/traction_fig1b_neuron']
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    bangasser2013. This paper cites bangasser2013 (ref. 27) for Fb = 6.25 pN (Table I, p. 4) and, in
    the introduction (p. 2), as a model that "did not take into account the role of myosin
    contractility"; it compares none of its results with bangasser2013's data, and its "biphasic
    relationship" (p. 8) is attributed to theoretical studies (ref. 16), not to measurements.
    Considered and not used: (1) Kong et al.'s integrin lifetimes redrawn in bangasser2013 Fig. 7C
    (bangasser2013/tau_kong_fig7c, a mean bond lifetime against clamped force): clutch_off_rate has the
    same shape as bangasser2013/catch_slip_eq9 (a rate from a force and rates), but it outputs a loaded
    off rate, not a lifetime; mapping one to the other would cross two quantities that are reciprocal,
    not the same. Its Bell slip law is also monotonic, so against catch-bond data it could only miss,
    and its Fb (6.25 pN, from bangasser2013's slip-bond base set) and k0off (0.1 /s, from chan2008)
    were not taken for this bond. (2) Chan and Odde's neuron retrograde flows against gel modulus
    (bangasser2013/v_figS1b_measured): fixed_point is a steady state with the motors at stall and
    dx~o/dτ = 0, so it predicts no mean flow, and limit_cycle gives a frequency and an amplitude; the
    gel moduli would also need a conversion to k~s that neither paper states. (3) The normalized
    migration and traction of Fig. 1A-B (bangasser2013/migration_fig1a_*, traction_fig1b_*): no model
    here outputs a migration speed, and its steady traction nm0 f~s - F~ does not depend on the
    substrate, so a normalized traction against stiffness is a quantity no model here gives (and the
    cell types' parameters are not stated). In the other direction this record has no measured datum
    (figures.md: every plot is a model result); see bangasser2013/q_xval_shen2025_none.
  citation: {page: 4, printed_page: "014417-4", quote: "Clutch bond rupture force Fb 6.25 pN", where: Table I}
