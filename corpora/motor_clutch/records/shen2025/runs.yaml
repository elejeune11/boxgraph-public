  inputs: {w: w_nd, Nm: Nm, kon: kon_nd, koff: koff_nd, fs: fs_nd, fd: fd_nd, Fb: Fb_nd, km: km_nd, kc: kc_nd, ks: ks_soft_nd, F: F_unloaded, g: g_fig2d, Nc: Nc_fig6b}
  outputs: {vu_hopf: vu_hopf_corr_Nc10_g2, vu_unstable: vu_U_corr_Nc10_g2}

