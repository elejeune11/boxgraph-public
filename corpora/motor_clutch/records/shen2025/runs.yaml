# ---- limit cycle (Fig. 11)----------------------------------------------------------------------------
- id: run_limit_Nc5
  model: limit_cycle
  inputs: {w: w_nd, Nm: Nm, kon: kon_nd, koff: koff_nd, fs: fs_nd, fd: fd_nd, Fb: Fb_nd, km: km_nd, kc: kc_nd, ks: ks_soft_nd, F: F_unloaded, g: g_fig2a, Nc: Nc_fig11_5, vu: vu_limitcycle_added, tau: tau_pred}
  outputs: {freq: freq_Nc5, amp: amp_Nc5}
  note: tau is 1/wd0 as computed, not the rounded 0.0029 s of Table I (the paper does not say which it used).

