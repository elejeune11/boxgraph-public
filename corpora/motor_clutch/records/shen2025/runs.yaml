# ---- Table I scales and dimensionless parameters --------------------------------------------------
- id: run_scales
  model: char_scales
  inputs: {wd0: wd0, Gamma_kT: Gamma_kT}
  outputs: {l0: l0_pred, tau: tau_pred, v0: v0_pred, f_kT: f_kT_pred}
- id: run_nondim
  model: nondim
  inputs: {wa: wa, wd0: wd0, kon: kon, koff: koff0, fs: fs, fd: fd, Fb: Fb, km: km, kc: kc, Gamma_kT: Gamma_kT, kT: kT_added}
  outputs: {w: w_nd, kon_nd: kon_nd, koff_nd: koff_nd, fs_nd: fs_nd, fd_nd: fd_nd, Fb_nd: Fb_nd, km_nd: km_nd, kc_nd: kc_nd}
- id: run_ks_soft
  model: nondim_stiffness
  inputs: {ks: ks_soft_added, wd0: wd0, Gamma_kT: Gamma_kT, kT: kT_added}
  outputs: {ks_nd: ks_soft_nd}
- id: run_ks_stiff
  model: nondim_stiffness
  inputs: {ks: ks_stiff, wd0: wd0, Gamma_kT: Gamma_kT, kT: kT_added}
  outputs: {ks_nd: ks_stiff_nd}

# ---- fixed point and saddle node, unloaded, soft substrate --------------------------------------------
- id: run_fixed_Nc10
  model: fixed_point
  inputs: {w: w_nd, Nm: Nm, kon: kon_nd, koff: koff_nd, fs: fs_nd, fd: fd_nd, Fb: Fb_nd, km: km_nd, kc: kc_nd, ks: ks_soft_nd, F: F_unloaded, Nc: Nc_fig6b}
  outputs: {nm0: nm0_Nc10, nc0: nc0_Nc10, y0: y0_Nc10, xs0: xs0_Nc10, xo0: xo0_Nc10, xc0: xc0_Nc10}
- id: run_saddle_F0
  model: saddle_node
  inputs: {w: w_nd, Nm: Nm, kon: kon_nd, koff: koff_nd, fs: fs_nd, fd: fd_nd, Fb: Fb_nd, load: loadfrac_F0}
  outputs: {Nc_min: Ncmin_F0, nc_bif: ncbif_F0}

# ---- stability boundaries of Fig. 2(a) at Nc = 10 (ks = kc, gamma = Gamma, F = 0) -----------------------
- id: run_hopf_Nc10
  model: stability_boundaries
  inputs: {w: w_nd, Nm: Nm, kon: kon_nd, koff: koff_nd, fs: fs_nd, fd: fd_nd, Fb: Fb_nd, km: km_nd, kc: kc_nd, ks: ks_soft_nd, F: F_unloaded, g: g_fig2a, Nc: Nc_fig6b}
  outputs: {vu_hopf: vu_hopf_Nc10, vu_unstable: vu_U_Nc10}
- id: run_hopf_corr_Nc10
  model: stability_boundaries_corrected
  inputs: {w: w_nd, Nm: Nm, kon: kon_nd, koff: koff_nd, fs: fs_nd, fd: fd_nd, Fb: Fb_nd, km: km_nd, kc: kc_nd, ks: ks_soft_nd, F: F_unloaded, g: g_fig2a, Nc: Nc_fig6b}
