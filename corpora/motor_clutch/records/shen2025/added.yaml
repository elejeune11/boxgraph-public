- id: kT_added
  quantity: thermal_energy
  unit: pN*nm
  printed: "4.12"
  basis: >-
    The paper gives no temperature or kB T in pN nm, but its characteristic force 2.3033 (Table I) equals
    (wd0 Gamma kB T)^1/2 in pN only with kB T = 4.120 pN nm. It is needed to make kc, km, fs, fd, Fb and ks
    dimensionless (k~c = kc l0/f etc.).
  alternatives: ["4.114", "4.28"]
  stands_for: kB T in l0 and f (p. 3)
- id: ks_soft_added
  quantity: substrate_stiffness
  unit: pN/nm
  printed: "0.03144"
  basis: >-
    The "soft substrate" of Fig. 2(a,b) and Fig. 7(a) has ks = kc (p. 8 and panel labels); kc = 0.03144 pN/nm
    (Table I). The record enters that equality as a substrate stiffness, since the paper gives no number.
  alternatives: ["1"]
  stands_for: ks in Fig. 2(a)
- id: vu_limitcycle_added
  quantity: motor_velocity_nd
  unit: dimensionless
  printed: "1.0"
  basis: >-
    A motor velocity inside the US region of Fig. 2(a) at Nc = 5 (the left end of the v~u axis of Fig. 11(c,d)),
    chosen by the reader to exercise the limit-cycle model; the paper's own frequencies are only plotted.
  alternatives: ["1.2", "1.5"]
  stands_for: v~u in Fig. 11(c,d)
