  citation: {page: 4, printed_page: "1689", quote: "n = 95; soft substrate (red): ? = 57-kPa PAG, n = 258", where: "Fig. 3C caption"}
- id: q_figS8C_vs_fig3
  kind: unexplained_difference
  about: [v_figS8C_gfp, v_fig3c_260, v_fig3d_exp_sem]
  text: >-
    Fig. S8C plots GFP-actin transfected filopodia on 260 Pa gels with n = 77 and a mean read near
