- id: q_failure_frequency_model
  kind: unstated_model
  about: [failures_figS5D]
  text: >-
    The SOM says the measured failure frequency (Fig. S5D) rises with stiffness "as predicted by the
    model", but no simulated failure frequency is printed or plotted, and the record's motor_clutch
    model has no failure-count output. The measured frequencies are recorded as figure readings with
