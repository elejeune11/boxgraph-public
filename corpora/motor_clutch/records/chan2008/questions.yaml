# ==== cross-record validation with andreu2021 (2026-11-02): none added =========================
- id: q_xval_andreu2021_none
  kind: unstated_model
  about: [motor_clutch, motor_clutch_E, ksub_eq13, off_rate_eq1, retrograde_flow_rate]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    andreu2021. andreu2021 cites this paper (its ref. 21) once, as an example of clutch models of ECM
    rigidity sensing (andreu2021 p. 2), and says no model here explains or predicts its data. The one
    measurement of andreu2021 whose quantity a model here outputs is the actin retrograde flow of its
    Fig. 1b (andreu2021/fig1b_flow: mouse embryonic fibroblasts on 0.6 kPa gels, and at the very edge of
    lamellipodia on glass), against motor_clutch_E's v_retro. It is not entered: (1) every parameter of
    motor_clutch_E (Table S1: nm, Fm, vu, nc, kon, koff, Fb, kc) and the Eq. 13 length Δ = 277 nm are this
    paper's set for embryonic chick forebrain neuron filopodia, with nc and kon tuned to the flows
    measured here; neither paper gives them for fibroblast lamellipodia, so all would be added inputs and
    the verdict would test them, not this model; andreu2021's own clutch parameters (Supplementary Table
    4) belong to a catch-bond model without motors whose actin speed is imposed by stretch. (2) The glass
    point is measured where "adhesion is still very low" (andreu2021 p. 2), which a run at a glass-like
    κsub does not represent, and no modulus for glass is printed. (3) The two points are categorical,
    not a curve to sweep. andreu2021's other measurements (paxillin adhesion lengths, YAP ratios,
    magnetic-tweezers bead speeds, loading rates and stiffnesses, AFM moduli, spreading areas) are
    quantities no model here outputs. In the other direction, see andreu2021/q_xval_chan2008_none.
  citation: {page: 4, printed_page: "1689", quote: "Measurements of F-actin retrograde flow over a range of stiffness", where: "Fig. 3D"}
