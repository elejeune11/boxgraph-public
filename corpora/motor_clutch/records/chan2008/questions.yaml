  citation: {page: 21, printed_page: "SOM p. 14", quote: "frequency of failures as a function of stiffness. As predicted by the model", where: text}
- id: q_no_validation_bell1978
  kind: unstated_model
  about: [off_rate_eq1, motor_clutch, motor_clutch_E, failures_figS5D, T_max_text, v_fig3c_260]
  text: >-
    Cross-validation against bell1978 found no measurement to enter, in either direction. Chan
    cites Bell (ref. 10, SOM ref. S5) only for the form of the loaded off-rate (Eq. 1, "Bell's Law
    (10)"), not for data, and neither paper compares its model with the other's measurements. The
    only measurements in bell1978 are a force of about 1 dyne to detach a cell (from ref. 52, given
    only as "~ 1", an order of magnitude) and the concentrations of free sugar (0.001-0.01 M) that
    inhibit agglutination (ref. 49). None of this record's models (off_rate_eq1, motor_clutch,
    motor_clutch_E, cerruti_force_eq11, ksub_eq13) outputs a force on a whole cell or an inhibitor
    concentration. In the other direction, none of bell1978's models outputs what Chan measured
    (retrograde flow rate, filopodial traction, bead displacement statistics, failure frequency):
    Bell's loaded reverse rate is the off-rate of one bond at a known force per bond, while the
    failure frequency of Fig. S5D counts load-and-fail cycles of a whole filopodium, and no clutch
    tension is measured; Bell's rupture and critical forces are per bond, while the 110 pN peak is
    the traction of a whole filopodium.
  citation: {page: 3, quote: "Bell's Law (10), with a characteristic breaking", where: text}
- id: q_no_validation_chaudhuri2015
  kind: unstated_model
  about: [motor_clutch, motor_clutch_E, off_rate_eq1, ksub_eq13, cerruti_force_eq11]
  text: >-
    Cross-validation against chaudhuri2015 (which cites this paper as refs. 19 and S1 for its model
    framework) found no measurement of chaudhuri2015 that a model here predicts. chaudhuri2015
    measured cell spreading areas, the fraction of cells with stress fibres, attached or
    proliferating, nuclear YAP ratios, the AFM Young's moduli of alginate gels, and their stress
    relaxation and normalized storage and loss moduli. None of this record's models outputs any of
    these. motor_clutch and motor_clutch_E give a filopodium's retrograde flow rate and its mean and
    peak traction force. off_rate_eq1 gives a clutch off rate, ksub_eq13 a substrate spring constant
    from a given modulus, and cerruti_force_eq11 a point force from bead displacements. In the other
    direction, see chaudhuri2015/q_xval_chan2008_none: its runnable model gives a spreading speed,
    not the retrograde flow rate measured here.
- id: q_no_validation_craig2015
  kind: unstated_model
  about: [motor_clutch, motor_clutch_E, off_rate_eq1, ksub_eq13, cerruti_force_eq11]
  text: >-
    Cross-validation against craig2015 (which cites this paper as ref. 17, only among "recent
    modeling studies [16-19]" of adhesions as sticky springs, p. 3, and never compares with it)
    found no measurement of craig2015 that a model here predicts. craig2015 measured the lamellar
    actin flow speed and the whole-cell total traction force of U2OS cells under Y-27632 (supp.
    fig. 1(a)-(c), from its ref. 31), a leading-edge flow speed of PtK1 lamellipodia ("~20 nm/s",
    from its ref. 14, approximate) and paxillin and myosin intensity profiles (Fig. 2(d)).
    motor_clutch and motor_clutch_E give the retrograde flow rate and the traction force of one
    filopodium on a substrate of given stiffness. That is a different quantity from a lamellar or
    lamellipodial flow speed and from a cell's total force in nN. craig2015 gives no substrate
    stiffness for its cells either, nor how Y-27632 maps onto the motor number nm. A run would rest
    on added inputs and still not predict the measured quantity. cerruti_force_eq11 needs bead
    displacements, which craig2015 does not have; off_rate_eq1 and ksub_eq13 give nothing measured
    there. The shared shape of cerruti_force_eq11 and craig2015/lamellipodial_width (a length from
    a length and a pressure) is formal: one is a point force from substrate bead displacements, the
    other a lamellipodial width from network viscosity and traction. In the other direction, see
    craig2015/q_no_validation_chan2008.
- id: q_no_validation_elosegui2014
  kind: unstated_model
  about: [motor_clutch, motor_clutch_E, off_rate_eq1, ksub_eq13, cerruti_force_eq11]
  text: >-
    Cross-validation against elosegui2014 (which cites this paper as its ref. 7 and describes its
    integrin-FN clutch model from this one) found no measurement of elosegui2014 that a model here
    predicts on that paper's conditions. elosegui2014 measured the average traction stress (Pa) of
    myoblasts, their actin rearward flow speed at the cell periphery (kymographs), integrin
    densities in adhesions and on the membrane, bead detachment times and SPR responses, on FN gels
    of 0.25-29 kPa. motor_clutch_E could be run at those gel moduli, but it outputs the retrograde
    flow and the force (pN) of one filopodium: the traction stress is a different quantity, and the
    flow is a filopodial one, not a peripheral lamellar one. Its other inputs for myoblasts (nm, Fm,
    vu, nc, kon, koff, Fb, kc, the Eq. 13 length and the gels' Poisson ratio) are stated by neither
    paper: elosegui2014's own values are in its Supplementary Table 1, which renders blank there
    (elosegui2014/q_si_unreadable). Several values here were tuned to this paper's neurons (Table S1:
    nm, nc, kon), so a run with them would predict chick neuron filopodia on elosegui2014's gels,
    not the cells measured; elosegui2014 also says this model "did not include reinforcement", which
    is its explanation of the measured trends. cerruti_force_eq11 needs bead displacements
    elosegui2014 does not report; off_rate_eq1 and ksub_eq13 give nothing measured there. In the
    other direction, see elosegui2014/q_no_validation_chan2008.
  citation: {page: 56, printed_page: "SOM p. 49", quote: "Total number of myosin match estimated mean nm 75", where: Table S1}
- id: q_no_validation_elosegui2016
  kind: unstated_input
  about: [motor_clutch, motor_clutch_E, nm_S1, nc_S1, kon_S1, koff_S1, Fb_S1, kc_S1, 'elosegui2016/fig3e_shrna_data', 'elosegui2016/fig3e_control_data', 'elosegui2016/fig3d_shrna_data']
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    elosegui2016, which cites this paper (ref. 4, ST1-3) and says its talin-depleted cells "fully
    abide by the clutch model first proposed eight years ago" (elosegui2016 p. 8). motor_clutch_E
    has the same shape as elosegui2016's clutch_no_talin_sim and could be run at its gel moduli
    (0.6-29 kPa), but run with this record's inputs it predicts a chick forebrain neuron filopodium:
    several Table S1 values were tuned to these neurons (nm, nc, kon), and koff, Fb and the Eq. 13
    length are those of a filopodium on these gels. Neither paper states nm, nc, kon, koff, Fb or kc
    for mouse embryonic fibroblasts; elosegui2016 parametrises its clutch differently (fibronectin
    number nf, intrinsic binding rate kont times integrin density, a two-exponential catch bond,
    adhesion radius), so its values cannot be put into these ports, and only vu (110 nm/s, taken
    partly from this paper) has a counterpart. So no run would be on the measurement's own cells.
    The measured quantities also differ: elosegui2016 measures actin speed in kymographs "at the
    cell periphery" of fibroblasts (p. 10), not in filopodia, and cell traction as a stress (Pa),
    while this model gives the flow and the force (pN) of one filopodium. Measurements considered
    and not used: Fig. 3e flows of shRNA and control cells (other cells and structure; the control
    cells also reinforce through talin, which this model lacks), Fig. 1a, 3d, 4, 5, 6a-i and
    Supplementary Figs. 2, 5 tractions (stress, not a filopodial force), and the adhesion lengths,
    YAP ratios, densities, areas and bond lifetimes, which no model here outputs. In the other
    direction, see elosegui2016/q_xval_chan2008_none.
  citation: {page: 56, printed_page: "SOM p. 49", quote: "Total number of myosin match estimated mean nm 75", where: Table S1}
