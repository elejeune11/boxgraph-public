# cross-record validation against gong2018 (2026-11-02): none added
- id: q_xval_gong2018_none
  kind: unstated_model
  about: [motor_clutch, motor_clutch_E, ksub_eq13, off_rate_eq1]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    gong2018. That paper is later and cites this one (its ref. 15) for the motor-clutch model, so
    this paper makes no claim about its data. gong2018 measures cell spreading areas (Figs. 4D, 5D,
    6D, S5A), spreading speeds derived from those areas (Fig. S7) and gel stress-relaxation stiffness
    (Figs. 4B, 5B, S6A). motor_clutch and motor_clutch_E output the filopodial retrograde flow rate
    and a mean and a peak traction force. That is neither a spreading speed (gong2018's Vs = Vp - Vf
    needs a polymerization speed this model does not have) nor an area, and the models are
    parametrized for neuron filopodia (Table S1), not for the fibroblasts, MSCs and U2OS cells of
    gong2018. ksub_eq13 has the same shape as gong2018/boussinesq_eq_s9, but gong2018's relaxation
    stiffness in pN/nm is a measured modulus relabelled with that paper's own 1 kPa = 1 pN/nm, not a
    measured spring constant. Running Eq. 13 on that modulus would test one conversion against
    another, with a length (δ or Δ) stated for filopodia, not for those cells. off_rate_eq1 has no
    measured counterpart there. In the other direction, see gong2018/q_xval_chan2008_none.
  citation: {page: 25, printed_page: "SOM p. 18", quote: "we can estimate the substrate spring constant, κsub as a function of", where: "Eq. 13"}
# cross-record validation against odde_code (2026-11-02): none added here
- id: q_xval_odde_code_none
  kind: unstated_model
