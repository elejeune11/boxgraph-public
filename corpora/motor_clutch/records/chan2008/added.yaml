- id: L_eq13_added
  quantity: ksub_length_scale
  unit: nm
  printed: "277"
  basis: >-
    The paper introduces a fitting parameter Δ = 277 nm "to account for our underestimate of
    κsub" from δ in Eq. 13 (SOM p. 18) but does not say how Δ enters Eq. 13. Read here as
    Δ replacing δ. Alternatives: δ + Δ = 427 nm (Δ as an additive correction, which also matches
    the ~1 pN/nm per kPa suggested by comparing Fig. 1D with Fig. S1A), and δ = 150 nm as printed
    in Eq. 13 without the fit.
  alternatives: ["427", "150"]
  stands_for: δ in Eq. 13
- id: E_trace_added
  quantity: substrate_modulus
  unit: Pa
  printed: "730"
  basis: >-
    The 18 bead traces giving <T> = -110 ± 25 pN (Fig. S10) are not tied to a gel stiffness.
    Filopodial traction traces were recorded on 260, 730 and 1300 Pa PAGs (SOM p. 14); the middle
    value is taken.
  alternatives: ["260", "1300"]
  stands_for: E of the gels in Fig. S10
