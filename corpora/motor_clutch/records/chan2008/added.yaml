- id: L_eq13_added
  quantity: ksub_length_scale
  unit: nm
  printed: "277"
  basis: >-
    The paper introduces a fitting parameter Δ = 277 nm "to account for our underestimate of
    κsub" from δ in Eq. 13 (SOM p. 18) but does not say how Δ enters Eq. 13. Read here as
    Δ replacing δ. Alternatives: δ + Δ = 427 nm (Δ as an additive correction, which also matches
    the ~1 pN/nm per kPa suggested by comparing Fig. 1D with Fig. S1A), and δ = 150 nm as printed
    in Eq. 13 without the fit.
  alternatives: ["427", "150"]
  stands_for: δ in Eq. 13
- id: E_trace_added
  quantity: substrate_modulus
  unit: Pa
  printed: "730"
  basis: >-
    The 18 bead traces giving <T> = -110 ± 25 pN (Fig. S10) are not tied to a gel stiffness.
    Filopodial traction traces were recorded on 260, 730 and 1300 Pa PAGs (SOM p. 14); the middle
    value is taken.
  alternatives: ["260", "1300"]
  stands_for: E of the gels in Fig. S10

# ==== cross-validation against owen2017 (2026-11-22): κsub of a fibrin adhesion site ===========
# Used only by validations.yaml (val_relspeed_owen2017_*); no run of this record's own uses it.
- id: ksub_owen_fibrin_added
  quantity: substrate_stiffness
  unit: pN/nm
  printed: "0.141"
  basis: >-
    Neither paper states the spring constant an adhesion pulls against in owen2017's 3D fibrin gels.
    owen2017 gives a continuum estimate, κ = πEr/2(1+η) (Supplemental Discussion, Supp. p. 3; its model
    continuum_stiffness), with r = 0.5 um ("approximately the size of a focal adhesion"), and the bulk
    gel modulus E = 270 Pa from G = 90 Pa with η = 0.5 (Fig. S10 caption). That arithmetic gives
    0.141 nN/um = 0.141 pN/nm. This paper's own conversion (Eq. 13, κsub = πEδ/(1+υ) with Δ = 277 nm)
    is for a filopodial point load on polyacrylamide and is not used. Alternatives: the bulk moduli
    without and with cells (~200 and ~300 Pa, owen2017 p. 8) give 0.105 and 0.157; owen2017's own
    clutch-model value κ = 1 pN/nm (Supp. p. 6); the fibre-network nodes, "up to ~24 nN/um" (owen2017
    p. 8, Fig. 6B), differing "by an order of magnitude", so 24 and 2.4.
  alternatives: ["0.105", "0.157", "1", "2.4", "24"]
  stands_for: "κsub at an adhesion of a fibroblast in owen2017's 3D fibrin gel"
