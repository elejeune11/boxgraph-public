# mapping: b's input symbol -> expression in a's input symbols, numbers in each model's port units.
# 1 dyne = 1e7 pN; 1 eV/nm = 160.2176634 pN.
- id: rel_bell_off_rate
  kind: same_as
  a: bell1978/loaded_reverse_rate
  b: chan2008/off_rate_eq1
  mapping: {koff: "k_minus", Fclutch: "1e7*f", Fb: "160.2176634*kT/gamma"}
  regime: {k_minus: [1.0e-4, 10], gamma: [0.1, 1], f: [1.0e-7, 1.0e-5], kT: [0.0257, 0.0267]}
  provenance: stated
  citation: {page: 10, printed_page: "SOM p. 3", quote: "exponentially according to a Bell Model (S5)", where: "Eq. 1"}
  assumptions:
    - "Chan's characteristic breaking force Fb corresponds to Bell's kT/gamma, and the tension in one clutch to Bell's force per closed bond F/Nb"
    - "regime in positive forces; Chan's Table S1 prints Fclutch and Fb both negative, which leaves their ratio unchanged"
- id: rel_erdmann_off_rate
  kind: same_as
  a: erdmann2004/single_bond_rate
  b: chan2008/off_rate_eq1
  mapping: {koff: "k0", Fclutch: "F/i", Fb: "Fb"}
  regime: {k0: [0.01, 10], F: [0, 100], i: [1, 10], Fb: [1, 10]}
  provenance: proposed
  reason: >-
    Both papers take the loaded off-rate from Bell (Erdmann ref. 1, Chan ref. S5): Erdmann's rate of one
    of i closed bonds sharing F, and Chan's off-rate of one clutch under its own tension, are the same
    exponential law when the clutch tension is the force per closed bond F/i.
