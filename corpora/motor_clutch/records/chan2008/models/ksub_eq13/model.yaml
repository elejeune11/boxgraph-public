id: ksub_eq13
name: substrate spring constant from Young's modulus by the 1-D Cerruti solution (Eq. 13)
role: model
stated: {page: 25, printed_page: "SOM p. 18", quote: "we can estimate the substrate spring constant, κsub as a function of", where: "Eq. 13"}
equation: "κsub = πEδ/(1+υ)"
inputs:
  E:  {quantity: substrate_modulus, unit: Pa}
  L:  {quantity: ksub_length_scale, unit: nm, description: "the length in Eq. 13 (δ, or the fitted Δ that corrects it)"}
  nu: {quantity: poisson_ratio, unit: dimensionless}
outputs:
  ksub: {quantity: substrate_stiffness, unit: pN/nm}
