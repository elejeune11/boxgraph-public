id: off_rate_eq1
name: effective dissociation rate of an engaged clutch under tension (Eq. 1)
role: model
stated: {page: 10, printed_page: "SOM p. 3", quote: "exponentially according to a Bell Model", where: "Eq. 1"}
equation: "koff* = koff e^{Fclutch/Fb}"
described_from: bell1978
inputs:
  koff:    {quantity: clutch_off_rate_unloaded, unit: 1/s}
  Fclutch: {quantity: clutch_tension, unit: pN}
  Fb:      {quantity: bond_rupture_force, unit: pN}
outputs:
  koff_star: {quantity: clutch_off_rate_loaded, unit: 1/s}
settings: {}
stochastic: false
