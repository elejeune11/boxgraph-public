- id: q_figures_not_read
  kind: reading
  about: [network_soft, network_stiff, fibre_soft, fibre_stiff, gel_soft_text, rgd_fold_soft, prolif_ratio_networks]
  text: >
    The measured data of this paper are plotted (Figs. 1c-e, 2c, 3b, 3d, 4d, 5c-f, 5h, 5i, 5k, 5l; Supp. Figs. 2e,
    2k, 3c, 6b-c, 7, 8a, 9, 10a) and were not read in this pass, because the figure-rendering commands were not
    permitted for this job. They should be read in a second pass: Fig. 5c-f (cell area, total FA area, number of FAs,
    average FA size on soft and stiff gels and networks) is what cao2017 compares its model with, and Supp. Fig. 2k
    is what membrane_indentation needs as input.
- id: q_membrane_inputs_plotted
  kind: unstated_input
  about: [membrane_indentation, network_soft, network_stiff]
  text: >
    The membrane equation turns indentation force and depth into the network moduli (2.8 kPa soft, 55 kPa stiff;
    Fig. 1d), but force and depth appear only in Supp. Fig. 2k, and the paper does not say over which depth range,
    or how (a fit of F against delta^3, or one point), the modulus was taken from each curve. Seen on the page image,
    the force in Supp. Fig. 2k rises about linearly with depth up to 200 um, while the printed equation gives
    F proportional to delta^3; once Supp. Fig. 2k is read this should be tested by running the model on the plotted
    depths with the printed moduli.
  citation: {page: 12, quote: "Force response as a function of indentation depth of networks", where: Supp. Fig. 2k}
- id: q_membrane_r_diameter
  kind: possible_error
  about: [membrane_ro, membrane_ri, membrane_indentation]
  text: >
    The Methods call ro "the membrane diameter (1 mm)" and ri "the indentor diameter (0.25 mm)", but the wells are
    2 mm in diameter and the indentor cylinders 500 um in diameter (same page), so the printed values are radii, as
    the symbols r suggest. The record uses the printed values. Taking the words literally (halving both values to get
    radii) would change the force the equation gives for a given modulus, so the word matters to anyone who reuses it.
  citation: {page: 8, quote: "where t is the membrane thickness (20 µm), ro is the membrane diameter (1 mm)", where: Methods}
- id: q_gel_range
  kind: unexplained_difference
  about: [gel_soft_text, gel_modulus_range_min]
  text: >
    The text says photocrosslinking "yielded hydrogels with moduli between 450 Pa and 45 kPa" (p. 2, Fig. 1e), yet the
    soft hydrogel used throughout is 290 Pa (pp. 3, 4, 5, 16), below the lower end of that range. Either the range
    refers only to the doses plotted in Fig. 1e, or one of the two values is misprinted.
  citation: {page: 2, quote: "yielded hydrogels with moduli between 450 Pa and 45 kPa", where: text}
