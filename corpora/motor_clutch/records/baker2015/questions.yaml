  text: >
    The Methods give 100 mW cm-2 with polymerization times of 7.5 s (soft), 30 s (intermediate-stiffness) and 60 s
    in argon (stiff), i.e. 750, 3,000 and 6,000 mJ cm-2, but Fig. 2c labels the hydrogel constructs "Soft (750 mJ)"
