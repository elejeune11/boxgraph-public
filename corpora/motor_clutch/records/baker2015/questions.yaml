# cross-record validation against chan2008 (2026-11-21): none added
- id: q_xval_chan2008_none
  kind: choice
  about: [membrane_indentation, histogram_moments, soft_stiff_ratio, uv_dose_exposure, figs6b_gel_data, figs2k_0_data]
  text: >-
    (Cross-record validation.) No validation was entered in either direction with chan2008 (ref. 39). This
    paper cites it only in words: the cyclic bead motions on soft hydrogels are "suggestive of 'load-and-fail'
    dynamics described previously39" (p. 4; Supp. Fig. 6c traces, not read), and ref. 39 is named among works
    on catch-bond dynamics and integrin engagement (p. 5). No value of chan2008 is compared with a value here.
    This record's models do not predict chan2008's measurements: membrane_indentation gives the force on an
    indentor pressing a suspended membrane, and chan2008 measures no indentation (its measurements are
    retrograde flow rates, bead step and failure statistics, peak filopodial force and the force-to-bead
    distance on PA gels); histogram_moments, soft_stiff_ratio and uv_dose_exposure are processing of this
    paper's own fibre diameters, proliferation bars and UV doses. membrane_indentation and
    chan2008/cerruti_force_eq11 share a shape (a force from a modulus, lengths and a Poisson ratio), but they
    solve different problems (a membrane under a cylinder; a point force on a half-space inferred from two
    marker beads) and that shape relates no measurement. In the other direction, see chan2008/q_xval_baker2015_none.
  citation: {page: 4, quote: "underwent cyclic motions, suggestive of ‘load-and-fail’ dynamics", where: text}
# ---- added by the cross-record validation job (baker2015 + chaudhuri2015) ---------------------------
- id: q_xval_chaudhuri2015_none
  kind: choice
  about: [membrane_indentation, histogram_moments, soft_stiff_ratio, uv_dose_exposure, fig3b_fibre_data, fig5c_data, fig5f_data]
  text: >-
    (Cross-record validation.) No validation was entered in either direction with chaudhuri2015 (ref. 47).
    This paper cites it once, in words, as recent work showing a role for substrate stress relaxation in
    cell spreading that "further illustrates this need" for materials capturing native ECM mechanics
    (p. 5); it claims no model of either paper explains the other's data and compares no value. This
    record's models are processing of its own measurements: membrane_indentation (force on an indentor
    pressing a suspended fibre network; chaudhuri2015 characterizes its alginate gels by compression and
    rheology, not membrane indentation), histogram_moments (fibre-diameter histograms; chaudhuri2015 has
    no fibres), uv_dose_exposure (UV-crosslinked DexMA; chaudhuri2015's gels are ionically crosslinked
    alginate) and soft_stiff_ratio (a ratio of two of this paper's own bars, not a model of a measured
    quantity). In the other direction, see chaudhuri2015/q_xval_baker2015_none.
  citation: {page: 5, quote: "a role for substrate stress relaxation in cell spreading", where: text}
# ---- added by the cross-record validation job (baker2015 + elosegui2014) ----------------------------
- id: q_xval_elosegui2014_none
  kind: choice
  about: [membrane_indentation, histogram_moments, soft_stiff_ratio, uv_dose_exposure, fig5c_data, fig5f_data]
  text: >-
    (Cross-record validation.) No validation was entered in either direction with elosegui2014 (ref. 50).
    This paper cites it twice, in words, in its outlook (p. 5): as work on "integrin clustering and focal
    adhesion assembly at the nanoscale" and as a model of intracellular dynamics ("integrin engagement")
    to be coupled with fibrous-ECM theory in future. It does not say that elosegui2014's model explains
    any of its measurements and compares no value with it. This record's models are processing of its
    own data (membrane indentation of its fibre networks, fibre-diameter histogram moments, a soft/stiff
    ratio of its proliferation bars, UV dose of its DexMA gels); elosegui2014 measures none of these
    (its measurements are traction on fibronectin-coated polyacrylamide gels, SPR sensorgrams, integrin
    densities, bead detachment times and integrin recruitment of myoepithelial cells). In the other
    direction, elosegui2014's integrin-FN clutch model is not runnable (elosegui2014/q_si_unreadable);
    even if it were, it outputs traction, actin flow and adhesion integrin density, none of which this
    paper measures (it measures spread area, FA number and size, pFAK, proliferation and fibre
    recruitment of hMSCs), and its parameters are for myoepithelial cells on FN, not hMSCs on RGD-coupled
    DexMA. See elosegui2014/q_xval_baker2015_none.
  citation: {page: 5, quote: "and focal adhesion assembly at the nanoscale21,50 and through", where: text}
