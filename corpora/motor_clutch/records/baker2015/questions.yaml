# Added in the figure pass
- id: q_membrane_s2k
  kind: unexplained_difference
  about: [membrane_indentation, cmp_membrane_s2k_soft, cmp_membrane_s2k_stiff, figs2k_0_data, figs2k_6000_data, network_soft, network_stiff]
  text: >
    With Supp. Fig. 2k now read, the printed membrane equation with the printed parameters (t = 20 um, ro = 1 mm,
    ri = 0.25 mm, nu = 0.5) and the printed network moduli gives, at the plotted depths, forces 20 to 300 times
    smaller than those plotted: about 0.0002-0.003 mN against 0.04-0.09 mN for the 0 mJ (2.8 kPa) network, and
    0.0001-0.04 mN against 0.09-1.18 mN for the 6,000 mJ (55 kPa) network. The equation's force rises as the cube
    of the depth, while the plotted forces rise about linearly (6,000 mJ: about 0.008 mN per um from 24 to
    162 um). So the printed moduli do not follow from the printed equation and the plotted curves; halving ro and
    ri (q_membrane_r_diameter) does not close a gap of this size. Either the equation, a parameter or a unit
    (for example t, or the force axis) is misprinted, or the moduli were obtained another way. This answers the
    order-of-magnitude check of q_membrane_magnitude with calibrated readings.
  citation: {page: 12, quote: "Force response as a function of indentation depth of networks", where: Supp. Fig. 2k}
