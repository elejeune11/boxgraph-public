- id: q_membrane_magnitude
  kind: unexplained_difference
  about: [membrane_indentation, network_stiff, membrane_t, membrane_ro, membrane_ri]
  text: >
    Order-of-magnitude check, not a verdict (the plotted forces are read by eye here and must be read properly from
    Supp. Fig. 2k by the figure job): with the printed parameters (t = 20 um, ro = 1 mm, ri = 0.25 mm, nu = 0.5) and
    E = 55 kPa, the printed equation gives F of about 0.01 mN at a depth of 100 um, while Supp. Fig. 2k shows forces
    of the order of 0.5 mN near 100 um for the 6,000 mJ networks, and an about linear, not cubic, rise with depth.
    Halving ro and ri (the "diameter" wording, q_membrane_r_diameter) raises F only about fourfold. Once Supp. Fig. 2k
    is read, run membrane_indentation on its depths with network_soft and network_stiff and compare.
  citation: {page: 12, quote: "Force response as a function of indentation depth of networks", where: Supp. Fig. 2k}
