id: uv_dose_exposure
name: UV dose of a hydrogel from lamp intensity and polymerization time (Methods)
role: processing
stated: {page: 8, quote: "Polymerization times were 7.5 s for soft and", where: "Methods, DexMA hydrogel preparation"}
equation: "dose = I t"
reconstructed: >
  The paper gives the lamp intensity (100 mW cm-2) and the polymerization times (Methods) and labels the gels by
  dose in mJ (Fig. 2c), but never writes the product; dose = intensity x time is the definition of a radiant
  exposure, added here to test the two printed descriptions of the same gels against each other.
inputs:
  I: {quantity: uv_intensity, unit: mW/cm^2}
  t: {quantity: exposure_time, unit: s}
outputs:
  dose: {quantity: uv_dose, unit: mJ/cm^2}
settings: {}
stochastic: false
