id: membrane_indentation
name: force on a cylindrical indentor pressing a suspended fibre network taken as an elastic membrane (Methods)
role: processing
stated: {page: 8, quote: "an elastic membrane using the following equation,", where: "Methods, mechanical testing"}
equation: "F = E t pi delta^3 (ro^2 - ri^2) / (2 (ro - ri)^4 (1 - nu))"
inputs:
  E:     {quantity: network_youngs_modulus, unit: kPa}
  t:     {quantity: membrane_thickness, unit: um}
  delta: {quantity: indentation_depth, unit: um}
  ro:    {quantity: membrane_size, unit: mm}
  ri:    {quantity: indentor_size, unit: mm}
  nu:    {quantity: poisson_ratio, unit: dimensionless}
outputs:
  F:     {quantity: indentation_force, unit: mN}
settings: {}
stochastic: false
