notes: >
  Article pp. 1-7, online Methods pp. 8-9 (no page labels), Supplementary Information pp. 10-21
  (SI page labels 1-12). The paper is experimental: electrospun DexMA fibre networks, flat DexMA
  hydrogels and collagen matrices, with hMSC spreading, proliferation, focal adhesions, pFAK and
  fibre recruitment.

  Quantitative core. The one equation printed is the membrane-indentation relation of the Methods
  (p. 8) used to turn network indentation (Supp. Fig. 2k) into the network Young's moduli of Fig. 1d
  and the text (2.8 kPa soft, 55 kPa stiff). It is recorded as the model membrane_indentation, with its
  printed parameters (t = 20 um, ro = 1 mm, ri = 0.25 mm, nu = 0.5). Its inputs (force against depth)
  are only plotted (Supp. Fig. 2k), so in this pass it has no run and no comparison (q_membrane_inputs_plotted).
  The paper calls ro and ri diameters, but their values are the radii of the 2 mm wells and the
  500 um indentor (q_membrane_r_diameter). The three-point-bending relation for single-fibre moduli
  (Fig. 1c) and the Hertz model for hydrogels (Fig. 1e) are named but not printed (q_bending_unstated,
  q_hertz_unstated).

  Printed material inputs (fibre, network, hydrogel and collagen moduli of the soft and stiff
  conditions, UV doses, the ranges of Fig. 1) are recorded as data; they are the conditions under which
  the measurements were made and what a model of this system (cao2017) takes as inputs. Two
  consistency checks compare the rounded panel labels of Fig. 3a with the moduli of its caption. The
  text's soft hydrogel (290 Pa) lies below the range the text gives for the hydrogels (450 Pa to 45 kPa)
  (q_gel_range). The printed fold changes (2-3-fold RGD recruitment, threefold proliferation) are
  recorded as measured values.

  Not read in this pass: the figures. The figure-rendering commands of the reading guide
  (boxgraph figure page/check and pdftoppm) were refused by the permission settings of this job, so no
  figure reading could be made or checked. The measured data of Figs. 1c-e, 2c, 3b, 3d, 4d, 5c-f, 5h,
  5i, 5k, 5l and Supp. Figs. 2e, 2k, 3c, 6b-c, 7, 8a, 9, 10a are therefore not in the record yet
  (q_figures_not_read); a second pass with those commands should read them, above all Fig. 5c-f
  (cell area, FA number, total FA area, average FA size), which cao2017 compares with its model, and
  Supp. Fig. 2k, which would let membrane_indentation be run. Left out as feeding no model: the DexMA
  synthesis and NMR numbers, electrospinning settings (flow rate, voltage, gap, humidity), culture
  and staining protocols, seeding densities and inhibitor doses. The platen speed (1,200 r.p.m. giving
  10 m/s) is not checked because the radius at which the substrate sits is not stated.

  Figure pass (2026-11-21; figures.yaml, figures.md). The paragraph above describes the first pass: the
  figures are now read with calibrated code readings at 1200 dpi: Figs 1c-e, 2c, 3b, 3d, 5c-f, 5h, 5i, 5k, 5l and
  Supp. Figs 2e, 2k, 3c, 4, 6b, 7, 8a, 9, 10a, as measured data (bars with their s.d. bars, box plots, histograms
  bin by bin, marker points). Left out: drawings and micrographs, the single-cell traces of Fig. 4d and Supp.
  Fig. 6c, the NMR spectrum. Checks the readings allow: membrane_indentation run on the Supp. Fig. 2k depths with
  the printed moduli misses the plotted forces by a factor of 20-300 and has the wrong shape (q_membrane_s2k);
  Fig. 1c's lowest bar is about 0.40 GPa, not the 140 MPa the text gives for its range (q_fig1c_range_min);
  Fig. 1e's 3,000 mJ gel is 22.9 kPa, not the 19.1 kPa stiff gel (q_fig1e_stiff_gel, bearing on
  q_gel_stiff_dose); the histogram moments reproduce the printed fibre-diameter means and s.d.s of Supp. Figs 7
  and 9 (histogram_moments, reconstructed); the Fig. 3d bars give the text's "threefold" (3.3). Fig. 5c-f, which
  cao2017 compares with, are recorded as fig5c_data ... fig5f_data for a later cross-paper validation.
