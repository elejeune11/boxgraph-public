- {id: fibre_youngs_modulus, name: Young's modulus of a single DexMA fibre, dimension: "[pressure]", description: "from AFM three-point bending (Fig. 1c)"}
- {id: network_youngs_modulus, name: Young's modulus of a suspended fibre network, dimension: "[pressure]", description: "E in the membrane-indentation equation (Methods); Fig. 1d"}
- {id: hydrogel_youngs_modulus, name: Young's modulus of a flat DexMA hydrogel, dimension: "[pressure]", description: "AFM nanoindentation with Hertz contact (Fig. 1e)"}
- {id: collagen_matrix_modulus, name: bulk stiffness of a type I collagen matrix, dimension: "[pressure]"}
- {id: collagen_concentration, name: type I collagen concentration of a matrix, dimension: "[mass]/[length]**3"}
- {id: uv_dose, name: ultraviolet light exposure (energy per area), dimension: "[energy]/[length]**2"}
- {id: indentation_force, name: force on the cylindrical indentor pressing a network, dimension: "[force]"}
- {id: indentation_depth, name: indentation depth of a network, dimension: "[length]"}
- {id: membrane_thickness, name: thickness of the network taken as an elastic membrane, dimension: "[length]"}
- {id: membrane_size, name: outer size of the membrane (ro in the membrane equation; called membrane diameter), dimension: "[length]"}
- {id: indentor_size, name: size of the indentor (ri in the membrane equation; called indentor diameter), dimension: "[length]"}
- {id: well_diameter, name: diameter of the PDMS wells the networks span, dimension: "[length]"}
- {id: indentor_cylinder_diameter, name: diameter of the SU8 indentor cylinder, dimension: "[length]"}
- {id: poisson_ratio, name: Poisson ratio of the network or gel, dimension: "dimensionless"}
- {id: uv_intensity, name: ultraviolet light intensity at the sample (power per area), dimension: "[power]/[length]**2"}
- {id: exposure_time, name: duration of ultraviolet exposure (polymerization time), dimension: "[time]"}
- {id: rgd_density_fold_increase, name: fold increase of local RGD density near a cell after attachment, dimension: "dimensionless"}
- {id: proliferation_ratio_soft_stiff, name: ratio of proliferation on soft to stiff fibre networks, dimension: "dimensionless"}
# Added in the figure pass
- {id: condition_index, name: position of a bar along a categorical axis, dimension: "dimensionless", description: "1, 2, 3 ... left to right, as named in each reading's what"}
- {id: cell_spread_area, name: projected spread area of a cell, dimension: "[length]**2"}
- {id: total_fa_area, name: total focal-adhesion area per cell, dimension: "[length]**2"}
- {id: fa_number, name: number of focal adhesions per cell, dimension: "dimensionless"}
- {id: fa_size, name: average area of one focal adhesion, dimension: "[length]**2"}
- {id: pfak_at_fas, name: phospho-FAK fluorescence localized to focal adhesions (arbitrary units), dimension: "dimensionless"}
- {id: proliferation_edu, name: fraction of cells proliferating (EdU positive) over two days, dimension: "dimensionless"}
- {id: fibre_recruitment, name: fibre fluorescence in a 50 um region around the nucleus normalized to acellular areas, dimension: "dimensionless"}
- {id: construct_contraction, name: decrease of a construct's diameter relative to its initial diameter, dimension: "dimensionless"}
- {id: culture_time, name: time in culture after seeding, dimension: "[time]"}
- {id: fibre_indentation_depth, name: indentation depth of a single fibre in AFM three-point bending, dimension: "[length]"}
- {id: cantilever_deflection, name: deflection of the AFM cantilever, dimension: "[length]"}
- {id: fitc_rgd_concentration, name: FITC-RGD concentration of the coupling solution, dimension: "[substance]/[length]**3"}
- {id: rgd_concentration, name: RGD concentration of the coupling solution, dimension: "[substance]/[length]**3"}
- {id: fitc_fluorescence_intensity, name: FITC fluorescence intensity of coupled networks (arbitrary units), dimension: "dimensionless"}
- {id: cell_death_fraction, name: fraction of dead cells (EthD-1 positive per calcein-AM positive), dimension: "dimensionless"}
- {id: bead_distance_from_cell, name: initial distance between a tracked bead and the cell centre, dimension: "[length]"}
- {id: bead_total_displacement, name: total displacement of a tracked bead over 3 h, dimension: "[length]"}
- {id: fibre_diameter, name: diameter of an electrospun DexMA fibre, dimension: "[length]"}
- {id: fibre_diameter_sd, name: standard deviation of fibre diameter over a population, dimension: "[length]"}
- {id: diameter_frequency, name: fraction of fibres in a diameter bin, dimension: "dimensionless"}
