  regime: {nm: [80, 120], Fm: [1.6, 2.4], vu: [100, 140], nc: [60, 90], kon: [0.8, 1.2], koff: [0.08, 0.12],
           Fb: [1.6, 2.4], kc: [0.64, 0.96], ksub: [0.01, 100]}
  tolerance: 0.1
  provenance: stated
  citation: {page: 7, printed_page: "7", quote: "composed of j motor–clutch modules, each following rules as previously", where: "Methods, citing refs 7 and 14 (Bangasser et al. 2013)"}
  assumptions:
    - "as rel_bangasser2013_ssa_approx_module_flow, for the time-averaged traction κs xs (both positive magnitudes)"
# Not entered: bangasser2013/optimal_stiffness against bangasser2017/module_optimum. The paper says the
# whole-cell optimum shifts "consistent with the results for the simpler motor–clutch model that only
# modelled one protrusion14" (p. 2), but that is the cms, which is not run; the two reader-built optimum
# searches use different κs grids (0.001-100 at 4 per decade against 0.01-1000 at 2 per decade), so their
# difference would mostly measure grid resolution, and 40 samples of a 21-point sweep of 1000 s runs
# (about 25 s each) exceed the model run time limit. The module-level relations above test the same rules.
# Values: no datum of this record names ref-14 as its from_source, so cited.yaml has nothing to link.

# Relations to Bangasser and Odde 2013 (ref. 15, record bangasser2013b). This paper cites ref. 15 twice,
# both for its result, not its models: "the optimal stiffness can be readily shifted by coordinately
# changing the numbers of motors and clutches14,15" and the shift of the optimum "to higher
# stiffness14,15" (p. 2). The module rules are attributed to refs 7 and 14 only (p. 7). So no relation
# is stated; the two below are proposed. Units pN, nm, s on both sides; both count retrograde motion
# and force positive.
- id: rel_b13b_eq5_same_as_eq1
  kind: same_as
  a: bangasser2013b/clutch_offrate_eq5
  b: bangasser2017/off_rate_eq1
  mapping: {koff: "koff", Fc: "Fc", Fb: "Fb"}
  output_map: {koff_i: koff_i}
  regime: {koff: [0.001, 10], Fc: [0, 20], Fb: [0.5, 10]}
  provenance: proposed
  reason: >-
    Both papers call their clutch off-rate the Bell model (ref. 15 Eq. 5, p. 2; this paper's Eq. 1,
    p. 7) and print the same exponential koff exp(Fc,i/Fb) in the same symbols and units. A
    correspondence of quantities: ref. 15's mean_clutch_off_rate output is the loaded off-rate of
    one clutch, as here.
- id: rel_module_ssa_flow_approximated_by_b13b_ode
  kind: approximated_by
  a: bangasser2017/module_ssa
  b: bangasser2013b/clutch_ensemble_cycle
  mapping: {nm: "nm", Fm: "Fm", vu: "vm", nc: "nc", kon: "kon", koff: "koff", Fb: "Fb", kc: "kc", ks: "ks", r: "2"}
  output_map: {v_mean: v_flow}
  regime: {nm: [75, 75], Fm: [2, 2], vm: [120, 120], nc: [75, 75], kon: [1, 1], koff: [0.1, 0.1], Fb: [2, 2], kc: [5, 5], ks: [0.1, 0.1]}
  tolerance: 0.25
  provenance: proposed
  reason: >-
    Ref. 15's clutch-ensemble ODEs (Eqs. 8-12 with the gamma closure Eq. 19) are a mean-field
    description of the stochastic motor-clutch model, which it says shows "good agreement with the MC
    simulations for many clutches" (ref. 15, p. 5). This paper's module follows those stochastic
    rules (p. 7: Eqs. 1, 2, 4, simulated by Gillespie's method), so the ODE is proposed to approximate
    the module's mean retrograde flow as it approximates ref. 15's own MC.
  assumptions:
    - "module_ssa is this record's one-module stand-in for the whole-cell simulator (reconstructed: fixed cell body, no polymerization or module turnover)"
    - "pinned at the conditions where ref. 15 compares ODE with MC (its Fig. 2: Chan and Odde's base set, κsub = 0.1 pN/nm, r = 2), as in bangasser2013b's own relations to the MC"
    - "the module's time-averaged flow over 500 s and the ODE's flow averaged over one load-and-fail cycle both stand for the mean retrograde flow (a correspondence of quantities: retrograde_flow_rate and cycle_mean_flow_rate)"
    - "tolerance 0.25 is the relator's choice, as in bangasser2013b's relations to the MC"
  # Relator's check (2026-11-19): module_ssa gives 94.5 and 95.3 nm/s (seeds 1, 2) against the ODE's
  # 50.9 nm/s, so not_verified (max relative error 0.46). At the same point the same ODE is within 8%
  # of bangasser2013/motor_clutch_ssa (bangasser2013b/rel_ssa_flow_approximated_by_ode, verified), so
  # the gap is in this record's stand-in module, not in ref. 15's ODE. It is larger here (κc = 5 pN/nm)
  # than at Supplementary Table 2's κc = 0.8 pN/nm (8-14%, rel_bangasser2013_ssa_approx_module_flow),
  # consistent with the update order noted there (engaged clutches advanced before the event), whose
  # effect grows with clutch stiffness; not tested.
# Not entered: bangasser2013b/clutch_ensemble_optimum or optimum_eq30 against module_optimum or cms.
# The p. 2 statement (optimum shifted by coordinately changing motors and clutches, refs 14, 15) is
# about the whole-cell simulator, which is not run; module_optimum (21 module_ssa runs of 1000 s) at
# two (nm, nc) points exceeds the relation test's time limit, as noted above for ref. 14; and the
# ODE optimum (r = 3) is itself a closure approximation that ref. 15 says is "shifted slightly higher"
# than the MC. No relation is entered for motor_velocity_eq2: ref. 15 writes the same linear
# force-velocity law only inside its ODEs, with no model of its own for it.

# Relations to Bell 1978 (ref. 19, record bell1978), reviewed 2026-11-19. The paper cites ref. 19
# once, for Eq. 1 ("according to the Bell model19", p. 7); that is rel_eq1_bell above, against
# Bell's loaded reverse rate k_ exp(γf/kT) (p. 623), the rate form of Bell's law. Not entered:
# - bell1978/lifetime_eq16 against off_rate_eq1: the same law as a lifetime, tau = 1/k; it adds
#   nothing to rel_eq1_bell and its output (a lifetime) is not the same quantity as an off-rate.
# - bell1978/peak_inertial_force against cms: the shared shape (force from a length and a rate) is
#   a coincidence of dimensions; Bell's model is the inertial force on a cell on a shaken fiber
#   (p. 624), which no part of the migration simulator describes, and cms is not runnable.
# Values: no datum here names ref-19 as its from_source (Fb and k*off come from Supplementary
# Table 2), so cited.yaml has nothing to link to bell1978.

# Relations to Chan and Odde 2008 (ref. 7, record chan2008), reviewed 2026-11-19. The paper says the
# simulator "is based on the motor-clutch model of cellular force transmission7" and that each module
# follows "rules as previously described7,14" (p. 7). Eq. 1 against Chan's Eq. 1 is rel_eq1_chan above.
# Eq. 2 is Chan's linear force-velocity law (SOM Eqs. 3-4), and module_ssa (the reader's one-module
# stand-in for the cms) runs the same rules as Chan's Monte Carlo; both are entered below as stated.
# Not entered: chan2008/motor_clutch or motor_clutch_E against cms, since cms is not runnable; Chan's
# Eq. 13 (κsub from E) has no counterpart here (this paper reports moduli, not κs, for its gels).
