# Relations to Chaudhuri et al. 2015 (ref. 10, record chaudhuri2015), reviewed 2026-11-19. The paper
# cites ref. 10 once, in a list of applications: "the motor–clutch-based modelling was used to study the
# effect of substrate stress relaxation on cell spreading, collective cell durotaxis and ex vivo cell
# migration as a function of adhesion molecule expression10–12" (p. 2). That says Chaudhuri used the
# motor-clutch model, not that any model here is Chaudhuri's; the module rules are attributed to refs 7
# and 14 only (p. 7). So no relation is stated; the two below are proposed, at the level of the rate
# laws both papers take from the same lineage (Chan and Odde). Units pN, nm, s on both sides; both
# papers print forces and velocities positive.
- id: rel_chaudhuri_bell_off_rate_same_as_eq1
  kind: same_as
  a: chaudhuri2015/bell_off_rate
  b: bangasser2017/off_rate_eq1
  mapping: {koff: "koff", Fc: "Fclutch", Fb: "Frup"}
  output_map: {koff_i: koff_star}
  regime: {koff: [0.001, 10], Fclutch: [0, 20], Frup: [0.5, 10]}
  provenance: proposed
  reason: >-
    Both papers compute the loaded clutch off-rate with the Bell model, both citing Bell (Chaudhuri
    sref-5, Supp. Note 1, p. 11; this paper ref. 19, Eq. 1, p. 7): Chaudhuri's k*off = koff e^(Fclutch/Frup)
    and this paper's koff,i = k*off exp(Fc,i/Fb) are the same exponential law, 1/s and pN on both sides.
  assumptions:
    - "Chaudhuri's rupture force Frup and this paper's characteristic rupture force Fb are the same parameter of the same law (2 pN in both parameter tables), and Fclutch and Fc,i are the force on one clutch (correspondences of quantities, not merged)"
    - "the symbols are swapped between papers: Chaudhuri's unloaded rate is koff and loaded k*off, this paper's unloaded rate is k*off and loaded koff,i; the mapping follows the meanings, not the letters"
- id: rel_eq2_same_as_chaudhuri_retrograde_flow
  kind: same_as
  a: bangasser2017/motor_velocity_eq2
  b: chaudhuri2015/retrograde_flow_eq1
  mapping: {vu: "vm", F_sum: "ks*xs", Fstall: "nm*Fm"}
  output_map: {v_retrograde: vm_j}
  regime: {vm: [10, 1000], ks: [0.01, 100], xs: [0, 100], nm: [1, 1000], Fm: [0.5, 10]}
  provenance: proposed
  reason: >-
    Both are the linear force-velocity law for myosin-driven F-actin retrograde flow taken from Chan and
    Odde: Chaudhuri's Supp. Eq. 1, v_retrograde = vu (1 - sum_clutch Fclutch / Fstall), and this paper's
    Eq. 2, vm,j = v*m (1 - κs xs,j / (nm,j Fm)). By this paper's force balance (Eq. 4) the substrate force
    κs xs,j equals the summed clutch force of the module, and Chan and Odde's Fstall = nm Fm (their
    Eq. 4) makes the module's stall force nm,j Fm.
  assumptions:
    - "Chaudhuri's total clutch force sum Fclutch corresponds to this paper's substrate force κs xs,j (equal by Eq. 4 of this paper; in Chaudhuri's no-lattice model each clutch pulls its own substrate spring, and the sum of their forces is the same total)"
    - "Chaudhuri's stall force Fstall (150 pN, a single parameter in Supp. Table 2) stands for nm,j Fm here (200 pN for the module set of Supplementary Table 2); correspondences of quantities, not merged"
    - "Chaudhuri's v_spread = vu - v_retrograde has no counterpart in Eq. 2, so only v_retrograde is related"
# Not entered: chaudhuri2015/clutch_springs_nolattice against bangasser2017/cms or module_ssa, although
# all take motor, clutch and stiffness parameters to a velocity (the shape that paired these papers).
# (1) The outputs are different quantities: Chaudhuri's v_spread = vu - v_retrograde, a spreading speed,
# against this paper's mean retrograde flow (cms v_flow, module_ssa v_retro); output_map cannot convert
# one into the other, since v_spread depends on vu, which is an input, not an output. (2) The substrates
# differ: Chaudhuri gives each clutch its own substrate spring in series, while a module here loads all
# its clutches on one shared substrate spring (Eq. 4). (3) Neither paper states a limit or closure taking
# one to the other, and cms is not runnable. chaudhuri2015/lattice_spreading is not runnable either.
# Values: no datum of this record names ref-10 as its from_source (the module parameters come from
# Supplementary Table 2), so cited.yaml has nothing to link to chaudhuri2015; chaudhuri2015 (earlier)
# does not cite this paper.
- id: rel_cms_implemented_as_cms2d_code
  kind: same_as
  a: bangasser2017/cms
  b: cms_code/cms2d_code
  mapping: {mpool: "Nm", cpool: "Nc", totact: "Atot*1000", maxpoly: "vp_max", kmod0: "kmod_max", kcap: "kcap",
            lcell: "lin*1000", lmin: "lmin*1000", Kcell: "kcell", nc: "nc_cell", Fm: "Fm", vu: "vm",
            kon: "kon", koff: "koff", Kc: "kc", Fb: "Fb", Ksub: "ks"}
  output_map: {rgflow: v_flow}
  regime: {Nm: [1000, 10000], Nc: [750, 7500], Atot: [50, 200], vp_max: [100, 300], kmod_max: [0.5, 2],
           kcap: [0.0005, 0.002], lin: [2, 10], lmin: [0.05, 0.2], kcell: [1000, 10000], nc_cell: [5, 20],
           nm_max: [100, 1000], Fm: [1, 3], vm: [60, 240], nc_max: [75, 750], kon: [0.5, 2], koff: [0.05, 0.2],
           kc: [0.4, 1.6], Fb: [1, 4], ks: [0.01, 100]}
  provenance: stated
  citation: {page: 7, printed_page: "7", quote: "The model was implemented using a direct Gillespie", where: "Methods, Simulator implementation; Code availability (p. 9): 'All codes will be available on our laboratory website'"}
  assumptions:
    - "the released MATLAB CMS v1.0 (cms_code, reference code-cms) is the implementation the Methods describe; its readme gives the parameters 'from Table S2' of this paper"
    - "the code's nm,max and nc,max are not inputs but one tenth of the pools (cms_code/module_max_port), so nm_max and nc_max have no counterpart in the mapping; the paper's Supplementary Table 2 values equal that rule (rel_max_rule)"
    - "the code's rgflow (mean over 15-min samples of the mean module flow) is the paper's mean module flow v_flow (Fig. 1c)"
    - "both models are unrunnable here, so this relation cannot be tested as a whole; its rules are tested one by one in cms_code/relations.yaml (Eqs. 1, 2, 3, 7, 8 and the one-tenth rule), where the code clips the flow at zero beyond stall and rounds Eq. 8 up (q_flow_clip, q_assign_rounding), and the shells set kcell 1000 pN/nm against Supplementary Table 2's 10,000 (q_kcell)"

# Relations to Elosegui-Artola et al. 2014 (ref. 8, record elosegui2014), reviewed 2026-11-19. The paper
# cites ref. 8 once, in a list: "a model of cellular force transmission based on the motor–clutch
# hypothesis6 that naturally predicts biphasic stiffness dependence as an outcome of the model7–9" (p. 2).
# That places Elosegui's model in the same family; it does not say that any model here is Elosegui's. The
# module rules are attributed to refs 7 and 14 only (p. 7). So no relation is stated, and none is proposed:
# - elosegui2014/integrin_clutch_sim against cms or module_ssa: Elosegui's clutches are FN-integrin bonds
#   of two competing types with a catch-bond off-rate (ref. 12's curve) and force-triggered reinforcement of
#   integrin density; the modules here have one clutch type with the Bell slip bond (Eq. 1) and no
#   reinforcement. Elosegui says the same qualitative results follow with slip bonds (elosegui2014 p. 4),
#   but no limit is printed that takes one model to the other, the substrate is a Young's modulus (kPa)
#   there and a spring constant (pN/nm) here, and neither integrin_clutch_sim nor cms is runnable, so a
#   relation could not be tested. Both already relate to the common ancestors (chan2008, bangasser2013).
# - elosegui2014's kon_eff_ratio, kont_ratio, koff_ratio and density_fold: ratios of SPR-measured integrin
#   rates and densities, with no counterpart among this paper's models.
# Values: no datum of this record names ref-8 as its from_source, so cited.yaml has nothing to link to
# elosegui2014; elosegui2014 (earlier) does not cite this paper.

# Relations to Elosegui-Artola et al. 2016 (ref. 9, record elosegui2016), reviewed 2026-11-19. The paper
# cites ref. 9 once, in the same list as ref. 8: "naturally predicts biphasic stiffness dependence as an
# outcome of the model7–9" (p. 2). The module rules are attributed to refs 7 and 14 only (p. 7), so no
# relation is stated. One is proposed below, at the module level. Not entered:
# - cms against clutch_no_talin_sim (the shape that paired these papers): cms is not runnable, and its
#   outputs (whole-cell mean module flow, summed traction in pN) differ in scope from one clutch module's
#   flow and traction stress (Pa).
# - anything against clutch_talin_sim, talin_unfolding_time, unfold_refold_crossing or
#   threshold_sensitivity: talin unfolding, vinculin binding and integrin recruitment have no counterpart
#   here (Supplementary Table 1 lists talin mRNA levels in U251 cells, not a model).
# - off_rate_eq1 against Elosegui's catch bond: Elosegui has no separate off-rate model, and a sum of
#   exponentials with a low-force term is not Bell's law except in the reduction used below.
# Values: no datum of this record names ref-9 as its from_source, so cited.yaml has nothing to link to
# elosegui2016; elosegui2016 (earlier) does not cite this paper.
- id: rel_module_ssa_flow_approximated_by_elosegui2016_no_talin
  kind: approximated_by
  a: bangasser2017/module_ssa
  b: elosegui2016/clutch_no_talin_sim
  mapping:
    nm: "nm"
    Fm: "Fm"
    vu: "vm"
    nf: "nc"
    kont: "kon"
    dint: "1"
    kc: "kc/1000"
    E: "ks"
    ra: "1000"
    ksub_factor: "1"
    koff_scale: "1"
    koff_a: "koff"
    koff_b: "1/Fb"
    koff_c: "0"
    koff_d: "0"
    koff_g: "0"
    koff_fend: "1"
  output_map: {actin_flow: v_flow}
  regime: {nm: [80, 120], Fm: [1.6, 2.4], vm: [100, 140], nc: [60, 90], kon: [0.8, 1.2], koff: [0.08, 0.12],
           Fb: [1.6, 2.4], kc: [0.64, 0.96], ks: [0.01, 100]}
  tolerance: 0.15
  provenance: proposed
  reason: >-
    This paper places ref. 9 among the motor-clutch models that predict biphasic stiffness dependence
    (p. 2), and each of its modules follows the motor-clutch rules (p. 7: Bell off-rate Eq. 1, linear
    force-velocity Eq. 2, force balance Eq. 4). Elosegui-Artola et al.'s simulation without talin
    unfolding is the same stochastic motor-clutch scheme ("we recapitulate the fundamental prediction of
    the clutch model", elosegui2016 p. 4) with a catch-bond off-rate and kon = kont dint, ksub = c E ra.
    With the catch bond reduced to its first exponential (koff_c = koff_g = 0, koff_b = 1/Fb), dint = 1,
    c = 1 and ra = 1000 nm (so that ksub in pN/nm equals E in kPa), both compute the mean retrograde flow
    of one module by different stochastic schemes (direct Gillespie for 500 s against fixed 5 ms steps
    for 100 s), so their mean flows should agree approximately.
  assumptions:
    - "module_ssa is this record's one-module stand-in for the whole-cell simulator (reconstructed: fixed cell body, module maxima n*m and n*c, no polymerization or turnover)"
    - "the catch bond is restricted to a single Bell exponential; with Elosegui's printed catch-bond parameters the two models differ by design"
    - "kc: module_ssa in pN/nm, Elosegui in nN/nm (hence /1000); Elosegui's binding rate per free fibronectin is kont dint, so dint = 1 1/um^2 makes kont (um^2/s) numerically kon (1/s)"
    - "regime: +-20% around Supplementary Table 2's module set (n*m = 100, n*c = 75, kon = 1 1/s, koff = 0.1 1/s, Fb = Fm = 2 pN, v*m = 120 nm/s, κc = 0.8 pN/nm), over κs 0.01-100 pN/nm; a 5 ms step then loads a clutch by about κc v dt ~ 0.5 pN, small against Fb"
    - "tolerance 0.15 (added, as in elosegui2016/rel_bangasser_ssa_approximated_by_no_talin): the scatter of single seeded runs, not stated by either paper"
    - "only the flow is compared: Elosegui's traction is a stress (Pa) over the adhesion area, module_ssa's a force (pN)"
  # Relator's check (2026-11-19), seed 1 at the base set: module_ssa 82.7, 72.5, 62.9, 85.2, 86.4 nm/s against
  # Elosegui (Bell-reduced) 90.3, 69.8, 54.3, 82.9, 83.8 nm/s at κs = 0.01, 0.1, 1, 10, 100 pN/nm; Elosegui's
  # flows change by under 3% at dt = 0.625 ms, so the gap is not its time step. The test over the regime gives
  # not_verified (max relative error 0.517). module_ssa sits ~14% above at κs = 1 pN/nm, as against
  # bangasser2013/motor_clutch_ssa (rel_bangasser2013_ssa_approx_module_flow), while Elosegui's model agrees
  # with that SSA within 0.15 (elosegui2016/rel_bangasser_ssa_approximated_by_no_talin, verified): the gap is
  # in this record's stand-in module (update order, see above), not shown to be in either paper's simulator.

# Relations to the Odde lab's released motor-clutch scripts (record odde_code: motorclutch1_1.m and
# motorclutch2_3.m, event stepping, ported as odde_code/mc_event_port), reviewed 2026-11-19. This paper
# does not cite those scripts: its code reference is the CMS (code-cms, record cms_code), and its module
# rules are attributed to refs 7 and 14 (p. 7), whose code odde_code is. So no relation is stated; the two
# below are proposed, at the module level. Not entered:
# - cms against mc_event_port (the shape that paired these records): cms is not runnable, and its outputs
#   are whole-cell (mean module flow over all modules, traction summed over modules and cell body).
# - module_optimum against optimum_port: the grids differ (0.01-1000 at 2 per decade against
#   logspace(-2,2,10)), so the difference would mostly measure grid resolution, and module_optimum's 21
#   runs of 1000 s exceed the relation test's time limit (as noted above for bangasser2013).
# - off_rate_eq1 or motor_velocity_eq2 against mc_event_port: the code has no separate rate-law model;
#   its off-rate with gain = 0 is Eq. 1, already related to chan2008 and bangasser2013b above.
# Values: no datum of either record names the other as its from_source (odde_code, 2010, predates this
# paper; this paper's module set is Supplementary Table 2), so neither cited.yaml has anything to link.
- id: rel_odde_code_event_port_approx_module_flow
  kind: approximated_by
  a: odde_code/mc_event_port
  b: bangasser2017/module_ssa
  mapping: {nm: "nm", Fm: "-Fm", vm: "-vu", nc: "nc", kon: "kon", koff: "koff", Fb: "-Fb", kc: "Kc", ks: "Ksub"}
  output_map: {v_flow: v_retro}
  regime: {nm: [80, 120], Fm: [-2.4, -1.6], vu: [-144, -96], nc: [60, 90], kon: [0.8, 1.2], koff: [0.08, 0.12],
           Fb: [-2.4, -1.6], Kc: [0.64, 0.96], gain: [0, 0], Ksub: [0.01, 100]}
  tolerance: 0.1
  provenance: proposed
  reason: >-
    Each module of this paper's simulator follows the motor-clutch rules of refs 7 and 14 (p. 7: Bell
    off-rate Eq. 1, linear force-velocity Eq. 2, force balance Eq. 4, Gillespie stepping), and odde_code is
    the same lab's released event-stepping implementation of those rules (its header: "Reduplicate the Chan
    Motor-Clutch model with event stepping"). With the code's gain term at 0 both simulate one clutch scheme
    exactly in the stochastic sense, so their mean retrograde flows should agree within run-to-run noise.
  assumptions:
    - "module_ssa is this record's one-module stand-in for the whole-cell simulator (reconstructed: fixed cell body, module maxima n*m and n*c, no polymerization or turnover)"
    - "the code takes vu, Fm and Fb negative (retrograde negative) and reports retro and -avtrac as positive magnitudes; module_ssa takes them positive, hence the minus signs in the mapping"
    - "gain = 0 (the code's own value) makes the code's off-rate koff exp(Fc/Fb), Eq. 1"
    - "both are exact stochastic simulations differing in method (first-reaction event stepping against direct Gillespie), run length (1e5 events against 500 s), seed stream and update order (the code executes the event before advancing the engaged clutches by vf dt, so a clutch just bound is stretched over the preceding interval; module_ssa advances them first)"
    - "regime: +-20% around Supplementary Table 2's module set (n*m = 100, n*c = 75, kon = 1 1/s, koff = 0.1 1/s, Fb = Fm = 2 pN, v*m = 120 nm/s, κc = 0.8 pN/nm), over κs 0.01-100 pN/nm (the code's own logspace(-2,2) sweep)"
    - "tolerance 0.1 (added): allows for the noise of one seeded run of each, as in rel_bangasser2013_ssa_approx_module_flow"
