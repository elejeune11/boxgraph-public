# Relations this paper states about its models. mapping: b's input symbol -> expression in a's
# input symbols, numbers in each model's port units (1 dyne = 1e7 pN; 1 eV/nm = 160.2176634 pN).
- id: rel_eq1_bell
  kind: same_as
  a: bell1978/loaded_reverse_rate
  b: bangasser2017/off_rate_eq1
  mapping: {koff: "k_minus", Fc: "1e7*f", Fb: "160.2176634*kT/gamma"}
  regime: {k_minus: [1.0e-4, 10], gamma: [0.1, 1], f: [1.0e-7, 1.0e-5], kT: [0.0257, 0.0267]}
  provenance: stated
  citation: {page: 7, printed_page: "7", quote: "that depends on the clutch force, Fc,i, according to the Bell model19", where: "Eq. 1"}
  assumptions:
    - "Bangasser's characteristic rupture force Fb is Bell's kT/gamma, and the force on one clutch is Bell's force per closed bond"
- id: rel_eq1_chan
  kind: same_as
  a: chan2008/off_rate_eq1
  b: bangasser2017/off_rate_eq1
  mapping: {koff: "koff", Fc: "Fclutch", Fb: "Fb"}
  regime: {koff: [0.01, 10], Fclutch: [0, 20], Fb: [1, 10]}
  provenance: stated
  citation: {page: 7, printed_page: "7", quote: "composed of j motor–clutch modules, each following rules as previously", where: "Methods, citing refs 7 (Chan and Odde) and 14"}
  assumptions:
    - "in positive forces; Chan's Table S1 prints Fclutch and Fb both negative, which leaves their ratio unchanged"
- id: rel_bangasser2013_catch_slip_to_eq1
  kind: reduces_to
  a: bangasser2013/catch_slip_eq9
  b: bangasser2017/off_rate_eq1
  mapping: {koff: "koff", Fc: "F", Fb: "Fb"}
  output_map: {koff_i: koff_star}
  limit: {koffc: "0"}
  regime: {F: [0, 20], koff: [0.01, 1], Fb: [1, 10], koffc: [0.001, 1], Fc: [1, 10]}
  tolerance: 1.0e-5
  provenance: stated
  citation: {page: 7, printed_page: "7", quote: "composed of j motor–clutch modules, each following rules as previously", where: "Methods, citing refs 7 and 14 (Bangasser et al. 2013)"}
  assumptions:
    - "ref. 14's off-rate is the catch-slip Eq. 9; this paper uses only its slip (Bell) term, which is Eq. 9 with no catch term (koffc -> 0)"
# Not entered: the whole-cell simulator (cms) against bangasser2013/motor_clutch_ssa or
# chan2008/motor_clutch. The paper states that each module follows the rules of refs 7 and 14, but
# cms is not runnable here, so a relation could not be tested. The reader's single-module stand-in
# (module_ssa) is the paper's Eqs. 1, 2 and 4 with the direct Gillespie method; bangasser2013's
# motor_clutch_ssa is the same scheme with the first-reaction method; they are related below.
# One output per relation (approximated_by); each model runs at its own settings and seed.
- id: rel_bangasser2013_ssa_approx_module_flow
  kind: approximated_by
  a: bangasser2013/motor_clutch_ssa
  b: bangasser2017/module_ssa
  mapping: {nm: "nm", Fm: "Fm", vm: "vu", nc: "nc", kon: "kon", koff: "koff", Fb: "Fb", kc: "kc", ks: "ksub"}
  output_map: {v_flow: v_retro}
  regime: {nm: [80, 120], Fm: [1.6, 2.4], vu: [100, 140], nc: [60, 90], kon: [0.8, 1.2], koff: [0.08, 0.12],
           Fb: [1.6, 2.4], kc: [0.64, 0.96], ksub: [0.01, 100]}
  tolerance: 0.1
  provenance: stated
  citation: {page: 7, printed_page: "7", quote: "composed of j motor–clutch modules, each following rules as previously", where: "Methods, citing refs 7 and 14 (Bangasser et al. 2013)"}
  assumptions:
    - "the paper's statement is about the modules of the whole-cell simulator (cms); module_ssa is the reader's one-module stand-in for it (reconstructed), with the module maxima n*m and n*c and a fixed cell body"
    - "both are exact stochastic simulations of one clutch scheme, differing in method (first-reaction against direct Gillespie), in run length (1000 s against 500 s), in seed stream, and in the order of the update: bangasser2013's record executes the event before advancing the engaged clutches by flow x time, bangasser2017's advances them first, so a clutch just bound is stretched over the preceding interval in the former only"
    - "regime: +-20% around Supplementary Table 2's module set (n*m = 100, n*c = 75, kon = 1 1/s, koff = 0.1 1/s, Fb = Fm = 2 pN, v*m = 120 nm/s, κc = 0.8 pN/nm), over the substrate stiffness range 0.01-100 pN/nm"
    - "tolerance 0.1 (added): allows for the noise of one seeded run of each; seed-to-seed scatter is about 1-2% at the base set"
  # Relator's check (base set): seeds 1-4 give 75.4-75.9 against 80.7-82.7 nm/s at κs = 0.01 pN/nm and
  # 54.7-55.2 against 61.4-62.9 nm/s at 1 pN/nm, so a systematic ~8-14% difference, larger than the noise;
  # the update order above is the likely cause, not tested. The relation test gives not_verified (max
  # 0.157 flow, 0.230 traction), while bangasser2013/motor_clutch_ssa agrees with the lab's released
  # MATLAB (odde_code/mc_event_port) within 1% (flow) and 4% (traction): the gap is in this record's
  # stand-in module, whose update order follows this paper's printed algorithm steps.
- id: rel_bangasser2013_ssa_approx_module_traction
  kind: approximated_by
  a: bangasser2013/motor_clutch_ssa
  b: bangasser2017/module_ssa
  mapping: {nm: "nm", Fm: "Fm", vm: "vu", nc: "nc", kon: "kon", koff: "koff", Fb: "Fb", kc: "kc", ks: "ksub"}
