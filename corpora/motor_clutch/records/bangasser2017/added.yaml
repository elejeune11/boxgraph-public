- id: pixel_size_40x
  quantity: pixel_size
  unit: um
  printed: "0.16125"
  basis: >-
    The paper names the camera (CoolSnap HQ2) and the 40x/0.60 NA objective used for traction imaging
    (p. 8) but not the pixel size on the sample. The CoolSnap HQ2 sensor pixel is 6.45 um (maker's
    specification, not in the paper); 6.45/40 = 0.16125 um, with no extra magnification.
  alternatives: ["0.163", "0.1625"]
  stands_for: "the pixel size that turns the PIV pixel counts into the printed um lengths"
- id: nm_free_full_low
  quantity: n_motors_free
  unit: dimensionless
  printed: "1000"
  basis: >-
    The free motor pool when the first module is created: no module exists yet, so every motor of the
    low set (Nm = 1,000, Supplementary Table 2) is free. The paper does not print the pool size.
  alternatives: ["900", "800"]
  stands_for: "nm,free in Eq. 8 at the first module creation (low set); alternatives: after one and two modules took n*m = 100"
- id: nc_free_full_low
  quantity: n_clutches_free
  unit: dimensionless
  printed: "750"
  basis: >-
    The free clutch pool when the first module is created: no module exists yet, so every clutch of
    the low set (Nc = 750) is free (the cell-body clutches nc,cell are listed separately in
    Supplementary Table 2 and are not counted against Nc here).
  alternatives: ["740", "675"]
  stands_for: "nc,free in Eq. 9 at the first module creation (low set); alternatives: Nc less the 10 cell-body clutches, and after one module took n*c = 75"
