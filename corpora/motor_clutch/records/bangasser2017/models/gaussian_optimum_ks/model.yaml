id: gaussian_optimum_ks
name: optimum spring constant from a logarithmic Gaussian fitted to composite data (Fig. 1g)
role: fit
stated: {page: 9, printed_page: "9", quote: "to the data without constraining the variance", where: "Methods, Composite metrics"}
equation: "C = A exp(-(log10 K - m)^2/(2 s^2)); K_opt = 10^m (the peak of the fit curve)"
inputs:
  C: {quantity: composite_metric, unit: dimensionless, curve: {quantity: substrate_stiffness, unit: pN/nm}}
outputs:
  K_opt: {quantity: stiffness_of_composite_optimum, unit: pN/nm}
settings: {fit_amplitude: false}
stochastic: false
from_words: true
