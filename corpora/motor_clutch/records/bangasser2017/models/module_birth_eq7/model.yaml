id: module_birth_eq7
name: module creation rate, proportional to the fourth power of the G-actin fraction (Eq. 7)
role: model
stated: {page: 7, printed_page: "7", quote: "ratio of G-actin to the total actin raised to the fourth power", where: "Eq. 7"}
equation: "kmod = k*mod (AG / AT)^4"
inputs:
  kmod_max: {quantity: max_module_birth_rate, unit: 1/s, description: "k*mod"}
  AG:       {quantity: g_actin_amount, unit: um}
  AT:       {quantity: total_actin, unit: um}
outputs:
  kmod: {quantity: module_birth_rate, unit: 1/s}
settings: {}
stochastic: false
