id: traction_fold
name: fold difference between two traction forces (the "~10-fold more force" of the Fig. 1d legend)
role: processing
stated: {page: 3, printed_page: "3", quote: "and the high case producing B10-fold more force", where: "Fig. 1d legend"}
equation: "fold = F_high / F_low"
inputs:
  F_high: {quantity: traction_force_magnitude, unit: pN}
  F_low:  {quantity: traction_force_magnitude, unit: pN}
outputs:
  fold: {quantity: traction_fold, unit: dimensionless}
settings: {}
stochastic: false
