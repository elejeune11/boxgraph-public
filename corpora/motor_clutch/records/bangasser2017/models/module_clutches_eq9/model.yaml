id: module_clutches_eq9
name: clutches assigned to a new module from the free pool (Eq. 9)
role: model
stated: {page: 7, printed_page: "7", quote: "and a pool of free clutches, nc,free, according to equations (8)", where: "Eq. 9"}
equation: "nc = n*c nc,free / nc,tot"
inputs:
  nc_max:  {quantity: n_clutches_module_max, unit: dimensionless, description: "n*c"}
  nc_free: {quantity: n_clutches_free, unit: dimensionless, description: "nc,free"}
  nc_tot:  {quantity: n_clutches_total, unit: dimensionless, description: "nc,tot (Nc in Supplementary Table 2)"}
outputs:
  nc: {quantity: n_clutches_module, unit: dimensionless}
settings: {}
stochastic: false
