id: rmc_eq12
name: random motility coefficient from the slope of the mean squared displacement (Eq. 12)
role: processing
stated: {page: 7, printed_page: "7", quote: "can be calculated from the slope of hr2i versus t", where: "Eq. 12 and the Simulation analysis text"}
equation: "μ = <r^2> / (4t); slope of a line through the origin fitted to the first half of <r^2> versus t"
inputs:
  msd: {quantity: mean_squared_displacement, unit: um^2, curve: {quantity: time_interval, unit: min}}
outputs:
  mu: {quantity: random_motility_coefficient, unit: um^2/min}
settings: {first_fraction: 0.5}
stochastic: false
