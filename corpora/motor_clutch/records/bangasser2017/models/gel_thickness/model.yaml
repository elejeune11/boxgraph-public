id: gel_thickness
name: thickness of a gel made by pipetting a volume under a circular coverslip (flat disc)
role: model
stated: {page: 8, printed_page: "8", quote: "covered with a 12 mm No. 1.5 circular cover slip", where: "Methods, Preparation and Characterization of polyacrylamide substrates"}
equation: "h = V / (π (d/2)^2)"
inputs:
  V: {quantity: gel_volume, unit: uL}
  d: {quantity: coverslip_diameter, unit: mm}
outputs:
  h: {quantity: gel_thickness, unit: um}
settings: {}
stochastic: false
reconstructed: >-
  The paper states the gel thicknesses (40-100 um; 700-1,000 um) beside the volumes and coverslips
  without saying how they follow; a flat disc of the pipetted volume spread over the coverslip is
  the reader's stand-in, ignoring swelling after polymerization and solution outside the coverslip.
