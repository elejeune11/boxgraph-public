id: gaussian_optimum_E
name: optimum Young's modulus from a logarithmic Gaussian fitted to composite data (Fig. 4f)
role: fit
stated: {page: 9, printed_page: "9", quote: "to the data without constraining the variance", where: "Methods, Composite metrics"}
equation: "C = A exp(-(log10 E - m)^2/(2 s^2)); E_opt = 10^m (the peak of the fit curve)"
inputs:
  C: {quantity: composite_metric, unit: dimensionless, curve: {quantity: substrate_modulus, unit: kPa}}
outputs:
  E_opt: {quantity: optimal_substrate_modulus, unit: kPa}
settings: {fit_amplitude: false}
stochastic: false
from_words: true
built_from: [gaussian_optimum_ks]
