id: clutch_max_rule
name: maximum clutches per module held at one tenth of the total clutches (Supplementary Fig. 5 legend)
role: model
stated: {page: 21, quote: "maintaining the maximum number of clutches per module", where: "Supplementary Fig. 5 legend (E-H)"}
equation: "n*c = Nc / 10  (\"maintaining the maximum number of clutches per module (nc*) at 1/10 of the total clutches\")"
from_words: true
inputs:
  Nc: {quantity: n_clutches_total, unit: dimensionless}
outputs:
  nc_max: {quantity: n_clutches_module_max, unit: dimensionless}
settings: {}
stochastic: false
