id: stiffness_optimum_fold
name: fold shift between two fitted composite optima (the "ΔKsub,opt = 4-fold" of Fig. 1g)
role: processing
stated: {page: 3, printed_page: "3", quote: "and ﬁt Gaussian curves’ peaks show a statistically signiﬁcant shift", where: "Fig. 1g legend and panel label"}
equation: "ΔKsub,opt = K_opt,high / K_opt,low"
inputs:
  K_high: {quantity: stiffness_of_composite_optimum, unit: pN/nm}
  K_low:  {quantity: stiffness_of_composite_optimum, unit: pN/nm}
outputs:
  fold: {quantity: composite_optimum_shift_fold, unit: dimensionless}
settings: {}
stochastic: false
