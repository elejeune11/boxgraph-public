id: modulus_optimum_fold
name: fold shift between two optimal Young's moduli (the "ΔEopt = 2-fold" of Fig. 4f)
role: processing
stated: {page: 6, printed_page: "6", quote: "Gaussian ﬁt curves peaks show a statistically signiﬁcant shift", where: "Fig. 4f and its legend"}
equation: "ΔEopt = E_opt,a / E_opt,b"
inputs:
  E_a: {quantity: optimal_substrate_modulus, unit: kPa}
  E_b: {quantity: optimal_substrate_modulus, unit: kPa}
outputs:
  fold: {quantity: optimum_shift_fold, unit: dimensionless}
settings: {}
stochastic: false
