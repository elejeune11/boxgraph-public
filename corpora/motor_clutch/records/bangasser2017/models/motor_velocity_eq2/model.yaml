id: motor_velocity_eq2
name: F-actin retraction rate by the motors of one module, linear force-velocity (Eq. 2)
role: model
stated: {page: 7, printed_page: "7", quote: "described by equation (2) in which xs,j is the substrate displacement", where: "Eq. 2"}
equation: "vm,j = v*m (1 - κs xs,j / (nm,j Fm))"
inputs:
  vm:  {quantity: unloaded_motor_velocity, unit: nm/s, description: "v*m"}
  ks:  {quantity: substrate_stiffness, unit: pN/nm, description: "κs"}
  xs:  {quantity: substrate_displacement, unit: nm, description: "xs,j"}
  nm:  {quantity: n_motors_module, unit: dimensionless, description: "nm,j"}
  Fm:  {quantity: motor_stall_force, unit: pN}
outputs:
  vm_j: {quantity: motor_retraction_velocity, unit: nm/s}
settings: {}
stochastic: false
