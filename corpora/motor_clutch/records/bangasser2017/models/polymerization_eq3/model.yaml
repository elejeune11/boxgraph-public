id: polymerization_eq3
name: F-actin polymerization speed of a module, proportional to the G-actin fraction (Eq. 3)
role: model
stated: {page: 7, printed_page: "7", quote: "proportional to the ratio of G-actin, AG, to the total amount of actin", where: "Eq. 3"}
equation: "vp = v*p (AG / AT)"
inputs:
  vp_max: {quantity: max_polymerization_velocity, unit: nm/s, description: "v*p"}
  AG:     {quantity: g_actin_amount, unit: um, description: "AG, counted as protrusion length like Atot"}
  AT:     {quantity: total_actin, unit: um, description: "AT (Atot in Supplementary Table 2)"}
outputs:
  vp: {quantity: polymerization_velocity, unit: nm/s}
settings: {}
stochastic: false
