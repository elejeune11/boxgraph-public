id: off_rate_eq1
name: loaded off-rate of a clutch in a motor-clutch module, Bell model (Eq. 1)
role: model
stated: {page: 7, printed_page: "7", quote: "that depends on the clutch force, Fc,i, according to the Bell model19", where: "Eq. 1"}
equation: "koff,i = k*off exp(Fc,i / Fb)"
described_from: bell1978
inputs:
  koff: {quantity: clutch_off_rate_unloaded, unit: 1/s, description: "k*off"}
  Fc:   {quantity: clutch_force, unit: pN, description: "Fc,i"}
  Fb:   {quantity: bond_rupture_force, unit: pN}
outputs:
  koff_i: {quantity: clutch_off_rate_loaded, unit: 1/s}
settings: {}
stochastic: false
