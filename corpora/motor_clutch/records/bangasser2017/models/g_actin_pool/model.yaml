id: g_actin_pool
name: G-actin left in the pool when n modules hold the actin of their lengths (actin conservation, in words)
role: model
stated: {page: 7, printed_page: "7", quote: "Upon module destruction, all motors, clutches and remaining actin", where: "Methods, Migration simulator description"}
equation: "AG = Atot - sum of module lengths; at creation n modules of length lin: AG = Atot - n lin"
from_words: true
inputs:
  Atot: {quantity: total_actin, unit: um, description: "Atot, total possible actin protrusion length"}
  n:    {quantity: n_modules, unit: dimensionless}
  lin:  {quantity: initial_module_length, unit: um}
outputs:
  AG: {quantity: g_actin_amount, unit: um}
settings: {}
stochastic: false
