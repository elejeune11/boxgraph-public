id: cell_type_optimum_fold
name: fold difference between the stiffness optima of two cell types (the "~100-fold" of the text, p. 3)
role: processing
stated: {page: 3, printed_page: "3", quote: "the increase in optimal stiffness from B1 kPa for neurons to", where: text}
equation: "fold = E_opt,U251 / E_opt,ECFN"
inputs:
  E_a: {quantity: cell_type_optimal_modulus, unit: kPa}
  E_b: {quantity: cell_type_optimal_modulus, unit: kPa}
outputs:
  fold: {quantity: cell_type_optimum_fold, unit: dimensionless}
settings: {}
stochastic: false
