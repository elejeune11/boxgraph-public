  citation: {page: 20, quote: "Scaled strain energy for U251 glioma cells with 6 µM blebbistatin", where: "Supplementary Fig. 4h legend"}

- id: q_gel_thickness
  kind: unexplained_difference
  about: [gel_thickness, cmp_gel_thin, cmp_gel_thick]
  text: >-
    A flat disc of the pipetted prepolymer under the coverslip (4 µl under 12 mm; 300 µl under 25 mm)
    is thinner than the printed thicknesses (40-100 µm, from ref. 7; 700-1,000 µm). Swelling of the
    gel after polymerization, or prepolymer left outside the coverslip edge, would explain a
    difference; the paper does not say how the thicknesses were obtained.

- id: q_pixel_size
  kind: unstated_input
  about: [pixel_size_40x, piv_length, cmp_piv_coarse, cmp_piv_search, cmp_piv_fine, cmp_piv_lattice]
  text: >-
    The paper prints PIV windows both in pixels and in µm but not the pixel size. The record adds
    6.45 µm / 40 = 0.16125 µm (the camera maker's pixel and the stated objective). The printed lengths
    (7.8 µm for 48 px, 16.3 µm for 100 px, 3.9 µm for 24 px, 2.0 µm for 12 px) imply about 0.163 µm,
    so the paper's own conversion likely used a calibrated pixel size about 1% larger; the
    alternative 0.163 is run.

- id: q_eye_only_figures
  kind: reading
  about: [cms, rmc_eq12, dK_opt_fig1g, dEopt_fig4f]
  text: >-
    The figure tools (high-resolution rendering, calibrated code readings) were refused by this
    session's permission mode, so no figure was read: the simulated curves of Figs. 1c-g and
    Supplementary Fig. 5, and the measured points (with s.e.m. bars) of Figs. 2c-e, 3c, 3e-f, 4a-f and
    Supplementary Figs. 2e and 4, are left for a figure pass (figures.md). Eq. 12 (rmc_eq12) is
    entered so that the measured MSD curves of Supplementary Fig. 2e can be checked against the
    motility coefficients of Fig. 2c once read; the composite metric and its log-Gaussian fit could
    then reproduce ΔKsub,opt = 4-fold and ΔEopt = 2-fold.

