  citation: {page: 5, printed_page: "5", quote: "and U251 glioma cells on 700 kPa polyacrylamide gels", where: "Fig. 3e legend"}

- id: q_aspect_ratio_optimum
  kind: possible_error
  about: [quantity:cell_aspect_ratio]
  text: >-
