# cross-record validation with prahl2020 (2026-11-19): none added
- id: q_xval_prahl2020_none
  kind: unstated_model
  about: [cms, module_ssa, module_optimum, rmc_eq12, 'prahl2020/v_exp', 'prahl2020/mu_exp', 'prahl2020/fig2g_exp']
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    prahl2020, a later paper (2020) that this one does not cite. prahl2020 measures U251 cells migrating
    in 1D confining PDMS channels: drift velocity and motility coefficient (v_exp, mu_exp, and the cRGD,
    Y-27632, latrunculin A and MTA series of its Figs. 3-7), the pooled MSD curve (fig2g_exp), EB1
    microtubule growth speeds (eb1_mean) and cell length and nucleus position (Fig. S5C-D). cms, the only
    whole-cell model here, is not runnable and is a 2D unconfined simulator with module directions
    uniform in the plane, not the channel with a polarity bias that prahl2020 built its 1D CMS for.
    module_ssa and module_optimum give one module's mean flow and traction on a spring constant; prahl2020
    measures no retrograde flow, traction or adhesion lifetime. rmc_eq12 is processing (an MSD curve to a
    2D random motility coefficient, <r^2>/(4t)); run on prahl2020's 1D MSD it would not give that paper's
    motility coefficient, which is the 1D diffusion term of a fit with drift (its Eq. 2, n = 1), so the
    two quantities are not the same and processing another paper's data is not a model test.
    prahl2020's claims of agreement with this paper are trends ("consistent with 2D CMS predictions",
    prahl2020 p. 7). In the other direction, see prahl2020/q_xval_bangasser2017_none.
  citation: {page: 7, printed_page: "7", quote: "The cell migration simulator is based on the motor–clutch model", where: text}

