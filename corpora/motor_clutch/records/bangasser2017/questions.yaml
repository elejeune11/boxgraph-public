# ---- added by the figure pass (2026-11-19) ----------------------------------------------------
- id: q_figure_pass
  kind: reading
  about: [q_eye_only_figures]
  text: >-
    The figures left out by the first pass (q_eye_only_figures) are now read by calibrated code
    (figures.yaml, figures/_kit.py, figures.md): 64 readings of Figs. 1c-g, 2c-e, 3c, 3e-f, 4a-f and
    Supplementary Figs. 2E, 4C-I and 5A-H. With them the composite metrics of Figs. 1g and 4f are
    recomputed from the paper's own metric panels (composite_metric_sim, composite_metric_exp), the
    log-Gaussian optima refitted (gaussian_optimum_ks, gaussian_optimum_E) and the printed shifts
    ΔKsub,opt = 4-fold and ΔEopt = 2-fold compared (cmp_kfold_*, cmp_Efold_*), and Eq. 12 is applied to
    the MSD curves of Supplementary Fig. 2E (cmp_rmc_msd).

- id: q_gauss_amplitude
  kind: choice
  about: [gaussian_optimum_ks, gaussian_optimum_E, cmp_kfold_fig1g, cmp_kfold_sim, cmp_Efold_fig4f, cmp_Efold_exp]
  text: >-
    The Methods say a logarithmic Gaussian was fitted "without constraining the variance" but do not
    say whether the amplitude was fitted. The fitted curves drawn in Figs. 1g and 4f all peak at 1, so
    the fits here fix the amplitude at 1 (setting fit_amplitude: false); fit_amplitude: true is the
    alternative. The paper also does not say whether the fit is on the mean points or on all cells; the
    fits here use the plotted (or recomputed) mean composite points, unweighted.
  citation: {page: 9, printed_page: "9", quote: "to the data without constraining the variance", where: "Methods, Composite metrics"}

- id: q_rmc_msd
  kind: choice
  about: [rmc_eq12_msd_set, run_rmc_msd, cmp_rmc_msd, figs2e_msd_4kPa, figs2e_msd_100kPa, figs2e_msd_200kPa]
  text: >-
    Eq. 12 is applied to the averaged MSD curves of Supplementary Fig. 2E as read: each value is the
    middle of the plotted s.e.m. bar (or of the line where no bar stands out), every 15 min from 15 to
