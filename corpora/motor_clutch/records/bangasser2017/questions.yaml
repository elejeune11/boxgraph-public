- id: q_cms_not_run
  kind: numerics
  about: [cms, module_ssa, module_optimum]
  text: >-
    The whole-cell simulator is not run in this record. Its simulated time per cell is not printed
    (the Methods say only that the first hour was discarded; Supplementary Fig. 5 shows steady state
    after about 100 min), the number of simulated cells per condition is in Supplementary Table 3
    (6-71), and one call at 750-7,500 clutches stepped event by event over hours is far beyond a
    build's run budget. The 2D force balance (reference positions, direction of the cell springs, how
    the cell-body clutches of Eq. 5 share the load) is given in words and in the Fig. 1b schematic only.
    So no printed simulator result of Figs. 1c-g or Supplementary Fig. 5 is reproduced here. The module
    rules are checked one by one (Eqs. 1-3, 7-9) and one module stands in for the cell (module_ssa,
    module_optimum, reconstructed). The released MATLAB code is read in record cms_code.
  citation: {page: 7, printed_page: "7", quote: "were excluded from analysis to allow the system to reach steady state", where: "Methods, Simulation analysis"}

- id: q_fig1f_swapped
  kind: possible_error
  about: [ks_rmcpeak_low_fig1f, ks_rmcpeak_high_fig1f]
  text: >-
    The Fig. 1f legend says the random motility coefficient peaks at ~10 pN/nm for low motors and
    clutches and at ~1 pN/nm for high. In the panel (page image) the red (low) points peak at 1 pN/nm
    and the blue (high) points at 10 pN/nm, and the text (p. 2) says the optimum "was shifted to a
    higher stiffness by increasing the numbers of motors and clutches (Fig. 1f)". The legend appears to
    swap the two cases. Recorded as printed; read by eye from the page image only (no calibrated reading).
  citation: {page: 3, printed_page: "3", quote: "For low motors and clutches, random motility coefﬁcient peaks at", where: "Fig. 1f legend"}

- id: q_fig1d_traction_optimum
  kind: overstated_claim
  about: [ks_tracmax_low_fig1d, ks_tracmax_high_fig1d]
  text: >-
    The text (p. 2) says the simulator "predicted a stiffness optimum for cell traction force that was
    reduced by altering the numbers of motors and clutches (Fig. 1d)", while the Fig. 1d legend says the
    traction maximum is at ~0.1 pN/nm for both the low and the high sets, i.e. not shifted. The two
    statements do not say the same thing about the optimum.
  citation: {page: 2, printed_page: "2", quote: "traction force that was reduced by altering the numbers of", where: "Results, Cell migration simulator"}

- id: q_fig1g_p
  kind: possible_error
  about: [dK_opt_fig1g]
  text: >-
    Fig. 1g prints "P <0.0001" in the panel and the legend "(P = 0.0001)" for the same bootstrapped
    shift of the composite optimum. Minor; the shift itself (4-fold) is recorded but not recomputed,
    because it needs the composite metric points and their Gaussian fits, which are only plotted.
  citation: {page: 3, printed_page: "3", quote: "show a statistically signiﬁcant shift in the optimum stiffness for the low", where: "Fig. 1g legend"}

- id: q_stiffness_mapping
  kind: unstated_model
  about: [cms, Eopt_u251_text, Eopt_ecfn_text, quantity:substrate_stiffness, quantity:substrate_modulus]
  text: >-
    Simulated optima are in substrate spring constant (pN/nm, Fig. 1) and measured ones in gel Young's
    modulus (kPa, Figs. 2-4). The text moves between them (the increase "from ~1 kPa for neurons to
    ~100 kPa for glioma cells" is read off Fig. 1c, p. 3) and the Discussion says simulated motility,
    aspect ratio and flow "differed at most by ~25% from the experimental values", but the paper gives
    no conversion from κs to E (Chan and Odde 2008, ref. 7, has one: their Eq. 13). Without it the
    ~25% claim and the kPa readings of the simulator cannot be checked.
  citation: {page: 7, printed_page: "7", quote: "coefﬁcient, cell aspect ratio and actin ﬂow rate differed at most", where: "Discussion"}

- id: q_sim_length
  kind: unstated_input
  about: [cms, module_optimum, run_module_opt_low, run_module_opt_high]
  text: >-
    The simulated time per cell is not printed. The stand-in module runs 1000 s per substrate (300 s
    for the high set, whose event rate is ten times larger) and averages over the whole run; the
    simulated time and the κs grid are refined (ref_t_module_opt_low, ref_t_module_opt_high,
    ref_grid_module_opt_low).

- id: q_module_standin
  kind: choice
  about: [module_ssa, module_optimum, cmp_module_ksflow_low, cmp_module_ksflow_high, cmp_module_kstrac_low, cmp_module_kstrac_high, cmp_module_traction_fold]
  text: >-
    The single module holds the module maxima n*m, n*c (Eqs. 8-9 give a module fewer when the pools
    are partly used), has a fixed cell body, no polymerization, capping or destruction, and no cell
    spring (κcell = 10,000 pN/nm, about 10^4 times κc). A clutch's forced unbinding when its attachment
    passes the motors is left out (the module has no length). The paper's optima are of the whole cell,
    with several modules sharing the pools and the cell body clutches, so the comparisons are
    approximations (purpose approximation) and the printed optima are approximate ("around", "~"), so
    they carry no verdict.

- id: q_eq10_index
  kind: possible_error
  about: [cms, module_ssa]
  text: >-
    Eq. 10 prints the sum in the denominator with lower limit "i = i" (page image); the text defines k_i
    for i = 1..n events, so the lower limit is presumably i = 1. The record's code sums over all events.
  citation: {page: 7, printed_page: "7", quote: "was calculated by equation (10) where URN1 is a uniformly", where: "Eq. 10"}

- id: q_strain_energy_700
  kind: possible_error
  about: [quantity:substrate_modulus]
  text: >-
    The Fig. 3e legend says "Mean strain energy of ECFNs and U251 glioma cells on 700 kPa
    polyacrylamide gels", while the text (p. 4: "on 700 Pa modulus gels") and the Fig. 3d legend
