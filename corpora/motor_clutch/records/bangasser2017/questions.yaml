# ==== cross-record validation with bangasser2013 (2026-11-19): none added =======================
- id: q_xval_bangasser2013_none
  kind: choice
  about: [off_rate_eq1, module_ssa, module_optimum, cms]
  text: >-
    (Cross-record validation.) No model of this record is validated against bangasser2013's measurements.
    (1) off_rate_eq1 has the shape of bangasser2013/catch_slip_eq9, but it gives a loaded off-rate, while
    Kong et al.'s points redrawn there (bangasser2013/tau_kong_fig7c) are mean bond lifetimes, a different
    quantity; and this paper's Eq. 1 is a slip bond with no catch regime, which this paper never sets
    against those lifetimes. (2) The neuron flow of Chan and Odde (bangasser2013/v_figS1b_measured) is a
    curve over Young's modulus, which module_ssa (a spring-constant port) cannot be swept over, and
    module_ssa carries this paper's U251 parameter set, not a neuron set; the paper says only that neurons
    have the lower optimum (a trend, p. 3). (3) The normalized migration and traction of other cell types
    (bangasser2013/migration_fig1a_*, traction_fig1b_*) are outputs of no runnable model here: the
    whole-cell simulator (cms) is not run and module_ssa gives an absolute flow and traction for one
    module, not a quantity normalized to a cell type's maximum. In the other direction, see
    bangasser2013/q_xval_bangasser2017_none.
  citation: {page: 3, printed_page: "3", quote: "the increase in optimal stiffness from B1 kPa for neurons to", where: text}
# cross-record validation with bangasser2013b (2026-11-19): none added
- id: q_xval_bangasser2013b_none
  kind: choice
  about: [cms, module_ssa, module_optimum, off_rate_eq1, motor_velocity_eq2]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    bangasser2013b. That paper's only measured data are the computation times of its ODE and Monte Carlo
    software (bangasser2013b/fig6b_ode_cal, fig6b_mc1_cal, fig6b_mc100_cal, Fig. 6b), which no model here
    outputs. Its other plotted values are outputs of its own ODEs (origin predicted): setting them beside
    module_ssa or module_optimum is a model-to-model comparison, not a validation. This paper cites it
    (ref. 15) only for the predicted shift of the optimal stiffness with motor and clutch numbers, a trend.
    module_ssa and bangasser2013b/clutch_ensemble_cycle have the same shape (a flow from forces, rates and
    stiffnesses), but sharing a shape does not make one predict a measurement of the other. In the other
    direction (bangasser2013b's ODEs against the U251 flow measured here), see
    bangasser2013b/q_xval_bangasser2017_none.
  citation: {page: 2, printed_page: "2", quote: "Our previous theoretical analysis of a single motor–clutch", where: text}
# cross-record validation with bell1978 (2026-11-19): none added
- id: q_xval_bell1978_none
  kind: unstated_input
  about: [off_rate_eq1, cms, module_ssa, module_optimum]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    bell1978. That paper's only measured data are the force to detach adherent cells, about 1 dyne
    per cell, quoted from its ref. 52 (bell1978/force_adhesive, printed "~ 1", so it gets no verdict
    anyway), and the free-sugar concentrations of a cited inhibition experiment (bell1978/c_sugar_low,
    c_sugar_high), which are inputs, not outcomes. No model here outputs a cell detachment force or a
    concentration: off_rate_eq1 gives a clutch off-rate at a given clutch force, module_ssa and
    module_optimum give a module's flow and traction on a compliant substrate, and cms (not runnable)
    gives migration outputs. A detachment force for a whole cell would need the number of bonds and
    how load is shared among them, which neither paper states for the cells of bell1978's ref. 52.
    This paper takes the Bell form of off_rate_eq1 from bell1978 (ref. 19, p. 7); that relates the
    two models, it is not a prediction of a measurement. cms and bell1978/peak_inertial_force share a
    shape (a force from a length and a rate) but describe different things. In the other direction,
    see bell1978 q_xval_bangasser2017_none.
  citation: {page: 7, printed_page: "7", quote: "that depends on the clutch force, Fc,i, according to the Bell model19", where: text}
# cross-record validation with chan2008 (2026-11-19): none added here
- id: q_xval_chan2008_none
  kind: choice
  about: [cms, module_ssa, module_optimum, motor_velocity_eq2, off_rate_eq1]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of chan2008.
    chan2008 measures neuron (ECFN) filopodia: retrograde flow against gel Young's modulus
    (chan2008/v_fig3d_exp_sem, v_figS8C_*), flow histograms, bead step and strain histograms, failure
    frequencies, surface tension, and the peak filopodial force and contact distance from the Cerruti
    analysis. cms is not runnable. module_ssa takes a substrate spring constant, not a modulus (this
    paper gives no conversion from E to κs), and carries this paper's U251 module set, not a neuron set;
    the paper says only that ECFNs have the lower optimum (~1 kPa, p. 3), a trend, and does not run its
    simulator for neurons. cms and chan2008/force_velocity_eq3 share a shape (a velocity from a force,
    a stiffness and a velocity) and the same motor law (motor_velocity_eq2); that relates the models but
    predicts no measurement. In the other direction, chan2008/motor_clutch_E is set against the ECFN flow
    redrawn in Fig. 3c (chan2008/val_flow_bangasser2017_fig3c, fit_quality), and against nothing else
    here (chan2008/q_xval_bangasser2017_unused).
  citation: {page: 3, printed_page: "3", quote: "maximal traction strain energy on a stiffness of B1 kPa7,14", where: text}
# cross-record validation with chaudhuri2015 (2026-11-19): none added
- id: q_xval_chaudhuri2015_none
  kind: choice
  about: [cms, module_ssa, module_optimum, off_rate_eq1, motor_velocity_eq2, ref-10]
  text: >-
