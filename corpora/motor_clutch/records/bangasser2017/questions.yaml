  citation: {page: 4, printed_page: "4", quote: "Cell aspect ratio has a potential maximum at B9 kPa", where: "Fig. 2e legend"}

- id: q_drug_units
  kind: reading
  about: [quantity:substrate_modulus]
  text: >-
    Drug doses: the OCR of the Fig. 4e legend reads "6 mM blebbistatin and 0.6 mM cyclo(RGDfV)"; the
