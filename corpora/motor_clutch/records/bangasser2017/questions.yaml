    weights) and averages the coefficients for Fig. 2c, so the two need not agree exactly even if
    both are right; a disagreement beyond the s.e.m. bars of Fig. 2c is still worth noting.
  citation: {page: 16, quote: "squared displacement versus time plots for U251", where: "Supplementary Fig. 2E legend"}

