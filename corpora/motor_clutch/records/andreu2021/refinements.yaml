# time (1000 s), over which d_int is averaged. Refined on one panel (10% stretch, k_sub as in the code):
# the other panels share the code and settings, and each refinement re-runs a whole sweep.
# The grids of the corrected rates (df, dfstart, L grid) are not refined here: with a stochastic model a
# change of grid changes every trajectory, so a two-point series would mostly measure sampling noise
# (q_rate_tables).
