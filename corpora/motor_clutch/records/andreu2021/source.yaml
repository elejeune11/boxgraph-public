notes: >
  PDF pp. 1-12 are the article, pp. 13-23 the Supplementary Information (the model parameters are in
  Supplementary Table 4 on PDF p. 23; Supplementary Table 2 there is the gel rigidities).
  In scope, the two models that produce printed numbers.
  (1) The computational clutch model under imposed cyclic stretch (Methods pp. 10-11, Eqs. 4-6,
  Supplementary Table 4), whose only printed results are the four black model lines of Fig. 2e. The model
  is entered as the paper states it: three events per clutch (integrin unbinding, talin unfolding, actin
  breaking above Fact), |v| = 2Af, the Eq. 4 force balance, the Eq. 5-6 loading-rate correction of rates,
  1000 s runs averaged in time. The paper does not print the catch-bond and slip-bond rate laws, how the
  loading rate of a clutch is computed in the simulation, the numerical grids of the corrected rates, or the
  numbers of the scaling from integrin density to adhesion length: these are added inputs or settings,
  taken from Supplementary Software 1 (record andreu2021_code) and labelled. The four Fig. 2e lines are read
  by code at the five labelled frequencies and compared twice: with every input as printed (Supplementary
  Table 4 prints ksub = 1 µN/nm) and with ksub = 1 pN/nm as in the code (q_ksub_unit). The record's
  model has no talin refolding, which the paper does not describe but the code contains (q_refolding).
  (2) The cell-edge deformation speed |v| = 2Af with A = stretch x cell radius (p. 2, p. 5, p. 10,
  Supplementary Table 1 note i), compared with the printed ~60 nm/s and 2-8 µm/s.
  Also recorded: the two printed values of Fact (142 pN, about 140 pN) and of dadd (table and text), as
  consistency checks.
  Left out: all measured data (Figs. 1, 2b-c, 3, 4, 5, Supplementary Figs. 1-6, Supplementary Tables 2-3),
  since no model in the paper predicts them; the experimental YAP and paxillin points of Fig. 2e, against
  which the paper compares its model by eye, are in the authors' source data (record andreu2021_data) and
  partly hidden behind each other in the figure, so they were not read here (a validation comparison is
  left for a cross-record job). The DMT fit (Eq. 3) of AFM retraction curves and the intensity ratios
  (Eqs. 1-2) process raw data that the paper does not print. Supplementary Table 1 gives only orders of
  magnitude ("we provide only orders of magnitude for comparison"), so it is not compared. The statements
  "over 5-fold to 3.4 kPa" and "an increase of 4-8-fold" are inequalities or loose ratios with no model and
  were left out.
  Second figure pass (2026-11-01): the measured data left out above are now read by code from the figures
  (82 readings in figures.yaml, shared code figures/_kit.py, one datum each, origin measured; see
  figures.md). The Fig. 1e-h paxillin lengths validate the clutch model runs and the paper's own Fig. 2e
  lines (val_*). Repeated plots (Fig. 4n/o vs 3g) and Supplementary Fig. 2b vs the slopes printed in 2c-g
  are consistency checks. Only drawings, micrographs, single traces and the indistinguishable series of
  Supplementary Fig. 4e-g are left unread.
