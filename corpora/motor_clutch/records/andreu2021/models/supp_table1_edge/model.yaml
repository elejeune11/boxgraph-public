id: supp_table1_edge
name: deformation, deformation rate, load and loading rate at the cell edge (Supplementary Table 1, notes i-ii)
role: model
stated: {page: 20, printed_page: "SI 8", quote: "Deformations were calculated at the cell edge from stretch applied", where: "Supplementary Table 1, notes (i) and (ii)"}
equation: >-
  deformation A = stretch x cell radius (note i); deformation rate |v| = 2Af (Methods item 2, p. 10);
  loading rate = stiffness x deformation rate (note ii); load = stiffness x deformation (the Load column
  carries note (ii), which states only the loading rate; q_supp1_load)
inputs:
  eps: {quantity: applied_stretch, unit: dimensionless}
  R:   {quantity: cell_radius, unit: um}
  f:   {quantity: stretch_frequency, unit: Hz}
  k:   {quantity: cell_stiffness, unit: nN/um}
outputs:
  A:    {quantity: stretch_amplitude, unit: um}
  v:    {quantity: deformation_speed, unit: um/s}
  F:    {quantity: cell_load, unit: nN}
  Fdot: {quantity: cell_loading_rate, unit: nN/s}
settings: {}
stochastic: false
from_words: true
built_from: [edge_speed]
