id: edge_speed
name: deformation speed at the cell edge under triangular stretch (|v| = 2Af, A = stretch x cell radius)
role: model
stated: {page: 10, printed_page: "10", quote: "Thus, |v| = 2Af, and its sign changed every half cycle", where: "Methods, item 2; p. 2 and p. 5 text; Supplementary Table 1 note (i)"}
equation: "|v| = 2Af, with A the displacement at the cell edge = applied stretch x cell radius (diameter/2)"
inputs:
  eps: {quantity: applied_stretch, unit: dimensionless}
  D:   {quantity: cell_diameter, unit: um}
  f:   {quantity: stretch_frequency, unit: Hz}
outputs:
  v:   {quantity: deformation_speed, unit: um/s}
settings: {}
stochastic: false
from_words: true
