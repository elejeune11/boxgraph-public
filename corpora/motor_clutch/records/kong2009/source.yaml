notes: >
  An experimental paper: AFM force-clamp lifetimes of single FNIII7-10/integrin a5b1 bonds, showing a
  slip-catch-slip (triphasic) dependence on force, with controls. It prints no equations, fits no
  bond-lifetime model and prints no model result, so the record has no reproduction comparisons
  (q_no_model_fits). Its quantitative content is the measured mean lifetime (+- SEM) versus clamped
  force, plotted in Figs. 3-6; all 14 measured series are read from the page by the record's code
  (figures/, with a shared helper figures/_lt.py that calibrates each axis from its ticks, including the
  broken y axes, finds open markers by matching their outline, and follows each SEM bar to its cap).
  The Fc/GG-7 control (grey squares) is drawn in eight panels and read once, from Fig. 3 A. The
  replotted series in Figs. 5 and 6 (triangles, which the captions say are Fig. 3 and Fig. 5 data) are
  read as the line joining their markers at 10-45 pN and compared with the originals read the same
  way: six consistency comparisons, the record's checks of the paper against itself. Two models the
  paper states in words are recorded and runnable but not run, since the paper applies them to no
  number (series bonds, p. 3; first-order dissociation behind Fig. S5, p. 8). A second figure pass
  (2026-11-01) read the measured plots the first left out, as data no model in the record predicts:
  adhesion frequencies with their SEM bars (Fig. 2 A-D, Figs. S2 B-D), the rupture-force histograms
  (Fig. S2 A), the stiffness of three lifetime bins (Fig. S3 C), running and repeated adhesion
  frequencies (Fig. S4), the circles of Fig. S5 that stand clear of their clusters (all at ln of a
  whole number, which checks the reading), and the five flow-cytometry lines of Fig. S1 where each is
  visible (figures/_bars.py, _s4.py, _s5.py, _s1.py; see figures.md). The bar labels of Fig. S3 C are
  compared with the bin lifetimes the text gives (the third differs: 13.4 against 10 s), and Fig. 2
  shows three specific adhesion frequencies above the 20% the text says was kept. Still left out: the
  example traces of Fig. S3 A, the overlapping event cloud of Fig. S3 B, and protocol numbers in the text (0.5 s contact,
  200 nm/s retraction, 3-12 pN/nm cantilevers, 846 lifetimes from 13 experiments in 12 bins of at
  least 50 for the Ca2+/Mg2+ FN-a5b1-Fc data; Fig. 3 A indeed shows 12 circles). Figs. 1 and the
  schematics (3 E-F, 4, 5 D, 6 D) are drawings. Reading choices are recorded as questions (broken-axis
  calibration, triangle centroid, hidden error bars, excluded overlap artefacts).
