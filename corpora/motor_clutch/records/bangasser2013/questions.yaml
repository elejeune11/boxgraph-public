    the model has no input for; the two gel stiffnesses are given as Young's moduli, not spring
    constants, and the soft-gel data (S3 Fig) hold speed and persistence only, so no measured quantity
    of the model is available at two stiffnesses. Running the model there would predict at most a
    trend the measurements do not quantify, on all-added inputs. For the other direction see
    bagchi2025/q_xval_bangasser2013_none.
