- id: q_second_pass_differences
  kind: unexplained_difference
  about: [cmp_fig2b_nc300_read, cmp_fig2c_nc300_read, cmp_fig3a_kon_x10, cmp_fig3a_nc_x10, cmp_fig3a_Fb_x10, cmp_fig3a_koff_x01, cmp_fig4a_s6, cmp_fig4b_s6, cmp_fig4c_s4, cmp_fig4d_s4, cmp_fig7c_fit_read, cmp_fig7c_kong, q_stall_transient]
  text: >-
    Of the 68 comparisons against calibrated readings, 45 reproduce, 10 are close and 13 do not.
    I re-checked each reading on its overlay; the readings sit on the curves. The differences fall
    into four groups.
    (1) Stalled curves at the softest stiffness: Fig. 2B-C nc = 300, Fig. 3A kon x10, nc x10 and
    Fb x10 at 0.01 pN/nm, and Fig. 4A-B nm = nc = 1600 at 0.1 pN/nm. Only the first point or two
    differ. The simulation, averaged over the whole run, still carries the loading transient: about
    10 nm/s instead of 0-1 nm/s, worse for the 100 s runs of q_fig4_short_runs. This is
    q_stall_transient again, not a reading error.
    (2) Fig. 3A koff x0.1 at 3 pN/nm (14 vs 0.3 nm/s) lies on a near-vertical jump. A shift of the
    jump by under 0.1 decade explains it.
    (3) Fig. 4C-D, kon = 3, koff = 1 /s: above about 5 pN/nm the simulation gives 72.5-73 nm/s
    and 39 pN, while the figure shows 75.6-76.7 nm/s and 36-37 pN. That is 3-4 nm/s and about
    3 pN outside the reading intervals; the base-set curves of the same panels reproduce.
    (4) Eq. 9 with the Table S1 parameters (koff = 0.004 /s, Fb = 8 pN, koff,c = 10 /s, Fc = 8 pN)
    peaks at 1/(2 sqrt(0.004 x 10)) = 2.50 s at 31 pN, while the plotted fit peaks at 2.30 s.
    Between 25 and 32 pN the plotted curve is about 8% lower than the printed parameters give,
    perhaps because they are rounded. Against Kong et al.'s points, Eq. 9 misses the three
    lowest-force points (1.26, 1.03 and 0.68 s at 4-9 pN, against 0.17-0.30 s): the catch-slip fit
    does not describe the low-force lifetimes. That is a fit_quality finding, consistent with the
    plotted curve.
  citation: {page: 8, printed_page: "588", quote: "A catch-slip bond model was fit to integrin catch bond data", where: "Figs. 2-4, 7C"}

