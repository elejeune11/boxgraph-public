# ==== CROSS-VALIDATION against bell1978 (2026-11-02): none added ====
- id: q_xval_bell1978_none
  kind: choice
  about: [catch_slip_eq9, motor_clutch_ssa, tau_kong_fig7c]
  text: >-
    No model of this record is validated against a measurement of bell1978, and no bell1978 model
    against a measurement here. This paper cites bell1978 (ref. 23) only for the slip off-rate law:
    "The first term in this equation is identical to the Bell model (23)" (p. 3). It does not say a
    model of either paper predicts a number the other measured. bell1978's measured values are a
    force of about 1 dyne needed to detach a cell (force_adhesive, from its ref. 52, printed with
    "~", so it would get no verdict) and the sugar concentrations of an inhibition experiment
    (c_sugar_low, c_sugar_high: inputs, not results); no model here outputs either. motor_clutch_ssa
    gives retrograde flow and traction of a filopodium on a substrate spring, not a cell's
    detachment force. In the other direction, the measurement here that a bell1978 model could give
    is Kong et al.'s integrin-fibronectin lifetimes against force (tau_kong_fig7c, Fig. 7C), which
    bell1978/lifetime_eq16 gives in kind (bond lifetime at a force per bond). But bell1978's tau0, E0
    and gamma are estimates for antibody-hapten bonds, not this bond, and neither paper states Bell
    parameters for integrin-FN. The only parameters for it are this record's koff_7c and Fb_7c, fitted
    to these same points as part of the catch-slip Eq. 9. Mapping them onto Eq. 16 needs tau0 and E0
    split from one rate (an added tau0, and a computed E0 that a record may not hold), and would be
    half of a fit already reported as cmp_fig7c_kong (fit_quality). The slip-only Eq. 16 also cannot
    give the catch branch at low force. The shared shape of catch_slip_eq9 and
    bell1978/detach_time_eq17 (a time from a force and rates) is a relation between models, left to
    the job that relates models across papers. See bell1978 q_xval_bangasser2013_none.
  citation: {page: 3, printed_page: "583", quote: "The first term in this equation is identical to the Bell model", where: text}

