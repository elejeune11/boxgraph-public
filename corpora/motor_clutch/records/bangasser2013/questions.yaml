  kind: reading
  about: [v_fig2c_nc50, F_fig2b_nc50, v_fig2c_nc100, F_fig2b_nc100, v_fig2c_nc5, v_fig2c_nc300, F_fig2b_nc300, ksopt_fig2_base, v_figS1a_present, kens_fig6b, tcycle_fig6d, tbinding_fig6d, F_fig7a, F_fig7a_minus_clutch, F_fig7a_minus_motor, tau_fig7c]
