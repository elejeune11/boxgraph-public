- id: q_sim_length
  kind: choice
  about: [motor_clutch_ssa, run_fig2_nc50, run_fig7a, run_fig7a_minus_clutch, run_fig7a_minus_motor, ref_t_fig2_nc50, ref_t_fig7a_minus_clutch]
  text: >-
    The paper does not print how long each simulation ran, whether an initial transient was
    discarded, or how many runs were averaged. The record simulates 1000 s per point (100 s for the
    2000-clutch runs of Fig. 7A, to keep each call short), averages over the whole run, and repeats
    each run with 5 seeds. The simulated time is refined (ref_t_fig2_nc50, ref_t_fig7a_minus_clutch).

- id: q_ssa_details
  kind: reading
  about: [motor_clutch_ssa]
  text: >-
    The SSA is given as eight steps in words (Supporting Material). Details taken from Chan and Odde
    2008 (ref. 15) or read from the steps: a newly bound clutch starts unstretched at the substrate
    position; the flow of step 5 uses the substrate deformation before the step-7 force balance and
    moves engaged clutches over the event time just elapsed; off-rates are held fixed between events
    (first-reaction method, Eq. 1). The force balance and force-velocity law are not written in this
    paper; they are Chan and Odde's Eqs. 3-5.
  citation: {page: 14, quote: "Advance engaged clutch positions by the product of the F-actin retrograde flow rate", where: "Supporting Material, step 6"}

- id: q_optimum_search
  kind: choice
  about: [optimal_stiffness, run_opt_base, run_opt_kon_x025, run_opt_kon_x05, run_opt_kon_x2, run_opt_kon_x4, run_S_kon, ref_grid_opt_base]
  text: >-
    The paper does not say how the optimal stiffness was located (grid of κsub, simulated time,
    smoothing). The record scans 0.001-100 pN/nm at 4 points per decade and fits a parabola in
    log κsub through the lowest point and its neighbours, for each seed; S uses the mean optimum
    over seeds. The grid density is refined (ref_grid_opt_base). Only S for kon is recomputed from
    simulations; the other printed S values are compared only with each other and with the text.

- id: q_cycle_definition
  kind: unstated_model
  about: [motor_clutch_ssa, run_fig6d, cmp_tcycle_fig6d]
  text: >-
    The load-and-fail cycle time of Fig. 6C-D is not defined beyond the substrate trajectories of
    Fig. 6C. The record counts one cycle each time the last engaged clutch lets go (the substrate
    returns to zero), and divides the simulated time by that count. On stiff substrates this counts
    frequent single-clutch releases as cycles.

- id: q_tbinding
  kind: unexplained_difference
  about: [binding_time_eq10, run_tbinding, cmp_tbinding_fig6d, tbinding_fig6d]
  text: >-
    Eq. 10 with the base set (nc = 50, kon = 0.3 /s) gives a binding time about twice the dashed
    'Binding Time' line of Fig. 6D, which lies near 7 s by eye (the line is close to the bottom of
    the plot, not near 15 s). The plotted line would follow from Eq. 10 with a larger kon or fewer
    clutches (Chan and Odde's kon = 1 /s with nc = 75 also gives a value near the plotted one), or the
    figure may use another definition. The crossing of this line with the cycle-time curve is the
    paper's explanation of the optimum, so which binding time was plotted matters for that claim.
  citation: {page: 8, printed_page: "588", quote: "can be calculated analytically", where: "Eq. 10 and Fig. 6D"}

- id: q_fig6b_axis_unit
  kind: possible_error
  about: [kens_fig6b]
  text: >-
    The right axis of Fig. 6B, which carries the ensemble clutch stiffness and the substrate spring
    constant, is labelled 'Spring constant (nm/s)'. A spring constant is a force per length; the
    record reads the axis in pN/nm, the unit of the bottom axis that the dashed substrate line
    reproduces one to one.
  citation: {page: 7, printed_page: "587", quote: "upper limit of stiffness sensing occurs when the", where: "Fig. 6B, right axis label"}

- id: q_text_motor_list
  kind: possible_error
  about: [S_nm_3b]
  text: >-
    The text lists the motor parameters as '(Fm, nc, vu)' (p. 4); nc is a clutch parameter (Table 1),
    and nm, the number of motors, is missing from the list. Probably nm was meant.
  citation: {page: 4, printed_page: "584", quote: "although increasing the values of motor parameters", where: text}

- id: q_log_base
  kind: reading
  about: [range_eq2, sr_eq4]
  text: >-
    Eqs. 2 and 4 write 'log' without a base. The record reads base 10, as the paper interprets R as
    'the maximum allowable order of magnitude change' and SR as an order-of-magnitude change, and
    because the printed R values follow from the Fig. S2 limits in base 10.

- id: q_lifetime_from_rate
  kind: unstated_model
  about: [catch_slip_eq9, run_fig7c_lifetime]
  text: >-
    Fig. 7C plots the catch-slip model as a bond lifetime against force, fitted to the lifetimes of
    Kong et al.; the paper does not write how a lifetime follows from Eq. 9. The record takes the
    mean lifetime under constant force as 1/koff*.

