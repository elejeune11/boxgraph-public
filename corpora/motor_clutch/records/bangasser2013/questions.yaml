# ==== cross-record validation with owen2017 (2026-11-22) ========================================
- id: q_xval_owen2017_others
  kind: choice
  about: [motor_clutch_ssa, catch_slip_eq9, ksub_owen_fibrin_added]
  text: >-
    (Cross-record validation.) motor_clutch_ssa is judged against owen2017's speed of actin relative to
    its adhesion (Table 1 row 5, 58 ± 3.1 nm/min, and the stated 0-3 nm/s elongation rate), with this
    paper's neuron-fitted base set and an added κsub for the fibrin gel. The choice of κsub is open:
    owen2017 measures no local stiffness. The primary is owen2017's continuum formula on the bulk gel
    (0.141 pN/nm); the alternatives run from 0.105 to 24 pN/nm (ksub_owen_fibrin_added). Over that whole
    span the base set's flow stays at about 73-108 nm/s, roughly 75-110 times the measured mean, so the
    verdict does not rest on the choice. Getting to about 1 nm/s would need a far stalled module (many
    more clutches than motors, owen2017's own reading on p. 10). Neither paper gives motor or clutch
    numbers for fibroblast adhesions, and tuning them to the measurement would be a fit made here, so
    it is not entered. Other owen2017 measurements are not used. The lab-frame α-actinin-1, paxillin,
    zyxin and fibrin speeds (Table 1, S1) need a moving substrate, which this model does not have (its
    anchor is fixed), and its flow is relative to that anchor. Paxillin-fibrin slippage (row 10) is
    adhesion sliding on the matrix, which this model has no element for. The speed difference
    |v_zyx| - |v_actn| (row 6) is a lower bound, not the relative speed. The fibrin displacement and
    strain profiles (Fig. 2D-H, S2) need a 3D continuum or network around the cell, not one spring.
    Rose plots, directional correlations and pair counts (Figs. 3G, 4, 5C, S11, S12, S14D) are
    directions, which the model lacks. Rheology (S10) and localization error (S9B) are not cell
    mechanics. catch_slip_eq9 has no counterpart: owen2017 measures no bond lifetime or off rate.
  citation: {none: "owen2017 cites this paper (p. 10) for the force balance; neither paper states that a model of this record predicts a measurement of owen2017"}
