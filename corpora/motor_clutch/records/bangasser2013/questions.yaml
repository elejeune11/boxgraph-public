- id: q_sr_rounding
  kind: unexplained_difference
  about: [cmp_SR_kon, cmp_SR_nc, cmp_SR_koff, cmp_SR_Fb_koff]
  text: >-
    Four printed SR values miss S x R of the printed S and R by one unit in the last digit (verdict
    'close'): kon, nc and koff in Fig. 3B, and Fb-koff in Fig. 5C. The printed S and R are rounded,
    so SR was presumably computed from unrounded values; with R recomputed from the Fig. S2 limits
    the Fb-koff product rounds to the printed 4.5. Not a sign of an error, but the printed tables
    are not exactly reproducible from each other.

- id: q_stall_transient
  kind: numerics
  about: [run_fig2_nc300, cmp_fig2c_nc300, cmp_fig2b_nc300]
  text: >-
    For the stalled system (nc = 300) on the softest substrate (0.01 pN/nm), the run starts from an
    unloaded substrate and needs a long time to load it to the motors' stall force; averaged over the
    1000 s run, the mean flow stays near 10 nm/s and the traction near 92 pN, while Fig. 2 shows
    about 1 nm/s and 100 pN. Whether the paper discarded an initial transient is not stated
    (q_sim_length); the stiffer points agree with the figure.

