- id: q_opposite_direction_convention
  kind: reading
  about: [S_Fm_nc_5a, S_nm_nc_5a, cup_Fm_nc, clo_Fm_nc, cup_nm_nc, clo_nm_nc]
  text: >-
    Below the diagonal (opposite directions, Eqs. 7-8) the paper does not say which parameter of a
    pair is multiplied by c and which is divided. Rows Fm and nm are otherwise nearly identical in
    Figs. 5A and S2, but in column nc they differ: Fm-nc has S = -1.6 with limits 2.7 / 0.67, while
    nm-nc has S = +1.6 with limits 1.5 / 0.37, i.e. the reciprocal limits and the opposite sign of S.
    This is what one gets if c multiplies nc in one cell and Fm (or nm) in the other, so the
    convention seems not to be the same in every cell. R and SR are unaffected in size, but the
    sign of S and SR below the diagonal cannot be interpreted without the convention.
  citation: {page: 3, printed_page: "583", quote: "base value of one parameter was multiplied by the constant c", where: "Eqs. 7-8; Fig. 5A and Fig. S2, row Fm and row nm, column nc"}

