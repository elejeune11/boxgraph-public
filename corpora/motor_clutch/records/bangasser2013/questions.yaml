    (elosegui2014/integrin_clutch_sim) adds integrin densities, competing integrin types, a catch bond
    and reinforcement, and its parameters are in an unreadable Supplementary Information. The gels are
    given by Young's modulus, with no spring-constant conversion stated for these cells. Every input
