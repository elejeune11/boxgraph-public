# model parameters (Table 1, Table S1, Fig. S1C)
- {id: n_motors, name: number of myosin motors in the motor-clutch module, dimension: dimensionless, description: "nm"}
- {id: motor_stall_force, name: stall force of a single myosin motor, dimension: "[force]", description: "Fm"}
- {id: unloaded_motor_velocity, name: unloaded velocity of the myosin motors, dimension: "[length]/[time]", description: "vu"}
- {id: n_clutches, name: number of molecular clutches in the module, dimension: dimensionless, description: "nc"}
- {id: clutch_on_rate, name: on-rate constant of clutch binding, dimension: "1/[time]", description: "kon"}
- {id: clutch_off_rate_unloaded, name: unloaded off-rate constant of a clutch (slip part), dimension: "1/[time]", description: "koff"}
- {id: bond_rupture_force, name: characteristic clutch bond rupture force (slip part), dimension: "[force]", description: "Fb"}
- {id: clutch_stiffness, name: spring constant of one molecular clutch, dimension: "[force]/[length]", description: "κc"}
- {id: substrate_stiffness, name: spring constant of the compliant substrate, dimension: "[force]/[length]", description: "κsub; the x axis of the model figures"}
- {id: catch_force, name: characteristic catch force of the catch-slip clutch bond, dimension: "[force]", description: "Fc in Eq. 9"}
- {id: catch_off_rate_unloaded, name: unloaded catch off-rate of the catch-slip clutch bond, dimension: "1/[time]", description: "koff,c in Eq. 9"}
- {id: clutch_force, name: tension on one clutch bond, dimension: "[force]", description: "Fi in Eq. 9; the x axis of Fig. 7C (left)"}
# model outputs
- {id: retrograde_flow_rate, name: time-averaged F-actin retrograde flow rate of the module, dimension: "[length]/[time]"}
- {id: mean_traction_force, name: time-averaged traction force on the substrate, dimension: "[force]"}
- {id: engaged_clutch_number, name: mean number of engaged clutches, dimension: dimensionless}
- {id: ensemble_clutch_stiffness, name: "ensemble clutch stiffness: clutch spring constant times the mean number of engaged clutches", dimension: "[force]/[length]", description: "defined on p. 7 (587); Fig. 6B"}
- {id: load_fail_cycle_time, name: mean time of one load-and-fail cycle of the substrate, dimension: "[time]", description: "Fig. 6C-D"}
- {id: ensemble_binding_time, name: expected time for all clutches to bind, dimension: "[time]", description: "tbinding, Eq. 10"}
- {id: optimal_substrate_stiffness, name: substrate stiffness at which retrograde flow is minimal and traction maximal, dimension: "[force]/[length]", description: "κs,opt"}
- {id: clutch_off_rate_loaded, name: off-rate of a clutch bond under tension, dimension: "1/[time]", description: "koff,i* in Eq. 9"}
- {id: bond_lifetime, name: mean lifetime of a clutch (integrin-ligand) bond under constant force, dimension: "[time]", description: "the y axis of Fig. 7C (left)"}
# sensitivity analysis (Eqs. 2-8, Figs. 3B, 5, S2)
- {id: parameter_multiplier, name: factor multiplying a parameter's base value, dimension: dimensionless, description: "c in Eqs. 5-8; the fold changes of Eq. 3; the limits of Fig. S2"}
- {id: parameter_range, name: "range value R: log of the ratio of the largest to the smallest allowed parameter value", dimension: dimensionless, description: "Eq. 2"}
- {id: optimum_sensitivity, name: "sensitivity value S: slope of log optimal stiffness against log parameter", dimension: dimensionless, description: "Eq. 3"}
- {id: sensitivity_range, name: "sensitivity-range value SR = S x R: order-of-magnitude change in the optimal stiffness", dimension: dimensionless, description: "Eq. 4"}

# ==== SECOND FIGURE PASS (2026-10-31): calibrated figure readings (figures.yaml) ==============
- {id: substrate_modulus, name: Young's modulus of the substrate, dimension: "[mass]/[length]/[time]**2", description: "the x axis of Fig. 1 and Fig. S1B"}
- {id: normalized_cell_migration, name: cell migration normalized to its maximum for the cell type, dimension: dimensionless, description: "Fig. 1A"}
- {id: normalized_cell_traction, name: cell traction force normalized to its maximum for the cell type, dimension: dimensionless, description: "Fig. 1B"}
- {id: clutch_length, name: extension of a molecular clutch, dimension: "[length]", description: "the x axis of Fig. 7B"}
- {id: clutch_length_frequency, name: normalized frequency of a clutch-length bin, dimension: dimensionless, description: "the y axis of Fig. 7B"}
