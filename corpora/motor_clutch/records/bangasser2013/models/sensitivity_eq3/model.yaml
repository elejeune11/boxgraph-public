id: sensitivity_eq3
name: sensitivity value S as the slope of log optimal stiffness against log parameter (Eq. 3)
role: processing
stated: {page: 3, printed_page: "583", quote: "A line was fit to the", where: "Eq. 3 and the text below it"}
equation: >-
  S = (Δκs,opt p0)/(κs,opt Δp) = d log(κs,opt)/d log(p); computed as the slope of a line fit to
  log κs,opt against log p at 0.25-, 0.5-, 1-, 2- and 4-fold changes of the base parameter
inputs:
  c1: {quantity: parameter_multiplier, unit: dimensionless}
  c2: {quantity: parameter_multiplier, unit: dimensionless}
  c3: {quantity: parameter_multiplier, unit: dimensionless}
  c4: {quantity: parameter_multiplier, unit: dimensionless}
  c5: {quantity: parameter_multiplier, unit: dimensionless}
  k1: {quantity: optimal_substrate_stiffness, unit: pN/nm}
  k2: {quantity: optimal_substrate_stiffness, unit: pN/nm}
  k3: {quantity: optimal_substrate_stiffness, unit: pN/nm}
  k4: {quantity: optimal_substrate_stiffness, unit: pN/nm}
  k5: {quantity: optimal_substrate_stiffness, unit: pN/nm}
outputs:
  S: {quantity: optimum_sensitivity, unit: dimensionless}
