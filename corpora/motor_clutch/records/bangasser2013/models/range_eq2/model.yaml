id: range_eq2
name: range value R of a parameter or multiplier (Eq. 2)
role: processing
stated: {page: 2, printed_page: "582", quote: "We define the range of a parameter p with the value R", where: "Eq. 2"}
equation: "R = log(pmax/pmin); for dual changes, computed for the multiplier c (p. 3)"
inputs:
  cmax: {quantity: parameter_multiplier, unit: dimensionless, description: "upper limit of c (Fig. S2A)"}
  cmin: {quantity: parameter_multiplier, unit: dimensionless, description: "lower limit of c (Fig. S2B)"}
outputs:
  R: {quantity: parameter_range, unit: dimensionless}
