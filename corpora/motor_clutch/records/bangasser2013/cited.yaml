# Values this paper takes from Chan and Odde 2008 (ref-15), linked to that record's data.
# Fig. S1C (PDF p. 20) lists the parameter set of "Chan and Odde, 2008" beside the present one;
# each row is a row of Chan's Table S1 (PDF p. 56). Chan prints Fm, vu and Fb negative (its
# retrograde-negative sign convention); Bangasser prints them positive. The links say which value
# it is; the build compares the printed numbers as they stand.
- {datum: nm_chan, from_datum: nm_S1, evidence: "Fig. S1C column 'Chan and Odde, 2008', number of motors nm = 75; Chan's Table S1 total number of myosin motors nm = 75"}
- {datum: Fm_chan, from_datum: Fm_S1, negated: true, evidence: "Fig. S1C column 'Chan and Odde, 2008', motor stall force Fm = 2 pN; Chan's Table S1 single myosin motor stall force, printed -2 pN in Chan's negative-retrograde sign convention"}
- {datum: vu_chan, from_datum: vu_S1, negated: true, evidence: "Fig. S1C column 'Chan and Odde, 2008', unloaded motor velocity vu = 120 nm/s; Chan's Table S1 unloaded myosin motor velocity, printed -120 nm/s in Chan's negative-retrograde sign convention"}
- {datum: nc_chan, from_datum: nc_S1, evidence: "Fig. S1C column 'Chan and Odde, 2008', number of clutches nc = 75; Chan's Table S1 total number of molecular clutches = 75"}
- {datum: Fb_chan, from_datum: Fb_S1, negated: true, evidence: "Fig. S1C column 'Chan and Odde, 2008', clutch bond rupture force Fb = 2 pN; Chan's Table S1 characteristic bond rupture force, printed -2 pN in Chan's negative-retrograde sign convention"}
- {datum: kon_chan, from_datum: kon_S1, evidence: "Fig. S1C column 'Chan and Odde, 2008', clutch on-rate kon = 1 1/s; Chan's Table S1 pseudo first-order on-rate = 1 1/s"}
- {datum: koff_chan, from_datum: koff_S1, evidence: "Fig. S1C column 'Chan and Odde, 2008', clutch unloaded off-rate koff = 0.1 1/s; Chan's Table S1 pseudo first-order unloaded off-rate = 0.1 1/s"}
- {datum: kc_chan, from_datum: kc_S1, evidence: "Fig. S1C column 'Chan and Odde, 2008', clutch spring constant kc = 5 pN/nm; Chan's Table S1 molecular clutch spring constant = 5 pN/nm"}
# Fig. S1B (PDF p. 20): "the embryonic chick forebrain neuron data from Chan and Odde" (p. 18), retrograde
# flow against substrate modulus; Chan's own plot of those measurements is Fig. 3D (Experiment markers).
- {datum: v_figS1b_measured, from_datum: v_fig3d_exp_sem, evidence: "both are the measured F-actin retrograde flow of embryonic chick forebrain neuron filopodia against PAG modulus from Chan and Odde 2008: Bangasser's Fig. S1B green squares labelled 'Chan and Odde, 2008', Chan's Fig. 3D Experiment markers with SEM bars"}
# Fig. 7C left (PDF p. 8): Bangasser's blue points are labelled "Fig. 3A, Kong, et al" (ref. 32), the integrin
# lifetimes Eq. 9 is fitted to. Kong's Fig. 3A catch-bond curve is the circles (FNIII7-10 / a5b1-Fc / GG-7, Ca2+/Mg2+,
# mean +- SEM); the squares in that panel are the Fc-GG-7 control, which falls monotonically and is not a catch bond.
- {datum: tau_kong_fig7c, from_datum: lt_FN_a5b1Fc_CaMg, evidence: "Bangasser's Fig. 7C legend labels the blue points 'Fig. 3A, Kong, et al'; Kong's Fig. 3A catch-bond curve (black circles, mean +- SEM lifetime of FNIII7-10 dissociating from captured a5b1-Fc in Ca2+/Mg2+) is the one with the biphasic rise to ~3 s near 30 pN that Bangasser's points show"}
