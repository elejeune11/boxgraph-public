# ---- the motor-clutch simulation, base parameters (Table 1), Fig. 2 --------------------------
# Simulated time per run is not printed: t_total = 1000 s is the reader's choice (q_sim_length).
- id: run_fig2_nc50
  model: motor_clutch_ssa
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base}
  sweep: {ksub: v_fig2c_nc50}
  outputs: {v_retro: v_fig2_nc50_pred, F_mean: F_fig2_nc50_pred}
  note: "added choice: 1000 s simulated per point, averages over the whole run"
- id: run_fig2_nc100
  model: motor_clutch_ssa
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_100, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base}
  sweep: {ksub: v_fig2c_nc100}
  outputs: {v_retro: v_fig2_nc100_pred, F_mean: F_fig2_nc100_pred}
- id: run_fig2_nc5
  model: motor_clutch_ssa
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_5, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base}
  sweep: {ksub: v_fig2c_nc5}
  outputs: {v_retro: v_fig2_nc5_pred}
- id: run_fig2_nc300
  model: motor_clutch_ssa
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_300, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base}
  sweep: {ksub: v_fig2c_nc300}
  outputs: {v_retro: v_fig2_nc300_pred, F_mean: F_fig2_nc300_pred}

# ---- Fig. 6B and 6D: ensemble clutch stiffness and cycle time, base parameters ----------------
- id: run_fig6b
  model: motor_clutch_ssa
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base}
  sweep: {ksub: kens_fig6b}
  outputs: {k_ens: kens_fig6b_pred}
- id: run_fig6d
  model: motor_clutch_ssa
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base}
  sweep: {ksub: tcycle_fig6d}
  outputs: {t_cycle: tcycle_fig6d_pred}
  note: "the paper does not define how a cycle is counted; here a cycle ends each time the last engaged clutch lets go (q_cycle_definition)"
- id: run_tbinding
  model: binding_time_eq10
  inputs: {nc: nc_base, kon: kon_base}
  outputs: {tbinding: tbinding_pred}

# ---- Fig. S1A: the new algorithm on the parameters of Chan and Odde 2008 --------------------
- id: run_figS1a
  model: motor_clutch_ssa
  inputs: {nm: nm_chan, Fm: Fm_chan, vu: vu_chan, nc: nc_chan, kon: kon_chan, koff: koff_chan, Fb: Fb_chan, kc: kc_chan}
  sweep: {ksub: v_figS1a_present}
  outputs: {v_retro: v_figS1a_pred}

# ---- Fig. 7A: Table S1 parameters; 100 s per run to keep each call short ---------------------
- id: run_fig7a
  model: motor_clutch_ssa
  inputs: {nm: nm_7a, Fm: Fm_7a, vu: vu_7a, nc: nc_7a, kon: kon_7a, koff: koff_7a, Fb: Fb_7a, kc: kc_7a}
  sweep: {ksub: F_fig7a}
  settings: {t_total: 100.0}
  outputs: {F_mean: F_fig7a_pred}
  note: "added choice: 100 s simulated per point (2000 clutches); the paper's traces in Fig. 7A span 40 s"
- id: run_fig7a_minus_clutch
  model: motor_clutch_ssa
  inputs: {nm: nm_7a, Fm: Fm_7a, vu: vu_7a, nc: nc_7a_minus_clutch, kon: kon_7a, koff: koff_7a, Fb: Fb_7a, kc: kc_7a, ksub: ksub_8}
  settings: {t_total: 100.0}
  outputs: {F_mean: F_fig7a_minus_clutch_pred}
  note: "added choice: 100 s simulated"
- id: run_fig7a_minus_motor
  model: motor_clutch_ssa
  inputs: {nm: nm_7a_minus_motor, Fm: Fm_7a, vu: vu_7a, nc: nc_7a, kon: kon_7a, koff: koff_7a, Fb: Fb_7a, kc: kc_7a, ksub: ksub_32}
  settings: {t_total: 100.0}
  outputs: {F_mean: F_fig7a_minus_motor_pred}
  note: "added choice: 100 s simulated"

# ---- Fig. 7C: the fitted catch-slip lifetime (Eq. 9, Table S1 column Fig. 7C) ----------------
- id: run_fig7c_lifetime
  model: catch_slip_eq9
  inputs: {koff: koff_7c, Fb: Fb_7c, koffc: koffc_7c, Fc: Fc_7c}
  sweep: {F: tau_fig7c}
  outputs: {tau: tau_fig7c_pred}

# ---- S for kon (Eq. 3): optimal stiffness at 0.25-, 0.5-, 1-, 2- and 4-fold kon --------------
- {id: run_kon_x025, model: scale_kon_eq5, inputs: {c: fold_025, kon0: kon_base}, outputs: {kon: kon_x025}}
- {id: run_kon_x05,  model: scale_kon_eq5, inputs: {c: fold_05,  kon0: kon_base}, outputs: {kon: kon_x05}}
- {id: run_kon_x2,   model: scale_kon_eq5, inputs: {c: fold_2,   kon0: kon_base}, outputs: {kon: kon_x2}}
- {id: run_kon_x4,   model: scale_kon_eq5, inputs: {c: fold_4,   kon0: kon_base}, outputs: {kon: kon_x4}}
- id: run_opt_kon_x025
  model: optimal_stiffness
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_x025, koff: koff_base, Fb: Fb_base, kc: kc_base}
  outputs: {ks_opt: ksopt_kon_x025, v_min: vmin_kon_x025}
  note: "added choices: grid 0.001-100 pN/nm at 4 points per decade, 1000 s per point (q_optimum_search)"
- id: run_opt_kon_x05
  model: optimal_stiffness
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_x05, koff: koff_base, Fb: Fb_base, kc: kc_base}
  outputs: {ks_opt: ksopt_kon_x05, v_min: vmin_kon_x05}
- id: run_opt_base
  model: optimal_stiffness
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base}
  outputs: {ks_opt: ksopt_base, v_min: vmin_base}
- id: run_opt_kon_x2
  model: optimal_stiffness
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_x2, koff: koff_base, Fb: Fb_base, kc: kc_base}
  outputs: {ks_opt: ksopt_kon_x2, v_min: vmin_kon_x2}
- id: run_opt_kon_x4
  model: optimal_stiffness
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_x4, koff: koff_base, Fb: Fb_base, kc: kc_base}
  outputs: {ks_opt: ksopt_kon_x4, v_min: vmin_kon_x4}
- id: run_S_kon
  model: sensitivity_eq3
  inputs: {c1: fold_025, c2: fold_05, c3: fold_1, c4: fold_2, c5: fold_4,
           k1: ksopt_kon_x025, k2: ksopt_kon_x05, k3: ksopt_base, k4: ksopt_kon_x2, k5: ksopt_kon_x4}
  outputs: {S: S_kon_pred}
  note: "uses the mean of the replicate optima at each fold change"

