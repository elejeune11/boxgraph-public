# ==== against chan2008's measured retrograde flow (2026-11-02) ================================
# The SSA motor-clutch model with this paper's base set (Table 1, Fig. S1C 'Present Study') gives a
# time-averaged F-actin flow at a substrate spring constant. chan2008 prints the mean flow measured in
# embryonic chick forebrain neuron filopodia on two gels (Fig. 3C). The base set was fitted to Chan and
# Odde's neuron flow data (Fig. S1 legend), so each entry is fit_quality, not an independent test.
# chan2008's six-point Fig. 3D curve and its Fig. S8C bars are not entered: see q_xval_chan2008_curves.
- id: val_flow_chan_260Pa
  model: motor_clutch_ssa
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, ksub: ksub_chan_260Pa_added}
  output: v_retro
  against: chan2008/v_fig3c_260
  purpose: fit_quality
  quantities: {chan2008/retrograde_flow_rate: retrograde_flow_rate}
  conditions_ok: >-
    chan2008 states the gel by its Young's modulus (260 Pa); the model takes a spring constant, entered
    as ksub_chan_260Pa_added (an added conversion, 1 pN/nm per kPa as this paper's Fig. S1B plots it;
    chan2008's own Eq. 13 with its fitted Δ is the alternative). The measured mean is over many
    filopodia, the model's over one long simulated run.
  basis: >-
    The SSA "produces simulated model behavior consistent with our previous published data (Fig. S1B
    and C)" (p. 14), and the base set was obtained when "the model was fit to the embryonic chick
    forebrain neuron data from Chan and Odde" (Fig. S1 legend, p. 18): nm, nc, kon and κc were altered,
    koff kept. These are the flow measurements of chan2008 (Fig. 3C/3D, the same 260 Pa gel), so the
    comparison reports the fit, not a test.
- id: val_flow_chan_57kPa
  model: motor_clutch_ssa
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, ksub: ksub_chan_57kPa_added}
  output: v_retro
  against: chan2008/v_fig3c_57k
  purpose: fit_quality
  quantities: {chan2008/retrograde_flow_rate: retrograde_flow_rate}
  conditions_ok: >-
    chan2008 states the gel by its Young's modulus (57 kPa); the model takes a spring constant, entered
    as ksub_chan_57kPa_added (1 pN/nm per kPa, as Fig. S1B plots it). All alternatives lie far on the
    stiff side of the base set's optimum, where the flow is near its plateau.
  basis: >-
    As val_flow_chan_260Pa, on the stiff gel: the base set was "fit to the embryonic chick forebrain
    neuron data from Chan and Odde" (Fig. S1 legend, p. 18), whose 57 kPa point is this measurement.

# ==== against kong2009's measured integrin-fibronectin lifetimes (2026-11-02) ===================
# Eq. 9 with the Table S1 column Fig. 7C parameters gives a mean bond lifetime (1/koff*) at a clutch
# force. Kong et al. measured mean lifetimes of FNIII7-10/a5b1-Fc/GG-7 at clamped forces in Ca2+/Mg2+
# (their Fig. 3 A circles), the points this paper redraws in Fig. 7C ("Fig. 3A, Kong et al") and to
# which the four Eq. 9 parameters were fitted: a fit, not a test. Kong's other curves are not entered:
# see q_xval_kong2009_other_curves.
- id: val_lifetime_kong_fig3a
  model: catch_slip_eq9
  inputs: {koff: koff_7c, Fb: Fb_7c, koffc: koffc_7c, Fc: Fc_7c}
  sweep: {F: kong2009/lt_FN_a5b1Fc_CaMg}
  output: tau
  against: kong2009/lt_FN_a5b1Fc_CaMg
  purpose: fit_quality
  quantities: {kong2009/force_clamp: clutch_force, kong2009/bond_lifetime_mean: bond_lifetime}
  conditions_ok: >-
    Kong et al. measured the lifetime of a serial chain (FNIII7-10 / a5b1-Fc / GG-7 Fab) in Ca2+/Mg2+
    at a force clamped on that one complex; Eq. 9 is a single clutch bond's lifetime at its tension.
    This paper itself fits Eq. 9 to these lifetimes as the integrin catch bond, without separating the
    Fc/GG-7 link (whose lifetime Kong et al. measured as the grey squares), so the comparison is the
    paper's own, on the measurement's own forces.
  basis: >-
    "The catch-slip off-rate model was fit to integrin catch bond data from Kong, et al. (32) (Fig. 7 C)"
    (p. 9); the Fig. 7C legend labels the points "Fig. 3A, Kong et al". koff, Fb, koff,c and Fc of the
    Table S1 Fig. 7C column are those fitted values, so this reports the fit's quality against Kong's
    own reading of the points (the record's cmp_fig7c_kong does the same against this paper's redrawn
    copy).

# ==== against liu2025's integrin-fibronectin off-rates (Fig. S4), 2026-11-21 ====================
# Eq. 9 with the Table S1 Fig. 7C parameters (fitted to Kong et al.'s a5b1 lifetimes) gives the off-rate
# of an integrin-fibronectin clutch bond at a force. liu2025 Fig. S4 plots off-rates of the FN-integrin
# bond against force, digitized from elosegui2016 (its SI ref. [10]); none of them entered the Eq. 9 fit,
# so this is a test. The integrins differ: see q_xval_liu2025_integrin.
- id: val_koff_liu_figS4
  model: catch_slip_eq9
  inputs: {koff: koff_7c, Fb: Fb_7c, koffc: koffc_7c, Fc: Fc_7c}
  sweep: {F: 'liu2025/koff_data_figS4'}
  output: koff_star
  against: 'liu2025/koff_data_figS4'
  purpose: validation
  quantities: {'liu2025/clutch_tension': clutch_force, 'liu2025/bond_off_rate': clutch_off_rate_loaded}
  conditions_ok: >-
    Both are the dissociation rate of an integrin-fibronectin bond held at a constant force, the role
    each paper gives its catch-bond law (Eq. 9 here; Eq. 4 in liu2025). The bonds are not the same
    integrin: Eq. 9's parameters were fitted to Kong et al.'s a5b1-FNIII7-10 lifetimes in Ca2+/Mg2+,
    while the Fig. S4 points are elosegui2016's Fig. 3a measurements, which that paper's caption calls
    FN-avb3 bonds. Each paper uses its curve as the generic integrin clutch bond of its model, so the
    test asks whether the clutch off-rate law of one carries to the other's clutch bond data; a miss
    may be the integrin, not the law (q_xval_liu2025_integrin).
  basis: >-
    Eq. 9 is this paper's off-rate of a clutch bond under tension, "fit to integrin catch bond data from
    Kong, et al." (p. 9); liu2025 Fig. S4 (p. 52) is "Integrin dissociation rate from fibronectin as a
    function of the applied mechanical load", the quantity this model's output names, at forces inside
    the range Eq. 9 was fitted over. liu2025 does not say that this model predicts its data: it cites
    this paper (its ref. 11) only for clutch stiffness values (p. 2).

# ==== against owen2017's measured actin speed relative to adhesions, 3D fibrin (2026-11-22) =====
# The SSA motor-clutch model with this paper's base set (Table 1; fitted to chick forebrain neuron
# filopodia on 2D gels) gives the time-averaged F-actin flow of a module relative to its substrate
# anchor at a substrate spring constant. owen2017 measures the speed of α-actinin-1 relative to the
# zyxin plaque it flows out of, in fibroblasts in 3D fibrin (Table 1 row 5), and states an observed
# stress-fibre elongation rate of 0-3 nm/s. Nothing of owen2017 entered the base set, so these are tests
# of a 2D-calibrated model in 3D; κsub is added (ksub_owen_fibrin_added). Other owen2017 measurements are
# not entered: see q_xval_owen2017_others.
- id: val_relspeed_owen_table1
  model: motor_clutch_ssa
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, ksub: ksub_owen_fibrin_added}
  output: v_retro
  against: owen2017/t1_diff_velocity
  purpose: validation
  quantities: {owen2017/actin_adhesion_relative_speed: retrograde_flow_rate}
  conditions_ok: >-
    The model's v_retro is the time average of the actin flow relative to the clutches' substrate
    anchor over 1000 s, many load-and-fail cycles; owen2017's value is the mean magnitude of the actin
    velocity relative to its adhesion (|v_zyx - v_actn|) from positions 10 ± 1 min apart, which over that
    lag is the same slippage of actin past the adhesion. The measured speeds are unsigned and both
    directions occur (owen2017 q_no_continuous_rearward_flow); the model's flow is rearward only, so it
    is compared as a speed. The cells (human foreskin fibroblasts in 3D fibrin vs. neuron filopodia on
    polyacrylamide), the motor and clutch numbers and the substrate spring all differ from the base set's
    fitting conditions; κsub is the added continuum estimate for the fibrin gel, with network-node
    alternatives. This asks whether the 2D-calibrated model carries to the 3D measurement as it stands.
  basis: >-
    owen2017 explains its slow actin motion with this model's mechanism: actin velocity is "determined
    by the balance of cytoskeletally generated force and drag on actin generated by mechanical linkages
    to cellular adhesions (Bangasser et al., 2013 ...)" and "Low velocities, such as we observe, may
    reflect a situation in which a relatively large number of mechanical clutches ... overwhelm the
    contractile forces generated by myosin" (owen2017 p. 10). The motor-clutch model's output is that
    velocity of actin past the adhesion, owen2017's measured quantity (owen2017 eqn. 13 gives the same v).
- id: val_relspeed_owen_range
  model: motor_clutch_ssa
  inputs: {nm: nm_base, Fm: Fm_base, vu: vu_base, nc: nc_base, kon: kon_base, koff: koff_base, Fb: Fb_base, kc: kc_base, ksub: ksub_owen_fibrin_added}
  output: v_retro
  against: owen2017/v_elongation_observed
  purpose: validation
  quantities: {owen2017/actin_adhesion_relative_speed: retrograde_flow_rate}
  conditions_ok: >-
    As val_relspeed_owen_table1. The measurement is a range, "0-3 nm s-1", for owen2017's study and
    previous work (Endlich et al. 2007), not a summary statistic; the model's single mean flow is judged
    against it as an interval.
  basis: >-
    owen2017 judges its own clutch model (eqn. 13) against this range ("in good agreement with the
    observed rate of stress fiber elongation (0-3 nm s-1) in our study", Supp. p. 6) and cites this
    paper for the force balance that sets the velocity (p. 10); this model gives the same velocity of
    actin relative to the adhesion.
