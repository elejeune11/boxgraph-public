- id: q_dfn_not_runnable
  kind: unstated_model
  about: [dfn_network]
  text: >-
    The discrete fibre network simulations (Fig. 3, Fig. S1) cannot be rerun: the network size, fibre length,
    cross-linking distance, pore size, the strain-energy thresholds of the cross-links of each network in
    Fig. 3B, the load steps and the solver are not given, and no code is released (the method is referred to
    refs. 14 and 15). Only the fibre modulus, Poisson's ratio and radius are printed. Fig. 3B therefore cannot
    be checked against its model.
  citation: {page: 2, printed_page: "E4550", quote: "Following our earlier work on active biopolymer networks", where: "Materials and Methods"}
- id: q_coarse_not_runnable
  kind: unstated_model
  about: [coarse_grained_fa_ecm]
  text: >-
    The effective modulus E*FA(E_ECM, rFA, n) of Eq. 2 comes from an axisymmetric finite element model in
    COMSOL 5.1. The governing equations and boundary conditions are given (SI p. 8-9), but not the constitutive
    setting of the plaque and ECM (plane stress or 3D, ECM thickness, Poisson's ratios), sigma_c and the unit
    of n in Eq. 1, nor how the self-consistent loop between Eq. 1, Eq. 2 and Eq. S2 is iterated. Fig. 4A, 4C,
    Fig. S4 and Fig. 5 cannot be recomputed from the paper; the record instead checks the step from the
    printed E*FA curves (Fig. 4A) to the stable sizes (Fig. 5A) with stable_size_chain.
  citation: {page: 2, printed_page: "E4550", quote: "in the finite element method package (COMSOL", where: "text above Eq. 2"}
- id: q_alpha_beta_unit
  kind: possible_error
  about: [alpha_printed, beta_printed, alpha_per_Pa, beta_per_Pa]
  text: >-
    Table S1 gives alpha and beta in Pa (~1.91 x 10^-3 Pa, ~2.77 x 10^-3 Pa). In Eq. S1, rho = beta rho0/(beta -
    alpha) + (alpha K - 1)/(beta - alpha) eps, the term alpha K - 1 is dimensionless only if alpha is an inverse
    stress. The record reads the printed numbers as per Pa (added alpha_per_Pa, beta_per_Pa); with K = 1 kPa this
    gives K beta - 1 = 1.77 > 0 and a positive, increasing sigma(Keff). Read per kPa instead, K beta - 1 < 0 and
    Eq. S2 gives a negative stress.
  citation: {page: 12, quote: "Chemo-mechanical coupling ∼2.77 × 10−3 Pa Shenoy et al", where: "Table S1"}
- id: q_En_range
  kind: unstated_input
  about: [En_range, En_mid, run_rst_E75, run_rst_E125, run_Efa_required]
  text: >-
    The nucleus modulus is given only as ~5-10 kPa, and the value used for Figs. 4-5 is not stated. The stable
    size is very sensitive to it: with Table S1's other values sigma* = Delta mu_0/Delta r = 1 kPa, and Eq. S2
    needs Keff of about 3.4 kPa to reach it, i.e. E*FA of about 10.4 kPa for En = 5 kPa (above the whole Fig. 4A
    7.5 kPa curve, so no stable FA) but about 5.1 kPa for En = 10 kPa (stable size near 10 um). The record
    takes 7.5 kPa (E*FA of about 6.1 kPa) and runs the two ends as alternatives.
- id: q_eq1_sigma_c_n
  kind: unstated_input
  about: [fiber_recruitment_eq1, coarse_grained_fa_ecm]
  text: >-
    Eq. 1 needs the threshold stress sigma_c, which is never given a value, and n(sigma - sigma_c) inside erf is
    dimensionless only if n carries an inverse-stress unit, but n is printed as a pure number (n = 0, 2, 4, 8)
    with no unit. The figures' values of n cannot be turned into a recruitment curve without both.
  citation: {page: 2, printed_page: "E4550", quote: "initial fiber density, σ c corresponds to the threshold stress for", where: "text below Eq. 1"}
- id: q_eq1_ecm_dependence
  kind: unstated_model
  about: [fiber_recruitment_eq1]
  text: >-
    As printed, Eq. 1 makes the fibre density depend on the contractile stress alone, and by Eq. S2 the stress
    rises with the effective modulus, which rises with E_ECM (Fig. 4A). Yet Fig. S4 shows the ligand density
    falling from 6 to 1 as E_ECM rises from 0 to 20 kPa, and the text says cross-links rupture more easily in a
    softer ECM. How E_ECM enters fibre recruitment (through sigma_c, n, or the deformation of the network) is
    not stated, so Fig. S4 cannot be obtained from Eq. 1 and Eq. S2 as printed.
  citation: {page: 5, printed_page: "E4553", quote: "cross-links are ruptured more easily in a softer ECM due to", where: text}
- id: q_eq1_fit_fig3b
  kind: unstated_input
  about: [fiber_recruitment_eq1]
  text: >-
    The text says the DFN densities of Fig. 3B "can be well fitted" by Eq. 1, but gives no fitted n or sigma_c.
    Fig. 3B plots against contraction per perimeter (uN/um), not the stress of Eq. 1, and its densities reach
    only about 1.3, while Eq. 1 with its printed factor 5 saturates at 6 (as Fig. S4 does). The fit can be
    checked only once Fig. 3B is digitized, and only if the fit is far from saturation.
  citation: {page: 3, printed_page: "E4551", quote: "force can be well fitted by the phenomenological relationship", where: "Results, Fig. 3B"}
- id: q_fig5_three_indices
  kind: possible_error
  about: [rst_fig5a_n0_E75_eye]
  text: >-
    The Fig. 5A legend says the stable size is plotted "at three different fiber recruitment indices", but the
    panel shows four curves, n = 0, 2, 4 and 8.
  citation: {page: 5, printed_page: "E4553", quote: "plotted as a function of the ECM modulus at three different fiber recruitment", where: "Fig. 5 legend"}
- id: q_fig5_red_curve
  kind: reading
  about: [rst_fig5a_n0_E75_eye]
  text: >-
    The text refers to "the cases without fiber recruitment (solid red curve in Fig. 5A)", but in the panel's
    legend red is n = 8 and the no-recruitment curve (n = 0) is blue; later the text calls the red and magenta
    curves the nonmonotonic ones, which fits the legend. The record follows the legend.
  citation: {page: 5, printed_page: "E4553", quote: "compared with the cases without fiber recruitment (solid red curve", where: text}
- id: q_n4_validated
  kind: overstated_claim
  about: [nfa_model_fib_soft, nfa_exp_fib_soft]
  text: >-
    The text says the weaker nonmonotonicity at n = 4 (Fig. 5A) "has been validated by our experiments (16)".
    The experiments compare two fibrous networks and two hydrogels (Fig. 5D, Fig. S7); they do not measure n or
    the size against modulus at several n, so they can at most be consistent with it.
  citation: {page: 5, printed_page: "E4553", quote: "which has been validated by our experiments", where: text}
- id: q_s7_inputs
  kind: unstated_input
  about: [nfa_model_gel_soft, nfa_model_gel_stiff, nfa_model_fib_soft, cmp_s7_gel_soft, cmp_s7_gel_stiff, cmp_s7_fib_soft]
  text: >-
    For Fig. S7 the moduli and ligand densities given to the model are not stated: the two fibrous ECMs are
    chosen so that "the variations of ligand density are comparable to experimental measurements", i.e. the
    soft/stiff ligand density ratio is taken from baker2015's data, and the two hydrogels have equal ligand
    density but unstated moduli. The model's fibrous-soft bar is therefore partly set by the data it is
    compared with; only the ordering and the hydrogel bars are predictions. The model's FA band size is a
    width while the measurement (Fig. 5D) is an area per adhesion; the paper assumes they are proportional.
    Both series are normalized by their stiff fibrous ECM value, so that bar is 1 in both by construction.
  citation: {page: 9, quote: "and ligand density. We chose two fibrous ECMs", where: "SI, Quantitative Comparison"}
- id: q_fig4a_fig4c
  kind: reading
  about: [cmp_fig4a_fig4c, Efa_fig4a_E75_eye_at4c, Efa_fig4c_n0_eye]
  text: >-
    Fig. 4A's 7.5 kPa curve and Fig. 4C's n = 0 curve are both the no-recruitment E*FA at E_ECM = 7.5 kPa,
    but read by eye their peaks differ (about 8.4 against 7.6 kPa) and so do their tails. A calibrated reading
