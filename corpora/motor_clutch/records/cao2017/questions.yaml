- id: q_eye_reads
  kind: reading
  about: [Efa_fig4a_E75_eye, Efa_fig4a_E125_eye, rst_fig5a_n0_E75_eye, rst_fig5a_n0_E125_eye, nfa_exp_gel_soft, fa_area_gel_soft]
  text: >-
    The figure values in this record (Figs. 4A, 4C, 5A, 5D, S7) were read by eye from the page images and get
