  about: [keff_1d, shear_lag_length, contractility_s2, sigma_max_s2, steady_stress_eq4, stable_size_vs_modulus, stable_size_chain, coarse_grained_fa_ecm, fiber_recruitment_eq1, dfn_network]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    chan2008. This paper cites it (ref. 9) only for a timescale, "a few seconds (9, 20)" for integrin
    binding (p. 2; again "within seconds (9, 20)", pp. 2 and 8), to justify quasi-static linear
