# ---- cross-record validation with owen2017 (2026-11-22): none added ----
- id: q_xval_owen2017_none
  kind: unstated_model
  about: [coarse_grained_fa_ecm, contractility_s2, sigma_max_s2, steady_stress_eq4, required_efa, stable_size_vs_modulus, stable_size_chain, fiber_recruitment_eq1, keff_1d, shear_lag_length, normalize_fa_size, normalize_by_reference, dfn_network, 'owen2017/modulus_from_stiffness']
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of owen2017, and
