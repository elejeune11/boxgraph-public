    filopodium) would need an adhesion area and a filopodium geometry neither paper states. For the
    other direction see chan2008/q_xval_cao2017_none.
  citation: {page: 2, printed_page: "E4550", quote: "because the timescale for integrin binding dynamics [i.e., a few seconds (9,", where: text}
