- id: q_eq3_misreference
  kind: possible_error
  about: [contractility_s2]
  text: >-
    The text says "a stiff FA-ECM complex induces a higher level of cell contractility (Eq. 3)", but Eq. 3 is
    the free energy of adding a plaque segment; the stiffness dependence of contractility is Eq. S2 (SI p. 8).
    The reference appears to point to the wrong equation.
  citation: {page: 4, printed_page: "E4552", quote: "complex induces a higher level of cell contractility", where: text}
- id: q_keff_1d_unrun
  kind: unstated_input
  about: [keff_1d, L_figS5F, Lc_low_density]
  text: >-
    The printed 1D keff (keff_1d) is entered but not run: kp, ks and kc are not given. Two printed facts
    constrain them: Lc = 0.436 um at 1 per um fixes (1/kc)/(1/ks + 1/kp), and Fig. S5F (keff/kp against
    ligand density for L = 0.1 um) depends then on ks/kp alone. Once Fig. S5F is digitized, its peak position
    and height give two numbers for one unknown ratio, so whether Fig. S5F follows from the printed formulas
    with the printed Lc can be tested. Fig. S5E (Lc against density) can be swept through shear_lag_length.
    For small L/Lc the printed keff tends to kc phi_i L (all integrins in parallel), as the text describes.
  citation: {page: 9, quote: "effective stiffness, keff , of a FA whose size is 0.1 μm varies with", where: "SI text"}
- id: q_1d_stiffnesses
  kind: unstated_input
  about: [shear_lag_length]
  text: >-
    The 1D model's keff and Lc use the plaque, integrin and ECM stiffnesses kp, kc, ks, which are not given
    (the model is from ref. 24). Only the ratio of the two printed Lc values can be checked (Lc scales as
    1/phi_i in the printed formula); Fig. S5F (keff/kp against ligand density for L = 0.1 um) cannot be
    recomputed without the stiffness ratios.
  citation: {page: 9, quote: "and kp, kc, and ks are the stiffnesses of the plaque, integrin", where: "SI text"}
# ---- from the calibrated figure readings (figures.md) ----
- id: q_fig4a_fig4c_calibrated
  kind: reading
  about: [cmp_fig4a_fig4c_calibrated, q_fig4a_fig4c, Efa_fig4a_E75, Efa_fig4c_n0]
  text: >-
    Read with calibrated code at the same 24 FA sizes, the Fig. 4A curve for 7.5 kPa and the Fig. 4C curve for
    n = 0 agree within the reading intervals everywhere (cmp_fig4a_fig4c_calibrated). The difference the eye
    readings showed (q_fig4a_fig4c) came from reading by eye: both peaks are near 7.8-7.9 kPa, not 8.4 and 7.6.
- id: q_rst_calibrated_En
  kind: unexplained_difference
  about: [cmp_rst_fig5a_calibrated, run_rst_fig4a_calibrated, En_mid, En_range, rst_fig5a_n0_at4a]
  text: >-
    From the calibrated Fig. 4A curves, Eq. S2 and the zero-growth condition of Eq. 4, the stable sizes at
    7.5 and 12.5 kPa without recruitment come out below the calibrated Fig. 5A values when the nucleus modulus
    is the middle of Table S1's range (7.5 kPa): not reproduced at both moduli. The result rises with En, and
    trying values across the printed range, a nucleus modulus near its upper part (about 9 kPa) brings both close
    to Fig. 5A, while 5 kPa gives no stable FA at all. So Fig. 5A is consistent with the printed chain only for an
    unstated En near the top of the 5-10 kPa range (with alpha and beta read per Pa); the paper does not say
    which value it used.
- id: q_figS7_hydrogel_stiff
  kind: unexplained_difference
  about: [cmp_figS7_model_vs_exp, nfa_model_figS7, nfa_exp_figS7]
  text: >-
    In the calibrated Fig. S7 readings, the model's bars for hydrogel soft and fibrous soft lie inside the
    experimental error bars, but the model's bar for the stiff hydrogel is 1, equal to the stiff fibrous ECM, while
    the measured stiff hydrogel bar lies above 1 with its error bar entirely above 1 (verdict close). The text
    calls the comparison consistent; the hydrogel moduli given to the model are not stated (q_s7_inputs), so it
    cannot be told whether another choice would raise the model's bar.
  citation: {page: 12, quote: "Quantitative comparison between experimental results (16) and model predictions", where: "Fig. S7"}
# ---- cross-paper validation against baker2015 (ref. 16) ----
- id: q_no_validation_baker2015
  kind: unstated_model
  about: [coarse_grained_fa_ecm, stable_size_vs_modulus, stable_size_chain, normalize_by_reference, nfa_model_figS7, q_s7_inputs, q_coarse_not_runnable]
  text: >-
    No cross-paper validation against baker2015's measurements could be entered. The model that cao2017 says
    predicts baker2015's average FA sizes (Fig. 5f there; Fig. 5D and Fig. S7 here) is the COMSOL coarse-grained
    FA-ECM model, which cannot be run (q_coarse_not_runnable); its predicted bars exist only as the figure reading
    nfa_model_figS7, already compared with the re-plotted data in cmp_figS7_model_vs_exp. The runnable parts do not
    give baker2015's quantity on baker2015's conditions: stable_size_vs_modulus / stable_size_chain give a stable FA
    band width (um) without recruitment, and only on the printed E*FA curves of 2.5, 7.5 and 12.5 kPa, whereas
    baker2015 measures an average area per adhesion (um^2) on hydrogels of 290 Pa and 19.1 kPa and on fibre
    networks of 2.8 and 55 kPa (network modulus, not the ECM modulus of the continuum model); the paper takes width
    and area as proportional with no constant. normalize_by_reference is processing, not a prediction. The fibrous
    inputs of Fig. S7 were also chosen so that their ligand-density contrast matches baker2015's measurements, so a
    rerun on them would be partly a fit (fit_quality), not a test. baker2015's fibre recruitment (Fig. 5k) is not
    predicted by any runnable model either (dfn_network, q_dfn_not_runnable; Eq. 1 needs sigma_c and the unit of n,
    q_eq1_sigma_c_n).
  citation: {page: 9, quote: "whose moduli are different, and the variations of ligand density", where: "SI, Quantitative Comparison"}
# ---- cross-record validation with bangasser2013 (2026-11-21): none added ----
- id: q_xval_bangasser2013_none
  kind: unstated_model
  about: [contractility_s2, sigma_max_s2, steady_stress_eq4, stable_size_vs_modulus, stable_size_chain, keff_1d, shear_lag_length, fiber_recruitment_eq1]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    bangasser2013. This paper does not cite it and nowhere says its model explains a measurement there.
    bangasser2013's measurements are: normalized cell migration and normalized cell traction against
    substrate Young's modulus for other papers' cell types (Fig. 1A-B), Chan and Odde's neuron
    retrograde flows (Fig. S1B) and Kong et al.'s integrin-fibronectin bond lifetimes (Fig. 7C). The
    runnable models here give an FA-ECM effective modulus, a contractile stress in kPa (Eq. S2, its
    Keff limit, Eq. 4), a stable FA band width, a shear-lag length and fibre recruitment: no migration,
    no flow and no bond lifetime. The contractile stress is the closest, but bangasser2013's traction
    is a force per cell normalized to its maximum for each cell type, and Eq. S2 rises monotonically
    with Keff toward sigma_max, so normalizing it would only compare the shape of a monotonic curve
    with the measured ones (which bangasser2013 plots as biphasic for some cell types), a trend; its inputs (K, rho0, alpha, beta, the
    nucleus modulus and E*FA on those gels) would all be added for cells neither paper studies. For the
    other direction see bangasser2013/q_xval_cao2017_none.
  citation: {none: "neither paper states that a model of this record predicts a measurement of bangasser2013"}
# ---- cross-record validation with bell1978 (2026-11-21): none added ----
- id: q_xval_bell1978_none
  kind: unstated_model
  about: [contractility_s2, sigma_max_s2, steady_stress_eq4, stable_size_vs_modulus, stable_size_chain, coarse_grained_fa_ecm, fiber_recruitment_eq1, keff_1d, shear_lag_length]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    bell1978. This paper cites it (ref. 30) only in its Discussion, for strain speeding the
    dissociation of weak cross-links and for interfibre bonds "that follow a Bell-like breaking
    behavior" (p. 6); no Bell-type bond rate or lifetime enters any model here, and the paper does not
    say its model predicts a value of Bell's. bell1978's measured data are three values taken from
    other works: a total force of about 1 dyne needed to detach an adherent cell (force_adhesive,
    printed "~ 1", from its ref. 52), and the inhibiting sugar concentrations 0.001 and 0.01 M
    (c_sugar_low, c_sugar_high, from its ref. 49), which are conditions, not outputs of any model.
    The models here give an FA-ECM effective modulus, a contractile stress in kPa, a stable FA band
    width, a shear-lag length, a fibre density ratio and normalized FA sizes: none gives a
    detachment force of a whole cell, and turning a contractile stress into one would need an
    adhesion area and a detachment criterion that neither paper states. A stress per area times an
    area (the shape shared with bell1978/laplace_pressure, a pressure from a tension and a length) is
    a shared form, left to the job that relates models across papers, not a shared measured
    quantity; and "~ 1" is approximate, which gets no verdict. For the other direction see
    bell1978/q_xval_cao2017_none.
  citation: {page: 6, printed_page: "E4554", quote: "with interfiber bonds that follow a Bell-like breaking behavior", where: text}
# ---- cross-record validation with chan2008 (2026-11-21): none added ----
