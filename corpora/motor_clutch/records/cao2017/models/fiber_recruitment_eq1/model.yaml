id: fiber_recruitment_eq1
name: fibre density under the cell against contractile stress (Eq. 1)
role: model
stated: {page: 2, printed_page: "E4550", quote: "is phenomenologically related to the contractile stress", where: "Eq. 1"}
equation: "phi_f/phi_0 = 1 for sigma < sigma_c; 1 + 5*erf[n(sigma - sigma_c)] for sigma >= sigma_c"
inputs:
  sigma: {quantity: contractile_stress, unit: kPa}
  sigma_c: {quantity: contractile_stress, unit: kPa, description: threshold stress for fibre recruitment (not given a value)}
  n: {quantity: recruitment_index, unit: dimensionless, description: "taken per kPa of sigma - sigma_c; the paper gives no unit"}
outputs:
  phi_ratio: {quantity: normalized_fiber_density, unit: dimensionless}
