id: steady_stress_eq4
name: actomyosin stress at zero FA growth flux (Eq. 4 with J = 0)
role: model
stated: {page: 3, printed_page: "E4551", quote: "the stress generated by the actomyosin system must satisfy", where: "text below Eq. 4"}
equation: "J = 2 pi D (sigma - Delta mu_0/Delta r) h (rc - rFA); J = 0 gives sigma = sigma* = Delta mu_0/Delta r"
inputs:
  dmu0: {quantity: plaque_energy_per_area, unit: J/m^2}
  dr: {quantity: recruited_segment_size, unit: nm}
outputs:
  sigma_star: {quantity: steady_growth_stress, unit: kPa}
