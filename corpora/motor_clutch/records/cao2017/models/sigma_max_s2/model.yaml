id: sigma_max_s2
name: maximum contractile stress, reached as Keff tends to infinity (SI, below Eq. S2)
role: model
stated: {page: 8, quote: "mum level of contractility [σ max = βρ0 =ðβ − αÞ] is achieved when", where: "SI text below Eq. S2"}
equation: "sigma_max = beta rho0/(beta - alpha)"
inputs:
  rho0: {quantity: baseline_contractility, unit: kPa}
  alpha: {quantity: coupling_parameter, unit: 1/Pa}
  beta: {quantity: coupling_parameter, unit: 1/Pa}
outputs:
  sigma_max: {quantity: contractile_stress, unit: kPa}
