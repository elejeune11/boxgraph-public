id: shear_lag_length
name: shear lag length of the 1D FA model against ligand density, stiffnesses held fixed (SI)
role: model
stated: {page: 9, quote: "where Lc is the shear lag length (i.e., the length scale over which", where: "SI, equation for Lc"}
equation: >-
  Lc = (1/phi_i) sqrt[(1/kc) * 1/(1/ks + 1/kp)]; kp, kc and ks are not given, so with them fixed
  Lc(phi_i) = Lc(phi_ref) * phi_ref/phi_i
described_from: ref-24
inputs:
  Lc_ref: {quantity: shear_lag_length, unit: um}
  phi_ref: {quantity: ligand_density_1d, unit: 1/um}
  phi: {quantity: ligand_density_1d, unit: 1/um}
outputs:
  Lc: {quantity: shear_lag_length, unit: um}
