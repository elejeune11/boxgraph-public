id: contractility_s2
name: contractile stress against the series stiffness of nucleus and FA-ECM complex (Eq. S2)
role: model
stated: {page: 8, quote: "the contractile stress σ, defined as σ = ρ + K«, can be expressed as", where: "Eq. S2"}
equation: "sigma = 1/(1/Keff + (beta - alpha)/(K beta - 1)) * beta rho0/(K beta - 1), Keff = 1/(1/En + 1/E*FA)"
described_from: ref-33
inputs:
  Keff: {quantity: series_modulus, unit: kPa}
  K: {quantity: cytoskeleton_stiffness, unit: kPa}
  rho0: {quantity: baseline_contractility, unit: kPa}
  alpha: {quantity: coupling_parameter, unit: 1/Pa}
  beta: {quantity: coupling_parameter, unit: 1/Pa}
outputs:
  sigma: {quantity: contractile_stress, unit: kPa}
