id: stable_size_chain
name: stable FA band size from an effective-modulus curve, Eq. S2 and the zero-growth condition of Eq. 4
role: model
stated: {page: 3, printed_page: "E4551", quote: "Putting It All Together: Prediction of the Stable FA Size Based on Mechanical", where: "text and Fig. 4E"}
equation: >-
  J = 2 pi D (sigma(E*FA(rFA)) - Delta mu_0/Delta r) h (rc - rFA) with sigma from Eq. S2; J > 0 only for
  r_nu < rFA < r_st, so r_st is the largest rFA at which sigma(E*FA(rFA)) = Delta mu_0/Delta r
from_words: true
built_from: [contractility_s2, steady_stress_eq4]
inputs:
  Efa: {quantity: fa_ecm_effective_modulus, unit: kPa, curve: {quantity: fa_band_size, unit: um}}
  En: {quantity: nucleus_modulus, unit: kPa}
  K: {quantity: cytoskeleton_stiffness, unit: kPa}
  rho0: {quantity: baseline_contractility, unit: kPa}
  alpha: {quantity: coupling_parameter, unit: 1/Pa}
  beta: {quantity: coupling_parameter, unit: 1/Pa}
  dmu0: {quantity: plaque_energy_per_area, unit: J/m^2}
  dr: {quantity: recruited_segment_size, unit: nm}
outputs:
  r_st: {quantity: stable_fa_band_size, unit: um}
