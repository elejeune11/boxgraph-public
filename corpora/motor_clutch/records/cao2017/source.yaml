notes: >
  Scope: the article (pp. 1-7) and SI (pp. 8-12). The paper prints almost no numerical results: its
  predictions are curves (Figs. 3B, 4A, 4C, 5A, 5B, S4, S5E-F, S6, S7). The core models are entered as printed:
  Eq. 1 (fibre recruitment; runnable but never run, since sigma_c and the unit of n are not given), the
  DFN and the COMSOL coarse-grained FA-ECM model of Eq. 2 (both not runnable, with questions), Eq. 4 at J = 0
  (sigma* = Delta mu_0/Delta r = 1 kPa from Table S1), Eq. S2 and its stated Keff -> infinity limit
  sigma_max (a stated reduces_to relation), and the 1D shear-lag length. Checks made: (1) the printed Lc at
  100 per um from the printed Lc at 1 per um with the printed formula (Lc ~ 1/phi_i); (2) the step from the
  printed E*FA curves of Fig. 4A to the stable sizes of Fig. 5A, through Eq. S2 and Eq. 4 at J = 0
  (stable_size_chain, from the paper's words and Fig. 4E); this needs alpha and beta read as per Pa (Table S1
  prints Pa) and a nucleus modulus from the printed 5-10 kPa range (added, 7.5 kPa, ends as alternatives;
  the result moves from "no stable FA" at 5 kPa to about 10 um at 10 kPa); (3) Fig. 4A against Fig. 4C,
  the same curve; (4) Fig. S7: the model's normalized FA size against baker2015's measurements (validation;
  the fibrous ligand-density contrast given to the model is taken from those measurements, see q_s7_inputs),
  and Fig. S7's experimental bars against the Fig. 5D areas. All figure values are read by eye ("~", no
  verdict) and should be replaced by calibrated readings. Cross-paper: baker2015's own data are not linked
  here (that record is being built); the measurements enter through Fig. 5D and Fig. S7 with from_source ref-16.
  No limit of the model returns chan2008's single linear substrate spring: the substrate is an elastic
  continuum here, not a spring. Left out: Fig. 3B (DFN, not runnable; Eq. 1 fit parameters not given),
  Fig. 3D and Fig. 5C (micrographs / data shown in baker2015), Fig. 4B, Fig. S5A-D (1D force and displacement
  profiles needing unstated stiffnesses), Fig. S5F, Fig. S6 heat maps, Fig. 5B heat map, Fig. S1 snapshots,
  the timescales quoted in the text (seconds, minutes) and the talin threshold (~5 pN), which feed no model.
  Figure pass (2026-11-21): calibrated code readings (figures.yaml, figures/, figures.md) of Figs. 3B, 3D, 4A,
  4B, 4C, 5A, 5D, S4, S5A, S5B, S5E, S5F and S7, each a datum beside the earlier eye reads, which are kept.
  New checks: Fig. 4A against Fig. 4C (reproduced: the eye-read difference was a reading error); the calibrated
  Fig. 4A curves to Fig. 5A through stable_size_vs_modulus (not reproduced with En = 7.5 kPa; close only for an
  En near the top of the printed range); Fig. S5E against Lc ~ 1/phi_i (reproduced); Fig. S7 model against
  baker2015's bars (close at the stiff hydrogel); Fig. 5D normalized against Fig. S7 (reproduced). The
  measurements of Figs. 3D and 5D (baker2015) are recorded for later models. Left out: drawings, micrographs,
  the heat maps of Fig. 5B and S6, Fig. 4E and S5C (no axis values).
