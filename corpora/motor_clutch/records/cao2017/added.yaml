- id: beta_per_Pa
  quantity: coupling_parameter
  unit: 1/Pa
  printed: "2.77 x 10^-3"
  basis: >-
    Table S1 prints beta as ~2.77 x 10^-3 Pa, but in Eq. S1 (alpha*K - 1)/(beta - alpha) must be a stress and
    alpha*K - 1 dimensionless, so alpha and beta are inverse stresses. The printed number is kept and read as 1/Pa.
  alternatives: ["2.77 x 10^-6"]   # the number read as per kPa (2.77e-3 1/kPa), which makes K*beta - 1 negative
  stands_for: beta in Eqs. S1, S2
- id: alpha_per_Pa
  quantity: coupling_parameter
  unit: 1/Pa
  printed: "1.91 x 10^-3"
  basis: As beta_per_Pa; Table S1 prints ~1.91 x 10^-3 Pa.
  alternatives: ["1.91 x 10^-6"]
  stands_for: alpha in Eqs. S1, S2
- id: En_mid
  quantity: nucleus_modulus
  unit: kPa
  printed: "7.5"
  basis: >-
    Table S1 gives the nucleus modulus as a range, ~5-10 kPa, and does not say which value the figures use;
    the middle of the range is taken.
  alternatives: ["5", "10"]
  stands_for: En in Keff = 1/(1/En + 1/E*FA) (SI, below Eq. S2)
