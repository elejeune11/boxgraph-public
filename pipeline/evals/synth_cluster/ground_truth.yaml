# A fourth paper for the end-to-end trial of adding a paper (see make.py).
paper: synth_cluster
pdf: make.py
expect:
  - id: pairs
    what: "relation jobs with bell1978 and erdmann2004, which it cites"
  - id: eq1_bell
    what: "Eq. 1 is related to Bell's loaded off-rate (same_as or equivalent), and verified"
  - id: eq2_erdmann
    what: "Eq. 2 is related to Erdmann & Schwarz's cluster lifetime with no rebinding, and verified"
  - id: table_row4
    what: "Table 1 at N0 = 4: printed 1.150, Eq. 2 gives 1.105 (not reproduced); the other rows reproduce"
  - id: fig1_measured
    what: "Fig. 1's five measured lifetimes are read with their SEM bars and validated against Eq. 2 (reproduced)"
must_not:
  - "the printed 1.150 is changed"
