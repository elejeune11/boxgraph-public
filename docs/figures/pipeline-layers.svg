<svg xmlns="http://www.w3.org/2000/svg" font-family="Instrument Sans, system-ui, sans-serif" viewBox="0 0 1090 496" width="1090" role="img" aria-label="Three layers. In the pipeline, read, audit and digitize agents write record files, and relate agents write relations.yaml. BoxGraph's validate checks the record files and sends pass or retry back to the agents. ModelAtlas's test_relation tests relations.yaml and sends pass or retry back to the relate agents, running models through BoxGraph's engine. The build step calls the Synthesis, which loads every record, tests every relation through ModelAtlas, recomputes every verdict through BoxGraph, and writes the report, figure check and explorer.">
          <style>
svg {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1b2230; --muted: #5d6676; --line: #8a93a3;
  --agent: #2f5fb3; --agent-fill: #e6eefb; --code-fill: #eef0f3; --ok: #2e7d4f; --warn: #a3501c;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
 background: var(--panel); }
@media (prefers-color-scheme: dark) { svg {
  --bg: #12161d; --panel: #1a2029; --fg: #e3e7ee; --muted: #9aa3b2; --line: #6d7687;
  --agent: #8fb4ff; --agent-fill: #1d2c47; --code-fill: #232a35; --ok: #6fcf97; --warn: #f0a070;   } }
text { font-family: var(--sans); fill: var(--fg); font-size: 12.5px; }
.t { font-weight: 600; font-size: 13px; }
.s { fill: var(--muted); font-size: 11px; }
.m { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.lab { fill: var(--muted); font-size: 11px; font-style: italic; }
.agent { fill: var(--agent-fill); stroke: var(--agent); stroke-width: 1.5; }
.code { fill: var(--code-fill); stroke: var(--line); stroke-width: 1.2; }
.file { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
.lane { fill: none; stroke: var(--line); stroke-opacity: 0.45; stroke-width: 1; }
.plan { fill: none; stroke: var(--warn); stroke-width: 1.4; stroke-dasharray: 6 4; }
.wire { fill: none; stroke: var(--fg); stroke-width: 1.3; }
.wire.soft { stroke: var(--line); }
.wire.ok { stroke: var(--ok); }
.wire.warn { stroke: var(--warn); }
.wire.dash { stroke-dasharray: 5 4; }
.head { fill: var(--fg); }
.head.soft { fill: var(--line); }
.head.ok { fill: var(--ok); }
.head.warn { fill: var(--warn); }
.okt { fill: var(--ok); font-weight: 600; }
.warnt { fill: var(--warn); font-weight: 600; }
</style>
          <defs>
            <marker id="dh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"/></marker>
            <marker id="dhok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head ok"/></marker>
            <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head soft"/></marker>
          </defs>

          <!-- layer bands -->
          <rect x="120" y="20" width="960" height="108" rx="8" class="lane"/>
          <text x="132" y="38" class="m">pipeline/ · runs the agents, owns no rules</text>
          <text x="712" y="186" class="m">both in records/&lt;id&gt;/</text>
          <rect x="120" y="318" width="960" height="122" rx="8" class="lane"/>
          <text x="132" y="336" class="m">boxgraph/ · the rules, generic code with nothing about any field</text>

          <!-- row 1: pipeline -->
          <rect x="140" y="50" width="220" height="62" rx="6" class="agent"/>
          <text x="250" y="75" text-anchor="middle" class="t">read · audit · digitize</text>
          <text x="250" y="94" text-anchor="middle" class="s">agents, one lane per paper</text>
          <rect x="500" y="50" width="200" height="62" rx="6" class="agent"/>
          <text x="600" y="75" text-anchor="middle" class="t">relate</text>
          <text x="600" y="94" text-anchor="middle" class="s">agent, one per pair</text>
          <rect x="860" y="50" width="200" height="62" rx="6" class="code"/>
          <text x="960" y="75" text-anchor="middle" class="t">build step</text>
          <text x="960" y="94" text-anchor="middle" class="s">plain code, no agent</text>

          <!-- row 2: files -->
          <rect x="140" y="172" width="220" height="86" rx="6" class="file"/>
          <text x="250" y="196" text-anchor="middle" class="t">the record</text>
          <text x="250" y="215" text-anchor="middle" class="s">sources · data with quotes</text>
          <text x="250" y="231" text-anchor="middle" class="s">models · runs · comparisons</text>
          <text x="250" y="247" text-anchor="middle" class="s">figure readings · questions</text>
          <rect x="500" y="172" width="200" height="86" rx="6" class="file"/>
          <text x="600" y="196" text-anchor="middle" class="t">relations.yaml</text>
          <text x="600" y="215" text-anchor="middle" class="s">kind · mapping · regime</text>
          <text x="600" y="231" text-anchor="middle" class="s">stated or proposed</text>
          <text x="600" y="247" text-anchor="middle" class="s">no status written</text>
          <rect x="940" y="172" width="130" height="86" rx="6" class="file"/>
          <text x="1005" y="196" text-anchor="middle" class="t">build/</text>
          <text x="1005" y="215" text-anchor="middle" class="s">report.html</text>
          <text x="1005" y="231" text-anchor="middle" class="s">figures.html</text>
          <text x="1005" y="247" text-anchor="middle" class="s">explorer.html</text>

          <!-- row 3: boxgraph -->
          <rect x="140" y="348" width="220" height="80" rx="6" class="code"/>
          <text x="250" y="372" text-anchor="middle" class="t">BoxGraph</text>
          <text x="250" y="391" text-anchor="middle" class="s">validate · engine</text>
          <text x="250" y="407" text-anchor="middle" class="s">precision · figure readings</text>
          <rect x="500" y="348" width="200" height="80" rx="6" class="code"/>
          <text x="600" y="372" text-anchor="middle" class="t">ModelAtlas</text>
          <text x="600" y="391" text-anchor="middle" class="s">test_relation</text>
          <text x="600" y="407" text-anchor="middle" class="s">families</text>
          <rect x="860" y="348" width="200" height="80" rx="6" class="code"/>
          <text x="960" y="372" text-anchor="middle" class="t">Synthesis</text>
          <text x="960" y="391" text-anchor="middle" class="s">verdicts · cross-paper checks</text>
          <text x="960" y="407" text-anchor="middle" class="s">findings · references</text>

          <!-- agents write -->
          <path d="M250 112 V168" class="wire" marker-end="url(#dh)"/>
          <text x="258" y="146" class="lab">writes</text>
          <path d="M600 112 V168" class="wire" marker-end="url(#dh)"/>
          <text x="608" y="146" class="lab">writes</text>

          <!-- gates -->
          <path d="M250 258 V344" class="wire" marker-end="url(#dh)"/>
          <text x="258" y="296" class="lab">checked by validate</text>
          <path d="M600 258 V344" class="wire" marker-end="url(#dh)"/>
          <text x="608" y="296" class="lab">tested by boxgraph relations</text>
          <path d="M140 388 H100 V81 H136" class="wire ok" marker-end="url(#dhok)"/>
          <text x="94" y="226" text-anchor="end" class="okt" style="font-size:11px">gate:</text>
          <text x="94" y="241" text-anchor="end" class="s">pass or</text>
          <text x="94" y="255" text-anchor="end" class="s">retry</text>
          <path d="M500 388 H470 V81 H496" class="wire ok" marker-end="url(#dhok)"/>
          <text x="464" y="226" text-anchor="end" class="okt" style="font-size:11px">gate:</text>
          <text x="464" y="241" text-anchor="end" class="s">pass or</text>
          <text x="464" y="255" text-anchor="end" class="s">retry</text>

          <!-- boxgraph internals -->
          <path d="M500 400 H364" class="wire" marker-end="url(#dh)"/>
          <text x="432" y="420" text-anchor="middle" class="lab">runs models</text>
          <path d="M860 400 H704" class="wire" marker-end="url(#dh)"/>
          <text x="790" y="420" text-anchor="middle" class="lab">tests every relation</text>
          <path d="M960 428 V466 H250 V432" class="wire" marker-end="url(#dh)"/>
          <text x="600" y="484" text-anchor="middle" class="lab">recomputes every verdict, at the printed precision</text>

          <!-- build -->
          <path d="M900 112 V344" class="wire" marker-end="url(#dh)"/>
          <text x="894" y="150" text-anchor="end" class="lab">boxgraph build</text>
          <path d="M700 215 H780 V362 H856" class="wire soft" marker-end="url(#ahs)"/>
          <text x="786" y="300" class="lab">loads every</text>
          <text x="786" y="314" class="lab">sound record</text>
          <path d="M1005 348 V262" class="wire" marker-end="url(#dh)"/>
          <text x="1013" y="300" class="lab">writes</text>
        </svg>
