<svg xmlns="http://www.w3.org/2000/svg" font-family="Instrument Sans, system-ui, sans-serif" viewBox="0 0 1100 300" width="1100" role="img" aria-label="Code and data as sources, as built. pipeline.attach copies a paper's released code or data into corpus, never committed, and registers it in papers.yaml as kind software or dataset with the papers it belongs to. After its papers' reads, one read agent writes a record of its own: values cited by file and lines or by sheet and cells, the files pinned by a digest of their contents, and a model that runs the code or a Python port of it. A relate job for each paper and its code or data links them by cited values and relations. The build runs the code in a sandbox (origin run), checks every cited value, and compares the paper's figure readings with the data at each shared x.">
          <style>
svg {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1b2230; --muted: #5d6676; --line: #8a93a3;
  --agent: #2f5fb3; --agent-fill: #e6eefb; --code-fill: #eef0f3; --ok: #2e7d4f; --warn: #a3501c;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
 background: var(--panel); }
@media (prefers-color-scheme: dark) { svg {
  --bg: #12161d; --panel: #1a2029; --fg: #e3e7ee; --muted: #9aa3b2; --line: #6d7687;
  --agent: #8fb4ff; --agent-fill: #1d2c47; --code-fill: #232a35; --ok: #6fcf97; --warn: #f0a070;   } }
text { font-family: var(--sans); fill: var(--fg); font-size: 12.5px; }
.t { font-weight: 600; font-size: 13px; }
.s { fill: var(--muted); font-size: 11px; }
.m { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.lab { fill: var(--muted); font-size: 11px; font-style: italic; }
.agent { fill: var(--agent-fill); stroke: var(--agent); stroke-width: 1.5; }
.code { fill: var(--code-fill); stroke: var(--line); stroke-width: 1.2; }
.file { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
.lane { fill: none; stroke: var(--line); stroke-opacity: 0.45; stroke-width: 1; }
.plan { fill: none; stroke: var(--warn); stroke-width: 1.4; stroke-dasharray: 6 4; }
.wire { fill: none; stroke: var(--fg); stroke-width: 1.3; }
.wire.soft { stroke: var(--line); }
.wire.ok { stroke: var(--ok); }
.wire.warn { stroke: var(--warn); }
.wire.dash { stroke-dasharray: 5 4; }
.head { fill: var(--fg); }
.head.soft { fill: var(--line); }
.head.ok { fill: var(--ok); }
.head.warn { fill: var(--warn); }
.okt { fill: var(--ok); font-weight: 600; }
.warnt { fill: var(--warn); font-weight: 600; }
</style>
          <defs>
            <marker id="ch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"/></marker>
          </defs>
          <rect x="16" y="52" width="180" height="56" rx="6" class="code"/>
          <text x="106" y="75" text-anchor="middle" class="t">pipeline.attach</text>
          <text x="106" y="93" text-anchor="middle" class="s">zip, folder or .xlsx · --papers</text>

          <rect x="256" y="16" width="180" height="56" rx="6" class="file"/>
          <text x="346" y="39" text-anchor="middle" class="t">papers.yaml</text>
          <text x="346" y="57" text-anchor="middle" class="s">kind: software | dataset</text>

          <rect x="256" y="92" width="180" height="56" rx="6" class="file"/>
          <text x="346" y="115" text-anchor="middle" class="t">corpus/code · corpus/data</text>
          <text x="346" y="133" text-anchor="middle" class="s">never committed</text>

          <path d="M196 70 H222 V44 H252" class="wire" marker-end="url(#ch)"/>
          <text x="218" y="36" text-anchor="end" class="lab">registers</text>
          <path d="M196 90 H222 V120 H252" class="wire" marker-end="url(#ch)"/>
          <text x="218" y="138" text-anchor="end" class="lab">copies</text>

          <rect x="16" y="196" width="180" height="56" rx="6" class="agent"/>
          <text x="106" y="219" text-anchor="middle" class="t">read: paper</text>
          <text x="106" y="237" text-anchor="middle" class="s">then audit, digitize</text>

          <rect x="496" y="150" width="200" height="102" rx="6" class="agent"/>
          <text x="596" y="172" text-anchor="middle" class="t">read: code or data</text>
          <text x="596" y="190" text-anchor="middle" class="s">a record of its own</text>
          <text x="596" y="205" text-anchor="middle" class="s">cited by file + lines,</text>
          <text x="596" y="220" text-anchor="middle" class="s">or sheet + cells</text>
          <text x="596" y="235" text-anchor="middle" class="s">pinned: sha256 of the files</text>

          <path d="M436 44 H466 V172 H492" class="wire" marker-end="url(#ch)"/>
          <path d="M436 120 H466" class="wire"/>
          <path d="M196 224 H492" class="wire" marker-end="url(#ch)"/>
          <text x="344" y="216" text-anchor="middle" class="lab">waits for its papers' reads</text>

          <rect x="746" y="150" width="160" height="102" rx="6" class="agent"/>
          <text x="826" y="172" text-anchor="middle" class="t">relate paper + it</text>
          <text x="826" y="190" text-anchor="middle" class="s">cited values:</text>
          <text x="826" y="205" text-anchor="middle" class="s">paper ↔ code or data</text>
          <text x="826" y="220" text-anchor="middle" class="s">same_as if the code</text>
          <text x="826" y="235" text-anchor="middle" class="s">is the paper's model</text>

          <rect x="956" y="150" width="128" height="102" rx="6" class="code"/>
          <text x="1020" y="172" text-anchor="middle" class="t">build</text>
          <text x="1020" y="190" text-anchor="middle" class="s">runs the code,</text>
          <text x="1020" y="205" text-anchor="middle" class="s">sandboxed (run)</text>
          <text x="1020" y="220" text-anchor="middle" class="s">checks cited values</text>
          <text x="1020" y="235" text-anchor="middle" class="s">figure vs data at x</text>

          <path d="M696 201 H742" class="wire" marker-end="url(#ch)"/>
          <path d="M906 201 H952" class="wire" marker-end="url(#ch)"/>
          <path d="M106 252 V282 H826 V256" class="wire" marker-end="url(#ch)"/>
          <text x="466" y="276" text-anchor="middle" class="lab">after all of the paper's steps</text>
        </svg>
