<svg xmlns="http://www.w3.org/2000/svg" font-family="Instrument Sans, system-ui, sans-serif" viewBox="0 0 1480 570" width="1480" role="img" aria-label="Pipeline flow. pipeline.add registers a paper in papers.yaml and copies its PDF into corpus; pipeline.attach does the same for a paper's released code or data. run_papers checks the list and ingests each PDF into text and page images. Each paper then goes through read, audit and digitize agents in its own lane, up to three agents at once; released code or data is only read, after its paper's read. When a record's steps have all passed, the pairs step picks which records to relate: one cites the other, a model is built from the other, the list asks for it, or it is a paper's code or data; a shared model shape alone is only listed. One relate agent runs per pair, locking both records, then one validate agent judges each record's models against the other's measurements. The build then runs every model and writes the overview, report, figure check and explorer. Every passed job is recorded in completed.yaml, so it is never run again.">
          <style>
svg {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1b2230; --muted: #5d6676; --line: #8a93a3;
  --agent: #2f5fb3; --agent-fill: #e6eefb; --code-fill: #eef0f3; --ok: #2e7d4f; --warn: #a3501c;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
 background: var(--panel); }
@media (prefers-color-scheme: dark) { svg {
  --bg: #12161d; --panel: #1a2029; --fg: #e3e7ee; --muted: #9aa3b2; --line: #6d7687;
  --agent: #8fb4ff; --agent-fill: #1d2c47; --code-fill: #232a35; --ok: #6fcf97; --warn: #f0a070;   } }
text { font-family: var(--sans); fill: var(--fg); font-size: 12.5px; }
.t { font-weight: 600; font-size: 13px; }
.s { fill: var(--muted); font-size: 11px; }
.m { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.lab { fill: var(--muted); font-size: 11px; font-style: italic; }
.agent { fill: var(--agent-fill); stroke: var(--agent); stroke-width: 1.5; }
.code { fill: var(--code-fill); stroke: var(--line); stroke-width: 1.2; }
.file { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
.lane { fill: none; stroke: var(--line); stroke-opacity: 0.45; stroke-width: 1; }
.plan { fill: none; stroke: var(--warn); stroke-width: 1.4; stroke-dasharray: 6 4; }
.wire { fill: none; stroke: var(--fg); stroke-width: 1.3; }
.wire.soft { stroke: var(--line); }
.wire.ok { stroke: var(--ok); }
.wire.warn { stroke: var(--warn); }
.wire.dash { stroke-dasharray: 5 4; }
.head { fill: var(--fg); }
.head.soft { fill: var(--line); }
.head.ok { fill: var(--ok); }
.head.warn { fill: var(--warn); }
.okt { fill: var(--ok); font-weight: 600; }
.warnt { fill: var(--warn); font-weight: 600; }
</style>
          <defs>
            <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"/></marker>
            <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head soft"/></marker>
            <marker id="ahok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head ok"/></marker>
          </defs>

          <!-- column titles -->
          <text x="76" y="40" text-anchor="middle" class="s">YOU</text>
          <text x="266" y="40" text-anchor="middle" class="s">CORPUS</text>
          <text x="461" y="40" text-anchor="middle" class="s">run_papers</text>
          <text x="756" y="40" text-anchor="middle" class="s">PER PAPER · UP TO 3 AGENTS AT ONCE</text>
          <text x="1066" y="40" text-anchor="middle" class="s">AFTER READING</text>
          <text x="1236" y="40" text-anchor="middle" class="s">PER PAIR</text>
          <text x="1398" y="40" text-anchor="middle" class="s">OUTPUT</text>

          <!-- add -->
          <rect x="16" y="226" width="120" height="88" rx="6" class="code"/>
          <text x="76" y="249" text-anchor="middle" class="t">pipeline.add</text>
          <text x="76" y="265" text-anchor="middle" class="s">a paper</text>
          <text x="76" y="289" text-anchor="middle" class="t">pipeline.attach</text>
          <text x="76" y="305" text-anchor="middle" class="s">its code or data</text>

          <!-- corpus files -->
          <rect x="196" y="180" width="140" height="56" rx="6" class="file"/>
          <text x="266" y="203" text-anchor="middle" class="t">papers.yaml</text>
          <text x="266" y="221" text-anchor="middle" class="s">id · pages · note</text>
          <rect x="196" y="304" width="140" height="56" rx="6" class="file"/>
          <text x="266" y="323" text-anchor="middle" class="t">corpus/</text>
          <text x="266" y="339" text-anchor="middle" class="s">PDFs · code · data</text>
          <text x="266" y="353" text-anchor="middle" class="s">never committed</text>

          <path d="M136 262 H160 V208 H192" class="wire" marker-end="url(#ah)"/>
          <text x="156" y="218" text-anchor="end" class="lab">registers</text>
          <path d="M136 278 H160 V332 H192" class="wire" marker-end="url(#ah)"/>
          <text x="156" y="330" text-anchor="end" class="lab">copies files</text>

          <!-- check + ingest -->
          <rect x="396" y="226" width="130" height="88" rx="6" class="code"/>
          <text x="461" y="250" text-anchor="middle" class="t">check + ingest</text>
          <text x="461" y="268" text-anchor="middle" class="s">stops on a bad entry</text>
          <text x="461" y="284" text-anchor="middle" class="s">writes page text</text>
          <text x="461" y="299" text-anchor="middle" class="s">and page images</text>
          <path d="M336 208 H366 V256 H392" class="wire" marker-end="url(#ah)"/>
          <path d="M336 332 H366 V284 H392" class="wire" marker-end="url(#ah)"/>

          <!-- lanes -->
          <rect x="566" y="88" width="380" height="104" rx="8" class="lane"/>
          <rect x="566" y="218" width="380" height="104" rx="8" class="lane"/>
          <rect x="566" y="348" width="380" height="104" rx="8" class="lane"/>
          <text x="578" y="104" class="m">paper A</text>
          <text x="578" y="234" class="m">paper B</text>
          <text x="578" y="364" class="m">code or data of paper A</text>

          <path d="M526 270 H546 V140 H578" class="wire" marker-end="url(#ah)"/>
          <path d="M546 270 H578" class="wire" marker-end="url(#ah)"/>
          <path d="M546 270 V400 H578" class="wire" marker-end="url(#ah)"/>

          <g>
            <rect x="582" y="112" width="104" height="56" rx="6" class="agent"/>
            <text x="634" y="135" text-anchor="middle" class="t">read</text>
            <text x="634" y="153" text-anchor="middle" class="s">gate: validate</text>
            <rect x="706" y="112" width="104" height="56" rx="6" class="agent"/>
            <text x="758" y="135" text-anchor="middle" class="t">audit</text>
            <text x="758" y="153" text-anchor="middle" class="s">+ audit.md</text>
            <rect x="830" y="112" width="100" height="56" rx="6" class="agent"/>
            <text x="880" y="135" text-anchor="middle" class="t">digitize</text>
            <text x="880" y="153" text-anchor="middle" class="s">+ figures.md</text>
            <path d="M686 140 H702" class="wire" marker-end="url(#ah)"/>
            <path d="M810 140 H826" class="wire" marker-end="url(#ah)"/>
          </g>
          <g>
            <rect x="582" y="242" width="104" height="56" rx="6" class="agent"/>
            <text x="634" y="265" text-anchor="middle" class="t">read</text>
            <text x="634" y="283" text-anchor="middle" class="s">gate: validate</text>
            <rect x="706" y="242" width="104" height="56" rx="6" class="agent"/>
            <text x="758" y="265" text-anchor="middle" class="t">audit</text>
            <text x="758" y="283" text-anchor="middle" class="s">+ audit.md</text>
            <rect x="830" y="242" width="100" height="56" rx="6" class="agent"/>
            <text x="880" y="265" text-anchor="middle" class="t">digitize</text>
            <text x="880" y="283" text-anchor="middle" class="s">+ figures.md</text>
            <path d="M686 270 H702" class="wire" marker-end="url(#ah)"/>
            <path d="M810 270 H826" class="wire" marker-end="url(#ah)"/>
          </g>
          <g>
            <rect x="582" y="372" width="104" height="56" rx="6" class="agent"/>
            <text x="634" y="395" text-anchor="middle" class="t">read</text>
            <text x="634" y="413" text-anchor="middle" class="s">gate: validate</text>
            <text x="826" y="388" text-anchor="middle" class="lab">waits for paper A's read</text>
            <text x="826" y="420" text-anchor="middle" class="lab">no audit or figure step</text>
          </g>

          <!-- lanes join -->
          <path d="M930 140 H966 V400 H690" class="wire"/>
          <path d="M966 270 H992" class="wire" marker-end="url(#ah)"/>
          <text x="972" y="128" class="lab">records whose steps</text>
          <text x="972" y="142" class="lab">all passed</text>

          <!-- candidate pairs -->
          <rect x="996" y="226" width="140" height="88" rx="6" class="code"/>
          <text x="1066" y="250" text-anchor="middle" class="t">pairs</text>
          <text x="1066" y="268" text-anchor="middle" class="s">cites · built from</text>
          <text x="1066" y="284" text-anchor="middle" class="s">relate_with · its paper</text>
          <text x="1066" y="299" text-anchor="middle" class="lab">shape alone: listed</text>

          <!-- relate, then validate -->
          <text x="1236" y="150" text-anchor="middle" class="lab">two jobs per flagged pair,</text>
          <text x="1236" y="163" text-anchor="middle" class="lab">each locking both records</text>
          <rect x="1176" y="172" width="120" height="96" rx="6" class="agent"/>
          <text x="1236" y="192" text-anchor="middle" class="t">relate A + B</text>
          <text x="1236" y="208" text-anchor="middle" class="s">gate: relations test</text>
          <path d="M1184 219 H1288" class="wire"/>
          <text x="1236" y="238" text-anchor="middle" class="t">validate A + B</text>
          <text x="1236" y="254" text-anchor="middle" class="s">gate: all checked</text>
          <rect x="1176" y="284" width="120" height="96" rx="6" class="agent"/>
          <text x="1236" y="304" text-anchor="middle" class="t">relate A + C</text>
          <text x="1236" y="320" text-anchor="middle" class="s">gate: relations test</text>
          <path d="M1184 331 H1288" class="wire"/>
          <text x="1236" y="350" text-anchor="middle" class="t">validate A + C</text>
          <text x="1236" y="366" text-anchor="middle" class="s">gate: all checked</text>
          <path d="M1136 262 H1156 V220 H1172" class="wire" marker-end="url(#ah)"/>
          <path d="M1136 278 H1156 V332 H1172" class="wire" marker-end="url(#ah)"/>

          <!-- build -->
          <rect x="1336" y="210" width="124" height="120" rx="6" class="code"/>
          <text x="1398" y="234" text-anchor="middle" class="t">build</text>
          <text x="1398" y="253" text-anchor="middle" class="s">runs every model</text>
          <text x="1398" y="270" text-anchor="middle" class="s">overview/</text>
          <text x="1398" y="286" text-anchor="middle" class="s">report.html</text>
          <text x="1398" y="302" text-anchor="middle" class="s">figures.html</text>
          <text x="1398" y="318" text-anchor="middle" class="s">explorer.html</text>
          <path d="M1296 220 H1316 V258 H1332" class="wire" marker-end="url(#ah)"/>
          <path d="M1296 332 H1316 V282 H1332" class="wire" marker-end="url(#ah)"/>

          <!-- ledger -->
          <rect x="566" y="500" width="730" height="48" rx="6" class="file"/>
          <text x="931" y="520" text-anchor="middle" class="t">pipeline/completed.yaml</text>
          <text x="931" y="538" text-anchor="middle" class="s">committed ledger of passed jobs · every later run, on any machine, skips them</text>
          <path d="M756 452 V496" class="wire ok" marker-end="url(#ahok)"/>
          <text x="764" y="480" class="okt" style="font-size:11px">passed</text>
          <path d="M1236 380 V496" class="wire ok" marker-end="url(#ahok)"/>
          <text x="1244" y="480" class="okt" style="font-size:11px">passed</text>
        </svg>
