<svg xmlns="http://www.w3.org/2000/svg" width="820" height="432" viewBox="0 0 820 432" role="img">
<title>ModelAtlas</title>
<desc>Every model enters as its paper states it, and is never merged or overwritten. Verified relations join models: models that are the same under a mapping form a family. Special cases and derived models are structure around a family. An approximation is checked but never joins one. A stated relation that is refuted is a finding.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tl{font-size:12px;fill:#444441;font-style:italic}
.box{fill:#F1EFE8;stroke:#888780}.rec{fill:none;stroke:#888780;stroke-dasharray:1.5 3}.region{fill:none;stroke:#B4B2A9;stroke-dasharray:6 4}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-green>rect{fill:#EAF3DE;stroke:#3B6D11}.c-green>.ts{fill:#27500A}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>.ts{fill:#633806}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D}.c-red>.ts{fill:#791F1F}
rect.added{stroke-dasharray:5 3;stroke-width:1.5}
.arr{stroke:#888780;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:1.5 3}.head{stroke:#888780}
.line{stroke:#888780;stroke-width:1;fill:none}.pt{fill:#534AB7}.pt2{fill:#993C1D}
@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tl{fill:#D3D1C7}.box{fill:#2C2C2A}
.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#EEEDFE}.c-purple>.ts{fill:#CECBF6}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#E1F5EE}.c-teal>.ts{fill:#9FE1CB}
.c-coral>rect{fill:#712B13;stroke:#F0997B}.c-coral>.th{fill:#FAECE7}.c-coral>.ts{fill:#F5C4B3}
.c-green>rect{fill:#27500A;stroke:#97C459}.c-green>.ts{fill:#EAF3DE}
.c-amber>rect{fill:#633806;stroke:#EF9F27}.c-amber>.ts{fill:#FAEEDA}
.c-red>rect{fill:#791F1F;stroke:#F09595}.c-red>.ts{fill:#FCEBEB}.pt{fill:#AFA9EC}.pt2{fill:#F0997B}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="region" x="60" y="40" width="410" height="160" rx="12" stroke-width="1"/>
<text class="ts" x="75" y="60" text-anchor="start" dominant-baseline="central">A family: the same model in different forms</text>
<g class="c-purple"><rect x="90" y="106" width="150" height="56" rx="6" stroke-width="0.5"/><text class="th" x="165.0" y="125.0" text-anchor="middle" dominant-baseline="central">Model A</text><text class="ts" x="165.0" y="144.0" text-anchor="middle" dominant-baseline="central">Paper 1, Eq. 3</text></g>
<g class="c-purple"><rect x="300" y="106" width="150" height="56" rx="6" stroke-width="0.5"/><text class="th" x="375.0" y="125.0" text-anchor="middle" dominant-baseline="central">Model B</text><text class="ts" x="375.0" y="144.0" text-anchor="middle" dominant-baseline="central">Paper 2, Eq. 7</text></g>
<path class="arr " d="M242 134 H298" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text class="ts" x="270" y="92" text-anchor="middle" dominant-baseline="central">A and B: the same, under a mapping</text>
<g class="c-purple"><rect x="90" y="280" width="150" height="56" rx="6" stroke-width="0.5"/><text class="th" x="165.0" y="299.0" text-anchor="middle" dominant-baseline="central">Model C</text><text class="ts" x="165.0" y="318.0" text-anchor="middle" dominant-baseline="central">Paper 3</text></g>
<g class="c-purple"><rect x="300" y="280" width="150" height="56" rx="6" stroke-width="0.5"/><text class="th" x="375.0" y="299.0" text-anchor="middle" dominant-baseline="central">Model D</text><text class="ts" x="375.0" y="318.0" text-anchor="middle" dominant-baseline="central">Paper 4</text></g>
<g class="c-purple"><rect x="610" y="106" width="150" height="56" rx="6" stroke-width="0.5"/><text class="th" x="685.0" y="125.0" text-anchor="middle" dominant-baseline="central">Model E</text><text class="ts" x="685.0" y="144.0" text-anchor="middle" dominant-baseline="central">Paper 5</text></g>
<g class="c-purple"><rect x="610" y="280" width="150" height="56" rx="6" stroke-width="0.5"/><text class="th" x="685.0" y="299.0" text-anchor="middle" dominant-baseline="central">Model F</text><text class="ts" x="685.0" y="318.0" text-anchor="middle" dominant-baseline="central">Paper 6</text></g>
<path class="arr " d="M165 162 V278" marker-end="url(#arrow)"/>
<text class="ts" x="175" y="236" text-anchor="start" dominant-baseline="central">reduces to C, in a limit</text>
<path class="arr " d="M375 162 V278" marker-end="url(#arrow)"/>
<text class="ts" x="385" y="236" text-anchor="start" dominant-baseline="central">D derived from B</text>
<path class="arr dot" d="M450 134 H608" marker-end="url(#arrow)"/>
<text class="ts" x="540" y="120" text-anchor="middle" dominant-baseline="central">approximated by</text>
<text class="ts" x="540" y="150" text-anchor="middle" dominant-baseline="central">never joins</text>
<path class="arr dash" d="M450 308 H608"/>
<text class="ts" x="530" y="296" text-anchor="middle" dominant-baseline="central">stated: same</text>
<text class="ts" x="530" y="356" text-anchor="middle" dominant-baseline="central">the paper says D and F are the same; the check refutes it: a finding</text>
<text class="ts" x="60" y="396" text-anchor="start" dominant-baseline="central">Inside a family, results that don't follow from each other's inputs are a finding.</text>
<text class="ts" x="60" y="414" text-anchor="start" dominant-baseline="central">A relation joins models, never quantities: two models' k can still be different things.</text>
</svg>
