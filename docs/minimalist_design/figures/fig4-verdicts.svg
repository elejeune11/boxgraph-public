<svg xmlns="http://www.w3.org/2000/svg" width="900" height="216" viewBox="0 0 900 216" role="img">
<title>Verdicts at the printed precision</title>
<desc>A value printed as 4.7 allows anything that rounds to 4.7, from 4.65 to 4.75: a result inside is reproduced. Outside by at most twice the half-width (the width of the range again) it is close, if it keeps the printed sign and is within a factor of ten; beyond that it is not reproduced. A value printed with no precision gets no verdict.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tl{font-size:12px;fill:#444441;font-style:italic}
.box{fill:#F1EFE8;stroke:#888780}.rec{fill:none;stroke:#888780;stroke-dasharray:1.5 3}.region{fill:none;stroke:#B4B2A9;stroke-dasharray:6 4}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-green>rect{fill:#EAF3DE;stroke:#3B6D11}.c-green>.ts{fill:#27500A}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>.ts{fill:#633806}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D}.c-red>.ts{fill:#791F1F}
rect.added{stroke-dasharray:5 3;stroke-width:1.5}
.arr{stroke:#888780;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:1.5 3}.head{stroke:#888780}
.line{stroke:#888780;stroke-width:1;fill:none}.pt{fill:#534AB7}.pt2{fill:#993C1D}
@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tl{fill:#D3D1C7}.box{fill:#2C2C2A}
.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#EEEDFE}.c-purple>.ts{fill:#CECBF6}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#E1F5EE}.c-teal>.ts{fill:#9FE1CB}
.c-coral>rect{fill:#712B13;stroke:#F0997B}.c-coral>.th{fill:#FAECE7}.c-coral>.ts{fill:#F5C4B3}
.c-green>rect{fill:#27500A;stroke:#97C459}.c-green>.ts{fill:#EAF3DE}
.c-amber>rect{fill:#633806;stroke:#EF9F27}.c-amber>.ts{fill:#FAEEDA}
.c-red>rect{fill:#791F1F;stroke:#F09595}.c-red>.ts{fill:#FCEBEB}.pt{fill:#AFA9EC}.pt2{fill:#F0997B}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="450" y="34" text-anchor="middle" dominant-baseline="central">Printed: 4.7, to one decimal: anything that rounds to 4.7 agrees</text>
<path class="line" d="M449.99899999999974 48 V78"/>
<g class="c-red"><rect x="80.0" y="80" width="184.99949999999933" height="50" stroke-width="0.5"/><text class="ts" x="172.49974999999966" y="105.0" text-anchor="middle" dominant-baseline="central">not reproduced</text></g>
<g class="c-amber"><rect x="264.99949999999933" y="80" width="123.33300000000065" height="50" stroke-width="0.5"/><text class="ts" x="326.66599999999966" y="105.0" text-anchor="middle" dominant-baseline="central">close</text></g>
<g class="c-green"><rect x="388.3325" y="80" width="123.33299999999957" height="50" stroke-width="0.5"/><text class="ts" x="449.9989999999998" y="105.0" text-anchor="middle" dominant-baseline="central">reproduced</text></g>
<g class="c-amber"><rect x="511.66549999999955" y="80" width="123.33299999999957" height="50" stroke-width="0.5"/><text class="ts" x="573.3319999999993" y="105.0" text-anchor="middle" dominant-baseline="central">close</text></g>
<g class="c-red"><rect x="634.9984999999991" y="80" width="184.99950000000035" height="50" stroke-width="0.5"/><text class="ts" x="727.4982499999993" y="105.0" text-anchor="middle" dominant-baseline="central">not reproduced</text></g>
<path class="line" d="M80.0 140 H819.9979999999995"/>
<path class="line" d="M80.0 136 V144"/>
<text class="ts" x="80.0" y="158" text-anchor="middle" dominant-baseline="central">4.4</text>
<path class="line" d="M264.99949999999933 136 V144"/>
<text class="ts" x="264.99949999999933" y="158" text-anchor="middle" dominant-baseline="central">4.55</text>
<path class="line" d="M388.3325 136 V144"/>
<text class="ts" x="388.3325" y="158" text-anchor="middle" dominant-baseline="central">4.65</text>
<path class="line" d="M449.99899999999974 136 V144"/>
<text class="ts" x="449.99899999999974" y="158" text-anchor="middle" dominant-baseline="central">4.7</text>
<path class="line" d="M511.66549999999955 136 V144"/>
<text class="ts" x="511.66549999999955" y="158" text-anchor="middle" dominant-baseline="central">4.75</text>
<path class="line" d="M634.9984999999991 136 V144"/>
<text class="ts" x="634.9984999999991" y="158" text-anchor="middle" dominant-baseline="central">4.85</text>
<path class="line" d="M819.9979999999995 136 V144"/>
<text class="ts" x="819.9979999999995" y="158" text-anchor="middle" dominant-baseline="central">5</text>
<text class="ts" x="80" y="196" text-anchor="start" dominant-baseline="central">The verdict is computed from the data whenever it is asked for, never stored. A value printed with no precision ("about 5") gets none.</text>
</svg>
