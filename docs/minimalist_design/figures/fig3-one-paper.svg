<text class="ts" x="264" y="414" text-anchor="middle" dominant-baseline="central">reports</text>
<text class="ts" x="264" y="248" text-anchor="middle" dominant-baseline="central">labelled</text>
<g class="c-coral"><rect x="570" y="160" width="150" height="48" rx="6" stroke-width="0.5"/><text class="th" x="645.0" y="184.0" text-anchor="middle" dominant-baseline="central">Run</text></g>
<g class="c-teal"><rect x="810" y="160" width="190" height="48" rx="6" stroke-width="0.5"/><text class="th" x="905.0" y="175.0" text-anchor="middle" dominant-baseline="central">log t = −4.7</text><text class="ts" x="905.0" y="194.0" text-anchor="middle" dominant-baseline="central">predicted</text></g>
<g class="c-coral"><rect x="570" y="400" width="150" height="48" rx="6" stroke-width="0.5"/><text class="th" x="645.0" y="415.0" text-anchor="middle" dominant-baseline="central">Comparison</text><text class="ts" x="645.0" y="434.0" text-anchor="middle" dominant-baseline="central">for reproduction</text></g>
<g class="c-teal"><rect x="810" y="400" width="190" height="48" rx="6" stroke-width="0.5"/><text class="th" x="905.0" y="415.0" text-anchor="middle" dominant-baseline="central">differs by 10 decades</text><text class="ts" x="905.0" y="434.0" text-anchor="middle" dominant-baseline="central">assessed</text></g>
<g class="c-red"><rect x="810" y="500" width="190" height="48" rx="6" stroke-width="0.5"/><text class="th" x="905.0" y="515.0" text-anchor="middle" dominant-baseline="central">Not reproduced</text><text class="ts" x="905.0" y="534.0" text-anchor="middle" dominant-baseline="central">verdict, computed when asked</text></g>
<g><rect class="rec" x="810" y="590" width="190" height="56" rx="6" stroke-width="1"/><text class="th" x="905.0" y="609.0" text-anchor="middle" dominant-baseline="central">Open question</text><text class="ts" x="905.0" y="628.0" text-anchor="middle" dominant-baseline="central">possible error in paper</text></g>
