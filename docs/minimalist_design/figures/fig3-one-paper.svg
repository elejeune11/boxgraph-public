<text class="ts" x="913" y="474" text-anchor="start" dominant-baseline="central">at printed precision</text>
<path class="arr dot" d="M810 618 H385 V450" marker-end="url(#arrow)"/>
<text class="ts" x="600" y="608" text-anchor="middle" dominant-baseline="central">about the printed value</text>
<text class="ts" x="30" y="690" text-anchor="start" dominant-baseline="central">x_b is labelled as added wherever it is used, and run with its alternative: if the verdict changes, that is reported too.</text>
<text class="ts" x="30" y="710" text-anchor="start" dominant-baseline="central">The printed −14.7 is never corrected to −4.7. The difference is the finding.</text>
</svg>
