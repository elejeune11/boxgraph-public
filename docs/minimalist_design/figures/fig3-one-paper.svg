<text class="ts" x="46" y="138" text-anchor="start" dominant-baseline="central">k₀ = 0.2 /s  (p. 3)</text>
<text class="ts" x="46" y="198" text-anchor="start" dominant-baseline="central">F = 5 pN  (p. 4)</text>
<text class="tl" x="46" y="258" text-anchor="start" dominant-baseline="central">x_b: not stated</text>
<text class="ts" x="46" y="424" text-anchor="start" dominant-baseline="central">log t = −14.7  (p. 5)</text>
<g class="c-purple"><rect x="300" y="40" width="170" height="48" rx="6" stroke-width="0.5"/><text class="th" x="385.0" y="55.0" text-anchor="middle" dominant-baseline="central">Model</text><text class="ts" x="385.0" y="74.0" text-anchor="middle" dominant-baseline="central">as printed: Eq. 2</text></g>
<g class="c-teal"><rect x="300" y="114" width="170" height="48" rx="6" stroke-width="0.5"/><text class="th" x="385.0" y="129.0" text-anchor="middle" dominant-baseline="central">k₀</text><text class="ts" x="385.0" y="148.0" text-anchor="middle" dominant-baseline="central">as printed, p. 3</text></g>
