<g class="c-teal"><rect class="added" x="300" y="234" width="170" height="48" rx="6" stroke-width="0.5"/><text class="th" x="385.0" y="249.0" text-anchor="middle" dominant-baseline="central">x_b</text><text class="ts" x="385.0" y="268.0" text-anchor="middle" dominant-baseline="central">not printed: added</text></g>
<g class="c-teal"><rect x="300" y="400" width="170" height="48" rx="6" stroke-width="0.5"/><text class="th" x="385.0" y="415.0" text-anchor="middle" dominant-baseline="central">log t = −14.7</text><text class="ts" x="385.0" y="434.0" text-anchor="middle" dominant-baseline="central">as printed, p. 5</text></g>
