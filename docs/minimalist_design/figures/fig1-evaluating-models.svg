<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="378" viewBox="0 0 1010 378" role="img">
<title>A syntax for evaluating models</title>
<desc>Left: a usual knowledge graph records claims about models: a paper proposes a model, the model predicts something, another paper uses it. Nothing in it can be run or checked. Right: BoxGraph records what it takes to evaluate a model: the paper's inputs as printed, its model in runnable form, a run of the model on those inputs, the result the paper printed, and a comparison of the two that gives a verdict.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tl{font-size:12px;fill:#444441;font-style:italic}
.box{fill:#F1EFE8;stroke:#888780}.rec{fill:none;stroke:#888780;stroke-dasharray:1.5 3}.region{fill:none;stroke:#B4B2A9;stroke-dasharray:6 4}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-green>rect{fill:#EAF3DE;stroke:#3B6D11}.c-green>.ts{fill:#27500A}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>.ts{fill:#633806}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D}.c-red>.ts{fill:#791F1F}
rect.added{stroke-dasharray:5 3;stroke-width:1.5}
.arr{stroke:#888780;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:1.5 3}.head{stroke:#888780}
.line{stroke:#888780;stroke-width:1;fill:none}.pt{fill:#534AB7}.pt2{fill:#993C1D}
@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tl{fill:#D3D1C7}.box{fill:#2C2C2A}
.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#EEEDFE}.c-purple>.ts{fill:#CECBF6}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#E1F5EE}.c-teal>.ts{fill:#9FE1CB}
.c-coral>rect{fill:#712B13;stroke:#F0997B}.c-coral>.th{fill:#FAECE7}.c-coral>.ts{fill:#F5C4B3}
.c-green>rect{fill:#27500A;stroke:#97C459}.c-green>.ts{fill:#EAF3DE}
.c-amber>rect{fill:#633806;stroke:#EF9F27}.c-amber>.ts{fill:#FAEEDA}
.c-red>rect{fill:#791F1F;stroke:#F09595}.c-red>.ts{fill:#FCEBEB}.pt{fill:#AFA9EC}.pt2{fill:#F0997B}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="20" y="30" text-anchor="start" dominant-baseline="central">A usual knowledge graph</text>
<text class="ts" x="20" y="50" text-anchor="start" dominant-baseline="central">records claims about models</text>
<g><rect class="box" x="40" y="84" width="120" height="36" rx="6" stroke-width="0.5"/><text class="th" x="100.0" y="102.0" text-anchor="middle" dominant-baseline="central">Paper A</text></g>
<g><rect class="box" x="260" y="84" width="140" height="36" rx="6" stroke-width="0.5"/><text class="th" x="330.0" y="102.0" text-anchor="middle" dominant-baseline="central">Model X</text></g>
<g><rect class="box" x="40" y="190" width="120" height="36" rx="6" stroke-width="0.5"/><text class="th" x="100.0" y="208.0" text-anchor="middle" dominant-baseline="central">Paper B</text></g>
<g><rect class="box" x="260" y="190" width="140" height="36" rx="6" stroke-width="0.5"/><text class="th" x="330.0" y="208.0" text-anchor="middle" dominant-baseline="central">bond lifetime</text></g>
<path class="arr " d="M160 102 H258" marker-end="url(#arrow)"/>
<text class="ts" x="209" y="90" text-anchor="middle" dominant-baseline="central">proposes</text>
<path class="arr " d="M330 120 V188" marker-end="url(#arrow)"/>
<text class="ts" x="338" y="156" text-anchor="start" dominant-baseline="central">predicts</text>
<path class="arr " d="M160 208 H210 V114 H258" marker-end="url(#arrow)"/>
<text class="ts" x="218" y="160" text-anchor="start" dominant-baseline="central">uses</text>
<text class="ts" x="20" y="270" text-anchor="start" dominant-baseline="central">It says a model exists and what it is about.</text>
<text class="ts" x="20" y="290" text-anchor="start" dominant-baseline="central">Nothing in it can be run, or checked against the paper.</text>
<path class="line" d="M440 20 V300" stroke-dasharray="2 4"/>
<text class="th" x="470" y="30" text-anchor="start" dominant-baseline="central">BoxGraph</text>
<text class="ts" x="470" y="50" text-anchor="start" dominant-baseline="central">records what it takes to evaluate a model</text>
<g><rect class="box" x="480" y="140" width="100" height="36" rx="6" stroke-width="0.5"/><text class="th" x="530.0" y="158.0" text-anchor="middle" dominant-baseline="central">Paper A</text></g>
<g class="c-teal"><rect x="620" y="80" width="140" height="36" rx="6" stroke-width="0.5"/><text class="th" x="690.0" y="98.0" text-anchor="middle" dominant-baseline="central">inputs, as printed</text></g>
<g class="c-purple"><rect x="620" y="140" width="140" height="36" rx="6" stroke-width="0.5"/><text class="th" x="690.0" y="158.0" text-anchor="middle" dominant-baseline="central">model, runnable</text></g>
<g class="c-teal"><rect x="620" y="220" width="140" height="36" rx="6" stroke-width="0.5"/><text class="th" x="690.0" y="238.0" text-anchor="middle" dominant-baseline="central">result, as printed</text></g>
<g class="c-coral"><rect x="790" y="80" width="80" height="36" rx="6" stroke-width="0.5"/><text class="th" x="830.0" y="98.0" text-anchor="middle" dominant-baseline="central">Run</text></g>
<g class="c-teal"><rect x="900" y="80" width="90" height="36" rx="6" stroke-width="0.5"/><text class="th" x="945.0" y="98.0" text-anchor="middle" dominant-baseline="central">prediction</text></g>
<g class="c-coral"><rect x="870" y="220" width="120" height="36" rx="6" stroke-width="0.5"/><text class="th" x="930.0" y="238.0" text-anchor="middle" dominant-baseline="central">Comparison</text></g>
<path class="arr " d="M580 150 H600 V98 H618" marker-end="url(#arrow)"/>
<path class="arr " d="M580 162 H618" marker-end="url(#arrow)"/>
<path class="arr " d="M530 176 V238 H618" marker-end="url(#arrow)"/>
<text class="ts" x="524" y="210" text-anchor="end" dominant-baseline="central">reports,</text>
<text class="ts" x="524" y="226" text-anchor="end" dominant-baseline="central">describes</text>
<path class="arr " d="M760 98 H788" marker-end="url(#arrow)"/>
<path class="arr " d="M830 116 V158 H762" marker-end="url(#arrow)"/>
<text class="ts" x="838" y="140" text-anchor="start" dominant-baseline="central">applies</text>
<path class="arr " d="M870 98 H898" marker-end="url(#arrow)"/>
<path class="arr " d="M945 116 V218" marker-end="url(#arrow)"/>
<path class="arr " d="M760 238 H868" marker-end="url(#arrow)"/>
<text class="ts" x="814" y="228" text-anchor="middle" dominant-baseline="central">compared</text>
<text class="ts" x="990" y="276" text-anchor="end" dominant-baseline="central">gives a verdict: reproduced,</text>
<text class="ts" x="990" y="292" text-anchor="end" dominant-baseline="central">close, or not reproduced</text>
<text class="ts" x="20" y="340" text-anchor="start" dominant-baseline="central">BoxGraph's syntax is specific to evaluating models: its kinds of node and edge are the ones needed to state a model, its inputs and results as printed,</text>
<text class="ts" x="20" y="358" text-anchor="start" dominant-baseline="central">run it, and compare. A claim becomes something that can be checked, and every node traces to the page it came from.</text>
</svg>
