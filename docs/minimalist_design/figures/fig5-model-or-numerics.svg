<svg xmlns="http://www.w3.org/2000/svg" width="900" height="324" viewBox="0 0 900 324" role="img">
<title>The model or the numerics</title>
<desc>Two results that both reproduce the paper at the paper's own numerical setting. Refining the setting, the first settles inside a tolerance declared in advance: it belongs to the model. The second keeps moving: it belongs to the numerics, and that is a finding.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tl{font-size:12px;fill:#444441;font-style:italic}
.box{fill:#F1EFE8;stroke:#888780}.rec{fill:none;stroke:#888780;stroke-dasharray:1.5 3}.region{fill:none;stroke:#B4B2A9;stroke-dasharray:6 4}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-green>rect{fill:#EAF3DE;stroke:#3B6D11}.c-green>.ts{fill:#27500A}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>.ts{fill:#633806}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D}.c-red>.ts{fill:#791F1F}
rect.added{stroke-dasharray:5 3;stroke-width:1.5}
.arr{stroke:#888780;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:1.5 3}.head{stroke:#888780}
.line{stroke:#888780;stroke-width:1;fill:none}.pt{fill:#534AB7}.pt2{fill:#993C1D}
@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tl{fill:#D3D1C7}.box{fill:#2C2C2A}
.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#EEEDFE}.c-purple>.ts{fill:#CECBF6}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#E1F5EE}.c-teal>.ts{fill:#9FE1CB}
.c-coral>rect{fill:#712B13;stroke:#F0997B}.c-coral>.th{fill:#FAECE7}.c-coral>.ts{fill:#F5C4B3}
.c-green>rect{fill:#27500A;stroke:#97C459}.c-green>.ts{fill:#EAF3DE}
.c-amber>rect{fill:#633806;stroke:#EF9F27}.c-amber>.ts{fill:#FAEEDA}
.c-red>rect{fill:#791F1F;stroke:#F09595}.c-red>.ts{fill:#FCEBEB}.pt{fill:#AFA9EC}.pt2{fill:#F0997B}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="30" text-anchor="start" dominant-baseline="central">Belongs to the model</text>
<text class="ts" x="40" y="50" text-anchor="start" dominant-baseline="central">it settles as the setting is refined</text>
<rect x="60" y="82.46153846153848" width="340" height="15.230769230769226" fill="#888780" opacity="0.15"/>
<text class="ts" x="396" y="111.69230769230771" text-anchor="end" dominant-baseline="central">tolerance, declared in advance</text>
<path class="line" d="M60 70 V250 H400"/>
<path class="line dash" d="M60 83.84615384615387 H400" stroke-dasharray="3 3"/>
<text class="ts" x="396" y="73.84615384615387" text-anchor="end" dominant-baseline="central">the paper's result</text>
<polyline class="line" points="90,83.84615384615387 190,89.38461538461539 290,90.7692307692308 390,90.7692307692308"/>
<circle class="pt" cx="90" cy="83.84615384615387" r="4.5"/>
<circle class="pt" cx="190" cy="89.38461538461539" r="4.5"/>
<circle class="pt" cx="290" cy="90.7692307692308" r="4.5"/>
<circle class="pt" cx="390" cy="90.7692307692308" r="4.5"/>
<text class="ts" x="90" y="266" text-anchor="middle" dominant-baseline="central">paper's setting</text>
<text class="ts" x="190" y="266" text-anchor="middle" dominant-baseline="central">2× finer</text>
<text class="ts" x="290" y="266" text-anchor="middle" dominant-baseline="central">4× finer</text>
<text class="ts" x="390" y="266" text-anchor="middle" dominant-baseline="central">8× finer</text>
<text class="th" x="500" y="30" text-anchor="start" dominant-baseline="central">Belongs to the numerics</text>
<text class="ts" x="500" y="50" text-anchor="start" dominant-baseline="central">it keeps moving: a finding, though it reproduced</text>
<path class="line" d="M520 70 V250 H860"/>
<path class="line dash" d="M520 83.84615384615387 H860" stroke-dasharray="3 3"/>
<text class="ts" x="856" y="73.84615384615387" text-anchor="end" dominant-baseline="central">the paper's result</text>
<polyline class="line" points="550,83.84615384615387 650,132.30769230769232 750,173.84615384615387 850,208.46153846153845"/>
<circle class="pt2" cx="550" cy="83.84615384615387" r="4.5"/>
<circle class="pt2" cx="650" cy="132.30769230769232" r="4.5"/>
<circle class="pt2" cx="750" cy="173.84615384615387" r="4.5"/>
<circle class="pt2" cx="850" cy="208.46153846153845" r="4.5"/>
<text class="ts" x="550" y="266" text-anchor="middle" dominant-baseline="central">paper's setting</text>
<text class="ts" x="650" y="266" text-anchor="middle" dominant-baseline="central">2× finer</text>
<text class="ts" x="750" y="266" text-anchor="middle" dominant-baseline="central">4× finer</text>
<text class="ts" x="850" y="266" text-anchor="middle" dominant-baseline="central">8× finer</text>
<text class="ts" x="40" y="306" text-anchor="start" dominant-baseline="central">A step size, a mesh, a sample count or a scheme is a setting, not part of the model. Reproduced is not the same as verified.</text>
</svg>
