<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="492" viewBox="0 0 1060 492" role="img">
<title>Kinds of check</title>
<desc>A paper against itself: its inputs run through its model, compared with its own results; this needs only the paper. A paper against another: one paper's inputs run through another paper's model, compared with its results; this needs a verified relation that maps one model onto the other. A model against another paper's measurement: the model run on the measurement's conditions, compared with what was measured; this needs the quantities the two papers share, named.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tl{font-size:12px;fill:#444441;font-style:italic}
.box{fill:#F1EFE8;stroke:#888780}.rec{fill:none;stroke:#888780;stroke-dasharray:1.5 3}.region{fill:none;stroke:#B4B2A9;stroke-dasharray:6 4}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-green>rect{fill:#EAF3DE;stroke:#3B6D11}.c-green>.ts{fill:#27500A}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>.ts{fill:#633806}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D}.c-red>.ts{fill:#791F1F}
rect.added{stroke-dasharray:5 3;stroke-width:1.5}
.arr{stroke:#888780;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:1.5 3}.head{stroke:#888780}
.line{stroke:#888780;stroke-width:1;fill:none}.pt{fill:#534AB7}.pt2{fill:#993C1D}
@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tl{fill:#D3D1C7}.box{fill:#2C2C2A}
.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#EEEDFE}.c-purple>.ts{fill:#CECBF6}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#E1F5EE}.c-teal>.ts{fill:#9FE1CB}
.c-coral>rect{fill:#712B13;stroke:#F0997B}.c-coral>.th{fill:#FAECE7}.c-coral>.ts{fill:#F5C4B3}
.c-green>rect{fill:#27500A;stroke:#97C459}.c-green>.ts{fill:#EAF3DE}
.c-amber>rect{fill:#633806;stroke:#EF9F27}.c-amber>.ts{fill:#FAEEDA}
.c-red>rect{fill:#791F1F;stroke:#F09595}.c-red>.ts{fill:#FCEBEB}.pt{fill:#AFA9EC}.pt2{fill:#F0997B}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="30" y="30" text-anchor="start" dominant-baseline="central">A paper against itself</text>
<text class="ts" x="30" y="50" text-anchor="start" dominant-baseline="central">needs only this paper</text>
<g class="c-teal"><rect x="30" y="140" width="110" height="56" rx="6" stroke-width="0.5"/><text class="th" x="85.0" y="168.0" text-anchor="middle" dominant-baseline="central">A's inputs</text></g>
<g class="c-purple"><rect x="210" y="140" width="110" height="56" rx="6" stroke-width="0.5"/><text class="th" x="265.0" y="168.0" text-anchor="middle" dominant-baseline="central">A's model</text></g>
<g class="c-teal"><rect x="390" y="140" width="110" height="56" rx="6" stroke-width="0.5"/><text class="th" x="445.0" y="159.0" text-anchor="middle" dominant-baseline="central">A's results</text><text class="ts" x="445.0" y="178.0" text-anchor="middle" dominant-baseline="central">as printed</text></g>
<path class="arr " d="M140 168 H208" marker-end="url(#arrow)"/>
<text class="ts" x="175" y="156" text-anchor="middle" dominant-baseline="central">run</text>
<path class="arr " d="M320 168 H388" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text class="ts" x="355" y="156" text-anchor="middle" dominant-baseline="central">compared</text>
<text class="th" x="560" y="30" text-anchor="start" dominant-baseline="central">A paper against another</text>
<text class="ts" x="560" y="50" text-anchor="start" dominant-baseline="central">needs a verified relation</text>
<g><rect class="rec" x="695" y="66" width="200" height="44" rx="6" stroke-width="1"/><text class="th" x="795.0" y="79.0" text-anchor="middle" dominant-baseline="central">Verified relation</text><text class="ts" x="795.0" y="98.0" text-anchor="middle" dominant-baseline="central">A ↔ B, with a mapping</text></g>
<g class="c-teal"><rect x="560" y="140" width="110" height="56" rx="6" stroke-width="0.5"/><text class="th" x="615.0" y="168.0" text-anchor="middle" dominant-baseline="central">B's inputs</text></g>
<g class="c-purple"><rect x="740" y="140" width="110" height="56" rx="6" stroke-width="0.5"/><text class="th" x="795.0" y="168.0" text-anchor="middle" dominant-baseline="central">A's model</text></g>
<g class="c-teal"><rect x="920" y="140" width="110" height="56" rx="6" stroke-width="0.5"/><text class="th" x="975.0" y="159.0" text-anchor="middle" dominant-baseline="central">B's results</text><text class="ts" x="975.0" y="178.0" text-anchor="middle" dominant-baseline="central">as printed</text></g>
<path class="arr " d="M670 168 H738" marker-end="url(#arrow)"/>
<text class="ts" x="704" y="156" text-anchor="middle" dominant-baseline="central">mapped</text>
<path class="arr " d="M850 168 H918" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text class="ts" x="885" y="156" text-anchor="middle" dominant-baseline="central">compared</text>
<path class="arr dot" d="M795 110 V138" marker-end="url(#arrow)"/>
<text class="th" x="560" y="246" text-anchor="start" dominant-baseline="central">A model against another's measurement</text>
<text class="ts" x="560" y="266" text-anchor="start" dominant-baseline="central">needs the shared quantities, named</text>
<g><rect class="rec" x="695" y="282" width="200" height="44" rx="6" stroke-width="1"/><text class="th" x="795.0" y="295.0" text-anchor="middle" dominant-baseline="central">Stated correspondence</text><text class="ts" x="795.0" y="314.0" text-anchor="middle" dominant-baseline="central">B's quantity = A's quantity</text></g>
<g class="c-teal"><rect x="560" y="356" width="110" height="56" rx="6" stroke-width="0.5"/><text class="th" x="615.0" y="384.0" text-anchor="middle" dominant-baseline="central">B's conditions</text></g>
<g class="c-purple"><rect x="740" y="356" width="110" height="56" rx="6" stroke-width="0.5"/><text class="th" x="795.0" y="384.0" text-anchor="middle" dominant-baseline="central">A's model</text></g>
<g class="c-teal"><rect x="920" y="356" width="110" height="56" rx="6" stroke-width="0.5"/><text class="th" x="975.0" y="375.0" text-anchor="middle" dominant-baseline="central">B's measured</text><text class="ts" x="975.0" y="394.0" text-anchor="middle" dominant-baseline="central">as printed</text></g>
<path class="arr " d="M670 384 H738" marker-end="url(#arrow)"/>
<text class="ts" x="704" y="372" text-anchor="middle" dominant-baseline="central">run</text>
<path class="arr " d="M850 384 H918" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text class="ts" x="885" y="372" text-anchor="middle" dominant-baseline="central">compared</text>
<path class="arr dot" d="M795 326 V354" marker-end="url(#arrow)"/>
<text class="ts" x="30" y="456" text-anchor="start" dominant-baseline="central">Linked is not checked: a cross-paper check exists only where a relation lets one model run on another's inputs, or a model is run on another's measurement.</text>
<text class="ts" x="30" y="474" text-anchor="start" dominant-baseline="central">A model fitted to that measurement is reported as a fit, not a test. A paper enters the Synthesis when its record is sound; not reproduced is a result.</text>
</svg>
