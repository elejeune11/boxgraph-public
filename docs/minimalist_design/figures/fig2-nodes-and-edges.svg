<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1104" viewBox="0 0 1000 1104" role="img">
<title>Nodes and edges</title>
<desc>The nodes and edges BoxGraph defines, and those ModelAtlas adds. BoxGraph: four kinds of node (source, datum, model, run) and nine kinds of edge, each written as a sentence with an example. ModelAtlas: the model nodes of every paper, five kinds of relation between them, each tested and given a status, and families computed from verified relations.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tl{font-size:12px;fill:#444441;font-style:italic}
.box{fill:#F1EFE8;stroke:#888780}.rec{fill:none;stroke:#888780;stroke-dasharray:1.5 3}.region{fill:none;stroke:#B4B2A9;stroke-dasharray:6 4}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-green>rect{fill:#EAF3DE;stroke:#3B6D11}.c-green>.ts{fill:#27500A}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>.ts{fill:#633806}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D}.c-red>.ts{fill:#791F1F}
rect.added{stroke-dasharray:5 3;stroke-width:1.5}
.arr{stroke:#888780;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}.dot{stroke-dasharray:1.5 3}.head{stroke:#888780}
.line{stroke:#888780;stroke-width:1;fill:none}.pt{fill:#534AB7}.pt2{fill:#993C1D}
@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tl{fill:#D3D1C7}.box{fill:#2C2C2A}
.c-purple>rect{fill:#3C3489;stroke:#AFA9EC}.c-purple>.th{fill:#EEEDFE}.c-purple>.ts{fill:#CECBF6}
.c-teal>rect{fill:#085041;stroke:#5DCAA5}.c-teal>.th{fill:#E1F5EE}.c-teal>.ts{fill:#9FE1CB}
.c-coral>rect{fill:#712B13;stroke:#F0997B}.c-coral>.th{fill:#FAECE7}.c-coral>.ts{fill:#F5C4B3}
.c-green>rect{fill:#27500A;stroke:#97C459}.c-green>.ts{fill:#EAF3DE}
.c-amber>rect{fill:#633806;stroke:#EF9F27}.c-amber>.ts{fill:#FAEEDA}
.c-red>rect{fill:#791F1F;stroke:#F09595}.c-red>.ts{fill:#FCEBEB}.pt{fill:#AFA9EC}.pt2{fill:#F0997B}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="30" y="26" text-anchor="start" dominant-baseline="central">BoxGraph</text>
<text class="ts" x="130" y="26" text-anchor="start" dominant-baseline="central">defines what one paper's record can hold</text>
<text class="tl" x="30" y="58" text-anchor="start" dominant-baseline="central">Nodes</text>
<g><rect class="box" x="30" y="70" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="80.0" y="86.0" text-anchor="middle" dominant-baseline="central">Source</text></g>
<text class="ts" x="30" y="118" text-anchor="start" dominant-baseline="central">where something comes from</text>
<g class="c-teal"><rect x="260" y="70" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="310.0" y="86.0" text-anchor="middle" dominant-baseline="central">Datum</text></g>
<text class="ts" x="260" y="118" text-anchor="start" dominant-baseline="central">a value, table or curve, as printed</text>
<g class="c-purple"><rect x="490" y="70" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="540.0" y="86.0" text-anchor="middle" dominant-baseline="central">Model</text></g>
<text class="ts" x="490" y="118" text-anchor="start" dominant-baseline="central">a model, as the paper states it</text>
<g class="c-coral"><rect x="720" y="70" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="770.0" y="86.0" text-anchor="middle" dominant-baseline="central">Run</text></g>
<text class="ts" x="720" y="118" text-anchor="start" dominant-baseline="central">one run of one model</text>
<text class="tl" x="30" y="150" text-anchor="start" dominant-baseline="central">Edges: where things come from</text>
<g><rect class="box" x="30" y="164" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="80.0" y="180.0" text-anchor="middle" dominant-baseline="central">Source</text></g>
<g class="c-teal"><rect x="300" y="164" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="350.0" y="180.0" text-anchor="middle" dominant-baseline="central">Datum</text></g>
<path class="arr " d="M130 180 H298" marker-end="url(#arrow)"/>
<text class="ts" x="214" y="170" text-anchor="middle" dominant-baseline="central">reports</text>
<text class="ts" x="440" y="180" text-anchor="start" dominant-baseline="central">Paper A prints k = 0.2 /s, on p. 3</text>
<g><rect class="box" x="30" y="208" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="80.0" y="224.0" text-anchor="middle" dominant-baseline="central">Source</text></g>
<g class="c-purple"><rect x="300" y="208" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="350.0" y="224.0" text-anchor="middle" dominant-baseline="central">Model</text></g>
<path class="arr " d="M130 224 H298" marker-end="url(#arrow)"/>
<text class="ts" x="214" y="214" text-anchor="middle" dominant-baseline="central">describes</text>
<text class="ts" x="440" y="224" text-anchor="start" dominant-baseline="central">Paper A states its model as Eq. 2</text>
<g><rect class="box" x="30" y="252" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="80.0" y="268.0" text-anchor="middle" dominant-baseline="central">Source</text></g>
<g class="c-teal"><rect x="300" y="252" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="350.0" y="268.0" text-anchor="middle" dominant-baseline="central">Datum</text></g>
<path class="arr dash" d="M130 268 H298" marker-end="url(#arrow)"/>
<text class="ts" x="214" y="258" text-anchor="middle" dominant-baseline="central">reports, indirectly</text>
<text class="ts" x="440" y="268" text-anchor="start" dominant-baseline="central">Paper B says its k comes from Paper A: recorded, not checked there</text>
<g><rect class="box" x="30" y="296" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="80.0" y="312.0" text-anchor="middle" dominant-baseline="central">Source</text></g>
<g class="c-purple"><rect x="300" y="296" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="350.0" y="312.0" text-anchor="middle" dominant-baseline="central">Model</text></g>
<path class="arr dash" d="M130 312 H298" marker-end="url(#arrow)"/>
<text class="ts" x="214" y="302" text-anchor="middle" dominant-baseline="central">describes, indirectly</text>
<text class="ts" x="440" y="312" text-anchor="start" dominant-baseline="central">Paper B says its model is Paper A's: recorded, not checked there</text>
<text class="tl" x="30" y="356" text-anchor="start" dominant-baseline="central">Edges: how results are produced</text>
<g class="c-teal"><rect x="30" y="370" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="80.0" y="386.0" text-anchor="middle" dominant-baseline="central">Datum</text></g>
<g class="c-coral"><rect x="300" y="370" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="350.0" y="386.0" text-anchor="middle" dominant-baseline="central">Run</text></g>
<path class="arr " d="M130 386 H298" marker-end="url(#arrow)"/>
<text class="ts" x="214" y="376" text-anchor="middle" dominant-baseline="central">input</text>
<text class="ts" x="440" y="386" text-anchor="start" dominant-baseline="central">k is given to the run, as the model's input k</text>
<g class="c-coral"><rect x="30" y="414" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="80.0" y="430.0" text-anchor="middle" dominant-baseline="central">Run</text></g>
<g class="c-purple"><rect x="300" y="414" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="350.0" y="430.0" text-anchor="middle" dominant-baseline="central">Model</text></g>
<path class="arr " d="M130 430 H298" marker-end="url(#arrow)"/>
<text class="ts" x="214" y="420" text-anchor="middle" dominant-baseline="central">applies</text>
<text class="ts" x="440" y="430" text-anchor="start" dominant-baseline="central">the run runs Eq. 2</text>
<g class="c-coral"><rect x="30" y="458" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="80.0" y="474.0" text-anchor="middle" dominant-baseline="central">Run</text></g>
<g class="c-teal"><rect x="300" y="458" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="350.0" y="474.0" text-anchor="middle" dominant-baseline="central">Datum</text></g>
<path class="arr " d="M130 474 H298" marker-end="url(#arrow)"/>
<text class="ts" x="214" y="464" text-anchor="middle" dominant-baseline="central">output</text>
<text class="ts" x="440" y="474" text-anchor="start" dominant-baseline="central">the run produces t = 4.7 s, a predicted value</text>
<text class="tl" x="30" y="518" text-anchor="start" dominant-baseline="central">Edges: how things are built and tuned</text>
<g class="c-purple"><rect x="30" y="532" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="80.0" y="548.0" text-anchor="middle" dominant-baseline="central">Model</text></g>
<g class="c-purple"><rect x="300" y="532" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="350.0" y="548.0" text-anchor="middle" dominant-baseline="central">Model</text></g>
<path class="arr " d="M130 548 H298" marker-end="url(#arrow)"/>
<text class="ts" x="214" y="538" text-anchor="middle" dominant-baseline="central">built from</text>
<text class="ts" x="440" y="548" text-anchor="start" dominant-baseline="central">a model assembled from Eq. 2 computes with it</text>
<g class="c-teal"><rect x="30" y="576" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="80.0" y="592.0" text-anchor="middle" dominant-baseline="central">Datum</text></g>
<g class="c-teal"><rect x="300" y="576" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="350.0" y="592.0" text-anchor="middle" dominant-baseline="central">Datum</text></g>
<path class="arr " d="M130 592 H298" marker-end="url(#arrow)"/>
<text class="ts" x="214" y="582" text-anchor="middle" dominant-baseline="central">tuned to</text>
<text class="ts" x="440" y="592" text-anchor="start" dominant-baseline="central">a value set by hand to match a measurement: comparing them is in-sample</text>
<text class="ts" x="30" y="636" text-anchor="start" dominant-baseline="central">A comparison is a run too: it measures how far two data agree, for a stated purpose, and outputs an assessed datum.</text>
<path class="line" d="M30 672 H970" stroke-dasharray="2 4"/>
<text class="th" x="30" y="702" text-anchor="start" dominant-baseline="central">ModelAtlas</text>
<text class="ts" x="130" y="702" text-anchor="start" dominant-baseline="central">joins the models of every paper</text>
<text class="tl" x="30" y="734" text-anchor="start" dominant-baseline="central">Nodes</text>
<g class="c-purple"><rect x="30" y="746" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="80.0" y="762.0" text-anchor="middle" dominant-baseline="central">Model</text></g>
<text class="ts" x="30" y="794" text-anchor="start" dominant-baseline="central">the same model nodes, from every paper</text>
<rect class="region" x="260" y="746" width="100" height="32" rx="10" stroke-width="1"/>
<text class="th" x="310" y="762" text-anchor="middle" dominant-baseline="central">Family</text>
<text class="ts" x="260" y="794" text-anchor="start" dominant-baseline="central">computed: what verified same-as relations join</text>
<text class="tl" x="30" y="826" text-anchor="start" dominant-baseline="central">Edges: relations between models, each tested and given a status</text>
<g class="c-purple"><rect x="30" y="840" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="80.0" y="856.0" text-anchor="middle" dominant-baseline="central">Model</text></g>
<g class="c-purple"><rect x="300" y="840" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="350.0" y="856.0" text-anchor="middle" dominant-baseline="central">Model</text></g>
<path class="arr " d="M130 856 H298" marker-end="url(#arrow)"/>
<text class="ts" x="214" y="846" text-anchor="middle" dominant-baseline="central">same as</text>
<text class="ts" x="440" y="856" text-anchor="start" dominant-baseline="central">Paper 1's rate law is Paper 2's, in other variables, under a mapping</text>
<g class="c-purple"><rect x="30" y="884" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="80.0" y="900.0" text-anchor="middle" dominant-baseline="central">Model</text></g>
<g class="c-purple"><rect x="300" y="884" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="350.0" y="900.0" text-anchor="middle" dominant-baseline="central">Model</text></g>
<path class="arr " d="M130 900 H298" marker-end="url(#arrow)"/>
<text class="ts" x="214" y="890" text-anchor="middle" dominant-baseline="central">reduces to</text>
<text class="ts" x="440" y="900" text-anchor="start" dominant-baseline="central">Model A becomes Model C in a stated limit, e.g. small force</text>
<g class="c-purple"><rect x="30" y="928" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="80.0" y="944.0" text-anchor="middle" dominant-baseline="central">Model</text></g>
<g class="c-purple"><rect x="300" y="928" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="350.0" y="944.0" text-anchor="middle" dominant-baseline="central">Model</text></g>
<path class="arr " d="M130 944 H298" marker-end="url(#arrow)"/>
<text class="ts" x="214" y="934" text-anchor="middle" dominant-baseline="central">derived from</text>
<text class="ts" x="440" y="944" text-anchor="start" dominant-baseline="central">Model D is derived from Model B</text>
<g class="c-purple"><rect x="30" y="972" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="80.0" y="988.0" text-anchor="middle" dominant-baseline="central">Model</text></g>
<g class="c-purple"><rect x="300" y="972" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="350.0" y="988.0" text-anchor="middle" dominant-baseline="central">Model</text></g>
<path class="arr " d="M130 988 H298" marker-end="url(#arrow)"/>
<text class="ts" x="214" y="978" text-anchor="middle" dominant-baseline="central">scales as</text>
<text class="ts" x="440" y="988" text-anchor="start" dominant-baseline="central">Model E follows Model B's scaling</text>
<g class="c-purple"><rect x="30" y="1016" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="80.0" y="1032.0" text-anchor="middle" dominant-baseline="central">Model</text></g>
<g class="c-purple"><rect x="300" y="1016" width="100" height="32" rx="6" stroke-width="0.5"/><text class="th" x="350.0" y="1032.0" text-anchor="middle" dominant-baseline="central">Model</text></g>
<path class="arr dot" d="M130 1032 H298" marker-end="url(#arrow)"/>
<text class="ts" x="214" y="1022" text-anchor="middle" dominant-baseline="central">approximated by</text>
<text class="ts" x="440" y="1032" text-anchor="start" dominant-baseline="central">a mean-field model approximates a stochastic simulation</text>
<text class="ts" x="30" y="1064" text-anchor="start" dominant-baseline="central">Status: verified, ambiguous, refuted, not verified, pending, unverifiable. Each relation is stated by a paper (with quote and page) or proposed, and labelled.</text>
<text class="ts" x="30" y="1082" text-anchor="start" dominant-baseline="central">Only a verified same-as relation joins a family. A relation joins models, never quantities.</text>
</svg>
