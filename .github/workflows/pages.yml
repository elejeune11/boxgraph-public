name: pages
# Serves site/ (the built overview, copied there by `make site` and committed) with GitHub Pages.
# Enable it once: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [master, main]
    paths: [site/**]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # only the published repository serves the page; a private working copy skips this
    if: endsWith(github.repository, '/boxgraph-public')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
