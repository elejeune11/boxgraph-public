name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install (the exact versions in uv.lock)
        run: |
          python -m pip install uv
          uv sync --locked --extra dev
      - name: Lint
        run: .venv/bin/ruff check boxgraph pipeline tests tools
      - name: Tests
        run: .venv/bin/pytest -q
      - name: Test catalogue is current
        run: .venv/bin/python tools/test_catalog.py --check
      - name: Records validate (structure only; page text is not in git)
        run: |
          for d in records/*/; do
            if [ -f "$d/source.yaml" ]; then .venv/bin/boxgraph validate "$d" --no-run || exit 1; fi
          done
