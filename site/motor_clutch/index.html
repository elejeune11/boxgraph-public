.86 [83.82, 85.9] read by the record's code read from Supp. Fig. 1d","81.21 [80.08, 82.33] read by the record's code read from Supp. Fig. 1d","77.7 [76.62, 78.78] read by the record's code read from Supp. Fig. 1d","74.62 [73.53, 75.72] read by the record's code read from Supp. Fig. 1d","59.65 [58.35, 60.96] read by the record's code read from Supp. Fig. 1d","46.61 [45.33, 47.89] read by the record's code read from Supp. Fig. 1d","35.14 [33.89, 36.38] read by the record's code read from Supp. Fig. 1d","23.78 [22.59, 24.97] read by the record's code read from Supp. Fig. 1d"],"purpose":"reproduction","verdict":"not reproduced"},{"comparison":"cmp_s1d_nc5_t1","computed":"[0.8067, 1.501, 3.668, 5.298, 4.784, 4.193, …]","page":9,"printed":["6.62 [5.311, 7.928] read by the record's code read from Supp. Fig. 1d","6.119 [4.849, 7.389] read by the record's code read from Supp. Fig. 1d","4.31 [2.719, 5.902] read by the record's code read from Supp. Fig. 1d","2.502 [1.232, 3.772] read by the record's code read from Supp. Fig. 1d","1.77 [0.2075, 3.333] read by the record's code read from Supp. Fig. 1d","1.232 [-0.04012, 2.503] read by the record's code read from Supp. Fig. 1d","0.9622 [-0.3177, 2.242] read by the record's code read from Supp. Fig. 1d","1.232 [0.226, 2.237] read by the record's code read from Supp. Fig. 1d","1.232 [0.2196, 2.243] read by the record's code read from Supp. Fig. 1d","0.7312 [-0.3263, 1.789] read by the record's code read from Supp. Fig. 1d","0.7312 [-0.3079, 1.77] read by the record's code read from Supp. Fig. 1d","0.7312 [-0.3378, 1.8] read by the record's code read from Supp. Fig. 1d"],"purpose":"reproduction","verdict":"not reproduced"}],"year":2015},{"authors":["Erin M Craig","Jonathan Stricker","Margaret Gardel","Alex Mogilner"],"by_purpose":{"approximation":{"close":0,"error":0,"no verdict":1,"not reproduced":0,"reproduced":0},"consistency":{"close":0,"error":0,"no verdict":0,"not reproduced":2,"reproduced":1},"fit_quality":{"close":0,"error":0,"no verdict":0,"not reproduced":1,"reproduced":0},"reproduction":{"close":6,"error":0,"no verdict":5,"not reproduced":30,"reproduced":99},"validation":{"close":0,"error":0,"no verdict":0,"not reproduced":0,"reproduced":1}},"checked":{"close":6,"no verdict":6,"not reproduced":33,"reproduced":101},"counts":{"added":7,"comparisons":146,"data":216,"models":10,"questions":31,"references":13,"runs":137},"id":"craig2015","kind":"article","label":"Craig et al. 2015","models":[{"id":"clutch_fields","name":"steady-state myosin density, adhesion density, myosin force and viscous force of the adhesion-clutch model (Eqs. 5-9)","relations":[],"role":"model","variant_of":null},{"id":"clutch_peak","name":"location of the traction peak and the flow speed there, from the steady state of Eqs. 5-9","relations":[],"role":"model","variant_of":null},{"id":"clutch_profile","name":"steady-state actin flow and traction profiles of the adhesion-clutch model (Eqs. 5-9)","relations":[],"role":"model","variant_of":null},{"id":"hill_eq11","name":"Hill-like relation between total traction force and lamellar flow speed (Eq. 11)","relations":[],"role":"model","variant_of":null},{"id":"lambda_estimate","name":"estimate of the dimensionless viscosity lambda from published data (Section 2.2)","relations":[],"role":"model","variant_of":null},{"id":"lamellipodial_width","name":"lamellipodial width from the balance of viscous force and traction near the leading edge (Discussion)","relations":[],"role":"model","variant_of":null},{"id":"network_displacement","name":"actin network displacement over a time interval at a given flow speed (Appendix D, Section 2)","relations":[],"role":"model","variant_of":null},{"id":"tension_viscosity","name":"membrane tension and actin viscosity from traction, lamellipodial width and flow gradient (Discussion)","relations":[],"role":"model","variant_of":null},{"id":"transport_epsilon","name":"size of the actin transport term in the rescaled actin density equation (Appendix D)","relations":[],"role":"model","variant_of":null},{"id":"uniform_flow_eq10","name":"lamellar flow speed for slow uniform flow and uniform myosin force (Eq. 10)","relations":[],"role":"model","variant_of":null}],"of":[],"questions":[{"id":"q_fig4def_lambda","kind":"possible_error","text":"The Fig. 4 caption gives lambda = 3 for all panels \"unless otherwise stated\", and (d)-(f) are \"Same as (a)-(c), except ... b = 0\". At F = 0 the myosin terms vanish, so the F = 0 points of Fig. 4(c) and Fig. 4(f) should coincide; they do not (Fig. 4(f) puts the F = 0 peak much closer to the leading edge, and the F = 0 flow curve of Fig. 4(d) falls off faster than that of Fig. 4(a)). The Fig. 4(f) value at F = 0 lies near the lambda = 1 point of supplemental figure 2(a), which suggests panels (d)-(f) were computed with a lower lambda than the caption states.\n"},{"id":"q_adhesion_bc","kind":"possible_error","text":"The paper states the boundary condition Nadh(0) = 0 (p. 6), but the traction curves of Fig. 4(e) and supplemental figure 2(c) and the adhesion density of supplemental figure 2(e) start from a non-zero value at x = 0, as if Nadh(0) followed the bulk expression exp(-V~/v*) with V~ = 1. The record's model applies the stated condition; at x = 0 only T~ is affected, and no reading is taken at x = 0.\n"},{"id":"q_numerics_scheme","kind":"numerics","text":"The paper solves the time-dependent equations with explicit time stepping and first-order upwind advection on 40 segments until steady state (p. 8), but does not give the time step, the stopping criterion, the difference used for dM/dx in the myosin force and adhesion terms, or how the traction peak is located (grid node or interpolated). The record solves the steady equations of the same upwind discretisation directly, uses central differences for dM/dx (setting dM_scheme) and the grid node of largest traction (setting peak); both are run settings and can be changed.\n"},{"id":"q_neumann_choice","kind":"choice","text":"How the far-end condition dV/dx(L) = 0 is discretised is not stated. The record first used a second-order ghost node, which put the plotted flow and traction near x = 8 um below the curves of supplemental figure 2(b), (c); a first-order condition (V at the last node equal to V at the one before) matches those tails much better, so it was chosen after comparing with the figures and is the setting `neumann: first_order`. Both schemes tend to the same limit as the grid is refined (refinement ref_figS2b_lam3), so the plotted tail values depend on the paper's numerics, not on the model.\n"},{"id":"q_S4a_numerics","kind":"numerics","text":"At the paper's 40-segment grid the traction-peak locations of supplemental figure 4(a) depend on how dM/dx is differenced. With central differences the computed peaks lie 0.3-0.7 um closer to the leading edge than the plotted ones for b >= 40; with backward differences they agree with the figure up to b = 130, but at b = 140-150 that scheme gives an unphysical steady state (negative flow at the peak, since 1 + b F dM/dx can turn negative). Refined grids settle on values between the two. The plotted curve at large b therefore reflects the paper's discretisation rather than Eqs. 5-9 alone.\n"},{"id":"q_hill_curve","kind":"possible_error","text":"The fit curve drawn in supplemental figure 1(c) lies above Eq. 11 evaluated with the printed Vmax = 6.6 nm/s and Fk = 23 nN at every force read (by much more than the reading precision at low force). The drawn curve is consistent with the same Vmax and a smaller Fk; either the printed Fk or the drawn curve does not correspond to the stated fit.\n"},{"id":"q_hill_points","kind":"overstated_claim","text":"Eq. 11 with the printed fit parameters passes through three of the four measured points but not the lowest-force point (10 uM Y-27632), where the measured flow is far below the curve. The text does say the flow is unchanged \"for all but the highest concentrations\" (p. 11); the caption still calls the curve a fit to all four points.\n"},{"id":"q_S2c_near_edge","kind":"unexplained_difference","text":"The traction curves of supplemental figure 2(c) reproduce at their peaks (height v*/e, as the paper states, at the right place) but lie a few percent above the model near the leading edge (x <= 1 um) and, for lambda = 1, in the far tail. With F = b = 0 the model reduces to lambda V'' = exp(-V/v*) V, so only the discretisation, the treatment of x = 0 (question q_adhesion_bc) or an unconverged time-stepping can account for it.\n"},{"id":"q_fig3_parameters","kind":"unstated_input","text":"The model fits of Fig. 3 (blebbistatin, control, CA-Rho Ptk1 cells) are described only qualitatively (\"increasing F\", \"a lower effective viscosity lambda\" for blebbistatin); the parameter values used for the three fits are not printed, so the Fig. 3 model curves are not checked in this record.\n"},{"id":"q_S1de_scales","kind":"unstated_input","text":"The U2OS model fit of supplemental figure 1(d), (e) gives the dimensionless parameters but plots dimensional flow (nm/s) and traction (Pa); the scales V0 and T0 used are not stated, so the fit curves cannot be compared with the model.\n"},{"id":"q_eq10_derivation","kind":"reading","text":"Eq. 10 follows from Eq. 9 with T~ = F~myo = F only if exp(-V~/v*) is close to 1 (V0 << V*) and dM~/dx~ is close to 1 in the lamella; the second condition is not stated. The comparison cmp_eq10_vs_full shows how far Eq. 10 is from the full model at the paper's own U2OS fit parameters.\n"},{"id":"q_L0_two_values","kind":"reading","text":"L0 is fixed at 1 um in the rescaling of the main text (p. 7) but is called the lamellipodial length and set to 2 um in the estimate of epsilon in Appendix D (p. 14). The record keeps both as printed.\n"},{"id":"q_viscosity_units","kind":"reading","text":"The Discussion predicts \"a viscosity value of mu ~ 10^3 pN s um^-2\", with the units of a bulk viscosity, while mu in Eq. 1 is the viscosity times the lamellipodial thickness (p. 8). The record reads the printed value as a bulk viscosity and divides by the thickness (~1 um), which does not change the number.\n"},{"id":"q_discussion_inputs","kind":"unstated_input","text":"The membrane tension (~60 pN/um) and viscosity (~10^3 pN s um^-2) of the Discussion are computed from a traction stress, a lamellipodial width and a flow-rate gradient \"measured in [14]\" that are not printed. The record uses T0 = 20 pN/um^2 (p. 8) and adds the width and the gradient, with alternatives.\n"},{"id":"q_displacement_speed","kind":"choice","text":"Appendix D's \"actin network displacement is but 0.1 um\" over 10 s does not say which flow speed it uses; the record uses the \"characteristic rate of the actin flow is ten nm per second\" of p. 5. The same appendix uses 0.02 um/s in its estimate of epsilon, which would give twice the displacement.\n"},{"id":"q_lambda_estimate_V0","kind":"choice","text":"The estimate T0 L0^2 / V0 ~ 10^3 pN s um^-1 (p. 8) does not name V0; the record uses the ~20 nm/s leading-edge flow of Ptk1 cells printed on the same page.\n"},{"id":"q_error_bars_model","kind":"reading","text":"The traction-peak locations of Fig. 4(c), (f) and supplemental figures 2(a), 4(a) are model results but carry error bars of about +/- 0.2 um that no caption explains (perhaps the grid spacing, 8 um / 40). The readings use them as the printed interval, which makes these comparisons lenient.\n"},{"id":"q_fmyo_analytic","kind":"possible_error","text":"Section 3.3 (p. 10) gives, for slow uniform flow, M~ = 1 - exp(-x~/(gamma V~)) from Eq. 7 and \"the resulting myosin contractile force\" F~myo = F exp(-x~/(gamma V~)). By Eq. 6, F~myo = F dM~/dx~ = (F / (gamma V~)) exp(-x~/(gamma V~)); the printed expression lacks the factor 1/(gamma V~). The same paragraph's \"T~ = F~myo ~ F\" (used for Eq. 10) also needs dM~/dx~ ~ 1, which this M~ does not give for gamma >> 1 (see q_eq10_derivation). No printed number depends on it.\n"},{"id":"q_fig4f_vs_S4a","kind":"possible_error","text":"A second check on q_fig4def_lambda. Supplemental figure 4(a) at b = 0 and Fig. 4(f) at F = 1 are, by their captions, the same model at the same parameters (lambda = 3, F = 1, b = 0, v* = 0.3, gamma = 1000). The plotted peaks differ: about 4.3 um in supplemental figure 4(a), about 2.3 um in Fig. 4(f). The record's model (40 segments) gives 4.2 um at lambda = 3 and 2.4 um at lambda = 1. So supplemental figure 4(a) agrees with the captioned lambda = 3 and Fig. 4(f) does not, which again suggests that panels (d)-(f) used a lower lambda than the caption states. (The two readings are indexed by different quantities, b and F, so the build cannot compare them directly.)\n"},{"id":"q_S3_vstar","kind":"possible_error","text":"The caption of supplemental figure 3 gives v* = 3 (\"F=b=0, v*=3, gamma=1000\"), whereas every other figure of the paper and the text (v* ~ 0.3, p. 7) use v* = 0.3 for the Ptk1 regime. This may be a misprint for 0.3. Supplemental figure 3 is not read in this record, so no comparison depends on it.\n"},{"id":"q_audit_vstar_over_e","kind":"reading","text":"Question q_S2c_near_edge says the traction peaks have \"height v*/e, as the paper states\". The paper (Appendix A.2, p. 12) states only that T~ = exp(-V~/v*) V~ is maximal for V~ = v*; the height v*/e follows from that but is not printed. The claim that is printed is now compared as cmp_vpeak_b0_text.\n"},{"id":"q_S3_figure_vstar","kind":"possible_error","text":"Added by the figure pass, on q_S3_vstar. Supplemental figure 3(a), now read, bears on whether its captioned v* = 3 is a misprint. With F = b = 0 the traction is T~ = exp(-V~/v*) V~ (Eq. 9), at most v*/e (about 1.1 for v* = 3, 0.11 for v* = 0.3). The drawn traction peaks at about 0.11 near x ~ 2 um, which is also the height and place of the lambda = 1 traction curve of supplemental figure 2(c) (F = b = 0, v* = 0.3, gamma = 1000), and the drawn flow looks like the lambda = 1 curve of supplemental figure 2(b). So the figure looks as if it was drawn with v* = 0.3 (and lambda = 1, which its caption does not give), not with the captioned v* = 3. The record compares the figure both with runs at the printed v* = 3 (lambda added as 3) and with runs at the added v* = 0.3, lambda = 1, and directly with the supplemental figure 2 curves. The myosin panels (b), (c) are run at the printed v* = 3 only; with F = 0 their myosin depends on the flow, so they inherit the same doubt.\n"},{"id":"q_fig4gh_vstar","kind":"unstated_input","text":"Fig. 4(g), (h) are computed \"by setting v* >> 1\" (p. 10) without the value. The record uses v* = 1000; once v* is well above the largest V~ (1) the result no longer depends on it, but a value near 1-10 would still weaken adhesion near the leading edge.\n"},{"id":"q_S3_lambda","kind":"unstated_input","text":"The caption of supplemental figure 3 (p. 18) does not give lambda. The record runs it with the added lambda = 3 (the default of Fig. 4 and supplemental figure 4) and, in the alternative runs, lambda = 1 (see q_S3_figure_vstar).\n"},{"id":"q_fig2d_binning","kind":"reading","text":"The two bar charts of Fig. 2(d) are binned differently: the paxillin bars are centred at 0.25, 0.75, ..., 7.75 um, the myosin bars at 0, 0.5, ..., 7.5 um (the first half cut by the axis). The caption does not say how the intensities were binned; the readings index each bar by its drawn centre.\n"},{"id":"q_fig3_markers","kind":"reading","text":"The caption of Fig. 3 calls the adhesion-density markers \"squares\" and the myosin markers \"whiskers\"; the figure draws the adhesion density as filled round dots and the myosin density as light 'x' glyphs on a grey line with a dark dash beside each. The record reads the filled dots as the adhesion density and does not read the myosin series (which mark is the value is not said).\n"},{"id":"q_fig4de_profiles_lambda","kind":"possible_error","text":"Added by the figure pass: the profiles of Fig. 4(d), (e), now read, settle much of q_fig4def_lambda. With the captioned lambda = 3 none of the twelve flow and traction curves is reproduced at any read position; with lambda = 1 (added, lam_fig4def_alt) the curves for F = 0, 4, 6, 8 are reproduced or close at nearly every position, and those for F = 2 and 10 over part of their length. The flow at F = 0 of Fig. 4(d) also equals the lambda = 1 flow of supplemental figure 2(b) (F = b = 0, v* = 0.3). So panels (d)-(f) appear to have been computed with lambda = 1, not the lambda = 3 that the caption states for all of Fig. 4.\n"},{"id":"q_S2d_myosin_offset","kind":"numerics","text":"The myosin density of supplemental figure 2(d) is not reproduced although the flow and traction of panels (b), (c) at the same parameters are: the model's myosin lies slightly below the drawn curves everywhere (e.g. lambda = 2: 0.006 against 0.0096 at x = 0.5 um, 0.229 against 0.234 at 7.5 um), as if shifted by a fraction of a grid cell. With F = 0 the myosin does not act back on the flow, so the difference lies in how the steady myosin equation M~ = 1 - gamma d(V~ M~)/dx~ is discretised (upwind direction, where M~ is stored on the grid), which the paper does not describe (see q_numerics_scheme). The adhesion density of panel (e) is close but often just outside the reading intervals, the same way.\n"},{"id":"q_S4_profiles_large_b","kind":"numerics","text":"At large b the profiles of supplemental figure 4(c)-(f), (h), (i) are not reproduced while those at small b are close: for b = 100 the model's traction peaks at about 0.74 at x ~ 3.5 um, the drawn one at about 0.68 at x ~ 4 um (read at x = 0.5, 1, ...). The peak sharpens with b until it spans one or two of the 40 grid cells, so its height and place depend on the unstated discretisation, as q_S4a_numerics found for the peak positions of supplemental figure 4(a). The traction curve of panel (i) (b = 100) is the b = 100 curve of panel (c): the two are read independently and agree.\n"},{"id":"q_gardel2008_not_a_test","kind":"choice","text":"The PtK1 measurements of gardel2008 (ref. [14]) were not used to validate this record's models. The candidates were clutch_peak (traction-peak location) against gardel2008's Fig. 4 D left (distance of maximal traction from the cell edge per condition, fig4d_distance_data), clutch_peak's flow at the peak against Fig. 4 D right, and clutch_profile against the profiles of gardel2008 Figs. 2 B and 4 C. None is a test: the paper chose its PtK1 parameters by agreement with these same cells (F ~ 10 \"compare well\", gamma ~ 1000 \"good agreement with the data\", v* ~ 0.3 \"to explain the experimental relationship\", pp. 7-8; Figs. 2-3 are the data of [14]), and the per-condition values (F for blebbistatin, control, CA-Rho; the lower lambda for blebbistatin) are not printed (q_fig3_parameters). The profile and flow outputs are moreover in units of V0, T0 and v*, which the paper does not give per cell. A test would need parameters fixed independently of [14] for each perturbation.\n"},{"id":"q_no_validation_chan2008","kind":"unstated_model","text":"Cross-validation against chan2008 (ref. 17, cited only among \"recent modeling studies [16-19]\", p. 3; the paper never says its model explains or is compared with chan2008's data) found no measurement of chan2008 that a model here predicts. chan2008 measured the F-actin retrograde flow rate in neuronal filopodia on polyacrylamide gels of given Young's modulus (Fig. 3C, 3D, S8C), a filopodium's peak traction force and force-to-bead distance (Fig. S10), bead displacement and step-size histograms, failure rates and a scaled surface tension. This record's models describe a lamellipodium and lamellum on an unspecified substrate. clutch_profile, clutch_peak, clutch_fields and uniform_flow_eq10 are dimensionless, V0 and T0 are not printed per cell, and none has a substrate-stiffness input, so they cannot give a filopodial flow in nm/s at a gel modulus. hill_eq11 gives a lamellar flow from a cell's total traction force, with Vmax and Fk fitted to U2OS cells. chan2008's forces are per filopodium (pN) and its flows are filopodial: not the same quantities. lamellipodial_width shares the shape of chan2008/cerruti_force_eq11 (a length from a length and a pressure) only formally. It predicts a lamellipodial width, and chan2008 measures none; its contact-bead distance is a different quantity. The other models give order-of-magnitude scales (lambda, drag, epsilon, tension, displacement) that chan2008 does not measure. In the other direction, see chan2008/q_no_validation_craig2015."}],"takes_from":["gardel2008"],"tally":{"close":6,"error":0,"no verdict":5,"not reproduced":30,"reproduced":99},"title":"Model for adhesion clutch explains biphasic relationship between actin flow and traction at the cell leading edge","variants":[],"venue":"Phys. Biol. 12, 035002","verdicts":[{"comparison":"cmp_eq10_vs_full","computed":"0.6652","page":null,"printed":null,"purpose":"approximation","verdict":"no verdict"},{"comparison":"cmp_fig4f_vs_fig4c_F0","computed":"[2.291]","page":10,"printed":["3.938 [3.706, 4.158] (unstated error bar) read by the record's code read from Fig. 4(c)"],"purpose":"consistency","verdict":"not reproduced"},{"comparison":"cmp_figS3a_T_vs_figS2c_lam1","computed":"[0.06014, 0.08419, 0.1013, 0.1116, 0.1085, 0.09231, …]","page":17,"printed":["0.05687 [0.05589, 0.05785] read by the record's code read from Supplemental figure 2(c)","0.07844 [0.07742, 0.07946] read by the record's code read from Supplemental figure 2(c)","0.09891 [0.09802, 0.0998] read by the record's code read from Supplemental figure 2(c)","0.1095 [0.1091, 0.1098] read by the record's code read from Supplemental figure 2(c)","0.1071 [0.1065, 0.1076] read by the record's code read from Supplemental figure 2(c)","0.09215 [0.09127, 0.09303] read by the record's code read from Supplemental figure 2(c)","0.07095 [0.07001, 0.07189] read by the record's code read from Supplemental figure 2(c)","0.05111 [0.05021, 0.05201] read by the record's c 87, 5.815] read by the record's code read from Supplemental figure 1(c)","5.968 [5.952, 5.983] read by the record's code read from Supplemental figure 1(c)","6.079 [6.063, 6.095] read by the record's code read from Supplemental figure 1(c)","6.192 [6.178, 6.206] read by the record's code read from Supplemental figure 1(c)"],"purpose":"reproduction","verdict":"not reproduced"},{"comparison":"cmp_lambda_estimate","computed":"2","page":8,"printed":"~2","purpose":"reproduction","verdict":"no verdict"},{"comparison":"cmp_tension","computed":"60","page":12,"printed":"~60","purpose":"reproduction","verdict":"no verdict"},{"comparison":"cmp_viscosity","computed":"1.2e+04","page":12,"printed":"~10^3","purpose":"reproduction","verdict":"no verdict"},{"comparison":"cmp_vpeak_b0_text","computed":"0.9801","page":12,"printed":"1","purpose":"reproduction","verdict":"reproduced"},{"comparison":"cmp_width","computed":"2","page":2,"printed":"2 to 4","purpose":"validation","verdict":"reproduced"}],"year":2015},{"authors":["Alberto Elosegui-Artola","Roger Oria","Yunfeng Chen","Anita Kosmalska","Carlos Pérez-González","Natalia Castro","Cheng Zhu","Xavier Trepat","Pere Roca-Cusachs"],"by_purpose":{"consistency":{"close":0,"error":0,"no verdict":0,"not reproduced":0,"reproduced":2},"fit_quality":{"close":0,"error":0,"no verdict":0,"not reproduced":1,"reproduced":0},"reproduction":{"close":0,"error":0,"no verdict":0,"not reproduced":13,"reproduced":14},"validation":{"close":9,"error":0,"no verdict":0,"not reproduced":15,"reproduced":6}},"checked":{"close":9,"no verdict":0,"not reproduced":29,"reproduced":22},"counts":{"added":12,"comparisons":60,"data":168,"models":5,"questions":30,"references":28,"runs":59},"id":"elosegui2016","kind":"article","label":"Elosegui-Artola et al. 2016","models":[{"id":"clutch_no_talin_sim","name":"the clutch model without talin unfolding (talin-depleted cells; Fig. 3d,e blue lines, Fig. 6 dashed lines)","relations":[{"kind":"approximated_by","other":"bangasser2013/motor_clutch_ssa","stated":false,"status":"verified"},{"kind":"approximated_by","other":"bangasser2013b/clutch_ensemble_cycle","stated":false,"status":"not_verified"},{"kind":"approximated_by","other":"chan2008/motor_clutch","stated":false,"status":"not_verified"}],"role":"model","variant_of":null},{"id":"clutch_talin_sim","name":"stochastic molecular clutch model with talin unfolding, refolding and vinculin reinforcement (Supplementary Note)","relations":[{"kind":"derived_from","other":"andreu2021/clutch_stretch_sim","stated":true,"status":"unverifiable"},{"kind":"derived_from","other":"elosegui2014/integrin_clutch_sim","stated":true,"status":"unverifiable"}],"role":"model","variant_of":null},{"id":"talin_unfolding_time","name":"average talin unfolding time under force, from the slip-bond unfolding rate","relations":[],"role":"fit","variant_of":null},{"id":"threshold_sensitivity","name":"threshold rigidity for talin unfolding and its sensitivity S to one parameter (Supplementary Note, p. 25)","relations":[{"kind":"derived_from","other":"bangasser2013/sensitivity_eq3","stated":true,"status":"unverifiable"}],"role":"model","variant_of":null},{"id":"unfold_refold_crossing","name":"force on talin where the unfolding rate becomes faster than the refolding rate","relations":[],"role":"model","variant_of":null}],"of":[],"questions":[{"id":"q_rate_laws","kind":"unstated_input","text":"Supplementary Table 1 gives the integrin off-rate only as \"Catch bond\" and the talin unfolding and refolding rates only as \"Slip bond\"; the Supplementary Note gives their functional forms in words (sum of two exponentials fitted to the Kong et al. 2009 fibronectin-α5β1 Mn2+ data; single exponentials fitted to Yao et al. 2014) but no coefficients. Every model result rests on these laws. The record takes them from the same laboratory's 2021 released code (record andreu2021_code), whose paper says these come from this paper; the code also carries a commented-out second fit of the catch bond (16.67, -1.945e11, 0.001442, 1.356e11), not run here. The Matlab code of this paper is 'available on request' (p. 11) and was not seen.\n"},{"id":"q_low_force_koff","kind":"unstated_input","text":"The note says unbinding rates were \"further increased\" below 1 pN with respect to experimental values, without saying by how much or in what form. The record adds the 'cm' term of the 2021 code (1000 /s at zero force, falling to 10% at 0.15 pN) and runs the alternative of no increase (g = 0); the paper says the change \"only increased the slope at low rigidities\".\n"},{"id":"q_vinculin_rate","kind":"unstated_input","text":"The vinculin binding rate k_vin is named in the Supplementary Note but given no value anywhere (it is not in Supplementary Table 1). Added: 1000 /s (vinculin nearly always wins over refolding, as in the 2021 code where unfolding reinforces at once); alternative 10 /s.\n"},{"id":"q_ksub_conversion","kind":"unstated_input","text":"k_sub and F are converted to Young's modulus and traction \"by assuming a given adhesion radius ra as described previously\" (refs. 1, 2 of the note), with no formula in this paper. Added: traction = F/(π ra²) and k_sub = (4π/9) E ra; alternative k_sub = π E ra. The conversion shifts every model curve along the rigidity axis, so it bears on every comparison against a plotted line.\n"},{"id":"q_step_algorithm","kind":"choice","text":"The note describes the time step only in words. Choices made in the record: binding is drawn before unbinding within a step and a clutch bound in a step is first tested in the next; forces are those at the end of the previous step; a clutch whose talin bound vinculin stays bound and does not unfold again; a clutch that unbinds after its talin bound vinculin does not lower d_int; d_int has no upper bound (none is stated, unlike the later 2021 model which has d_max); the actin speed uses the substrate force of the previous step. Time averages are taken over the whole 100 s including the start (the note does not say whether a transient is discarded).\n"},{"id":"q_no_talin_model","kind":"unstated_model","text":"The predictions \"without talin unfolding\" (Fig. 3d,e blue lines, Fig. 6 dashed lines) are not described separately. The record runs the same clutch model with unfolding switched off, so integrin density stays basal, following p. 4 ('In the absence of talin unfolding, integrins are not recruited, but force is still assumed to be transmitted').\n"},{"id":"q_sensitivity_procedure","kind":"choice","text":"The sensitivity S is defined (p. 25) but the parameter values around the fit, the rigidity grid and whether the 10% density increase is judged on the time-averaged or the final density are not given. Added: factors 0.5, 1 and 2 on the parameter, 13 log-spaced moduli from 0.3 to 30 kPa, time-averaged density, first upward crossing interpolated in log E.\n"},{"id":"q_sensitivity_sign","kind":"unexplained_difference","text":"In the record's model the threshold rigidity falls as nf or kont increase (S about -1.0 for both, mean of three seeds), while Supplementary Table 1 prints +1.66 and +1.49 and the text argues that fewer clutches lower the threshold (p. 6). In the record's model each vinculin-binding event adds d_add to a single density, so more bound clutches mean more reinforcement events; the paper's code may scale reinforcement differently (per clutch, or per adhesion area). The build's verdicts on cmp_S_* report the outcome.\n"},{"id":"q_talin_line_high_rigidity","kind":"unexplained_difference","text":"The record's model with talin unfolding follows the plotted solid lines up to a few kPa but departs from them above the threshold: it overshoots at the stiffest end (Fig. 3d, 40 kPa: about 138 Pa against 126 Pa read; Fig. 6b, c similar) and misses the plateaux of Fig. 6a, e, f around 7-20 kPa. The no-talin model reproduces every plotted no-talin line read (Fig. 3d,e, Fig. 6a-i), and the talin lines of the blebbistatin panels (Fig. 6g-i) reproduce. The likely cause is reinforcement as made runnable here (q_step_algorithm: d_int has no upper bound, the vinculin rate is added), not a misprint; it is left as found.\n"},{"id":"q_dt_numerics","kind":"numerics","text":"Halving and quartering the printed 5 ms time step moves the time-averaged traction by more than the added 5% tolerance, for both models, and moves S for nf by more than 0.2: at the paper's own step the results belong partly to the numerics (each clutch is tested once per step while its unbinding rate can exceed 1/dt at low force). Lengthening the run (100 s to 400 s) does not move them.\n"},{"id":"q_threshold_rigidity","kind":"unexplained_difference","text":"The record's model reaches a 10% rise in integrin density at about 2 kPa, while the measured forces diverge above 5 kPa (p. 2) and the model lines of Fig. 3d separate near 5 kPa. The threshold depends on how the density is judged (time average here; q_sensitivity_procedure) and on the added inputs.\n"},{"id":"q_rate_labels","kind":"possible_error","text":"Supplementary Table 1 labels Kfold \"Talin unfolding rate\" and Kunfold \"Talin refolding rate\": the symbols and their meanings are swapped with respect to the note (kunf unfolding, kfold refolding).\n"},{"id":"q_kc_unit","kind":"reading","text":"The clutch spring constant is printed as 1 nN/nm (1000 pN/nm), far stiffer than the 5 pN/nm of Chan and Odde 2008 that the clutch model is adapted from. It is used as printed; with springs this stiff, almost all of a clutch's load comes from the substrate side.\n"},{"id":"q_fig6k_legend","kind":"possible_error","text":"The legend of Fig. 6k reads \"50 mM\" for the highest GPen dose, which the caption and panel f give as 0.50 mM. Not used in the record (YAP data are left out).\n"},{"id":"q_hidden_points","kind":"reading","text":"Some control points are covered by the talin 2 shRNA marker drawn on top of them (e.g. Fig. 3d at 0.6 and 2.4 kPa, Fig. 3e at 4.7 kPa, several in Fig. 6f-i) and are not read; the readings hold only the points whose markers could be found.\n"},{"id":"q_dashed_hidden","kind":"reading","text":"In most Fig. 6 panels the dashed (no talin) line merges with markers and bars where it leaves the solid line, so its first separate dash lies well to the right of the divergence; positions left of that dash are not read (the solid line reading covers the range where the two coincide).\n"},{"id":"q_fig3_vs_fig6b","kind":"reading","text":"Fig. 6b (reference condition) and Fig. 3d show the same model with the same parameters; both are read and compared with the model separately.\n"},{"id":"q_audit_fig3a_left_out","kind":"reading","text":"Audit (second reader): figures.md leaves Fig. 3a out because its points feed no model run. Fig. 3a holds measured data (FN-αvβ3 lifetimes with s.e.m. bars, measured in this paper) and the blue line of talin unfolding times from ref. 25, plus a dashed \"Threshold\" force; the reading guide asks for every plotted measurement to be read. The blue line is also the only plotted check of the added unfolding law (1/k_unf against force; the note says k_unf was fitted to the ref. 25 data), and the αvβ3 lifetimes are what the note says an equivalent k_off fit could use. Suggest reading Fig. 3a and validating 1/k_unf(f) against the blue line. Not done in this audit (the figure tools could not be run).\n"},{"id":"q_audit_rate_law_alternatives","kind":"reading","text":"Audit (second reader): the catch-bond and talin rate-law coefficients are added without alternatives (validator warnings), though every model verdict rests on them. The second catch-bond fit carried in the 2021 code (16.67 /s, -0.1945 /pN, 0.001442 /s, 0.1356 /pN; q_rate_laws) is a real joint alternative and could be run once as a set; for the talin laws, any pair keeping the 5 pN crossing (p. 5) but with other slopes would test how much the verdicts depend on the 2021 values. Left to the first reader's scope.\n"},{"id":"q_audit_gpen_threshold","kind":"reading","text":"Audit (second reader): the text says GPen gives \"no major change in the threshold rigidity for reinforcement\" (p. 7) while kont and dadd are both lowered (Fig. 6d-f caption). With the printed sensitivities (S_kont 1.49, S_dadd -0.83) the two shifts roughly cancel, so the printed table and text are consistent with each other; the record does not compare this, and with the record's model (S_kont of the opposite sign, q_sensitivity_sign) the two shifts would add instead. A threshold run at the Fig. 6f parameters against the reference would test the claim directly.\n"},{"id":"q_hidden_points_second_pass","kind":"reading","text":"Second pass: where the series of a panel overlap (the low-rigidity points of Fig. 1, 4b, 5b, 6j-l; the dense scatter of Supplementary Fig. 2), markers lying under another series' marker are read only when both their bar caps are visible (value: the caps' midpoint) or at least half of the marker is visible (value: the best template fit, with a widened interval); the rest are not read. These readings hold fewer points than the caption's n lists; a reader comparing at a missing rigidity must go back to the page.\n"},{"id":"q_fig3a_unfolding_fit","kind":"unexplained_difference","text":"The Supplementary Note says k_unf was fitted to the ref. 25 unfolding data, plotted as the blue line of Fig. 3a. With the record's added slip-bond law (andreu2021_code: ln k_unf0 = -7.573, 1.786 /pN), 1/k_unf is about half the plotted unfolding time between 3.5 and 4.5 pN (3.75, 2.40, 0.98, 0.63 s against about 6.9, 4.8, 1.5, 1.2 s read at 3.5, 3.75, 4.25, 4.5 pN) and agrees only within the wide intervals at 4 and 5 pN. Either the 2016 fit differs from the 2021 code's coefficients (they are not printed here, q_rate_laws), or the plotted line is not 1/k_unf of a single exponential. A factor of two in k_unf moves the unfolding/refolding crossing by only about 0.2 pN but shifts every talin-model line. This reading also settles q_audit_fig3a_left_out: Fig. 3a is now read.\n"},{"id":"q_replotted_means","kind":"reading","text":"The Supplementary Fig. 2 means of untransfected control and talin 2 shRNA cells coincide with the Fig. 1a points and the Fig. 4e shRNA bars at the same rigidities (e.g. control at 29 kPa: 137.7 vs 137.4 Pa; shRNA at 5 kPa: 83.3 vs 83.2 vs 83.0 Pa), and the cell numbers agree (control at 29 kPa n = 12 and shRNA at 5 kPa n = 34 in both Fig. 1a and Supplementary Fig. 2; n = 34 for the first shRNA bar of Fig. 4e). The same measurements appear to be re-plotted, so their validations against the clutch models are not independent of the Fig. 1a/3d ones.\n"},{"id":"q_val_elosegui2014_cell_type","kind":"choice","text":"(Cross-validation.) val_traction_myo_ctrl_2014 and val_flow_a5b1_2014 run clutch_talin_sim with the MEF parameters of Supplementary Table 1 on the gels of elosegui2014's myoepithelial cells. Neither paper states nf, nm, dint, kont or ra for those cells (the elosegui2014 Supplementary Table 1 is unreadable in its copy), and neither says this model predicts those measurements. Using MEF values is a choice: a mismatch may come from the cell type rather than the model, and the verdicts test the model's transfer across cell types, not the model on its own cells. Measurements not used: myo b6 tractions and the avb6-mediated series (Fig. 1b blue, 4g-i), which bind through avb6, with kinetics this model does not have; Fig. 1c and 4d, which re-plot or nearly repeat the a5b1 tractions of Fig. 1b; the integrin densities of Fig. 4f, i, l, in arbitrary units, not the model's dint in 1/um^2; and the SPR, bead and recruitment data of Fig. 2, which no model here outputs.\n"},{"id":"q_xval_gong2018_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of gong2018, which cites this paper. gong2018 measures cell spreading areas (Figs. 4D, 5D, 6D, S5A), spreading speeds derived from them (Fig. S7) and the stress relaxation of its gels (Figs. 4B, 5B, S6A). The clutch models here output traction stress, actin retrograde flow and integrin density on purely elastic gels; none gives a spreading speed or area, and none has a viscoelastic substrate, so none, run on gong2018's conditions, gives a quantity it measured."},{"id":"q_xval_kong2009_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of kong2009 (ref. 26, ST1-5, SN-3). The Supplementary Note says the catch-bond k_off(f) was fitted to the fibronectin-a5b1 lifetimes measured with Mn2+ (kong2009 Fig. 3 C, lt_FN_a5b1Fc_Mn), but in this record that rate law is not a model of its own: it is a part of clutch_talin_sim and clutch_no_talin_sim, whose outputs are cell traction, actin flow and integrin density, and its coefficients are added (from andreu2021_code), not printed. No model here outputs a single-bond lifetime versus force, so none, run on kong2009's clamped forces, gives a quantity kong2009 measured; even a lifetime model would be a fit (fit_quality), not a test, for the Mn2+ series. talin_unfolding_time gives talin unfolding times (fitted to ref. 25 data), not integrin-ligand lifetimes. The other kong2009 measurements (lifetimes in other cations and constructs, adhesion frequencies, rupture forces, stiffness, flow cytometry) are not outputs of any model here either."},{"id":"q_xval_chan2008_none","kind":"unstated_input","text":"(Cross-record validation.) No model of this record is validated against a measurement of chan2008 (ref. 4, ST1-3), although this paper says its talin-depleted results \"fully abide\" by chan2008's clutch model (p. 8) and clutch_no_talin_sim has the same shape as chan2008's motor_clutch_E (actin speed from gel modulus, binding rates, stiffnesses and a motor velocity). chan2008 measures F-actin retrograde flow in filopodia of embryonic chick forebrain neurons on 260 Pa to 57 kPa gels (Fig. 3C means, Fig. 3D with SEMs, Fig. S8C), filopodial forces (pN), bead displacement histograms and failure rates. clutch_no_talin_sim and clutch_talin_sim, run with this record's inputs, predict the periphery of a mouse embryonic fibroblast: nf, nm, kont, dadd and FR were adjusted to this paper's MEF tractions (Supplementary Table 1), and ra = 1700 nm is an adhesion's radius. Neither paper states nf, kont, dint, nm or ra for a neuron filopodium (chan2008's nc clutches, kon and koff are not these ports), and whether talin unfolding (clutch_talin_sim) or not (clutch_no_talin_sim) applies to those neurons is stated by neither, so a run would not be on the measurement's own cells. The flows are also of different structures (filopodia there; the cell periphery here, p. 10). chan2008's filopodial forces (pN), the scaled surface tension (dimensionless), bead displacements and failure rates are not outputs of these models (they give traction stress in Pa, actin speed and integrin density). In the other direction, see chan2008/q_no_validation_elosegui2016."},{"id":"q_xval_bangasser2013b_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of bangasser2013b (ref. 33 here). bangasser2013b is a theory paper: its only measured data are the computation times of its ODE and Monte Carlo software (bangasser2013b Fig. 6b), which no model here predicts. Its other plotted values are predictions of its own models, not measurements, so they are no validation target (relating the two clutch models is a model-to-model job). This paper cites ref. 33 only for qualitative trends of the clutch model (p. 6). In the other direction, see bangasser2013b/q_xval_elosegui2016_none."},{"id":"q_xval_bangasser2013_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of bangasser2013 (ref. 32 here), although clutch_no_talin_sim has the same shape as bangasser2013/motor_clutch_ssa. This paper cites ref. 32 only for qualitative trends (p. 6, p. 8). bangasser2013 is a theory paper; the measurements it plots are others' data: normalized migration (Fig. 1A) and normalized traction (Fig. 1B) of U87, smooth muscle, neutrophil, NIH/3T3, neuron, T24 and BAEC cells, which are outputs of no model here (they give traction stress in Pa, not a value normalized to each cell type's maximum); Kong et al.'s a5b1-fibronectin bond lifetimes (Fig. 7C), which no model here outputs (the catch-bond k_off is part of the clutch simulations and its coefficients are added; see q_xval_kong2009_none); and Chan and Odde's neuron filopodial flows (Fig. S1B), the chan2008 measurements for which q_xval_chan2008_none gives the reasons: the clutch models here carry MEF inputs (Supplementary Table 1) that neither paper states for neuron filopodia. In the other direction, see bangasser2013/q_xval_elosegui2016_none."},{"id":"q_xval_andreu2021_none","kind":"reading","text":"(Cross-record validation.) One andreu2021 measurement is a real target for clutch_talin_sim, but it cannot be entered as a checkable validation as the datum is recorded, so none is added. andreu2021 Fig. 1b gives the actin retrograde flow of MEFs on 0.6 kPa polyacrylamide gels coated with 10 ug/mL fibronectin (andreu2021 p. 8): the cell type and coating of this record's reference condition (nf = 1200 at 10 ug/ml, Fig. 6 caption, p. 7). andreu2021 calls it \"indicative of a fast flow caused by low adhesion (and thereby low actin attachment) to the ECM20\" (andreu2021 p. 2; ref. 20 is this paper). This record's MEF parameters were fitted to its own Fig. 3, not to that point, so it would be a validation. But andreu2021/fig1b_flow is one two-entry datum indexed by a condition index (1 = 0.6 kPa gel, 2 = glass), not by substrate rigidity: a scalar run at E = 0.6 kPa cannot be compared with a two-entry table, a sweep cannot take a condition index as E (the two quantities are not the same), and the glass point has no finite rigidity and was measured \"at the very edge of lamellipodia (where adhesion is still very low)\" (andreu2021 p. 2), a state the model does not represent. andreu2021 also holds no datum for the 0.6 kPa rigidity itself. The 0.6 kPa flow becomes checkable if andreu2021 records it as its own datum with the gel rigidity as a condition, which only that record's reader may do; the text's \"~50 nm/s\" (andreu2021 p. 2) is approximate and gets no verdict. Other andreu2021 measurements considered and not used: YAP vs rigidity (Supplementary Fig. 1a) and every YAP ratio, which no model here outputs; paxillin adhesion lengths (Fig. 1e-h, 2c, 4k, Supplementary Fig. 1, 3, 5d), where the models output an integrin density, not a length; and everything measured under substrate stretch, optical-tweezer or AFM loading (Fig. 1e-h, 3, 4, Supplementary Fig. 2, 4, 5), which no model here represents (none imposes substrate motion). The YAP onset at 3.4 kPa (andreu2021 p. 2) is a different quantity from threshold_sensitivity's E_threshold (a 10% rise in integrin density) and is not a datum there. In the other direction, see andreu2021/q_xval_elosegui2016_none."}],"takes_from":[],"tally":{"close":0,"error":0,"no verdict":0,"not reproduced":13,"reproduced":14},"title":"Mechanical regulation of a molecular clutch defines force transmission and transduction in response to matrix rigidity","variants":[],"venue":"Nature Cell Biology 18, 540-548","verdicts":[{"comparison":"con_FR_text_table","computed":"0.073","page":19,"printed":"0.073","purpose":"consistency","verdict":"reproduced"},{"comparison":"con_nf_fig6b_table","computed":"1200","page":19,"printed":"1200","purpose":"consistency","verdict":"reproduced"},{"comparison":"fit_fig3a_unfolding","computed":"[3.751, 2.4, 1.536, 0.9827, 0.6288, 0.2574, …]","page":4,"printed":["6.928 [5.787, 8.069] read by the record's code read from Fig. 3(a)","4.793 [2.639, 6.948] read by the record's code read from Fig. 3(a)","2.713 [1.323, 4.102] read by the record's code read from Fig. 3(a)","1.498 [1.364, 1.632] read by the record's code :"model","variant_of":null},{"id":"mean_field_sls_taus","name":"mean-field motor-clutch model on a standard linear solid, parametrized by tau_s/tau_b at a fixed initial stiffness (Fig. 3A)","relations":[],"role":"model","variant_of":null},{"id":"relative_increase","name":"relative increase of one spreading speed over another","relations":[],"role":"processing","variant_of":null},{"id":"tbind_estimate","name":"binding time of a stable FA, estimated by assuming most clutches become engaged","relations":[{"kind":"same_as","other":"bangasser2013b/tbind_eq23","stated":true,"status":"verified"}],"role":"model","variant_of":null}],"of":[],"questions":[{"id":"q_cycle_end","kind":"choice","text":"The mean-field ODE has no state in which \"all clutches break\": Pb only falls towards zero. The paper does not say when a cycle ends. The record ends it when Pb falls below 1/nc (fewer than one engaged clutch) after its peak, or where the solver stops in the finite-time rupture cascade; a cycle not ended by t_max = 2000 s is a stable adhesion. Refinement ref_break_fig1b varies the threshold."},{"id":"q_reinforcement_rule","kind":"unstated_model","text":"The reinforcement rule is ron = ron0 (1 + alpha (Fa - Fcr)), \"updated in the next FA lifetime cycle\" (SI p. 11). Whether the increase compounds over cycles (the integrin density keeps growing) or is recomputed from ron0 each cycle is not stated; neither is how Fa, \"the average FA force\", is averaged (over time, over engaged clutches, the per-clutch or the total force). The record takes a compounding increase and the time average of the ensemble clutch force kc (xc - xs); the compounding reading is the one under which the lifetime \"would gradually increase and even diverge\" (p. 3). With a non-compounding rule the stiff elastic substrates do not saturate at 120 nm/s."},{"id":"q_cycle_initial_state","kind":"choice","text":"Each cycle starts with all clutches free and the substrate (spring and dashpots) at rest. The paper does not say whether the dashpot keeps its displacement from one cycle to the next; on a slowly relaxing substrate (tau_s longer than a cycle) this changes what the next cycle senses."},{"id":"q_nstart_ensemble","kind":"choice","text":"In Eqs. S5-S7 the ensemble clutch moves with the flow from t = 0 even while Pb is near zero, so its stretch xc - xs is set by the substrate response, not by when clutches bound. The record integrates the equations as printed, starting from Pb = 1e-9 (a setting) because it integrates ln Pb."},{"id":"q_fig2b_high_eta","kind":"unexplained_difference","text":"For ka = 2, kl = 0.1 pN/nm at high viscosity Fig. 2B shows ~118 nm/s, the saturated value; the record's run settles near 100 nm/s, with Fa held at Fcr by the reinforcement feedback. The rigid limit (initial stiffness ka + kl = 2.1 pN/nm) of the elastic run is where the record's Fig. 1B curve is still rising, while the paper's Fig. 1B is already near 110 nm/s at 2 pN/nm: the difference follows the reinforcement rule and the cycle settings (q_reinforcement_rule, q_cycle_initial_state), not a misreading of the figure."},{"id":"q_fig1b_threshold","kind":"unexplained_difference","text":"Below 1 pN/nm the record's Fig. 1B values follow the printed curve; the jump to saturation happens at a higher stiffness in the record than in the paper, where Fig. 1B marks reinforcement as beginning at ~1 pN/nm and SI p. 13 says Fcr = 3 pN \"determines the rigidity (∼1 pN/nm)\" at which it begins. In the record Fa reaches 3 pN only near 1.5 pN/nm, so the paper's Fa is larger than the record's time average by roughly a fifth at 1 pN/nm."},{"id":"q_fb_two_values","kind":"choice","text":"Table S1 gives Fb = 2 pN; the SI text gives 1.3 pN for the mean-field solution and 2 pN for KMC. The record's mean-field runs use 1.3 pN."},{"id":"q_tau_l_symbol","kind":"possible_error","text":"tau_l is written Fm Nm/(vu kl) in the text (p. 5, SI p. 12), Fm Nm/(vp kl) in the Fig. 1A and S8A drawings, and Fs/(v0 kl) in the Fig. 1 caption. vu = Vp = 120 nm/s in Table S1, so the numbers are the same; the symbols are not."},{"id":"q_tau_l_range","kind":"unexplained_difference","text":"The paper prints a tau_l range of 10^-1 s to 10^3 s (p. 8, \"range of 10−1 s to 103 s\"). A range of bare powers of ten cannot be entered as a printed value the build can read, so it is not a datum; the record produces tau_l = Fm Nm/(vu kl) at the two ends of the Table S1 stiffness range (runs run_tau_l_low, run_tau_l_high, added inputs) for a reader to set beside it. The paper does not say which stiffnesses its range corresponds to."},{"id":"q_modulus_conversion","kind":"possible_error","text":"Eq. S9 relates the spring constant to the Young's modulus E (k ≈ 2RE = rE), while the relaxation analysis converts with the relaxation modulus G(t): k(t) ≈ G(t) r (SI p. 12). If G is a shear modulus, E = 3G at nu = 0.5 and the two conversions differ by a factor of 3; the paper uses \"1 pN/nm = 1 kPa\" for both."},{"id":"q_gel_params","kind":"unstated_input","text":"The substrate parameters behind Figs. 4-6 and S8B/C (effective ka, kl, eta of each gel, and the peak heights and timescales used for the multiple-timescale runs) are shown only as markers on heat maps and as spectra; they are not printed as numbers, so 97.2, 101.1, 74.6 and 75.4 nm/s cannot be rerun."},{"id":"q_area_model","kind":"unstated_input","text":"The predicted spreading areas (Figs. 4D, 5D, 6E, S5C) come from Rss = R0 + Vs tau_ss with tau_ss \"chosen\" per cell type (Table S1 gives 100 s to 400 s); the values used for each figure are not printed, and the scaling factor SF = 0.3 enters the alginate case. Not rerun."},{"id":"q_figS4_levels","kind":"unstated_input","text":"The Fig. S4 tables print representative speeds (55, 70, 75, 85, ~120 nm/s) at \"low, medium, and high\" levels of kl and eta; the levels are not given as numbers, so the tables are not rerun."},{"id":"q_fig_reading_cover","kind":"reading","text":"Where the series of Fig. 2B and Fig. S8D lie on top of each other (low viscosity / short tau_s2), the markers underneath are hidden and are not read; those series are compared only where they separate."},{"id":"q_audit_unread_results","kind":"reading","text":"(Audit.) Several plotted results the paper says the mean-field model produces, at parameters the paper prints, are not compared yet: Fig. 3A (p. 5; Vs vs tau_s/tau_b for kl = 10^-2, 10^-1, 10^0 pN/nm at a fixed initial stiffness ka + kl = 1.1 pN/nm, legend and caption), the dash-dotted time averages of Fig. 3C (p. 5; ka = 1, kl = 0.1 pN/nm, eta = 10^-2, 10^0, 10^2 pN s/nm) and of Fig. 1D (p. 3; ka = 1, kl = 0.1, eta = 1, i.e. the run run_fig1_params, whose Vs, t_life and Fa are produced but compared with nothing), and Fig. S3D (p. 16; no reinforcement, kl = 0.1 pN/nm, four ka). Fig. 3A needs a model port in tau_s/tau_b (eta = (tau_s/tau_b) ka / ron0, a choice of tau_b = 1/ron0). The first reader left them \"not read in this pass\"; the audit could not render figure crops in its session and did not add readings. By eye, the Fig. 1D Vs line and the Fig. 3C green (eta = 10^0) line, at the same substrate parameters, do not sit at quite the same height; a reading would say whether the difference exceeds the reading precision."},{"id":"q_eq_s9_symbol","kind":"possible_error","text":"(Audit.) Eq. S9 names the substrate spring constant kc, the symbol the paper uses everywhere else (Table S1, Eq. S5) for the clutch stiffness (5 pN/nm). From the surrounding text it is the substrate stiffness k; the record's model keeps the printed symbol in `equation` and outputs it as substrate_stiffness."},{"id":"q_fig1d_fig3c_means","kind":"reading","text":"(Figures.) Fig. 1D and the green trace of Fig. 3C are at the same substrate parameters (ka = 1, kl = 0.1 pN/nm, eta = 1 pN s/nm; kl of Fig. 3C from the cross in Fig. 3B). Their dash-dotted means read 80.4 [79.3, 81.6] and 82.6 [81.0, 84.1] nm/s: the intervals overlap, so the two figures are consistent at the precision of the reading. The Fig. 3C dash-dotted lines are drawn slightly tilted (about 1 nm/s over their length); the tilt is in the interval."},{"id":"q_figS8_bars_text","kind":"reading","text":"(Figures.) The Fig. S8B-C bars of the effective and multiple-timescale runs read 96.9 [96.2, 97.6] and 101.2 [100.5, 101.9] (PA), 74.5 [73.8, 75.3] and 75.7 [74.7, 76.7] nm/s (HA), consistent with the values printed on p. 13 (97.2, 101.1, 74.6, 75.4). The build cannot compare a figure reading (a table) with a printed scalar, so this check is stated here, not computed."},{"id":"q_figS8_crosses","kind":"unstated_input","text":"(Figures.) The crosses of Fig. S8B-C (right) give the timescales and spectrum heights chosen for the multiple-timescale runs (four for PA, seven for HA; figures.yaml). The paper does not say how a spectrum height H(tau_i) becomes the stiffness ka,i of a Maxwell element (nor kl), so the runs behind 101.1 and 75.4 nm/s still cannot be rerun."},{"id":"q_fig3c_green_mean","kind":"unexplained_difference","text":"(Figures.) At ka = 1, kl = 0.1 pN/nm, eta = 1 pN s/nm the record's run gives a mean speed of 77.7 nm/s, below the Fig. 3C green mean (82.6 [81.0, 84.1], not reproduced) and the Fig. 1D mean (80.4 [79.3, 81.6], close). The red (eta = 10^-2) mean is reproduced and the black (eta = 10^2) one is close (74.0 vs 71.6). Fig. 3A at the neighbouring kl = 0.1, ka = 1.0 is reproduced over the whole tau_s/tau_b range, so the difference is confined to the full-cycle mean of these traces; it is of the size the cycle and reinforcement choices change (q_cycle_end, q_reinforcement_rule)."},{"id":"q_threshold_figS1a_S7","kind":"unexplained_difference","text":"(Figures.) The ODE curve of Fig. S1A and the model curve of Fig. S7 are the reinforced elastic curve of Fig. 1B. The record reproduces them below 1 pN/nm and on the 120 nm/s plateau, but not between about 1.2 and 2 pN/nm, where the paper's curve has already risen (S1A: 80.2 and 109.0 at 1.27 and 2.07 pN/nm, record 71.8 and 94.8; S7: 79.0 and 87.4 at 1.2 and 1.5 pN/nm, record 72.7 and 74.6): the same threshold shift as q_fig1b_threshold, now seen in three figures."},{"id":"q_figS3d_ka10_floor","kind":"unexplained_difference","text":"(Figures.) For ka = 10 pN/nm without reinforcement, Fig. S3D shows about 3 nm/s above the drop; the record's run gives about 5 nm/s (close, not reproduced). Fig. 3A, and S3D for ka = 0.1, 0.5 and 2, are reproduced, so the difference is confined to this nearly stalled regime, where the speed comes from a few very short cycles and depends on when a cycle is ended (q_cycle_end)."},{"id":"q_boxplot_meaning","kind":"reading","text":"(Figures.) Figs. 4D and 5D are box plots, but the captions do not say what the box, the line and the whiskers are (by convention median, quartiles and 1.5 IQR, with outliers as circles). The record reads the line as the value and gives the box and the whiskers as two separate intervals."},{"id":"q_vp_two_values","kind":"unexplained_difference","text":"(Audit.) The Fig. S2 caption gives Vp = 40 nm/s for the spreading-area simulations (Fig. S2E), while Table S1 gives Vp = 120 nm/s and SI p. 3 says all parameters other than the spreading timescale, relaxation timescales and stiffnesses \"are kept constant for all simulations\". The paper does not say why Fig. S2 uses another value. No model in the record uses Vp_figS2."},{"id":"q_xval_chaudhuri2015_none","kind":"unstated_input","text":"(Cross-record validation.) No model of this record is validated against a measurement of chaudhuri2015 (ref. 4). The paper says its model explains the cell spreading areas measured there (Fig. 6D reprints chaudhuri2015 Fig. 3b, U2OS cells on alginate of initial modulus 1.4, 3.4 and 9 kPa), but the record's models give a spreading speed, not an area: the area needs Rss = R0 + Vs tau_ss with the tau_ss, the effective ka, kl, eta of each alginate gel and the scaling factor SF = 0.3, none printed as numbers (q_gel_params, q_area_model). chaudhuri2015 measures no spreading speed, and its other measurements (stress relaxation, G' and G'', AFM moduli, adhesion, YAP, proliferation, stress fibres) are outputs of no model here. The alginate speeds of Fig. S7 (vs_figS7_alg) are derived by this paper from those areas and are already compared here (cmp_figS7_alg)."},{"id":"q_xval_elosegui2016_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of elosegui2016 (ref. 20, SI ref. 4). The paper cites it only for integrin recruitment via talin unfolding (p. 2) and for adjusting Fcr (Table S1); it does not say its model explains or is compared with any of its data. elosegui2016 measures traction stress, actin retrograde flow, adhesion lengths, YAP ratios and fibronectin-integrin bond lifetimes. The mean-field models here output the spreading speed Vs = Vp - Vf, the cycle duration and the mean clutch force Fa: Vs is not the retrograde flow (only related to it through Eq. 6, which no model here outputs as a flow), and Fa, a force per ensemble clutch, is not a traction stress (a conversion would need an adhesion area and clutch counting this paper does not state). bell_off_rate gives an off-rate, not a lifetime, with the generic Table S1 slip-bond roff0 and Fb, not the measured fibronectin-a5b1 catch bond of elosegui2016 Fig. 3a. So no model here, run on those conditions, gives a measured quantity of elosegui2016."},{"id":"q_xval_elosegui2014_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of elosegui2014 (ref. 21). The paper cites it for integrin recruitment into FAs (p. 1) and takes from it the clutch reinforcement rule (\"Following the model developed by Elosegui-Artola et al. (21)\", p. 2); it does not say its model explains or is compared with any of its data. elosegui2014 measures cell traction stress (Pa), actin rearward flow speed, integrin density in adhesions (a.u.) and per membrane area, SPR sensorgrams, bead detachment times and integrin recruitment, in myoepithelial cells on polyacrylamide gels of 0.25-29 kPa. The models here output the spreading speed Vs = Vp - Vf, the cycle duration and the mean clutch force Fa. Vs is not the rearward flow (Vf is not an output, and a flow reconstructed as Vp - Vs would rest on this paper's Table S1 motor and clutch parameters, set for spreading speeds of other cells, not fitted to or stated for myoepithelial cells); Fa, a force per ensemble clutch, is not a traction stress (that needs an adhesion area and clutch count neither paper states); the reinforcement rule changes ron but no model here outputs an integrin density. The Fig. 4 gel moduli (kPa) would also need the Eq. S9 conversion with an unstated contact radius for those cells. bell_off_rate is a generic slip bond, not the FN-integrin rates measured by SPR. So no model here, run on elosegui2014's conditions, gives one of its measured quantities."},{"id":"q_xval_bell1978_none","kind":"reading","text":"(Cross-record validation.) No model of this record is validated against a measurement of bell1978 (ref. 27), which it cites only for the Bell form of the off-rate (p. 2). bell1978 is theory; its only data of origin measured are the adhesive force of about 1 dyne needed to separate cells (from its ref. 52, printed \"~ 1\", an order of magnitude) and the free-sugar concentrations 0.001 and 0.01 M that inhibit agglutination (from its ref. 49), which are conditions, not results. No model here outputs a force to separate cells: mean_field_sls gives a spreading speed, a focal-adhesion lifetime and a mean force per ensemble clutch, with Table S1 parameters set for spreading cells, not for those cell pairs; turning Fa into a force per cell would need numbers of adhesions and clutches neither paper states. No model here involves sugar inhibition, and bell_off_rate (a generic slip bond) has no measured counterpart in bell1978. In the other direction, see bell1978 q_xval_gong2018_none."},{"id":"q_xval_chan2008_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of chan2008 (ref. 15, SI ref. 6). The paper cites it for the canonical motor-clutch model, the Hill relation and the KMC method (pp. 1-2, 4-5, 8); it does not say its model explains or is compared with any of its data. chan2008's measurements are filopodial F-actin retrograde flow rates on polyacrylamide gels (Fig. 3C-D, S8C) and their histograms, bead step and displacement histograms (Figs. 4D, S4, S5, S11D), failure frequencies (Fig. S5D), a scaled surface tension (Fig. 4E), and the peak filopodial force and force-to-bead distance of Fig. S10D (110 ± 25 pN, 150 ± 30 nm). The mean-field models here output the spreading speed Vs = Vp - Vf, the cycle duration and the mean clutch force Fa per ensemble clutch. Vs is not the retrograde flow: Vf is not an output, and a flow rebuilt as Vp - Vs would rest on Table S1 motor and clutch numbers set for spreading cells, not for chick forebrain neuron filopodia, while the gel moduli would need Eq. S9 with a contact radius stated for neither. Fa is not a peak filopodial traction force. boussinesq_eq_s9 has the same shape as chan2008/ksub_eq13 (a stiffness from a length and a modulus), but chan2008 measures no substrate spring constant (its κsub is computed by Eq. 13), and the contact radius R is not its measured bead distance δ. bell_off_rate has no measured counterpart there. In the other direction, see chan2008/q_xval_gong2018_none."},{"id":"q_xval_bangasser2013b_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of bangasser2013b (ref. 16, SI Table S1 ref. 1). The paper takes its motor and clutch parameters from it (Table S1) and cites it for a binding timescale of ~1 s and for the FA lifetime being proportional to tau_l without reinforcement (p. 8); it does not compare any model with its data. bangasser2013b's only measured data are computation times of its ODE and Monte Carlo software (bangasser2013b Fig. 6b), which no model here predicts. Its load-and-fail cycle times, flow rates and optimal stiffnesses, the nearest counterparts of lifetime_timescale and the mean-field Vs, are model predictions, not measurements. In the other direction, see bangasser2013b/q_xval_gong2018_none."},{"id":"q_xval_bangasser2013_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of bangasser2013 (ref. 17). The paper cites it only among the sources of \"the well-known motor-clutch model (15-17)\" (p. 1); it does not compare any model with its data. bangasser2013's measured data are Kong et al.'s a5b1-fibronectin bond lifetimes vs force (Fig. 7C), Chan and Odde's neuron retrograde flow vs substrate modulus (Fig. S1B), and other papers' normalized migration and traction (Fig. 1). None is a quantity a model here outputs: bell_off_rate gives a clutch off-rate, not a bond lifetime, and its slip law cannot express the catch-slip data; the mean-field models output the spreading speed Vs (Eq. 6, Vs = Vp - Vf), not the retrograde flow Vf, and use this paper's fibroblast-scale Table S1 set with reinforcement, not a neuron set; no model gives a normalized migration or traction. Comparing the flow would need a new output (Vf) of mean_field_elastic, which this job may not add. In the other direction, see bangasser2013/q_xval_gong2018_none."}],"takes_from":["bangasser2013b"],"tally":{"close":2,"error":0,"no verdict":1,"not reproduced":0,"reproduced":18},"title":"Matching material and cellular timescales maximizes cell spreading on viscoelastic substrates","variants":[],"venue":"PNAS 115(12), E2686-E2695","verdicts":[{"comparison":"cmp_coef_s9","computed":"2.1","page":12,"printed":"≈ 2","purpose":"approximation","verdict":"no verdict"},{"comparison":"cmp_increase_PA","computed":"4.012","page":13,"printed":"4","p
