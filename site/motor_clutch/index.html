:1}},"checked":{"close":1,"no verdict":1,"not reproduced":0,"reproduced":2},"counts":{"added":0,"comparisons":4,"data":55,"models":2,"questions":17,"references":26,"runs":2},"id":"gardel2008","kind":"article","label":"Gardel et al. 2008","models":[{"id":"switch_speed_by_condition","name":"maximal traction occurs at the same threshold F-actin speed in every perturbation (stated in words)","relations":[],"role":"model","variant_of":null},{"id":"switch_speed_claim","name":"maximal traction occurs at one threshold F-actin speed, whatever the perturbation (stated in words)","relations":[],"role":"model","variant_of":null}],"of":[],"questions":[{"id":"q_threshold_vs_vts","kind":"unexplained_difference","text":"The Abstract puts the switch at a threshold F-actin speed of 8-10 nm/s, but the mean F-actin speed at the time of peak stress in single FAs is printed as 12.7 ± 3 nm/s (Fig. 3 E). The threshold range lies below the mean and overlaps its ± interval only at its upper end (9.7-10 nm/s). The paper does not say how the 8-10 nm/s figure was obtained from Fig. 3 E, Fig. 4 D or Fig. 5 G.\n"},{"id":"q_threshold_midpoint","kind":"choice","text":"The threshold is printed as a range and the run takes its midpoint, 9 nm/s. At 10 nm/s the comparison with 12.7 ± 3 nm/s would be reproduced; at 8 nm/s it would be close. The verdict of cmp_threshold_vs_vts depends on where in the printed range the threshold lies.\n"},{"id":"q_threshold_procedure","kind":"unstated_model","text":"How the threshold speed Vc is computed is not stated. Candidate measurements in the paper are the speed at ts (Fig. 3 E,F), the speed at the >95% stresses (Figs. 1 G, 4 D) and the bounds vs and vw of the inverse and direct correlation ranges (Fig. 5 G, Fig. S3 E,F), which are bounds of ranges, not one speed.\n"},{"id":"q_ts_definition","kind":"reading","text":"ts is defined two ways: in the text as the time of peak stress, estimated as the mean of the top quantile of the stresses measured for each FA (p. 4), and in the Fig. 3 D caption as the time when traction stress exceeds 75% of its maximum. The record treats v(ts) as a speed at peak traction.\n"},{"id":"q_substrate_modulus","kind":"reading","text":"The substrates are \"compliant (1.5-6 kPa)\" on p. 2 without naming the modulus; the Methods give shear moduli G' of ~1,500, 2,800 and ~5,400 Pa, which match the range if it is the shear modulus. A Young's modulus would be about three times G'. Recorded as two quantities.\n"},{"id":"q_figures_not_read","kind":"reading","text":"No figure was read: the figure-rendering commands were refused by the permission settings of the session that built this record. The plotted measurements are therefore missing, among them those that test the threshold claim directly: the speed at maximal traction per condition with its standard deviation (Fig. 4 D, right), vs and vw per condition (Fig. 5 G) and the 26 single-FA points of Fig. 3 E,F. A later reading should add them and compare Fig. 4 D with switch_speed_claim.\n"},{"id":"q_fig5_error_bars","kind":"reading","text":"The error bars of Fig. 5 E-G are not identified (the legend says only that data reflect a mean of >1,000 data points for n = 3 cells); those of Fig. 4 D are standard deviations.\n"},{"id":"q_vts_before_peak","kind":"reading","text":"The Fig. 3 D caption defines ts as the time when traction stress first exceeds 75% of its maximum (the arrow sits on the rising part of the stress trace), so v(ts) is the speed while the FA is still strengthening, before its peak. In the strengthening phase speed falls as stress rises (p. 3), so v(ts) would be expected to lie above the speed at maximal traction. Comparing the threshold Vc with v(ts) as like for like (cmp_threshold_vs_vts) may not be apt; the difference recorded in q_threshold_vs_vts may follow from this definition rather than from an inconsistency.\n"},{"id":"q_not_significant_untested","kind":"overstated_claim","text":"The claim that vs and vw \"were not significantly altered\" across perturbations (p. 5), on which the Abstract's perturbation-independent threshold rests, names no statistical test, and Fig. 5 G has n = 3 cells per condition with error bars that are not identified (q_fig5_error_bars). Read by eye (no verdict), vs (about 10-12.5 nm/s) lies above vw (about 6-8.5 nm/s) in every condition, so the printed 8-10 nm/s threshold falls between the two bounds rather than at either.\n"},{"id":"q_supplement_units","kind":"possible_error","text":"The Fig. S1 legend (p. 8) gives \"50 mM blebbistatin\", while the main text, Methods, Fig. S3 legend and the Fig. S1 panel label give 50 μM. The Fig. S2 legend (p. 9) defines the lamellipodium as points within \"2.7 mm\" of the cell edge and FAs as \"2.7-8 μm\" away. Both look like μ printed as m (the page images show \"mM\" and \"mm\"); recorded as printed, not corrected. Neither value feeds a model.\n"},{"id":"q_fig_s3_va","kind":"possible_error","text":"The Fig. S3 legend says a linear regression \"was calculated for all data with vACT > va\"; va is not defined anywhere in the paper. From context it is probably vs (the speed that bounds the inverse range), but that is not stated.\n"},{"id":"q_fig4d_read","kind":"reading","text":"The figures are now read with calibrated readings (figures.yaml), which answers the gap that q_figures_not_read records. Fig. 4 D right (F-actin speed at maximal traction, mean and SD per condition) is compared with the threshold claim run per condition (cmp_threshold_vs_fig4d, validation). Fig. 5 G (vs and vw per condition, q_not_significant_untested) is read as fig5g_vs and fig5g_vw, and the 26-FA points of Fig. 3 E, F as fig3e_points and fig3f_points.\n"},{"id":"q_fig3ef_point_count","kind":"reading","text":"The caption says the data of Fig. 3 E and F are from 26 FAs, but the two panels do not show the same number of points: Fig. 3 F shows 32 separate dots, and Fig. 3 E shows 27 marker positions (one stack at about 2 min may hide more). Each FA should give one point in each panel. The means and standard deviations of the points read from each panel agree with the printed means of the caption (12.7 ± 3 nm/s, 3 ± 2 min, 65 ± 28 Pa) to within the reading, so the points plotted are probably the ones averaged; the count of 26 is then not that of the points plotted.\n"},{"id":"q_fig3f_axis_zero","kind":"possible_error","text":"The x axis of Fig. 3 F (traction stress at ts) carries a \"0\" at the left frame edge and no \"20\", but the left edge does not lie on the regular grid of the ticks labelled 40-120: by the ticks it sits near 22 Pa. The reading uses the ticks; the mean and SD of the points read this way match the printed 65 ± 28 Pa, and reading the left edge as 0 would not. The \"0\" label looks misplaced.\n"},{"id":"q_figS2d_axis_ends","kind":"possible_error","text":"In Fig. S2 D the axes are labelled only \"0\" and \"1\", with the \"1\" labels at the top and right frame edges, but the evenly spaced ticks put those edges 5.5 tick steps from 0. With ticks of 0.2 the points normalized to exactly 1 (several in each direction) fall on the fifth tick, and the edges are at 1.1. The reading takes the ticks as 0.2 (an added reading choice); read with the \"1\" labels, all values would be about 10% higher and none would reach 1.\n"},{"id":"q_no_validation_elosegui2014","kind":"unstated_model","text":"(Cross-validation.) No model of this record is validated against the measurements of elosegui2014, which cites this paper (its ref. 26) for the inverse force-flow relationship. The models here give the F-actin speed at which local traction stress in a focal adhesion is maximal (actin_speed_at_peak_traction). elosegui2014 measures cell-averaged traction and actin flow speed per substrate stiffness in breast myoepithelial cells (Figs. 1, 4). It has no datum of the flow speed at maximal traction. Its flow readings (Fig. 4e, h, k) are the flow at a given gel, a different quantity. Reading the flow at the gel of peak traction would be a new derived value, which neither paper prints, and the measurements are on a different scale (whole cell across gels, not grid points within FAs) in a different cell type. Neither paper says the threshold claim predicts the 2014 measurements.\n"},{"id":"q_xval_bangasser2013b_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of bangasser2013b, and no model of bangasser2013b is validated against this record's measurements. The models here give the F-actin speed at which traction stress is maximal (actin_speed_at_peak_traction). The only measured data of bangasser2013b are computation times of its ODE and Monte Carlo solvers (Fig. 6b), which no model here predicts. bangasser2013b cites this paper only for the order of magnitude of the unloaded motor velocity (~0.1 um/s, its p. 9). This paper invokes the \"molecular clutch\" only as a qualitative hypothesis (p. 1) and states no motor-clutch parameters. See bangasser2013b/q_xval_gardel2008_none for why its clutch ODEs are not run on the measurements here."}],"takes_from":[],"tally":{"close":0,"error":0,"no verdict":0,"not reproduced":0,"reproduced":0},"title":"Traction stress in focal adhesions correlates biphasically with actin retrograde flow speed","variants":[],"venue":"J. Cell Biol. 183(6), 999-1005 (Report), with Supplemental Material","verdicts":[{"comparison":"cmp_threshold_vs_gaussian_mean","computed":"9","page":3,"printed":"~8","purpose":"consistency","verdict":"no verdict"},{"comparison":"cmp_threshold_vs_peak_range","computed":"9","page":3,"printed":"8 to 12","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_threshold_vs_vts","computed":"9","page":4,"printed":"12.7 ± 3","purpose":"consistency","verdict":"close"},{"comparison":"cmp_threshold_vs_fig4d","computed":"[9, 9, 9, 9]","page":5,"printed":["10.39 [7.151, 13.63] (SD bar) read by the record's code read from Fig. 4 D, right","9.343 [4.849, 13.92] (SD bar) read by the record's code read from Fig. 4 D, right","9.814 [4.642, 15.1] (SD bar) read by the record's code read from Fig. 4 D, right","11.92 [7.466, 16.46] (SD bar) read by the record's code read from Fig. 4 D, right"],"purpose":"validation","verdict":"reproduced"}],"year":2008},{"authors":["Fang Kong","Andrés J. García","A. Paul Mould","Martin J. Humphries","Cheng Zhu"],"by_purpose":{"consistency":{"close":5,"error":0,"no verdict":0,"not reproduced":6,"reproduced":3}},"checked":{"close":5,"no verdict":0,"not reproduced":6,"reproduced":3},"counts":{"added":0,"comparisons":14,"data":80,"models":2,"questions":25,"references":15,"runs":0},"id":"kong2009","kind":"article","label":"Kong et al. 2009","models":[{"id":"series_bonds","name":"two bonds in series dissociate at the sum of their rates","relations":[],"role":"model","variant_of":null},{"id":"survival_first_order","name":"first-order dissociation seen in a ln(number of events) versus t plot","relations":[],"role":"model","variant_of":null}],"of":[],"questions":[{"id":"q_no_model_fits","kind":"reading","text":"The paper fits no bond-lifetime model to its data: it prints no equation, no fitted parameter and no model curve. Its results are the measured lifetime-versus-force curves themselves, and its models are stated in words (bonds in series; first-order dissociation in Fig. S5) to interpret them. The Bell model is named only as the assumption of earlier force-ramp analyses that \"precluded catch bonds\" (p. 5). So nothing in this record is a reproduction of a printed model result; the catch-bond curves are recorded as measurements, for models in other records to be validated against.\n"},{"id":"q_series_model_not_run","kind":"choice","text":"The paper uses the series-bond rule (the chain breaks at the sum of the two dissociation rates) only qualitatively: to argue that above 30 pN in Mg2+/EGTA and Mn2+ the FN-a5b1 bond must outlive the Fc-GG-7 bond, and that in Ca2+/Mg2+ the true FN-a5b1 lifetimes differ more than Fig. 3 shows. It prints no number computed with it. The model is recorded and runnable, but not run: its inputs exist only as plotted curves (circles and squares at different forces), and the lifetime of the FN-a5b1 bond alone, which it would need, is never measured. The rule also assumes each bond dissociates at one first-order rate, which Fig. S5 suggests the FN-a5b1-Fc bond does not.\n"},{"id":"q_s5_not_read","kind":"choice","text":"The first-order rule behind Fig. S5 (the negative slope of ln(number of events) versus t is an off rate) is recorded but not run. The paper prints no slope or off rate from these plots; it reads them only for their shape (several line segments for FN-a5b1-Fc, one line for a5b1-Fc-GG-7). Fig. S5 is left unread: its points are hundreds of overlapping coloured circles per panel, and no printed result rests on them.\n"},{"id":"q_broken_axis_9","kind":"reading","text":"In Figs. 3 B and C the y axis is broken; the label 9 sits at the break and its tick is merged with the break mark, so the lower segment is calibrated on the ticks 0, 3 and 6 only (they lie 557-558 px apart at 1200 dpi, equally spaced), and the upper segment on 16 and 24. Whether 9 belongs to the lower or the upper segment is not clear from the figure; no circle lies between 9 and 16, so no value depends on it, but the upper ends of the error bars near the peak (27.5 pN in B, 32.8 pN in C) reach into the break and are read on the lower segment.\n"},{"id":"q_marker_centre","kind":"reading","text":"Open triangles are read at their centroid, not at the centre of their bounding box (half an inradius higher). The joining lines meet at the centroid, and with it the triangles replotted in Figs. 5 and 6 fall on the circles of Figs. 3 and 5 at the same forces to within about 0.01 s; with the bounding box centre they would sit about 0.09 s higher. The choice is labelled here because the replot comparisons themselves support it.\n"},{"id":"q_hidden_error_bars","kind":"reading","text":"Many SEM bars are shorter than the marker and hidden inside it (mostly at low and high force); their interval is reported as at most the marker, and a bar seen on one side only is mirrored. A few bars run into a neighbouring marker or under the grey Fc/GG-7 curve, and are read where they meet it; the reading notes say which. Where no cap is found at the end of a stem, the end's interval is widened by 60 px outward. One end is known to be read short: the lower bar of the Fig. 3 C circle at 32.8 pN runs on under the grey error bar of a square to a cap near 6.4 s, of which only the left half shows; the code stops near 7.1 s (its widened interval reaches about 6.8 s).\n"},{"id":"q_fig6_partial_replot","kind":"reading","text":"Fig. 6 C replots only \"some of the data from Fig. 5 C\": the triangles below about 7 pN are hidden under the circles of the antibody curve, and the comparison is made from 10 to 45 pN, where the replotted triangles are visible. In Fig. 6 A the lowest-force triangle is likewise hidden.\n"},{"id":"q_replot_close","kind":"reading","text":"The replotted series agree with their originals at every force read (10-45 pN); the few points judged \"close\" rather than \"reproduced\" differ by 1-2 px, about 0.01-0.02 s. The verdict counts only the original's reading interval, not the replot's own (comparable) reading interval, so this is agreement within reading precision, not evidence that the replots differ.\n"},{"id":"q_fcgg7_cations","kind":"unstated_input","text":"The Fc-GG-7 control curve (squares) is drawn unchanged in all three cation panels of Figs. 3 and 5; the paper does not say in which cation condition it was measured, or whether it was pooled.\n"},{"id":"q_overlap_artefacts","kind":"reading","text":"In three panels a spot where several outlines overlap matches a marker's shape as well as a real marker does; the reading code excludes these small regions by name (see the comments in its files) after checking the overlays. The Fig. 3 C circles at 32.8 and 37.9 pN are partly covered by the grey squares drawn over them and are found with a lower outline threshold.\n"},{"id":"q_high_force_overlap_overstated","kind":"overstated_claim","text":"The paper's conclusion about where the chain breaks rests on two statements: that the Fig. 3 B and C circle curves become \"indistinguishable\" from the grey Fc/GG-7 curve above 30 pN (p. 3, and the Fig. 3 caption, where they \"overlap\"), and that the Fig. 5 A-C circle curves \"coincided\" with it above 25 pN \"in all three cation conditions\" (p. 5). Read as lines at the same forces, the curves are not the same. In Fig. 3 B the circles lie below the squares at every force from 35 to 50 pN (for example about 2.2 s against 3.1 s at 40 pN). In Fig. 3 C they lie above the squares at 35 pN and below them at 45 pN. In Fig. 5 A (Ca2+/Mg2+) they lie well above them (about 7.8 s against 5.3 s at 35 pN, and 4.8 s against 3.1 s at 40 pN). In Fig. 5 C they agree at 30-35 pN and lie below the squares above that. The verdicts count only the reading intervals, not the SEM bars. The paper may mean \"within SEM\", and at some forces the bars do overlap. But in Fig. 5 A at 35-40 pN, and in Fig. 3 B at 37 pN, the SEM bars of circle and square do not overlap on the page.\n"},{"id":"q_schematic_figure_refs","kind":"possible_error","text":"On p. 6 the P1D6 and HFN7.1 arrangements are referred to as \"Fig. 3 A, schematic\" and \"Fig. 3 B, schematic\". Those schematics are in Fig. 4 A and B; Fig. 3 A and B have no schematic. These look like misprinted figure numbers. No value depends on them.\n"},{"id":"q_measured_plots_left_out","kind":"reading","text":"The second reader disagrees with leaving out the measured bar charts and histograms: the adhesion frequencies of Fig. 2 A-D and Figs. S2 B-D (mean +- SEM), the rupture-force histograms of Fig. S2 A, the stiffness of Fig. S3 B-C (mean +- SEM in three lifetime bins, which the text describes as lifetimes \"clustered around 0.3, 2.8, and 10 s\", p. 6), and the running and adhesion frequencies of Fig. S4. The reading guide asks for every plot of measured data, whether or not a model in the record uses it. The first reader left them out because no model in the paper uses them (figures.md). These figures are not read yet. The three printed lifetimes (0.3, 2.8 and 10 s) are not recorded as data either.\n"},{"id":"q_s5_threshold_strict","kind":"reading","text":"The survival plot is described with \"lifetime >t\" in the main text (p. 8, checked on the page image; again in Materials and methods, p. 9) but with \"lifetime >= t\" in the Fig. S5 caption (p. 14). The model uses >=, as in the caption. For a continuous lifetime the two give the same line, so this changes nothing unless the plots are read.\n"},{"id":"q_s5_tails_read","kind":"choice","text":"Fig. S5 is now read (second figure pass), but only in part: in each series the circles that stand clear of the other circles of their colour, mostly the long-lifetime tail (ln N below about 3), and a few tops of clusters. The dense stacks at short lifetimes, where single circles cannot be told apart, are not read. Every circle read lies at the ln of a whole number to within its reading interval, which checks the calibration and the circle finding. The reading cannot settle q_s5_threshold_strict: with \">= t\" the circle at ln N = 0 sits at the longest lifetime, with \"> t\" at the second longest, and the lifetimes themselves are not printed. The first-order model is still not run: the paper prints no slope, intercept or off rate for these plots, and a fit would be the record's own result.\n"},{"id":"q_s3c_third_bin_lifetime","kind":"unexplained_difference","text":"The third stiffness bin of Fig. S3 C is labelled 13.4 (s) under its bar (checked on the page image), while the text that cites the figure says the lifetimes were clustered around 0.3, 2.8 and 10 s (p. 6). The first two agree. \"Clustered around\" may be loose wording, or one of the two numbers a slip; the paper does not say which is the bin's average.\n"},{"id":"q_fig2_binding_above_20pc","kind":"unexplained_difference","text":"The text says binding was kept infrequent (<20%) so that most adhesions are single bonds, by using progressively lower GG-7 coatings in Ca2+/Mg2+, Mg2+/EGTA and Mn2+ (p. 3, citing Fig. 2 B and D). The readings of Fig. 2 show specific adhesion frequencies above 0.2 in three bars: 0.23 (SEM bar 0.20-0.26) for FN/a5b1-Fc in Ca2+/Mg2+ at 100 ug/ml GG-7 (Fig. 2 B, closed bar 1), 0.22 for FN/a5b1-Fc in Mn2+ at 15 ug/ml GG-7 (Fig. 2 A, bar 3) and 0.38 for FN/tra5b1-Fc in Mn2+ at 100 ug/ml GG-7 (Fig. 2 C, bar 3). All of Fig. 2 D (tra5b1-Fc at the coatings it names) stay below 0.2. The paper does not say which coating each lifetime experiment of Figs. 3-6 used, so whether those experiments met the <20% requirement cannot be told from the record.\n"},{"id":"q_stiffness_unit","kind":"reading","text":"The y axes of Fig. S3 B and C (molecular stiffness) print no unit. Stiffness is defined as the force increase divided by the extension increase of force (pN) versus extension (nm) curves (Fig. S3 A), so the record takes pN/nm; the paper does not state the unit.\n"},{"id":"q_figure_pass_2_choices","kind":"reading","text":"Reading choices of the second figure pass. Bars are read at the centre line of their top edge (the outline is centred on the value, as the x axis is on the 0 tick); a filled bar's hidden outline is taken as thick as the open bars' in the same panel. Error bars hidden in a closed or hatched bar are the mirror of the visible upper half. In Fig. 2 A the top tick (0.3) merges with the end of the axis line and is not used; the three others fit with a misfit of 0.3 px. Fig. S2 A is a histogram of 5-pN bins with the closed bar in the left half and the open in the right: x is the drawn bar's centre, and a bin without a bar (a zero) is not reported. In Fig. S4 A the squares (one per repeat) overlap into a band; it is read at its centre with an interval of half the band less half a square, from 40 repeats on (before that single squares at k/n are drawn too close to the axis to separate by repeat). In Fig. S4 B the first square is cut by the y axis; its centre is taken half a square left of its right edge.\n"},{"id":"q_xval_elosegui2016_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of elosegui2016, which cites this paper. The two models here, stated in words, give the mean lifetime of two bonds in series from the lifetimes of each alone, and ln(number of events) versus lifetime for a first-order dissociation. elosegui2016 measures cell tractions, actin flow, adhesion lengths, nuclear YAP, talin and integrin readouts on gels, and FN-avb3 single-bond lifetimes (its Fig. 3a) without the lifetimes of component bonds or event counts; none of these is an output of either model run on elosegui2016's conditions."},{"id":"q_xval_elosegui2014_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of elosegui2014, which cites this paper (its ref. 12) only as the source of the FN-a5b1 koff/force catch-bond curve its clutch model uses. The two models here give the mean lifetime of two bonds in series from the lifetime of each alone, and ln(number of events) versus lifetime for a first-order dissociation. elosegui2014 measures SPR sensorgrams and fitted kont/koff of purified integrins, membrane integrin densities, bead detachment times under 0.5 nN magnetic-tweezers force on cells, integrin recruitment to beads, and cell tractions, actin flows and adhesion integrin densities on gels; it prints neither the lifetimes of component bonds in series nor counts of dissociation events. None of these is an output of either model run on elosegui2014's conditions."},{"id":"q_xval_bell1978_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of bell1978, and no bell1978 model is validated against this record's lifetime measurements. Here Bell (1978) is cited only for the exponential force dependence of the off rate that \"precluded catch bonds\" (p. 5), and the measured lifetimes are said to \"deviate from the Bell model\" (p. 6). That is a qualitative statement about the shape of the curve: no Bell parameters (tau0, E0, gamma) are given or fitted for the FN-a5b1 bond, and bell1978 states none for it. See bell1978 q_xval_kong2009_none. bell1978's only measurements (about 1 dyne to detach a cell, from its ref. 52, and inhibiting sugar concentrations) are outputs of neither model here. The series-bond rule needs the lifetimes of two component bonds, and the first-order survival line needs event counts."},{"id":"q_xval_andreu2021_code_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of andreu2021_code, which takes its integrin off-rate from this paper's lifetimes (koffcb.m, case 'mn' fitted to the Mn2+ curve of Fig. 3 C). andreu2021_code's measurements are nuclear/cytoplasmic YAP ratios and paxillin adhesion lengths of cells under cyclic stretch; the series-bond rule needs the lifetimes of two component bonds and the first-order survival line needs event counts, and neither gives YAP ratios or adhesion lengths. In the other direction no andreu2021_code model outputs a mean lifetime at constant force (see andreu2021_code/q_xval_kong2009_none)."},{"id":"q_xval_bangasser2013_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of bangasser2013, which cites this paper (its ref. 32) and fits its catch-slip Eq. 9 to the Fig. 3 A lifetimes (entered there as bangasser2013/val_lifetime_kong_fig3a, fit_quality). bangasser2013's measured data are these same lifetimes redrawn in its Fig. 7C (bangasser2013/tau_kong_fig7c, this record's own measurement, not an independent one) and Chan and Odde's retrograde flow rates (its Fig. S1B). The series-bond rule needs the lifetimes of two component bonds and the first-order survival line needs event counts; bangasser2013 prints neither, and neither model gives a flow rate."},{"id":"q_xval_andreu2021_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of andreu2021, which cites this paper (its ref. 39) for the catch-bond integrin off-rate of its clutch model. andreu2021 measures cells under cyclic stretch and on gels: nuclear/cytoplasmic YAP, paxillin adhesion lengths, cell area, actin flow, bead speed, force, loading rate and stiffness under magnetic tweezers, apparent Young's modulus by AFM, and gel strain calibrations. It prints no single-bond lifetime, no lifetimes of component bonds in series and no counts of dissociation events. The series-bond rule needs two component lifetimes and the first-order survival line needs event counts, and neither gives any quantity andreu2021 measured. In the other direction, see andreu2021/q_xval_kong2009_none."}],"takes_from":[],"tally":{"close":0,"error":0,"no verdict":0,"not reproduced":0,"reproduced":0},"title":"Demonstration of catch bonds between an integrin and its ligand","variants":[],"venue":"J. Cell Biol. 185(7), 1275-1284","verdicts":[{"comparison":"cmp_fig3b_vs_FcGG7_above30","computed":"[4.014, 2.158, 1.57, 0.911]","page":6,"printed":["5.294 [5.17, 5.417] read by the record's code read from Fig. 5 A","3.052 [3.005, 3.098] read by the record's code read from Fig. 5 A","2.146 [2.11, 2.181] read by the record's code read from Fig. 5 A","1.498 [1.463, 1.533] read by the record's code read from Fig. 5 A"],"purpose":"consistency","verdict":"not reproduced"},{"comparison":"cmp_fig3c_vs_FcGG7_above30","computed":"[6.102, 3.18, 1.712, 1.546]","page":6,"printed":["5.294 [5.17, 5.417] read by the record's code read from Fig. 5 A","3.052 [3.005, 3.098] read by the record's code read from F  read from Fig. 3 C","6.959 [6.929, 6.99] read by the record's code read from Fig. 3 C","6.102 [6.04, 6.165] read by the record's code read from Fig. 3 C","3.18 [3.143, 3.217] read by the record's code read from Fig. 3 C","1.712 [1.699, 1.725] read by the record's code read from Fig. 3 C"],"purpose":"consistency","verdict":"close"},{"comparison":"cmp_fig6b_replot_vs_fig3c","computed":"[0.5969, 1.518, 2.905, 5.029, 6.979, 5.984, …]","page":4,"printed":["0.6072 [0.5864, 0.628] read by the record's code read from Fig. 3 C","1.531 [1.505, 1.557] read by the record's code read from Fig. 3 C","2.912 [2.876, 2.948] read by the record's code read from Fig. 3 C","5.035 [4.99, 5.08] read by the record's code read from Fig. 3 C","6.959 [6.929, 6.99] read by the record's code read from Fig. 3 C","6.102 [6.04, 6.165] read by the record's code read from Fig. 3 C","3.18 [3.143, 3.217] read by the record's code read from Fig. 3 C","1.712 [1.699, 1.725] read by the record's code read from Fig. 3 C"],"purpose":"consistency","verdict":"close"},{"comparison":"cmp_fig6c_replot_vs_fig5c","computed":"[1.418, 6.065, 9.54, 11.26, 8.315, 5.392, …]","page":6,"printed":["1.432 [1.315, 1.549] read by the record's code read from Fig. 5 C","6.064 [5.95, 6.178] read by the record's code read from Fig. 5 C","9.538 [9.467, 9.608] read by the record's code read from Fig. 5 C","11.26 [11.18, 11.34] read by the record's code read from Fig. 5 C","8.321 [8.239, 8.403] read by the record's code read from Fig. 5 C","5.403 [5.324, 5.482] read by the record's code read from Fig. 5 C","2.632 [2.553, 2.711] read by the record's code read from Fig. 5 C","0.9526 [0.9198, 0.9853] read by the record's code read from Fig. 5 C"],"purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_stiffness_bin1_label_vs_text","computed":"0.3","page":6,"printed":"0.3","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_stiffness_bin2_label_vs_text","computed":"2.8","page":6,"printed":"2.8","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_stiffness_bin3_label_vs_text","computed":"13.4","page":6,"printed":"10","purpose":"consistency","verdict":"not reproduced"}],"year":2009},{"authors":["Benjamin Bangasser"],"by_purpose":{"reproduction":{"close":1,"error":0,"no verdict":0,"not reproduced":5,"reproduced":5}},"checked":{"close":1,"no verdict":0,"not reproduced":5,"reproduced":5},"counts":{"added":0,"comparisons":11,"data":41,"models":2,"questions":19,"references":3,"runs":11},"id":"odde_code","kind":"software","label":"Bangasser, code 2010","models":[{"id":"mc_event_port","name":"the code's event-stepping (Gillespie) motor-clutch model, motorclutch2_3.m (Python port)","relations":[{"kind":"approximated_by","other":"bangasser2013/motor_clutch_ssa","stated":false,"status":"not_verified"},{"kind":"approximated_by","other":"bangasser2013/motor_clutch_ssa","stated":false,"status":"verified"},{"kind":"approximated_by","other":"bangasser2013/motor_clutch_ssa","stated":false,"status":"verified"},{"kind":"approximated_by","other":"bangasser2013/motor_clutch_ssa","stated":false,"status":"verified"},{"kind":"approximated_by","other":"bangasser2013b/clutch_ensemble_cycle","stated":false,"status":"verified"},{"kind":"approximated_by","other":"bangasser2013b/clutch_ensemble_cycle","stated":false,"status":"verified"},{"kind":"approximated_by","other":"chan2008/motor_clutch","stated":true,"status":"not_verified"},{"kind":"approximated_by","other":"chan2008/motor_clutch","stated":true,"status":"not_verified"}],"role":"model","variant_of":null},{"id":"optimum_port","name":"optimal stiffness from the code's stiffness sweep (motorclutch2_3.m, Python port; minimum located by us)","relations":[],"role":"model","variant_of":null}],"of":["bangasser2013","bangasser2013b","chan2008"],"questions":[{"id":"q_params_vs_chan","kind":"reading","text":"The code's header says it reduplicates \"the Chan Motor-Clutch model\", but motorclutch2_3.m does not use Chan and Odde's Table S1 set: nm = nc = 50 (Chan 75), kon = 0.3 /s (Chan 1), Kc = 0.8 pN/nm (Chan 5). These are exactly Bangasser et al. 2013's base set (Table 1, which the build checks), a set that paper says was fit to Chan and Odde's data and whose Kc was \"assigned based on experimental data for the spring constant of integrins\". So the code is the Bangasser 2013 simulation; to compare it with Chan and Odde the record runs it with Chan's four values copied in."},{"id":"q_mixed_set_1_1","kind":"choice","text":"motorclutch1_1.m runs a set that matches neither paper: kon = 1 /s as Chan and Odde, but nm = nc = 50 and Kc = 0.8 pN/nm as Bangasser et al. 2013 (whose kon is 0.3), on Ksub = 1 pN/nm. No paper prints a result for this set, so its run (run_11) is not compared. The script only plots one trajectory and a histogram/hazard analysis of the cycle times."},{"id":"q_sign_convention","kind":"reading","text":"The code writes vu, Fm and Fb negative (retrograde motion and clutch tension negative), as Chan and Odde's Table S1 does; Bangasser et al. 2013 print them positive. The links in cited.yaml say so (negated). The outputs of the port turn the plotted quantities positive as the code's plots do (vel = -vf, line 138; traction plotted as -avtrac, line 164)."},{"id":"q_gain","kind":"unstated_model","text":"Both scripts carry a feedback term that no paper describes: the off-rate is koff exp(Fc/(Fb + gain Fc)) (motorclutch2_3.m line 96), and motorclutch1_1.m also computes an unused Fbe = Fb + gain Ksub xsub (line 67). With gain = 0, as written in both, it reduces to the papers' koff exp(Fc/Fb) and has no effect; it is entered as an input so the port stays the code."},{"id":"q_run_length","kind":"choice","text":"The code fixes the number of events (1e5 per stiffness in motorclutch2_3.m), not the simulated time, so the simulated time varies with stiffness: about 8200 s at 0.01 pN/nm and 3400 s at 100 pN/nm for the base set, 700-1900 s at Chan's set. Chan and Odde run 300 s; the paper records of Bangasser et al. 2013 use 1000 s as the reader's choice. The averages include the start-up from all clutches free. The record refines the event count (x2, x4) on the base set."},{"id":"q_seed","kind":"choice","text":"The code draws MATLAB rand without a seed and makes one run per stiffness. The port cannot reproduce MATLAB's stream: it uses numpy with seeds and the build's replicates (5 seeds; 3 for the four runs at the stiffnesses of Chan and Odde's Fig. 1D, to keep the build short), so single runs differ from the code's, their distribution does not."},{"id":"q_update_order","kind":"reading","text":"In the code the flow and the traction of an interval are computed from the substrate position before its event (lines 119-120), and after the event every engaged clutch, including one that has just bound, moves by vf dt over the whole interval (line 122); the clutch that just unbound does not move. The papers describe the step as \"engaged clutches advance by v_f Δt\" without saying whether the clutch that bound at the end of the interval counts. The port follows the code; the order is part of what the comparisons test."},{"id":"q_cycle_definition","kind":"reading","text":"The code's cycle time is the mean interval between states with no engaged clutch, found by exact equality subpos == 0 (line 142), counting from the initial state at t = 0. The paper (Fig. 6D) does not say how its cycle time was computed; the code gives one definition."},{"id":"q_kens_not_in_code","kind":"unstated_model","text":"The code computes the mean number of engaged clutches (avnumcon, line 146) but not the ensemble clutch stiffness Kc avnumcon that Bangasser et al. 2013 plot in Fig. 6B; the port adds that product."},{"id":"q_optimum_method","kind":"choice","text":"The code sweeps 10 stiffnesses (logspace(-2,2,10), 0.44 decade apart) and plots retro; it does not locate the optimum. The record locates it by the least grid value and a parabola in log10(Ksub) through it and its neighbours, at the code's grid and at 2x and 4x as many points. On the code's own grid the base-set optimum is pulled away from the paper's dashed line, which lies between two grid points (0.077 and 0.22 pN/nm); the finer grids show where the code's curve has its minimum. The base-set optimum moves from about 0.098 to 0.117 pN/nm on refining and settles there, still below the 0.137 ± 0.007 read off Bangasser's Fig. 2C. The n = 25 optimum settles near 0.37 pN/nm against the printed 0.4. Whether the dashed line marks a fitted minimum, a grid point or a finer sweep is not said."},{"id":"q_chan_algorithm","kind":"unexplained_difference","text":"Run with Chan and Odde's Table S1 values (nm = nc = 75, kon = 1 /s, Kc = 5 pN/nm), the ported event-stepping code reproduces Bangasser et al. 2013's Fig. S1A curve, which that paper presents as its own event-stepping simulation of Chan's parameters. It does not reproduce Chan and Odde's Fig. 1D. On soft substrates (0.5-2 pN/nm) the flow is about half of Chan's (34 vs 76 nm/s at 0.5 pN/nm), and the traction is about twice Chan's on the soft side (about 93-112 vs 47-55 pN). The curves meet only on stiff substrates. So the code is not the algorithm behind Chan's printed figure, although its header says it reduplicates the Chan model. Chan's time-stepped scheme (5 ms steps), or something else unstated, gives different results at the same parameters. Neither paper says which is right; the record only finds that they differ."},{"id":"q_initial_dt","kind":"reading","text":"Both scripts move the engaged clutches by vf times 0.005 s before the loop (motorclutch1_1.m lines 43-48, motorclutch2_3.m line 66), the comment saying \"(dt=0.005)\", Chan and Odde's 5 ms time step. No clutch is engaged at t = 0, so it moves nothing; motorclutch1_1.m stores it as timestep(1), which no average uses. A remnant of the time-stepped model."},{"id":"q_not_ported","kind":"reading","text":"Not entered: the outputs the code computes but no paper prints (velcv, rebcyc, avcough, avtime, avsubpos, binds, failures in motorclutch2_3.m; Fcdist, cdisp1, ndisp1, texp, cndisp in motorclutch1_1.m, the last two plotted only on commented-out lines 172-174), and the plots, including the survival, density and hazard analysis of the cycle times (motorclutch1_1.m lines 143-166)."},{"id":"q_legend_swapped","kind":"possible_error","text":"motorclutch1_1.m plots plotyy(lo,S,lo,pdf), S(t) on the left axis and pdf(t) on the right, but labels them legend('pdf(t)','S(t)'), the other way round. It affects only the figure the script draws."},{"id":"q_xval_chan2008_scope","kind":"choice","text":"chan2008 measured flow, force and failures against a gel's Young's modulus; the code's model takes a substrate spring constant in pN/nm. The only gels with a spring constant produced in chan2008 are 260 Pa and 57 kPa (ksub_260_pred, ksub_57k_pred: Eq. 13 with the fitted Δ = 277 nm, an input added in that record), so the two validations use the Fig. 3C means on those gels. Both are entered as fits (fit_quality), because Δ was fitted so that the model's flow matches the measured flows of Fig. 3D (SOM p. 18). The model is run at Chan and Odde's Table S1 set, as in run_chan_1d. It is not run at the code's own base set (motorclutch2_3.m, Bangasser et al. 2013's Table 1, which that paper says was fit to Chan and Odde's data): the spring constant Bangasser et al. gave each of Chan's gels is in neither record. Not used: the Fig. 3D points with SEMs (v_fig3d_exp_sem) and the Fig. S8C bars, which are curves indexed by modulus and cannot be swept through a model input in pN/nm without a spring constant for each read modulus (the 260 Pa and 57 kPa points of Fig. 3D are the Fig. 3C means again). v_stiff_text is \"~110\", which gets no verdict. T_max_fig is a peak force, which the port does not output. failures_figS5D: see q_xval_chan2008_failures."},{"id":"q_xval_chan2008_failures","kind":"unstated_model","text":"The port outputs a failure frequency (failfreq: states with no engaged clutch per second), and Chan and Odde say their measured failure frequency rises with stiffness \"as predicted by the model\" (SOM p. 14). The two are not entered as the same quantity. The measured failures are positive 1 s bead steps larger than 30% of the trace's maximal displacement, a criterion that also counts large partial releases and is limited by the 1 s sampling. The model counts complete releases, with no time resolution. Neither paper links the two definitions, and the paper claims only the trend, not the rates. The measurement is also indexed by modulus (260, 730, 1300 Pa), and neither record gives a spring constant for 730 or 1300 Pa."},{"id":"q_xval_chan2008_algorithm","kind":"unexplained_difference","text":"Chan and Odde's time-stepped model was fitted (through Δ) to agree with these measured means. The event-stepping port differs from that model on soft substrates at the same parameters (q_chan_algorithm), and the 260 Pa gel's spring constant falls on the soft side. So the two validations ask whether the fit carries over to the code's algorithm; whatever their verdicts are, they do not test Δ."},{"id":"q_xval_bangasser2013b_none","kind":"choice","text":"No validation of the code's models against bangasser2013b's measurements was entered. That paper is theory: it compares its master-equation ODEs with Monte Carlo simulations and has no experimental data. Its only `measured` values are the computation times of its Fig. 6(b), how long the authors' ODE solver and Monte Carlo software ran (fig6b_ode_cal, fig6b_mc1_cal, fig6b_mc100_cal). Neither mc_event_port nor optimum_port outputs a computation time. t_total is simulated time, not run time. A run time belongs to a machine and an implementation, not to the motor-clutch model, so it is not predicted by the port. The paper's Monte Carlo optimum at nm = nc = 25 (0.4 pN/nm) is a prediction. The record already compares it as a reproduction (ksopt_mc_n25_b13b, cmp_b13b_opt_n25), not as a validation. odde_code itself holds no measurements, so there is nothing for bangasser2013b's models to be validated against either (bangasser2013b/q_xval_odde_code_none)."},{"id":"q_xval_bangasser2013_none","kind":"choice","text":"No validation of the code's models against bangasser2013's measurements was entered. That paper's measured data are all from other works, redrawn in its figures. (1) Fig. S1B, Chan and Odde's six neuron flow means (v_figS1b_measured): the flow is mc_event_port's v_retro, and the code's motorclutch2_3.m set is the base set that bangasser2013 \"fit to the embryonic chick forebrain neuron data from Chan and Odde\" (Fig. S1 legend), so it could only be a fit. But the curve is indexed by Young's modulus (substrate_modulus, kPa), and the port takes a spring constant in pN/nm: a sweep would cross two different quantities, and neither paper states the conversion (bangasser2013 q_xval_chan2008_ksub). The paper also draws the four soft points at 0.5-0.6 times the moduli chan2008 prints (bangasser2013 q_xval_chan2008_figS1b_positions). The 260 Pa and 57 kPa means of the same data are already entered as fits against chan2008's own Fig. 3C (val_c08_v260, val_c08_v57k). (2) Fig. 7C, Kong et al.'s integrin lifetimes against force (tau_kong_fig7c): the port outputs no bond lifetime, and its off-rate is a slip bond koff exp(Fc/Fb), not the catch-slip Eq. 9 fitted to these points. The shared shape of bangasser2013/catch_slip_eq9 and mc_event_port (a time from forces and rates) is a relation between models, left to the job that relates them. (3) Fig. 1B normalized tractions (neurons, T24, BAEC) and Fig. 1A normalized migration (U87, SMC, neutrophils, NIH/3T3): the port gives a mean traction in pN, not a cell's traction normalized to its maximum, and no migration; the cell types other than neurons have no parameters in either record, and all are indexed by modulus. These show trends (stiffness optima) that the model reproduces only qualitatively. odde_code holds no measurements, so nothing is there for bangasser2013's models to be validated against (bangasser2013 q_xval_odde_code_none)."}],"takes_from":["bangasser2013","bangasser2013b","chan2008"],"tally":{"close":1,"error":0,"no verdict":0,"not reproduced":5,"reproduced":5},"title":"Motor-clutch model with event stepping (MATLAB scripts motorclutch1_1.m and motorclutch2_3.m, Odde lab)","variants":[],"venue":"Odde lab website (University of Minnesota), code released with Chan and Odde 2008 and Bangasser et al. 2013","verdicts":[{"comparison":"cmp_b13_fig2b","computed":"[28.86, 33.04, 38.61, 38.62, 31.91, 16.19, …]","page":null,"printed":["28.79 ± 0.80","32.84 ± 1.19","38.54 ± 0.99","38.74 ± 0.99","32.01 ± 1.73","16.12 ± 1.42","11.46 ± 0.80","10.03 ± 0.80","9.32 ± 0.80"],"purpose":"reproduction","verdict":"reproduced"},{"comparison":"cmp_b13_fig2c","computed":"[85.37, 80.35, 73.66, 73.66, 81.71, 100.6, …]","page":null,"printed":["85.31 ± 1.00","80.48 ± 1.55","73.68 ± 1.28","73.60 ± 1.28","81.58 ± 2.25","100.42 ± 1.69","106.10 ± 1.55","108.04 ± 1.00","108.95 ± 1.28"],"purpose":"reproduction","verdict":"reproduced"},{"comparison":"cmp_b13_fig6b","computed":"[23.88, 21.82, 16.9, 8.956, 3.28, 1.86, …]","page":null,"printed":["23.73 ± 2.89","21.81 ± 1.79","16.71 ± 1.81","8.82 ± 1.44","3.31 ± 0.49","1.86 ± 0.23","1.76 ± 0.14"],"purpose":"reproduction","verdict":"reproduced"},{"comparison":"cmp_b13_fig6d","computed":"[59.95, 33.36, 23.99, 16, 8.973, 6.898, …]","page":null,"printed":["57.73 ± 2.46","33.80 ± 5.43","24.42 ± 4.32","16.12 ± 3.00","9.65 ± 0.87","6.76 ± 1.59","4.18 ± 1.77","2.28 ± 1.67","0.51 ± 0.77","0.28 ± 0.77"],"purpose":"reproduction","verdict":"reproduced"},{"comparison":"cmp_b13_figS1a","computed":"[46.84, 42.05, 33.78, 28.88, 42.57, 91.12, …]","page":null,"printed":["46.58 ± 1.01","41.92 ± 1.17","33.79 ± 1.21","28.99 ± 1.17","42.21 ± 2.56","91.07 ± 2.00","103.41 ± 1.17","106.92 ± 1.13","108.61 ± 1.07","109.23 ± 1.07"],"purpose":"reproduction","verdict":"reproduced"},{"comparison":"cmp_b1 :249,"data":514,"models":17,"questions":40,"references":22,"runs":254},"id":"bangasser2013","kind":"article","label":"Bangasser et al. 2013","models":[{"id":"binding_time_eq10","name":"ensemble clutch binding time (Eq. 10)","relations":[{"kind":"derived_from","other":"bangasser2013b/optimum_eq30","stated":true,"status":"unverifiable"},{"kind":"approximated_by","other":"bangasser2013b/tbind_eq22","stated":true,"status":"verified"},{"kind":"approximated_by","other":"bangasser2013b/tbind_eq23","stated":true,"status":"verified"},{"kind":"reduces_to","other":"erdmann2004/lifetime_eq8","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"catch_slip_eq9","name":"catch-slip off-rate of a clutch bond (Eq. 9) and the bond lifetime it implies","relations":[{"kind":"reduces_to","other":"bell1978/lifetime_eq16","stated":false,"status":"verified"},{"kind":"reduces_to","other":"bell1978/loaded_reverse_rate","stated":true,"status":"unverifiable"},{"kind":"reduces_to","other":"chan2008/off_rate_eq1","stated":false,"status":"verified"},{"kind":"reduces_to","other":"chaudhuri2015/bell_off_rate","stated":false,"status":"verified"},{"kind":"reduces_to","other":"erdmann2004/single_bond_rate","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"motor_clutch_ssa","name":"stochastic motor-clutch model simulated with the Gillespie SSA (Eq. 1 and the Supporting Material algorithm)","relations":[{"kind":"derived_from","other":"andreu2021/clutch_stretch_sim","stated":true,"status":"unverifiable"},{"kind":"approximated_by","other":"bangasser2013b/clutch_ensemble_cycle","stated":true,"status":"verified"},{"kind":"approximated_by","other":"bangasser2013b/clutch_ensemble_cycle","stated":true,"status":"verified"},{"kind":"derived_from","other":"bell1978/loaded_reverse_rate","stated":true,"status":"unverifiable"},{"kind":"approximated_by","other":"chan2008/motor_clutch","stated":true,"status":"not_verified"},{"kind":"derived_from","other":"chan2008/motor_clutch","stated":true,"status":"unverifiable"},{"kind":"derived_from","other":"elosegui2014/integrin_clutch_sim","stated":true,"status":"unverifiable"},{"kind":"approximated_by","other":"elosegui2016/clutch_no_talin_sim","stated":false,"status":"verified"},{"kind":"approximated_by","other":"gong2018/mean_field_sls","stated":false,"status":"not_verified"},{"kind":"approximated_by","other":"odde_code/mc_event_port","stated":false,"status":"not_verified"},{"kind":"approximated_by","other":"odde_code/mc_event_port","stated":false,"status":"verified"},{"kind":"approximated_by","other":"odde_code/mc_event_port","stated":false,"status":"verified"},{"kind":"approximated_by","other":"odde_code/mc_event_port","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"nc_limits","name":"stalled and free-flowing limits of the number of clutches (definitions of p. 3)","relations":[],"role":"model","variant_of":null},{"id":"nc_multiplier_eq5","name":"multiplier c that takes the base clutch number to a given clutch number (Eq. 5 solved for c)","relations":[],"role":"processing","variant_of":null},{"id":"optimal_stiffness","name":"optimal substrate stiffness of the motor-clutch model (minimum of retrograde flow over κsub)","relations":[{"kind":"approximated_by","other":"bangasser2013b/clutch_ensemble_optimum","stated":true,"status":"verified"}],"role":"model","variant_of":null},{"id":"range_eq2","name":"range value R of a parameter or multiplier (Eq. 2)","relations":[],"role":"processing","variant_of":null},{"id":"scale_Fb_eq5","name":"clutch bond rupture force multiplied by a fold change (Eq. 5 applied to Fb)","relations":[],"role":"processing","variant_of":null},{"id":"scale_Fm_eq5","name":"motor stall force multiplied by a fold change (Eq. 5 applied to Fm)","relations":[],"role":"processing","variant_of":null},{"id":"scale_kc_eq5","name":"clutch spring constant multiplied by a fold change (Eq. 5 applied to kc)","relations":[],"role":"processing","variant_of":null},{"id":"scale_koff_eq5","name":"clutch unloaded off-rate multiplied by a fold change (Eq. 5 applied to koff)","relations":[],"role":"processing","variant_of":null},{"id":"scale_kon_eq5","name":"clutch on-rate multiplied by a fold change (Eq. 5 applied to kon)","relations":[],"role":"processing","variant_of":null},{"id":"scale_nc_eq5","name":"number of clutches multiplied by a fold change (Eq. 5 applied to nc)","relations":[],"role":"processing","variant_of":null},{"id":"scale_nm_eq5","name":"number of motors multiplied by a fold change (Eq. 5 applied to nm)","relations":[],"role":"processing","variant_of":null},{"id":"scale_vu_eq5","name":"motor unloaded velocity multiplied by a fold change (Eq. 5 applied to vu)","relations":[],"role":"processing","variant_of":null},{"id":"sensitivity_eq3","name":"sensitivity value S as the slope of log optimal stiffness against log parameter (Eq. 3)","relations":[{"kind":"derived_from","other":"elosegui2016/threshold_sensitivity","stated":true,"status":"unverifiable"}],"role":"processing","variant_of":null},{"id":"sr_eq4","name":"sensitivity-range value SR = S x R (Eq. 4)","relations":[],"role":"processing","variant_of":null}],"of":[],"questions":[{"id":"q_sim_length","kind":"choice","text":"The paper does not print how long each simulation ran, whether an initial transient was discarded, or how many runs were averaged. The record simulates 1000 s per point (100 s for the 2000-clutch runs of Fig. 7A, to keep each call short), averages over the whole run, and repeats each run with 5 seeds. The simulated time is refined (ref_t_fig2_nc50, ref_t_fig7a_minus_clutch)."},{"id":"q_ssa_details","kind":"reading","text":"The SSA is given as eight steps in words (Supporting Material). Details taken from Chan and Odde 2008 (ref. 15) or read from the steps: a newly bound clutch starts unstretched at the substrate position; the flow of step 5 uses the substrate deformation before the step-7 force balance and moves engaged clutches over the event time just elapsed; off-rates are held fixed between events (first-reaction method, Eq. 1). The force balance and force-velocity law are not written in this paper; they are Chan and Odde's Eqs. 3-5."},{"id":"q_optimum_search","kind":"choice","text":"The paper does not say how the optimal stiffness was located (grid of κsub, simulated time, smoothing). The record scans 0.001-100 pN/nm at 4 points per decade and fits a parabola in log κsub through the lowest point and its neighbours, for each seed; S uses the mean optimum over seeds. The grid density is refined (ref_grid_opt_base). Only S for kon is recomputed from simulations; the other printed S values are compared only with each other and with the text."},{"id":"q_cycle_definition","kind":"unstated_model","text":"The load-and-fail cycle time of Fig. 6C-D is not defined beyond the substrate trajectories of Fig. 6C. The record counts one cycle each time the last engaged clutch lets go (the substrate returns to zero), and divides the simulated time by that count. On stiff substrates this counts frequent single-clutch releases as cycles."},{"id":"q_tbinding","kind":"unexplained_difference","text":"Eq. 10 with the base set (nc = 50, kon = 0.3 /s) gives a binding time about twice the dashed 'Binding Time' line of Fig. 6D, which lies near 7 s by eye (the line is close to the bottom of the plot, not near 15 s). The plotted line would follow from Eq. 10 with a larger kon or fewer clutches (Chan and Odde's kon = 1 /s with nc = 75 also gives a value near the plotted one), or the figure may use another definition. The crossing of this line with the cycle-time curve is the paper's explanation of the optimum, so which binding time was plotted matters for that claim."},{"id":"q_fig6b_axis_unit","kind":"possible_error","text":"The right axis of Fig. 6B, which carries the ensemble clutch stiffness and the substrate spring constant, is labelled 'Spring constant (nm/s)'. A spring constant is a force per length; the record reads the axis in pN/nm, the unit of the bottom axis that the dashed substrate line reproduces one to one."},{"id":"q_text_motor_list","kind":"possible_error","text":"The text lists the motor parameters as '(Fm, nc, vu)' (p. 4); nc is a clutch parameter (Table 1), and nm, the number of motors, is missing from the list. Probably nm was meant."},{"id":"q_log_base","kind":"reading","text":"Eqs. 2 and 4 write 'log' without a base. The record reads base 10, as the paper interprets R as 'the maximum allowable order of magnitude change' and SR as an order-of-magnitude change, and because the printed R values follow from the Fig. S2 limits in base 10."},{"id":"q_lifetime_from_rate","kind":"unstated_model","text":"Fig. 7C plots the catch-slip model as a bond lifetime against force, fitted to the lifetimes of Kong et al.; the paper does not write how a lifetime follows from Eq. 9. The record takes the mean lifetime under constant force as 1/koff*."},{"id":"q_eye_readings","kind":"reading","text":"The model's printed results are plotted only. In this reading the figure tools (page rendering at high resolution, calibrated readings by code) could not be run, so these values were read by eye from the 110 dpi page images and recorded as approximate. They get no verdict; their comparisons keep the differences. A calibrated reading of Figs. 2B-C, 6B, 6D, 7A and 7C would turn them into checks with verdicts."},{"id":"q_sr_rounding","kind":"unexplained_difference","text":"Four printed SR values miss S x R of the printed S and R by one unit in the last digit (verdict 'close'): kon, nc and koff in Fig. 3B, and Fb-koff in Fig. 5C. The printed S and R are rounded, so SR was presumably computed from unrounded values; with R recomputed from the Fig. S2 limits the Fb-koff product rounds to the printed 4.5. Not a sign of an error, but the printed tables are not exactly reproducible from each other."},{"id":"q_stall_transient","kind":"numerics","text":"For the stalled system (nc = 300) on the softest substrate (0.01 pN/nm), the run starts from an unloaded substrate and needs a long time to load it to the motors' stall force; averaged over the 1000 s run, the mean flow stays near 10 nm/s and the traction near 92 pN, while Fig. 2 shows about 1 nm/s and 100 pN. Whether the paper discarded an initial transient is not stated (q_sim_length); the stiffer points agree with the figure."},{"id":"q_tables_from_image","kind":"reading","text":"The S, R and SR tables of Fig. 3B and Fig. 5A-C are images with no extracted text; their numbers were read from the 110 dpi page images (they are legible there). The Fig. S2 limits have extracted text and agree with the image."},{"id":"q_fig5_full_reading","kind":"reading","text":"The audit entered every Fig. 5A-C cell (51 more pairs and the diagonals), read from the 110 dpi page image of p. 6 because the figure tools could not be run in the audit either. The digits are legible and the three tables agree with each other and with Fig. S2 to the last digit in almost every cell, which supports the reading; but a one-unit misreading of a last digit (e.g. 0.66 vs 0.67 in Fig. 5B row vu, column kon, where the Fig. S2 limits give 0.669) cannot be excluded. A calibrated rendering of p. 6 would settle the cells whose comparison is not 'reproduced'."},{"id":"q_opposite_direction_convention","kind":"reading","text":"Below the diagonal (opposite directions, Eqs. 7-8) the paper does not say which parameter of a pair is multiplied by c and which is divided. Rows Fm and nm are otherwise nearly identical in Figs. 5A and S2, but in column nc they differ: Fm-nc has S = -1.6 with limits 2.7 / 0.67, while nm-nc has S = +1.6 with limits 1.5 / 0.37, i.e. the reciprocal limits and the opposite sign of S. This is what one gets if c multiplies nc in one cell and Fm (or nm) in the other, so the convention seems not to be the same in every cell. R and SR are unaffected in size, but the sign of S and SR below the diagonal cannot be interpreted without the convention."},{"id":"q_kc_rounding","kind":"unexplained_difference","text":"For κc alone, Fig. 3B prints S = 0.0 and SR = 0.0, while the same single-parameter cells of Fig. 5A and 5C print -0.02 and -0.05. -0.05 lies exactly on the edge of what 0.0 allows at one decimal (cns_SR_kc_5c passes only at that boundary), and S x R = -0.02 x 3.0 = -0.06, not the -0.05 of Fig. 5C. Probably unrounded values underlie all three; not a sign of an error."},{"id":"q_sr_pair_rounding","kind":"unexplained_difference","text":"Across Fig. 5, S x R of the printed S (5A) and R (5B) misses the printed SR (5C) in four cells by more than one unit of its last digit: Fb-kon (0.05 x 4.4 = 0.22 vs 0.20), koff-Fm (-0.05 x 4.4 = -0.22 vs -0.20), κc-Fm and κc-nm (-0.61 x 1.2 = -0.73 vs -0.75), and in about a dozen more by up to one unit. Every miss goes away with less-rounded inputs: S = 0.045 (still printed 0.05) gives 0.20 and -0.20, and R from the Fig. S2 limits (1.24 for κc-Fm) gives -0.76. So SR was computed from unrounded S and R; the printed tables cannot be reproduced from each other exactly where S has one significant digit or R has two. The R values of Fig. 5B agree with the Fig. S2 limits in every cell (eight only 'close', e.g. vu-kon 0.669 vs 0.66)."},{"id":"q_koff_text_slip","kind":"possible_error","text":"The Supporting Material says 'An increase in koff is similar to an increase in kon in that it causes a decrease in the average number of clutches bound', while it says on the previous page that an increase in kon causes an increase in the number of clutches bound. Probably 'a decrease in kon' was meant. The printed S values (kon +1.4, koff -0.4) agree with the intended sense."},{"id":"q_sm_equation_number","kind":"possible_error","text":"Step 2 of the Supporting Material algorithm determines event times '(see Eq. 2)'; the event-time equation is Eq. 1 of the article, and Eq. 2 is the range R. The Supporting Material has no numbered equations of its own. The record reads Eq. 1, as the model does."},{"id":"q_measured_points_not_read","kind":"reading","text":"Audit disagreement with the scope (not changed): two panels plot measured points with error bars that the record does not enter: Fig. 7C left (Kong et al.'s integrin lifetimes, to which the catch-slip model of Eq. 9 was fitted) and Fig. S1B (Chan and Odde's neuron flow rates, to which the new base set was fitted). The guide asks for every plotted measurement; Eq. 9 with the Table S1 fit could be validated against the Fig. 7C points directly (no unit conversion is needed there). Both are data from other papers re-plotted here, which is presumably why the first reader left them out; reading them needs the figure tools."},{"id":"q_tbinding_calibrated","kind":"unexplained_difference","text":"The calibrated reading settles the reading side of q_tbinding: the dashed 'Binding Time' line of Fig. 6D lies at 6.4 s (95% interval about 5.7 to 7.1 s, from the right-axis ticks 0-70 s and the line's thickness), between the first reader's 7 s and the auditor's 5.8 s by eye. Eq. 10 with the base set (nc = 50, kon = 0.3 /s) gives H_50/kon = 15.0 s, 2.3 times the plotted value, so the difference is not a reading error. The plotted line is near Eq. 10 with kon = 0.7 /s, or with nc = 75 and kon = 1 /s (Chan and Odde's set, 4.9 s); which set Fig. 6 uses is not stated."},{"id":"q_measured_points_read","kind":"reading","text":"The measured points the audit found missing (q_measured_points_not_read) are now read with their error bars: Kong et al.'s twelve lifetimes in Fig. 7C (tau_kong_fig7c, compared with Eq. 9 in cmp_fig7c_kong) and Chan and Odde's six flow rates in Fig. S1B (v_figS1b_measured). Neither legend says what the error bars are (recorded as 'unstated'). Two Fig. 7C points touch (about 4 and 5 pN); the lower bar end of the first lies behind the second marker and is read where the dark run ends, so it may be short. The Fig. S1B points are against Young's modulus; no model run is compared with them because the modulus-to-spring-constant conversion is not given."},{"id":"q_fig1_bar_assignment","kind":"reading","text":"In Fig. 1 several points of different cell types lie close together and their error bars overlap (Fig. 1A near 20-50 kPa and 0.35; Fig. 1B near 5-7 kPa and 0.7). The reading assigns to each point the dark vertical line through its centre; where two bars run side by side, which bar belongs to which point cannot be told from the figure, and some bar ends read there may belong to the neighbour. No legend says what the error bars are. The values are normalized to each data set's maximum, so they are not the original measurements of refs. 2, 4, 7, 10, 11, 12 and 15."},{"id":"q_fig4_intermediate_series","kind":"unstated_input","text":"Fig. 4 labels only the first and last curve of each panel (nm = nc = 50 and 1600 in A-B; kon = 0.3, koff = 0.1 /s and kon = 3, koff = 1 /s in C-D). The parameter values of the four (A-B) and two (C-D) curves between them are not printed (a doubling series 100, 200, 400, 800 would fit A-B, and the caption of Fig. 5D says kon/koff is kept at 3), so only the end curves are simulated. The intermediate curves are recorded as plotted."},{"id":"q_fig7c_right_model","kind":"unstated_model","text":"Fig. 7C right shows six flow curves of the motor-clutch model with catch-slip clutches (Eq. 9 in place of the slip bond), for nm = nc from 10 (first label) to 300 (last label). The four values between are not printed, and the other parameters are presumably the Table S1 column Fig. 7C, which leaves nm and nc blank. The record has no catch-slip version of motor_clutch_ssa, so the six curves are recorded for a later model to be compared with."},{"id":"q_fig3a_hidden_curves","kind":"reading","text":"In Fig. 3A curves of the same panel overlap where they reach the stalled (0) or free-flowing (about 120 nm/s) limits, or where they coincide (κc panel at low stiffness). Only the visible parts are read. Two curves are hidden over the whole panel and are not read: nc at 3 times its base (150 clutches, stalled under the 10-times curve) and nm at 3 times (free flowing under the 10-times curve). Fb at 3 times is visible only near 100 pN/nm and is read there only."},{"id":"q_fig4_short_runs","kind":"choice","text":"The nm = nc = 1600 curves of Fig. 4A-B are simulated for 100 s per point instead of the 1000 s used elsewhere: at 1000 s, ten points and five seeds of 1600 clutches exceed the build's time limit for one run. 100 s spans about 15-20 load-and-fail cycles near the optimum (cycle time about 6 s); the paper does not state its simulated time (q_sim_length). This run is not refined."},{"id":"q_second_pass_differences","kind":"unexplained_difference","text":"Of the 68 comparisons against calibrated readings, 45 reproduce, 10 are close and 13 do not. I re-checked each reading on its overlay; the readings sit on the curves. The differences fall into four groups. (1) Stalled curves at the softest stiffness: Fig. 2B-C nc = 300, Fig. 3A kon x10, nc x10 and Fb x10 at 0.01 pN/nm, and Fig. 4A-B nm = nc = 1600 at 0.1 pN/nm. Only the first point or two differ. The simulation, averaged over the whole run, still carries the loading transient: about 10 nm/s instead of 0-1 nm/s, worse for the 100 s runs of q_fig4_short_runs. This is q_stall_transient again, not a reading error. (2) Fig. 3A koff x0.1 at 3 pN/nm (14 vs 0.3 nm/s) lies on a near-vertical jump. A shift of the jump by under 0.1 decade explains it. (3) Fig. 4C-D, kon = 3, koff = 1 /s: above about 5 pN/nm the simulation gives 72.5-73 nm/s and 39 pN, while the figure shows 75.6-76.7 nm/s and 36-37 pN. That is 3-4 nm/s and about 3 pN outside the reading intervals; the base-set curves of the same panels reproduce. (4) Eq. 9 with the Table S1 parameters (koff = 0.004 /s, Fb = 8 pN, koff,c = 10 /s, Fc = 8 pN) peaks at 1/(2 sqrt(0.004 x 10)) = 2.50 s at 31 pN, while the plotted fit peaks at 2.30 s. Between 25 and 32 pN the plotted curve is about 8% lower than the printed parameters give, perhaps because they are rounded. Against Kong et al.'s points, Eq. 9 misses the three lowest-force points (1.26, 1.03 and 0.68 s at 4-9 pN, against 0.17-0.30 s): the catch-slip fit does not describe the low-force lifetimes. That is a fit_quality finding, consistent with the plotted curve."},{"id":"q_xval_bangasser2013b","kind":"choice","text":"No validation of this record's models against bangasser2013b's measurements is entered. The only measured data in bangasser2013b are the computation times of its software (Fig. 6b: bangasser2013b/fig6b_ode_cal, fig6b_mc1_cal, fig6b_mc100_cal), which no model here predicts. Its other plotted values are outputs of its own ODE and Monte Carlo models (origin predicted): relating those to motor_clutch_ssa is a model-to-model comparison for a later job, not a validation against a measurement. The shared shape of catch_slip_eq9 and bangasser2013b/clutch_ensemble_cycle (a time from forces and rates) does not make one predict a measurement of the other."},{"id":"q_xval_bell1978_none","kind":"choice","text":"No model of this record is validated against a measurement of bell1978, and no bell1978 model against a measurement here. This paper cites bell1978 (ref. 23) only for the slip off-rate law: \"The first term in this equation is identical to the Bell model (23)\" (p. 3). It does not say a model of either paper predicts a number the other measured. bell1978's measured values are a force of about 1 dyne needed to detach a cell (force_adhesive, from its ref. 52, printed with \"~\", so it would get no verdict) and the sugar concentrations of an inhibition experiment (c_sugar_low, c_sugar_high: inputs, not results); no model here outputs either. motor_clutch_ssa gives retrograde flow and traction of a filopodium on a substrate spring, not a cell's detachment force. In the other direction, the measurement here that a bell1978 model could give is Kong et al.'s integrin-fibronectin lifetimes against force (tau_kong_fig7c, Fig. 7C), which bell1978/lifetime_eq16 gives in kind (bond lifetime at a force per bond). But bell1978's tau0, E0 and gamma are estimates for antibody-hapten bonds, not this bond, and neither paper states Bell parameters for integrin-FN. The only parameters for it are this record's koff_7c and Fb_7c, fitted to these same points as part of the catch-slip Eq. 9. Mapping them onto Eq. 16 needs tau0 and E0 split from one rate (an added tau0, and a computed E0 that a record may not hold), and would be half of a fit already reported as cmp_fig7c_kong (fit_quality). The slip-only Eq. 16 also cannot give the catch branch at low force. The shared shape of catch_slip_eq9 and bell1978/detach_time_eq17 (a time from a force and rates) is a relation between models, left to the job that relates models across papers. See bell1978 q_xval_bangasser2013_none."},{"id":"q_xval_chan2008_ksub","kind":"unstated_input","text":"(Cross-record validation.) motor_clutch_ssa takes a substrate spring constant; chan2008 states its gels by Young's modulus. Neither paper gives this paper's conversion. The validations use 1 pN/nm per kPa, which is how Fig. S1B plots the base-set curve against modulus (it repeats the κsub curve of Figs. 2-4 number for number). chan2008's Eq. 13 with its fitted Δ (0.67 pN/nm per kPa) and with δ (0.36 pN/nm per kPa) are the alternatives in added.yaml. On the stiff gel all choices give the plateau; on the 260 Pa gel all lie near the optimum."},{"id":"q_xval_chan2008_figS1b_positions","kind":"reading","text":"(Cross-record validation.) Fig. S1B draws Chan and Odde's six flow means at about 0.13, 0.37, 0.65, 0.76, 24 and 56 kPa (read from the figwork overlay against the decade ticks). chan2008 names the gels 260 and 730 Pa, 1.1, 1.3, 24 and 57 kPa (chan2008 Fig. 3C-D). The two stiff points agree; the four soft ones are drawn at 0.5-0.6 times the moduli chan2008 prints. Whether Fig. S1B uses another modulus calibration of the same gels, or misplaces them, is not said. It matters for the fit: the base-set curve passes through the points at the plotted positions, which sit on its steep rise."},{"id":"q_xval_chan2008_curves","kind":"choice","text":"(Cross-record validation.) Measurements of chan2008 considered and not entered against this record's models: (1) the six-point Fig. 3D curve (chan2008/v_fig3d_exp_sem and its first-pass per-colour readings) and the Fig. S8C bars (chan2008/v_figS8C_control, v_figS8C_gfp) are indexed by Young's modulus, and motor_clutch_ssa takes a spring constant, so a sweep over them would cross two different quantities; only the scalar Fig. 3C means are entered, with added spring constants. The Fig. 3D points at 260 Pa and 57 kPa are the same gels as Fig. 3C. (2) chan2008's peak filopodial force (T_max_fig, T_max_text): no model here outputs a peak force (F_mean is a time average). (3) The ~110 nm/s stiff plateau (v_stiff_text) is approximate and gets no verdict. (4) The flow and step-size histograms, surface tension and failure frequency: no model here predicts them. (5) catch_slip_eq9 has no counterpart measurement in chan2008, which measured no bond lifetimes."},{"id":"q_xval_chaudhuri2015_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of chaudhuri2015, which is later than this paper and cites it for the motor-clutch framework, not the other way round. chaudhuri2015 measures alginate gel mechanics (initial Young's modulus by AFM, Fig. 2c and Supp. Table 1; normalized stress relaxation, Fig. 2a and Supp. Fig. 3a; normalized storage and loss moduli, Fig. 2b and Supp. Fig. 3b) and cell responses on those gels (spread area, Figs. 3b-c, 4b, Supp. Figs. 4-5; percent of cells with stress fibres, attached or proliferating, Figs. 3e, 4a, 4e; YAP nuclear ratio, Fig. 4d). None of these is an output of a model here: motor_clutch_ssa gives retrograde flow, traction force, engaged clutches and cycle time on a linear elastic spring, with no gel rheology and no spreading; catch_slip_eq9 gives a bond off rate and lifetime, which chaudhuri2015 did not measure. Running motor_clutch_ssa on a modulus to predict a spread area would only predict a trend the measurement does not quantify. The shared shape of catch_slip_eq9 and chaudhuri2015/bell_off_rate is a relation between models, not a measurement."},{"id":"q_xval_elosegui2014_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of elosegui2014. That paper is later and cites this one (its ref. 20) as one of two clutch models its own model \"expands on\" (p. 4), and for how rates modulate rigidity sensing (p. 6). It never says this model, with these parameters, predicts its data. Its measurements on gels are of breast myoepithelial cells: tractions in Pa (Figs. 1b,c, 4d,g,j), which are a stress and not this model's mean traction force in pN, so the quantities differ; actin rearward flows in nm/s (Figs. 4e,h,k); and adhesion integrin densities in arbitrary units (Figs. 4f,i,l). The flows are the same quantity as v_retro. But running motor_clutch_ssa on them would apply this paper's base set, which was fitted to chick forebrain neuron filopodia (Fig. S1 legend), to myoepithelial cells. Neither paper gives motor, clutch or rate values for those cells. The one model built for them (elosegui2014/integrin_clutch_sim) adds integrin densities, competing integrin types, a catch bond and reinforcement, and its parameters are in an unreadable Supplementary Information. The gels are given by Young's modulus, with no spring-constant conversion stated for these cells. Every input would be added, so a verdict would test the added values, not the model. The bead detachment times (Fig. 2c), bead recruitment (Fig. 2e,g), SPR responses (Fig. 2a) and membrane densities (Fig. 2b) are outputs of no model here. catch_slip_eq9 gives a single-bond lifetime, and elosegui2014 measured none: its catch-bond curve is Kong et al.'s (its ref. 12), which this record already holds as tau_kong_fig7c (fit_quality)."},{"id":"q_xval_elosegui2016_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of elosegui2016, which is later and cites this paper (its ref. 32) only for trends: clutch determinants \"predicted to regulate force transmission\" and a peak rigidity \"determined by force loading\" (elosegui2016 p. 6), and its results \"fully abide by the clutch model\" (p. 8). It never says this model, with these parameters, predicts its data. Its measurements are of mouse embryonic fibroblasts on fibronectin-coated gels given by Young's modulus: tractions in Pa (Figs. 1a, 3d, 4a,e, 5a,e, 6a-i, Supp. Figs. 2, 5a), a stress and not this model's mean traction force in pN; actin flows in nm/s (Fig. 3e), the same quantity as v_retro; and adhesion lengths, YAP ratios, integrin densities in a.u., spread areas, pMLC ratios, attached fractions and bond lifetimes of FN-avb3 (Fig. 3a). Running motor_clutch_ssa on the Fig. 3e flows would apply this paper's base set, fitted to chick forebrain neuron filopodia (Fig. S1 legend), to fibroblasts. elosegui2016 gives MEF motor values (nm, Fm, vu, kc in its Supplementary Table 1) but its clutches are a fibronectin-a5b1 catch bond with binding rate kont dint, not this model's kon, koff and Fb slip bond, and it states no spring-constant conversion beyond its own unprinted one. Every clutch input would be added, so a verdict would test added values, not the model. catch_slip_eq9 gives an a5b1-fibronectin lifetime (Kong et al.); elosegui2016 measured avb3 lifetimes (Fig. 3a), a different bond, and the model's parameters are fitted to the a5b1 data. In the other direction, see elosegui2016/q_xval_bangasser2013_none."},{"id":"q_xval_gong2018_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of gong2018, which cites this paper (its ref. 17) only as one source of the motor-clutch model and states no comparison with it. gong2018's measured data are 3T3 spreading speeds vs substrate stiffness (Fig. S7), spreading areas (Figs. 4D, 5D, 6D, S5A) and gel relaxation stiffnesses (Figs. 4B, 5B, S6A). motor_clutch_ssa outputs the retrograde flow and traction, not the spreading speed, which gong2018 obtains as Vs = Vp - Vf with a polymerization speed this record has no model or value for; no model here gives a spreading area or a gel's relaxation. catch_slip_eq9 and binding_time_eq10 have no counterpart measurement in gong2018. In the other direction, see gong2018/q_xval_bangasser2013_none."},{"id":"q_xval_andreu2021_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of andreu2021, which cites this paper (its ref. 79) only for the Gillespie algorithm (andreu2021 p. 10) and states no comparison with it. The one measurement of andreu2021 whose quantity a model here outputs is the actin retrograde flow of Fig. 1b (andreu2021/fig1b_flow, mouse embryonic fibroblasts on a 0.6 kPa gel and on glass), against motor_clutch_ssa's v_retro. It is not entered: (1) every parameter of motor_clutch_ssa here (Table 1) is the set fitted to embryonic chick forebrain neuron filopodia (Fig. S1 legend); neither paper states nm, Fm, vu, nc, kon, koff, Fb or kc for fibroblast lamellipodia, so all eight would be added inputs and the entry would test those, not the model; andreu2021's own clutch parameters (Supplementary Table 4) belong to a catch-bond model with no motors, not to this one. (2) The glass value is measured \"at the very edge of lamellipodia (where adhesion is still very low)\" (andreu2021 p. 2), a low-adhesion region that a run on a stiff substrate does not represent. (3) The gel is given as a Young's modulus, and this paper gives no modulus-to-spring-constant conversion (Fig. S1B, left out for that reason). The other measurements of andreu2021 (adhesion lengths, YAP ratios, tweezers bead speeds, loading rates and stiffnesses, AFM moduli, areas) have no output here; the bead loading rates are imposed by the tweezers, not produced by motors. andreu2021/supp_table1_edge and motor_clutch_ssa share the shape force-velocity-stiffness but do not share a measured quantity. In the other direction, see andreu2021/q_xval_bangasser2013_none."},{"id":"q_xval_kong2009_other_curves","kind":"choice","text":"Only Kong et al.'s Fig. 3 A circles (FN/a5b1-Fc/GG-7 in Ca2+/Mg2+, kong2009/lt_FN_a5b1Fc_CaMg) are entered, as val_lifetime_kong_fig3a (fit_quality). The same series read as a line (kong2009/line_FN_a5b1Fc_CaMg_fig3) and its replot (kong2009/replot_fig5a_of_fig3a) would repeat it. Kong's other lifetime curves (Mg2+/EGTA, Mn2+, truncated a5b1, membrane a5b1, activating antibodies, Fc/GG-7 and antibody controls) are other bonds or other cation conditions: this paper gives Eq. 9 parameters only for its Ca2+/Mg2+ fit, and running them on another condition would add the assumption that the bond is unchanged, which Kong et al.'s own curves contradict. Kong's adhesion frequencies, rupture-force histograms, molecular stiffnesses, flow-cytometry histograms and ln(event count) survival plots are outputs of no model here; motor_clutch_ssa gives flow and traction, which Kong et al. did not measure."},{"id":"q_xval_odde_code_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against odde_code, which is software (the Odde lab's MATLAB motor-clutch scripts) and holds no measurements: every value in it is a code parameter, a value copied from a paper's record, or a model output. Its outputs on this paper's base set are already compared with this paper's predicted curves as reproductions in that record. The shared shape of catch_slip_eq9 and odde_code/mc_event_port is a relation between models, not a measurement. In the other direction, see odde_code/q_xval_bangasser2013_none."}],"takes_from":["chan2008"],"tally":{"clo
