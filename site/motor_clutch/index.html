ced":0,"reproduced":2},"consistency":{"close":0,"error":0,"no verdict":1,"not reproduced":0,"reproduced":5},"reproduction":{"close":4,"error":0,"no verdict":39,"not reproduced":3,"reproduced":11}},"checked":{"close":6,"no verdict":41,"not reproduced":3,"reproduced":18},"counts":{"added":2,"comparisons":68,"data":116,"models":37,"questions":29,"references":71,"runs":58},"id":"bell1978","kind":"article","label":"Bell 1978","models":[{"id":"KN2_product","name":"product of the membrane equilibrium constant and receptor density (note 45)","relations":[],"role":"processing","variant_of":null},{"id":"Km_from_Ks","name":"membrane equilibrium constant from the solution one (note 45)","relations":[],"role":"model","variant_of":null},{"id":"bonds_equivalent_force","name":"number of standard bonds a force would break","relations":[],"role":"model","variant_of":null},{"id":"bonds_equivalent_stress","name":"number of standard bonds per unit area equivalent to a stress or pressure","relations":[],"role":"model","variant_of":null},{"id":"bonds_in_contact","name":"number of bonds over a contact area","relations":[],"role":"model","variant_of":null},{"id":"bonds_to_hold_eq24","name":"number of bonds needed to hold a cell in a fluid stream (Eq. 24)","relations":[],"role":"model","variant_of":null},{"id":"bridging_fig5","name":"bridging of cells by bivalent ligands with a competitive inhibitor (Fig. 5 model)","relations":[],"role":"model","variant_of":null},{"id":"contact_area_duration","name":"contact area times collision duration needed to form a given number of bonds","relations":[],"role":"model","variant_of":null},{"id":"critical_force_eq19_20","name":"critical force per potential bond, exact solution of Eqs. 19-20","relations":[{"kind":"same_as","other":"erdmann2004/critical_force","stated":true,"status":"verified"}],"role":"model","variant_of":null},{"id":"critical_force_eq21","name":"approximate critical force per potential bond (Eq. 21)","relations":[],"role":"model","variant_of":null},{"id":"detach_time_eq17","name":"time to detach a cell under force, numerical solution of Eq. 17","relations":[{"kind":"approximated_by","other":"erdmann2004/lifetime_adjoint","stated":true,"status":"not_verified"}],"role":"model","variant_of":null},{"id":"detach_time_eq22_approx","name":"time to detach a cell under a large force, approximate form (Eq. 22)","relations":[],"role":"model","variant_of":null},{"id":"detach_time_eq22_exact","name":"time to detach a cell under a large force, exponential-integral form (Eq. 22)","relations":[{"kind":"approximated_by","other":"erdmann2004/lifetime_adjoint","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"detach_time_eq22_fig8","name":"dimensionless time to detach a cell under a large force, Eq. 22 in the variables of Fig. 8","relations":[],"role":"model","variant_of":null},{"id":"detach_time_fig8","name":"dimensionless time to detach a cell under force, numerical solution of Eq. 17 (Fig. 8)","relations":[],"role":"model","variant_of":null},{"id":"encounter_membrane","name":"encounter-complex rate constants for membrane-bound reactants (Eqs. 5-6)","relations":[],"role":"model","variant_of":null},{"id":"encounter_solution","name":"encounter-complex rate and equilibrium constants for reactants in solution (Eqs. 2-4)","relations":[],"role":"model","variant_of":null},{"id":"force_ratio","name":"rupture force f0 relative to the critical force fc (p. 623)","relations":[],"role":"model","variant_of":null},{"id":"harmonic_period","name":"period of a harmonic oscillator fitted to the bond potential (p. 622)","relations":[],"role":"model","variant_of":null},{"id":"kT_boltzmann","name":"thermal energy kT at a given temperature","relations":[],"role":"processing","variant_of":null},{"id":"kplus_fraction","name":"membrane forward rate constant as a fraction of its diffusion limit (p. 621)","relations":[],"role":"model","variant_of":null},{"id":"laplace_pressure","name":"cell surface pressure from surface tension","relations":[],"role":"model","variant_of":null},{"id":"laplace_pressure_radius","name":"cell surface pressure times radius, P = 2 gamma/R ~ 10^4/R","relations":[],"role":"model","variant_of":null},{"id":"lifetime_eq16","name":"bond lifetime under force (Eq. 16)","relations":[{"kind":"reduces_to","other":"bangasser2013/catch_slip_eq9","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"loaded_reverse_rate","name":"reverse rate constant of a bond under force, the replacement for k- in Eq. 12 (p. 623)","relations":[{"kind":"approximated_by","other":"andreu2021_code/lr_rate_port","stated":false,"status":"verified"},{"kind":"reduces_to","other":"bangasser2013/catch_slip_eq9","stated":true,"status":"unverifiable"},{"kind":"derived_from","other":"bangasser2013/motor_clutch_ssa","stated":true,"status":"unverifiable"},{"kind":"same_as","other":"bangasser2013b/clutch_offrate_eq5","stated":true,"status":"verified"},{"kind":"same_as","other":"chan2008/off_rate_eq1","stated":true,"status":"verified"},{"kind":"same_as","other":"chaudhuri2015/bell_off_rate","stated":true,"status":"verified"},{"kind":"same_as","other":"erdmann2004/single_bond_rate","stated":true,"status":"verified"},{"kind":"same_as","other":"gong2018/bell_off_rate","stated":true,"status":"verified"}],"role":"model","variant_of":null},{"id":"max_bond_rate_eq13","name":"maximum rate of intercellular bond formation (Eq. 13)","relations":[],"role":"model","variant_of":null},{"id":"max_bond_rate_per_N1","name":"maximum bond formation rate per receptor on cell 1 (Eq. 13 divided by N1)","relations":[],"role":"model","variant_of":null},{"id":"peak_inertial_force","name":"peak acceleration of a vibrating fiber and the inertial force on an attached cell","relations":[],"role":"model","variant_of":null},{"id":"peak_velocity_shaking","name":"peak fluid velocity relative to fibers in a shaken medium","relations":[{"kind":"scales_as","other":"andreu2021/edge_speed","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"plug_force","name":"force to displace a cylindrical bilayer plug with a protein (note added in proof)","relations":[],"role":"model","variant_of":null},{"id":"receptor_density","name":"receptors per unit area from the number per cell and the cell area","relations":[],"role":"processing","variant_of":null},{"id":"rupture_force_eq15","name":"force that rapidly ruptures a bond, f0 = E0/r0 (Eq. 15)","relations":[],"role":"model","variant_of":null},{"id":"sphere_area","name":"surface area of a spherical cell of given radius","relations":[],"role":"processing","variant_of":null},{"id":"stokes_drag_eq23","name":"Stokes drag on a stationary cell in a fluid stream (Eq. 23), per unit velocity","relations":[],"role":"model","variant_of":null},{"id":"sum_membrane_diffusion","name":"sum of the two membrane diffusion coefficients entering Eqs. 5-6","relations":[],"role":"processing","variant_of":null},{"id":"tau0_from_eq16","name":"tau0 from the zero-force lifetime, Eq. 16 at f = 0","relations":[],"role":"model","variant_of":null},{"id":"travel_time","name":"time for a cell to travel its own diameter in a grazing collision","relations":[],"role":"model","variant_of":null}],"of":[],"questions":[{"id":"q_table2_t_misprint","kind":"possible_error","text":"Table 2 prints log10 t = -14.7 at a force of 4 x 10^-6 dyne per bond. That entry breaks the otherwise steady decrease of the column (-6, -7.1, -8.2, -9.3 at 6-12 x 10^-6 dyne), and log10 t cannot be smaller at 4 than at 6 x 10^-6 dyne. With the paper's parameters, Eq. 17 solved numerically (KN2 = 300, k- = 100 /s) gives -4.70, and Eq. 22 gives -4.77 (E1 form) or -4.78 (approximate form). The printed value may be a misprint of -4.7. It is recorded as printed.\n"},{"id":"q_table2_KN2","kind":"unstated_input","text":"Table 2 does not state the KN2 behind its critical force (2.98 x 10^-6 dyne per bond) or its detachment times. The record takes KN2 = 300, the lowest curve in Fig. 8. With it, the exact root of Eq. 20 gives fc = 2.973 x 10^-6 dyne (close, not reproduced, at the printed precision). Taking the printed rounded coefficient 8.6 x 10^-7 dyne for kT/r0 instead of 0.0268 eV / 0.5 nm = 8.588 x 10^-7 dyne would give 2.977 x 10^-6, which is reproduced. KN2 = 1000, 3000 or 10^4 gives a critical force well away from 2.98 x 10^-6.\n"},{"id":"q_table2_k_minus","kind":"unstated_input","text":"The detachment times t of Table 2 scale as 1/k-, but the table does not state k-. The record uses k- = 1/tau(f = 0) = 100 /s, following the identification on p. 622. With it, the rows at 6-12 x 10^-6 dyne reproduce. A k- ten times larger or smaller shifts every log10 t by 1 and they no longer do.\n"},{"id":"q_table2_t_method","kind":"reading","text":"The paper does not say whether the t column of Table 2 comes from the numerical solution of Eq. 17 (which it says was computed, for Fig. 8) or from Eq. 22. All three are run. Eq. 17 with KN2 = 300 reproduces all four rows other than the -14.7 entry. Both forms of Eq. 22 give -9.24 at 12 x 10^-6 dyne, against the printed -9.3 (close).\n"},{"id":"q_eq17_numerics","kind":"numerics","text":"The paper gives no numerical settings for its solutions of Eq. 17. The record computes the time for Nb/N1 to fall from its Eq. 18 value to n_stop = 0.01 as a quadrature of Eq. 17 (rtol 1e-8). Both the cut-off n_stop and the tolerance were refined; t changes by less than 1e-14 relative, so the Table 2 times belong to the model, not the numerics.\n"},{"id":"q_kT","kind":"unexplained_difference","text":"The paper prints kT = 0.0268 eV at T = 37 degC. The Boltzmann constant times 310.15 K gives 0.02673 eV, just outside the printed precision (close). 0.0268 eV corresponds to about 311 K. The difference is small, and every downstream use takes the printed 0.0268.\n"},{"id":"q_tau_h_formula","kind":"reading","text":"The oscillator period reads \"tau_h ≈ 2π r0 (E0 m)^-1/2\" in the OCR, and the page image at hand does not show a division sign clearly. (E0 m)^-1/2 has the wrong dimension for a time. The model uses the only dimensionally consistent reading, 2π r0 (E0/m)^-1/2. A higher-resolution look at p. 622 should settle the reading.\n"},{"id":"q_tau_h_value","kind":"unexplained_difference","text":"With r0 = 0.5 nm, E0 = 0.37 eV and m = 200 daltons, 2π r0 (m/E0)^1/2 gives 7.4 x 10^-12 s, against the printed ≈ 5 x 10^-12 s (no verdict, because the paper prints \"≈\"). A harmonic potential of depth E0 at distance r0 (spring constant 2E0/r0^2) would give 2π r0 (m/2E0)^1/2 = 5.3 x 10^-12 s, which matches the printed value. The paper does not state which fit it used. Either way the paper's conclusion, that tau_h is much smaller than tau0, holds.\n"},{"id":"q_Ks_symbol","kind":"reading","text":"On p. 620 the value \"Ks ≈ 1 M^-1\" follows d+s and d-s directly, and d+s/d-s ≈ 1 M^-1, so it is read as the encounter equilibrium constant Kd^s of Eq. 4. The subscript d is not visible in the scan. Elsewhere K^s denotes the overall solution equilibrium constant (≈ 10^6 M^-1 on p. 622).\n"},{"id":"q_v_shaking","kind":"unexplained_difference","text":"The peak fluid velocity of ≈ 20 cm/sec is said to follow from shaking at 80 cycles per minute with amplitude ≈ 4 cm, but the paper does not state how. Simple harmonic motion with 4 cm as the amplitude gives 2π nu A = 33.5 cm/s. With 4 cm as the peak-to-peak excursion it gives 16.8 cm/s. Either way the paper's \"about 300 bonds\" (Eq. 24 with 20 cm/s gives 265) stays of the same order.\n"},{"id":"q_inertial_model","kind":"choice","text":"The peak acceleration of a plucked fiber (p. 624) and the peak fluid velocity of a shaken medium (p. 625) are given only as results (\"It follows that ...\"). The record reads both as simple harmonic motion, a = (2π nu)^2 A and v = 2π nu A.\n"},{"id":"q_muscle_units","kind":"reading","text":"The tensile strength of muscle is printed as \"4 kg/cm2\", read here as kilogram-force per square centimeter. With that reading it matches the paper's own conversion to 4 x 10^-2 dyne/um^2 (3.92 x 10^-2).\n"},{"id":"q_eq21_approximation","kind":"reading","text":"For KN2 = 10^3 the approximate Eq. 21 (alpha_c ≈ 0.7 ln KN2) gives fc = 4.15 x 10^-6 dyne, while the exact root of Eq. 20 gives 3.80 x 10^-6 dyne. Both are consistent with the printed \"fc ≈ 4 x 10^-6\", which has no stated precision. At this KN2 the approximation overestimates alpha_c by about 9%.\n"},{"id":"q_fig5_model","kind":"unstated_model","text":"The Fig. 5 bridging model is described only by its receptor configurations; its kinetic equations are said to be published elsewhere (ref. 42). The predicted reductions of the equilibrium number of bonds by factors of 10^6 and 10^8 at 0.001 and 0.01 M free sugar (K = 10^6 M^-1) therefore cannot be checked from this paper.\n"},{"id":"q_area_duration_model","kind":"unstated_model","text":"The paper states that a collision whose product of contact area and duration exceeds 3 um^2 msec (N1 ~ 10^4 um^-2), or ~300 um^2 msec (N1 ~ 10^2 um^-2), has a good chance of leading to adhesion, but not how these follow. The audit reads them as the ~300 bonds needed to stay bound (p. 625) divided by the maximum bond formation rate (10^2 and 1 um^-2 msec^-1), which gives exactly 3 and 300. The paper does not say this is the calculation.\n"},{"id":"q_fig5_reduction_reading","kind":"reading","text":"Audit observation, not a model: the printed reductions 10^6 and 10^8 at 0.001 and 0.01 M free sugar with K = 10^6 M^-1 equal (1 + K c)^2 = (1 + 10^3)^2 and (1 + 10^4)^2 to the printed precision, as if each of the two sites of a bivalent bridge were blocked independently by the competing sugar. The paper does not state this, so the Fig. 5 model stays not runnable and the two values stay uncompared.\n"},{"id":"q_eq24_sign","kind":"reading","text":"Eq. 24 on p. 624 reads \"N_v ≈ 5.3 x 10^-5 v/f_c ≈ 13 v\" in the page image; the OCR renders both ≈ as \"=\" (as it does for \"mass = 3 x 10-tO g is = 3 X 10-3\" two columns over, where the image shows ≈). The audit changed the printed value from \"13\" to \"≈ 13\", so the comparison now gets no verdict. The image available is low resolution; a sharper look should confirm the sign.\n"},{"id":"q_tau_h_model_as_printed","kind":"reading","text":"The audit reads the p. 622 formula in the page image the same way as the first reader, \"τh ≈ 2πr0(E0m)^-1/2\". The model implements 2π r0 (E0/m)^-1/2 instead, which is not the equation as printed. The printed form is not a time and cannot be run, so the choice is left as made; it should be revisited if a sharper scan shows \"E0/m\".\n"},{"id":"q_fig8_table2_misprint","kind":"reading","text":"Fig. 8 bears on q_table2_t_misprint. The Table 2 row at 4 x 10^-6 dyne has r0 f/kT = 4.66 (r0 = 0.5 nm, kT = 0.0268 eV), so f* = 0.82 if KN2 = 300. The calibrated reading of the KL=300 curve gives log10 t* = -2.73 at f* = 0.8 and -3.33 at f* = 1.0, about -2.78 at f* = 0.82. That is log10 t ≈ -4.8 for k- = 100 /s, near -4.7 and far from the printed -14.7. No curve in Fig. 8 gets below log10 t* = -5 for f* ≤ 1, and for KN2 = 10^4 f* = 0.51, which is below critical. So the printed -14.7 would need a k- of about 10^12 /s, or a force well outside the range of the row. The figure cannot separate KN2 from k-, because each moves log10 t by a shift, so it does not settle q_table2_KN2 by itself.\n"},{"id":"q_fig8_low_force","kind":"unexplained_difference","text":"At f* = 0.8 all four curves of Fig. 8 lie 0.06 to 0.09 in log10 t* below the record's numerical solution of Eq. 17 (close, not reproduced). Eq. 22 lies within the reading there. The difference is about 3 px on the page. It may come from the paper's numerics (it gives no settings; the record's cut-off and tolerance are refined and do not matter), or from the drawing. The x calibration uses the ticks 1.0, 2, 3 and 4. The printed .6 and .8 ticks lie 3 and 6 px right of that linear scale, so the artwork is not exactly linear below f* = 1. Readings there carry more uncertainty than their intervals show. Reading at the printed .8 tick would move the values further down, away from Eq. 17, so the calibration does not explain the difference.\n"},{"id":"q_fig8_code_reading","kind":"unexplained_difference","text":"The own-code readings at 900 dpi calibrate y on all 17 unit ticks (misfit 2.8 px, about 0.025 in log10 t*) and x on the ticks 1.0-4 (misfit 1.7 px); their intervals are about +-0.065, against +-0.09 to +-0.12 for the 300 dpi readings. With these intervals, most points still lie within 0.06 of Eq. 17 and Eq. 22, but the KL=3000 curve at f* = 1.0 and 1.5 lies about 0.12 and 0.09 below both, and KL=300 at f* = 1.0-2.5 lies 0.04-0.07 below both. Eq. 17 and Eq. 22 agree with each other to 0.01 at these points, so the paper's numerics cannot explain it; the drawing can: 0.12 is about 14 px at 900 dpi, or 0.35 mm on the printed figure. The interval covers reading error only, not the accuracy with which the 1978 curves were drawn. The second reading confirms q_fig8_low_force (at f* = 0.8 all four curves lie 0.065-0.089 below Eq. 17 and within 0.03 of Eq. 22) and the f* = 0.8 value of KL=300 used in q_fig8_table2_misprint (-2.727 against -2.733). The x ticks .6 and .8 sit 4.5 and 12.6 px (at 900 dpi; 1.5 and 4.2 px at 300 dpi) right of the linear scale of 1.0-4, as the first pass found.\n"},{"id":"q_no_validation_chan2008","kind":"unstated_model","text":"Cross-validation against chan2008 (which cites this paper for the loaded off-rate) found no measurement to enter, in either direction. Chan's measurements are F-actin retrograde flow rates on gels of given stiffness, filopodial traction (110 ± 25 pN), bead displacement statistics and the frequency of failure events of whole filopodia. None of this record's models outputs any of these: loaded_reverse_rate gives the off-rate of one bond at a known force per bond, and Chan measures no single-bond off-rate and no tension per clutch; rupture_force_eq15 and the critical forces are forces per bond, not the traction of a filopodium; the detachment-time and encounter models concern cells adhering to cells. In the other direction, this record's measurements (force_adhesive, about 1 dyne to detach a cell, and the inhibiting sugar concentrations) are not outputs of any chan2008 model."},{"id":"q_xval_chaudhuri2015_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of chaudhuri2015 (which cites this paper as its ref. S5 for the Bell off-rate law). chaudhuri2015 measured alginate gel properties (initial Young's moduli in Fig. 2c and Supp. Table 1, stress relaxation and rheology in Fig. 2a,b and Supp. Fig. 3) and cell responses (spread area in Fig. 3b,c, 4b and Supp. Figs. 4-5, stress fibres, attachment, YAP ratio and proliferation). None of this record's models outputs any of these: loaded_reverse_rate and lifetime_eq16 give the off rate or lifetime of one bond at a known force per bond, and Chaudhuri measures no bond off rate, lifetime or force per bond; the other models concern bond numbers, rupture and detachment of cells adhering to cells or surfaces under a known force. Spread area or gel stress relaxation would need a model of spreading or of the gel, which this paper does not have. In the other direction, this record's measurements (force_adhesive, about 1 dyne, and the sugar concentrations c_sugar_low and c_sugar_high) are not outputs of any chaudhuri2015 model."},{"id":"q_xval_elosegui2014_none","kind":"unstated_input","text":"(Cross-record validation.) No model of this record is validated against a measurement of elosegui2014, which cites this paper (its ref. 9) only for the principle that bond unbinding rates are \"determined by force\", not for any number. The only measurement there that a model here could output is the bead detachment time under the magnetic tweezers (Fig. 2c, datum detachment_time_fig2c: 0.5 nN on FN-coated beads for at most 2 min). Eq. 17 or Eq. 22 would give a detachment time for F = 0.5 nN, but only with inputs neither paper states for those beads: the number of bonds N1 sharing the force (hence the force per bond), the barrier range r0 of the integrin-FN bond, and for Eq. 17 KN2. The only k- candidate, elosegui2014's SPR koff, is a fitted zero-force rate whose power of ten is ambiguous by 10^4 (elosegui2014 q_koff_column_multiplier), and elosegui2014 models the a5b1-FN bond as a catch bond (minimum koff near 30 pN), which Eq. 16 does not describe. With N1 and r0 both free over orders of magnitude, any detachment time from 0 to 2 min can be produced, so a run would be a fit of two unstated parameters, not a test. The datum is also indexed by antibody condition, which no model input here can sweep. In the other direction, this record's measurements (force_adhesive, about 1 dyne, from ref. 52; sugar concentrations c_sugar_low, c_sugar_high) are outputs of no elosegui2014 model: its clutch model is not runnable and its other models are ratios of its own SPR rates and integrin densities."},{"id":"q_xval_erdmann2004_none","kind":"reading","text":"(Cross-record validation.) No model of this record is validated against a measurement of erdmann2004, which cites this paper (its ref. 1) for the loaded off-rate, the critical force and the deterministic cluster equation. erdmann2004 is theory only: every plotted curve is a model result (Monte Carlo or analytic), and it has no datum of origin measured. Its only experimental numbers are inputs taken from other works (k0 = 0.012 Hz and Fb = 9 pN for a5b1-integrin from its ref. 17, origin reported) and a critical force Fc = 5.5 nN set from a stress measured in its ref. 16; neither is a measurement the paper makes, and Bell's critical force (Eqs. 19-21) would need receptor numbers and KN2 for integrin clusters that neither paper states. In the other direction, this record's measurements (force_adhesive, about 1 dyne per cell from ref. 52; sugar concentrations c_sugar_low, c_sugar_high) are not checked by erdmann2004's models: see erdmann2004 q_xval_bell1978_none."},{"id":"q_xval_gong2018_none","kind":"reading","text":"(Cross-record validation.) No model of this record is validated against a measurement of gong2018, which cites this paper (its ref. 27) only for the Bell form of the clutch off-rate (\"Using a Bell model (27)\", gong2018 p. 2). gong2018's measurements are cell spreading speeds extracted from spreading areas (Fig. S7), spreading areas (Figs. 4D, 5D, 6D, S5A) and the relaxation stiffness of its gels (Figs. 4B, 5B, S6A). No model here outputs a spreading speed, a spreading area or a substrate stiffness: detach_time_eq17 gives the time for a cell held by bonds to detach under a constant force, and lifetime_eq16 / loaded_reverse_rate a bond lifetime or rate, none of which gong2018 measures. The shared shape (a time from a force and a rate) with gong2018's mean_field_sls is a resemblance of models, not a shared measured quantity. In the other direction, see gong2018 q_xval_bell1978_none."},{"id":"q_xval_kong2009_none","kind":"unstated_input","text":"(Cross-record validation.) No model of this record is validated against a measurement of kong2009. That paper cites this one only to set its result against it: published force-ramp work assumed that \"off rate increases exponentially with increasing force as modeled by Bell (1978), which precluded catch bonds\", while its force-clamp lifetimes \"deviate from the Bell model\" (kong2009 pp. 5-6). It does not say this paper's model predicts any of its numbers. kong2009 measured the mean lifetime (+- SEM) of single FNIII7-10/a5b1 bonds against clamped force (Figs. 3, 5, 6), plus antibody and Fc/GG-7 controls (Figs. 3 A, 4). lifetime_eq16 gives exactly that quantity, bond lifetime at a given force per bond, so the force sweep is possible. But neither paper gives the inputs for that bond. tau0 = 10^-8 s, E0 ~ 0.37 eV and r0 = 0.5 nm are this paper's estimates for an antibody-hapten bond (p. 5), not for integrin-FN, and kong2009 fits no Bell parameters. With E0 and gamma unstated over a wide range, a run would give whatever lifetime scale those choices give; the only parameter-free prediction is a lifetime that falls monotonically with force. That is a trend, and kong2009 states the comparison only in words (triphasic, not Bell-like), so it is not entered as a validation. Fitting E0 and gamma to kong2009's curve would be a fit of this model to that data, which this paper does not make. In the other direction, this record's measurements (force_adhesive, about 1 dyne per cell from ref. 52; sugar concentrations c_sugar_low and c_sugar_high) are outputs of no kong2009 model: see kong2009 q_xval_bell1978_none."},{"id":"q_xval_bangasser2013b_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of bangasser2013b, which cites this paper as its ref. 3 for the Bell off-rate law of its Eq. 5. bangasser2013b is a modelling paper. Its only data with origin measured are the computer run times of its ODE and Monte Carlo solutions (fig6b_ode_cal, fig6b_mc1_cal, fig6b_mc100_cal, Fig. 6b), which no model here can predict. Everything else it plots (bound fractions, substrate positions, clutch forces, flow, failure times) is output of its own ODE and Monte Carlo models, with origin predicted, not measured. detach_time_eq17 has the same shape as its clutch_ensemble_cycle (a time from a force and rates), but that is a relation between models, left to the job that relates models across papers. In the other direction, this record's measurements (force_adhesive, about 1 dyne, and the sugar concentrations c_sugar_low and c_sugar_high) are outputs of no bangasser2013b model: see bangasser2013b q_xval_bell1978_none."},{"id":"q_xval_bangasser2013_none","kind":"unstated_input","text":"(Cross-record validation.) No model of this record is validated against a measurement of bangasser2013, which cites this paper (its ref. 23) for the slip term of its catch-slip off-rate, Eq. 9: \"The first term in this equation is identical to the Bell model (23)\" (bangasser2013 p. 3). It does not say this paper's model predicts any of its data. bangasser2013's measured data are cell migration and traction against substrate stiffness (Fig. 1, refs. 2, 4, 7, 10-12, 15) and filopodial retrograde flow against substrate modulus (Fig. S1B, ref. 15), which no model here outputs, and Kong et al.'s integrin-FN bond lifetimes against force (bangasser2013/tau_kong_fig7c, Fig. 7C). lifetime_eq16 gives that last quantity, but its inputs for that bond are stated by neither paper: tau0, E0 and r0 here are estimates for antibody-hapten bonds (p. 5), and bangasser2013's koff and Fb were fitted to those same points within its catch-slip model, so using them would be part of a fit, not a test, and would need tau0 and E0 split from one rate. The only parameter-free prediction, a lifetime falling with force, is a trend, and the data are catch-slip. detach_time_eq17 has the same shape as bangasser2013/catch_slip_eq9 (a time from a force and rates), but no bangasser2013 measurement is a cell detachment time. In the other direction, this record's measurements (force_adhesive, about 1 dyne per cell; c_sugar_low, c_sugar_high) are outputs of no bangasser2013 model: see bangasser2013 q_xval_bell1978_none."}],"takes_from":[],"tally":{"close":4,"error":0,"no verdict":39,"not reproduced":3,"reproduced":11},"title":"Models for the Specific Adhesion of Cells to Cells","variants":[],"venue":"Science 200, 618-627","verdicts":[{"comparison":"cmp_fc_exact_1e3","computed":"3.797e-06","page":6,"printed":"≈ 4 x 10^-6","purpose":"approximation","verdict":"no verdict"},{"comparison":"cmp_fig8_KL1000_eq22","computed":"[-3.206, -3.892, -5.553, -7.169, -8.761, -10.34, …]","page":7,"printed":["-3.196 [-3.263, -3.129] read by the record's code read from Fig. 8","-3.893 [-3.956, -3.83] read by the record's code read from Fig. 8","-5.575 [-5.637, -5.513] read by "Bell's critical force per bond, fc/N0 = plog(gamma/e)","relations":[{"kind":"same_as","other":"bell1978/critical_force_eq19_20","stated":true,"status":"verified"}],"role":"model","variant_of":null},{"id":"decay_rate_eq1","name":"long-time decay rate of N(tau) from the master equation Eq. 1 with an absorbing boundary","relations":[],"role":"model","variant_of":null},{"id":"deterministic_eq4","name":"mean number of closed bonds N(tau) from the deterministic Eq. 4, starting from N(0) = N0","relations":[],"role":"model","variant_of":null},{"id":"force_scale","name":"thermal force scale of a single bond","relations":[],"role":"model","variant_of":null},{"id":"leakage_eq5","name":"leakage estimate of the decay rate, a = p1(inf) from Eq. 5","relations":[],"role":"model","variant_of":null},{"id":"lifetime_adjoint","name":"mean cluster lifetime from the adjoint master equation of Eq. 1, starting from N0 closed bonds","relations":[{"kind":"approximated_by","other":"bell1978/detach_time_eq17","stated":true,"status":"not_verified"},{"kind":"approximated_by","other":"bell1978/detach_time_eq22_exact","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"lifetime_adjoint_dimensionless","name":"mean cluster lifetime from the adjoint master equation of Eq. 1, dimensionless (in units of 1/k0), as a function of force per bond f/N0 (Fig. 4a)","relations":[],"role":"model","variant_of":null},{"id":"lifetime_approx_fig4a","name":"approximate cluster lifetime for gamma = 0 drawn dotted in Fig. 4(a)","relations":[],"role":"model","variant_of":null},{"id":"lifetime_eq8","name":"mean cluster lifetime at zero force (Eq. 8), in seconds via tau = k0 t","relations":[{"kind":"reduces_to","other":"bangasser2013/binding_time_eq10","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"lifetime_eq8_dimensionless","name":"mean cluster lifetime at zero force (Eq. 8), dimensionless (in units of 1/k0) as plotted in Fig. 4(b)","relations":[],"role":"model","variant_of":null},{"id":"mean_bonds_eq1","name":"mean number of closed bonds N(tau) from the master equation Eq. 1 with an absorbing boundary, starting from N0 closed bonds","relations":[],"role":"model","variant_of":null},{"id":"rebinding_from_critical_force","name":"rebinding rate for which a given force is critical (fc = N0 plog(gamma/e) solved for gamma)","relations":[],"role":"model","variant_of":null},{"id":"single_bond_rate","name":"dissociation rate of one closed bond when force F is shared by i closed bonds","relations":[{"kind":"approximated_by","other":"andreu2021_code/lr_rate_port","stated":false,"status":"verified"},{"kind":"reduces_to","other":"bangasser2013/catch_slip_eq9","stated":false,"status":"verified"},{"kind":"same_as","other":"bell1978/loaded_reverse_rate","stated":true,"status":"verified"},{"kind":"same_as","other":"chan2008/off_rate_eq1","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"state_probability_eq1","name":"state probability p_i(tau) from the master equation Eq. 1 with an absorbing boundary, starting from N0 closed bonds","relations":[],"role":"model","variant_of":null},{"id":"state_probability_eq5","name":"state probability p_i(tau) for f = 0 and a reflecting boundary (Eq. 5)","relations":[],"role":"model","variant_of":null},{"id":"state_probability_eq6","name":"state probability p_i(tau) without rebinding (gamma = 0) under force (Eq. 6)","relations":[],"role":"model","variant_of":null}],"of":[],"questions":[{"id":"q_leak_order","kind":"possible_error","text":"The leakage estimates are printed as \"a ≈ 4.6 x 10^-4 9.7 x 10^-3, 0.16 and 0.5 for N0 = 2, 5, 10, and 15\". Read respectively, the smallest rate goes with the smallest cluster, but p1(inf) from Eq. 5 (gamma = 1) falls with N0, and the paper says smaller N0 loses realizations faster. The computed values match the printed list taken in reverse order (N0 = 15, 10, 5, 2), so the list is probably printed in reverse. Recorded as printed; cmp_leakage is not reproduced for that reason.\n"},{"id":"q_leak_digits","kind":"possible_error","text":"Even with the reversed pairing, the value 9.7 x 10^-3 (N0 = 10) lies just outside its printed interval when compared with p1(inf) = N0 gamma/(1+gamma)^N0 from Eq. 5: the printed last digit looks truncated rather than rounded. Also, the first value lacks a separating comma in print.\n"},{"id":"q_num_order","kind":"possible_error","text":"The numerical decay rates \"a = 2.5 x 10^-4, 8.5 x 10^-3, 0.13 and 0.6\" follow the same reversed order as the leakage list (printed as for N0 = 2, 5, 10, 15). Read in reverse, the values for N0 = 2, 5 and 10 agree with the slowest eigenvalue of Eq. 1 at printed precision. Recorded as printed.\n"},{"id":"q_num_N0_15","kind":"unexplained_difference","text":"Under the reversed pairing, the numerical rate printed for N0 = 15 (2.5 x 10^-4) is well below the slowest eigenvalue of Eq. 1 and below the leakage estimate, while the other three agree with the eigenvalue. A plausible cause is the fit: Fig. 3(a) runs only to tau = 80, over which N(tau) for N0 = 15 decays by a few percent, so a Monte Carlo fit there is poorly determined. The paper does not state its fit window or number of trajectories.\n"},{"id":"q_decay_method","kind":"choice","text":"The paper obtains its numerical a from Gillespie simulations of Eq. 1 with an absorbing boundary, fitted to N(tau) ~ exp(-a tau), with unstated sample size and fit window. The record instead computes the long-time decay rate exactly as the slowest eigenvalue of the generator of Eq. 1 on the transient states i = 1..N0. This is the quantity the fit estimates in the long-time limit, but it is the reader's choice of method, not the paper's.\n"},{"id":"q_size_target","kind":"reading","text":"\"The same cluster lifetime T is achieved by N0 = 20\" (gamma = 1) and \"one needs N0 = 150 bonds\" (gamma = 0.1) are read as the smallest integer N0 whose Eq. 8 lifetime reaches the printed target T ~ 10^5 s with k0 = 1 Hz. Under that reading the build finds one bond more than printed at gamma = 1 and one fewer at gamma = 0.1, so both are close but not reproduced. The target is only an order of magnitude (\"one day\", T ~ 10^5 s), and the paper may mean that the lifetime at N0 = 20 or 150 is of order 10^5 s rather than the first N0 that reaches it.\n"},{"id":"q_lifetime_7s","kind":"unexplained_difference","text":"With N0 = 20, gamma = 0.1 and k0 = 1 Hz, Eq. 8 gives a lifetime below the printed interval of 7 s (close, not reproduced). Eq. 8 increases with N0, and a cluster one or two bonds larger would reach the printed 7 s, so the printed value may have been computed with a cluster size slightly larger than the printed N0 = 20 (compare q_size_target, where the build needs one bond more than printed to reach 10^5 s at gamma = 1).\n"},{"id":"q_10_40000","kind":"reading","text":"The paper prints that \"~10^40 000 independent bonds would be needed\" (gamma = 0, f = 0, k0 = 1 Hz, T ~ 10^5 s). The value is not recorded as a datum because 10^40000 overflows the float the build parses printed values into, and as an approximate order of magnitude it would get no verdict anyway. run_size_no_rebinding produces log10 N0 from T = H_N0 ≈ ln N0 + Γ for comparison by eye with the printed exponent.\n"},{"id":"q_Fc_area","kind":"unstated_input","text":"The paper quotes a stress constant ~5.5 nN/um^2 for cell-matrix contacts (ref. 16) and then sets Fc = 5.5 nN. Converting a stress to a force needs a contact area, implicitly 1 um^2, which is not stated; the N0 = 10^4 bonds is likewise not tied to an area.\n"},{"id":"q_fig4a_061","kind":"unstated_model","text":"Fig. 4(a) (gamma = 0) draws a dotted approximation T = ln[0.61(N0/f)], while the text gives T ≈ H_N0 - H_f ≈ ln(N0/f) for 1 < f < N0. The paper does not say where the factor 0.61 comes from (the printed asymptotics H_N0 - H_f ≈ ln(N0/f) give a factor 1; e^-Γ = 0.561 is not it). The curve is drawn but never evaluated in print, so no comparison is possible; the derivation is unstated.\n"},{"id":"q_one_day_value","kind":"reading","text":"The runs take the target lifetime as the printed T ~ 10^5 s. \"One day\" is 86400 s. With 86400 s the smallest N0 from Eq. 8 is still 21 at gamma = 1 but 147 (instead of 149) at gamma = 0.1, and log10 N0 at gamma = 0 is about 37500 (instead of about 43400), nearer the printed ~10^40000. Neither target changes a verdict on N0 = 20, but the paper does not say which value it used.\n"},{"id":"q_force_scale_approx","kind":"reading","text":"Fb ~ 4 pN from xb ~ 1 nm and T ~ 300 K is printed as an approximation, so cmp_force_scale has no verdict by design; the computed kB T/xb is consistent with it by eye.\n"},{"id":"q_stochastic_vs_bell","kind":"unexplained_difference","text":"The paper calls its model \"a stochastic version of the Bell model\" (p. 1). Tested as lifetime_adjoint approximated by Bell's deterministic detach time (bell1978/detach_time_eq17) for large clusters well above the critical force, the maximum relative error is 0.63, against an added tolerance of 0.1. The rescaled equations are the same (Erdmann's Eq. 4 in n = N/N0 is Bell's Eq. 17 with gamma = KN2, f/N0 = r0 F/kT N1). A likely cause, not tested separately, is the initial condition: Bell starts from the zero-force equilibrium n0 = KN2/(1 + KN2), Erdmann from all N0 bonds closed. Far above the critical force, the time is spent mostly near n = 1, so the offset scales it by roughly exp(-(f/N0)/gamma). The paper itself says the two descriptions differ (p. 3).\n"},{"id":"q_fig3a_order","kind":"possible_error","text":"The calibrated reading of Fig. 3(a) (the figure the decay rates are taken from) settles the pairing questioned in q_leak_order and q_num_order. Read off the plotted lines, N(tau) for N0 = 2 falls by a factor of about 380 between tau = 4 and 14 (a ≈ 0.59), for N0 = 5 by about 600 between tau = 20 and 70 (a ≈ 0.13), and for N0 = 10 only from about 4.5 to 2.8 between tau = 10 and 70 (a ≈ 0.008). These are the printed numerical rates 0.6, 0.13 and 8.5 x 10^-3 in reverse order, not the printed pairing (2.5 x 10^-4 for N0 = 2, ..., 0.6 for N0 = 15). The lines are identified as N0 = 1, 2, 5, 10, 15 from lower to upper as the caption states, and each agrees with the exact mean of Eq. 1 for its N0 (cmp_fig3a_*). The figure cannot settle q_num_N0_15: over tau = 10 to 70, rates of 2.5 x 10^-4 and 4 x 10^-4 change log10 N by 0.007 and 0.011, under one pixel (0.021 in log10 N).\n"},{"id":"q_eq6_exponent","kind":"possible_error","text":"As printed, Eq. 6 places e^{-r(j)tau} inside the braces of the product over k = i..N0, k != j, so read literally the exponential is raised to the power N0 - i. Taken that way, Eq. 6 gives p0(tau) = 1 to printed precision at every tau of Fig. 2(d), which the caption says follows from Eq. 6, while the plotted p0 rises from 0 to about 0.94 (cmp_fig2d_p0_eq6, not reproduced). The exact solution of the master equation Eq. 1 for gamma = 0, f = 50 reproduces the plotted p0 (cmp_fig2d_p0_eq1), and so does Eq. 6 with the exponential written once per term j (outside the product); for i = N0 - 1 (p9) the two readings coincide. The printed typesetting of Eq. 6 is probably a misplaced bracket; the intended formula is the standard pure-death solution.\n"},{"id":"q_fig_mc_exact","kind":"choice","text":"Figs. 2(c), 3(a) and the solid lines of 3(d) are Monte Carlo (Gillespie) results with an unstated number of trajectories. The record compares them with the exact solution of the same linear master equation Eq. 1 (matrix exponential), which is what the simulations estimate. This is the reader's choice of method, as in q_decay_method; a curve that disagrees could reflect sampling noise in the paper's simulation rather than an inconsistency.\n"},{"id":"q_fig_reading_close","kind":"reading","text":"These comparisons are \"close\" at one or two points: the computed value lies within about one pixel of the reading but just outside the interval the reading supports (half the line width for a curve, half the blob height for a dash read as a marker). At all other points of the same curves the computed value is inside the interval. A sub-pixel offset of a printed line (or, for Monte Carlo curves, sampling noise) is enough to explain it.\n"},{"id":"q_fig_code_pass","kind":"reading","text":"The second figure pass reads each curve with its own code at 1800-2000 dpi (figures.md, \"Second pass\"); intervals are about four times narrower than the 300 dpi readings'. With them cmp_fig2a_p0, cmp_fig2c_p0 and cmp_fig3d_det_N10 are reproduced at every point, so the near-misses that q_fig_reading_close describes for those three were resolution and calibration, not the curves. For Fig. 3(d), the old calibration also placed log N = 1 about 19 px (at 2000 dpi) below the top frame. The minor ticks of that log axis, at log10 2 ... 9, put it on the frame. Two points remain \"close\": the last point of each fast-decaying Monte Carlo line in Fig. 3(a) (N0 = 5 at tau = 70 and N0 = 2 at tau = 14, where N is about 4 x 10^-4 and the plotted line is visibly noisy), consistent with sampling noise (q_fig_mc_exact). For q_num_N0_15 the finer reading of the N0 = 15 line drops from 7.41 to 7.22 between tau = 10 and 70, a ≈ 4 x 10^-4. That leans towards the slowest eigenvalue rather than the printed 2.5 x 10^-4, but the two rates differ by about 1.3 px over that range, within each point's interval, so the figure still does not settle it.\n"},{"id":"q_xval_bell1978_none","kind":"unstated_input","text":"(Cross-record validation.) No model of this record is validated against a measurement of bell1978. Bell's measurements are the force needed to detach a cell, \"~ 1 dyne per cell\" (datum bell1978/force_adhesive, from his ref. 52), and the free-sugar concentrations 0.001 and 0.01 M that reverse lectin binding (c_sugar_low, c_sugar_high, inputs to his estimates). No model here outputs a concentration. critical_force gives the dimensionless critical force per bond plog(gamma/e); turning it into a force per cell needs the cluster size N0, the force scale Fb and the rebinding rate gamma of those cells' bonds, none of which either paper states for the experiment of ref. 52 (Bell's own 2.5 x 10^5 bonds per cell is a prediction made from the 1 dyne, so using it would be circular). The datum is also printed as an approximation (\"~ 1\"), which gets no verdict. single_bond_rate and lifetime_eq8 would need a measured single-bond rate or a cluster lifetime, and Bell measures neither: his lifetimes, rates and Fig. 8 are model results. In the other direction, this record has no measured datum at all (theory only; k0, Fb and Fc are reported inputs from refs. 16-17): see bell1978 q_xval_erdmann2004_none."},{"id":"q_xval_chan2008_none","kind":"unstated_input","text":"(Cross-record validation.) No model of this record is validated against a measurement of chan2008. Chan's measurements are filopodial retrograde flow rates (Fig. 3C-D, S8C), the peak filopodial force <T> = 110 ± 25 pN and the bead-contact distance (Fig. S10), failure frequencies against gel stiffness (Fig. S5D), and histograms of bead steps, strains and radial deviations (Figs. 3C, 4D-E, S4, S5, S11). No model here outputs a flow rate, a displacement or a histogram. The models here hold a cluster under a constant force F with no substrate, while every Chan measurement comes from bonds loaded at a rate set by myosin and a compliant gel (load and fail), and the measurements differ by gel stiffness, which no model here takes as an input. Chan says so of Schwarz and coworkers' analysis: \"Schwarz and coworkers treat the force as acting normal to the adhesion cluster\" (chan2008 p. 31; that is their J. Chem. Phys. paper, see chan2008/q_ref_S56_source). The nearest candidates fail on quantity or conditions: critical_force gives the force above which a constant-force cluster has no stable state, not the peak of a load-and-fail traction trace (a different quantity, and Chan's myosin number was tuned to that peak); lifetime_eq8 is the lifetime at zero force, and lifetime_adjoint and decay_rate_eq1 at constant force, so neither gives a failure frequency on a gel of given stiffness. Running them would also need N0, gamma and k0 for the filopodial clutches, which Erdmann does not state; Chan's nc, kon, koff and Fb are values of his own model, several tuned to these neurons. In the other direction, this record has no measured datum (theory only): see chan2008/q_xval_erdmann2004_none."}],"takes_from":[],"tally":{"close":0,"error":0,"no verdict":1,"not reproduced":3,"reproduced":30},"title":"Stability of Adhesion Clusters under Constant Force","variants":[],"venue":"Phys. Rev. Lett. 92, 108102","verdicts":[{"comparison":"cmp_leakage_vs_numerical","computed":"[0.00046, 0.0097, 0.16, 0.5]","page":3,"printed":["2.5 x 10^-4","8.5 x 10^-3","0.13","0.6"],"purpose":"approximation","verdict":"not reproduced"},{"comparison":"cmp_critical_force","computed":"0.2785","page":3,"printed":"0.278","purpose":"reproduction","verdict":"reproduced"},{"comparison":"cmp_decay_rate","computed":"[0.5858, 0.1299, 0.008523, 0.0004214]","page":3,"printed":["2.5 x 10^-4","8.5 x 10^-3","0.13","0.6"],"purpose":"reproduction","verdict":"not reproduced"},{"comparison":"cmp_fig2a_p0","computed":"[0.6001, 0.7359, 0.8312, 0.8943, 0.9346, 0.9599]","page":2,"printed":["0.6009 [0.5971, 0.6046] read by the record's code read from Fig. 2(a)","0.7363 [0.7333, 0.7394] read by the record's code read from Fig. 2(a)","0.8316 [0.8289, 0.8342] read by the record's code read from Fig. 2(a)","0.8944 [0.8918, 0.897] read by the record's code read from Fig. 2(a)","0.9347 [0.9325, 0.9369] read by the record's code read from Fig. 2(a)","0.9597 [0.9575, 0.9619] read by the record's code read from Fig. 2(a)"],"purpose":"reproduction","verdict":"reproduced"},{"comparison":"cmp_fig2b_p5","computed":"[0.2431, 0.2457, 0.246, 0.2461, 0.2461]","page":2,"printed":["0.2432 [0.2411, 0.2453] read by the record's code read oduced":5},"counts":{"added":2,"comparisons":42,"data":141,"models":5,"questions":37,"references":32,"runs":41},"id":"chan2008","kind":"article","label":"Chan & Odde 2008","models":[{"id":"cerruti_force_eq11","name":"filopodial point force and force-to-bead distance from two marker beads (Eqs. 11-12)","relations":[],"role":"model","variant_of":null},{"id":"ksub_eq13","name":"substrate spring constant from Young's modulus by the 1-D Cerruti solution (Eq. 13)","relations":[{"kind":"scales_as","other":"gong2018/boussinesq_eq_s9","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"motor_clutch","name":"stochastic motor-clutch model of a filopodium on a compliant substrate (SOM Eqs. 1-5)","relations":[{"kind":"derived_from","other":"andreu2021_code/cmstretchg_port","stated":true,"status":"unverifiable"},{"kind":"approximated_by","other":"bangasser2013/motor_clutch_ssa","stated":true,"status":"not_verified"},{"kind":"derived_from","other":"bangasser2013/motor_clutch_ssa","stated":true,"status":"unverifiable"},{"kind":"approximated_by","other":"bangasser2013b/clutch_ensemble_cycle","stated":true,"status":"not_verified"},{"kind":"derived_from","other":"chaudhuri2015/lattice_spreading","stated":true,"status":"unverifiable"},{"kind":"derived_from","other":"elosegui2014/integrin_clutch_sim","stated":true,"status":"unverifiable"},{"kind":"approximated_by","other":"elosegui2016/clutch_no_talin_sim","stated":false,"status":"not_verified"},{"kind":"derived_from","other":"gong2018/mean_field_sls","stated":true,"status":"unverifiable"},{"kind":"approximated_by","other":"odde_code/mc_event_port","stated":true,"status":"not_verified"},{"kind":"approximated_by","other":"odde_code/mc_event_port","stated":true,"status":"not_verified"}],"role":"model","variant_of":null},{"id":"motor_clutch_E","name":"motor-clutch model run against a gel's Young's modulus, κsub from Eq. 13","relations":[],"role":"model","variant_of":null},{"id":"off_rate_eq1","name":"effective dissociation rate of an engaged clutch under tension (Eq. 1)","relations":[{"kind":"reduces_to","other":"bangasser2013/catch_slip_eq9","stated":false,"status":"verified"},{"kind":"same_as","other":"bangasser2013b/clutch_offrate_eq5","stated":false,"status":"verified"},{"kind":"same_as","other":"bell1978/loaded_reverse_rate","stated":true,"status":"verified"},{"kind":"same_as","other":"chaudhuri2015/bell_off_rate","stated":false,"status":"verified"},{"kind":"same_as","other":"erdmann2004/single_bond_rate","stated":false,"status":"verified"},{"kind":"same_as","other":"gong2018/bell_off_rate","stated":false,"status":"verified"}],"role":"model","variant_of":null}],"of":[],"questions":[{"id":"q_time_step","kind":"reading","text":"The simulation time step is printed three ways: \"5-10 ms\" (SOM p. 4), \"60,000 time steps (300 s)\", which is 5 ms (SOM p. 5), and \"the simulation time step (10 ms)\" (SOM p. 14). The record uses 5 ms, the only value consistent with 60,000 steps in 300 s, and refines dt."},{"id":"q_dt_dependence","kind":"numerics","text":"On soft substrates the simulated retrograde flow depends strongly on the time step. With Table S1 parameters at κsub = 0.17 pN/nm (260 Pa), mean flow is about 114 nm/s at dt = 10 ms, about 76 at 5 ms, 52 at 2.5 ms, 47 at 1.25 ms and about 45 at 0.625 ms and below; seed scatter is about 2 nm/s. At κsub = 1 pN/nm it falls from about 83 (5 ms) to about 30 nm/s. On stiff substrates (κsub ≈ 38 pN/nm) it moves only from 109 to 107. At 5 ms the per-step stretch of a lone clutch (κc |vu| dt ≈ 3 pN) exceeds |Fb| = 2 pN. The paper's curves (Fig. 1D, S1) and its agreement with experiment (Fig. 3, 78 ± 4 nm/s at 260 Pa) match this record's 5 ms results. At a settled step the soft-substrate flow is far slower than the measured mean, and the minimum of Fig. 1D deepens. This holds for the record's implementation of the stepping rules; the paper does not state them in full (q_binding_rule), and a different scheme could move differently with dt. As printed, though, the soft-substrate predictions belong to the numerics."},{"id":"q_eq13_delta","kind":"reading","text":"The fit parameter Δ = 277 nm corrects the κsub of Eq. 13, but the paper does not say how (replace δ, add to δ, or something else). Every run against a gel modulus depends on this. The record takes Δ in place of δ and runs δ + Δ = 427 nm and δ = 150 nm as alternatives. Fig. 1D (κsub in pN/nm) and Fig. S1A (E in kPa) seem to show the same simulation with its minimum near 0.3-0.4 in both units. That suggests about 1 pN/nm per kPa, closer to δ + Δ (1.03) than to Δ (0.67) or δ (0.36)."},{"id":"q_nu_eq13","kind":"unstated_input","text":"Eqs. 10-13 use the gel's Poisson ratio υ without giving its value there. The record uses υ = 0.3, the value the paper states for the same hydrogels in the Hertz analysis (Eq. 8)."},{"id":"q_binding_rule","kind":"unstated_model","text":"The stepping rules are not stated in full. Where a newly engaged clutch attaches, how rates become per-step probabilities, and the initial state are left open. The record assumes: a clutch engages unstretched at xsub, probabilities are 1 - exp(-k dt), and all clutches start unbound with xsub = 0. Eq. 3 is applied without clamping the velocity."},{"id":"q_statistics","kind":"unstated_model","text":"\"The simulation is allowed to run for 60,000 time steps (300 s) to ensure the simulation has reached steady-state before statistics are calculated\" does not say over what window the statistics are taken. It also does not say how many independent runs make each plotted point or which seed was used. The record averages over the whole 300 s of one run with seed 1."},{"id":"q_single_run_noise","kind":"numerics","text":"Each plotted point rests on stochastic simulation. With one 300 s run per point, run-to-run scatter can be several nm/s near the load-and-fail/slippage transition. The jagged red curve of Fig. S1A between 2 and 6 kPa shows such scatter in the paper too. The refinements show how much the result moves with dt and with run length."},{"id":"q_fig3c_labels","kind":"possible_error","text":"The Fig. 3C caption reads \"stiff substrate (purple): E = 260-Pa PAG ... soft substrate (red): E = 57-kPa PAG\". That swaps stiff and soft relative to the moduli and to the rest of the paper. The record ties each mean to the modulus in the panel legend (purple 260 Pa, red 57 kPa)."},{"id":"q_T_sign","kind":"reading","text":"The maximal filopodial force is printed as 110 ± 25 pN in the text and as <T> = -110 ± 25 pN in Fig. S10D. The sign follows the model's convention that retrograde is negative x. The model is compared with the figure's signed value."},{"id":"q_tmax_definition","kind":"choice","text":"The printed <T> is the mean over 18 traces of each trace's maximum force, taken on gels whose stiffness is not given. The record compares it with the largest force in one simulated 300 s run on a 730 Pa gel (alternatives 260 and 1300 Pa). nm was set by hand to match <T>, so this is a check of that tuning, not an independent validation."},{"id":"q_s12_within_5pct","kind":"overstated_claim","text":"Fig. S12F says measured velocity agrees with simulated velocity \"to within 5%\". The printed pair 100 vs 106 ± 2 nm/s is 6% apart. Every measured mean lies above its simulated value and outside its printed SEM."},{"id":"q_eq11_inputs","kind":"unstated_input","text":"<T> = 110 ± 25 pN and δ = 150 ± 30 nm come from Eqs. 11-12 applied to 18 bead traces. The per-trace inputs (E, U1, U2, L) are not printed, so the model is recorded but cannot be run on the paper's inputs."},{"id":"q_vpoly","kind":"unstated_input","text":"Eq. 6 (vedge = vpoly + vfilament) needs vpoly, which is not in Table S1. Only Movie S1 gives vpoly = 70 nm/s, for an altered parameter set. No printed result rests on Eq. 6, so it is not modelled."},{"id":"q_figure_parameters","kind":"reading","text":"The paper does not say which parameter set produced Fig. 1. Movie S1 uses altered parameters. The record assumes Table S1 for Fig. 1D, Fig. 3D and Fig. S1, apart from the koff and nc changes the Fig. S1 legends name. The Fig. 1D stiff-substrate plateau near 110 nm/s fits vu = -120 nm/s, not the altered -100 nm/s."},{"id":"q_figure_readings","kind":"reading","text":"The simulated curves are printed only as figures. Values were read by the record's reader off the page images at decade ticks, roughly to ±3 nm/s for Fig. S1 (gridded) and ±5 nm/s for Fig. 1D (small, no grid). They are recorded as approximate, so they get no verdict. Their differences are kept."},{"id":"q_signs","kind":"reading","text":"Table S1 prints Fm = -2 pN, Fb = -2 pN and vu = -120 nm/s, while the cited sources give positive magnitudes. Read as the model's convention that retrograde motion is negative x. With these signs, Eqs. 1-5 are self-consistent: clutch tension is negative, so Fclutch/Fb > 0 and the off rate grows under load. The values are used as printed."},{"id":"q_cycle_time","kind":"reading","text":"The main text says load-and-fail cycles have \"protracted periods (~ 10 to 100 s)\". An approximate range cannot be recorded as a printed value with its \"~\" kept. This prediction and the \"abrupt change around 1 kPa\" are not compared."},{"id":"q_U_strain","kind":"reading","text":"Eqs. 10-12 call U, U1 and U2 the \"strain\" of the substrate at a marker bead. For T in Eq. 10 (πEδU/(1+υ)) to be a force, U must be a length, and Fig. S10A draws U as the bead's displacement from its unloaded position. The record reads U as a displacement in nm. Eq. 13 (κsub = T/U) rests on the same reading."},{"id":"q_fig3d_not_compared","kind":"reading","text":"Audit disagreement with the first reader's scope. The record leaves out the dashed simulation curve of Fig. 3D (mean retrograde flow against E in kPa). That curve is the only printed model output that the paper says uses Δ = 277 nm (\"Using this fitting parameter (Δ=277 nm) ... (p=0.09; Fig 3d)\"). So it is the one place where the readings of how Δ enters Eq. 13 (L_eq13_added: Δ, δ + Δ or δ) could be tested against the paper itself. The record's Fig. S1 comparisons are with curves that the paper does not tie to Δ. The audit could not read Fig. 3D reliably at page-image resolution (axis 60-120 nm/s, 0.1-100 kPa, panel about 200 px wide). A higher-resolution reading should add it."},{"id":"q_fig_same_curve","kind":"reading","text":"Added in the figure reading. The calibrated readings of Fig. 1D (flow against κsub in pN/nm), Fig. S1A (black line, against E in kPa) and Fig. 3D (dashed simulation, against E in kPa) agree within their reading intervals at the same numbers on x (1, 2 and 5; and 1.5 for S1A and 3D). So the three figures plot one simulated curve, with κsub in pN/nm numerically equal to E in kPa. Through Eq. 13 with υ = 0.3, that is a length of 1.3/π µm. That is near δ + Δ (427 nm) and far from Δ (277 nm) or δ (150 nm). It may also be a plain unit relabelling (1 pN/nm per kPa) rather than any reading of Eq. 13. The paper says only that Fig. 3D uses Δ = 277 nm. The comparisons cmp_fig3d_sim_* and cmp_figS1A_*_read, with the build's alternatives of L_eq13_added, show which reading reproduces the plotted curves."},{"id":"q_ref_S56_source","kind":"reading","text":"Reference S56 is linked to the record erdmann2004, but S56 is printed as Erdmann and Schwarz, J. Chem. Phys. 121, 8997 (2004), while erdmann2004 is their Phys. Rev. Lett. 92, 108102 (2004). The two papers treat the same stochastic cluster model, but they are different works. The comparison in the SOM (\"similar Bell model assumptions\", normal force on all bonds, rebinding with no load) is with S56 and S57, not with the record's paper. So no stated relation between chan2008 and erdmann2004 is entered. The proposed relation rel_erdmann_off_rate compares only the two papers' Bell off-rates."},{"id":"q_fig3c_counts","kind":"reading","text":"Read bar by bar (hist_fig3c_260), the blue (260 Pa) bar heights of Fig. 3C come in whole multiples of 1/95. So the caption's n = 95 does belong to the 260 Pa gel, as the caption pairs them, and only its words \"stiff\" and \"soft\" are swapped (q_fig3c_labels). Each histogram's bars sum to 1 within the reading. Taking each bin at its centre (label minus 5 nm/s, Excel's upper-edge labels), the bars' means agree with the printed in-panel means (78 and 105 nm/s). Neither check is recorded as a comparison, because the record has no model for histogram moments."},{"id":"q_figS8C_vs_fig3","kind":"unexplained_difference","text":"Fig. S8C plots GFP-actin transfected filopodia on 260 Pa gels with n = 77 and a mean read near 84 nm/s, while Fig. 3C gives 78 ± 4 nm/s (sem) with n = 95 on the same gel for transfected neurons. The SOM does not say whether S8C is a subset or a separate set of measurements. At 24 kPa, S8C's transfected bar (n = 122) can be set beside the Fig. 3D orange point. The error bars of S8C and S5D are not described (error_bars: unstated)."},{"id":"q_failure_frequency_model","kind":"unstated_model","text":"The SOM says the measured failure frequency (Fig. S5D) rises with stiffness \"as predicted by the model\", but no simulated failure frequency is printed or plotted, and the record's motor_clutch model has no failure-count output. The measured frequencies are recorded as figure readings with their error bars, so that a model giving failure rates can be validated against them."},{"id":"q_no_validation_bell1978","kind":"unstated_model","text":"Cross-validation against bell1978 found no measurement to enter, in either direction. Chan cites Bell (ref. 10, SOM ref. S5) only for the form of the loaded off-rate (Eq. 1, \"Bell's Law (10)\"), not for data, and neither paper compares its model with the other's measurements. The only measurements in bell1978 are a force of about 1 dyne to detach a cell (from ref. 52, given only as \"~ 1\", an order of magnitude) and the concentrations of free sugar (0.001-0.01 M) that inhibit agglutination (ref. 49). None of this record's models (off_rate_eq1, motor_clutch, motor_clutch_E, cerruti_force_eq11, ksub_eq13) outputs a force on a whole cell or an inhibitor concentration. In the other direction, none of bell1978's models outputs what Chan measured (retrograde flow rate, filopodial traction, bead displacement statistics, failure frequency): Bell's loaded reverse rate is the off-rate of one bond at a known force per bond, while the failure frequency of Fig. S5D counts load-and-fail cycles of a whole filopodium, and no clutch tension is measured; Bell's rupture and critical forces are per bond, while the 110 pN peak is the traction of a whole filopodium."},{"id":"q_no_validation_chaudhuri2015","kind":"unstated_model","text":"Cross-validation against chaudhuri2015 (which cites this paper as refs. 19 and S1 for its model framework) found no measurement of chaudhuri2015 that a model here predicts. chaudhuri2015 measured cell spreading areas, the fraction of cells with stress fibres, attached or proliferating, nuclear YAP ratios, the AFM Young's moduli of alginate gels, and their stress relaxation and normalized storage and loss moduli. None of this record's models outputs any of these. motor_clutch and motor_clutch_E give a filopodium's retrograde flow rate and its mean and peak traction force. off_rate_eq1 gives a clutch off rate, ksub_eq13 a substrate spring constant from a given modulus, and cerruti_force_eq11 a point force from bead displacements. In the other direction, see chaudhuri2015/q_xval_chan2008_none: its runnable model gives a spreading speed, not the retrograde flow rate measured here."},{"id":"q_no_validation_craig2015","kind":"unstated_model","text":"Cross-validation against craig2015 (which cites this paper as ref. 17, only among \"recent modeling studies [16-19]\" of adhesions as sticky springs, p. 3, and never compares with it) found no measurement of craig2015 that a model here predicts. craig2015 measured the lamellar actin flow speed and the whole-cell total traction force of U2OS cells under Y-27632 (supp. fig. 1(a)-(c), from its ref. 31), a leading-edge flow speed of PtK1 lamellipodia (\"~20 nm/s\", from its ref. 14, approximate) and paxillin and myosin intensity profiles (Fig. 2(d)). motor_clutch and motor_clutch_E give the retrograde flow rate and the traction force of one filopodium on a substrate of given stiffness. That is a different quantity from a lamellar or lamellipodial flow speed and from a cell's total force in nN. craig2015 gives no substrate stiffness for its cells either, nor how Y-27632 maps onto the motor number nm. A run would rest on added inputs and still not predict the measured quantity. cerruti_force_eq11 needs bead displacements, which craig2015 does not have; off_rate_eq1 and ksub_eq13 give nothing measured there. The shared shape of cerruti_force_eq11 and craig2015/lamellipodial_width (a length from a length and a pressure) is formal: one is a point force from substrate bead displacements, the other a lamellipodial width from network viscosity and traction. In the other direction, see craig2015/q_no_validation_chan2008."},{"id":"q_no_validation_elosegui2014","kind":"unstated_model","text":"Cross-validation against elosegui2014 (which cites this paper as its ref. 7 and describes its integrin-FN clutch model from this one) found no measurement of elosegui2014 that a model here predicts on that paper's conditions. elosegui2014 measured the average traction stress (Pa) of myoblasts, their actin rearward flow speed at the cell periphery (kymographs), integrin densities in adhesions and on the membrane, bead detachment times and SPR responses, on FN gels of 0.25-29 kPa. motor_clutch_E could be run at those gel moduli, but it outputs the retrograde flow and the force (pN) of one filopodium: the traction stress is a different quantity, and the flow is a filopodial one, not a peripheral lamellar one. Its other inputs for myoblasts (nm, Fm, vu, nc, kon, koff, Fb, kc, the Eq. 13 length and the gels' Poisson ratio) are stated by neither paper: elosegui2014's own values are in its Supplementary Table 1, which renders blank there (elosegui2014/q_si_unreadable). Several values here were tuned to this paper's neurons (Table S1: nm, nc, kon), so a run with them would predict chick neuron filopodia on elosegui2014's gels, not the cells measured; elosegui2014 also says this model \"did not include reinforcement\", which is its explanation of the measured trends. cerruti_force_eq11 needs bead displacements elosegui2014 does not report; off_rate_eq1 and ksub_eq13 give nothing measured there. In the other direction, see elosegui2014/q_no_validation_chan2008."},{"id":"q_no_validation_elosegui2016","kind":"unstated_input","text":"(Cross-record validation.) No model of this record is validated against a measurement of elosegui2016, which cites this paper (ref. 4, ST1-3) and says its talin-depleted cells \"fully abide by the clutch model first proposed eight years ago\" (elosegui2016 p. 8). motor_clutch_E has the same shape as elosegui2016's clutch_no_talin_sim and could be run at its gel moduli (0.6-29 kPa), but run with this record's inputs it predicts a chick forebrain neuron filopodium: several Table S1 values were tuned to these neurons (nm, nc, kon), and koff, Fb and the Eq. 13 length are those of a filopodium on these gels. Neither paper states nm, nc, kon, koff, Fb or kc for mouse embryonic fibroblasts; elosegui2016 parametrises its clutch differently (fibronectin number nf, intrinsic binding rate kont times integrin density, a two-exponential catch bond, adhesion radius), so its values cannot be put into these ports, and only vu (110 nm/s, taken partly from this paper) has a counterpart. So no run would be on the measurement's own cells. The measured quantities also differ: elosegui2016 measures actin speed in kymographs \"at the cell periphery\" of fibroblasts (p. 10), not in filopodia, and cell traction as a stress (Pa), while this model gives the flow and the force (pN) of one filopodium. Measurements considered and not used: Fig. 3e flows of shRNA and control cells (other cells and structure; the control cells also reinforce through talin, which this model lacks), Fig. 1a, 3d, 4, 5, 6a-i and Supplementary Figs. 2, 5 tractions (stress, not a filopodial force), and the adhesion lengths, YAP ratios, densities, areas and bond lifetimes, which no model here outputs. In the other direction, see elosegui2016/q_xval_chan2008_none."},{"id":"q_xval_erdmann2004_none","kind":"unstated_input","text":"(Cross-record validation.) No model of this record is validated against a measurement of erdmann2004: that paper is theory only and its record holds no measured datum (its k0, Fb and Fc are reported inputs from its refs. 16-17, everything else is a model result). off_rate_eq1 has the same shape as erdmann2004/rebinding_from_critical_force (a rate from a force and a rate), but the rebinding rate it would be compared with is computed there, not measured. The paper's comparison with Schwarz and coworkers (S56, S57) is qualitative and is with their J. Chem. Phys. paper, not this record's (q_ref_S56_source). In the other direction, see erdmann2004/q_xval_chan2008_none."},{"id":"q_xval_gong2018_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of gong2018. That paper is later and cites this one (its ref. 15) for the motor-clutch model, so this paper makes no claim about its data. gong2018 measures cell spreading areas (Figs. 4D, 5D, 6D, S5A), spreading speeds derived from those areas (Fig. S7) and gel stress-relaxation stiffness (Figs. 4B, 5B, S6A). motor_clutch and motor_clutch_E output the filopodial retrograde flow rate and a mean and a peak traction force. That is neither a spreading speed (gong2018's Vs = Vp - Vf needs a polymerization speed this model does not have) nor an area, and the models are parametrized for neuron filopodia (Table S1), not for the fibroblasts, MSCs and U2OS cells of gong2018. ksub_eq13 has the same shape as gong2018/boussinesq_eq_s9, but gong2018's relaxation stiffness in pN/nm is a measured modulus relabelled with that paper's own 1 kPa = 1 pN/nm, not a measured spring constant. Running Eq. 13 on that modulus would test one conversion against another, with a length (δ or Δ) stated for filopodia, not for those cells. off_rate_eq1 has no measured counterpart there. In the other direction, see gong2018/q_xval_chan2008_none."},{"id":"q_xval_odde_code_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of odde_code, the Odde lab's event-stepping MATLAB scripts, which say they reduplicate this model. odde_code is software: its data are parameter values and results copied from papers' records, and none is measured. In the other direction, odde_code's ported model is run against this record's measured mean flows on the 260 Pa and 57 kPa gels (odde_code/val_c08_v260 and val_c08_v57k), entered as fits because κsub rests on the fitted Δ. See odde_code/q_xval_chan2008_scope for the measurements not used."},{"id":"q_xval_andreu2021_code_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of andreu2021_code. That code is later and builds on this model, so this paper makes no claim about its data. Its measured data are nuclear/cytoplasmic YAP ratios and paxillin adhesion lengths of cells under cyclic biaxial stretch of 2.5-20% at 0.125-2 Hz (experimental data.mat: andreu2021_code/yap_exp_* and length_exp_*, with unstretched and square-wave points). motor_clutch and motor_clutch_E have no stretch amplitude or frequency input (the flow is driven by myosin, Eqs. 3-4), no integrin density or reinforcement, and output a retrograde flow rate and a mean and a peak traction, none of which is a YAP ratio or an adhesion length; they are parametrized for neuron filopodia (Table S1). ksub_eq13, off_rate_eq1 and cerruti_force_eq11 have no measured counterpart there. In the other direction, see andreu2021_code/q_xval_chan2008_none."},{"id":"q_xval_bangasser2013b_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of bangasser2013b. That paper is later and theoretical: its only measured data are computer run times of its ODE and Monte Carlo solutions (bangasser2013b/fig6b_ode_cal, fig6b_mc1_cal, fig6b_mc100_cal), which no model here predicts. Its other plotted values are model predictions, not measurements; how motor_clutch relates to its clutch-ensemble ODEs is left to the job that relates models. In the other direction, bangasser2013b's ODEs are entered against this record's Fig. 3C flow means as fit_quality (bangasser2013b/validations.yaml)."},{"id":"q_xval_bangasser2013_figS1b_positions","kind":"reading","text":"(Cross-record validation.) val_flow_bangasser_figS1b runs motor_clutch_E at the moduli where bangasser2013 Fig. S1B draws this paper's six flow means: about 0.13, 0.37, 0.65, 0.76, 24 and 56 kPa. This paper's gels are 260 and 730 Pa, 1.1, 1.3, 24 and 57 kPa, so the four soft points are drawn at 0.5-0.6 times the moduli printed here (bangasser2013 q_xval_chan2008_figS1b_positions). The not-reproduced verdict therefore says that the re-plotted points and this model disagree at the plotted moduli. It does not say the model misses this paper's own Fig. 3D (val_fig3d_exp_sem)."},{"id":"q_xval_bangasser2013_unused","kind":"choice","text":"(Cross-record validation.) Measurements of bangasser2013 considered and not entered against this record's models: Kong et al.'s integrin-fibronectin bond lifetimes (bangasser2013/tau_kong_fig7c) show catch behaviour that the slip-bond off_rate_eq1 cannot give, and off_rate_eq1 outputs a rate, not a lifetime; this paper does not claim its clutch is that bond. The normalized migration and traction points of Fig. 1 (bangasser2013/migration_fig1a_*, traction_fig1b_*) are normalized to each data set's maximum, which no model here outputs; the neuron traction points (ref. 15) are this paper's, re-normalized."},{"id":"q_xval_andreu2021_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of andreu2021. andreu2021 cites this paper (its ref. 21) once, as an example of clutch models of ECM rigidity sensing (andreu2021 p. 2), and says no model here explains or predicts its data. The one measurement of andreu2021 whose quantity a model here outputs is the actin retrograde flow of its Fig. 1b (andreu2021/fig1b_flow: mouse embryonic fibroblasts on 0.6 kPa gels, and at the very edge of lamellipodia on glass), against motor_clutch_E's v_retro. It is not entered: (1) every parameter of motor_clutch_E (Table S1: nm, Fm, vu, nc, kon, koff, Fb, kc) and the Eq. 13 length Δ = 277 nm are this paper's set for embryonic chick forebrain neuron filopodia, with nc and kon tuned to the flows measured here; neither paper gives them for fibroblast lamellipodia, so all would be added inputs and the verdict would test them, not this model; andreu2021's own clutch parameters (Supplementary Table 4) belong to a catch-bond model without motors whose actin speed is imposed by stretch. (2) The glass point is measured where \"adhesion is still very low\" (andreu2021 p. 2), which a run at a glass-like κsub does not represent, and no modulus for glass is printed. (3) The two points are categorical, not a curve to sweep. andreu2021's other measurements (paxillin adhesion lengths, YAP ratios, magnetic-tweezers bead speeds, loading rates and stiffnesses, AFM moduli, spreading areas) are quantities no model here outputs. In the other direction, see andreu2021/q_xval_chan2008_none."}],"takes_from":[],"tally":{"close":1,"error":0,"no verdict":7,"not reproduced":18,"reproduced":0},"title":"Traction Dynamics of Filopodia on Compliant Substrates","variants":[],"venue":"Science 322, 1687-1691 (with Supporting Online
