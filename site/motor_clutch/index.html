inted":["54.12 [43.07, 65.16] (unstated error bar) read by the record's code read from Fig. S7","94.68 [82.87, 100.9] (unstated error bar) read by the record's code read from Fig. S7","116.1 [101.2, 131.4] (unstated error bar) read by the record's code read from Fig. S7"],"purpose":"validation","verdict":"reproduced"},{"comparison":"cmp_figS7_ha","computed":"[68.35, 74.4, 120]","page":18,"printed":["58.35 [47.31, 70.04] (unstated error bar) read by the record's code read from Fig. S7","81.34 [59.65, 100.9] (unstated error bar) read by the record's code read from Fig. S7","103.1 [80.76, 125.4] (unstated error bar) read by the record's code read from Fig. S7"],"purpose":"validation","verdict":"reproduced"},{"comparison":"cmp_figS7_pa","computed":"[92.43]","page":18,"printed":["100.4 [91.69, 109.5] (unstated error bar) read by the record's code read from Fig. S7"],"purpose":"validation","verdict":"reproduced"}],"year":2018},{"authors":["Ion Andreu","Bryan Falcones","Sebastian Hurst","Nimesh Chahare","Xarxa Quiroga","Anabel-Lise Le Roux","Zanetta Kechagia","Amy E. M. Beedle","Alberto Elosegui-Artola","Xavier Trepat","Ramon Farré","Timo Betz","Isaac Almendros","Pere Roca-Cusachs"],"by_purpose":{"consistency":{"close":0,"error":0,"no verdict":1,"not reproduced":0,"reproduced":5},"reproduction":{"close":3,"error":0,"no verdict":9,"not reproduced":4,"reproduced":3},"validation":{"close":2,"error":0,"no verdict":0,"not reproduced":10,"reproduced":0}},"checked":{"close":5,"no verdict":10,"not reproduced":14,"reproduced":8},"counts":{"added":9,"comparisons":37,"data":127,"models":3,"questions":24,"references":12,"runs":13},"id":"andreu2021","kind":"article","label":"Andreu et al. 2021","models":[{"id":"clutch_stretch_sim","name":"stochastic clutch model under imposed cyclic stretch, with loading-rate-corrected rates (Methods, Eqs. 4-6)","relations":[{"kind":"approximated_by","other":"andreu2021_code/cmstretchg_port","stated":false,"status":"not_verified"},{"kind":"derived_from","other":"bangasser2013/motor_clutch_ssa","stated":true,"status":"unverifiable"},{"kind":"derived_from","other":"elosegui2016/clutch_talin_sim","stated":true,"status":"unverifiable"}],"role":"model","variant_of":null},{"id":"edge_speed","name":"deformation speed at the cell edge under triangular stretch (|v| = 2Af, A = stretch x cell radius)","relations":[{"kind":"scales_as","other":"bell1978/peak_velocity_shaking","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"supp_table1_edge","name":"deformation, deformation rate, load and loading rate at the cell edge (Supplementary Table 1, notes i-ii)","relations":[],"role":"model","variant_of":null}],"of":[],"questions":[{"id":"q_ksub_unit","kind":"possible_error","text":"Supplementary Table 4 prints the substrate spring constant as 1 µN/nm (1000 N/m), a thousand times stiffer than one clutch (1 nN/nm) and a million times the value in the authors' code (ksub = 1e-3 N/m, i.e. 1 pN/nm). The Methods say ksub was taken from the lower range of ref. 20, matching a 0.5 kPa gel, which points to the pN/nm scale. With the printed value the clutch force passes Fact within the first moments of every engagement, so no reinforcement can occur; the record runs Fig. 2e both with the printed value and with the code's value, and compares both."},{"id":"q_rate_laws","kind":"unstated_input","text":"The paper gives the integrin off-rate only as \"Catch bond\" and the talin unfolding rate only as \"Slip bond\" (Supplementary Table 4, from ref. 20); neither functional form nor parameters are printed. The record takes them from Supplementary Software 1: k_off(F) = a exp(bF) + c exp(dF) with the 'mn' coefficients, k_unf(F) = exp(-7.573) exp(1.786e12 FR F). The code's 'cm' variant, used there only above 150 pN, adds a term that vanishes beyond 0.15 pN and is identical there."},{"id":"q_scaling","kind":"unstated_input","text":"The model lines of Fig. 2e are integrin densities \"scaled between the minimum and maximum experimental length values\", with no numbers given. The record uses the affine map of the authors' code (bl = 1.2, sc = 1.4 on the YAP axis, i.e. 0.6 µm and 4.2 µm on the adhesion-length axis). In the code that map is plotted against the YAP ratios (yem), not against the adhesion lengths the text names; in the figure both axes coincide, so the line is the same."},{"id":"q_lifetime_baseline","kind":"reading","text":"For a force ramp starting from a baseline Fb the paper says only that p(F < Fb, L) = 0 and that p is renormalised; it defines the lifetime as Fm/L for a ramp from zero. The record takes the lifetime from Fb as (Fm - Fb)/L, so k' = L/(Fm - Fb), as the authors' code does; read literally (k' = L/Fm), the corrected rates at high baseline force would be much lower."},{"id":"q_loading_rate_in_sim","kind":"unstated_model","text":"The paper does not say which loading rate L each clutch's corrected rates are looked up at during the simulation. The record uses L = |v| ksub / n_bound for every bound clutch (the substrate's loading rate shared among the bound clutches), as the authors' code does, with the rate taken at the nearest grid values of L and of the clutch force."},{"id":"q_refolding","kind":"unexplained_difference","text":"The paper describes three events per clutch (unbinding, talin unfolding, actin breaking) and no talin refolding; the record's model follows the paper. The authors' code (cmstretchg.m) also lets an unfolded talin refold at kf = exp(13.07) exp(-2.288e12 FR |F|), very fast at low force, after which the clutch can unfold again (adding d_add again) or break. Any difference between the record's runs and the Fig. 2e lines may come partly from this, and from the code's step-ordering details; the andreu2021_code record runs the code itself."},{"id":"q_rate_tables","kind":"choice","text":"Numerical choices of the loading-rate correction are not printed: the force grid of Eqs. 5-6 (0.01 pN up to 200 pN), the baseline-force grid (1 pN up to 150 pN), the loading-rate grid (1 pN/s x 2^(0:0.5:16)), the cut-off below which p is treated as zero (1e-70), and the use of uncorrected rates above 150 pN. The record takes them from Supplementary Software 1 ('loading rate script.m'). They are not refined, because in a stochastic model any change of grid changes every trajectory and a refinement would mostly measure sampling noise."},{"id":"q_gillespie_scheme","kind":"choice","text":"The paper draws a waiting time for every possible event of every clutch and executes the first. The record draws the time of the first event from the total rate and picks the event in proportion to its rate, which has the same distribution and is faster. Breaking (rate infinite above Fact) happens with zero waiting time, the lowest-index clutch first, as in the authors' code. Each run averages 3 seeds."},{"id":"q_fig2e_x","kind":"reading","text":"The frequencies at which the model was simulated are not printed (Supplementary Table 4: 0.125 Hz - 2 Hz; the code uses 0.125 x 2^(0:0.5:5) Hz). In every panel the drawn line continues left of 0.125 Hz, across the axis break into the Ns region, and right to the end of the axis beyond 2 Hz, so it is a smoothed or extended curve rather than points at the labelled frequencies. The record reads it at the five labelled frequencies only."},{"id":"q_amplitude_claim","kind":"overstated_claim","text":"The amplitudes A = 1.5-3 µm are said to be \"of the order of the expected amplitudes of relative movements of cells ~20 µm in diameter being stretched by 2.5–20%\". With the paper's own edge estimate (stretch x 10 µm radius, Supplementary Table 1 note i) those movements are 0.25-2 µm, so the fitted A at low stretch is several times the estimate; the paper notes that the fitted range is narrower but not that it is shifted."},{"id":"q_validation_not_read","kind":"choice","text":"The paper judges the model by overlaying it on the measured YAP ratios and paxillin adhesion lengths (Fig. 2e, \"largely reproduced observed experimental trends\"). Those points were not read from the figure (they overlap each other and are given in the authors' source data, record andreu2021_data), so no validation comparison is made in this record."},{"id":"q_supp1_load","kind":"unstated_model","text":"In Supplementary Table 1 the Load column of the stretch row carries note (ii), which states only how loading rates were computed (deformation rate x ~2 nN/µm). The audit takes the load as the same stiffness times the deformation of note (i); the paper does not say so."},{"id":"q_supp1_order_ranges","kind":"reading","text":"The stretch row of Supplementary Table 1 prints ranges of bare powers of ten, recorded end by end and compared without verdict. Taken literally as intervals, the paper's own edge estimate falls outside some of them: at 2.5% and 0.125 Hz the deformation rate is 0.0625 µm/s (below 10^-1, and the paper's own \"~60 nm/s\" on p. 2), the load 0.5 nN (below 10^0); at 20% and 2 Hz the loading rate is 16 nN/s (above 10^1). Each is within the same order of magnitude, which is all the table claims."},{"id":"q_supp1_per_area","kind":"unstated_input","text":"The per-area columns of the stretch row (10^0 - 10^1 pN/µm2 and 10^0 - 10^2 pN/µm2/s) divide by an adhesion area \"estimated from an average 10 µm cell radius\" with adhesions in an edge band of ~2 µm; the paper does not say how the area follows from these (annulus pi(10^2 - 8^2) = 113 µm2, or strip 2 pi 10 x 2 = 126 µm2, or another). Not compared by the audit."},{"id":"q_fig1_points_read","kind":"reading","text":"The measured points that Fig. 2e overlays on the model (Fig. 2e says they are \"from Fig. 1\") are now read by code from Fig. 1e-h, where they are drawn without the shading and the model line: YAP (blue) and paxillin (red) means with their s.e.m. bars, the triangular-signal points separately from Ns and Sq. Where a red point lies partly behind a blue one its centre interval spans every place it could be, and a bar end hidden behind the other series is taken as the mirror of its visible end, with the outer interval covering the hidden span. The comparisons val_fig1*_pax_* (clutch model runs) and val_fig2e_line_vs_fig1* (the paper's own plotted lines) are the validation q_validation_not_read left out."},{"id":"q_fig2e_line_vs_data","kind":"unexplained_difference","text":"Read against the measured paxillin lengths of Fig. 1e-h, the paper's own model lines of Fig. 2e lie outside the s.e.m. bars at several frequencies: at 10% stretch the line gives about 0.81, 1.20 and 2.12 µm at 0.25, 0.5 and 1 Hz where the measured means are about 1.13, 1.79 and 2.54 µm; at 2.5% the line is about 0.69 µm at 0.125 Hz against about 1.12 µm measured. Only the 20% panel is close at every frequency. The measured lengths span about 0.70 µm (Ns, 5%) to 2.54 µm (10%, 1 Hz), while the lines span about 0.69 to 2.12 µm, so the scaling \"between the minimum and maximum experimental length values\" reaches the measured minimum but not the measured maximum. The paper claims trends (\"largely reproduced observed experimental trends\"), not values, and does not discuss the size of these departures."},{"id":"q_printed_ksub_flat","kind":"reading","text":"Run with k_sub as printed (1 µN/nm), the record's clutch model gives 0.60 µm at every frequency and stretch (no reinforcement), so all four validations against Fig. 1e-h fail at almost every point; with k_sub = 1 pN/nm (the code's value) the 20% panel comes close and the others partly. The measured data thus side with the code's value, as q_ksub_unit argues from the Fig. 2e lines."},{"id":"q_no_cross_validation_code","kind":"choice","text":"No validation of this record's clutch model against the measurements in andreu2021_code was added. Those are the YAP ratios (yap_exp_*) and adhesion lengths (length_exp_*) of experimental data.mat: the model has no YAP output, and the adhesion lengths are the same measurements as Fig. 1e-h (already compared here, val_fig1*_pax_*), plus two points a sweep over them must include but the model cannot represent: the 5.6569 Hz point is the square 1 Hz signal (Sq) and the 0 Hz point the unstretched control (Ns), not triangular-signal frequencies (andreu2021_code q_fre_ns_sq). On the five triangular points the comparison is the one this record already makes, and it is fitted (A and F_act chosen as best fits, output scaled to the experimental lengths), so it measures a fit rather than a test."},{"id":"q_no_cross_validation_data","kind":"choice","text":"No validation of this record's models against the measurements in andreu2021_data was added. Every measured datum there (634) holds the per-cell values of one condition, indexed by sample number, and the record holds no mean: it leaves means and s.e.m. to a processing model, which it does not have. The clutch model outputs one time-averaged adhesion length per stretch and frequency, the mean the paper plots, not a per-cell value. A sweep over sample number would mean nothing, and comparing the mean with each cell's value would test the cell-to-cell spread, which the model does not predict. Where the means can be compared (the paxillin lengths of Fig. 1e-h at 0.125-2 Hz), this record already compares them, read from the figure (val_fig1*_pax_*). That comparison is a fit, not a test: A and F_act were chosen as best fits, and the output is scaled to the measured lengths. The Sq and Ns blocks are not triangular-signal frequencies, which the model needs. The YAP ratios have no model output. The bead speeds, loading rates and stiffnesses of Fig. 3, Fig. 4 and Supplementary Fig. 4 come from magnetic-tweezers beads, not from the cell edge under substrate stretch that edge_speed and supp_table1_edge describe. The AFM moduli, lung YAP, gel rigidities and treatment groups have no model here. If andreu2021_data gains per-condition means, the Fig. 1e-h adhesion lengths can be entered as fit_quality."},{"id":"q_xval_bangasser2013_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of bangasser2013, which this paper cites (ref. 79) only for the Gillespie algorithm of its simulations (Methods item 3, p. 10). bangasser2013's measured data are normalized cell migration and traction of other papers' cell types vs substrate modulus (Fig. 1A-B), Kong et al.'s alpha5beta1-fibronectin bond lifetimes vs force (Fig. 7C) and Chan and Odde's neuron retrograde flow vs modulus (Fig. S1B). The models here output an integrin density and adhesion length under imposed cyclic stretch (clutch_stretch_sim) and the deformation speed, load and loading rate at the cell edge (edge_speed, supp_table1_edge): none of these quantities is measured there. clutch_stretch_sim's catch-bond rate law is a fit to Kong et al.'s lifetimes (koff_a_added and following, from Supplementary Software 1), but it is not a model of this record with a lifetime output, and the fit would make it fit_quality anyway; it has no flow output (flows are imposed by stretch, p. 10) and no traction output either. In the other direction, see bangasser2013/q_xval_andreu2021_none."},{"id":"q_xval_bangasser2013b_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of bangasser2013b, and no model of bangasser2013b against a measurement here. This paper does not cite bangasser2013b: its ref. 79 is Bangasser, Rosenfeld and Odde 2013 (Biophys. J.; the bangasser2013 record), cited only for the Gillespie algorithm (Methods item 3, p. 10). bangasser2013b is theory: its only data of origin measured are the run times of its ODE and Monte Carlo software (fig6b_*_cal), which no model here outputs. clutch_stretch_sim and bangasser2013b/clutch_ensemble_timecourse are both clutch models built from force, rates and stiffness, but the outputs differ (an integrin density scaled to an adhesion length here; bound fraction, clutch force, F-actin flow and off-rate there), and both sides' curves are predictions, not measurements. In the other direction, the one measurement here that a model there would output is the actin retrograde flow of Fig. 1b (fig1b_flow, MEFs on 0.6 kPa gels and on glass), against clutch_ensemble_cycle's cycle-mean flow; see bangasser2013b/q_xval_andreu2021_none for why it is not entered."},{"id":"q_xval_chan2008_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of chan2008, and no model of chan2008 against a measurement here. This paper cites chan2008 (ref. 21) only as an example of clutch models of rigidity sensing (p. 2) and states no comparison with its data. chan2008's measurements are embryonic chick neuron filopodia on gels without imposed stretch: F-actin retrograde flow rates and their histograms, bead displacements, step sizes, failure frequencies and filopodial forces vs gel modulus. edge_speed and chan2008/motor_clutch_E share the shape of a velocity from a length and a rate, but edge_speed's output is the deformation speed of the cell edge under externally applied cyclic stretch (|v| = 2Af), which chan2008 never imposes or measures; a retrograde flow driven by myosin is a different quantity of the same dimension, so the two are not mapped. supp_table1_edge adds only load and loading rate at the stretched cell edge, and clutch_stretch_sim outputs an integrin density scaled to a paxillin adhesion length under stretch; chan2008 measures neither. In the other direction, the one measurement here that a chan2008 model outputs is the retrograde flow of Fig. 1b (fig1b_flow); see chan2008/q_xval_andreu2021_none for why it is not entered (neuron filopodia parameters, no fibroblast set, a low-adhesion glass point)."},{"id":"q_xval_elosegui2016_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of elosegui2016 (ref. 20). clutch_stretch_sim is \"based on our previous work20\" (p. 4) and has the same input shape as elosegui2016/clutch_talin_sim, but it has no myosin motors: its clutches are loaded only by the imposed stretch (|v| = 2Af, p. 10), and its output is the time-averaged integrin density scaled to the paxillin adhesion-length axis of this paper's Fig. 2e (len0, len_scale). elosegui2016 measures unstretched MEFs pulling with their own myosin: traction and actin flow vs rigidity (its Fig. 1a, 3d, 3e, 6), vinculin, beta3-integrin and pFAK adhesion lengths (Fig. 1c, 2a, 2c, 4c, 5c), YAP, a bond lifetime (Fig. 3a) and a threshold rigidity of about 5 kPa. Run with A = 0 the model loads no clutch and stays at d_min, which predicts none of these; its length scaling is set on this paper's paxillin lengths, not on vinculin lengths; and it has no traction, flow or YAP output. edge_speed and supp_table1_edge give the kinematics of a stretched cell edge, which elosegui2016 does not impose or measure. In the other direction, the measurement here that elosegui2016/clutch_talin_sim would predict is the actin flow on 0.6 kPa gels (fig1b_flow); see elosegui2016/q_xval_andreu2021_none for why it cannot be entered as the datum is recorded."},{"id":"q_xval_kong2009_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of kong2009 (ref. 39). The paper says the integrin unbinding rate \"depends on force as a catch bond as experimentally measured20,39\" (p. 10), and the added k_off coefficients (koff_*_added, from Supplementary Software 1, koffcb.m case 'mn') are a two-exponential curve through Kong's Mn2+ lifetimes (kong2009 Fig. 3 C, lt_FN_a5b1Fc_Mn). But that rate law is not a model of its own here: it sits inside clutch_stretch_sim, whose outputs are the time-averaged integrin density and its scaling to adhesion length under cyclic stretch. kong2009 measures mean single-bond lifetimes at a clamped force (Figs. 3-6), adhesion frequencies, rupture forces and molecular stiffness; none is an output of clutch_stretch_sim, edge_speed (cell-edge speed) or supp_table1_edge (cell-edge deformation, load and loading rate). Even a lifetime model built from k_off would be a fit (fit_quality) for the Mn2+ series, not a test, and taking 1/k_off as the mean lifetime is a single-exponential assumption that kong2009's Fig. S5 argues against. In the other direction, see kong2009/q_xval_andreu2021_none."}],"takes_from":[],"tally":{"close":3,"error":0,"no verdict":9,"not reproduced":4,"reproduced":3},"title":"The force loading rate drives cell mechanosensing through both reinforcement and cytoskeletal softening","variants":[],"venue":"Nature Communications 12, 4229","verdicts":[{"comparison":"cmp_Fact_methods_table","computed":"142","page":23,"printed":"142","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_Fact_results_table","computed":"142","page":5,"printed":"about 140","purpose":"consistency","verdict":"no verdict"},{"comparison":"cmp_dadd_text_table","computed":"24","page":23,"printed":"24","purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_fig4n_fig3g_0p25hz","computed":"[1.122, 1.412, 1.588, 1.655, 1.762, 1.823]","page":6,"printed":["1.122 [1.038, 1.184] (SEM bar) read by the record's code read from Fig. 3g","1.412 [1.303, 1.518] (SEM bar) read by the record's code read from Fig. 3g","1.588 [1.454, 1.732] (SEM bar) read by the record's code read from Fig. 3g","1.658 [1.504, 1.807] (SEM bar) read by the record's code read from Fig. 3g","1.761 [1.593, 1.934] (SEM bar) read by the record's code read from Fig. 3g","1.821 [1.63, 2.009] (SEM bar) read by the record's code read from Fig. 3g"],"purpose":"consistency","verdict":"reproduced"},{"comparison":"cmp_fig4o_fig3g_4hz","computed":"[1.336, 1.925, 2.192, 2.348, 2.543, 2.621]","page":6,"printed":["1.336 [1.227, 1.455] (SEM bar) read by the record's code read from Fig. 3g","1.925 [1.756, 2.085] (SEM bar) read by the record's code read from Fig. 3g","2.19 [2.009, 2.375] (SEM bar) read by t mated_by","other":"bell1978/loaded_reverse_rate","stated":false,"status":"verified"},{"kind":"approximated_by","other":"erdmann2004/single_bond_rate","stated":false,"status":"verified"}],"role":"model","variant_of":null}],"of":["andreu2021"],"questions":[{"id":"q_ksub_unit","kind":"possible_error","text":"The code sets ksub = 1e-3 N/m (1 pN/nm); the paper's Supplementary Table 4 prints the substrate spring constant as 1 µN/nm (1000 N/m), a million times more. The code's value is the one the comment of cmstretchg.m line 31 also uses as a scale (0.1e-3 N/m default) and the one the paper's own Methods point to (the lower range of ref. 20, a 0.5 kPa gel), so the table's unit is the likelier misprint. The build's cited-value check shows the difference (paper record: q_ksub_unit)."},{"id":"q_table_cutoff","kind":"unexplained_difference","text":"'loading rate script.m' (line 44) takes the uncorrected rate wherever the density pm at the starting force is below 1e-70. The shipped tables in kofflr.mat, which stretchscriptg.m loads, do not follow that cut-off: in each row 2-4 cells next to the switch were computed with the corrected branch where pm is between about 1e-70 and 1e-100 (up to 2.3% above the uncorrected rate). With a cut-off of 1e-100 the port reproduces every one of the 2 x 33 x 151 cells of kint and kunf to 1e-9 (checked outside the build while reading); the record compares rows of both tables at both cut-offs. So the tables were made by a version of the script with another cut-off than the one released. The record's simulation uses 1e-100, i.e. the tables the code actually loads. The effect on the stretch results is small, since only cells at forces where the event is very fast are affected."},{"id":"q_refolding","kind":"unstated_model","text":"cmstretchg.m lets an unfolded talin refold at kf = exp(13.07) exp(-2.288e12 pt |F|) (line 97; about 4.7e5 /s at zero force), although its own header says talin refolding \"was not explicitly considered in this implementation, setting the array to zero\" (lines 24-26) - the array kfol is zero and unused, but line 97 computes refolding regardless. The paper describes three events per clutch and no refolding, and prints no refolding rate. A refolded clutch can unfold again (adding intadd again) and, being folded, can lose intadd on unbinding or break. The port follows the code."},{"id":"q_intadd_comment","kind":"choice","text":"intadd = 24 carries the comment \"At 1000 s: 4 at 100 s: 24\", which pairs 24 with 100 s runs, yet cmstretchg.m runs to 1000 s (line 63; a commented \"% 200\" sits beside it) and the paper prints both 24 /µm2 and 1000 s. The code as released uses 24 with 1000 s, as the paper says; the comment suggests the value was tuned for shorter runs."},{"id":"q_scaling","kind":"unstated_input","text":"The code scales the mean integrin density to its plots by bl + (mdint1/dint1 - 1) sc with bl = 1.2, sc = 1.4 (\"to scale results to experimental data\"), hand-set constants the paper does not print (it says only that model values \"were scaled between the minimum and maximum experimental length values\"). The code plots the scaled values against the YAP ratios (yem), not against adhesion lengths."},{"id":"q_twin_axes","kind":"unstated_input","text":"To compare the code's output with the paper's Fig. 2e lines, read on the adhesion-length axis, the record maps the YAP axis (1.0-2.0) onto the adhesion-length axis (0-3 µm) of the figure's twin axes. The map is read from the figure (paper record), not from the code; no alternative was run, since an error in reading the axis labels would be a whole tick and obvious."},{"id":"q_ion_cm","kind":"choice","text":"stretchscriptg.m passes ion = 'cm' (\"Custom curve to fit data\"), which adds 1000 exp(-h F) to the 'mn' off-rate, a term that falls to 0.1 /s by 0.15 pN. It is used only for clutch forces above the 150 pN end of the tables, where it is zero, so it has no effect; the tables themselves come from case 'mn' ('loading rate script.m' line 10). Above 150 pN the code also uses the uncorrected unfolding rate and breaks any folded clutch. None of this is in the paper, which gives the off-rate only as \"Catch bond\"."},{"id":"q_alternative_values","kind":"choice","text":"Comments beside several values give other values tried: mr \"680 seems to work well\" (the code uses 1200, as the paper), a 1500e-9, kont1 3.33e-4, and the off-rate coefficients 16.67, -1.945e11, 0.001442, 1.356e11. The code as released uses the first-written values, which are those the paper prints where it prints them."},{"id":"q_unused","kind":"reading","text":"Some values in the code are not used: kof1 = 0.9 and E = 9 ksub/(4 pi a) in stretchscriptg.m (lines 18-19), the array kfol of kofflr.mat (zero), the argument fstart of cmstretchg, and the 'sq' signal. The record does not enter them."},{"id":"q_unbinding_rate_commented","kind":"reading","text":"In 'loading rate script.m' both starting rates are on commented-out lines (28-29), \"uncomment desired event\"; as released the script does not run. Which line was active for which table is inferred from the tables themselves, which the port reproduces with line 29 for kint and line 28 for kunf."},{"id":"q_loading_rate","kind":"unstated_model","text":"In the simulation every bound clutch looks its rates up at L = |vf| ksub / n_bound (cmstretchg.m line 82), the substrate's loading rate shared among the bound clutches, at the nearest grid L and the nearest whole pN of force. The paper does not say this (paper record: q_loading_rate_in_sim)."},{"id":"q_port_sampling","kind":"choice","text":"The port cannot reproduce MATLAB's random stream, so each point is the mean of 3 seeds of the full 1000 s run (the code makes one run per point and does not average). The binding time of the unbound clutches is drawn as one exponential of their summed rate instead of one per clutch (same distribution)."},{"id":"q_frequencies","kind":"reading","text":"stretchscriptg.m simulates fr = 0.125 x 2^(0:0.5:5) Hz (11 frequencies, 0.125-4 Hz) and plots them with the experimental points at fre = 0, 0.125, 0.25, 0.5, 1, 2, 5.6569 Hz; fre = 0 (unstretched) and 5.6569 Hz are outside that grid. The record runs the port at the frequencies of the paper's lines and at fre."},{"id":"q_table_step","kind":"numerics","text":"Refining the force step of the rate correction (1e-14 N, line 12) by 2 and 4 moves the corrected unbinding rate at zero starting force and 1 pN/s from 11.132 to 11.114 and 11.110 /s (0.2%), more than the 0.1% tolerance the record declared; at higher loading rates it moves by less than 1e-5. The shipped tables carry this discretisation error at the lowest loading rates; it is far below the sampling noise of the simulation that uses them."},{"id":"q_validation","kind":"unexplained_difference","text":"Against the measurements the code ships, the code's model is close to the YAP ratios at 10% stretch and not reproduced at the other stretches: it misses in particular the unstretched control (model 1.20 by construction, bl), the rise at low frequency at 2.5% and 5%, and the high value at 5.66 Hz. Against the adhesion lengths (pem) it is not reproduced at any stretch, mostly lower; the code scales its output only against the YAP ratios (q_scaling). The paper says only that the model \"largely reproduced observed experimental trends\"."},{"id":"q_error_arrays","kind":"reading","text":"experimental data.mat gives means (yem, pem) and errors (yee, pee) without saying what the errors are; the record treats them as the printed uncertainty. pem/pee are not used by the scripts and carry no unit; they are taken as adhesion lengths in µm because their values fall on the adhesion-length axis of Fig. 2e. Both are said to come from the paper's source data (record andreu2021_data, not yet read)."},{"id":"q_fre_ns_sq","kind":"reading","text":"The first and last points of experimental data.mat (fre = 0 and 5.6569 Hz) are not triangular-signal frequencies: their values match the Ns (non-stretched) and Sq (square 1 Hz) points of the paper's Fig. 1e-h (andreu2021 fig1*_ns_sq; at 2.5% YAP 1.1436 and 1.5936 here, about 1.142 and 1.593 read there), and the middle five match the triangular points at 0.125-2 Hz. 5.6569 = 2^2.5 is a plotting position on the log axis. So the runs at fre (run_*_exp) and the comparisons val_yap_* and val_length_* set the triangular model at 5.66 Hz against a square 1 Hz measurement, and at 0 Hz (no movement: the scaled baseline bl) against the unstretched control. The cross-record entries in validations.yaml compare the model only with the five triangular points, read from the paper's Fig. 1."},{"id":"q_cross_fit","kind":"choice","text":"The comparisons of the code's model with the paper's Fig. 1e-h measurements (validations.yaml, val_fig1{e,f,g,h}_{yap,pax}) are entered as fit_quality, not validation: the amplitudes A were chosen because they gave good fits and F_act as the value that best fit the data (paper p. 10), and bl, sc scale the output to the experimental data. Only the shape of each curve across frequency is not tuned point by point, and the record cannot judge that shape alone."},{"id":"q_cross_source_data","kind":"choice","text":"No validation against the source data (record andreu2021_data) was entered. That record holds only the per-cell samples behind each plotted point (tables indexed by sample_number, often split into blocks), with no means or s.e.m.; the clutch model (cmstretchg_port) gives one population value per stretch and frequency (yap_scaled, adhesion_length), which cannot be set against a list of single cells, and the record has no processing model that averages the blocks into a mean per condition. The samples that matter (Fig. 1e-h, YAP ratio and paxillin adhesion length at 2.5-20% stretch, 0.125-2 Hz triangular) are those whose means the paper plots in Fig. 1 and overlays on the model in Fig. 2e, already compared here (val_fig1*_yap, val_fig1*_pax) as fit_quality, since A, F_act, bl and sc were tuned to them (q_cross_fit): averaged, they would again be a fit, not a test. The other measurements of that record (retrograde flow, bead speed, loading rate, stiffness and recruitment under optical tweezers, AFM moduli, lung YAP, other cell types) are not outputs of this model, or need conditions (bead geometry, trap stiffness, cell-type parameters) that neither source gives for it. Open: a processing model in andreu2021_data that derives the mean of each condition would let these entries be checked against the raw samples, still as fit_quality."},{"id":"q_xval_chan2008_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of chan2008, although the code says it builds on that model. chan2008 measures, in growth-cone filopodia of embryonic chick forebrain neurons on unstretched polyacrylamide gels of 260 Pa to 57 kPa: the retrograde flow rate (Fig. 3C means and histograms, Fig. 3D, Fig. S8C), the peak filopodial force and force-to-bead distance (110 +- 25 pN, 150 +- 30 nm), bead step-size histograms and failure frequencies (Figs. S4, S5) and surface tension (Fig. 4E). In cmstretchg_port the speed between actin and substrate is not produced by motors but imposed by the stretch, vf = 2 A fr sign(sin 2 pi fr t) (cmstretchg.m line 69): the flow is an input, not an output, and without stretch (fr = 0) nothing moves. Its outputs (integrin density and its YAP scaling, mean substrate force and traction, mean bound clutches) are none of chan2008's measured quantities: mf is a time-averaged force, chan2008's T the peak force of single filopodia under myosin pulling, and choosing A and fr to mimic a ~100 nm/s flow would invent a condition neither source states. lr_rate_port gives loading-rate-corrected rates that chan2008 does not measure. In the other direction, see chan2008/q_xval_andreu2021_code_none."},{"id":"q_xval_kong2009_none","kind":"unstated_model","text":"(Cross-record validation.) No model of this record is validated against a measurement of kong2009, although koffcb.m takes its off-rate \"for a5b1 integrins (kong et al. JCB)\": the 'mn' coefficients (a, b, c, d; mn_*_code) are a two-exponential curve through Kong's Mn2+ lifetimes (Fig. 3 C, read in kong2009 as lt_FN_a5b1Fc_Mn), and the unused 'mg' case a piecewise curve through the Mg2+/EGTA ones. kong2009 measures the mean bond lifetime at a clamped force (s). No model here outputs that quantity: lr_rate_port gives the unbinding rate corrected for a force ramp of loading rate L from a starting force (corrected_unbinding_rate, 1/s), and cmstretchg_port gives integrin density, its YAP scaling, mean force and traction, and bound clutches under cyclic stretch. The constant-force off-rate k_off(F) is not a model of its own in this record (it sits inside lr_rate_port), and a rate is not a mean lifetime: equating 1/k with the mean lifetime is an added single-exponential assumption that neither source states and that Kong's own Fig. S5 (two subpopulations of events) argues against. Even if such a model were added, the coefficients were fitted to this very curve, so the entry would be a fit_quality check, not a test. Kong's other measurements (adhesion frequencies, rupture-force histograms, molecular stiffness, event counts, flow cytometry) are outputs of neither model."}],"takes_from":["andreu2021"],"tally":{"close":2,"error":0,"no verdict":0,"not reproduced":0,"reproduced":7},"title":"Supplementary Software 1 of Andreu et al. 2021: molecular clutch model under cyclic stretch (MATLAB)","variants":[],"venue":"Supplementary Software 1 of Nature Communications 12, 4229","verdicts":[{"comparison":"cmp_fig2e_10","computed":"[0.7852, 0.8184, 1.166, 2.215, 1.357]","page":null,"printed":["0.787 ± 0.039","0.807 ± 0.032","1.199 ± 0.042","2.117 ± 0.032","1.298 ± 0.042"],"purpose":"reproduction","verdict":"close"},{"comparison":"cmp_fig2e_20","computed":"[0.8364, 0.9356, 1.867, 1.989, 1.077]","page":null,"printed":["0.757     var fixes = (s.variants || []).map(function (v) {
      var cs = v.corrections.map(function (c) { return '<div class="q"><div class="eyebrow">' + esc(c.equation) + "</div><div><b>" + esc(c.change) + '</b></div><div class="muted">' + esc(c.evidence) + "</div></div>"; }).join("");
      return '<div class="fix"><div class="row"><span class="mono">' + esc(v.model) + '</span> <span class="muted">corrects</span> <span class="mono">' + esc(v.of) + "</span></div>" + cs +
        "<div>" + bar(v.tally) + '<div class="counts">' + counts(v.tally) + " (comparisons computed with the corrected variant)</div></div></div>"; }).join("");
    var qs = s.questions.map(function (q) { return '<div class="q"><div class="eyebrow">' + esc((q.kind || "").replace(/_/g, " ")) + '</div><div>' + esc(q.text) + "</div></div>"; }).join("");
    var from = (s.takes_from || []).map(function (t) { return '<a href="#source-' + esc(t) + '">' + esc(short(S[t])) + "</a>"; }).join(", ");
    app.innerHTML = '<a class="back" href="#overview">← Back to the overview</a>' +
      '<header class="head"><div class="eyebrow">' + esc(kindName[s.kind] || s.kind) + "</div><h1>" + esc(s.title) + "</h1>" +
      '<div class="meta"><span>' + esc((s.authors || []).join(", ")) + "</span>" + (s.year ? "<span>" + s.year + "</span>" : "") + (s.venue ? "<span>" + esc(s.venue) + "</span>" : "") + "</div></header>" +
      '<section><h2>What was checked</h2>' + KEY + '<div class="purposes">' + (purposes || '<p class="muted">Nothing in this source is compared with a computed value.</p>') + "</div>" +
      (from ? "<p>Takes values from " + from + ", each checked against the source it comes from.</p>" : "") + "</section>" +
      '<section><h2>Models</h2><div class="tbl"><table><thead><tr><th>Model</th><th>Role</th><th>Tested relations to other sources</th></tr></thead><tbody>' + (models || '<tr><td colspan="3" class="muted">No models.</td></tr>') + "</tbody></table></div></section>" +
      (fixes ? '<section><h2>Corrections</h2><p class="muted" style="max-width:70ch">Where an equation is evidently misprinted, the record keeps the model as printed and adds a corrected variant beside it, with the evidence for the correction. The paper\'s own tally above counts only the model as printed.</p>' + fixes + "</section>" : "") +
      '<section><h2>Every comparison</h2><details><summary>' + s.verdicts.length + ' comparisons, each with the printed and the computed value</summary><div><div class="tbl"><table><thead><tr><th>Comparison</th><th>Purpose</th><th>Printed</th><th>Computed</th><th>Verdict</th><th class="num">Page</th></tr></thead><tbody>' + vrows + "</tbody></table></div></div></details></section>" +
      '<section><h2>Open questions</h2><details><summary>' + s.questions.length + " questions the record leaves open</summary><div>" + qs + "</div></details></section>";
    window.scrollTo(0, 0);
  }

  function num(v) {
    if (Array.isArray(v)) return "[" + v.slice(0, 5).map(num).join(", ") + (v.length > 5 ? ", …" : "") + "]";
    return typeof v === "number" ? esc(Number(v.toPrecision(4))) : esc(v);
  }
  function evidence(e) {
    if (!e) return "";
    var src = function (k) { var sid = k.split("/")[0]; return S[sid] ? '<a href="#source-' + esc(sid) + '">' + esc(short(S[sid])) + "</a>" : esc(sid); };
    if (e.kind === "comparison") return '<div class="ev"><div class="row"><span class="eyebrow">' + esc(e.purpose.replace("_", " ")) + "</span>" + src(e.source) + (e.page ? '<span class="muted">p. ' + esc(e.page) + "</span>" : "") + "</div>" +
      '<div class="row"><span>Printed <span class="big">' + plist(e.printed) + '</span></span><span>Computed <span class="big">' + esc(e.computed) + (e.computed_2se ? " ± " + esc(e.computed_2se) : "") + "</span></span>" + pill(e.verdict) + "</div>" +
      (e.quote ? '<div class="detail">“' + esc(e.quote) + "”</div>" : "") + "</div>";
    if (e.kind === "relation") return '<div class="ev"><div class="row"><span class="eyebrow">' + esc(relName[e.relation] || e.relation) + (e.stated ? " · stated by the paper" : " · proposed by the reader") + "</span></div>" +
      '<div class="row"><span class="mono">' + esc(e.a) + "</span> → <span class=\"mono\">" + esc(e.b) + "</span><span>" + esc(statusName[e.status] || e.status) + "</span></div>" +
      (e.detail ? '<div class="detail">' + esc(e.detail) + "</div>" : "") + "</div>";
    if (e.kind === "cited") return '<div class="ev"><div class="row"><span class="eyebrow">A value taken from another source</span>' + src(e.datum) + " takes it from " + src(e.from || "") + "</div>" +
      '<div class="row"><span>Here <span class="big">' + esc(e.printed) + (e.unit ? " " + esc(e.unit) : "") + '</span></span><span>In the source <span class="big">' + esc(e.cited_printed) + (e.cited_unit ? " " + esc(e.cited_unit) : "") + "</span></span>" + pill(e.verdict) + "</div>" +
      (e.convention ? '<div class="detail">' + esc(e.convention) + "</div>" : "") + "</div>";
    if (e.kind === "cross_check") return '<div class="ev"><div class="row"><span class="eyebrow">A model run on another source\'s inputs</span></div>' +
      '<div class="row"><span class="mono">' + esc(e.model) + "</span> on the inputs of " + src(e.on_inputs_of + "/") + "</div>" +
      '<div class="row"><span>Printed <span class="big">' + plist(e.printed) + '</span></span><span>Computed <span class="big">' + esc(e.computed) + "</span></span>" + pill(e.verdict) + "</div>" +
      (e.added.length ? '<div class="detail">Inputs added: ' + esc(e.added.join("; ")) + "</div>" : "") + "</div>";
    if (e.kind === "validation") return '<div class="ev"><div class="row"><span class="eyebrow">A model against another paper\'s measurement</span></div>' +
      '<div class="row"><span class="mono">' + esc(e.model) + "</span> against " + src(e.against) + ' <span class="mono">' + esc(e.against.split("/").slice(1).join("/")) + "</span></div>" +
      (e.status === "checked" ? '<div class="row"><span>Measured <span class="big">' + plist(e.printed) + '</span></span><span>Predicted <span class="big">' + esc(e.computed) + "</span></span>" + pill(e.verdict) + "</div>"
        : '<div class="detail">' + esc(e.status) + "</div>") +
      '<div class="detail">Why this model should predict it: ' + esc(e.basis) + "</div>" +
      (e.correspondences.length ? '<div class="detail">Taken as the same quantity: ' + esc(e.correspondences.join("; ")) + "</div>" : "") + "</div>";
    if (e.kind === "refinement") return '<div class="ev"><div class="row"><span class="eyebrow">A numerical setting refined</span>' + src(e.source) + "</div>" +
      '<div class="tbl"><table><thead><tr><th>' + esc(e.setting) + '</th><th>' + esc(e.output) + "</th></tr></thead><tbody>" +
      e.series.map(function (x, i) { return '<tr><td class="mono">' + num(x.setting) + (i === 0 ? ' <span class="muted">(the paper\'s setting)</span>' : "") + '</td><td class="mono">' + num(x.value) + "</td></tr>"; }).join("") + "</tbody></table></div>" +
      '<div class="row"><span>' + (e.settles ? "Settles" : "Does not settle") + "; the value at the paper's setting is " + (e.belongs_to === "model" ? "within" : "outside") + " the tolerance (" + esc(e.tolerance) + ") of where it settles.</span>" +
      '<span class="pill ' + (e.belongs_to === "model" ? "v-reproduced" : "v-close") + '">belongs to the ' + esc(e.belongs_to) + "</span></div>" +
      (e.tolerance_basis ? '<div class="detail">Tolerance: ' + esc(e.tolerance_basis) + "</div>" : "") + "</div>";
    if (e.kind === "family") return '<div class="ev"><div class="row"><span class="eyebrow">A family in ModelAtlas</span><span>' + e.models.length + " models · " + e.tested + " pairs tested, " + e.verified + " verified, " + e.stated + " stated by a paper</span></div>" +
      '<div class="tbl"><table><thead><tr><th>Source</th><th>As the paper writes it</th></tr></thead><tbody>' +
      e.models.map(function (m) { return "<tr><td>" + src(m.key) + '<div class="muted">' + esc(m.name) + '</div></td><td class="mono">' + esc(m.equation) + (m.page ? ' <span class="muted">p. ' + esc(m.page) + "</span>" : "") + "</td></tr>"; }).join("") + "</tbody></table></div></div>";
    if (e.kind === "question") return '<div class="ev"><div class="row"><span class="eyebrow">Open question · ' + esc((e.question_kind || "").replace(/_/g, " ")) + "</span>" + src(e.source) + "</div>" +
      "<div>" + esc(e.text) + "</div></div>";
    if (e.kind === "figure") return '<div class="ev"><div class="row"><span class="eyebrow">' + esc(e.where) + "</span>" + src(e.source) + "</div>" +
      '<img src="' + esc(e.image) + '" alt="' + esc(e.what) + '" loading="lazy"><div class="detail">' + esc(e.what) + "</div></div>";
    return "";
  }
  function caseView(id) {
    var c = D.case_studies.filter(function (x) { return x.id === id; })[0];
    if (!c) return home();
    app.innerHTML = '<a class="back" href="#overview">← Back to the overview</a>' +
      '<header class="head">' + (c.teaches ? '<div class="eyebrow">' + esc(c.teaches) + "</div>" : "") + "<h1>" + esc(c.title) + '</h1><div class="lede"><p>' + esc(c.summary) + "</p></div></header>" +
      '<section><div class="steps">' + c.steps.map(function (st) { return '<div class="step"><div><p>' + esc(st.text) + "</p>" + evidence(st.evidence) + "</div></div>"; }).join("") + "</div></section>";
    window.scrollTo(0, 0);
  }

  function route() {
    var h = (location.hash || "").slice(1);
    if (h.indexOf("source-") === 0) return sourceView(h.slice(7));
    if (h.indexOf("case-") === 0) return caseView(h.slice(5));
    home();
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
