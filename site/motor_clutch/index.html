tors_for_traction","name":"number of motors needed for a traction force when each motor stalls at Fm (p. 9, in words)","relations":[],"role":"model","variant_of":null},{"id":"optimum_eq30","name":"analytical optimum substrate stiffness (Eq. 30)","relations":[{"kind":"derived_from","other":"bangasser2013/binding_time_eq10","stated":true,"status":"unverifiable"}],"role":"model","variant_of":null},{"id":"single_clutch_ode","name":"single-clutch master-equation ODEs (Eqs. 1, 2, 4-7), state at time t","relations":[],"role":"model","variant_of":null},{"id":"tbind_eq22","name":"time for all clutches to bind, high-nc form with Euler's constant (Eq. 22)","relations":[{"kind":"approximated_by","other":"bangasser2013/binding_time_eq10","stated":true,"status":"verified"}],"role":"model","variant_of":null},{"id":"tbind_eq23","name":"time for all clutches to bind, high-nc form without Euler's constant (Eq. 23)","relations":[{"kind":"approximated_by","other":"bangasser2013/binding_time_eq10","stated":true,"status":"verified"},{"kind":"same_as","other":"gong2018/tbind_estimate","stated":true,"status":"verified"}],"role":"model","variant_of":null}],"of":[],"questions":[{"id":"q_vu_unit","kind":"possible_error","text":"Table S1 prints the motor unloaded velocity as '120 pN/nm', the unit of a spring constant. The record enters it as 120 nm/s: the flow of Fig. 2E starts at 120 nm/s, and ref. 6 gives vu in nm/s."},{"id":"q_tcycle_r","kind":"unexplained_difference","text":"The supplement says raising r from 1 to 3 lengthens the ODE cycle from 15 s to 73 s. Eqs. 8-12 and 19, on the base set at κs = 0.1 pN/nm (the stiffness of Figs. 2, S1 and S2A-C; S2E states none), give shorter cycles for both r. The refinements show the numerics do not cause this. The ratio of the two printed times (4.9) is not that of the run either, so no single stiffness fits both values exactly. The run for Fig. 2 (r = 2) also fails a little earlier than the blue line of Fig. 2B (read by eye near 28 s). Possible causes: a different stiffness for S2E, unstated ode15s settings, or a different initial state or failure criterion (q_ode_failure, q_ode_initial_state)."},{"id":"q_ode_opt_3600","kind":"unexplained_difference","text":"Fig. 4B: the ODE optimum is printed as 1 pN/nm at nm = nc = 25 and 200 pN/nm at 3600 (r = 3). The record's ODE optimum (the minimum of the cycle-averaged flow, q_ode_mean_flow) reproduces the value at 25. At 3600 it falls well below 200, even if 200 is read with one significant figure. It does not move under grid or tolerance refinement. The paper's flow curves (Fig. 4B) may have been sampled on a coarse stiffness grid, or the ODE flow may have been averaged differently."},{"id":"q_ode_mean_flow","kind":"choice","text":"The paper does not say how the actin flow of the ODE solution (Fig. 4B) is averaged. The ODE describes one load-and-fail cycle and stops at the failure (Figs. 2B, S2E). The record averages <vf> over [0, t_cycle] and takes the optimum at the minimum of that average (the Fig. 4 legend says the optimum is 'characterized by the minimum actin flow rate'). Other definitions, such as adding a rebinding phase after failure or weighting by time, could move the optimum."},{"id":"q_ode_failure","kind":"numerics","text":"Eq. 19 diverges when <Fc> reaches r Pb Fb (the constraint of p. 4), which is where the ODE solution fails abruptly (Figs. 2B, 2F). The paper does not say how ode15s handled this point or how the end of the cycle was detected. The record ends the cycle when r Pb Fb - <Fc> first falls to g_fail = 1e-3 pN after rising above it. The refinements over g_fail and rtol show that the cycle time does not depend on either."},{"id":"q_ode_initial_state","kind":"unstated_input","text":"The initial state of the ODEs is stated only for the single clutch ('initially set in the unbound state', p. 12). The record starts every cycle from Pb = 0 and <xc> = <xs> = 0, which is how the ODE lines of Figs. 2B-E and S1B-E begin."},{"id":"q_figS1_stiffness","kind":"possible_error","text":"The Fig. S1 legend gives κsub = 0.1 pN/nm for the single-clutch system (one motor, one clutch). That system stalls when κs xs = nm Fm = 2 pN, which Fig. S1D shows (clutch force 2 pN). At 0.1 pN/nm the stall position is therefore 20 nm, but Fig. S1C levels off at 200 nm, which corresponds to 0.01 pN/nm. The run on the stated value and the run on the added 0.01 pN/nm show the difference. The slow rise of S1C-E over about 5 s also fits 0.01 better. Fig. S1B, S1D and S1F do not depend on κs at steady state and agree with both runs. Either the legend or the plotted stiffness is misprinted."},{"id":"q_S2F_stiff","kind":"unexplained_difference","text":"Fig. S2F, r = 2, read by eye: the ODE cycle time is about 30 s at 0.1 pN/nm and about 0.07 s at 100 pN/nm. The run of Eqs. 8-12 and 19 agrees roughly at 0.1 pN/nm but fails about five times faster at 100 pN/nm. Only a calibrated reading can tell how large the difference is (q_eye_readings)."},{"id":"q_eq30_vs_mc","kind":"unexplained_difference","text":"The paper says Eq. 30 agrees 'very well' with the Monte Carlo optimum (Fig. 5). At the two Fig. 4 end points (base set, nm = nc = 25 and 3600, ε = 0.01) Eq. 30 lies within a factor of about 1.5 of the printed Monte Carlo optima (0.4 and 50 pN/nm), above at 25 and below at 3600. That is good agreement on a log scale, not at the printed precision. At 25, Eq. 30 lands almost on the record's ODE optimum. Fig. 5 itself (3D surfaces) was not read."},{"id":"q_eye_readings","kind":"reading","text":"The figure tools (page rendering by `boxgraph figure`, pdftoppm) were refused by this session's permission mode. The plotted ODE values were read by eye from the 110 dpi page images and carry no verdict. A calibrated reading by code of Figs. 2B-F, 4B, S1B-F, S2E and S2F would give these comparisons verdicts."},{"id":"q_audit_ode_vs_mc_slightly","kind":"overstated_claim","text":"(Audit.) The text calls the ODE optimum 'shifted slightly higher' than the Monte Carlo one (p. 5), and the Fig. 4 legend says the ODE 'may slightly over-predict the optimum stiffness' (p. 7). The paper's own printed optima are 1 against 0.4 pN/nm (n = 25) and 200 against 50 pN/nm (n = 3600), factors of 2.5 and 4. Whether that counts as 'slightly' is left open."},{"id":"q_audit_fig2b_vs_S2E","kind":"unexplained_difference","text":"(Audit, read by eye.) The r = 2 ODE line of Fig. S2E (p. 20) drops near 31-32 s, while the ODE line of Fig. 2B (p. 6, base set on 0.1 pN/nm, r = 2) drops near 28 s. If S2E is on the base set at 0.1 pN/nm (ks_S2E_added), the two figures should agree. A calibrated reading of both panels would show whether the difference is real. If it is, S2E may use other conditions, which bears on q_tcycle_r."},{"id":"q_audit_vu_unit_reading","kind":"reading","text":"(Audit, disagreement with the first reading, not changed.) Table S1 prints vu as '120 pN/nm'. The record enters the datum in nm/s. The value is printed, but the unit is the reader's interpretation, so strictly it is an assumption. It could instead sit in added.yaml (vu = 120 nm/s, basis Fig. 2E and ref. 6), with data.yaml keeping only the printed entry. No verdict depends on choosing another velocity unit: 120 nm/s is the only reading that fits Fig. 2E."},{"id":"q_audit_t_S1_late","kind":"reading","text":"(Audit, disagreement with the first reading, not changed.) t_S1_late = 20 s is the last tick label of Fig. S1B-F. The paper does not give it as an input. It is the reader's choice of where to read the plateau, so it would sit more naturally in added.yaml. Any time past about 12 s gives the same steady values, so no comparison depends on it."},{"id":"q_eps_choice","kind":"choice","text":"ε, the fraction of the maximal substrate position at which a cycle is taken to end, is 'somewhat arbitrary' (p. 5). The paper chooses 0.01 for Eq. 30, and the discussion (p. 9) notes that a 10-fold change of ε changes ln(1/ε) about 2-fold, so Eq. 30 scales with that choice."},{"id":"q_cal_tfail_fig2","kind":"unexplained_difference","text":"Calibrated readings of the vertical failure stroke of the blue ODE line put the end of the base-set cycle (0.1 pN/nm, r = 2) at 28.1-28.2 s in Figs. 2(b), 2(c), 2(d), 2(e) and 6(a). The five readings agree with each other within about 0.3 s. Eqs. 8-12 and 19 in the record fail at 25.7 s. So the difference first seen by eye (q_tcycle_r, tfail_fig2b_ode) is real: about 10%, far beyond the reading precision."},{"id":"q_cal_fig2b_vs_S2E","kind":"unexplained_difference","text":"Answers q_audit_fig2b_vs_S2E. The r = 2 ODE line of Fig. S2E drops at 32.1 s (95% interval 30.7-33.5), while the Fig. 2(b) line drops at 28.2 s (27.9-28.5). The difference is real, so S2E was not computed on the same conditions as Fig. 2, or not with the same code. The calibrated S2E drops for r = 1 and r = 3 (15.2 s and 73.4 s) agree with the printed 15 s and 73 s of the text (p. 14). The record's cycle times on the added 0.1 pN/nm (12.3, 25.7 and 55.1 s) are all about 0.75-0.8 times the S2E times, a near-uniform slowing of the plotted ODE. That points to a different stiffness or parameter for S2E, rather than a different r-dependence."},{"id":"q_cal_ode_curves_fig2","kind":"unexplained_difference","text":"Over the whole cycle, the calibrated blue ODE curves of Fig. 2 load more slowly than Eqs. 8-12 and 19 run by the record. Against the run, the substrate position and clutch force lie about 10% lower and the flow about 8 nm/s higher, at every time read. Pb is close until 10 s and higher thereafter. The off-rate (2f) agrees within its wider log-axis reading. During loading, the paper's own red Monte Carlo mean lies on the record's ODE run instead (at 10 s: <xs> 827 against 826 nm, <Fc> 1.10 against 1.10 pN, vf 54.1 against 53.9 nm/s). So the plotted ODE curve differs from the printed equations on the printed parameters by more than the reading precision. Possible causes: an unstated parameter, initial state or solver setting in the authors' computation, or a difference between the printed and the coded equations."},{"id":"q_cal_fig4b","kind":"unexplained_difference","text":"The calibrated Fig. 4(b) curves bear on q_ode_opt_3600 and q_ode_mean_flow. For nm = nc = 25 the plotted ODE flow is lowest near 1 pN/nm (18.3 nm/s) and is still 38.7 nm/s at 3 pN/nm. The record's cycle-mean flow is lowest near 0.3-0.6 pN/nm and is already 55 nm/s at 1 pN/nm. So the record's 'reproduced' 0.6 pN/nm (against the printed 1) does not follow the plotted curve. For 3600 the record matches the plotted curve from 0.3 to 3 pN/nm but rises about a decade too early: 112 against 26 nm/s at 300 pN/nm. The plotted curve is still low at 100-300 pN/nm, which fits the printed optimum of 200 pN/nm. The figure therefore supports the paper's printed optima. The difference lies in the record's flow measure or its model run, not in the paper's text."},{"id":"q_cal_S1","kind":"unexplained_difference","text":"The calibrated Fig. S1C plateau is 195-202 nm, which confirms the reading behind q_figS1_stiffness (200 nm needs κs = 0.01 pN/nm for one motor). The transient matches neither run, though. On the stated 0.1 pN/nm the single-clutch ODEs stall within about 1 s (flow 0.5 nm/s at 1 s, Fc = 2 pN at once). On the added 0.01 pN/nm they still rise and decay faster than plotted (at 1 s: xs 89 against 49 nm, vf 66 against 90 nm/s). The plotted ODE takes about 8-10 s to settle. The steady values (pb 0.79, Fc 2 pN, koff 0.27 /s) agree. Some unstated input of Fig. S1 (stiffness or another parameter) differs from both."},{"id":"q_cal_S2F","kind":"unexplained_difference","text":"Answers q_S2F_stiff with calibrated readings. For r = 1, 2 and 3, the record's ODE cycle times are close to the plotted ones up to 1 pN/nm (about 20% shorter). From 3 pN/nm up they are 5 to 70 times shorter: for r = 2, 0.108 against 2.4 s at 3 pN/nm and 0.0137 against 0.065 s at 100 pN/nm. The plotted ODE curves fall smoothly over the whole range. The record's runs drop steeply between 1 and 3 pN/nm, as the paper's Monte Carlo curve does (grey, 0.50 s at 3 pN/nm). The legend's claim that r = 2 matches the Monte Carlo time below 1 pN/nm holds for the record's run too (25.7 against 27.6 s at 0.1 pN/nm)."},{"id":"q_S2F_r03","kind":"numerics","text":"Fig. S2F plots finite ODE cycle times for r = 0.3. With the record's failure criterion (r Pb Fb - <Fc> falling to g_fail), Eqs. 8-12 and 19 reach no failure before t_max at r = 0.3, so the curve is not run. With r < 1 the divergence of Eq. 19 is weak, and the solution may settle before the margin reaches g_fail. The paper's way of detecting the end of a cycle (q_ode_failure) must differ there."},{"id":"q_cal_readings_raster","kind":"reading","text":"(Reading.) The supplementary figures are Excel rasters, not vector art, so their tick marks fit the printed labels to 2-10 px at 1200 dpi (S2E x: 9.4 px, about 0.4 s). Fig. S1C labels only 0 and 20 on its time axis, so that calibration is exact by construction and its misfit is unknown. The intervals include the misfit, but S1C's time calibration rests on two ticks only."},{"id":"q_xval_bangasser2013","kind":"choice","text":"No validation of this record's models against bangasser2013's measurements is entered. That record's measured data are all re-plotted from other papers. (1) Kong et al.'s integrin-fibronectin lifetimes against force (bangasser2013/tau_kong_fig7c, a catch bond). The only lifetime this record gives is the slip-bond Bell off-rate of Eq. 5 for a generic clutch (koff, Fb of the Chan and Odde base set); this paper never applies it to integrin bonds, so running it on Kong et al.'s forces would test nothing the paper claims. (2) Chan and Odde's neuron retrograde flow rates against substrate Young's modulus (bangasser2013/v_figS1b_measured). Eqs. 8-12 and 19 give a cycle-mean flow against substrate spring constant, and this paper prints only an order-of-magnitude correspondence \"1-1000 kPa (κs ≈ 1-1000 pN/nm)\" (p. 9), not a conversion for those gels; a sweep over the measured moduli needs that conversion as a model, which this job may not add. The base set used here is Chan and Odde's, fitted to those same neuron data, so such a check would be fit_quality, not validation. (3) The normalized migration and traction of Fig. 1 (bangasser2013/migration_fig1a_*, traction_fig1b_*): each is normalized to its cell type's maximum and no motor-clutch parameters are given for those cells, so the ODEs predict only the biphasic trend, not the values. Open choice: a later job with a modulus-to-stiffness conversion model could enter (2) as fit_quality."},{"id":"q_xval_bell1978_none","kind":"choice","text":"No validation of this record's models against bell1978's measurements is entered. This paper cites bell1978 (ref. 3) only as the source of the force-dependent off-rate law it uses (Eq. 5), not as data its models explain or are compared with. bell1978's measured data are force_adhesive (about 1 dyne to detach one cell, from its ref. 52) and the inhibiting sugar concentrations c_sugar_low and c_sugar_high (0.001 and 0.01 M, from its ref. 49). The sugar concentrations are conditions, and no model here has an inhibitor input or output. force_adhesive is the force to pull an adherent cell off a surface. The nearest outputs here are the traction of one motor-clutch module (motors_for_traction, clutch_ensemble_*) and the clutch forces of the ODEs. Those are forces a cell's motors exert at a given substrate stiffness, not a detachment force, and neither paper gives the module count, clutch parameters or stiffness for the cells of ref. 52. The value is also printed only as an order of magnitude (\"~ 1\"), which gets no verdict. clutch_ensemble_cycle has the same shape as bell1978's detach_time_eq17 (a time from a force and a rate), but that is a relation between models, not a measurement, and is left to the job that relates models across papers."},{"id":"q_xval_chan2008_r","kind":"choice","text":"The validations val_flow_chan_260Pa and val_flow_chan_57kPa against chan2008's measured flow run the ODEs at r = 2, the shape parameter this paper uses with the base set (Fig. 2, p. 5). Fig. 4 (flow against stiffness) uses r = 3, and Fig. S2F says r = 2 matches the cycle time below 1 pN/nm while lower r matches better on stiffer substrates. The choice changes the predicted flow on the 260 Pa gel about two-fold (r = 3 roughly halves it), and little on the 57 kPa gel. It is open which r should stand for Chan and Odde's filopodia."},{"id":"q_xval_chan2008_unused","kind":"choice","text":"chan2008 measurements considered and not used for validation here: (1) the Fig. 3D measured means and the Fig. S8C bars (chan2008/v_fig3d_exp_*, v_figS8C_*) are curves indexed by gel modulus; a sweep needs a modulus-to-spring-constant conversion as a model in this record, which it does not have (only the two printed Fig. 3C means are entered, with an added κs each); v_fig3d_exp_red repeats the 57 kPa gel. (2) v_stiff_text is printed \"~110\" (approximate, no verdict). (3) T_max_fig, the peak filopodial traction: no model here outputs a peak traction force, and nm was set to that value (chan2008 Table S1). (4) failures_figS5D, a failure frequency (1/s): the nearest output here is the ODE cycle time, a different quantity, and the bead-step failures are not shown to be whole-module load-and-fail cycles. (5) contact bead distance δ, the displacement/step histograms (Figs. 4D, S4, S5, S11D) and the scaled surface tension (Fig. 4E): no model here predicts them."},{"id":"q_xval_chaudhuri2015_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of chaudhuri2015. chaudhuri2015 cites Bangasser et al. 2013 (Biophys. J., its ref. 20; the bangasser2013 record), not this paper, and neither paper says one's model explains the other's data. chaudhuri2015's measurements are cell-spreading areas after 20 h (Figs. 3b, 3c, 4b, Supp. Figs. 4, 5), gel moduli and stress relaxation and rheology curves (Fig. 2, Supp. Fig. 3, Supp. Table 1), and fractions of cells with stress fibres, attached or proliferating, and nuclear YAP ratios (Figs. 3e, 4a, 4d, 4e). The models here give a load-and-fail cycle time, a cycle-mean F-actin flow rate, clutch states over time and an optimal substrate stiffness; none of them outputs a spread area, a gel property or a cell fraction, and turning a flow rate into an area at 20 h would need a spreading model this paper does not state. chaudhuri2015 also measures no flow rate or traction to run the ODEs against."},{"id":"q_xval_elosegui2014_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of elosegui2014. elosegui2014 cites Bangasser et al. 2013 (Biophys. J., its ref. 20; the bangasser2013 record), not this paper, and neither paper says one's model explains the other's data. The candidate is elosegui2014's measured actin rearward flow against gel stiffness (flow_a5b1_fig4e, flow_avb6_fig4h, flow_both_fig4k, nm/s, on gels of 0.25-29 kPa), which clutch_ensemble_cycle's v_mean would measure (its tractions in Pa, integrin densities in a.u., SPR responses, bead detachment times and recruitment have no output here). It is not entered because the model cannot be run on that measurement's own conditions: (1) the parameters here are Chan and Odde's set for neuronal filopodia, and neither paper states nm, Fm, vu, nc, kon, koff, Fb or κc for myoepithelial cells bound through a5b1 or avb6 (elosegui2014 puts its clutch parameters in a Supplementary Information that is blank in its copy, elosegui2014/q_si_unreadable); (2) neither paper converts these gels' Young's moduli to the substrate spring constant the model takes, and chan2008's fitted Δ belongs to filopodia; (3) the measured flows rest on mechanisms the ODEs here lack (an integrin-FN catch bond and force-triggered integrin reinforcement, elosegui2014 p. 4). Entering all of these as added values would make the result the reader's model, not this paper's. bangasser2013b's own measurements (computation times, Fig. 6b) are predicted by no model of elosegui2014."},{"id":"q_xval_elosegui2016_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of elosegui2016. elosegui2016 cites this paper (its ref. 33) only for trends: clutch determinants \"predicted to regulate force transmission\", and a peak-force rigidity \"also determined by force loading\" (elosegui2016 p. 6). It never runs these equations or compares them with its data. The nearest measurements are the actin retrograde flow of MEFs against gel Young's modulus (elosegui2016/fig3e_control_data, fig3e_shrna_data); clutch_ensemble_cycle's v_mean would measure that quantity. It is not entered because the model cannot be run on that measurement's own conditions: (1) the parameters here are Chan and Odde's set for embryonic chick neuron filopodia, and this paper states none for MEFs; elosegui2016's Supplementary Table 1 values (nm, nf, kont, ...) were adjusted to its own MEF data, so a run on them would be a fit, not a test; (2) elosegui2016's integrin off-rate is a catch bond (its coefficients themselves added, elosegui2016/koff_*_added), with no single koff and Fb for the slip-bond law of Eq. 5 used here; (3) the model takes a substrate spring constant, and the modulus-to-spring-constant conversion exists only as an added geometry factor in elosegui2016 (ksub_factor_added); this paper prints only an order-of-magnitude correspondence, \"1-1000 kPa (κs ≈ 1-1000 pN/nm)\" (p. 9). A verdict would rest on added inputs alone, the reader's model rather than this paper's. The MEF tractions (Pa; fig1a_*, fig3d_*, fig4-6 *_data) are stresses over an adhesion, and the models here give forces (pN) of one module. YAP ratios, adhesion lengths, spreading areas, avb3 bond lifetimes and stainings are quantities of no model here. In the other direction, see elosegui2016/q_xval_bangasser2013b_none."},{"id":"q_xval_gardel2008_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of gardel2008. This paper cites gardel2008 (ref. 13) once, with refs. 6, 8 and 34, as a source for the order of magnitude of the unloaded motor velocity, vu ~0.1 um/s (p. 9; vu_order, a reported input). It never says its ODEs explain, fit or predict gardel2008's data. gardel2008's measurements are F-actin speeds and traction stresses at grid points and single FAs of PtK1 cells on one gel per condition. They include the region box plots, speed histograms and edge-distance profiles of Figs. 1-4, the speed at peak traction (v_ts_mean, Fig. 3 E,F, Fig. 4 D) and the bounds vs, vw and slopes of Fig. 5. None can be run on its own conditions. (1) Stress in Pa is not an output here: the models give clutch force in pN, and no adhesion area or clutch density is stated. (2) Speeds vary with position across the cell, or across FAs, at a fixed gel. The ODEs have no spatial variable. Their only stress-speed relation is the one traced by varying the substrate spring constant. (3) Neither paper states nm, Fm, vu, nc, kon, koff, Fb or κc for PtK1 lamellae, or converts gardel2008's gel shear moduli (1.5-5.4 kPa) to the spring constant κs the model takes. Run on Chan and Odde's filopodial set with an added κs, the model would give a cycle-mean flow, but nothing in gardel2008 measures that quantity under those conditions. The result would be the reader's model, not this paper's. In the other direction, gardel2008's models (switch_speed_claim, switch_speed_by_condition) give the F-actin speed at peak traction. Nothing here measures that: this record's only measured data are computation times (Fig. 6b). See gardel2008/q_xval_bangasser2013b_none."},{"id":"q_xval_gong2018_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of gong2018. gong2018 cites this paper (its ref. 16, SI Table S1 ref. 1) as a source of its motor-clutch parameters and for the trend that, without reinforcement, the FA lifetime \"is proportional to its lifetime timescale\" (gong2018 p. 8); it never runs these ODEs against its data. gong2018's measurements are cell spreading areas (Figs. 4D, 5D, 6D, S5A), spreading speeds on elastic gels extracted from those areas with an adjusted initial radius and spreading timescale (Fig. S7), and gel relaxation stiffness curves (Figs. 4B, 5B, S6A). The models here output a load-and-fail cycle time, a cycle-mean F-actin flow rate, clutch states and an optimal substrate spring constant. None is a spreading area, a spreading speed or a gel property: gong2018's spreading speed is Vs = Vp - Vf (its Eq. 6), and the polymerization speed Vp, the spreading model and the reinforcement rule are not part of this paper's models; adding them would make the result gong2018's model, not this one. gong2018 also measures no flow rate, traction or cycle time. Although clutch_ensemble_cycle and gong2018/lifetime_timescale have the same shape (a time from force, stiffness and velocity), the cycle times here are predictions, not measurements, so there is nothing to validate either against. In the other direction, see gong2018/q_xval_bangasser2013b_none."},{"id":"q_xval_odde_code_none","kind":"choice","text":"(Cross-record validation.) No validation was entered in either direction between this record and odde_code. odde_code is software (the Odde lab MATLAB event-stepping motor-clutch scripts) and holds no measured data. Its data are the code's parameters and predicted curves copied from the papers' records, so no model here has a measurement there to be judged against. This paper's own `measured` data are only the computation times of Fig. 6(b) (fig6b_ode_cal, fig6b_mc1_cal, fig6b_mc100_cal): how long the authors' ODE solver and Monte Carlo software ran on their computer. The paper has no experimental measurement; it compares its ODEs with Monte Carlo simulations, which are predictions. odde_code's mc_event_port outputs flow, traction, failure frequency, cycle time, engaged clutches, clutch tension and simulated time, but not a computation time. A run time depends on the machine and the implementation (MATLAB on the authors' computer, against a Python port here), so it is not a quantity of the motor-clutch model. clutch_ensemble_cycle and odde_code/mc_event_port have the same shape, and odde_code already compares its port with this paper's Monte Carlo optimum at nm = nc = 25 (cmp_b13b_opt_n25). Both are relations between models and predictions, not measurements, and are left to the job that relates models across papers."},{"id":"q_xval_andreu2021_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of andreu2021, and no model of andreu2021 against a measurement here. andreu2021 cites Bangasser, Rosenfeld and Odde 2013 (its ref. 79; the bangasser2013 record), not this paper, and only for the Gillespie algorithm; neither paper says one's model explains the other's data. The candidate is andreu2021's measured actin retrograde flow of mouse embryonic fibroblasts on 0.6 kPa gels and on glass (andreu2021/fig1b_flow, nm/s), which clutch_ensemble_cycle's v_mean would measure. It is not entered because the model cannot be run on that measurement's own conditions: (1) the parameters here are Chan and Odde's set for embryonic chick neuron filopodia, and neither paper states nm, Fm, vu, nc, kon, koff, Fb or κc for MEFs (andreu2021's own clutch model has no motors, imposes the actin speed by stretch, and uses a catch bond with fitted coefficients, so its Supplementary Table 4 does not supply them); (2) the model takes a substrate spring constant, and neither paper converts a 0.6 kPa gel to one, nor gives one for glass (this paper prints only \"1-1000 kPa (κs ≈ 1-1000 pN/nm)\" as an order of magnitude, p. 9); (3) the two points are categorical conditions, not a curve the model could be swept along. Entering all of these as added values would make the verdict the reader's model, not this paper's. andreu2021's other measurements (paxillin adhesion lengths, YAP ratios, bead speeds, loading rates and stiffness under magnetic tweezers, AFM moduli, spreading areas) are quantities of no model here. In the other direction, this record's only measured data are computation times (Fig. 6b), which no andreu2021 model outputs; see andreu2021/q_xval_bangasser2013b_none."}],"takes_from":["chan2008"],"tally":{"close":1,"error":0,"no verdict":15,"not reproduced":25,"reproduced":12},"title":"Master Equation-Based Analysis of a Motor-Clutch Model for Cell Traction Force","variants":[],"venue":"Cellular and Molecular Bioengineering 6(4), 449-459 (with Supplementary Information)","verdicts":[{"comparison":"cmp_eq30_vs_mc_n25","computed":"0.5961","page":7,"printed":"0.4","purpose":"approximation","verdict":"not reproduced"},{"comparison":"cmp_eq30_vs_mc_n3600","computed":"33.74","page":7,"printed":"50","purpose":"approximation","verdict":"not reproduced"},{"comparison":"cmp_eq30_vs_ode_n25","computed":"0.5961","page":7,"printed":"1","purpose":"approximation","verdict":"reproduced"},{"comparison":"cmp_eq30_vs_ode_n3600","computed":"33.74","page":7,"printed":"200","purpose":"approximation","verdict":"not reproduced"},{"comparison":"cmp_ode_vs_mc_S1b_cal","computed":"[0.5692, 0.7255, 0.7692, 0.7849, 0.7863, 0.7863, …]","page":16,"printed":["0.6 [0.5146, 0.6854] read by the record's code read from Fig. S1B","0.7872 [0.75, 0.8244] read by the record's code read from Fig. S1B","0.8583 [0.8454, 0.8712] read by the record's code read from Fig. S1B","0.8475 [0.8356, 0.8594] read by the record's code read from Fig. S1B","0.7933 [0.7817, 0.805] read by the record's code read from Fig. S1B","0.7767 [0.7622, 0.7911] read by the record's code read from Fig. S1B","0.7797 [0.7682, 0.7913] read by the record's code read from Fig. S1B"],"purpose":"approx ":"no verdict"},{"comparison":"cmp_xs_fig2_cal","computed":"[221.5, 494.2, 825.7, 1048, 1197, 1297]","page":6,"printed":["122.9 [96.36, 149.4] read by the record's code read from Fig. 2(c)","383.6 [358.9, 408.3] read by the record's code read from Fig. 2(c)","711.5 [693.2, 729.8] read by the record's code read from Fig. 2(c)","931 [916.4, 945.6] read by the record's code read from Fig. 2(c)","1085 [1071, 1099] read by the record's code read from Fig. 2(c)","1193 [1179, 1207] read by the record's code read from Fig. 2(c)"],"purpose":"reproduction","verdict":"not reproduced"}],"year":2013},{"authors":["Alberto Elosegui-Artola","Elsa Bazellieres","Michael D. Allen","Ion Andreu","Roger Oria","Raimon Sunyer","Jennifer J. Gomm","John F. Marshall","J. Louise Jones","Xavier Trepat","Pere Roca-Cusachs"],"by_purpose":{"consistency":{"close":0,"error":0,"no verdict":0,"not reproduced":3,"reproduced":5},"reproduction":{"close":0,"error":0,"no verdict":0,"not reproduced":0,"reproduced":1},"validation":{"close":4,"error":0,"no verdict":0,"not reproduced":5,"reproduced":3}},"checked":{"close":4,"no verdict":0,"not reproduced":8,"reproduced":9},"counts":{"added":0,"comparisons":21,"data":54,"models":5,"questions":23,"references":33,"runs":3},"id":"elosegui2014","kind":"article","label":"Elosegui-Artola et al. 2014","models":[{"id":"density_fold","name":"avb6 density from the a5b1 density and the printed fold ratio","relations":[],"role":"processing","variant_of":null},{"id":"integrin_clutch_sim","name":"stochastic integrin-FN molecular clutch model with two competing integrin types and reinforcement","relations":[{"kind":"derived_from","other":"bangasser2013/motor_clutch_ssa","stated":true,"status":"unverifiable"},{"kind":"derived_from","other":"chan2008/motor_clutch","stated":true,"status":"unverifiable"},{"kind":"derived_from","other":"elosegui2016/clutch_talin_sim","stated":true,"status":"unverifiable"},{"kind":"derived_from","other":"gong2018/mean_field_sls","stated":true,"status":"unverifiable"}],"role":"model","variant_of":null},{"id":"koff_ratio","name":"ratio of the avb6 to the a5b1 unbinding rate measured by SPR","relations":[],"role":"processing","variant_of":null},{"id":"kon_eff_ratio","name":"effective binding rate kon = kont * dint, as a ratio between avb6 and a5b1","relations":[],"role":"model","variant_of":null},{"id":"kont_ratio","name":"ratio of the avb6 to the a5b1 true binding rate (\"kont decreased by only half\")","relations":[],"role":"processing","variant_of":null}],"of":[],"questions":[{"id":"q_si_unreadable","kind":"unstated_model","text":"The clutch model's equations, parameters (Supplementary Table 1, Note 5) and numerical scheme are in the Supplementary Information, PDF pages 8-34, which carry no text and render blank in this copy of the PDF. The model is entered as not runnable, and its printed predictions (onsets at 14 and 29 kPa, traction peak at 5 kPa, the model lines of Fig. 3c-e and Fig. 4d-l) cannot be checked from this record. A reading from a complete copy of the SI should make it runnable.\n"},{"id":"q_koff_column_multiplier","kind":"possible_error","text":"The Fig. 2a table heads its columns 'Kont (M-1 s-1 x 10^5)' and 'Koff (s-1 x 10^2)'. Read the same way for both columns (value x 10^n), kont is 7.724e5 and 3.893e5 M^-1 s^-1, plausible, but koff is 49.44 and 1506 s^-1, implausibly fast for bonds whose dissociation is followed over 60 s in Fig. 2a. If instead the koff column shows koff x 10^2, koff is 4.944e-3 and 0.1506 s^-1. The header is ambiguous or uses opposite conventions in its two columns. The record enters both literally; every comparison uses ratios within a column, where the multiplier cancels.\n"},{"id":"q_kon_fivefold","kind":"unexplained_difference","text":"With the paper's own kon = kont * dint, its printed kont values (ratio 0.504) and its fivefold density ratio, kon(avb6)/kon(a5b1) is about 2.5, but the clutch model was run with kon fivefold, said to match the trends measured in Fig. 2. The paper also argues from bead recruitment (Fig. 2d-g, Supplementary Note 2, unreadable here) that kon had to increase even more than koff; with the SPR koff ratio of about 30 that would need a kon ratio above 30, while the model's own koff ratio is 3. The fivefold kon matches neither the kont*dint estimate nor the 'more than koff' argument with the SPR values; it agrees only with 'more than the model's own koff'.\n"},{"id":"q_koff_threefold","kind":"unexplained_difference","text":"The SPR koff values give koff(avb6)/koff(a5b1) of about 30 (15.06 / 0.4944), described as 'strongly increased'; the clutch model raises koff only threefold and calls this 'matching thus the trends in bond dynamics ... measured in Fig. 2'. The match is in direction only, not in magnitude (a factor of ten apart). The paper does not say why the model's factor is 3 (the SI, which may, is unreadable here).\n"},{"id":"q_kon_dimension","kind":"reading","text":"kon = kont * dint is not dimensionally homogeneous as printed: kont is in M^-1 s^-1 (a 3D rate constant), dint is an areal density (integrins per um^2, Fig. 2b), and kon in a clutch model is a rate in s^-1. A conversion factor (a binding volume or reach) is implied but not stated. The record uses the relation only as a ratio between two integrin types, where that factor cancels if it is the same for both.\n"},{"id":"q_onsets_only_said","kind":"overstated_claim","text":"'Integrin densities increased sharply at the points predicted by the model: 14 kPa for a5b1, and 29 kPa for avb6' -- the measured stiffness values are those of the gels used (Fig. 4c shows 5, 14 and 29 kPa), so the agreement is at the resolution of the stiffness series, not a measured onset. Not checkable here without the model (q_si_unreadable) and without figure readings.\n"},{"id":"q_no_figure_readings","kind":"choice","text":"No figure was read: the commands that render PDF regions for figure readings were refused in this reading session, so no reading could be checked on its overlay. The fivefold density ratio (Fig. 2b), the traction, actin flow and integrin density data and model lines (Fig. 1b,c; Fig. 3c-e; Fig. 4d-l), detachment times (Fig. 2c) and recruitment (Fig. 2e,g) are left for a later reader; figures.md lists them.\n"},{"id":"q_fig3a_dint_label","kind":"possible_error","text":"(Audit.) In the Fig. 3a drawing the PDF text layer gives the two labels as 'kon1 = kont1·dint2' and 'kon2 = kont2·dint2': both use dint2. The caption ('true binding rates (kont1, kont2) multiplied by integrin densities on the membrane (dint1, dint2)') and p. 2 ('kon = kont · dint') pair each kont with its own density, so the kon1 label reads as a misprint of dint1. The page image at the available resolution is too small to confirm the subscript by eye (PDF rendering commands were refused in the audit session too). The record's kon_eff_ratio follows the caption and the p. 2 text, not the label.\n"},{"id":"q_fig3d_onset_vs_14kPa","kind":"reading","text":"(Audit.) density_onset_a5b1_pred cites Fig. 3d for the a5b1 onset at 14 kPa. By eye (no verdict), the model curve of Fig. 3d starts its sharp rise at the second dashed regime boundary, which sits close to the 10 kPa tick, not at 14 kPa. The 14 kPa of the text is also the stiffness of a gel used (Fig. 4c), so the printed '14 kPa' may be the first gel above a model onset nearer 10 kPa rather than the model's own onset. A figure reading of Fig. 3d (and of the model lines in Fig. 4f,i) would settle where the model puts it.\n"},{"id":"q_fig2a_koff_timescale","kind":"reading","text":"(Figure reading.) Bears on q_koff_column_multiplier. In the dissociation phase of Fig. 2a (after the injection ends near 90 s), the bold curves read in spr_a5b1_264nM and spr_avb6_264nM fall over tens of seconds: by about a fifth for a5b1 and by more than half for avb6 between 100 and 130 s. A 1:1 dissociation at koff = 49.44 or 1506 s^-1 (the header read literally) would empty the surface within a fraction of a second, so the plotted curves are not what those values describe; their decay is of the order of 1e-2 s^-1 (a5b1) and a few 1e-2 s^-1 (avb6), closer to the koff column read as value x 10^-2 (4.944e-3 and 0.1506 s^-1). This is a reading of the figure, not a fit: the paper's fit also has an association phase and may include mass transport.\n"},{"id":"q_fig2a_two_bold","kind":"reading","text":"(Figure reading.) The caption says the 264 nM data are bold 'in both cases', but Fig. 2a has two bold salmon (avb6) curves, peaking near 60 and near 34 RU. The record reads the lower one, which ends next to the salmon '264 nM' label; the upper may be the highest avb6 concentration (527 nM) drawn bold by mistake.\n"},{"id":"q_fig2b_axis_unit","kind":"possible_error","text":"(Figure reading.) The Fig. 2b axis is printed 'Integrins (um2)'; a membrane density must be per um^2 (p. 2 calls it the density of integrins on the cell membrane). The record takes the values as per um^2.\n"},{"id":"q_fig34_x_labels","kind":"reading","text":"(Figure reading.) The x axes of Figs. 3c-e and 4d-i have no tick marks, and the printed labels 0.1, 1, 10, 100 do not lie on one log scale: in Fig. 3 their centres miss the best log fit by about 59 px at 1200 dpi (about 0.1 decade), with '1' and '10' set at the two dashed regime lines; in Fig. 4d-i the '1' and '10' labels sit left of the dashed lines. In Fig. 4j-l, whose axis has ticks at 0.1 and 100, the dashed lines fall (by eye) where 1 and 10 kPa lie on that scale, and the measured circles sit at the gel stiffnesses of Fig. 1a. The readings of Fig. 4 therefore name each circle by its gel (in order) and read the model lines at the circles' columns; the Fig. 3 readings use the label centres and widen their intervals by twice the misfit. Where exactly the model's regimes change (in kPa) cannot be read more precisely than this.\n"},{"id":"q_fig4_onset_below_14kPa","kind":"reading","text":"(Figure reading.) Bears on q_fig3d_onset_vs_14kPa. Read at the plotted 5 and 14 kPa circles, the a5b1 model line of Fig. 4f (density_a5b1_model_fig4f) is near 1 at 5 kPa and already about 4 at 14 kPa, close to the measured 14 kPa circles; the Fig. 3d curve (density_model_fig3d) likewise has risen well above 1 by 14 kPa. So in the figures the model's sharp rise starts between the 5 and 14 kPa gels, at the second dashed line, not at 14 kPa; the text's '14 kPa' reads as the first gel above the onset.\n"},{"id":"q_fig4_hidden_points","kind":"choice","text":"(Figure reading.) Points wholly or mostly hidden under another marker are not read: in Fig. 4d the filled circles at 0.25, 2.8 and 5 kPa (under open circles), in Fig. 4f the filled ones at 0.25 and 5 kPa, in Fig. 4l the orange one at 5 kPa, in Fig. 1c the blue one at 0.7 kPa. Comparisons with them use readings at the gels that are visible. Error bars that do not leave their marker are reported as at most the marker.\n"},{"id":"q_no_validation_elosegui2016","kind":"unstated_model","text":"(Cross-validation.) No model of this record is validated against the measurements of elosegui2016 (MEF tractions, actin flows, adhesion lengths, YAP and talin unfolding data). The one model that could predict them, integrin_clutch_sim, is not runnable (its equations and parameters are in the unreadable Supplementary Information). The other models are ratios of this paper's own SPR rates and integrin densities, quantities elosegui2016 does not measure. Neither paper says this record's model predicts the 2016 measurements.\n"},{"id":"q_no_validation_gardel2008","kind":"unstated_model","text":"(Cross-validation.) No model of this record is validated against the measurements of gardel2008 (ref. 26: local traction stress and F-actin speed in PtK1 focal adhesions). The paper cites ref. 26 only for a trend: the clutch model gives \"an inverse relationship between force and actin rearward flow as previously reported\" (Fig. 3e). That is a qualitative agreement, and gardel2008 measures no quantity on substrate stiffness that the model outputs at stated conditions. Even so, the model cannot be run: its equations and parameters are in the unreadable Supplementary Information (q_si_unreadable). The other models are ratios of this paper's own SPR rates and integrin densities, which gardel2008 does not measure.\n"},{"id":"q_no_validation_gong2018","kind":"unstated_model","text":"(Cross-validation.) No model of this record is validated against the measurements of gong2018 (a later paper, not cited here; it cites this one for its reinforcement rule). gong2018 measures cell spreading areas on elastic and viscoelastic gels (Figs. 4D, 5D, 6D, S5A), gel relaxation stiffness (Figs. 4B, 5B, S6A) and spreading speeds (Fig. S7). The one model here about cells on substrates, integrin_clutch_sim, is not runnable (q_si_unreadable) and outputs traction, actin flow and integrin density on linear elastic substrates, not spreading area or speed, and nothing about viscoelastic gels. The other models are ratios of this paper's own SPR rates and integrin densities, which gong2018 does not measure.\n"},{"id":"q_no_validation_kong2009","kind":"unstated_model","text":"(Cross-validation.) No model of this record is validated against the measurements of kong2009 (ref. 12: AFM force-clamp mean lifetimes of single FN-a5b1 bonds versus force, adhesion frequencies, rupture-force histograms). The paper uses ref. 12 as an input, not as a test: the clutch model's unbinding is \"koff values determined experimentally for the FN-a5b1 single-molecule bond as a function of the applied force\", scaled by a factor, so a comparison of that curve with kong2009's lifetimes would check the input, not a prediction. Nor could it be run: integrin_clutch_sim is not runnable (q_si_unreadable), and its outputs (traction, actin flow, adhesion integrin density on gels) are not single-bond lifetimes. The other models are ratios of this paper's own SPR rates and integrin densities (avb6 to a5b1), which kong2009 does not measure: it has no avb6 data and no SPR.\n"},{"id":"q_no_validation_bell1978","kind":"unstated_model","text":"(Cross-validation.) No validation was added between this record and bell1978 (ref. 9). The paper cites Bell only for bonds whose unbinding is \"determined by force\"; it never says Bell's model predicts any of its measurements, nor that its own models predict Bell's. Of this record's measurements, only the bead detachment times of Fig. 2c (0.5 nN, at most 2 min) are a quantity a bell1978 model (Eq. 17 or 22) outputs, but running it would need the number of integrin-FN bonds per bead and the bond's barrier range, which neither paper states, and a k- whose power of ten is ambiguous here (q_koff_column_multiplier); the paper also treats a5b1-FN as a catch bond, not a Bell slip bond. The other measurements (tractions, actin flow, integrin densities and recruitment, SPR responses) are outputs of no bell1978 model. In the other direction, this record's clutch model is not runnable (q_si_unreadable) and its other models are ratios of its own values, so none predicts bell1978's measurements (a force of about 1 dyne on a cell, sugar concentrations).\n"},{"id":"q_no_validation_chan2008","kind":"choice","text":"No model of this record is entered as predicting a measurement of chan2008 (this paper's ref. 7, from whose motor-clutch model integrin_clutch_sim is described). The model that could, the integrin-FN clutch model, is not runnable (q_si_unreadable): its equations and parameters are in the blank Supplementary Information. Even if it ran, chan2008's measurements are of filopodia of chick forebrain neurons (retrograde flow rates on 260 Pa and 57 kPa gels, filopodial forces, bead displacement steps), with integrin types, densities and reinforcement thresholds this paper does not give for those cells. The other models here are ratios of this paper's own SPR rates and densities and predict nothing chan2008 measures. In the other direction, see chan2008/q_no_validation_elosegui2014.\n"},{"id":"q_xval_bangasser2013b_none","kind":"choice","text":"No model of this record is entered as predicting a measurement of bangasser2013b. This paper's ref. 20 is Bangasser, Rosenfeld and Odde 2013 (Biophys. J.; the bangasser2013 record), not bangasser2013b, and neither paper says one's model explains the other's data. bangasser2013b is a theory paper: its only measurements are the run times of its ODE and Monte Carlo software on the authors' computer (Fig. 6b, fig6b_ode_cal, fig6b_mc1_cal, fig6b_mc100_cal), which no model here predicts; the integrin-FN clutch model is not runnable in any case (q_si_unreadable), and the other models are ratios of this paper's SPR rates and densities. In the other direction, see bangasser2013b/q_xval_elosegui2014_none.\n"},{"id":"q_xval_bangasser2013_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of bangasser2013 (ref. 20). Its measurements, all quoted from other works, are: normalized migration of four cell types (Fig. 1A), normalized traction of three (Fig. 1B), Kong et al.'s integrin-FN bond lifetimes against force (Fig. 7C), and Chan and Odde's neuron retrograde flows (Fig. S1B). The one model here about clutches on substrates, integrin_clutch_sim, is not runnable (q_si_unreadable). It outputs traction, actin flow and integrin density for myoepithelial cells, with parameters for those cells, and the paper applies it to none of these cell types. The Kong lifetimes are an input of that model, not a prediction (\"koff values determined experimentally ... as a function of the applied force\", p. 4; see q_no_validation_kong2009). The other models are ratios of this paper's own SPR rates and integrin densities, which bangasser2013 does not measure. The paper cites ref. 20 for the model it expands on and for how rates modulate rigidity sensing, not as data its model explains. In the other direction, see bangasser2013/q_xval_elosegui2014_none.\n"}],"takes_from":[],"t ,"purpose":"validation","verdict":"reproduced"}],"year":2014},{"authors":["Ovijit Chaudhuri","Luo Gu","Max Darnell","Darinka Klumpers","Sidi A. Bencherif","James C. Weaver","Nathaniel Huebsch","David J. Mooney"],"by_purpose":{"consistency":{"close":0,"error":0,"no verdict":0,"not reproduced":2,"reproduced":1},"reproduction":{"close":1,"error":0,"no verdict":0,"not reproduced":9,"reproduced":0}},"checked":{"close":1,"no verdict":0,"not reproduced":11,"reproduced":1},"counts":{"added":1,"comparisons":13,"data":85,"models":5,"questions":27,"references":45,"runs":11},"id":"chaudhuri2015","kind":"article","label":"Chaudhuri et al. 2015","models":[{"id":"bell_off_rate","name":"force-dependent clutch off rate (Bell model, Supp. Note 1)","relations":[{"kind":"reduces_to","other":"bangasser2013/catch_slip_eq9","stated":false,"status":"verified"},{"kind":"same_as","other":"bangasser2013b/clutch_offrate_eq5","stated":false,"status":"verified"},{"kind":"same_as","other":"bell1978/loaded_reverse_rate","stated":true,"status":"verified"},{"kind":"same_as","other":"chan2008/off_rate_eq1","stated":false,"status":"verified"}],"role":"model","variant_of":null},{"id":"burgers_eq2","name":"Burgers-model stress-strain relation of a substrate linkage (Supp. Eq. 2)","relations":[],"role":"model","variant_of":null},{"id":"clutch_springs_nolattice","name":"motor-clutch model with the lattice removed, independent substrate springs (Supp. Fig. 1d)","relations":[],"role":"model","variant_of":null},{"id":"lattice_spreading","name":"stochastic lattice-spring model of cell spreading on elastic or Burgers-model substrates (Supp. Note 1)","relations":[{"kind":"derived_from","other":"chan2008/motor_clutch","stated":true,"status":"unverifiable"}],"role":"model","variant_of":null},{"id":"retrograde_flow_eq1","name":"actin retrograde flow and spreading velocity (Supp. Eq. 1)","relations":[],"role":"model","variant_of":null}],"of":[],"questions":[{"id":"q_eq2_form","kind":"possible_error","text":"Supp. Eq. 2 as printed is not the usual four-element Burgers relation and is dimensionally inconsistent: its right side is the product (dε/dt)(d²ε/dt²) with coefficient η1²η2/(E1E2), and the d²σ/dt² term has coefficient η2/E2. The common textbook form has coefficient η1η2/(E1E2) on d²σ/dt² and a right side η1 dε/dt + (η1η2/E2) d²ε/dt². Under a constant strain rate the printed form has a zero right side, so it would give no loading at all in the simulated tensile test of Supp. Fig. 1f. Whether the code used the printed or another form is not known; the equation is recorded as printed."},{"id":"q_eta_names","kind":"possible_error","text":"The damping coefficients are named inconsistently. Supp. Note 1 calls η1 the Maxwell element damping coefficient and η2 the Voigt one, and so does the Fig. 5 caption (η1 as Maxwell). The Fig. 1 caption calls η1 the Voigt damping coefficient and η2 the Maxwell damping coefficient."},{"id":"q_eta_values_units","kind":"possible_error","text":"The damping values used for Fig. 1c (η1 = 5 x 10^-13, η2 = 1 x 10^-13) and Fig. 5b (η1 = 1 x 10^-12, 5 x 10^-13, 1 x 10^-13) are printed without units, and lie far outside the range 0.01-100 pN s given for η1 and η2 in Supp. Table 2. Supp. Table 2 also gives damping in pN s, while a dashpot in series or parallel with a spring of stiffness in pN nm^-1 would need pN s nm^-1. These values were not put in data.yaml because no unit is printed for them."},{"id":"q_lattice_unstated","kind":"unstated_model","text":"The lattice-spring model behind all the paper's spreading predictions (Fig. 1b-d, Fig. 5b, Supp. Fig. 1c,e,f, Supp. Fig. 2) cannot be rebuilt from the text: lattice size, node spacing, node mass, boundary conditions, ligand placement, how the imposed strain is applied and shared, the Beeman scheme's parameters and the damping values and units in use are not stated, and the MATLAB code is not published. None of these results is checked in this record."},{"id":"q_maxwell_limit","kind":"reading","text":"For the Maxwell limit the \"Voigt spring constant was held at 10e30\" and the damping coefficient at 1, with no units. \"10e30\" may mean 10^30 or 10 x 10^30 (MATLAB notation 1e31); either way it is effectively rigid."},{"id":"q_s1d_xaxis","kind":"reading","text":"The x axis of Supp. Fig. 1d carries the printed labels 10^-2, 1 and 10^2, but its evenly spaced major tick marks (with log minor ticks between them) put 10^-2 about 0.3 decade to the right of where the label \"10^-2\" is printed, at the left end of the axis. The label \"1\" sits on a tick. The readings are calibrated on the ticks with \"1\" on its tick, so the axis runs from about 0.005 to about 88 pN/nm. If instead the end labels mark the axis ends (0.01 to 100 pN/nm), every stiffness would shift, by up to a factor of 2 at the left end; the verdicts at the low-stiffness end depend on this."},{"id":"q_s1d_duration","kind":"choice","text":"The simulated time behind each point of Supp. Fig. 1d is not stated. The record uses 12 s (60,000 steps of 0.2 ms, the paper's run length for spreading area), and runs each curve again with 1 s, the run length of Supp. Fig. 1c. Because all clutches start unbound and kon = 1 s^-1, the average speed over a short run includes the start-up and depends on this choice."},{"id":"q_s1d_difference","kind":"unexplained_difference","text":"In trial runs while building this record, the lattice-free model on the Supp. Table 2 parameters gave the shapes of Supp. Fig. 1d for nC = 5, 25 and 1000 (low speeds falling with stiffness, and a near-stalled flow at about 120 nm/s). It gave lower speeds than plotted for nC = 50 above about 0.3 pN/nm (e.g. about 30 against about 78 nm/s at 1 pN/nm). For nC = 100 above about 1 pN/nm it gave about 20-40 nm/s where the figure stays near 118 nm/s. The plotted nC = 100 curve looks like a run that stays stalled once enough clutches are bound. Unstated rules may decide which state a run ends in: initial binding, run length, clipping of v_retrograde (q_s1d_rules, q_s1d_duration). The verdicts are computed by the build."},{"id":"q_s1d_rules","kind":"unstated_model","text":"The lattice-free variant is described in one sentence. The record makes these choices: the clutch spring and its own substrate spring act in series (effective stiffness kclutch ksub/(kclutch+ksub)); all clutches start unbound; a newly bound clutch starts unstretched; every bound pair is stretched by v_retrograde dt each step; binding and unbinding are tested once per step with probabilities 1-exp(-k dt); v_retrograde from Supp. Eq. 1 is not clipped at zero, so v_spread can briefly exceed vu when the clutch forces exceed Fstall; the reported speed is the time average of v_spread over the run. In particular, whether the run starts with clutches bound would change the high-stiffness branch of the nC=100 curve, which the paper shows staying near vu."},{"id":"q_ligand_density_measures","kind":"possible_error","text":"Supp. Table 2 gives the ligand density used in the simulations as a line density, 0.004-0.02 ligands nm^-1 (and Supp. Fig. 1e uses 0.02 ligands/nm), while the curves of Fig. 1b-d are labelled with area densities 6, 56, 100, 225 and 400 lig um^-2. The paper does not say how one maps to the other. If the area density is the square of the line density, 400, 225 and 100 lig um^-2 are 0.02, 0.015 and 0.01 nm^-1, and 56 is about 0.0075 nm^-1, but 6 lig um^-2 would be about 0.0024 nm^-1, below the printed range of Supp. Table 2."},{"id":"q_experimental_scope","kind":"reading","text":"Audit disagreement with the first reading's scope: the guide asks for every plot of measured data to be read (origin measured) whether or not a model in the record predicts it, but the experimental data of Fig. 2a-c, Fig. 3b,c, Fig. 4, Supp. Table 1 and Supp. Figs. 3-5 were left out because no model in this record uses them. They are not read in the audit either; a later reading could add them as measured data for validation by models of other papers."},{"id":"q_s1d_xaxis_audit","kind":"reading","text":"Audit note on Supp. Fig. 1d: at page resolution the label \"1\" sits slightly right of the midpoint between the printed end labels \"10^-2\" and \"10^2\", consistent with the first reader's finding that the end labels are not on the axis's major ticks. The audit could not re-render the panel to check the tick positions, so the readings rest on the first reader's tick calibration; the alternative calibration (end labels at the axis ends, 0.01 to 100 pN/nm) has no run in the record, and the low-stiffness verdicts should be read with q_s1d_xaxis in mind."},{"id":"q_s1d_xaxis_rerendered","kind":"reading","text":"Re-rendered at 1000 dpi, the x axis of Supp. Fig. 1d shows four long ticks about 350 px (at that dpi, scaled) apart, with short ticks between them at the log positions of 2, 3, ... 9 within each interval, and the label \"1\" centred on the third long tick. So the ticks form a consistent log10 axis with \"1\" on a tick, as the first reader calibrated. The axis line runs about 0.3 decade beyond the first long tick on the left and about 0.94 decade beyond the last one on the right, so the end labels \"10^-2\" and \"10^2\" cannot both be at the axis ends and on this tick scale. This supports the tick calibration; it does not say which of the two the authors meant."},{"id":"q_fig3bc_same_bars","kind":"possible_error","text":"The three red (stress-relaxing) bars of Fig. 3c read the same as the three red bars of Fig. 3b, means and error bars alike (about 625, 857, 954 um^2 against 629, 861, 957 um^2, with error-bar ends within 2 um^2 of each other). Fig. 3b's red bars are for initial moduli 1.4, 3.4 and 9 kPa at RGD 150 uM; Fig. 3c's are for 1.4 kPa at RGD 150, 750 and 1,500 uM. Only the first bar of each shares a condition (1.4 kPa, 150 uM), and the first grey bars agree as they should (482 and 484 um^2). The second and third red bars of the two panels should not be equal, unless the same data were plotted twice. The grey bars of the two panels differ, as expected."},{"id":"q_fig1c_ylabels","kind":"possible_error","text":"The y labels of Fig. 1c (0, 0.5, 1.5, 2.0, 3.5 nm^2 x 10^4) are not evenly spaced for a linear axis: the gap from 0 to 0.5 is about 240 px per unit (at 1200 dpi) while 0.5 to 1.5 is about 450 px per unit. They sit beside the left ends of the curves, as if placed by hand at the curves' starts. No linear axis passes within about 60 px of all of them; the readings fit a straight line through all five and carry that misfit (about 0.15 x 10^4 nm^2) in every interval."},{"id":"q_fig1d_ylabels","kind":"possible_error","text":"In Fig. 1d the labels \"3.0\", \"0\" and \"-4.0\" are equally spaced on the page although they span 3 and 4 units, so they cannot all be right on a linear axis. The readings use \"3.0\" and \"0\" (with the zero line drawn across the panel) and carry the offset between the label centres and the drawn lines (24 px). On this scale the bottom label \"-4.0\" sits at about -3.1. Fig. 1d is described as the difference of Fig. 1c and Fig. 1b; by eye, Fig. 1c minus Fig. 1b at 10 pN/nm is about -3.4 for 6 lig um^-2 (read here as -3.1) and about -3.9 for 56 lig um^-2 (read here as -2.9), so neither calibration of the lower half makes all curves agree. The difference was not checked by the build, because a run cannot take a curve's values as inputs."},{"id":"q_fig1_xlabels","kind":"reading","text":"Fig. 1b-d have no tick marks; the x axes are calibrated on the centres of the printed labels 0.01, 0.1, 1 and 10. In Fig. 1c these lie on a straight log scale within 2 px, but in Fig. 1b and Fig. 1d the label \"1\" (and \"10\") are 30-34 px (about 0.05 decade) off the line through the others. The readings carry this misfit, which widens the intervals where the curves are steep."},{"id":"q_figs2_left_out","kind":"reading","text":"Supp. Fig. 2a-f (Voigt and Maxwell limits) are not read. Their axes have no tick marks, and their y labels are placed beside the curves rather than on a scale: in Supp. Fig. 2a the labels 0, 1.0, 1.5, 4.0 and 5.0 are about 38, 82, 54 and 43 px per unit apart (at page resolution), and in Supp. Fig. 2b \"1.0\" sits where the 0 and 5.0 labels put about 1.6. No calibration would give values worth checking. The curves are also close shades of one colour in an embedded bitmap."},{"id":"q_ligand_density_from_s2","kind":"reading","text":"Supp. Fig. 2 labels the same four curves with line densities 0.02, 0.015, 0.0075 and 0.0025 lig nm^-1, where Fig. 1b-d use 400, 225, 56 and 6 lig um^-2. The squares of the line densities are 400, 225, 56.25 and 6.25 um^-2, so the figures support the mapping q_ligand_density_measures proposes (area density = line density squared), and the 6 lig um^-2 curve was run at 0.0025 lig nm^-1, below the 0.004-0.02 range of Supp. Table 2."},{"id":"q_eta_names_s2","kind":"reading","text":"The Supp. Fig. 2 caption calls eta1 the Voigt dashpot value (panel e) and eta2 the Maxwell dashpot value (panel f), as the Fig. 1 caption does, while Supp. Note 1 and the Fig. 5 caption call eta1 the Maxwell damping coefficient. So Fig. 5b's curves, labelled by eta1 and described as Maxwell damping, may be labelled with the other element's coefficient."},{"id":"q_spread_area_scale","kind":"unexplained_difference","text":"The model's spread areas (Fig. 1b,c) are printed in nm^2 x 10^4, so they lie between 0 and about 4.4 x 10^4 nm^2 (0.044 um^2), while the measured cell spreading areas (Figs. 3-4, Supp. Figs. 4-5) are 300-1,500 um^2, more than 10^4 times larger. The paper compares the two only in their trends. Either the model's areas are not on the same scale as a cell's area, or the axis unit is misprinted; the record keeps both under one quantity, so a direct comparison would show this gap."},{"id":"q_fig2a_which_gels","kind":"reading","text":"Fig. 2a does not say which ionic and covalent gels its two lines are. Its ionic line ends near 0.28 at 1000 s, like the 3.4 kPa ionic line of Supp. Fig. 3a; its covalent line ends near 0.90, near the 1.4 and 3.4 kPa covalent lines there (which could not be read apart). The comparison cmp_fig2a_ionic_s3a tests the first identification."},{"id":"q_xval_gong2018_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of gong2018. The only measurements there that a model here could give are the spreading speeds on elastic gels of gong2018 Fig. S7 (vs_figS7_pa, vs_figS7_ha, vs_figS7_alg). They are indexed by an adhesion-scale substrate spring constant (k = 2RE, gong2018 Eq. S9), one spring shared by all clutches of an adhesion. The runnable model here, clutch_springs_nolattice, takes ksub, the stiffness of one independent spring per clutch. That is a different quantity of the same dimension, so the two are not mapped. A run would need an added mapping (for example ksub = k / nc, which makes the two agree only while every clutch is bound) and an added clutch number (Supp. Fig. 1d uses 5 to 1000). Both are open choices that would decide the verdict. The lattice model, the one the paper relates to cells, cannot be run (q_lattice_unstated). gong2018's other measurements (spreading areas, relaxation stiffness of gels) are outputs of no runnable model here."},{"id":"q_xval_chan2008_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of chan2008, although this paper builds its model on chan2008's (\"building upon the framework of a previous model by Chan and Odde\", Supp. Note 1; refs. 19 and S1). The paper takes chan2008's framework only, and never compares its model with chan2008's data. chan2008 measured retrograde flow rates on polyacrylamide gels of given Young's modulus (v_fig3c_260, v_fig3c_57k, v_fig3d_exp_sem, v_figS8C_control, v_figS8C_gfp), a peak filopodial force (T_max_text, T_max_fig), bead displacement and step-size histograms, failure frequencies and a scaled surface tension. The runnable model here, clutch_springs_nolattice, outputs only the spreading speed (v_spread = vu - v_retrograde). That is a different quantity from a retrograde flow rate, so the two are not mapped, and recovering v_retrograde would need vu, which is an input, not an output. retrograde_flow_eq1 gives the retrograde flow velocity, but only from a total clutch force that chan2008 does not measure. bell_off_rate gives a per-clutch off rate, which chan2008 does not measure. lattice_spreading cannot be run (q_lattice_unstated). Even a flow-rate output would need a mapping from gel modulus to this model's per-clutch spring stiffness ksub, plus a clutch number for a filopodium. Neither is stated here: chan2008's Eq. 13 belongs to that record, and its length scale is itself open there."},{"id":"q_xval_bell1978_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of bell1978. This paper cites Bell (sref-5) only for the form of its clutch off-rate law (\"undergo force-dependent dissociation as per the Bell model5\"), never for data. bell1978's measured values are force_adhesive (about 1 dyne to detach a cell, quoted from its ref. 52 and printed as approximate) and the inhibiting sugar concentrations c_sugar_low and c_sugar_high (0.001 and 0.01 M, experimental conditions from its ref. 49). None of them is an output of a model here: bell_off_rate gives the off rate of one clutch, clutch_springs_nolattice and retrograde_flow_eq1 give spreading and retrograde flow speeds, and lattice_spreading cannot be run (q_lattice_unstated). bell1978 measures no single-bond off rate, so the shared Bell law (relation rel_bell_loaded_rate_same_as_bell_off_rate) has no measurement to be tested against."},{"id":"q_xval_bangasser2013b_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of bangasser2013b. This paper's ref. 20 is Bangasser, Rosenfeld & Odde 2013 (Biophys. J.; the bangasser2013 record), not bangasser2013b (Cell. Mol. Bioeng.), and it is cited for the motor-clutch framework, not for data. bangasser2013b's only measured values are the computation times of its ODE and Monte Carlo software (Fig. 6b: fig6b_ode_cal, fig6b_mc1_cal, fig6b_mc100_cal); all its other plotted values are outputs of its own models. No model here predicts a software run time, so there is nothing to validate against. The shared shape of clutch_springs_nolattice and bangasser2013b/clutch_ensemble_cycle is a relation between models, not a measurement."},{"id":"q_xval_bangasser2013_none","kind":"choice","text":"(Cross-record validation.) No model of this record is validated against a measurement of bangasser2013. This paper cites Bangasser, Rosenfeld & Odde (ref. 20; Supp. ref. 8) for the model's behaviour, a stiffness optimum set by clutch number and the stalled state at many clutches, which the lattice-free variant \"recreates\" (Supplemental Model Characterization): that is a model-to-model relation, not a measurement. bangasser2013's measurements are (1) Kong et al.'s integrin bond lifetimes against force (bangasser2013/tau_kong_fig7c): bell_off_rate gives a loaded off rate, not a lifetime, and a lifetime is not the same quantity; its parameters (koff, Frup of Supp. Table 2) are for this paper's clutch, and a slip law cannot meet a catch-bond curve anyway; (2) Chan and Odde's neuron filopodia retrograde flow against substrate stiffness, as replotted in Fig. S1B (bangasser2013/v_figS1b_measured): clutch_springs_nolattice gives spreading speed vu - v_retrograde, not retrograde flow, and retrograde_flow_eq1 needs the total clutch force, which was not measured; (3) the normalized migration and traction curves of other studies (Fig. 1A-B), which no model here gives. So nothing here predicts any of them as measured."}],"takes_from":["chan2008"],"tally":{"close":1,"error":0,"no verdict":0,"not reproduced":9,"reproduced":0},"title":"Substrate stress relaxation regulates cell spreading","vari
