- id: q_params_vs_chan
  kind: reading
  about: [nm_23, nc_23, kon_23, Kc_23, nm_chan, nc_chan, kon_chan, kc_chan]
  text: >-
    The code's header says it reduplicates "the Chan Motor-Clutch model", but motorclutch2_3.m does not
    use Chan and Odde's Table S1 set: nm = nc = 50 (Chan 75), kon = 0.3 /s (Chan 1), Kc = 0.8 pN/nm
    (Chan 5). These are exactly Bangasser et al. 2013's base set (Table 1, which the build checks),
    a set that paper says was fit to Chan and Odde's data and whose Kc was "assigned based on
    experimental data for the spring constant of integrins". So the code is the Bangasser 2013
    simulation; to compare it with Chan and Odde the record runs it with Chan's four values copied in.
  citation: {file: motorclutch2_3.m, lines: "16-23", quote: "Kc=0.8; %Clutch spring constant in pN/nm"}
- id: q_mixed_set_1_1
  kind: choice
  about: [nm_11, nc_11, kon_11, Kc_11, Ksub_11, run_11]
  text: >-
    motorclutch1_1.m runs a set that matches neither paper: kon = 1 /s as Chan and Odde, but nm = nc = 50
    and Kc = 0.8 pN/nm as Bangasser et al. 2013 (whose kon is 0.3), on Ksub = 1 pN/nm. No paper prints a
    result for this set, so its run (run_11) is not compared. The script only plots one trajectory and a
    histogram/hazard analysis of the cycle times.
  citation: {file: motorclutch1_1.m, lines: "19", quote: "kon=1; %On rate constant in 1/s"}
- id: q_sign_convention
  kind: reading
  about: [Fm_23, vu_23, Fb_23]
  text: >-
    The code writes vu, Fm and Fb negative (retrograde motion and clutch tension negative), as Chan and
    Odde's Table S1 does; Bangasser et al. 2013 print them positive. The links in cited.yaml say so
    (negated). The outputs of the port turn the plotted quantities positive as the code's plots do
    (vel = -vf, line 138; traction plotted as -avtrac, line 164).
  citation: {file: motorclutch2_3.m, lines: "17-18", quote: "vu=-120; %unloaded motor velocity in nm/s"}
- id: q_gain
  kind: unstated_model
  about: [gain_23, gain_11, mc_event_port]
  text: >-
    Both scripts carry a feedback term that no paper describes: the off-rate is koff exp(Fc/(Fb + gain Fc))
    (motorclutch2_3.m line 96), and motorclutch1_1.m also computes an unused Fbe = Fb + gain Ksub xsub
    (line 67). With gain = 0, as written in both, it reduces to the papers' koff exp(Fc/Fb) and has no
    effect; it is entered as an input so the port stays the code.
  citation: {file: motorclutch2_3.m, lines: "96", quote: "tunbind=-log(rand(1,length(ceng)))./(koff*exp(Fc(ceng)./(Fb+gain*Fc(ceng))));"}
- id: q_run_length
  kind: choice
  about: [events_23, eventlimit_11, mc_event_port, ref_events_b13_v, ref_events_b13_F]
  text: >-
    The code fixes the number of events (1e5 per stiffness in motorclutch2_3.m), not the simulated time,
    so the simulated time varies with stiffness: about 8200 s at 0.01 pN/nm and 3400 s at 100 pN/nm for
    the base set, 700-1900 s at Chan's set. Chan and Odde run 300 s; the paper records of Bangasser et al.
    2013 use 1000 s as the reader's choice. The averages include the start-up from all clutches free.
    The record refines the event count (x2, x4) on the base set.
  citation: {file: motorclutch2_3.m, lines: "26", quote: "events=1e5; %number of events to simulate"}
- id: q_seed
  kind: choice
  about: [mc_event_port, optimum_port, run_chan_1d, run_chan_1d_soft, run_chan_1d_Fsoft, run_chan_1d_Fstiff]
  text: >-
    The code draws MATLAB rand without a seed and makes one run per stiffness. The port cannot reproduce
    MATLAB's stream: it uses numpy with seeds and the build's replicates (5 seeds; 3 for the four runs at
    the stiffnesses of Chan and Odde's Fig. 1D, to keep the build short), so single runs differ from the
    code's, their distribution does not.
  citation: {file: motorclutch2_3.m, lines: "87", quote: "tbind=-log(rand(1,length(cdisen)))/kon;"}
- id: q_update_order
  kind: reading
  about: [mc_event_port]
  text: >-
    In the code the flow and the traction of an interval are computed from the substrate position before
    its event (lines 119-120), and after the event every engaged clutch, including one that has just bound,
    moves by vf dt over the whole interval (line 122); the clutch that just unbound does not move. The
    papers describe the step as "engaged clutches advance by v_f Δt" without saying whether the clutch that
    bound at the end of the interval counts. The port follows the code; the order is part of what the
    comparisons test.
  citation: {file: motorclutch2_3.m, lines: "119-123", quote: "xc(ceng)=xc(ceng)+vf*dt; %claculate positions of engaged clutches"}
- id: q_cycle_definition
  kind: reading
  about: [mc_event_port, cmp_b13_fig6d, tcycle_fig6d_b13]
  text: >-
    The code's cycle time is the mean interval between states with no engaged clutch, found by exact
    equality subpos == 0 (line 142), counting from the initial state at t = 0. The paper (Fig. 6D) does not
    say how its cycle time was computed; the code gives one definition.
  citation: {file: motorclutch2_3.m, lines: "142", quote: "cyctime=diff(t(subpos==0)); %cycle time"}
- id: q_kens_not_in_code
  kind: unstated_model
  about: [run_b13_fig6b, kens_b13_port]
  text: >-
    The code computes the mean number of engaged clutches (avnumcon, line 146) but not the ensemble clutch
    stiffness Kc avnumcon that Bangasser et al. 2013 plot in Fig. 6B; the port adds that product.
  citation: {file: motorclutch2_3.m, lines: "146", quote: "avnumcon(jj)=sum((numcon.*timestep)/t(events+1)); %average number of engaged clutches"}
- id: q_optimum_method
  kind: choice
  about: [optimum_port, run_b13_opt, run_n25_opt, cmp_b13_opt, cmp_b13b_opt_n25, ref_grid_b13, ref_grid_n25]
  text: >-
    The code sweeps 10 stiffnesses (logspace(-2,2,10), 0.44 decade apart) and plots retro; it does not
    locate the optimum. The record locates it by the least grid value and a parabola in log10(Ksub)
    through it and its neighbours, at the code's grid and at 2x and 4x as many points. On the code's own
    grid the base-set optimum is pulled away from the paper's dashed line, which lies between two grid
    points (0.077 and 0.22 pN/nm); the finer grids show where the code's curve has its minimum. The
    base-set optimum moves from about 0.098 to 0.117 pN/nm on refining and settles there, still below the
    0.137 ± 0.007 read off Bangasser's Fig. 2C. The n = 25 optimum settles near 0.37 pN/nm against the
    printed 0.4. Whether the dashed line marks a fitted minimum, a grid point or a finer sweep is not said.
  citation: {file: motorclutch2_3.m, lines: "27", quote: "stiffness=logspace(-2,2,10); %define stiffness vector"}
- id: q_chan_algorithm
  kind: unexplained_difference
  about: [cmp_c08_fig1d, cmp_c08_fig1d_soft, cmp_c08_fig1d_Fsoft, cmp_c08_fig1d_Fstiff, cmp_b13_figS1a]
  text: >-
    Run with Chan and Odde's Table S1 values (nm = nc = 75, kon = 1 /s, Kc = 5 pN/nm), the ported
    event-stepping code reproduces Bangasser et al. 2013's Fig. S1A curve, which that paper presents as its
    own event-stepping simulation of Chan's parameters. It does not reproduce Chan and Odde's Fig. 1D. On
    soft substrates (0.5-2 pN/nm) the flow is about half of Chan's (34 vs 76 nm/s at 0.5 pN/nm), and the
    traction is about twice Chan's on the soft side (about 93-112 vs 47-55 pN). The curves meet only on
    stiff substrates. So the code is not the algorithm behind Chan's printed figure, although its header
    says it reduplicates the Chan model. Chan's time-stepped scheme (5 ms steps), or something else
    unstated, gives different results at the same parameters. Neither paper says which is right; the record
    only finds that they differ.
  citation: {file: motorclutch1_1.m, lines: "5", quote: "Reduplicate the Chan Motor-Clutch model with event stepping"}
- id: q_initial_dt
  kind: reading
  about: [dt_initial_11, mc_event_port]
  text: >-
    Both scripts move the engaged clutches by vf times 0.005 s before the loop (motorclutch1_1.m lines
    43-48, motorclutch2_3.m line 66), the comment saying "(dt=0.005)", Chan and Odde's 5 ms time step. No
    clutch is engaged at t = 0, so it moves nothing; motorclutch1_1.m stores it as timestep(1), which no
    average uses. A remnant of the time-stepped model.
  citation: {file: motorclutch2_3.m, lines: "66", quote: "xc(ceng)=xc(ceng)+vf*0.005;"}
- id: q_not_ported
  kind: reading
  about: [mc_event_port]
  text: >-
    Not entered: the outputs the code computes but no paper prints (velcv, rebcyc, avcough, avtime,
    avsubpos, binds, failures in motorclutch2_3.m; Fcdist, cdisp1, ndisp1, texp, cndisp in motorclutch1_1.m,
    the last two plotted only on commented-out lines 172-174), and the plots, including the survival,
    density and hazard analysis of the cycle times (motorclutch1_1.m lines 143-166).
  citation: {file: motorclutch1_1.m, lines: "149-156", quote: "[hi lo]=hist(cyctime,50);"}
- id: q_legend_swapped
  kind: possible_error
  about: [mc_event_port]
  text: >-
    motorclutch1_1.m plots plotyy(lo,S,lo,pdf), S(t) on the left axis and pdf(t) on the right, but labels
    them legend('pdf(t)','S(t)'), the other way round. It affects only the figure the script draws.
  citation: {file: motorclutch1_1.m, lines: "159-161", quote: "legend('pdf(t)','S(t)')"}
# ---- cross-record validation against chan2008's measurements (validations.yaml), 2026-11-02 --------
- id: q_xval_chan2008_scope
  kind: choice
  about: [mc_event_port, odde_code/val_c08_v260, odde_code/val_c08_v57k, chan2008/v_fig3c_260, chan2008/v_fig3c_57k, chan2008/v_fig3d_exp_sem, chan2008/v_figS8C_control, chan2008/v_figS8C_gfp, chan2008/v_stiff_text, chan2008/failures_figS5D, chan2008/T_max_fig]
  text: >-
    chan2008 measured flow, force and failures against a gel's Young's modulus; the code's model takes a
    substrate spring constant in pN/nm. The only gels with a spring constant produced in chan2008 are
    260 Pa and 57 kPa (ksub_260_pred, ksub_57k_pred: Eq. 13 with the fitted Δ = 277 nm, an input added
    in that record), so the two validations use the Fig. 3C means on those gels. Both are entered as
    fits (fit_quality), because Δ was fitted so that the model's flow matches the measured flows of
    Fig. 3D (SOM p. 18). The model is run at Chan and Odde's Table S1 set, as in run_chan_1d. It is not
    run at the code's own base set (motorclutch2_3.m, Bangasser et al. 2013's Table 1, which that paper
    says was fit to Chan and Odde's data): the spring constant Bangasser et al. gave each of Chan's gels
    is in neither record. Not used: the Fig. 3D points with SEMs (v_fig3d_exp_sem) and the Fig. S8C
    bars, which are curves indexed by modulus and cannot be swept through a model input in pN/nm
    without a spring constant for each read modulus (the 260 Pa and 57 kPa points of Fig. 3D are the
    Fig. 3C means again). v_stiff_text is "~110", which gets no verdict. T_max_fig is a peak force,
    which the port does not output. failures_figS5D: see q_xval_chan2008_failures.
  citation: {file: motorclutch1_1.m, lines: "5", quote: "Reduplicate the Chan Motor-Clutch model with event stepping"}
- id: q_xval_chan2008_failures
  kind: unstated_model
  about: [mc_event_port, chan2008/failures_figS5D, chan2008/q_failure_frequency_model]
  text: >-
    The port outputs a failure frequency (failfreq: states with no engaged clutch per second), and Chan
    and Odde say their measured failure frequency rises with stiffness "as predicted by the model" (SOM
    p. 14). The two are not entered as the same quantity. The measured failures are positive 1 s bead
    steps larger than 30% of the trace's maximal displacement, a criterion that also counts large
    partial releases and is limited by the 1 s sampling. The model counts complete releases, with no
    time resolution. Neither paper links the two definitions, and the paper claims only the trend, not
    the rates. The measurement is also indexed by modulus (260, 730, 1300 Pa), and neither record gives
    a spring constant for 730 or 1300 Pa.
  citation: {file: motorclutch2_3.m, lines: "145", quote: "failfreq(jj)=(length(numcon(numcon==0))-1)/(t(events+1)); %failures/s"}
- id: q_xval_chan2008_algorithm
  kind: unexplained_difference
  about: [odde_code/val_c08_v260, odde_code/val_c08_v57k, q_chan_algorithm]
  text: >-
    Chan and Odde's time-stepped model was fitted (through Δ) to agree with these measured means. The
    event-stepping port differs from that model on soft substrates at the same parameters
    (q_chan_algorithm), and the 260 Pa gel's spring constant falls on the soft side. So the two
    validations ask whether the fit carries over to the code's algorithm; whatever their verdicts are,
    they do not test Δ.
  citation: {file: motorclutch1_1.m, lines: "5", quote: "Reduplicate the Chan Motor-Clutch model with event stepping"}
# ---- cross-record validation against bangasser2013b (2026-11-02): none added ------------------------
- id: q_xval_bangasser2013b_none
  kind: choice
  about: [mc_event_port, optimum_port, bangasser2013b/fig6b_ode_cal, bangasser2013b/fig6b_mc1_cal, bangasser2013b/fig6b_mc100_cal, ksopt_mc_n25_b13b]
  text: >-
    No validation of the code's models against bangasser2013b's measurements was entered. That paper is
    theory: it compares its master-equation ODEs with Monte Carlo simulations and has no experimental
    data. Its only `measured` values are the computation times of its Fig. 6(b), how long the authors'
    ODE solver and Monte Carlo software ran (fig6b_ode_cal, fig6b_mc1_cal, fig6b_mc100_cal). Neither
    mc_event_port nor optimum_port outputs a computation time. t_total is simulated time, not run time.
    A run time belongs to a machine and an implementation, not to the motor-clutch model, so it is not
    predicted by the port. The paper's Monte Carlo optimum at nm = nc = 25 (0.4 pN/nm) is a prediction.
    The record already compares it as a reproduction (ksopt_mc_n25_b13b, cmp_b13b_opt_n25), not as a
    validation. odde_code itself holds no measurements, so there is nothing for bangasser2013b's models
    to be validated against either (bangasser2013b/q_xval_odde_code_none).
  citation: {file: motorclutch2_3.m, lines: "26", quote: "events=1e5; %number of events to simulate"}
# ---- cross-record validation against bangasser2013 (2026-11-02): none added -------------------------
- id: q_xval_bangasser2013_none
  kind: choice
  about: [mc_event_port, optimum_port, bangasser2013/v_figS1b_measured, bangasser2013/tau_kong_fig7c, bangasser2013/traction_fig1b_neuron, bangasser2013/traction_fig1b_t24, bangasser2013/traction_fig1b_baec, bangasser2013/migration_fig1a_u87, bangasser2013/migration_fig1a_smc, bangasser2013/migration_fig1a_neut, bangasser2013/migration_fig1a_nih3t3]
  text: >-
    No validation of the code's models against bangasser2013's measurements was entered. That paper's
    measured data are all from other works, redrawn in its figures. (1) Fig. S1B, Chan and Odde's six
    neuron flow means (v_figS1b_measured): the flow is mc_event_port's v_retro, and the code's
    motorclutch2_3.m set is the base set that bangasser2013 "fit to the embryonic chick forebrain neuron
    data from Chan and Odde" (Fig. S1 legend), so it could only be a fit. But the curve is indexed by
    Young's modulus (substrate_modulus, kPa), and the port takes a spring constant in pN/nm: a sweep would
    cross two different quantities, and neither paper states the conversion (bangasser2013
    q_xval_chan2008_ksub). The paper also draws the four soft points at 0.5-0.6 times the moduli chan2008
    prints (bangasser2013 q_xval_chan2008_figS1b_positions). The 260 Pa and 57 kPa means of the same data
    are already entered as fits against chan2008's own Fig. 3C (val_c08_v260, val_c08_v57k). (2) Fig. 7C,
    Kong et al.'s integrin lifetimes against force (tau_kong_fig7c): the port outputs no bond lifetime,
    and its off-rate is a slip bond koff exp(Fc/Fb), not the catch-slip Eq. 9 fitted to these points. The
    shared shape of bangasser2013/catch_slip_eq9 and mc_event_port (a time from forces and rates) is a
    relation between models, left to the job that relates them. (3) Fig. 1B normalized tractions (neurons,
    T24, BAEC) and Fig. 1A normalized migration (U87, SMC, neutrophils, NIH/3T3): the port gives a mean
    traction in pN, not a cell's traction normalized to its maximum, and no migration; the cell types other
    than neurons have no parameters in either record, and all are indexed by modulus. These show trends
    (stiffness optima) that the model reproduces only qualitatively. odde_code holds no measurements, so
    nothing is there for bangasser2013's models to be validated against (bangasser2013
    q_xval_odde_code_none).
  citation: {file: motorclutch1_1.m, lines: "5", quote: "Reduplicate the Chan Motor-Clutch model with event stepping"}
