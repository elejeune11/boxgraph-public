# Values this paper takes from Elosegui-Artola et al. 2016 (ref-20), linked to that record's data.
# Supplementary Table 4 (PDF p. 23) gives ref. 20 as the source of each row below; Methods (p. 10):
# "Most parameters were taken exactly as in our previous work". Each row is a row of Elosegui's
# Supplementary Table 1 (PDF p. 19). ksub_table stays unlinked: Elosegui prints no substrate spring
# constant (it gives Young's moduli and the adhesion radius instead).
- {datum: nf_table, from_datum: nf_table, evidence: "Supp. Table 4 'Number of FN molecules 1200', source ref. 20; Elosegui's Supp. Table 1 'Number of FN molecules 1200'"}
- {datum: kon_i_table, from_datum: kont_table, evidence: "Supp. Table 4 'Intrinsic binding rate 2.11x10-4 um2/s', source ref. 20; Elosegui's Supp. Table 1 'True binding rate 2.11x10-4 um2/s' (kont, the same intrinsic binding rate in kon = kont dint)"}
- {datum: kc_table, from_datum: kc_table, evidence: "Supp. Table 4 'Clutch spring constant 1 nN/nm', source ref. 20; Elosegui's Supp. Table 1 'Clutch spring constant 1 nN/nm'"}
- {datum: FR_table, from_datum: FR_table, evidence: "Supp. Table 4 FR (fraction of force experienced by talin) 0.073, source ref. 20; Elosegui's Supp. Table 1 'Fraction of force experienced by talin 0.073'"}
- {datum: dmin_table, from_datum: dint_table, evidence: "Supp. Table 4 'Integrin density on the membrane' dmin 300 /um2, source ref. 20; Elosegui's Supp. Table 1 'Integrin density on the membrane 300 /um2' (its basal dint, the floor below which dint never drops)"}
