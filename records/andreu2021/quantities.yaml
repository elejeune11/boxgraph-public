- {id: stretch_amplitude, name: amplitude of the relative actin-substrate movement imposed by stretch, dimension: "[length]", description: "A in |v| = 2Af (clutch model) or the displacement of the cell edge"}
- {id: stretch_frequency, name: frequency of the applied stretch signal, dimension: "1/[time]"}
- {id: applied_stretch, name: applied biaxial stretch (strain of the substrate), dimension: dimensionless}
- {id: cell_diameter, name: average spreading diameter of a cell, dimension: "[length]"}
- {id: deformation_speed, name: speed of deformation at the cell edge, dimension: "[length]/[time]"}
- {id: n_fibronectin, name: number of fibronectin molecules (clutches) in the model, dimension: dimensionless}
- {id: integrin_binding_rate_intrinsic, name: intrinsic integrin-fibronectin binding rate (per integrin density), dimension: "[length]**2/[time]"}
- {id: clutch_stiffness, name: spring constant of one clutch, dimension: "[force]/[length]"}
- {id: substrate_stiffness, name: spring constant of the substrate in the clutch model, dimension: "[force]/[length]"}
- {id: talin_force_fraction, name: fraction of integrin force experienced by talin, dimension: dimensionless}
- {id: integrin_density, name: integrin density on the membrane, dimension: "1/[length]**2"}
- {id: integrin_density_increment, name: "integrins added per reinforcement event, per area", dimension: "1/[length]**2"}
- {id: actin_breaking_force, name: force on a clutch above which the actin cytoskeleton breaks (softening), dimension: "[force]"}
- {id: catch_bond_prefactor, name: prefactor of one exponential term of the integrin off-rate k_off(F), dimension: "1/[time]"}
- {id: catch_bond_force_coefficient, name: force coefficient in the exponent of one term of k_off(F), dimension: "1/[force]"}
- {id: ln_unfolding_rate_zero_force, name: natural log of the talin unfolding rate at zero force (rate in 1/s), dimension: dimensionless}
- {id: unfolding_force_coefficient, name: force coefficient in the exponent of the talin unfolding rate, dimension: "1/[force]"}
- {id: adhesion_length, name: focal adhesion length, dimension: "[length]", description: "measured from paxillin stainings; for the model, the integrin density scaled to the adhesion-length axis of Fig. 2e"}
- {id: length_scale_offset, name: adhesion length the scaling assigns to the baseline integrin density, dimension: "[length]"}
- {id: length_scale_slope, name: adhesion length per unit of relative integrin-density increase in the scaling, dimension: "[length]"}
# added by the audit (Supplementary Table 1, PDF p. 20)
- {id: cell_radius, name: average cell radius, dimension: "[length]"}
- {id: cell_stiffness, name: effective stiffness of the cell loaded by the deformation, dimension: "[force]/[length]", description: "the ~2 nN/µm of Fig. 3c used in Supplementary Table 1 note (ii)"}
- {id: cell_load, name: load on the cell from the applied deformation, dimension: "[force]"}
- {id: cell_loading_rate, name: rate at which the applied deformation loads the cell, dimension: "[force]/[time]"}
# added by the second figure pass (measured data read from figures); names as in record andreu2021_data
- {id: condition_index, name: position of a categorical condition along a figure's x axis, dimension: dimensionless, description: "1 for the first group read, 2 for the next, ...; what each index is is in the reading's `what` and the datum's note"}
- {id: yap_nuc_cyt_ratio, name: YAP nuclear to cytoplasmic ratio, dimension: dimensionless}
- {id: actin_retrograde_flow, name: actin retrograde flow speed, dimension: "[length]/[time]"}
- {id: actin_anisotropy, name: actin anisotropy (degree of alignment of actin fibres), dimension: dimensionless}
- {id: bead_speed, name: speed of a bead moved by the optical tweezers, dimension: "[length]/[time]"}
- {id: force_loading_rate, name: rate of force application to a bead by the optical tweezers, dimension: "[force]/[time]"}
- {id: bead_stiffness, name: stiffness of a bead-cell attachment, dimension: "[force]/[length]"}
- {id: paxillin_recruitment, name: recruitment of GFP-paxillin at beads (arbitrary units), dimension: dimensionless}
- {id: apparent_youngs_modulus, name: apparent Young's modulus of a cell from AFM retraction curves, dimension: "[pressure]"}
- {id: peak_force, name: peak force during AFM cantilever retraction, dimension: "[force]"}
- {id: cell_area, name: spread area of a cell, dimension: "[length]**2"}
- {id: edu_positive_fraction, name: percentage of EdU-positive (proliferating) cells, dimension: dimensionless}
- {id: bead_displacement_amplitude, name: amplitude of bead displacement, dimension: "[length]"}
- {id: bead_force_amplitude, name: amplitude of force on a bead, dimension: "[force]"}
- {id: ventilation_frequency, name: lung ventilation frequency, dimension: "1/[time]"}
- {id: time, name: time since the start of force application, dimension: "[time]"}
- {id: retraction_speed, name: AFM cantilever retraction speed, dimension: "[length]/[time]"}
- {id: substrate_rigidity, name: Young's modulus of the substrate cells are plated on, dimension: "[pressure]"}
- {id: applied_voltage, name: voltage applied to the pressure transducer of the stretch device, dimension: "[mass]*[length]**2/[current]/[time]**3"}
- {id: voltage_loading_rate, name: rate of change of the voltage signal driving the stretch ("loading stretch"), dimension: "[mass]*[length]**2/[current]/[time]**4"}
- {id: cell_count, name: number of cells in a histogram bin, dimension: dimensionless}
- {id: trap_signal_frequency, name: frequency of the triangular force signal moving the optical trap (or the AFM bead), dimension: "1/[time]"}
