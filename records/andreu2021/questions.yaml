- id: q_supp1_load
  kind: unstated_model
  about: [supp_table1_edge, load_lo_supp1, load_hi_supp1]
  text: >-
    In Supplementary Table 1 the Load column of the stretch row carries note (ii), which states only how
    loading rates were computed (deformation rate x ~2 nN/µm). The audit takes the load as the same
    stiffness times the deformation of note (i); the paper does not say so.
  citation: {page: 20, quote: "Loading rates calculated from deformation rates taking stiffness", where: "Supplementary Table 1, note (ii)"}
- id: q_supp1_order_ranges
  kind: reading
  about: [deformation_lo_supp1, defrate_lo_supp1, load_lo_supp1, loadrate_hi_supp1]
  text: >-
    The stretch row of Supplementary Table 1 prints ranges of bare powers of ten, recorded end by end and
    compared without verdict. Taken literally as intervals, the paper's own edge estimate falls outside
    some of them: at 2.5% and 0.125 Hz the deformation rate is 0.0625 µm/s (below 10^-1, and the paper's
    own "~60 nm/s" on p. 2), the load 0.5 nN (below 10^0); at 20% and 2 Hz the loading rate is 16 nN/s
    (above 10^1). Each is within the same order of magnitude, which is all the table claims.
  citation: {page: 20, quote: "we provide only orders of magnitude for", where: "Supplementary Table 1 caption"}
- id: q_supp1_per_area
  kind: unstated_input
  about: [radius_supp1]
  text: >-
    The per-area columns of the stretch row (10^0 - 10^1 pN/µm2 and 10^0 - 10^2 pN/µm2/s) divide by an
    adhesion area "estimated from an average 10 µm cell radius" with adhesions in an edge band of ~2 µm;
    the paper does not say how the area follows from these (annulus pi(10^2 - 8^2) = 113 µm2, or strip
    2 pi 10 x 2 = 126 µm2, or another). Not compared by the audit.
  citation: {page: 20, quote: "Cell spreading areas were also estimated from an", where: "Supplementary Table 1, note (iii)"}
