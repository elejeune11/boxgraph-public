- id: q_fig1_points_read
  kind: reading
  about: [q_validation_not_read, fig1e_pax_tri, fig1f_pax_tri, fig1g_pax_tri, fig1h_pax_tri]
  text: >-
    The measured points that Fig. 2e overlays on the model (Fig. 2e says they are "from Fig. 1") are now read
    by code from Fig. 1e-h, where they are drawn without the shading and the model line: YAP (blue) and
    paxillin (red) means with their s.e.m. bars, the triangular-signal points separately from Ns and Sq.
    Where a red point lies partly behind a blue one its centre interval spans every place it could be, and
    a bar end hidden behind the other series is taken as the mirror of its visible end, with the outer
    interval covering the hidden span. The comparisons val_fig1*_pax_* (clutch model runs) and
    val_fig2e_line_vs_fig1* (the paper's own plotted lines) are the validation q_validation_not_read left out.
  citation: {page: 4, quote: "Model predictions (black line) overlaid on experimental YAP and paxillin results", where: "Fig. 2e caption"}
- id: q_fig2e_line_vs_data
  kind: unexplained_difference
  about: [val_fig2e_line_vs_fig1e, val_fig2e_line_vs_fig1f, val_fig2e_line_vs_fig1g, val_fig2e_line_vs_fig1h, q_scaling]
  text: >-
    Read against the measured paxillin lengths of Fig. 1e-h, the paper's own model lines of Fig. 2e lie
    outside the s.e.m. bars at several frequencies: at 10% stretch the line gives about 0.81, 1.20 and 2.12 µm
    at 0.25, 0.5 and 1 Hz where the measured means are about 1.13, 1.79 and 2.54 µm; at 2.5% the line is
    about 0.69 µm at 0.125 Hz against about 1.12 µm measured. Only the 20% panel is close at every frequency.
    The measured lengths span about 0.70 µm (Ns, 5%) to 2.54 µm (10%, 1 Hz), while the lines span about
    0.69 to 2.12 µm, so the scaling "between the minimum and maximum experimental length values" reaches the
    measured minimum but not the measured maximum. The paper claims trends ("largely reproduced observed
    experimental trends"), not values, and does not discuss the size of these departures.
  citation: {page: 5, quote: "the model largely reproduced observed experi", where: text}
- id: q_printed_ksub_flat
  kind: reading
  about: [q_ksub_unit, val_fig1e_pax_printed, val_fig1f_pax_printed, val_fig1g_pax_printed, val_fig1h_pax_printed]
  text: >-
    Run with k_sub as printed (1 µN/nm), the record's clutch model gives 0.60 µm at every frequency and
    stretch (no reinforcement), so all four validations against Fig. 1e-h fail at almost every point; with
    k_sub = 1 pN/nm (the code's value) the 20% panel comes close and the others partly. The measured data
    thus side with the code's value, as q_ksub_unit argues from the Fig. 2e lines.
  citation: {page: 23, quote: "Substrate spring constant 1 µN/nm", where: Supplementary Table 4}
