# Inputs the clutch model needs that the paper does not print. Supplementary Table 4 gives the integrin
# off-rate only as "Catch bond" and the talin unfolding rate only as "Slip bond" (both from ref. 20), and
# the scaling of integrin density to adhesion length only in words (p. 11). The values below are those of
# the authors' Supplementary Software 1 (record andreu2021_code); the precomputed rate tables there
# (kofflr.mat) start from the 'mn' catch-bond curve of koffcb.m (its zero-force value matches them).
- id: koff_a_added
  quantity: catch_bond_prefactor
  unit: 1/s
  printed: "11.27"
  basis: "Supplementary Software 1, koffcb.m case 'mn' (a = 11.27): k_off(F) = a exp(bF) + c exp(dF), a fit to the Kong et al. (ref. 39) catch bond used in ref. 20; the paper prints only 'Catch bond'"
  alternatives: ["16.67"]
  stands_for: "k_off(F), first (slip) term prefactor"
- id: koff_b_added
  quantity: catch_bond_force_coefficient
  unit: 1/N
  printed: "-1.601 x 10^11"
  basis: "Supplementary Software 1, koffcb.m case 'mn' (b = -1.601e+011)"
  alternatives: ["-1.945 x 10^11"]
  stands_for: "k_off(F), first term force coefficient"
- id: koff_c_added
  quantity: catch_bond_prefactor
  unit: 1/s
  printed: "0.0008882"
  basis: "Supplementary Software 1, koffcb.m case 'mn' (c = 0.0008882)"
  alternatives: ["0.001442"]
  stands_for: "k_off(F), second (catch) term prefactor"
- id: koff_d_added
  quantity: catch_bond_force_coefficient
  unit: 1/N
  printed: "1.225 x 10^11"
  basis: "Supplementary Software 1, koffcb.m case 'mn' (d = 1.225e+011)"
  alternatives: ["1.356 x 10^11"]
  stands_for: "k_off(F), second term force coefficient"
# The alternatives of the four k_off coefficients are the commented-out values next to them in koffcb.m.
- id: ln_kunf0_added
  quantity: ln_unfolding_rate_zero_force
  unit: dimensionless
  printed: "-7.573"
  basis: "Supplementary Software 1 ('loading rate script.m' and cmstretchg.m: kunf = exp(-7.573) exp(1.786e12 |F| pt)), the talin slip bond of ref. 20 fitted to ref. 40; the paper prints only 'Slip bond'"
  stands_for: "k_unf(F) = exp(ln_kunf0) exp(kunf_b FR F)"
- id: kunf_b_added
  quantity: unfolding_force_coefficient
  unit: 1/N
  printed: "1.786 x 10^12"
  basis: "Supplementary Software 1, as for ln_kunf0_added"
  stands_for: "k_unf(F) force coefficient"
- id: ksub_code_added
  quantity: substrate_stiffness
  unit: N/m
  printed: "1 x 10^-3"
  basis: "Supplementary Software 1, stretchscriptg.m (ksub = 1e-3 N/m = 1 pN/nm). Used only in the second set of Fig. 2e runs, beside the runs with the printed 1 µN/nm (q_ksub_unit): the paper says ksub was taken from the lower range of ref. 20, matching a 0.5 kPa gel"
  stands_for: "k_sub"
- id: len0_added
  quantity: length_scale_offset
  unit: um
  printed: "0.6"
  basis: "The paper says model densities 'were scaled between the minimum and maximum experimental length values' (p. 11) without numbers. Supplementary Software 1 plots bl + (d_int/d_min - 1) sc with bl = 1.2 on the YAP axis; in Fig. 2e the YAP axis 1.0-2.0 spans the adhesion-length axis 0-3 µm, so 1.2 sits at 0.6 µm"
  alternatives: ["0.7"]
  stands_for: "adhesion length at d_int = d_min"
- id: len_scale_added
  quantity: length_scale_slope
  unit: um
  printed: "4.2"
  basis: "As len0_added: sc = 1.4 on the YAP axis is 1.4 x 3 µm = 4.2 µm on the adhesion-length axis of Fig. 2e"
  stands_for: "adhesion length per unit of d_int/d_min - 1"
