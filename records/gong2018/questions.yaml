- id: q_fig3c_green_mean
  kind: unexplained_difference
  about: [cmp_fig3c_means, cmp_fig1d_mean, vs_fig3c_means, vs_fig1d_mean]
  text: >-
    (Figures.) At ka = 1, kl = 0.1 pN/nm, eta = 1 pN s/nm the record's run gives a mean speed of 77.7
    nm/s, below the Fig. 3C green mean (82.6 [81.0, 84.1], not reproduced) and the Fig. 1D mean (80.4
    [79.3, 81.6], close). The red (eta = 10^-2) mean is reproduced and the black (eta = 10^2) one is
    close (74.0 vs 71.6). Fig. 3A at the neighbouring kl = 0.1, ka = 1.0 is reproduced over the whole
    tau_s/tau_b range, so the difference is confined to the full-cycle mean of these traces; it is of
    the size the cycle and reinforcement choices change (q_cycle_end, q_reinforcement_rule).
- id: q_threshold_figS1a_S7
  kind: unexplained_difference
  about: [cmp_figS1a_ode, cmp_figS7_model]
  text: >-
    (Figures.) The ODE curve of Fig. S1A and the model curve of Fig. S7 are the reinforced elastic curve
    of Fig. 1B. The record reproduces them below 1 pN/nm and on the 120 nm/s plateau, but not between
    about 1.2 and 2 pN/nm, where the paper's curve has already risen (S1A: 80.2 and 109.0 at 1.27 and
    2.07 pN/nm, record 71.8 and 94.8; S7: 79.0 and 87.4 at 1.2 and 1.5 pN/nm, record 72.7 and 74.6):
    the same threshold shift as q_fig1b_threshold, now seen in three figures.
- id: q_figS3d_ka10_floor
  kind: unexplained_difference
  about: [cmp_figS3d_ka10]
  text: >-
    (Figures.) For ka = 10 pN/nm without reinforcement, Fig. S3D shows about 3 nm/s above the drop; the
    record's run gives about 5 nm/s (close, not reproduced). Fig. 3A, and S3D for ka = 0.1, 0.5 and 2,
    are reproduced, so the difference is confined to this nearly stalled regime, where the speed comes
    from a few very short cycles and depends on when a cycle is ended (q_cycle_end).
- id: q_boxplot_meaning
  kind: reading
  about: [area_fig4d_box, area_fig4d_whiskers, area_fig5d_box, area_fig5d_whiskers]
  text: >-
    (Figures.) Figs. 4D and 5D are box plots, but the captions do not say what the box, the line and
    the whiskers are (by convention median, quartiles and 1.5 IQR, with outliers as circles). The record
    reads the line as the value and gives the box and the whiskers as two separate intervals.
- id: q_vp_two_values
  kind: unexplained_difference
  about: [Vp_tableS1, Vp_figS2]
  text: >-
    (Audit.) The Fig. S2 caption gives Vp = 40 nm/s for the spreading-area simulations (Fig. S2E),
    while Table S1 gives Vp = 120 nm/s and SI p. 3 says all parameters other than the spreading
    timescale, relaxation timescales and stiffnesses "are kept constant for all simulations". The paper
