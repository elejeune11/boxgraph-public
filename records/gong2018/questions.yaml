- id: q_cycle_end
  kind: choice
  about: [mean_field_sls, mean_field_elastic, mean_field_maxwell2]
  text: >-
    The mean-field ODE has no state in which "all clutches break": Pb only falls towards zero. The paper
    does not say when a cycle ends. The record ends it when Pb falls below 1/nc (fewer than one engaged
    clutch) after its peak, or where the solver stops in the finite-time rupture cascade; a cycle not
    ended by t_max = 2000 s is a stable adhesion. Refinement ref_break_fig1b varies the threshold.
  citation: {page: 3, quote: "Finally, at t = tlife (i.e., the binding lifetime for a FA marked in", where: text}
- id: q_reinforcement_rule
  kind: unstated_model
  about: [mean_field_sls, mean_field_elastic, mean_field_maxwell2]
  text: >-
    The reinforcement rule is ron = ron0 (1 + alpha (Fa - Fcr)), "updated in the next FA lifetime cycle"
    (SI p. 11). Whether the increase compounds over cycles (the integrin density keeps growing) or is
    recomputed from ron0 each cycle is not stated; neither is how Fa, "the average FA force", is
    averaged (over time, over engaged clutches, the per-clutch or the total force). The record takes a
    compounding increase and the time average of the ensemble clutch force kc (xc - xs); the
    compounding reading is the one under which the lifetime "would gradually increase and even
    diverge" (p. 3). With a non-compounding rule the stiff elastic substrates do not saturate at 120 nm/s.
  citation: {page: 11, quote: "which will then be updated", where: text}
- id: q_cycle_initial_state
  kind: choice
  about: [mean_field_sls, mean_field_maxwell2]
  text: >-
    Each cycle starts with all clutches free and the substrate (spring and dashpots) at rest. The paper
    does not say whether the dashpot keeps its displacement from one cycle to the next; on a slowly
    relaxing substrate (tau_s longer than a cycle) this changes what the next cycle senses.
- id: q_nstart_ensemble
  kind: choice
  about: [mean_field_sls]
  text: >-
    In Eqs. S5-S7 the ensemble clutch moves with the flow from t = 0 even while Pb is near zero, so its
    stretch xc - xs is set by the substrate response, not by when clutches bound. The record integrates
    the equations as printed, starting from Pb = 1e-9 (a setting) because it integrates ln Pb.
- id: q_fig2b_high_eta
  kind: unexplained_difference
  about: [cmp_fig2b_ka2, vs_fig2b_ka2]
  text: >-
    For ka = 2, kl = 0.1 pN/nm at high viscosity Fig. 2B shows ~118 nm/s, the saturated value; the
    record's run settles near 100 nm/s, with Fa held at Fcr by the reinforcement feedback. The rigid
    limit (initial stiffness ka + kl = 2.1 pN/nm) of the elastic run is where the record's Fig. 1B
    curve is still rising, while the paper's Fig. 1B is already near 110 nm/s at 2 pN/nm: the
    difference follows the reinforcement rule and the cycle settings (q_reinforcement_rule,
    q_cycle_initial_state), not a misreading of the figure.
- id: q_fig1b_threshold
  kind: unexplained_difference
  about: [cmp_fig1b_reinf, vs_fig1b_reinf]
  text: >-
    Below 1 pN/nm the record's Fig. 1B values follow the printed curve; the jump to saturation happens
    at a higher stiffness in the record than in the paper, where Fig. 1B marks reinforcement as
    beginning at ~1 pN/nm and SI p. 13 says Fcr = 3 pN "determines the rigidity (∼1 pN/nm)" at which it
    begins. In the record Fa reaches 3 pN only near 1.5 pN/nm, so the paper's Fa is larger than the
    record's time average by roughly a fifth at 1 pN/nm.
  citation: {page: 13, quote: "determines the rigidity (∼1 pN/nm) at which the integrin density", where: text}
- id: q_fb_two_values
  kind: choice
  about: [Fb_tableS1, Fb_meanfield]
  text: >-
    Table S1 gives Fb = 2 pN; the SI text gives 1.3 pN for the mean-field solution and 2 pN for KMC.
    The record's mean-field runs use 1.3 pN.
  citation: {page: 13, quote: "1.3 pN for the analytical solution generalized by mean-field", where: text}
- id: q_tau_l_symbol
  kind: possible_error
  about: [lifetime_timescale]
  text: >-
    tau_l is written Fm Nm/(vu kl) in the text (p. 5, SI p. 12), Fm Nm/(vp kl) in the Fig. 1A and S8A
    drawings, and Fs/(v0 kl) in the Fig. 1 caption. vu = Vp = 120 nm/s in Table S1, so the numbers are
    the same; the symbols are not.
  citation: {page: 3, quote: "FA lifetime scale ðτl = Fs =v0 kl Þ", where: "Fig. 1 caption"}
- id: q_tau_l_range
  kind: unexplained_difference
  about: [tau_l_at_kl_low, tau_l_at_kl_high, lifetime_timescale]
  text: >-
    The paper prints a tau_l range of 10^-1 s to 10^3 s (p. 8, "range of 10−1 s to 103 s"). A range of
    bare powers of ten cannot be entered as a printed value the build can read, so it is not a datum;
    the record produces tau_l = Fm Nm/(vu kl) at the two ends of the Table S1 stiffness range (runs
    run_tau_l_low, run_tau_l_high, added inputs) for a reader to set beside it. The paper does not say
    which stiffnesses its range corresponds to.
  citation: {page: 8, quote: "range of 10−1 s to 103 s", where: text}
- id: q_modulus_conversion
  kind: possible_error
  about: [boussinesq_eq_s9, k_1pNnm, R_contact]
  text: >-
    Eq. S9 relates the spring constant to the Young's modulus E (k ≈ 2RE = rE), while the relaxation
    analysis converts with the relaxation modulus G(t): k(t) ≈ G(t) r (SI p. 12). If G is a shear modulus,
    E = 3G at nu = 0.5 and the two conversions differ by a factor of 3; the paper uses "1 pN/nm = 1 kPa"
    for both.
  citation: {page: 12, quote: "the relaxed stiffness can be calculated as", where: text}
- id: q_gel_params
  kind: unstated_input
  about: [vs_PA_effective, vs_PA_multiple, vs_HA_effective, vs_HA_multiple]
  text: >-
    The substrate parameters behind Figs. 4-6 and S8B/C (effective ka, kl, eta of each gel, and the peak
    heights and timescales used for the multiple-timescale runs) are shown only as markers on heat maps
    and as spectra; they are not printed as numbers, so 97.2, 101.1, 74.6 and 75.4 nm/s cannot be rerun.
- id: q_area_model
  kind: unstated_input
  about: [mean_field_sls]
  text: >-
    The predicted spreading areas (Figs. 4D, 5D, 6E, S5C) come from Rss = R0 + Vs tau_ss with tau_ss
    "chosen" per cell type (Table S1 gives 100 s to 400 s); the values used for each figure are not
    printed, and the scaling factor SF = 0.3 enters the alginate case. Not rerun.
  citation: {page: 11, quote: "timescale τss (i.e., Rss = R0 + Vs · τss)", where: text}
- id: q_figS4_levels
  kind: unstated_input
  about: [mean_field_sls]
  text: >-
    The Fig. S4 tables print representative speeds (55, 70, 75, 85, ~120 nm/s) at "low, medium, and high"
    levels of kl and eta; the levels are not given as numbers, so the tables are not rerun.
- id: q_fig_reading_cover
  kind: reading
  about: [vs_fig2b_ka01, vs_fig2b_ka05, vs_figS8d_ka2_05, vs_figS8d_ka2_1, vs_figS8d_ka2_2]
  text: >-
    Where the series of Fig. 2B and Fig. S8D lie on top of each other (low viscosity / short tau_s2), the
    markers underneath are hidden and are not read; those series are compared only where they separate.
# added by the audit
- id: q_audit_unread_results
  kind: reading
  about: [mean_field_sls]
  text: >-
    (Audit.) Several plotted results the paper says the mean-field model produces, at parameters the
    paper prints, are not compared yet: Fig. 3A (p. 5; Vs vs tau_s/tau_b for kl = 10^-2, 10^-1, 10^0
    pN/nm at a fixed initial stiffness ka + kl = 1.1 pN/nm, legend and caption), the dash-dotted time
    averages of Fig. 3C (p. 5; ka = 1, kl = 0.1 pN/nm, eta = 10^-2, 10^0, 10^2 pN s/nm) and of Fig. 1D
    (p. 3; ka = 1, kl = 0.1, eta = 1, i.e. the run run_fig1_params, whose Vs, t_life and Fa are produced
    but compared with nothing), and Fig. S3D (p. 16; no reinforcement, kl = 0.1 pN/nm, four ka). Fig. 3A
    needs a model port in tau_s/tau_b (eta = (tau_s/tau_b) ka / ron0, a choice of tau_b = 1/ron0). The
    first reader left them "not read in this pass"; the audit could not render figure crops in its
    session and did not add readings. By eye, the Fig. 1D Vs line and the Fig. 3C green (eta = 10^0)
    line, at the same substrate parameters, do not sit at quite the same height; a reading would say
    whether the difference exceeds the reading precision.
  citation: {page: 5, quote: "fixed initial stiffness ka + kl = 1.1 pN/nm", where: "Fig. 3 caption"}
- id: q_eq_s9_symbol
  kind: possible_error
  about: [boussinesq_eq_s9]
  text: >-
    (Audit.) Eq. S9 names the substrate spring constant kc, the symbol the paper uses everywhere else
    (Table S1, Eq. S5) for the clutch stiffness (5 pN/nm). From the surrounding text it is the substrate
    stiffness k; the record's model keeps the printed symbol in `equation` and outputs it as
    substrate_stiffness.
  citation: {page: 12, quote: "the spring constant of substrate", where: "Eq. S9"}
