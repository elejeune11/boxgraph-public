- id: alpha_none
  quantity: reinforcement_sensitivity
  unit: 1/pN
  printed: "0"
  basis: >-
    Fig. 1B green curve is "the scenario without any reinforcement" (p. 3); the paper does not say how
    reinforcement was switched off. alpha = 0 keeps ron = ron0 in every cycle, which is the model with
    the reinforcement term removed.
  alternatives: ["0.0001"]
  stands_for: alpha in ron = ron0 (1 + alpha (Fa - Fcr)), for the no-reinforcement case
- id: kl_range_low
  quantity: long_term_stiffness
  unit: pN/nm
  printed: "0.01"
  basis: >-
    Lower end of the substrate stiffness range of Table S1 ("10^-2 pN/nm to 10^2 pN/nm", p. 20); the
    paper does not say which stiffnesses give its printed tau_l range (p. 8).
  alternatives: ["0.1"]
  stands_for: kl in tau_l = Fm Nm / (vu kl), lowest stiffness studied
- id: kl_range_high
  quantity: long_term_stiffness
  unit: pN/nm
  printed: "100"
  basis: >-
    Upper end of the substrate stiffness range of Table S1 ("10^-2 pN/nm to 10^2 pN/nm", p. 20).
  alternatives: ["10"]
  stands_for: kl in tau_l = Fm Nm / (vu kl), highest stiffness studied
- id: kl_fig3c_added
  quantity: long_term_stiffness
  unit: pN/nm
  printed: "0.1"
  basis: >-
    Fig. 3C shows the three cross points of Fig. 3B (p. 5); the crosses sit on the kl = 0.1 tick of the
    heat map's x axis, and the text (p. 5) compares the green trace with the elastic kl case. The kl of
    Fig. 3C is not printed as a number.
  alternatives: ["0.08", "0.12"]
  stands_for: kl of the three Fig. 3C traces
