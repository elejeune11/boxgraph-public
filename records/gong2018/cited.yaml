# Values this paper takes from other records.
# From chaudhuri2015 (ref. 4):
- {datum: area_fig6d_elastic, from_datum: fig3b_elastic, evidence: "Fig. 6D is 'Reprinted with permission from ref. 4' (p. 8 caption; ref. 4 = Chaudhuri et al. 2015): the spreading area of U2OS cells on elastic alginate (grey) at initial moduli 1.4, 3.4, 9 kPa, mean ± SD, is Chaudhuri's Fig. 3b grey bars (elastic, initial modulus 1.4, 3.4, 9 kPa, RGD 150, mean ± s.d.); Chaudhuri indexes the three moduli 1-3, Gong by their kPa values"}
- {datum: area_fig6d_visco, from_datum: fig3b_relax, evidence: "Fig. 6D is 'Reprinted with permission from ref. 4' (p. 8 caption; ref. 4 = Chaudhuri et al. 2015): the spreading area on viscoelastic alginate (maroon) at initial moduli 1.4, 3.4, 9 kPa, mean ± SD, is Chaudhuri's Fig. 3b maroon bars (stress-relaxing, initial modulus 1.4, 3.4, 9 kPa, mean ± s.d.); Chaudhuri indexes the three moduli 1-3, Gong by their kPa values"}
# From bangasser2013b (Table S1 ref. 1 = Bangasser & Odde 2013, Cell Mol Bioeng). Gong's Table S1 (p. 20)
# gives sources (1, 2) for these values; bangasser2013b's Table S1 (its p. 18) is the base set it took from
# Chan and Odde (ref. 2 here). Vp_tableS1 stays unlinked: bangasser2013b has no polymerization speed.
- {datum: nm_tableS1, from_datum: nm_base, evidence: "Table S1 source (1, 2), ref. 1 = Bangasser & Odde 2013: the number of myosin motors, 75 in both tables"}
- {datum: Fm_tableS1, from_datum: Fm_base, evidence: "Table S1 source (1, 2), ref. 1 = Bangasser & Odde 2013: the motor stall force, 2 pN in both tables, both counted positive"}
- {datum: nc_tableS1, from_datum: nc_base, evidence: "Table S1 source (1, 2), ref. 1 = Bangasser & Odde 2013: the number of clutches, 75 in both tables"}
- {datum: Fb_tableS1, from_datum: Fb_base, evidence: "Table S1 source (1, 2), ref. 1 = Bangasser & Odde 2013: the characteristic bond rupture (breakage) force, 2 pN in both tables; Gong's mean-field runs use 1.3 pN instead (Fb_meanfield, not from ref. 1)"}
- {datum: ron0_tableS1, from_datum: kon_base, evidence: "Table S1 source (1, 2), ref. 1 = Bangasser & Odde 2013: the clutch on-rate, Gong's ron0 and Bangasser's kon, 1 s-1 in both tables"}
- {datum: roff0_tableS1, from_datum: koff_base, evidence: "Table S1 source (1, 2), ref. 1 = Bangasser & Odde 2013: the unloaded clutch off-rate, Gong's roff0 and Bangasser's koff, 0.1 s-1 in both tables"}
- {datum: kc_tableS1, from_datum: kc_base, evidence: "Table S1 source (1, 2), ref. 1 = Bangasser & Odde 2013: the clutch stiffness, 5 pN/nm in both tables"}
- {datum: vu_tableS1, from_datum: vu_base, evidence: "Table S1 source (1, 2), ref. 1 = Bangasser & Odde 2013: Gong's unloaded retrograde flow velocity is Bangasser's unloaded motor velocity vu (it sets the flow at zero load in both models), 120 in both tables; Bangasser's table misprints the unit as pN/nm, entered there in nm/s"}
