id: boussinesq_eq_s9
name: spring constant of a substrate under a circular contact (Boussinesq, Eq. S9)
role: model
stated: {page: 12, quote: "with contact radius R can be written as", where: "Eq. S9"}
equation: "kc = 4/7 * pi R E / ((1 + nu)(1 - 0.86 nu)) ≈ 2 RE"
inputs:
  R:  {quantity: contact_radius, unit: um}
  E:  {quantity: elastic_modulus, unit: kPa}
  nu: {quantity: poisson_ratio, unit: dimensionless}
outputs:
  k:    {quantity: substrate_stiffness, unit: pN/nm}
  coef: {quantity: spring_constant_coefficient, unit: dimensionless, description: "k / (R E)"}
