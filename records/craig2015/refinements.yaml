- id: ref_fig4c_peak
  run: run_fig4c
  setting: n_segments
  factors: [1, 2, 4, 8]
  mode: multiply
  output: x_peak
  tolerance: "0.2"
  tolerance_basis: "added: one grid segment of the paper's own grid (8 um / 40), the resolution at which the peak can be located"
  tolerance_added: true
- id: ref_fig4c_vpeak
  run: run_fig4c
  setting: n_segments
  factors: [1, 2, 4, 8]
  mode: multiply
  output: v_peak
  tolerance: "0.1"
  tolerance_basis: "added: about the width of the reading intervals of the blue exes in Fig. 4(c)"
  tolerance_added: true
