id: lamellipodial_width
name: lamellipodial width from the balance of viscous force and traction near the leading edge (Discussion)
role: model
stated: {page: 11, quote: "Our model makes a very simple prediction for the", where: "Discussion, X ~ sqrt(2 mu V(0) / T-bar)"}
equation: "X ~ sqrt(2 mu V(0) / T-bar),  mu = (measured viscosity) x (lamellipodial thickness) (p. 7)"
inputs:
  eta: {quantity: actin_network_viscosity, unit: pN*s/um^2}
  h: {quantity: lamellipodium_thickness, unit: um}
  V0: {quantity: leading_edge_flow_speed, unit: um/s}
  Tbar: {quantity: traction_stress_scale, unit: pN/um^2}
outputs:
  X: {quantity: lamellipodium_width, unit: um}
stochastic: false
