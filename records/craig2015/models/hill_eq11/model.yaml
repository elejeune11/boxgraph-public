id: hill_eq11
name: Hill-like relation between total traction force and lamellar flow speed (Eq. 11)
role: model
stated: {page: 11, quote: "we can re-express equation (10) as a Hill", where: "Eq. 11"}
equation: "V_LM = Vmax (Ftot / (Fk + Ftot))"
inputs:
  Vmax: {quantity: hill_max_flow_speed, unit: nm/s}
  Fk: {quantity: hill_force_constant, unit: nN}
  Ftot: {quantity: total_traction_force, unit: nN}
outputs:
  VLM: {quantity: lamellar_flow_speed, unit: nm/s}
stochastic: false
