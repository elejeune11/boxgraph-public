id: transport_epsilon
name: size of the actin transport term in the rescaled actin density equation (Appendix D)
role: model
stated: {page: 13, quote: "can re-scale and non-dimensionalize the actin density", where: "Appendix D"}
equation: "epsilon = V0 / (r L0)"
inputs:
  V0: {quantity: leading_edge_flow_speed, unit: um/s}
  r: {quantity: actin_turnover_rate, unit: 1/s}
  L0: {quantity: length_scale, unit: um}
outputs:
  eps: {quantity: transport_parameter, unit: dimensionless}
stochastic: false
