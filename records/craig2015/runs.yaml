# ---- order-of-magnitude estimates -------------------------------------------------------------------
- id: run_lambda_estimate
  model: lambda_estimate
  inputs: {T0: T0_ptk1, L0: L0_model, V0: V0_ptk1, eta: eta_ref29, h: thickness_text}
  outputs: {drag: drag_scale_pred, lam: lambda_est_pred}
  note: "V0 is the ~20 nm/s leading-edge flow of Ptk1 cells (p. 8); the estimate on p. 8 does not name the V0 it uses"
- id: run_displacement
  model: network_displacement
  inputs: {V: V_char, t: t_relevant}
  outputs: {d: disp_pred}
  note: "the flow speed is the 'characteristic rate of the actin flow' of p. 5; Appendix D does not say which speed it used"
- id: run_epsilon
  model: transport_epsilon
  inputs: {V0: V0_eps, r: r_turnover, L0: L0_eps}
  outputs: {eps: eps_pred}
- id: run_width
  model: lamellipodial_width
  inputs: {eta: eta_ref29, h: thickness_text, V0: V0_ptk1, Tbar: T0_ptk1}
  outputs: {X: width_pred}
  note: "mu is the measured viscosity times the thickness (p. 8); T-bar is taken as the characteristic traction T0 of [14] (p. 8)"
- id: run_tension_viscosity
  model: tension_viscosity
  inputs: {Tbar: T0_ptk1, X: width_added, grad: gradient_added, h: thickness_text}
  outputs: {tension: tension_pred, eta: viscosity_pred}

# ---- Eq. 11 (U2OS, supplemental figure 1(c)) -----------------------------------------------------------
- id: run_hill_curve
  model: hill_eq11
  inputs: {Vmax: Vmax_fit, Fk: Fk_fit}
  sweep: {Ftot: d_figS1c_fit}
  outputs: {VLM: hill_curve_pred}
- id: run_hill_points
  model: hill_eq11
  inputs: {Vmax: Vmax_fit, Fk: Fk_fit}
  sweep: {Ftot: d_figS1c_points}
  outputs: {VLM: hill_points_pred}

# ---- Eq. 10 against the full model at the U2OS fit parameters ------------------------------------------
- id: run_eq10_S1
  model: uniform_flow_eq10
  inputs: {F: F_S1, b: b_S1}
  outputs: {V: eq10_S1_pred}
- id: run_profile_S1_end
  model: clutch_profile
  inputs: {lam: lam_S1, F: F_S1, b: b_S1, vstar: vstar_S1, gamma: gamma_S1, x: L_domain}
  outputs: {V: full_S1_V_end, T: full_S1_T_end}
  note: "the flow speed at the far end of the domain (x = L = 8 um), where the flow is uniform"

