notes: >
  Read from a 1978 scan. Every number recorded was checked against the page images, and
  quotes are copied from the OCR text with its errors. Page 10 also holds the start of an
  unrelated News and Comment article, which is not read. In scope is the paper's quantitative
  core: encounter rate constants in solution and on membranes (Eqs. 2-7); the maximum bond
  formation rate (Eq. 13) and its lymphocyte and fiber examples; K^m = 3K^s/4R_AB (note 45);
  the rupture force f0 = E0/r0 (Eq. 15) for antigen-antibody, covalent, glycophorin and
  ganglioside cases; the bond lifetime law (Eq. 16) with tau0, kT and the oscillator period;
  Table 2 (log10 tau from Eq. 16; log10 t from Eq. 17 solved numerically and from both forms
  of Eq. 22); the critical force (Eqs. 19-21); Stokes drag and bonds needed in flow
  (Eqs. 23-24); the bond-equivalents of inertial, adhesive, muscle and surface-tension forces;
  and the lipid-plug force of the note added in proof. Several short calculations given only
  in words (sphere area, receptor density, simple-harmonic acceleration and velocity, kT from
  T) are entered as from_words models. The Fig. 5 bridging model is entered as not runnable,
  because its equations are not printed (ref. 42).
  Many of the paper's results are printed with "≈", "~", "about" or "≤", or as bare powers of
  ten, so they get no verdict. They are still computed and compared, so the differences are
  on record.
  Main findings: Table 2's log10 tau column reproduces in full. In the log10 t column every
  row reproduces except -14.7 at 4 x 10^-6 dyne, against a computed -4.7, a likely misprint
  (q_table2_t_misprint). Table 2 needs two inputs the paper does not state: KN2 (300 is
  assumed, from Fig. 8) and k- (100 /s, from tau(f=0) = 0.01 s). With those, the critical
  force 2.98 x 10^-6 is close (2.973 x 10^-6). kT = 0.0268 eV at 37 degC is close (k_B T =
  0.02673). The oscillator period differs from the printed value, and its formula is
  ambiguous in the scan (q_tau_h_formula, q_tau_h_value). All other results with a printed
  precision reproduce.
  Left out because they feed no model: the review of electrical forces (secondary minimum
  ≈ 7 nm, 10^-5 dyne/um^2, the 2 x 10^-11 erg/um^2 = 500 kT/um^2 conversion); literature
  ranges of k+s (4 x 10^5 to 6 x 10^8 M^-1 s^-1) and k-s (3 x 10^-5 to 6 x 10^3 s^-1) and the
  derived range of r+; tau0 ≈ 10^-13 s for solids; the parenthetical K^s ≈ 10^6 M^-1 beside
  E0 = 0.37 eV (no relation between them is stated); the microvillus tip area; the
  fiber-coating count (2 x 10^4 per um^2 over 16 um^2 ≤ 3 x 10^5 bonds); "two bonds per
  (0.1 um)^2" for a microvillus; the residue transfer free energies and the 20 and 35
  kcal/mole sums for glycophorin (they need the protein sequence); the contact
  area-duration products of p. 626; concanavalin A rate constants; the 10^-4 s grazing time;
  and, in the first reading, the Fig. 8 curves.
  Figure reading (2026-10-31, claude-opus-5-5): Fig. 8 is the only figure with calibrated
  axes; the others are drawings or sketches without tick values (see figures.md). Its four
  curves (KL = 300, 1000, 3000, 10^4) are now calibrated figure readings, swept by Eq. 17 in
  the figure's dimensionless variables (21 of 29 points reproduced, 8 close) and by Eq. 22
  (approximation). The KL=300 curve supports reading the Table 2 entry -14.7 as -4.7
  (q_fig8_table2_misprint).
