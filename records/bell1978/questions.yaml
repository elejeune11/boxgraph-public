- id: q_fig8_code_reading
  kind: unexplained_difference
  about: [fig8_KL300_code, fig8_KL1000_code, fig8_KL3000_code, fig8_KL1e4_code, cmp_fig8_KL3000_eq17, cmp_fig8_KL3000_eq22, cmp_fig8_KL300_eq17, q_fig8_low_force, q_fig8_table2_misprint]
  text: >
