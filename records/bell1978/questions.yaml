# cross-record validation against kong2009 (2026-11-02): none added
- id: q_xval_kong2009_none
  kind: unstated_input
  about: [lifetime_eq16, loaded_reverse_rate, rupture_force_eq15, force_adhesive]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    kong2009. That paper cites this one only to set its result against it: published force-ramp
    work assumed that "off rate increases exponentially with increasing force as modeled by Bell
    (1978), which precluded catch bonds", while its force-clamp lifetimes "deviate from the Bell
    model" (kong2009 pp. 5-6). It does not say this paper's model predicts any of its numbers.
    kong2009 measured the mean lifetime (+- SEM) of single FNIII7-10/a5b1 bonds against clamped
    force (Figs. 3, 5, 6), plus antibody and Fc/GG-7 controls (Figs. 3 A, 4). lifetime_eq16 gives
    exactly that quantity, bond lifetime at a given force per bond, so the force sweep is possible.
    But neither paper gives the inputs for that bond. tau0 = 10^-8 s, E0 ~ 0.37 eV and r0 = 0.5 nm
    are this paper's estimates for an antibody-hapten bond (p. 5), not for integrin-FN, and kong2009
    fits no Bell parameters. With E0 and gamma unstated over a wide range, a run would give whatever
    lifetime scale those choices give; the only parameter-free prediction is a lifetime that falls
    monotonically with force. That is a trend, and kong2009 states the comparison only in words
    (triphasic, not Bell-like), so it is not entered as a validation. Fitting E0 and gamma to
    kong2009's curve would be a fit of this model to that data, which this paper does not make. In
    the other direction, this record's measurements (force_adhesive, about 1 dyne per cell from
    ref. 52; sugar concentrations c_sugar_low and c_sugar_high) are outputs of no kong2009 model:
    see kong2009 q_xval_bell1978_none.
  citation: {page: 5, printed_page: "622", quote: "I will u'se the estimate ro = 0.5 nm. This", where: text}
