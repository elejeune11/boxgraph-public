  citation: {page: 7, printed_page: "624", quote: "Values of t* were computed nu-", where: "Fig. 8"}
- id: q_no_validation_chan2008
  kind: unstated_model
  about: [loaded_reverse_rate, rupture_force_eq15, critical_force_eq21, force_adhesive]
  text: >-
    Cross-validation against chan2008 (which cites this paper for the loaded off-rate) found no
    measurement to enter, in either direction. Chan's measurements are F-actin retrograde flow
    rates on gels of given stiffness, filopodial traction (110 ± 25 pN), bead displacement
    statistics and the frequency of failure events of whole filopodia. None of this record's
    models outputs any of these: loaded_reverse_rate gives the off-rate of one bond at a known
    force per bond, and Chan measures no single-bond off-rate and no tension per clutch;
    rupture_force_eq15 and the critical forces are forces per bond, not the traction of a
    filopodium; the detachment-time and encounter models concern cells adhering to cells. In the
    other direction, this record's measurements (force_adhesive, about 1 dyne to detach a cell,
    and the inhibiting sugar concentrations) are not outputs of any chan2008 model.
  citation: {page: 6, printed_page: "623", quote: "stant in Eq. 12 should be replaced by", where: text}
# cross-record validation against chaudhuri2015 (2026-11-02): none added
- id: q_xval_chaudhuri2015_none
  kind: choice
  about: [loaded_reverse_rate, lifetime_eq16, rupture_force_eq15, force_adhesive]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    chaudhuri2015 (which cites this paper as its ref. S5 for the Bell off-rate law). chaudhuri2015
    measured alginate gel properties (initial Young's moduli in Fig. 2c and Supp. Table 1, stress
    relaxation and rheology in Fig. 2a,b and Supp. Fig. 3) and cell responses (spread area in
    Fig. 3b,c, 4b and Supp. Figs. 4-5, stress fibres, attachment, YAP ratio and proliferation). None
    of this record's models outputs any of these: loaded_reverse_rate and lifetime_eq16 give the
    off rate or lifetime of one bond at a known force per bond, and Chaudhuri measures no bond
    off rate, lifetime or force per bond; the other models concern bond numbers, rupture and
    detachment of cells adhering to cells or surfaces under a known force. Spread area or gel
    stress relaxation would need a model of spreading or of the gel, which this paper does not
    have. In the other direction, this record's measurements (force_adhesive, about 1 dyne, and the
    sugar concentrations c_sugar_low and c_sugar_high) are not outputs of any chaudhuri2015 model.
  citation: {page: 6, printed_page: "623", quote: "stant in Eq. 12 should be replaced by", where: text}
# cross-record validation against elosegui2014 (2026-11-02): none added
- id: q_xval_elosegui2014_none
  kind: unstated_input
  about: [detach_time_eq17, detach_time_eq22_exact, detach_time_eq22_approx, lifetime_eq16, loaded_reverse_rate]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    elosegui2014, which cites this paper (its ref. 9) only for the principle that bond unbinding
    rates are "determined by force", not for any number. The only measurement there that a model
    here could output is the bead detachment time under the magnetic tweezers (Fig. 2c, datum
    detachment_time_fig2c: 0.5 nN on FN-coated beads for at most 2 min). Eq. 17 or Eq. 22 would give
    a detachment time for F = 0.5 nN, but only with inputs neither paper states for those beads: the
    number of bonds N1 sharing the force (hence the force per bond), the barrier range r0 of the
    integrin-FN bond, and for Eq. 17 KN2. The only k- candidate, elosegui2014's SPR koff, is a fitted
    zero-force rate whose power of ten is ambiguous by 10^4 (elosegui2014 q_koff_column_multiplier),
    and elosegui2014 models the a5b1-FN bond as a catch bond (minimum koff near 30 pN), which Eq. 16
    does not describe. With N1 and r0 both free over orders of magnitude, any detachment time from
    0 to 2 min can be produced, so a run would be a fit of two unstated parameters, not a test. The
    datum is also indexed by antibody condition, which no model input here can sweep. In the other
    direction, this record's measurements (force_adhesive, about 1 dyne, from ref. 52; sugar
    concentrations c_sugar_low, c_sugar_high) are outputs of no elosegui2014 model: its clutch model
    is not runnable and its other models are ratios of its own SPR rates and integrin densities.
  citation: {page: 6, printed_page: "623", quote: "at which N b becomes zero. The result is", where: "Eq. 22"}
