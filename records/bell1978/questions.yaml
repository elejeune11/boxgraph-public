# ---- added with the calibrated Fig. 8 readings
- id: q_fig8_table2_misprint
  kind: reading
  about: [log_t_table2, log_tstar_fig8_KL300, q_table2_t_misprint, q_table2_KN2]
  text: >
    Fig. 8 bears on q_table2_t_misprint. The Table 2 row at 4 x 10^-6 dyne has
    r0 f/kT = 4.66 (r0 = 0.5 nm, kT = 0.0268 eV), so f* = 0.82 if KN2 = 300. The calibrated
    reading of the KL=300 curve gives log10 t* = -2.73 at f* = 0.8 and -3.33 at f* = 1.0, about
    -2.78 at f* = 0.82. That is log10 t ≈ -4.8 for k- = 100 /s, near -4.7 and far from the
    printed -14.7. No curve in Fig. 8 gets below log10 t* = -5 for f* ≤ 1, and for KN2 = 10^4
    f* = 0.51, which is below critical. So the printed -14.7 would need a k- of about 10^12 /s,
    or a force well outside the range of the row. The figure cannot separate KN2 from k-,
    because each moves log10 t by a shift, so it does not settle q_table2_KN2 by itself.
  citation: {page: 7, printed_page: "624", quote: "Fig. 8. The time for detachment,", where: "Fig. 8"}
- id: q_fig8_low_force
  kind: unexplained_difference
  about: [cmp_fig8_KL300_eq17, cmp_fig8_KL1000_eq17, cmp_fig8_KL3000_eq17, cmp_fig8_KL1e4_eq17, fig8_KL300]
  text: >
    At f* = 0.8 all four curves of Fig. 8 lie 0.06 to 0.09 in log10 t* below the record's
    numerical solution of Eq. 17 (close, not reproduced). Eq. 22 lies within the reading
    there. The difference is about 3 px on the page. It may come from the paper's
    numerics (it gives no settings; the record's cut-off and tolerance are refined and do not
