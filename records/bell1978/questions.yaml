    catch-slip. detach_time_eq17 has the same shape as bangasser2013/catch_slip_eq9 (a time from a
    force and rates), but no bangasser2013 measurement is a cell detachment time. In the other
    direction, this record's measurements (force_adhesive, about 1 dyne per cell; c_sugar_low,
    c_sugar_high) are outputs of no bangasser2013 model: see bangasser2013 q_xval_bell1978_none.
