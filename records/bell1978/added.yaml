- id: KN2_table2
  quantity: KN2_product
  unit: dimensionless
  printed: "300"
  basis: >
    Table 2 prints a critical force of 2.98 x 10^-6 dyne per bond and detachment times t
    but does not state the KN2 they were computed with. Fig. 8 (p. 7) shows curves for
    KL = 300, 1000, 3000 and 10^4; 300 is the lowest of these. The text example (p. 6) uses
    KN2 = 10^3.
  alternatives: ["1000", "3000", "10000"]
  stands_for: KN2 in Eqs. 17 and 20 for Table 2
- id: k_minus_table2
  quantity: reverse_rate_membrane
  unit: 1/s
  printed: "100"
  basis: >
    Table 2 does not state the reverse rate constant k- used for the detachment time t.
    On p. 5 the paper identifies tau(f = 0) with (k-)^-1 and takes tau(f = 0) = 0.01 s,
    which gives k- = 100 /s. The paper adds "or more properly (r-)^-1", so k- could be smaller.
  alternatives: ["10", "1000"]
  stands_for: k- in Eqs. 17 and 22 for Table 2
