id: laplace_pressure_radius
name: cell surface pressure times radius, P = 2 gamma/R ~ 10^4/R
role: model
stated: {page: 7, printed_page: "624", quote: "This corresponds to a cell surface pres-", where: text}
equation: "P = 2γ/R ~ 10^4/R dyne/cm^2, with R in micrometers"
built_from: [laplace_pressure]
inputs:
  gamma: {quantity: surface_tension, unit: dyne/cm}
outputs:
  PR: {quantity: pressure_times_radius, unit: dyne*um/cm^2}
