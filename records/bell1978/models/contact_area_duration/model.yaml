id: contact_area_duration
name: contact area times collision duration needed to form a given number of bonds
role: model
stated: {page: 9, printed_page: "626", quote: "product of contact area and duration ex-", where: text}
equation: "not printed; the paper gives only the results (3 um^2 msec for N1 ~ 10^4, ~300 um^2 msec for N1 ~ 10^2). Read as A t = Nb / (dNb/dt), with Nb the ~300 bonds of p. 625; see q_area_duration_model"
from_words: true
inputs:
  Nb: {quantity: bond_count, unit: dimensionless}
  rate: {quantity: bond_formation_rate, unit: 1/um^2/ms}
outputs:
  At: {quantity: contact_area_duration, unit: um^2*ms}
