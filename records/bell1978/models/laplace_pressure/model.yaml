id: laplace_pressure
name: cell surface pressure from surface tension
role: model
stated: {page: 7, printed_page: "624", quote: "This corresponds to a cell surface pres-", where: text}
equation: "P = 2 gamma/R"
inputs:
  gamma: {quantity: surface_tension, unit: dyne/cm}
  R: {quantity: cell_radius, unit: um}
outputs:
  P: {quantity: force_per_area, unit: dyne/cm^2}
