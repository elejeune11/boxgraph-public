id: peak_inertial_force
name: peak acceleration of a vibrating fiber and the inertial force on an attached cell
role: model
stated: {page: 7, printed_page: "624", quote: "The inertial forces can be computed", where: text}
equation: "not printed; the text goes from frequency 1600 cycles/s and displacement 1 mm to peak acceleration and force. Read as simple harmonic motion: a = (2π nu)^2 A, F = m a"
from_words: true
inputs:
  nu: {quantity: vibration_frequency, unit: Hz}
  A: {quantity: displacement_amplitude, unit: mm}
  m: {quantity: cell_mass, unit: g}
outputs:
  a: {quantity: peak_acceleration, unit: mm/s^2}
  F: {quantity: force_on_cell, unit: dyne}
