id: plug_force
name: force to displace a cylindrical bilayer plug with a protein (note added in proof)
role: model
stated: {page: 9, printed_page: "626", quote: "and the associated free energy change is", where: "Note added in proof"}
equation: "free energy ≈ sigma 2π r h (60π r h cal/mole per plug); force ≈ that / (h/2) = 120π r cal/mole-Å = 2.6 x 10^-6 r dynes"
inputs:
  sigma: {quantity: lipid_exposure_free_energy, unit: cal/mol/angstrom^2}
  r: {quantity: plug_radius, unit: angstrom}
outputs:
  f_per_r: {quantity: plug_force_per_radius, unit: dyne/angstrom}
  f: {quantity: rupture_force, unit: dyne}
