id: detach_time_eq22_exact
name: time to detach a cell under a large force, exponential-integral form (Eq. 22)
role: model
stated: {page: 6, printed_page: "623", quote: "at which N b becomes zero. The result is", where: "Eq. 22"}
equation: "t(F) = (1/k-) E1(Y0), Y0 = r0 F/kT Nb(0) ≈ r0 F/kT N1"
inputs:
  k_minus: {quantity: reverse_rate_membrane, unit: 1/s}
  r0: {quantity: barrier_range, unit: nm}
  f: {quantity: force_per_bond, unit: dyne, description: "F/N1"}
  kT: {quantity: thermal_energy, unit: eV/particle}
outputs:
  t: {quantity: detachment_time, unit: s}
