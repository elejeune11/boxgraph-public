id: lifetime_eq16
name: bond lifetime under force (Eq. 16)
role: model
stated: {page: 5, printed_page: "622", quote: "the lifetime of a bond is writ-", where: "Eq. 16"}
described_from: ref-44
equation: "tau = tau0 exp[(E0 - gamma f)/kT]"
inputs:
  tau0: {quantity: reciprocal_natural_frequency, unit: s}
  E0: {quantity: barrier_free_energy, unit: eV/particle}
  gamma: {quantity: barrier_range, unit: nm, description: "gamma, set approximately equal to r0"}
  f: {quantity: force_per_bond, unit: dyne}
  kT: {quantity: thermal_energy, unit: eV/particle}
outputs:
  tau: {quantity: bond_lifetime, unit: s}
