id: encounter_membrane
name: encounter-complex rate constants for membrane-bound reactants (Eqs. 5-6)
role: model
stated: {page: 3, printed_page: "620", quote: "branes, separated by a distance ' RAB, it", where: "Eqs. 5-6"}
described_from: ref-37
equation: "d+m = 2π[Dm(A) + Dm(B)]; d-m = 2[Dm(A) + Dm(B)]RAB^-2"
inputs:
  Dm_sum: {quantity: membrane_diffusion_sum, unit: cm^2/s, description: "Dm(A) + Dm(B)"}
  RAB: {quantity: encounter_distance, unit: nm}
outputs:
  d_plus_m: {quantity: encounter_rate_membrane, unit: cm^2/s}
  d_minus_m: {quantity: encounter_dissociation_rate_membrane, unit: 1/s}
