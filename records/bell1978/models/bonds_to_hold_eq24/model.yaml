id: bonds_to_hold_eq24
name: number of bonds needed to hold a cell in a fluid stream (Eq. 24)
role: model
stated: {page: 7, printed_page: "624", quote: "bonds needed to hold the cell in a fluid", where: "Eq. 24"}
equation: "Nb = 5.3 x 10^-5 v/fc = 13 v"
inputs:
  drag: {quantity: drag_coefficient, unit: dyne*s/cm}
  fc: {quantity: critical_force_per_bond, unit: dyne}
  v: {quantity: flow_velocity, unit: cm/s}
outputs:
  Nb_per_v: {quantity: bonds_per_velocity, unit: s/cm}
  Nb: {quantity: bond_count, unit: dimensionless}
