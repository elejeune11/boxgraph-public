  citation: {page: 9, printed_page: "2", quote: "Average spreading velocity as a function of substrate stiffness if lattice is removed", where: "Supp. Fig. 1d"}
- id: q_s1d_duration
  kind: choice
  about: [run_s1d_nc5, run_s1d_nc25, run_s1d_nc50, run_s1d_nc100, run_s1d_nc1000, clutch_springs_nolattice]
  text: >-
    The simulated time behind each point of Supp. Fig. 1d is not stated. The record uses 12 s
    (60,000 steps of 0.2 ms, the paper's run length for spreading area), and runs each curve again
    with 1 s, the run length of Supp. Fig. 1c. Because all clutches start unbound and kon = 1 s^-1,
    the average speed over a short run includes the start-up and depends on this choice.
- id: q_s1d_difference
  kind: unexplained_difference
  about: [cmp_s1d_nc50, cmp_s1d_nc100, clutch_springs_nolattice]
  text: >-
    In trial runs while building this record, the lattice-free model on the Supp. Table 2 parameters
    gave the shapes of Supp. Fig. 1d for nC = 5, 25 and 1000 (low speeds falling with stiffness, and a
    near-stalled flow at about 120 nm/s). It gave lower speeds than plotted for nC = 50 above about
    0.3 pN/nm (e.g. about 30 against about 78 nm/s at 1 pN/nm). For nC = 100 above about 1 pN/nm it
    gave about 20-40 nm/s where the figure stays near 118 nm/s. The plotted nC = 100 curve looks like a
    run that stays stalled once enough clutches are bound. Unstated rules may decide which state a run
    ends in: initial binding, run length, clipping of v_retrograde (q_s1d_rules, q_s1d_duration). The
    verdicts are computed by the build.
- id: q_s1d_rules
  kind: unstated_model
  about: [clutch_springs_nolattice]
  text: >-
    The lattice-free variant is described in one sentence. The record makes these choices: the clutch
    spring and its own substrate spring act in series (effective stiffness kclutch ksub/(kclutch+ksub));
    all clutches start unbound; a newly bound clutch starts unstretched; every bound pair is stretched
    by v_retrograde dt each step; binding and unbinding are tested once per step with probabilities
    1-exp(-k dt); v_retrograde from Supp. Eq. 1 is not clipped at zero, so v_spread can briefly exceed vu
    when the clutch forces exceed Fstall; the reported speed is the time average of v_spread over the run.
    In particular, whether the run starts with clutches bound would change the high-stiffness branch
    of the nC=100 curve, which the paper shows staying near vu.
