    clutch_springs_nolattice and bangasser2013b/clutch_ensemble_cycle is a relation between models,
    not a measurement.
  citation: {page: 7, printed_page: "7", where: "ref. 20", quote: "Bangasser, B. L., Rosenfeld, S. S. & Odde, D. J. Determinants of maximal force"}
# cross-record validation against bangasser2013 (2026-11-02): none added
- id: q_xval_bangasser2013_none
  kind: choice
  about: [clutch_springs_nolattice, bell_off_rate, retrograde_flow_eq1, lattice_spreading]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    bangasser2013. This paper cites Bangasser, Rosenfeld & Odde (ref. 20; Supp. ref. 8) for the
    model's behaviour, a stiffness optimum set by clutch number and the stalled state at many clutches,
    which the lattice-free variant "recreates" (Supplemental Model Characterization): that is a
    model-to-model relation, not a measurement. bangasser2013's measurements are (1) Kong et al.'s
    integrin bond lifetimes against force (bangasser2013/tau_kong_fig7c): bell_off_rate gives a loaded
    off rate, not a lifetime, and a lifetime is not the same quantity; its parameters (koff, Frup of
    Supp. Table 2) are for this paper's clutch, and a slip law cannot meet a catch-bond curve anyway;
    (2) Chan and Odde's neuron filopodia retrograde flow against substrate stiffness, as replotted in
    Fig. S1B (bangasser2013/v_figS1b_measured): clutch_springs_nolattice gives spreading speed
    vu - v_retrograde, not retrograde flow, and retrograde_flow_eq1 needs the total clutch force, which
    was not measured; (3) the normalized migration and traction curves of other studies (Fig. 1A-B),
    which no model here gives. So nothing here predicts any of them as measured.
  citation: {page: 21, printed_page: "14", where: "Supplemental Model Characterization", quote: "mediated by clutch number as reported in Bangasser"}
