- id: q_s1d_xaxis
  kind: reading
  about: [s1d_nc5, s1d_nc25, s1d_nc50, s1d_nc100, s1d_nc1000]
  text: >-
    The x axis of Supp. Fig. 1d carries the printed labels 10^-2, 1 and 10^2, but its evenly spaced
    major tick marks (with log minor ticks between them) put 10^-2 about 0.3 decade to the right of
    where the label "10^-2" is printed, at the left end of the axis. The label "1" sits on a tick. The
    readings are calibrated on the ticks with "1" on its tick, so the axis runs from about 0.005 to
    about 88 pN/nm. If instead the end labels mark the axis ends (0.01 to 100 pN/nm), every stiffness
    would shift, by up to a factor of 2 at the left end; the verdicts at the low-stiffness end depend on
