- id: q_eq2_form
  kind: possible_error
  about: [burgers_eq2]
  text: >-
    Supp. Eq. 2 as printed is not the usual four-element Burgers relation and is dimensionally
    inconsistent: its right side is the product (dε/dt)(d²ε/dt²) with coefficient η1²η2/(E1E2), and the
    d²σ/dt² term has coefficient η2/E2. The common textbook form has coefficient η1η2/(E1E2) on d²σ/dt²
    and a right side η1 dε/dt + (η1η2/E2) d²ε/dt². Under a constant strain rate the printed form has a
    zero right side, so it would give no loading at all in the simulated tensile test of Supp. Fig. 1f.
    Whether the code used the printed or another form is not known; the equation is recorded as printed.
  citation: {page: 19, printed_page: "12", quote: "In the Burgers model, stress and strain are related by", where: "Supp. Eq. 2"}
- id: q_eta_names
  kind: possible_error
  about: [burgers_eq2, lattice_spreading]
  text: >-
    The damping coefficients are named inconsistently. Supp. Note 1 calls η1 the Maxwell element damping
    coefficient and η2 the Voigt one, and so does the Fig. 5 caption (η1 as Maxwell). The Fig. 1 caption
    calls η1 the Voigt damping coefficient and η2 the Maxwell damping coefficient.
  citation: {page: 3, printed_page: "3", quote: "Voigt damping coefficient, Z1, was", where: "Fig. 1 caption"}
- id: q_eta_values_units
  kind: possible_error
  about: [eta1_range_table, eta2_range_table, lattice_spreading]
  text: >-
    The damping values used for Fig. 1c (η1 = 5 x 10^-13, η2 = 1 x 10^-13) and Fig. 5b (η1 = 1 x 10^-12,
    5 x 10^-13, 1 x 10^-13) are printed without units, and lie far outside the range 0.01-100 pN s given
    for η1 and η2 in Supp. Table 2. Supp. Table 2 also gives damping in pN s, while a dashpot in series
    or parallel with a spring of stiffness in pN nm^-1 would need pN s nm^-1. These values were not put
    in data.yaml because no unit is printed for them.
  citation: {page: 6, printed_page: "6", quote: "stress-relaxing substrates with the indicated Burger’s model Maxwell damping", where: "Fig. 5 caption"}
- id: q_lattice_unstated
  kind: unstated_model
  about: [lattice_spreading]
  text: >-
    The lattice-spring model behind all the paper's spreading predictions (Fig. 1b-d, Fig. 5b,
    Supp. Fig. 1c,e,f, Supp. Fig. 2) cannot be rebuilt from the text: lattice size, node spacing, node
