# Supp. Fig. 1d: the lattice-free clutch model on the printed parameters (Supp. Table 2), one run per
# clutch number, swept over the stiffness positions read from each curve. Five replicates (seeds),
# as the caption says each point is "the mean of five simulation runs".
# The simulated time for Supp. Fig. 1d is not stated: t_total = 12 s (60,000 steps of 0.2 ms, the
# paper's run length for spreading) is the record's choice; the *_t1 runs use 1 s, the run length of
# Supp. Fig. 1c. See question q_s1d_duration.
- id: run_s1d_nc5
  model: clutch_springs_nolattice
  inputs: {nc: nc_5, kon: kon_table, koff: koff_table, Frup: Frup_table, vu: vu_table, Fstall: Fstall_table, kclutch: kclutch_table}
  sweep: {ksub: s1d_nc5}
  replicates: 5
  outputs: {v_spread: v_s1d_nc5_pred}
  note: "t_total 12 s is an added choice (not stated for Supp. Fig. 1d)"
- id: run_s1d_nc25
