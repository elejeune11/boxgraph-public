- id: ref_dt_nc50
  run: run_s1d_nc50_point
  setting: dt
  factors: [1, 2, 4, 8]
  mode: divide
  output: v_spread
  tolerance: "5%"
  tolerance_basis: >-
    added: the paper states no tolerance (it chose 0.2 ms as "within the stable range", Supp. Fig. 1c);
    5% is about the reading precision of Supp. Fig. 1d and above the replicate noise of five runs
  tolerance_added: true
