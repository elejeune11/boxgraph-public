id: retrograde_flow_eq1
name: actin retrograde flow and spreading velocity (Supp. Eq. 1)
role: model
stated: {page: 19, printed_page: "12", quote: "Inhibition of actin retrograde flow velocity is assumed to be a function of the force", where: "Supp. Eq. 1"}
equation: "v_retrograde = vu (1 - sum_clutch Fclutch / Fstall) (1); v_spread = vu - v_retrograde"
inputs:
  vu:     {quantity: unloaded_motor_velocity, unit: nm/s}
  F_sum:  {quantity: total_clutch_force, unit: pN}
  Fstall: {quantity: stall_force, unit: pN}
outputs:
  v_retrograde: {quantity: retrograde_flow_velocity, unit: nm/s}
  v_spread:     {quantity: spreading_speed, unit: nm/s}
