id: survival_first_order
name: first-order dissociation seen in a ln(number of events) versus t plot
role: model
stated: {page: 8, printed_page: "1282", quote: "The negative slope of a line reflects the off rate", where: text}
equation: "ln(number of events with lifetime >= t) = ln N0 - k t (in words: the negative slope of a line reflects the off rate)"
from_words: true
inputs:
  lnN0: {quantity: log_event_count, unit: dimensionless, description: ln of the number of events at t = 0}
  k: {quantity: off_rate, unit: 1/s, description: off rate of the subpopulation of dissociation events}
  t: {quantity: lifetime_threshold, unit: s}
outputs:
  lnN: {quantity: log_event_count, unit: dimensionless}
settings: {}
stochastic: false
