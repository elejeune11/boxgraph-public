id: series_bonds
name: two bonds in series dissociate at the sum of their rates
role: model
stated: {page: 3, printed_page: "1277", quote: "rate of two bonds in series equals to the sum of the two", where: text}
equation: "k_serial = k_1 + k_2 (in words); with lifetimes 1/k: 1/tau_serial = 1/tau_1 + 1/tau_2"
from_words: true
inputs:
  tau_1: {quantity: bond_lifetime_mean, unit: s, description: mean lifetime of the first bond alone (e.g. FN-a5b1-Fc)}
  tau_2: {quantity: bond_lifetime_mean, unit: s, description: mean lifetime of the second bond alone (e.g. Fc-GG-7)}
outputs:
  tau_serial: {quantity: bond_lifetime_mean, unit: s, description: mean lifetime of the two bonds in series}
settings: {}
stochastic: false
