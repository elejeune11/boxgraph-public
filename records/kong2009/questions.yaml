- id: q_fig2_binding_above_20pc
  kind: unexplained_difference
  about: [af_FN_a5b1Fc_fig2a, af_FN_a5b1Fc_fig2b, af_FN_tra5b1Fc_fig2c]
  text: >
    The text says binding was kept infrequent (<20%) so that most adhesions are single bonds, by using
    progressively lower GG-7 coatings in Ca2+/Mg2+, Mg2+/EGTA and Mn2+ (p. 3, citing Fig. 2 B and D).
    The readings of Fig. 2 show specific adhesion frequencies above 0.2 in three bars: 0.23 (SEM bar
    0.20-0.26) for FN/a5b1-Fc in Ca2+/Mg2+ at 100 ug/ml GG-7 (Fig. 2 B, closed bar 1), 0.22 for
    FN/a5b1-Fc in Mn2+ at 15 ug/ml GG-7 (Fig. 2 A, bar 3) and 0.38 for FN/tra5b1-Fc in Mn2+ at
    100 ug/ml GG-7 (Fig. 2 C, bar 3). All of Fig. 2 D (tra5b1-Fc at the coatings it names) stay below
    0.2. The paper does not say which coating each lifetime experiment of Figs. 3-6 used, so whether
    those experiments met the <20% requirement cannot be told from the record.
  citation: {page: 3, quote: "To maintain infrequent binding (<20%), a requirement for"}
- id: q_stiffness_unit
  kind: reading
  about: [stiffness_by_lifetime_bin, figs3c_open]
  text: >
    The y axes of Fig. S3 B and C (molecular stiffness) print no unit. Stiffness is defined as the force
    increase divided by the extension increase of force (pN) versus extension (nm) curves (Fig. S3 A), so
    the record takes pN/nm; the paper does not state the unit.
  citation: {page: 12, quote: "defined as the force increase divided by the molecular extension"}
- id: q_figure_pass_2_choices
  kind: reading
  about: [fig2a_open, figs2a_open, figs2a_closed, figs4a_band, figs4b_squares]
  text: >
    Reading choices of the second figure pass. Bars are read at the centre line of their top edge (the
    outline is centred on the value, as the x axis is on the 0 tick); a filled bar's hidden outline is
    taken as thick as the open bars' in the same panel. Error bars hidden in a closed or hatched bar are
    the mirror of the visible upper half. In Fig. 2 A the top tick (0.3) merges with the end of the axis
    line and is not used; the three others fit with a misfit of 0.3 px. Fig. S2 A is a histogram of
    5-pN bins with the closed bar in the left half and the open in the right: x is the drawn bar's
    centre, and a bin without a bar (a zero) is not reported. In Fig. S4 A the squares (one per repeat)
    overlap into a band; it is read at its centre with an interval of half the band less half a square,
    from 40 repeats on (before that single squares at k/n are drawn too close to the axis to separate by
    repeat). In Fig. S4 B the first square is cut by the y axis; its centre is taken half a square left of
    its right edge.
- id: q_xval_elosegui2016_none
  kind: unstated_model
  about: [series_bonds, survival_first_order]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    elosegui2016, which cites this paper. The two models here, stated in words, give the mean lifetime of
    two bonds in series from the lifetimes of each alone, and ln(number of events) versus lifetime for a
    first-order dissociation. elosegui2016 measures cell tractions, actin flow, adhesion lengths, nuclear
    YAP, talin and integrin readouts on gels, and FN-avb3 single-bond lifetimes (its Fig. 3a) without
    the lifetimes of component bonds or event counts; none of these is an output of either model run on
    elosegui2016's conditions.
- id: q_xval_elosegui2014_none
  kind: unstated_model
  about: [series_bonds, survival_first_order]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    elosegui2014, which cites this paper (its ref. 12) only as the source of the FN-a5b1 koff/force
    catch-bond curve its clutch model uses. The two models here give the mean lifetime of two bonds in
    series from the lifetime of each alone, and ln(number of events) versus lifetime for a first-order
    dissociation. elosegui2014 measures SPR sensorgrams and fitted kont/koff of purified integrins,
    membrane integrin densities, bead detachment times under 0.5 nN magnetic-tweezers force on cells,
    integrin recruitment to beads, and cell tractions, actin flows and adhesion integrin densities on
    gels; it prints neither the lifetimes of component bonds in series nor counts of dissociation events.
    None of these is an output of either model run on elosegui2014's conditions.
- id: q_xval_bell1978_none
  kind: unstated_model
  about: [series_bonds, survival_first_order, lt_FN_a5b1Fc_CaMg, lt_FN_a5b1Fc_MgEGTA, lt_FN_a5b1Fc_Mn]
  text: >-
    (Cross-record validation.) No model of this record is validated against a measurement of
    bell1978, and no bell1978 model is validated against this record's lifetime measurements. Here
    Bell (1978) is cited only for the exponential force dependence of the off rate that "precluded
    catch bonds" (p. 5), and the measured lifetimes are said to "deviate from the Bell model" (p. 6).
    That is a qualitative statement about the shape of the curve: no Bell parameters (tau0, E0,
    gamma) are given or fitted for the FN-a5b1 bond, and bell1978 states none for it. See bell1978
    q_xval_kong2009_none. bell1978's only measurements (about 1 dyne to detach a cell, from its
    ref. 52, and inhibiting sugar concentrations) are outputs of neither model here. The series-bond
    rule needs the lifetimes of two component bonds, and the first-order survival line needs event
    counts.
  citation: {page: 5, printed_page: "1279", quote: "tially with increasing force as modeled by Bell (1978), which"}
