- id: q_high_force_overlap_overstated
  kind: overstated_claim
  about: [cmp_fig3b_vs_FcGG7_above30, cmp_fig3c_vs_FcGG7_above30, cmp_fig5a_vs_FcGG7_above25, cmp_fig5b_vs_FcGG7_above25, cmp_fig5c_vs_FcGG7_above25]
  text: >
    The paper's conclusion about where the chain breaks rests on two statements: that the Fig. 3 B and C
    circle curves become "indistinguishable" from the grey Fc/GG-7 curve above 30 pN (p. 3, and the
    Fig. 3 caption, where they "overlap"), and that the Fig. 5 A-C circle curves "coincided" with it
    above 25 pN "in all three cation conditions" (p. 5). Read as lines at the same forces, the curves are
    not the same. In Fig. 3 B the circles lie below the squares at every force from 35 to 50 pN (for
    example about 2.2 s against 3.1 s at 40 pN). In Fig. 3 C they lie above the squares at 35 pN and
    below them at 45 pN. In Fig. 5 A (Ca2+/Mg2+) they lie well above them (about 7.8 s against 5.3 s at
    35 pN, and 4.8 s against 3.1 s at 40 pN). In Fig. 5 C they agree at 30-35 pN and lie below the
    squares above that. The verdicts count only the reading intervals, not the SEM bars. The paper may
    mean "within SEM", and at some forces the bars do overlap. But in Fig. 5 A at 35-40 pN, and in
    Fig. 3 B at 37 pN, the SEM bars of circle and square do not overlap on the page.
  citation: {page: 5, quote: "serial bonds coincided with the Fc-GG-7 bond at a force"}
