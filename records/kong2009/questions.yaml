- id: q_s5_threshold_strict
  kind: reading
  about: [survival_first_order]
  text: >
    The survival plot is described with "lifetime >t" in the main text (p. 8, checked on the page
    image; again in Materials and methods, p. 9) but with "lifetime >= t" in the Fig. S5 caption (p. 14). The model uses >=, as in the caption.
    For a continuous lifetime the two give the same line, so this changes nothing unless the plots
    are read.
  citation: {page: 14, quote: "Natural log (number of measurements with a lifetime"}
- id: q_s5_tails_read
  kind: choice
  about: [survival_first_order, q_s5_not_read, q_s5_threshold_strict]
  text: >
    Fig. S5 is now read (second figure pass), but only in part: in each series the circles that stand
    clear of the other circles of their colour, mostly the long-lifetime tail (ln N below about 3), and a
    few tops of clusters. The dense stacks at short lifetimes, where single circles cannot be told apart,
    are not read. Every circle read lies at the ln of a whole number to within its reading interval,
    which checks the calibration and the circle finding. The reading cannot settle q_s5_threshold_strict:
    with ">= t" the circle at ln N = 0 sits at the longest lifetime, with "> t" at the second longest, and
