- id: q_no_model_fits
  kind: reading
  about: [lt_FN_a5b1Fc_CaMg, lt_FN_a5b1Fc_MgEGTA, lt_FN_a5b1Fc_Mn, lt_FN_ma5b1_MgEGTA]
  text: >
    The paper fits no bond-lifetime model to its data: it prints no equation, no fitted parameter and no
    model curve. Its results are the measured lifetime-versus-force curves themselves, and its models
    are stated in words (bonds in series; first-order dissociation in Fig. S5) to interpret them. The
    Bell model is named only as the assumption of earlier force-ramp analyses that "precluded catch
    bonds" (p. 5). So nothing in this record is a reproduction of a printed model result; the
    catch-bond curves are recorded as measurements, for models in other records to be validated against.
  citation: {page: 5, quote: "increasing force as modeled by Bell (1978), which"}
- id: q_series_model_not_run
  kind: choice
  about: [series_bonds]
  text: >
    The paper uses the series-bond rule (the chain breaks at the sum of the two dissociation rates) only
    qualitatively: to argue that above 30 pN in Mg2+/EGTA and Mn2+ the FN-a5b1 bond must outlive the
    Fc-GG-7 bond, and that in Ca2+/Mg2+ the true FN-a5b1 lifetimes differ more than Fig. 3 shows. It
    prints no number computed with it. The model is recorded and runnable, but not run: its inputs
    exist only as plotted curves (circles and squares at different forces), and the lifetime of the
    FN-a5b1 bond alone, which it would need, is never measured. The rule also assumes each bond
    dissociates at one first-order rate, which Fig. S5 suggests the FN-a5b1-Fc bond does not.
  citation: {page: 3, quote: "rate of two bonds in series equals to the sum of the two"}
- id: q_s5_not_read
  kind: choice
  about: [survival_first_order]
  text: >
    The first-order rule behind Fig. S5 (the negative slope of ln(number of events) versus t is an off
    rate) is recorded but not run. The paper prints no slope or off rate from these plots; it reads them
    only for their shape (several line segments for FN-a5b1-Fc, one line for a5b1-Fc-GG-7). Fig. S5 is
    left unread: its points are hundreds of overlapping coloured circles per panel, and no printed
    result rests on them.
  citation: {page: 8, quote: "The negative slope of a line reflects the off rate"}
- id: q_broken_axis_9
  kind: reading
  about: [fig3b_circles, fig3c_circles, lt_FN_a5b1Fc_MgEGTA, lt_FN_a5b1Fc_Mn]
  text: >
    In Figs. 3 B and C the y axis is broken; the label 9 sits at the break and its tick is merged with
    the break mark, so the lower segment is calibrated on the ticks 0, 3 and 6 only (they lie 557-558 px
    apart at 1200 dpi, equally spaced), and the upper segment on 16 and 24. Whether 9 belongs to the
    lower or the upper segment is not clear from the figure; no circle lies between 9 and 16, so no
    value depends on it, but the upper ends of the error bars near the peak (27.5 pN in B, 32.8 pN in
    C) reach into the break and are read on the lower segment.
- id: q_marker_centre
  kind: reading
  about: [fig3d_triangles, fig5a_triangles_line, fig5b_triangles_line, fig5c_triangles_line, fig6a_triangles_line, fig6b_triangles_line, fig6c_triangles_line]
  text: >
    Open triangles are read at their centroid, not at the centre of their bounding box (half an inradius
    higher). The joining lines meet at the centroid, and with it the triangles replotted in Figs. 5 and
    6 fall on the circles of Figs. 3 and 5 at the same forces to within about 0.01 s; with the bounding
    box centre they would sit about 0.09 s higher. The choice is labelled here because the replot
    comparisons themselves support it.
- id: q_hidden_error_bars
  kind: reading
  about: [lt_FN_a5b1Fc_CaMg, lt_FN_a5b1Fc_MgEGTA, lt_FN_a5b1Fc_Mn, lt_FN_tra5b1Fc_CaMg, lt_FN_tra5b1Fc_Mn, lt_FN_a5b1Fc_Mn_TS216, lt_FN_tra5b1Fc_Mn_TS216, lt_BSA_a5b1Fc_Mn]
  text: >
    Many SEM bars are shorter than the marker and hidden inside it (mostly at low and high force); their
    interval is reported as at most the marker, and a bar seen on one side only is mirrored. A few bars
    run into a neighbouring marker or under the grey Fc/GG-7 curve, and are read where they meet it;
    the reading notes say which. Where no cap is found at the end of a stem, the end's interval is
    widened by 60 px outward. One end is known to be read short: the lower bar of the Fig. 3 C circle at
    32.8 pN runs on under the grey error bar of a square to a cap near 6.4 s, of which only the left
    half shows; the code stops near 7.1 s (its widened interval reaches about 6.8 s).
- id: q_fig6_partial_replot
  kind: reading
  about: [replot_fig6c_of_fig5c, replot_fig6a_of_fig3c]
  text: >
    Fig. 6 C replots only "some of the data from Fig. 5 C": the triangles below about 7 pN are hidden
    under the circles of the antibody curve, and the comparison is made from 10 to 45 pN, where the
    replotted triangles are visible. In Fig. 6 A the lowest-force triangle is likewise hidden.
  citation: {page: 7, quote: "some of the data from Fig. 5 C are replotted"}
- id: q_replot_close
  kind: reading
  about: [cmp_fig5a_replot_vs_fig3a, cmp_fig5b_replot_vs_fig3b, cmp_fig5c_replot_vs_fig3c, cmp_fig6a_replot_vs_fig3c, cmp_fig6b_replot_vs_fig3c]
  text: >
    The replotted series agree with their originals at every force read (10-45 pN); the few points
    judged "close" rather than "reproduced" differ by 1-2 px, about 0.01-0.02 s. The verdict counts
    only the original's reading interval, not the replot's own (comparable) reading interval, so this is
    agreement within reading precision, not evidence that the replots differ.
- id: q_fcgg7_cations
  kind: unstated_input
  about: [lt_Fc_GG7]
  text: >
    The Fc-GG-7 control curve (squares) is drawn unchanged in all three cation panels of Figs. 3 and 5;
    the paper does not say in which cation condition it was measured, or whether it was pooled.
- id: q_overlap_artefacts
  kind: reading
  about: [fig3c_circles, fig5c_circles, fig5a_triangles_line]
  text: >
    In three panels a spot where several outlines overlap matches a marker's shape as well as a real
    marker does; the reading code excludes these small regions by name (see the comments in its files)
    after checking the overlays. The Fig. 3 C circles at 32.8 and 37.9 pN are partly covered by the grey
    squares drawn over them and are found with a lower outline threshold.

