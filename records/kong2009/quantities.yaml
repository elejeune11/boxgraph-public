- id: force_clamp
  name: clamped force on the molecular complex
  dimension: "[force]"
  description: The constant force at which the AFM feedback loop holds the cantilever until the complex dissociates; the x axis of the lifetime-versus-force plots.
- id: bond_lifetime_mean
  name: mean lifetime under constant force
  dimension: "[time]"
  description: Average lifetime of the bond, or of the serial chain of bonds, between cantilever tip and Petri dish at a clamped force, averaged within a force bin (Figs. 3-6, mean of the binned lifetimes).
- id: off_rate
  name: dissociation rate
  dimension: "1/[time]"
  description: First-order rate of dissociation of a bond (or of a subpopulation of dissociation events).
- id: lifetime_threshold
  name: lifetime threshold t
  dimension: "[time]"
  description: The time t in a plot of ln(number of events with lifetime >= t) versus t (Fig. S5).
- id: log_event_count
  name: natural log of the number of events
  dimension: dimensionless
  description: ln(number of measurements with a lifetime >= t), Fig. S5.
- id: divalent_cations
  name: divalent cation condition
  dimension: dimensionless
  description: "Condition label: the buffer's divalent cations (Ca2+/Mg2+, Mg2+/EGTA or Mn2+)."
- id: bond_complex
  name: molecules between tip and dish
  dimension: dimensionless
  description: "Condition label: which chain of molecules links the cantilever tip and the Petri dish (e.g. FNIII7-10/a5b1-Fc/GG-7)."
- id: adhesion_frequency
  name: adhesion frequency
  dimension: dimensionless
  description: Fraction of repeated tip-dish contacts that end in an adhesion (Fig. 2, Figs. S2 B-D, S4 B); each spot is enumerated over 100 contacts.
- id: running_adhesion_frequency
  name: running adhesion frequency
  dimension: dimensionless
  description: Number of adhesions divided by the number of contacts, both counted from the start of a series up to the latest contact (Fig. S4 A).
- id: repeat_number
  name: contact repeat number
  dimension: dimensionless
  description: The number of contacts made so far in a long series of repeated contacts (Fig. S4 A).
- id: elapsed_time
  name: time elapsed in an experiment
  dimension: "[time]"
  description: Time since the start of a typical experiment at which an adhesion frequency was measured (Fig. S4 B).
- id: bar_position
  name: position of a bar on a categorical axis
  dimension: dimensionless
  description: "A label, not a magnitude: the bar's place among the bars of one kind in a panel, numbered from 1 at the left; each figure reading's `what` says which condition each number is."
- id: rupture_force
  name: rupture force
  dimension: "[force]"
  description: Force at which a complex ruptures while the cantilever is retracted (Fig. S2 A, the x axis of the histograms).
- id: rupture_force_fraction
  name: fraction of rupture forces in a bin
  dimension: dimensionless
  description: Fraction of the rupture events whose rupture force falls in a 5-pN bin (Fig. S2 A).
- id: molecular_stiffness
  name: molecular stiffness
  dimension: "[force]/[length]"
  description: Force increase divided by molecular extension increase over the initial linear part of a force-extension curve (Fig. S3).
- id: lifetime_bin_average
  name: average lifetime of a lifetime bin
  dimension: "[time]"
  description: Average lifetime of the events grouped into one bin of the stiffness-versus-lifetime data (Fig. S3 C and p. 6).
- id: apc_fluorescence_intensity
  name: APC fluorescence intensity
  dimension: dimensionless
  description: Flow-cytometry fluorescence of allophycocyanin-conjugated 9EG7 bound to beads, in the cytometer's arbitrary units (Fig. S1, log x axis).
- id: event_fraction
  name: fraction of events in an intensity channel
  dimension: dimensionless
  description: Fraction of the counted beads whose fluorescence falls in one intensity channel of a flow-cytometry histogram (Fig. S1, y axis "Fraction").
- id: antibody_in_solution
  name: antibody added to the buffer
  dimension: dimensionless
  description: "Condition label: an activating mAb (TS2/16 or 12G10) at 10 ug/ml in the buffer, or none."
