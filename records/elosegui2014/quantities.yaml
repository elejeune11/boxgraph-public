- {id: true_binding_rate, name: true (solution) binding rate of integrin to FN, dimension: "[length]**3/[substance]/[time]", description: "kont, the second-order association rate constant fitted to SPR sensorgrams (1:1 Langmuir)"}
- {id: unbinding_rate, name: unbinding rate of integrin from FN, dimension: "1/[time]", description: "koff of a single integrin-FN bond"}
- {id: true_binding_rate_ratio, name: ratio of avb6 to a5b1 true binding rate, dimension: "dimensionless", description: "kont(avb6) / kont(a5b1)"}
- {id: unbinding_rate_ratio, name: ratio of avb6 to a5b1 unbinding rate, dimension: "dimensionless", description: "koff(avb6) / koff(a5b1); in the clutch model, the ratio of the scaling factors on the a5b1 koff/force curve"}
- {id: integrin_density_ratio, name: ratio of avb6 to a5b1 integrin density on the membrane, dimension: "dimensionless", description: "dint(avb6) / dint(a5b1) in myo b6 cells"}
- {id: effective_binding_rate_ratio, name: ratio of avb6 to a5b1 effective binding rate, dimension: "dimensionless", description: "kon(avb6) / kon(a5b1), with kon = kont * dint"}
- {id: catch_bond_optimal_force, name: force of maximum stability (minimum koff) of the FN-a5b1 catch bond, dimension: "[force]"}
- {id: substrate_stiffness, name: substrate Young's modulus, dimension: "[pressure]"}
- {id: cell_traction, name: average cell traction stress, dimension: "[pressure]"}
- {id: actin_flow_speed, name: actin rearward flow speed, dimension: "[length]/[time]"}
- {id: integrin_density_au, name: integrin density in adhesions (arbitrary units), dimension: "dimensionless"}
- {id: condition_index, name: position of a categorical condition along a figure's x axis, dimension: dimensionless, description: "1 for the first group read, 2 for the next, ...; what each index is is in the reading's `what` and the datum's note"}
- {id: time, name: time since the start of a recording, dimension: "[time]"}
- {id: spr_response, name: surface plasmon resonance response, dimension: dimensionless, description: "in resonance units (RU), proportional to the mass bound to the sensor surface"}
- {id: integrin_membrane_density, name: number of integrins per unit area of cell membrane, dimension: "1/[length]**2"}
- {id: bead_detachment_time, name: time for an FN-coated bead to detach from a cell under 0.5 nN, dimension: "[time]"}
- {id: integrin_recruitment, name: integrin recruitment to FN-coated beads (normalized), dimension: dimensionless}
