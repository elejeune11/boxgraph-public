- id: run_kont_ratio
  model: kont_ratio
  inputs: {kont1: kont_a5b1, kont2: kont_avb6}
  outputs: {r: kont_ratio_pred}
- id: run_koff_ratio
  model: koff_ratio
  inputs: {koff1: koff_a5b1, koff2: koff_avb6}
  outputs: {r: koff_ratio_spr}
- id: run_kon_eff_ratio
  model: kon_eff_ratio
  inputs: {kont1: kont_a5b1, kont2: kont_avb6, d_ratio: density_ratio_fivefold}
  outputs: {kon_ratio: kon_ratio_pred}
