id: kon_eff_ratio
name: effective binding rate kon = kont * dint, as a ratio between avb6 and a5b1
role: model
stated: {page: 2, printed_page: "632", quote: "defining an effective binding rate kon as kon", where: "text; Fig. 3a"}
equation: "kon = kont · dint  (applied to each integrin type: kon2/kon1 = (kont2/kont1) * (dint2/dint1))"
inputs:
  kont1: {quantity: true_binding_rate, unit: M^-1*s^-1, description: "kont of a5b1"}
  kont2: {quantity: true_binding_rate, unit: M^-1*s^-1, description: "kont of avb6"}
  d_ratio: {quantity: integrin_density_ratio, unit: dimensionless, description: "dint(avb6) / dint(a5b1)"}
outputs:
  kon_ratio: {quantity: effective_binding_rate_ratio, unit: dimensionless}
settings: {}
stochastic: false
