- id: q_fig34_x_labels
  kind: reading
  about: [traction_model_fig3c, density_model_fig3d, flow_model_fig3e, density_onset_a5b1_pred]
  text: >
    (Figure reading.) The x axes of Figs. 3c-e and 4d-i have no tick marks, and the printed labels 0.1, 1,
    10, 100 do not lie on one log scale: in Fig. 3 their centres miss the best log fit by about 59 px at
    1200 dpi (about 0.1 decade), with '1' and '10' set at the two dashed regime lines; in Fig. 4d-i the '1'
    and '10' labels sit left of the dashed lines. In Fig. 4j-l, whose axis has ticks at 0.1 and 100, the
    dashed lines fall (by eye) where 1 and 10 kPa lie on that scale, and the measured circles sit at the
    gel stiffnesses of Fig. 1a. The readings of Fig. 4 therefore name each circle by its gel (in order) and
    read the model lines at the circles' columns; the Fig. 3 readings use the label centres and widen their
    intervals by twice the misfit. Where exactly the model's regimes change (in kPa) cannot be read more
    precisely than this.
  citation: {page: 4, printed_page: "634", quote: "The three regimes (separated by dashed lines) are", where: "Fig. 3c-e"}
- id: q_fig4_onset_below_14kPa
  kind: reading
  about: [density_onset_a5b1_pred, density_a5b1_model_fig4f, density_model_fig3d]
  text: >
    (Figure reading.) Bears on q_fig3d_onset_vs_14kPa. Read at the plotted 5 and 14 kPa circles, the a5b1
    model line of Fig. 4f (density_a5b1_model_fig4f) is near 1 at 5 kPa and already about 4 at 14 kPa,
    close to the measured 14 kPa circles; the Fig. 3d curve (density_model_fig3d) likewise has risen well
    above 1 by 14 kPa. So in the figures the model's sharp rise starts between the 5 and 14 kPa gels, at
    the second dashed line, not at 14 kPa; the text's '14 kPa' reads as the first gel above the onset.
  citation: {page: 6, printed_page: "636", quote: "14 kPa for α5 β1 , and 29 kPa for αv β6", where: "text; Fig. 4f"}
