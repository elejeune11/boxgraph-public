- id: q_fig3a_dint_label
  kind: possible_error
  about: [kon_eff_ratio, integrin_clutch_sim]
  text: >
    (Audit.) In the Fig. 3a drawing the PDF text layer gives the two labels as 'kon1 = kont1·dint2' and
    'kon2 = kont2·dint2': both use dint2. The caption ('true binding rates (kont1, kont2) multiplied by integrin
    densities on the membrane (dint1, dint2)') and p. 2 ('kon = kont · dint') pair each kont with its own
    density, so the kon1 label reads as a misprint of dint1. The page image at the available resolution is too
    small to confirm the subscript by eye (PDF rendering commands were refused in the audit session too). The
    record's kon_eff_ratio follows the caption and the p. 2 text, not the label.
  citation: {page: 4, printed_page: "634", quote: "multiplied by integrin densities on the membrane", where: "Fig. 3a and caption"}
- id: q_fig3d_onset_vs_14kPa
  kind: reading
  about: [density_onset_a5b1_pred]
  text: >
    (Audit.) density_onset_a5b1_pred cites Fig. 3d for the a5b1 onset at 14 kPa. By eye (no verdict), the
    model curve of Fig. 3d starts its sharp rise at the second dashed regime boundary, which sits close to the
    10 kPa tick, not at 14 kPa. The 14 kPa of the text is also the stiffness of a gel used (Fig. 4c), so the
    printed '14 kPa' may be the first gel above a model onset nearer 10 kPa rather than the model's own onset.
    A figure reading of Fig. 3d (and of the model lines in Fig. 4f,i) would settle where the model puts it.
  citation: {page: 4, printed_page: "634", quote: "integrin densities (d), and actin speeds (e) predicted by the model", where: "Fig. 3d"}
- id: q_fig2a_koff_timescale
  kind: reading
  about: [koff_a5b1, koff_avb6, spr_a5b1_264nM, spr_avb6_264nM]
  text: >
    (Figure reading.) Bears on q_koff_column_multiplier. In the dissociation phase of Fig. 2a (after the
    injection ends near 90 s), the bold curves read in spr_a5b1_264nM and spr_avb6_264nM fall over tens of
    seconds: by about a fifth for a5b1 and by more than half for avb6 between 100 and 130 s. A 1:1
    dissociation at koff = 49.44 or 1506 s^-1 (the header read literally) would empty the surface within a
    fraction of a second, so the plotted curves are not what those values describe; their decay is of the
    order of 1e-2 s^-1 (a5b1) and a few 1e-2 s^-1 (avb6), closer to the koff column read as value x 10^-2
    (4.944e-3 and 0.1506 s^-1). This is a reading of the figure, not a fit: the paper's fit also has an
    association phase and may include mass transport.
  citation: {page: 3, printed_page: "633", quote: "Data for 264 nM are marked in bold in both cases", where: "Fig. 2a"}
- id: q_fig2a_two_bold
  kind: reading
  about: [spr_avb6_264nM]
  text: >
    (Figure reading.) The caption says the 264 nM data are bold 'in both cases', but Fig. 2a has two bold
