- id: cmp_kont_half
  purpose: reproduction
  computed: kont_ratio_pred
  printed: kont_ratio_half
  note: "the paper's 'kont decreased by only half' against the ratio of its own printed kont values"
- id: cmp_kon_fivefold
  purpose: consistency
  computed: kon_ratio_pred
  printed: kon_fold_model
  conditions_ok: >
    The paper sets the clutch model's kon ratio (fivefold) as 'matching thus the trends in bond dynamics
    between a5b1 and avb6 measured in Fig. 2'; the measured counterpart it gives is kon = kont * dint with the
    SPR kont (Fig. 2a) and the fivefold density ratio (Fig. 2b), so the two are the same ratio by the paper's
    own account, though one is a model setting and the other comes from measurements.
- id: cmp_koff_threefold
  purpose: consistency
  computed: koff_ratio_spr
  printed: koff_fold_model
  conditions_ok: >
    The paper sets the clutch model's koff ratio (threefold) as matching the trends in bond dynamics measured in
    Fig. 2, whose koff values are those of the SPR table. The SPR koff is for purified integrins at zero force in
    Mn2+ buffer; the model's factor scales a whole koff/force curve. Compared because the paper itself ties them.

