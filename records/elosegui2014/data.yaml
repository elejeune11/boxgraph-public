# ==== surface plasmon resonance: fitted rates of purified integrins to FN7-10 (Fig. 2a table) ====
# The table heads its columns "Kont (M-1 s-1 x 10^5)" and "Koff (s-1 x 10^2)". Both are entered with the
# header's multiplier read the same way (value x 10^n in the stated unit); see q_koff_column_multiplier.
# Every comparison in this record uses only ratios within one column, so the multiplier cancels.
- id: kont_a5b1
  quantity: true_binding_rate
  unit: M^-1*s^-1
  origin: fitted
  printed: "7.724 x 10^5"
  citation: {page: 3, printed_page: "633", quote: "Integrin Kont (M−1 s−1 × 105) Koff (s−1 × 102)", where: "Fig. 2a table, row a5b1"}
  note: "printed as 7.724 in a column headed (M^-1 s^-1 x 10^5); fitted with a 1:1 Langmuir binding model (p. 6)"
- id: kont_avb6
  quantity: true_binding_rate
  unit: M^-1*s^-1
  origin: fitted
  printed: "3.893 x 10^5"
  citation: {page: 3, printed_page: "633", quote: "Integrin Kont (M−1 s−1 × 105) Koff (s−1 × 102)", where: "Fig. 2a table, row avb6"}
  note: "printed as 3.893 in a column headed (M^-1 s^-1 x 10^5)"
- id: koff_a5b1
  quantity: unbinding_rate
  unit: 1/s
  origin: fitted
  printed: "0.4944 x 10^2"
  citation: {page: 3, printed_page: "633", quote: "Integrin Kont (M−1 s−1 × 105) Koff (s−1 × 102)", where: "Fig. 2a table, row a5b1"}
  note: "printed as 0.4944 in a column headed (s^-1 x 10^2)"
- id: koff_avb6
  quantity: unbinding_rate
  unit: 1/s
  origin: fitted
  printed: "15.06 x 10^2"
  citation: {page: 3, printed_page: "633", quote: "Integrin Kont (M−1 s−1 × 105) Koff (s−1 × 102)", where: "Fig. 2a table, row avb6"}
  note: "printed as 15.06 in a column headed (s^-1 x 10^2)"

# ==== arithmetic the paper states on those values (p. 2) =========================================
- id: kont_ratio_half
  quantity: true_binding_rate_ratio
  unit: dimensionless
  origin: derived
  printed: "0.5"
  citation: {page: 2, printed_page: "632", quote: "by only half, kon in myo β6 cells was thus predicted", where: text}
  note: "'As kont decreased by only half': kont(avb6) is half of kont(a5b1)"
- id: density_ratio_fivefold
  quantity: integrin_density_ratio
  unit: dimensionless
  origin: measured
  printed: "5"
  citation: {page: 2, printed_page: "632", quote: "integrin densities, which were fivefold higher for αv β6", where: "text; Fig. 2b"}
  conditions: {}
  note: "'fivefold higher for avb6 than for a5b1 (Fig. 2b and Supplementary Fig. 5)', in myo b6 cells"

# ==== the clutch model's parameter changes from a5b1 to avb6 (p. 6) ==============================
- id: kon_fold_model
  quantity: effective_binding_rate_ratio
  unit: dimensionless
  origin: reported
  printed: "5"
  citation: {page: 6, printed_page: "636", quote: "increasing only kon (fivefold) and", where: text}
  note: "the avb6 model differs from the a5b1 model only by kon x5 and koff x3, 'matching thus the trends in bond dynamics between a5b1 and avb6 measured in Fig. 2'"
- id: koff_fold_model
  quantity: unbinding_rate_ratio
  unit: dimensionless
  origin: reported
  printed: "3"
  citation: {page: 6, printed_page: "636", quote: "koff (threefold), matching thus the trends in bond dynamics", where: text}
  note: "a factor on the scaling of the FN-a5b1 koff/force catch-bond curve (p. 4)"
- id: catch_bond_min_force
  quantity: catch_bond_optimal_force
  unit: pN
  origin: reported
  printed: "~30"
  citation: {page: 4, printed_page: "634", quote: "force of about 30 pN. To allow for possible differences", where: text}
  from_source: kong2009
  note: "'presenting a maximum stability (minimum koff) at a force of about 30 pN', from the FN-a5b1 single-molecule measurements of ref. 12"

