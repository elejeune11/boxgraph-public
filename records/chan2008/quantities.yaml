- {id: n_motors, name: total number of myosin motors in the filopodium, dimension: dimensionless}
- {id: motor_stall_force, name: stall force of a single myosin motor, dimension: "[force]", description: "F^m; printed negative (retrograde direction is negative x)"}
- {id: unloaded_motor_velocity, name: unloaded myosin motor sliding velocity, dimension: "[length]/[time]", description: "vu; printed negative"}
- {id: n_clutches, name: total number of molecular clutches, dimension: dimensionless}
- {id: clutch_on_rate, name: pseudo first-order on-rate constant of clutch binding to F-actin, dimension: "1/[time]"}
- {id: clutch_off_rate_unloaded, name: unloaded off-rate constant of clutch dissociation from F-actin, dimension: "1/[time]"}
- {id: bond_rupture_force, name: characteristic clutch/F-actin bond rupture force, dimension: "[force]", description: "Fb in Eq. 1; printed negative"}
- {id: clutch_stiffness, name: spring constant of one molecular clutch, dimension: "[force]/[length]"}
- {id: substrate_stiffness, name: spring constant of the compliant substrate, dimension: "[force]/[length]", description: "κsub"}
- {id: substrate_modulus, name: Young's modulus of the polyacrylamide gel substrate, dimension: "[mass]/[length]/[time]**2"}
- {id: poisson_ratio, name: Poisson ratio of the hydrogel, dimension: dimensionless}
- {id: contact_bead_distance, name: distance from the filopodial point force to the reporter bead, dimension: "[length]", description: "δ in Eqs. 10-12"}
- {id: ksub_length_scale, name: the length multiplying πE/(1+υ) in Eq. 13 to give κsub, dimension: "[length]", description: "δ as printed in Eq. 13, or the fitted Δ the paper introduces to correct it"}
- {id: bead_displacement, name: displacement of a substrate marker bead, dimension: "[length]", description: "U, U1, U2 in Eqs. 10-12 (called strain in the text)"}
- {id: bead_separation, name: distance between two marker beads along a filopodium, dimension: "[length]"}
- {id: retrograde_flow_rate, name: mean F-actin retrograde flow rate in a filopodium, dimension: "[length]/[time]", description: "as a positive rate in the retrograde direction"}
- {id: mean_traction_force, name: time-averaged traction force a filopodium exerts on the substrate, dimension: "[force]"}
- {id: peak_filopodial_force, name: maximal traction force exerted by one filopodium, dimension: "[force]", description: "T at maximal bead displacement (Fig. S10); in the model, the largest κsub xsub reached"}
- {id: synthetic_feature_velocity, name: velocity of an F-actin feature in a synthetic kymograph, dimension: "[length]/[time]", description: "Fig. S12 validation of the flow-tracking algorithm"}
- {id: clutch_tension, name: tension in one engaged clutch, dimension: "[force]", description: "Fclutch in Eqs. 1-2; negative in the model's sign convention"}
- {id: clutch_off_rate_loaded, name: effective off-rate of an engaged clutch under tension, dimension: "1/[time]", description: "koff* in Eq. 1"}
# added in the second figure pass (2026-10-31)
- {id: flow_rate_bin_frequency, name: fraction of filopodia whose retrograde flow rate falls in one histogram bin, dimension: dimensionless, description: "Fig. 3C; bins 10 nm/s wide, labelled by the upper edge (Excel)"}
- {id: displacement_bin_frequency, name: fraction of bead displacements falling in one histogram bin, dimension: dimensionless, description: "Fig. 4D (5 nm bins), Fig. S5 (normalized step size bins)"}
- {id: normalized_step_size, name: single time-increment bead displacement divided by the trace's maximal displacement, dimension: dimensionless, description: "Fig. S4, S5 (SOM p. 14); positive steps are failures"}
- {id: step_count, name: number of a bead's single time increments falling in one step-size bin, dimension: dimensionless, description: "Fig. S4 histograms (Frequency axis, counts)"}
- {id: failure_frequency, name: rate of coupling-failure events of a filopodial marker bead, dimension: "1/[time]", description: "Fig. S5D (failures/s)"}
- {id: bead_radial_deviation, name: radial deviation of a reference bead from its mean position, dimension: "[length]", description: "Fig. S11D, normalized as the paper describes (nm)"}
- {id: radial_deviation_frequency, name: histogram height of reference-bead radial deviations as plotted, dimension: dimensionless, description: "Fig. S11D; the axis says only Frequency"}
- {id: tracking_pixel_shift, name: trial shift in the windowed cross-correlation of a synthetic kymograph, dimension: dimensionless, description: "Fig. S12E (pixels)"}
- {id: cross_correlation_coefficient, name: correlation coefficient of the windowed cross-correlation, dimension: dimensionless, description: "Fig. S12E"}
- {id: scaled_surface_tension, name: "scaled surface tension: stored substrate energy per cell area", dimension: dimensionless, description: "Fig. 4E; sum of squared bead strains (pixels^2) over the cell's area (pixels^2), SOM p. 10-11"}
