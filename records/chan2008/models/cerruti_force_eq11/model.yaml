id: cerruti_force_eq11
name: filopodial point force and force-to-bead distance from two marker beads (Eqs. 11-12)
role: model
stated: {page: 24, printed_page: "SOM p. 17", quote: "In this case, the force can be estimated independent of δ as", where: "Eqs. 11-12"}
equation: "T = πE/(1+υ) (U1 U2 L / (U1 - U2)) (Eq. 11); δ = U2 L / (U1 - U2) (Eq. 12)"
inputs:
  E:  {quantity: substrate_modulus, unit: Pa}
  nu: {quantity: poisson_ratio, unit: dimensionless}
  U1: {quantity: bead_displacement, unit: nm}
  U2: {quantity: bead_displacement, unit: nm}
  L:  {quantity: bead_separation, unit: nm}
outputs:
  T:     {quantity: peak_filopodial_force, unit: pN}
  delta: {quantity: contact_bead_distance, unit: nm}
