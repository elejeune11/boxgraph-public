notes: >
  JSTOR download. PDF p. 1 is a JSTOR cover. The top of p. 2 ends an unrelated article (Dazl/meiosis),
  and the Report begins lower on p. 2 and ends on p. 6. The rest of p. 6 starts another unrelated
  article (dynein). The SOM is PDF pp. 7-61, with its own page labels "Page 1"-"Page 54" from PDF p. 8.
  PDF p. 7 is the SOM cover.
  In scope is the quantitative core: the stochastic motor-clutch model (SOM Eqs. 1-5,
  model motor_clutch), its parameters (Table S1), and the conversion of gel modulus to substrate
  spring constant by the Cerruti solution (Eq. 13, model ksub_eq13). These are combined in
  motor_clutch_E for the predictions plotted against modulus in kPa. Eqs. 11-12 (cerruti_force_eq11)
  are recorded but never run because their per-trace inputs are not printed.
  The model's printed predictions exist only as figures (Fig. 1C-D, 3D, S1). Values were read off
  the page images at decade ticks and recorded as approximate (no verdict), so those reproduction
  comparisons keep differences only. Comparisons with verdicts are validations against measured
  values printed with SEMs: the Fig. 3C mean retrograde flow on 260 Pa and 57 kPa gels, and the
  Fig. S10 maximal filopodial force (to which nm was tuned). There is also the Fig. S12 tracking-algorithm
  table, checked as a consistency.
  Main finding (q_dt_dependence): at the paper's 5 ms step the model reproduces the plotted curves
  and the Fig. 3C means. Refining dt moves the soft-substrate flow from about 76 to about 45 nm/s
  (260 Pa), so those predictions belong to the numerics. At 10 ms, also printed, load-and-fail
  disappears. Runs at a settled step (0.625 ms) are recorded beside the paper's setting.
  The main readings that matter are listed as questions. The time step is printed as 5-10 ms, 5 ms and
  10 ms; the record uses 5 ms. How the fit parameter Δ = 277 nm enters Eq. 13 is unstated; it is run as Δ,
  δ + Δ and δ. Stepping details and the statistics window are unstated.
  Left out: the Hertz indentation analysis (Eqs. 7-8; per-gel R, r, f not printed), the stored-energy /
  surface-tension estimate (Eq. 9) and the threefold surface-tension result (Fig. 4E). Also left out:
  experimental p-values, counts and gel moduli that feed no model; Eq. 6 (vedge; vpoly not in Table S1);
  the altered parameter set of Movie S1; the approximate cycle period "~10 to 100 s" and the "~1 kPa"
  transition. The traction-force curve of Fig. 1D is left out too; its axis could not be read reliably
  at page-image resolution. Fig. 3D's simulation curve is left out in favour of the Fig. 3C means, which
  carry SEMs.
  The simulation seed (1) and the averaging over the whole 300 s run are the reader's choices.
  Figure reading (2026-10-31, claude-opus-5-5): the plotted results were read again with
  calibrated figure readings (figures.yaml, figures.md). These are Fig. 1D flow and traction
  (the traction curve could be read at 300 dpi after all), the Fig. 3D simulation and its six
  experiment markers (the curve the audit asked for, q_fig3d_not_compared), and the Fig. S1A-C
  curves. Each has a datum, a sweep run and a comparison with a verdict. The eye-read data and
  their comparisons are kept. The readings show that Fig. 1D, S1A and 3D plot one curve with
  κsub [pN/nm] = E [kPa] in number (q_fig_same_curve), which bears on how Δ enters Eq. 13.
  Second figure pass (2026-10-31, claude-opus-5-5): readings by the record's own code (figures/*.py,
