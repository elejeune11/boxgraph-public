# The SSA has no time step; its numerical settings are the simulated time and, for the optimum,
# the κsub grid. None is printed (q_sim_length, q_optimum_search).
- {id: ref_t_fig2_nc50, run: run_fig2_nc50, setting: t_total, factors: [1, 2, 4], mode: multiply, output: v_retro,
   tolerance: "3%", tolerance_basis: "added: well inside the precision of reading Fig. 2C by eye (a few nm/s of ~75-110 nm/s)", tolerance_added: true}
- {id: ref_t_fig7a_minus_clutch, run: run_fig7a_minus_clutch, setting: t_total, factors: [1, 2, 4], mode: multiply, output: F_mean,
   tolerance: "5%", tolerance_basis: "added: well inside the precision of reading the Fig. 7A bar heights by eye (about 20-50 pN)", tolerance_added: true}
- {id: ref_grid_opt_base, run: run_opt_base, setting: per_decade, factors: [1, 2], mode: multiply, output: ks_opt,
   tolerance: "15%", tolerance_basis: "added: a 15% change in κs,opt moves log10 κs,opt by 0.06, under the 0.05-wide last digit of S over the 1.2-decade fold range", tolerance_added: true}
