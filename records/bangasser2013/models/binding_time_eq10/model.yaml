id: binding_time_eq10
name: ensemble clutch binding time (Eq. 10)
role: model
stated: {page: 8, printed_page: "588", quote: "can be calculated analytically", where: "Eq. 10"}
equation: "tbinding = sum_{i=0}^{nc-1} 1/(kon (nc - i))"
inputs:
  nc:  {quantity: n_clutches, unit: dimensionless}
  kon: {quantity: clutch_on_rate, unit: 1/s}
outputs:
  tbinding: {quantity: ensemble_binding_time, unit: s}
