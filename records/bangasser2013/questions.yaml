- id: q_fig5_full_reading
  kind: reading
  about: [S_Fm_nc_5a, R_vu_kon_5b, SR_Fb_kon_5c, SR_koff_Fm_5c, SR_koff_nm_5c, R_kon_Fb_5b, R_kon_nc_5b]
  text: >-
    The audit entered every Fig. 5A-C cell (51 more pairs and the diagonals), read from the 110 dpi
    page image of p. 6 because the figure tools could not be run in the audit either. The digits
    are legible and the three tables agree with each other and with Fig. S2 to the last digit in
    almost every cell, which supports the reading; but a one-unit misreading of a last digit (e.g.
