- id: q_tbinding_calibrated
  kind: unexplained_difference
  about: [tbinding_fig6d_read, run_tbinding_fig6d_read, cmp_tbinding_fig6d_read, q_tbinding]
  text: >-
    The calibrated reading settles the reading side of q_tbinding: the dashed 'Binding Time' line of
    Fig. 6D lies at 6.4 s (95% interval about 5.7 to 7.1 s, from the right-axis ticks 0-70 s and the
    line's thickness), between the first reader's 7 s and the auditor's 5.8 s by eye. Eq. 10 with the
    base set (nc = 50, kon = 0.3 /s) gives H_50/kon = 15.0 s, 2.3 times the plotted value, so the
    difference is not a reading error. The plotted line is near Eq. 10 with kon = 0.7 /s, or with
    nc = 75 and kon = 1 /s (Chan and Odde's set, 4.9 s); which set Fig. 6 uses is not stated.
  citation: {page: 7, printed_page: "587", quote: "The optimal stiffness occurs when the clutch", where: "Fig. 6D, red dashed line"}

