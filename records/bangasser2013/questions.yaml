  kind: reading
  about: [v_fig3a_Fb_x01, v_fig3a_Fb_x3, v_fig3a_Fm_x01, v_fig3a_nm_x01, v_fig3a_kc_x03, v_fig3a_kc_x1, v_fig3a_kc_x3]
