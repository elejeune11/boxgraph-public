  citation: {page: 14, quote: "Determine event times based on clutch on- and off-rates (see Eq. 2)", where: "Supporting Material, step 2"}

- id: q_measured_points_not_read
  kind: reading
  about: [tau_fig7c, v_figS1a_present]
  text: >-
    Audit disagreement with the scope (not changed): two panels plot measured points with error
    bars that the record does not enter: Fig. 7C left (Kong et al.'s integrin lifetimes, to which
    the catch-slip model of Eq. 9 was fitted) and Fig. S1B (Chan and Odde's neuron flow rates, to
    which the new base set was fitted). The guide asks for every plotted measurement; Eq. 9 with the
    Table S1 fit could be validated against the Fig. 7C points directly (no unit conversion is
    needed there). Both are data from other papers re-plotted here, which is presumably why the first
    reader left them out; reading them needs the figure tools.
  citation: {page: 8, printed_page: "588", quote: "A catch-slip bond model was fit to integrin catch bond data", where: "Fig. 7C left; Fig. S1B (p. 20)"}

