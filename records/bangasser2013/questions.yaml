  citation: {page: 16, quote: "is similar to an increase in k on in that", where: "Supporting Material, Clutch unloaded off-rate"}

- id: q_sm_equation_number
  kind: possible_error
  about: [motor_clutch_ssa]
  text: >-
    Step 2 of the Supporting Material algorithm determines event times '(see Eq. 2)'; the event-time
