- id: q_opposite_direction_convention
  kind: reading
  about: [S_Fm_nc_5a, S_nm_nc_5a, cup_Fm_nc, clo_Fm_nc, cup_nm_nc, clo_nm_nc]
  text: >-
    Below the diagonal (opposite directions, Eqs. 7-8) the paper does not say which parameter of a
    pair is multiplied by c and which is divided. Rows Fm and nm are otherwise nearly identical in
    Figs. 5A and S2, but in column nc they differ: Fm-nc has S = -1.6 with limits 2.7 / 0.67, while
    nm-nc has S = +1.6 with limits 1.5 / 0.37, i.e. the reciprocal limits and the opposite sign of S.
    This is what one gets if c multiplies nc in one cell and Fm (or nm) in the other, so the
    convention seems not to be the same in every cell. R and SR are unaffected in size, but the
    sign of S and SR below the diagonal cannot be interpreted without the convention.
  citation: {page: 3, printed_page: "583", quote: "base value of one parameter was multiplied by the constant c", where: "Eqs. 7-8; Fig. 5A and Fig. S2, row Fm and row nm, column nc"}

- id: q_kc_rounding
  kind: unexplained_difference
  about: [S_kc_3b, SR_kc_3b, S_kc_5a, SR_kc_5c, cns_S_kc_5a, cns_SR_kc_5c]
  text: >-
    For κc alone, Fig. 3B prints S = 0.0 and SR = 0.0, while the same single-parameter cells of
    Fig. 5A and 5C print -0.02 and -0.05. -0.05 lies exactly on the edge of what 0.0 allows at one
    decimal (cns_SR_kc_5c passes only at that boundary), and S x R = -0.02 x 3.0 = -0.06, not the
    -0.05 of Fig. 5C. Probably unrounded values underlie all three; not a sign of an error.

- id: q_sr_pair_rounding
  kind: unexplained_difference
  about: [cmp_SR_Fb_kon, cmp_SR_kc_Fm, cmp_SR_kc_nm, cmp_SR_koff_Fm, cmp_SR_kon_kc, cmp_SR_kc_kon, cmp_SR_Fm_kc, cmp_SR_nm_kc, cmp_SR_koff_kc]
  text: >-
    Across Fig. 5, S x R of the printed S (5A) and R (5B) misses the printed SR (5C) in four cells
    by more than one unit of its last digit: Fb-kon (0.05 x 4.4 = 0.22 vs 0.20), koff-Fm
    (-0.05 x 4.4 = -0.22 vs -0.20), κc-Fm and κc-nm (-0.61 x 1.2 = -0.73 vs -0.75), and in about a
    dozen more by up to one unit. Every miss goes away with less-rounded inputs: S = 0.045 (still
    printed 0.05) gives 0.20 and -0.20, and R from the Fig. S2 limits (1.24 for κc-Fm) gives
    -0.76. So SR was computed from unrounded S and R; the printed tables cannot be reproduced
    from each other exactly where S has one significant digit or R has two. The R values of
    Fig. 5B agree with the Fig. S2 limits in every cell (eight only 'close', e.g. vu-kon 0.669 vs 0.66).

