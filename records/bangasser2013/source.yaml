notes: >
  PDF pp. 1-12 are the article (pp. 581-592); pp. 13-21 are the Supporting Material (algorithm,
  per-parameter discussion, Table S1 on p. 17, legends, references, Fig. S1 on p. 20, Fig. S2 on
  p. 21), which carry no printed page labels.
  In scope is the quantitative core. (1) The stochastic motor-clutch model, simulated by the
  Gillespie SSA as the Supporting Material describes it (motor_clutch_ssa). The slip-bond off-rate,
  force balance and force-velocity law are Chan and Odde's (ref. 15), named but not written here.
  It runs on the base set (Table 1), the Table S1 sets (Fig. 7A) and Chan and Odde's set (Fig. S1C).
  (2) The optimal stiffness and the sensitivity S (Eq. 3), recomputed by simulation for kon only.
  (3) The stall and free-flowing limits of nc by the paper's 5% definitions (nc_limits).
  (4) Eq. 2 (R), Eq. 4 (SR), Eq. 5, Eq. 9 (catch-slip lifetime) and Eq. 10 (binding time).
  Checks with verdicts: R from the Fig. S2 multiplier limits against Fig. 3B and Fig. 5B (13
  reproduced), SR = S x R against Fig. 3B and Fig. 5C (9 reproduced, 4 close by last-digit rounding,
  q_sr_rounding). Also the simulated S for kon against the printed 1.4 (reproduced), the simulated
  nc limits against the text's 110 and six (reproduced), and the S values of the text against
  Figs. 3B and 5A (consistent).
  The model's other printed results are only plotted. The figure tools (high-resolution rendering,
  calibrated code readings) were refused by this session's permission mode, so those values were read
  by eye from the 110 dpi page images and carry no verdict (q_eye_readings, figures.md). The
  simulations match them closely: Figs. 2B-C, S1A, 6B, 6D cycle time and 7A.
  Finding: Eq. 10 with the base set gives a binding time about twice the dashed line of Fig. 6D
  (q_tbinding), the line on which the paper's explanation of the optimum rests. Two smaller printed
  slips: the right axis of Fig. 6B is labelled nm/s for a spring constant, and the text lists nc
  among the motor parameters.
  Reader's choices (no printed values): the simulated time (1000 s; 100 s for the 2000-clutch
  runs), averaging over the whole run, 5 seeds, the κsub grid and parabola for the optimum, and the
  definition of a load-and-fail cycle. The simulated time and the grid are refined and settle within
  the declared tolerances; the nc_limits search is not refined (about 50 s per seed).
  Left out: Fig. 1 (other papers' data), Fig. 3A, Fig. 4, Fig. 5D, Fig. 7B (clutch-length
  histograms), Fig. 7C right (catch-slip motor-clutch curves; that variant was not built), Kong et
  al.'s lifetimes in Fig. 7C, and Fig. S1B (needs a modulus-to-stiffness conversion this paper does
  not give). The S values other than kon's, and the Fig. S2 limits other than nc's, are recorded
  but not re-simulated: each needs a search over many simulations. The validator lists them as never
  compared. Also left out: the cell-migration and traction ranges quoted from other studies in the
  Introduction and Discussion, which feed no model.
