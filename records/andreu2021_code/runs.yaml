# ---- 'loading rate script.m': the port against entries of the shipped kofflr.mat ------------------
- id: run_kint_L1
  model: lr_rate_port
  inputs: {L: L_first_code, koff_a: mn_a_code, koff_b: mn_b_code, koff_c: mn_c_code, koff_d: mn_d_code,
           ln_kunf0: ln_kunf0_lr_code, kunf_b: kunf_b_lr_code, pt: pt_lr_code}
  sweep: {Fb: kint_mat_L1}
  outputs: {k_off: kint_L1_port}
  note: "the script as written (cut-off 1e-70, line 44)"
- id: run_kint_L1_cut100
  model: lr_rate_port
  inputs: {L: L_first_code, koff_a: mn_a_code, koff_b: mn_b_code, koff_c: mn_c_code, koff_d: mn_d_code,
           ln_kunf0: ln_kunf0_lr_code, kunf_b: kunf_b_lr_code, pt: pt_lr_code}
  sweep: {Fb: kint_mat_L1}
  settings: {p_floor: 1.0e-100}
  outputs: {k_off: kint_L1_port_cut100}
  note: "cut-off 1e-100 instead of line 44's 1e-70 (q_table_cutoff)"
- id: run_kunf_L1
  model: lr_rate_port
  inputs: {L: L_first_code, koff_a: mn_a_code, koff_b: mn_b_code, koff_c: mn_c_code, koff_d: mn_d_code,
           ln_kunf0: ln_kunf0_lr_code, kunf_b: kunf_b_lr_code, pt: pt_lr_code}
  sweep: {Fb: kunf_mat_L1}
  outputs: {k_unf: kunf_L1_port_written}
  note: "the script as written (cut-off 1e-70, line 44)"
- id: run_kunf_L1_cut100
  model: lr_rate_port
  inputs: {L: L_first_code, koff_a: mn_a_code, koff_b: mn_b_code, koff_c: mn_c_code, koff_d: mn_d_code,
           ln_kunf0: ln_kunf0_lr_code, kunf_b: kunf_b_lr_code, pt: pt_lr_code}
  sweep: {Fb: kunf_mat_L1}
  settings: {p_floor: 1.0e-100}
  outputs: {k_unf: kunf_L1_port_cut100}
  note: "cut-off 1e-100 instead of line 44's 1e-70 (q_table_cutoff)"
- id: run_kint_F0
  model: lr_rate_port
  inputs: {Fb: fstart_first_code, koff_a: mn_a_code, koff_b: mn_b_code, koff_c: mn_c_code, koff_d: mn_d_code,
           ln_kunf0: ln_kunf0_lr_code, kunf_b: kunf_b_lr_code, pt: pt_lr_code}
  sweep: {L: kint_mat_F0}
  outputs: {k_off: kint_F0_port}

# ---- stretchscriptg.m: the four stretch cases, at the frequencies of the paper's Fig. 2e lines ------
- id: run_2p5
