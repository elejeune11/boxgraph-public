           koff_a: mn_a_code, koff_b: mn_b_code, koff_c: mn_c_code, koff_d: mn_d_code,
           pt_table: pt_lr_code, ln_kunf0_table: ln_kunf0_lr_code, kunf_b_table: kunf_b_lr_code,
