# The code plots its model output on the YAP axis only (stretchscriptg.m lines 54, 62). The paper's Fig. 2e
# draws the same lines on twin axes, YAP (Nuc/Cyt) and adhesion length (µm); to compare the code's output
# with the lines as read on the adhesion-length axis, the record carries it across those twin axes.
- id: yap_at_zero_length_added
  quantity: yap_axis_at_zero_length
  unit: dimensionless
  printed: "1.0"
  basis: >-
    The twin axes of Fig. 2e (paper PDF p. 4) as read in the paper's record (andreu2021, added len0 and
    len_scale): the YAP axis from 1.0 to 2.0 spans the adhesion-length axis from 0 to 3 µm, so YAP 1.0 sits
    at 0 µm. Not in the code.
  stands_for: "YAP-axis value at 0 µm adhesion length"
- id: length_per_yap_added
  quantity: length_per_yap_unit
  unit: um
  printed: "3"
  basis: "As yap_at_zero_length_added: one unit of the YAP axis (1.0 to 2.0) spans 3 µm of the adhesion-length axis. Not in the code."
  stands_for: "µm of adhesion length per unit of YAP ratio"
