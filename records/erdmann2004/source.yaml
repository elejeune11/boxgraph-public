notes: >
  Scope is every printed number that a stated equation produces. Recorded models:
  the force scale Fb = kBT/xb (p. 1); the leakage estimate a = p1(inf) from Eq. 5
  (p. 3); the long-time decay rate of N(tau) from the master equation Eq. 1 with an
  absorbing boundary (p. 3; the paper obtains it by Monte Carlo and a fit, the record
  computes it as the slowest eigenvalue of Eq. 1, see q_decay_method); Bell's critical
  force fc = N0 plog(gamma/e) (p. 3) and its inversion for the integrin example (p. 4);
  the f = 0 lifetime Eq. 8 forward (T = 7 s) and inverted for the cluster sizes N0 = 20
  and N0 = 150 needed for a one-day lifetime (p. 4); and the harmonic-number
  approximation for the gamma = 0 cluster size (~10^40000, p. 4). The ~10^40000 value
  itself is not recorded as a datum because it overflows a float (q_10_40000); its run
  is kept. The two printed lists of decay rates a on p. 3 are recorded with the pairing
  as printed (values listed in the same order as N0 = 2, 5, 10, 15); both lists appear
  to be in reverse order (q_leak_order, q_num_order). Left out: Eqs. 1-4 and 6-7 as
  general solutions that produce only figures (Figs. 2-4 are curves without printed
  values, not digitised); the identities stated in words (Eq. 8 at N0 = 2 equals Eq. 7
  at f = 0; Eq. 8 at gamma = 0 gives H_N0; T ~ gamma^(N0-1)), which print no numbers;
  the Fig. 4(a) approximation T = ln[0.61(N0/f)], which is drawn but never evaluated in
  print; the receptor numbers (~10^5) and rates "in the 1/s range" in the introduction,
  which feed no model; and the stress constant ~5.5 nN/um^2 (p. 4), whose conversion to
  Fc = 5.5 nN is unstated (q_Fc_area). Bell's model (ref. 1) is in record bell1978;
  no relation is recorded here because the paper's stochastic model is not in that
  record.
  Figure reading (2026-10-31, claude-opus-5-5): the curves of Figs. 2, 3(a), 3(d), 4(a)
