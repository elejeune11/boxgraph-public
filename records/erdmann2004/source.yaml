  exactly for p_i(tau) and N(tau), against the Monte Carlo curves (q_fig_mc_exact); Eq. 4
  integrated; the dimensionless lifetimes (Eq. 8, and the adjoint solution against f/N0);
  and the Fig. 4(a) approximation T = ln[0.61(N0/f)]. Findings: Fig. 3(a) confirms the
