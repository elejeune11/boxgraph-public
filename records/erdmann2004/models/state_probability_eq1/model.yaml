id: state_probability_eq1
name: state probability p_i(tau) from the master equation Eq. 1 with an absorbing boundary, starting from N0 closed bonds
role: model
stated: {page: 2, printed_page: "108102-2", quote: "by a one-step master equation [10]", where: "Eq. 1"}
equation: "dp_i/dτ = r(i+1) p_{i+1} + g(i-1) p_{i-1} - [r(i) + g(i)] p_i  (Eq. 1); r(i) = i e^{f/i}, g(i) = γ(N0 - i)  (Eq. 2); g(0) = 0; p_i(0) = δ_{i,N0}"
inputs:
  N0: {quantity: cluster_size, unit: dimensionless}
  gamma: {quantity: rebinding_rate_dimensionless, unit: dimensionless}
  f: {quantity: force_dimensionless, unit: dimensionless}
  i: {quantity: closed_bond_number, unit: dimensionless}
  tau: {quantity: time_dimensionless, unit: dimensionless}
outputs:
  p: {quantity: state_probability, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
