id: rebinding_from_critical_force
name: rebinding rate for which a given force is critical (fc = N0 plog(gamma/e) solved for gamma)
role: model
stated: {page: 4, printed_page: "108102-4", quote: "might be close to the critical force fc  N0 plog=e", where: text}
equation: "fc = N0 plog(γ/e), f = F/Fb, γ = kon/k0"
built_from: [critical_force]
inputs:
  Fc: {quantity: critical_force, unit: pN}
  Fb: {quantity: force_scale, unit: pN}
  N0: {quantity: cluster_size, unit: dimensionless}
  k0: {quantity: unloaded_dissociation_rate, unit: 1/s}
outputs:
  gamma: {quantity: rebinding_rate_dimensionless, unit: dimensionless}
  kon: {quantity: association_rate, unit: 1/s}
settings: {}
stochastic: false
