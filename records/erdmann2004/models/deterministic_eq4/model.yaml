id: deterministic_eq4
name: mean number of closed bonds N(tau) from the deterministic Eq. 4, starting from N(0) = N0
role: model
stated: {page: 2, printed_page: "108102-2", quote: "study the following deterministic equation", where: "Eq. 4"}
equation: "dN/dτ = -N e^{f/N} + γ(N0 - N),  N(0) = N0;  f = (f/N0) N0"
inputs:
  N0: {quantity: cluster_size, unit: dimensionless}
  gamma: {quantity: rebinding_rate_dimensionless, unit: dimensionless}
  f_over_N0: {quantity: force_per_bond_dimensionless, unit: dimensionless}
  tau: {quantity: time_dimensionless, unit: dimensionless}
outputs:
  N: {quantity: mean_closed_bond_number, unit: dimensionless}
settings: {rtol: 1.0e-10}
stochastic: false
