id: lifetime_adjoint_dimensionless
name: mean cluster lifetime from the adjoint master equation of Eq. 1, dimensionless (in units of 1/k0), as a function of force per bond f/N0 (Fig. 4a)
role: model
stated: {page: 3, printed_page: "108102-3", quote: "In general, T can be calculated from the adjoint", where: text}
equation: "T = mean first passage time from i = N0 to i = 0 of Eq. 1 with r(i) = i e^{f/i}, g(i) = γ(N0 - i) (Eq. 2); f = (f/N0) N0; for γ = 0 this is T = Σ_{i=1}^{N0} 1/r(i)"
inputs:
  N0: {quantity: cluster_size, unit: dimensionless}
  gamma: {quantity: rebinding_rate_dimensionless, unit: dimensionless}
  f_over_N0: {quantity: force_per_bond_dimensionless, unit: dimensionless}
outputs:
  T: {quantity: cluster_lifetime_dimensionless, unit: dimensionless}
settings: {}
built_from: [lifetime_adjoint]
from_words: true
stochastic: false
