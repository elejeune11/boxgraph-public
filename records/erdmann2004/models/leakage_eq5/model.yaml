id: leakage_eq5
name: leakage estimate of the decay rate, a = p1(inf) from Eq. 5
role: model
stated: {page: 3, printed_page: "108102-3", quote: "resulting decay can be approximated by N  Neq ea", where: text}
equation: "a ≈ p1(∞), with p_i(τ) = C(N0,i) (γ + e^{-(1+γ)τ})^i (1 - e^{-(1+γ)τ})^{N0-i} / (1+γ)^{N0}  (Eq. 5)"
inputs:
  N0: {quantity: cluster_size, unit: dimensionless}
  gamma: {quantity: rebinding_rate_dimensionless, unit: dimensionless}
outputs:
