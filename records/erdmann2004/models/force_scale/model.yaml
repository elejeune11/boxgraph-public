id: force_scale
name: thermal force scale of a single bond
role: model
stated: {page: 1, printed_page: "108102-1", quote: "the force scale Fb", where: text}
equation: "Fb = kB T / xb"
inputs:
  xb: {quantity: transition_state_distance, unit: nm}
  T: {quantity: temperature, unit: K}
outputs:
  Fb: {quantity: force_scale, unit: pN}
settings: {}
stochastic: false
