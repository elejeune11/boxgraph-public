id: decay_rate_eq1
name: long-time decay rate of N(tau) from the master equation Eq. 1 with an absorbing boundary
role: model
stated: {page: 3, printed_page: "108102-3", quote: "Numerically, we find a", where: text}
equation: "dp_i/dτ = r(i+1) p_{i+1} + g(i-1) p_{i-1} - [r(i) + g(i)] p_i  (Eq. 1); r(i) = i e^{f/i}, g(i) = γ(N0 - i)  (Eq. 2); g(0) = 0"
inputs:
  N0: {quantity: cluster_size, unit: dimensionless}
  gamma: {quantity: rebinding_rate_dimensionless, unit: dimensionless}
  f: {quantity: force_dimensionless, unit: dimensionless}
outputs:
  a: {quantity: bond_number_decay_rate, unit: dimensionless}
settings: {}
from_words: true
stochastic: false
