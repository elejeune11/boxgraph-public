# Table S1 of this paper is "the base parameter set from Chan and Odde6" (p. 3); each value is linked
# to the same entry of Chan and Odde's Table S1 (record chan2008, SOM p. 49).
- {datum: nm_base, from_datum: nm_S1, evidence: "Table S1 base set taken from Chan and Odde (ref. 6); the number of motors, 75 in both tables"}
- {datum: Fm_base, from_datum: Fm_S1, negated: true, evidence: "Table S1 base set taken from Chan and Odde (ref. 6); the single-motor stall force, printed 2 pN here and -2 pN in Chan and Odde, who count retrograde (rearward) forces negative"}
- {datum: vu_base, from_datum: vu_S1, negated: true, evidence: "Table S1 base set taken from Chan and Odde (ref. 6); the unloaded motor velocity, printed 120 here (unit misprinted pN/nm) and -120 nm/s in Chan and Odde, who count retrograde motion negative"}
- {datum: nc_base, from_datum: nc_S1, evidence: "Table S1 base set taken from Chan and Odde (ref. 6); the number of clutches, 75 in both tables"}
- {datum: kon_base, from_datum: kon_S1, evidence: "Table S1 base set taken from Chan and Odde (ref. 6); the clutch on-rate, 1 s-1 in both tables"}
- {datum: koff_base, from_datum: koff_S1, evidence: "Table S1 base set taken from Chan and Odde (ref. 6); the unloaded clutch off-rate, 0.1 s-1 in both tables"}
- {datum: Fb_base, from_datum: Fb_S1, negated: true, evidence: "Table S1 base set taken from Chan and Odde (ref. 6); the characteristic bond rupture force, printed 2 pN here and -2 pN in Chan and Odde, whose clutch tensions are negative so that Fclutch/Fb is positive"}
- {datum: kc_base, from_datum: kc_S1, evidence: "Table S1 base set taken from Chan and Odde (ref. 6); the clutch spring constant, 5 pN/nm in both tables"}
