notes: >
  PDF pp. 1-11 are the article (pp. 449-459; the references end on p. 11). pp. 12-20 are the
  Supplementary Information: results text pp. 12-15, legends pp. 16-17, Table S1 p. 18, Fig. S1 p. 19,
  Fig. S2 p. 20. These pages carry no printed page labels.
  In scope is the quantitative core. (1) The clutch-ensemble master-equation ODEs (Eqs. 8-12 with the
  gamma-closure off-rate of Eq. 19), as three models: one load-and-fail cycle (cycle time and
  cycle-mean flow), the state at a time t, and the optimum stiffness, i.e. the minimum of the
  cycle-mean flow. (2) The single-clutch ODEs (Eqs. 1, 2, 4-7). (3) The analytical optimum, Eq. 30.
  (4) The order-of-magnitude arithmetic of Eq. 31 in the Discussion: ln(1/ε), Fm/vu, n/ln(n), the
  coefficient 1 pN-s/nm, and the kon and koff ranges.
  Checks with verdicts: ln(1/ε) = 4.6, the Eq. 31 coefficient, the kon range 1-1000 /s and the koff
  range 0.1-100 /s, and the consistency of Fm/vu with 0.01 pN-s/nm. All reproduce. The ODE optimum
  at nm = nc = 25 (r = 3) reproduces the printed 1 pN/nm. Not reproduced: the ODE optimum at 3600
  (printed 200 pN/nm; q_ode_opt_3600) and the S2E cycle times for r = 1 and r = 3 (printed 15 s and
  73 s; q_tcycle_r). The ODE runs are refined over solver tolerance, failure threshold and stiffness
  grid. Eq. 30 and the ODE optimum are also compared with the printed Monte Carlo optima
  (approximation; q_eq30_vs_mc).
  Findings: Table S1 prints vu in pN/nm (q_vu_unit). Fig. S1C's 200 nm plateau implies κs = 0.01
  pN/nm, not the stated 0.1 (q_figS1_stiffness; both values are run).
  Reader's choices: the failure criterion (g_fail), the initial state, the cycle average of the ODE
  flow, and the stiffness of S2E (added, with alternatives). See q_ode_failure, q_ode_initial_state,
  q_ode_mean_flow and ks_S2E_added.
  Figures: the first pass read plotted ODE values by eye; those values carry no verdict and are kept
  (q_eye_readings). A second, calibrated pass (2026-11-01) reads 50 curves of Figs. 2, 3c, 4, 6, S1
  and S2 by code (figures.yaml, figures/_fig.py, figures.md). Each reading becomes a datum
  <reading>_cal, and the ODE ones are compared with runs. The plotted ODE curves load more slowly than
  Eqs. 8-12 and 19 on the printed inputs. The failure comes at 28.2 s against 25.7 s
  (q_cal_tfail_fig2, q_cal_ode_curves_fig2). The S2E and S2F curves differ as well (q_cal_fig2b_vs_S2E,
  q_cal_S2F). The Fig. 4(b) curves support the printed optima rather than the record's runs
  (q_cal_fig4b). The S1C plateau confirms q_figS1_stiffness (q_cal_S1). The S2F curve for r = 0.3
  cannot be run (q_S2F_r03).
  Left out: Eqs. 20-29 and 32 as separate models. They are steps of the derivation of Eq. 30, or a
  dimensionless group with no printed value. Also left out: Fig. 6 (computation times), the
  stiffness ranges quoted from other studies (1-1000 kPa, refs. 26, 27, 31), the traction of order
  1000 pN (refs. 4, 28), Euler's constant, and the Monte Carlo statistics of Fig. S2A-D. None of these
  feed a model of this paper. The attached odde_code (Chan and Odde Monte Carlo re-implementation) is
  not used: this paper's models are the ODEs, and the Monte Carlo model belongs to the chan2008 and
  bangasser2013 records.
