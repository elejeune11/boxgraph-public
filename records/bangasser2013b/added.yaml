- id: ks_S2E_added
  quantity: substrate_stiffness
  unit: pN/nm
  printed: "0.1"
  basis: >-
    The text (p. 14) and the legend of Fig. S2E do not state the substrate stiffness of the r = 1 and
    r = 3 ODE cycles. Panels S2A-C of the same figure are on κsub = 0.1 pN/nm, as are Figs. 2 and S1;
    in Fig. S2F the ODE cycle times at 0.1 pN/nm match the S2E drops by eye.
  alternatives: ["0.05", "0.2"]
  stands_for: "κs of the ODE solutions of Fig. S2E"
- id: eps_multiplier_added
  quantity: epsilon_multiplier
  unit: dimensionless
  printed: "10"
  basis: >-
    'changing ε by 10-fold changes this quantity by ~2-fold' (p. 9) does not say in which direction;
    raising ε from 0.01 to 0.1 halves ln(1/ε) (the 2-fold change).
  alternatives: ["0.1"]
  stands_for: "the 10-fold change of ε on p. 9"
- id: ks_S1_alt_added
  quantity: substrate_stiffness
  unit: pN/nm
  printed: "0.01"
  basis: >-
    Not the paper's stated value (0.1 pN/nm, Fig. S1 legend). The single-clutch force balance stalls
    at κs xs = nm Fm = 2 pN, so the 200 nm plateau of Fig. S1C corresponds to κs = 0.01 pN/nm. Run
    beside the stated value to test that reading (q_figS1_stiffness).
  alternatives: ["0.1"]
  stands_for: "κsub of Fig. S1, as the plotted substrate position implies"
