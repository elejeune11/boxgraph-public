id: log_cycle_factor
name: "the factor ln(1/ε) of Eqs. 28-31, and its change when ε changes"
role: model
stated: {page: 9, printed_page: "457", quote: "the quantity ln(1/e) = 4.6 which is of order", where: text}
equation: "ln(1/ε); changing ε by 10-fold changes this quantity by ~2-fold"
inputs:
  eps: {quantity: cycle_end_fraction, unit: dimensionless}
  m:   {quantity: epsilon_multiplier, unit: dimensionless}
outputs:
  L:    {quantity: log_cycle_factor, unit: dimensionless}
  fold: {quantity: log_cycle_factor_fold_change, unit: dimensionless, description: "ln(1/ε) / ln(1/(m ε))"}
settings: {}
stochastic: false
