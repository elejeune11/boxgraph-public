id: optimum_eq30
name: analytical optimum substrate stiffness (Eq. 30)
role: model
stated: {page: 5, printed_page: "453", quote: "analytical expression for the optimum stiffness for cell", where: "Eq. 30"}
equation: "κs,opt = Fm nm kon / (vu ln(nc)) ln(1/ε)"
inputs:
  Fm:  {quantity: motor_stall_force, unit: pN}
  nm:  {quantity: n_motors, unit: dimensionless}
  kon: {quantity: clutch_on_rate, unit: 1/s}
  vu:  {quantity: unloaded_motor_velocity, unit: nm/s}
  nc:  {quantity: n_clutches, unit: dimensionless}
  eps: {quantity: cycle_end_fraction, unit: dimensionless}
outputs:
  ks_opt: {quantity: optimal_substrate_stiffness, unit: pN/nm}
settings: {}
stochastic: false
