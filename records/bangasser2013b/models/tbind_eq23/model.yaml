id: tbind_eq23
name: time for all clutches to bind, high-nc form without Euler's constant (Eq. 23)
role: model
stated: {page: 4, printed_page: "452", quote: "simplification by dropping c to obtain Eq. (23).", where: "Eq. 23"}
equation: "tbind = ln(nc)/kon"
inputs:
  nc:  {quantity: n_clutches, unit: dimensionless}
  kon: {quantity: clutch_on_rate, unit: 1/s}
outputs:
  tbind: {quantity: ensemble_binding_time, unit: s}
settings: {}
stochastic: false
# A helper model for the relator: the binding time that Eq. 30 rests on, the paper's simplification of
# Eq. 22 for ln(nc) >> c.
