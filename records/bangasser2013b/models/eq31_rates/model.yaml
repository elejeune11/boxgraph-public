id: eq31_rates
name: "Eq. 31 inverted: the clutch on- and off-rates that put the optimum at a given substrate stiffness"
role: model
stated: {page: 9, printed_page: "457", quote: "to obtain an optimum substrate stiffness in the range", where: "Eq. 31 and text"}
equation: "κs,opt = (1 pN-s/nm) kon; kon = 10 koff"
inputs:
  C:  {quantity: optimum_stiffness_per_on_rate, unit: pN*s/nm}
  ks: {quantity: substrate_stiffness, unit: pN/nm}
  q:  {quantity: on_off_rate_ratio, unit: dimensionless}
outputs:
  kon:  {quantity: clutch_on_rate, unit: 1/s}
  koff: {quantity: clutch_off_rate_unloaded, unit: 1/s}
settings: {}
stochastic: false
