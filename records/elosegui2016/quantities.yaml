# Clutch-model parameters (Supplementary Table 1, Supplementary Note)
- {id: n_fibronectin, name: number of fibronectin molecules (clutches) in the model, dimension: dimensionless}
- {id: integrin_binding_rate_intrinsic, name: intrinsic integrin-fibronectin binding rate (per integrin density), dimension: "[length]**2/[time]", description: "k_ont; the binding rate of one clutch is k_on = k_ont d_int"}
- {id: n_myosin, name: number of myosin motors pulling the actin filament, dimension: dimensionless}
- {id: integrin_density_increment, name: "integrins added per reinforcement event, per area", dimension: "1/[length]**2"}
- {id: integrin_density, name: integrin density on the membrane, dimension: "1/[length]**2"}
- {id: talin_force_fraction, name: fraction of integrin force experienced by talin, dimension: dimensionless}
- {id: myosin_stall_force, name: stall force of one myosin motor, dimension: "[force]"}
- {id: myosin_unloaded_speed, name: unloaded myosin motor (actin) speed, dimension: "[length]/[time]"}
- {id: clutch_stiffness, name: spring constant of one clutch, dimension: "[force]/[length]"}
- {id: adhesion_radius, name: radius of the adhesion used to convert model force and stiffness, dimension: "[length]"}
- {id: koff_scaling_factor, name: factor multiplying the fitted integrin off-rate curve, dimension: dimensionless}
- {id: low_force_limit, name: force below which integrin unbinding was increased over the measured rates, dimension: "[force]"}
- {id: catch_bond_prefactor, name: prefactor of one exponential term of the integrin off-rate k_off(F), dimension: "1/[time]"}
- {id: catch_bond_force_coefficient, name: force coefficient in the exponent of one term of k_off(F), dimension: "1/[force]"}
- {id: low_force_term_vanishing_force, name: force at which the added low-force term of k_off has fallen to 10% of its zero-force value, dimension: "[force]"}
- {id: ln_unfolding_rate_zero_force, name: natural log of the talin unfolding rate at zero force (rate in 1/s), dimension: dimensionless}
- {id: unfolding_force_coefficient, name: force coefficient in the exponent of the talin unfolding rate, dimension: "1/[force]"}
- {id: ln_refolding_rate_zero_force, name: natural log of the talin refolding rate at zero force (rate in 1/s), dimension: dimensionless}
- {id: refolding_force_coefficient, name: force coefficient in the exponent of the talin refolding rate, dimension: "1/[force]"}
- {id: vinculin_binding_rate, name: force-independent rate of vinculin binding to unfolded talin, dimension: "1/[time]"}
- {id: ksub_geometry_factor, name: "factor c in k_sub = c E r_a converting a Young's modulus to a substrate spring constant", dimension: dimensionless}
- {id: time_step, name: time step of the simulation, dimension: "[time]"}
- {id: simulated_time, name: total simulated time, dimension: "[time]"}
- {id: threshold_density_increase, name: relative increase of integrin density over baseline that defines the threshold rigidity, dimension: dimensionless}
- {id: threshold_sensitivity, name: "sensitivity S = d log k_threshold / d log p of the threshold rigidity to a parameter", dimension: dimensionless}
# Experimental conditions and quantities
- {id: substrate_rigidity, name: Young's modulus of the substrate cells are plated on, dimension: "[pressure]"}
- {id: cell_traction, name: average traction stress exerted by a cell on its substrate, dimension: "[pressure]"}
- {id: actin_retrograde_flow, name: actin retrograde flow speed, dimension: "[length]/[time]"}
- {id: threshold_rigidity, name: substrate Young's modulus above which talin unfolds and forces diverge between control and talin-depleted cells, dimension: "[pressure]"}
- {id: talin_unfolding_force, name: force where talin unfolding rates become faster than refolding rates, dimension: "[force]"}
- {id: fibronectin_coating, name: concentration of the fibronectin solution used to coat the gels, dimension: "[mass]/[length]**3"}
- {id: gpen_concentration, name: concentration of the integrin-blocking GPen peptide, dimension: "[substance]/[length]**3"}
- {id: blebbistatin_concentration, name: concentration of the myosin inhibitor blebbistatin, dimension: "[substance]/[length]**3"}
- {id: bond_force, name: force on a single fibronectin-integrin bond, dimension: "[force]"}
- {id: bond_lifetime, name: average lifetime of a single fibronectin-integrin bond under force, dimension: "[time]"}
# Measured quantities read from figures (second pass)
- {id: traction_detection_level, name: background noise level of traction force microscopy, dimension: "[pressure]", description: "the minimum detectable traction for each rigidity (Fig. 1a, grey)"}
- {id: vinculin_adhesion_length, name: length of vinculin-stained focal adhesions, dimension: "[length]"}
- {id: beta3_adhesion_length, name: length of adhesions stained for ligand-bound beta3 integrin, dimension: "[length]"}
- {id: pfak_adhesion_length, name: length of adhesions stained for phosphorylated FAK, dimension: "[length]"}
- {id: yap_nuclear_cytosolic_ratio, name: ratio of nuclear to cytosolic YAP staining, dimension: dimensionless}
- {id: talin_force, name: force on a single talin molecule, dimension: "[force]"}
- {id: talin_unfolding_time, name: average time to unfold a talin rod domain under force, dimension: "[time]"}
- {id: integrin_staining_density, name: density of ligand-bound beta3 integrin staining in adhesions (arbitrary units), dimension: dimensionless}
- {id: pfak_area_percentage, name: percentage of the cell spreading area covered by pFAK-positive adhesions, dimension: dimensionless}
- {id: spread_area, name: cell spreading area, dimension: "[length]**2"}
- {id: pmlc_mlc_ratio, name: ratio of phosphorylated to total myosin light chain (western blot), dimension: dimensionless}
- {id: attached_cell_percentage, name: percentage of spread (attached) cells per field of view, dimension: dimensionless}
- {id: transfection_efficiency, name: "efficiency of transfection of a single cell (relative fluorescence intensity, a.u.)", dimension: dimensionless}
- {id: fibronectin_surface_density, name: "fibronectin density on the gel surface (fluorescence, a.u.)", dimension: dimensionless}
