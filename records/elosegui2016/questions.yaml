  kind: reading
  about: [figs2_control_29kpa, figs2_shrna_5kpa, figs2_shrna_29kpa, fig1a_control, fig1a_shrna, fig4e_shrna]
  text: >
    The Supplementary Fig. 2 means of untransfected control and talin 2 shRNA cells coincide with the Fig. 1a
