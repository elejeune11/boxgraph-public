- id: q_rate_laws
  kind: unstated_input
  about: [clutch_talin_sim, clutch_no_talin_sim, koff_a_added, koff_b_added, koff_c_added, koff_d_added, ln_kunf0_added, kunf_b_added, ln_kfold0_added, kfold_b_added]
  text: >
    Supplementary Table 1 gives the integrin off-rate only as "Catch bond" and the talin unfolding and
    refolding rates only as "Slip bond"; the Supplementary Note gives their functional forms in words (sum of
    two exponentials fitted to the Kong et al. 2009 fibronectin-α5β1 Mn2+ data; single exponentials fitted to
    Yao et al. 2014) but no coefficients. Every model result rests on these laws. The record takes them from
    the same laboratory's 2021 released code (record andreu2021_code), whose paper says these come from this
    paper; the code also carries a commented-out second fit of the catch bond (16.67, -1.945e11, 0.001442,
    1.356e11), not run here. The Matlab code of this paper is 'available on request' (p. 11) and was not seen.
  citation: {page: 19, printed_page: "SI 8", quote: "Integrin unbinding rate Catch bond", where: Supplementary Table 1}
- id: q_low_force_koff
  kind: unstated_input
  about: [koff_g_added, koff_fend_added, low_force_note]
  text: >
    The note says unbinding rates were "further increased" below 1 pN with respect to experimental values,
    without saying by how much or in what form. The record adds the 'cm' term of the 2021 code
    (1000 /s at zero force, falling to 10% at 0.15 pN) and runs the alternative of no increase (g = 0); the
    paper says the change "only increased the slope at low rigidities".
  citation: {page: 24, quote: "integrin-Fn bonds at very low forces (< 1 pN)", where: Supplementary Note}
- id: q_vinculin_rate
  kind: unstated_input
  about: [kvin_added, clutch_talin_sim]
  text: >
    The vinculin binding rate k_vin is named in the Supplementary Note but given no value anywhere (it is not
    in Supplementary Table 1). Added: 1000 /s (vinculin nearly always wins over refolding, as in the 2021
    code where unfolding reinforces at once); alternative 10 /s.
  citation: {page: 24, quote: "force-independent binding rate kvin", where: Supplementary Note}
- id: q_ksub_conversion
  kind: unstated_input
  about: [ksub_factor_added, clutch_talin_sim, clutch_no_talin_sim]
  text: >
    k_sub and F are converted to Young's modulus and traction "by assuming a given adhesion radius ra as
    described previously" (refs. 1, 2 of the note), with no formula in this paper. Added: traction = F/(π ra²)
    and k_sub = (4π/9) E ra; alternative k_sub = π E ra. The conversion shifts every model curve along the
    rigidity axis, so it bears on every comparison against a plotted line.
  citation: {page: 23, quote: "by assuming a given adhesion radius ra as described previously", where: Supplementary Note}
- id: q_step_algorithm
  kind: choice
  about: [clutch_talin_sim, clutch_no_talin_sim]
  text: >
    The note describes the time step only in words. Choices made in the record: binding is drawn before
    unbinding within a step and a clutch bound in a step is first tested in the next; forces are those at the
    end of the previous step; a clutch whose talin bound vinculin stays bound and does not unfold again; a
    clutch that unbinds after its talin bound vinculin does not lower d_int; d_int has no upper bound (none is
    stated, unlike the later 2021 model which has d_max); the actin speed uses the substrate force of the
    previous step. Time averages are taken over the whole 100 s including the start (the note does not say
    whether a transient is discarded).
  citation: {page: 24, quote: "If unfolding time was shorter than unbinding time", where: Supplementary Note}
- id: q_no_talin_model
  kind: unstated_model
  about: [clutch_no_talin_sim]
  text: >
    The predictions "without talin unfolding" (Fig. 3d,e blue lines, Fig. 6 dashed lines) are not described
    separately. The record runs the same clutch model with unfolding switched off, so integrin density stays
    basal, following p. 4 ('In the absence of talin unfolding, integrins are not recruited, but force is still
    assumed to be transmitted').
  citation: {page: 4, printed_page: "543", quote: "In the absence of talin unfolding, integrins are", where: text}
- id: q_sensitivity_procedure
  kind: choice
  about: [threshold_sensitivity, S_nf_table, S_kont_table, S_nm_table, S_dadd_table, S_FR_table, threshold_increase_note]
  text: >
    The sensitivity S is defined (p. 25) but the parameter values around the fit, the rigidity grid and
    whether the 10% density increase is judged on the time-averaged or the final density are not given.
    Added: factors 0.5, 1 and 2 on the parameter, 13 log-spaced moduli from 0.3 to 30 kPa, time-averaged
    density, first upward crossing interpolated in log E.
  citation: {page: 25, quote: "kthreshold was calculated for p values around the optimal fitted values", where: Supplementary Note}
- id: q_sensitivity_sign
  kind: unexplained_difference
  about: [cmp_S_nf, cmp_S_kont, S_nf_table, S_kont_table]
  text: >
    In the record's model the threshold rigidity falls as nf or kont increase (S about -1.0 for both, mean of
    three seeds), while Supplementary Table 1 prints +1.66 and +1.49 and the text argues that fewer clutches
    lower the threshold (p. 6). In the record's model each vinculin-binding event adds d_add to a single
    density, so more bound clutches mean more reinforcement events; the paper's code may scale reinforcement
    differently (per clutch, or per adhesion area). The build's verdicts on cmp_S_* report the outcome.
  citation: {page: 6, printed_page: "545", quote: "contractility is distributed among fewer clutches, triggering talin", where: text}
- id: q_talin_line_high_rigidity
  kind: unexplained_difference
  about: [cmp_fig3d_talin, cmp_fig3e_talin, cmp_fig6a_talin, cmp_fig6b_talin, cmp_fig6c_talin, cmp_fig6d_talin, cmp_fig6e_talin, cmp_fig6f_talin]
  text: >
    The record's model with talin unfolding follows the plotted solid lines up to a few kPa but departs from
    them above the threshold: it overshoots at the stiffest end (Fig. 3d, 40 kPa: about 138 Pa against 126 Pa
    read; Fig. 6b, c similar) and misses the plateaux of Fig. 6a, e, f around 7-20 kPa. The no-talin model
    reproduces every plotted no-talin line read (Fig. 3d,e, Fig. 6a-i), and the talin lines of the blebbistatin
    panels (Fig. 6g-i) reproduce. The likely cause is reinforcement as made runnable here (q_step_algorithm:
    d_int has no upper bound, the vinculin rate is added), not a misprint; it is left as found.
- id: q_dt_numerics
  kind: numerics
  about: [ref_dt_talin, ref_dt_notalin, ref_dt_S_nf, dt_note]
  text: >
    Halving and quartering the printed 5 ms time step moves the time-averaged traction by more than the
    added 5% tolerance, for both models, and moves S for nf by more than 0.2: at the paper's own step the
    results belong partly to the numerics (each clutch is tested once per step while its unbinding rate can
    exceed 1/dt at low force). Lengthening the run (100 s to 400 s) does not move them.
- id: q_threshold_rigidity
  kind: unexplained_difference
  about: [val_threshold, threshold_measured_text]
  text: >
    The record's model reaches a 10% rise in integrin density at about 2 kPa, while the measured forces
    diverge above 5 kPa (p. 2) and the model lines of Fig. 3d separate near 5 kPa. The threshold depends on how
    the density is judged (time average here; q_sensitivity_procedure) and on the added inputs.
- id: q_rate_labels
  kind: possible_error
  about: [clutch_talin_sim]
  text: >
    Supplementary Table 1 labels Kfold "Talin unfolding rate" and Kunfold "Talin refolding rate": the symbols
    and their meanings are swapped with respect to the note (kunf unfolding, kfold refolding).
  citation: {page: 19, printed_page: "SI 8", quote: "Talin unfolding rate Slip bond", where: Supplementary Table 1}
- id: q_kc_unit
  kind: reading
  about: [kc_table]
  text: >
    The clutch spring constant is printed as 1 nN/nm (1000 pN/nm), far stiffer than the 5 pN/nm of Chan and
    Odde 2008 that the clutch model is adapted from. It is used as printed; with springs this stiff, almost
    all of a clutch's load comes from the substrate side.
  citation: {page: 19, printed_page: "SI 8", quote: "Clutch spring constant 1 nN/nm", where: Supplementary Table 1}
- id: q_fig6k_legend
  kind: possible_error
  about: []
  text: >
    The legend of Fig. 6k reads "50 mM" for the highest GPen dose, which the caption and panel f give as
    0.50 mM. Not used in the record (YAP data are left out).
  citation: {page: 7, printed_page: "546", quote: "100 µg ml–1 50 mM 50 µM", where: Fig. 6k legend}
