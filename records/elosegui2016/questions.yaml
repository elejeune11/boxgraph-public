- id: q_audit_fig3a_left_out
  kind: reading
  about: [ln_kunf0_added, kunf_b_added, ln_kfold0_added, kfold_b_added, talin_unfolding_force_wt]
  text: >
    Audit (second reader): figures.md leaves Fig. 3a out because its points feed no model run. Fig. 3a holds
    measured data (FN-αvβ3 lifetimes with s.e.m. bars, measured in this paper) and the blue line of talin
    unfolding times from ref. 25, plus a dashed "Threshold" force; the reading guide asks for every plotted
    measurement to be read. The blue line is also the only plotted check of the added unfolding law
    (1/k_unf against force; the note says k_unf was fitted to the ref. 25 data), and the αvβ3 lifetimes are what
    the note says an equivalent k_off fit could use. Suggest reading Fig. 3a and validating 1/k_unf(f) against
    the blue line. Not done in this audit (the figure tools could not be run).
  citation: {page: 4, printed_page: "543", quote: "The blue line shows previously measured average unfolding times of talin", where: "Fig. 3a caption"}
- id: q_audit_rate_law_alternatives
  kind: reading
  about: [koff_a_added, koff_b_added, koff_c_added, koff_d_added, ln_kunf0_added, kunf_b_added, ln_kfold0_added, kfold_b_added]
  text: >
    Audit (second reader): the catch-bond and talin rate-law coefficients are added without alternatives
    (validator warnings), though every model verdict rests on them. The second catch-bond fit carried in the
    2021 code (16.67 /s, -0.1945 /pN, 0.001442 /s, 0.1356 /pN; q_rate_laws) is a real joint alternative and
    could be run once as a set; for the talin laws, any pair keeping the 5 pN crossing (p. 5) but with other
    slopes would test how much the verdicts depend on the 2021 values. Left to the first reader's scope.
  citation: {page: 19, printed_page: "SI 8", quote: "Integrin unbinding rate Catch bond", where: Supplementary Table 1}
- id: q_audit_gpen_threshold
  kind: reading
  about: [S_kont_table, S_dadd_table, kont_fig6f, dadd_fig6f, kont_table, dadd_table]
  text: >
    Audit (second reader): the text says GPen gives "no major change in the threshold rigidity for
    reinforcement" (p. 7) while kont and dadd are both lowered (Fig. 6d-f caption). With the printed
    sensitivities (S_kont 1.49, S_dadd -0.83) the two shifts roughly cancel, so the printed table and text are
    consistent with each other; the record does not compare this, and with the record's model (S_kont of the
    opposite sign, q_sensitivity_sign) the two shifts would add instead. A threshold run at the Fig. 6f
    parameters against the reference would test the claim directly.
  citation: {page: 7, printed_page: "546", quote: "but no major change in the threshold rigidity for reinforcement", where: text}
- id: q_hidden_points_second_pass
  kind: reading
  about: [fig1a_control, fig1a_shrna, fig1c_control, fig1c_shrna, fig1e_shrna, fig4a_rod, fig4b_fl, fig4b_head, fig4c_fl, fig4c_rod, fig4c_head, fig5c_shrna, fig6k_gpen015, fig6l_bleb5, fig6l_bleb15, figs2_l325r_5kpa, figs2_l325r_29kpa]
  text: >
    Second pass: where the series of a panel overlap (the low-rigidity points of Fig. 1, 4b, 5b, 6j-l; the
    dense scatter of Supplementary Fig. 2), markers lying under another series' marker are read only when
    both their bar caps are visible (value: the caps' midpoint) or at least half of the marker is visible
    (value: the best template fit, with a widened interval); the rest are not read. These readings hold
    fewer points than the caption's n lists; a reader comparing at a missing rigidity must go back to the page.
- id: q_fig3a_unfolding_fit
  kind: unexplained_difference
  about: [fit_fig3a_unfolding, fig3a_unfolding, ln_kunf0_added, kunf_b_added, talin_unfolding_time]
  text: >
    The Supplementary Note says k_unf was fitted to the ref. 25 unfolding data, plotted as the blue line of
    Fig. 3a. With the record's added slip-bond law (andreu2021_code: ln k_unf0 = -7.573, 1.786 /pN), 1/k_unf
    is about half the plotted unfolding time between 3.5 and 4.5 pN (3.75, 2.40, 0.98, 0.63 s against about
    6.9, 4.8, 1.5, 1.2 s read at 3.5, 3.75, 4.25, 4.5 pN) and agrees only within the wide intervals at 4 and
    5 pN. Either the 2016 fit differs from the 2021 code's coefficients (they are not printed here,
    q_rate_laws), or the plotted line is not 1/k_unf of a single exponential. A factor of two in k_unf moves
    the unfolding/refolding crossing by only about 0.2 pN but shifts every talin-model line. This reading
    also settles q_audit_fig3a_left_out: Fig. 3a is now read.
  citation: {page: 4, printed_page: "543", quote: "previously measured average unfolding times", where: "Fig. 3a caption"}
