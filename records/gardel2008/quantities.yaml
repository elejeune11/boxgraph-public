- {id: actin_flow_speed, name: F-actin retrograde flow speed, dimension: "[length]/[time]", description: "magnitude of the F-actin speckle velocity at a grid point or FA (FSM)"}
- {id: actin_speed_at_peak_traction, name: F-actin speed at which traction stress is maximal, dimension: "[length]/[time]", description: "the F-actin speed associated with the highest traction stresses: at the peak of the stress-speed relation, at the >95% stresses, or at the time ts of peak stress in a single FA"}
- {id: switch_speed, name: threshold F-actin speed of the biphasic switch, dimension: "[length]/[time]", description: "the F-actin speed at which the traction-speed relationship changes from inverse to direct (the paper's threshold, Vc)"}
- {id: traction_stress_at_peak, name: traction stress of a single FA at the time of its peak stress, dimension: "[mass]/[length]/[time]**2", description: "sigma(ts)"}
- {id: fa_age_at_peak_traction, name: time after FA initiation at which its traction stress peaks, dimension: "[time]", description: "ts"}
- {id: fa_lifetime, name: lifetime of a focal adhesion, dimension: "[time]"}
- {id: gel_shear_modulus, name: shear elastic modulus G' of the polyacrylamide substrate, dimension: "[mass]/[length]/[time]**2"}
- {id: substrate_modulus, name: stiffness of the compliant substrate (modulus not named), dimension: "[mass]/[length]/[time]**2"}
- {id: corr_stress_speed_high, name: correlation coefficient r_AT of traction stress and F-actin speed for speeds above v0, dimension: dimensionless}
- {id: corr_stress_speed_low, name: correlation coefficient r_AT of traction stress and F-actin speed for speeds below v0, dimension: dimensionless}
# --- added with the figure readings (figures.yaml) ---
- {id: condition_index, name: perturbation condition (categorical), dimension: dimensionless, description: "1 CONTROL, 2 BLEB (50 uM blebbistatin), 3 CA-RAC, 4 CA-RHO: a label, not a magnitude"}
- {id: cell_region_index, name: cell region (categorical), dimension: dimensionless, description: "1 BG (background outside the cell), 2 LP (lamellipodium), 3 FA, 4 CB (cell body): a label, not a magnitude"}
- {id: edge_distance_at_peak_traction, name: distance from the cell edge of the maximal (>95%) traction stresses, dimension: "[length]"}
- {id: cell_edge_distance, name: distance from the leading cell edge, dimension: "[length]"}
- {id: speed_histogram_count, name: number of grid points in an F-actin speed bin, dimension: dimensionless}
- {id: traction_stress_region, name: traction stress at grid points of a cell region, dimension: "[mass]/[length]/[time]**2", description: "the distribution summarized by the box plots of Fig. 1 D"}
- {id: mean_traction_stress, name: mean traction stress at a distance from the cell edge or an F-actin speed, dimension: "[mass]/[length]/[time]**2", description: "averaged over a characteristic cell (Figs. 2 B, 4 C)"}
- {id: fa_traction_stress, name: traction stress of a single FA, dimension: "[mass]/[length]/[time]**2"}
- {id: time_fa, name: time in the time-lapse of a single FA, dimension: "[time]"}
- {id: fa_area, name: integrated area of a single FA, dimension: "[length]**2"}
- {id: paxillin_intensity, name: GFP-paxillin intensity of a single FA, dimension: dimensionless, description: "arbitrary units; Fig. 3 D plots it in units of 10^4 a.u. and the reading keeps the axis numbers"}
- {id: slope_inverse_range, name: slope m_s of the linear fit of stress against speed over the inverse-correlation range, dimension: "[mass]/[length]**2/[time]"}
- {id: slope_direct_range, name: slope m_w of the linear fit of stress against speed over the direct-correlation range, dimension: "[mass]/[length]**2/[time]"}
- {id: traction_stress_at_vs, name: traction stress sigma_s at the speed v_s, dimension: "[mass]/[length]/[time]**2"}
- {id: traction_stress_at_vw, name: traction stress sigma_w at the speed v_w, dimension: "[mass]/[length]/[time]**2"}
- {id: speed_vs, name: F-actin speed v_s bounding the inverse-correlation range, dimension: "[length]/[time]", description: "where r_AT of the high-speed data is most negative (Fig. S3 E)"}
- {id: speed_vw, name: F-actin speed v_w bounding the direct-correlation range, dimension: "[length]/[time]", description: "where r_AT of the low-speed data is maximal (Fig. S3 F)"}
- {id: speed_threshold_v0, name: threshold speed v0 splitting the data into high and low F-actin speeds, dimension: "[length]/[time]"}
- {id: normalized_actin_speed, name: F-actin speed across a single FA normalized by its maximum, dimension: dimensionless}
- {id: normalized_traction_stress, name: traction stress across a single FA normalized by its maximum, dimension: dimensionless}
