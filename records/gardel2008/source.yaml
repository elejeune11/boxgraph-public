notes: >
  PDF pp. 1-7 are the Report, pp. 8-10 the Supplemental Material (Figs. S1-S3). The paper is experimental
  (combined traction force and fluorescent speckle microscopy in PtK1 cells) and prints no equation that
  produces a number. Its one quantitative claim is stated in words: maximal traction, and the switch from an
  inverse to a direct traction-speed relationship, occur at a threshold F-actin speed of 8-10 nm/s,
  independent of perturbation (Abstract; p. 5). That claim is entered as a model from words
  (switch_speed_claim) and run on the printed threshold; it is compared for consistency with the speeds at
  maximal traction printed elsewhere: the mean F-actin speed at ts, 12.7 ± 3 nm/s (Fig. 3 E caption; close,
  not reproduced, at the range midpoint), the 8-12 nm/s range of the highest stresses (p. 3; reproduced) and
  the ~8 nm/s mean at the >95% stresses (p. 3; no verdict). Also recorded as printed, feeding no model: the
  Fig. 3 E,F means (ts, sigma(ts)), the cited FA lifetime, F-actin speeds across the cell front, the gel
  shear moduli and substrate stiffness range, and the typical correlation coefficients of Fig. S3.
  Left out: the linear regressions and correlation-coefficient procedure of Fig. S3 E,F and Fig. 5
  (processing of the raw stress/speed data, which are not printed; the slopes ms, mw and vs, vw are only
  plotted), counts and experimental settings (26 FAs, 1,000-3,000 vectors per image, bead size and
  density, objective, template sizes, Gaussian kernel width, FA area threshold 0.078 μm2, grouping
  thresholds of Fig. 3 B), and qualitative statements. NO FIGURE WAS READ: in this session the
  figure-rendering commands (`boxgraph figure`, `pdftoppm`) were refused by the permission settings, so the
  plotted data (Figs. 1 D,F,G; 2 B; 3 D,E,F; 4 C,D; 5 E,F,G; S2 D,H; S3 E,F) are not in the record
  (q_figures_not_read). The large scatter clouds (Figs. 3 A,B; 4 A; 5 A-D; S2 B,C,F; S3 A,C) would be left out in any case: thousands of overlapping points that cannot be told apart.
