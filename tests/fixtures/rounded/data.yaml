# a = 1.26 and b = 3.5 exactly in the paper's own work; it prints a rounded to 1.3.
- {id: a, quantity: length, unit: m, origin: reported, printed: "1.3", citation: {page: 1, quote: "a = 1.3 m"}}
- {id: b, quantity: factor, unit: dimensionless, origin: reported, printed: "3.5", citation: {page: 1, quote: "b = 3.5"}}
# 1.26 x 3.5 = 4.41: reproduced only once a's rounding is carried
- {id: y_rounding, quantity: length, unit: m, origin: predicted, printed: "4.41", citation: {page: 2, quote: "y = 4.41 m"}}
# 7% off: rounding is tried and cannot explain it
- {id: y_beyond, quantity: length, unit: m, origin: predicted, printed: "4.20", citation: {page: 2, quote: "y = 4.20 m"}}
# far off: rounding is not tried
- {id: y_far, quantity: length, unit: m, origin: predicted, printed: "3.00", citation: {page: 2, quote: "y = 3.00 m"}}
# a curve over b, computed with a = 1.26
- id: y_curve
  quantity: length
  unit: m
  origin: predicted
  citation: {page: 3, quote: "Table 1"}
  table:
    index_quantity: factor
    index_unit: dimensionless
    index: ["1", "2"]
    values: ["1.26", "2.52"]
