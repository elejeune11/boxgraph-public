id: decay
name: Bell lifetime under force
stated: {page: 1, quote: "t = 1/k0 exp(-F xb / kT)", where: Eq. 1}
equation: "t = (1/k0) exp(-F x_b / kT)"
inputs:
  k0: {quantity: k0, unit: 1/s}
  F: {quantity: force, unit: pN}
  xb: {quantity: xb, unit: nm}
  kT: {quantity: kT, unit: pN*nm}
outputs:
  t: {quantity: lifetime, unit: s}
