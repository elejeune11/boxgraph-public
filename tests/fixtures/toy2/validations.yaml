# toy2's lifetime model is the Bell lifetime in its own variables: run on toy's forces, it predicts toy's curve.
- id: val_lifetime_vs_toy_curve
  model: lifetime
  inputs: {tau0: tau0, fb: fb}
  sweep: {f: toy/t_curve}
  output: tau
  against: toy/t_curve
  quantities: {toy/force: f, toy/lifetime: tau}
  basis: "test fixture: the lifetime model is toy's decay model in other variables, so it predicts toy's lifetime at each force"
