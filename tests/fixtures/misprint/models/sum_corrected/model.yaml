id: sum_corrected
name: the total length, Eq. 1 with its evident sign correction
stated: {page: 1, quote: "y = a - b", where: Eq. 1}
equation: "y = a + b"
variant_of: sum_printed
corrections:
  - equation: Eq. 1
    change: "the minus sign read as a plus: y = a + b"
    evidence: "the text calls y 'the total of a and b' (p. 1), and the printed y = 5.0 is a + b"
inputs:
  a: {quantity: length, unit: m}
  b: {quantity: length, unit: m}
outputs:
  y: {quantity: length, unit: m}
