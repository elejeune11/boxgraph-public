id: increments
name: increments of a trace between samples
role: processing
stated: {page: 1, quote: "Velocity increments between samples"}
equation: "dU_i = U_i - U_(i-1)"
inputs:
  U: {quantity: velocity, unit: m/s, curve: {quantity: time, unit: s}}
outputs:
  dU: {quantity: velocity, unit: m/s, curve: {quantity: time, unit: s}}
